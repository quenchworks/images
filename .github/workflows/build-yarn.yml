name: build-yarn

# From-source build (Apache CouchDB, Erlang + bundled QuickJS view server).
# build.conf is the SINGLE SOURCE OF TRUTH: prep emits the latest 3 stable
# (QuickJS-era) versions (full X.Y.Z, as-is). The build matrix fans them x both
# NATIVE arches (amd64 + arm64, no QEMU). Recipes render via build.conf render()
# (__VER__ + per-version __SHA256__ source-tarball pin). Per-version merge job
# assembles the multi-arch index, signs + attests it, notifies charts on newest.
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  APP: yarn
  GHCR_IMAGE: ghcr.io/quenchworks/images/yarn

jobs:
  prep:
    runs-on: ubuntu-24.04
    outputs:
      vers: ${{ steps.v.outputs.vers }}
      blocked: ${{ steps.v.outputs.blocked }}
      latest: ${{ steps.v.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        run: |
          set -euo pipefail
          source "apps/${APP}/build.conf"
          echo "blocked=$([ "${BLOCKED:-0}" = "1" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          n=${#VERSIONS[@]}; start=0  # build every entry: a 4th kept for a chart pin never rebuilt and drifted (2026-11-02)
          latest3=("${VERSIONS[@]:start}")
          echo "building: ${latest3[*]}"
          echo "vers=$(printf '%s\n' "${latest3[@]}" | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"
          echo "latest=${latest3[${#latest3[@]}-1]}" >> "$GITHUB_OUTPUT"

  build:
    needs: prep
    if: ${{ needs.prep.outputs.blocked != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        ver: ${{ fromJson(needs.prep.outputs.vers) }}
        arch:
          - { name: x86_64,  platform: amd64, runner: ubuntu-24.04 }
          - { name: aarch64, platform: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.arch.runner }}
    defaults:
      run:
        working-directory: apps/yarn
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install melange and apko (native ${{ matrix.arch.platform }})
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # bubblewrap: apt first. When the runner cannot resolve the Ubuntu mirrors (hours on 2026-11-11),
          # fetch the same noble-updates .deb from other mirrors and check the archive index sha256.
          if ! command -v bwrap >/dev/null && ! { sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y bubblewrap; }; then
            a="$(dpkg --print-architecture)"; deb="bubblewrap_0.9.0-1ubuntu0.3_${a}.deb"
            case "$a" in
              amd64) sum=2461f1beee9cb04c8942739fe1a2b37e7b7c2a3d518f0779dc75f9245baa3094
                     m="http://archive.ubuntu.com/ubuntu http://security.ubuntu.com/ubuntu https://mirrors.edge.kernel.org/ubuntu https://ftp.uni-stuttgart.de/ubuntu" ;;
              arm64) sum=dce3a2e5f0302eab717a64fe9c9411fe2d40469e2a7946e0f2ce1420a61025c3
                     m="http://ports.ubuntu.com/ubuntu-ports https://ftp.tu-chemnitz.de/pub/linux/ubuntu-ports https://mirrors.ocf.berkeley.edu/ubuntu-ports https://mirrors.dotsrc.org/ubuntu-ports" ;;
            esac
            ok=0
            for i in 1 2 3 4 5 6; do
              for u in $m; do
                if curl -fsSL -m 120 -o "/tmp/$deb" "$u/pool/main/b/bubblewrap/$deb" && echo "$sum  /tmp/$deb" | sha256sum -c -; then ok=1; break 2; fi
              done
              sleep 30
            done
            [ "$ok" = 1 ] || { echo "bubblewrap: no mirror reachable"; exit 1; }
            sudo dpkg -i "/tmp/$deb"
          fi
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          MELANGE_VER=v0.53.0
          curl -fsSL "https://github.com/chainguard-dev/melange/releases/download/${MELANGE_VER}/melange_${MELANGE_VER#v}_linux_${{ matrix.arch.platform }}.tar.gz" \
            | sudo tar xz --strip-components=1 -C /usr/local/bin
          APKO_VER=""
          for i in 1 2 3 4 5; do
            APKO_VER="$(gh api repos/chainguard-dev/apko/releases/latest --jq .tag_name 2>/dev/null || true)"
            [ -n "$APKO_VER" ] && break
            echo "apko lookup attempt $i failed; retrying..." >&2; sleep 5
          done
          [ -n "$APKO_VER" ] || { echo "could not resolve latest apko"; exit 1; }
          curl -fsSL "https://github.com/chainguard-dev/apko/releases/download/${APKO_VER}/apko_${APKO_VER#v}_linux_${{ matrix.arch.platform }}.tar.gz" \
            | sudo tar xz --strip-components=1 -C /usr/local/bin
          melange version | head -1
          apko version | head -1

      - name: Render recipes for ${{ matrix.ver }} (build.conf render)
        run: |
          set -euo pipefail
          source build.conf
          prog="$(render '${{ matrix.ver }}')"
          sed -e "$prog" melange.yaml > melange.rendered.yaml
          sed -e "$prog" apko.yaml    > apko.rendered.yaml

      - name: Build package from source (native ${{ matrix.arch.name }})
        run: |
          melange keygen melange.rsa
          melange build melange.rendered.yaml --arch ${{ matrix.arch.name }} --signing-key melange.rsa --out-dir ./packages

      - name: Assemble single-arch image for the scan gate
        run: apko build apko.rendered.yaml "${GHCR_IMAGE}:scan-${{ matrix.arch.platform }}" image.tar --arch ${{ matrix.arch.name }}

      - name: Scan, the hard 0-CVE gate (before publish)
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master 2026-09-26, v0.36.0+11, bundles trivy v0.71.2
        env:
          TRIVY_DETECTION_PRIORITY: comprehensive
        with:
          input: apps/yarn/image.tar
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH,MEDIUM,LOW
          scanners: vuln

      - name: Smoke test the single-arch image
        run: |
          docker load < image.tar
          docker tag "${GHCR_IMAGE}:scan-${{ matrix.arch.platform }}-${{ matrix.arch.platform }}" yarn-smoke:local
          m="${{ matrix.ver }}"; bash test.sh yarn-smoke:local "${m%%.*}"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the single-arch image (tag = full X.Y.Z)
        run: apko publish apko.rendered.yaml "${GHCR_IMAGE}:${{ matrix.ver }}-${{ matrix.arch.platform }}" --arch ${{ matrix.arch.name }}

  merge:
    needs: [prep, build]
    if: ${{ needs.prep.outputs.blocked != 'true' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ver: ${{ fromJson(needs.prep.outputs.vers) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble the multi-arch index (tag = full X.Y.Z)
        id: merge
        run: |
          docker buildx imagetools create -t "${GHCR_IMAGE}:${{ matrix.ver }}" \
            "${GHCR_IMAGE}:${{ matrix.ver }}-amd64" "${GHCR_IMAGE}:${{ matrix.ver }}-arm64"
          digest="$(docker buildx imagetools inspect "${GHCR_IMAGE}:${{ matrix.ver }}" --format '{{.Manifest.Digest}}')"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "published ${GHCR_IMAGE}:${{ matrix.ver }}@${digest}"

      - name: Sign the multi-arch index (cosign keyless)
        run: cosign sign --yes "${GHCR_IMAGE}@${{ steps.merge.outputs.digest }}"

      - name: Generate SBOM (SPDX) for the signed index
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.GHCR_IMAGE }}@${{ steps.merge.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Attest the SBOM (keyless, pushed to GHCR)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Attest build provenance (SLSA, pushed to GHCR)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
