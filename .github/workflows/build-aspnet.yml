name: build-aspnet

# LANGUAGE-RUNTIMES track. Hardened ASP.NET Core runtime images, assembled from
# Wolfi's versioned `aspnet-N-runtime` packages with apko -- NO melange.
#
# build.conf is the SINGLE SOURCE OF TRUTH. The prep job reads VERSIONS (the
# major lines: 8/9/10) and, for each, resolves the FULL X.Y.Z from the Wolfi
# package version (wolfi_pkg -> APKINDEX), e.g. aspnet-8-runtime = 8.0.122.
# apko installs by line (aspnet-<line>-runtime via render __VER__); the PUBLISHED
# TAG is the full X.Y.Z. Native per-arch builds (amd64 + arm64, no QEMU), hard
# 0-CVE gate, per-version merge + sign + attest. Manual trigger only.
#
# IMAGE-ONLY: no Helm chart, no charts-repo dispatch. No :latest tag.
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write        # push to GHCR
  id-token: write        # cosign keyless + attestation signing
  attestations: write    # SLSA build provenance + SBOM attestation

env:
  APP: aspnet
  GHCR_IMAGE: ghcr.io/quenchworks/images/aspnet

jobs:
  # Resolve {line, full X.Y.Z} for the latest 3 lines from build.conf + APKINDEX.
  prep:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.v.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        name: Resolve full versions from build.conf + Wolfi APKINDEX
        run: |
          set -euo pipefail
          source "apps/${APP}/build.conf"
          curl -fsSL https://packages.wolfi.dev/os/x86_64/APKINDEX.tar.gz | tar -xzO APKINDEX > /tmp/APKINDEX
          out="[]"
          for line in "${VERSIONS[@]: -3}"; do
            pkg="$(wolfi_pkg "$line")"
            full="$(awk -v p="$pkg" 'BEGIN{RS="\n\n"}{ if($0 ~ "\nP:"p"\n" || $0 ~ "^P:"p"\n"){ match($0,/\nV:[^\n]+/); v=substr($0,RSTART+3,RLENGTH-3); sub(/-r[0-9]+$/,"",v); print v; exit } }' /tmp/APKINDEX)"
            [ -n "$full" ] || { echo "could not resolve $pkg in Wolfi APKINDEX"; exit 1; }
            out="$(echo "$out" | jq -c --arg l "$line" --arg v "$full" '. + [{line:$l, ver:$v}]')"
          done
          echo "resolved: $out"
          echo "matrix=$out" >> "$GITHUB_OUTPUT"

  build:
    needs: prep
    strategy:
      fail-fast: false
      matrix:
        item: ${{ fromJson(needs.prep.outputs.matrix) }}
        arch:
          - { name: x86_64,  platform: amd64, runner: ubuntu-latest }
          - { name: aarch64, platform: arm64, runner: ubuntu-24.04-arm }   # native arm64, free for public repos
    runs-on: ${{ matrix.arch.runner }}
    defaults:
      run:
        working-directory: apps/aspnet
    steps:
      - uses: actions/checkout@v5

      - name: Install apko (native ${{ matrix.arch.platform }})
        working-directory: ${{ github.workspace }}
        run: |
          APKO_VER="$(curl -fsSL https://api.github.com/repos/chainguard-dev/apko/releases/latest | grep -m1 '"tag_name"' | cut -d'"' -f4)"
          curl -fsSL "https://github.com/chainguard-dev/apko/releases/download/${APKO_VER}/apko_${APKO_VER#v}_linux_${{ matrix.arch.platform }}.tar.gz" \
            | sudo tar xz --strip-components=1 -C /usr/local/bin
          apko version | head -1

      - name: Render apko config for .NET ${{ matrix.item.line }} (-> tag ${{ matrix.item.ver }})
        run: |
          set -euo pipefail
          source build.conf
          sed -e "$(render '${{ matrix.item.line }}')" apko.yaml > apko.rendered.yaml

      - name: Assemble single-arch image for the scan gate
        run: apko build apko.rendered.yaml "${GHCR_IMAGE}:scan-${{ matrix.arch.platform }}" image.tar --arch ${{ matrix.arch.name }}

      - name: Scan, the hard 0-CVE gate (before publish)
        uses: aquasecurity/trivy-action@master
        with:
          input: apps/aspnet/image.tar
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH,MEDIUM,LOW
          scanners: vuln

      - name: Smoke test the single-arch image
        run: |
          docker load < image.tar
          docker tag "${GHCR_IMAGE}:scan-${{ matrix.arch.platform }}-${{ matrix.arch.platform }}" aspnet-smoke:local
          bash test.sh aspnet-smoke:local "${{ matrix.item.line }}"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the single-arch image (tag = full X.Y.Z)
        run: apko publish apko.rendered.yaml "${GHCR_IMAGE}:${{ matrix.item.ver }}-${{ matrix.arch.platform }}" --arch ${{ matrix.arch.name }}

  merge:
    needs: [prep, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        item: ${{ fromJson(needs.prep.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble the multi-arch index (tag = full X.Y.Z)
        id: merge
        run: |
          docker buildx imagetools create -t "${GHCR_IMAGE}:${{ matrix.item.ver }}" \
            "${GHCR_IMAGE}:${{ matrix.item.ver }}-amd64" "${GHCR_IMAGE}:${{ matrix.item.ver }}-arm64"
          digest="$(docker buildx imagetools inspect "${GHCR_IMAGE}:${{ matrix.item.ver }}" --format '{{.Manifest.Digest}}')"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "published ${GHCR_IMAGE}:${{ matrix.item.ver }}@${digest}"

      - name: Sign the multi-arch index (cosign keyless)
        run: cosign sign --yes "${GHCR_IMAGE}@${{ steps.merge.outputs.digest }}"

      - name: Generate SBOM (SPDX) for the signed index
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.GHCR_IMAGE }}@${{ steps.merge.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Attest the SBOM (keyless, pushed to GHCR)
        uses: actions/attest-sbom@v2
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Attest build provenance (SLSA, pushed to GHCR)
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          push-to-registry: true

      # IMAGE-ONLY: no charts-repo dispatch. ASP.NET runtime is a base image.
