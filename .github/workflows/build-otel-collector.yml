name: build-otel-collector

# Heavy build (ocb assembles + compiles the full contrib distribution). One
# NATIVE job per architecture (no QEMU emulation), then a merge job assembles the
# multi-arch index, signs it, and notifies the charts repo.
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write        # push to GHCR
  id-token: write        # cosign keyless
  attestations: write    # SLSA build provenance + SBOM attestation

env:
  GHCR_IMAGE: ghcr.io/quenchworks/images/otel-collector

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            platform: amd64
            runner: ubuntu-latest
          - arch: aarch64
            platform: arm64
            runner: ubuntu-24.04-arm     # native arm64, free for public repos
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: apps/otel-collector
    steps:
      - uses: actions/checkout@v5

      - name: Install melange and apko (native ${{ matrix.platform }})
        working-directory: ${{ github.workspace }}
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces, which breaks melange's
          # bubblewrap runner (chainguard-dev/melange#1508). Re-enable it.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          MELANGE_VER=v0.53.0
          curl -fsSL "https://github.com/chainguard-dev/melange/releases/download/${MELANGE_VER}/melange_${MELANGE_VER#v}_linux_${{ matrix.platform }}.tar.gz" \
            | sudo tar xz --strip-components=1 -C /usr/local/bin
          APKO_VER="$(curl -fsSL https://api.github.com/repos/chainguard-dev/apko/releases/latest | grep -m1 '"tag_name"' | cut -d'"' -f4)"
          curl -fsSL "https://github.com/chainguard-dev/apko/releases/download/${APKO_VER}/apko_${APKO_VER#v}_linux_${{ matrix.platform }}.tar.gz" \
            | sudo tar xz --strip-components=1 -C /usr/local/bin
          melange version | head -1
          apko version | head -1

      - name: Build package from source (native ${{ matrix.arch }})
        run: |
          melange keygen melange.rsa
          melange build melange.yaml --arch ${{ matrix.arch }} --signing-key melange.rsa --out-dir ./packages

      - name: Assemble single-arch image for the scan gate
        run: apko build apko.yaml "${GHCR_IMAGE}:scan-${{ matrix.platform }}" image.tar --arch ${{ matrix.arch }}

      - name: Scan the image OS layer, the hard 0-CVE gate (before publish)
        uses: aquasecurity/trivy-action@master
        with:
          input: apps/otel-collector/image.tar
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH,MEDIUM,LOW
          scanners: vuln

      # The otelcol-contrib binary is ~380MB -- larger than Trivy's per-file scan
      # cap when reading it back out of the image tar's layers, so the image scan
      # above only covers the (tiny) Wolfi OS surface. Extract the static Go
      # binary and scan it directly as a gobinary so the 0-CVE gate genuinely
      # covers the collector's Go module graph (the bulk of the attack surface).
      - name: Scan the otelcol-contrib Go binary, the hard 0-CVE gate (before publish)
        run: |
          mkdir -p gobin-scan
          # apks are gzipped tar; the binary is at usr/bin/otelcol-contrib.
          tar -xzf packages/${{ matrix.arch }}/quench-otel-collector-*.apk \
            -C gobin-scan usr/bin/otelcol-contrib
          ls -la gobin-scan/usr/bin/otelcol-contrib
        shell: bash

      - name: Trivy gobinary scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: rootfs
          scan-ref: apps/otel-collector/gobin-scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH,MEDIUM,LOW
          scanners: vuln

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read the app version (tag images by version, not latest)
        run: echo "VERSION=$(awk '/^  version:/{print $2; exit}' melange.yaml)" >> "$GITHUB_ENV"

      - name: Publish the single-arch image
        run: apko publish apko.yaml "${GHCR_IMAGE}:${VERSION}-${{ matrix.platform }}" --arch ${{ matrix.arch }}

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: sigstore/cosign-installer@v3

      - name: Read the app version
        run: echo "VERSION=$(awk '/^  version:/{print $2; exit}' apps/otel-collector/melange.yaml)" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble the multi-arch index
        id: merge
        run: |
          docker buildx imagetools create -t "${GHCR_IMAGE}:${VERSION}" \
            "${GHCR_IMAGE}:${VERSION}-amd64" "${GHCR_IMAGE}:${VERSION}-arm64"
          digest="$(docker buildx imagetools inspect "${GHCR_IMAGE}:${VERSION}" --format '{{.Manifest.Digest}}')"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "published ${GHCR_IMAGE}@${digest}"

      - name: Sign the multi-arch index (cosign keyless)
        run: cosign sign --yes "${GHCR_IMAGE}@${{ steps.merge.outputs.digest }}"

      - name: Generate SBOM (SPDX) for the signed index
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.GHCR_IMAGE }}@${{ steps.merge.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Attest the SBOM (keyless, pushed to GHCR)
        uses: actions/attest-sbom@v2
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Attest build provenance (SLSA, pushed to GHCR)
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          push-to-registry: true

      - name: Notify the charts repo
        env:
          GH_TOKEN: ${{ secrets.CHARTS_DISPATCH_TOKEN }}
        run: |
          gh api repos/quenchworks/charts/dispatches \
            -f event_type=image-published \
            -F client_payload[app]=otel-collector \
            -F client_payload[repository]="${GHCR_IMAGE}" \
            -F client_payload[digest]="${{ steps.merge.outputs.digest }}"
