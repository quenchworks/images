name: build-maven

# Hardened Maven build-tool images, assembled straight from Wolfi's versioned
# maven package layered onto a pinned OpenJDK with apko -- NO melange/from-source
# step, since Wolfi already packages Maven. A MATRIX fans out over the supported
# Maven line (3.9 on JDK 21 LTS); each entry runs a NATIVE per-arch apko build
# (no QEMU), the hard 0-CVE Trivy gate, then a per-version merge job that
# assembles + signs + attests the multi-arch index.
#
# IMAGE-ONLY: maven is a build-tool image with no Helm chart, so there is NO
# charts-repo dispatch.
#
# TEMPLATE: the matrix carries the Maven-line TAG plus the Maven package suffix
# and JDK LTS used to render apps/maven/apko.yaml (`__MVNVER__`/`__JDKVER__`).
# No :latest tag is ever published.
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write        # push to GHCR
  id-token: write        # cosign keyless + attestation signing
  attestations: write    # SLSA build provenance + SBOM attestation

env:
  GHCR_IMAGE: ghcr.io/quenchworks/images/maven

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # tag = Maven line; mvnver = Wolfi package suffix; jdkver = JDK LTS it drives.
        include:
          - { tag: "3.9", mvnver: "3.9", jdkver: "21" }
        arch:
          - { name: x86_64,  platform: amd64, runner: ubuntu-latest }
          - { name: aarch64, platform: arm64, runner: ubuntu-24.04-arm }   # native arm64, free for public repos
    runs-on: ${{ matrix.arch.runner }}
    defaults:
      run:
        working-directory: apps/maven
    steps:
      - uses: actions/checkout@v5

      - name: Install apko (native ${{ matrix.arch.platform }})
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Authenticate the API call: the anonymous GitHub API rate limit is
          # easily exhausted when many matrix jobs resolve the latest apko tag at
          # the same time, which surfaced as transient 403/404s on this step.
          APKO_VER="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" https://api.github.com/repos/chainguard-dev/apko/releases/latest | grep -m1 '"tag_name"' | cut -d'"' -f4)"
          curl -fsSL "https://github.com/chainguard-dev/apko/releases/download/${APKO_VER}/apko_${APKO_VER#v}_linux_${{ matrix.arch.platform }}.tar.gz" \
            | sudo tar xz --strip-components=1 -C /usr/local/bin
          apko version | head -1

      - name: Render apko config for Maven ${{ matrix.tag }} (JDK ${{ matrix.jdkver }}) (build.conf render)
        run: |
          set -euo pipefail
          source build.conf
          # build.conf render() substitutes __VER__ (the Maven line) and __JDKVER__ (21),
          # matching apps/maven/apko.yaml. (The old inline sed used __MVNVER__, which does
          # not exist in apko.yaml, leaving maven-__VER__ unsubstituted.)
          sed -e "$(render '${{ matrix.tag }}')" apko.yaml > apko.rendered.yaml

      - name: Assemble single-arch image for the scan gate
        run: apko build apko.rendered.yaml "${GHCR_IMAGE}:scan-${{ matrix.arch.platform }}" image.tar --arch ${{ matrix.arch.name }}

      - name: Scan, the hard 0-CVE gate (before publish)
        uses: aquasecurity/trivy-action@master
        with:
          input: apps/maven/image.tar
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH,MEDIUM,LOW
          scanners: vuln

      - name: Smoke test the single-arch image
        run: |
          docker load < image.tar
          docker tag "${GHCR_IMAGE}:scan-${{ matrix.arch.platform }}-${{ matrix.arch.platform }}" maven-smoke:local
          bash test.sh maven-smoke:local "${{ matrix.jdkver }}"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the single-arch image
        run: apko publish apko.rendered.yaml "${GHCR_IMAGE}:${{ matrix.tag }}-${{ matrix.arch.platform }}" --arch ${{ matrix.arch.name }}

  merge:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag: ["3.9"]
    steps:
      - uses: actions/checkout@v5
      - uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble the multi-arch index
        id: merge
        run: |
          docker buildx imagetools create -t "${GHCR_IMAGE}:${{ matrix.tag }}" \
            "${GHCR_IMAGE}:${{ matrix.tag }}-amd64" "${GHCR_IMAGE}:${{ matrix.tag }}-arm64"
          digest="$(docker buildx imagetools inspect "${GHCR_IMAGE}:${{ matrix.tag }}" --format '{{.Manifest.Digest}}')"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "published ${GHCR_IMAGE}:${{ matrix.tag }}@${digest}"

      - name: Sign the multi-arch index (cosign keyless)
        run: cosign sign --yes "${GHCR_IMAGE}@${{ steps.merge.outputs.digest }}"

      - name: Generate SBOM (SPDX) for the signed index
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.GHCR_IMAGE }}@${{ steps.merge.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Attest the SBOM (keyless, pushed to GHCR)
        uses: actions/attest-sbom@v2
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Attest build provenance (SLSA, pushed to GHCR)
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          push-to-registry: true

      # IMAGE-ONLY: no charts-repo dispatch. maven is a build-tool image.
