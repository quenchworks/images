name: build-coolify-helper

# Heavy build: compiles FOUR upstream build tools FROM SOURCE in melange -- pack +
# railpack (Go 1.26) and nixpacks + mise (Rust) -- alongside CVE-tracked Wolfi packages
# (docker-cli, compose, buildx, mc, git, git-lfs, openssh-client, tini). One NATIVE job
# per architecture (no QEMU emulation, so the Go/Rust compiles run at native speed), then
# a merge job assembles the multi-arch index, signs it (cosign keyless), attaches an SPDX
# SBOM + SLSA build-provenance attestation, and notifies the charts repo.
#
# Trivy gate scans the assembled rootfs tar (input: image.tar) with --ignore-unfixed and
# fails on any fixable CRITICAL..LOW. trivy's gobinary analyzer reads the embedded Go
# module metadata of the from-source pack/railpack binaries inside that tar, so module-
# level CVEs that an apk-only scan would miss are covered by the same gate.
#
# NOTE: coolify-helper is PRIVILEGED BY DESIGN -- it runs as root with the host docker
# socket mounted (it is Coolify's build engine). apko.yaml keeps it root deliberately;
# the hardening here is the 0-CVE software surface, not a nonroot/cap-drop posture.
on:
  push:
    paths:
      - "apps/coolify-helper/**"
      - ".github/workflows/build-coolify-helper.yml"
  schedule:
    - cron: "0 3 * * 1"   # weekly (standard tier component)
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push to GHCR
  id-token: write        # cosign keyless + attestation signing
  attestations: write    # SLSA build provenance + SBOM attestation

env:
  GHCR_IMAGE: ghcr.io/quenchworks/images/coolify-helper

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            platform: amd64
            runner: ubuntu-latest
          - arch: aarch64
            platform: arm64
            runner: ubuntu-24.04-arm     # native arm64, free for public repos
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: apps/coolify-helper
    steps:
      - uses: actions/checkout@v5

      - name: Install melange and apko (native ${{ matrix.platform }})
        working-directory: ${{ github.workspace }}
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces, which breaks melange's
          # bubblewrap runner (chainguard-dev/melange#1508). Re-enable it.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          MELANGE_VER=v0.53.0
          curl -fsSL "https://github.com/chainguard-dev/melange/releases/download/${MELANGE_VER}/melange_${MELANGE_VER#v}_linux_${{ matrix.platform }}.tar.gz" \
            | sudo tar xz --strip-components=1 -C /usr/local/bin
          APKO_VER="$(curl -fsSL https://api.github.com/repos/chainguard-dev/apko/releases/latest | grep -m1 '"tag_name"' | cut -d'"' -f4)"
          curl -fsSL "https://github.com/chainguard-dev/apko/releases/download/${APKO_VER}/apko_${APKO_VER#v}_linux_${{ matrix.platform }}.tar.gz" \
            | sudo tar xz --strip-components=1 -C /usr/local/bin
          melange version | head -1
          apko version | head -1

      - name: Build package from source (native ${{ matrix.arch }})
        run: |
          melange keygen melange.rsa
          melange build melange.yaml --arch ${{ matrix.arch }} --signing-key melange.rsa --out-dir ./packages

      - name: Assemble single-arch image for the scan gate
        run: apko build apko.yaml "${GHCR_IMAGE}:scan-${{ matrix.platform }}" image.tar --arch ${{ matrix.arch }}

      - name: Scan, the hard 0-CVE gate (before publish)
        uses: aquasecurity/trivy-action@master
        with:
          input: apps/coolify-helper/image.tar
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH,MEDIUM,LOW
          scanners: vuln

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read the app version (tag images by version, not latest)
        run: echo "VERSION=$(awk '/^  version:/{print $2; exit}' melange.yaml)" >> "$GITHUB_ENV"

      - name: Publish the single-arch image
        run: apko publish apko.yaml "${GHCR_IMAGE}:${VERSION}-${{ matrix.platform }}" --arch ${{ matrix.arch }}

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: sigstore/cosign-installer@v3

      - name: Read the app version
        run: echo "VERSION=$(awk '/^  version:/{print $2; exit}' apps/coolify-helper/melange.yaml)" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble the multi-arch index
        id: merge
        run: |
          docker buildx imagetools create -t "${GHCR_IMAGE}:${VERSION}" \
            "${GHCR_IMAGE}:${VERSION}-amd64" "${GHCR_IMAGE}:${VERSION}-arm64"
          digest="$(docker buildx imagetools inspect "${GHCR_IMAGE}:${VERSION}" --format '{{.Manifest.Digest}}')"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "published ${GHCR_IMAGE}@${digest}"

      - name: Sign the multi-arch index (cosign keyless)
        run: cosign sign --yes "${GHCR_IMAGE}@${{ steps.merge.outputs.digest }}"

      - name: Generate SBOM (SPDX) for the signed index
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.GHCR_IMAGE }}@${{ steps.merge.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Attest the SBOM (keyless, pushed to GHCR)
        uses: actions/attest-sbom@v2
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Attest build provenance (SLSA, pushed to GHCR)
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          push-to-registry: true

      - name: Notify the charts repo
        env:
          GH_TOKEN: ${{ secrets.CHARTS_DISPATCH_TOKEN }}
        run: |
          gh api repos/quenchworks/charts/dispatches \
            -f event_type=image-published \
            -F client_payload[app]=coolify-helper \
            -F client_payload[repository]="${GHCR_IMAGE}" \
            -F client_payload[digest]="${{ steps.merge.outputs.digest }}"
