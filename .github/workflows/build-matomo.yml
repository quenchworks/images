name: build-matomo

# Matomo (web analytics), packaged from its official build tarball via melange +
# apko. The image fronts php-fpm with QuenchWorks' hardened nginx (quench-nginx), so
# each build FIRST builds the nginx package from source into ./packages, then assembles
# the Matomo package. build.conf is the SINGLE SOURCE OF TRUTH: VERSIONS holds the full X.Y.Z
# (used as-is as the image tag) with a per-version sha256. The build matrix fans it
# x both NATIVE arches (amd64 + arm64, no QEMU). Recipes render via build.conf
# render() (__VER__ + __SHA256__). The per-version merge job assembles the multi-arch
# index, signs + attests it (SBOM + SLSA), and notifies the charts repo for the
# newest version only.
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  APP: matomo
  GHCR_IMAGE: ghcr.io/quenchworks/images/matomo

jobs:
  prep:
    runs-on: ubuntu-24.04
    outputs:
      vers: ${{ steps.v.outputs.vers }}
      blocked: ${{ steps.v.outputs.blocked }}
      latest: ${{ steps.v.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        run: |
          set -euo pipefail
          source "apps/${APP}/build.conf"
          echo "blocked=$([ "${BLOCKED:-0}" = "1" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          n=${#VERSIONS[@]}; start=$(( n > 3 ? n - 3 : 0 ))
          latest3=("${VERSIONS[@]:start}")
          echo "building: ${latest3[*]}"
          echo "vers=$(printf '%s\n' "${latest3[@]}" | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"
          echo "latest=${latest3[${#latest3[@]}-1]}" >> "$GITHUB_OUTPUT"

  build:
    needs: prep
    if: ${{ needs.prep.outputs.blocked != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        ver: ${{ fromJson(needs.prep.outputs.vers) }}
        arch:
          - { name: x86_64,  platform: amd64, runner: ubuntu-24.04 }
          - { name: aarch64, platform: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.arch.runner }}
    defaults:
      run:
        working-directory: apps/matomo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install melange and apko (native ${{ matrix.arch.platform }})
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          MELANGE_VER=v0.53.0
          curl -fsSL "https://github.com/chainguard-dev/melange/releases/download/${MELANGE_VER}/melange_${MELANGE_VER#v}_linux_${{ matrix.arch.platform }}.tar.gz" \
            | sudo tar xz --strip-components=1 -C /usr/local/bin
          APKO_VER=""
          for i in 1 2 3 4 5; do
            APKO_VER="$(gh api repos/chainguard-dev/apko/releases/latest --jq .tag_name 2>/dev/null || true)"
            [ -n "$APKO_VER" ] && break
            echo "apko lookup attempt $i failed; retrying..." >&2; sleep 5
          done
          [ -n "$APKO_VER" ] || { echo "could not resolve latest apko"; exit 1; }
          curl -fsSL "https://github.com/chainguard-dev/apko/releases/download/${APKO_VER}/apko_${APKO_VER#v}_linux_${{ matrix.arch.platform }}.tar.gz" \
            | sudo tar xz --strip-components=1 -C /usr/local/bin
          melange version | head -1
          apko version | head -1

      - name: Render recipes for ${{ matrix.ver }} (build.conf render)
        run: |
          set -euo pipefail
          source build.conf
          prog="$(render '${{ matrix.ver }}')"
          sed -e "$prog" melange.yaml > melange.rendered.yaml
          sed -e "$prog" apko.yaml    > apko.rendered.yaml

      - name: Build packages from source (quench-nginx dep + matomo, native ${{ matrix.arch.name }})
        run: |
          set -euo pipefail
          melange keygen melange.rsa
          # Inter-app dep: the Matomo image bundles quench-nginx@local (Wolfi's
          # nginx-stable apk is stuck on 1.30.2 and Trivy wants 1.30.4-r2), so build the
          # nginx package into ./packages FIRST (rendered at nginx's current newest
          # version), then assemble the Matomo package into the same repo.
          ( cd ../nginx && source build.conf
            nv="${VERSIONS[${#VERSIONS[@]}-1]}"
            sed -e "$(render "$nv")" melange.yaml > nginx.rendered.yaml )
          melange build ../nginx/nginx.rendered.yaml --arch ${{ matrix.arch.name }} --signing-key melange.rsa --out-dir ./packages
          melange build melange.rendered.yaml        --arch ${{ matrix.arch.name }} --signing-key melange.rsa --out-dir ./packages

      - name: Assemble single-arch image for the scan gate
        run: apko build apko.rendered.yaml "${GHCR_IMAGE}:scan-${{ matrix.arch.platform }}" image.tar --arch ${{ matrix.arch.name }}

      - name: Scan the image OS layer, the hard 0-CVE gate (before publish)
        # OS-package (Wolfi) CVE gate on the assembled image. All severities, fail on
        # any FIXABLE finding; unfixed are reported, not gated.
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master 2026-09-26, v0.36.0+11, bundles trivy v0.71.2
        with:
          input: apps/matomo/image.tar
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH,MEDIUM,LOW
          scanners: vuln

      - name: Comprehensive 0-CVE gate on Matomo's vendored PHP dependencies
        # Matomo's bundled Composer tree is its biggest CVE surface, but `trivy image`
        # does NOT parse a lockfile, and the official tarball ships the dependency
        # inventory only as vendor/composer/installed.php. The melange build re-materialises
        # that exact inventory into /var/www/html/composer.lock; here we extract it from the
        # built apk and scan it with `trivy fs --detection-priority comprehensive`, which
        # DOES enumerate every vendored package and CVE-gate it. This is the same
        # fail-on-fixable gate applied to the vendored deps -- do not remove/weaken it.
        working-directory: apps/matomo
        run: |
          set -euo pipefail
          mkdir -p /tmp/matomo-depscan
          apk="packages/${{ matrix.arch.name }}/quench-matomo-${{ matrix.ver }}-r0.apk"
          tar -xzf "$apk" -C /tmp/matomo-depscan var/www/html/composer.lock
          trivy fs /tmp/matomo-depscan \
            --scanners vuln \
            --detection-priority comprehensive \
            --exit-code 1 \
            --ignore-unfixed \
            --severity CRITICAL,HIGH,MEDIUM,LOW

      # A green 0-CVE scan says nothing about whether the image RUNS. Publishing
      # straight from the scan is how a build that could not start at all reached
      # GHCR (elasticsearch 9.5.1: modules/apm removed, ES refused to boot, scan
      # green). Boot the image and run its own smoke test BEFORE publishing.
      #
      # The second argument is the expected version; every test.sh takes it as an
      # optional $2 and the ones that ignore it are unaffected.
      - name: Boot test the single-arch image (must run before publish)
        # Runs even when the scan gate failed. This app is walled behind zlib
        # CVE-2026-85091, which has no fix anywhere, so the gate stays red and
        # with the default success() condition the boot test never runs at all.
        # Every recipe change would then land with no evidence the image still
        # boots. This cannot leak a publish: the GHCR login and publish steps
        # keep their default success() condition, so a red gate still skips both.
        if: ${{ !cancelled() }}
        run: |
          # Take the tag from `docker load` rather than reconstructing it: apko
          # appends the arch to the tag it was given, so a tar built as
          # `:scan-amd64` loads as `:scan-amd64-amd64`. Reconstructing that
          # suffix by hand is what broke the first cut of this step.
          # Keep the load output: the previous version piped it straight into sed, so a
          # failure printed "no image" and threw away the only evidence of WHY.
          out="$(docker load < image.tar 2>&1)" || true
          printf '%s\n' "$out"
          # Two forms exist. A tagged tar prints "Loaded image: repo:tag"; an untagged one
          # prints "Loaded image ID: sha256:...", and that id is a perfectly good ref.
          img="$(printf '%s\n' "$out" | sed -n -e 's/^Loaded image: //p' -e 's/^Loaded image ID: //p' | head -1)"
          if [ -z "$img" ]; then
            echo "FATAL: docker load produced no usable image ref (output above)"
            echo "image.tar: $(ls -l image.tar 2>&1)"
            exit 1
          fi
          docker tag "$img" matomo-boot:local
          bash test.sh matomo-boot:local "${{ matrix.ver }}"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the single-arch image (tag = full X.Y.Z)
        run: apko publish apko.rendered.yaml "${GHCR_IMAGE}:${{ matrix.ver }}-${{ matrix.arch.platform }}" --arch ${{ matrix.arch.name }}

  merge:
    needs: [prep, build]
    if: ${{ needs.prep.outputs.blocked != 'true' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ver: ${{ fromJson(needs.prep.outputs.vers) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble the multi-arch index (tag = full X.Y.Z)
        id: merge
        run: |
          docker buildx imagetools create -t "${GHCR_IMAGE}:${{ matrix.ver }}" \
            "${GHCR_IMAGE}:${{ matrix.ver }}-amd64" "${GHCR_IMAGE}:${{ matrix.ver }}-arm64"
          digest="$(docker buildx imagetools inspect "${GHCR_IMAGE}:${{ matrix.ver }}" --format '{{.Manifest.Digest}}')"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "published ${GHCR_IMAGE}:${{ matrix.ver }}@${digest}"

      - name: Sign the multi-arch index (cosign keyless)
        run: cosign sign --yes "${GHCR_IMAGE}@${{ steps.merge.outputs.digest }}"

      - name: Generate SBOM (SPDX) for the signed index
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.GHCR_IMAGE }}@${{ steps.merge.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Trim SBOM to packages-only
        # Matomo bundles a large Composer vendor/ tree + thousands of built asset files,
        # so the full SPDX SBOM (with per-file checksums) can exceed GitHub's 16 MB
        # attestation-predicate limit. Drop the file-level sections; the package
        # inventory (the supply-chain signal) is retained and the doc stays valid SPDX.
        run: |
          before=$(wc -c < sbom.spdx.json)
          jq 'del(.files) | del(.relationships)' sbom.spdx.json > sbom.trimmed.json
          mv sbom.trimmed.json sbom.spdx.json
          echo "SBOM trimmed: ${before} -> $(wc -c < sbom.spdx.json) bytes"

      - name: Attest the SBOM (keyless, pushed to GHCR)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Attest build provenance (SLSA, pushed to GHCR)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Notify the charts repo (newest version only)
        if: ${{ matrix.ver == needs.prep.outputs.latest }}
        env:
          GH_TOKEN: ${{ secrets.CHARTS_DISPATCH_TOKEN }}
        run: |
          gh api repos/quenchworks/charts/dispatches \
            -f event_type=image-published \
            -F client_payload[app]=matomo \
            -F client_payload[repository]="${GHCR_IMAGE}" \
            -F client_payload[digest]="${{ steps.merge.outputs.digest }}"
