name: build-deno

# LANGUAGE-RUNTIMES track. Hardened Deno image, assembled straight from
# Wolfi's prebuilt `deno` package with apko -- NO melange/from-source step,
# since Wolfi already packages it (0-CVE). Each native per-arch apko build runs
# (no QEMU), the hard 0-CVE Trivy gate, then a merge job assembles + signs +
# attests the multi-arch index.
#
# VERSIONING: Wolfi ships a SINGLE floating `deno` package (no per-minor split), so there is no version matrix -- one tag tracks the latest 2.x.
#
# IMAGE-ONLY: Deno is a base image with no Helm chart, so there is NO
# charts-repo dispatch. No :latest tag is ever published -- the single published
# tag is `2`, kept current by the DAILY rebuild.
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write        # push to GHCR
  id-token: write        # cosign keyless + attestation signing
  attestations: write    # SLSA build provenance + SBOM attestation

env:
  GHCR_IMAGE: ghcr.io/quenchworks/images/deno
  IMAGE_TAG: "2"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch:
          - { name: x86_64,  platform: amd64, runner: ubuntu-latest }
          - { name: aarch64, platform: arm64, runner: ubuntu-24.04-arm }   # native arm64, free for public repos
    runs-on: ${{ matrix.arch.runner }}
    defaults:
      run:
        working-directory: apps/deno
    steps:
      - uses: actions/checkout@v5

      - name: Install apko (native ${{ matrix.arch.platform }})
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # authenticate the API call to dodge the 60/hr anon rate-limit (403)
        run: |
          set -euo pipefail
          APKO_VER=""
          for i in 1 2 3 4 5; do
            APKO_VER="$(gh api repos/chainguard-dev/apko/releases/latest --jq .tag_name 2>/dev/null || true)"
            [ -n "$APKO_VER" ] && break
            echo "apko version lookup attempt $i failed; retrying..." >&2; sleep 5
          done
          [ -n "$APKO_VER" ] || { echo "could not resolve latest apko version"; exit 1; }
          echo "apko ${APKO_VER}"
          curl -fsSL "https://github.com/chainguard-dev/apko/releases/download/${APKO_VER}/apko_${APKO_VER#v}_linux_${{ matrix.arch.platform }}.tar.gz" \
            | sudo tar xz --strip-components=1 -C /usr/local/bin
          apko version | head -1

      - name: Assemble single-arch image for the scan gate
        run: apko build apko.yaml "${GHCR_IMAGE}:scan-${{ matrix.arch.platform }}" image.tar --arch ${{ matrix.arch.name }}

      - name: Scan, the hard 0-CVE gate (before publish)
        uses: aquasecurity/trivy-action@master
        with:
          input: apps/deno/image.tar
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH,MEDIUM,LOW
          scanners: vuln

      - name: Smoke test the single-arch image
        run: |
          docker load < image.tar
          docker tag "${GHCR_IMAGE}:scan-${{ matrix.arch.platform }}-${{ matrix.arch.platform }}" deno-smoke:local
          bash test.sh deno-smoke:local "2"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the single-arch image
        run: apko publish apko.yaml "${GHCR_IMAGE}:${IMAGE_TAG}-${{ matrix.arch.platform }}" --arch ${{ matrix.arch.name }}

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble the multi-arch index
        id: merge
        run: |
          docker buildx imagetools create -t "${GHCR_IMAGE}:${IMAGE_TAG}" \
            "${GHCR_IMAGE}:${IMAGE_TAG}-amd64" "${GHCR_IMAGE}:${IMAGE_TAG}-arm64"
          digest="$(docker buildx imagetools inspect "${GHCR_IMAGE}:${IMAGE_TAG}" --format '{{.Manifest.Digest}}')"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "published ${GHCR_IMAGE}:${IMAGE_TAG}@${digest}"

      - name: Sign the multi-arch index (cosign keyless)
        run: cosign sign --yes "${GHCR_IMAGE}@${{ steps.merge.outputs.digest }}"

      - name: Generate SBOM (SPDX) for the signed index
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.GHCR_IMAGE }}@${{ steps.merge.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Attest the SBOM (keyless, pushed to GHCR)
        uses: actions/attest-sbom@v2
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Attest build provenance (SLSA, pushed to GHCR)
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          push-to-registry: true

      # IMAGE-ONLY: no charts-repo dispatch. Deno is a base image.
