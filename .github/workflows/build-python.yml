name: build-python

# PILOT for the LANGUAGE-RUNTIMES track. Hardened Python base/runtime images,
# assembled straight from Wolfi's versioned `python-3.X` packages with apko --
# NO melange/from-source step, since Wolfi already packages CPython. A MATRIX
# fans out over the latest 3 stable minors; each one runs a NATIVE per-arch apko
# build (no QEMU), the hard 0-CVE Trivy gate, then a per-version merge job that
# assembles + signs + attests the multi-arch index.
#
# IMAGE-ONLY: Python is a base/runtime image with no Helm chart, so there is NO
# charts-repo dispatch.
#
# TEMPLATE: to add another minor (or another runtime), copy a matrix entry and
# change `pyver`/`pkg`; apps/python/apko.yaml carries the `__PYVER__` placeholder
# that CI substitutes per entry. No :latest tag is ever published.
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write        # push to GHCR
  id-token: write        # cosign keyless + attestation signing
  attestations: write    # SLSA build provenance + SBOM attestation

env:
  GHCR_IMAGE: ghcr.io/quenchworks/images/python

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # latest 3 stable Wolfi-packaged minors x both native arches.
        # GitHub's `include` does NOT cross-product with two free axes here, so we
        # enumerate the full product explicitly (3 minors x 2 arches = 6 jobs).
        pyver: ["3.12", "3.13", "3.14"]
        arch:
          - { name: x86_64,  platform: amd64, runner: ubuntu-latest }
          - { name: aarch64, platform: arm64, runner: ubuntu-24.04-arm }   # native arm64, free for public repos
    runs-on: ${{ matrix.arch.runner }}
    defaults:
      run:
        working-directory: apps/python
    steps:
      - uses: actions/checkout@v5

      - name: Install apko (native ${{ matrix.arch.platform }})
        working-directory: ${{ github.workspace }}
        run: |
          APKO_VER="$(curl -fsSL https://api.github.com/repos/chainguard-dev/apko/releases/latest | grep -m1 '"tag_name"' | cut -d'"' -f4)"
          curl -fsSL "https://github.com/chainguard-dev/apko/releases/download/${APKO_VER}/apko_${APKO_VER#v}_linux_${{ matrix.arch.platform }}.tar.gz" \
            | sudo tar xz --strip-components=1 -C /usr/local/bin
          apko version | head -1

      - name: Render apko config for Python ${{ matrix.pyver }}
        run: sed "s/__PYVER__/${{ matrix.pyver }}/g" apko.yaml > apko.rendered.yaml

      - name: Assemble single-arch image for the scan gate
        run: apko build apko.rendered.yaml "${GHCR_IMAGE}:scan-${{ matrix.arch.platform }}" image.tar --arch ${{ matrix.arch.name }}

      - name: Scan, the hard 0-CVE gate (before publish)
        uses: aquasecurity/trivy-action@master
        with:
          input: apps/python/image.tar
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH,MEDIUM,LOW
          scanners: vuln

      - name: Smoke test the single-arch image
        run: |
          docker load < image.tar
          # apko load tags the image as <ref>-<arch>; the scan ref ended in the platform.
          docker tag "${GHCR_IMAGE}:scan-${{ matrix.arch.platform }}-${{ matrix.arch.platform }}" python-smoke:local
          bash test.sh python-smoke:local "${{ matrix.pyver }}"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the single-arch image
        run: apko publish apko.rendered.yaml "${GHCR_IMAGE}:${{ matrix.pyver }}-${{ matrix.arch.platform }}" --arch ${{ matrix.arch.name }}

  merge:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pyver: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble the multi-arch index
        id: merge
        run: |
          docker buildx imagetools create -t "${GHCR_IMAGE}:${{ matrix.pyver }}" \
            "${GHCR_IMAGE}:${{ matrix.pyver }}-amd64" "${GHCR_IMAGE}:${{ matrix.pyver }}-arm64"
          digest="$(docker buildx imagetools inspect "${GHCR_IMAGE}:${{ matrix.pyver }}" --format '{{.Manifest.Digest}}')"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "published ${GHCR_IMAGE}:${{ matrix.pyver }}@${digest}"

      - name: Sign the multi-arch index (cosign keyless)
        run: cosign sign --yes "${GHCR_IMAGE}@${{ steps.merge.outputs.digest }}"

      - name: Generate SBOM (SPDX) for the signed index
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.GHCR_IMAGE }}@${{ steps.merge.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Attest the SBOM (keyless, pushed to GHCR)
        uses: actions/attest-sbom@v2
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Attest build provenance (SLSA, pushed to GHCR)
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          push-to-registry: true

      # IMAGE-ONLY: no charts-repo dispatch. Python is a base/runtime image.
