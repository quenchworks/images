name: codeql

# Code scanning via CodeQL (advanced setup): the workflows and the Python
# tooling in scripts/. Removed on 2026-06-17 while the repo was private (CodeQL
# there needs paid Advanced Security); the repo is public now, where it is free.
# Runs on workflow and script changes plus weekly, not on every recipe commit.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/**', 'scripts/**']
  pull_request:
    branches: [main]
    paths: ['.github/workflows/**', 'scripts/**']
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: "/language:${{ matrix.language }}"
