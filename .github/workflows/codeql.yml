name: codeql

# Code scanning via CodeQL (advanced setup): the workflows and the Go tooling
# in tools/qw (the Python scripts it replaced were deleted 2026-11-13). Removed on 2026-06-17 while the repo was private (CodeQL
# there needs paid Advanced Security); the repo is public now, where it is free.
# Runs on workflow and script changes plus weekly, not on every recipe commit.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/**', 'scripts/**', 'tools/**']
  pull_request:
    branches: [main]
    paths: ['.github/workflows/**', 'scripts/**', 'tools/**']
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: go
            build-mode: manual
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runner's preinstalled Go would switch to the go.mod toolchain by
      # downloading it, and CodeQL's tracer does not see that build.
      - if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/qw/go.mod
          cache: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
      - if: matrix.language == 'go'
        working-directory: tools/qw
        run: go build ./...
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
