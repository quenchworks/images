# Keeps the SHA-pinned actions current. Dependabot reads the "# vX.Y.Z" comment
# beside each pin and rewrites both. One grouped PR a month.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
