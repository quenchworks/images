  floci-full:
    image: ghcr.io/quenchworks/images/floci-full
    category: Apps & productivity
    summary: 'Opt-in, NON-hardened companion to the floci image: it runs as root and expects the host
      Docker socket mounted, which lets it emulate all 65 of Floci''s AWS services including the 10 Docker-backed
      ones (Lambda, RDS, ElastiCache, MSK, ECS, EKS, OpenSearch, ECR, DocumentDB, Neptune). Same from-source
      Quarkus build and 0-CVE Trivy gate as floci, but running root with a mounted /var/run/docker.sock
      is a node-root / container-escape surface, so use it only in trusted single-tenant dev or CI. The
