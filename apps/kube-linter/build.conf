# kube-linter (stackrox/kube-linter, Apache-2.0): static analysis of Kubernetes YAML and Helm charts against security and production-readiness checks. Image only, no chart.
#
# From the release tag with the house Go floors and the otel 1.47 family loop (the cosign recipe), version
# stamped like upstream's goreleaser. LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(0.8.3)
declare -A SHA256=(
  [0.8.3]=e548670732ec47e34308abc96755c2cffeeaa1d942222167669709d612caa7d1
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
