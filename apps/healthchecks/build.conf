# Healthchecks (healthchecks/healthchecks, BSD-3-Clause): cron job and heartbeat monitoring. Jobs
# ping a URL; a missed ping raises alerts by email, chat and webhooks. Django on SQLite or
# PostgreSQL. From the release tag via melange: upstream's pinned requirements installed into a
# venv on Wolfi python-3.13, with pycurl and psycopg compiled against Wolfi's libcurl and libpq
# and cryptography taken from Wolfi, so no wheel brings its own OpenSSL. LATEST-ONLY: one line.
FROM_SOURCE=1
VERSIONS=(5.0.3)
declare -A SHA256=(
  [5.0.3]=ee1b93bf0719f948a8693ac06c7d571394fb65723d0faf21cd0374721afa964e
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
