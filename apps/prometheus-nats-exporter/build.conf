# prometheus-nats-exporter: exports NATS server metrics (varz, connz, routez, subz,
# JetStream) for Prometheus, built from source, static Go, no CGO. Image only, no chart:
# the argo-events chart runs it next to the QuenchWorks nats image in each JetStream
# EventBus pod, and it works beside any NATS server's monitoring port.
#
# 0-CVE: melange.yaml floats x/crypto (measured 2026-09-25 on 0.20.2: 1 finding, 0 after).
#
# NEWEST-ONLY: the exporter ships one line.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(0.20.3)
declare -A SHA256=(
  [0.20.3]=36614ecf8d97f3531f831cee464b7353c528586341e5d4022ea2d2e6fe47ab63
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
