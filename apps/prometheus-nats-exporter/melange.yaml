# Builds prometheus-nats-exporter from the nats-io/prometheus-nats-exporter tag tarball onto Wolfi.
package:
  name: quench-prometheus-nats-exporter
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Prometheus NATS exporter, built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - go

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/nats-io/prometheus-nats-exporter/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      set -eu
      export CGO_ENABLED=0 GOFLAGS=-mod=mod GO111MODULE=on GOTOOLCHAIN=local
      # 0-CVE float: raise only what is below the floor, then assert the binary carries it
      FLOOR="golang.org/x/crypto@v0.56.0"
      for m in $FLOOR; do
        mod="${m%@*}"; want="${m#*@}"
        have="$(go list -m -e "$mod" | awk '{print $NF}')"
        if [ "$(printf '%s\n%s\n' "$have" "$want" | sort -V | head -1)" != "$want" ]; then go get "$m"; fi
      done
      go mod tidy
      go build -trimpath -ldflags "-s -w -X main.version=${{package.version}}" -o "${{targets.destdir}}/usr/bin/prometheus-nats-exporter" .
      for m in $FLOOR; do
        mod="${m%@*}"; want="${m#*@}"
        got="$(go version -m "${{targets.destdir}}/usr/bin/prometheus-nats-exporter" | awk -v m="$mod" '$2 == m {print $3}')"
        [ -z "$got" ] || [ "$(printf '%s\n%s\n' "$got" "$want" | sort -V | head -1)" = "$want" ] || { echo "❌ $mod $got below $want"; exit 1; }
      done

test:
  pipeline:
    - runs: |
        test -x /usr/bin/prometheus-nats-exporter
