# bloodhound: BloodHound Community Edition (SpecterOps), attack-path analysis for Active Directory and Entra ID.
# From the release tag: the React UI (yarn 4, vendored in .yarn/releases) is built and embedded into the Go API
# (bhapi), as upstream's Dockerfile does. The SharpHound/AzureHound collector zips (prebuilt Windows and macOS
# binaries upstream copies in for download) are not bundled. Latest only. Sized 2026-11-22 at 9.10.1: go.mod needs
# only the house floors (otel 1.47 train, x/crypto); the yarn.lock findings are build-time or bundled into static JS.
FROM_SOURCE=1
VERSIONS=(9.10.1)
declare -A SHA256=(
  [9.10.1]=c5e01a08f8b04f65208820840a3ed25034c05d96e11b250e4471cd813bac6bf8
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
