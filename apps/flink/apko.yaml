contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - openjdk-21-jre
    - bash
    - busybox
    - quench-flink@local

accounts:
  groups:
    - groupname: flink
      gid: 1001
  users:
    - username: flink
      uid: 1001
      gid: 1001
      homedir: /opt/flink
  run-as: 1001

entrypoint:
  command: /usr/bin/docker-entrypoint.sh

cmd: help

environment:
  JAVA_HOME: /usr/lib/jvm/java-21-openjdk
  FLINK_HOME: /opt/flink
  PATH: /usr/lib/jvm/java-21-openjdk/bin:/opt/flink/bin:/usr/bin:/bin

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-flink"
  org.opencontainers.image.licenses: "Apache-2.0"
