# flink: Apache Flink, the stateful stream (and batch) processing engine. Ships
# upstream's official Scala 2.12 binary distribution (prebuilt JVM jars) on a Wolfi
# openjdk-21-jre, like kafka. bin/, conf/, lib/ and plugins/ are installed; opt/
# (optional connectors, 330 MB) and examples/ are left out.
#
# 0-CVE: a pristine 2.3.0 scan of lib/, bin/ and plugins/ flags only the log4j2 family
# at 2.25.3 (CVE-2026-34477/34478/34479/34480/34481, CVE-2026-49844); the shaded
# flink-dist jar is clean. melange.yaml swaps all five log4j jars to 2.25.5.
#
# NEWEST-ONLY for now: 2.1 and 2.2 are still patched upstream; add them once their own
# jar sets are scanned (a swap line must name what each dist actually ships).
FROM_SOURCE=0
VERSIONS=(2.3.0)
# sha512 from Apache's published .sha512 (also verified against the download)
declare -A SHA512=(
  [2.3.0]=e5863767caeaa7c72e45fc62d45f7df9f435a1c83aed813ea550db39e9221194d148ea4a6c3bfb5604335974729c579d48c6c4c3eb43502e37310a0bf982462a
)
render() { echo "s/__VER__/$1/g; s|__SHA512__|${SHA512[$1]}|g"; }
