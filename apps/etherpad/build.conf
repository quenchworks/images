# etherpad: Etherpad (ether/etherpad-lite, Apache-2.0), the real-time collaborative editor. Images issue #129.
# Built from the release tag the way upstream's Dockerfile builds production: the admin UI with the full workspace,
# then a production install of the src and bin packages only, run through tsx on Node 24. Runtime state (dirty.db,
# minified cache, APIKEY.txt, SESSIONKEY.txt) lives on one volume at /var/lib/etherpad; the rest is read-only.
# KNOWN: html-to-docx bundles image-size 1.x code in its dist (scanners cannot see it); it runs only on DOCX export.
# LATEST-ONLY: one release line.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(3.3.22)
declare -A SHA256=(
  [3.3.22]=3c1232484a3bc04170c1ea8ccfc5d3ad8903935f7bff1675c12dbe0bf467497e
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
