# nginx-proxy-manager: Nginx Proxy Manager, the web UI that manages nginx proxy hosts,
# redirections, streams and Let's Encrypt certificates. One image runs nginx (built from
# source with the stream module), the Node backend that writes nginx config and reloads it,
# the built React UI, and certbot. Upstream runs these under s6 as root; this image runs
# them as uid 1001 under a small busybox sh entrypoint.
#
# Nonroot changes, all made at build time:
#   - every listen port moves up: 80 -> 8080, 443 -> 8443, admin 81 -> 8181 (the chart's
#     Service maps 80/443/81 back), so nginx needs no capability. Stream hosts must use
#     ports >= 1024.
#   - files upstream rewrites under /etc at boot (resolvers.conf, ip_ranges.conf) are
#     symlinks into /tmp/npm, so the rootfs stays read-only.
#   - certbot 5.10.0 (+ acme, josepy) is installed from PyPI onto Wolfi's cryptography,
#     pyOpenSSL and requests. Upstream pip-installs DNS plugins at runtime; this image has
#     no pip, so certificates use HTTP-01 (and custom certificates work as usual).
#
# NEWEST-ONLY: upstream ships one supported line.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(2.16.0)
declare -A SHA256=(
  [2.16.0]=8d77f9de056c1807476d2afbe28b5c22ac428c19cc6558194aac8e9aceb3bf25
)
NGINX_VERSION=1.30.6
NGINX_SHA256=3cf46f5ed7504d460125866b7bea99fb357f31d887e2e63b35503310e9b8b6c8
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g; s/__NGINX_VER__/$NGINX_VERSION/g; s|__NGINX_SHA256__|$NGINX_SHA256|g"; }
