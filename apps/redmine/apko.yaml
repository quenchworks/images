# Assembles the Redmine runtime image on Wolfi ruby-4.0. Nonroot, multi-arch, SBOM by
# apko, no shell. puma serves on :3000. Needs PostgreSQL (REDMINE_DB_*) and a
# SECRET_KEY_BASE; run `launch.rb rake db:migrate` before the first start. Attachments
# live under /data/files; tmp, logs and plugin assets under /tmp.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-redmine@local

accounts:
  groups:
    - groupname: redmine
      gid: 1001
  users:
    - username: redmine
      uid: 1001
      gid: 1001
      homedir: /data
  run-as: 1001

paths:
  - path: /data
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o755

environment:
  RAILS_ENV: production
  RAILS_LOG_TO_STDOUT: "1"
  RAILS_SERVE_STATIC_FILES: "1"
  BUNDLE_APP_CONFIG: /opt/redmine/.bundle
  BUNDLE_FROZEN: "true"
  HOME: /data

work-dir: /opt/redmine

entrypoint:
  command: /usr/bin/ruby /opt/redmine/launch.rb
cmd: server

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-redmine"
  org.opencontainers.image.licenses: "GPL-2.0-only"
