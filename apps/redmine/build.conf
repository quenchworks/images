# redmine: Redmine (GPL-2.0), the Ruby on Rails project management and issue tracker,
# from the official release tarball on Wolfi ruby-4.0, backed by PostgreSQL.
#
# Redmine ships no Gemfile.lock, so every gem resolves to its newest release inside the
# Gemfile's own ranges at build time, and the build writes the lock the scan reads.
# Native gems build from SOURCE (BUNDLE_FORCE_RUBY_PLATFORM) against Wolfi's libxml2,
# libxslt and libpq, so no precompiled gem carries its own copy the scan cannot see.
# commonmarker is a Rust extension, hence the rust toolchain in the build.
#
# Ruby 4.0 rather than 3.4: Wolfi ruby-3.4 ships json 2.9.1 as a default gem (CVE-2026-54696,
# fixed in 2.19.9), which the scan reports and a Gemfile cannot replace; ruby-4.0 does not.
# Redmine 7.0 supports Ruby 4.0 (its wiki slowdown is confined to 4.0.0 to 4.0.2).
#
# NEWEST LINE ONLY (7.0). PostgreSQL only: the Gemfile picks its database gems from
# config/database.yml at bundle time. ImageMagick (thumbnails) and LDAP are not in the
# image; the ldap gem group is installed, the minimagick group is not.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(7.0.1)
declare -A SHA256=(
  [7.0.1]=68538b4310fa50ac79a521045cb55fe3bcffed5c1562d6844cf90e66e7619209
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
