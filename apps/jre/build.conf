# jre: apko-runtime from Wolfi's openjdk-<major> packages. Published tag is the
# FULL version Wolfi resolves (latest 3 LTS lines); render maps __VER__ -> the
# major (the Wolfi package + JAVA_HOME path), while the workflow tags the full version.
FROM_SOURCE=0
VERSIONS=(17.0.19 21.0.11 25.0.4)
render() { local v="$1"; echo "s/__VER__/${v%%.*}/g"; }
