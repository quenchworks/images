# jre: apko-runtime from Wolfi's openjdk-<major> packages. Published tag is the
# FULL version Wolfi resolves; render maps __VER__ -> the major (the Wolfi package
# + JAVA_HOME path), while the workflow tags the full version.
#
# WINDOW: 3 lines -- build-jre.yml's prep job builds only the LAST 3 VERSIONS
# entries, so a 4th would be silently ignored. 2026-07-27: added openjdk-26
# (26.0.2-r0, both arches; openjdk-26-default-jvm exists) and DROPPED 17.0.19 to
# stay inside that cap, leaving the 2 newest LTS (21, 25) + the feature release (26).
# Kept in lockstep with apps/jdk/build.conf -- the two images are a build/run pair.
#   * 26 is a 6-MONTH feature release, NOT an LTS: its public updates stop when
#     JDK 27 (LTS) ships, after which it will rot and fail the 0-CVE gate. Swap
#     it for 27 as soon as Wolfi packages it.
#   * To carry 17 as well, raise the `n > 3` cap in .github/workflows/build-jre.yml
#     (prep step) to 4 -- VERSIONS alone is not enough.
FROM_SOURCE=0
VERSIONS=(21.0.11 25.0.4 26.0.2)
render() { local v="$1"; echo "s/__VER__/${v%%.*}/g"; }
