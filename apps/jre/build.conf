# STATUS: UNBLOCKED 2026-09-20. The zlib block is gone: Wolfi shipped the fix
# for CVE-2026-85091 as zlib 1.3.2.1_rc20260601-r0 and the advisory was amended
# to name that version, so the 1.3.3-r0 this file used to wait for is a number
# that will never arrive. A stock wolfi-base scan reports the advisory as
# `zlib 1.3.2-r7 -> 1.3.2.1_rc20260601-r0`, which is what Wolfi publishes on
# both arches today. scripts/blocked.py now watches the shipped version.
#
# Evidence, stated exactly as measured:
#   x86_64  gated locally 2026-09-20, PUSH=0: 0 fixable CVEs AND the boot test
#           passed, so this is "runs", not just "scans clean".
#   aarch64 not measured locally; this host kills background melange builds and
#           a qemu-emulated arm build does not fit the foreground timeout. CI's
#           native arm64 runner is the first arm measurement, and its gate
#           refuses to publish on any finding.
# jre: apko-runtime from Wolfi's openjdk-<major> packages. Published tag is the
# FULL version Wolfi resolves; render maps __VER__ -> the major (the Wolfi package
# + JAVA_HOME path), while the workflow tags the full version.
#
# WINDOW: 3 lines -- build-jre.yml's prep job builds only the LAST 3 VERSIONS
# entries, so a 4th would be silently ignored. 2026-07-27: added openjdk-26
# (26.0.2-r0, both arches; openjdk-26-default-jvm exists) and DROPPED 17.0.19 to
# stay inside that cap, leaving the 2 newest LTS (21, 25) + the feature release (26).
# Kept in lockstep with apps/jdk/build.conf -- the two images are a build/run pair.
#   * 26 is a 6-MONTH feature release, NOT an LTS: its public updates stop when
#     JDK 27 (LTS) ships, after which it will rot and fail the 0-CVE gate. Swap
#     it for 27 as soon as Wolfi packages it.
#   * To carry 17 as well, raise the `n > 3` cap in .github/workflows/build-jre.yml
#     (prep step) to 4 -- VERSIONS alone is not enough.
BLOCKED=0
FROM_SOURCE=0
# 2026-07-27: openjdk-26 was deliberately NOT added. The build workflow's prep job
# slices VERSIONS to the last 3, so a 4th band is silently never built — meaning
# adding 26 would have COST us LTS 17. OpenJDK 26 is a feature release that EOLs
# when 27 (LTS) ships (~Sept 2026), after which it rots and fails the gate. Three
# LTS lines (17/21/25) is strictly more useful for a production catalog than
# trading an LTS out for a two-month feature release.
# To carry 26 as well, first raise the cap to 4 in .github/workflows/build-<app>.yml.
VERSIONS=(17.0.20 21.0.12 25.0.4)
# test.sh takes its extra args from build-jre.yml, which passes "${1%%.*}" rather
# than the version. Mirrored here so the local gate matches CI; passing the
# version instead fails an image that runs fine.
boot_args() { echo "${1%%.*}"; }
render() { local v="$1"; echo "s/__VER__/${v%%.*}/g"; }
