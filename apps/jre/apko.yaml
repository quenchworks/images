# Assembles a hardened OpenJDK RUNTIME (JRE) base image directly from Wolfi's
# own versioned `openjdk-N` packages. No Dockerfile, NO melange build -- apko
# pulls the pinned `openjdk-__VER__-default-jvm` package straight from the Wolfi
# `os` repository. That package pulls the matching `openjdk-N-jre` (the runtime,
# WITHOUT javac/jshell) plus `java-common-jre`, which provides the `/usr/bin/java`
# launcher. So each LTS line is a pure package-assembly and stays RUNTIME-ONLY.
#
# This is the run-time companion to the `jdk` image: build your .jar with
# quench-jdk, then run it on quench-jre. There is deliberately NO compiler here.
#
# IMAGE-ONLY -- no Helm chart. This is a LANGUAGE RUNTIME image: the 0-CVE,
# signed, nonroot, multi-arch answer to `eclipse-temurin:N-jre`. Developers
# `FROM` it in the final stage of a multi-stage build, or run `java -jar` directly.
#
# TEMPLATE NOTE: `__VER__` is a build-time placeholder. CI substitutes the
# major (21 / 25 / 26) per matrix entry with `sed` before apko runs, so this
# single file covers every shipped version. JAVA_HOME also carries the same
# placeholder (Wolfi installs to /usr/lib/jvm/java-N-openjdk, same path the JRE
# package uses). To roll this pattern to another runtime, copy this file and
# swap the package names + entrypoint.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - openjdk-__VER__-default-jvm   # RUNTIME JRE for this LTS (pulls openjdk-N-jre + java-common-jre -> /usr/bin/java); NO javac

accounts:
  groups:
    - groupname: nonroot
      gid: 1001
  users:
    - username: nonroot
      uid: 1001
      gid: 1001
  run-as: 1001

# The JVM launcher as the entrypoint: `docker run <img> -version`,
# `docker run <img> -jar app.jar`, etc. Lives at /usr/bin/java in Wolfi
# (provided by java-common-jre, pointing at the default-jvm for this LTS).
entrypoint:
  command: /usr/bin/java

# HOME under a writable mount so tools that touch caches/prefs work on a
# read-only rootfs; JAVA_HOME points at the Wolfi JRE install for this LTS.
environment:
  HOME: /home/nonroot
  JAVA_HOME: /usr/lib/jvm/java-__VER__-openjdk
  LANG: C.UTF-8

work-dir: /home/nonroot

paths:
  - path: /home/nonroot
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o755

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-jre"
  org.opencontainers.image.licenses: "GPL-2.0-with-classpath-exception"
