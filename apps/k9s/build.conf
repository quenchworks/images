# k9s (derailed/k9s, Apache-2.0): a terminal UI to navigate, observe and manage Kubernetes clusters. Image only, no chart.
#
# From the release tag with the house Go floors and the otel 1.47 family loop (the cosign recipe), version
# stamped like upstream's goreleaser. LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(0.51.0)
declare -A SHA256=(
  [0.51.0]=e2c3851c909b87f9cfafa262e426f4a89023ca4e745cba5cab6d0153f76e7dcd
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
