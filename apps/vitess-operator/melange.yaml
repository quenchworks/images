# vitess-operator from the release tag, CGO-free; the version is a source constant (version.Version).
package:
  name: quench-vitess-operator
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened vitess-operator, built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/planetscale/vitess-operator/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - runs: |
      set -eu
      export CGO_ENABLED=0 GOTOOLCHAIN=local GOFLAGS=-mod=mod GOWORK=off
      # floors, raised only when below (a bare go get downgrades once upstream passes it); the
      # golang.org/x set moves together, as in the other recipes
      FLOOR="golang.org/x/crypto@v0.58.1-0.20261009181718-2f1f834330b2 golang.org/x/net@v0.62.0 golang.org/x/text@v0.43.0 golang.org/x/sys@v0.49.0"
      # through vitess.io/vitess v0.24: grpc (CVE-2026-84303/84304/84445, GHSA-hrxh-6v49-42gf), dd-trace-go
      # (CVE-2026-50274), go-jose (CVE-2026-116585..116587), klauspost/compress (CVE-2026-63209), cilium/ebpf
      # (CVE-2026-10722) and the otel family (CVE-2026-81870, sdk/metric moves with it)
      FLOOR="$FLOOR google.golang.org/grpc@v1.83.2 github.com/DataDog/dd-trace-go/v2@v2.8.1 github.com/go-jose/go-jose/v4@v4.1.6 github.com/klauspost/compress@v1.18.7 github.com/cilium/ebpf@v0.22.0 go.opentelemetry.io/otel@v1.47.0 go.opentelemetry.io/otel/metric@v1.47.0 go.opentelemetry.io/otel/trace@v1.47.0 go.opentelemetry.io/otel/sdk@v1.47.0 go.opentelemetry.io/otel/sdk/metric@v1.47.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.47.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.47.0"
      need=""
      for f in $FLOOR; do
        have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${f%@*}")"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        [ "$(printf '%s\n%s\n' "$have" "${f#*@}" | sort -V | head -1)" = "${f#*@}" ] || need="$need $f"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || go get $need
      go mod tidy
      go build -trimpath -ldflags "-s -w" \
        -o "${{targets.destdir}}/usr/bin/vitess-operator" ./cmd/manager

test:
  pipeline:
    - runs: |
        vitess-operator --help 2>&1 | grep -q -- cache_invalidate_interval
