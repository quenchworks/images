# Vitess Operator (Vitess clusters: sharded MySQL with vtgate, vttablet, vtctld and backups from
# VitessCluster resources), from planetscale/vitess-operator (Apache-2.0). From the release tag via
# melange: one static Go binary (cmd/manager) and the house golang.org/x floor. The version is a
# source constant the operator logs at startup.
# LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(2.17.1)
declare -A SHA256=(
  [2.17.1]=d02197b53b701ef065441efe23d4e3a4abb8c225c22aaebbd3b8770fbb00595a
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
