# ChartMuseum (helm/chartmuseum): from-source via melange (Go build from the git
# tag tarball). Image-only (a Helm chart repository server, no chart of its own).
# Newest supported line only (0.16). Single static Go binary, CGO disabled.
# Version is stamped via -X on main.Version (no `v` prefix, matching the
# upstream Makefile VERSION).
FROM_SOURCE=1
VERSIONS=(0.16.6)
declare -A SHA256=(
  [0.16.6]=76aefb093110a27bfb502be357fdbe8a7ce4922e6d10b7f2991303b1421d48fe
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
