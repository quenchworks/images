# ChartMuseum (helm/chartmuseum): from-source via melange (Go build from the git
# tag tarball). Image-only (a Helm chart repository server, no chart of its own).
# Latest patch of the last 3 minor lines (0.14, 0.15, 0.16). Single static Go
# binary, CGO disabled. Version is stamped via -X on main.Version (no `v` prefix,
# matching the upstream Makefile VERSION).
FROM_SOURCE=1
VERSIONS=(0.14.0 0.15.0 0.16.5)
declare -A SHA256=(
  [0.14.0]=cd56e2bf077f238e283b9572e5549500b2ab640a74eb93a61e701adb3ce04c57
  [0.15.0]=fad24069b8c422ceccc9bbb53fa55c1bfafe771ccbe2aa70c54d0f37521a5aea
  [0.16.5]=8433a9c43bfc153673aa86185d52b9066d76e7793a9e16ad452b18bd981521ec
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
