# Builds ChartMuseum (helm/chartmuseum) from source onto Wolfi. Single static Go
# binary, no CGO (matching the upstream linux release build). The version is
# stamped via -X main.Version so `chartmuseum --version` reports the real release.
# Output is a signed APK in Quenchworks' own repo. No upstream distro binaries.
# Image-only (a Helm chart repository server, no chart of its own).
package:
  name: quench-chartmuseum
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened ChartMuseum (Helm chart repository server), built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/helm/chartmuseum/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      # 0-CVE gate: minimal same-major security bumps of flagged (mostly
      # transitive) modules. All MINOR/PATCH within the existing major line.
      # containerd CVE-2026-53495 (CRI ExecSync goroutine leak, MEDIUM), fixed in
      # 1.7.35, and CVE-2026-53493 (MEDIUM, 2026-09-24) in 1.7.36; 0.16.6 requires
      # v1.7.33 indirect, no `replace` covers it.
      # 0-CVE FLOORS, not pins (docs/go-module-float.md): raise a module only where go.mod has it
      # below the floor; a module absent from the graph is skipped. Bare `go get` pins downgraded
      # newer upstream releases (found 2026-10-05).
      FLOOR="github.com/containerd/containerd@v1.7.36 google.golang.org/grpc@v1.83.2 go.opentelemetry.io/otel@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.45.0 go.opentelemetry.io/otel/sdk@v1.45.0 go.opentelemetry.io/otel/metric@v1.45.0 go.opentelemetry.io/otel/trace@v1.45.0 golang.org/x/oauth2@v0.36.0 golang.org/x/crypto@v0.56.0 golang.org/x/net@v0.58.0 golang.org/x/text@v0.41.0 helm.sh/helm/v3@v3.20.2 oras.land/oras-go/v2@v2.6.2"
      # Go semver order (a release outranks its prereleases); busybox sort -V does not.
      vlt() { awk -v a="${1#v}" -v b="${2#v}" 'function pp(s,  p){sub(/\+.*/,"",s);p=index(s,"-");if(p){C=substr(s,1,p-1);P=substr(s,p+1)}else{C=s;P=""}} function cmp(x,y,  i,n,m,X,Y){n=split(x,X,".");m=split(y,Y,".");for(i=1;i<=n&&i<=m;i++){if(X[i]==Y[i])continue;if(X[i]~/^[0-9]+$/&&Y[i]~/^[0-9]+$/)return (X[i]+0<Y[i]+0)?-1:1;if(X[i]~/^[0-9]+$/)return -1;if(Y[i]~/^[0-9]+$/)return 1;return (X[i]<Y[i])?-1:1}return (n<m)?-1:(n>m)?1:0} BEGIN{pp(a);ca=C;pa=P;pp(b);cb=C;pb=P;c=cmp(ca,cb);if(c==0){if(pa==pb)c=0;else if(pa=="")c=1;else if(pb=="")c=-1;else c=cmp(pa,pb)}exit !(c<0)}'; }
      need=""
      for mv in $FLOOR; do
        have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${mv%@*}" 2>/dev/null)"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        vlt "$have" "${mv#*@}" && need="$need $mv"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || go get $need
      # grpc GHSA-hrxh-6v49-42gf (xDS RBAC + HTTP/2, HIGH): bump to v1.82.1. grpc@1.82.1
      # requires the otel@1.44.0 family + x/oauth2@0.36.0 (otel bumped 1.41.0 -> 1.43.0).
      # otel/sdk was MISSING from this float, so the published image still carried
      # CVE-2026-81870 on sdk v1.44.0 while the four exporters were already fixed.
      go mod tidy
      # oras.land/oras-go/v2 2.6.1 -> 2.6.2: CVE-2026-50163 (HIGH), arbitrary file
      # access via crafted tarball hardlinks. Same advisory trivy hit this round.
      go mod tidy
      go build -trimpath \
        -ldflags "-s -w -X main.Version=${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/chartmuseum" ./cmd/chartmuseum
