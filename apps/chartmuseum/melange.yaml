# Builds ChartMuseum (helm/chartmuseum) from source onto Wolfi. Single static Go
# binary, no CGO (matching the upstream linux release build). The version is
# stamped via -X main.Version so `chartmuseum --version` reports the real release.
# Output is a signed APK in Quenchworks' own repo. No upstream distro binaries.
# Image-only (a Helm chart repository server, no chart of its own).
package:
  name: quench-chartmuseum
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened ChartMuseum (Helm chart repository server), built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/helm/chartmuseum/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      # 0-CVE gate: minimal same-major security bumps of flagged (mostly
      # transitive) modules. All MINOR/PATCH within the existing major line.
      go get github.com/containerd/containerd@v1.7.33
      # grpc GHSA-hrxh-6v49-42gf (xDS RBAC + HTTP/2, HIGH): bump to v1.82.1. grpc@1.82.1
      # requires the otel@1.44.0 family + x/oauth2@0.36.0 (otel bumped 1.41.0 -> 1.43.0).
      go get google.golang.org/grpc@v1.83.2
      go get go.opentelemetry.io/otel@v1.44.0
      go get go.opentelemetry.io/otel/sdk@v1.44.0
      go get go.opentelemetry.io/otel/metric@v1.44.0
      go get go.opentelemetry.io/otel/trace@v1.44.0
      go get golang.org/x/oauth2@v0.36.0
      go get golang.org/x/crypto@v0.56.0
      go get golang.org/x/net@v0.58.0 golang.org/x/text@v0.41.0
      go get helm.sh/helm/v3@v3.20.2
      go get oras.land/oras-go/v2@v2.6.1
      go mod tidy
      # oras.land/oras-go/v2 2.6.1 -> 2.6.2: CVE-2026-50163 (HIGH), arbitrary file
      # access via crafted tarball hardlinks. Same advisory trivy hit this round.
      go get oras.land/oras-go/v2@v2.6.2
      go mod tidy
      go build -trimpath \
        -ldflags "-s -w -X main.Version=${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/chartmuseum" ./cmd/chartmuseum
