# Assembles the ChartMuseum runtime image. Minimal, nonroot, multi-arch, SBOM by
# apko. ChartMuseum is a server: the entrypoint is the binary, so
# `docker run ...chartmuseum <flags>` starts it (e.g. --version, --port, --storage).
# ca-certificates-bundle is included so it can reach object-storage backends and
# registries over TLS.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-chartmuseum@local

accounts:
  groups:
    - groupname: chartmuseum
      gid: 1001
  users:
    - username: chartmuseum
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/bin/chartmuseum

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-chartmuseum"
  org.opencontainers.image.licenses: "Apache-2.0"
