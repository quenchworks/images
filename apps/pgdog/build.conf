# pgdog (pgdogdev/pgdog): PostgreSQL connection pooler, load balancer and sharding proxy in
# Rust. From the release tag with `cargo auditable build`; hickory-resolver ported to 0.26
# (hickory-026.patch) and the vulnerable crates floated (melange.yaml). AGPL-3.0. Upstream
# patches only its newest release: latest only.
FROM_SOURCE=1
VERSIONS=(0.1.64)
declare -A SHA256=(
  [0.1.64]=0dd79a5d235c52a573406f3fd4145355b4e67c3234d8c04ca762f5a5d05e6cdf
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
