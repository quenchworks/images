# Nebula from the release tag, CGO-free like upstream's Makefile (-X main.Build).
package:
  name: quench-nebula
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Nebula overlay network, built from source on Wolfi"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27          # 1.12.0 go.mod: go 1.27.3

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/slackhq/nebula/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - runs: |
      set -eu
      export CGO_ENABLED=0 GOTOOLCHAIN=local GOFLAGS=-mod=mod
      # floors, raised only when below (a bare go get downgrades once upstream passes it); the
      # golang.org/x set moves together, as in the other recipes
      FLOOR="golang.org/x/crypto@v0.58.1-0.20261009181718-2f1f834330b2 golang.org/x/net@v0.62.0 golang.org/x/text@v0.43.0 golang.org/x/sys@v0.49.0"
      need=""
      for f in $FLOOR; do
        have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${f%@*}")"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        [ "$(printf '%s\n%s\n' "$have" "${f#*@}" | sort -V | head -1)" = "${f#*@}" ] || need="$need $f"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || go get $need
      go mod tidy
      for c in nebula nebula-cert; do
        go build -trimpath -ldflags "-s -w -X main.Build=${{package.version}}" \
          -o "${{targets.destdir}}/usr/bin/$c" ./cmd/$c
      done
      "${{targets.destdir}}/usr/bin/nebula" -version | grep -F "${{package.version}}"

test:
  pipeline:
    - runs: |
        nebula -version
        nebula-cert -version
