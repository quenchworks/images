# Assembles the hadolint image: the static binary on Wolfi's base layout. Nonroot,
# multi-arch, SBOM by apko. Mount files to lint, or pipe them in on stdin with "-".
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-hadolint@local

accounts:
  groups:
    - groupname: hadolint
      gid: 1001
  users:
    - username: hadolint
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/bin/hadolint

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-hadolint"
  org.opencontainers.image.licenses: "GPL-3.0-only"
