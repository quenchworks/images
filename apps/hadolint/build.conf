# hadolint: the official static binary from the GitHub release (the Dockerfile linter), per arch.
# FROM_SOURCE=0: upstream builds it with GHC; the release binary is static. Each sha256
# is from a download that matched the digest GitHub publishes for the asset.
FROM_SOURCE=0
VERSIONS=(2.15.1)
declare -A SHA_AMD=(
  [2.15.1]=c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
)
declare -A SHA_ARM=(
  [2.15.1]=f6198ef8090f404dbb771abfee086eb8c48ac177f30da7fd3510aca35b344b5d
)
render() { echo "s/__VER__/$1/g; s|__SHA_AMD__|${SHA_AMD[$1]}|g; s|__SHA_ARM__|${SHA_ARM[$1]}|g"; }
