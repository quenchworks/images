# Builds PocketBase (pocketbase/pocketbase) from source onto Wolfi. Single static
# Go binary (CGO disabled, matching upstream .goreleaser.yaml), multi-arch. Output
# is a signed APK in Quenchworks' own repo. No upstream distro binaries.
#
# PocketBase is an open-source backend in one file (SQLite + auth + admin UI +
# REST). It is normally consumed as a Go framework; the standalone server is the
# example CLI at examples/base, which upstream's goreleaser builds as `pocketbase`.
# The Superuser admin UI is a Vite/Svelte app whose COMPILED output ships in the
# tag at ui/dist and is embedded through `//go:embed all:dist` (ui/embed.go). So a
# plain `go build ./examples/base` produces the full server with the UI baked in --
# NO Node/JS toolchain is needed, and none enters the runtime image or Trivy scan.
#
# The SQLite driver is the pure-Go modernc.org/sqlite (no cgo), so CGO_ENABLED=0
# yields a fully static binary with no libc dependency.
#
# go.mod declares go 1.25.0; we build with go-1.26 (newest, clears stdlib CVE
# advisories) and GOTOOLCHAIN=local so go.mod's 1.25 directive does not trigger a
# toolchain download. GOFLAGS=-mod=mod lets the module graph resolve patched deps.
# Version is stamped via -X github.com/pocketbase/pocketbase.Version (per upstream
# ldflags) so `pocketbase --version` reports the real release.
package:
  name: quench-pocketbase
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened PocketBase (open-source backend in one file), built from source on Wolfi"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-1.27

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/pocketbase/pocketbase/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - name: Build the pocketbase server binary (static, CGO off)
    runs: |
      set -eu
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      export GOTOOLCHAIN=local      # use the installed go-1.27, do not fetch go.mod's 1.25
      export GO111MODULE=on
      # Bump the one transitive dep the comprehensive Trivy gate flags: golang.org/x/image
      # v0.41.0 carries CVE-2026-33813 + CVE-2026-46601 (webp/VP8 DoS), both fixed by 0.43.0.
      # Same minor API, so this is a safe patch bump within the module graph
      # (GOFLAGS=-mod=mod), not a fork/force.
      # Also float golang.org/x/net (CVE-2026-46600, dnsmessage panic) and
      # golang.org/x/text (CVE-2026-56852, infinite loop) to their fixed minors.
      # 0-CVE FLOORS, not pins (docs/go-module-float.md): raise a module only where go.mod has it
      # below the floor; a module absent from the graph is skipped. Bare `go get` pins downgraded
      # newer upstream releases (found 2026-10-05).
      FLOOR="golang.org/x/image@v0.45.0 golang.org/x/net@v0.58.0 golang.org/x/sys@v0.47.0 google.golang.org/grpc@v1.83.2 golang.org/x/crypto@v0.56.0 golang.org/x/text@v0.41.0"
      # Go semver order (a release outranks its prereleases); busybox sort -V does not.
      vlt() { awk -v a="${1#v}" -v b="${2#v}" 'function pp(s,  p){sub(/\+.*/,"",s);p=index(s,"-");if(p){C=substr(s,1,p-1);P=substr(s,p+1)}else{C=s;P=""}} function cmp(x,y,  i,n,m,X,Y){n=split(x,X,".");m=split(y,Y,".");for(i=1;i<=n&&i<=m;i++){if(X[i]==Y[i])continue;if(X[i]~/^[0-9]+$/&&Y[i]~/^[0-9]+$/)return (X[i]+0<Y[i]+0)?-1:1;if(X[i]~/^[0-9]+$/)return -1;if(Y[i]~/^[0-9]+$/)return 1;return (X[i]<Y[i])?-1:1}return (n<m)?-1:(n>m)?1:0} BEGIN{pp(a);ca=C;pa=P;pp(b);cb=C;pb=P;c=cmp(ca,cb);if(c==0){if(pa==pb)c=0;else if(pa=="")c=1;else if(pb=="")c=-1;else c=cmp(pa,pb)}exit !(c<0)}'; }
      need=""
      for mv in $FLOOR; do
        have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${mv%@*}" 2>/dev/null)"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        vlt "$have" "${mv#*@}" && need="$need $mv"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || go get $need
      go mod tidy
      # Mirror upstream ldflags so `pocketbase --version` reports the real release.
      go build -trimpath \
        -ldflags "-s -w -X github.com/pocketbase/pocketbase.Version=${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/pocketbase" ./examples/base
