# pocketbase: from-source via melange (Go build of the standalone server from the
# git tag tarball). PocketBase is normally a Go framework; its ready-to-run server
# lives at examples/base (this is what upstream .goreleaser.yaml ships). The admin
# Superuser UI is pre-built in ui/dist and embedded via `//go:embed all:dist`, so a
# plain `go build ./examples/base` yields the full server + UI (no Node build).
# Pure-Go SQLite (modernc.org/sqlite), so CGO is off and the binary is static.
# NEWEST-ONLY: a single stable release. The source tarball is pinned by sha256.
FROM_SOURCE=1
VERSIONS=(0.40.4)
declare -A SHA256=(
  [0.40.4]=969a4db498382d120dcd9c801481e7166cc6adec97e67c966a75c3b0c2a09a85
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
