# flux-source-controller: Flux's source-controller, from source via melange (Go build of main.go from the git tag
# tarball). Static Go binary, no CGO. Flux ships one version of each controller per
# Flux release, so this tracks the latest only. The binary carries no version stamp.
FROM_SOURCE=1
VERSIONS=(1.9.5)
declare -A SHA256=(
  [1.9.5]=34ca4ea492b3714351eb9dd39a31d64c7d45cf9c32738445393a6002ed71108e
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
