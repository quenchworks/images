# soft-serve: Soft Serve, a self-hostable Git server (SSH TUI, Git over SSH, HTTP and the git
# daemon, access control, LFS) from the release tag, one CGO-free Go binary.
#
# 0-CVE: go.mod carries x/crypto v0.57.0 and x/net v0.60.0 (the house floor fixes them) and
# go-jose/v3 v3.0.5 (CVE-2026-116585/-116586/-116587, fixed only in v4). v3 is imported by one
# file, pkg/jwk/jwk.go, for the JSONWebKey struct, which v4 keeps: melange.yaml moves that import
# to go-jose/v4 v4.1.9.
#
# NEWEST-ONLY: Soft Serve ships one line.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(0.12.4)
# sha256 of the GitHub source tarball, from a download
declare -A SHA256=(
  [0.12.4]=950d4735969ce849d3073301722c4a16e78fb41ba959eee12effd4c8b1162a4b
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
