# kutt: Kutt (thedevs-network/kutt, MIT), a URL shortener with custom domains, link stats, password-protected and
# expiring links, an API and an admin panel. Images issue #120.
#
# From the release tag as upstream's Dockerfile installs it (production dependencies, no build step) on Wolfi
# nodejs-24, with better-sqlite3 compiled against Wolfi's Node headers. Upstream runs the knex migrations through
# npm and a shell; the image runs them from /app/start.js, which refuses to start without JWT_SECRET (knexfile.js
# would otherwise fill in a placeholder secret). SQLite at /var/lib/kutt/data.sqlite by default (the volume);
# PostgreSQL or MySQL/MariaDB via DB_CLIENT. Web UI and API on 3000.
# LATEST-ONLY: one release line.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(3.2.6)
declare -A SHA256=(
  [3.2.6]=142242619a52dfd840d26f0053e7424befa188b447fa3f3c86df6261bbdddf49
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
