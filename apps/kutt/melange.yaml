# Kutt from the release tag into /app, installed like upstream's Dockerfile.
package:
  name: quench-kutt
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Kutt URL shortener, built from source on Wolfi"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
      - nodejs-24
      - tzdata

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - jq
      - libuv-dev                # Wolfi node links libuv shared: node-gyp addons include uv.h from here
      - nodejs-24
      - node-gyp
      - npm
      - python3

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/thedevs-network/kutt/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - runs: |
      set -eu
      export HOME="$(mktemp -d)" npm_config_cache="$(mktemp -d)"
      # CVE floors: direct deps to fixed releases (nodemailer 9 -> 10: the 9 line has no fix for all of them;
      # createTransport/sendMail are unchanged), transitive ones by override
      jq '.dependencies.nanoid = "3.3.20" | .dependencies.mysql2 = "3.24.6" | .dependencies.nodemailer = "10.6.0"
        | .dependencies.express = "4.22.3"
        | .overrides = {"uuid": "11.1.1", "handlebars": "4.7.10", "ip-address": "10.7.6", "qs": "6.17.1",
            "proxy-addr": "2.0.8", "body-parser": "1.20.9"}' package.json > package.json.new && mv package.json.new package.json
      npm install --omit=dev --no-fund --no-audit --ignore-scripts
      # npm runs no install scripts here: compile the addon against Wolfi's Node headers, drop any prebuilds
      ( cd node_modules/better-sqlite3 && node-gyp rebuild --release --nodedir=/usr )
      find node_modules -type d -name prebuilds -prune -exec rm -rf {} +
      if find node_modules -type f -name '*.node' -exec readelf -d {} \; 2>/dev/null | grep -q 'libc.musl'; then
        echo "a musl-linked native module is left"; exit 1
      fi
      node -e 'require("better-sqlite3")(":memory:").prepare("select 1").get(); console.log("better-sqlite3 ok")'
      node -e 'require("nodemailer").createTransport({jsonTransport:true}).sendMail({from:"a@b.c",to:"d@e.f",text:"x"}).then(()=>console.log("nodemailer ok"))'
      [ "$(node -p 'require("./package.json").version')" = "${{package.version}}" ]
      # migrations, then the server: what upstream's `npm run migrate && npm start` does, without npm or a shell
      cat > start.js <<'JS'
      "use strict";
      // knexfile.js fills in a placeholder JWT_SECRET when none is set, and the server would accept it
      if (!process.env.JWT_SECRET) {
        console.error("JWT_SECRET must be set");
        process.exit(1);
      }
      process.chdir(__dirname);
      const db = require("knex")(require("./knexfile.js"));
      db.migrate.latest()
        .then(([, done]) => { console.log(`migrations: ${done.length} applied`); return db.destroy(); })
        .then(() => { process.argv.push("--production"); require("./server/server.js"); })
        .catch((err) => { console.error(err); process.exit(1); });
      JS
      node --check start.js
      app="${{targets.destdir}}/app"
      install -d "$app"
      cp -a node_modules package.json knexfile.js server static custom start.js "$app/"

test:
  pipeline:
    - runs: test -f /app/start.js
