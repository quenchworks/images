      install -d "${{targets.destdir}}/etc/akhq"
      cat > "${{targets.destdir}}/etc/akhq/application.yml" <<'CONF'
      micronaut:
        server:
          port: 8080
      endpoints:
        all:
          port: 28081
      akhq:
        connections: {}
      CONF

test:
  pipeline:
    - runs: |
        test -f /usr/lib/akhq/lib/akhq-${{package.version}}.jar
        test -f /etc/akhq/application.yml
