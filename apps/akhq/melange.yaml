# Packages AKHQ onto Wolfi from its release distribution tarball (lib/ of separate jars),
# with the vulnerable libraries replaced one jar at a time.
package:
  name: quench-akhq
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened AKHQ, the Kafka web UI, on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - openjdk-25-jre       # AKHQ 0.28 is compiled for Java 25 (class file major 69)
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - curl

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/tchiotludo/akhq/releases/download/${{package.version}}/akhq-${{package.version}}.tar
      expected-sha256: __SHA256__
      extract: false
  - runs: |
      set -eu
      tar xf akhq-${{package.version}}.tar
      dest="${{targets.destdir}}/usr/lib/akhq"
      install -d "$dest"
      # lib/ only: the Gradle start script lists every jar by name, and the swaps rename
      # them, so the image runs `java -cp lib/*` instead
      cp -a akhq-${{package.version}}/lib "$dest/lib"
      lib="$dest/lib"
      M=https://repo1.maven.org/maven2
      # swap <shipped jar> <maven path of the fixed jar> <its sha256, from a download>
      # Each swap asserts the old jar is shipped, so a release that moves a library fails
      # loudly instead of gaining a second copy.
      swap() {
        test -f "$lib/$1" || { echo "FATAL: $1 not shipped; re-audit the swaps"; exit 1; }
        new="$(basename "$2")"
        curl -fsSL -o "$lib/$new" "$M/$2"
        echo "$3  $lib/$new" | sha256sum -c -
        rm -f "$lib/$1"
      }
      # One version per family (the highest any finding demands, measured 2026-09-25 with
      # trivy against the 0.28.0 distribution: 58 findings): netty 4.2.17.Final, jackson
      # 2.21.5 and 3.1.5, jetty 12.1.10 (the ee10 12.0.x servlet jars are not flagged and
      # stay), jline 3.30.15, log4j-api 2.25.5, logback 1.5.34, micrometer 1.16.6, bc-fips
      # 2.1.3, httpclient5 5.6.3, httpcore5 5.4.3.
      # Wire moves 5.x to 6.3.0 as one family (5.x has no fix). Its one user is
      # Confluent's kafka-protobuf-provider; a ProtobufSchema parse gave the same result
      # on 6.3.0 as on the shipped 5.x.
      swap bc-fips-2.1.2.jar org/bouncycastle/bc-fips/2.1.3/bc-fips-2.1.3.jar f55fc476ede820d5c03fe87e6ced5bb0095e1dc30b387445846a3ff0274f8c0e
      swap httpclient5-5.6.1.jar org/apache/httpcomponents/client5/httpclient5/5.6.3/httpclient5-5.6.3.jar 80712ff129210d7c73d9fcc1195cbee5c3c34744965c7a05ea107b3648922f18
