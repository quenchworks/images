# Packages AKHQ onto Wolfi from its release distribution tarball (lib/ of separate jars),
# with the vulnerable libraries replaced one jar at a time.
package:
  name: quench-akhq
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened AKHQ, the Kafka web UI, on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - openjdk-25-jre       # AKHQ 0.28 is compiled for Java 25 (class file major 69)
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - curl

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/tchiotludo/akhq/releases/download/${{package.version}}/akhq-${{package.version}}.tar
      expected-sha256: __SHA256__
      extract: false
  - runs: |
      set -eu
      tar xf akhq-${{package.version}}.tar
      dest="${{targets.destdir}}/usr/lib/akhq"
      install -d "$dest"
      # lib/ only: the Gradle start script lists every jar by name, and the swaps rename
      # them, so the image runs `java -cp lib/*` instead
      cp -a akhq-${{package.version}}/lib "$dest/lib"
      lib="$dest/lib"
      M=https://repo1.maven.org/maven2
      # swap <shipped jar> <maven path of the fixed jar> <its sha256, from a download>
      # Each swap asserts the old jar is shipped, so a release that moves a library fails
      # loudly instead of gaining a second copy.
      swap() {
        test -f "$lib/$1" || { echo "FATAL: $1 not shipped; re-audit the swaps"; exit 1; }
        new="$(basename "$2")"
        curl -fsSL -o "$lib/$new" "$M/$2"
        echo "$3  $lib/$new" | sha256sum -c -
        rm -f "$lib/$1"
      }
      # Measured 2026-11-17 with trivy against the 0.29.0 distribution: upstream moved netty, jackson, jetty, jline,
      # log4j-api, logback, micrometer, bc-fips, httpclient5/core5, guava, lz4 and wire 6 itself, so the 0.28.0 swaps
      # all fell away. Two findings remain: snappy-java 1.1.10.7 (HIGH) and org.json 20250107.
      swap snappy-java-1.1.10.7.jar org/xerial/snappy/snappy-java/1.1.10.9/snappy-java-1.1.10.9.jar 35228628442e4b9797681c7cbd3b26594f6da3379159dbd0cb07094ed3aece0d
      swap json-20250107.jar org/json/json/20260719/json-20260719.jar c243f45f9590c12694a4142ed3f07fc70dfb71e4daebd05ae234bf92a2da92a6
      chmod -R a+rX "$dest"
      # a default config: UI on 8080, health on 28081; the chart or a mount replaces it
      install -d "${{targets.destdir}}/etc/akhq"
      cat > "${{targets.destdir}}/etc/akhq/application.yml" <<'CONF'
      micronaut:
        server:
          port: 8080
      endpoints:
        all:
          port: 28081
      akhq:
        connections: {}
      CONF

test:
  pipeline:
    - runs: |
        test -f /usr/lib/akhq/lib/akhq-${{package.version}}.jar
        test -f /etc/akhq/application.yml
