# akhq: AKHQ, the web UI for Apache Kafka (topics, consumer groups, schema registry,
# Kafka Connect, ACLs), from the release distribution tarball on a Wolfi
# openjdk-21-jre. Its lib/ holds separate jars, so vulnerable libraries are replaced.
#
# 0-CVE: the stock 0.28.0 distribution carries 58 findings. melange.yaml swaps 74 jars
# to one fixed version per family; a local trivy rootfs of the result measured 0, and
# the swapped app booted (health UP, UI 200, cluster API answering).
#
# NEWEST-ONLY: AKHQ ships one supported line.
BLOCKED=0
FROM_SOURCE=0
VERSIONS=(0.28.0)
# sha256 of the release tarball, from a download
declare -A SHA256=(
  [0.28.0]=039bd41dd0fbc494a685a6016af6854499bbdaebaeae071e3c415807af21f3e8
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
