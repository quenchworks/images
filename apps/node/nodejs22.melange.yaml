# Node.js 22 built from source for the node:22 line. Wolfi moved nodejs-22 to its enterprise
# repo on 2026-08-14 (wolfi-dev/os #231401), so public Wolfi stops at 22.23.2-r1 and will never
# ship the 22.23.4 security release (CVE-2026-105481/105482/106069/106072-4). Configure flags and
# build deps follow Wolfi's last public nodejs-22.yaml (MIT); the minimal/doc subpackages and the
# coverage tests are dropped. npm is removed here as in Wolfi: the image installs Wolfi `npm`.
# ICU: Wolfi's icu-dev is ICU 79.1, which Node 22's V8 build tool crashes on (gen-regexp-special-case,
# run 42866960418), and ICU 78 has no -dev package. Node's bundled ICU 78.3 (deps/icu, the same ICU the
# official Node 22 binaries carry) is built in. The scanner cannot see it; the build pins 78.3 and a newer
# ICU 78 patch release means a bump here. OpenSSL, zlib, brotli, c-ares, nghttp2 and libuv stay shared.
package:
  name: quench-nodejs-22
  version: 22.23.5
  epoch: 0
  description: "Node.js 22, built from the release tarball"
  dependencies:
    # npm needs node-gyp, which depends on `nodejs`; without this apko pulls a second Wolfi Node.
    provides:
      - nodejs=${{package.full-version}}
  copyright:
    - license: MIT

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - brotli-dev
      - build-base
      - busybox
      - c-ares-dev
      - ca-certificates-bundle
      - libuv-dev
      - linux-headers
      - nghttp2-dev
      - openssl-3.6-dev      # openssl-dev resolves to OpenSSL 4, whose const X509 API Node 22 does not compile against
      - python-3.13-base
      - py3.13-jinja2
      - py3.13-setuptools
      - samurai
      - zlib-dev
  environment:
    # https://github.com/wolfi-dev/os/issues/34075
    CXXFLAGS: -fdelete-null-pointer-checks

pipeline:
  - uses: fetch
    with:
      uri: https://nodejs.org/dist/v${{package.version}}/node-v${{package.version}}.tar.xz
      expected-sha256: 6cce7c58bf058700c643944903d60a325e8c9ceede1f5c2c088b435f2ada091a
  - runs: |
      set -eu
      # melange leaves CFLAGS/CPPFLAGS unset; under -u the substitutions below need a default
      CFLAGS="${CFLAGS:-}" CXXFLAGS="${CXXFLAGS:-}" CPPFLAGS="${CPPFLAGS:-}"
      common_flags="-D_LARGEFILE_SOURCE -D_FILE_OFFSET_BITS=64"
      export CFLAGS="${CFLAGS/-Os/-O2} $common_flags"
      export CXXFLAGS="${CXXFLAGS/-Os/-O2} $common_flags"
      export CPPFLAGS="${CPPFLAGS/-Os/-O2} $common_flags"
      python3.13 configure.py --prefix=/usr \
        --shared-brotli \
        --shared-zlib \
        --shared-openssl \
        --shared-cares \
        --shared-nghttp2 \
        --shared-libuv \
        --ninja \
        --openssl-use-def-ca-store \
        --with-intl=full-icu \
        --openssl-conf-name=openssl_conf \
        --without-corepack
      make BUILDTYPE=Release "-j$(nproc)"
      make DESTDIR="${{targets.destdir}}" install
      rm -rf "${{targets.destdir}}/usr/lib/node_modules" "${{targets.destdir}}/usr/bin/npm" "${{targets.destdir}}/usr/bin/npx"
      rm -rf "${{targets.destdir}}/usr/share/doc" "${{targets.destdir}}/usr/share/man"
      "${{targets.destdir}}/usr/bin/node" --version | grep -qx "v${{package.version}}"
      # bundled ICU is invisible to the scanner: pin it, so a change is a decision, not an accident
      test "$("${{targets.destdir}}/usr/bin/node" -p process.versions.icu)" = 78.3
  - uses: strip

test:
  pipeline:
    - runs: |
        node --version
        node -e 'console.log(new Intl.NumberFormat("de-DE").format(1234.56))' | grep -q '1.234,56'
