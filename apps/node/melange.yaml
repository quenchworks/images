# Overlay for the Wolfi npm package, whose bundled tree carries glob 13.0.6 (GHSA-3g3m-2fjr-6pw4,
# CVE-2026-118773) and minimatch 10.2.5 (GHSA-g3hv-75wg-m249, CVE-2026-118764). Both are fixed only
# on new majors (glob 14.0.2, minimatch 11.0.1, released 2026-10-27), and npm 12.2.2, the newest,
# still requires ^13 / ^10, so no npm release closes them yet. Measured 2026-11-05 before adopting
# the majors: npm's own callers use only minimatch(), minimatch.match, new Minimatch (globParts,
# match, negate) and glob()/globSync(), all kept; makeRe and Minimatch#regexp, which 11 removes,
# are not called. npm 12.2.2 with these swapped gave the same `npm pack` file list and shasum,
# `npm query`, workspace and install results as the stock tree.
# The node image is otherwise pure Wolfi packages; this package ships only the swapped tree and
# Wolfi's npm SPDX with those entries corrected (Trivy reads /var/lib/db/sbom as its own source,
# so a stale record keeps the finding after the files are fixed). `replaces: npm-12` lets apk
# write over the files npm-12 owns. RETIRE an entry when a Wolfi npm ships it fixed: the SPDX step
# fails on an entry it finds no stale copy of, and says so. (Third overlay; retired before in
# d6f25352 and 5b87de1d.)
package:
  name: quench-node-npm-fix
  version: __VER__
  epoch: 0
  description: "glob 14 and minimatch 11 over the copies bundled in Wolfi npm-12"
  copyright:
    - license: ISC AND BlueOak-1.0.0
  dependencies:
    replaces:
      - npm-12
    runtime:
      - npm

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - nodejs-__VERMAJOR__
      - npm

pipeline:
  - runs: |
      set -eu
      D="${{targets.destdir}}"
      NM="$D/usr/lib/node_modules/npm/node_modules"
      mkdir -p "$D/var/lib/db/sbom"
      # <package> <path under npm's node_modules> <version> <sha256 of the registry tarball>.
      # glob and minimatch replace npm's copies; minimatch 11 adds @isaacs/nonrecursive-glob-match,
      # and glob 14 needs path-scurry 3, nested under glob so npm's other path-scurry 2 users keep it.
      FIXES="glob glob 14.0.3 f936d47081e316874bcd0ad9ed38a4275c7a16f5dd3300917231e0030a0acd91
      minimatch minimatch 11.0.4 b97c503756b43cf21478a99901ff3e4670274aaeb93b5a432de7c93c1a059b88
      @isaacs/nonrecursive-glob-match @isaacs/nonrecursive-glob-match 1.0.3 9c67e29b5fea7f3736c427cf061c81fa0546f3587f397fa303e46c8dbf8e9998
      path-scurry glob/node_modules/path-scurry 3.0.0 28d5862f70595973f00d63bb219083d6ed7a28488685a73a1c3340ba55688675"
      echo "$FIXES" | while read -r name dir ver sha; do
        node -e 'fetch(process.argv[1]).then(r=>r.arrayBuffer()).then(b=>require("fs").writeFileSync("/tmp/pkg.tgz",Buffer.from(b)))' "https://registry.npmjs.org/$name/-/${name##*/}-$ver.tgz"
        echo "$sha  /tmp/pkg.tgz" | sha256sum -c -
        rm -rf /tmp/pkg "$NM/$dir" && mkdir -p /tmp/pkg "$NM/$dir"
        tar -xzf /tmp/pkg.tgz -C /tmp/pkg
        cp -a /tmp/pkg/package/. "$NM/$dir/"
        chmod -R a+rX,go-w "$NM/$dir"
        grep -q "\"version\": \"$ver\"" "$NM/$dir/package.json"
      done
      # the stale copies this overlay replaces must exist, or the overlay is no longer needed
      for n in glob minimatch; do test -d "/usr/lib/node_modules/npm/node_modules/$n" || { echo "npm no longer bundles $n; drop it from FIXES"; exit 1; }; done
      src="$(ls /var/lib/db/sbom/npm-12-*.spdx.json)"
      test "$(echo "$src" | wc -l)" = 1
      WANT="glob 14.0.3
      minimatch 11.0.4" DESTDIR_="$D" SRC="$src" node -e '
        const fs = require("fs"), path = require("path");
        const want = Object.fromEntries(process.env.WANT.trim().split("\n").map(l => l.trim().split(/\s+/)));
        const doc = JSON.parse(fs.readFileSync(process.env.SRC, "utf8"));
        const hit = {};
        doc.packages = doc.packages.map(p => {
          const v = want[p.name];
          if (!v || p.versionInfo === v) return p;
          hit[p.name] = (hit[p.name] || 0) + 1;
          return JSON.parse(JSON.stringify(p).split(p.versionInfo).join(v));
        });
        for (const n of Object.keys(want))
          if (!hit[n]) throw new Error("npm-12 SPDX lists no stale " + n + ": drop it from WANT, or retire this package");
        fs.writeFileSync(path.join(process.env.DESTDIR_, "var/lib/db/sbom", path.basename(process.env.SRC)), JSON.stringify(doc, null, 2) + "\n");
        console.log("corrected " + JSON.stringify(hit) + " in " + path.basename(process.env.SRC));
      '

test:
  pipeline:
    - runs: |
        grep -q '"version": "14.0.3"' /usr/lib/node_modules/npm/node_modules/glob/package.json
        grep -q '"version": "11.0.4"' /usr/lib/node_modules/npm/node_modules/minimatch/package.json
        npm --version
