# STATUS: UNBLOCKED 2026-09-20. The zlib block is gone: Wolfi shipped the fix
# for CVE-2026-85091 as zlib 1.3.2.1_rc20260601-r0 and the advisory was amended
# to name that version, so the 1.3.3-r0 this file used to wait for is a number
# that will never arrive. A stock wolfi-base scan reports the advisory as
# `zlib 1.3.2-r7 -> 1.3.2.1_rc20260601-r0`, which is what Wolfi publishes on
# both arches today. scripts/blocked.py now watches the shipped version.
#
# Evidence, stated exactly as measured:
#   x86_64  gated locally 2026-09-20, PUSH=0: 0 fixable CVEs AND the boot test
#           passed, so this is "runs", not just "scans clean".
#   aarch64 not measured locally; this host kills background melange builds and
#           a qemu-emulated arm build does not fit the foreground timeout. CI's
#           native arm64 runner is the first arm measurement, and its gate
#           refuses to publish on any finding.
# RESIDUAL CVEs (2026-07-27) — UPSTREAM-GATED on npm itself, nothing to fix in this recipe.
# All three published lines show the same two findings, and both live inside the vendored
# node_modules of the standalone Wolfi `npm` apk (not in nodejs-<major>, which is why the
# findings are identical across 22/24/26):
#   brace-expansion  5.0.6 -> 5.0.8  CVE-2026-14257 (HIGH) + CVE-2026-13149
#   tar              7.5.19 -> 7.5.21 GHSA-r292-9mhp-454m (MEDIUM)
# Wolfi is NOT lagging: nodejs-26 is 26.5.0-r0 (already the pinned version here) and the newest
# npm apk is 12.0.1-r1. npm 12.0.1 is the newest npm release there is, and its published tarball
# still BUNDLES brace-expansion 5.0.7 and tar 7.5.19 — so a rebuild moves 5.0.6 -> 5.0.7
# (clearing CVE-2026-13149 only) and cannot clear the other two. This is a pure apk image with
# no melange recipe, so there is no install step to override or patch: the fix has to come from
# an npm release that bundles brace-expansion >= 5.0.8 / tar >= 7.5.21, then a Wolfi apk rebuild.
# Re-check on the nightly sweep; a rebuild is still worth doing to bank the 5.0.7 bump.
#
# node: apko-runtime. Wolfi packages Node by MAJOR (nodejs-<major>); we publish
# the FULL version as the tag (matches exactly what Wolfi's nodejs-<major>
# currently resolves, so the version-asserting smoke passes). ALL four maintained
# lines are published (per request): 20.20.2, 22.23.1, 24.18.0, 26.5.0.
# __VER__ = full version (tag + image label); __VERMAJOR__ = major (the Wolfi pkg).
# If Wolfi bumps a line's patch, bump the matching full version here
# (scripts/wolfi-latest.py nodejs-<major> 1 reports what Wolfi resolves).
BLOCKED=0
FROM_SOURCE=0
# 2026-09-20: 24.19.0 -> 24.21.0 and 26.7.0 -> 26.9.0. Wolfi moved both majors and
# this file did not follow, so the boot test caught the tag lying about its contents:
# `node -v` reported v26.9.0 inside an image the recipe calls 26.7.0. The tag IS the
# resolved version by design (see above), so a stale VERSIONS here publishes a
# mislabelled image rather than an old one. Re-read with
# `python3 scripts/wolfi-latest.py nodejs-<major> 1` on every bump; 22.23.2 is still
# what Wolfi resolves and is unchanged.
VERSIONS=(22.23.2 24.21.0 26.10.0)
render() { local v="$1"; echo "s/__VER__/${v}/g; s/__VERMAJOR__/${v%%.*}/g"; }
