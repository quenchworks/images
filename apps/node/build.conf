# node: apko-runtime. Wolfi packages Node by MAJOR (nodejs-<major>, floating to
# the latest patch). Like jdk/jre, we TAG by major so the published tag stays
# valid as Wolfi bumps the patch (a full-version tag would drift from the actual
# binary and break the version-asserting smoke on every Wolfi update). Latest 3
# maintained lines (Node 20 is EOL ~2026-04): 22 (LTS), 24 (LTS), 26 (current).
# __VER__ and __VERMAJOR__ are both the major (the tag and the Wolfi package).
FROM_SOURCE=0
VERSIONS=(22 24 26)
render() { local v="$1"; echo "s/__VER__/${v}/g; s/__VERMAJOR__/${v%%.*}/g"; }
