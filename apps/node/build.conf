# node: apko-runtime. Wolfi packages Node by MAJOR (nodejs-<major>, floating to
# the latest patch of that line); the published tag is the full version Wolfi
# currently resolves. Latest 3 maintained lines (Node 20 is EOL ~2026-04):
#   22.x (LTS), 24.x (LTS), 26.x (current). __VER__ = full version (tag),
# __VERMAJOR__ = major (the Wolfi package). Full versions snapshot the current
# Wolfi nodejs-<major> resolution; bump when Wolfi bumps.
FROM_SOURCE=0
VERSIONS=(22.13.1 24.0.2 26.0.0)
render() { local v="$1"; echo "s/__VER__/${v}/g; s/__VERMAJOR__/${v%%.*}/g"; }
