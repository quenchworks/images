# node: Wolfi packages by major (nodejs-<major>); the published tag is the full
# version. __NODEVER__ = major (the package), __NODEFULL__ = full version (tag).
FROM_SOURCE=0
VERSIONS=(20.20.2 22.22.3 24.16.0 26.3.0)
render() { local v="$1"; echo "s/__NODEVER__/${v%%.*}/g; s/__NODEFULL__/${v}/g"; }
