# node: apko-runtime. Wolfi packages Node by MAJOR (nodejs-<major>); we publish
# the FULL version as the tag (matches exactly what Wolfi's nodejs-<major>
# currently resolves, so the version-asserting smoke passes). ALL four maintained
# lines are published (per request): 20.20.2, 22.23.1, 24.18.0, 26.5.0.
# __VER__ = full version (tag + image label); __VERMAJOR__ = major (the Wolfi pkg).
# If Wolfi bumps a line's patch, bump the matching full version here
# (scripts/wolfi-latest.py nodejs-<major> 1 reports what Wolfi resolves).
FROM_SOURCE=0
VERSIONS=(20.20.2 22.23.1 24.18.0 26.5.0)
render() { local v="$1"; echo "s/__VER__/${v}/g; s/__VERMAJOR__/${v%%.*}/g"; }
