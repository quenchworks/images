# zabbix-server: Zabbix server built from source via melange (autotools ./configure && make).
# The newest patch of each supported line: 6.0 LTS, 7.0 LTS and 7.4. Release tarballs from
# https://cdn.zabbix.com/zabbix/sources/stable/<X.Y>/ ship a generated configure and the
# database schema (database/postgresql/{schema,images,data}.sql), each pinned by sha256.
FROM_SOURCE=1
VERSIONS=(6.0.49 7.0.32 7.4.16)
declare -A SHA256=(
  [6.0.49]=0222e88a8a2c44a99a986bc6cb795133a332d54ba8c327b2bc6494a17d161f6b
  [7.0.32]=ead5b0723ad965eb0e79f98d5d2b89088e7c898ae194eeba767e5d1fb2d50a96
  [7.4.16]=0e2c391dc184acce8e34250e7326a51e19c8bcee31e67b8497f5526247ecd261
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g; s/__LINE__/${1%.*}/g"; }
