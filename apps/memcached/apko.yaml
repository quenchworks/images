# Assembles the memcached runtime image from our own package plus the Wolfi base.
# No Dockerfile. Minimal, nonroot, multi-arch, SBOM generated by apko. memcached is
# configured by command-line flags; the chart appends them. It listens on 11211 and
# refuses to run as root, which is fine since apko runs it as the nonroot uid 1001.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-memcached@local

accounts:
  groups:
    - groupname: memcached
      gid: 1001
  users:
    - username: memcached
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/bin/memcached -l 0.0.0.0

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-memcached"
  org.opencontainers.image.licenses: "BSD-3-Clause"
