# memcached: from-source via melange (autoconf ./configure && make). memcached
# ships a single active line (1.6.x), so latest 3 = the 3 newest 1.6 patches.
# Each release pins its source tarball by sha256.
FROM_SOURCE=1
VERSIONS=(1.6.45)
declare -A SHA256=(
  [1.6.42]=50f08b879d4f9d36dea9d905e9eaade15c708e38db7e9a73fc21dc8b45395de7
  [1.6.43]=8042ee26e004efa0db41ca4a7c713f759c3280c2f8bee438579f13de1e509435
  [1.6.44]=c41a9d2713dfc56b5f4fa0075b2751973ea840c1f1ab8d6bfed08a1848938368
  [1.6.45]=d362c64e6d8d5287153501eabf7c85b4a761432fbf53f5d7b085d0bb1653c1dd
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
