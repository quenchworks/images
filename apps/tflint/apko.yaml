# tflint runtime: the tflint CLI as the entrypoint, HOME at /home/tflint.
# Nonroot uid 1001, multi-arch. Image only.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-tflint@local

accounts:
  groups:
    - groupname: tflint
      gid: 1001
  users:
    - username: tflint
      uid: 1001
      gid: 1001
      homedir: /home/tflint
  run-as: 1001

work-dir: /home/tflint

environment:
  HOME: /home/tflint

paths:
  - path: /home/tflint
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o750

entrypoint:
  command: /usr/bin/tflint

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-tflint"
  org.opencontainers.image.licenses: "MPL-2.0"
