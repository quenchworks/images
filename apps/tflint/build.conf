# tflint (terraform-linters/tflint, MPL-2.0): a pluggable Terraform linter. Image only, no chart.
# Images issue #67.
#
# Pure Go (CGO off); the version is a source constant (tflint/meta.go). The bundled terraform
# ruleset needs no download; other plugins install with tflint --init (network). Floats: the
# house golang.org/x floor and the otel 1.47 train.
FROM_SOURCE=1
VERSIONS=(0.66.0)
declare -A SHA256=(
  [0.66.0]=e67efd787f18bbcec641a9799f983bf1965a891fc77dc8cec5b9a24681daa7b6
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
