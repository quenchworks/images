# dagger (dagger/dagger): the Dagger engine plus the dagger CLI, from source on Wolfi.
# Upstream builds its engine image on Wolfi too (toolchains/engine-dev/build/builder.go);
# this follows that layout: dagger-engine, dagger-init, dnsname and dial-stdio from the
# source tree, runc, the CNI plugins, sshfs and tini from Wolfi packages. The bundled Go
# SDK runtime is assembled on Wolfi as an OCI image inside the engine (see melange.yaml).
# Not bundled yet: the Python and TypeScript SDK runtimes and qemu emulation.
# Ship-latest-only: the CLI and engine must share a minor, and Dagger patches only its
# newest line.
FROM_SOURCE=1
VERSIONS=(0.21.11)
declare -A SHA256=(
  [0.21.11]=90cdd1012c73317ed41da4feae5abf3f08634c2816f30f0e54a2d7cb9e20df63
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
