# jupyterhub: the JupyterHub hub (multi-user notebook server manager), packaged
# from PyPI on Wolfi python-3.13 in a venv, with the Kubernetes spawner and the
# OAuth authenticators. The proxy in front of it is apps/configurable-http-proxy.
# Supported lines: 5.5 and 6.0. The 5.4 line is dropped: jupyterhub 5.4.6 itself
# carries CVE-2026-54338, fixed only in 5.5.0.
BLOCKED=0
FROM_SOURCE=0
VERSIONS=(5.5.2 6.0.1)
render() { echo "s/__VER__/$1/g"; }
