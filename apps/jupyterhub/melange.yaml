# Installs JupyterHub from PyPI into a venv on Wolfi python-3.13, with
# jupyterhub-kubespawner (single-user servers as pods) and oauthenticator (GitHub,
# GitLab, Google, generic OAuth2/OIDC). The two plugins are pinned so every line
# resolves the same way; pip refuses the build if a line cannot take them.
package:
  name: quench-jupyterhub
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened JupyterHub hub with KubeSpawner and OAuthenticator, packaged on Wolfi"
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - python-3.13            # the venv references the system interpreter
      - ca-certificates-bundle
      - glibc
      - libstdc++
      - tzdata

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - python-3.13
      - py3.13-pip
      - build-base             # fallback for any transitive dep without a wheel

pipeline:
  - runs: |
      set -eu
      VER="${{package.version}}"
      dest="${{targets.destdir}}"
      VENV=/opt/jupyterhub/venv
      python3.13 -m venv "$VENV"
      "$VENV/bin/pip" install --no-cache-dir --upgrade pip
      "$VENV/bin/pip" install --no-cache-dir "jupyterhub==${VER}" \
        "jupyterhub-kubespawner==7.1.0" "oauthenticator==17.4.0"
      "$VENV/bin/python" -c "import importlib.metadata as m, sys; v = m.version('jupyterhub'); assert v == sys.argv[1], v; print('jupyterhub', v)" "${VER}"
      "$VENV/bin/python" -c "import kubespawner, oauthenticator"
      "$VENV/bin/pip" uninstall -y pip
      install -d "${dest}/opt/jupyterhub" "${dest}/usr/bin"
      cp -a "$VENV" "${dest}/opt/jupyterhub/venv"
      ln -sf /opt/jupyterhub/venv/bin/jupyterhub "${dest}/usr/bin/jupyterhub"
      chmod -R a+rX "${dest}/opt/jupyterhub"

test:
  pipeline:
    - runs: |
        /opt/jupyterhub/venv/bin/jupyterhub --version
