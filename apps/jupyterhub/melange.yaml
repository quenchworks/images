# Installs JupyterHub from PyPI into a venv on Wolfi python-3.13, with
# jupyterhub-kubespawner (single-user servers as pods) and oauthenticator (GitHub,
# GitLab, Google, generic OAuth2/OIDC). The two plugins are pinned so every line
# resolves the same way; pip refuses the build if a line cannot take them.
package:
  name: quench-jupyterhub
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened JupyterHub hub with KubeSpawner and OAuthenticator, packaged on Wolfi"
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - python-3.13            # the venv references the system interpreter
      - py3.13-cryptography    # Wolfi build on its scanned OpenSSL; the wheel links its own statically
      - ca-certificates-bundle
      - glibc
      - libstdc++
      - tzdata

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - python-3.13
      - py3.13-pip
      - py3.13-cryptography
      - build-base             # fallback for any transitive dep without a wheel

pipeline:
  - runs: |
      set -eu
      VER="${{package.version}}"
      dest="${{targets.destdir}}"
      VENV=/opt/jupyterhub/venv
      python3.13 -m venv --system-site-packages "$VENV"
      "$VENV/bin/pip" install --no-cache-dir --upgrade pip
      "$VENV/bin/pip" install --no-cache-dir "jupyterhub==${VER}" \
        "jupyterhub-kubespawner==7.1.0" "oauthenticator==17.4.0"
      "$VENV/bin/python" -c "import importlib.metadata as m, sys; v = m.version('jupyterhub'); assert v == sys.argv[1], v; print('jupyterhub', v)" "${VER}"
      "$VENV/bin/python" -c "import kubespawner, oauthenticator"
      # Wolfi's cryptography (system site-packages) satisfies the requirement, so pip leaves
      # it there; the manylinux wheel would carry a static OpenSSL the scan cannot see.
      SITE="$VENV/lib/python3.13/site-packages"
      if ls -d "$SITE"/*.libs 2>/dev/null | grep -q .; then echo "bundled native libs:"; ls -d "$SITE"/*.libs; exit 1; fi
      test ! -e "$SITE/cryptography" || { echo "cryptography installed into the venv instead of from Wolfi"; exit 1; }
      "$VENV/bin/python" -c "import cryptography as c; assert c.__file__.startswith('/usr/lib/python3.13/site-packages/'), c.__file__; print('cryptography', c.__version__, 'from Wolfi')"
      # The wheel vendors moment 2.30.1 (CVE-2026-17495, fixed 2.31.0) as static browser JS
      # in share/jupyterhub/static/components/moment; the templates load components/moment/moment.
      # Swap in the 2.31.0 npm package, which has the same layout.
      M="$VENV/share/jupyterhub/static/components/moment"
      grep -q '"version": "2.30.1"' "$M/package.json"
      python3.13 -c 'import urllib.request, sys; urllib.request.urlretrieve(sys.argv[1], "/tmp/moment.tgz")' https://registry.npmjs.org/moment/-/moment-2.31.0.tgz
      echo "efddf549c13aa7cf270f573d9c464978ab0810c0652673ae6af1189bb56ab3f8  /tmp/moment.tgz" | sha256sum -c -
      rm -rf "$M" /tmp/moment && mkdir -p "$M" /tmp/moment && tar -xzf /tmp/moment.tgz -C /tmp/moment
      cp -a /tmp/moment/package/. "$M/"
      grep -q '"version": "2.31.0"' "$M/package.json" && test -s "$M/moment.js"
      "$VENV/bin/pip" uninstall -y pip
      install -d "${dest}/opt/jupyterhub" "${dest}/usr/bin"
      cp -a "$VENV" "${dest}/opt/jupyterhub/venv"
      ln -sf /opt/jupyterhub/venv/bin/jupyterhub "${dest}/usr/bin/jupyterhub"
      chmod -R a+rX "${dest}/opt/jupyterhub"

test:
  pipeline:
    - runs: |
        /opt/jupyterhub/venv/bin/jupyterhub --version
