# Builds the Longhorn instance-manager (v1 data engine) from pinned source tarballs: libqcow,
# liblonghorn, tgt and sg3_utils in C, then longhorn-instance-manager in Go, plus upstream's package/ scripts.
package:
  name: quench-longhorn-instance-manager
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Longhorn instance-manager (v1 data engine), built from source"
  copyright:
    - license: Apache-2.0
    - license: LGPL-3.0-or-later   # libqcow
    - license: GPL-2.0-only        # tgt
    - license: BSD-2-Clause        # sg3_utils (sg_raw)
  dependencies:
    runtime:
      - bash
      - busybox
      - ca-certificates-bundle
      - cifs-utils
      - device-mapper
      - e2fsprogs
      - grpc-health-probe
      - iproute2
      - iputils
      - jq
      - kmod
      - libaio
      - mount
      - netcat-openbsd   # nc -zv, used by instance-manager-liveness-probe
      - nfs-utils
      - procps
      - qemu-utils
      - tini
      - umount
      - util-linux-misc   # nsenter
      - xfsprogs

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - gettext-dev
      - glibc-dev
      - go
      - libaio-dev
      - libtool
      - zlib-dev
      - zlib-static

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/longhorn/longhorn-instance-manager/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - uses: fetch
    with:
      uri: https://github.com/longhorn/libqcow/archive/__LIBQCOW__.tar.gz
      expected-sha256: __LIBQCOW_SHA256__
      extract: false
  - uses: fetch
    with:
      uri: https://github.com/rancher/liblonghorn/archive/__LIBLONGHORN__.tar.gz
      expected-sha256: __LIBLONGHORN_SHA256__
      extract: false
  - uses: fetch
    with:
      uri: https://github.com/rancher/tgt/archive/__TGT__.tar.gz
      expected-sha256: __TGT_SHA256__
      extract: false
  - uses: fetch
    with:
      uri: https://github.com/doug-gilbert/sg3_utils/archive/refs/tags/release-__SG3__.tar.gz
      expected-sha256: __SG3_SHA256__
      extract: false
  - name: native dependencies (libqcow static, liblonghorn, tgt, sg_raw)
    runs: |
      set -eu
      d="${{targets.destdir}}/usr/local/bin"
      install -d "$d"
      for s in __LIBQCOW__:libqcow __LIBLONGHORN__:liblonghorn __TGT__:tgt release-__SG3__:sg3; do
        mkdir "_${s#*:}"; tar xzf "${s%%:*}.tar.gz" -C "_${s#*:}" --strip-components=1
      done
      (cd _libqcow && ./configure --prefix=/usr --enable-static --disable-shared --without-libfuse >/dev/null && make -j"$(nproc)" >/dev/null && make install >/dev/null)
      test -f /usr/lib/libqcow.a
      (cd _liblonghorn && make && make install)
      # tgt: programs only (the docs need docbook). Its -Werror trips GCC 16's
      # maybe-uninitialized in bs_sheepdog.c (a backend Longhorn does not use); warnings stay on.
      sed -i 's/ -Werror / /' _tgt/usr/Makefile
      (cd _tgt && make -j"$(nproc)" programs && install -m755 usr/tgtd usr/tgtadm usr/tgtimg "$d/" && install -m755 scripts/tgt-setup-lun "$d/")
      (cd _sg3 && ./autogen.sh >/dev/null && ./configure --prefix=/usr --disable-shared >/dev/null && make -j"$(nproc)" -C lib >/dev/null && make -C src sg_raw >/dev/null && install -m755 src/sg_raw "$d/")
      for f in package/*; do case "$f" in */Dockerfile) ;; *) install -m755 "$f" "$d/" ;; esac; done
      # The process manager execs the probe by absolute path (pkg/util GRPCHealthProbe =
      # /usr/local/bin/grpc_health_probe) to see each engine and replica come up; Wolfi installs
      # it in /usr/bin. Without this every replica is killed after 60 s (found under the chart).
      ln -s /usr/bin/grpc_health_probe "$d/grpc_health_probe"
      test -x "$d/instance-manager"
      # Mount point for the launcher's `mount --rbind /host/lib/modules /lib/modules`.
      install -d "${{targets.destdir}}/usr/lib/modules"
  - name: longhorn-instance-manager
    runs: |
      set -eu
      export GOTOOLCHAIN=local CGO_ENABLED=1
      d="${{targets.destdir}}/usr/local/bin"
      # 0-CVE floors (docs/go-module-float.md), raised only where go.mod is below them; a
      # module absent from the graph is skipped. Same set as longhorn-manager.
      FLOOR="golang.org/x/crypto@v0.56.0 golang.org/x/mod@v0.40.0 golang.org/x/net@v0.58.0 golang.org/x/text@v0.41.0 google.golang.org/grpc@v1.83.2"
      # Go semver order (a release outranks its prereleases); busybox sort -V does not.
      vlt() { awk -v a="${1#v}" -v b="${2#v}" 'function pp(s,  p){sub(/\+.*/,"",s);p=index(s,"-");if(p){C=substr(s,1,p-1);P=substr(s,p+1)}else{C=s;P=""}} function cmp(x,y,  i,n,m,X,Y){n=split(x,X,".");m=split(y,Y,".");for(i=1;i<=n&&i<=m;i++){if(X[i]==Y[i])continue;if(X[i]~/^[0-9]+$/&&Y[i]~/^[0-9]+$/)return (X[i]+0<Y[i]+0)?-1:1;if(X[i]~/^[0-9]+$/)return -1;if(Y[i]~/^[0-9]+$/)return 1;return (X[i]<Y[i])?-1:1}return (n<m)?-1:(n>m)?1:0} BEGIN{pp(a);ca=C;pa=P;pp(b);cb=C;pb=P;c=cmp(ca,cb);if(c==0){if(pa==pb)c=0;else if(pa=="")c=1;else if(pb=="")c=-1;else c=cmp(pa,pb)}exit !(c<0)}'; }
      need=""
      for mv in $FLOOR; do
        have="$(GOFLAGS=-mod=mod go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${mv%@*}" 2>/dev/null)"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        vlt "$have" "${mv#*@}" && need="$need $mv"
      done
      echo "raising:${need:- nothing}"
      if [ -n "$need" ]; then
        GOFLAGS=-mod=mod go get $need
        GOFLAGS=-mod=mod go mod tidy
        GOFLAGS=-mod=mod go mod vendor
      fi
      # Static as upstream builds it (netgo, external static link).
      go build -trimpath -tags netgo -ldflags "-s -w -X main.Version=v${{package.version}} -linkmode external -extldflags -static" \
        -o "$d/longhorn-instance-manager" .
      ! readelf -d "$d/longhorn-instance-manager" | grep -q NEEDED || exit 1
      grep -aq "v${{package.version}}" "$d/longhorn-instance-manager"

test:
  pipeline:
    - runs: |
        set -eu
        /usr/local/bin/longhorn-instance-manager --version | grep -q "v${{package.version}}"
        /usr/local/bin/tgtd --version
        test -x /usr/local/bin/sg_raw
