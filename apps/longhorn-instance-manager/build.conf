# longhorn-instance-manager (longhorn/longhorn-instance-manager): runs Longhorn engine and
# replica processes on each node. V1 DATA ENGINE ONLY: the package/instance-manager entrypoint
# binds the host's /dev, /sys and /lib/modules, starts tgtd and execs longhorn-instance-manager;
# SPDK (spdk_tgt, nvme-cli, go-spdk-helper) is used only with --enable-spdk for the v2 data
# engine, which Longhorn ships disabled. SPDK is not built yet (open work in the handoff), so
# enabling v2 with this image fails at start-spdk-tgt. libqcow, tgt + liblonghorn and sg_raw are
# built from the same pins as apps/longhorn-engine.
# Latest patch of the last 3 minor lines (the Longhorn release lines).
FROM_SOURCE=1
VERSIONS=(1.11.3 1.12.1 1.13.0)
declare -A SHA256=(
  [1.11.3]=593998bdb297bea624f78a4427c91b5400eb38abbe8866b39ceea6563253e47a
  [1.12.1]=14cf59f8be3038f6a2db3b3e6d4996a7c04e92b7867faa9913c7d0d7848e3d16
  [1.13.0]=266117f2e9373ff0a556ef3102ee76fe67518681110dcc5cc4519bf9ef6c2c76
)
# dep-versions v1.11.3, v1.12.1, v1.13.0: libqcow v1.0.0 (the binary vendors the engine's cgo
# qcow package), liblonghorn v1.0.4, tgt v1.0.79+2.
LIBQCOW=be16287a2b9691347936be43fcffe93b8f74cf54
LIBQCOW_SHA256=3c06689ec4bab3f90a166b7fc49c1728dea53ac731a319782174ef197c23d1dd
LIBLONGHORN=b4ec08c32aee6e212a6f2bb8dede0862f8c8372e
LIBLONGHORN_SHA256=ab617466e14304a9cf567927aa1c772ef45c64c93d7cd63c6e634469d445db6f
TGT=c0d56b89b449f910a69fff22fe388293e000fc21
TGT_SHA256=f3ea502a5cf0aeefc1cb3ace30b8caa8a93196c467891e9e1c18ce00c8417df7
SG3=1.49
SG3_SHA256=b1eac8f50cf588fb777a1fb615598d8d70bef1adb15a14148761035a9a43a847
render() {
  echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g; s|__LIBQCOW__|$LIBQCOW|g; s|__LIBQCOW_SHA256__|$LIBQCOW_SHA256|g; s|__LIBLONGHORN__|$LIBLONGHORN|g; s|__LIBLONGHORN_SHA256__|$LIBLONGHORN_SHA256|g; s|__TGT__|$TGT|g; s|__TGT_SHA256__|$TGT_SHA256|g; s|__SG3__|$SG3|g; s|__SG3_SHA256__|$SG3_SHA256|g"
}
