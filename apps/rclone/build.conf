# rclone: from-source via melange (Go build from the git tag tarball).
# Image-only (a CLI to sync files to/from cloud storage, no chart). Newest patch
# of the newest minor line (1.74). Single static Go binary, CGO disabled.
# Version is stamped via -X on github.com/rclone/rclone/fs.Version.
FROM_SOURCE=1
VERSIONS=(1.74.3)
declare -A SHA256=(
  [1.74.3]=3ba8bc7fb216f8f0307357ac67842467f453050468d5751e9269954819148568
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
