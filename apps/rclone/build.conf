# rclone: from-source via melange (Go build from the git tag tarball).
# Image-only (a CLI to sync files to/from cloud storage, no chart). Latest patch
# of the last 3 minor lines (1.72, 1.73, 1.74). Single static Go binary, CGO
# disabled. Version is stamped via -X on github.com/rclone/rclone/fs.Version.
FROM_SOURCE=1
VERSIONS=(1.72.1 1.73.5 1.74.3)
declare -A SHA256=(
  [1.72.1]=322c73932b533571880832c0e07abdf9492c7f329b7d1dcdbd2a195fa2635a77
  [1.73.5]=e52541bc238dd434a0335f467697d7d9575529698a74aab534ad39b8649f8a49
  [1.74.3]=3ba8bc7fb216f8f0307357ac67842467f453050468d5751e9269954819148568
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
