# Builds rclone from source onto Wolfi. Single static Go binary, no CGO. The
# version is stamped via -X so `rclone version` reports the real release. Output
# is a signed APK in Quenchworks' own repo. No upstream distro binaries.
# Image-only (CLI to sync files to/from cloud storage, no chart).
package:
  name: quench-rclone
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened rclone, built from source on Wolfi"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/rclone/rclone/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      # 0-CVE gate: bump golang.org/x/image past the WebP/VP8 DoS CVEs
      # (CVE-2026-33813, CVE-2026-46601). Minor bump within v0, same major.
      # Also float golang.org/x/net (CVE-2026-46600, dnsmessage panic) and
      # golang.org/x/text (CVE-2026-56852, infinite loop) to their fixed minors.
      # 0-CVE FLOORS, not pins (docs/go-module-float.md): raise a module only where go.mod has it
      # below the floor; a module absent from the graph is skipped. Bare `go get` pins downgraded
      # newer upstream releases (found 2026-10-05).
      # grpc: 1.75.1 requires a master pseudo-version (v1.84.0-dev.0.20260723...), above the
      # released fix 1.83.2, so a 1.83.2 floor raised nothing and CVE-2026-84445 shipped
      # (CI 37279287533). The floor is the fix commit on that same dev line (2026-10-05).
      FLOOR="golang.org/x/image@v0.43.0 golang.org/x/net@v0.58.0 golang.org/x/sys@v0.47.0 google.golang.org/grpc@v1.84.0-dev.0.20260825144003-d5a41119e0e3 golang.org/x/crypto@v0.56.0 golang.org/x/text@v0.41.0"
      # Go semver order (a release outranks its prereleases); busybox sort -V does not.
      vlt() { awk -v a="${1#v}" -v b="${2#v}" 'function pp(s,  p){sub(/\+.*/,"",s);p=index(s,"-");if(p){C=substr(s,1,p-1);P=substr(s,p+1)}else{C=s;P=""}} function cmp(x,y,  i,n,m,X,Y){n=split(x,X,".");m=split(y,Y,".");for(i=1;i<=n&&i<=m;i++){if(X[i]==Y[i])continue;if(X[i]~/^[0-9]+$/&&Y[i]~/^[0-9]+$/)return (X[i]+0<Y[i]+0)?-1:1;if(X[i]~/^[0-9]+$/)return -1;if(Y[i]~/^[0-9]+$/)return 1;return (X[i]<Y[i])?-1:1}return (n<m)?-1:(n>m)?1:0} BEGIN{pp(a);ca=C;pa=P;pp(b);cb=C;pb=P;c=cmp(ca,cb);if(c==0){if(pa==pb)c=0;else if(pa=="")c=1;else if(pb=="")c=-1;else c=cmp(pa,pb)}exit !(c<0)}'; }
      need=""
      for mv in $FLOOR; do
        have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${mv%@*}" 2>/dev/null)"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        vlt "$have" "${mv#*@}" && need="$need $mv"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || go get $need
      go mod tidy
      go build -trimpath \
        -ldflags "-s -w -X github.com/rclone/rclone/fs.Version=v${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/rclone" .
