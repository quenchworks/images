# Builds rclone from source onto Wolfi. Single static Go binary, no CGO. The
# version is stamped via -X so `rclone version` reports the real release. Output
# is a signed APK in Quenchworks' own repo. No upstream distro binaries.
# Image-only (CLI to sync files to/from cloud storage, no chart).
package:
  name: quench-rclone
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened rclone, built from source on Wolfi"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/rclone/rclone/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      # 0-CVE gate: bump golang.org/x/image past the WebP/VP8 DoS CVEs
      # (CVE-2026-33813, CVE-2026-46601). Minor bump within v0, same major.
      # Also float golang.org/x/net (CVE-2026-46600, dnsmessage panic) and
      # golang.org/x/text (CVE-2026-56852, infinite loop) to their fixed minors.
      # 0-CVE FLOORS, not pins (docs/go-module-float.md): raise a module only where go.mod has it
      # below the floor; a module absent from the graph is skipped. Bare `go get` pins downgraded
      # newer upstream releases (found 2026-10-05).
      FLOOR="golang.org/x/image@v0.43.0 golang.org/x/net@v0.58.0 golang.org/x/sys@v0.47.0 google.golang.org/grpc@v1.83.2 golang.org/x/crypto@v0.56.0 golang.org/x/text@v0.41.0"
      need=""
      for mv in $FLOOR; do
        have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${mv%@*}" 2>/dev/null)"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        [ "$(printf '%s\n%s\n' "$have" "${mv#*@}" | sort -V | head -1)" = "${mv#*@}" ] || need="$need $mv"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || go get $need
      go mod tidy
      go build -trimpath \
        -ldflags "-s -w -X github.com/rclone/rclone/fs.Version=v${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/rclone" .
