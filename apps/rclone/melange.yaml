# Builds rclone from source onto Wolfi. Single static Go binary, no CGO. The
# version is stamped via -X so `rclone version` reports the real release. Output
# is a signed APK in Quenchworks' own repo. No upstream distro binaries.
# Image-only (CLI to sync files to/from cloud storage, no chart).
package:
  name: quench-rclone
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened rclone, built from source on Wolfi"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/rclone/rclone/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      go build -trimpath \
        -ldflags "-s -w -X github.com/rclone/rclone/fs.Version=v${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/rclone" .
