# headscale: from-source via melange (Go build of ./cmd/headscale from the git
# tag tarball). Image-only (a Tailscale control server, no chart). NEWEST-ONLY:
# just the latest stable tag (juanfont/headscale tags carry a "v" prefix; the
# bare X.Y.Z is used here). Single static Go binary, CGO disabled.
FROM_SOURCE=1
VERSIONS=(0.29.7)
declare -A SHA256=(
  [0.29.7]=625e8f877ddcbacd0936dcd9bb191ea7b8914ef9f653b3e1a3b5fa6c611a36c8
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
