# Builds headscale (juanfont/headscale, an open-source Tailscale control server)
# from source onto Wolfi. Single static Go binary, no CGO (matches upstream
# .goreleaser.yml CGO_ENABLED=0). Output is a signed APK in Quenchworks' own
# repo. No upstream distro binaries. Image-only (a server, no chart).
#
# Version stamping: headscale reads its own version from the Go build-info main
# module version (hscontrol/types.GetVersionInfo -> debug.ReadBuildInfo().
# Main.Version), NOT from an -X ldflag -- upstream's `-X main.version` is dead
# code against a variable that no longer exists. A plain build of the release
# tarball has no VCS metadata, so it reports "dev". We recreate a one-commit git
# repo tagged with the release so Go 1.24+ VCS stamping records
# Main.Version = v<ver> -- the exact mechanism upstream's release binaries use.
#
# go.mod declares go 1.26.4; we build with go-1.26 (newest, clears stdlib CVE
# advisories) and GOTOOLCHAIN=local so go.mod's directive does not trigger a
# toolchain download. GOFLAGS=-mod=mod lets the module graph resolve patched deps.
package:
  name: quench-headscale
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened headscale (Tailscale control server), built from source on Wolfi"
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - go-1.26

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/juanfont/headscale/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      export GOTOOLCHAIN=local
      export HOME="$(mktemp -d)"
      # Tag a throwaway one-commit repo so Go's VCS stamping sets Main.Version.
      git config --global --add safe.directory '*'
      git init -q
      git config user.email build@quench-works.com
      git config user.name quenchworks
      git add -A
      git commit -qm "v${{package.version}}"
      git tag "v${{package.version}}"
      # 0-CVE gate: golang.org/x/text v0.38.0 carries CVE-2026-56852, fixed in
      # 0.39.0 (safe patch bump within the module graph).
      # otel CVE-2026-81870 / CVE-2026-81871: the published image drifted onto these
      # after release. Every module listed is one this app's own go.mod carries; a
      # floor naming a module absent from the graph is rejected by some recipes.
      # 0-CVE FLOORS, not pins (docs/go-module-float.md): raise a module only where go.mod has it
      # below the floor; a module absent from the graph is skipped. Bare `go get` pins downgraded
      # newer upstream releases (found 2026-10-05).
      FLOOR="golang.org/x/text@v0.41.0 golang.org/x/net@v0.58.0 golang.org/x/crypto@v0.56.0 golang.org/x/sys@v0.47.0 google.golang.org/grpc@v1.83.2 go.opentelemetry.io/otel@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.45.0 go.opentelemetry.io/otel/metric@v1.45.0 go.opentelemetry.io/otel/trace@v1.45.0"
      # Go semver order (a release outranks its prereleases); busybox sort -V does not.
      vlt() { awk -v a="${1#v}" -v b="${2#v}" 'function pp(s,  p){sub(/\+.*/,"",s);p=index(s,"-");if(p){C=substr(s,1,p-1);P=substr(s,p+1)}else{C=s;P=""}} function cmp(x,y,  i,n,m,X,Y){n=split(x,X,".");m=split(y,Y,".");for(i=1;i<=n&&i<=m;i++){if(X[i]==Y[i])continue;if(X[i]~/^[0-9]+$/&&Y[i]~/^[0-9]+$/)return (X[i]+0<Y[i]+0)?-1:1;if(X[i]~/^[0-9]+$/)return -1;if(Y[i]~/^[0-9]+$/)return 1;return (X[i]<Y[i])?-1:1}return (n<m)?-1:(n>m)?1:0} BEGIN{pp(a);ca=C;pa=P;pp(b);cb=C;pb=P;c=cmp(ca,cb);if(c==0){if(pa==pb)c=0;else if(pa=="")c=1;else if(pb=="")c=-1;else c=cmp(pa,pb)}exit !(c<0)}'; }
      need=""
      for mv in $FLOOR; do
        have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${mv%@*}" 2>/dev/null)"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        vlt "$have" "${mv#*@}" && need="$need $mv"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || go get $need
      go mod tidy
      go build -trimpath -ldflags "-s -w" \
        -o "${{targets.destdir}}/usr/bin/headscale" ./cmd/headscale
