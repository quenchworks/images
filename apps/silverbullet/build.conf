# silverbullet: SilverBullet (silverbulletmd/silverbullet, MIT), a Markdown note-taking and personal knowledge platform
# with Lua scripting, live queries, templates and an offline-capable web app. Images issue #92.
#
# From the release tag: npm ci + npm run build (plugs and the client bundle), then the Rust server with cargo
# auditable, which embeds the bundle (rust-embed). zip moves from 8 to 9 (fixes only on 9; miniserve took the same
# step) and cargo update floats the rest of the lock to patch releases. glibc on Wolfi; the space lives on /data.
# Shell commands are off (no shell in the image). LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(2.12.1)
declare -A SHA256=(
  [2.12.1]=d263988e8ad048bf1d1338d038e3a1bfd80c80844297186d726cafbe3f8a35e5
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
