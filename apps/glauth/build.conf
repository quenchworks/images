# GLAuth (glauth/glauth, MIT): a lightweight LDAP server. Users and groups come from a TOML config
# (or a SQL/plugin backend) with bcrypt or SHA-256 passwords, TOTP and per-user capabilities, for
# apps that only speak LDAP. From the release tag via melange: the v2 module built CGO-free with
# upstream's noembed tag, the house golang.org/x floor and the OpenTelemetry 1.47 train raised
# only where below (and asserted in the shipped binary). LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(2.5.4)
declare -A SHA256=(
  [2.5.4]=b81717a2628c477ea5a66d1d3573143b02f79e2088ffb05fadb1e20ef38ab3f8
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
