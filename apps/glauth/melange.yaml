# GLAuth from the release tag: the v2 module, a static binary at /usr/bin/glauth.
package:
  name: quench-glauth
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened GLAuth LDAP server, built from source on Wolfi"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.26

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/glauth/glauth/archive/refs/tags/GLAuth-v${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - name: Build
    working-directory: v2
    runs: |
      set -eu
      # upstream has a go.work at the repo root; build the v2 module on its own
      export CGO_ENABLED=0 GOTOOLCHAIN=local GOFLAGS=-mod=mod GOWORK=off
      FLOOR="golang.org/x/crypto@v0.58.1-0.20261009181718-2f1f834330b2 golang.org/x/net@v0.62.0 golang.org/x/text@v0.43.0 golang.org/x/sys@v0.49.0"
      # CVE-2026-128085 (otel 1.47.0): floor every otel v1 module the build uses, as one family
      for m in $(go list -mod=mod -m -e -f '{{.Path}} {{.Version}}' all | awk '($1 ~ /^go\.opentelemetry\.io\/otel(\/|$)/ || $1 ~ /^go\.opentelemetry\.io\/contrib\/bridges\/otel(zap|logrus|slog)$/) && $1 !~ /\/exporters\/jaeger$/ { if ($1 ~ /\/contrib\/bridges\//) print $1"@v0.21.0"; else if ($1 ~ /\/exporters\/(otlp\/otlplog\/|stdout\/stdoutlog$)/) print $1"@v0.23.0"; else if ($1 ~ /\/exporters\/prometheus$/) print $1"@v0.69.0"; else if ($2 ~ /^v1\./ || $1 ~ /\/(sdk\/)?log$/) print $1"@v1.47.0" }'); do
        FLOOR="$FLOOR $m"
      done
      MODS="$(echo "$FLOOR" | tr ' ' '\n' | cut -d@ -f1)"
      # prints "<mod>@<floor> (<tag> has <ver>)" for every module below its floor
      below_floor() {
        awk -v floor="$FLOOR" -v tag="$1" '
          BEGIN { n = split(floor, f, " ")
                  for (i = 1; i <= n; i++) { split(f[i], kv, "@"); want[kv[1]] = kv[2] } }
          ($1 in want) {
            split(substr($2, 2), g, "."); split(substr(want[$1], 2), w, ".")
            for (i = 1; i <= 3; i++) {
              if ((g[i] + 0) > (w[i] + 0)) next
              if ((g[i] + 0) < (w[i] + 0)) { print $1 "@" want[$1] " (" tag " has " $2 ")"; next }
            }
          }'
      }
      # `go list -m` prints "<mod> <ver>" or "<mod> <ver> => <mod> <ver>", so $NF is
      # the EFFECTIVE version and a replace cannot hide behind the require line.
      go list -m -e $MODS
      need="$(go list -m -e $MODS | awk 'NF >= 2 && $NF ~ /^v[0-9]/ { print $1, $NF }' | below_floor go.mod | awk '{ print $1 }')"
      # no go mod tidy: it checks every build tag, and pkg/embed (the embedsqlite build) is only
      # generated by upstream's Makefile, so tidy fails on it; go get keeps go.mod and go.sum right
      if [ -n "$need" ]; then go get $need; fi
      # upstream's Makefile: -tags noembed (the sqlite/pam plugins are separate builds)
      go build -trimpath -tags noembed -buildvcs=false -ldflags "-s -w" -o "${{targets.destdir}}/usr/bin/glauth" .
      # The float is only real if it reached the BINARY. Every `dep`/`=>` line of
      # `go version -m` must be at or above its floor -- the `=>` line is what
      # catches a replace-shadowed float. Fail the build rather than ship it.
      bad="$(go version -m "${{targets.destdir}}/usr/bin/glauth" \
        | awk '$1 == "dep" || $1 == "=>" { print $2, $3 }' | below_floor glauth)"
      [ -z "$bad" ] || { echo "the floor did not reach the binary:"; echo "$bad"; exit 1; }

      "${{targets.destdir}}/usr/bin/glauth" --version 2>&1 | grep -F "v${{package.version}}"

  - name: Default config
    runs: |
      set -eu
      install -d "${{targets.destdir}}/etc/glauth"
      cat > "${{targets.destdir}}/etc/glauth/glauth.cfg" <<'CFG'
      # QuenchWorks GLAuth default: plain LDAP on 3893, no users. Mount your own config over this
      # file (the chart renders one): users, groups and passwords live there.
      debug = false
      [ldap]
        enabled = true
        listen = "0.0.0.0:3893"
      [ldaps]
        enabled = false
      [backend]
        datastore = "config"
        baseDN = "dc=glauth,dc=com"
      [behaviors]
        IgnoreCapabilities = false
        LimitFailedBinds = true
        NumberOfFailedBinds = 3
        PeriodOfFailedBinds = 10
        BlockFailedBindsFor = 60
        PruneSourceTableEvery = 600
        PruneSourcesOlderThan = 600
      CFG

test:
  pipeline:
    - runs: |
        glauth --version
