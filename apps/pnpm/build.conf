# pnpm: from-source via melange. Wolfi's pnpm apk lags upstream, so we install
# the PREBUILT pnpm release straight from the npm registry tarball onto the
# hardened Wolfi nodejs-22 runtime. Latest patch of the 3 maintained lines
# (9, 10, 11); each pinned by its npm-tarball sha256. tag = full X.Y.Z.
#   __VER__    = pnpm version (tag + npm tarball)
#   __SHA256__ = npm tarball sha256
FROM_SOURCE=1
VERSIONS=(11.17.0)
declare -A SHA256=(
  [11.17.0]=644eb5079654e87dae59a07e62d7f098162b9ce58f06077328b5ddefca1c8541
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
