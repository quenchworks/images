# pnpm: Wolfi pnpm package on nodejs-22. VERSIONS = pnpm major line (tag);
# apko carries __PNPMPKG__ = the Wolfi package per major (10 -> pnpm=~10, 11 -> pnpm-11).
FROM_SOURCE=0
VERSIONS=(10 11)
render() { case "$1" in 11) echo "s/__PNPMPKG__/pnpm-11/g";; *) echo "s/__PNPMPKG__/pnpm=~$1/g";; esac; }
