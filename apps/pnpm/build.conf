# STATUS 2026-10-22: 11.28.5 and 12.10.1 shipped, both published 2026-10-06 and past the
# 14-day package-manager cooldown. 11.28.7 and 12.15.0 (both 2026-10-21) DEFERRED on the
# same cooldown to 2026-11-04.
# STATUS: UNBLOCKED 2026-09-20. The zlib wall is gone, and the reason is that
# the advisory moved, not the package: Wolfi shipped the CVE-2026-85091 fix as
# zlib 1.3.2.1_rc20260601-r0 and the advisory was amended to name that version.
# The "advisory wants 1.3.3-r0" line this block used to carry was a snapshot of
# the advisory as it read in September, and it went stale without any signal.
# A stock wolfi-base scan now reports `zlib 1.3.2-r7 -> 1.3.2.1_rc20260601-r0`.
#
# Evidence, stated exactly as measured:
#   x86_64  gated locally 2026-09-20, PUSH=0: 0 fixable CVEs AND the boot test
#           passed, so this is "runs", not just "scans clean".
#   aarch64 not measured locally; this host kills background melange builds.
#           Standing in for it: run 35096470145, cited above, measured BOTH
#           arches and found exactly one finding, the zlib row now cleared.
#           CI re-measures both arches and refuses to publish on any finding.
#
# Getting here took a melange fix: pnpm 11.27.0 dropped the artifacts/exe/
# standalone-executable payload from its npm tarball, so the recipe's hardcoded
# layout guard on artifacts/exe/dist/node_modules/tar fired and killed the
# pipeline ~14s in. The vendored tar copies are now discovered, not hardcoded.
# Nothing in the pnpm bundle itself is flagged (vendored tar is 7.5.22, at floor).
#
# pnpm: from-source via melange. Wolfi's pnpm apk lags upstream, so we install
# the PREBUILT pnpm release straight from the npm registry tarball onto the
# hardened Wolfi nodejs-22 runtime. Latest patch of each shipped major (11 and 12 as
# of 2026-09-24; 12 needs node >= 18); each pinned by its npm-tarball sha256. tag = full X.Y.Z.
#   __VER__    = pnpm version (tag + npm tarball)
#   __SHA256__ = npm tarball sha256
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(11.28.11 12.18.0)
declare -A SHA256=(
  [11.28.4]=a4f318bc906d7fe28707f894e7bc86c0d134a8dcff5d5f37f1e18d7c1687cf6d
  [12.9.1]=44c80447645c2a1d8da9308d3efedcec6ca2db4579183abcb15d8a90a88277d4
  [11.28.5]=1ef4e447a68713656064f3f174c0f44719960a043a3fe2299169d08cf1dbf8ee
  [12.10.1]=992070e422dae33eac72268ffbde465e14dae81ed250149299d1fee3d842d60e
  [11.28.10]=4cc170b9f8b28abc79e1473af97cbe9dc44854aa3fc192ec56239f66921609a2
  [12.17.0]=6d776e285187f9e334d8826cc5a88e82e41606345f196a5a93f4403bd332553e
  [11.28.11]=503ca17f40400740765635d01f6fa7d932efe533604d6f6fe73bd8b489e73ebb
  [12.18.0]=29d1d7d99bf6ec6d0a3dbb0ec5656f0d16e997e8be676ca45c581d11cb71f753
)
# pnpm 12 is a Rust rewrite. Its npm package is only a locator for a native binary
# published per platform as @pnpm/exe.<os>-<arch>, so 12.x installs that binary (sha256
# per arch, npm sha512 integrity checked when pinned) and runs it directly; 11.x stays the
# JS bundle run through node. ENTRY is the apko entrypoint for each.
declare -A EXE_SHA_AMD=( [12.18.0]=679df2eedf158f639db6d1f00e713d766d0d7afc6a931bc51497a625d1e1bdf7 [12.9.1]=9581c9b2571491f9e00c841cb29864cc3bf96e66f82d55ef5bad70f8f06d1808 [12.10.1]=636abc81221a03b94f0c362bebbf0007dfce977226ad5290afed1fdaa5320aa4 [12.17.0]=6c1c71d00f82765d8f7488df6d1a94533fd1ad5d47c86da41211b1da1093c9d4 )
declare -A EXE_SHA_ARM=( [12.18.0]=2e326930b9b670712df1c93849d725c85f6b897cdf9239ee724b587c50ddd5bc [12.9.1]=90530afe00c62fefd1f09d1a9b0aea058d28fd0862eeb2231de9151ffa36d291 [12.10.1]=45026cc79a8c5d06c604a4a624198cf96fcad7d9ab960c9a92401a0c97c93388 [12.17.0]=017e0264aac3a955e34d82f5d94c100504a791c0dd387f111b7a984024115d50 )
entry() { if [ "${1%%.*}" -ge 12 ]; then echo /usr/bin/pnpm; else echo "/usr/bin/node /usr/lib/node_modules/pnpm/bin/pnpm.cjs"; fi; }
render() {
  echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g; s|__EXE_SHA_AMD__|${EXE_SHA_AMD[$1]:-none}|g; s|__EXE_SHA_ARM__|${EXE_SHA_ARM[$1]:-none}|g; s|__ENTRY__|$(entry "$1")|g"
}
