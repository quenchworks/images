# STATUS: UNBLOCKED 2026-09-20. The zlib wall is gone, and the reason is that
# the advisory moved, not the package: Wolfi shipped the CVE-2026-85091 fix as
# zlib 1.3.2.1_rc20260601-r0 and the advisory was amended to name that version.
# The "advisory wants 1.3.3-r0" line this block used to carry was a snapshot of
# the advisory as it read in September, and it went stale without any signal.
# A stock wolfi-base scan now reports `zlib 1.3.2-r7 -> 1.3.2.1_rc20260601-r0`.
#
# Evidence, stated exactly as measured:
#   x86_64  gated locally 2026-09-20, PUSH=0: 0 fixable CVEs AND the boot test
#           passed, so this is "runs", not just "scans clean".
#   aarch64 not measured locally; this host kills background melange builds.
#           Standing in for it: run 35096470145, cited above, measured BOTH
#           arches and found exactly one finding, the zlib row now cleared.
#           CI re-measures both arches and refuses to publish on any finding.
#
# Getting here took a melange fix: pnpm 11.27.0 dropped the artifacts/exe/
# standalone-executable payload from its npm tarball, so the recipe's hardcoded
# layout guard on artifacts/exe/dist/node_modules/tar fired and killed the
# pipeline ~14s in. The vendored tar copies are now discovered, not hardcoded.
# Nothing in the pnpm bundle itself is flagged (vendored tar is 7.5.22, at floor).
#
# pnpm: from-source via melange. Wolfi's pnpm apk lags upstream, so we install
# the PREBUILT pnpm release straight from the npm registry tarball onto the
# hardened Wolfi nodejs-22 runtime. Latest patch of each shipped major (11 and 12 as
# of 2026-09-24; 12 needs node >= 18); each pinned by its npm-tarball sha256. tag = full X.Y.Z.
#   __VER__    = pnpm version (tag + npm tarball)
#   __SHA256__ = npm tarball sha256
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(11.27.1 12.6.0)
declare -A SHA256=(
  [11.27.1]=d50f8841e67ef0b1d82e7c90b240656c7ca04d5f1aa33f06108007c81fd76766
  [12.6.0]=05b7b921fbb31564505c967eabf825895a1cc18f50935c00be98815272cc9d56
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
