# uv: self-contained uv binary from Wolfi (FROM_SOURCE=0, apko-only, 0-CVE), on a
# pinned CPython minor. Latest 3 stable uv releases, each pinned to its exact apk;
# tag = X.Y.Z. The target interpreter (python-3.13 + pip) stays fixed.
FROM_SOURCE=0
VERSIONS=(0.11.31 0.11.32 0.11.33)
declare -A PIN=( [0.11.31]=0.11.31-r0 [0.11.32]=0.11.32-r0 [0.11.33]=0.11.33-r0 )
render() { echo "s|__PKG__|uv=${PIN[$1]}|g; s/__PYVER__/3.13/g"; }
