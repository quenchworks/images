# STATUS: ZLIB-ONLY as of 2026-09-16. Measured, not assumed: run 35066970404
# on af0623d gated with exactly one finding, zlib CVE-2026-85091, on every
# version and both arches. Nothing else in this image is flagged.
#
# Wolfi is at 1.3.2.1_rc20260601-r0 and the advisory wants 1.3.3-r0, which
# upstream madler/zlib has never tagged. Downgrading to Wolfi's 1.3.1-r51
# is not a way out either: it predates the 1.3.2-r0 fix for CVE-2026-27171.
#
# BLOCKED=1 skips build+merge so sweeps stop burning a red run here. Clear
# it with scripts/blocked.py --dispatch once Wolfi ships zlib 1.3.3-r0.
# uv: self-contained uv binary from Wolfi (FROM_SOURCE=0, apko-only, 0-CVE), on a
# pinned CPython minor. Latest 3 stable uv releases, each pinned to its exact apk;
# tag = X.Y.Z. The target interpreter (python-3.13 + pip) stays fixed.
BLOCKED=1
FROM_SOURCE=0
VERSIONS=(0.12.3 0.12.4 0.12.5)
# test.sh's 2nd arg is the PYTHON minor uv targets, not uv's own version: it asserts
# `python3 --version` starts with it. build-workflow passes "3.13"; the local gate
# defaults this arg to the app version, which made the test compare Python 3.13.15
# against "Python 0.12.5" and fail an image that runs fine.
boot_arg2() { echo "3.13"; }
declare -A PIN=(
  [0.12.3]=0.12.3-r0
  [0.12.4]=0.12.4-r0
  [0.12.5]=0.12.5-r0
)
render() { echo "s|__PKG__|uv=${PIN[$1]}|g; s/__PYVER__/3.13/g"; }
