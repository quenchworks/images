# csi-resizer (kubernetes-csi/external-resizer): the CSI external-resizer, which expands CSI volumes when a PersistentVolumeClaim grows. A Kubernetes CSI
# sidecar used by every CSI driver (Longhorn pins it in dep-versions). From source, static Go (CGO
# off), version stamped via -X main.version as release-tools/build.make does. Upstream's layout:
# the binary at /csi-resizer, root by default (upstream's image is distroless/static, uid 0; the
# CSI socket it dials is created by the driver, usually as root).
# Latest patch of the last 3 minor lines.
FROM_SOURCE=1
VERSIONS=(2.1.0 2.2.1 2.3.0)
declare -A SHA256=(
  [2.1.0]=bc7acbbef45d486b9f91f781bb15f38436250867a413f5d8dd06ec612cb66ae1
  [2.2.1]=1ad9528cc11a066c7e168ef89b22b0d9f0468b906f7d8ba9a2b2f327064b93cf
  [2.3.0]=0433c66839436e480e3cf0f583b400b26e21dbee23d4d6fd63d41400b682e1a2
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
