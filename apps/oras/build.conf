# oras: ORAS, the CLI that pushes and pulls arbitrary artifacts to and from OCI
# registries, built from source on Wolfi (static Go, no cgo). Image only, no chart.
#
# Why not Wolfi's oras apk: measured 2026-09-25, 1.3.4-r0 links x/crypto v0.52.0,
# below its 0.55.0 fix.
#
# NEWEST-ONLY: ORAS ships one supported line.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(1.3.4)
# sha256 of the GitHub tag tarball, computed from a download
declare -A SHA256=(
  [1.3.4]=0967062b09d82c902e7f6bdd22fc6dd4577811bf46ba63dab8791ff047c55392
)
# the tag's commit, stamped into `oras version`
declare -A COMMIT=(
  [1.3.4]=db9e29505c3059f2b8fde34ae8cae266c5c765e9
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g; s|__COMMIT__|${COMMIT[$1]}|g"; }
