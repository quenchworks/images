package:
  name: quench-filebrowser-quantum
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened FileBrowser Quantum (web file manager), built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - ffmpeg
      - mailcap
      - tzdata

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27
      - nodejs-24
      - npm

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/gtsteffaniak/filebrowser/archive/refs/tags/v${{package.version}}-stable.tar.gz
      expected-sha256: __SHA256__

  - name: Build the web UI into backend/internal/web/embed
    runs: |
      set -eu
      export npm_config_cache="$(mktemp -d)" HOME="$(mktemp -d)"
      cd frontend
      npm ci --no-audit --no-fund
      npm run build
      test -f ../backend/internal/web/embed/index.html

  - name: Build the filebrowser binary (CGO off, no mupdf, no analytics)
    runs: |
      set -eu
      cd backend
      export CGO_ENABLED=0 GOFLAGS=-mod=mod GOTOOLCHAIN=local
      FLOOR="golang.org/x/image@v0.45.0 golang.org/x/text@v0.43.0 golang.org/x/net@v0.62.0 golang.org/x/crypto@v0.58.1-0.20261009181718-2f1f834330b2 golang.org/x/sys@v0.49.0 google.golang.org/grpc@v1.83.2 github.com/go-jose/go-jose/v4@v4.1.6"
      for mv in $FLOOR; do
        m="${mv%@*}"; want="${mv#*@}"
        have="$(go list -m -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "$m" 2>/dev/null || true)"
        [ -n "$have" ] || continue
        [ "$(printf '%s\n%s\n' "$have" "$want" | sort -V | head -1)" = "$want" ] || go get "$mv"
      done
      go mod tidy
      go build -trimpath \
        -ldflags "-s -w -X github.com/gtsteffaniak/filebrowser/backend/internal/version.Version=v${{package.version}} -X github.com/gtsteffaniak/filebrowser/backend/internal/version.CommitSHA=__COMMIT__" \
        -o "${{targets.destdir}}/usr/bin/filebrowser" .
      "${{targets.destdir}}/usr/bin/filebrowser" version | grep -q "v${{package.version}}"
      # the image's config: port 8080 (nonroot), files under /srv, cache in /tmp
      install -d "${{targets.destdir}}/etc/filebrowser"
      cat > "${{targets.destdir}}/etc/filebrowser/config.yaml" <<'CFG'
      http:
        port: 8080
        baseURL: "/"
      server:
        cacheDir: /tmp/filebrowser
        sources:
          - path: /srv
      auth:
        methods:
          password:
            enabled: true
            minLength: 5
            signup: false
      CFG

test:
  pipeline:
    - runs: |
        filebrowser version
        test -s /etc/filebrowser/config.yaml
