# filebrowser-quantum: FileBrowser Quantum (gtsteffaniak/filebrowser, Apache-2.0), the active
# successor to File Browser (filebrowser/filebrowser, archived 2026-07; our filebrowser image is
# End of life). Built from the -stable release tag: the Vue/Vite UI (npm ci + `npm run build`,
# which copies it into backend/internal/web/embed) is go:embedded into one static binary.
# Built WITHOUT upstream's `mupdf` tag (MuPDF is AGPL; it adds PDF previews only) and WITHOUT
# `analytics` (it posts usage events to api.filebrowserquantum.com). CGO off: the database
# uses the modernc pure-Go SQLite driver. Video previews use Wolfi's ffmpeg.
# Upstream tags stable releases as vX.Y.Z-stable; VERSIONS holds X.Y.Z, the image tag.
FROM_SOURCE=1
VERSIONS=(2.0.2)
declare -A SHA256=(
  [2.0.2]=8e0c64a76f8f1739251ce886e25e2fcfb486cc7d8605336e87c907404f2e4b2e
)
declare -A COMMIT=(
  [2.0.2]=2c071d1e6eb48d4b88da2657885d345663a0a88b
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g; s|__COMMIT__|${COMMIT[$1]}|g"; }
