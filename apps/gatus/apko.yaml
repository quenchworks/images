# Gatus runtime: gatus is the entrypoint; reads GATUS_CONFIG_PATH (default /config/config.yaml), serves on 8080.
# Nonroot 1001, so listen on ports above 1023 unless the pod grants NET_BIND_SERVICE.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-gatus@local

accounts:
  groups:
    - groupname: gatus
      gid: 1001
  users:
    - username: gatus
      uid: 1001
      gid: 1001
  run-as: 1001

environment:
  GATUS_CONFIG_PATH: /config/config.yaml

entrypoint:
  command: /usr/bin/gatus

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-gatus"
  org.opencontainers.image.licenses: "Apache-2.0"
  org.opencontainers.image.version: "__VER__"
