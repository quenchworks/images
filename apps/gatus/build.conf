# Gatus (TwiN/gatus, Apache-2.0): a health dashboard and uptime monitor. Checks HTTP, TCP, DNS,
# ICMP and TLS endpoints against conditions, keeps history, serves a status page and alerts.
# From source via melange: one static Go binary (the web UI is prebuilt in the repo and
# embedded; upstream stamps no version). Newest patch of the last three minor lines.
FROM_SOURCE=1
VERSIONS=(5.36.0 5.37.0 5.38.0)
declare -A SHA256=(
  [5.36.0]=b5543af591e602281406049ee2f822a6529a8f14be0cd54df5a31c210520159a
  [5.37.0]=a58ddb7052086218f404185803d3423be3985aa7b8f4f3c7ab4444a7b307fcf8
  [5.38.0]=31f14f397188e3d1ffcc8917f0d249572ae5fffb99fe7121d122a90adfb65931
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
