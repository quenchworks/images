# Builds the vCluster syncer from source onto Wolfi. Flags follow upstream's
# .goreleaser.yaml (id: vcluster): CGO off, -trimpath, version via
# -X github.com/loft-sh/vcluster/pkg/telemetry.SyncerVersion. The binary lands at
# /usr/bin/vcluster with /vcluster beside it, the path upstream's image and chart
# exec (`/vcluster start`).
package:
  name: quench-vcluster
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened vCluster syncer, built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata
      - zstd

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/loft-sh/vcluster/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  # kube-apiserver and kube-controller-manager 1.36.4, built here instead of taken from
  # Wolfi: its 1.36 recipe left the public repo and the advisory's fixed 1.36.4-r10
  # (otlptrace CVE-2026-81870) never reached the index, which tops out at r8. vcluster
  # 0.37 supports Kubernetes up to 1.36, so Wolfi's 1.37 is no substitute.
  - runs: mkdir -p kubernetes
  - uses: fetch
    with:
      uri: https://github.com/kubernetes/kubernetes/archive/refs/tags/v1.36.4.tar.gz
      expected-sha256: 86a216801ddba7098a50c6f3b3fe5fbc28ba34ea5b1daa66d81c2d5307c301ac
      directory: kubernetes
  # kine (the SQLite store the syncer starts), built here instead of taken from Wolfi: kine
  # 0.17.5-r0 floors x/net only and still links x/crypto v0.58.0 (GO-2026-5932).
  - runs: mkdir -p kine
  - uses: fetch
    with:
      uri: https://github.com/k3s-io/kine/archive/refs/tags/v0.17.5.tar.gz
      expected-sha256: 853c0f8f81b9c6c07d748c6d20d658d0c27ab69bc3a906fc5182b1d8505e7cfb
      directory: kine
  - runs: |
      set -eu
      export CGO_ENABLED=0
      export GOTOOLCHAIN=local
      export GOFLAGS=-mod=mod
      # e2e/ (upstream's end-to-end suites, never part of the syncer) requires
      # github.com/loft-sh/e2e-framework at a pseudo-version that is neither on the
      # Go proxy nor publicly clonable, so resolving the module graph outside
      # vendor/ fails. Drop the suites and both e2e-framework requires first;
      # `go list -deps ./cmd/vcluster` imports neither.
      rm -rf e2e
      go mod edit -droprequire github.com/loft-sh/e2e-framework -droprequire sigs.k8s.io/e2e-framework
      # ---- 0-CVE module float (docs/go-module-float.md) ----------------------
      # FLOOR is a floor, not a pin: only modules below it are raised, then the
      # shipped binary is asserted at or above it. At v0.37.2 the tag carries
      # x/crypto v0.53.0, x/mod v0.36.0, x/text v0.38.0, grpc v1.82.1, otel
      # otlptrace v1.44.0 and ulikunitz/xz v0.5.14; 0.35 and 0.36 also carry
      # oras-go/v2 v2.5/v2.6.0 (CVE-2026-50151, -50162, -50163, -85732) and
      # mongo-driver v1.14.0 (CVE-2026-2303) and cel-go v0.26.0
      # (GHSA-gcjh-h69q-9w9g, fixed 0.29.0). The rest of the canonical set
      # (x/net, x/sys, x/oauth2, the otel family) keeps a later tag from slipping
      # under it. docker/docker v28.5.2+incompatible is NOT floatable (its fix is
      # only on the moby/moby path) and is cleared by vex.openvex.json instead.
      FLOOR="golang.org/x/net@v0.62.0 golang.org/x/text@v0.43.0 golang.org/x/crypto@v0.58.1-0.20261009181718-2f1f834330b2 golang.org/x/sys@v0.49.0 golang.org/x/mod@v0.41.0 golang.org/x/oauth2@v0.36.0 google.golang.org/grpc@v1.83.2 go.opentelemetry.io/otel@v1.45.0 go.opentelemetry.io/otel/sdk@v1.45.0 go.opentelemetry.io/otel/trace@v1.45.0 go.opentelemetry.io/otel/metric@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.45.0 github.com/ulikunitz/xz@v0.5.15 oras.land/oras-go/v2@v2.6.2 go.mongodb.org/mongo-driver@v1.17.7 github.com/google/cel-go@v0.29.0 github.com/klauspost/compress@v1.18.7"
      MODS="$(echo "$FLOOR" | tr ' ' '\n' | cut -d@ -f1)"
      below_floor() {
        awk -v floor="$FLOOR" -v tag="$1" '
          BEGIN { n = split(floor, f, " ")
                  for (i = 1; i <= n; i++) { split(f[i], kv, "@"); want[kv[1]] = kv[2] } }
          ($1 in want) {
            split(substr($2, 2), g, "."); split(substr(want[$1], 2), w, ".")
            for (i = 1; i <= 3; i++) {
              if ((g[i] + 0) > (w[i] + 0)) next
              if ((g[i] + 0) < (w[i] + 0)) { print $1 "@" want[$1] " (" tag " has " $2 ")"; next }
            }
          }'
      }
      need="$(go list -m -e $MODS | awk 'NF >= 2 && $NF ~ /^v[0-9]/ { print $1, $NF }' | below_floor go.mod | awk '{ print $1 }')"
      if [ -n "$need" ]; then go get $need; fi
      go mod tidy
      rm -rf vendor
      go build -trimpath \
        -ldflags "-s -w -X github.com/loft-sh/vcluster/pkg/telemetry.SyncerVersion=${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/vcluster" ./cmd/vcluster
      bad="$(go version -m "${{targets.destdir}}/usr/bin/vcluster" \
        | awk '$1 == "dep" || $1 == "=>" { print $2, $3 }' | below_floor vcluster)"
      [ -z "$bad" ] || { echo "0-CVE float did not reach vcluster:"; echo "$bad"; exit 1; }
      "${{targets.destdir}}/usr/bin/vcluster" version | grep -qx "${{package.version}}"
      ln -s usr/bin/vcluster "${{targets.destdir}}/vcluster"

      # The control plane, floated with the same set. The root go.mod replaces every
      # staging module with its ./staging path, so module mode needs no workspace.
      cd kubernetes
      export GOWORK=off
      need="$(go list -m -e $MODS | awk 'NF >= 2 && $NF ~ /^v[0-9]/ { print $1, $NF }' | below_floor kubernetes | awk '{ print $1 }')"
      if [ -n "$need" ]; then go get $need; fi
      # what hack/lib/version.sh stamps, for the v1.36.4 tag commit
      KV="-X k8s.io/component-base/version.gitVersion=v1.36.4 -X k8s.io/component-base/version.gitMajor=1 -X k8s.io/component-base/version.gitMinor=36 -X k8s.io/component-base/version.gitCommit=bb826b1d48562f110659e64e8ec444327433db95 -X k8s.io/component-base/version.gitTreeState=clean -X k8s.io/component-base/version.buildDate=2026-08-20T03:06:27Z"
      KV="$KV $(echo "$KV" | sed 's|k8s.io/component-base/version|k8s.io/client-go/pkg/version|g')"
      for b in kube-apiserver kube-controller-manager; do
        go build -trimpath -ldflags "-s -w $KV" -o "${{targets.destdir}}/usr/bin/$b" ./cmd/$b
        bad="$(go version -m "${{targets.destdir}}/usr/bin/$b" \
          | awk '$1 == "dep" || $1 == "=>" { print $2, $3 }' | below_floor $b)"
        [ -z "$bad" ] || { echo "0-CVE float did not reach $b:"; echo "$bad"; exit 1; }
        "${{targets.destdir}}/usr/bin/$b" --version | grep -qx 'Kubernetes v1.36.4'
      done

      # kine v0.17.5: kine's scripts/build flags (cgo SQLite, static, the same tags), run
      # directly because the script needs bash and git. Same x/crypto + x/net floor.
      cd ../kine
      need="$(go list -m -e golang.org/x/crypto golang.org/x/net | awk 'NF >= 2 && $NF ~ /^v[0-9]/ { print $1, $NF }' | below_floor kine | awk '{ print $1 }')"
      if [ -n "$need" ]; then go get $need; fi
      go mod tidy
      CGO_ENABLED=1 CGO_CFLAGS="-DSQLITE_DEFAULT_MEMSTATUS=0 -DSQLITE_DISABLE_INTRINSIC -DSQLITE_ENABLE_COLUMN_METADATA -DSQLITE_ENABLE_DBPAGE_VTAB -DSQLITE_ENABLE_DBSTAT_VTAB -DSQLITE_ENABLE_MATH_FUNCTIONS -DSQLITE_ENABLE_MEMORY_MANAGEMENT -DSQLITE_ENABLE_OFFSET_SQL_FUNC -DSQLITE_ENABLE_PREUPDATE_HOOK -DSQLITE_ENABLE_RBU -DSQLITE_ENABLE_RTREE -DSQLITE_ENABLE_SESSION -DSQLITE_ENABLE_SNAPSHOT -DSQLITE_ENABLE_STAT4 -DSQLITE_ENABLE_UNLOCK_NOTIFY -DSQLITE_LIKE_DOESNT_MATCH_BLOBS -DSQLITE_THREADSAFE=1 -DSQLITE_WITHOUT_ZONEMALLOC" \
        go build -trimpath -tags nats,sqlite_unlock_notify,sqlite_vtable,sqlite_stat4,sqlite_preupdate_hook,sqlite_math_functions,sqlite_dbstat,sqlite_column_metadata \
          -ldflags "-X github.com/k3s-io/kine/pkg/version.Version=v0.17.5 -X github.com/k3s-io/kine/pkg/version.GitCommit=f82bd251 -extldflags -static -s" \
          -o "${{targets.destdir}}/usr/bin/kine" .
      bad="$(go version -m "${{targets.destdir}}/usr/bin/kine" \
        | awk '$1 == "dep" || $1 == "=>" { print $2, $3 }' | below_floor kine)"
      [ -z "$bad" ] || { echo "0-CVE float did not reach kine:"; echo "$bad"; exit 1; }
      "${{targets.destdir}}/usr/bin/kine" --version | grep -q '^kine version v0.17.5 '
  - name: Guard the docker/distribution VEX (registry/client and registry/proxy must not link)
    runs: |
      if grep -rlE 'docker/distribution/registry/(client|proxy)\.' "${{targets.destdir}}"; then
        echo "docker/distribution registry/client or registry/proxy is linked: CVE-2026-85747 applies, drop the VEX"; exit 1
      fi
  - name: Guard the docker daemon VEX (the daemon package must not link)
    runs: |
      if grep -rlE '(docker/docker|moby/moby)/daemon[./]' "${{targets.destdir}}"; then
        echo "the Moby daemon package is linked: CVE-2026-41567, -42306, -41568 apply, drop the VEX"; exit 1
      fi
