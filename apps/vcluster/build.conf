# STATUS: UNBLOCKED 2026-10-01. kube-apiserver and kube-controller-manager 1.36.4 are now
# built from the kubernetes v1.36.4 tag in melange.yaml with the syncer's float set (otel
# 1.45.0), so the image no longer takes Wolfi's kube-*-1.36 apks. Wolfi's 1.36 recipe has
# left wolfi-dev/os (only 1.34 and 1.37 remain) and r10 never reached the index (still r8
# on 2026-10-01). vcluster 0.37 supports up to 1.36, so 1.37 is no substitute. Gated
# locally x86_64: 0.37.2 and 0.35.4, 0 fixable CVEs, boot test passed.
# HISTORY: BLOCKED 2026-09-26 on Wolfi's kube-apiserver-1.36 / kube-controller-manager-1.36.
# The syncer itself gates clean on all three lines (floated, docker/docker cleared by
# vex.openvex.json). The only findings are in the bundled Wolfi control-plane binaries:
#   go.opentelemetry.io/otel/exporters/otlp/otlptrace v1.44.0, CVE-2026-81870 (LOW)
#   kube-apiserver-1.36 installed 1.36.4-r8, Wolfi advisory: fixed in 1.36.4-r10
# and the live APKINDEX (both arches) tops out at 1.36.4-r8. Unblock when
# kube-apiserver-1.36 and kube-controller-manager-1.36 >= 1.36.4-r10 are in the index:
# set BLOCKED=0, run the local gate, dispatch, then build the chart.
# RE-MEASURED 2026-09-30: the index still tops out at 1.36.4-r8 on both arches, four days
# after the advisory named r10. Wolfi fix revisions sometimes never reach the public index,
# so the path is to stop waiting: build kube-apiserver and kube-controller-manager 1.36.4
# from the kubernetes tag in apps/vcluster-kubernetes with otel/otlptrace at 1.45.0 (the
# otel family floats as one set). Upstream also has v0.36.3 now.
BLOCKED=0
# vcluster (loft-sh/vcluster): the vCluster control-plane syncer, from source via
# melange. Static Go (CGO_ENABLED=0, -mod=vendor, as upstream's goreleaser), version
# stamped via -X on pkg/telemetry.SyncerVersion. Built WITHOUT the embed_chart tag:
# it embeds upstream's Helm chart for the CLI's `vcluster create` only, and needs a
# generated tgz. The Kubernetes binaries the syncer runs (kube-apiserver,
# kube-controller-manager) come from the separate vcluster-kubernetes image.
# Latest patch of the last 3 minor lines.
FROM_SOURCE=1
VERSIONS=(0.35.4 0.36.3 0.37.2)
declare -A SHA256=(
  [0.35.4]=cc908adbef95419bccc15b7fe088aa9d8ff70ea751eded85f804dd4f6c4b25d8
  [0.36.3]=b5a42e9cd1cb785e841ce979673a24a35f4fc2c234a5229d5ab0e35280466318
  [0.37.2]=2e72497fa08a583d4d1f325427e2406c34e2876d98e0f4b70f0867dc07c62424
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
