# Memos (usememos/memos, MIT): self-hosted note-taking and micro-journal (Markdown memos, tags,
# timeline, API) on SQLite, PostgreSQL or MySQL. From source via melange: the React web app is
# built with pnpm (upstream's `pnpm release`, into server/frontend/dist) and embedded in one
# CGO-free Go binary. Node never reaches the runtime image.
# imaging 1.6.2 (CVE-2023-36308, no upstream fix) is mitigated at build time; see melange.yaml.
# LATEST-ONLY: per-release frontend toolchains. Tags have no v prefix since 26.10.0.
FROM_SOURCE=1
VERSIONS=(26.11.1)
declare -A SHA256=(
  [26.11.1]=278b86f3237fde5c586e0d0c98d16e017032839dbb4863c72179d24c3420f374
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
