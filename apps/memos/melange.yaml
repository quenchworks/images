# Memos from the release tag as upstream builds it: pnpm release builds the web app into
# server/frontend/dist (embedded), then go builds ./cmd/memos (CGO off, netgo/osusergo).
package:
  name: quench-memos
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Memos note-taking server, built from source on Wolfi"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27          # go.mod: go 1.27.2
      # build-only web toolchain: package.json pins pnpm@11 and node >=24
      - nodejs-24
      - pnpm-11.8

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/usememos/memos/archive/refs/tags/${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - name: Build the web app (pnpm release)
    runs: |
      set -eu
      export HOME="$(mktemp -d)"
      cd web
      pnpm install --frozen-lockfile
      pnpm release
      test -f ../server/frontend/dist/index.html

  - name: Build the binary (static, CGO off)
    runs: |
      set -eu
      export CGO_ENABLED=0 GOTOOLCHAIN=local GOFLAGS=-mod=mod
      # floors, raised only when below (a bare go get downgrades once upstream passes it); otel
      # core/metric/trace 1.47.0 for CVE-2026-128085 (memos 26.11.0 ships 1.45.0)
      FLOOR="golang.org/x/crypto@v0.58.1-0.20261009181718-2f1f834330b2 golang.org/x/net@v0.62.0 golang.org/x/text@v0.43.0 golang.org/x/sys@v0.49.0 golang.org/x/image@v0.47.0 go.opentelemetry.io/otel@v1.47.0 go.opentelemetry.io/otel/metric@v1.47.0 go.opentelemetry.io/otel/trace@v1.47.0"
      need=""
      for f in $FLOOR; do
        have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${f%@*}")"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        [ "$(printf '%s\n%s\n' "$have" "${f#*@}" | sort -V | head -1)" = "${f#*@}" ] || need="$need $f"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || go get $need
      go mod tidy
      # CVE-2023-36308: imaging 1.6.2 (no fixed release, upstream inactive since 2020) indexes its
      # palette table with raw pixel values. Before x/image v0.41.0, x/image/bmp (registered by
      # imaging) returned Paletted images with indexes past the palette, and a crafted upload
      # panicked a goroutine and killed the server. The x/image floor above rejects those at decode;
      # this also sizes imaging's table for every uint8 index in case another decoder ever does.
      go mod vendor
      sc=vendor/github.com/disintegration/imaging/scanner.go
      sed -i 's/s\.palette = make(\[\]color\.NRGBA, len(img\.Palette))/s.palette = make([]color.NRGBA, 256+len(img.Palette))/' "$sc"
      grep -q '256+len(img.Palette)' "$sc"
      go build -mod=vendor -trimpath -tags netgo,osusergo \
        -ldflags "-s -w -X github.com/usememos/memos/internal/version.Version=${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/memos" ./cmd/memos
      "${{targets.destdir}}/usr/bin/memos" version | grep -F "${{package.version}}"

test:
  pipeline:
    - runs: |
        memos version
