# Assembles the support-bundle-kit image. Root by default like upstream: Longhorn runs the
# node collectors with the host filesystem mounted and chroots into it.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-support-bundle-kit@local

accounts:
  groups:
    - groupname: longhorn
      gid: 1001
  users:
    - username: longhorn
      uid: 1001
      gid: 1001
  run-as: 0

entrypoint:
  command: /usr/bin/entrypoint.sh

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-support-bundle-kit"
  org.opencontainers.image.licenses: "Apache-2.0"
