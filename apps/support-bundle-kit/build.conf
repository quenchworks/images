# support-bundle-kit (rancher/support-bundle-kit): collects a support bundle (cluster objects,
# logs, node files) for Longhorn and Harvester. From source, static Go (CGO off), version
# stamped via cmd.AppVersion as upstream's scripts/build. Upstream releases only 0.0.x, so the
# versions are the ones Longhorn's dep-versions pins per release line (1.11, 1.12, 1.13).
# Root by default like upstream: the node collectors chroot into the host.
# 2026-10-12: 1.0.0 added image-first (no Longhorn line pins it yet). The workflow builds the
# last three entries; 0.0.88 stays listed so its published tag stays in the lock.
FROM_SOURCE=1
VERSIONS=(1.1.1)
declare -A SHA256=(
  [1.1.1]=ff232b0c92520629a49bf727df7d9415584a1d6508361f33c4e86dfb580fb375
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
