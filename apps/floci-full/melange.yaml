# Builds Floci (a LocalStack-compatible AWS cloud emulator) from source into a
# Quarkus fast-jar -- IDENTICAL from-source build to apps/floci/melange.yaml,
# only the package NAME differs (quench-floci-full) so the two variants' local
# .apk packages never collide. Floci publishes no release jar/binary and no
# Maven Central artifact, so we compile from the GitHub source tag with the
# Wolfi JDK 25 + maven-3.9 (maven.compiler.release=25 upstream).
# `mvn package -DskipTests` emits target/quarkus-app/ (the fast-jar layout:
# quarkus-run.jar + lib/ + app/ + quarkus/), which we install verbatim under
# /usr/share/floci. The tree is architecture-independent -- the arch comes from
# the JRE base in apko.
package:
  name: quench-floci-full
  version: __VER__
  epoch: 0
  description: "Quenchworks Floci AWS cloud emulator, FULL variant (Quarkus fast-jar), packaged on Wolfi"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - openjdk-25-jre        # the JRE Floci runs on (the scanned CVE surface; bytecode targets Java 25)
      - ca-certificates-bundle
      - busybox

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - openjdk-25          # full JDK to compile the Quarkus app
      - openjdk-25-default-jvm
      - maven-3.9
      - git                 # quarkus git-info build step reads the checkout metadata

pipeline:
  - uses: fetch
    with:
      # Tags have NO leading `v`; the archive tarball is arch-independent.
      uri: https://github.com/floci-io/floci/archive/refs/tags/${{package.version}}.tar.gz
      expected-sha256: "__SHA256__"
  - runs: |
      set -eux
      export JAVA_HOME=/usr/lib/jvm/java-25-openjdk
      export PATH="${JAVA_HOME}/bin:${PATH}"
      # Local, hermetic maven repo inside the build workspace (no global writes).
      export MAVEN_OPTS="-Dmaven.repo.local=$(pwd)/.m2repo -Duser.home=$(pwd)"
      # Build the Quarkus fast-jar. Skip tests (they need Docker + network); the
      # released bytecode is identical to upstream's `mvn clean package`.
      mvn -B -ntp clean package -DskipTests
      test -f target/quarkus-app/quarkus-run.jar
      # Install the fast-jar tree verbatim under /usr/share/floci.
      install -d "${{targets.destdir}}/usr/share/floci"
      cp -a target/quarkus-app "${{targets.destdir}}/usr/share/floci/quarkus-app"
      # NOTE: this variant runs as root and manages Docker-backed containers via
      # the mounted host docker.sock, so no numeric-uid chown / paths block is
      # needed here (root owns everything by default).

test:
  pipeline:
    - runs: |
        test -f /usr/share/floci/quarkus-app/quarkus-run.jar
