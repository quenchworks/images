# floci-full: the OPT-IN, NON-hardened counterpart to the default `floci` image.
# Same upstream (github.com/floci-io/floci), same from-source Quarkus fast-jar
# build, same versions and SHA256s as apps/floci -- the ONLY differences live in
# apko.yaml (root, docker-cli, LOCALSTACK_PARITY=true). This variant enables ALL
# 65 Floci AWS services, INCLUDING the 10 Docker-backed ones (Lambda, RDS,
# ElastiCache, MSK, ECS, EKS, OpenSearch, ECR, DocumentDB, Neptune), which need
# a mounted host /var/run/docker.sock and root. There is NO chart of its own:
# the single Floci Helm chart consumes this image behind an opt-in "full" mode.
#
# Build is IDENTICAL to apps/floci except the melange package is renamed to
# `quench-floci-full` so the two variants' local .apk packages never collide.
# The fast-jar is noarch; the arch comes entirely from the JRE -- so one sha256
# per version (NOT per-arch), same as apps/floci.
FROM_SOURCE=1
VERSIONS=(1.5.27 1.5.28 1.5.29)
declare -A SHA256=(
  [1.5.27]=e917ea73120f416e0dae1f70277386e248e46a210eebc847c3ad8d6f57f25009
  [1.5.28]=c0d0a9607a924fcd824768abf6c54f56c313697950da9c299dac7d71c0180210
  [1.5.29]=8b1f1369a8655ae4a64dd3d6ccb333f33bef6cbbceaee5d1c37d747692e11f8c
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
