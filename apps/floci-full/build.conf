# STATUS: UNBLOCKED 2026-07-10 via a build-time source port (was BLOCKED on
# com.squareup.wire:wire-runtime 4.9.11 -- CVE-2026-45799 HIGH fixed only in
# 6.3.0+, CVE-2024-58103 MEDIUM fixed only in 5.2.0+, both MAJOR bumps).
#
# THE PORT (all inside melange.yaml's build step; upstream tarball unchanged):
#   * apicurio-registry 2.6.9.Final -> 3.3.0. wire was never a floci pom dep --
#     it arrives transitively via io.apicurio:apicurio-registry-schema-util-*.
#     apicurio 3.3.0 is the first release compiled against a FIXED wire (6.4.0),
#     so its own wire-consuming bytecode (FileDescriptorUtils calls two ctors,
#     ProtoFileElement/ExtensionsElement, whose signatures changed in wire 5/6)
#     stays binary-consistent. A wire-only dependencyManagement pin was verified
#     UNSAFE by symbol diffing (javap over all 144 wire refs in the apicurio
#     jars): it would NoSuchMethodError on the Glue protobuf path at runtime.
#   * Floci's OWN wire usage (SchemaToColumnsConverter's ProtoParser + element
#     classes) is byte-identical between wire 4.9.11 and 6.4.0 (javap-diffed
#     every referenced symbol) -- zero changes needed there.
#   * apicurio 2.x -> 3.x API deltas in floci's single apicurio consumer
#     (SchemaCompatibilityChecker.java) are sed-ported in the melange build:
#     9 format-class package renames + the ContentHandle -> TypedContent
#     signature change (validate/testCompatibility/canonicalize). Exceptions
#     unchanged (RuleViolationException still extends RuntimeException).
#   * protobuf-java(+util) pins 3.25.5 -> 4.35.0 and proto-google-common-protos
#     2.49.0 -> 2.72.0: apicurio 3.3.0 references protobuf-4-only classes
#     (com.google.protobuf.GeneratedFile). protobuf is reachable ONLY via the
#     apicurio Glue path (floci source never imports com.google.protobuf).
#   * Same-major CVE pins: jackson-databind 2.21.3 -> 2.21.5; the whole bundled
#     io.netty family 4.1.133.Final -> 4.1.136.Final (version-aligned).
#
# VERIFICATION beyond the health-check blind spot (the image smoke test never
# touches Glue schema registry): a 21-assertion runtime harness exercised
# validate/canonicalize/testCompatibility for AVRO+JSON+PROTOBUF and the
# ProtoParser->Glue-columns conversion against the exact ported dependency set
# (apicurio 3.3.0 + wire 6.4.0 + protobuf-java 4.35.0 + jackson 2.21.5):
# ALL PASSED, including BACKWARD-incompatibility detection on protobuf and the
# nested/map/repeated protobuf -> Hive column type mapping.
#
# TRADE-OFFS: the shipped bytecode of SchemaCompatibilityChecker + the apicurio/
# wire/protobuf jar set intentionally differ from upstream's release (upstream
# still pins apicurio 2.6.9/wire 4.9.11). Drop the port block from melange.yaml
# when upstream floci-io/floci migrates to apicurio 3.x / a fixed wire itself.
#
# floci-full: the OPT-IN, NON-hardened counterpart to the default `floci` image.
# Same upstream (github.com/floci-io/floci), same from-source Quarkus fast-jar
# build, same versions and SHA256s as apps/floci -- the ONLY differences live in
# apko.yaml (root, docker-cli, LOCALSTACK_PARITY=true). This variant enables ALL
# 65 Floci AWS services, INCLUDING the 10 Docker-backed ones (Lambda, RDS,
# ElastiCache, MSK, ECS, EKS, OpenSearch, ECR, DocumentDB, Neptune), which need
# a mounted host /var/run/docker.sock and root. There is NO chart of its own:
# the single Floci Helm chart consumes this image behind an opt-in "full" mode.
#
# Build is IDENTICAL to apps/floci except the melange package is renamed to
# `quench-floci-full` so the two variants' local .apk packages never collide.
# The fast-jar is noarch; the arch comes entirely from the JRE -- so one sha256
# per version (NOT per-arch), same as apps/floci.
FROM_SOURCE=1
VERSIONS=(1.5.27 1.5.28 1.5.29)
declare -A SHA256=(
  [1.5.27]=e917ea73120f416e0dae1f70277386e248e46a210eebc847c3ad8d6f57f25009
  [1.5.28]=c0d0a9607a924fcd824768abf6c54f56c313697950da9c299dac7d71c0180210
  [1.5.29]=8b1f1369a8655ae4a64dd3d6ccb333f33bef6cbbceaee5d1c37d747692e11f8c
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
