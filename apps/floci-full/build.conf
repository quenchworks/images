# STATUS: ZLIB-ONLY as of 2026-09-16. Measured, not assumed: run 35097011297
# on 616f1a9 gated with exactly one finding, zlib CVE-2026-85091, on every
# version and both arches. Nothing else in this image is flagged.
#
# Wolfi is at 1.3.2.1_rc20260601-r0 and the advisory wants 1.3.3-r0, which
# upstream madler/zlib has never tagged. Downgrading to Wolfi's 1.3.1-r51
# is not a way out either: it predates the 1.3.2-r0 fix for CVE-2026-27171.
#
# BLOCKED=1 skips build+merge so sweeps stop burning a red run here. Clear
# it with scripts/blocked.py --dispatch once Wolfi ships zlib 1.3.3-r0.
# STATUS: UNBLOCKED 2026-09-16. The apicurio-registry 2.6.9 -> 3.3.0 build-time
# source port (added 2026-07-10 to escape com.squareup.wire:wire-runtime 4.9.11,
# CVE-2026-45799 HIGH / CVE-2024-58103 MEDIUM) is GONE: upstream floci 2.0.1
# declares <wire.version>6.4.5</wire.version> and pins wire-runtime(-jvm) in its
# own dependencyManagement, which is exactly the exit condition the port block
# documented. Its sed anchors had also rotted against 2.0.1 (pom now carries
# quarkus.platform.version 3.37.4 -- already past the 3.36.3 CVE-2026-50559 fix
# -- and protobuf-java 3.25.9, not 3.25.5), so the port's own assertions were
# correctly failing the build rather than silently under-applying.
#
# floci-full's melange build step is now byte-identical to apps/floci's apart
# from the package name, description and two comments -- which is what this
# file's header always claimed. Measured on floci 2.0.1 with that pin set:
# Java (jar) 0 findings; only zlib CVE-2026-85091 (MEDIUM, wants 1.3.3-r0 which
# Wolfi does not have) remains, the catalog-wide floor.
#
# floci-full: the OPT-IN, NON-hardened counterpart to the default `floci` image.
# Same upstream (github.com/floci-io/floci), same from-source Quarkus fast-jar
# build, same versions and SHA256s as apps/floci -- the ONLY differences live in
# apko.yaml (root, LOCALSTACK_PARITY=true). This variant enables ALL 65 Floci AWS
# services, INCLUDING the 10 Docker-backed ones (Lambda, RDS, ElastiCache, MSK,
# ECS, EKS, OpenSearch, ECR, DocumentDB, Neptune), which need a mounted host
# /var/run/docker.sock and root. There is NO chart of its own: the single Floci
# Helm chart consumes this image behind an opt-in "full" mode.
#
# The fast-jar is noarch; the arch comes entirely from the JRE -- so one sha256
# per version (NOT per-arch), same as apps/floci.
BLOCKED=1
FROM_SOURCE=1
# 2026-07-28: narrowed to NEWEST-ONLY, matching apps/floci (older lines each
# carried a bundled-jar MEDIUM the newest line does not, so keeping them in the
# window only produced CI failures).
VERSIONS=(2.0.1)
declare -A SHA256=(
  [2.0.1]=29afee4c39be26990e88c38d7dd01aff90d6f418805528d0ab782d54fab028f7
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
