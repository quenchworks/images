# seerr: Seerr, formerly Jellyseerr (fallenbagel/jellyseerr, MIT): media request management for Jellyfin, Emby and
# Plex with Sonarr and Radarr integration, user quotas and notifications. Images issue #121.
#
# From the release tag as upstream's Dockerfile builds it: pnpm install, next build + the server (tsc), then the
# production dependencies only, on Wolfi nodejs-24 (upstream pins Node 22, which left public Wolfi). sqlite3 links
# Wolfi's SQLite and bcrypt is compiled against Wolfi's Node. Config and the SQLite database in /app/config (the
# volume). Web UI and API on 5055.
# LATEST-ONLY: one release line.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(3.5.2)
declare -A SHA256=(
  [3.5.2]=d4340a2eb2c11e30dc7fbb600eb576e5694226580a3405e2879b768a3b53bb12
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
