# wstunnel from the release tag, built with cargo auditable and the ring crypto provider.
package:
  name: quench-wstunnel
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened wstunnel, built from source on Wolfi"
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      # cargo auditable embeds the crate list in a .dep-v0 section; without it Trivy sees no crates
      - cargo-auditable
      - rust-1.96

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/erebe/wstunnel/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - runs: |
      set -eu
      export CARGO_HOME="$(mktemp -d)"
      # tokio 1.54.0 has a fixed advisory; 1.54.1 is a patch release
      cargo update -p tokio --precise 1.54.1
      cargo auditable build --release --locked -p wstunnel-cli --bin wstunnel --no-default-features --features ring
      install -Dm755 target/release/wstunnel "${{targets.destdir}}/usr/bin/wstunnel"
      readelf -S "${{targets.destdir}}/usr/bin/wstunnel" | grep -q '\.dep-v0'
      "${{targets.destdir}}/usr/bin/wstunnel" --version | grep -F "${{package.version}}"

test:
  pipeline:
    - runs: wstunnel --version
