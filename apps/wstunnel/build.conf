# wstunnel (erebe/wstunnel, BSD-3-Clause): tunnels TCP, UDP, SOCKS5 and stdio over WebSocket or HTTP/2 to get
# through proxies and firewalls; server and client in one binary. Images issue #60.
#
# From the release tag with cargo auditable (the binary carries its crate list) and upstream's ring crypto
# feature instead of the default aws-lc (no C crypto build). tokio raised to 1.54.1. The image runs
# `wstunnel server ws://0.0.0.0:8080` by default; the same image is the client. LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(11.1.0)
declare -A SHA256=(
  [11.1.0]=3471bfb3c6605deb5f9e1cbdab88cca638c2e31f849c03340b02156ca3ae39e2
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
