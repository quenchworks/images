# Builds Traefik from source onto Wolfi. Single static Go binary (CGO disabled),
# multi-arch. Output is a signed APK in Quenchworks' own repo. No upstream distro
# binaries.
#
# Traefik is a cloud-native edge router / reverse proxy and ingress controller.
# The dashboard/webui is a prebuilt static bundle shipped inside the release
# source tarball under webui/static and embedded into the binary via
# `//go:embed static` (webui/embed.go). That means NO Node toolchain is needed at
# build time -- we build from the release .src.tar.gz which already contains the
# generated assets, so the embedded FS serves the dashboard.
#
# We deliberately skip upstream's `go generate` step: it only writes Markdown
# reference docs under docs/ (internal/gendoc.go), nothing the binary compilation
# depends on.
package:
  name: quench-traefik
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Traefik (cloud-native edge router / reverse proxy & ingress controller), built from source on Wolfi"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      # go.mod requires go >= 1.25.0; use the current go-1.26 toolchain to pick up
      # the latest stdlib CVE fixes (clears the Trivy gate without manual bumps).
      - go-1.26

pipeline:
  # Build from the official release source tarball, which already contains the
  # prebuilt webui/static dashboard bundle (so the embedded FS serves the UI
  # without Node). Pinned to the published asset; verified by sha256.
  - uses: fetch
    with:
      uri: https://github.com/traefik/traefik/releases/download/v${{package.version}}/traefik-v${{package.version}}.src.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      export GOTOOLCHAIN=local
      # 0-CVE gate bumps (patch/minor, same major, no API break):
      #   golang.org/x/net  v0.55.0 -> v0.56.0 (CVE-2026-46600: panic parsing an
      #                     invalid SVCB/HTTPS DNS resource record)
      #   golang.org/x/text v0.37.0 -> v0.39.0 (CVE-2026-56852: infinite loop on
      #                     invalid input)
      # go mod tidy keeps them in the graph at the bumped versions.
      # 0-CVE FLOORS, not pins (docs/go-module-float.md): raise a module only where go.mod has it
      # below the floor; a module absent from the graph is skipped. Bare `go get` pins downgraded
      # newer upstream releases (found 2026-10-05).
      FLOOR="golang.org/x/net@v0.58.0 golang.org/x/sys@v0.47.0 google.golang.org/grpc@v1.83.2 golang.org/x/crypto@v0.56.0 golang.org/x/text@v0.41.0 go.opentelemetry.io/otel@v1.45.0 go.opentelemetry.io/otel/trace@v1.45.0 go.opentelemetry.io/otel/metric@v1.45.0 go.opentelemetry.io/otel/sdk@v1.45.0 go.opentelemetry.io/otel/sdk/metric@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlpmetric/otlpmetricgrpc@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlpmetric/otlpmetrichttp@v1.45.0 go.opentelemetry.io/otel/log@v0.21.0 go.opentelemetry.io/otel/sdk/log@v0.21.0 go.opentelemetry.io/otel/exporters/otlp/otlplog/otlploggrpc@v0.21.0 go.opentelemetry.io/otel/exporters/otlp/otlplog/otlploghttp@v0.21.0 go.opentelemetry.io/contrib/bridges/otellogrus@v0.20.0"
      # Go semver order (a release outranks its prereleases); busybox sort -V does not.
      vlt() { awk -v a="${1#v}" -v b="${2#v}" 'function pp(s,  p){sub(/\+.*/,"",s);p=index(s,"-");if(p){C=substr(s,1,p-1);P=substr(s,p+1)}else{C=s;P=""}} function cmp(x,y,  i,n,m,X,Y){n=split(x,X,".");m=split(y,Y,".");for(i=1;i<=n&&i<=m;i++){if(X[i]==Y[i])continue;if(X[i]~/^[0-9]+$/&&Y[i]~/^[0-9]+$/)return (X[i]+0<Y[i]+0)?-1:1;if(X[i]~/^[0-9]+$/)return -1;if(Y[i]~/^[0-9]+$/)return 1;return (X[i]<Y[i])?-1:1}return (n<m)?-1:(n>m)?1:0} BEGIN{pp(a);ca=C;pa=P;pp(b);cb=C;pb=P;c=cmp(ca,cb);if(c==0){if(pa==pb)c=0;else if(pa=="")c=1;else if(pb=="")c=-1;else c=cmp(pa,pb)}exit !(c<0)}'; }
      need=""
      for mv in $FLOOR; do
        have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${mv%@*}" 2>/dev/null)"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        vlt "$have" "${mv#*@}" && need="$need $mv"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || go get $need
      # otel: CVE-2026-81870 (sdk + otlptrace exporters, fix 1.45.0) and CVE-2026-81871
      # (otlploggrpc, fix 0.21.0). Floated as a family so the exporters move with the SDK.
      # sdk 1.45 detects at semconv 1.43; traefik builds its resources schemaless
      # (resource.NewSchemaless, WithAttributes), so the schema-URL conflict cannot occur.
      # log 0.21.0 moved the log value types into otel/attribute, so traefik's one log-API
      # file needs the port upstream already made on master (same sed result, byte for
      # byte, as master's pkg/observability/logs/otel.go). otellogrus v0.20.0 is the bridge
      # release built against otel 1.45.0 / log 0.21.0. The sha256 check fails the build if
      # a future release changes the file, so the port is re-checked rather than misapplied.
      # 3.7.14 ships the port itself (log 0.21 in go.mod), so it applies only while the file
      # still uses the old otellog value API; otherwise the file must already be on attribute.
      f=pkg/observability/logs/otel.go
      if grep -q -E 'otellog\.(StringValue|BytesValue)' "$f"; then
        sed -i -E 's/otellog\.(StringValue|IntValue|Int64Value|Float64Value|BoolValue|String|KeyValue|Value)\b/attribute.\1/g; s/otellog\.BytesValue/attribute.ByteSliceValue/g; s/^(\t+)Key:   k,$/\1Key:   attribute.Key(k),/; s#^(\totellog "go.opentelemetry.io/otel/log")$#\t"go.opentelemetry.io/otel/attribute"\n\1#' "$f"
        echo "647df268064383b591e5c2f0f687a69a2276ed50bf465b37c4de5be9f61a181f  $f" | sha256sum -c -
      else
        grep -q '"go.opentelemetry.io/otel/attribute"' "$f" || { echo "$f: neither the old otellog API nor attribute; re-check the port"; exit 1; }
      fi
      go mod tidy
      for m in go.opentelemetry.io/otel/sdk go.opentelemetry.io/otel/exporters/otlp/otlplog/otlploggrpc; do
        echo "$m $(go list -m $m | awk '{print $2}')"
      done
      # Stamp version/codename/date exactly like upstream's Makefile so
      # `traefik version` reports the pinned release. Codename "cheddar" matches
      # the upstream default for the v3 line.
      DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      LDFLAGS="-s -w \
        -X github.com/traefik/traefik/v3/pkg/version.Version=${{package.version}} \
        -X github.com/traefik/traefik/v3/pkg/version.Codename=cheddar \
        -X github.com/traefik/traefik/v3/pkg/version.BuildDate=${DATE}"
      go build -trimpath -ldflags "${LDFLAGS}" \
        -installsuffix nocgo \
        -o "${{targets.destdir}}/usr/bin/traefik" ./cmd/traefik

test:
  pipeline:
    - runs: |
        traefik version
