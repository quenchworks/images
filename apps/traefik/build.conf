# traefik: from-source via melange (Go build of the official .src.tar.gz, which
# embeds the prebuilt webui -- no Node needed; go-1.26). Newest patch of the
# current stable v3.7 line. Pins its source tarball by sha256.
FROM_SOURCE=1
VERSIONS=(3.7.13)
declare -A SHA256=(
  [3.7.13]=a4c57bb9b68514075dd849f79354cf9c4b860be9330ece85ac8dad5372b82444
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
