# OTEL DRIFT, UPSTREAM-GATED as of 2026-09-20. Not blocked, but a rebuild
# cannot currently reach 0 CVEs, so do not spend rounds on it.
#
# The published 3.7.13 image drifted onto CVE-2026-81871 (MEDIUM) and four
# CVE-2026-81870 (LOW) rows in otel's exporters and sdk. It gated clean when
# built; the advisories landed afterwards.
#
# The usual coherent float does NOT work here. Floating otel to 1.45.0 and the
# log series to 0.21.0 (with contrib otellogrus 0.20.0, which is the bridge
# version whose own go.mod requires log 0.21.0) gets past every dependency and
# then fails in TRAEFIK'S OWN SOURCE:
#   pkg/observability/logs/otel.go:87: undefined: otellog.BoolValue
#   pkg/observability/logs/otel.go:89: undefined: otellog.BytesValue
# 3.7.13 is written against otel/log 0.20.0, whose API those calls come from.
#
# So the fix is a traefik release built against log 0.21.0, or patching
# upstream's observability code, which is not a pin. Re-check on the next
# traefik release rather than re-attempting the float.
# traefik: from-source via melange (Go build of the official .src.tar.gz, which
# embeds the prebuilt webui -- no Node needed; go-1.26). Newest patch of the
# current stable v3.7 line. Pins its source tarball by sha256.
FROM_SOURCE=1
VERSIONS=(3.7.13)
declare -A SHA256=(
  [3.7.13]=a4c57bb9b68514075dd849f79354cf9c4b860be9330ece85ac8dad5372b82444
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
