# traefik: from-source via melange (Go build of the official .src.tar.gz, which
# embeds the prebuilt webui -- no Node needed; go-1.26). Latest 3 patches of the
# current stable v3.7 line. Each pins its source tarball by sha256.
FROM_SOURCE=1
VERSIONS=(3.7.4 3.7.5 3.7.6)
declare -A SHA256=(
  [3.7.4]=2f8bad4c4ce25820354702647b2b57e4f6c7b21d801a6ad163c7fc9cfa9a2491
  [3.7.5]=09e44f902945eeced6521c0e561c31c3bdf19f82882945aca049ae31a8e9055d
  [3.7.6]=bc97effd53f3423cebc37c783472c2d09b94dd90a805cb95e26ded71eb2fc294
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
