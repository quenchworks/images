# traefik: from-source via melange (Go build of the official .src.tar.gz, which
# embeds the prebuilt webui -- no Node needed; go-1.26). Latest 3 stable v3 minor
# lines, newest patch each. Each pins its source tarball by sha256.
FROM_SOURCE=1
VERSIONS=(3.5.6 3.6.21 3.7.5)
declare -A SHA256=(
  [3.5.6]=3392c6d1250be6dcbbe96ac6e1a49abed2ed0e4942e1fd63f9bdb0235009025e
  [3.6.21]=8ea4d7da8b85db468b5bee19dcd5ea4862260ed1e766258eb115c2aadcae792f
  [3.7.5]=09e44f902945eeced6521c0e561c31c3bdf19f82882945aca049ae31a8e9055d
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
