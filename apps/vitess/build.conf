# vitess: horizontal sharding and connection pooling for MySQL. From-source via
# melange (static Go build of the release tarball, CGO disabled). Newest patch of
# the last three MAJOR lines, which is how Vitess versions: 24, 23, 22.
#
# Ships the core command set as one image, the shape a Vitess deployment needs:
# vtgate, vttablet, vtctld, vtctldclient, vtorc, mysqlctl, mysqlctld, vtbackup.
# The entrypoint is vtgate; a deployment overrides the command to pick its
# component, the same pattern as tekton and upstream's own vitess/lite.
#
# EACH LINE NEEDS ITS OWN GO, measured 2026-09-20, not assumed from the go
# directive alone:
#   24.0.3  go 1.26.7   -> go-1.26
#   23.0.6  go 1.25.13  -> go-1.26
#
# The 22 line is NOT shipped. It is the third-newest major and would normally be
# here; it cannot reach fixable=0 on any Go that Wolfi publishes, measured
# 2026-09-20 rather than assumed:
#
#   * 22.0.4 does not compile on go-1.26 at all. vitess's own compile-time guard
#     go/hack/ensure_swiss_map.go:39:38 fails with "invalid array length -1",
#     an assertion about the Go runtime's map implementation.
#   * On go-1.25 it compiles, and then the gate reports NINE findings that the
#     toolchain itself owns: stdlib 1.25.12 carries seven HIGH (CVE-2026-33818,
#     -39821, -56853, -56858, -56859, -56860, -56862) whose fix is go 1.25.13 or
#     1.26.6, and Wolfi's newest go-1.25 is 1.25.12.
#   * x/crypto cannot close the gap either. 0.56.0 clears CVE-2026-56855 and
#     CVE-2026-78662 but declares `go 1.26.0`, so go-1.25 refuses it, and 0.55.0
#     still carries both.
#
# RE-ADD 22.0.4 when Wolfi ships go-1.25 at 1.25.13 or later AND a crypto that
# clears 56855/78662 without requiring go 1.26. Check the APKINDEX for the
# toolchain, not the advisory. Do not try go-1.26 again; that failure is by design.
#
# The toolchain is chosen by what the 0-CVE FLOOR needs, not only by the go
# directive. golang.org/x/crypto v0.56.0 declares `go 1.26.0`, so a line built on
# go-1.25 cannot reach it: `go get` refuses with "requires go >= 1.26.0 (running
# go 1.25.12; GOTOOLCHAIN=local)". That is why 23.0.6 builds on go-1.26 rather
# than the go-1.25 its directive asks for, which is allowed because a toolchain
# above the directive is fine.
#
# Do NOT push 22.0.4 up to go-1.26 as well. It fails vitess's own compile-time
# guard there:
#   go/hack/ensure_swiss_map.go:39:38: invalid array length -1
# an assertion about the Go runtime's map implementation, so a newer toolchain
# breaks it by design. 22.0.4 does build on go-1.25 (measured), which is why it
# sits there rather than on the go-1.24 its directive names.
FROM_SOURCE=1
VERSIONS=(23.0.6 24.0.3)
declare -A SHA256=(
  [23.0.6]=5e5f633c84c815352cf96d9cd65b71dfab0d0688af1aedd939dc5d7d2504ae61
  [24.0.3]=c8a118f1b67cd29d04e5795cd3802682dea2445a5389723ca9c4fc7979df0e56
)
# The Wolfi go-N package each line compiles with. See the header for why these
# are not interchangeable.
declare -A GOPKG=(
  [23.0.6]=go-1.26
  [24.0.3]=go-1.26
)
render() {
  local v="$1"
  echo "s/__VER__/$v/g; s|__SHA256__|${SHA256[$v]}|g; s|__GOPKG__|${GOPKG[$v]}|g"
}
