# Builds the Hyperledger Fabric peer from source onto Wolfi: cmd/peer (static, CGO off,
# version + commit stamped like upstream's Makefile) and the chaincode-as-a-service external
# builder (ccaas_builder, its own module) at /opt/hyperledger/ccaas_builder/bin, where
# sampleconfig/core.yaml points externalBuilders. The whole sampleconfig (core.yaml,
# orderer.yaml, configtx.yaml, the sample msp) ships at /etc/hyperledger/fabric.
package:
  name: quench-fabric-peer
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Hyperledger Fabric peer, built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-1.26

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/hyperledger/fabric/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      set -eu
      export CGO_ENABLED=0 GOFLAGS=-mod=mod GO111MODULE=on GOTOOLCHAIN=local
      # 0-CVE FLOORS, not pins (docs/go-module-float.md): raise a module only where the graph has
      # it below the floor. Measured 2026-10-19 on both tags: x/crypto 0.52, x/mod 0.36, x/net
      # 0.55, x/text 0.37, grpc 1.81.0 (3.1.5) / 1.79.3 (2.5.16); no replace directives.
      FLOOR="golang.org/x/net@v0.60.0 golang.org/x/sys@v0.48.0 google.golang.org/grpc@v1.83.2 golang.org/x/text@v0.42.0 golang.org/x/crypto@v0.57.0 golang.org/x/mod@v0.41.0"
      # Go semver order (a release outranks its prereleases); busybox sort -V does not.
      vlt() { awk -v a="${1#v}" -v b="${2#v}" 'function pp(s,  p){sub(/\+.*/,"",s);p=index(s,"-");if(p){C=substr(s,1,p-1);P=substr(s,p+1)}else{C=s;P=""}} function cmp(x,y,  i,n,m,X,Y){n=split(x,X,".");m=split(y,Y,".");for(i=1;i<=n&&i<=m;i++){if(X[i]==Y[i])continue;if(X[i]~/^[0-9]+$/&&Y[i]~/^[0-9]+$/)return (X[i]+0<Y[i]+0)?-1:1;if(X[i]~/^[0-9]+$/)return -1;if(Y[i]~/^[0-9]+$/)return 1;return (X[i]<Y[i])?-1:1}return (n<m)?-1:(n>m)?1:0} BEGIN{pp(a);ca=C;pa=P;pp(b);cb=C;pb=P;c=cmp(ca,cb);if(c==0){if(pa==pb)c=0;else if(pa=="")c=1;else if(pb=="")c=-1;else c=cmp(pa,pb)}exit !(c<0)}'; }
      need=""
      for mv in $FLOOR; do
        have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${mv%@*}" 2>/dev/null)"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        if vlt "$have" "${mv#*@}"; then need="$need $mv"; fi
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || go get $need
      go mod tidy
      M=github.com/hyperledger/fabric/common/metadata
      go build -trimpath -buildvcs=false \
        -ldflags "-s -w -X $M.Version=${{package.version}} -X $M.CommitSHA=__COMMIT__" \
        -o "${{targets.destdir}}/usr/bin/peer" ./cmd/peer
      # The float is only real if it reached the binary.
      go version -m "${{targets.destdir}}/usr/bin/peer" > /tmp/mods
      for mv in $FLOOR; do
        got="$(awk -v m="${mv%@*}" '($1 == "dep" || $1 == "=>") && $2 == m { v = $3 } END { print v }' /tmp/mods)"
        [ -z "$got" ] && continue
        if vlt "$got" "${mv#*@}"; then echo "float did not reach peer: ${mv%@*} $got < ${mv#*@}"; exit 1; fi
      done
      # Chaincode-as-a-service builder, as upstream's `make ccaasbuilder` (tests skipped).
      install -d "${{targets.destdir}}/opt/hyperledger/ccaas_builder/bin"
      (cd ccaas_builder && go build -trimpath -buildvcs=false -ldflags "-s -w" \
        -o "${{targets.destdir}}/opt/hyperledger/ccaas_builder/bin/" ./cmd/detect ./cmd/build ./cmd/release)
      install -d "${{targets.destdir}}/etc/hyperledger/fabric"
      cp -r sampleconfig/. "${{targets.destdir}}/etc/hyperledger/fabric/"
      chmod -R u=rwX,go=rX "${{targets.destdir}}/etc/hyperledger/fabric"
