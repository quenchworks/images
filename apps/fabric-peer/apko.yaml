# Assembles the Hyperledger Fabric peer image. Minimal, nonroot 1001, multi-arch, SBOM by apko.
# Shaped like upstream's images/peer/Dockerfile: FABRIC_CFG_PATH=/etc/hyperledger/fabric holding
# the sampleconfig, state under /var/hyperledger (owned by 1001), cmd "/usr/bin/peer node start".
# Ports: 7051 (gRPC), 9443 (operations, 127.0.0.1 in core.yaml).
# Override settings with upstream's env vars (CORE_* for the peer, ORDERER_* for the orderer).
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-fabric-peer@local

accounts:
  groups:
    - groupname: fabric
      gid: 1001
  users:
    - username: fabric
      uid: 1001
      gid: 1001
  run-as: 1001

environment:
  FABRIC_CFG_PATH: /etc/hyperledger/fabric
  FABRIC_VER: __VER__

paths:
  - path: /var/hyperledger
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o755

cmd: /usr/bin/peer node start

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-fabric-peer"
  org.opencontainers.image.licenses: "Apache-2.0"
