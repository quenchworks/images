# Redis Operator (Redis standalone, replication, sentinel and cluster from Redis, RedisReplication,
# RedisSentinel and RedisCluster resources), from OT-CONTAINER-KIT/redis-operator (Apache-2.0). From
# the release tag via melange: one static Go binary (cmd/main.go) and the house golang.org/x floor.
# The binary sits at /operator like upstream's image, because the operator reuses its own image as
# the config init container ("/operator agent bootstrap"). Upstream stamps no version into the binary.
# LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(0.27.0)
declare -A SHA256=(
  [0.27.0]=4bed1e7fba65d3d6b01a037c92d0904be80bc1724bc3967c41a94ccfd02c81e7
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
