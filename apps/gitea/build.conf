# gitea: from-source via melange (fetch the official gitea-src release tarball, sha256).
# Latest 3 stable minor lines (full X.Y.Z, used as-is).
# __VER__ = version  __SHA256__ = that source tarball's sha256
FROM_SOURCE=1
VERSIONS=(1.24.7 1.25.5 1.26.4)
declare -A SHA256=(
  [1.24.7]=76a91742902fc353369e948b93666018ffe7eb0c565241a944c14f3d9232d808
  [1.25.5]=94ac565aa9da5b80e784db53598e5b10a2e41c655c07f064050675bd97ef51f1
  [1.26.4]=197d679d8c774e05915c67da67d1cbae9fb055c1dbb802f0c59603a44fcadd98
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
