# gitea: from-source via melange (fetch the official gitea-src release tarball, sha256).
# Newest stable release only (full X.Y.Z, used as-is).
# __VER__ = version  __SHA256__ = that source tarball's sha256
FROM_SOURCE=1
VERSIONS=(1.27.3)
declare -A SHA256=(
  [1.27.3]=3283ae40dd1f7b09450bb5a56455e78106fe17f4211d254c7c0179b8927bf382
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
