# Opengist (thomiceli/opengist, AGPL-3.0): a self-hosted pastebin backed by Git, with a web UI,
# search, OAuth sign-in and git push/clone over HTTP and SSH. From source via melange: npm/vite
# build the frontend, go builds the server with the fs_embed tag (assets embedded), CGO-free.
# The server shells out to git, so the runtime carries git and busybox (/bin/sh for git).
# LATEST-ONLY: per-release frontend toolchains.
FROM_SOURCE=1
VERSIONS=(1.15.3 1.16.0)
declare -A SHA256=(
  [1.15.3]=0d86d3d1b94ee0e346aea47defef7969174b5484a514e46d23d719f60a89e7dc
  [1.16.0]=0b33cd9d223cbcf8f522f5bb2cdf7cca9d59f20db2c65faa50e6159fa29067c3
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
