# Opengist from the release tag as upstream's Makefile builds it: npm ci + vite build the frontend,
# go build -tags fs_embed embeds it (CGO off).
package:
  name: quench-opengist
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Opengist Git-backed pastebin, built from source on Wolfi"
  copyright:
    - license: AGPL-3.0-only
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata
      - git                # the server runs git for every gist
      - busybox            # /bin/sh for git hooks and helpers

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27          # go.mod: go 1.27.2
      # build-only web toolchain (package-lock.json)
      - nodejs-24
      - npm

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/thomiceli/opengist/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - name: Build the web UI (npm)
    runs: |
      set -eu
      export HOME="$(mktemp -d)"
      npm ci --no-audit --no-fund
      npx vite -c public/vite.config.js build
      test -d public/.vite || test -d public/assets

  - name: Build the binary (static, CGO off)
    runs: |
      set -eu
      export CGO_ENABLED=0 GOTOOLCHAIN=local GOFLAGS=-mod=mod
      # floors, raised only when below (a bare go get downgrades once upstream passes it)
      FLOOR="golang.org/x/crypto@v0.58.1-0.20261009181718-2f1f834330b2 golang.org/x/net@v0.62.0 golang.org/x/text@v0.43.0 golang.org/x/sys@v0.49.0 golang.org/x/image@v0.47.0 github.com/labstack/echo/v4@v4.16.4"
      need=""
      for f in $FLOOR; do
        have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${f%@*}")"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        [ "$(printf '%s\n%s\n' "$have" "${f#*@}" | sort -V | head -1)" = "${f#*@}" ] || need="$need $f"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || go get $need
      go mod tidy
      go build -trimpath -tags fs_embed \
        -ldflags "-s -w -X github.com/thomiceli/opengist/internal/config.OpengistVersion=v${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/opengist" .
      "${{targets.destdir}}/usr/bin/opengist" version | grep -F "${{package.version}}"

test:
  pipeline:
    - runs: |
        opengist version
