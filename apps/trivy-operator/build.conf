# trivy-operator: Trivy Operator, the Kubernetes operator that continuously scans
# workloads, configurations, RBAC and the cluster itself with Trivy and stores the
# results as CRDs (VulnerabilityReport, ConfigAuditReport, ExposedSecretReport, ...).
# Built from source on Wolfi (static Go, no cgo), as upstream's release does.
#
# Why not Wolfi's trivy-operator apk: measured 2026-09-25, 0.30.1-r14 is four minors
# behind upstream's 0.34.0 and carries 31 findings (docker/docker among them).
#
# NEWEST-ONLY: the operator ships one supported line. 0.34.0 stays while the chart pins it.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(0.34.0 0.35.0)
# sha256 of the GitHub tag tarball, computed from a download
declare -A SHA256=(
  [0.34.0]=758e61f172ab6b1afe1b247c024207bc816b4adea9a13201ccab1b02c99de358
  [0.35.0]=c6df6b53018b8aa1afa3ec7f97e0c148623cb4d481def6a22f0cacda2ce111bb
)
# the tag's commit and date, stamped into the binary like upstream's goreleaser build
declare -A COMMIT=(
  [0.34.0]=7107830178ae50e96e9f09d98976e51e6152759f
  [0.35.0]=5171971e35c7b1d8a0e47a94a2326da4d97ff417
)
declare -A DATE=(
  [0.34.0]=2026-08-24T10:33:31Z
  [0.35.0]=2026-10-05T11:23:44Z
)
# the Go toolchain each line builds with (see melange.yaml)
declare -A GO=(
  [0.34.0]=1.26
  [0.35.0]=1.27
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g; s|__COMMIT__|${COMMIT[$1]}|g; s|__DATE__|${DATE[$1]}|g; s|__GO__|${GO[$1]}|g"; }
