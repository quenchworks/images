# Builds Trivy Operator from source onto Wolfi: static Go, no cgo, version, commit and
# date stamped via -X like upstream's goreleaser build.
package:
  name: quench-trivy-operator
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Trivy Operator, built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      # go-1.26, not the newest go: the embedded trivy uses the experimental json/v2 API
      # (json.SkipFunc) as it stands in Go 1.26, which Go 1.27 changed
      - go-1.26

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/aquasecurity/trivy-operator/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      set -eu
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      export GO111MODULE=on
      export GOTOOLCHAIN=local
      # the embedded trivy library uses encoding/json/v2 (pkg/x/json)
      export GOEXPERIMENT=jsonv2
      # ---- 0-CVE module float (docs/go-module-float.md) ----------------------
      # The same coherent floor set as the trivy recipe (the operator embeds trivy
      # v0.74.0 as a library), plus what 0.34.0 measured below its fixes: containerd/v2
      # (2.3.5) and the otel exporters, floated as one 1.45.0 train with the core.
      FLOOR="golang.org/x/net@v0.58.0 golang.org/x/text@v0.41.0 golang.org/x/crypto@v0.56.0 golang.org/x/sys@v0.47.0 golang.org/x/mod@v0.40.0 golang.org/x/sync@v0.22.0 google.golang.org/grpc@v1.83.2 github.com/moby/buildkit@v0.31.1 github.com/containerd/containerd/v2@v2.3.6 go.opentelemetry.io/otel@v1.45.0 go.opentelemetry.io/otel/sdk@v1.45.0 go.opentelemetry.io/otel/trace@v1.45.0 go.opentelemetry.io/otel/metric@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.45.0"
      MODS="$(echo "$FLOOR" | tr ' ' '\n' | cut -d@ -f1)"
      # prints "<mod>@<floor> (<tag> has <ver>)" for every module below its floor
      below_floor() {
        awk -v floor="$FLOOR" -v tag="$1" '
          BEGIN { n = split(floor, f, " ")
                  for (i = 1; i <= n; i++) { split(f[i], kv, "@"); want[kv[1]] = kv[2] } }
          ($1 in want) {
            split(substr($2, 2), g, "."); split(substr(want[$1], 2), w, ".")
            for (i = 1; i <= 3; i++) {
              if ((g[i] + 0) > (w[i] + 0)) next
              if ((g[i] + 0) < (w[i] + 0)) { print $1 "@" want[$1] " (" tag " has " $2 ")"; next }
            }
          }'
      }
      # `go list -m` prints "<mod> <ver>" or "<mod> <ver> => <mod> <ver>", so $NF is
      # the EFFECTIVE version and a replace cannot hide behind the require line.
      go list -m -e $MODS
      need="$(go list -m -e $MODS | awk 'NF >= 2 && $NF ~ /^v[0-9]/ { print $1, $NF }' | below_floor go.mod | awk '{ print $1 }')"
      if [ -n "$need" ]; then go get $need; fi
      go mod tidy
      go build -trimpath \
        -ldflags "-s -w -X main.version=${{package.version}} -X main.commit=__COMMIT__ -X main.date=__DATE__" \
        -o "${{targets.destdir}}/usr/bin/trivy-operator" ./cmd/trivy-operator
      # The float is only real if it reached the BINARY. Every `dep`/`=>` line of
      # `go version -m` must be at or above its floor -- the `=>` line is what
      # catches a replace-shadowed float. Fail the build rather than ship it.
      bad="$(go version -m "${{targets.destdir}}/usr/bin/trivy-operator" \
        | awk '$1 == "dep" || $1 == "=>" { print $2, $3 }' | below_floor trivy-operator)"
      [ -z "$bad" ] || { echo "❌ 0-CVE float did not reach trivy-operator:"; echo "$bad"; exit 1; }
