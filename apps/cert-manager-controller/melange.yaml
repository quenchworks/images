# Builds the cert-manager controller from source onto Wolfi. Static Go binary, no CGO.
# cert-manager's cmd/controller is its own Go module (it `replace`s the parent repo to a
# local path), so the build runs from inside cmd/controller. The version is stamped via -X
# into pkg/util.AppVersion so the component reports the real release. Output is a
# signed APK in Quenchworks' own repo. No upstream distro binaries.
package:
  name: quench-cert-manager-controller
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened cert-manager controller, built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-1.25

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/cert-manager/cert-manager/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      export GOTOOLCHAIN=local   # use the installed go-1.25, don't fetch a newer go.mod toolchain
      cd cmd/controller
      # 0-CVE gate: bump vulnerable Go modules to their Trivy-advised fixed versions
      # before building. Older release lines (e.g. 1.18.x) pin x/net, x/crypto, grpc,
      # go-jose, go-ntlmssp and otel below the fixed versions; newer lines already
      # satisfy these, so the bump is a no-op there. cmd/<target> replaces the parent
      # cert-manager module (../../), so bumping here (the main module) wins via MVS.
      go get \
        golang.org/x/net@v0.56.0 \
        golang.org/x/crypto@v0.53.0 \
        google.golang.org/grpc@v1.79.3 \
        github.com/go-jose/go-jose/v4@v4.1.4 \
        github.com/Azure/go-ntlmssp@v0.1.1 \
        go.opentelemetry.io/otel/sdk@v1.43.0
      go mod tidy || true
      go build -trimpath \
        -ldflags "-s -w -X github.com/cert-manager/cert-manager/pkg/util.AppVersion=v${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/controller" .
