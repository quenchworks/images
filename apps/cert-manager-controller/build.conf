# cert-manager-controller: from-source via melange. All four cert-manager component
# images (controller, webhook, cainjector, acmesolver) build from the SAME upstream
# source tarball; only the cmd/ target differs. Latest patch of the last 3 minor
# lines (1.18, 1.19, 1.20, 1.21), each pinned by sha256. Static Go binary, no CGO. Version
# is stamped via -X github.com/cert-manager/cert-manager/pkg/util.AppVersion=vX.Y.Z.
FROM_SOURCE=1
VERSIONS=(1.18.6 1.19.6 1.20.3 1.21.0)
declare -A SHA256=(
  [1.18.6]=f5f814a2b1dd049e45f86059c101998e7c5fce456789ee99a131abf75e6e02b6
  [1.19.6]=7a26714b49bf97017a66e255d831b50af20adb89d2415d40800f568a5fe38689
  [1.20.3]=1a1c8a7bff5b604561bfdde1dd8a366b49b5c9da50ddb7fe554be6db35028279
  [1.21.0]=d6b9e95b91c5105685e3469cc108153cef0b2e388e4584fc33b9063ff07b4d9a
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
