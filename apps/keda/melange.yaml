# Builds KEDA (Kubernetes event-driven autoscaler) from source onto Wolfi. Ships
# BOTH first-party binaries: the operator (./cmd/operator -> keda) and the
# metrics adapter (./cmd/adapter -> keda-adapter). Static builds, CGO disabled.
# The release tarball vendors all modules, so the build runs `-mod=vendor` with
# no network. go.mod declares go 1.26.x; we use the Wolfi go-1.26 toolchain with
# GOTOOLCHAIN=local so no toolchain is fetched. The version is stamped via the
# upstream ldflags (version.Version / version.GitCommit, per the Makefile
# GO_LDFLAGS) so the operator logs the real release at startup. Output is a
# signed APK in Quenchworks' own repo. No upstream distro binaries. Image-only.
package:
  name: quench-keda
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened KEDA (operator + metrics adapter), built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      # go.mod declares go 1.26.x; use the newest go-1.26 toolchain (latest
      # stdlib CVE fixes) with GOTOOLCHAIN=local so the directive triggers no
      # toolchain download.
      - go-1.26
      - jq   # the floor pass reads go.mod replace directives

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/kedacore/keda/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      set -eu
      export CGO_ENABLED=0
      export GOTOOLCHAIN=local      # use the installed go-1.26, do not fetch go.mod's directive
      export GO111MODULE=on
      export GOFLAGS=-mod=mod       # build off go.mod (see the CVE bump below)

      # 0-CVE FLOORS, not pins (docs/go-module-float.md): raise a module only where go.mod has it
      # below the floor; a module absent from the graph is skipped. Until 2026-10-05 this recipe
      # forced prometheus v0.311.3 (CVE-2026-42151/-42154/-40179/-44903) and cel-go v0.29.2
      # (GHSA-gcjh-h69q-9w9g) through `replace` edits and bare `go get` pins; 2.21.0 requires
      # prometheus v0.314.0 and cel-go v0.31.0 with no replace, so those pins downgraded it,
      # along with the otel family, grpc and amqp091-go. A module held by a `replace` gets its
      # replace moved instead of a go get, which the replace would override.
      FLOOR="github.com/prometheus/prometheus@v0.311.3 github.com/google/cel-go@v0.29.2 golang.org/x/net@v0.58.0 golang.org/x/sys@v0.47.0 google.golang.org/grpc@v1.83.2 golang.org/x/crypto@v0.56.0 golang.org/x/text@v0.41.0 golang.org/x/mod@v0.40.0 github.com/rabbitmq/amqp091-go@v1.13.0 go.opentelemetry.io/otel@v1.45.0 go.opentelemetry.io/otel/trace@v1.45.0 go.opentelemetry.io/otel/metric@v1.45.0 go.opentelemetry.io/otel/sdk@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.45.0"
      need=""
      for mv in $FLOOR; do
        have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${mv%@*}" 2>/dev/null)"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        [ "$(printf '%s\n%s\n' "$have" "${mv#*@}" | sort -V | head -1)" = "${mv#*@}" ] && continue
        if [ -n "$(go mod edit -json | jq -r --arg m "${mv%@*}" '.Replace[]? | select(.Old.Path == $m) | .Old.Path')" ]; then
          go mod edit -replace="${mv%@*}=$mv"
        fi
        need="$need $mv"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || go get $need
      go mod tidy

      VERPKG="github.com/kedacore/keda/v2/version"
      LDFLAGS="-s -w \
        -X=${VERPKG}.Version=${{package.version}} \
        -X=${VERPKG}.GitCommit=v${{package.version}}"
      # operator -> keda ; metrics adapter -> keda-adapter
      go build -trimpath -ldflags "${LDFLAGS}" \
        -o "${{targets.destdir}}/usr/bin/keda" ./cmd/operator
      go build -trimpath -ldflags "${LDFLAGS}" \
        -o "${{targets.destdir}}/usr/bin/keda-adapter" ./cmd/adapter
