# keda (kedacore): from-source via melange (Go build from the git tag tarball).
# Image-only (the KEDA operator + metrics adapter, no chart). NEWEST-ONLY: build
# just the latest stable X.Y.Z (kedacore/keda tags carry a "v" prefix). The
# release tarball vendors its deps, so the build is `-mod=vendor`, CGO off, and
# the version is stamped via the upstream ldflags (version.Version / version.GitCommit).
FROM_SOURCE=1
VERSIONS=(2.20.2)
declare -A SHA256=(
  [2.20.2]=953f8de691da6748548aaba53c5f61ca9cf0dc0c52ccb8da9f97bb0342d2c079
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
