# kfp-driver: Kubeflow Pipelines driver, built from the kubeflow/pipelines release tag (2026-10-20).
# One app per KFP component; all of them build from the same tarball, so a version bump moves
# every kfp-* app together (the chart pins one release).
FROM_SOURCE=1
VERSIONS=(2.18.1)
declare -A SHA256=(
  [2.18.1]=8683c8804a2b572a15e7c909f2d5603331412a979e5ba8530974a02b34ee4d01
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
