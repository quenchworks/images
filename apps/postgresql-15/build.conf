# postgresql-15: from-source via melange; the PG15-pinned variant (e.g. for
# Coolify, which requires major 15). "Latest 3" applied to the pinned line = the
# 3 newest 15.x patches. Each pins its official release tarball by sha256.
FROM_SOURCE=1
VERSIONS=(15.17 15.18 15.19)
declare -A SHA256=(
  [15.17]=ae14f24c14727e0b2ded1c5553031666099bd1054db3ef44bfa6e2bd6d554a56
  [15.18]=11df0df97fe3ea4ba9a791faaf39cee1d2fe571e78885b5b55d8517d27c323b4
  [15.19]=e1a64a87a46b825b88c082e4518161a47aab53c45694964f8ba1df28f7859f89
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
