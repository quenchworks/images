# Assembles the runtime image from our own package plus the Wolfi base.
# No Dockerfile. Minimal, nonroot, multi-arch, SBOM generated by apko.
# PostgreSQL 15.x variant (Coolify pins PG 15); the default postgresql image tracks 18.x.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub            # our package signing key, generated in CI
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"          # melange output from the build step
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - tzdata
    - busybox                      # the bootstrap entrypoint needs a tiny shell
    - quench-postgresql-15@local

accounts:
  groups:
    - groupname: postgres
      gid: 1001
  users:
    - username: postgres
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/local/bin/docker-entrypoint.sh

environment:
  PGDATA: /var/lib/postgresql/data

work-dir: /var/lib/postgresql

paths:
  # own the parent too, or apko leaves it root:root 0700 and uid 1001 can't traverse in
  - path: /var/lib/postgresql
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o755
  - path: /var/lib/postgresql/data
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o700
  - path: /var/run/postgresql
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o755

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-postgresql-15"
  org.opencontainers.image.licenses: "PostgreSQL"
