# Builds the kgateway control plane from source onto Wolfi. Single static Go binary,
# no CGO, matching upstream's own build (Makefile: GO_BUILD_FLAGS =
# `GO111MODULE=on CGO_ENABLED=0`, LDFLAGS = `-X .../pkg/version.Version=$(VERSION) -s -w`
# on ./cmd/kgateway). Output is a signed APK in Quenchworks' own repo. No upstream
# distro binaries.
#
# Only `kgateway` is installed. The repo also holds ./cmd/envoyinit (that one belongs to
# the data-plane image, apps/kgateway-envoy) and ./cmd/sds, which is the Istio-ambient
# cert sidecar and is not part of a standalone install.
package:
  name: quench-kgateway
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened kgateway Gateway API control plane, built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-1.26

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/kgateway-dev/kgateway/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      set -eu
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      # Both shipped lines declare `go 1.26.7` in go.mod and Wolfi's go-1.26 IS 1.26.7,
      # so the installed toolchain satisfies them and must not fetch another one.
      export GOTOOLCHAIN=local

      # ---- 0-CVE gate: no module float is needed at these tags ----------------
      # Both 2.3.7 and 2.4.3 build 0-fixable on x86_64 and aarch64 with no `go get`
      # floor at all -- the go-1.26 toolchain plus upstream's own requires already
      # clear everything Trivy can fix. The ONE finding is not fixable by any pin and
      # is handled by vex.openvex.json: Trivy reads `istio.io/istio` at the
      # pseudo-version upstream must use (istio tags releases as `1.14.1` with no `v`,
      # so the Go proxy publishes NO semver versions -- `go list -m -versions
      # istio.io/istio` returns an empty list) and sorts v0.0.0-<date>-<sha> below five
      # istio advisories from 2019-2022. See the VEX file for the evidence.
      # When a float DOES become necessary, copy the FLOOR/below_floor pattern from
      # apps/envoy-gateway/melange.yaml and read docs/go-module-float.md first: a bare
      # `go get mod@vX` is a silent no-op under a `replace` and a silent DOWNGRADE once
      # upstream requires more than vX.

      go build -trimpath \
        -ldflags "-s -w -X github.com/kgateway-dev/kgateway/v2/pkg/version.Version=v${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/kgateway" ./cmd/kgateway
