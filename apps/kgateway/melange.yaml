# Builds the kgateway control plane from source onto Wolfi. Single static Go binary,
# no CGO, matching upstream's own build (Makefile: GO_BUILD_FLAGS =
# `GO111MODULE=on CGO_ENABLED=0`, LDFLAGS = `-X .../pkg/version.Version=$(VERSION) -s -w`
# on ./cmd/kgateway). Output is a signed APK in Quenchworks' own repo. No upstream
# distro binaries.
#
# Only `kgateway` is installed. The repo also holds ./cmd/envoyinit (that one belongs to
# the data-plane image, apps/kgateway-envoy) and ./cmd/sds, which is the Istio-ambient
# cert sidecar and is not part of a standalone install.
package:
  name: quench-kgateway
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened kgateway Gateway API control plane, built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - curl
      - go-1.27
      - jq

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/kgateway-dev/kgateway/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      set -eu
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      # 2.5.2 declares `go 1.27.4` in go.mod; Wolfi's go-1.27 satisfies it, so the
      # installed toolchain must not fetch another one.
      export GOTOOLCHAIN=local

      # ---- 0-CVE gate: no module float is needed at these tags ----------------
      # Both 2.3.7 and 2.4.3 build 0-fixable on x86_64 and aarch64 with no `go get`
      # floor at all -- the go-1.26 toolchain plus upstream's own requires already
      # clear everything Trivy can fix. The ONE finding is not fixable by any pin and
      # is handled by vex.openvex.json: Trivy reads `istio.io/istio` at the
      # pseudo-version upstream must use (istio tags releases as `1.14.1` with no `v`,
      # so the Go proxy publishes NO semver versions -- `go list -m -versions
      # istio.io/istio` returns an empty list) and sorts v0.0.0-<date>-<sha> below five
      # istio advisories from 2019-2022. See the VEX file for the evidence.
      # 2026-09-06: a float IS necessary now. The nightly scan found
      # CVE-2026-84304 on google.golang.org/grpc (fixed in 1.83.1) in the published
      # image, and a plain rebuild failed this app's 0-CVE gate on it. Built with the
      # FLOOR/below_floor pattern the comment above prescribes rather than a bare
      # `go get`: a bare exact pin is a no-op under a `replace` and becomes a
      # DOWNGRADE once upstream requires more, re-introducing the CVE while the gate
      # still reports green. grpc 1.83.2 requires the otel v1.44.0 family, which this
      # recipe does not pin, so MVS is free to resolve it upward on its own.
      FLOOR="google.golang.org/grpc@v1.83.2 golang.org/x/crypto@v0.58.1-0.20261009181718-2f1f834330b2 golang.org/x/net@v0.62.0 golang.org/x/text@v0.43.0 golang.org/x/sys@v0.49.0 go.opentelemetry.io/otel@v1.47.0 go.opentelemetry.io/otel/trace@v1.47.0 go.opentelemetry.io/otel/metric@v1.47.0 go.opentelemetry.io/otel/sdk@v1.47.0 go.opentelemetry.io/otel/sdk/metric@v1.47.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.47.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.47.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.47.0 go.opentelemetry.io/otel/exporters/otlp/otlpmetric/otlpmetricgrpc@v1.47.0 go.opentelemetry.io/otel/exporters/otlp/otlpmetric/otlpmetrichttp@v1.47.0 go.opentelemetry.io/otel/exporters/stdout/stdouttrace@v1.47.0 go.opentelemetry.io/otel/exporters/stdout/stdoutmetric@v1.47.0 go.opentelemetry.io/otel/log@v1.47.0 go.opentelemetry.io/otel/sdk/log@v1.47.0 go.opentelemetry.io/otel/exporters/otlp/otlplog/otlploggrpc@v0.23.0 go.opentelemetry.io/otel/exporters/otlp/otlplog/otlploghttp@v0.23.0 go.opentelemetry.io/otel/exporters/stdout/stdoutlog@v0.23.0 go.opentelemetry.io/otel/exporters/prometheus@v0.69.0 go.opentelemetry.io/contrib/bridges/otelzap@v0.21.0 go.opentelemetry.io/contrib/bridges/otellogrus@v0.21.0 github.com/go-jose/go-jose/v4@v4.1.6"
      MODS="$(echo "$FLOOR" | tr ' ' '\n' | cut -d@ -f1)"
      # prints "<mod>@<floor> (<tag> has <ver>)" for every module below its floor
      below_floor() {
        awk -v floor="$FLOOR" -v tag="$1" '
          BEGIN { n = split(floor, f, " ")
                  for (i = 1; i <= n; i++) { split(f[i], kv, "@"); want[kv[1]] = kv[2] } }
          ($1 in want) {
            split(substr($2, 2), g, "."); split(substr(want[$1], 2), w, ".")
            for (i = 1; i <= 3; i++) {
              if ((g[i] + 0) > (w[i] + 0)) next
              if ((g[i] + 0) < (w[i] + 0)) { print $1 "@" want[$1] " (" tag " has " $2 ")"; next }
            }
          }'
      }
      # `go list -m` prints "<mod> <ver>" or "<mod> <ver> => <mod> <ver>", so $NF is
      # the EFFECTIVE version and a replace cannot hide behind the require line.
      GOFLAGS=-mod=mod go list -m -e $MODS
      need="$(GOFLAGS=-mod=mod go list -m -e $MODS | awk 'NF >= 2 && $NF ~ /^v[0-9]/ { print $1, $NF }' | below_floor go.mod | awk '{ print $1 }')"
      if [ -n "$need" ]; then GOFLAGS=-mod=mod go get $need; fi
      GOFLAGS=-mod=mod go mod tidy

      go build -trimpath \
        -ldflags "-s -w -X github.com/kgateway-dev/kgateway/v2/pkg/version.Version=v${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/kgateway" ./cmd/kgateway

  # Envoy comes from our from-source envoy image (apps/envoy), pinned by index digest per
  # kgateway release in build.conf. Every hop (index, arch manifest, layer) is checked
  # against its sha256 before use; the inventory under /usr/share/envoy rides along for
  # the CPE gate.
  - runs: |
      set -eu
      repo=quenchworks/images/envoy
      case "${{build.arch}}" in x86_64) arch=amd64 ;; aarch64) arch=arm64 ;; esac
      tok="$(curl -fsSL "https://ghcr.io/token?scope=repository:$repo:pull" | jq -r .token)"
      get() {
        curl -fsSL -H "Authorization: Bearer $tok" -H "Accept: $2" "https://ghcr.io/v2/$repo/$1" > "$3"
        test "sha256:$(sha256sum "$3" | cut -d' ' -f1)" = "${1#*/}"
      }
      get manifests/__ENVOY_INDEX__ application/vnd.oci.image.index.v1+json /tmp/envoy-index.json
      m="$(jq -r --arg a "$arch" '.manifests[]|select(.platform.architecture==$a)|.digest' /tmp/envoy-index.json)"
      get "manifests/$m" application/vnd.oci.image.manifest.v1+json /tmp/envoy-manifest.json
      for l in $(jq -r '.layers[].digest' /tmp/envoy-manifest.json); do
        get "blobs/$l" '*/*' /tmp/envoy-layer.tgz
        tar -xzf /tmp/envoy-layer.tgz -C "${{targets.destdir}}" usr/bin/envoy usr/share/envoy 2>/dev/null || true
      done
      "${{targets.destdir}}/usr/bin/envoy" --version
      test -s "${{targets.destdir}}/usr/share/envoy/inventory.cdx.json"
