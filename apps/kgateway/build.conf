# kgateway: from-source via melange (Go control plane built from the release tarball).
# This is the CONTROL PLANE only -- it implements Gateway API and programs Envoy over
# xDS. The data plane is the companion `kgateway-envoy` image (our hardened Wolfi envoy
# plus kgateway's own `envoyinit` bootstrap shim); see apps/kgateway-envoy.
#
# WINDOW IS 2 MINOR LINES, NOT 3, and that is a clean-room decision, not laziness:
# kgateway 2.2.x pins its amd64 data plane to `quay.io/solo-io/envoy-gloo:1.36.9-patch1`
# (Makefile ENVOY_IMAGE_AMD64), a Solo.io fork of Envoy carrying the C++ transformation
# filters. Only its arm64 leg used stock envoyproxy/envoy. We cannot reproduce that fork
# from Wolfi's envoy apk and we do not ship other vendors' binaries, so 2.2.x has no
# data plane here. 2.3.0 moved the whole project to STOCK upstream Envoy plus an Envoy
# Rust dynamic module, which is why 2.3.x and 2.4.x can run on our own envoy image.
# Re-check the window when 2.5.0 ships.
#
# ENVOY COUPLING (both images pin the same apk; report drift, never paper over it):
#   kgateway 2.3.7 -> upstream ENVOY_IMAGE envoyproxy/envoy:v1.37.5  (Wolfi tops out at
#                    envoy-1.37 = 1.37.1, so we run 4 patches behind inside the minor)
#   kgateway 2.4.3 -> upstream ENVOY_IMAGE envoyproxy/envoy:v1.38.3  (Wolfi tops out at
#                    envoy-1.38 = 1.38.1, so we run 2 patches behind inside the minor)
# Within one Envoy minor the xDS API and bootstrap schema are stable, which is what the
# control plane depends on; the patch gap is a Wolfi packaging lag, not an API gap.
#
# NOT SHIPPED, deliberately, and the chart README says so: `librust_module.so`, the
# Envoy Rust dynamic module upstream bakes into both of its images. It is only reachable
# through TrafficPolicy `transformation` and `rbac`/http-acl, and it cannot be built here
# today -- internal/envoy_modules/rust-toolchain.toml pins Rust channel 1.95.0 while
# Wolfi's newest is rust-1.92, and its SDK is a git dependency on the envoyproxy/envoy
# repo at the EXACT Envoy patch tag (2.4.3 -> v1.38.3) because the dynamic-module ABI is
# version-checked at load time against the Envoy binary. Everything else -- Gateway,
# HTTPRoute, GRPCRoute, TCPRoute, TLSRoute, Backend, BackendConfigPolicy,
# HTTPListenerPolicy, ListenerPolicy, DirectResponse and the rest of TrafficPolicy --
# needs no dynamic module.
#
# Single static Go binary, no CGO (upstream's GO_BUILD_FLAGS is
# `GO111MODULE=on CGO_ENABLED=0`). The version is stamped the way upstream's Makefile
# LDFLAGS does it, into pkg/version.Version, so `kgateway --version` reports the real
# release. The apko image also carries the Wolfi envoy binary at /usr/local/bin/envoy:
# that is the path pkg/validator hard-codes for `envoy --mode validate`, which is what
# the chart's `validation.level: strict` forks per translation.
FROM_SOURCE=1
VERSIONS=(2.3.7 2.4.3)
declare -A SHA256=(
  [2.3.7]=331c3d571d7d0ca7d21f54175bb6b60e49c8cbe3246b9373ca76f21aa018dc2b
  [2.4.3]=ed7b4486cfc1f524f6c247152377b60b9c4e6fa6565570684861f24a77a99014
)
# Wolfi packages envoy by minor; pin the exact apk so the image is reproducible.
declare -A ENVOY_PKG=(
  [2.3.7]=envoy-1.37=1.37.1-r3
  [2.4.3]=envoy-1.38=1.38.1-r0
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g; s|__ENVOY_PKG__|${ENVOY_PKG[$1]}|g"; }
