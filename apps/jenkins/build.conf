# STATUS: BLOCKED (do not publish)
#   Jar : jenkins.war!/WEB-INF/lib/jenkins-core-2.555.3.jar
#   CVE : CVE-2026-53441 (HIGH) — Jenkins core stored XSS via unescaped description
#   Fix : only in Jenkins WEEKLY 2.568; no LTS release ships it (war-stable tops
#         out at 2.555.3 as of 2026-07-04). jenkins-core is the coupled heart of
#         the war (lockstep with cli/remoting/war manifest/bundled plugins), NOT an
#         independently swappable standalone jar — dropping jenkins-core-2.568.jar
#         into the 2.555.3 war is infeasible. Needs a Jenkins bump to an LTS line
#         that does not yet exist. Unblock when a >=2.568 LTS is published.
#   (The MEDIUM/LOW spring-security-{core,web}-6.5.9 CVEs ARE same-major standalone
#    swaps, but are moot while the HIGH jenkins-core CVE stays unfixable.)
#
# jenkins (Jenkins LTS): ships the upstream noarch jenkins.war (pure Java) on a
# hardened Wolfi JRE, the CVE surface the Trivy gate scans. Jenkins bumps the LTS
# minor every ~12 weeks; we ship the newest patch of each of the last 3 LTS lines
# (2.528.x, 2.541.x, 2.555.x). The war is architecture-independent, so a single
# sha256 per version (NOT per-arch) -- the arch comes entirely from the JRE.
# Server app: image + chart.
