# STATUS: OK — unblocked 2026-07-10 by switching from the LTS line to the WEEKLY
# release line. CVE-2026-53441 (HIGH, jenkins-core stored XSS) is fixed only in
# weekly 2.568+ and no LTS release ships it (war-stable still tops out at 2.555.3),
# so we ship the newest weekly war (2.572) from get.jenkins.io/war/ instead of
# war-stable/. Revisit shipping LTS lines again once an LTS >= 2.568 exists.
#
# jenkins (Jenkins, weekly line): ships the upstream noarch jenkins.war (pure Java)
# on a hardened Wolfi JRE, the CVE surface the Trivy gate scans. Weekly releases
# ship ~every week; we ship the single newest weekly. The war is
# architecture-independent, so a single sha256 per version (NOT per-arch) -- the
# arch comes entirely from the JRE.
# Server app: image + chart.
FROM_SOURCE=1
VERSIONS=(2.572)
declare -A SHA256=(
  [2.572]=0c3ea851b126ee86a921822a3b9963549753e629a52d7a4e3b3378e3d5e23f26
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
