# Packages Jenkins (weekly line) onto Wolfi. Jenkins is a JVM app: we ship the
# upstream noarch jenkins.war (prebuilt) on a hardened Wolfi JRE, which is the CVE
# surface the Trivy gate scans. No compilation -- fetch the war, drop it under
# /usr/share/jenkins, and create a writable nonroot JENKINS_HOME.
# __WARPATH__ is war-stable/ for an LTS (2.580.1, the first LTS past the CVE-2026-53441
# fix in 2.568) and war/ for the weekly 2.572 the chart still pins.
package:
  name: quench-jenkins
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Jenkins (weekly line) automation server, packaged on Wolfi"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - openjdk-21-jre        # the JRE Jenkins runs on (the scanned CVE surface; Java 17 min, 21 supported)
      - ca-certificates-bundle
      - busybox

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - curl                  # fetch the fixed guava jar from Maven Central
      - unzip                 # unzip -Z1 (busybox unzip has no -Z)
      - zip                   # swap the jar inside the war

pipeline:
  - uses: fetch
    with:
      # The war is architecture-independent: same artifact on amd64/arm64.
      uri: https://get.jenkins.io/__WARPATH__/${{package.version}}/jenkins.war
      expected-sha256: "__SHA256__"
      extract: false       # a bare noarch .war, not an archive: keep it as-is
  - runs: |
      # guava 33.6.0-jre (2.572) and 33.7.1-jre (2.580.x, still in 2.580.2) carry
      # CVE-2026-102554; 33.7.2-jre fixes it. The war is unsigned and Jetty loads every
      # WEB-INF/lib jar, so swap the jar in place under its own versioned name (2026-11-01).
      set -eu
      old="$(unzip -Z1 jenkins.war | grep -E '^WEB-INF/lib/guava-[0-9.]+-jre\.jar$')"
      if [ "$old" != WEB-INF/lib/guava-33.7.2-jre.jar ]; then
        mkdir -p swap/WEB-INF/lib
        curl -fsSL -o swap/WEB-INF/lib/guava-33.7.2-jre.jar \
          https://repo1.maven.org/maven2/com/google/guava/guava/33.7.2-jre/guava-33.7.2-jre.jar
        echo "b530942257fb935f8b2cfaa5f8eb5bd59c555fd8e8d01b8ce98912e077ea606c  swap/WEB-INF/lib/guava-33.7.2-jre.jar" | sha256sum -c -
        zip -qd jenkins.war "$old"
        (cd swap && zip -q0 ../jenkins.war WEB-INF/lib/guava-33.7.2-jre.jar)
        rm -rf swap
      fi
      [ "$(unzip -Z1 jenkins.war | grep -cE '^WEB-INF/lib/guava-[0-9.]+-jre\.jar$')" = 1 ]
      unzip -Z1 jenkins.war | grep -qx WEB-INF/lib/guava-33.7.2-jre.jar
  - runs: |
      # install the noarch war under /usr/share/jenkins
      install -d "${{targets.destdir}}/usr/share/jenkins"
      install -m 0644 jenkins.war "${{targets.destdir}}/usr/share/jenkins/jenkins.war"
      # NOTE: the writable JENKINS_HOME (/var/jenkins_home) is created and owned by
      # the nonroot uid via apko's `paths:` block -- numeric chown is not permitted
      # in the melange build sandbox.

test:
  pipeline:
    - runs: |
        test -f /usr/share/jenkins/jenkins.war
