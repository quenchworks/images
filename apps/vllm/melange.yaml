# Packages the vLLM CPU inference/serving engine onto Wolfi. vLLM is a PyTorch-based
# Python app distributed as a wheel, not a binary — and the PyPI wheel is the CUDA build
# (torch + flashinfer + nvidia-cutlass-dsl[cu13]: multi-GB, un-hardenable, GPU-only). vLLM
# publishes pre-built CPU wheels at https://wheels.vllm.ai/<VER>/cpu that depend on the
# CPU build of torch (torch==<x>+cpu, from https://download.pytorch.org/whl/cpu) — so we
# install that CPU wheel from PyPI-style indexes into a virtualenv on a Wolfi python-3.12
# base (NO source compile), harden it on a minimal apko base, and gate it 0-CVE with Trivy
# (comprehensive mode, which scans the venv's ~140 Python packages too).
#
# The venv lives at /opt/vllm/venv; vllm is pinned to the build version's CPU wheel so the
# install matches the catalog version exactly. setuptools is bumped to 83.0.0 to clear the
# FIXABLE CVE-2025-47273 that the stock 77.0.3 pin carries AND CVE-2026-59890 (gate-blocking)
# that 80.9.0 still carries. This exceeds vLLM's declared >=77.0.3,<81.0.0 runtime constraint,
# but setuptools is build tooling (never imported on the inference path), the bump runs as a
# separate post-install pip invocation so it does not trip vLLM's own resolver, and
# `import vllm` is verified afterward in test.sh.
package:
  name: quench-vllm
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened vLLM (CPU) inference & serving engine, packaged on Wolfi"
  copyright:
    - license: Apache-2.0
  # Disable melange's automatic SO-dependency scan (SCA). The venv's wheels bundle their
  # own native libs (torch/lib/*, opencv .libs, the Intel oneAPI SYCL/Level-Zero/OpenCL/
  # TBB runtimes from intel-openmp) and load them via rpath — they are self-contained
  # inside the package. The scanner otherwise emits unsatisfiable `so:` depends: e.g.
  # numba's omppool.so has DT_NEEDED=libgomp.so.1.0.0 (the fully-versioned soname), which
  # NO Wolfi package provides as a `so:` string even though the file exists — so apko
  # can't solve it. We instead pin the genuinely-external system libs explicitly below;
  # ld.so resolves them by filename at runtime (Wolfi ships /usr/lib/libgomp.so.1.0.0 and
  # /usr/lib/libnuma.so.1). Verified by the `import vllm` smoke in test.sh.
  options:
    no-depends: true
  dependencies:
    runtime:
      - python-3.12            # the venv references the system interpreter; it must be present at runtime
      - ca-certificates-bundle # TLS to model registries (Hugging Face Hub, etc.)
      - libgcc                 # C++ runtime for torch/opencv/native extensions
      - libstdc++
      - glibc
      - tzdata
      - libgomp                # GNU OpenMP — numba's omppool.so links libgomp.so.1.0.0
      - numactl                # provides libnuma.so.1 — needed by torch(+cpu) NUMA support

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - python-3.12
      - py3.12-pip
      - build-base             # fallback for any transitive dep that has no wheel (sdist build)
      - rust                   # Rust extensions rebuilt from sdist (see the pipeline)
      - cargo-auditable
      - perl                   # openssl-src (vllm-rs native-tls-vendored)
      - openssl-4.0-dev        # cryptography from sdist, on the OpenSSL python-3.12 links
      - pkgconf

pipeline:
  # Create an isolated venv and install the vLLM CPU wheel from the version-specific CPU
  # index (wheels.vllm.ai/<VER>/cpu) plus the PyTorch CPU index. --no-cache-dir keeps the
  # layer small. All shebangs in the venv point at /opt/vllm/venv/bin/python.
  - runs: |
      VER="${{package.version}}"
      dest="${{targets.destdir}}"

      python3.12 -m venv /opt/vllm/venv
      /opt/vllm/venv/bin/pip install --no-cache-dir --upgrade pip
      /opt/vllm/venv/bin/pip install --no-cache-dir \
        --extra-index-url "https://wheels.vllm.ai/${VER}/cpu" \
        --extra-index-url "https://download.pytorch.org/whl/cpu" \
        "vllm==${VER}+cpu"

      # Clear the FIXABLE CVEs the pip build pulls into the venv as build tooling (none of
      # these are vLLM runtime deps, but Trivy comprehensive scans them anyway):
      #   setuptools 77.0.3  -> CVE-2025-47273 (fixed 78.1.1) + CVE-2026-59890 (fixed 83.0.0,
      #                         gate-blocking, also present in 80.9.0). Bumped to 83.0.0.
      #   wheel 0.45.1       -> CVE-2026-24049 (fixed 0.46.2)
      #   jaraco.context 5.3 -> CVE-2026-23949 (fixed 6.1.0)  [a setuptools dependency]
      # Bumping (not removing) keeps setuptools/pkg_resources importable for any runtime
      # `import pkg_resources`. Verified `import vllm` still succeeds afterward.
      /opt/vllm/venv/bin/pip install --no-cache-dir \
        "setuptools==83.0.0" "wheel>=0.46.2" "jaraco.context>=6.1.0"

      # setuptools 80.9.0 still bundles OLD vendored copies under setuptools/_vendor:
      # jaraco.context 5.3.0 (CVE-2026-23949) and wheel 0.45.1 (CVE-2026-24049). They
      # are used only by setuptools' package-BUILD machinery, never at inference. The
      # fixed top-level copies (jaraco.context 6.1.x, wheel >=0.46.2) are installed and
      # setuptools' extern importer falls back to them, so deleting the vendored dupes
      # (code + dist-info) ships no vulnerable code and keeps `import setuptools`/
      # `pkg_resources` working. Verified by the `import vllm` smoke in test.sh.
      sp="/opt/vllm/venv/lib/python3.12/site-packages/setuptools/_vendor"
      rm -rf "$sp"/jaraco.context-5*.dist-info "$sp"/jaraco/context.py \
             "$sp"/wheel-0.45*.dist-info "$sp"/wheel

      # vllm --version must work headless (no GPU, no model); assert it at build time.
      # (import vllm + the version check run in test.sh against the assembled image.)
      VENV=/opt/vllm/venv
      SITE="$VENV/lib/python3.12/site-packages"
      # sdist <dist>: unpack the sdist of the installed version; prints its directory
      sdist() {
        v=$("$VENV/bin/python" -c "import importlib.metadata as m, sys; print(m.version(sys.argv[1]))" "$1")
        d=$(mktemp -d)
        "$VENV/bin/pip" download -q --no-cache-dir --no-deps --no-binary "$1" "$1==$v" -d "$d"
        tar -xzf "$d"/*.tar.gz -C "$d"
        ls -d "$d"/*/
      }
      # --- Rust extensions: rebuilt from sdist with cargo auditable (2026-10-13) -----
      # A PyPI Rust wheel embeds no crate list, so Trivy scanned none of its crates (pyo3
      # below 0.29, GHSA-36hh HIGH, passed blind). Every Rust extension in the venv is
      # rebuilt from its sdist through `cargo auditable` (the wrapper reroutes only build
      # and rustc); the .dep-v0 section lists the crates and the gate scans them.
      RUSTSO="
      import importlib.metadata as m, os, sys
      for d in m.distributions(path=[sys.argv[1]]):
          for f in d.files or ():
              p = str(f.locate())
              if '.so' not in f.name or os.path.islink(p):
                  continue
              b = open(p, 'rb').read()
              if b'rustc version' not in b and b'.dep-v0' not in b and b'/cargo/registry/src/' not in b:
                  continue
              if sys.argv[2] == 'all' or b'.dep-v0' not in b or not os.stat(p).st_mode & 0o111:
                  print(d.metadata['Name'] + '==' + d.version)
                  break
      "
      CW=$(mktemp -d)
      printf '#!/bin/sh\ncase "$1" in build|rustc) exec /usr/bin/cargo auditable "$@";; esac\nexec /usr/bin/cargo "$@"\n' > "$CW/cargo"
      chmod +x "$CW/cargo"
      # Raise vulnerable crates to their fixed release on the same semver line (never down).
      cfloor() {
        line="${2%.*}"
        locked() { awk -v n="$1" '$0=="name = \""n"\"" {getline; gsub(/version = |"/,""); print}' Cargo.lock; }
        for v in $(locked "$1"); do
          case "$v" in "$line".*) ;; *) continue ;; esac
          [ "$v" = "$2" ] && continue
          [ "$(printf '%s\n%s\n' "$v" "$2" | sort -V | head -1)" = "$v" ] || continue
          cargo update -p "$1@$v" --precise "$2"
        done
      }
      # cup <crate>...: cargo update each crate the lock holds, with the dependencies its
      # newest compatible release needs (time and serde_with also move serde/serde_json)
      cup() { for c in "$@"; do if grep -qx "name = \"$c\"" Cargo.lock; then cargo update --recursive -p "$c"; fi; done; }
      # pyo3 below 0.29 (GHSA-36hh HIGH): llguidance 1.7.6 (vllm caps <1.8), safetensors
      # 0.8.0, outlines-core 0.2.14 (vllm pins it), oss-harmony 0.0.11 (0.31) and
      # openai-harmony 0.0.8 (0.30) are each the release vllm takes. All compile on pyo3
      # 0.29.3 with the pin raised; the harmony crates also need PyObject spelled Py<PyAny>
      # (the alias left in 0.29). Measured 2026-10-13. Packages a version lacks are skipped.
      for pk in llguidance:python_ext/ safetensors:bindings/python/ outlines-core: oss-harmony: openai-harmony: fastar:; do
        "$VENV/bin/pip" show "${pk%%:*}" >/dev/null 2>&1 || continue
        D=$(sdist "${pk%%:*}")
        sed -i -E 's/^(pyo3 = \{ ?version = )"0[.]2[0-8][.0-9]*"/\1"0.29"/' "$D${pk#*:}Cargo.toml"
        case "${pk%%:*}" in *harmony) sed -i 's/PyResult<PyObject>/PyResult<Py<PyAny>>/' "${D}src/py_module.rs" ;; esac
        # and the other crates their locks hold below a fix, each to its patch release
        (cd "$D${pk#*:}" && cargo update -p pyo3 && case "${pk%%:*}" in
          outlines-core) cup bytes quinn-proto rustls rustls-webpki && cfloor rand 0.8.6 && cfloor rand 0.9.3 ;;
          *harmony) cup bytes quinn-proto rustls rustls-webpki time serde_with && cfloor rand 0.8.6 ;;
          fastar) cup tar ;;
        esac)
        PATH="$CW:$PATH" "$VENV/bin/pip" install --no-cache-dir --no-deps --force-reinstall "$D"
      done
      # vllm's own Rust artifacts (the vllm-rs frontend and _rust_tool_parser) come prebuilt
      # in the +cpu wheel without .dep-v0, on pyo3 0.28.3. Both are rebuilt from this
      # version's PyPI sdist (sha256 checked against PyPI) with pyo3/pythonize 0.29 (the
      # parser compiles unchanged, measured 2026-10-13), the features tools/build_rust.py
      # uses, and the lock raised to patch releases (rustls, rustls-webpki, serde_with,
      # openssl-src for the vendored OpenSSL, rand).
      VS=$(mktemp -d)
      "$VENV/bin/python" -c "
      import hashlib, json, sys, tarfile, urllib.request as u
      d = json.load(u.urlopen('https://pypi.org/pypi/vllm/' + sys.argv[2] + '/json', timeout=60))
      s = next(x for x in d['urls'] if x['packagetype'] == 'sdist')
      b = u.urlopen(s['url'], timeout=900).read()
      assert hashlib.sha256(b).hexdigest() == s['digests']['sha256'], 'vllm sdist sha mismatch'
      open(sys.argv[1] + '/v.tgz', 'wb').write(b)
      tarfile.open(sys.argv[1] + '/v.tgz').extractall(sys.argv[1], filter='data')
      " "$VS" "$VER"
      R="$VS/vllm-$VER/rust"
      sed -i -E -e 's/^pyo3 = "0[.]2[0-8][.0-9]*"/pyo3 = "0.29"/' -e 's/^pythonize = "0[.]2[0-8][.0-9]*"/pythonize = "0.29"/' "$R/Cargo.toml"
      (cd "$R" && cargo metadata --format-version 1 >/dev/null \
        && cargo update -p pyo3 -p pythonize -p rustls -p rustls-webpki -p serde_with -p openssl-src \
        && cfloor rand 0.8.6 && cfloor rand 0.9.3 \
        && VLLM_RS_BUILD_VERSION="$VER" PYO3_PYTHON="$VENV/bin/python" cargo auditable build --release -p vllm-cmd --bin vllm-rs --features native-tls-vendored \
        && PYO3_BUILD_EXTENSION_MODULE=1 PYO3_PYTHON="$VENV/bin/python" cargo auditable build --release -p vllm-tool-parser-py --features pyo3/abi3-py38)
      install -m0755 "$R/target/release/vllm-rs" "$SITE/vllm/vllm-rs"
      install -m0755 "$R/target/release/lib_rust_tool_parser.so" "$SITE/vllm/_rust_tool_parser.abi3.so"
      readelf -S "$SITE/vllm/vllm-rs" | grep dep-v0 >/dev/null
      test "$("$SITE/vllm/vllm-rs" --version)" = "vllm-rs $VER"
      "$VENV/bin/python" -c "import vllm._rust_tool_parser"
      rm -rf "$VS"
      for spec in $("$VENV/bin/python" -c "$RUSTSO" "$SITE" blind); do
        PATH="$CW:$PATH" "$VENV/bin/pip" install --no-cache-dir --no-deps --force-reinstall --no-binary "${spec%%==*}" "$spec"
      done
      BLIND=$("$VENV/bin/python" -c "$RUSTSO" "$SITE" blind)
      test -z "$BLIND" || { echo "Rust extensions without .dep-v0: $BLIND"; exit 1; }
      echo "Rust extensions, all auditable:" $("$VENV/bin/python" -c "$RUSTSO" "$SITE" all)

      /opt/vllm/venv/bin/vllm --version | tail -1 | grep -q "^${VER}+cpu$"

      # Remove pip from the venv. After the bumps above, the LAST fixable findings on this
      # image are pip's OWN vendored copies under pip/_vendor/ -- setuptools 70.3.0
      # (CVE-2025-47273 HIGH, CVE-2026-59890 MEDIUM) and msgpack 1.1.2
      # (GHSA-6v7p-g79w-8964 HIGH). Trivy reads them from pip's bundled CycloneDX
      # (pip/_vendor/bom.cdx.json), so they carry no PkgPath and no top-level pin can
      # reach them: those exact versions are what pip's vendor.txt pins, and every current
      # pip release vendors the same set. vLLM is an inference server, never a package
      # installer, so deleting pip removes the vulnerable CODE rather than suppressing the
      # finding -- no .trivyignore, no --skip, no VEX. Must run AFTER every pip install
      # above; nothing later in this step uses pip. (Same fix as apps/mlflow.)
      /opt/vllm/venv/bin/pip uninstall -y pip
      # `test !` and not `! test`: set -e ignores a status inverted with `!`, so
      # `! test -e f` would never fail the build. This form does.
      test ! -e /opt/vllm/venv/lib/python3.12/site-packages/pip/_vendor/vendor.txt

      # Relocate the venv into the package tree under /opt/vllm.
      install -d "${dest}/opt/vllm"
      cp -a /opt/vllm/venv "${dest}/opt/vllm/venv"

      # Convenience symlink on PATH.
      install -d "${dest}/usr/bin"
      ln -sf /opt/vllm/venv/bin/vllm "${dest}/usr/bin/vllm"

      chmod -R a+rX "${dest}/opt/vllm"

test:
  pipeline:
    - runs: |
        test -x /opt/vllm/venv/bin/vllm
        vllm --version
