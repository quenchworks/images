#
# Evidence for 0.29.0, stated exactly as measured:
#   x86_64  gated locally 2026-09-19, PUSH=0: 0 fixable CVEs, with
#           vllm-0.29.0+cpu installed and no CVE-2026-69147 row anywhere.
#   boot    NOT completed locally. The boot test was cut off when this host's
#           watchdog killed the run; CI runs test.sh before publishing.
#   aarch64 NOT measured locally, which matches what apko.yaml already says:
