# STATUS: ZLIB-ONLY as of 2026-09-16. Measured, not assumed: run 35067000720
# on af0623d gated with exactly one finding, zlib CVE-2026-85091, on every
# version and both arches. Nothing else in this image is flagged.
#
# This recipe carried an explicit BLOCKED=0 and so kept building and failing
# on every sweep. The measurement above is what changes it to 1: the gate
# cannot pass until Wolfi ships zlib 1.3.3-r0, which upstream madler/zlib
# has never tagged. Downgrading to Wolfi's 1.3.1-r51 is not a way out: it
# predates the 1.3.2-r0 fix for CVE-2026-27171.
#
# Clear it with scripts/blocked.py --dispatch once 1.3.3-r0 lands.
# vllm: image-only recipe input (CPU-only inference/serving engine).
#
# vLLM is a Python package (PyTorch-based LLM inference/serving engine). The wheels on
# PyPI are the CUDA build (they hard-pin torch==2.11.0 + flashinfer + nvidia-cutlass-dsl
# [cu13] + nvidia-cudnn-frontend -> a multi-GB CUDA tree that can never reach 0 CVEs and
# is pointless without a GPU). vLLM publishes SEPARATE, pre-built CPU wheels at
# https://wheels.vllm.ai/<VER>/cpu (since 0.17.0) that depend on torch==<x>+cpu from
# https://download.pytorch.org/whl/cpu — NO source compile needed. We install that CPU
# wheel into a virtualenv on a Wolfi python-3.12 base (the mlflow venv-on-Wolfi pattern),
# harden it on a minimal apko base, and gate it 0-CVE with Trivy (comprehensive mode, so
# the venv's Python packages are scanned too).
#
# This is a GPU-runtime app; QuenchWorks ships the CPU variant so the CI/local gate is a
# CPU-only smoke (`vllm --version` + `import vllm`, no model load, no GPU). At runtime the
# CPU path wants an avx512f/avx2 CPU; the OpenAI-compatible server is `vllm serve <model>`
# on :8000.
#
# LATEST-ONLY (churny ML app, per-release dep pins). vLLM pins its torch/torchcodec deps
# per release; no single set builds every line (see the torchcodec note below), so — like
# the Excalidraw/Ghost pattern — the catalog ships the current stable line only.
# The pip install pins vllm==<VER>+cpu; the version-specific CPU index resolves the exact
# torch+cpu pin for that line, so there is no per-arch source SHA to track. render()
# substitutes __VER__ into both recipes (including the wheels.vllm.ai/__VER__/cpu index).
#
# setuptools note: vLLM's CPU wheel pulls setuptools==77.0.3, which carries the FIXABLE
# CVE-2025-47273 (path traversal, fixed in 78.1.1). vLLM's runtime constraint is
# >=77.0.3,<81.0.0; the recipe bumps setuptools to 83.0.0 in-place to clear that CVE plus the
# gate-blocking CVE-2026-59890 still present in 80.9.0 (setuptools is build-only tooling, so
# exceeding the declared upper bound is safe — see melange.yaml).
# torchcodec note (2026-07-15): vLLM pulls a `torchcodec` dependency whose CPU wheel needs
# FFmpeg libs. 0.25.1's torchcodec ships them bundled (libtorchcodec_core*.so + libavutil.so
# alongside, rpath-loaded), so `vllm --version` works with NO system ffmpeg and gates 0-CVE
# both arches in CI. 0.25.0's torchcodec does NOT bundle them and fails at import
# (`libavutil.so.56: cannot open shared object file`; Wolfi ships ffmpeg 7 / libavutil.so.59,
# not the .so.56 it wants) -> CI build FAIL. Hence latest-only: the catalog ships the
# current line (0.27.1 as of 2026-08-27) and drops the older ones.
FROM_SOURCE=0
# STATUS 2026-08-27: UNBLOCKED at 0.27.1. History: blocked 2026-07-23 on torch
# CVE-2025-3000 (LOW, fixed in torch 2.13.0) while 0.25.1/0.26.0 still pinned torch
# 2.11.0. vLLM 0.27.1+cpu now resolves torch 2.13.0+cpu, so that blocker is gone.
# Re-gated today at 0.27.1 (x86_64, comprehensive Trivy, CHML, --ignore-unfixed): the
# only residue was pip's OWN vendored set, read by Trivy out of pip's bundled CycloneDX
# (pip/_vendor/bom.cdx.json, so no PkgPath): setuptools 70.3.0 (CVE-2025-47273 HIGH +
# CVE-2026-59890 MEDIUM) and msgpack 1.1.2 (GHSA-6v7p-g79w-8964 HIGH). No top-level pin
# reaches those -- pip's vendor.txt pins them and every current pip release vendors the
# same set -- so melange.yaml now uninstalls pip from the venv after the installs (same
