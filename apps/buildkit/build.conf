# buildkit (moby/buildkit): from-source via melange. buildkitd + buildctl, both
# static Go (CGO_ENABLED=0), built with upstream's Dockerfile tags and ldflags.
# The image is the ROOTLESS variant: buildkitd runs under rootlesskit as uid 1001
# with a subuid range, on Wolfi runc, rootlesskit, fuse-overlayfs and newuidmap.
# Latest patch of the last 3 minor lines.
FROM_SOURCE=1
VERSIONS=(0.31.2 0.32.2 0.33.1)
declare -A SHA256=(
  [0.31.2]=3085082772044c5cf0431d969603618ff7519d6c82dc1fe19ae83803d8973aa1
  [0.32.2]=b19deba3f8cf3eb05407aa85c246e22839770c437439a04d880ef3d645aed0aa
  [0.33.1]=044ab46b73e8aac007f504cf4e8c3ee3a2eb05c4c2a65018bd8b6f2c56a17f62
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
