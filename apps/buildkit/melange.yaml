# Builds BuildKit from source onto Wolfi: buildkitd (the daemon) and buildctl (the
# client). Flags follow upstream's Dockerfile: CGO off, tags
# "osusergo netgo static_build seccomp", version stamped via -X on
# github.com/moby/buildkit/version. runc, fuse-overlayfs and newuidmap come from
# Wolfi as runtime deps. rootlesskit is built from source below (Wolfi 3.2.0-r1
# links x/net v0.58.0, CVE-2026-78669), and this package owns /etc/subuid and
# /etc/subgid ("nonroot:100000:65536", as Wolfi's rootlesskit-config-nonroot
# writes them), so the image names its uid-1001 user nonroot.
package:
  name: quench-buildkit
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened BuildKit (rootless buildkitd + buildctl), built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - runc
      - mount             # rootlesskit shells out to mount and unshare
      - util-linux-misc
      - fuse-overlayfs
      - fuse3
      - just-newuidmap-newgidmap
      # git sources: git spawns /bin/sh for ssh and hooks, so the image keeps a shell.
      - busybox
      - git
      - openssh-client
      - pigz
      - xz
    # /etc/subuid and /etc/subgid: shadow-subids ships them empty.
    replaces:
      - shadow-subids

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - curl
      - go

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/moby/buildkit/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      set -eu
      export CGO_ENABLED=0
      export GOTOOLCHAIN=local
      export GOFLAGS=-mod=mod
      # ---- 0-CVE module float (docs/go-module-float.md) ----------------------
      # FLOOR is a floor, not a pin: only modules below it are raised, and the
      # shipped binaries are asserted at or above it after the build.
      # At v0.33.0: containerd/v2 v2.3.4 (CVE-2026-53495, fixed 2.3.5; CVE-2026-53493,
      # fixed 2.3.6, so the floor is 2.3.6), x/crypto
      # v0.55.0 (CVE-2026-56855, CVE-2026-78662), moby/go-archive v0.2.0
      # (CVE-2026-17106, HIGH, buildkitd only). The 0.31 and 0.32 lines also carry
      # x/mod v0.38.0 (CVE-2026-56864), grpc v1.81/v1.82 (CVE-2026-84304, -84303,
      # -84445) and otel otlptrace v1.44.0 (CVE-2026-81870); otel floats as one
      # family so the exporters stay on the core's version.
      FLOOR="golang.org/x/net@v0.60.0 github.com/containerd/containerd/v2@v2.3.6 golang.org/x/crypto@v0.57.0 github.com/moby/go-archive@v0.3.0 golang.org/x/mod@v0.41.0 google.golang.org/grpc@v1.83.2 go.opentelemetry.io/otel@v1.45.0 go.opentelemetry.io/otel/sdk@v1.45.0 go.opentelemetry.io/otel/trace@v1.45.0 go.opentelemetry.io/otel/metric@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.45.0"
      MODS="$(echo "$FLOOR" | tr ' ' '\n' | cut -d@ -f1)"
      below_floor() {
        awk -v floor="$FLOOR" -v tag="$1" '
          BEGIN { n = split(floor, f, " ")
                  for (i = 1; i <= n; i++) { split(f[i], kv, "@"); want[kv[1]] = kv[2] } }
          ($1 in want) {
            split(substr($2, 2), g, "."); split(substr(want[$1], 2), w, ".")
            for (i = 1; i <= 3; i++) {
              if ((g[i] + 0) > (w[i] + 0)) next
              if ((g[i] + 0) < (w[i] + 0)) { print $1 "@" want[$1] " (" tag " has " $2 ")"; next }
            }
          }'
      }
      need="$(go list -m -e $MODS | awk 'NF >= 2 && $NF ~ /^v[0-9]/ { print $1, $NF }' | below_floor go.mod | awk '{ print $1 }')"
      if [ -n "$need" ]; then go get $need; fi
      go mod tidy
      rm -rf vendor
      PKG=github.com/moby/buildkit
      LDF="-s -w -X ${PKG}/version.Version=v${{package.version}} -X ${PKG}/version.Package=${PKG}"
      go build -trimpath -ldflags "$LDF" -o "${{targets.destdir}}/usr/bin/buildctl" ./cmd/buildctl
      go build -trimpath -ldflags "$LDF -extldflags '-static'" \
        -tags "osusergo netgo static_build seccomp" \
        -o "${{targets.destdir}}/usr/bin/buildkitd" ./cmd/buildkitd
      for b in buildctl buildkitd; do
        bad="$(go version -m "${{targets.destdir}}/usr/bin/$b" \
          | awk '$1 == "dep" || $1 == "=>" { print $2, $3 }' | below_floor "$b")"
        [ -z "$bad" ] || { echo "0-CVE float did not reach $b:"; echo "$bad"; exit 1; }
      done
      "${{targets.destdir}}/usr/bin/buildctl" --version | grep -F "v${{package.version}}"
      "${{targets.destdir}}/usr/bin/buildkitd" --version | grep -F "v${{package.version}}"

  # rootlesskit from source with the x/net floor; v3.2.0 is the newest release.
  - name: Build rootlesskit and the subid files
    runs: |
      set -eu
      export CGO_ENABLED=0 GOTOOLCHAIN=local GOFLAGS=-mod=mod
      mkdir -p /tmp/rootlesskit && cd /tmp/rootlesskit
      curl -fsSL -o rk.tgz https://github.com/rootless-containers/rootlesskit/archive/refs/tags/v3.2.0.tar.gz
      echo "75e990eabaa699d86557bfab635b76e430fe91f37bbbb134bc70079e53c3f88d  rk.tgz" | sha256sum -c -
      tar -xzf rk.tgz --strip-components=1
      FLOOR="golang.org/x/net@v0.60.0"
      vlt() { awk -v a="${1#v}" -v b="${2#v}" 'function pp(s,  p){sub(/\+.*/,"",s);p=index(s,"-");if(p){C=substr(s,1,p-1);P=substr(s,p+1)}else{C=s;P=""}} function cmp(x,y,  i,n,m,X,Y){n=split(x,X,".");m=split(y,Y,".");for(i=1;i<=n&&i<=m;i++){if(X[i]==Y[i])continue;if(X[i]~/^[0-9]+$/&&Y[i]~/^[0-9]+$/)return (X[i]+0<Y[i]+0)?-1:1;if(X[i]~/^[0-9]+$/)return -1;if(Y[i]~/^[0-9]+$/)return 1;return (X[i]<Y[i])?-1:1}return (n<m)?-1:(n>m)?1:0} BEGIN{pp(a);ca=C;pa=P;pp(b);cb=C;pb=P;c=cmp(ca,cb);if(c==0){if(pa==pb)c=0;else if(pa=="")c=1;else if(pb=="")c=-1;else c=cmp(pa,pb)}exit !(c<0)}'; }
      need=""
      for mv in $FLOOR; do
        have="$(go list -m -e -f '{{.Version}}' "${mv%@*}" 2>/dev/null)"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        vlt "$have" "${mv#*@}" && need="$need $mv"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || { go get $need; go mod tidy; }
      for c in rootlesskit rootlessctl; do
        go build -trimpath -ldflags "-s -w" -o "${{targets.destdir}}/usr/bin/$c" ./cmd/$c
      done
      got="$(go version -m "${{targets.destdir}}/usr/bin/rootlesskit" | awk '$2 == "golang.org/x/net" { print $3 }')"
      [ -z "$got" ] || ! vlt "$got" v0.60.0 || { echo "rootlesskit links golang.org/x/net $got"; exit 1; }
      "${{targets.destdir}}/usr/bin/rootlesskit" --version | grep -F 3.2.0
      install -d "${{targets.destdir}}/etc"
      printf 'nonroot:100000:65536\n65532:100000:65536\n' > "${{targets.destdir}}/etc/subuid"
      printf 'nonroot:100000:65536\n65532:100000:65536\n' > "${{targets.destdir}}/etc/subgid"
