# Builds Prometheus Alertmanager (the alertmanager server + amtool) from source
# onto Wolfi. One static Go binary per tool, no CGO. Output is a signed APK in
# Quenchworks' own repo. No upstream distro binaries.
#
# Alertmanager bundles a web UI (an Elm SPA under ui/app/) that the server embeds
# via go:embed (`//go:embed app/dist` in ui/web.go). Upstream does NOT publish a
# release source tarball with the UI pre-built, and the v0.33.0 GitHub release
# carries only cross-compiled binaries -- the git tag ships only the UI *sources*.
# So to keep the server "from source" AND ship a working browser bundle, we
# reproduce upstream's own asset pipeline here (mirroring our prometheus image):
#   ui/app: npm ci + npm run build (vite + vite-plugin-elm) -> ui/app/dist/**
#   go build -> ui/web.go's `//go:embed app/dist` picks up the compiled SPA.
# The OpenAPI-generated Elm client (ui/app/src/Data, ui/app/src/DateTime.elm) is
# already committed in the source tree, so no Java/OpenAPI generator is needed.
# Node/npm live ONLY in the build sandbox; the runtime image is a static Go binary
# with no JS toolchain, so Node never enters the Trivy scan surface.
package:
  name: quench-alertmanager
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Prometheus Alertmanager (alert dedup/grouping/routing/silencing + amtool), built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - bash
      - ca-certificates-bundle
      - findutils
      # go.mod declares go 1.25; .promu.yml pins the build toolchain to 1.26. Use
      # go-1.26 (newest, clears stdlib CVE advisories) and GOTOOLCHAIN=local so
      # go.mod's 1.25 directive does not trigger a toolchain download.
      - go-1.26
      # UI toolchain: ui/app is built with vite (vite-plugin-elm). The repo's
      # .nvmrc pins Node v24; npm ci + vite build compiles the Elm SPA into
      # ui/app/dist, which ui/web.go embeds via go:embed.
      - nodejs-24
      - npm

pipeline:
  # git-checkout, not fetch: building from the pinned git tag avoids the
  # codeload.github.com CDN entirely and is the robust source for a repo this size.
  # The git archive contains the UI sources (ui/app/), which we build below.
  - uses: git-checkout
    with:
      repository: https://github.com/prometheus/alertmanager
      tag: v${{package.version}}
      expected-commit: __COMMIT__

  - name: Build the web UI from source (vite for 0.32+, legacy elm/vfsgen for 0.31.x)
    runs: |
      set -eu
      # Elm 0.19.1 ships no official linux/arm64 binary; @lydell/elm provides a
      # per-arch statically-linked compiler we put first on PATH for both arches.
      # Needs a writable npm cache + HOME (both writable in the sandbox).
      export npm_config_cache="$(mktemp -d)"
      export HOME="$(mktemp -d)"
      if [ -f ui/app/vite.config.mjs ]; then
        # ---- modern build (0.32+): vite compiles the Elm SPA into ui/app/dist,
        # ui/web.go embeds it via //go:embed app/dist. ----
        (
          cd ui/app
          npm ci --ignore-scripts
          npm install --no-save --no-package-lock @lydell/elm@0.19.1-14
          export PATH="$(pwd)/node_modules/.bin:${PATH}"
          elm --version
          npm run build
        )
        # vite-plugin-compression2 deletes originals; assert the gzip variant.
        test -f ui/app/dist/index.html.gz
      else
        # ---- legacy build (0.31.x): no vite/package.json. ui/app/Makefile builds
        # script.js via `elm make` + uglify; assets are served by vfsgen
        # (ui/asset.Assets), generated by `go generate`. src/Data is committed in
        # the tag, so no openapi-generator/java is needed -- run elm make directly
        # (skip the Makefile's docker/elm-format/uglify deps). ----
        (
          cd ui/app
          npm install --no-save --no-package-lock @lydell/elm@0.19.1-14
          export PATH="$(pwd)/node_modules/.bin:${PATH}"
          elm --version
          elm make src/Main.elm --optimize --output script.js
        )
        # Embed script.js + index.html + lib into assets_vfsdata.go via vfsgen.
        # The asset package location moved between releases (./asset in 0.31.x,
        # ./ui/asset later) -- locate it by its generator file.
        export GOFLAGS=-mod=mod
        gen_dir="$(dirname "$(find . -name asset_generate.go | head -1)")"
        echo ">> vfsgen asset package: ${gen_dir}"
        ( cd "$gen_dir" && go generate . )
      fi

  - name: Build alertmanager + amtool (static, CGO off)
    runs: |
      set -eu
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      export GOTOOLCHAIN=local      # use the installed go-1.26, do not fetch go.mod's 1.25
      export GO111MODULE=on

      # Bump the one transitive dep the comprehensive Trivy gate flags (minor/patch,
      # API-compatible -- not a fork/force). golang.org/x/crypto resolves to v0.51.0
      # in 0.33.0's module graph; 0.52.0 clears the x/crypto/ssh advisories
      # (CVE-2026-39827..39835 / 42508 / 46595 / 46597 / 46598). x/net and x/text
      # already resolve to their fixed versions here.
      go get golang.org/x/crypto@v0.54.0
      # grpc GHSA-hrxh-6v49-42gf (xDS RBAC + HTTP/2, HIGH): bump to v1.82.1. grpc@1.82.1
      # requires the otel@1.43.0 family + x/oauth2@0.36.0, so float that cascade too.
      go get google.golang.org/grpc@v1.82.1 \
             go.opentelemetry.io/otel@v1.43.0 go.opentelemetry.io/otel/sdk@v1.43.0 \
             go.opentelemetry.io/otel/trace@v1.43.0 go.opentelemetry.io/otel/metric@v1.43.0 \
             golang.org/x/oauth2@v0.36.0
      go mod tidy

      REVISION="$(git rev-parse HEAD)"
      DATE="$(date -u +'%Y%m%d-%H:%M:%S')"
      VERPKG="github.com/prometheus/common/version"
      # Mirror upstream/promu version stamping so `alertmanager --version`,
      # `amtool --version`, the /api/v2/status endpoint and the build_info metric
      # report v0.33.0.
      LDFLAGS="-s -w \
        -X ${VERPKG}.Version=${{package.version}} \
        -X ${VERPKG}.Revision=${REVISION} \
        -X ${VERPKG}.Branch=HEAD \
        -X ${VERPKG}.BuildUser=quenchworks \
        -X ${VERPKG}.BuildDate=${DATE}"

      # netgo: pure-Go resolver (no libc dependency, matches upstream's static
      # build, which sets the netgo tag in .promu.yml).
      for cmd in alertmanager amtool; do
        go build -trimpath -tags "netgo" -ldflags "${LDFLAGS}" \
          -o "${{targets.destdir}}/usr/bin/${cmd}" "./cmd/${cmd}"
      done

  - name: Install the default config and the thin entrypoint
    runs: |
      set -eu
      # Ship a minimal default alertmanager.yml (a trivial route + a no-op
      # webhook receiver). The chart mounts a custom ConfigMap over this
      # read-only path via --config.file.
      install -d "${{targets.destdir}}/etc/alertmanager"
      cat > "${{targets.destdir}}/etc/alertmanager/alertmanager.yml" <<'YAML'
      # Quenchworks default Alertmanager config. Minimal: a single catch-all route
      # and a no-op webhook receiver. Override via --config.file (the chart mounts
      # a ConfigMap). Designed only to let the server start; real routing/receivers
      # are supplied by the chart.
      route:
        receiver: default
        group_by: ['alertname']
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 3h
      receivers:
        - name: default
      YAML

      # Thin entrypoint. Alertmanager persists nflog/silences state to
      # --storage.path; on a read-only rootfs that must be a writable mount
      # (AM_STORAGE_PATH, default /alertmanager). The config dir stays read-only
      # (the server only reads it). Extra flags pass through via "$@".
      install -d "${{targets.destdir}}/usr/local/bin"
      cat > "${{targets.destdir}}/usr/local/bin/docker-entrypoint.sh" <<'SCRIPT'
      #!/bin/sh
      set -eu
      AM_CONFIG_FILE="${AM_CONFIG_FILE:-/etc/alertmanager/alertmanager.yml}"
      AM_STORAGE_PATH="${AM_STORAGE_PATH:-/alertmanager}"
      AM_WEB_LISTEN="${AM_WEB_LISTEN:-0.0.0.0:9093}"
      mkdir -p "${AM_STORAGE_PATH}"
      exec /usr/bin/alertmanager \
        --config.file="${AM_CONFIG_FILE}" \
        --storage.path="${AM_STORAGE_PATH}" \
        --web.listen-address="${AM_WEB_LISTEN}" \
        "$@"
      SCRIPT
      chmod 0755 "${{targets.destdir}}/usr/local/bin/docker-entrypoint.sh"

test:
  pipeline:
    - runs: |
        alertmanager --version
        amtool --version
