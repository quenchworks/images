# alertmanager: from-source via melange (git-checkout at a pinned tag + commit).
# Latest 3 stable RELEASES (full X.Y.Z). NOTE: we track the 3 newest releases,
# not 3 minor lines -- 0.31.x predates the current vite/npm UI build and would
# need a different recipe. __VER__ = version (git tag v__VER__);
# __COMMIT__ = that tag's commit (integrity pin).
FROM_SOURCE=1
VERSIONS=(0.32.1 0.32.2 0.33.0)
declare -A COMMITS=(
  [0.32.1]=3e71a279fa2dd21f32fe168afbde978d13cb33fc
  [0.32.2]=92dc6a427339862c38836e248fd94a9c8de97de6
  [0.33.0]=3b35f21e3d0ff75515c20197ba3cc81af1697177
)
render() { echo "s/__VER__/$1/g; s/__COMMIT__/${COMMITS[$1]}/g"; }
