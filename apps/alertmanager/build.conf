# alertmanager: from-source via melange (git-checkout at a pinned tag + commit).
# Latest 3 stable MINOR lines, each at its newest patch (full X.Y.Z).
# __VER__ = version (git tag v__VER__); __COMMIT__ = that tag's commit (integrity pin).
#
# Build-era note: 0.32.x/0.33.x use the vite/npm UI build; 0.31.x predates it
# (old elm-make + vfsgen asset pipeline). The melange recipe branches on which
# UI toolchain the checked-out tree carries (vite.config.mjs present or not).
FROM_SOURCE=1
VERSIONS=(0.33.1)
declare -A COMMITS=(
  [0.33.1]=baca8cf2c61f50a448ddbf5a04dc4feb9b3d6d26
)
render() { echo "s/__VER__/$1/g; s/__COMMIT__/${COMMITS[$1]}/g"; }
