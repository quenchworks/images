# mailpit (axllent/mailpit): an email & SMTP testing tool with a web UI.
# Image-only (no chart). Latest patch of the last 3 minor lines (1.28, 1.29, 1.30).
# Single static Go binary, CGO disabled. The web UI assets are committed/embedded
# via go:embed, so a plain `go build .` from the tag tarball produces a working
# binary (no npm/esbuild step needed). Version is stamped via -X on
# github.com/axllent/mailpit/config.Version.
FROM_SOURCE=1
VERSIONS=(1.31.5)
declare -A SHA256=(
  [1.31.5]=30f86f4fd9b5838ad146d8b3ac7495cfc86b89bb619d206a794945b4f3da052c
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
