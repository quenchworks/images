# STATUS: BLOCKED 2026-09-26 on Wolfi's chromium. The only gate finding is
#   chromium CVE-2026-13032 (CRITICAL, use after free in WebGL)
#   installed 149.0.7827.53-r0, fixed in 149.0.7827.200-r0
# and Wolfi's live APKINDEX tops out at 149.0.7827.53-r0: the fix is not published.
# Everything else gates clean (gotenberg and pdfcpu from source, floated). Unblock
# when `chromium` >= 149.0.7827.200 is in the index: set BLOCKED=0, run the local
# gate, dispatch. Chromium ships CVE fixes often, so expect this app to wait on Wolfi
# again between releases.
BLOCKED=1
# gotenberg: from-source via melange (Go build of cmd/gotenberg-chromium from the git tag
# tarball). Static Go binary, no CGO. Version stamped via -X on cmd.Version.
#
# CHROMIUM VARIANT. Wolfi ships no LibreOffice, so the image is upstream's Chromium
# variant: HTML, Markdown and URL to PDF plus the PDF engines (qpdf, pdfcpu, exiftool,
# pdftk). Office document conversion (the /forms/libreoffice routes) is not included.
# LATEST ONLY: upstream cuts a minor per release and does not patch older ones.
FROM_SOURCE=1
VERSIONS=(8.37.0)
declare -A SHA256=(
  [8.37.0]=b6395f7c819cd7c7a6ad9e2c1de9723639f8b150f160f777325ce16449ad4658
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
