# Builds Gotenberg's Chromium variant from source onto Wolfi: the gotenberg API server
# with the chromium, pdfengines, qpdf, pdfcpu, exiftool, pdftk, webhook and prometheus
# modules, plus pdfcpu, also from source: Wolfi's pdfcpu apk lags on golang.org/x/crypto.
# Static Go binaries, no CGO. qpdf, exiftool, pdftk, Chromium and the fonts come from
# Wolfi as runtime dependencies. Output is a signed APK in Quenchworks' own repo. No
# upstream distro binaries.
package:
  name: quench-gotenberg
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Gotenberg (Chromium variant), built from source on Wolfi"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tini
      - chromium
      - qpdf
      - exiftool
      - pdftk
      - fontconfig
      - font-liberation
      - font-noto
      - font-noto-cjk
      - font-noto-emoji

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-1.27

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/gotenberg/gotenberg/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      set -eu
      export CGO_ENABLED=0
      export GOFLAGS="-mod=mod -buildvcs=false"
      export GO111MODULE=on
      export GOTOOLCHAIN=local
      # ---- 0-CVE module float (docs/go-module-float.md) ----------------------
      # FLOOR is a FLOOR, not a pin. A bare `go get mod@vX` fails silently in two
      # directions: it is a NO-OP when an upstream `replace` overrides it, and it
      # becomes a DOWNGRADE once upstream requires more than vX -- re-introducing
      # the CVE it was added to clear. So float only what is below the floor, then
      # assert the SHIPPED BINARY carries nothing below it.
      FLOOR="golang.org/x/net@v0.58.0 golang.org/x/text@v0.41.0 golang.org/x/crypto@v0.56.0 golang.org/x/sys@v0.47.0 golang.org/x/mod@v0.40.0 golang.org/x/oauth2@v0.36.0 google.golang.org/grpc@v1.83.2 go.opentelemetry.io/otel@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.45.0 go.opentelemetry.io/otel/sdk@v1.45.0 go.opentelemetry.io/otel/trace@v1.45.0 go.opentelemetry.io/otel/metric@v1.45.0 golang.org/x/image@v0.45.0"
      MODS="$(echo "$FLOOR" | tr ' ' '\n' | cut -d@ -f1)"
      # prints "<mod>@<floor> (<tag> has <ver>)" for every module below its floor
      below_floor() {
        awk -v floor="$FLOOR" -v tag="$1" '
          BEGIN { n = split(floor, f, " ")
                  for (i = 1; i <= n; i++) { split(f[i], kv, "@"); want[kv[1]] = kv[2] } }
          ($1 in want) {
            split(substr($2, 2), g, "."); split(substr(want[$1], 2), w, ".")
            for (i = 1; i <= 3; i++) {
              if ((g[i] + 0) > (w[i] + 0)) next
              if ((g[i] + 0) < (w[i] + 0)) { print $1 "@" want[$1] " (" tag " has " $2 ")"; next }
            }
          }'
      }
      # `go list -m` prints "<mod> <ver>" or "<mod> <ver> => <mod> <ver>", so $NF is
      # the EFFECTIVE version and a replace cannot hide behind the require line.
      go list -m -e $MODS
      need="$(go list -m -e $MODS | awk 'NF >= 2 && $NF ~ /^v[0-9]/ { print $1, $NF }' | below_floor go.mod | awk '{ print $1 }')"
      if [ -n "$need" ]; then go get $need; fi
      go mod tidy
      go build -trimpath \
        -ldflags "-s -w -X github.com/gotenberg/gotenberg/v8/cmd.Version=${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/gotenberg" ./cmd/gotenberg-chromium
      bad="$(go version -m "${{targets.destdir}}/usr/bin/gotenberg" \
        | awk '$1 == "dep" || $1 == "=>" { print $2, $3 }' | below_floor gotenberg)"
      [ -z "$bad" ] || { echo "❌ 0-CVE float did not reach gotenberg:"; echo "$bad"; exit 1; }
      # pdfcpu at upstream's pin (build/Dockerfile PDFCPU_VERSION), with the same float
      PDFCPU=0.15.0
      wget -q -O pdfcpu.tar.gz "https://github.com/pdfcpu/pdfcpu/archive/refs/tags/v$PDFCPU.tar.gz"
      echo "69924a7363ea19b4f3d4799ebf78bcabfec75a735c9569983a6e2834b5e8c6b3  pdfcpu.tar.gz" | sha256sum -c -
      mkdir pdfcpu-src && tar -xzf pdfcpu.tar.gz -C pdfcpu-src --strip-components=1
      (
        cd pdfcpu-src
        need="$(go list -m -e $MODS | awk 'NF >= 2 && $NF ~ /^v[0-9]/ { print $1, $NF }' | below_floor pdfcpu/go.mod | awk '{ print $1 }')"
        if [ -n "$need" ]; then go get $need; fi
        go mod tidy
        go build -trimpath \
          -ldflags "-s -w -X main.version=v$PDFCPU -X github.com/pdfcpu/pdfcpu/pkg/pdfcpu/model.VersionStr=v$PDFCPU -X main.builtBy=quenchworks" \
          -o "${{targets.destdir}}/usr/bin/pdfcpu" ./cmd/pdfcpu
      )
      bad="$(go version -m "${{targets.destdir}}/usr/bin/pdfcpu" \
        | awk '$1 == "dep" || $1 == "=>" { print $2, $3 }' | below_floor pdfcpu)"
      [ -z "$bad" ] || { echo "❌ 0-CVE float did not reach pdfcpu:"; echo "$bad"; exit 1; }
      # hyphenation dictionaries Chromium reads for CSS hyphens, and upstream's font
      # rendering tweaks
      install -d "${{targets.destdir}}/opt/gotenberg" "${{targets.destdir}}/etc/fonts/conf.d"
      cp -r build/chromium-hyphen-data "${{targets.destdir}}/opt/gotenberg/chromium-hyphen-data"
      install -m 0644 build/fonts.conf "${{targets.destdir}}/etc/fonts/conf.d/100-gotenberg.conf"
