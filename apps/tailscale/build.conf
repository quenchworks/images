# tailscale (WireGuard mesh VPN node): from-source via melange, Go build of tailscaled, the
# tailscale CLI and containerboot (the container entrypoint) from the git tag tarball.
# Newest patch of the last 3 stable lines (even minors). Image only, no chart: the
# Kubernetes operator needs a Tailscale-hosted OAuth client, which no install gate has.
FROM_SOURCE=1
VERSIONS=(1.96.4 1.98.10 1.102.5)
declare -A SHA256=(
  [1.96.4]=57b70731af7ae0ed167519924905fd032ddd8559a65bc8a3329d9da495f0feb2
  [1.98.10]=1a3aac335f0e1b2154fbf948ae8cd7f3464af7e28a5a0a12fd55ab475212a282
  [1.102.5]=110b0d0586e981fccb83149d0ac4e7aac3c879fd372772b0dee1818f204893bc
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
