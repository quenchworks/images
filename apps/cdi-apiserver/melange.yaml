# KubeVirt CDI apiserver, CGO-free, at upstream's /usr/bin path.
package:
  name: quench-cdi-apiserver
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened KubeVirt CDI apiserver, built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.26

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/kubevirt/containerized-data-importer/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - runs: |
      set -eu
      # GOWORK=off: go.mod already replaces the staging API module with its local path.
      export CGO_ENABLED=0 GOTOOLCHAIN=local GOFLAGS=-mod=mod GOWORK=off
      # floors, raised only when below (a bare go get downgrades once upstream passes it)
      FLOOR="golang.org/x/crypto@v0.58.1-0.20261009181718-2f1f834330b2 golang.org/x/net@v0.62.0 golang.org/x/text@v0.43.0 golang.org/x/sys@v0.49.0 google.golang.org/grpc@v1.83.2 github.com/go-jose/go-jose/v3@v3.0.5 go.opentelemetry.io/otel@v1.47.0 go.opentelemetry.io/otel/sdk@v1.47.0 go.opentelemetry.io/otel/trace@v1.47.0 go.opentelemetry.io/otel/metric@v1.47.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.47.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.47.0 github.com/go-jose/go-jose/v4@v4.1.6 github.com/klauspost/compress@v1.19.1 github.com/moby/sys/user@v0.4.1 github.com/ulikunitz/xz@v0.5.15 github.com/docker/docker@v28.5.2+incompatible"
      need=""
      for f in $FLOOR; do
        have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${f%@*}")"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        [ "$(printf '%s\n%s\n' "$have" "${f#*@}" | sort -V | head -1)" = "${f#*@}" ] || need="$need $f"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || go get $need
      # the otel floor would lift otelgrpc/otelhttp past what k8s.io/apiserver 0.31 calls; keep
      # upstream's 0.53.0, which builds against otel 1.47
      for c in google.golang.org/grpc/otelgrpc net/http/otelhttp; do
        go mod edit -replace go.opentelemetry.io/contrib/instrumentation/$c=go.opentelemetry.io/contrib/instrumentation/$c@v0.53.0
      done
      LDFLAGS="-s -w -X kubevirt.io/containerized-data-importer/pkg/version.gitVersion=v${{package.version}} -X kubevirt.io/containerized-data-importer/pkg/version.gitTreeState=clean"
      mkdir -p "${{targets.destdir}}/usr/bin"
      go build -trimpath -ldflags "$LDFLAGS" -o "${{targets.destdir}}/usr/bin/cdi-apiserver" ./cmd/cdi-apiserver

test:
  pipeline:
    - runs: |
        grep -aq 'v${{package.version}}' /usr/bin/cdi-apiserver
