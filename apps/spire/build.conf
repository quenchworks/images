# spire: from-source via melange (Go build of cmd/spire-server and cmd/spire-agent from
# the git tag tarball). CGO on: the server's sqlite3 datastore is mattn/go-sqlite3.
# Version stamped via -X on pkg/common/version.gittag.
#
# LATEST LINE ONLY (1.15). Upstream still patches 1.14 and 1.13, but both import
# github.com/docker/docker (the docker workload attestor), whose newest release is
# v28.5.2+incompatible; CVE-2026-33997 is fixed only in the moby/moby modules, which
# have a different API. 1.15 moved to moby/moby. Shipping 1.14/1.13 at 0 CVEs would
# mean porting that attestor, so they are not built. Their floated build also needs a
# handler patch (grpc 1.83.2 brings go-spiffe 2.7.0 and its WIT RPCs), measured 2026-09-26.
FROM_SOURCE=1
VERSIONS=(1.15.3)
declare -A SHA256=(
  [1.15.3]=34ea849d0538e1aac57e86cfd95769c05785f573a333579942e58d18730676c0
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
