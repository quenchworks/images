# Builds SPIRE, the SPIFFE runtime (spire-server issues workload identities, spire-agent
# attests nodes and workloads and serves the Workload API), from source onto Wolfi. CGO
# is on because the server's sqlite3 datastore is mattn/go-sqlite3, so the binaries link
# glibc. The package also carries a minimal default server and agent config (join-token
# node attestation, sqlite, disk keys) so the image runs as-is; the chart replaces both.
# Output is a signed APK in Quenchworks' own repo. No upstream distro binaries.
package:
  name: quench-spire
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened SPIRE (server and agent), built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - glibc

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/spiffe/spire/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      set -eu
      export CGO_ENABLED=1
      export GOFLAGS="-mod=mod -buildvcs=false"
      export GO111MODULE=on
      export GOTOOLCHAIN=local
      # ---- 0-CVE module float (docs/go-module-float.md) ----------------------
      # FLOOR is a FLOOR, not a pin. A bare `go get mod@vX` fails silently in two
      # directions: it is a NO-OP when an upstream `replace` overrides it, and it
      # becomes a DOWNGRADE once upstream requires more than vX -- re-introducing
      # the CVE it was added to clear. So float only what is below the floor, then
      # assert the SHIPPED BINARY carries nothing below it.
      FLOOR="golang.org/x/net@v0.58.0 golang.org/x/text@v0.41.0 golang.org/x/crypto@v0.56.0 golang.org/x/sys@v0.47.0 golang.org/x/mod@v0.40.0 golang.org/x/oauth2@v0.36.0 google.golang.org/grpc@v1.83.2 go.opentelemetry.io/otel@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.45.0 go.opentelemetry.io/otel/sdk@v1.45.0 go.opentelemetry.io/otel/trace@v1.45.0 go.opentelemetry.io/otel/metric@v1.45.0"
      MODS="$(echo "$FLOOR" | tr ' ' '\n' | cut -d@ -f1)"
      # prints "<mod>@<floor> (<tag> has <ver>)" for every module below its floor
      below_floor() {
        awk -v floor="$FLOOR" -v tag="$1" '
          BEGIN { n = split(floor, f, " ")
                  for (i = 1; i <= n; i++) { split(f[i], kv, "@"); want[kv[1]] = kv[2] } }
          ($1 in want) {
            split(substr($2, 2), g, "."); split(substr(want[$1], 2), w, ".")
            for (i = 1; i <= 3; i++) {
              if ((g[i] + 0) > (w[i] + 0)) next
              if ((g[i] + 0) < (w[i] + 0)) { print $1 "@" want[$1] " (" tag " has " $2 ")"; next }
            }
          }'
      }
      # `go list -m` prints "<mod> <ver>" or "<mod> <ver> => <mod> <ver>", so $NF is
      # the EFFECTIVE version and a replace cannot hide behind the require line.
      go list -m -e $MODS
      need="$(go list -m -e $MODS | awk 'NF >= 2 && $NF ~ /^v[0-9]/ { print $1, $NF }' | below_floor go.mod | awk '{ print $1 }')"
      if [ -n "$need" ]; then go get $need; fi
      go mod tidy
      LD="-s -w -X github.com/spiffe/spire/pkg/common/version.gittag=${{package.version}} -X github.com/spiffe/spire/pkg/common/version.githash=quenchworks"
      for b in spire-server spire-agent; do
        go build -trimpath -ldflags "$LD" -o "${{targets.destdir}}/usr/bin/$b" ./cmd/$b
        bad="$(go version -m "${{targets.destdir}}/usr/bin/$b" \
          | awk '$1 == "dep" || $1 == "=>" { print $2, $3 }' | below_floor "$b")"
        [ -z "$bad" ] || { echo "❌ 0-CVE float did not reach $b:"; echo "$bad"; exit 1; }
      done
  - runs: |
      install -d "${{targets.destdir}}/etc/spire/server" "${{targets.destdir}}/etc/spire/agent"
      cat > "${{targets.destdir}}/etc/spire/server/server.conf" <<'CONF'
      server {
        bind_address = "0.0.0.0"
        bind_port = "8081"
        socket_path = "/tmp/spire-server/private/api.sock"
        trust_domain = "example.org"
        data_dir = "/data/spire"
        log_level = "INFO"
      }
      plugins {
        DataStore "sql" {
          plugin_data {
            database_type = "sqlite3"
            connection_string = "/data/spire/datastore.sqlite3"
          }
        }
        NodeAttestor "join_token" {
          plugin_data {}
        }
        KeyManager "disk" {
          plugin_data {
            keys_path = "/data/spire/keys.json"
          }
        }
      }
      health_checks {
        listener_enabled = true
        bind_address = "0.0.0.0"
        bind_port = "8080"
        live_path = "/live"
        ready_path = "/ready"
      }
      CONF
      cat > "${{targets.destdir}}/etc/spire/agent/agent.conf" <<'CONF'
      agent {
        data_dir = "/data/spire"
        log_level = "INFO"
        server_address = "spire-server"
        server_port = "8081"
        socket_path = "/tmp/spire-agent/public/api.sock"
        trust_domain = "example.org"
        insecure_bootstrap = true
      }
      plugins {
        NodeAttestor "join_token" {
          plugin_data {}
        }
        KeyManager "disk" {
          plugin_data {
            directory = "/data/spire"
          }
        }
        WorkloadAttestor "unix" {
          plugin_data {}
        }
      }
      health_checks {
        listener_enabled = true
        bind_address = "0.0.0.0"
        bind_port = "8080"
        live_path = "/live"
        ready_path = "/ready"
      }
      CONF
