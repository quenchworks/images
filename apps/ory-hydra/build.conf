# go-jose v3 HOLD 2026-11-11: CVE-2026-116587/-116585/-116586 have no v3 fix (v4 4.1.6 only). Ory imports v3 in its own code and in ory/x (josex, jwksx: JWK fetch and parse, so the vulnerable path is reachable; no VEX). hydra master and ory/x main (v0.0.729) are still on v3; a port is ~37 files of OAuth/JWK code. Unblock: an Ory release on go-jose v4, then bump.
# ory-hydra: Ory Hydra, the OAuth 2.0 and OpenID Connect provider, built from source
# on Wolfi like upstream's Linux release: cgo with the sqlite, hsm and json1 tags. One
# `hydra` binary runs every role: `serve all` (public 4444 + admin 4445), `migrate sql`,
# and the admin CLI.
#
# Why not Wolfi's hydra apk: measured 2026-09-25, hydra 26.2.0-r9 (the newest in the
# index) carries 39 findings (Go stdlib, x/*, grpc, the otel exporters, docker). Wolfi's
# advisory names r26 as fixed, but r26 is not published.
#
# NEWEST-ONLY: Ory ships one supported line; the image tracks the newest release.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(26.2.0)
# sha256 of the GitHub tag tarball, computed from a download
declare -A SHA256=(
  [26.2.0]=85aa8265eb6149d8bb70dd70867e27886e0d6d4d49fa9587b2bb53b3bb4a5607
)
# the tag's commit, stamped into `hydra version`
declare -A COMMIT=(
  [26.2.0]=0b84568fffccf151dc5e6c7955fdfb738555bf4b
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g; s|__COMMIT__|${COMMIT[$1]}|g"; }
