# Builds the Buildkite Agent from source onto Wolfi. Single static Go binary, no
# CGO. The release version string is embedded from version/VERSION (already equal
# to the tag), so `buildkite-agent --version` reports the real release; the build
# only stamps -X .../version.buildNumber to mark the build origin. Output is a
# signed APK in Quenchworks' own repo. No upstream distro binaries. Image-only
# (the CI build-runner agent, no chart).
package:
  name: quench-buildkite-agent
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Buildkite Agent, built from source on Wolfi"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/buildkite/agent/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      # 0-CVE float: bundled github.com/DataDog/dd-trace-go/v2 v2.7.1 carries
      # CVE-2026-50274 (HIGH), fixed in v2.8.1. Bump the module and re-resolve.
      go get github.com/DataDog/dd-trace-go/v2@v2.8.1
      # golang.org/x/mod CVE-2026-56864/56865 (HIGH, malicious GOSUMDB/GOPROXY able to
      # forge module content). Arrives transitively -- there is no direct import -- so it
      # needs an explicit floor. v0.40.0, NOT the v0.37.0/v0.38.0 Trivy names as fixed:
      # those are themselves affected (see docs/go-module-float.md).
      go get golang.org/x/mod@v0.40.0
      # grpc GHSA-hrxh-6v49-42gf (xDS RBAC + HTTP/2, HIGH): still needed, upstream pins
      # grpc v1.82.0. grpc@1.82.1 requires the otel family + x/oauth2@0.36.0, so keep
      # that cascade floated too.
      # otel is deliberately NOT pinned here any more.
      #
      # It used to carry a floor (1.43 -> 1.44 -> 1.45) to keep the otel modules
      # coherent. That inverted once upstream moved faster than the floor: 3.137.0
      # requires otel 1.45.0 WITH otel/log 0.21.0 and the otlplog exporters at 0.21.0,
      # and pinning only the four core modules dragged otlploghttp back to 0.20.0 --
      # which then failed to compile against the newer api (undefined: api.KindInt64).
      # Upstream's own go.mod already selects a coherent, CVE-clean otel set, so the
      # correct move is to let it decide instead of maintaining a partial mirror of it.
      # Only the genuinely CVE-driven pins stay.
      # NO grpc/otel/oauth2 pins any more -- upstream already satisfies every floor they
      # encoded, and holding them became actively harmful:
      #   grpc   floor was v1.82.1 (GHSA-hrxh-6v49-42gf). 3.137.0 requires v1.83.0,
      #          so forcing 1.82.1 was a DOWNGRADE -- and go then downgraded the
      #          modules that need newer grpc, dropping otlploghttp 0.21.0 -> 0.20.0,
      #          which fails to compile (undefined: api.KindInt64).
      #   otel   floor was 1.44.0; 3.137.0 requires 1.45.0 with otel/log 0.21.0.
      #   oauth2 pin was v0.36.0, exactly what upstream requires (a no-op).
      # Re-check on every bump: if upstream ever drops BELOW grpc 1.82.1 or reintroduces
      # a vulnerable otel, the floor has to come back. The 0-CVE gate is what enforces that.
      go mod tidy
      # 2026-09-13: the gate flagged golang.org/x/crypto v0.55.0 (CVE-2026-56855,
      # CVE-2026-78662) and google.golang.org/grpc v1.83.1 (CVE-2026-84445) in the
      # published image; this recipe had no float at all.
      # FLOOR, not a bare `go get mod@vX`: an exact pin is a no-op under a `replace`
      # and becomes a DOWNGRADE once upstream requires more, re-introducing the CVE
      # while the gate still reports green (docs/go-module-float.md).
      FLOOR="golang.org/x/crypto@v0.56.0 google.golang.org/grpc@v1.83.2 golang.org/x/net@v0.58.0 golang.org/x/text@v0.41.0 golang.org/x/sys@v0.47.0"
      MODS="$(echo "$FLOOR" | tr ' ' '\n' | cut -d@ -f1)"
      below_floor() {
        awk -v floor="$FLOOR" -v tag="$1" '
          BEGIN { n = split(floor, f, " ")
                  for (i = 1; i <= n; i++) { split(f[i], kv, "@"); want[kv[1]] = kv[2] } }
          ($1 in want) {
            split(substr($2, 2), g, "."); split(substr(want[$1], 2), w, ".")
            for (i = 1; i <= 3; i++) {
              if ((g[i] + 0) > (w[i] + 0)) next
              if ((g[i] + 0) < (w[i] + 0)) { print $1 "@" want[$1] " (" tag " has " $2 ")"; next }
            }
          }'
      }
      # -e is required: plain `go list -m M` FAILS on a module this app does not
      # require and kills the step. -e then prints it with no version, and feeding that
      # to below_floor would read it as below the floor and `go get` it, ADDING a
      # dependency that was never here. Hence the awk guard on a real v-prefixed version.
      GOFLAGS=-mod=mod go list -m -e $MODS 2>/dev/null || true
      need="$(GOFLAGS=-mod=mod go list -m -e $MODS 2>/dev/null | awk 'NF >= 2 && $NF ~ /^v[0-9]/ { print $1, $NF }' | below_floor go.mod | awk '{ print $1 }')"
      if [ -n "$need" ]; then GOFLAGS=-mod=mod go get $need; fi
      GOFLAGS=-mod=mod go mod tidy

      go build -trimpath \
        -ldflags "-s -w -X github.com/buildkite/agent/v3/version.buildNumber=quench" \
        -o "${{targets.destdir}}/usr/bin/buildkite-agent" .
