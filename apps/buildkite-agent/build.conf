# buildkite-agent: from-source via melange (Go build from the git tag tarball).
# Image-only (the Buildkite CI build-runner agent, no chart). Latest patch of the
# last 3 minor lines (3.126, 3.127, 3.128). Single static Go binary, CGO disabled.
# The release version string is embedded from version/VERSION (already == the tag);
# the build only stamps -X .../version.buildNumber to record the build origin.
FROM_SOURCE=1
VERSIONS=(3.126.0 3.127.2 3.128.0)
declare -A SHA256=(
  [3.126.0]=7cf214548ef1326481b40357c20ae59d2cc0faaab9c626c2ea133df3db5fa10f
  [3.127.2]=d1fa81ee732c5eb073eca1824d26d0939f887f003cbe02a26b8ccf19f5483063
  [3.128.0]=ee30b4c2cc787dad0e73f74a5232ed507cabd9c604241ee42c01082a70627bf0
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
