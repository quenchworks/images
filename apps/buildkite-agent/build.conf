# buildkite-agent: from-source via melange (Go build from the git tag tarball).
# Image-only (the Buildkite CI build-runner agent, no chart). Latest patch of the
# recent minor lines (3.129, 3.130, 3.131, 3.132). Single static Go binary, CGO disabled.
# The release version string is embedded from version/VERSION (already == the tag);
# the build only stamps -X .../version.buildNumber to record the build origin.
FROM_SOURCE=1
VERSIONS=(3.129.0 3.130.0 3.131.0 3.132.0)
declare -A SHA256=(
  [3.129.0]=d1bc1589a008a94654b995f0611f618ed7c99489affbcbf271b1f0a196f002ba
  [3.130.0]=4a71e705195c39000369af8974c1ccca52cacefd679d470e31f2be8d7c233335
  [3.131.0]=08cfd4f2925ee76304e7211914d8332bee5526318e79eb2880ae6c39888f07f4
  [3.132.0]=c3f14113427cc14ea7dd464e545bcaeeb10f873193410404b65831cceb715904
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
