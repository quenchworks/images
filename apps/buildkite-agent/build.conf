# buildkite-agent: from-source via melange (Go build from the git tag tarball).
# Image-only (the Buildkite CI build-runner agent, no chart). The last 3 RELEASES,
# newest last -- upstream ships patch-only releases on one line at a time, so this
# is currently 3.137.0/1/2. Single static Go binary, CGO disabled.
# The release version string is embedded from version/VERSION (already == the tag);
# the build only stamps -X .../version.buildNumber to record the build origin.
#
# WINDOW IS EXACTLY 3: build-buildkite-agent.yml's prep job slices VERSIONS to the
# last 3, so a 4th entry is silently never built. The list carried 4 (3.132.0 was
# already dead weight); trimmed back to 3 so the file says what CI actually builds.
FROM_SOURCE=1
VERSIONS=(4.0.2 4.0.3 4.0.4)
declare -A SHA256=(
  [4.0.1]=7cf745d5ec789ea1afa37fc09a9ccbde1292a30fe1174bb09283699042b4ee25
  [4.0.2]=11db1d89c5dd49d8cbb434c77b55610ece32610ea989a3902421641bd1c66340
  [4.0.3]=ffb0a062d486a3496740700352148baf1912cd46e22767d2fbbb44422abde8cb
  [4.0.4]=d5250630c16cf1383b1b5f87cb1a197d1a57934c7ff4f19c4850169dee7a9061
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
