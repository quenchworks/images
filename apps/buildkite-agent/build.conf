# buildkite-agent: from-source via melange (Go build from the git tag tarball).
# Image-only (the Buildkite CI build-runner agent, no chart). Latest patch of the
# recent minor lines (3.134, 3.135, 3.136). Single static Go binary, CGO disabled.
# The release version string is embedded from version/VERSION (already == the tag);
# the build only stamps -X .../version.buildNumber to record the build origin.
#
# WINDOW IS EXACTLY 3: build-buildkite-agent.yml's prep job slices VERSIONS to the
# last 3, so a 4th entry is silently never built. The list carried 4 (3.132.0 was
# already dead weight); trimmed back to 3 so the file says what CI actually builds.
FROM_SOURCE=1
VERSIONS=(3.136.2 3.136.3 3.137.0)
declare -A SHA256=(
  [3.136.2]=9070b071289dad1308cd0622a64f17207a79b0e5100bac033e590c41881fe693
  [3.136.3]=7bd46222600ad4cfe3e3a839ebef20c7c054519235671da7f1cc079230ed3b57
  [3.137.0]=cffd5b54be9c4510690a567df633becc6beda3e05f8b38561231e59e1cf1c821
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
