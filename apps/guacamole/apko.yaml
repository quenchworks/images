# Assembles the Guacamole web app image: Tomcat 9 on Wolfi openjdk-21, nonroot
# uid 1001, multi-arch, SBOM by apko. Serves http://:8080/guacamole. Configure it
# with environment variables (GUACD_HOSTNAME, GUACD_PORT, POSTGRESQL_HOSTNAME,
# POSTGRESQL_DATABASE, POSTGRESQL_USERNAME, POSTGRESQL_PASSWORD, ...). The schema
# SQL is under /usr/share/guacamole/schema.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-guacamole@local

accounts:
  groups:
    - groupname: guacamole
      gid: 1001
  users:
    - username: guacamole
      uid: 1001
      gid: 1001
  run-as: 1001

environment:
  JAVA_HOME: /usr/lib/jvm/java-21-openjdk
  GUACAMOLE_HOME: /etc/guacamole

entrypoint:
  command: /usr/bin/guacamole-entrypoint.sh

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-guacamole"
  org.opencontainers.image.licenses: "Apache-2.0"
