# guacamole (apache/guacamole-client): the Apache Guacamole web application, the
# browser side of clientless RDP/VNC/SSH/telnet access (guacd is the proxy
# daemon, apps/guacd). Assembled from Apache's signed release artifacts: the
# guacamole WAR and the JDBC auth extension, on Apache Tomcat 9 (1.6.0 is a javax
# servlet app; Wolfi packages only Tomcat 11) and Wolfi openjdk-21. Every download
# is pinned by the sha256 of the artifact, which matches Apache's published
# .sha256/.sha512. One release line.
VERSIONS=(1.6.0)
declare -A SHA256=(
  [1.6.0]=b41ceb1e2df010b54db563e0b00edb8d5fe9f073c6168462e4c978df0fc6e716
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
