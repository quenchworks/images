# apisix-ingress-controller (Apache APISIX Ingress Controller): the Kubernetes
# operator for the APISIX data plane. From-source via melange, built from the
# OFFICIAL ASF source release on archive.apache.org (downloads.apache.org drops a
# version's directory once it is superseded; archive keeps it forever).
#
# LATEST-ONLY (n=1), for three independent reasons, all verified upstream:
#   1. Only 2.2.0 has an ASF source release. archive.apache.org/dist/apisix/
#      ingress-controller/ lists ... 1.8.0 and 2.2.0 -- 2.0.0, 2.0.1 and 2.1.0
#      were GitHub-tag-only. There is nothing to build for those lines from the
#      official source.
#   2. Per-release Gateway API coupling. 2.0.1/2.1.0 target Gateway API v1.3.0,
#      2.2.0 targets v1.6.0 (Makefile GATEWAY_API_VERSION). The catalog ships ONE
#      pinned gateway-api-crds chart, so shipping several controller minors would
#      guarantee CRD/controller skew -- the top risk of this wave.
#   3. Per-release sidecar + platform coupling: ADC_VERSION 0.23.1 -> 0.27.1 and
#      MIN_K8S_VERSION 1.26.0 -> 1.31.0 across the same span.
# Precedent for n=1: kong.
#
# sha256 is of the ASF release tarball, cross-checked against the upstream
# .sha512 file at downloads.apache.org/apisix/ingress-controller/2.2.0/.
# COMMIT is the tag's commit (lightweight tag; `git ls-remote refs/tags/2.2.0`),
# stamped into the binary so `version --long` reports a real revision.
FROM_SOURCE=1
VERSIONS=(2.2.0)
declare -A SHA256=(
  [2.2.0]=12d8ed10d7b87908b962df3d766b80f190edb8b613d3f3cd9fa1292c28d0e10c
)
declare -A COMMIT=(
  [2.2.0]=c915316549b782fb02e4b7947790c17d5315c750
)
# Kubernetes floor upstream compiles in (Makefile MIN_K8S_VERSION); below it the
# controller warns and keeps running.
declare -A MIN_K8S=(
  [2.2.0]=1.31.0
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g; s|__COMMIT__|${COMMIT[$1]}|g; s|__MIN_K8S__|${MIN_K8S[$1]}|g"; }
