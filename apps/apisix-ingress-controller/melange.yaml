# Builds the Apache APISIX Ingress Controller from the official ASF source release
# onto Wolfi. Single static Go binary, no CGO (upstream's own Makefile builds with
# CGO_ENABLED=0; its distroless/cc base is habit, not a requirement).
#
# main package: cmd/main.go (module github.com/apache/apisix-ingress-controller).
# Deps are NOT vendored in the release tarball, so the build resolves them from the
# module proxy with -mod=mod, exactly like upstream's `make build`.
#
# The four -X symbols are upstream's GO_LDFLAGS verbatim (Makefile VERSYM /
# GITSHASYM / BUILDOSSYM / MINK8SVERSYM), so `apisix-ingress-controller version
# --long` reports the real release, the real tag commit and the Kubernetes floor
# instead of empty strings. version.Short() is "<ver>-<gitsha>-<goversion>", so
# leaving the revision unset would also corrupt `--version`.
#
# No golang.org/x/* float is needed: 2.2.0 shipped "chore(deps): upgrade
# dependencies flagged by security advisories" and already resolves x/net v0.56.0,
# x/text v0.40.0, x/crypto v0.54.0, x/sys v0.47.0, grpc v1.82.1, cel-go v0.29.0.
# A comprehensive trivy scan of a locally built binary reported ZERO module
# findings; the only findings were stdlib CVEs of the local go1.26.5 toolchain,
# all fixed in 1.26.6 = Wolfi's go-1.26 (pinned below).
#
# NOTE for the chart: upstream runs this controller with an `adc` SIDECAR
# (ghcr.io/api7/adc, pinned at 0.27.1 by this release) sharing a Unix socket; the
# controller reaches it via ADC_SERVER_URL. adc is a SEPARATE image and is not
# bundled here.
package:
  name: quench-apisix-ingress-controller
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Apache APISIX Ingress Controller, built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - curl        # build-only: fetches the dist (CDN first, archive fallback)
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-1.26

pipeline:
  # Apache's CDN (dlcdn) serves only CURRENT releases and is fast; archive.apache.org keeps
  # every release permanently but crawled at ~100 KB/s here. Try the CDN, fall back to the
  # archive (older matrix versions always come from there), same checksum either way.
  - runs: |
      rel="${{package.version}}/apache-apisix-ingress-controller-${{package.version}}-src.tgz"
      f="${rel##*/}"
      for base in https://dlcdn.apache.org/apisix/ingress-controller https://archive.apache.org/dist/apisix/ingress-controller; do
        curl -fsSL -o "$f" "$base/$rel" && break
        rm -f "$f"
      done
      echo "__SHA256__  $f" | sha256sum -c -
      tar -xzf "$f" --strip-components=1
      rm -f "$f"
  - runs: |
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      export GOTOOLCHAIN=local      # use the installed go-1.26, do not fetch go.mod's directive
      export GO111MODULE=on
      V="github.com/apache/apisix-ingress-controller/internal/version"
      M="github.com/apache/apisix-ingress-controller/internal/manager"
      # 2026-09-14: the nightly scan flagged google.golang.org/grpc below its fix in
      # the published image; this recipe had no float at all. FLOOR, not a bare
      # `go get mod@vX`, per docs/go-module-float.md: an exact pin is a no-op under a
      # `replace` and becomes a DOWNGRADE once upstream requires more.
      FLOOR="google.golang.org/grpc@v1.83.2 golang.org/x/crypto@v0.56.0 golang.org/x/net@v0.58.0 golang.org/x/text@v0.41.0 golang.org/x/sys@v0.47.0 go.opentelemetry.io/otel@v1.45.0 go.opentelemetry.io/otel/trace@v1.45.0 go.opentelemetry.io/otel/metric@v1.45.0 go.opentelemetry.io/otel/sdk@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.45.0"
      MODS="$(echo "$FLOOR" | tr ' ' '\n' | cut -d@ -f1)"
      below_floor() {
        awk -v floor="$FLOOR" -v tag="$1" '
          BEGIN { n = split(floor, f, " ")
                  for (i = 1; i <= n; i++) { split(f[i], kv, "@"); want[kv[1]] = kv[2] } }
          ($1 in want) {
            split(substr($2, 2), g, "."); split(substr(want[$1], 2), w, ".")
            for (i = 1; i <= 3; i++) {
              if ((g[i] + 0) > (w[i] + 0)) next
              if ((g[i] + 0) < (w[i] + 0)) { print $1 "@" want[$1] " (" tag " has " $2 ")"; next }
            }
          }'
      }
      # -e + the version guard: plain `go list -m M` FAILS when the app does not
      # require M (32 recipes shipped that silent no-op before 2026-09-13), and -e's
      # version-less output would otherwise be read as below-floor and `go get`ed,
      # ADDING a dependency the app never had.
      GOFLAGS=-mod=mod go list -m -e $MODS 2>/dev/null || true
      need="$(GOFLAGS=-mod=mod go list -m -e $MODS 2>/dev/null | awk 'NF >= 2 && $NF ~ /^v[0-9]/ { print $1, $NF }' | below_floor go.mod | awk '{ print $1 }')"
      if [ -n "$need" ]; then GOFLAGS=-mod=mod go get $need; fi
      GOFLAGS=-mod=mod go mod tidy

      go build -trimpath \
        -ldflags "-s -w \
          -X=${V}._buildVersion=${{package.version}} \
          -X=${V}._buildGitRevision=__COMMIT__ \
          -X=${V}._buildOS=linux/$(go env GOARCH) \
          -X=${M}._minK8sVersion=__MIN_K8S__" \
        -o "${{targets.destdir}}/usr/bin/apisix-ingress-controller" ./cmd/main.go
