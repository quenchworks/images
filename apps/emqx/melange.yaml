# Packages EMQX onto Wolfi from its OWN official el9 release tarball (NOT built from
# source: EMQX is a large Erlang/OTP + dashboard build that is infeasible on the
# 2-core CI matrix — same rationale as clickhouse/ollama). The tarball bundles its
# own ERTS (Erlang runtime) plus a `dynlibs/` set of portable libs (libcrypto,
# libtinfo, libatomic) that its bootscript prepends to LD_LIBRARY_PATH. We still
# supply the system libs the BEAM and the bundled NIFs (quicer = MQTT-over-QUIC,
# crypto) link against — glibc, libstdc++, libgcc, zlib, openssl, ncurses, brotli,
# zstd, libatomic — and bash + busybox for the bash bootscript (which also shells out
# to awk/sed/grep/openssl). Hardened on a minimal apko base and 0-CVE gated with Trivy.
#
# License: BSL-1.1 (single node free; cluster needs a commercial license; reverts to
# Apache-2.0 four years post-release). Clean-room-consistent: this is upstream's own
# published artifact, hardened and scanned — not a Bitnami chart.
package:
  name: quench-emqx
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened EMQX MQTT broker, packaged on Wolfi from EMQX's official Erlang/OTP release (BSL-1.1)"
  copyright:
    - license: BUSL-1.1
  dependencies:
    runtime:
      - ca-certificates-bundle
      - glibc
      - libstdc++
      - libgcc
      - zlib
      - openssl
      - ncurses
      - brotli
      - zstd
      - libatomic       # quicer NIF (MQTT-over-QUIC) links libatomic.so.1
      - bash
      - busybox

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - curl
      - ca-certificates-bundle
      - build-base
      - rust                   # Rust NIFs rebuilt from source (see the pipeline)
      - cargo-auditable
      - cmake                  # aws-lc-sys fallback builder
      - protobuf-dev           # protoc for the greptime-proto / arrow-flight codegen

pipeline:
  # EMQX publishes separate el9 amd64/arm64 tarballs; fetch the one matching the build
  # arch by uname -m (x86_64->amd64, aarch64->arm64) with the arch-matching sha256.
  # The archive has no top-level prefix (bin/ lib/ erts-*/ etc/ data/ dynlibs/
  # releases/ at the root), so we extract the whole tree into /opt/emqx.
  - runs: |
      VER="${{package.version}}"
      case "$(uname -m)" in
        x86_64)  earch=amd64; sha=__SHA_AMD__ ;;
        aarch64) earch=arm64; sha=__SHA_ARM__ ;;
        *) echo "unsupported arch $(uname -m)" >&2; exit 1 ;;
      esac

      # EMQX stopped attaching release assets to GitHub after 6.2.2 (that tag has 93,
      # 6.2.3 / 6.3.0 / 6.3.1 have none). packages.emqx.io is where their own
      # www.emqx.com download link 302-redirects to, so it is the canonical host now.
      url="https://packages.emqx.io/emqx-ee/${VER}/emqx-enterprise-${VER}-el9-${earch}.tar.gz"
      curl -fsSL -o emqx.tar.gz "$url"
      echo "${sha}  emqx.tar.gz" | sha256sum -c -

      dest="${{targets.destdir}}/opt/emqx"
      install -d "$dest"
      tar -xzf emqx.tar.gz -C "$dest"

      # --- Rust NIFs: rebuilt from source with cargo auditable (2026-10-13) ---------
      # The tarball's two Rust NIFs (greptimedb_rs, datalayers) carry no .dep-v0 and
      # their repos commit no Cargo.lock, so Trivy saw none of their crates (rustls
      # 0.23.43, GHSA-2mjx MEDIUM, passed blind). Rebuild each from the tag EMQX pins in
      # its mix.exs with `cargo auditable` (fresh resolve, so current patch releases) and
      # replace the prebuilt .so. A tag change fails here until its sha256 is pinned.
      MIX="$(curl -fsSL "https://raw.githubusercontent.com/emqx/emqx/${VER}/mix.exs")"
      DLMIX="$(curl -fsSL "https://raw.githubusercontent.com/emqx/emqx/${VER}/apps/emqx_bridge_datalayers/mix.exs")"
      case "$MIX" in *'greptimedb-ingester-erlnif", tag: "0.1.13"'*) ;; *) echo "EMQX ${VER} moved greptimedb_rs off 0.1.13; pin the new tag"; exit 1 ;; esac
      case "$DLMIX" in *'datalayers-adapter-erl", tag: "0.1.5"'*) ;; *) echo "EMQX ${VER} moved datalayers off 0.1.5; pin the new tag"; exit 1 ;; esac
      export RUSTLER_NIF_VERSION=2.16   # loads on every ERTS EMQX 6 bundles (OTP 25+)
      nif() { # <owner/repo> <tag> <sha256> <lib name> <emqx lib dir glob>
        w=$(mktemp -d)
        curl -fsSL -o "$w/src.tgz" "https://github.com/$1/archive/refs/tags/$2.tar.gz"
        echo "$3  $w/src.tgz" | sha256sum -c -
        tar -xzf "$w/src.tgz" -C "$w" --strip-components=1
        (cd "$w" && cargo auditable build --release)
        so="$w/target/release/lib$4.so"
        readelf -SW "$so" > "$w/sec"; readelf -W --dyn-syms "$so" > "$w/sym"
        grep -q dep-v0 "$w/sec" || { echo "$so has no .dep-v0 section"; exit 1; }
        grep -q ' nif_init$' "$w/sym" || { echo "$so exports no nif_init"; exit 1; }
        old=$(ls "$dest"/lib/$5/priv/lib$4.so)
        install -m0755 "$so" "$old"
        rm -rf "$w"
      }
      nif emqx/greptimedb-ingester-erlnif 0.1.13 811cfe09722770cc234518106377f9a520dae8b13d5fdb60936a9da55d7d1c84 greptimedb_nif 'greptimedb_rs-*'
      nif datalayers-io/datalayers-adapter-erl 0.1.5 934261b586e08144088837f89cf079361fa42213b8af825568d8930e794a27f5 datalayers_nif 'datalayers-*'
      # Every Rust artifact must carry .dep-v0 (none here ships a Cargo.lock).
      find "$dest" -type f -size +100k | while read -r f; do
        LC_ALL=C grep -qa -e 'cargo/registry/src' -e 'rustc version' "$f" || continue
        readelf -S "$f" 2>/dev/null | grep -q dep-v0 && continue
        echo "Rust artifact without .dep-v0: ${f#$dest}"; exit 1
      done

      # Convenience symlink so `emqx` is on PATH.
      install -d "${{targets.destdir}}/usr/bin"
      ln -sf /opt/emqx/bin/emqx "${{targets.destdir}}/usr/bin/emqx"
      ln -sf /opt/emqx/bin/emqx_ctl "${{targets.destdir}}/usr/bin/emqx_ctl"

      # Writable runtime dirs (the chart mounts volumes/emptyDir over these on a
      # read-only rootfs). EMQX writes generated configs + mnesia under data/, and
      # logs under log/.
      install -d "$dest/data" "$dest/log"
      chmod -R a+rwX "$dest/data" "$dest/log"

test:
  pipeline:
    - runs: |
        test -x /opt/emqx/bin/emqx
        # `emqx version` boots the bootscript far enough to print the release version.
        /opt/emqx/bin/emqx version | grep -E "^6\."
