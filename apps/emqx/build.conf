# emqx (emqx/emqx): official-binary via melange. EMQX is an Erlang/OTP (BEAM)
# application; building it from source means a full rebar3 + Erlang/OTP + dashboard
# (Node) build that pulls hundreds of hex/git deps and is far too heavy/fragile for
# the 2-core CI matrix. So, like clickhouse/ollama, we ship EMQX's OWN official
# per-arch release tarball (the el9 glibc build, which bundles its own ERTS and a
# set of portable dynlibs) and harden it on a minimal Wolfi base, 0-CVE gated.
#
# License: EMQX 5.9+/6.x is Business Source License 1.1 (BSL-1.1) — single-node use
# is free; running a multi-node cluster needs a commercial license; each version
# converts to Apache-2.0 four years after its release. The catalog/chart label this.
#
# We ship the newest patch of the last 3 minor lines (6.0 / 6.1 / 6.2). Each release
# publishes separate el9 amd64/arm64 tarballs, each with its own sha256:
#   __VER__     = version           __DISTRO__  = el9 (glibc, widest forward-compat)
#   __SHA_AMD__ = el9 amd64 tarball sha256       __SHA_ARM__ = el9 arm64 tarball sha256
FROM_SOURCE=1
VERSIONS=(6.0.3 6.1.2 6.2.1)
declare -A SHA_AMD=(
  [6.0.3]=cab511ac70b65a01837f752c887aad29cb792a16342bef04d9299b9a1939fbf7
  [6.1.2]=e737b084820d12db281eafc2d83a1a51366c6d6ec15b5e66ed463f2cb319798c
  [6.2.1]=cdf3445ae2e06dcce4c6feed9098c0ba12121d2ee8f23f18f0a51f69a287d1bb
)
declare -A SHA_ARM=(
  [6.0.3]=bb178293749b4709fd766ba2979c3f23d7ac7361ec31e0fcc70fd389e65c2760
  [6.1.2]=5d2e127fbdd2c3ae37c83e3ff8f3efbd47bc126fc4fbb1f35cb3f2bf31337210
  [6.2.1]=4813aa89c6486e1b051d4b0780b038b81a7d1ef756fde8b362c5f9a2642ede87
)
render() {
  echo "s/__VER__/$1/g; s|__SHA_AMD__|${SHA_AMD[$1]}|g; s|__SHA_ARM__|${SHA_ARM[$1]}|g"
}
