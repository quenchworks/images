# STATUS: UNBLOCKED 2026-09-20. The zlib block is gone: Wolfi shipped the fix
# for CVE-2026-85091 as zlib 1.3.2.1_rc20260601-r0 and the advisory was amended
# to name that version, so the 1.3.3-r0 this file used to wait for is a number
# that will never arrive. A stock wolfi-base scan reports the advisory as
# `zlib 1.3.2-r7 -> 1.3.2.1_rc20260601-r0`, which is what Wolfi publishes on
# both arches today. scripts/blocked.py now watches the shipped version.
#
# Evidence, stated exactly as measured:
#   x86_64  gated locally 2026-09-20, PUSH=0: 0 fixable CVEs AND the boot test
#           passed, so this is "runs", not just "scans clean".
#   aarch64 not measured locally; this host kills background melange builds and
#           a qemu-emulated arm build does not fit the foreground timeout. CI's
#           native arm64 runner is the first arm measurement, and its gate
#           refuses to publish on any finding.
# emqx (emqx/emqx): official-binary via melange. EMQX is an Erlang/OTP (BEAM)
# application; building it from source means a full rebar3 + Erlang/OTP + dashboard
# (Node) build that pulls hundreds of hex/git deps and is far too heavy/fragile for
# the 2-core CI matrix. So, like clickhouse/ollama, we ship EMQX's OWN official
# per-arch release tarball (the el9 glibc build, which bundles its own ERTS and a
# set of portable dynlibs) and harden it on a minimal Wolfi base, 0-CVE gated.
#
# License: EMQX 5.9+/6.x is Business Source License 1.1 (BSL-1.1) — single-node use
# is free; running a multi-node cluster needs a commercial license; each version
# converts to Apache-2.0 four years after its release. The catalog/chart label this.
#
# We ship the newest patch of the last 3 minor lines (6.0 / 6.1 / 6.2). Each release
# publishes separate el9 amd64/arm64 tarballs, each with its own sha256:
#   __VER__     = version           __DISTRO__  = el9 (glibc, widest forward-compat)
#   __SHA_AMD__ = el9 amd64 tarball sha256       __SHA_ARM__ = el9 arm64 tarball sha256
#
# 2026-08-31 -- 6.2.3 CANNOT BE ADOPTED YET (not a recipe problem). The 6.2.3
# release exists (tag 6.2.3, published 2026-08-21, not draft, not prerelease) but
# carries ZERO assets: `gh release view 6.2.3 -R emqx/emqx` lists no files at all
# and the el9 tarball this recipe fetches 404s:
#   https://github.com/emqx/emqx/releases/download/6.2.3/emqx-enterprise-6.2.3-el9-amd64.tar.gz
# 6.2.2 by contrast publishes the full amzn2023/debian/el7/el8/el9 matrix. So the
# bump is upstream-gated on EMQX uploading the binaries, and check-updates.py will
# keep reporting 6.2.3 until they do -- an existing TAG is not a shippable release
# for an official-binary recipe. Re-probe the asset list before bumping; do not
# switch to a from-source build for it (see the header for why that is off limits).
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(6.3.2)
# 2026-10-22: packages.emqx.io republished both 6.3.2 el9 tarballs on 2026-10-19 15:39 UTC (after the
# morning pin). The new files match the vendor .sha256 sidecars next to them and unpack as release 6.3.2.
declare -A SHA_AMD=(
  [6.3.2]=d3510f96383a80ca16e74d75e970c9fce49b571fb34451e94fafbfe800cb25fd
)
declare -A SHA_ARM=(
  [6.3.2]=29fabbe51de4c71012d20f988f33a337e40389037fd134b966dcbd3433c0d5c1
)
render() {
  echo "s/__VER__/$1/g; s|__SHA_AMD__|${SHA_AMD[$1]}|g; s|__SHA_ARM__|${SHA_ARM[$1]}|g"
}
