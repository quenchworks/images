# Packages DataHub's GMS (the metadata service: REST, OpenAPI and GraphQL APIs, with the
# MAE/MCE/PE consumers embedded) from upstream's release image, pulled by per-arch digest,
# onto Wolfi. The Spring Boot war is exploded and run on a plain classpath; vulnerable libraries are
# replaced with fixed releases, including the copies bundled inside other jars.
package:
  name: quench-datahub-gms
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened DataHub GMS metadata service, on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - openjdk-25-jre       # upstream runs it on Java 25; classes are major 65 (Java 21)
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      - crane
      - unzip
      - zip                  # drop the bundled OTel copy from auth-api.jar
      - openjdk-25           # a full JDK: Shade.java runs as a single-file source program

pipeline:
  - runs: |
      set -eu
      VER="${{package.version}}"
      case "$(uname -m)" in
        x86_64)  plat=linux/amd64; dig=__DIG_AMD__ ;;
        aarch64) plat=linux/arm64; dig=__DIG_ARM__ ;;
        *) echo "unsupported arch $(uname -m)" >&2; exit 1 ;;
      esac
      mkdir -p rootfs
      crane export --platform "$plat" "index.docker.io/acryldata/datahub-gms@${dig}" - | tar -x -C rootfs datahub
      war=rootfs/datahub/datahub-gms/bin/war.war
      unzip -p "$war" BOOT-INF/classes/git.properties > git.properties
      grep -qx "git.commit.id.describe=v$VER" git.properties || { echo "FATAL: not v$VER"; cat git.properties; exit 1; }
      D="${{targets.destdir}}"; APP=/datahub/datahub-gms/app
      install -d "$D$APP"
      # Exploded Spring Boot war, run on a plain classpath in classpath.idx order: upstream's
      # own EXTRACT_JAR_ENABLED start mode, done once at build time (the fixed jars below are
      # renamed, so the nested-jar launcher index would be stale).
      unzip -q "$war" -d "$D$APP"
      cp -a rootfs/datahub/datahub-gms/resources "$D/datahub/datahub-gms/resources"
      L="$D$APP/BOOT-INF/lib"; ARGS="$D/datahub/datahub-gms/java.args"
      { echo "$APP/BOOT-INF/classes"; sed -E 's|^- "(.*)"$|'"$APP"'/\1|' "$D$APP/BOOT-INF/classpath.idx"; } > cp.txt
      # the jar-mode tool (layer extraction) is not on the application classpath
      rm -f "$L"/spring-boot-jarmode-tools-*.jar

      cat > Shade.java <<'JAVA'
      // Shade: replace a library copy bundled inside another jar with a fixed release.
      // usage: java -cp asm:asm-commons Shade.java <target.jar> <prefix|-> <extra-roots|-> <fixed.jar>[=root,root]...
      // A fixed jar's root defaults to the common prefix of its classes; =roots names them when
      // that prefix is too wide (guava's is com/google/, which also holds gson and google-cloud).
      // prefix is the relocation the bundling jar applied (com/hazelcast/shaded/), or - when the
      // copy is not relocated. Each fixed jar's package root (com/fasterxml/jackson/core/) is
      // relocated under prefix in class references and in string constants, as maven-shade does;
      // extra-roots names roots the bundle relocated without being replaced here (comma list).
      // Classes under prefix+root are dropped from the target (multi-release copies included),
      // with the fixed jar's META-INF/maven coordinates; the fixed classes are added. Fails when
      // a dropped public top-level class has no replacement outside internal/shaded (nested,
      // anonymous and package-private classes are private to the library and come and go).
      import java.io.*;
      import java.nio.file.*;
      import java.util.*;
      import java.util.zip.*;
      import org.objectweb.asm.*;
      import org.objectweb.asm.commons.*;

      public class Shade {
        static String pre;
        static final List<String> roots = new ArrayList<>();

        static String reloc(String n) {
          for (String r : roots) {
            if (n.startsWith(r)) return pre + n;
            String d = r.replace('/', '.');
            if (n.startsWith(d)) return pre.replace('/', '.') + n;
          }
          return n;
        }

        static String unversioned(String e) {
          return e.startsWith("META-INF/versions/") ? e.replaceFirst("^META-INF/versions/[0-9]+/", "") : e;
        }

        static String root(Collection<String> names) {
          String p = null;
          for (String n : names) {
            if (!n.endsWith(".class") || n.startsWith("META-INF/") || n.endsWith("module-info.class")) continue;
            String d = n.substring(0, n.lastIndexOf('/') + 1);
            if (p == null) p = d;
            while (!d.startsWith(p)) p = p.substring(0, p.lastIndexOf('/', p.length() - 2) + 1);
          }
          if (p == null || p.chars().filter(c -> c == '/').count() < 2) throw new IllegalStateException("no package root: " + p);
          return p;
        }

        static byte[] read(ZipFile z, ZipEntry e) throws IOException {
          try (InputStream in = z.getInputStream(e)) { return in.readAllBytes(); }
        }

        static String version(byte[] pom) throws IOException {
          Properties p = new Properties();
          p.load(new ByteArrayInputStream(pom));
          return p.getProperty("version");
        }

        // numeric compare of dotted versions: 2.21.10 > 2.21.8
        static int cmp(String x, String y) {
          String[] a = x.split("[.-]"), b = y.split("[.-]");
          for (int i = 0; i < Math.max(a.length, b.length); i++) {
            String p = i < a.length ? a[i] : "0", q = i < b.length ? b[i] : "0";
            int c = p.matches("\\d+") && q.matches("\\d+") ? Long.compare(Long.parseLong(p), Long.parseLong(q)) : p.compareTo(q);
            if (c != 0) return c;
          }
          return 0;
        }

        public static void main(String[] a) throws Exception {
          Path target = Path.of(a[0]);
          pre = a[1].equals("-") ? "" : a[1];
          if (!a[2].equals("-")) roots.addAll(List.of(a[2].split(",")));
          List<String> replaced = new ArrayList<>(), coords = new ArrayList<>(), kept = new ArrayList<>();
          List<ZipFile> fixed = new ArrayList<>();
          ZipFile tz = new ZipFile(target.toFile());
          for (int i = 3; i < a.length; i++) {
            String[] spec = a[i].split("=", 2);
            ZipFile z = new ZipFile(spec[0]);
            List<String> names = z.stream().map(ZipEntry::getName).toList();
            List<String> rs = spec.length > 1 ? List.of(spec[1].split(",")) : List.of(root(names));
            String pom = names.stream()
                .filter(n -> n.startsWith("META-INF/maven/") && n.endsWith("/pom.properties")).findFirst().orElseThrow();
            roots.addAll(rs);
            ZipEntry have = tz.getEntry(pom);
            if (have == null) throw new IllegalStateException(target + " bundles no " + pom);
            String hv = version(read(tz, have)), fv = version(read(z, z.getEntry(pom)));
            // a kept library nested under a replaced root (failureaccess in guava's
            // com/google/common/) must survive the drop below
            if (cmp(hv, fv) >= 0) { kept.addAll(rs); System.out.println("shade: " + target.getFileName() + ": keeps " + pom + " " + hv + " (>= " + fv + ")"); continue; }
            fixed.add(z);
            replaced.addAll(rs);
            coords.add(pom.substring(0, pom.length() - "pom.properties".length()));
          }
          tz.close();
          if (fixed.isEmpty()) return;
          Remapper rm = new Remapper() {
            @Override public String map(String n) { return reloc(n); }
            @Override public Object mapValue(Object v) { return v instanceof String s ? reloc(s) : super.mapValue(v); }
          };
          Path out = Path.of(a[0] + ".new");
          Set<String> dropped = new TreeSet<>(), added = new HashSet<>(), seen = new HashSet<>();
          try (ZipFile t = new ZipFile(target.toFile());
               ZipOutputStream zo = new ZipOutputStream(new BufferedOutputStream(Files.newOutputStream(out)))) {
            for (ZipEntry e : Collections.list(t.entries())) {
              String n = e.getName(), u = unversioned(n);
              boolean drop = coords.stream().anyMatch(n::startsWith);
              for (String r : replaced) if (u.startsWith(pre + r)) drop = true;
              for (String k : kept) if (u.startsWith(pre + k)) drop = false;
              // only a PUBLIC class can be referenced from outside its package, so only a public
              // dropped class needs a replacement (guava 33 removed package-private helpers)
              if (drop) { if (n.endsWith(".class") && n.equals(u) && (new ClassReader(read(t, e)).getAccess() & Opcodes.ACC_PUBLIC) != 0) dropped.add(n); continue; }
              seen.add(n);
              zo.putNextEntry(new ZipEntry(n));
              if (!e.isDirectory()) try (InputStream in = t.getInputStream(e)) { in.transferTo(zo); }
              zo.closeEntry();
            }
            for (ZipFile z : fixed) {
              for (ZipEntry e : Collections.list(z.entries())) {
                String n = e.getName();
                if (e.isDirectory() || n.endsWith("module-info.class")) continue;
                byte[] b;
                if (n.endsWith(".class")) {
                  String u = unversioned(n);
                  n = n.substring(0, n.length() - u.length()) + pre + u;
                  b = read(z, e);
                  if (!pre.isEmpty()) {
                    ClassWriter w = new ClassWriter(0);
                    new ClassReader(b).accept(new ClassRemapper(w, rm), 0);
                    b = w.toByteArray();
                  }
                  if (n.equals(pre + u)) added.add(n);
                } else if (n.startsWith("META-INF/maven/")) {
                  b = read(z, e);
                } else continue;
                if (!seen.add(n)) continue;
                zo.putNextEntry(new ZipEntry(n));
                zo.write(b);
                zo.closeEntry();
              }
            }
          }
          List<String> missing = dropped.stream().filter(n -> !added.contains(n) && !n.contains("/internal/shaded/") && !n.contains("$")).toList();
          if (!missing.isEmpty()) {
            Files.delete(out);
            throw new IllegalStateException(target + ": no replacement for " + missing.size() + " classes, e.g. " + missing.subList(0, Math.min(5, missing.size())));
          }
          Files.move(out, target, StandardCopyOption.REPLACE_EXISTING);
          System.out.println("shade: " + target.getFileName() + ": " + dropped.size() + " bundled classes -> " + added.size() + " from " + replaced);
        }
      }
      JAVA
      # ---- shared by the three DataHub recipes (datahub-gms, datahub-frontend, datahub-upgrade) ----
      # fetch <maven path> <sha256>: a fixed jar from Maven Central into $J, sha256-pinned
      # (each pin computed from a download, 2026-10-20).
      J="$PWD/fixed"; mkdir -p "$J"
      fetch() {
        f="$J/$(basename "$1")"
        [ -s "$f" ] || curl -fsSL -o "$f" "https://repo1.maven.org/maven2/$1"
        echo "$2  $f" | sha256sum -c - >/dev/null
      }
      # swap <name prefix> <maven path> <sha256>: replace every $L/<prefix><version>.jar OLDER
      # than the fixed one (a release that already ships the fix keeps its jar); fails when no
      # jar matches, so a moved dist stops the build. Renames are mirrored into cp.txt.
      swap() {
        new="$(basename "$2")"; want="${new#"$1"}"; want="${want%.jar}"; n=0
        for j in "$L/$1"[0-9]*.jar; do
          [ -e "$j" ] || continue
          n=$((n+1)); old="${j##*/}"; v="${old#"$1"}"; v="${v%.jar}"
          if [ "$(printf '%s\n%s\n' "$v" "$want" | sort -V | head -1)" = "$want" ]; then
            echo "  keep $old"; continue
          fi
          fetch "$2" "$3"
          install -m 0644 "$J/$new" "$L/$new"; rm -f "$j"
          sed -i "s|/$old\$|/$new|" cp.txt
          echo "  $old -> $new"
        done
        [ "$n" -gt 0 ] || { echo "FATAL: no $1*.jar in $L; re-audit the swaps"; exit 1; }
      }
      # shade <bundling jar> <relocation prefix|-> <extra roots|-> <fixed jar basename>...:
      # rebuild a library copy bundled INSIDE another jar (hazelcast relocates jackson under
      # com/hazelcast/shaded/, parquet-jackson under shaded/parquet/, auth-api.jar carries it
      # unrelocated) from the fixed releases, relocated the way the bundle did it. Shade.java
      # skips a copy already at or above the fix and fails when the bundle no longer carries it.
      ASM=""
      for a in "org/ow2/asm/asm/9.9.1/asm-9.9.1.jar 6f3828a215c920059a5efa2fb55c233d6c54ec5cadca99ce1b1bdd10077c7ddd" \
               "org/ow2/asm/asm-commons/9.9.1/asm-commons-9.9.1.jar c2319e014ce7199f2b7f7d56d6bb991863168c3f4b6cd6c9f542a4937ef7ef88" \
               "org/ow2/asm/asm-tree/9.9.1/asm-tree-9.9.1.jar 0f3555096b720b820bbacab0b515589bee0200bee099bda14c561738ae837ba1"; do
        set -- $a; fetch "$1" "$2"; ASM="$ASM${ASM:+:}$J/$(basename "$1")"
      done
      shade() {
        t="$L/$1"; test -f "$t" || { echo "FATAL: $1 not shipped; re-audit the shading"; exit 1; }
        pre="$2"; extra="$3"; shift 3
        fx=""; for f in "$@"; do fx="$fx $J/$f"; done
        if ! /usr/lib/jvm/java-25-openjdk/bin/java -cp "$ASM" Shade.java "$t" "$pre" "$extra" $fx > shade.log 2>&1; then
          cat shade.log; exit 1
        fi
        grep '^shade: ' shade.log || true
        chmod 0644 "$t"
      }
      # finish <main class> [jvm flags...]: check cp.txt names every jar exactly once and
      # nothing else, then write the launcher argfile the entrypoint runs (java @java.args).
      finish() {
        main="$1"; shift
        while read -r p; do test -e "${{targets.destdir}}$p" || { echo "FATAL: classpath entry $p missing"; exit 1; }; done < cp.txt
        [ "$(grep -c '\.jar$' cp.txt)" = "$(find "$L" -maxdepth 1 -name '*.jar' | wc -l)" ] || { echo "FATAL: $L and the classpath disagree"; exit 1; }
        { for f in "$@"; do echo "$f"; done; echo -cp; paste -sd: cp.txt; echo "$main"; } > "$ARGS"
        chmod -R a+rX "${{targets.destdir}}"
      }
      # The fixed releases the bundled copies are rebuilt from.
      fetch com/fasterxml/jackson/core/jackson-core/2.21.8/jackson-core-2.21.8.jar 604ef7765013daf5cde192e40bc4c8412c4ca93f4aaf7bf8e9a62fad1e1026bb
      fetch com/fasterxml/jackson/core/jackson-databind/2.21.8/jackson-databind-2.21.8.jar ad77f2285717e2f34c319d988b7c85783a47d0b33f33a501d1fcbf196e61bbaa
      fetch tools/jackson/core/jackson-core/3.1.8/jackson-core-3.1.8.jar 762caa009970e8c35527fcc2cfbde50afed0d6a195ee4a7fac22d80fea72c471
      fetch tools/jackson/core/jackson-databind/3.1.8/jackson-databind-3.1.8.jar 2e7583c96f3eaf11591a727c75278b25a0f1227d29a7c5e8306f252f441bfb58
      # Fixes, measured 2026-10-20 with trivy rootfs (comprehensive, ignore-unfixed) on the
      # v1.7.0.1 war: 58 findings, 2 CRITICAL (spring-webmvc). jackson 2.21.5 -> 2.21.8 (also the
      # copy inside auth-api.jar), lz4-java 1.11.4, spring-webmvc 7.0.9 (spring-web and
      # context-support move with it: the rest of spring-framework already ships 7.0.9);
      # hazelcast 5.7.0 (the newest release) relocates jackson 2.21.2 and 3.1.2, rebuilt from
      # 2.21.8 and 3.1.8.
      swap jackson-core-           com/fasterxml/jackson/core/jackson-core/2.21.8/jackson-core-2.21.8.jar 604ef7765013daf5cde192e40bc4c8412c4ca93f4aaf7bf8e9a62fad1e1026bb
      swap jackson-databind-       com/fasterxml/jackson/core/jackson-databind/2.21.8/jackson-databind-2.21.8.jar ad77f2285717e2f34c319d988b7c85783a47d0b33f33a501d1fcbf196e61bbaa
      swap lz4-java-               at/yawk/lz4/lz4-java/1.11.4/lz4-java-1.11.4.jar 58c8e0b813960d2a248e050c353baea73139b48a2ffc55382d42c69707e17325
      swap spring-web-             org/springframework/spring-web/7.0.9/spring-web-7.0.9.jar 941ced476427bde2533872f293da535fd0258de3f3a650a7f1bfe01ed2927302
      swap spring-webmvc-          org/springframework/spring-webmvc/7.0.9/spring-webmvc-7.0.9.jar 8f114c1461692c5e534e82b27de23b7fb23370db8dee7ce0c92d5106906c9555
      swap spring-context-support- org/springframework/spring-context-support/7.0.9/spring-context-support-7.0.9.jar 3c0c35a0371539f5e7d4e9d0226b9a009a4109cd0e20e805e27132dd6ae0727d
      shade hazelcast-5.7.0.jar com/hazelcast/shaded/ - jackson-core-2.21.8.jar jackson-databind-2.21.8.jar jackson-core-3.1.8.jar jackson-databind-3.1.8.jar
      shade auth-api.jar - - jackson-core-2.21.8.jar jackson-databind-2.21.8.jar
      # 2026-11-02 scan: guava 33.7.2 (CVE-2026-102554) for the standalone jar and three bundled
      # copies (graphql-java relocates 32.1.2 under graphql/, iceberg-bundled-guava 33.3.1 under
      # org/apache/iceberg/relocated/, auth-api carries 33.6.0 unrelocated next to failureaccess);
      # guava's roots are named, since its common prefix com/google/ also holds gson and
      # google-cloud. snappy-java 1.1.10.9; the OTel 1.62 core set moves to 1.67.0 together.
      fetch com/google/guava/guava/33.7.2-jre/guava-33.7.2-jre.jar b530942257fb935f8b2cfaa5f8eb5bd59c555fd8e8d01b8ce98912e077ea606c
      fetch com/google/guava/failureaccess/1.0.3/failureaccess-1.0.3.jar cbfc3906b19b8f55dd7cfd6dfe0aa4532e834250d7f080bd8d211a3e246b59cb
      G="guava-33.7.2-jre.jar=com/google/common/,com/google/thirdparty/"
      shade graphql-java-22.3.jar graphql/ - "$G"
      shade iceberg-bundled-guava-1.7.1.jar org/apache/iceberg/relocated/ - "$G" failureaccess-1.0.3.jar
      shade auth-api.jar - - "$G" failureaccess-1.0.3.jar
      swap guava-                  com/google/guava/guava/33.7.2-jre/guava-33.7.2-jre.jar b530942257fb935f8b2cfaa5f8eb5bd59c555fd8e8d01b8ce98912e077ea606c
      swap snappy-java-            org/xerial/snappy/snappy-java/1.1.10.9/snappy-java-1.1.10.9.jar 35228628442e4b9797681c7cbd3b26594f6da3379159dbd0cb07094ed3aece0d
      swap opentelemetry-api-incubator- io/opentelemetry/opentelemetry-api-incubator/1.67.0-alpha/opentelemetry-api-incubator-1.67.0-alpha.jar fea3d78726e49620168c3f6194ff491edfd1ec89b2df06fd5d5b73e55d74a342
      swap opentelemetry-api- io/opentelemetry/opentelemetry-api/1.67.0/opentelemetry-api-1.67.0.jar 538d1dff2f9a37aecbc0ef98fd17273a3affb058e734e6763a3a07a38a5fdc59
      swap opentelemetry-common- io/opentelemetry/opentelemetry-common/1.67.0/opentelemetry-common-1.67.0.jar da97bdb395418e16ecdcbe7ad3497f45b9e767ceda4ae7e86133e7a757ac377f
      swap opentelemetry-context- io/opentelemetry/opentelemetry-context/1.67.0/opentelemetry-context-1.67.0.jar 40fb813fb5e27ec2691daa29c81b572b5b1541ef9b41e62490c3ee3e6407c55e
      swap opentelemetry-exporter-common- io/opentelemetry/opentelemetry-exporter-common/1.67.0/opentelemetry-exporter-common-1.67.0.jar eb61aab6d20bf105102dfa061b478b659cec17e82a50969898046456768ba09b
      swap opentelemetry-exporter-logging- io/opentelemetry/opentelemetry-exporter-logging/1.67.0/opentelemetry-exporter-logging-1.67.0.jar cc5edf7dde86b301908d40a7de5b121119c110a6ee453bc41179af84b19b794a
      swap opentelemetry-exporter-otlp- io/opentelemetry/opentelemetry-exporter-otlp/1.67.0/opentelemetry-exporter-otlp-1.67.0.jar 6724a9c8f9f42de757682c6194c48d9fee4670cd19a85c37954eba526c58b836
      swap opentelemetry-exporter-otlp-common- io/opentelemetry/opentelemetry-exporter-otlp-common/1.67.0/opentelemetry-exporter-otlp-common-1.67.0.jar 75530ab4d93e6fdef478d3e112713337625e70a63df357e6e7b9060c13788015
      swap opentelemetry-exporter-sender-okhttp- io/opentelemetry/opentelemetry-exporter-sender-okhttp/1.67.0/opentelemetry-exporter-sender-okhttp-1.67.0.jar 0ccb54e5e1db24680b0b7b818299552477dcc7114de7ca0f7b054e6e20958b83
      swap opentelemetry-extension-trace-propagators- io/opentelemetry/opentelemetry-extension-trace-propagators/1.67.0/opentelemetry-extension-trace-propagators-1.67.0.jar 6f3f0b5f6a7aa80e8efbaba50b2202b5de64cf670e7bf2b47834c4a708cac74e
      swap opentelemetry-sdk- io/opentelemetry/opentelemetry-sdk/1.67.0/opentelemetry-sdk-1.67.0.jar 52a8f599a368a3d62185e37053f6a53175d6fbe3ecc1d565baba13b1a854267f
      swap opentelemetry-sdk-common- io/opentelemetry/opentelemetry-sdk-common/1.67.0/opentelemetry-sdk-common-1.67.0.jar 628a4c00db9561ff4c608a650d5e7fd66a1e153ccdf1ba3cdc5ac0b7c6518fea
      swap opentelemetry-sdk-extension-autoconfigure- io/opentelemetry/opentelemetry-sdk-extension-autoconfigure/1.67.0/opentelemetry-sdk-extension-autoconfigure-1.67.0.jar 09021cf4e41f081e11e1c00577fe03b98db0ae7fd5f73eaf4020e760fa0edb7e
      swap opentelemetry-sdk-extension-autoconfigure-spi- io/opentelemetry/opentelemetry-sdk-extension-autoconfigure-spi/1.67.0/opentelemetry-sdk-extension-autoconfigure-spi-1.67.0.jar 41eb19f6caf2c655ac3139d331f5c34283f2efdb0f0b0e58765a6cc9e27f66bc
      swap opentelemetry-sdk-logs- io/opentelemetry/opentelemetry-sdk-logs/1.67.0/opentelemetry-sdk-logs-1.67.0.jar dd0f0b625e08787af49d7e270abc6def4c2eabc2f18f5f145b7924024a3311e3
      swap opentelemetry-sdk-metrics- io/opentelemetry/opentelemetry-sdk-metrics/1.67.0/opentelemetry-sdk-metrics-1.67.0.jar c157ff10da59a87a57e5236d9f3290792d9b749433be5e5b449a7d1604c320a9
      swap opentelemetry-sdk-trace- io/opentelemetry/opentelemetry-sdk-trace/1.67.0/opentelemetry-sdk-trace-1.67.0.jar 14d9615c8a5dcf471dcbb74902b771dcfa8656b755ac38dce904042289ccd198
      # auth-api.jar bundles an unversioned OTel copy (no maven metadata, so no scanner sees it)
      # that sits first on the classpath and shadowed the 1.67 set above: autoconfigure 1.67 called
      # ResourceBuilder.addEntity on auth-api's older class and gms died at boot. Remove every OTel
      # class the standalone jars also provide, so one coherent set loads; the rest (proto) stays.
      for j in "$L"/opentelemetry-*.jar; do unzip -Z1 "$j"; done | grep '\.class$' | sort -u > otel.std
      unzip -Z1 "$L/auth-api.jar" | grep '^io/opentelemetry/.*\.class$' | sort > otel.auth
      comm -12 otel.std otel.auth > otel.drop
      [ -s otel.drop ] || { echo "FATAL: auth-api.jar no longer bundles OTel; re-audit"; exit 1; }
      zip -q -d "$L/auth-api.jar" -@ < otel.drop
      echo "  auth-api.jar: dropped $(wc -l < otel.drop) bundled OTel classes"
      if unzip -Z1 "$L/auth-api.jar" | grep -q '^io/opentelemetry/sdk/resources/ResourceBuilder.class$'; then echo "FATAL: auth-api still bundles ResourceBuilder"; exit 1; fi
      # Hazelcast 5 on Java 9+ needs these JDK internals opened (upstream start.sh passes them).
      finish com.linkedin.gms.GMSApplication -XX:MaxRAMPercentage=75.0 --add-modules java.se \
        --add-exports java.base/jdk.internal.ref=ALL-UNNAMED --add-opens java.base/java.lang=ALL-UNNAMED \
        --add-opens java.base/sun.nio.ch=ALL-UNNAMED --add-opens java.management/sun.management=ALL-UNNAMED \
        --add-opens jdk.management/com.sun.management.internal=ALL-UNNAMED

test:
  pipeline:
    - runs: |
        test -f /datahub/datahub-gms/java.args
        test -f /datahub/datahub-gms/resources/entity-registry.yml
        grep -q GMSApplication /datahub/datahub-gms/java.args
