# datahub-gms: DataHub GMS, the metadata service (Apache-2.0): REST.li, OpenAPI and GraphQL
# APIs, with the MAE/MCE/PE Kafka consumers embedded (MAE_CONSUMER_ENABLED and friends,
# the upstream default), so no separate consumer images are needed. Image-and-chart
# (quench/datahub). It starts only after datahub-upgrade's SystemUpdate has run.
#
# FROM_SOURCE=0: DataHub publishes the war only inside its Docker images (GitHub releases
# carry no server artifacts), and the Gradle build of the whole metadata platform is not
# feasible on a CI runner. The recipe pulls upstream's per-arch image BY DIGEST (crane
# refuses any other content), asserts git.commit.id.describe=v<VER>, and repackages the
# exploded war on Wolfi openjdk-25-jre.
#
# 0-CVE: the stock v1.7.0.1 war scans 58 fixable findings (2 CRITICAL), all in jars:
# melange.yaml swaps five library families and rebuilds the jackson copies that hazelcast
# and auth-api.jar bundle (Shade.java, see the recipe).
#
# Search: DataHub 1.7 accepts Elasticsearch 7/8/9 or OpenSearch 2.x; it refuses
# OpenSearch 3 ("expected 2.x", measured 2026-10-20 against our 3.9.0), so the test and
# the chart run on the catalog's Elasticsearch.
#
# NEWEST-ONLY: DataHub ships one supported line.
#   __DIG_AMD__ / __DIG_ARM__ = per-arch manifest digest of acryldata/datahub-gms:v<VER>
BLOCKED=0
FROM_SOURCE=0
VERSIONS=(1.7.0.1)
declare -A DIG_AMD=(
  [1.7.0.1]=sha256:79317e155fae4cdfe1ac8f760d2cf1dffbc1ffc36684b678bfdb8e9f4323cb52
)
declare -A DIG_ARM=(
  [1.7.0.1]=sha256:f53beae43c48d8a2c388b184125cecd3dde0f27e27e3d05c90a4ec415ed764f7
)
render() {
  echo "s/__VER__/$1/g; s|__DIG_AMD__|${DIG_AMD[$1]}|g; s|__DIG_ARM__|${DIG_ARM[$1]}|g"
}
