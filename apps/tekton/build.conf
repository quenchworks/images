# OTEL + KNATIVE SEMCONV, 2026-09-20. The otel float alone made the chart's
# controller and webhook CrashLoopBackOff; knative.dev/pkg has to move with it.
#
#   panic: conflicting Schema URL:
#     https://opentelemetry.io/schemas/1.43.0 and .../schemas/1.41.0
#   knative.dev/pkg@v0.0.0-20260622140654/observability/resource/default.go:66
#
# otel sdk 1.45.0 emits semconv 1.43.0, and the knative.dev/pkg that tekton
# 1.16.0 pins builds its default resource at 1.41.0. Two schema URLs in one
# binary is a hard panic at startup, so the image gated 0-CVE, passed its own
# boot test, and still could not run in a cluster.
#
# Floating knative.dev/pkg to v0.0.0-20260918182429-5dc1978f0042 fixes it:
# that revision is itself built on otel 1.45.0 and prometheus 0.67.0, checked
# in its go.mod on the module proxy rather than assumed from the date.
#
# Reverting the otel float is NOT an option here: without it the image scans
# Total 4 (LOW 4) on the otel advisories and fails the CHML gate, so the recipe
# cannot build at all. Measured both ways before choosing.
# OTEL FLOAT KEPT, CHART GATE BROKEN, 2026-09-20. Both halves measured.
#
# The otel family is floated to 1.45.0 here for CVE-2026-81870 /
# CVE-2026-81871. That float is NOT optional: without it this image scans
# Total 4 (LOW 4) and fails the CHML gate outright, so the recipe cannot build
# at all. Reverting was tried and abandoned for exactly that reason.
#
# With the float the image builds, gates 0 fixable CVEs, passes its own boot
# test, and the binary starts correctly standalone (it reaches "Error building
# kubeconfig", which is right outside a cluster).
#
# What it breaks is the CHART's kind gate: rtest-tekton-controller and
# rtest-tekton-webhook both sit at Available 0/1 to the 10 minute timeout, on
# THREE consecutive runs. That gate failed once and then passed on 2026-09-17
# and 2026-09-19, so one red run there proves nothing; three with the same
# signature does. The documented flake is a different one, a webhook TaskRun
# apply race that is already fixed.
#
# So the IMAGE is correct and published, and quench/tekton cannot release until
# someone reads the pod logs from a kind install. The release gate does not dump
# them today, which is the first thing to change.
# tekton (Tekton Pipelines): from-source via melange (Go build from the git tag
# tarball). Image-only, no chart. NEWEST STABLE ONLY: the single latest vX.Y.Z
# release of github.com/tektoncd/pipeline. Ships the core command set (controller,
# webhook, entrypoint, nop, resolvers, sidecarlogresults, workingdirinit, events)
# as static Go binaries, CGO disabled, vendored deps. Tekton has no ldflags version
# stamp -- components report their version from the pipelines-info ConfigMap at
# deploy time (knative changeset only carries a git revision), so the built-in
# revision is "devel" and the release version is carried by the image tag.
FROM_SOURCE=1
VERSIONS=(1.16.0)
declare -A SHA256=(
  [1.16.0]=9a7de26248298cb88b8477bd9ad0fea619afe8fa97a454266131405de8ebbdc4
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
