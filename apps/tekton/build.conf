# tekton (Tekton Pipelines): from-source via melange (Go build from the git tag
# tarball). Image-only, no chart. NEWEST STABLE ONLY: the single latest vX.Y.Z
# release of github.com/tektoncd/pipeline. Ships the core command set (controller,
# webhook, entrypoint, nop, resolvers, sidecarlogresults, workingdirinit, events)
# as static Go binaries, CGO disabled, vendored deps. Tekton has no ldflags version
# stamp -- components report their version from the pipelines-info ConfigMap at
# deploy time (knative changeset only carries a git revision), so the built-in
# revision is "devel" and the release version is carried by the image tag.
FROM_SOURCE=1
VERSIONS=(1.14.0)
declare -A SHA256=(
  [1.14.0]=e22a16c57f8405781ba5bff3b975078feb89e74dbbdca4c934d9f0174c153db6
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
