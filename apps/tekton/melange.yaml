# Builds Tekton Pipelines from source onto Wolfi. Static Go binaries (CGO off),
# built against the tarball's vendored deps (-mod=vendor). One package ships the
# core command set that a Tekton Pipelines install needs: the controller + webhook
# + resolvers + events deployments, plus the pod-injected helpers (entrypoint, nop,
# sidecarlogresults, workingdirinit). Output is a signed APK in Quenchworks' own
# repo -- no upstream distro binaries. Image-only (no chart).
#
# GOTOOLCHAIN=local pins the build to Wolfi's go-1.26 toolchain (hermetic, no
# network toolchain download). Upstream go.mod pins a patch (go 1.26.4) that can
# lead Wolfi's go-1.26 (a slightly older patch); the go directive is lowered to the
# installed toolchain's patch so `local` mode accepts it (patch-compatible source).
package:
  name: quench-tekton
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Tekton Pipelines, built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.26

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/tektoncd/pipeline/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      export CGO_ENABLED=0
      export GOFLAGS=-mod=vendor
      export GOTOOLCHAIN=local
      # Align the go directive to the installed Wolfi go-1.26 patch so GOTOOLCHAIN=local
      # does not try to fetch a newer toolchain. Patch-level, source stays compatible.
      installed="$(go env GOVERSION | sed 's/^go//')"
      sed -i -E "s/^go 1\.26\.[0-9]+$/go ${installed}/" go.mod
      for b in controller webhook entrypoint nop resolvers sidecarlogresults workingdirinit events; do
        echo "building cmd/$b ..."
        go build -trimpath -ldflags "-s -w" \
          -o "${{targets.destdir}}/usr/bin/$b" "./cmd/$b"
      done
