# Builds Tekton Pipelines from source onto Wolfi. Static Go binaries (CGO off),
# built against the tarball's vendored deps (-mod=vendor). One package ships the
# core command set that a Tekton Pipelines install needs: the controller + webhook
# + resolvers + events deployments, plus the pod-injected helpers (entrypoint, nop,
# sidecarlogresults, workingdirinit). Output is a signed APK in Quenchworks' own
# repo -- no upstream distro binaries. Image-only (no chart).
#
# GOTOOLCHAIN=local pins the build to Wolfi's go-1.26 toolchain (hermetic, no
# network toolchain download). Upstream go.mod pins a patch (go 1.26.4) that can
# lead Wolfi's go-1.26 (a slightly older patch); the go directive is lowered to the
# installed toolchain's patch so `local` mode accepts it (patch-compatible source).
package:
  name: quench-tekton
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Tekton Pipelines, built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.26

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/tektoncd/pipeline/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      export CGO_ENABLED=0
      export GOFLAGS=-mod=vendor
      export GOTOOLCHAIN=local
      # Align the go directive to the installed Wolfi go-1.26 patch so GOTOOLCHAIN=local
      # does not try to fetch a newer toolchain. Patch-level, source stays compatible.
      installed="$(go env GOVERSION | sed 's/^go//')"
      sed -i -E "s/^go 1\.26\.[0-9]+$/go ${installed}/" go.mod
      # 0-CVE float: golang.org/x/text (CVE-2026-56852 infinite loop). Vendor mode
      # cannot `go get`, and the build must see the bump, so re-vendor. Skip
      # `go mod tidy` -- it would re-raise the go directive above Wolfi's go-1.26
      # patch and break GOTOOLCHAIN=local. `go get` + `go mod vendor` is surgical:
      # MVS raises only x/text, leaving the rest of the pinned vendored graph intact.
      GOFLAGS=-mod=mod go get golang.org/x/text@v0.39.0 golang.org/x/net@v0.56.0 golang.org/x/crypto@v0.53.0 golang.org/x/sys@v0.46.0 google.golang.org/grpc@v1.82.1
      GOFLAGS=-mod=mod go mod vendor
      for b in controller webhook entrypoint nop resolvers sidecarlogresults workingdirinit events; do
        echo "building cmd/$b ..."
        go build -trimpath -ldflags "-s -w" \
          -o "${{targets.destdir}}/usr/bin/$b" "./cmd/$b"
      done
      # Tekton's controller injects helper containers into every TaskRun pod that
      # exec the upstream `ko` layout /ko-app/<helper> (paths are hardcoded in
      # pkg/pod/pod.go, workingdir_init.go). Our binaries live in /usr/bin, so
      # symlink the four injected helpers into /ko-app. Without this the
      # controller/webhook come up Ready but the first PipelineRun dies at the
      # prepare init container ("exec /ko-app/entrypoint: no such file or
      # directory"). With it, this image also serves as the -entrypoint-image /
      # -nop-image / -sidecarlogresults-image / -workingdirinit-image.
      mkdir -p "${{targets.destdir}}/ko-app"
      for h in entrypoint nop sidecarlogresults workingdirinit; do
        ln -s "/usr/bin/$h" "${{targets.destdir}}/ko-app/$h"
      done
