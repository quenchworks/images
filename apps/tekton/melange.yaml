# Builds Tekton Pipelines from source onto Wolfi. Static Go binaries (CGO off),
# built against the tarball's vendored deps (-mod=vendor). One package ships the
# core command set that a Tekton Pipelines install needs: the controller + webhook
# + resolvers + events deployments, plus the pod-injected helpers (entrypoint, nop,
# sidecarlogresults, workingdirinit). Output is a signed APK in Quenchworks' own
# repo -- no upstream distro binaries. Image-only (no chart).
#
# GOTOOLCHAIN=local pins the build to Wolfi's go-1.26 toolchain (hermetic, no
# network toolchain download). Upstream go.mod pins a patch (go 1.26.4) that can
# lead Wolfi's go-1.26 (a slightly older patch); the go directive is lowered to the
# installed toolchain's patch so `local` mode accepts it (patch-compatible source).
package:
  name: quench-tekton
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Tekton Pipelines, built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.26

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/tektoncd/pipeline/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      set -eu
      export CGO_ENABLED=0
      export GOFLAGS=-mod=vendor
      export GOTOOLCHAIN=local
      # Align the go directive to the installed Wolfi go-1.26 patch so GOTOOLCHAIN=local
      # does not try to fetch a newer toolchain. Patch-level, source stays compatible.
      installed="$(go env GOVERSION | sed 's/^go//')"
      sed -i -E "s/^go 1\.26\.[0-9]+$/go ${installed}/" go.mod
      # ---- 0-CVE module float (docs/go-module-float.md) ----------------------
      #   golang.org/x/text        CVE-2026-56852 infinite loop
      #   golang.org/x/net         CVE-2026-46600 dnsmessage panic
      #   google.golang.org/grpc   CVE-2026-33186 authz bypass
      #   github.com/google/cel-go GHSA-gcjh-h69q-9w9g (fixed in 0.29.0); used
      #                            directly by the when-expression validators
      # Vendor mode cannot `go get`, and the build must see the bump, so re-vendor
      # when anything moved. Skip `go mod tidy` -- it would re-raise the go directive
      # above Wolfi's go-1.26 patch and break GOTOOLCHAIN=local. `go get` +
      # `go mod vendor` is surgical: MVS raises only what is asked for, leaving the
      # rest of the pinned vendored graph intact.
      #
      # FLOOR is a FLOOR, not a pin. A bare `go get mod@vX` fails silently in two
      # directions: it is a NO-OP when an upstream `replace` overrides it, and it
      # becomes a DOWNGRADE once upstream requires more than vX -- re-introducing
      # the CVE it was added to clear. So float only what is below the floor, then
      # assert the SHIPPED BINARIES carry nothing below it.
      FLOOR="golang.org/x/text@v0.41.0 golang.org/x/net@v0.58.0 golang.org/x/crypto@v0.56.0 golang.org/x/sys@v0.47.0 google.golang.org/grpc@v1.83.2 github.com/google/cel-go@v0.29.2"
      MODS="$(echo "$FLOOR" | tr ' ' '\n' | cut -d@ -f1)"
      # prints "<mod>@<floor> (<tag> has <ver>)" for every module below its floor
      below_floor() {
        awk -v floor="$FLOOR" -v tag="$1" '
          BEGIN { n = split(floor, f, " ")
                  for (i = 1; i <= n; i++) { split(f[i], kv, "@"); want[kv[1]] = kv[2] } }
          ($1 in want) {
            split(substr($2, 2), g, "."); split(substr(want[$1], 2), w, ".")
            for (i = 1; i <= 3; i++) {
              if ((g[i] + 0) > (w[i] + 0)) next
              if ((g[i] + 0) < (w[i] + 0)) { print $1 "@" want[$1] " (" tag " has " $2 ")"; next }
            }
          }'
      }
      # `go list -m` prints "<mod> <ver>" or "<mod> <ver> => <mod> <ver>", so $NF is
      # the EFFECTIVE version and a replace cannot hide behind the require line.
      GOFLAGS=-mod=mod go list -m -e $MODS
      need="$(GOFLAGS=-mod=mod go list -m -e $MODS | awk 'NF >= 2 && $NF ~ /^v[0-9]/ { print $1, $NF }' | below_floor go.mod | awk '{ print $1 }')"
      if [ -n "$need" ]; then
        GOFLAGS=-mod=mod go get $need
        GOFLAGS=-mod=mod go mod vendor
      fi
      for b in controller webhook entrypoint nop resolvers sidecarlogresults workingdirinit events; do
        echo "building cmd/$b ..."
        go build -trimpath -ldflags "-s -w" \
          -o "${{targets.destdir}}/usr/bin/$b" "./cmd/$b"
        # The float is only real if it reached the BINARY. Every `dep`/`=>` line of
        # `go version -m` must be at or above its floor -- the `=>` line is what
        # catches a replace-shadowed float, and a stale vendor/ tree shows up here
        # too. Fail the build rather than ship it.
        bad="$(go version -m "${{targets.destdir}}/usr/bin/$b" \
          | awk '$1 == "dep" || $1 == "=>" { print $2, $3 }' | below_floor "$b")"
        [ -z "$bad" ] || { echo "❌ 0-CVE float did not reach the binary:"; echo "$bad"; exit 1; }
      done
      # Tekton's controller injects helper containers into every TaskRun pod that
      # exec the upstream `ko` layout /ko-app/<helper> (paths are hardcoded in
      # pkg/pod/pod.go, workingdir_init.go). Our binaries live in /usr/bin, so
      # symlink the four injected helpers into /ko-app. Without this the
      # controller/webhook come up Ready but the first PipelineRun dies at the
      # prepare init container ("exec /ko-app/entrypoint: no such file or
      # directory"). With it, this image also serves as the -entrypoint-image /
      # -nop-image / -sidecarlogresults-image / -workingdirinit-image.
      mkdir -p "${{targets.destdir}}/ko-app"
      for h in entrypoint nop sidecarlogresults workingdirinit; do
        ln -s "/usr/bin/$h" "${{targets.destdir}}/ko-app/$h"
      done
