# STATUS 2026-10-07: new app (first piece of search-stack). The official per-arch dist
# tarball on Wolfi nodejs-22 (engines: node <23); its bundled node/ is dropped. Dashboards
# must match the OpenSearch minor it talks to, so only lines we also ship as OpenSearch.
#
# Sizing 2026-10-07 (3.8.0): `trivy fs` on the dist reads only plugins/*/yarn.lock (dev
# deps included) and skips node_modules; `trivy rootfs` sees what the image gate sees: 89
# findings in 18 packages across core + 16 plugins, all fixed by the version-aware swaps
