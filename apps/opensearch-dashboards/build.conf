# STATUS 2026-10-07: new app (first piece of search-stack). The official per-arch dist
# tarball on Wolfi nodejs-22 (engines: node <23); its bundled node/ is dropped. Dashboards
# must match the OpenSearch minor it talks to, so only lines we also ship as OpenSearch.
#
# Sizing 2026-10-07 (3.8.0): `trivy fs` on the dist reads only plugins/*/yarn.lock (dev
# deps included) and skips node_modules; `trivy rootfs` sees what the image gate sees: 89
# findings in 18 packages across core + 16 plugins, all fixed by the version-aware swaps
# in melange.yaml.
#
# Plugins dropped, matching apps/opensearch (which ships without the security and
# security-analytics backend plugins): securityDashboards (it requires the backend
# security plugin and refuses to run without it) and securityAnalyticsDashboards.
# customImportMapDashboards keeps its server code but loses maplibre-gl 5.2.0 and its
# mapbox-gl alias (CVE-2026-85061, fixed only in 6.x): no server code requires them, the
# browser copy is already compiled into target/public.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(3.8.0)
declare -A SHA_AMD=(
  [3.8.0]=0910ecc1d60d08fe1f03908dcce327350325b92ad5fe27aa1966c091cebdddf664a5cd2205c04ef1d89e1dc6f616c72e5cb7e08ba18d1ef5a2e1e846b1d849a5
)
declare -A SHA_ARM=(
  [3.8.0]=963d7c255d0dab1c54c163e5a899f16983a48951003b143676298c78774a87a3f19c9058f8d81884dc425b675af61cbe8195067635f1d8c4f1b70745e4dc6b03
)
render() { echo "s/__VER__/$1/g; s|__SHA_AMD__|${SHA_AMD[$1]}|g; s|__SHA_ARM__|${SHA_ARM[$1]}|g"; }
