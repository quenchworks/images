VERSIONS=(3.0.5 3.1.1)
declare -A SHA256=(
  [3.0.5]=16e3033272ec687bac43351de0979ecc73381152b924e435e55a63ccb0a38d46
  [3.1.1]=c39b5ae755523f784e3a5c17864052ab05cb48604468644264a60ebc405e7a0b
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
