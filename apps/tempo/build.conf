# tempo: from-source via melange (Go build of grafana/tempo). Newest stable
# release only. Pins its source tarball by sha256.
FROM_SOURCE=1
VERSIONS=(3.0.2)
declare -A SHA256=(
  [3.0.2]=9da6e1c411694d1010bb7641ab55e365095bc85fd76d02e142ede0fa2162cf71
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
