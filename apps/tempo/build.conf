# tempo: from-source via melange (Go build of grafana/tempo). Latest 3 stable
# minor lines, newest patch each (2.9, 2.10, 3.0). Each pins its source tarball by sha256.
FROM_SOURCE=1
VERSIONS=(2.9.2 2.10.7 3.0.2)
declare -A SHA256=(
  [2.9.2]=772f67083df9853ebf7b98c98308c3d0d72f640e563a4c81b8011acb18fc69f6
  [2.10.7]=61c0e210df228d3cd77232a1c7f0c9e66f8337f11398322721c89e13ecf6385a
  [3.0.2]=9da6e1c411694d1010bb7641ab55e365095bc85fd76d02e142ede0fa2162cf71
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
