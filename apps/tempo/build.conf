VERSIONS=(3.0.4 3.1.0)
declare -A SHA256=(
  [3.0.4]=34e1ae49c14b335c36d7a221b19ac4758b956035b53ce317e44213d227015b8d
  [3.1.0]=69302279a96cf7a58f19ed910f2e782b6b87aba7577ab02c93130e2764ebd211
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
