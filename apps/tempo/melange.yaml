# Builds Grafana Tempo from source onto Wolfi. Single static Go binary
# (CGO disabled, netgo), multi-arch. Output is a signed APK in Quenchworks'
# own repo. No upstream distro binaries.
#
# Tempo is a high-volume, minimal-cost distributed tracing backend (same Grafana
# family as the shipped Loki). It has NO bundled web UI -- Grafana is its
# frontend -- so there is no Node toolchain or asset-embedding step. We build
# from the git tag source tarball, which vendors all Go dependencies (vendor/),
# so the build is fully offline with -mod=vendor.
#
# We build the server `tempo` binary (cmd/tempo, the deliverable) using the exact
# version ldflags from upstream's Makefile so `tempo --version` reports the
# pinned release. AGPL-3.0 (same license tier as the shipped grafana/loki images).
package:
  name: quench-tempo
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Grafana Tempo (distributed tracing backend), built from source on Wolfi"
  copyright:
    - license: AGPL-3.0-only
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      # 3.1 requires go >= 1.27.1 (3.0 needs 1.26); use the current go-1.27 toolchain to pick
      # up the latest stdlib CVE fixes (clears the Trivy gate without bumps).
      - go-1.27

pipeline:
  # Build from the git tag source tarball. Tempo vendors all deps under vendor/,
  # so the build needs no network. Pinned to the tag; verified by sha256.
  - uses: fetch
    with:
      uri: https://github.com/grafana/tempo/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      export CGO_ENABLED=0
      export GOFLAGS=-mod=vendor
      export GOTOOLCHAIN=local
      # 0-CVE gate bumps (patch/minor, same major, no API break):
      #   golang.org/x/net  v0.55.0 -> v0.56.0 (CVE-2026-46600: panic parsing an
      #                     invalid SVCB/HTTPS DNS resource record)
      #   golang.org/x/text v0.37.0 -> v0.39.0 (CVE-2026-56852: infinite loop on
      #                     invalid input)
      # Tempo vendors its deps and builds -mod=vendor (offline), so float the
      # modules with the module proxy enabled, tidy, then re-populate vendor/ so
      # the subsequent -mod=vendor build stays fully offline at the bumped versions.
      # otel CVE-2026-81870 / CVE-2026-81871: the published image drifted onto
      # these after release. The family moves together; a partial float moves the
      # compile error to the next module. otelzap 0.20.0 is the contrib bridge
      # whose own go.mod requires log 0.21.0, read from the module proxy.
      # 0-CVE FLOORS, not pins (docs/go-module-float.md): raise a module only where go.mod has it
      # below the floor; a module absent from the graph is skipped. Bare `go get` pins downgraded
      # newer upstream releases (found 2026-10-05).
      FLOOR="golang.org/x/net@v0.58.0 golang.org/x/sys@v0.47.0 google.golang.org/grpc@v1.83.2 golang.org/x/crypto@v0.56.0 golang.org/x/text@v0.41.0 github.com/apache/thrift@v0.24.0 go.opentelemetry.io/otel@v1.45.0 go.opentelemetry.io/otel/trace@v1.45.0 go.opentelemetry.io/otel/metric@v1.45.0 go.opentelemetry.io/otel/sdk@v1.45.0 go.opentelemetry.io/otel/sdk/metric@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.45.0 go.opentelemetry.io/otel/log@v0.21.0 go.opentelemetry.io/otel/sdk/log@v0.21.0 go.opentelemetry.io/otel/exporters/otlp/otlplog/otlploggrpc@v0.21.0 go.opentelemetry.io/otel/exporters/stdout/stdoutlog@v0.21.0 go.opentelemetry.io/otel/exporters/otlp/otlplog/otlploghttp@v0.21.0 go.opentelemetry.io/otel/exporters/stdout/stdouttrace@v1.45.0 go.opentelemetry.io/otel/exporters/stdout/stdoutmetric@v1.45.0 go.opentelemetry.io/contrib/bridges/otelzap@v0.20.0"
      # Go semver order (a release outranks its prereleases); busybox sort -V does not.
      vlt() { awk -v a="${1#v}" -v b="${2#v}" 'function pp(s,  p){sub(/\+.*/,"",s);p=index(s,"-");if(p){C=substr(s,1,p-1);P=substr(s,p+1)}else{C=s;P=""}} function cmp(x,y,  i,n,m,X,Y){n=split(x,X,".");m=split(y,Y,".");for(i=1;i<=n&&i<=m;i++){if(X[i]==Y[i])continue;if(X[i]~/^[0-9]+$/&&Y[i]~/^[0-9]+$/)return (X[i]+0<Y[i]+0)?-1:1;if(X[i]~/^[0-9]+$/)return -1;if(Y[i]~/^[0-9]+$/)return 1;return (X[i]<Y[i])?-1:1}return (n<m)?-1:(n>m)?1:0} BEGIN{pp(a);ca=C;pa=P;pp(b);cb=C;pb=P;c=cmp(ca,cb);if(c==0){if(pa==pb)c=0;else if(pa=="")c=1;else if(pb=="")c=-1;else c=cmp(pa,pb)}exit !(c<0)}'; }
      need=""
      for mv in $FLOOR; do
        have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${mv%@*}" 2>/dev/null)"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        vlt "$have" "${mv#*@}" && need="$need $mv"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || go get $need
      GOFLAGS=-mod=mod go mod tidy
      GOFLAGS=-mod=mod go mod vendor
      # Stamp version exactly like upstream's Makefile (LD_FLAGS sets main.{Version,
      # Branch,Revision}; cmd/tempo/main.go forwards them into prometheus/common/
      # version) so `tempo --version` reports the pinned release. Upstream's VERSION
      # file carries the leading "v", so Version="v${version}" to match it.
      go build -trimpath -tags netgo \
        -ldflags "-s -w -extldflags \"-static\" \
          -X main.Version=v${{package.version}} \
          -X main.Branch=HEAD \
          -X main.Revision=v${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/tempo" ./cmd/tempo

test:
  pipeline:
    - runs: |
        tempo --version
