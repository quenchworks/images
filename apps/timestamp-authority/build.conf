# timestamp-authority: the Sigstore Timestamp Authority (Apache-2.0), an RFC
# 3161 timestamping server. Built from source on Wolfi, static Go. Image and
# chart. Newest patch of the last 3 lines (2.1, 2.0, 1.2); 1.2.9 also needs
# sigstore/sigstore v1.10.4 and mongo-driver v1.17.7 from the float.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(1.2.9 2.0.6 2.1.4)
declare -A SHA=(
  [1.2.9]=984634330f438499acd3391a22be2852f65b15f21c934dd99558c85f6327063e
  [2.0.6]=4df25a33b1cd96f8fef2f5b89619c12e722c01833c9654dcca094a813e7b8834
  [2.1.4]=26cbced9103f223f7fab6fe963af072de500178fa186df59687a17a22210b39e
)
render() { echo "s/__VER__/$1/g; s/__SHA256__/${SHA[$1]}/g"; }
