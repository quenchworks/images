# Builds timestamp-server from source onto Wolfi: CGO off, the version
# stamped through sigs.k8s.io/release-utils as upstream's Makefile does.
package:
  name: quench-timestamp-authority
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Sigstore Timestamp Authority, built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/sigstore/timestamp-authority/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      set -eu
      export CGO_ENABLED=0
      export GOTOOLCHAIN=local
      export GOFLAGS=-mod=mod
      # ---- 0-CVE module float (docs/go-module-float.md) ----------------------
      # FLOOR is a floor, not a pin: only modules below it are raised, and the
      # shipped binary is asserted at or above it after the build. 1.2.9 also
      # carries sigstore/sigstore v1.9.5, mongo-driver v1.14.0 and
      # edwards25519 v1.1.0 (CVE-2026-26958).
      FLOOR="golang.org/x/net@v0.58.0 golang.org/x/text@v0.41.0 golang.org/x/crypto@v0.56.0 golang.org/x/sys@v0.47.0 golang.org/x/mod@v0.40.0 golang.org/x/oauth2@v0.36.0 google.golang.org/grpc@v1.83.2 github.com/sigstore/sigstore@v1.10.4 go.mongodb.org/mongo-driver@v1.17.7 filippo.io/edwards25519@v1.1.1 go.opentelemetry.io/otel@v1.45.0 go.opentelemetry.io/otel/sdk@v1.45.0 go.opentelemetry.io/otel/trace@v1.45.0 go.opentelemetry.io/otel/metric@v1.45.0"
      MODS="$(echo "$FLOOR" | tr ' ' '\n' | cut -d@ -f1)"
      below_floor() {
        awk -v floor="$FLOOR" -v tag="$1" '
          BEGIN { n = split(floor, f, " ")
                  for (i = 1; i <= n; i++) { split(f[i], kv, "@"); want[kv[1]] = kv[2] } }
          ($1 in want) {
            split(substr($2, 2), g, "."); split(substr(want[$1], 2), w, ".")
            for (i = 1; i <= 3; i++) {
              if ((g[i] + 0) > (w[i] + 0)) next
              if ((g[i] + 0) < (w[i] + 0)) { print $1 "@" want[$1] " (" tag " has " $2 ")"; next }
            }
          }'
      }
      need="$(go list -m -e $MODS | awk 'NF >= 2 && $NF ~ /^v[0-9]/ { print $1, $NF }' | below_floor go.mod | awk '{ print $1 }')"
      if [ -n "$need" ]; then go get $need; fi
      go mod tidy
      rm -rf vendor
      go build -trimpath -ldflags "-s -w -X sigs.k8s.io/release-utils/version.gitVersion=v${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/timestamp-server" ./cmd/timestamp-server
      bad="$(go version -m "${{targets.destdir}}/usr/bin/timestamp-server" \
        | awk '$1 == "dep" || $1 == "=>" { print $2, $3 }' | below_floor timestamp-server)"
      [ -z "$bad" ] || { echo "0-CVE float did not reach the binary:"; echo "$bad"; exit 1; }
      "${{targets.destdir}}/usr/bin/timestamp-server" version | grep -F "v${{package.version}}"

test:
  pipeline:
    - runs: |
        timestamp-server version
