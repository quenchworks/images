# Assembles the Sigstore Timestamp Authority image: static binary, nonroot uid
# 1001, multi-arch, SBOM by apko. Serves on 3000. The default signer is an
# in-memory key for testing; pass --timestamp-signer file|kms|tink for real use.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-timestamp-authority@local

accounts:
  groups:
    - groupname: nonroot
      gid: 1001
  users:
    - username: nonroot
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/bin/timestamp-server serve --host 0.0.0.0 --port 3000

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-timestamp-authority"
  org.opencontainers.image.licenses: "Apache-2.0"
