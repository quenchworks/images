# mitmproxy (mitmproxy, mitmdump, mitmweb) in a Python 3.13 venv on Wolfi.
#
# Native parts are rebuilt rather than taken from PyPI wheels:
# - cryptography, pyOpenSSL, bcrypt and argon2-cffi come from Wolfi (system site-packages): the
#   cryptography wheel statically bundles its own OpenSSL, which no scanner sees.
# - aioquic is built from source against Wolfi's OpenSSL 4 for the same reason (its wheel's
#   _crypto module carries a static OpenSSL).
# - mitmproxy_rs (Rust) is built from its tag with cargo auditable, with the hickory DNS crates
#   raised to 0.26.2: the 0.12.15 wheel embeds hickory-resolver 0.26.1 (GHSA-5j98-2g5x-46v6,
#   GHSA-6w6g-hm98-mhgm HIGH, GHSA-6f2x-v7q7-m7m5) and no crate list, so the scan passed it.
# - tornado is overridden to 6.6.1 (CVE-2026-115927, -116577, -116578; mitmproxy caps it at
#   6.5.10). tornado only serves mitmweb, which the test exercises.
# - The mitmproxy-linux-redirector binary (local capture mode, which needs root and BPF) is
#   removed: it also embeds hickory 0.26.1, and a nonroot container cannot use it.
package:
  name: quench-mitmproxy
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened mitmproxy (mitmproxy, mitmdump, mitmweb), built on Wolfi"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - python-3.13
      - py3.13-cryptography
      - py3.13-pyopenssl
      - py3.13-bcrypt
      - py3.13-argon2-cffi
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - curl
      - python-3.13
      - python-3.13-dev
      - py3.13-cryptography
      - py3.13-pyopenssl
      - py3.13-bcrypt
      - py3.13-argon2-cffi
      - openssl-4.0-dev
      - libffi-dev
      - rust
      - cargo-auditable
      - maturin

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/mitmproxy/mitmproxy_rs/archive/refs/tags/v__RS__.tar.gz
      expected-sha256: __RS_SHA256__
      strip-components: 0
  - runs: |
      set -eu
      V=/opt/mitmproxy/venv
      PY=python3.13
      SITE=$V/lib/$PY/site-packages
      $PY -m venv --system-site-packages "$V"

      # cargo auditable for every Rust build (the wrapper reroutes only build and rustc)
      CW="$(mktemp -d)"
      printf '#!/bin/sh\ncase "$1" in build|rustc) exec /usr/bin/cargo auditable "$@";; esac\nexec /usr/bin/cargo "$@"\n' > "$CW/cargo"
      chmod +x "$CW/cargo"

      # mitmproxy_rs from its tag, the hickory family moved together to 0.26.2
      (
        cd mitmproxy_rs-__RS__
        for p in hickory-proto hickory-net hickory-resolver hickory-server; do
          cargo update -p "$p" --precise 0.26.2
        done
        PATH="$CW:$PATH" maturin build --release --locked -m mitmproxy-rs/Cargo.toml -i "$V/bin/python" --out /tmp/wheels
      )

      # pip, not uv: pip counts Wolfi's system site-packages as installed (uv pulled the
      # cryptography wheel back in). tornado goes on after, past mitmproxy's <=6.5.10 cap.
      PATH="$CW:$PATH" "$V/bin/pip" install --no-cache-dir --no-binary aioquic \
        /tmp/wheels/mitmproxy_rs-__RS__-*.whl "mitmproxy==${{package.version}}"
      "$V/bin/pip" install --no-cache-dir --no-deps "tornado==6.6.1"
      "$V/bin/python" -m pip uninstall -y pip

      # The OpenSSL users must be Wolfi's, not wheels
      for m in cryptography OpenSSL bcrypt argon2; do
        test ! -e "$SITE/$m" || { echo "$m installed into the venv instead of from Wolfi"; exit 1; }
      done
      readelf -d "$SITE"/aioquic/_crypto*.so | grep -q 'NEEDED.*libcrypto.so.4' || { echo "aioquic does not link Wolfi's libcrypto"; exit 1; }
      "$V/bin/python" -c "import tornado; assert tornado.version == '6.6.1', tornado.version"
      # the rebuilt extension carries its crate list and the fixed hickory
      ext="$(ls "$SITE"/mitmproxy_rs/*.so)"
      readelf -S "$ext" | grep -q '\.dep-v0' || { echo "mitmproxy_rs has no cargo auditable data"; exit 1; }

      # local capture mode: needs root + BPF, and the prebuilt binary embeds hickory 0.26.1
      rm -f "$V/bin/mitmproxy-linux-redirector"
      rm -rf "$SITE"/mitmproxy_linux-*.dist-info/sboms
      ! strings "$ext" | grep -q 'hickory-resolver-0.26.1'

      "$V/bin/mitmdump" --version

      install -d "${{targets.destdir}}/opt/mitmproxy" "${{targets.destdir}}/usr/bin"
      cp -a "$V" "${{targets.destdir}}/opt/mitmproxy/"
      # certifi's bundled cacert.pem points at the system bundle, so CA updates come from Wolfi
      c="${{targets.destdir}}$SITE/certifi/cacert.pem"
      test -f "$c"
      ln -sf /etc/ssl/certs/ca-certificates.crt "$c"
      for b in mitmdump mitmproxy mitmweb; do
        ln -sf "/opt/mitmproxy/venv/bin/$b" "${{targets.destdir}}/usr/bin/$b"
      done


test:
  pipeline:
    - runs: |
        mitmdump --version
