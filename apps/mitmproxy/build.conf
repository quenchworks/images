# mitmproxy: mitmproxy/mitmdump/mitmweb from PyPI into a Python 3.13 venv on Wolfi, with the
# native parts rebuilt so the image carries one OpenSSL (Wolfi's) and no blind binaries:
# cryptography/pyOpenSSL/bcrypt/argon2 come from Wolfi, aioquic is built from source, and the
# mitmproxy_rs Rust extension is built from its tag with cargo auditable (melange.yaml).
# LATEST ONLY: one supported line.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(12.3.1)
# mitmproxy_rs (the Rust extension) version each mitmproxy pins, and its tag tarball sha256
declare -A RS=( [12.3.1]=0.12.15 )
declare -A RS_SHA256=( [12.3.1]=12866a83e9c3b27a797021f6dbd9c195b2775c3b217c78cc034fa5e47ac783b6 )
render() { echo "s/__VER__/$1/g; s|__RS__|${RS[$1]}|g; s|__RS_SHA256__|${RS_SHA256[$1]}|g"; }
