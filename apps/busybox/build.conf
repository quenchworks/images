# busybox: from-source via melange (fetch busybox.net tarball + sha256).
# Latest 3 stable minor lines, each at its newest patch (full X.Y.Z, used as-is).
# __VER__ = version (busybox-__VER__.tar.bz2); __SHA256__ = that tarball's sha256.
FROM_SOURCE=1
VERSIONS=(1.36.1 1.37.0 1.38.0)
declare -A SHA256=(
  [1.36.1]=b8cc24c9574d809e7279c3be349795c5d5ceb6fdf19ca709f80cde50e47de314
  [1.37.0]=3311dff32e746499f4df0d5df04d7eb396382d7e108bb9250e7b519b837043a4
  [1.38.0]=34f9ea6ff8636f2c9241153b9114eefa9e65674a45318ae1ef95bb5f31c53bb2
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
