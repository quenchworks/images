# Assembles the longhorn-share-manager image. Root by default like upstream: ganesha binds
# 2049 and serves a block device longhorn-manager attaches; the manager sets its command.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-longhorn-share-manager@local

accounts:
  groups:
    - groupname: longhorn
      gid: 1001
  users:
    - username: longhorn
      uid: 1001
      gid: 1001
  run-as: 0

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

entrypoint:
  command: /longhorn-share-manager

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-longhorn-share-manager"
  org.opencontainers.image.licenses: "Apache-2.0 AND LGPL-3.0-or-later"
