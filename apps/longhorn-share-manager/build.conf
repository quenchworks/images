# longhorn-share-manager (longhorn/longhorn-share-manager): serves a Longhorn RWX volume over
# NFSv4. The Go daemon runs ganesha.nfsd from PATH with `RecoveryBackend = longhorn`, which
# exists only in Longhorn's nfs-ganesha fork (rancher/nfs-ganesha), so ganesha is built from
# that fork at the commit Longhorn's dep-versions pins per release, with the ntirpc commit
# pinned beside it and libkmip (the 15.x CMakeLists adds it unconditionally). Build flags are
# dep-versions' scripts/build-nfs-ganesha.sh (vfs_only, no dbus, no GSS, no monitoring).
# Latest patch of the last 3 minor lines (the Longhorn release lines).
FROM_SOURCE=1
VERSIONS=(1.11.3 1.12.1 1.13.0)
declare -A SHA256=(
  [1.11.3]=38d1746281a1fd918ba152b1b685b0a56b916a88c189033dcf3817039f9930a9
  [1.12.1]=898acf03d1996c2c579acaadeb70fe597d4831cb44a2a7d382a595405f717135
  [1.13.0]=47c990ed13a69bdd94a7f4f7294c184e4340d899bd0a50bafb36dcfec9f96b4e
)
# dep-versions <tag>/versions.json: nfs-ganesha and ntirpc commits per Longhorn line.
declare -A GANESHA=(
  [1.11.3]=56797d00d812a5e7a68f506618bfed222d961019
  [1.12.1]=56797d00d812a5e7a68f506618bfed222d961019
  [1.13.0]=d7398d6c4014fc515007ddc76816ffe66ad6dc1c
)
declare -A NTIRPC=(
  [1.11.3]=3072c8f7c0d4cc4e4ab5134b0ac9506afa793eea
  [1.12.1]=3072c8f7c0d4cc4e4ab5134b0ac9506afa793eea
  [1.13.0]=24a7d5fca4c2e3e3cc8bb94bc301d8c2a40677a8
)
declare -A SRC_SHA256=(
  [56797d00d812a5e7a68f506618bfed222d961019]=e8e6edc9f5cabdeda9b274efb99c79fbe2f721c438ed26aeb67b14594f4b93cc
  [d7398d6c4014fc515007ddc76816ffe66ad6dc1c]=dec2dda0fe365b3b1113e24015bf6607a87ef89c5d99fc17865efae2e20e80bd
  [3072c8f7c0d4cc4e4ab5134b0ac9506afa793eea]=d4e760a26eb82ad9f3fc84cb37cafeb4a3d8089646ea9760aa333043f7ba1313
  [24a7d5fca4c2e3e3cc8bb94bc301d8c2a40677a8]=819beb7dad10fc0c76032847c23c54212877d0fe37af666e8ef60ddc02471046
)
# The libkmip submodule commit of the 15.x fork; 9.x has no libkmip and ignores it.
KMIP=4f553ecaf8e57cc3019222b8551d17888f0a1e66
KMIP_SHA256=372d54e3a25c9d3f5c442714f93ddac263b68d993a27647853a377cdf7e94432
render() {
  local g=${GANESHA[$1]} n=${NTIRPC[$1]}
  echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g; s|__GANESHA__|$g|g; s|__GANESHA_SHA256__|${SRC_SHA256[$g]}|g; s|__NTIRPC__|$n|g; s|__NTIRPC_SHA256__|${SRC_SHA256[$n]}|g; s|__KMIP__|$KMIP|g; s|__KMIP_SHA256__|$KMIP_SHA256|g"
}
