# Builds longhorn-share-manager and Longhorn's nfs-ganesha fork from pinned source tarballs.
package:
  name: quench-longhorn-share-manager
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Longhorn share-manager (NFSv4 for RWX volumes, nfs-ganesha fork), built from source"
  copyright:
    - license: Apache-2.0
    - license: LGPL-3.0-or-later   # nfs-ganesha
  dependencies:
    runtime:
      - busybox
      - ca-certificates-bundle
      - e2fsprogs
      - libtirpc-conf   # /etc/netconfig, which ntirpc reads at startup
      - nfs-utils   # libnfsidmap, mount.nfs
      - xfsprogs

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - acl-dev
      - bison
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - curl-dev
      - dbus-dev   # pkg_check_modules(dbus-1) runs even with USE_DBUS=OFF
      - e2fsprogs-dev
      - flex
      - go
      - json-c-dev
      - libnsl-dev
      - nfs-utils-dev
      - userspace-rcu-dev
      - util-linux-dev
      - xfsprogs-dev

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/longhorn/longhorn-share-manager/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - uses: fetch
    with:
      uri: https://github.com/rancher/nfs-ganesha/archive/__GANESHA__.tar.gz
      expected-sha256: __GANESHA_SHA256__
      extract: false
  - uses: fetch
    with:
      uri: https://github.com/nfs-ganesha/ntirpc/archive/__NTIRPC__.tar.gz
      expected-sha256: __NTIRPC_SHA256__
      extract: false
  - uses: fetch
    with:
      uri: https://github.com/ceph/libkmip/archive/__KMIP__.tar.gz
      expected-sha256: __KMIP_SHA256__
      extract: false
  - name: nfs-ganesha (Longhorn fork) with its pinned ntirpc
    runs: |
      set -eu
      mkdir ganesha
      tar xzf __GANESHA__.tar.gz -C ganesha --strip-components=1
      rm -rf ganesha/src/libntirpc ganesha/src/libkmip
      mkdir ganesha/src/libntirpc ganesha/src/libkmip
      tar xzf __NTIRPC__.tar.gz -C ganesha/src/libntirpc --strip-components=1
      tar xzf __KMIP__.tar.gz -C ganesha/src/libkmip --strip-components=1
      grep -q 'longhorn' ganesha/src/SAL/CMakeLists.txt
      cd ganesha
      cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
        -DCMAKE_BUILD_TYPE=Release -DBUILD_CONFIG=vfs_only \
        -DUSE_DBUS=OFF -DUSE_NLM=OFF -DUSE_RQUOTA=OFF -DUSE_9P=OFF -D_MSPAC_SUPPORT=OFF -DRPCBIND=OFF \
        -DUSE_RADOS_RECOV=OFF -DRADOS_URLS=OFF -DUSE_FSAL_VFS=ON -DUSE_FSAL_XFS=OFF \
        -DUSE_FSAL_PROXY_V4=OFF -DUSE_FSAL_PROXY_V3=OFF -DUSE_FSAL_LUSTRE=OFF -DUSE_FSAL_LIZARDFS=OFF \
        -DUSE_FSAL_KVSFS=OFF -DUSE_FSAL_CEPH=OFF -DUSE_FSAL_GPFS=OFF -DUSE_FSAL_PANFS=OFF -DUSE_FSAL_GLUSTER=OFF \
        -DUSE_GSS=NO -DHAVE_ACL_GET_FD_NP=ON -DHAVE_ACL_SET_FD_NP=ON \
        -DUSE_MONITORING=OFF -DUSE_MAN_PAGE=OFF \
        -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_INSTALL_LIBDIR=lib -DLIB_INSTALL_DIR=/usr/lib \
        -DSYSCONFDIR=/etc -S src -B build
      make -C build -j"$(nproc)"
      make -C build install DESTDIR="${{targets.destdir}}"
      rm -rf "${{targets.destdir}}/usr/share/doc" "${{targets.destdir}}/usr/include" "${{targets.destdir}}/usr/lib/pkgconfig"
  - name: share-manager
    runs: |
      set -eu
      export CGO_ENABLED=0 GOTOOLCHAIN=local
      # 0-CVE floors (docs/go-module-float.md), raised only where go.mod is below them; a
      # module absent from the graph is skipped. Same set as longhorn-manager.
      FLOOR="golang.org/x/crypto@v0.56.0 golang.org/x/mod@v0.40.0 golang.org/x/net@v0.58.0 golang.org/x/text@v0.41.0 google.golang.org/grpc@v1.83.2"
      # Go semver order (a release outranks its prereleases); busybox sort -V does not.
      vlt() { awk -v a="${1#v}" -v b="${2#v}" 'function pp(s,  p){sub(/\+.*/,"",s);p=index(s,"-");if(p){C=substr(s,1,p-1);P=substr(s,p+1)}else{C=s;P=""}} function cmp(x,y,  i,n,m,X,Y){n=split(x,X,".");m=split(y,Y,".");for(i=1;i<=n&&i<=m;i++){if(X[i]==Y[i])continue;if(X[i]~/^[0-9]+$/&&Y[i]~/^[0-9]+$/)return (X[i]+0<Y[i]+0)?-1:1;if(X[i]~/^[0-9]+$/)return -1;if(Y[i]~/^[0-9]+$/)return 1;return (X[i]<Y[i])?-1:1}return (n<m)?-1:(n>m)?1:0} BEGIN{pp(a);ca=C;pa=P;pp(b);cb=C;pb=P;c=cmp(ca,cb);if(c==0){if(pa==pb)c=0;else if(pa=="")c=1;else if(pb=="")c=-1;else c=cmp(pa,pb)}exit !(c<0)}'; }
      need=""
      for mv in $FLOOR; do
        have="$(GOFLAGS=-mod=mod go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${mv%@*}" 2>/dev/null)"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        vlt "$have" "${mv#*@}" && need="$need $mv"
      done
      echo "raising:${need:- nothing}"
      if [ -n "$need" ]; then
        GOFLAGS=-mod=mod go get $need
        GOFLAGS=-mod=mod go mod tidy
        GOFLAGS=-mod=mod go mod vendor
      fi
      go build -trimpath -ldflags "-s -w -X main.Version=v${{package.version}}" -o "${{targets.destdir}}/longhorn-share-manager" .
      grep -aq "v${{package.version}}" "${{targets.destdir}}/longhorn-share-manager"
      # Exports live under /export, as in upstream's image (wolfi-baselayout already links
      # /etc/mtab, which ganesha reads, to /proc/self/mounts).
      install -d "${{targets.destdir}}/export"

test:
  pipeline:
    - runs: |
        set -eu
        ganesha.nfsd -v 2>&1 | grep -i ganesha
        /longhorn-share-manager daemon --help >/dev/null
