# hubble-ui-backend: the Hubble UI backend, the Go service that reads flows and the
# service map from Hubble Relay and streams them to the Hubble UI frontend, built from
# source (backend/ in the cilium/hubble-ui tag tarball). Static Go binary, no CGO.
#
# 0-CVE: the 0.13.6 build scanned 0 with no module float (measured 2026-09-25).
#
# NEWEST-ONLY: upstream ships one line (0.13.x); the frontend image (hubble-ui) is built
# from the same tag and the chart pins both.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(0.13.6)
declare -A SHA256=(
  [0.13.6]=cc3848718a06e90140720a83236f86480a6b35e0e99711e731ff29ff002c5238
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
