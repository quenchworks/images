# OpenTelemetry Operator runtime image. Minimal, nonroot, multi-arch, SBOM by apko.
# A Kubernetes controller with admission webhooks: TLS on 9443 from
# /tmp/k8s-webhook-server/serving-certs, health on :8081 (/healthz, /readyz).
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-opentelemetry-operator@local

accounts:
  groups:
    - groupname: nonroot
      gid: 1001
  users:
    - username: nonroot
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/bin/opentelemetry-operator

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-opentelemetry-operator"
  org.opencontainers.image.licenses: "Apache-2.0"
