# tika (Apache Tika server): content and metadata extraction over a REST API (PDF, Office,
# images, archives, 1000+ formats), on a Wolfi openjdk-21-jre. From the Apache release
# artifacts (verified by the sha512 Apache publishes beside them): the 4.x line ships as
# a zip (server jar, lib/, plugins/). NEWEST MAJOR ONLY: the 3.3.2 uberjar carries
# jetty, cxf-core, jackson-databind 2.22.1 and jsoup findings inside the one jar
# (measured 2026-10-01), which only an in-jar rebuild could clear. 4.1.0 gates clean.
FROM_SOURCE=1
VERSIONS=(4.1.0)
declare -A SHA512=(
  [4.1.0]=c932f84c569fb02df4f72ab060d6f2cf77b6797417040202401bc256e18a8f6f0ebc25d12d6dce222cb9328abfcb388cfa6511d7382c765a45687240a8a4bd7e
)
render() { echo "s/__VER__/$1/g; s|__SHA512__|${SHA512[$1]}|g"; }
