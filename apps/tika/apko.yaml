# Assembles the Tika server image: nonroot uid 1001, REST API on 9998.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-tika@local

accounts:
  groups:
    - groupname: tika
      gid: 1001
  users:
    - username: tika
      uid: 1001
      gid: 1001
  run-as: 1001

environment:
  JAVA_HOME: /usr/lib/jvm/java-21-openjdk
  # the server forks its parser JVMs by running `java` from PATH
  PATH: /usr/lib/jvm/java-21-openjdk/bin:/usr/sbin:/usr/bin:/sbin:/bin

entrypoint:
  command: /usr/lib/jvm/java-21-openjdk/bin/java -jar /opt/tika/tika-server.jar -h 0.0.0.0 -p 9998

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-tika"
  org.opencontainers.image.licenses: "Apache-2.0"
