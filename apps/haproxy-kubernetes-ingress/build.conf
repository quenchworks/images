# HAProxy Kubernetes Ingress Controller (haproxytech/kubernetes-ingress, Apache-2.0): watches Ingress, Gateway API and
# its own CRDs and writes HAProxy's config, with rate limiting, IP allow/deny lists and ACLs as annotations. From source:
# the Go controller, upstream's two small C pieces (haproxy_wrapper, which forces LD_PRELOAD of libblock_secrets.so so
# HAProxy cannot read the pod's service-account secrets), and gopherd (haproxytech/gopherd, Apache-2.0), the
# supervisor upstream runs as PID 1, at a pinned tag instead of upstream's :latest. HAProxy itself is the sibling
# quench-haproxy package (apps/haproxy) at its newest version, the 3.4 line this controller release targets.
# LATEST-ONLY: one controller release per HAProxy line.
FROM_SOURCE=1
VERSIONS=(3.4.1)
declare -A SHA256=(
  [3.4.1]=e247ee94602adba867a8f175ea06e7fa8c649e286acdd654194ada7aa5118e98
)
declare -A COMMIT=(
  [3.4.1]=87ca8d4e69f191719662d5695d7a3dded2c6727a
)
# gopherd tag per controller release (upstream copies gopherd:latest at its own build time)
declare -A GOPHERD_VER=( [3.4.1]=1.3.6 )
declare -A GOPHERD_SHA=( [3.4.1]=2233e16d7a9d2a231f1129e68b0c10fdd8e4e60e0995bf14b146ec044e82e1c2 )
render() {
  echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g; s|__COMMIT__|${COMMIT[$1]}|g;\
s|__GOPHERD_VER__|${GOPHERD_VER[$1]}|g; s|__GOPHERD_SHA__|${GOPHERD_SHA[$1]}|g"
}
