# audiobookshelf: Audiobookshelf (advplyr/audiobookshelf, GPL-3.0), a self-hosted audiobook and podcast server
# with web and mobile apps. Images issue #119.
#
# From the release tag as upstream's Dockerfile builds it: the Nuxt 2 client is generated and only its static
# client/dist ships; the server is compiled with tsc and installed with production dependencies only, on Wolfi
# nodejs-24 with Wolfi ffmpeg. sqlite3 is compiled against Wolfi's SQLite (not its bundled copy). The optional
# nunicode SQLite extension is left out (BinaryManager marks it optional); SKIP_BINARIES_CHECK stops the runtime
# binary download. Web UI and API on 13378.
# LATEST-ONLY: one release line.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(2.38.0)
declare -A SHA256=(
  [2.38.0]=69cb1ff3992c9994440eaa47332f7052a8b3f96d5a58e22c1f1af94bc2d1b295
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
