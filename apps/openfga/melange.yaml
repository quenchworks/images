# Builds OpenFGA (Zanzibar-style fine-grained authorization) from source onto
# Wolfi. Single static Go binary, no CGO (matches upstream .goreleaser.yaml
# CGO_ENABLED=0). The version is stamped via -X internal/build.Version so
# `openfga version` reports the real release; goreleaser stamps it with a
# leading "v", so we do too. Playground, migrations and test assets are all
# committed and go:embed-ed, so a plain build of ./cmd/openfga yields the full
# server (run/migrate/validate-models/version). go.mod requires go 1.25.7, so
# we pin go-1.25 with GOTOOLCHAIN=local to forbid a network toolchain fetch.
# Output is a signed APK in Quenchworks' own repo. No upstream distro binaries.
# Image-only (no chart). Upstream tags carry a "v" prefix; package.version is bare.
package:
  name: quench-openfga
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened OpenFGA (fine-grained authorization), built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      # go-1.26: stdlib 1.25.12 findings are fixed only in 1.25.13/1.26.6+, and Wolfi's
      # go-1.25 line tops out at 1.25.12 (same reasoning as cadence, harbor-registry).
      - go-1.26

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/openfga/openfga/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      export CGO_ENABLED=0
      export GOTOOLCHAIN=local
      export GOFLAGS=-mod=mod
      # 0-CVE gate float: golang.org/x/net v0.55.0 -> v0.56.0 (CVE-2026-46600:
      # panic parsing an invalid SVCB/HTTPS DNS RR). Minor, API-compatible.
      # cel-go v0.28.1 -> v0.29.2 clears GHSA-gcjh-h69q-9w9g (MEDIUM:
      # ext.NativeTypes(ParseStructTag("json")) exposes json:"-" fields to user CEL
      # expressions; first fixed release is 0.29.0). OpenFGA's condition evaluator
      # uses none of the cel-go API that changed in 0.29.
      # 0-CVE FLOORS, not pins (docs/go-module-float.md): raise a module only where go.mod has it
      # below the floor; a module absent from the graph is skipped. Bare `go get` pins downgraded
      # newer upstream releases (found 2026-10-05).
      FLOOR="golang.org/x/net@v0.58.0 golang.org/x/text@v0.41.0 google.golang.org/grpc@v1.83.2 go.opentelemetry.io/otel@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.45.0 go.opentelemetry.io/otel/sdk@v1.45.0 go.opentelemetry.io/otel/trace@v1.45.0 go.opentelemetry.io/otel/metric@v1.45.0 golang.org/x/oauth2@v0.36.0 github.com/google/cel-go@v0.29.2"
      # Go semver order (a release outranks its prereleases); busybox sort -V does not.
      vlt() { awk -v a="${1#v}" -v b="${2#v}" 'function pp(s,  p){sub(/\+.*/,"",s);p=index(s,"-");if(p){C=substr(s,1,p-1);P=substr(s,p+1)}else{C=s;P=""}} function cmp(x,y,  i,n,m,X,Y){n=split(x,X,".");m=split(y,Y,".");for(i=1;i<=n&&i<=m;i++){if(X[i]==Y[i])continue;if(X[i]~/^[0-9]+$/&&Y[i]~/^[0-9]+$/)return (X[i]+0<Y[i]+0)?-1:1;if(X[i]~/^[0-9]+$/)return -1;if(Y[i]~/^[0-9]+$/)return 1;return (X[i]<Y[i])?-1:1}return (n<m)?-1:(n>m)?1:0} BEGIN{pp(a);ca=C;pa=P;pp(b);cb=C;pb=P;c=cmp(ca,cb);if(c==0){if(pa==pb)c=0;else if(pa=="")c=1;else if(pb=="")c=-1;else c=cmp(pa,pb)}exit !(c<0)}'; }
      need=""
      for mv in $FLOOR; do
        have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${mv%@*}" 2>/dev/null)"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        vlt "$have" "${mv#*@}" && need="$need $mv"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || go get $need
      go mod tidy
      go build -trimpath \
        -ldflags "-s -w -X github.com/openfga/openfga/internal/build.Version=v${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/openfga" ./cmd/openfga
