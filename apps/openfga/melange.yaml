# Builds OpenFGA (Zanzibar-style fine-grained authorization) from source onto
# Wolfi. Single static Go binary, no CGO (matches upstream .goreleaser.yaml
# CGO_ENABLED=0). The version is stamped via -X internal/build.Version so
# `openfga version` reports the real release; goreleaser stamps it with a
# leading "v", so we do too. Playground, migrations and test assets are all
# committed and go:embed-ed, so a plain build of ./cmd/openfga yields the full
# server (run/migrate/validate-models/version). go.mod requires go 1.25.7, so
# we pin go-1.25 with GOTOOLCHAIN=local to forbid a network toolchain fetch.
# Output is a signed APK in Quenchworks' own repo. No upstream distro binaries.
# Image-only (no chart). Upstream tags carry a "v" prefix; package.version is bare.
package:
  name: quench-openfga
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened OpenFGA (fine-grained authorization), built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-1.25

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/openfga/openfga/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      export CGO_ENABLED=0
      export GOTOOLCHAIN=local
      export GOFLAGS=-mod=mod
      # 0-CVE gate float: golang.org/x/net v0.55.0 -> v0.56.0 (CVE-2026-46600:
      # panic parsing an invalid SVCB/HTTPS DNS RR). Minor, API-compatible.
      # cel-go v0.28.1 -> v0.29.2 clears GHSA-gcjh-h69q-9w9g (MEDIUM:
      # ext.NativeTypes(ParseStructTag("json")) exposes json:"-" fields to user CEL
      # expressions; first fixed release is 0.29.0). OpenFGA's condition evaluator
      # uses none of the cel-go API that changed in 0.29.
      go get golang.org/x/net@v0.56.0 golang.org/x/text@v0.39.0 google.golang.org/grpc@v1.82.1 go.opentelemetry.io/otel@v1.43.0 go.opentelemetry.io/otel/sdk@v1.43.0 go.opentelemetry.io/otel/trace@v1.43.0 go.opentelemetry.io/otel/metric@v1.43.0 golang.org/x/oauth2@v0.36.0 github.com/google/cel-go@v0.29.2
      go mod tidy
      go build -trimpath \
        -ldflags "-s -w -X github.com/openfga/openfga/internal/build.Version=v${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/openfga" ./cmd/openfga
