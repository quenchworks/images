# openfga: from-source via melange (Go build of ./cmd/openfga from the git tag
# tarball). Latest patch of the last 2 minor lines (1.17, 1.18). Each release
# pins its source tarball by sha256. Single static Go binary, no CGO (matches
# upstream .goreleaser.yaml CGO_ENABLED=0). Version is stamped via -X on
# internal/build.Version with a leading "v" (goreleaser uses v{{ .Version }}).
FROM_SOURCE=1
VERSIONS=(1.20.0)
declare -A SHA256=(
  [1.20.0]=be1c5d55f5e995a5a3e583b79e2a8a1520685880ecac7c5803e315f6fb8eaba0
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
