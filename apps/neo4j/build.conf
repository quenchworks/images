# STATUS: SHIPPABLE (0-CVE gate PASS; unblocked 2026-07-09 via melange jar remediation)
#   Verified 2026-07-09 on neo4j 2026.05.0, x86_64: Trivy comprehensive 0-CVE gate PASSES
#   and test.sh boots (read-only rootfs) + serves HTTP discovery + round-trips a Cypher
#   write/read over Bolt with NEO4J_AUTH. Remediation is in melange.yaml (see the
#   "0-CVE jar remediation" step):
#     - STANDALONE same-major swaps (ABI-safe, from Maven Central):
#         lib jackson (databind/core/datatype-jsr310/jaxrs-*/module-jaxb) 2.21.2 -> 2.21.5
#         lib netty (all 16 core + native jars)                          4.2.14.Final -> 4.2.16.Final
#         lib jetty (WHOLE org.eclipse.jetty.* set: core+http2+ee8+ee)   12.1.8 -> 12.1.10
#           (must be version-aligned: neo4j's embedded HTTP server links one coherent
#            jetty version; a mixed 12.1.8/12.1.10 set 500s the HTTP probes -> CrashLoop)
#         lib shiro (all 10 modules, in lockstep)                        2.1.0 -> 2.2.1
#           (argon2/bcrypt hash providers moved to group org.apache.shiro.crypto in 2.2.x)
#     - DROPPED lib/parquet-jackson-1.17.1.jar: it SHADES jackson-databind 2.21.3
#       (CVE-2026-54512..54518) as relocated classes -- no standalone swap can reach it and
#       no newer parquet-jackson shades a fixed jackson. It is used ONLY by the niche
#       Parquet import/export format; core graph DB + Bolt do not load it at boot.
#       TRADE-OFF: the Parquet import/export I/O format is disabled (would NoClassDefFound
#       if invoked). Everything the smoke test exercises (Cypher over Bolt, HTTP, auth) works.
#     netty (Bolt) and shiro (auth) are both exercised end-to-end by test.sh, so the swaps
#     are proven ABI-safe, not just gate-clean.
#
# neo4j: from-source via melange (installs the Neo4j Community dist tarball, runs
# on the system openjdk-21-jre). Neo4j uses calendar versioning; we ship the newest
# monthly release only, because the 0-CVE jar remediation in melange.yaml is
# PER-RELEASE (see below). Each release pins its tarball by sha256.
#
# 2026.06 IS NOT ADDED YET -- it needs a dedicated session, not a band add.
#   sha256 (dist.neo4j.org sidecar, verified 2026-07-27):
#     [2026.06.0]=1dcf62e7e8035e71732b86532b9f8e3219ce8956bd06940d5a0024696727192a
#   Its bundled jar set MOVED, so melange.yaml's hardcoded swap pairs no longer
#   match -- and a swap whose `old` version is absent does NOT replace anything, it
#   just ADDS a second version of the same library to lib/ (the exact mixed-version
#   state that made the embedded HTTP layer 500 on probes -> Ready-but-CrashLoop):
#     jackson  2.21.2 -> bundles 2.22.0 (annotations 2.22)   swap pair STALE
#     netty    4.2.14.Final -> bundles 4.2.15.Final          swap pair STALE
#     shiro    2.1.0 -> bundles 2.2.1 (already patched)       swap now redundant
#     jetty    still 12.1.8 (whole family)                    swap still valid
#     parquet-jackson-1.17.1.jar still present                drop still valid
#     NEW: lib/netty-tcnative/ (2.0.77.Final, incl. per-arch jars) -- unscanned so far
#   Adding the line therefore needs (a) a Trivy comprehensive scan of 2026.06.0 to
#   learn which of jackson 2.22.0 / netty 4.2.15 / netty-tcnative actually need a
#   swap and to what, and (b) per-version swap blocks in melange.yaml (one template
#   now serves one release). Whole families must move in lockstep -- never partial.
FROM_SOURCE=1
VERSIONS=(2026.05.0)
declare -A SHA256=(
  [2026.03.1]=419c5a471a8b6918570da687215d7d3406983a6ae209fd3d96c2de2a90a5dcfb
  [2026.04.0]=fd750466b1247c0d1ef09a84c614f7e045793b30dfa277148e8da71646598820
  [2026.05.0]=bb753b4e9bcc331e90b968edd8da445e974090867ca825cc672defdad6066f0e
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
