# Assembles the Neo4j Community Edition runtime image. Minimal, nonroot, multi-arch,
# SBOM by apko. Configured by NEO4J_* env (the entrypoint writes neo4j.conf). HTTP API
# + Browser on 7474, Bolt on 7687. NEO4J_AUTH sets the initial password (or 'none').
# Neo4j Community is GPLv3.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-neo4j@local

accounts:
  groups:
    - groupname: neo4j
      gid: 1001
  users:
    - username: neo4j
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/bin/docker-entrypoint.sh

environment:
  JAVA_HOME: /usr/lib/jvm/java-21-openjdk
  NEO4J_HOME: /opt/neo4j
  NEO4J_CONF: /conf
  NEO4J_DATA_DIR: /data
  NEO4J_LOGS_DIR: /logs
  NEO4J_RUN_DIR: /var/run/neo4j
  # keep the smoke/default footprint modest; override in the chart
  NEO4J_HEAP_INITIAL: "512m"
  NEO4J_HEAP_MAX: "512m"
  NEO4J_PAGECACHE: "256m"
  PATH: /usr/lib/jvm/java-21-openjdk/bin:/usr/bin:/opt/neo4j/bin

work-dir: /opt/neo4j

paths:
  - path: /conf
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o755
  - path: /data
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o700
  - path: /logs
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o755
  - path: /var/run/neo4j
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o755

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-neo4j"
  org.opencontainers.image.licenses: "GPL-3.0-only"
