# Restic REST Server runtime: the rest-server binary serving /data on :8000 with users from
# /data/.htpasswd. Nonroot uid 1001, multi-arch. /data is the volume.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-rest-server@local

accounts:
  groups:
    - groupname: rest-server
      gid: 1001
  users:
    - username: rest-server
      uid: 1001
      gid: 1001
      homedir: /data
  run-as: 1001

work-dir: /data

paths:
  - path: /data
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o750

entrypoint:
  command: /usr/bin/rest-server
cmd: --path /data --listen :8000

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-rest-server"
  org.opencontainers.image.licenses: "BSD-2-Clause"
