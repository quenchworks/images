# rest-server: Restic REST Server (restic/rest-server), an HTTP backup target for restic with htpasswd
# auth, append-only and private-repos modes and native TLS. BSD-2-Clause. Images issue #48.
#
# Pure Go (CGO off) with upstream's goreleaser flags (-s -w -X main.version). The image serves /data on
# :8000 and reads users from /data/.htpasswd (rest-server's default); the chart mounts a generated one.
FROM_SOURCE=1
VERSIONS=(0.14.0)
declare -A SHA256=(
  [0.14.0]=8b3f91d561819ba9bce454505958fcca6d61ecd12e10086954ebfc92ba163ba4
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
