# oauth2-proxy: from-source via melange (Go build from the git tag tarball).
# Latest patch of the last 3 minor lines (7.13, 7.14, 7.15). Each release pins its
# source tarball by sha256. Single static Go binary, no CGO. Version is stamped
# into the binary via -X on github.com/oauth2-proxy/oauth2-proxy/v7/pkg/version.VERSION.
FROM_SOURCE=1
VERSIONS=(7.13.0 7.14.3 7.15.3)
declare -A SHA256=(
  [7.13.0]=86d005585f753cda3495cf68f231bcb3be13d7c96d80c8890c0f9939e0bddcad
  [7.14.3]=2e89d0aa778e55fbd92c66c9fdb91cdc960da9a7a4d0f0180418f733a925d5d8
  [7.15.3]=a13491bfd083e570d451275458728fb3f722b4d46657644df1ea90c676c552da
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
