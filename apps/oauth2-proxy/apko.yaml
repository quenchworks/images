# Assembles the oauth2-proxy runtime image. Minimal, nonroot, multi-arch, SBOM by apko.
# The entrypoint is just the binary: oauth2-proxy needs provider config at runtime
# (client id/secret, cookie secret, upstream, OIDC issuer) which the chart/CI supplies
# as args or env. By default it listens on :4180 (http) and serves /ping (returns 200)
# for health checks. Runs unprivileged as the nonroot oauth2-proxy user.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-oauth2-proxy@local

accounts:
  groups:
    - groupname: oauth2-proxy
      gid: 1001
  users:
    - username: oauth2-proxy
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/bin/oauth2-proxy

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-oauth2-proxy"
  org.opencontainers.image.licenses: "MIT"
