# Builds oauth2-proxy from source onto Wolfi. Single static Go binary, no CGO.
# oauth2-proxy's main package is at the repo root, so a plain `go build .` produces
# the full `oauth2-proxy` reverse-proxy auth binary. The version is stamped via -X
# so `oauth2-proxy --version` reports the real release. Output is a signed APK in
# Quenchworks' own repo. No upstream distro binaries.
package:
  name: quench-oauth2-proxy
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened oauth2-proxy, built from source on Wolfi"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/oauth2-proxy/oauth2-proxy/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      go build -trimpath \
        -ldflags "-s -w -X github.com/oauth2-proxy/oauth2-proxy/v7/pkg/version.VERSION=${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/oauth2-proxy" .
