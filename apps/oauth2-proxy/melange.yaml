# Builds oauth2-proxy from source onto Wolfi. Single static Go binary, no CGO.
# oauth2-proxy's main package is at the repo root, so a plain `go build .` produces
# the full `oauth2-proxy` reverse-proxy auth binary. The version is stamped via -X
# so `oauth2-proxy --version` reports the real release. Output is a signed APK in
# Quenchworks' own repo. No upstream distro binaries.
package:
  name: quench-oauth2-proxy
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened oauth2-proxy, built from source on Wolfi"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git              # `go get` resolves module versions via git
      - go

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/oauth2-proxy/oauth2-proxy/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - name: Bump vulnerable Go modules to their fixed versions (0-CVE gate)
    runs: |
      set -eu
      export GOFLAGS=-mod=mod
      export GO111MODULE=on
      export GOTOOLCHAIN=local   # use the installed go, don't fetch go.mod's toolchain
      # Trivy flags x/net, x/crypto/ssh and x/oauth2 in the binary's module graph. FLOORS, not
      # pins (docs/go-module-float.md): raise only where go.mod is below. Minimal version
      # selection already gives every importer the highest required version, so no `replace`
      # is needed to reach transitive uses. Until 2026-10-05 this forced x/net 0.58.0 and
      # x/crypto 0.56.0 by replace, which downgraded 7.15.5 (it requires 0.59.0 and 0.57.0).
      FLOOR="golang.org/x/net@v0.58.0 golang.org/x/sys@v0.47.0 google.golang.org/grpc@v1.83.2 golang.org/x/text@v0.41.0 golang.org/x/crypto@v0.56.0 golang.org/x/oauth2@v0.36.0"
      need=""
      for mv in $FLOOR; do
        have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${mv%@*}" 2>/dev/null)"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        [ "$(printf '%s\n%s\n' "$have" "${mv#*@}" | sort -V | head -1)" = "${mv#*@}" ] || need="$need $mv"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || go get $need
      go mod tidy || true
  - runs: |
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      go build -trimpath \
        -ldflags "-s -w -X github.com/oauth2-proxy/oauth2-proxy/v7/pkg/version.VERSION=${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/oauth2-proxy" .
