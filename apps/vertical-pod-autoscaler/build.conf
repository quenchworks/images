# vertical-pod-autoscaler (kubernetes/autoscaler, vertical-pod-autoscaler-X.Y.Z tags):
# the recommender, updater and admission-controller, built from source into ONE image
# (upstream ships three; the chart picks the binary per component). Static Go, CGO off,
# as each component's Dockerfile builds it. The version is a constant in
# common/version.go, asserted against the tag. Latest patch of the last 3 minor lines.
FROM_SOURCE=1
VERSIONS=(1.6.0 1.7.2 1.8.0)
declare -A SHA256=(
  [1.6.0]=6e4f1ba4b4b0be2d4ef5b1f1137798e285c4f3e80b3d1e06bf1e43beb57d997f
  [1.7.2]=7d67387bbb5f2a4281e1b12c00056cfe7290c7ecfa2a984c503729c551220444
  [1.8.0]=3e28009467916494292be18d9bd3137c74ed726c97bdba1a3c55602ce84e5491
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
