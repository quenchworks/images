# Assembles the VPA image: nonroot uid 1001; /usr/bin/vpa-{recommender,updater,admission-controller}.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-vertical-pod-autoscaler@local

accounts:
  groups:
    - groupname: vertical-pod-autoscaler
      gid: 1001
  users:
    - username: vertical-pod-autoscaler
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/bin/vpa-recommender

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-vertical-pod-autoscaler"
  org.opencontainers.image.licenses: "Apache-2.0"
