# Builds the three VPA components from the kubernetes/autoscaler release tag.
package:
  name: quench-vertical-pod-autoscaler
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Vertical Pod Autoscaler (recommender, updater, admission-controller), built from source"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - go

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/kubernetes/autoscaler/archive/refs/tags/vertical-pod-autoscaler-${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      set -eu
      cd vertical-pod-autoscaler
      grep -q "^const versionCore = \"${{package.version}}\"$" common/version.go \
        || { echo "common/version.go does not say ${{package.version}}"; exit 1; }
      export CGO_ENABLED=0 GOFLAGS=-mod=mod GOTOOLCHAIN=local
      # 0-CVE float (docs/go-module-float.md), a floor: raise a module only where the
      # line links an older one.
      # otel floats as one family (1.6 links otel 1.40.0, CVE-2026-29181); each member is
      # raised only if the line already links it.
      for want in golang.org/x/crypto@v0.56.0 golang.org/x/net@v0.58.0 golang.org/x/text@v0.41.0 \
                  go.opentelemetry.io/otel@v1.45.0 go.opentelemetry.io/otel/metric@v1.45.0 \
                  go.opentelemetry.io/otel/trace@v1.45.0 go.opentelemetry.io/otel/sdk@v1.45.0 \
                  go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.45.0 \
                  go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.45.0; do
        m="${want%@*}"; w="${want#*@}"
        have="$(go list -m -f '{{.Version}}' "$m" 2>/dev/null || true)"
        [ -n "$have" ] || continue
        [ "$(printf '%s\n%s\n' "$have" "$w" | sort -V | head -1)" = "$w" ] || go get "$want"
      done
      go mod tidy
      for c in recommender updater admission-controller; do
        go build -C "pkg/$c" -trimpath -ldflags "-s -w" -o "${{targets.destdir}}/usr/bin/vpa-$c" .
      done

test:
  pipeline:
    - runs: |
        test -x /usr/bin/vpa-recommender
        test -x /usr/bin/vpa-updater
        test -x /usr/bin/vpa-admission-controller
