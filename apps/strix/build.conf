# strix: AI agents that find and validate vulnerabilities in web apps and code (usestrix/strix). Image only: the CLI
# (Python, with its Bubble Tea TUI sidecar built from source by upstream's hatch hook and the prebuilt viewer bundle).
# The agents run their tools in upstream's Kali sandbox image (STRIX_IMAGE, ghcr.io/usestrix/strix-sandbox), started
# through a Docker API (DOCKER_HOST); that sandbox installs its tools at @latest and is not part of this image.
# Latest only. Sized 2026-11-23 at 1.7.1.
FROM_SOURCE=1
VERSIONS=(1.7.1)
declare -A SHA256=(
  [1.7.1]=8b75547faf8775bf6a1cf00f465790f873f2387eb39466f497dd6ad2f4bb673f
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
