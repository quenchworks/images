# STATUS: ZLIB-ONLY as of 2026-09-16. Measured, not assumed: run 35066570708
# on af0623d gated with exactly one finding, zlib CVE-2026-85091, on every
# version and both arches. Nothing else in this image is flagged.
#
# Wolfi is at 1.3.2.1_rc20260601-r0 and the advisory wants 1.3.3-r0, which
# upstream madler/zlib has never tagged. Downgrading to Wolfi's 1.3.1-r51
# is not a way out either: it predates the 1.3.2-r0 fix for CVE-2026-27171.
#
# BLOCKED=1 skips build+merge so sweeps stop burning a red run here. Clear
# it with scripts/blocked.py --dispatch once Wolfi ships zlib 1.3.3-r0.
# excalidraw: from-source via melange. The SPA is built with Node + yarn
# (yarn build:app:docker -> excalidraw-app/build), then served as static files by
# nginx (Wolfi package) in the runtime image.
#
# LATEST-ONLY (not the usual latest-3): excalidraw's toolchain is pinned per
# release to a different Node major (0.16.x builds on Node 18 but fails on 20;
# 0.18.x needs Node >=22 via transitive deps like chevrotain). No single Node
# builds all three lines, and a whiteboard SPA has no real need for old releases,
# so the catalog ships the current stable line only. Built on Node 22.
BLOCKED=1
FROM_SOURCE=1
VERSIONS=(0.18.1)
declare -A SHA256=(
  [0.18.1]=be44d1d10865ef0ab2474b59e1430eb12e55eb84a3663e7d11818b8ff6a5c93c
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
