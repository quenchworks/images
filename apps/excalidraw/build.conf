# excalidraw: from-source via melange. The SPA is built with Node + yarn
# (yarn build:app:docker -> excalidraw-app/build), then served as static files by
# nginx (Wolfi package) in the runtime image. Latest patch of the last 3 minor
# lines (0.16, 0.17, 0.18). Each release pins its source tarball by sha256.
FROM_SOURCE=1
VERSIONS=(0.16.4 0.17.6 0.18.1)
declare -A SHA256=(
  [0.16.4]=6eb3026f02b1e6962ad424f69eef8f7a20a1791cdd8687c74aae8d2f5a98402c
  [0.17.6]=b262a662c975ff911426d790067c36ba70ed4a53274ae8a465565cda7fe53f88
  [0.18.1]=be44d1d10865ef0ab2474b59e1430eb12e55eb84a3663e7d11818b8ff6a5c93c
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
