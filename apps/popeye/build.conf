# popeye (derailed/popeye, Apache-2.0): scans a live Kubernetes cluster and reports misconfigurations and resource issues with a score. Image only, no chart.
#
# From the release tags with the house Go floors and the otel 1.47 family loop (the cosign recipe). Version stamped like upstream goreleaser (-X cmd.version).
FROM_SOURCE=1
VERSIONS=(0.22.1)
declare -A SHA256=(
  [0.22.1]=f8eef3d6b9cda24f4d9bdc24620c1368cd6a749f1321a499e88b339258e01d92
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
