# STATUS 2026-08-27: shippable, NOT blocked (no BLOCKED flag, and none warranted).
# The nightly scan reported 3 HIGH / 3 fixable on the published 11.4.5 image
# (libcrypto3, libssl3, openssl 3.6.3-r4 -> 3.6.3-r5). All three were plain Wolfi apk
# drift: nothing in melange.yaml/apko.yaml pins openssl, the image simply had not been
# rebuilt since 2026-08-16. A plain local rebuild pulled openssl/libssl3/libcrypto3
# 3.6.4-r0 (already past the r5 Trivy asked for) and the gate reported "0 fixable CVEs"
# (wolfi 0, python-pkg 0, composer-vendor 0). Boot test passed: HTTP 302 on /, HTTP 200
# on /core/install.php, PHP 8.4.25, core VERSION 11.4.5, nonroot uid 1001 + read-only
# rootfs. The historical "drupal 11.2 unshippable (guzzle pin)" note is about the 11.2
# and 11.3 LINES, which are already excluded from VERSIONS below -- it never applied to
# the 11.4 line we ship. No recipe change was needed; this image just needs a rebuild +
# republish to clear the drift.
#
# drupal (drupal/drupal): the open-source CMS. Upstream ships an official release
# tarball (drupal-<VER>.tar.gz on ftp.drupal.org) that already vendors composer
# deps (vendor/) + core + the flat docroot (index.php at the tarball root). We do
# NOT run composer; we fetch the sha256-pinned tarball and assemble it under
# /opt/drupal, then front php-fpm with QuenchWorks' hardened nginx (quench-nginx,
# built FROM SOURCE in the same build -> apko pulls it as @local). Drupal core is
# GPL-2.0-or-later (verified in composer.json + core/LICENSE.txt), NOT AGPL.
#
# Latest patch of the current stable MINOR lines that reach 0-CVE. Drupal's supported
# branches are all 11.x (11.2, 11.3, 11.4), each on PHP 8.3/8.4 so the whole window
# builds on the Wolfi php-8.4 runtime.
#
# We ship ONLY 11.4. Both 11.2 and 11.3 are unfixable-within-constraint on guzzle
# (the Superset pattern): drupal/core-recommended HARD-pins guzzlehttp/guzzle to a
# narrow range that sits BELOW the CVE fix.
#   - 11.2: core-recommended 11.2.14 pins ~7.9.3 (>=7.9.3 <7.10); fix for
#     CVE-2026-55568/55767 (+ psr7 CVE-2026-55766) is guzzle 7.12.1 / psr7 2.12.1.
#   - 11.3: core-recommended 11.3.14 pins ~7.12.1 (>=7.12.1 <7.13); guzzle 7.12.3
#     carries GHSA-94pj-82f3-465w / f283-ghqc-fg79 / h95v-h523-3mw8 / wm3w-8rrp-j577
#     (4 MEDIUM), fixed only in 7.15.1 -- OUTSIDE the pin. No 11.3.x patch relaxes it,
#     so the whole 11.3 line is dropped (its already-published 11.3.13 image stays in
#     the registry; we just stop re-attempting a line that can no longer build green).
# 11.4's core-recommended does NOT pin guzzle (only drupal/core's ^7.10 applies), so
# 11.4.4's guzzle 7.14.2 -> 7.15.1 fixes GHSA-f283/h95v/wm3w within constraint via the
# scoped `composer update` step in melange.yaml. Re-add 11.2/11.3 if a later patch
# relaxes their guzzle pin. Per-version sha256 of the official tarball. FROM_SOURCE
# marks that the image compiles a dep (nginx) from src.
FROM_SOURCE=1
VERSIONS=(11.4.5)
declare -A SHA256=(
  [11.4.5]=c9444b40993332f4dd0e57968a20c6013ffcac384f3a3ea9f62e6a0bfddf24e6
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
