# drupal (drupal/drupal): the open-source CMS. Upstream ships an official release
# tarball (drupal-<VER>.tar.gz on ftp.drupal.org) that already vendors composer
# deps (vendor/) + core + the flat docroot (index.php at the tarball root). We do
# NOT run composer; we fetch the sha256-pinned tarball and assemble it under
# /opt/drupal, then front php-fpm with QuenchWorks' hardened nginx (quench-nginx,
# built FROM SOURCE in the same build -> apko pulls it as @local). Drupal core is
# GPL-2.0-or-later (verified in composer.json + core/LICENSE.txt), NOT AGPL.
#
# Latest patch of the last 3 stable MINOR lines. Drupal's supported branches are
# all 11.x right now (11.2, 11.3, 11.4); every one of them runs on PHP 8.3/8.4, so
# we build the whole window on the Wolfi php-8.4 runtime. Per-version sha256 of the
# official tarball. FROM_SOURCE marks that the image compiles a dep (nginx) from src.
FROM_SOURCE=1
VERSIONS=(11.2.14 11.3.13 11.4.0)
declare -A SHA256=(
  [11.2.14]=8a8cc8dd979bcb739cdf843fa4c4b9d0cddbf45b4a3b305a2778843464b7bf83
  [11.3.13]=8c2f1c835090368b7fcc83fc900d13ebd5ef41490d4b4d48dfa3673ca9a39f44
  [11.4.0]=257ca240db666e8456606abdda805fdf4cb1df79833412ae89864cf06a6a8c93
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
