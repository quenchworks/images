# Assembles the Drupal runtime image: the Drupal tree (quench-drupal@local, from the
# official release tarball) + QuenchWorks' hardened nginx (quench-nginx@local, built
# from source) + php-8.4 + FPM + the extension surface Drupal core needs, all
# supervised by supervisord. Minimal, nonroot (uid/gid 1001), multi-arch, read-only
# rootfs friendly. SBOM generated by apko.
#
# Ports:
#   8080/tcp  nginx  -- serves /opt/drupal, FastCGI-passes .php to php-fpm
#                       (nonroot can't bind <1024)
#   9000/tcp  php-fpm (loopback only; nginx -> 127.0.0.1:9000)
#
# Read-only rootfs: the only writable surfaces (emptyDir/tmpfs) are
#   * /tmp                      -- supervisord pid/sock, nginx pid + temp, php + Drupal temp
#   * /opt/drupal/sites/default -- settings.php + files/ (the chart mounts these writable;
#                                  a fresh install with no settings.php serves the installer)
# Everything else (core/, vendor/, /etc, the binaries) stays read-only.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - busybox
    - supervisor                 # the process supervisor (php-fpm + nginx)
    - quench-nginx@local          # QuenchWorks' hardened nginx (from source), NOT nginx.org/Alpine
    - quench-drupal@local         # the Drupal tree + nginx/php-fpm/supervisor wiring
    # PHP runtime + FPM + the extensions Drupal core requires/recommends. Each -config
    # sibling registers the extension .so in php.ini (without it the .so ships unloaded).
    - php-8.4
    - php-8.4-fpm
    - php-8.4-fpm-config
    - php-8.4-config
    - php-8.4-opcache
    - php-8.4-opcache-config
    - php-8.4-gd                  # image toolkit (Drupal core requirement)
    - php-8.4-gd-config
    - php-8.4-pdo
    - php-8.4-pdo-config
    - php-8.4-mysqlnd             # native driver pdo_mysql links against (mysqlnd_* symbols)
    - php-8.4-mysqlnd-config
    - php-8.4-pdo_mysql           # MySQL/MariaDB driver
    - php-8.4-pdo_mysql-config
    - php-8.4-pdo_pgsql           # PostgreSQL driver
    - php-8.4-pdo_pgsql-config
    - php-8.4-pgsql
    - php-8.4-pgsql-config
    - php-8.4-pdo_sqlite          # SQLite driver (Drupal core supports it)
    - php-8.4-pdo_sqlite-config
    - php-8.4-mbstring
    - php-8.4-mbstring-config
    - php-8.4-dom
    - php-8.4-dom-config
    - php-8.4-simplexml
    - php-8.4-simplexml-config
    - php-8.4-xml
    - php-8.4-xml-config
    - php-8.4-xmlreader
    - php-8.4-xmlreader-config
    - php-8.4-xmlwriter
    - php-8.4-xmlwriter-config
    - php-8.4-ctype
    - php-8.4-ctype-config
    - php-8.4-curl
    - php-8.4-curl-config
    - php-8.4-openssl
    - php-8.4-openssl-config
    - php-8.4-fileinfo
    - php-8.4-fileinfo-config
    - php-8.4-iconv
    - php-8.4-iconv-config
    - php-8.4-sodium
    - php-8.4-sodium-config
    - php-8.4-zip
    - php-8.4-zip-config

accounts:
  groups:
    - groupname: drupal
      gid: 1001
  users:
    - username: drupal
      uid: 1001
      gid: 1001
  run-as: 1001

# supervisord (PID 1) starts php-fpm then nginx. No shell wrapper: supervisord parses
# the program commands itself, so a shell-free rootfs would still work.
entrypoint:
  command: /usr/bin/supervisord -c /etc/drupal/supervisord.conf

work-dir: /opt/drupal

paths:
  # Drupal's writable assets dir (aggregated css/js, uploads) -- emptyDir/tmpfs.
  - path: /opt/drupal/sites/default/files
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o755
    recursive: true
  # /tmp holds supervisord pid/sock, nginx pid + temp dirs, php + Drupal install temp.
  - path: /tmp
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o1777

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-drupal"
  org.opencontainers.image.licenses: "GPL-2.0-or-later"
