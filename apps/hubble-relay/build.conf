  [1.18.17]=ab80749909289bd63b4061a0bc721d82fe65f5c3429a9676d315ce9fe06be080
  [1.19.11]=5442bfa5130487b95cb0cfee776a5299727c7c38ca860f0df8f6b185eec433fb
  [1.20.5]=2a299a5a5eeacc678812fcacc0165466324574b7989d2d1abc73f87f8921256e
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
