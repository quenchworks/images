# hubble-relay: Cilium's Hubble Relay, the cluster-wide aggregator of Hubble flow
# observability, built from source (./hubble-relay in the cilium/cilium tag tarball).
# Newest patch of the last 3 minor lines. Static Go binary, no CGO.
#
# 0-CVE: melange.yaml floats the modules below their floor and re-vendors (measured
# 2026-09-25: 1.20.2 grpc; 1.19.8 grpc + mongo-driver; 1.18.14 also cilium/ebpf,
# cel-go, gopacket). A local build of each line with the float scanned 0.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(1.18.14 1.19.8 1.20.2)
declare -A SHA256=(
  [1.18.14]=803a2363c56c8a5885d3621221cf9d963d8472b95c3be18e979a5ec395b09cd3
  [1.19.8]=7c997f9c15d348d5ea4abba67e229905055acc27235f542a5b608ea07088979c
  [1.20.2]=2d9dd9697bf59dc592053734ac0dffe63892fc3e1a4d1fd28e1f44a0c5a49916
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
