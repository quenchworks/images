# Koel from the release tarball on Wolfi php-8.5-fpm + nginx (nginx comes from the sibling
# quench-nginx package, installed by apko).
package:
  name: quench-koel
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Koel (music streaming) on Wolfi php-fpm + nginx"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - php-8.5
      - php-8.5-config
      - php-8.5-fpm
      - php-8.5-fpm-config
      - php-8.5-bcmath
      - php-8.5-bcmath-config
      - php-8.5-ctype
      - php-8.5-ctype-config
      - php-8.5-curl
      - php-8.5-curl-config
      - php-8.5-dom
      - php-8.5-dom-config
      - php-8.5-exif
      - php-8.5-exif-config
      - php-8.5-fileinfo
      - php-8.5-fileinfo-config
      - php-8.5-gd
      - php-8.5-gd-config
      - php-8.5-iconv
      - php-8.5-iconv-config
      - php-8.5-intl
      - php-8.5-intl-config
      - php-8.5-mbstring
      - php-8.5-mbstring-config
      - php-8.5-mysqlnd
      - php-8.5-mysqlnd-config
      - php-8.5-openssl
      - php-8.5-openssl-config
      - php-8.5-pdo
      - php-8.5-pdo-config
      - php-8.5-pdo_sqlite
      - php-8.5-pdo_sqlite-config
      - php-8.5-pdo_mysql
      - php-8.5-pdo_mysql-config
      - php-8.5-pdo_pgsql
      - php-8.5-pdo_pgsql-config
      - php-8.5-simplexml
      - php-8.5-simplexml-config
      - php-8.5-sodium
      - php-8.5-sodium-config
      - php-8.5-xml
      - php-8.5-xml-config
      - php-8.5-xmlreader
      - php-8.5-xmlreader-config
      - php-8.5-xmlwriter
      - php-8.5-xmlwriter-config
      - php-8.5-xsl
      - php-8.5-xsl-config
      - supervisor
      - busybox

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - composer
      - git
      - jq
      - php-8.5
      - php-8.5-config
      - php-8.5-bcmath
      - php-8.5-bcmath-config
      - php-8.5-ctype
      - php-8.5-ctype-config
      - php-8.5-curl
      - php-8.5-curl-config
      - php-8.5-dom
      - php-8.5-dom-config
      - php-8.5-exif
      - php-8.5-exif-config
      - php-8.5-fileinfo
      - php-8.5-fileinfo-config
      - php-8.5-gd
      - php-8.5-gd-config
      - php-8.5-iconv
      - php-8.5-iconv-config
      - php-8.5-intl
      - php-8.5-intl-config
      - php-8.5-mbstring
      - php-8.5-mbstring-config
      - php-8.5-mysqlnd
      - php-8.5-mysqlnd-config
      - php-8.5-openssl
      - php-8.5-openssl-config
      - php-8.5-pdo
      - php-8.5-pdo-config
      - php-8.5-pdo_sqlite
      - php-8.5-pdo_sqlite-config
      - php-8.5-pdo_mysql
      - php-8.5-pdo_mysql-config
      - php-8.5-pdo_pgsql
      - php-8.5-pdo_pgsql-config
      - php-8.5-simplexml
      - php-8.5-simplexml-config
      - php-8.5-sodium
      - php-8.5-sodium-config
      - php-8.5-xml
      - php-8.5-xml-config
      - php-8.5-xmlreader
      - php-8.5-xmlreader-config
      - php-8.5-xmlwriter
      - php-8.5-xmlwriter-config
      - php-8.5-xsl
      - php-8.5-xsl-config

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/koel/koel/releases/download/v${{package.version}}/koel-v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
      strip-components: 1

  - name: Raise laravel/framework and the vulnerable libraries; svg-sanitize to 1.0
    runs: |
      set -eu
      export HOME="$(mktemp -d)" COMPOSER_HOME="$(mktemp -d)"
      php -m | grep -qix tokenizer && php -m | grep -qix sqlite3
      grep -qx 'v${{package.version}}' .version
      # Koel only constructs Sanitizer and calls sanitize() (app/Services/Image/SvgSanitizer.php), both
      # unchanged in svg-sanitize 1.0, which fixes the 0.22 findings
      grep -q 'new Sanitizer\|Sanitizer \$sanitizer' app/Services/Image/SvgSanitizer.php
      sed -i 's|"enshrined/svg-sanitize": "^0.22.0"|"enshrined/svg-sanitize": "^1.0"|' composer.json
      # vcs repositories (a forked scout driver): clone over https with git, not the GitHub API or ssh
      jq '.repositories |= map(if .type == "vcs" then . + {"no-api": true} else . end)' composer.json > composer.json.new && mv composer.json.new composer.json
      composer config --global github-protocols https
      grep -q '"enshrined/svg-sanitize": "^1.0"' composer.json
      composer update --no-dev --no-interaction --no-progress --no-scripts --with-all-dependencies \
        enshrined/svg-sanitize laravel/framework league/commonmark phpseclib/phpseclib league/flysystem
      composer dump-autoload --no-dev --optimize --no-scripts
      for want in laravel/framework=13.40.0 league/commonmark=2.10.2 phpseclib/phpseclib=3.0.57 league/flysystem=3.35.3 \
                  enshrined/svg-sanitize=1.0.0 symfony/http-foundation=7.4.23 symfony/http-kernel=7.4.23 \
                  symfony/mime=7.4.22 symfony/routing=7.4.23; do
        p=${want%=*} min=${want#*=}
        have=$(jq -r --arg p "$p" '.packages[] | select(.name == $p) | .version' composer.lock | sed 's/^v//')
        [ -n "$have" ] || continue
        [ "$(printf '%s\n%s\n' "$min" "$have" | sort -V | head -1)" = "$min" ] || { echo "FATAL: $p $have below $min"; exit 1; }
      done
      APP_KEY=base64:$(head -c 32 /dev/urandom | base64) php artisan package:discover --ansi

  - name: Lay out /var/www/koel and the init script
    runs: |
      set -eu
      d="${{targets.destdir}}/var/www/koel"
      install -d "$d"
      cp -a .version api-docs app artisan bootstrap composer.json composer.lock config database public resources routes vendor "$d/"
      # storage/ lives on the volume (SQLite database, artwork, search indexes, logs); public/storage keeps
      # pointing at storage/app/public through it
      install -d "${{targets.destdir}}/usr/share/koel"
      cp -a storage "${{targets.destdir}}/usr/share/koel/storage-skel"
      ln -s /var/lib/koel/storage "$d/storage"
      test -L "$d/public/storage"
      install -d "${{targets.destdir}}/usr/libexec"
      cat > "${{targets.destdir}}/usr/libexec/koel-init" <<'SH'
      #!/bin/sh
      # seeds storage/ on the volume, migrates, creates the first admin from the environment (once), then
      # runs supervisord (php-fpm + nginx)
      set -eu
      [ -n "${APP_KEY:-}" ] || { echo "APP_KEY is not set: base64:<32 random bytes>, e.g. from openssl rand -base64 32" >&2; exit 1; }
      S=/var/lib/koel/storage
      mkdir -p "$S"
      [ -n "$(ls -A "$S")" ] || cp -r /usr/share/koel/storage-skel/. "$S/"
      mkdir -p "$S/framework/views" "$S/framework/cache/data" "$S/framework/sessions" "$S/logs" "$S/app/public" "$S/search-indexes"
      if [ "${DB_CONNECTION:-sqlite}" = sqlite ]; then
        f="${DB_DATABASE:-$S/database.sqlite}"
        [ -f "$f" ] || : > "$f"
      else
        i=0
        until php -r 'new PDO(sprintf("%s:host=%s;port=%s;dbname=%s", getenv("DB_CONNECTION") === "pgsql" ? "pgsql" : "mysql", getenv("DB_HOST"), getenv("DB_PORT") ?: (getenv("DB_CONNECTION") === "pgsql" ? "5432" : "3306"), getenv("DB_DATABASE")), getenv("DB_USERNAME"), getenv("DB_PASSWORD"));' 2>/dev/null; do
          i=$((i + 1)); [ "$i" -lt 60 ] || { echo "the database (DB_HOST) did not answer" >&2; exit 1; }
          sleep 2
        done
      fi
      cd /var/www/koel
      php artisan migrate --force
      php /usr/libexec/koel-admin.php
      php artisan view:clear >/dev/null
      exec /usr/bin/supervisord -c /etc/koel/supervisord.conf
      SH
      chmod 0755 "${{targets.destdir}}/usr/libexec/koel-init"
      # koel:init seeds a fixed default admin (admin@koel.dev) and writes .env; this makes the first admin
      # from ADMIN_EMAIL/ADMIN_PASSWORD instead, then seeds the data koel:init would, once
      cat > "${{targets.destdir}}/usr/libexec/koel-admin.php" <<'PHP'
      <?php
      require '/var/www/koel/vendor/autoload.php';
      $app = require '/var/www/koel/bootstrap/app.php';
      $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
      if (App\Models\User::query()->count() > 0) {
          exit(0);
      }
      $email = getenv('ADMIN_EMAIL');
      $password = getenv('ADMIN_PASSWORD');
      if (!$email || !$password) {
          fwrite(STDERR, "no users yet: set ADMIN_EMAIL and ADMIN_PASSWORD for the first admin\n");
          exit(1);
      }
      $user = $app->make(App\Repositories\UserRepository::class)->getOrCreateFirstAdmin();
      $user->email = $email;
      $user->name = getenv('ADMIN_NAME') ?: 'Admin';
      $user->password = $password;
      $user->save();
      Illuminate\Support\Facades\Artisan::call('db:seed', ['--force' => true, '--quiet' => true]);
      echo "first admin created: $email\n";
      PHP

  - name: nginx server block (FastCGI to php-fpm on :8080)
    runs: |
      set -eu
      d="${{targets.destdir}}"
      install -d "$d/etc/nginx/conf.d"
      cat > "$d/etc/nginx/conf.d/koel.conf" <<'NGINX'
      server {
          listen 8080 default_server;
          listen [::]:8080 default_server;
          server_name _;
          root /var/www/koel/public;
          index index.php;
          charset utf-8;
          client_max_body_size 50M;
          access_log off;

          location ~ /\. { return 403; }
          location / { try_files $uri /index.php$is_args$args; }
          location ~ \.php$ {
              try_files $uri =404;
              include        /etc/nginx/fastcgi_params;
              fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
              fastcgi_pass   127.0.0.1:9000;
          }
          location ~* \.(js|css|png|jpg|svg|ico|woff2?|ttf|eot|map)$ { expires 30d; access_log off; }
      }
      NGINX
  - name: php-fpm pool + php.ini (nonroot, read-only rootfs)
    runs: |
      set -eu
      d="${{targets.destdir}}"
      install -d "$d/etc/php/php-fpm.d" "$d/etc/php/conf.d"
      cat > "$d/etc/php/php-fpm.d/zzz-koel.conf" <<'FPM'
      [global]
      daemonize = no
      error_log = /proc/self/fd/2

      [www]
      listen = 127.0.0.1:9000
      catch_workers_output = yes
      decorate_workers_output = no
      ; APP_KEY, DB_*, MEDIA_PATH and the other settings come from the container environment
      clear_env = no
      pm = dynamic
      pm.max_children = 16
      pm.start_servers = 2
      pm.min_spare_servers = 1
      pm.max_spare_servers = 4
      FPM
      cat > "$d/etc/php/conf.d/zzz-koel.ini" <<'INI'
      expose_php = Off
      memory_limit = 256M
      upload_max_filesize = 50M
      post_max_size = 50M
      sys_temp_dir = /tmp
      upload_tmp_dir = /tmp
      session.save_path = /tmp
      display_errors = Off
      log_errors = On
      error_log = /proc/self/fd/2
      date.timezone = UTC
      opcache.enable = 1
      opcache.revalidate_freq = 60
      INI

  - name: supervisord (php-fpm + nginx)
    runs: |
      set -eu
      d="${{targets.destdir}}"
      install -d "$d/etc/koel" "$d/etc/supervisor.d"
      cat > "$d/etc/koel/supervisord.conf" <<'SUP'
      [supervisord]
      nodaemon=true
      logfile=/dev/stdout
      logfile_maxbytes=0
      pidfile=/tmp/supervisord.pid

      [unix_http_server]
      file=/tmp/supervisor.sock

      [supervisorctl]
      serverurl=unix:///tmp/supervisor.sock

      [rpcinterface:supervisor]
      supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

      [include]
      files = /etc/supervisor.d/*.conf
      SUP
      printf '%s\n' '[program:php-fpm]' 'command=/usr/bin/php-fpm --nodaemonize --fpm-config /etc/php/php-fpm.conf' \
        'autostart=true' 'autorestart=true' 'priority=10' 'stdout_logfile=/dev/stdout' 'stdout_logfile_maxbytes=0' \
        'stderr_logfile=/dev/stderr' 'stderr_logfile_maxbytes=0' > "$d/etc/supervisor.d/php-fpm.conf"
      printf '%s\n' '[program:nginx]' 'command=/usr/bin/nginx -g "daemon off;"' \
        'autostart=true' 'autorestart=true' 'priority=20' 'stdout_logfile=/dev/stdout' 'stdout_logfile_maxbytes=0' \
        'stderr_logfile=/dev/stderr' 'stderr_logfile_maxbytes=0' > "$d/etc/supervisor.d/nginx.conf"

test:
  pipeline:
    - runs: |
        set -eu
        test -f /var/www/koel/public/index.php
        test -L /var/www/koel/storage
        php -m | grep -qi pdo_sqlite
        php -m | grep -qi sqlite3
