# koel: Koel (koel/koel, MIT), a personal music streaming server with a web player, playlists, podcasts and a
# Subsonic-compatible API. Images issue #77.
#
# From the release tarball (built assets and vendor/ included): composer raises laravel/framework,
# league/commonmark, phpseclib, league/flysystem and the symfony http stack to their fixed releases, and
# enshrined/svg-sanitize from ^0.22 to ^1.0 (Koel only constructs Sanitizer and calls sanitize(), both
# unchanged in 1.0); the build asserts each floor. php-8.5-fpm and QuenchWorks' nginx under supervisor.
# storage/ links to /var/lib/koel/storage (the volume: SQLite database by default, artwork, search
# indexes). koel:init writes .env and seeds a fixed default admin, so /usr/libexec/koel-init migrates and
# /usr/libexec/koel-admin.php creates the first admin from ADMIN_EMAIL/ADMIN_PASSWORD and seeds once.
# Music is read from MEDIA_PATH=/music. ffmpeg is not included (no transcoding).
# LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(9.15.0)
declare -A SHA256=(
  [9.15.0]=e9dbce292f4ac8874f25d45355c0d7f0f9f605dd8aaab087f4d76d2f6eb85db1
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
