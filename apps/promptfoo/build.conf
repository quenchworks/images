# promptfoo: red teaming and evaluation for LLM apps (CLI plus a local web viewer). Image only, no chart.
# Built from the npm release tarball (sha256 checked against the registry's sha512 integrity, 2026-11-22) with its
# production dependencies installed on Wolfi Node 24 (engines: node >=22.22). Ship latest only: the CLI moves
# weekly and nothing pins an older line. Sized 2026-11-22: 607 npm packages, 0 fixable (comprehensive).
FROM_SOURCE=1
VERSIONS=(0.126.0)
declare -A SHA256=(
  [0.126.0]=2dac1d087ced6e44e753c666952bdb2df9b456688bdc5a8fbfe6c1acf4159272
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
