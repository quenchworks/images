# Builds the OpenTelemetry Collector "contrib" distribution (otelcol-contrib)
# from source onto Wolfi. Single static Go binary (CGO disabled), multi-arch.
# Output is a signed APK in Quenchworks' own repo. No upstream distro binaries.
#
# The OpenTelemetry Collector is a vendor-agnostic telemetry pipeline that
# receives, processes and exports traces, metrics and logs. There is no single
# upstream "collector" Go module to compile: the binary is ASSEMBLED by the
# OpenTelemetry Collector Builder (ocb / cmd/builder) from a manifest that lists
# every receiver/processor/exporter/extension/connector to include.
#
# DISTRIBUTION CHOICE -- we build the OFFICIAL "otelcol-contrib" distribution
# (the widely-used full-component build), using the EXACT manifest.yaml that
# upstream's opentelemetry-collector-releases repo uses to cut the official
# otelcol-contrib binaries for the v0.154.0 tag (vendored here verbatim as
# manifest.yaml; module github.com/open-telemetry/opentelemetry-collector-releases/contrib,
# version 0.154.0, build_tags "grpcnotrace"). This guarantees component parity
# with the upstream release while building 100% from source on Wolfi.
#
# BUILD METHOD -- ocb is the canonical, supported way to build a collector
# distribution; building the contrib repo's in-repo cmd/otelcontribcol is
# explicitly "testing only" and itself just shells out to ocb. ocb generates a
# Go module (main.go + go.mod) under ./_build wiring in all listed components,
# then runs `go build`. ocb resolves the component modules from the Go module
# proxy at build time (network); melange build pipelines have network (same as
# our traefik build which uses -mod=mod), so this is reproducible from the
# pinned, fully version-locked manifest. We pin ocb to the same version as the
# distribution (OTELCOL_BUILDER_VERSION 0.154.0 in the releases Makefile).
#
# VERSION STAMP -- ocb writes the dist.version (0.154.0) into the generated
# command's BuildInfo, so `otelcol-contrib --version` reports 0.154.0 without
# any manual ldflags (upstream's goreleaser only passes -s -w, which we match).
package:
  name: quench-otel-collector
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened OpenTelemetry Collector (contrib distribution; vendor-agnostic traces/metrics/logs pipeline), built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      # curl: fetch + sha256-verify the OBI source-generated tarball (see the OBI
      # prep step in the pipeline), mirroring upstream's scripts/prepare-obi.sh.
      - curl
      # ocb/components require go >= 1.24; upstream CI uses ~1.26. Use the current
      # go-1.26 toolchain to pick up the latest stdlib CVE fixes (helps clear the
      # Trivy gate without manual bumps).
      - go-1.26

pipeline:
  - runs: |
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      export GOTOOLCHAIN=local
      export GOPATH="${PWD}/.gopath"
      export GOBIN="${GOPATH}/bin"
      export PATH="${GOBIN}:${PATH}"

      # OBI (OpenTelemetry eBPF Instrumentation), new in 0.156.0's contrib
      # distribution: the manifest pulls go.opentelemetry.io/obi and pins it via a
      # `replace => ../../../internal/obi-src`. The published obi module ships
      # WITHOUT its pre-generated eBPF .go sources (they are gitignored/generated),
      # so building it straight from the module proxy would require the BPF
      # toolchain (clang/bpf2go). Upstream's release build instead runs
      # scripts/prepare-obi.sh to fetch the "source-generated" release tarball
      # (BPF sources pre-generated, no toolchain needed) and extract it into
      # internal/obi-src. We replicate that verbatim here. ocb generates its module
      # at ./_build, so the manifest's `../../../internal/obi-src` resolves to the
      # absolute path /internal/obi-src inside the build sandbox — extract there so
      # the vendored manifest can stay byte-for-byte identical to upstream's.
      OBI_VERSION=v0.10.0
      OBI_SHA256=151ef5d04bff9660743148ff20d5c833222b0b45ab15245a2968a3f7f4366dec
      OBI_TARBALL="obi-${OBI_VERSION}-source-generated.tar.gz"
      curl -fSL --retry 3 --retry-delay 1 -o "/tmp/${OBI_TARBALL}" \
        "https://github.com/open-telemetry/opentelemetry-ebpf-instrumentation/releases/download/${OBI_VERSION}/${OBI_TARBALL}"
      echo "${OBI_SHA256}  /tmp/${OBI_TARBALL}" | sha256sum -c -
      mkdir -p /internal/obi-src
      tar xzf "/tmp/${OBI_TARBALL}" --strip-components=1 -C /internal/obi-src

      # Install the OpenTelemetry Collector Builder (ocb) pinned to the exact
      # version used to cut the official otelcol-contrib 0.154.0 release.
      CGO_ENABLED=0 go install -trimpath -ldflags="-s -w" \
        go.opentelemetry.io/collector/cmd/builder@v${{package.version}}

      # Generate the distribution module from the vendored official manifest.
      # ocb's manifest sets output_path ./_build and build_tags grpcnotrace.
      # --skip-compilation stops ocb after it generates the module and resolves
      # its dependency graph (Generate + GetModules), leaving the go build to us so
      # we can float a transitive CVE before compiling. Select the EXACT official
      # contrib manifest vendored for this release.
      builder --config=manifest-${{package.version}}.yaml \
        --skip-strict-versioning \
        --skip-compilation

      # 0-CVE float: the generated distribution pulls golang.org/x/text v0.38.0
      # (CVE-2026-56852, infinite loop), fixed in v0.39.0. Bump it in the generated
      # module, then build the static binary ourselves, matching upstream's
      # goreleaser flags (-trimpath -ldflags "-s -w") and the manifest build tag
      # (grpcnotrace). ocb bakes dist.version into the generated code's BuildInfo,
      # so no version ldflag is needed.
      (
        cd _build
        go get golang.org/x/text@v0.39.0 golang.org/x/net@v0.56.0 golang.org/x/crypto@v0.53.0 golang.org/x/sys@v0.46.0 google.golang.org/grpc@v1.82.1
        go build -trimpath -tags grpcnotrace -ldflags "-s -w" -o otelcol-contrib .
      )

      install -Dm0755 ./_build/otelcol-contrib \
        "${{targets.destdir}}/usr/bin/otelcol-contrib"

test:
  pipeline:
    - runs: |
        otelcol-contrib --version
