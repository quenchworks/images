# otel-collector: from-source via melange (OpenTelemetry Collector Builder / ocb,
# pinned to the release version, building the contrib distribution). Latest 3
# stable minor lines, newest patch each. Each release vendors its EXACT official
# contrib manifest (manifest-<version>.yaml) -- the manifest's core modules mix
# v0.x and v1.x versions that differ per release, so they cannot be sed-rendered;
# the melange selects manifest-${{package.version}}.yaml.
FROM_SOURCE=1
VERSIONS=(0.152.1 0.153.0 0.154.0)
render() { echo "s/__VER__/$1/g"; }
