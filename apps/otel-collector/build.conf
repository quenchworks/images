# otel-collector: from-source via melange (OpenTelemetry Collector Builder / ocb,
# pinned to the release version, building the contrib distribution). newest-only:
# the older 0.153/0.154 manifests vendor dep versions below their CVE fixes and
# fail the comprehensive gate, so we ship only the newest line. Each release
# vendors its EXACT official contrib manifest (manifest-<version>.yaml) -- the
# manifest's core modules mix v0.x and v1.x versions that differ per release, so
# they cannot be sed-rendered; the melange selects manifest-${{package.version}}.yaml.
FROM_SOURCE=1
VERSIONS=(0.158.0)
render() { echo "s/__VER__/$1/g"; }
