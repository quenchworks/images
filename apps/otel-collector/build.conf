# otel-collector: from-source via melange (OpenTelemetry Collector Builder / ocb,
# pinned to the release version, building the contrib distribution). newest-only:
# the older 0.153/0.154 manifests vendor dep versions below their CVE fixes and
# fail the comprehensive gate, so we ship only the newest line. Each release
# vendors its EXACT official contrib manifest (manifest-<version>.yaml) -- the
# manifest's core modules mix v0.x and v1.x versions that differ per release, so
# they cannot be sed-rendered; the melange selects manifest-${{package.version}}.yaml.
FROM_SOURCE=1
VERSIONS=(0.162.0 0.163.1)
# OBI source-generated tarball per release: the version is the obi gomod in that
# release's manifest, the sha256 the entry in the OBI release's SHA256SUMS (both read
# 2026-10-19 and checked against a download).
declare -A OBI_VER=( [0.162.0]=v0.13.0 [0.163.1]=v0.15.2 )
declare -A OBI_SHA=(
  [0.162.0]=fd0066942e83328dee88c410f5fb455c49ea0ef61fda8979c1cd5f790c7c03a0
  [0.163.1]=d3cbec602e3ab7b357d2f4a57b29e502365f9098808418e8b4d96dec8fa9281f
)
render() { echo "s/__VER__/$1/g; s/__OBI_VER__/${OBI_VER[$1]}/g; s/__OBI_SHA__/${OBI_SHA[$1]}/g"; }
