# gitleaks: Gitleaks, the secret scanner for git history, directories and stdin, built
# from source on Wolfi (static Go, no cgo). Image only, no chart.
#
# Why not Wolfi's gitleaks apk: measured 2026-09-25, 8.30.1-r25 (the newest in the
# index) links x/crypto v0.52.0 and x/text v0.37.0, both below their fixes.
#
# NEWEST-ONLY: Gitleaks ships one supported line.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(8.30.1)
# sha256 of the GitHub tag tarball, computed from a download
declare -A SHA256=(
  [8.30.1]=e90fb266d75837e75894c778bf594ab8e2787f12dce5a62651f21b893eaf9abb
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
