# Builds Gitleaks from source onto Wolfi: static Go, no cgo, version stamped via -X
# like upstream's Makefile.
package:
  name: quench-gitleaks
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Gitleaks secret scanner, built from source on Wolfi"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
      - git

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/gitleaks/gitleaks/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      set -eu
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      export GO111MODULE=on
      export GOTOOLCHAIN=local
      # ---- 0-CVE module float (docs/go-module-float.md) ----------------------
      # Measured at 8.30.1 (Wolfi's r25 build): x/crypto and x/text are below their
      # fixes. The rest of the x/ set floats with them so the family stays coherent
      # (x/sync 0.22.0 is what the floated x/crypto, x/net and x/text require). The
      # archive scanners. rardecode/v2 (2.2.0) and xz (0.5.15) are below theirs too;
      # rardecode 2.2.0 changed an interface, so mholt/archives moves to v0.1.5, the
      # first release built against it.
      # gitleaks' go.mod declares no `replace` directives.
      FLOOR="golang.org/x/crypto@v0.56.0 golang.org/x/text@v0.41.0 golang.org/x/sys@v0.47.0 golang.org/x/net@v0.58.0 golang.org/x/sync@v0.22.0 github.com/nwaples/rardecode/v2@v2.2.0 github.com/ulikunitz/xz@v0.5.15 github.com/mholt/archives@v0.1.5"
      MODS="$(echo "$FLOOR" | tr ' ' '\n' | cut -d@ -f1)"
      # prints "<mod>@<floor> (<tag> has <ver>)" for every module below its floor
      below_floor() {
        awk -v floor="$FLOOR" -v tag="$1" '
          BEGIN { n = split(floor, f, " ")
                  for (i = 1; i <= n; i++) { split(f[i], kv, "@"); want[kv[1]] = kv[2] } }
          ($1 in want) {
            split(substr($2, 2), g, "."); split(substr(want[$1], 2), w, ".")
            for (i = 1; i <= 3; i++) {
              if ((g[i] + 0) > (w[i] + 0)) next
              if ((g[i] + 0) < (w[i] + 0)) { print $1 "@" want[$1] " (" tag " has " $2 ")"; next }
            }
          }'
      }
      # `go list -m` prints "<mod> <ver>" or "<mod> <ver> => <mod> <ver>", so $NF is
      # the EFFECTIVE version and a replace cannot hide behind the require line.
      go list -m -e $MODS
      need="$(go list -m -e $MODS | awk 'NF >= 2 && $NF ~ /^v[0-9]/ { print $1, $NF }' | below_floor go.mod | awk '{ print $1 }')"
      if [ -n "$need" ]; then go get $need; fi
      go mod tidy
      go build -trimpath \
        -ldflags "-s -w -X github.com/zricethezav/gitleaks/v8/version.Version=v${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/gitleaks" .
      # The float is only real if it reached the BINARY. Every `dep`/`=>` line of
      # `go version -m` must be at or above its floor -- the `=>` line is what
      # catches a replace-shadowed float. Fail the build rather than ship it.
      bad="$(go version -m "${{targets.destdir}}/usr/bin/gitleaks" \
        | awk '$1 == "dep" || $1 == "=>" { print $2, $3 }' | below_floor gitleaks)"
      [ -z "$bad" ] || { echo "❌ 0-CVE float did not reach gitleaks:"; echo "$bad"; exit 1; }
