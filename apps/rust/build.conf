# STATUS: ZLIB-ONLY as of 2026-09-16. Measured, not assumed: run 35066907941
# on af0623d gated with exactly one finding, zlib CVE-2026-85091, on every
# version and both arches. Nothing else in this image is flagged.
#
# Wolfi is at 1.3.2.1_rc20260601-r0 and the advisory wants 1.3.3-r0, which
# upstream madler/zlib has never tagged. Downgrading to Wolfi's 1.3.1-r51
# is not a way out either: it predates the 1.3.2-r0 fix for CVE-2026-27171.
#
# BLOCKED=1 skips build+merge so sweeps stop burning a red run here. Clear
# it with scripts/blocked.py --dispatch once Wolfi ships zlib 1.3.3-r0.
# rust: Wolfi's rust-<minor> toolchain. Published tag = FULL version;
# render maps __VER__ -> the minor. NEWEST-ONLY: the single newest stable line
# Wolfi ships (rust-1.97 == 1.97.1-r0, both arches). Rust has no LTS lines --
# it ships a new minor every 6 weeks and nobody pins an old one -- so this band
# ROLLS rather than accumulating: 2026-07-27 moved 1.96 -> 1.97 (same apk deps,
# still libLLVM-22 / libLLVM.so.22.1, so the melange repackage is unchanged).
#
# 2026-07-09 UNBLOCKED: Wolfi's monolithic rust apk bakes the stdlib SOURCE tree
# under usr/lib/rustlib/src/rust/library/**, whose vendored *dev-dependency*
# Cargo.lock files pin an old `rand` -> GHSA-cq8v-f236-94qc (4x LOW). Those
# lockfiles are only touched when recompiling std from source (-Z build-std);
# normal `cargo build` links the precompiled std and never reads them. melange.yaml
# now repackages Wolfi's rust apk MINUS usr/lib/rustlib/src/**, keeping the
# precompiled toolchain intact -> gate clears while cargo/rustc still build+run.
# FROM_SOURCE flips to a melange repackage; apko consumes quench-rust@local.
# Revert to the plain apko-only rust-<minor> assembly if Wolfi ever splits the
# source into its own droppable subpackage.
BLOCKED=1
FROM_SOURCE=1
VERSIONS=(1.97.1)
# render feeds BOTH apko.yaml and melange.yaml the same sed program:
#   __FULLVER__ -> rust X.Y.Z (image tag + melange package version)
#   __VER__     -> rust minor (e.g. 1.96), used in the rust-<minor> apk name
render() { local v="$1"; echo "s/__FULLVER__/${v}/g; s/__VER__/${v%.*}/g"; }
