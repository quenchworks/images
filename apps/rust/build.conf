# rust: apko-runtime from Wolfi's rust-<minor> toolchain. Published tag = FULL
# version Wolfi resolves; render maps __VER__ -> the minor. NEWEST-ONLY: the
# single newest stable line Wolfi ships (rust-1.96 == 1.96.1-r0).
#
# STATUS: BLOCKED (do not publish). The image assembles cleanly and 1.96.1 is the
# newest Rust minor Wolfi ships (no rust-1.97+, no newer 1.96 -rN), but the
# comprehensive Trivy gate still fails on 4 fixable LOW findings -- all the SAME
# advisory, GHSA-cq8v-f236-94qc ("rand is unsound with a custom logger using
# rand::rng()") -- in the vendored dev-dependency lockfiles of the Rust standard
# library SOURCE that the monolithic rust-1.96 package bakes into the image:
#   usr/lib/rustlib/src/rust/library/compiler-builtins/Cargo.lock  rand 0.10.0
#   usr/lib/rustlib/src/rust/library/portable-simd/Cargo.lock      rand 0.7.3
#   usr/lib/rustlib/src/rust/library/stdarch/Cargo.lock            rand 0.10.0, 0.8.5
#     (fixed upstream in rand 0.8.6 / 0.9.3 / 0.10.1)
# These are test-only dev-deps of std's own source tree (never compiled into user
