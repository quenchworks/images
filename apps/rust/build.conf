# cannot be dropped, and no patched rust apk advances those pinned lockfiles.
# Clearing it needs a newer Rust release (or a Wolfi rust rebuild) that bumps the
# stdlib dev-deps -- version/minor-patch only, no fork. Revisit when Wolfi ships
# rust-1.97 (or a rust-1.96 rebuild with refreshed source lockfiles); then flip
