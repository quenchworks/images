# apprise-api: Apprise API (caronc/apprise-api, MIT), an HTTP gateway to Apprise: notifications to 100+ services
# (email, Slack, Discord, Telegram, ntfy, Matrix, webhooks, ...) through one REST call, with stored configs per key
# and a web UI. Images issue #90.
#
# Upstream's own runtime (supervisord-startup, nginx.conf and nginx-strict.conf, gunicorn.conf.py, pruner loop) on
# Wolfi python-3.13 + QuenchWorks nginx + supervisor, using upstream's non-root startup path. Native Python deps come
# from Wolfi (cryptography on system OpenSSL, gevent, greenlet, cffi, pycares, aiodns, pyyaml); the rest is pip'ed
# into a venv with --system-site-packages. python-qpid-proton (amqps:// AMQP 1.0) is not included. LATEST-ONLY.
FROM_SOURCE=1
VERSIONS=(2.1.0 2.2.0)
declare -A SHA256=(
  [2.1.0]=72628ce6bf81e6f49df120ccef565ff28b5a0e3c1c679ff379eb1e1efbc668dc
  [2.2.0]=f8801ed999952e8b2a44317234c3fe6f4d0da530d533709306e2ffd2e6dba350
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
