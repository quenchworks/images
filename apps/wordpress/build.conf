# wordpress (WordPress core CMS): the upstream release tarball fetched from
# wordpress.org (wordpress-<VER>.tar.gz) and served by a hardened Wolfi PHP-FPM +
# nginx runtime. WordPress core is a fixed release of PHP files (plus bundled JS/PHP
# libs) — NO compilation, so FROM_SOURCE stays unset (like adminer). Latest patch of
# the last 3 minor lines (6.8, 6.9, 7.0). Tag format has NO 'v' prefix and the .0
# line ships as "7.0" (not "7.0.0"), matching the wordpress.org tarball name.
# Per-version sha256 of the official tarball.
VERSIONS=(6.8.5 6.9.4 7.0)
declare -A SHA256=(
  [6.8.5]=37f595510c48d16dede0bfa5afa29cb8af12dbf0e3d345b25c494c15f8c81d81
  [6.9.4]=db610ad9f549e0abb5af3e3d5c6729c58d874439654cdf0afea425b2ea895f35
  [7.0]=530c8fdeb16fb0affdb53eb727b6a04bb8d166621c20029e389cabb01a0fa921
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
