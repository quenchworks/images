# Assembles the WordPress runtime image: the WordPress core tree (quench-wordpress)
# plus a hardened Wolfi PHP-FPM (the app on 127.0.0.1:9000) + Wolfi nginx (:8080),
# both supervised by supervisord. Minimal, nonroot (uid/gid 1001), multi-arch,
# read-only-rootfs friendly. SBOM generated by apko.
#
# We do NOT inherit any upstream WordPress image (docker.io/wordpress) — the whole
# runtime is reconstructed from Wolfi packages (clean-room). The app tree, nginx site
# config, php-fpm pool + php.ini overrides, supervisord config and entrypoint all
# come from the quench-wordpress@local package.
#
# Ports:
#   8080/tcp  nginx — serves /var/www/html, FastCGI-passes .php to php-fpm
#                     (nonroot can't bind <1024)
#   9000/tcp  php-fpm (loopback only; nginx -> 127.0.0.1:9000)
#
# Read-only rootfs: the only writable surfaces (tmpfs/emptyDir-friendly) are
#   * /var/www/html/wp-content/uploads — user media uploads
#   * /tmp — supervisord pid/sock, nginx pid + temp paths, php session/upload scratch
# Everything else (WordPress core, /etc, the binaries) stays read-only. A DB
# (MySQL/MariaDB) and wp-config.php are wired by the chart; without them the image
# still serves the install/setup page (proving the PHP+nginx stack is healthy).
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - busybox                       # provides /bin/sh for the entrypoint script
    - ca-certificates-bundle
    - supervisor                    # process supervisor for php-fpm + nginx
    - nginx                         # Wolfi nginx (web tier)
    - quench-wordpress@local        # the WordPress core tree + runtime wiring
    # PHP 8.3 runtime + FPM. WordPress 6.8/6.9/7.0 all support PHP 8.3 (7.0 requires
    # >= 7.4); 8.3 is the newest line every shipped WP line is fully compatible with.
    - php-8.3
    - php-8.3-fpm
    - php-8.3-fpm-config
    - php-8.3-config
    - php-8.3-opcache
    - php-8.3-opcache-config
    # DB drivers — WordPress talks to MySQL/MariaDB via mysqli (mysqlnd backend).
    - php-8.3-mysqli
    - php-8.3-mysqli-config
    - php-8.3-mysqlnd
    - php-8.3-mysqlnd-config
    - php-8.3-pdo
    - php-8.3-pdo-config
    - php-8.3-pdo_mysql
    - php-8.3-pdo_mysql-config
    # Image handling (WordPress media library). gd covers resize/crop; imagick is
    # intentionally OMITTED — ImageMagick is a persistent CVE source and gd satisfies
    # WordPress core, keeping the 0-CVE posture intact.
    - php-8.3-gd
    - php-8.3-gd-config
    - php-8.3-exif
    - php-8.3-exif-config
    # Core/recommended extensions for WordPress + the common plugin surface.
    - php-8.3-mbstring
    - php-8.3-mbstring-config
    - php-8.3-curl
    - php-8.3-curl-config
    - php-8.3-openssl
    - php-8.3-openssl-config
    - php-8.3-sodium
    - php-8.3-sodium-config
    - php-8.3-xml
    - php-8.3-xml-config
    - php-8.3-xmlreader
    - php-8.3-xmlreader-config
    - php-8.3-xmlwriter
    - php-8.3-xmlwriter-config
    - php-8.3-simplexml
    - php-8.3-simplexml-config
    - php-8.3-dom
    - php-8.3-dom-config
    - php-8.3-zip
    - php-8.3-zip-config
    - php-8.3-intl
    - php-8.3-intl-config
    - php-8.3-iconv
    - php-8.3-iconv-config
    - php-8.3-fileinfo
    - php-8.3-fileinfo-config
    - php-8.3-bcmath
    - php-8.3-bcmath-config
    - php-8.3-ctype
    - php-8.3-ctype-config
    - php-8.3-gettext
    - php-8.3-gettext-config
    - php-8.3-gmp
    - php-8.3-gmp-config

accounts:
  groups:
    - groupname: wordpress
      gid: 1001
  users:
    - username: wordpress
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/bin/wordpress-entrypoint.sh

work-dir: /var/www/html

paths:
  # WordPress media uploads — the one writable app path (emptyDir/tmpfs at runtime).
  - path: /var/www/html/wp-content/uploads
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o755
    recursive: true
  # /tmp holds supervisord pid/sock, nginx pid + temp dirs, php session/upload scratch.
  - path: /tmp
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o1777

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-wordpress"
  org.opencontainers.image.licenses: "GPL-2.0-or-later"
