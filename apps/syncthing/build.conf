# Syncthing (syncthing/syncthing, MPL-2.0): continuous peer-to-peer file synchronisation with a web
# GUI and REST API. From the release tag via melange with upstream's build.go (CGO-free, as their
# Docker image, -no-upgrade), stamped with the release version. Two lines: 2.1 and 2.0.
FROM_SOURCE=1
VERSIONS=(2.0.16 2.1.7)
declare -A SHA256=(
  [2.1.7]=e9794cab0adf5b0a59d9b631e994dce055c57cb805228555bdfa68118be4bd0a
  [2.0.16]=30ab1917025de0d057ae53b3568e721bbea652b4b3d7bd96b04a6ef9bfb28bab
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
