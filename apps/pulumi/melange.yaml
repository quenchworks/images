# Builds the Pulumi IaC CLI from source onto Wolfi. Pulumi is a multi-module
# monorepo: the CLI is its own Go module (github.com/pulumi/pulumi/pkg/v3) living
# under pkg/, so the build cd's into pkg/ and builds ./cmd/pulumi (mirroring the
# upstream .goreleaser dir: pkg / main: ./cmd/pulumi). Single static Go binary, no
# CGO, with the upstream build tags (osusergo, grpcnotrace). The version is stamped
# via -X on .../sdk/v3/go/common/version.Version so `pulumi version` reports the
# real release. Output is a signed APK in Quenchworks' own repo. No upstream distro
# binaries. Image-only (CLI, no chart).
package:
  name: quench-pulumi
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Pulumi IaC CLI, built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/pulumi/pulumi/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      # The pulumi CLI is its own module under pkg/; build from inside it.
      cd pkg
      # 0-CVE gate: grpc GHSA-hrxh-6v49-42gf -> 1.82.1 (+ coherent otel + oauth2
      # 0.36.0 cascade). -mod=mod lets the build below resolve go.sum.
      # FLOOR, NOT A PIN (docs/go-module-float.md): the otel floor was raised
      # 1.43.0 -> 1.44.0 because every version in the window (3.253.0 / 3.254.0 /
      # 3.255.0) already REQUIRES otel v1.44.0 in pkg/go.mod -- the old @v1.43.0 line
      # had inverted into a downgrade. grpc is still below the floor on 3.253.0
      # (v1.82.0); oauth2@v0.36.0 is exactly what upstream requires (no-op).
      go get google.golang.org/grpc@v1.82.1 golang.org/x/oauth2@v0.36.0 \
        go.opentelemetry.io/otel@v1.44.0 go.opentelemetry.io/otel/trace@v1.44.0 \
        go.opentelemetry.io/otel/metric@v1.44.0 go.opentelemetry.io/otel/sdk@v1.44.0
      # go-git/v6 CVE-2026-71556 (HIGH) + CVE-2026-71557: alpha.4 -> alpha.5.
      # Prerelease-to-prerelease inside the same major, and alpha.5 is the only
      # published fix for the v6 line (the v5 line's fix is 5.19.2, a different
      # module path). Same advisory pair that trivy hit on v5.
      go get github.com/go-git/go-git/v6@v6.0.0-alpha.5
      go build -trimpath -tags "osusergo grpcnotrace" \
        -ldflags "-s -w -X github.com/pulumi/pulumi/sdk/v3/go/common/version.Version=v${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/pulumi" ./cmd/pulumi
