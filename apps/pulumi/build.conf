# pulumi (Pulumi IaC CLI): from-source via melange (Go build from the git tag tarball).
# Image-only (a CLI tool, no chart). Latest patch of the last 3 minor lines
# (3.253, 3.254, 3.255) -- the window is exactly 3, since the build workflow's prep
# job slices VERSIONS to the last 3. Pulumi is a multi-module monorepo: the CLI is its own Go
# module (github.com/pulumi/pulumi/pkg/v3) under pkg/, so the build runs from
# inside pkg/ against ./cmd/pulumi. Single static Go binary, CGO disabled. Version
# is stamped via -X on github.com/pulumi/pulumi/sdk/v3/go/common/version.Version.
FROM_SOURCE=1
VERSIONS=(3.253.0 3.254.0 3.255.0)
declare -A SHA256=(
  [3.253.0]=6bffd86f18ebeefbba91ca747822b1b8eb418f8c85e800fce0535d9e1b2310f0
  [3.254.0]=dfec607f9030b48a405ba847820a786ebbef615526ca646e27d44b33be2757df
  [3.255.0]=c0ed8c10910d73d484547ab5146b12de3f607d84b63414f7d51bed1017497a8b
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
