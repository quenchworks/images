# pulumi (Pulumi IaC CLI): from-source via melange (Go build from the git tag tarball).
# Image-only (a CLI tool, no chart). Latest patch of the last 3 minor lines
# (3.261, 3.262, 3.263) -- the window is exactly 3, since the build workflow's prep
# job slices VERSIONS to the last 3. Pulumi is a multi-module monorepo: the CLI is its own Go
# module (github.com/pulumi/pulumi/pkg/v3) under pkg/, so the build runs from
# inside pkg/ against ./cmd/pulumi. Single static Go binary, CGO disabled. Version
# is stamped via -X on github.com/pulumi/pulumi/sdk/v3/go/common/version.Version.
FROM_SOURCE=1
VERSIONS=(3.268.0 3.270.0 3.271.0 3.273.0 3.274.1)
declare -A SHA256=(
  [3.268.0]=74d2bffd51164b39bbafbbbc68b225a4ea5aa14acc89c7f0fe4e67ae90d0abb2
  [3.270.0]=0b6c6d601e655386b8a46a99301a51b599dec38f0c95922413ef32266d5b2035
  [3.271.0]=77dcdfe1238c8f336bda5ac51d3f39dce688019888b5d23e72662e88cf3f20b1
  [3.273.0]=8e99a3282a1627e86fdc1d95d7a1ec79460413a6f157d59f9d5dfd01554efcbc
  [3.274.1]=e251a1a68f4733894e48c6c53349daa9aeaa4d4a980f49045ded7b3cf90d627d
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
