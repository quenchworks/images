# artex: ARTEX (BaaRai/ARTEX, AGPL-3.0), an AI autonomous penetration-testing orchestrator: a Go backend with an
# embedded Next.js static UI that plans and drives recon/scanning tools behind a web console. Images issue #124.
#
# PROVENANCE: built from the BaaRai/ARTEX fork. The named upstream Autumn-27/ARTEX is 404 (removed/private); the
# Autumn-27 account and the original Autumn-27/norma dependency (Apache-2.0) still exist, and go.mod replaces norma
# with BaaRai/Norma. So this is a fork, not a canonical upstream. Offensive-security tool, for authorized testing.
#
# From the release tag as upstream's Dockerfile builds it: the Next.js UI is statically exported and embedded into
# the Go binary (go:embed, -tags embedui), then go build (go 1.26, CGO off). Needs PostgreSQL (ARTEX_PG_DSN; schema
# auto-creates). HTTP on 8787. nuclei is bundled from Wolfi; the other recon tools are operator-supplied on PATH.
# The agent executes shell commands, so bash is in the image; containment is the hardened container (read-only
# rootfs, nonroot, dropped caps), not ARTEX's own root-to-uid drop (off here: a nonroot process cannot setuid).
# LATEST-ONLY: one release line.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(0.7.0)
declare -A SHA256=(
  [0.7.0]=2f92d0c6ed438c2610d92840084a25c406972cd50215f0069ea9487a3a5f0605
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
