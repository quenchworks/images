# ARTEX from the release tag into /opt/artex, built like upstream's Dockerfile.
package:
  name: quench-artex
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened ARTEX AI pentest orchestrator, built from source on Wolfi"
  copyright:
    - license: AGPL-3.0-or-later
  dependencies:
    runtime:
      - bash                 # the agent executes shell commands via bash
      - busybox              # /bin/sh and core utilities for the agent's tool execution
      - ca-certificates-bundle
      - nuclei               # the one recon tool bundled from Wolfi (maintained, CVE-gated); others operator-supplied
      - tzdata

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - go-1.26
      - nodejs-24
      - npm

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/BaaRai/ARTEX/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - runs: |
      set -eu
      export HOME="$(mktemp -d)" NEXT_TELEMETRY_DISABLED=1 CI=true
      # 1) static-export the Next.js UI (output: "export" -> web/out), as upstream's Dockerfile does
      ( cd web && npm ci --no-fund --no-audit --ignore-scripts && npm run build:static )
      test -f web/out/index.html
      # the Go binary embeds it (go:embed all:webui/dist, -tags embedui)
      rm -rf server/webui/dist && mkdir -p server/webui/dist
      cp -a web/out/. server/webui/dist/
      # 2) the single static binary with the embedded UI
      export CGO_ENABLED=0 GOFLAGS=-trimpath GOTOOLCHAIN=local
      go build -tags embedui -ldflags "-s -w -buildid= -X main.version=${{package.version}}" -o /opt/artex/artex ./cmd/artex
      # no --version flag: the stamp is read from the build info
      go version -m /opt/artex/artex | grep -q "main.version=${{package.version}}" || { go version -m /opt/artex/artex; echo "version not stamped"; exit 1; }
      # 3) skills (one per subdir, each a SKILL.md) ship beside the binary (default skill_dir)
      install -d "${{targets.destdir}}/opt/artex"
      cp -a /opt/artex/artex "${{targets.destdir}}/opt/artex/artex"
      cp -a skills "${{targets.destdir}}/opt/artex/skills"

test:
  pipeline:
    - runs: test -x /opt/artex/artex
