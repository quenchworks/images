# NetBird reverse proxy, built from source on Wolfi: the reverse proxy that exposes services behind NetBird peers.
# License: BSD-3-Clause (the client, proxy and upload server are BSD-3-Clause).
package:
  name: quench-netbird-reverse-proxy
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened NetBird reverse proxy, built from source on Wolfi"
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go
      - patch

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/netbirdio/netbird/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      set -eu
      export CGO_ENABLED=0 GOFLAGS=-mod=mod GOTOOLCHAIN=local
      # Go module floors, raise only (go get is exact; memory go-get-is-exact-not-a-floor). Shared go.mod,
      # so every NetBird image takes the same set. Measured on v0.83.1 (gate 2026-11-17).
      floor() {
        have=$(go list -m -f '{{.Version}}' "$1" 2>/dev/null || true)
        [ -n "$have" ] || return 0
        [ "$(printf '%s\n%s\n' "${have#v}" "${2#v}" | sort -V | head -1)" = "${2#v}" ] && return 0
        go get "$1@$2"
      }
      floor golang.org/x/net v0.62.0
      floor golang.org/x/crypto v0.58.1-0.20261009181718-2f1f834330b2
      floor google.golang.org/grpc v1.83.2
      floor github.com/Azure/go-ntlmssp v0.1.1
      floor github.com/go-jose/go-jose/v4 v4.1.6
      floor github.com/moby/sys/user v0.4.1
      floor github.com/cilium/ebpf v0.22.0
      floor github.com/gopacket/gopacket v1.7.2
      floor github.com/crowdsecurity/crowdsec v1.7.8
      # docker/docker CVE-2026-33997 comes in through testcontainers, linked into management: v0.45 uses the moby client
      for m in testcontainers-go testcontainers-go/modules/postgres testcontainers-go/modules/redis testcontainers-go/modules/mysql; do
        floor "github.com/testcontainers/$m" v0.45.0
      done
      # dtls 3.1.4 (CVE-2026-26014, CVE-2026-54908) builds beside transport v3; stun stays on 3.1.0
      # (3.1.5 exposes transport v4 types to NetBird) with the fix backported below.
      floor github.com/pion/dtls/v3 v3.1.4
      floor github.com/aws/aws-sdk-go-v2/aws/protocol/eventstream v1.7.8
      floor github.com/aws/aws-sdk-go-v2/service/s3 v1.97.3
      # CVE-2026-128085 (otel 1.47.0): every otel v1 module moves together (memory otel-is-many-modules)
      otel=$(go list -mod=mod -m -e -f '{{.Path}} {{.Version}}' all | awk '$1 ~ /^go\.opentelemetry\.io\/otel(\/|$)/ && $2 ~ /^v1\./ && $1 !~ /\/exporters\/(jaeger|prometheus)$/ { print $1"@v1.47.0" }')
      [ -z "$otel" ] || go get $otel
      go mod tidy
      # CVE-2026-54909 (stun <= 3.1.4: panic on a short XOR-MAPPED-ADDRESS): pion/stun fa9f074 backported
      # to the vendored v3.1.0. Vendoring keeps the module version in the binary, so the scanner still
      # reports it and vex.openvex.json carries the evidence.
      go mod vendor
      grep -qx '# github.com/pion/stun/v3 v3.1.0' vendor/modules.txt
      patch -p1 -d vendor/github.com/pion/stun/v3 < stun-v3.1.0-xoraddr.patch
      grep -B3 'family := bin.Uint16(value\[0:2\])' vendor/github.com/pion/stun/v3/xoraddr.go | grep -q 'len(value) <= 4'
      export GOFLAGS=-mod=vendor
      go build -trimpath -ldflags "-s -w -X main.Version=${{package.version}}" -o "${{targets.destdir}}/usr/bin/netbird-proxy" ./proxy/cmd/proxy
      # the floors must reach the shipped binary
      g=$(go version -m "${{targets.destdir}}/usr/bin/netbird-proxy" | awk '$1=="dep" && $2=="google.golang.org/grpc"{print $3}')
      [ -z "$g" ] || echo "$g" | grep -qvE '^v1\.([0-7][0-9]|8[0-2])\.' || { echo "grpc below 1.83 in netbird-proxy: $g"; exit 1; }
