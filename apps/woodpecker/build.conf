# Woodpecker CI (woodpecker-ci/woodpecker): from-source via melange. Image-only
# (a CI engine, no chart). Latest patch of the last ~2 minor lines
# (3.15 -> 3.15.0, 3.16 -> 3.16.0; upstream ships one patch per minor so far).
# Go backend that go:embeds a Vite/Vue 3 web UI, so the frontend is (re)built with
# pnpm+Node in the build sandbox first (see melange.yaml). The version is stamped
# via -X on go.woodpecker-ci.org/woodpecker/v3/version.Version (upstream tags carry
# a "v" prefix; the stamped version is the bare X.Y.Z).
FROM_SOURCE=1
VERSIONS=(3.16.0)
declare -A SHA256=(
  [3.16.0]=54b61191cc87c2b8a74bbad05e2f259eb5576bd09a75c794de8b86741ba42b23
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
