# GoAccess runtime: goaccess is the entrypoint; feed it a log file, write -o report.html/json, or --real-time-html on 7890.
# Nonroot 1001, so listen on ports above 1023 unless the pod grants NET_BIND_SERVICE.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-goaccess@local

accounts:
  groups:
    - groupname: goaccess
      gid: 1001
  users:
    - username: goaccess
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/bin/goaccess

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-goaccess"
  org.opencontainers.image.licenses: "MIT"
  org.opencontainers.image.version: "__VER__"
