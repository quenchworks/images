# GoAccess (allinurl/goaccess, MIT): a real-time web log analyzer. It parses nginx, Apache,
# Caddy and other access logs and serves a live HTML dashboard over WebSocket, or writes static
# HTML/JSON/CSV reports. From the upstream release tarball (configure pre-generated) via melange,
# built with UTF-8 and OpenSSL. LATEST-ONLY: upstream patches only the newest release.
FROM_SOURCE=1
VERSIONS=(1.12)
declare -A SHA256=(
  [1.12]=3aef5f6d5061decc6fc4946339b3a61b170bd256f80b4e861194b095df83ec86
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
