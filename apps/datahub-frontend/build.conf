# datahub-frontend: DataHub's frontend (Apache-2.0), the Play server for the React UI,
# login (JAAS user.props, OIDC) and the GraphQL proxy to GMS. Image-and-chart
# (quench/datahub).
#
# FROM_SOURCE=0: DataHub publishes the frontend only inside its Docker images (GitHub
# releases carry no server artifacts), and the Gradle + yarn build of the platform is not
# feasible on a CI runner. The recipe pulls upstream's per-arch image BY DIGEST (crane
# refuses any other content), asserts the app jar's version, and repackages lib/ and
# conf/ on Wolfi openjdk-25-jre.
#
# No default login: upstream's conf/user.props holds datahub:datahub; ours is empty, so
# the chart (or a mount at /datahub-frontend/conf/user.props) must provide the admin
# credential.
#
# 0-CVE: the stock v1.7.0.1 lib/ scans 58 fixable findings (1 CRITICAL), all in jars:
# melange.yaml swaps three library families and rebuilds the jackson copies that hazelcast
# and auth-api.jar bundle (Shade.java, see the recipe).
#
# NEWEST-ONLY: DataHub ships one supported line.
#   __DIG_AMD__ / __DIG_ARM__ = per-arch manifest digest of acryldata/datahub-frontend-react:v<VER>
BLOCKED=0
FROM_SOURCE=0
VERSIONS=(1.7.0.1)
declare -A DIG_AMD=(
  [1.7.0.1]=sha256:186fb18b1db9a23cb3058cec1e0cada9bfa2f2bc810faf2a7d1185acf666a349
)
declare -A DIG_ARM=(
  [1.7.0.1]=sha256:cd5e145eb73730085edfccfe9daf80242924bb1d77490e5e62bd60131a4c3a4c
)
render() {
  echo "s/__VER__/$1/g; s|__DIG_AMD__|${DIG_AMD[$1]}|g; s|__DIG_ARM__|${DIG_ARM[$1]}|g"
}
