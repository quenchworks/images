# Assembles the DataHub frontend image: nonroot uid 1001, multi-arch, SBOM by apko. It
# serves the UI on 9002 (/admin answers 200 once up). Configure it with DATAHUB_GMS_HOST,
# DATAHUB_GMS_PORT, DATAHUB_SECRET, DATAHUB_SYSTEM_CLIENT_SECRET and the rest of upstream's
# environment; the admin login goes in /datahub-frontend/conf/user.props (shipped empty).
# Extra JVM flags go in JDK_JAVA_OPTIONS. Logs also go to /tmp: mount /tmp writable.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-datahub-frontend@local

accounts:
  groups:
    - groupname: nonroot
      gid: 1001
  users:
    - username: nonroot
      uid: 1001
      gid: 1001
      homedir: /home/nonroot
  run-as: 1001

environment:
  JAVA_HOME: /usr/lib/jvm/java-25-openjdk
  HOME: /home/nonroot
  LANG: C.UTF-8
  DATAHUB_APP_VERSION: v__VER__
  MFE_CONFIG_FILE_PATH: /datahub-frontend/conf/mfe.config.dev.yaml

paths:
  - path: /home/nonroot
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o755

# upstream runs from /: the MFE config loader resolves its absolute path against the
# working directory, so anything else breaks it
work-dir: /

# openjdk-25-jre has no /usr/bin/java symlink, so the path is the JDK's own.
entrypoint:
  command: /usr/lib/jvm/java-25-openjdk/bin/java @/datahub-frontend/java.args

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-datahub-frontend"
  org.opencontainers.image.licenses: "Apache-2.0"
