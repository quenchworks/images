# uptime-kuma: Uptime Kuma, the self-hosted uptime monitor and status-page server, from
# the release source (server) and the release's prebuilt dist.tar.gz (the Vue UI, the
# same artifact upstream's `npm run download-dist` fetches) on Node 24 (Wolfi).
#
# 0-CVE: a stock 2.5.5 `npm ci --omit dev` carries 61 findings. melange.yaml pins 14
# packages (direct deps in dependencies, transitive ones in overrides) and a local
# install plus trivy fs measured 0. Two cross a major: tar 6 -> 7 (build-time only:
# download-dist and sqlite3's install tooling; download-dist was run on 7) and
# nodemailer 7 -> 9 (SMTP notifications and monitors; createTransport + sendMail
# checked on 9).
#
# NEWEST-ONLY: Uptime Kuma ships one supported line.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(2.5.6)
# sha256 of the GitHub tag tarball and of the release dist.tar.gz, from downloads
declare -A SHA256=(
  [2.5.6]=a7b5f425f6b8b7e541e79f6ff71642af45f25bd3f5d97574441a2b9b6c78e408
)
declare -A DIST_SHA256=(
  [2.5.6]=68f6b9897857a23765aec11306a9c21f808030e4e8a13ae7ebc6734ee9eac428
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g; s|__DIST_SHA256__|${DIST_SHA256[$1]}|g"; }
