# floci: a LocalStack-compatible AWS cloud emulator (Quarkus app). Upstream ships
# NO prebuilt release jar/binary and NO Maven Central artifact -- the only
# distribution is a container image built from source. So we build the Quarkus
# fast-jar from source (mvn package -DskipTests) on a Wolfi JDK, then run the
# arch-independent quarkus-run.jar on a hardened Wolfi openjdk-25-jre (the CVE
# surface the Trivy gate scans). The fast-jar is noarch; the arch comes entirely
# from the JRE, so one sha256 per version (NOT per-arch) -- same as the jenkins
# JVM pattern.
#
# Floci maintains a single fast-moving release line (1.5.x, ~2-3 patches/week).
# We ship the newest 3 patch releases. Source tarball = GitHub archive-by-tag
# (tags have NO leading `v`). maven.compiler.release=25 -> the bytecode targets
# Java 25, so build AND run on JDK/JRE 25.
#
# Hardened scope: only the in-process services (S3, DynamoDB, SQS, SNS, IAM) run
# nonroot with no Docker socket. The Docker-backed services (Lambda, RDS, ECS,
# EKS, ...) need the host docker.sock + root and are OUT of scope for this image;
# the chart documents that limitation. Server app: image + chart.
FROM_SOURCE=1
VERSIONS=(1.5.27 1.5.28 1.5.29)
declare -A SHA256=(
  [1.5.27]=e917ea73120f416e0dae1f70277386e248e46a210eebc847c3ad8d6f57f25009
  [1.5.28]=c0d0a9607a924fcd824768abf6c54f56c313697950da9c299dac7d71c0180210
  [1.5.29]=8b1f1369a8655ae4a64dd3d6ccb333f33bef6cbbceaee5d1c37d747692e11f8c
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
