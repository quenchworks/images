#        in the Quarkus fast-jar under lib/main/) -- transitive dep.
#   CVE: CVE-2026-54515 (MEDIUM, status=fixed) -- ignored properties can be
#        unexpectedly modified. Fixed in 2.21.5 (same-major patch), 2.22.1, 3.1.4.
#   why: the 0-CVE gate (--exit-code 1 --ignore-unfixed, all severities) fails on
#        any fixable CVE, so this MEDIUM alone blocks publish. The fix is a
#        SAME-MAJOR, in-policy pin (2.21.4 -> 2.21.5) and unlike wire is trivial /
#        low-risk -- but it was NOT applied here: this task scope only bumped the
