  [1.5.29]=8b1f1369a8655ae4a64dd3d6ccb333f33bef6cbbceaee5d1c37d747692e11f8c
  [1.5.30]=43f72cae38d71429efa9be37f4a6d00c74f6112a758b9ca66d20c244aefd6da3
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
