# Builds Floci (a LocalStack-compatible AWS cloud emulator) from source into a
# Quarkus fast-jar, then the apko image runs it on a hardened Wolfi
# openjdk-25-jre. Floci publishes no release jar/binary and no Maven Central
# artifact, so we compile from the GitHub source tag with the Wolfi JDK 25 +
# maven-3.9 (maven.compiler.release=25 upstream). `mvn package -DskipTests`
# emits target/quarkus-app/ (the fast-jar layout: quarkus-run.jar + lib/ + app/
# + quarkus/), which we install verbatim under /usr/share/floci. The tree is
# architecture-independent -- the arch comes from the JRE base in apko.
package:
  name: quench-floci
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Floci AWS cloud emulator (Quarkus fast-jar), packaged on Wolfi"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - openjdk-25-jre        # the JRE Floci runs on (the scanned CVE surface; bytecode targets Java 25)
      - ca-certificates-bundle
      - busybox

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - openjdk-25          # full JDK to compile the Quarkus app
      - openjdk-25-default-jvm
      - maven-3.9
      - git                 # quarkus git-info build step reads the checkout metadata
      - python-3.13         # build-env only (not in the apko runtime) — runs the jackson CVE pin patch below

pipeline:
  - uses: fetch
    with:
      # Tags have NO leading `v`; the archive tarball is arch-independent.
      uri: https://github.com/floci-io/floci/archive/refs/tags/${{package.version}}.tar.gz
      expected-sha256: "__SHA256__"
  - runs: |
      set -eux
      export JAVA_HOME=/usr/lib/jvm/java-25-openjdk
      export PATH="${JAVA_HOME}/bin:${PATH}"
      # Local, hermetic maven repo inside the build workspace (no global writes).
      export MAVEN_OPTS="-Dmaven.repo.local=$(pwd)/.m2repo -Duser.home=$(pwd)"
      # --- QuenchWorks CVE pin: jackson-databind -> 2.21.5 -------------------
      # The Quarkus fast-jar bundles com.fasterxml.jackson.core:jackson-databind,
      # flagged CVE-2026-54515 (MEDIUM, fixed in 2.21.5 — a same-major, in-policy
      # patch). floci's root pom declares a <jackson.version> property that feeds
      # a jackson-bom import declared BEFORE the quarkus-bom import, so bumping
      # that property makes jackson-bom win and manages every jackson artifact
      # (incl. jackson-databind) to 2.21.5. For any version whose pom lacks the
      # property we also inject a first-declared jackson-databind pin (first
      # declaration wins over BOM-imported management). If neither lands 2.21.5
      # the 0-CVE gate below still blocks — the gate is never weakened.
      PY="$(command -v python3 || command -v python3.13)"
      "$PY" - pom.xml <<'PYEOF'
      import re, sys
      path = sys.argv[1]
      src = open(path, encoding="utf-8").read()
      # 1) Bump the jackson.version property (jackson-bom import feeds off it).
      src, n = re.subn(r'(<jackson\.version>)[^<]*(</jackson\.version>)',
                       r'\g<1>2.21.5\g<2>', src)
      # 2) Robustness: force jackson-databind as the first-declared managed dep.
      pin = ('\n            <dependency>\n'
             '                <!-- QuenchWorks CVE-2026-54515 pin: first-declared wins over imported BOMs -->\n'
             '                <groupId>com.fasterxml.jackson.core</groupId>\n'
             '                <artifactId>jackson-databind</artifactId>\n'
             '                <version>2.21.5</version>\n'
             '            </dependency>\n'
             '            <dependency>\n'
             '                <!-- QuenchWorks July-2026 netty CVE wave: first-declared netty-bom import\n'
             '                     wins over quarkus-bom; covers netty-codec/-haproxy/-http/-http2 etc. -->\n'
             '                <groupId>io.netty</groupId>\n'
             '                <artifactId>netty-bom</artifactId>\n'
             '                <version>4.1.137.Final</version>\n'
             '                <type>pom</type>\n'
             '                <scope>import</scope>\n'
             '            </dependency>\n'
             '            <dependency>\n'
             '                <!-- QuenchWorks httpcomponents5 pins: httpclient5 5.5.1 and httpcore5 /\n'
             '                     httpcore5-h2 5.3.6 are flagged. The 5.3 core line has NO fix, so the\n'
             '                     core pair must move to 5.4.3. Safe here: floci is an AWS emulator and\n'
             '                     does not embed the OpenSearch client whose gzip handling the 5.6.x\n'
             '                     httpclient broke in graylog. -->\n'
             '                <groupId>org.apache.httpcomponents.client5</groupId>\n'
             '                <artifactId>httpclient5</artifactId>\n'
             '                <version>5.6.3</version>\n'
             '            </dependency>\n'
             '            <dependency>\n'
             '                <groupId>org.apache.httpcomponents.core5</groupId>\n'
             '                <artifactId>httpcore5</artifactId>\n'
             '                <version>5.4.3</version>\n'
             '            </dependency>\n'
             '            <dependency>\n'
             '                <groupId>org.apache.httpcomponents.core5</groupId>\n'
             '                <artifactId>httpcore5-h2</artifactId>\n'
             '                <version>5.4.3</version>\n'
             '            </dependency>\n'
             '            <dependency>\n'
             '                <!-- QuenchWorks CVE-2026-59949 pin: lz4-java native XXHash can crash\n'
             '                     the JVM. at.yawk.lz4 has a single artifact on Maven Central, so\n'
             '                     there is no sibling module to keep version-aligned. -->\n'
             '                <groupId>at.yawk.lz4</groupId>\n'
             '                <artifactId>lz4-java</artifactId>\n'
             '                <version>1.11.1</version>\n'
             '            </dependency>\n'
             '            <dependency>\n'
             '                <!-- QuenchWorks CVE-2026-54291 pin (HIGH): postgresql JDBC driver -->\n'
             '                <groupId>org.postgresql</groupId>\n'
             '                <artifactId>postgresql</artifactId>\n'
             '                <version>42.7.12</version>\n'
             '            </dependency>\n'
             '            <dependency>\n'
             '                <!-- QuenchWorks CVE-2024-57699 pin (HIGH): json-smart stack exhaustion.\n'
             '                     Transitive only (nothing declares it in floci\'s pom), so a managed\n'
             '                     entry is enough and creates no duplicate. -->\n'
             '                <groupId>net.minidev</groupId>\n'
             '                <artifactId>json-smart</artifactId>\n'
             '                <version>2.5.2</version>\n'
             '            </dependency>')
      # 3) The DM pin above loses to a DIRECT dependency that carries its own
      #    explicit <version> -- and floci declares httpclient5 5.5.1 directly
      #    (it is what docker-java-transport-httpclient5 wants). CVE-2026-64607
      #    has no 5.5.x fix, so rewrite the direct element's version too.
      # floci 2.1.0 put an XML COMMENT between <artifactId> and <version> (it
      # explains why upstream holds 5.5.x), and \s* cannot span a comment, so the
      # rewrite matched nothing and the guard below aborted the build. GAP allows
      # comments as well as whitespace between the two elements.
      GAP = r'(?:\s|<!--.*?-->)*'
      src, k = re.subn(
          r'(<groupId>org\.apache\.httpcomponents\.client5</groupId>' + GAP +
          r'<artifactId>httpclient5</artifactId>' + GAP + r'<version>)[^<]*(</version>)',
          r'\g<1>5.6.3\g<2>', src, flags=re.S)
      stuck = [v for v in re.findall(
          r'<groupId>org\.apache\.httpcomponents\.client5</groupId>' + GAP +
          r'<artifactId>httpclient5</artifactId>' + GAP + r'<version>([^<]*)</version>',
          src, flags=re.S)
          if v != '5.6.3']
      if not k or stuck:
          raise SystemExit(f"httpclient5 direct-dep pin FAILED (rewrote {k}, left {stuck})")
      # 4) floci 2.1.0 added its OWN managed httpcore5 / httpcore5-h2 entries at
      #    5.3.6, which made the managed pin below inert in a way that still
      #    reads correct: two entries for one GAV in one pom is not first-wins,
      #    Maven warns "must be unique" and takes the LAST one, so upstream's
      #    5.3.6 beat our prepended 5.4.3 and the image shipped CVE-2026-54399
      #    and CVE-2026-54428. Rewrite every existing entry to 5.4.3 as well, so
      #    whichever one Maven picks is the fixed version.
      #
      #    Upstream holds 5.3.6 on purpose: httpcore5 5.4 enables TCP keep-alive
      #    in SocketConfig, httpclient5 sets that extended option by reflection
      #    on docker-java's UnixSocket, and that is unregistered in a NATIVE
      #    image, so every Docker call fails. This recipe builds the Quarkus
      #    FAST-JAR, not a native image, where reflection needs no registration.
      #    Evidence it holds: floci-full 2.0.1 is published and passing with
      #    5.4.3, which it got because its pom declared no httpcore5 at all.
      for core_art in ('httpcore5', 'httpcore5-h2'):
          src = re.sub(
              r'(<groupId>org\.apache\.httpcomponents\.core5</groupId>' + GAP +
              r'<artifactId>' + core_art + r'</artifactId>' + GAP + r'<version>)[^<]*(</version>)',
              r'\g<1>5.4.3\g<2>', src, flags=re.S)
          left = [v for v in re.findall(
              r'<groupId>org\.apache\.httpcomponents\.core5</groupId>' + GAP +
              r'<artifactId>' + core_art + r'</artifactId>' + GAP + r'<version>([^<]*)</version>',
              src, flags=re.S) if v != '5.4.3']
          if left:
              raise SystemExit(f"{core_art} pin FAILED, left {left}")
      m = re.search(r'<dependencyManagement>\s*<dependencies>', src)
      if m:
          src = src[:m.end()] + pin + src[m.end():]
      else:
          block = ('    <dependencyManagement>\n        <dependencies>' + pin +
                   '\n        </dependencies>\n    </dependencyManagement>\n')
          src = src.replace('</project>', block + '</project>', 1)
      open(path, "w", encoding="utf-8").write(src)
      print(f"jackson pin applied (property bumped x{n}, databind pinned to 2.21.5)")
      PYEOF
      grep -n '2.21.5' pom.xml || { echo "jackson pin FAILED to apply"; exit 1; }
      grep -q 'netty-bom' pom.xml || { echo "netty-bom pin FAILED to apply"; exit 1; }
      grep -q '4.1.137.Final' pom.xml || { echo "netty version pin FAILED to apply"; exit 1; }
      grep -q '<version>42.7.12</version>' pom.xml || { echo "postgresql pin FAILED to apply"; exit 1; }
      grep -q '<artifactId>lz4-java</artifactId>' pom.xml || { echo "lz4-java pin FAILED to apply"; exit 1; }
      grep -q '<version>2.5.2</version>' pom.xml || { echo "json-smart pin FAILED to apply"; exit 1; }
      ! grep -q '<version>5.3.6</version>' pom.xml || { echo "httpcore5 5.3.6 survived the pin"; exit 1; }
      # -----------------------------------------------------------------------
      # Build the Quarkus fast-jar. Skip tests (they need Docker + network); the
      # released bytecode is identical to upstream's `mvn clean package`.
      mvn -B -ntp clean package -DskipTests
      test -f target/quarkus-app/quarkus-run.jar
      # Install the fast-jar tree verbatim under /usr/share/floci.
      install -d "${{targets.destdir}}/usr/share/floci"
      cp -a target/quarkus-app "${{targets.destdir}}/usr/share/floci/quarkus-app"
      # NOTE: the writable state dir (/app/data) is created and chowned to the
      # nonroot uid via apko's `paths:` block -- numeric chown is not permitted
      # inside the melange build sandbox.

test:
  pipeline:
    - runs: |
        test -f /usr/share/floci/quarkus-app/quarkus-run.jar
