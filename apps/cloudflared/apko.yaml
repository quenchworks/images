# cloudflared runtime: the binary is the entrypoint, `version` the default command, as upstream's
# image. Run a tunnel with `tunnel --no-autoupdate run --token <TUNNEL_TOKEN>` (or TUNNEL_TOKEN in
# the environment). NO_AUTOUPDATE is set: the image is updated by pulling a new tag. Nonroot 1001.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-cloudflared@local

accounts:
  groups:
    - groupname: cloudflared
      gid: 1001
  users:
    - username: cloudflared
      uid: 1001
      gid: 1001
      homedir: /home/cloudflared
  run-as: 1001

paths:
  - path: /home/cloudflared
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o755

environment:
  NO_AUTOUPDATE: "true"
  HOME: /home/cloudflared

entrypoint:
  command: /usr/bin/cloudflared
cmd: version

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-cloudflared"
  org.opencontainers.image.licenses: "Apache-2.0"
  org.opencontainers.image.version: "__VER__"
