# cloudflared from the release tag, CGO-free, with upstream's Makefile stamps (main.Version) and
# its container stamp (metrics.Runtime=virtual: metrics bind to 0.0.0.0 inside a container).
package:
  name: quench-cloudflared
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened cloudflared (Cloudflare Tunnel client), built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27          # go.mod: go 1.27.3

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/cloudflare/cloudflared/archive/refs/tags/${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - runs: |
      set -eu
      export CGO_ENABLED=0 GOTOOLCHAIN=local GOFLAGS=-mod=mod
      # floors, raised only when below (a bare go get downgrades once upstream passes it); the
      # golang.org/x set moves together (x/crypto at the GO-2026-5932 fix commit)
      FLOOR="golang.org/x/crypto@v0.58.1-0.20261009181718-2f1f834330b2 golang.org/x/net@v0.62.0 golang.org/x/text@v0.43.0 golang.org/x/sys@v0.49.0"
      # CVE-2026-128085 (otel 1.47.0): floor every otel v1 module the build uses, as one family
      for m in $(go list -m -f '{{.Path}} {{.Version}}' all | awk '$1 ~ /^go\.opentelemetry\.io\/otel(\/|$)/ && $1 !~ /\/exporters\/jaeger$/ { if ($1 ~ /\/exporters\/(otlp\/otlplog\/|stdout\/stdoutlog$)/) print $1"@v0.23.0"; else if ($1 ~ /\/exporters\/prometheus$/) print $1"@v0.69.0"; else if ($2 ~ /^v1\./ || $1 ~ /\/(sdk\/)?log$/) print $1"@v1.47.0" }'); do
        FLOOR="$FLOOR $m"
      done
      need=""
      for f in $FLOOR; do
        have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${f%@*}")"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        [ "$(printf '%s\n%s\n' "$have" "${f#*@}" | sort -V | head -1)" = "${f#*@}" ] || need="$need $f"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || go get $need
      go mod tidy
      go build -trimpath -ldflags "-s -w -X main.Version=${{package.version}} -X github.com/cloudflare/cloudflared/metrics.Runtime=virtual" \
        -o "${{targets.destdir}}/usr/bin/cloudflared" ./cmd/cloudflared
      "${{targets.destdir}}/usr/bin/cloudflared" version | grep -F "${{package.version}}"

test:
  pipeline:
    - runs: |
        cloudflared version
