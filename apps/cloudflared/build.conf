# cloudflared (cloudflare/cloudflared, Apache-2.0): the Cloudflare Tunnel client. It publishes
# in-cluster services through Cloudflare without opening inbound ports. From source via melange:
# one static Go binary with upstream's container flags (metrics.Runtime=virtual, the same as
# CONTAINER_BUILD=1). Calendar versions YYYY.M.P, a release every few weeks. LATEST-ONLY.
FROM_SOURCE=1
VERSIONS=(2026.10.7)
declare -A SHA256=(
  [2026.10.7]=d268031cb8906675b6b6353f18a007e6fc028f170094c5ac9220493bc8147016
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
