# Assembles the Friendica runtime image: the Friendica tree (quench-friendica) plus a
# hardened Wolfi PHP-FPM (127.0.0.1:9000) and Wolfi nginx (:8080), supervised by
# supervisord together with Friendica's background worker daemon. Nonroot (uid/gid
# 1001), multi-arch, read-only-rootfs friendly. SBOM by apko. No upstream Friendica
# image is inherited; the runtime is built from Wolfi packages.
#
# Ports:
#   8080/tcp  nginx, serves /var/www/html and FastCGI-passes .php to php-fpm
#   9000/tcp  php-fpm, loopback only
#
# Writable at runtime (emptyDir/PVC): /var/friendica/config (local.config.php, written by
# `bin/console.php autoinstall`) and /tmp (supervisord, nginx, php, compiled templates,
# daemon pidfile). Uploads are stored in the database by default.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - busybox                       # /bin/sh for the entrypoint, worker loop and proc_open
    - ca-certificates-bundle
    - supervisor                    # process supervisor for php-fpm + nginx + worker
    - nginx                         # Wolfi nginx (web tier)
    - quench-friendica@local        # the Friendica tree + runtime wiring
    # PHP 8.3 is inside Friendica 2026.05's range (7.4 to 8.5). Extensions: the ext-* list
    # in composer.json minus imagick (optional, GD is used instead; ImageMagick is left out
    # as a standing CVE source), plus the installer's required checks (posix, intl for
    # IntlChar and IDN, pdo/mysqli) and apcu for the cache.
    - php-8.3
    - php-8.3-fpm
    - php-8.3-fpm-config
    - php-8.3-config
    - php-8.3-opcache
    - php-8.3-opcache-config
    - php-8.3-ctype
    - php-8.3-ctype-config
    - php-8.3-curl
    - php-8.3-curl-config
    - php-8.3-dom
    - php-8.3-dom-config
    - php-8.3-exif
    - php-8.3-exif-config
    - php-8.3-fileinfo
    - php-8.3-fileinfo-config
    - php-8.3-gd
    - php-8.3-gd-config
    - php-8.3-gmp
    - php-8.3-gmp-config
    - php-8.3-iconv
    - php-8.3-iconv-config
    - php-8.3-intl
    - php-8.3-intl-config
    - php-8.3-mbstring
    - php-8.3-mbstring-config
    - php-8.3-openssl
    - php-8.3-openssl-config
    - php-8.3-posix
    - php-8.3-posix-config
    - php-8.3-pcntl                 # the worker daemon forks and reaps with pcntl_*
    - php-8.3-pcntl-config
    - php-8.3-simplexml
    - php-8.3-simplexml-config
    - php-8.3-sodium
    - php-8.3-sodium-config
    - php-8.3-xml
    - php-8.3-xml-config
    - php-8.3-xmlreader
    - php-8.3-xmlreader-config
    - php-8.3-xmlwriter
    - php-8.3-xmlwriter-config
    - php-8.3-zip
    - php-8.3-zip-config
    - php-8.3-apcu
    - php-8.3-apcu-config
    - php-8.3-pdo
    - php-8.3-pdo-config
    - php-8.3-pdo_mysql
    - php-8.3-pdo_mysql-config
    - php-8.3-mysqli
    - php-8.3-mysqli-config
    - php-8.3-mysqlnd
    - php-8.3-mysqlnd-config

accounts:
  groups:
    - groupname: friendica
      gid: 1001
  users:
    - username: friendica
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/bin/friendica-entrypoint.sh

work-dir: /var/www/html

paths:
  - path: /var/friendica/config
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o1777

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-friendica"
  org.opencontainers.image.licenses: "AGPL-3.0-or-later"
