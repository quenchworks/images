# friendica: the official friendica-full release tarball from files.friendi.ca (PHP sources
# plus the resolved composer vendor/ and view/asset/ trees), served by a Wolfi PHP-FPM +
# nginx runtime. Nothing to compile, so FROM_SOURCE stays unset (like joomla, mediawiki).
# Friendica keeps one stable line (no maintained older releases), so we ship the newest.
# The tarball carries no composer.json/lock; the vendor float in melange.yaml takes them
# from the release tag (raw.githubusercontent.com), sha256-pinned per version.
# The friendica-addons tarball is not shipped: core runs without it.
# Each sha256 is from a download on 2026-10-14 (tarball matches upstream's .sum256).
BLOCKED=0
VERSIONS=(2026.05)
declare -A SHA256=(
  [2026.05]=174704214e5af3be818d83cd8c7a04541fbbf06796649b42293f2f89665ddb36
)
declare -A CJSON_SHA=(
  [2026.05]=f33e2635ea18a1d087ae47baec679de4b47f19a72861524abe690847b861518a
)
declare -A CLOCK_SHA=(
  [2026.05]=793d18a62f08f9ad9feb01df6ad7335f9d2b0518edb3b26121ce67e3801937d4
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g; s|__CJSON_SHA__|${CJSON_SHA[$1]}|g; s|__CLOCK_SHA__|${CLOCK_SHA[$1]}|g"; }
