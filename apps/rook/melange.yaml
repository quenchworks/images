# Builds the Rook operator binary from source with the module floors below, plus the
# scripts and manifests upstream's image ships.
package:
  name: quench-rook
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Rook Ceph operator, built from source on Wolfi"
  copyright:
    - license: Apache-2.0

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-1.26

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/rook/rook/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  # Wolfi's s5cmd (2.3.0-r25, newest) links golang.org/x/sys v0.20.0 (CVE-2026-39824);
  # build upstream's newest release here with the same floor pass instead.
  # fetch extracts into `directory` but does not create it.
  - runs: mkdir -p s5cmd
  - uses: fetch
    with:
      uri: https://github.com/peak/s5cmd/archive/refs/tags/v2.3.0.tar.gz
      expected-sha256: 6910763a7320010aa75fe9ef26f622e440c2bd6de41afdbfd64e78c158ca19d4
      directory: s5cmd
  - runs: |
      set -eu
      # Rook is a go.work workspace, which rejects -mod=mod; go.mod already replaces
      # pkg/apis with ./pkg/apis, so the main module builds the same binary on its own.
      export CGO_ENABLED=0 GOFLAGS=-mod=mod GOTOOLCHAIN=local GOWORK=off
      # FLOORS, not pins: raise a module only where go.mod has it below the floor.
      FLOOR="golang.org/x/crypto@v0.56.0 golang.org/x/net@v0.58.0 golang.org/x/text@v0.41.0 golang.org/x/mod@v0.40.0 google.golang.org/grpc@v1.83.2 github.com/moby/go-archive@v0.3.0 github.com/moby/buildkit@v0.31.1"
      # Go semver order (a release outranks its prereleases); busybox sort -V does not.
      vlt() { awk -v a="${1#v}" -v b="${2#v}" 'function pp(s,  p){sub(/\+.*/,"",s);p=index(s,"-");if(p){C=substr(s,1,p-1);P=substr(s,p+1)}else{C=s;P=""}} function cmp(x,y,  i,n,m,X,Y){n=split(x,X,".");m=split(y,Y,".");for(i=1;i<=n&&i<=m;i++){if(X[i]==Y[i])continue;if(X[i]~/^[0-9]+$/&&Y[i]~/^[0-9]+$/)return (X[i]+0<Y[i]+0)?-1:1;if(X[i]~/^[0-9]+$/)return -1;if(Y[i]~/^[0-9]+$/)return 1;return (X[i]<Y[i])?-1:1}return (n<m)?-1:(n>m)?1:0} BEGIN{pp(a);ca=C;pa=P;pp(b);cb=C;pb=P;c=cmp(ca,cb);if(c==0){if(pa==pb)c=0;else if(pa=="")c=1;else if(pb=="")c=-1;else c=cmp(pa,pb)}exit !(c<0)}'; }
      floorpass() {
        need=""
        for mv in $FLOOR; do
          have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${mv%@*}" 2>/dev/null)"
          case "$have" in v[0-9]*) ;; *) continue ;; esac
          vlt "$have" "${mv#*@}" && need="$need $mv"
        done
        echo "raising:${need:- nothing}"
        [ -z "$need" ] || go get $need
        go mod tidy
      }
      floorpass
      go build -trimpath -ldflags "-s -w -X github.com/rook/rook/pkg/version.Version=v${{package.version}}" \
        -o "${{targets.destdir}}/usr/local/bin/rook" ./cmd/rook
      install -m 0755 images/ceph/toolbox.sh images/ceph/set-ceph-debug-level "${{targets.destdir}}/usr/local/bin/"
      mkdir -p "${{targets.destdir}}/etc/rook-external/test-data"
      cp -r deploy/examples/monitoring "${{targets.destdir}}/etc/ceph-monitoring"
      cp deploy/examples/create-external-cluster-resources.* "${{targets.destdir}}/etc/rook-external/"

      cd s5cmd
      rm -rf vendor
      # x/sys v0.44.0 closes the CVE; the floor is 0.47.0 because x/crypto v0.56.0 requires it
      FLOOR="$FLOOR golang.org/x/sys@v0.47.0"
      floorpass
      xsys="$(go list -m -f '{{.Version}}' golang.org/x/sys)"
      vlt "$xsys" v0.44.0 && { echo "FATAL: s5cmd x/sys still $xsys"; exit 1; }
      go build -trimpath -ldflags "-s -w -X github.com/peak/s5cmd/v2/version.Version=v2.3.0" \
        -o "${{targets.destdir}}/usr/bin/s5cmd" .

test:
  pipeline:
    - runs: |
        /usr/local/bin/rook version
        /usr/bin/s5cmd version
