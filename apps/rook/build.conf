# rook: the Rook Ceph operator (Apache-2.0), built from source (cmd/rook, version ldflag as
# upstream's Makefile) and layered on the same Wolfi ceph-20 subpackages as apps/ceph,
# like upstream's image (FROM the ceph image): the operator shells out to the ceph, rbd and
# radosgw-admin CLIs. Adds upstream's toolbox.sh, set-ceph-debug-level, ceph-monitoring
# and rook-external files, iproute2 (Multus) and s5cmd. Runs as uid 2016 like upstream.
# Newest only. Rook 1.21 defaults to Ceph v20.2.4, the apps/ceph version.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(1.21.1)
declare -A SHA256=(
  [1.21.1]=efb9302395a9af4c1854f3bdb2f17b16f0f3efbadd6daba543edfd614a83edbf
)
CEPH=20.2.4-r6
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g; s/__CEPH__/$CEPH/g"; }
