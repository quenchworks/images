# RESOLVED 2026-11-19 (#117): the 2026-11-18 hold waited for Wolfi 10.0.115, which never comes public (dotnet-10 moved to enterprise-packages 2026-11-12). The image now packages Microsoft's official 10.0.15 release; see the 2026-11-19 note above VERSIONS.
# STATUS: UNBLOCKED 2026-09-20. The zlib block is gone: Wolfi shipped the fix
# for CVE-2026-85091 as zlib 1.3.2.1_rc20260601-r0 and the advisory was amended
# to name that version, so the 1.3.3-r0 this file used to wait for is a number
# that will never arrive. A stock wolfi-base scan reports the advisory as
# `zlib 1.3.2-r7 -> 1.3.2.1_rc20260601-r0`, which is what Wolfi publishes on
# both arches today. scripts/blocked.py now watches the shipped version.
#
# Evidence, stated exactly as measured:
#   x86_64  gated locally 2026-09-20, PUSH=0: 0 fixable CVEs AND the boot test
#           passed, so this is "runs", not just "scans clean".
#   aarch64 not measured locally; this host kills background melange builds and
#           a qemu-emulated arm build does not fit the foreground timeout. CI's
#           native arm64 runner is the first arm measurement, and its gate
#           refuses to publish on any finding.
# STATUS 2026-08-27 (re-verified): STILL BLOCKED, but only the 8.x band.
#
# Verified against today's Wolfi APKINDEX + a local comprehensive-mode gate on
# both arches:
#   8.0.127  x86_64  FAILS -- 8 findings / 4 distinct CVEs, all in dotnet-8 +
#            dotnet-8-runtime 8.0.127-r0, every one fixed only in 8.0.129-r1:
#            CVE-2026-47304 (CRITICAL, security feature bypass),
#            CVE-2026-47302 / CVE-2026-50525 / CVE-2026-50648 (HIGH, DoS).
#            Wolfi's newest dotnet-8-runtime is STILL 8.0.127-r0 -- there is no
#            8.0.128 or 8.0.129 apk to install, so this is upstream-gated.
#   9.0.120  x86_64 + aarch64  0 fixable CVEs, smoke test passes.
#   10.0.111 x86_64 + aarch64  0 fixable CVEs, smoke test passes.
#
# The earlier note claimed only the CRITICAL; there are in fact three more HIGHs
# in the same band, and the openssl drift the nightly scan reported (libcrypto3 /
# libssl3 3.6.3-r3 -> r5) is already gone on a plain rebuild: Wolfi now ships
# 3.6.4-r0 and a fresh apko assembly picks it up. So openssl was never the
# blocker and 9.x/10.x are ready to publish the moment the flag allows it.
#
# The previous revision of this file also silently dropped the 8.x and 9.x lines
# and then mapped the 10.0.111 tag to dotnet-8-runtime -- i.e. it would have
# published the vulnerable .NET 8 runtime under a 10.0.111 tag. Both bands and
# the correct mapping are restored below.
#
# OPTION (needs a human call, NOT taken here): narrowing VERSIONS to
# (9.0.120 10.0.111) makes the whole app green today. It changes what the
# catalog offers -- new 8.x builds stop; the already-published 8.0.127 tag stays
# up and stays vulnerable -- so it is a catalog decision, not a build fix.
#
# RESOLVED 2026-08-27: the 8.x band is retired rather than blocking the whole app.
# 9.x and 10.x are verified 0 fixable CVEs on BOTH arches with boot tests passing, so
# they now ship; 8.0.127 is held out of VERSIONS, which also drops it from
# catalog.lock.yaml (the lock keeps only tags matching VERSIONS), so the catalog no
# longer advertises a .NET 8 image. RESIDUAL RISK, recorded not hidden: the previously
# published 8.0.127 tag still exists in GHCR and stays pullable by exact tag; it is no
# longer listed, scanned, or advertised anywhere. Delete it with
# cleanup-package-version.yml if that is not good enough.
# RESTORE the 8.x line when Wolfi ships dotnet-8-runtime >= 8.0.129-r1.
BLOCKED=0
# HELD 2026-10-19 (9.0.121 line): CVE-2026-70159/84008/96958/96959/96960/70162 in
# dotnet-9 + dotnet-9-runtime 9.0.121-r2, fixed in 9.0.122-r0 (.NET 9.0.21, released 2026-10-13).
# Wolfi's newest on both arches today is 9.0.121-r2. HELD keeps 9.0.121 in VERSIONS (and the
# lock) but the prep job skips it, so the fixed 10.x line publishes. Unblock: drop it from
# HELD and bump to 9.0.122 once dotnet-9-runtime >= 9.0.122-r0 is in the APKINDEX.
HELD=(9.0.121)
# dotnet-runtime: Wolfi-packaged .NET runtime, latest 3 major bands (8/9/10).
# VERSIONS holds full X.Y.Z (as-is tags); PKG maps each to dotnet-N-runtime
# (apko.yaml's __PKG__). Keep in sync with Wolfi.
FROM_SOURCE=1
# RETIRED 2026-11-11: the 9.0 band. .NET 9 reached end of life on 2026-11-10 (Microsoft
#   releases-index.json: support-phase eol), and Wolfi moved dotnet-9 to enterprise-packages on
#   2026-10-13 (wolfi-dev/os "build(dotnet-9): move to enterprise-packages"), so the public index
#   stops at 9.0.121-r2 while CVE-2026-70159, -84008, -96958, -96959, -96960 and -70162 are fixed
#   only in 9.0.122-r0. Same treatment as 8.x: out of VERSIONS (and the lock); the published
#   9.0.121 tag stays pullable by exact tag. Move to 10.0 (active until 2028-11-14).
# 2026-11-19 (#117): Microsoft's official .NET 10.0.15 Linux tarball, not Wolfi. Wolfi moved dotnet-10 to
# enterprise-packages on 2026-11-12 (wolfi-dev/os #433300), so its public index stops at 10.0.114 while
# CVE-2026-114149 and CVE-2026-118747 are fixed in .NET 10.0.15. The tag stays on the SDK-band line (10.0.1xx);
# VER_RT is the runtime version inside. URL + sha512 per arch copied from
# https://builds.dotnet.microsoft.com/dotnet/release-metadata/10.0/releases.json.
VERSIONS=(10.0.115)
# test.sh takes its extra args from build-dotnet-runtime.yml, which passes "${1%%.*}" rather
# than the version. Mirrored here so the local gate matches CI; passing the
# version instead fails an image that runs fine.
boot_args() { echo "${1%%.*}"; }
declare -A VER_RT=( [10.0.115]=10.0.15 )
declare -A URL_X64=( [10.0.115]=https://builds.dotnet.microsoft.com/dotnet/Runtime/10.0.15/dotnet-runtime-10.0.15-linux-x64.tar.gz )
declare -A SHA_X64=( [10.0.115]=a90177d75bc891f71aa814dde3bcf76a356f5a506824669f1891754457954a3d13b72f3ca04c98fa0fe588514a5a781f8a87b17930ee802105c14f9edb28318a )
declare -A URL_ARM=( [10.0.115]=https://builds.dotnet.microsoft.com/dotnet/Runtime/10.0.15/dotnet-runtime-10.0.15-linux-arm64.tar.gz )
declare -A SHA_ARM=( [10.0.115]=e2e8b907d9eb6c239cccf5c1fe67fd9a72c56fddccedca9ba41c8a53ff034293b335fdd9f7ab504f09bf7b3f165e0d14e34fc9ea1f06cc0e86d0dfb06d274b6a )
render() {
  local v="$1"
  echo "s|__PKG__|quench-dotnet-runtime@local|g; s|__PKGNAME__|quench-dotnet-runtime|g; s|__VER__|$v|g; s|__VER_RT__|${VER_RT[$v]}|g;"\
"s|__URL_X64__|${URL_X64[$v]}|g; s|__SHA_X64__|${SHA_X64[$v]}|g; s|__URL_ARM__|${URL_ARM[$v]}|g; s|__SHA_ARM__|${SHA_ARM[$v]}|g"
}
