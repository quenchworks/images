# STATUS: ZLIB-ONLY as of 2026-09-16. Measured, not assumed: run 35066529079
# on af0623d gated with exactly one finding, zlib CVE-2026-85091, on every
# version and both arches. Nothing else in this image is flagged.
#
# This recipe carried an explicit BLOCKED=0 and so kept building and failing
# on every sweep. The measurement above is what changes it to 1: the gate
# cannot pass until Wolfi ships zlib 1.3.3-r0, which upstream madler/zlib
# has never tagged. Downgrading to Wolfi's 1.3.1-r51 is not a way out: it
# predates the 1.3.2-r0 fix for CVE-2026-27171.
#
# Clear it with scripts/blocked.py --dispatch once 1.3.3-r0 lands.
# STATUS 2026-08-27 (re-verified): STILL BLOCKED, but only the 8.x band.
#
# Verified against today's Wolfi APKINDEX + a local comprehensive-mode gate on
# both arches:
#   8.0.127  x86_64  FAILS -- 8 findings / 4 distinct CVEs, all in dotnet-8 +
#            dotnet-8-runtime 8.0.127-r0, every one fixed only in 8.0.129-r1:
#            CVE-2026-47304 (CRITICAL, security feature bypass),
#            CVE-2026-47302 / CVE-2026-50525 / CVE-2026-50648 (HIGH, DoS).
#            Wolfi's newest dotnet-8-runtime is STILL 8.0.127-r0 -- there is no
#            8.0.128 or 8.0.129 apk to install, so this is upstream-gated.
#   9.0.120  x86_64 + aarch64  0 fixable CVEs, smoke test passes.
#   10.0.111 x86_64 + aarch64  0 fixable CVEs, smoke test passes.
#
# The earlier note claimed only the CRITICAL; there are in fact three more HIGHs
# in the same band, and the openssl drift the nightly scan reported (libcrypto3 /
# libssl3 3.6.3-r3 -> r5) is already gone on a plain rebuild: Wolfi now ships
# 3.6.4-r0 and a fresh apko assembly picks it up. So openssl was never the
# blocker and 9.x/10.x are ready to publish the moment the flag allows it.
#
# The previous revision of this file also silently dropped the 8.x and 9.x lines
# and then mapped the 10.0.111 tag to dotnet-8-runtime -- i.e. it would have
# published the vulnerable .NET 8 runtime under a 10.0.111 tag. Both bands and
# the correct mapping are restored below.
#
# OPTION (needs a human call, NOT taken here): narrowing VERSIONS to
# (9.0.120 10.0.111) makes the whole app green today. It changes what the
# catalog offers -- new 8.x builds stop; the already-published 8.0.127 tag stays
# up and stays vulnerable -- so it is a catalog decision, not a build fix.
#
# RESOLVED 2026-08-27: the 8.x band is retired rather than blocking the whole app.
# 9.x and 10.x are verified 0 fixable CVEs on BOTH arches with boot tests passing, so
# they now ship; 8.0.127 is held out of VERSIONS, which also drops it from
# catalog.lock.yaml (the lock keeps only tags matching VERSIONS), so the catalog no
# longer advertises a .NET 8 image. RESIDUAL RISK, recorded not hidden: the previously
# published 8.0.127 tag still exists in GHCR and stays pullable by exact tag; it is no
# longer listed, scanned, or advertised anywhere. Delete it with
# cleanup-package-version.yml if that is not good enough.
# RESTORE the 8.x line when Wolfi ships dotnet-8-runtime >= 8.0.129-r1.
BLOCKED=1
# dotnet-runtime: Wolfi-packaged .NET runtime, latest 3 major bands (8/9/10).
# VERSIONS holds full X.Y.Z (as-is tags); PKG maps each to dotnet-N-runtime
# (apko.yaml's __PKG__). Keep in sync with Wolfi.
FROM_SOURCE=0
VERSIONS=(9.0.120 10.0.111)     # 8.0.127 retired -- see STATUS above
declare -A PKG=(
# [8.0.127]=dotnet-8-runtime    # restore with the VERSIONS entry above
  [9.0.120]=dotnet-9-runtime
  [10.0.111]=dotnet-10-runtime
)
render() { echo "s|__PKG__|${PKG[$1]}|g"; }
