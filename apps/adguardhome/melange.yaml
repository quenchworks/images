package:
  name: quench-adguardhome
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened AdGuard Home, built from source on Wolfi"
  copyright:
    - license: GPL-3.0-only
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27
      - nodejs-24
      - npm

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/AdguardTeam/AdGuardHome/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - name: Build the web client
    runs: |
      set -eu
      export npm_config_cache="$(mktemp -d)" HOME="$(mktemp -d)"
      npm --prefix client --quiet --no-progress ci
      npm --prefix client run build-prod
      test -f build/static/index.html

  - name: Build AdGuardHome
    runs: |
      set -eu
      export CGO_ENABLED=0 GOFLAGS=-mod=mod GOTOOLCHAIN=local
      FLOOR="golang.org/x/crypto@v0.58.1-0.20261009181718-2f1f834330b2 golang.org/x/net@v0.62.0 github.com/gopacket/gopacket@v1.7.2"
      MODS="$(echo "$FLOOR" | tr ' ' '\n' | cut -d@ -f1)"
      below_floor() {
        awk -v floor="$FLOOR" -v tag="$1" '
          BEGIN { n = split(floor, f, " ")
                  for (i = 1; i <= n; i++) { split(f[i], kv, "@"); want[kv[1]] = kv[2] } }
          ($1 in want) {
            split(substr($2, 2), g, "."); split(substr(want[$1], 2), w, ".")
            for (i = 1; i <= 3; i++) {
              if ((g[i] + 0) > (w[i] + 0)) next
              if ((g[i] + 0) < (w[i] + 0)) { print $1 "@" want[$1] " (" tag " has " $2 ")"; next }
            }
          }'
      }
      need="$(go list -m -e $MODS | awk 'NF >= 2 && $NF ~ /^v[0-9]/ { print $1, $NF }' | below_floor go.mod | awk '{ print $1 }')"
      if [ -n "$need" ]; then go get $need; fi
      # upstream scripts/make/go-build.sh: version, channel and committime in internal/version
      v=github.com/AdguardTeam/AdGuardHome/internal/version
      go build -trimpath -ldflags "-s -w -X $v.version=v${{package.version}} -X $v.channel=release -X $v.committime=$(date +%s)" \
        -o "${{targets.destdir}}/usr/bin/AdGuardHome" .
      bad="$(go version -m "${{targets.destdir}}/usr/bin/AdGuardHome" | awk '$1 == "dep" || $1 == "=>" { print $2, $3 }' | below_floor AdGuardHome)"
      [ -z "$bad" ] || { echo "float did not reach the binary:"; echo "$bad"; exit 1; }
      "${{targets.destdir}}/usr/bin/AdGuardHome" --version | grep -F "v${{package.version}}"

test:
  pipeline:
    - runs: AdGuardHome --version
