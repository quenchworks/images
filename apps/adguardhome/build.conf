# adguardhome: AdGuard Home (AdguardTeam/AdGuardHome), a network-wide ad and tracker blocking DNS server
# with a web UI, DoH/DoT/DoQ and per-client rules. GPL-3.0. Go with its webpack client built here and
# embedded (node_modules does not ship). Images issue #40.
#
# NEWEST-ONLY: upstream ships one line. Runs as uid 1001: give it a DNS port above 1024 in its config
# (the chart uses 5353 and publishes 53 on the Service).
FROM_SOURCE=1
VERSIONS=(0.107.80 1.0.0)
declare -A SHA256=(
  [0.107.80]=c67cf289f1d4b05c78994f4d1d169962540814a212244eb191cd599795d90278
  [1.0.0]=fb7b67a40bcd81063cf0f7fbc5c27cd5ae71cc6434a4b5342885ebb3e51586d6
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
