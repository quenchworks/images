# Builds guacd and its protocol plugins (libguac-client-rdp, -vnc, -ssh, -telnet)
# from the release tag. The Kubernetes-exec plugin is left out: it needs
# libwebsockets, and Wolfi's libwebsockets 5.0 headers use the OpenSSL RSA type,
# which the compile of the plugin cannot see (unknown type name 'RSA'). The tag archive has no generated configure,
# so autoreconf runs first. guaclog and guacenc (offline recording tools) are not
# part of the daemon image.
package:
  name: quench-guacd
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Apache Guacamole proxy daemon (guacd), built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      # the RDP plugin loads FreeRDP's channel and codec plugins at run time
      - freerdp-libs
      # fonts for SSH/telnet terminal rendering through pango
      - ttf-dejavu

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - cairo-dev
      - freerdp-dev
      - libjpeg-turbo-dev
      - libpng-dev
      - libssh2-dev
      - libtelnet
      - libtool
      - libvncserver-dev
      - libvorbis-dev
      - libwebp-dev
      - openssl-dev
      - pango-dev
      - pkgconf
      - pkgconf-dev       # pkg.m4 (PKG_CHECK_MODULES) for autoreconf
      - pulseaudio-dev
      - util-linux-dev

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/apache/guacamole-server/archive/refs/tags/${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      set -eu
      autoreconf -fi
      # upstream builds with -Werror; GCC 16 warns on a redefined _XOPEN_SOURCE in
      # config.h. CFLAGS follows AM_CFLAGS on the compile line, so this wins.
      export CFLAGS="${CFLAGS:-} -Wno-error"
      ./configure --prefix=/usr --sbindir=/usr/bin --sysconfdir=/etc --disable-static \
        --disable-guaclog --disable-guacenc --without-libwebsockets \
        | tee configure.out
      # Every protocol this image advertises must actually be enabled.
      for p in RDP VNC SSH Telnet; do
        grep -E "^ +${p} +\.+ yes" configure.out || { echo "protocol ${p} not enabled"; exit 1; }
      done
      make -j"$(nproc)"
      make install DESTDIR="${{targets.destdir}}"
      rm -f "${{targets.destdir}}"/usr/lib/*.la "${{targets.destdir}}"/usr/lib/freerdp*/*.la
      "${{targets.destdir}}/usr/bin/guacd" -v 2>&1 | grep -F "${{package.version}}" || \
        LD_LIBRARY_PATH="${{targets.destdir}}/usr/lib" "${{targets.destdir}}/usr/bin/guacd" -v 2>&1 | grep -F "${{package.version}}"
