# Assembles the guacd image: the proxy daemon plus its protocol plugins. Nonroot
# uid 1001, multi-arch, SBOM by apko. It listens on 4822 in the foreground; the
# Guacamole web app connects to it.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-guacd@local

accounts:
  groups:
    - groupname: guacd
      gid: 1001
  users:
    - username: guacd
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/bin/guacd -f -b 0.0.0.0 -l 4822 -L info

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-guacd"
  org.opencontainers.image.licenses: "Apache-2.0"
