# guacd (apache/guacamole-server): the Apache Guacamole proxy daemon that speaks
# RDP, VNC, SSH and telnet to remote hosts and the Guacamole protocol to the web
# app. The Kubernetes-exec protocol is left out (see melange.yaml). C, from source via melange (autotools), against Wolfi's
# FreeRDP 2 (upstream's own image default: 1.6.0 does not build against Wolfi's
# FreeRDP 3.32, which removed the freerdp->input member it uses), libvncserver,
# libssh2 and libtelnet. Guacamole ships one release line.
FROM_SOURCE=1
VERSIONS=(1.6.0)
declare -A SHA256=(
  [1.6.0]=913b05d19beabed4a3066e6e2be3078783048f55c7a9d2e3a012897a8766c245
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
