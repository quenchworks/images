# volcano runtime: three binaries; the default entrypoint is the scheduler, the chart sets the command per Deployment. Nonroot 1001.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-volcano@local

accounts:
  groups:
    - groupname: volcano
      gid: 1001
  users:
    - username: volcano
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /vc-scheduler

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-volcano"
  org.opencontainers.image.licenses: "Apache-2.0"
  org.opencontainers.image.version: "__VER__"
