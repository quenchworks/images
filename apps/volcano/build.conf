# Volcano (batch scheduler and job controller for AI and HPC workloads: Job, Queue, PodGroup),
# from volcano-sh/volcano (Apache-2.0). From the release tag via melange: one image with the three
# control-plane binaries at upstream's paths (/vc-scheduler, /vc-controller-manager,
# /vc-webhook-manager); the chart picks one per Deployment. CGO-free like upstream's default build
# (cgo is only for the plugin build), version stamped with -X volcano.sh/volcano/pkg/version.*
# like Makefile.def, and the house golang.org/x floor. LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(1.16.0)
declare -A SHA256=(
  [1.16.0]=334e93a189028f0cf941fcca437fc2511bfeadb6ac6b6c4af5f361a4ccc0ea0d
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
