# Zalando Postgres Operator runtime: watches postgresql resources in-cluster and runs clusters on the Spilo image.
# Reads its configuration from CONFIG_MAP_NAME or POSTGRES_OPERATOR_CONFIGURATION_OBJECT. Nonroot 1001; API on 8080.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-postgres-operator@local

accounts:
  groups:
    - groupname: pgo
      gid: 1001
  users:
    - username: pgo
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/bin/postgres-operator

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-postgres-operator"
  org.opencontainers.image.licenses: "MIT"
  org.opencontainers.image.version: "__VER__"
