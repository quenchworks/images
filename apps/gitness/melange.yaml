# Builds Gitness (harness/gitness) from source onto Wolfi. Gitness is an
# all-in-one self-hosted Git + CI/CD server: a Go backend that go:embeds a React
# web UI (web/dist.go -> `//go:embed dist/*`). The source tag ships web/ but NOT
# web/dist (the UI is not pre-built), so we reproduce upstream's own asset pipeline
# (Dockerfile: `node:16` + `yarn && yarn build`) inside the build sandbox:
#   web: yarn install --frozen-lockfile + yarn build -> web/dist/**
#   go build -> web/dist.go's `//go:embed dist/*` picks up the compiled UI.
# Node/yarn live ONLY in the build sandbox; the runtime image carries no JS
# toolchain, so Node never enters the Trivy scan surface. We use nodejs-16 to match
# upstream's node:16 exactly (the webpack 5.58 build predates the OpenSSL 3 fix, so
# newer Node needs --openssl-legacy-provider; matching the upstream major sidesteps
# that entirely).
#
# CGO: the default DB driver is sqlite via github.com/mattn/go-sqlite3, which is a
# cgo package -- so unlike the pure-Go images here this build sets CGO_ENABLED=1
# (build-base provides gcc + glibc-dev). The result is a glibc-dynamic binary;
# melange auto-detects its SONAME deps (libc.so.6, libgcc_s) and the runtime image
# is glibc-based, so no static musl cross-compile (upstream's arm64 dance) is
# needed. Gitness also shells out to the `git` binary at runtime
# (git/command/command.go: GitExecutable = "git"), so `git` is a runtime dependency.
#
# go.mod declares go 1.25.8; we build with go-1.26 (newest, clears stdlib CVE
# advisories) and GOTOOLCHAIN=local so the go.mod directive does not trigger a
# toolchain download. GOFLAGS=-mod=mod lets the module graph resolve patched deps.
# The version is stamped via -X into github.com/harness/gitness/version
# {major,minor,patch} + GitCommit, mirroring upstream's release ldflags, so
# `gitness --version` reports the real release.
package:
  name: quench-gitness
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Gitness (self-hosted Git + CI/CD), built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - git

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - bash
      - ca-certificates-bundle
      - go-1.26
      # UI toolchain (build sandbox only): upstream builds the web frontend with
      # `node:16` + yarn classic. nodejs-16 matches that major exactly; yarn is the
      # Wolfi yarn-classic package (web/yarn.lock is a v1 lockfile).
      - nodejs-16
      - yarn

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/harness/gitness/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - name: Build the embedded web UI from source (yarn + webpack)
    runs: |
      set -eu
      # Writable HOME/caches for yarn inside the sandbox.
      export HOME="$(mktemp -d)"
      export YARN_CACHE_FOLDER="$(mktemp -d)"
      export npm_config_cache="$(mktemp -d)"
      # Skip husky's `prepare` git-hook install: the release tarball has no .git,
      # and hooks are irrelevant to a production build.
      export HUSKY=0
      cd web
      yarn install --frozen-lockfile --network-timeout 600000
      yarn build
      # web/dist.go embeds dist/*; assert webpack produced the UI entrypoint.
      test -f dist/index.html

  - name: Build the gitness binary (CGO on, glibc-dynamic)
    runs: |
      set -eu
      export CGO_ENABLED=1
      export CGO_CFLAGS="-D_LARGEFILE64_SOURCE"   # mattn/go-sqlite3 build flag
      export GOFLAGS=-mod=mod
      export GOTOOLCHAIN=local     # use the installed go-1.26, do not fetch go.mod's 1.25.8
      export GO111MODULE=on
      # ---- 0-CVE module float (docs/go-module-float.md) -------------------------
      # FLOOR is a FLOOR, not a pin: a bare `go get mod@vX` is a NO-OP when an
      # upstream `replace` outranks it and a DOWNGRADE once upstream requires more
      # than vX, so float only what sits below the floor and then assert the SHIPPED
      # BINARY. What each entry clears, as of 2026-08-27:
      #   kin-openapi v0.144.0   GHSA-r277-6w6q-xmqw (CRITICAL, fail-open auth) +
      #                          CVE-2026-76905/77354/73502
      #   x/mod v0.40.0          CVE-2026-56864/56865 (v0.37.0 is NOT enough, see doc)
      #   grpc v1.82.1           GHSA-hrxh-6v49-42gf xDS RBAC / HTTP2
      #   oras-go v2.6.2         CVE-2026-50163 tarball hardlink escape
      #   x/crypto v0.55.0 + x/net v0.58.0: crypto v0.55.0 REQUIRES net >= v0.57.0,
      #                          so the older (0.55.0, 0.55.0) pair made `go get` fail
      #                          outright -- that is what actually broke this build.
      #   circl / distribution / chi / pgx / xz: earlier advisory floors, kept as
      #                          floors so a later upstream bump is not dragged back.
      FLOOR="golang.org/x/crypto@v0.56.0 golang.org/x/net@v0.58.0 golang.org/x/text@v0.41.0 golang.org/x/mod@v0.40.0 google.golang.org/grpc@v1.83.2 oras.land/oras-go/v2@v2.6.2 github.com/getkin/kin-openapi@v0.144.0 github.com/cloudflare/circl@v1.6.3 github.com/distribution/distribution/v3@v3.1.1 github.com/go-chi/chi/v5@v5.2.4 github.com/jackc/pgx/v5@v5.9.2 github.com/ulikunitz/xz@v0.5.15 go.opentelemetry.io/otel@v1.45.0 go.opentelemetry.io/otel/sdk@v1.45.0 go.opentelemetry.io/otel/trace@v1.45.0 go.opentelemetry.io/otel/metric@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.45.0"
      MODS="$(echo "$FLOOR" | tr ' ' '\n' | cut -d@ -f1)"
      # prints "<mod>@<floor> (<tag> has <ver>)" for every module below its floor
      below_floor() {
        awk -v floor="$FLOOR" -v tag="$1" '
          BEGIN { n = split(floor, f, " ")
                  for (i = 1; i <= n; i++) { split(f[i], kv, "@"); want[kv[1]] = kv[2] } }
          ($1 in want) {
            split(substr($2, 2), g, "."); split(substr(want[$1], 2), w, ".")
            for (i = 1; i <= 3; i++) {
              if ((g[i] + 0) > (w[i] + 0)) next
              if ((g[i] + 0) < (w[i] + 0)) { print $1 "@" want[$1] " (" tag " has " $2 ")"; next }
            }
          }'
      }
      # `go list -m` prints "<mod> <ver>" or "<mod> <ver> => <mod> <ver>", so $NF is
      # the EFFECTIVE version and a replace cannot hide behind the require line.
      go list -m -e $MODS
      need="$(go list -m -e $MODS | awk 'NF >= 2 && $NF ~ /^v[0-9]/ { print $1, $NF }' | below_floor go.mod | awk '{ print $1 }')"
      if [ -n "$need" ]; then go get $need; fi
      go mod tidy
      # --- sever github.com/docker/docker (CVE-2026-33997, CVE-2025-54410) -------
      # With the floors above, the ONLY findings left in the binary were two in
      # github.com/docker/docker v27.1.1 (re-measured 2026-09-16, unchanged since
      # 2026-08-27):
      #   CVE-2026-33997 MEDIUM  Trivy wants "29.3.1"  (daemon plugin-install path)
      #   CVE-2025-54410 LOW     Trivy wants 25.0.13 / 28.0.0 (daemon firewalld path)
      # Upgrading is impossible: proxy.golang.org still returns v28.5.2+incompatible
      # as @latest for BOTH github.com/docker/docker and github.com/moby/moby, so v29
      # does not exist at this module path at all (it ships only as the split
      # github.com/moby/moby/{api,client} modules and pre-release moby/moby/v2
      # v2.0.0-beta.*, i.e. different import paths), and floating to v28.5.2 -- which
      # would clear only the LOW anyway -- breaks github.com/drone-runners/drone-runner-docker,
      # whose newest release v1.8.5 still calls the docker-25-era types.NetworkCreate.
      #
      # So we SEVER the dependency instead of fighting its version, the same play that
      # cleared this exact CVE from apps/coolify-helper. `go list -deps ./cmd/gitness`
      # shows the linked docker packages are ENTIRELY client-side -- api/types/*, api,
      # client, errdefs, pkg/stdcopy, internal/multierror -- so neither vulnerable
      # daemon code path is even in the binary; only the module label is. Those
      # packages are copied into a local module `github.com/harness/gitness/ddcompat`
      # and every `github.com/docker/docker/` import is rewritten to it, in gitness's
      # own tree AND in a local copy of drone-runner-docker (the only other module in
      # the build graph that imports docker/docker). Result: docker/docker is gone
      # from `go version -m`, and the binary scans 0.
      #
      # busybox-safe: `find -exec ... +`, never `xargs` (busybox xargs exits 123 when
      # the command matches nothing and `set -e` then kills the step silently).
      DD="github.com/harness/gitness/ddcompat"
      go mod download github.com/docker/docker github.com/drone-runners/drone-runner-docker
      DOCKER_DIR="$(go list -m -f '{{.Dir}}' github.com/docker/docker)"
      DRONE_DIR="$(go list -m -f '{{.Dir}}' github.com/drone-runners/drone-runner-docker)"

      rm -rf ddcompat && mkdir -p ddcompat/api ddcompat/pkg ddcompat/internal
      cp -r "$DOCKER_DIR/api/types"           ddcompat/api/types
      cp    "$DOCKER_DIR/api/"*.go            ddcompat/api/
      cp -r "$DOCKER_DIR/client"              ddcompat/client
      cp -r "$DOCKER_DIR/errdefs"             ddcompat/errdefs
      cp -r "$DOCKER_DIR/pkg/stdcopy"         ddcompat/pkg/stdcopy
      cp -r "$DOCKER_DIR/internal/multierror" ddcompat/internal/multierror
      cp    "$DOCKER_DIR/LICENSE" "$DOCKER_DIR/NOTICE" ddcompat/
      chmod -R u+w ddcompat
      find ddcompat -name '*_test.go' -type f -delete
      # Keep only the api/types subpackages the binary links. The daemon-side ones
      # (backend, build, ...) drag in pkg/streamformatter and moby/buildkit.
      KEEP="blkiodev checkpoint container events filters image mount network registry strslice swarm system time versions volume"
      for d in ddcompat/api/types/*/; do
        n="$(basename "$d")"
        case " $KEEP " in *" $n "*) ;; *) rm -rf "$d" ;; esac
      done
      # docker/docker ships NO go.mod (that is why it is +incompatible); vendor.mod is
      # its real require list. Seed ddcompat from it -- a bare module/go stub makes
      # `go mod tidy` resolve every missing dep at @latest, which picks go-connections
      # v0.8.1, and that release dropped sockets.DialPipe so client.go stops compiling.
      sed -e "s|^module .*|module ${DD}|" "$DOCKER_DIR/vendor.mod" > ddcompat/go.mod

      rewrite() { find "$1" -name '*.go' -type f -exec sed -i -e "s|github.com/docker/docker/|${DD}/|g" {} +; }
      rewrite ddcompat
      for d in app cli cmd infraprovider registry types; do rewrite "./$d"; done

      rm -rf third_party && mkdir -p third_party
      cp -r "$DRONE_DIR" third_party/drone-runner-docker
      chmod -R u+w third_party/drone-runner-docker
      rewrite third_party/drone-runner-docker
      ( cd third_party/drone-runner-docker
        go mod edit -droprequire github.com/docker/docker
        go mod edit -require "${DD}@v0.0.0" -replace "${DD}=../../ddcompat" )

      go mod edit -require "${DD}@v0.0.0" -replace "${DD}=./ddcompat"
      go mod edit -replace "github.com/drone-runners/drone-runner-docker=./third_party/drone-runner-docker"
      ( cd ddcompat && go mod tidy )
      ( cd third_party/drone-runner-docker && go mod tidy )
      go mod tidy
      # The sever is only real if docker/docker left the BINARY; assert that below,
      # next to the float assertion.
      V="${{package.version}}"
      MAJ="${V%%.*}"; REST="${V#*.}"; MIN="${REST%%.*}"; PAT="${REST#*.}"
      VERPKG="github.com/harness/gitness/version"
      # Mirror upstream's release ldflags (version.{major,minor,patch}+GitCommit) so
      # `gitness --version` reports the real release. No .git in the tarball, so
      # GitCommit is the release tag.
      go build -trimpath \
        -ldflags "-s -w -X ${VERPKG}.major=${MAJ} -X ${VERPKG}.minor=${MIN} -X ${VERPKG}.patch=${PAT} -X ${VERPKG}.GitCommit=v${V}" \
        -o "${{targets.destdir}}/usr/bin/gitness" ./cmd/gitness
      # The float is only real if it reached the BINARY. Every `dep`/`=>` line of
      # `go version -m` must be at or above its floor -- the `=>` line is what catches
      # a replace-shadowed float. Fail the build rather than ship it.
      bad="$(go version -m "${{targets.destdir}}/usr/bin/gitness" \
        | awk '$1 == "dep" || $1 == "=>" { print $2, $3 }' | below_floor gitness)"
      [ -z "$bad" ] || { echo "0-CVE float did not reach the binary:"; echo "$bad"; exit 1; }
      # Same discipline for the sever: github.com/docker/docker must not appear in the
      # shipped binary's module list at all.
      if go version -m "${{targets.destdir}}/usr/bin/gitness" \
           | awk '$1 == "dep" || $1 == "=>" { print $2 }' | grep -qx 'github.com/docker/docker'; then
        echo "sever failed: github.com/docker/docker is still linked into the binary"; exit 1
      fi
