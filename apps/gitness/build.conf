# Gitness (harness/gitness): self-hosted Git + CI/CD, from source via melange.
# Image-only (a server, no chart). NEWEST-ONLY: the single newest stable tag from
# github.com/harness/gitness (tags carry a "vX.Y.Z" prefix; the build stamps the
# bare X.Y.Z into version.{major,minor,patch}). Go backend that go:embeds a React
# web UI, so the frontend is (re)built with Node + yarn in the build sandbox first
# (see melange.yaml). The sqlite default DB driver (mattn/go-sqlite3) needs CGO, so
# unlike the other Go images this one is a CGO (glibc-dynamic) build.
#
# STATUS (2026-09-16): ZLIB-ONLY. Measured on the real local gate
# (`ARCHES=x86_64 PUSH=0 scripts/build-image.sh gitness 3.3.0`), full melange +
# apko + Trivy comprehensive, not reasoned about:
#
#   image.tar (wolfi)  Total: 1 (CRITICAL 0, HIGH 0, MEDIUM 1, LOW 0)
#     zlib CVE-2026-85091  installed 1.3.2.1_rc20260601-r0, fixed only in 1.3.3-r0
#   usr/bin/gitness (gobinary)  0
#
# zlib is the catalog-wide wall: Wolfi's secdb records the fix in 1.3.3-r0 and the
# newest zlib in the os repo is 1.3.2.1_rc20260601-r0 on BOTH x86_64 and aarch64,
# so there is nothing to install. Everything this recipe controls is clean.
#
# WHAT WAS FIXED TODAY -- github.com/docker/docker is gone from the binary.
# The previous BLOCKED note (docker/docker v27.1.1: CVE-2026-33997 MEDIUM +
# CVE-2025-54410 LOW) was re-measured first and was still accurate: the floated
# build produced exactly those two findings and nothing else. The version routes
# are still dead ends -- proxy.golang.org returns v28.5.2+incompatible as @latest
# for BOTH github.com/docker/docker and github.com/moby/moby (v29 exists only as
# the split moby/moby/{api,client} modules and pre-release moby/moby/v2
# v2.0.0-beta.*, different import paths), and v28 would clear only the LOW while
# breaking github.com/drone-runners/drone-runner-docker, whose newest release
# v1.8.5 still calls the docker-25-era types.NetworkCreate.
# So the dependency was SEVERED instead, the coolify-helper play. `go list -deps
# ./cmd/gitness` shows the linked docker packages are entirely client-side
# (api/types/*, api, client, errdefs, pkg/stdcopy, internal/multierror) -- neither
# vulnerable daemon path is even in the binary, only the module label was. Those
# packages are copied into a local module github.com/harness/gitness/ddcompat and
# every `github.com/docker/docker/` import is rewritten to it, in gitness's own
# tree and in a local copy of drone-runner-docker (the only other module in the
# graph that imports it). melange.yaml carries the implementation and a hard
# assertion that docker/docker does not appear in `go version -m` of the shipped
# binary.
#
# Only the x86_64 gate was run locally; the image cannot publish either way, and
# the sever is pure Go module surgery with no arch-specific code, so an emulated
# aarch64 run was not worth the hours. Run both arches before flipping BLOCKED=0.
# This image publishes the day Wolfi ships zlib 1.3.3-r0. Nothing else holds it.
BLOCKED=1   # zlib CVE-2026-85091: no fix in Wolfi (needs 1.3.3-r0) on either arch
FROM_SOURCE=1
VERSIONS=(3.3.0)
declare -A SHA256=(
  [3.3.0]=10779d3d480bcad1569f4e71664fd684e80da0984a1a184e3b0c2e0c97515dc6
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
