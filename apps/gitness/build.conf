# Gitness (harness/gitness): self-hosted Git + CI/CD, from source via melange.
# Image-only (a server, no chart). NEWEST-ONLY: the single newest stable tag from
# github.com/harness/gitness (tags carry a "vX.Y.Z" prefix; the build stamps the
# bare X.Y.Z into version.{major,minor,patch}). Go backend that go:embeds a React
# web UI, so the frontend is (re)built with Node + yarn in the build sandbox first
# (see melange.yaml). The sqlite default DB driver (mattn/go-sqlite3) needs CGO, so
# unlike the other Go images this one is a CGO (glibc-dynamic) build.
#
# STATUS (2026-08-27, re-tested against the real gate): BLOCKED=1, not published.
# Two things were wrong with the previous note. (1) The build did not even reach the
# scanner: the recipe's float line asked for x/crypto v0.55.0 with x/net v0.55.0, and
# x/crypto v0.55.0 REQUIRES x/net >= v0.57.0, so `go get` failed and melange aborted.
# (2) The residue was not what the note said. With the float set now in melange.yaml
# (x/net v0.58.0, x/mod v0.40.0, grpc v1.82.1, oras-go v2.6.2 and -- new, and a
# CRITICAL -- kin-openapi v0.144.0 for the GHSA-r277-6w6q-xmqw fail-open auth bypass),
# the x86_64 gate goes from 10 fixable findings to exactly 2, both in
# github.com/docker/docker v27.1.1 (gitness's own pin, linked from 11 gitspace/
# infraprovider/pipeline files):
#   CVE-2026-33997 MEDIUM  Trivy wants "29.3.1"
#   CVE-2025-54410 LOW     Trivy wants 25.0.13 / 28.0.0
# Neither is obtainable. v29 does not exist at this module path -- proxy.golang.org
# returns v28.5.2+incompatible as @latest for both github.com/docker/docker and
# github.com/moby/moby, and the v29 line ships only as the split moby/moby/{api,client}
# modules plus pre-release moby/moby/v2 v2.0.0-beta.*, i.e. different import paths.
# And floating to v28.5.2 (which would clear the LOW) breaks a THIRD-PARTY module:
# github.com/drone-runners/drone-runner-docker calls `types.NetworkCreate`, removed in
# docker 28 (engine/engine.go:95: undefined: types.NetworkCreate); its newest release
# v1.8.5 still requires docker v25.0.6, so there is nothing to bump to. Both routes
# are forks, which the CVE discipline forbids. Unblocks when gitness and
# drone-runner-docker move to moby v29.
BLOCKED=1   # github.com/docker/docker v27.1.1: CVE-2026-33997 fixed only in the renamed moby v29 module
FROM_SOURCE=1
VERSIONS=(3.3.0)
declare -A SHA256=(
  [3.3.0]=10779d3d480bcad1569f4e71664fd684e80da0984a1a184e3b0c2e0c97515dc6
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
