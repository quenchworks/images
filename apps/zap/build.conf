# zap (OWASP ZAP / Zed Attack Proxy): the upstream Linux distribution (prebuilt, arch-independent jars plus the
# bundled add-ons) on a hardened Wolfi JRE. Image only, no chart: it runs as a headless scanner or an API daemon.
# ZAP maintains one release line; ship latest only. The classes are Java 17 (major 61); Wolfi openjdk-21-jre runs
# them. Sized 2026-11-22 at 2.17.0: log4j 2.25.2 is swapped for 2.26.1, and commons-httpclient 3.1's CVE-2012-5783
# is VEXed (apps/zap/vex.openvex.json: the network add-on replaces that sender at start).
FROM_SOURCE=1
VERSIONS=(2.17.0)
declare -A SHA256=(
  [2.17.0]=efe799aaa3627db683b43f00c9c210aea0b75c00cc8f0a0f0434d12bb3ddde5a
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
