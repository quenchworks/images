# Builds the cert-manager acmesolver from source onto Wolfi. Static Go binary, no CGO.
# cert-manager's cmd/acmesolver is its own Go module (it `replace`s the parent repo to a
# local path), so the build runs from inside cmd/acmesolver. The version is stamped via -X
# into pkg/util.AppVersion so the component reports the real release. Output is a
# signed APK in Quenchworks' own repo. No upstream distro binaries.
package:
  name: quench-cert-manager-acmesolver
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened cert-manager acmesolver, built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-1.25

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/cert-manager/cert-manager/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      cd cmd/acmesolver
      go build -trimpath \
        -ldflags "-s -w -X github.com/cert-manager/cert-manager/pkg/util.AppVersion=v${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/acmesolver" .
