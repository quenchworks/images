# Packages PostgREST onto Wolfi. PostgREST is Haskell: a from-source build needs GHC
# + a large cabal dependency tree and is infeasible on a 2-core GitHub runner. Instead
# we ship PostgREST's OWN official prebuilt static binary from the GitHub release (the
# same upstream-artifact pattern clickhouse uses), then harden it on a minimal apko
# base and gate it 0-CVE with Trivy. This is clean-room-consistent: it is upstream's
# published artifact, not a Bitnami chart, and the scan still fully applies.
#
# The amd64 asset (linux-static-x86-64) is fully static (no libc); the arm64 asset
# (ubuntu-aarch64) is dynamically linked against glibc — so glibc is a runtime dep
# (a no-op on the static amd64 build, required on arm64).
package:
  name: quench-postgrest
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened PostgREST, packaged on Wolfi"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - glibc                # arm64 binary links glibc; amd64 is fully static (no-op)
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - curl
      - xz
      - ca-certificates-bundle

pipeline:
  # PostgREST publishes separate amd64/arm64 builds, so fetch the tarball matching the
  # build arch by uname -m (x86_64->linux-static-x86-64, aarch64->ubuntu-aarch64) with
  # the arch-matching sha256 — using the wrong arch yields a wrong-arch binary.
  - runs: |
      VER="${{package.version}}"
      case "$(uname -m)" in
        x86_64)  asset="linux-static-x86-64"; sha=__SHA_AMD__ ;;
        aarch64) asset="ubuntu-aarch64";      sha=__SHA_ARM__ ;;
        *) echo "unsupported arch $(uname -m)" >&2; exit 1 ;;
      esac

      url="https://github.com/PostgREST/postgrest/releases/download/v${VER}/postgrest-v${VER}-${asset}.tar.xz"
      curl -fsSL -o postgrest.tar.xz "$url"
      echo "${sha}  postgrest.tar.xz" | sha256sum -c -
      tar -xJf postgrest.tar.xz
      install -Dm0755 postgrest "${{targets.destdir}}/usr/bin/postgrest"

test:
  pipeline:
    - runs: |
        test -x /usr/bin/postgrest
        postgrest --version
