# STATUS 2026-09-16: 16.0 and 16.1 gate CLEAN on both arches. 14.16 is dropped.
# Run 35096838147 was read wrongly the first time: its run-level conclusion is
# "failure", but 5 of its 6 build jobs PASSED. The only failing leg was
# 14.16 aarch64, with one finding, zlib CVE-2026-85091. 14.16 x86_64 passed, and
# both 16.x lines passed on both arches.
#
# This workflow has a single global merge job rather than one per version, so
# that one walled leg was blocking two publishable lines from shipping at all.
# Upstream's aarch64 asset is `ubuntu-aarch64`, dynamically linked, and 14.16's
# drags in an apk zlib that the 16.x ones do not.
#
# 14.16 dropped for that reason, the same way grafana-alloy dropped 1.17.1. It
# can come back when Wolfi ships zlib 1.3.3-r0, which upstream madler/zlib has
# never tagged. Pinning back to Wolfi's 1.3.1-r51 is not a way out: it predates
# the 1.3.2-r0 fix for CVE-2026-27171.
# NOTE 2026-08-16: v14.17 is SKIPPED -- upstream ships no linux aarch64 static for
# it (x86-64 only), so it cannot be built multi-arch. The 14 line is now dropped
# entirely; see the STATUS block above. Window is 16.0 / 16.1.
# postgrest: image-only (a REST API server CLI, no chart). PostgREST is written in
# Haskell — compiling from source in CI is infeasible, so we ship upstream's OWN
# official prebuilt static binary from the GitHub release (the same upstream-artifact
# pattern clickhouse uses), then harden it on a minimal apko base and gate it 0-CVE
# with Trivy. Clean-room-consistent: it is upstream's published artifact.
#
# Latest patch of the last 3 minor lines (14, 13, 12). Tags are vX.Y[.Z]; the `v`
# is prepended in the fetch URI, so VERSIONS hold the bare version used as-is.
# Each release ships TWO linux assets we use, each with its own sha256:
#   linux-static-x86-64 -> amd64 (fully static, no libc)
#   ubuntu-aarch64       -> arm64 (dynamically linked, needs glibc)
#   __VER__     = version
#   __SHA_AMD__ = postgrest-v<VER>-linux-static-x86-64.tar.xz sha256
#   __SHA_ARM__ = postgrest-v<VER>-ubuntu-aarch64.tar.xz      sha256
BLOCKED=0
FROM_SOURCE=0
VERSIONS=(16.0 16.1)
declare -A SHA_AMD=(
  [16.0]=90c933c613dcf5c8bc2655a946539de77f52920914b70ca2200d285e64683a3e
  [16.1]=b986c926cf16a1c5d97954c57d3a6edd894a5da225c3f3fc0c25dc4105009dd7
)
declare -A SHA_ARM=(
  [16.0]=6ebc7be9697ff5b0a6e6ef88a5534bc96433eee069ed57283d503901d5b710f9
  [16.1]=90c801ef53671677d1c9bef4181579fe876c5a2b0c1ba51bb71ace4eebccc1c5
)
render() {
  echo "s/__VER__/$1/g; s|__SHA_AMD__|${SHA_AMD[$1]}|g; s|__SHA_ARM__|${SHA_ARM[$1]}|g"
}
