# sish (antoniomika/sish, MIT): self-hosted HTTP(S), WebSocket and TCP tunnels over plain SSH, an
# ngrok/serveo alternative where clients need only `ssh -R`. From source via melange: one static
# Go binary stamped with upstream's -X cmd.Version. LATEST-ONLY: upstream patches one line.
FROM_SOURCE=1
VERSIONS=(4.0.0)
declare -A SHA256=(
  [4.0.0]=493c126c6e9681ca5fc4beb7816e3943471e9635c2e39a718c9ffd986f9ed9d7
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
