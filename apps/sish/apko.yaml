# sish runtime: sish is the entrypoint; SSH on --ssh-address, HTTP on --http-address; keys under writable mounts.
# Nonroot 1001, so listen on ports above 1023 unless the pod grants NET_BIND_SERVICE.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-sish@local

accounts:
  groups:
    - groupname: sish
      gid: 1001
  users:
    - username: sish
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/bin/sish

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-sish"
  org.opencontainers.image.licenses: "MIT"
  org.opencontainers.image.version: "__VER__"
