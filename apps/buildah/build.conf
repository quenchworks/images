# buildah: Buildah, the daemonless OCI image builder, built from source on Wolfi
# and run rootless as uid 1001, the same setup as apps/podman. Image only, no
# chart.
# Lines: 1.45 and 1.44. The 1.43 line is HELD: the moby/buildkit v0.31.1 floor
# raises cyphar/filepath-securejoin to v0.6.0 (it removed OpenatInRoot, which
# 1.43.4's go.podman.io/storage v1.62.1 calls) and breaks go-dockerclient's use
# of archive.Uncompressed.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(1.44.1 1.45.2)
declare -A SHA=(
  [1.44.1]=ac022c60c84f0dd447f1982ae9e28e89d73892d0da24276fa6662cd1d045885e
  [1.45.2]=bcf85e76b9d1ce18a20efb32d330a624e7ee6fd368ae1da4ef0b17b0738615c9
)
render() { echo "s/__VER__/$1/g; s/__SHA256__/${SHA[$1]}/g"; }
