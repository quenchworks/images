# Builds buildah from source onto Wolfi with upstream's Linux build tags, minus
# btrfs (no btrfs headers) and gpgme (containers_image_openpgp verifies
# signatures in Go). The OCI runtime, netavark, the rootless storage driver and
# the uid mapping helpers come from Wolfi as runtime deps.
package:
  name: quench-buildah
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Buildah (rootless), built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - crun
      - netavark                     # looked up when creating a build container
      - containers-common
      - fuse-overlayfs
      - just-newuidmap-newgidmap
      - libseccomp

    # /etc/subuid and /etc/subgid are written below, as Wolfi's
    # rootlesskit-config-nonroot writes them, without pulling the rootlesskit
    # binary it depends on (3.2.0-r1 links x/net v0.58.0, CVE-2026-78669).
    replaces:
      - shadow-subids

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-1.27   # the rekor 1.5.5 floor raises go.mod to go 1.27
      - libseccomp-dev

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/containers/buildah/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      set -eu
      export CGO_ENABLED=1
      export GOTOOLCHAIN=local
      export GOFLAGS=-mod=mod
      # ---- 0-CVE module float (docs/go-module-float.md) ----------------------
      # FLOOR is a floor, not a pin: only modules below it are raised, and the
      # shipped binaries are asserted at or above it after the build. 1.44.1 and
      # 1.45.1 need only x/net.
      FLOOR="golang.org/x/net@v0.62.0 golang.org/x/text@v0.43.0 golang.org/x/crypto@v0.58.1-0.20261009181718-2f1f834330b2 golang.org/x/sys@v0.49.0 golang.org/x/mod@v0.41.0 golang.org/x/oauth2@v0.37.0 google.golang.org/grpc@v1.84.0 github.com/moby/buildkit@v0.31.1 github.com/moby/go-archive@v0.3.0 github.com/opencontainers/runc@v1.4.3 github.com/sigstore/fulcio@v1.8.7 go.opentelemetry.io/otel@v1.47.0 go.opentelemetry.io/otel/sdk@v1.47.0 go.opentelemetry.io/otel/trace@v1.47.0 go.opentelemetry.io/otel/metric@v1.47.0 github.com/klauspost/compress@v1.19.2 github.com/go-jose/go-jose/v4@v4.1.6 github.com/sigstore/rekor@v1.5.5 go.podman.io/image/v5@v5.41.2"
      MODS="$(echo "$FLOOR" | tr ' ' '\n' | cut -d@ -f1)"
      below_floor() {
        awk -v floor="$FLOOR" -v tag="$1" '
          BEGIN { n = split(floor, f, " ")
                  for (i = 1; i <= n; i++) { split(f[i], kv, "@"); want[kv[1]] = kv[2] } }
          ($1 in want) {
            split(substr($2, 2), g, "."); split(substr(want[$1], 2), w, ".")
            for (i = 1; i <= 3; i++) {
              if ((g[i] + 0) > (w[i] + 0)) next
              if ((g[i] + 0) < (w[i] + 0)) { print $1 "@" want[$1] " (" tag " has " $2 ")"; next }
            }
          }'
      }
      need="$(go list -m -e $MODS | awk 'NF >= 2 && $NF ~ /^v[0-9]/ { print $1, $NF }' | below_floor go.mod | awk '{ print $1 }')"
      if [ -n "$need" ]; then go get $need; fi
      go mod tidy
      rm -rf vendor
      TAGS="seccomp exclude_graphdriver_btrfs containers_image_openpgp"
      go build -trimpath -ldflags "-s -w" -tags "$TAGS" -o "${{targets.destdir}}/usr/bin/buildah" ./cmd/buildah
      # golang.org/x/crypto/openpgp (GO-2026-5932, deprecated, no fix) came in twice: the containers_image_openpgp
      # signing backend in go.podman.io/image/v5 before 5.41.0, and rekor's pki/pgp before 1.5.5 (which brings grpc
      # 1.84, otel 1.46, go 1.27). Both moved to ProtonMail/go-crypto.
      ! go version -m "${{targets.destdir}}/usr/bin/buildah" | grep -q 'golang.org/x/crypto/openpgp'
      for b in usr/bin/buildah; do
        bad="$(go version -m "${{targets.destdir}}/$b" \
          | awk '$1 == "dep" || $1 == "=>" { print $2, $3 }' | below_floor "$b")"
        [ -z "$bad" ] || { echo "0-CVE float did not reach $b:"; echo "$bad"; exit 1; }
      done
      "${{targets.destdir}}/usr/bin/buildah" --version | grep -F "buildah version ${{package.version}} "
      # containers-common's /etc/containers/storage.conf sets graphroot to the
      # rootful /var/lib/containers/storage, and containers/storage applies it to rootless
      # users too. The image points CONTAINERS_STORAGE_CONF here instead.
      install -d "${{targets.destdir}}/usr/share/quench-buildah"
      cat > "${{targets.destdir}}/usr/share/quench-buildah/storage.conf" <<'CONF'
      [storage]
      driver = "overlay"
      graphroot = "$HOME/.local/share/containers/storage"
      runroot = "$XDG_RUNTIME_DIR/containers"

      [storage.options.overlay]
      mount_program = "/usr/bin/fuse-overlayfs"
      CONF

  - name: Map the nonroot user's subordinate ids
    runs: |
      install -d "${{targets.destdir}}/etc"
      printf 'nonroot:100000:65536\n65532:100000:65536\n' > "${{targets.destdir}}/etc/subuid"
      printf 'nonroot:100000:65536\n65532:100000:65536\n' > "${{targets.destdir}}/etc/subgid"

  - name: Guard the docker/distribution VEX (registry/client and registry/proxy must not link)
    runs: |
      if grep -rlE 'docker/distribution/registry/(client|proxy)\.' "${{targets.destdir}}"; then
        echo "docker/distribution registry/client or registry/proxy is linked: CVE-2026-85747 applies, drop the VEX"; exit 1
      fi

test:
  pipeline:
    - runs: |
        buildah --version
