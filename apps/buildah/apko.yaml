# Assembles the rootless Buildah image. Nonroot uid 1001, multi-arch, SBOM by
# apko. Buildah maps its user namespace through /etc/subuid
# (rootlesskit-config-nonroot maps the user named nonroot, so uid 1001 carries
# that name). Storage lives under the home directory. Building in a pod needs it
# privileged (or seccomp and AppArmor unconfined plus /dev/fuse), and /var/tmp
# on an emptyDir: build contexts are overlaid there, and overlayfs refuses an
# upper directory on the container's own overlayfs. RUN steps use the host
# network: Wolfi has no passt for rootless networking.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-buildah@local

accounts:
  groups:
    - groupname: nonroot
      gid: 1001
  users:
    - username: nonroot
      uid: 1001
      gid: 1001
      homedir: /home/nonroot
  run-as: 1001

paths:
  # Wolfi ships newuidmap/newgidmap with no setuid bit and no file capability;
  # rootless Buildah needs one of them to write the subuid range.
  - path: /usr/bin/newuidmap
    type: permissions
    permissions: 0o4755
  - path: /usr/bin/newgidmap
    type: permissions
    permissions: 0o4755
  - path: /home/nonroot/.local/share/containers
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o755
  - path: /home/nonroot/.config/containers
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o755
  # apko creates missing parents root 0700, which uid 1001 cannot traverse.
  - path: /run/user
    type: directory
    uid: 0
    gid: 0
    permissions: 0o755
  - path: /run/user/1001
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o700
  # Last, so the parents created above end up owned by the user as well.
  - path: /home/nonroot
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o755
    recursive: true

environment:
  HOME: /home/nonroot
  USER: nonroot
  XDG_RUNTIME_DIR: /run/user/1001
  # Per-user storage; see the storage.conf note in melange.yaml.
  CONTAINERS_STORAGE_CONF: /usr/share/quench-buildah/storage.conf

work-dir: /home/nonroot

entrypoint:
  command: /usr/bin/buildah

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-buildah"
  org.opencontainers.image.licenses: "Apache-2.0"
