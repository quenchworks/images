# flyway: Flyway Community, versioned SQL database migrations, from the release tarball
# (without the bundled JRE) on a Wolfi openjdk-21-jre. Image only, no chart.
#
# 0-CVE: the stock 13.8.0 tarball carries 8 findings, all in two bundled JDBC drivers:
# databricks-jdbc 3.4.2 (shaded httpclient5, httpcore5, jackson-databind, lz4) and
# mssql-jdbc 12.10.2.jre11 (Trivy reads its pom as 12.10.2 against a fix named
# 12.10.2.jre11, the same release). melange.yaml swaps them to databricks-jdbc 3.4.3 and
# mssql-jdbc 13.6.0.jre11; the launcher's classpath uses directory wildcards, so the new
# names load. A local trivy rootfs of the result measured 0, and it applied migrations.
#
# NEWEST-ONLY: Flyway ships one supported line.
BLOCKED=0
FROM_SOURCE=0
VERSIONS=(13.8.0)
# sha256 of the release tarball, from a download
declare -A SHA256=(
  [13.8.0]=f773e5369c3e9c040e117835bc6f0cc310733195b58ab605f03acb3a415bbfa8
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
