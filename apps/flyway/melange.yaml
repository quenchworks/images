# Packages Flyway Community onto Wolfi from its release tarball, with the mssql JDBC
# driver replaced by a fixed release and the Databricks driver left out.
package:
  name: quench-flyway
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Flyway Community database migrations CLI, on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - openjdk-21-jre
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - curl

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/flyway/flyway/releases/download/flyway-${{package.version}}/flyway-commandline-${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      set -eu
      dest="${{targets.destdir}}/usr/lib/flyway"
      install -d "$dest"
      # the Java tree only: the bash launcher is replaced by the image's java entrypoint
      cp -a lib drivers conf licenses "$dest/"
      drivers="$dest/drivers"
      M=https://repo1.maven.org/maven2
      # swap <shipped jar> <maven path of the fixed jar> <its sha256, from a download>
      swap() {
        test -f "$drivers/$1" || { echo "FATAL: $1 not shipped; re-audit the swaps"; exit 1; }
        new="$(basename "$2")"
        curl -fsSL -o "$drivers/$new" "$M/$2"
        echo "$3  $drivers/$new" | sha256sum -c -
        rm -f "$drivers/$1"
      }
      # The Databricks driver is left out. Its newest release (3.4.3) shades jackson-databind
      # 2.18.9 under com/databricks/internal/, which has three advisories fixed in 2.18.10,
      # and a relocated copy cannot be patched by swapping classes. Add it back once
      # databricks-jdbc ships with jackson-databind 2.18.10 or later.
      ls "$drivers"/databricks-jdbc-*.jar >/dev/null || { echo "FATAL: no databricks-jdbc to drop; re-audit"; exit 1; }
      rm -f "$drivers"/databricks-jdbc-*.jar
      # Couchbase is left out the same way: core-io 3.12.3, the newest, shades jackson-databind
      # 2.21.6 under com/couchbase/client/core/deps/ (fixed in 2.21.7). The plugin jar goes
      # with the driver so Flyway never loads a database type whose classes are missing. Add
      # both back once core-io ships with jackson-databind 2.21.7 or later.
      ls "$drivers"/couchbase/core-io-*.jar "$dest"/lib/flyway/flyway-database-nc-couchbase-*.jar >/dev/null || { echo "FATAL: no couchbase driver to drop; re-audit"; exit 1; }
      rm -rf "$drivers/couchbase" "$dest"/lib/flyway/flyway-database-nc-couchbase-*.jar
      swap mssql-jdbc-12.10.2.jre11.jar com/microsoft/sqlserver/mssql-jdbc/13.6.0.jre11/mssql-jdbc-13.6.0.jre11.jar 4c566e4022c4dcf1489aeb639fe49a0f6ffae3d796fdc2f56b5b8882d4c3bf5a
      chmod -R a+rX "$dest"

test:
  pipeline:
    - runs: |
        test -f /usr/lib/flyway/lib/flyway/flyway-commandline-${{package.version}}.jar
