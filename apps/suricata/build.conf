# Suricata (OISF, GPL-2.0-only): network intrusion detection and prevention. Reads traffic from AF_PACKET or pcap
# files, matches it against signatures (Emerging Threats open rules via the bundled suricata-update) and writes alerts
# and protocol logs as EVE JSON. C with Rust parsers, from the release tarball, which vendors every crate (offline
# build). The Rust code links into the C binary as a static library, where cargo-auditable data does not survive, so
# the image ships the vendored Cargo.lock (/usr/share/doc/suricata/Cargo.lock) for scanners to read the crates.
# Two maintained lines: 8.0 and the 7.0 LTS.
FROM_SOURCE=1
VERSIONS=(7.0.17 8.0.8)
declare -A SHA256=(
  [7.0.17]=7821194eef72e9c2511577034c41a4ee0e6748a2cfae98b6ed80f149c4497780
  [8.0.8]=bb56bbaeb4da81b4c90e61148f93b789ea924412207388bc9cba0a7ac6a24a8f
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
