# Builds Emissary-ingress from source onto Wolfi: busyambassador (the Go multi-call binary:
# entrypoint, apiext, kubestatus) and a Python 3.13 venv with the ambassador and
# ambassador-diag packages built from the tarball. Envoy comes from Wolfi's envoy-1.37 in the
# image. Paths follow upstream's image: /opt/ambassador/{bin,emissary}, the version file
# under /buildroot, and the tool names linked into /usr/local/bin, which the entrypoint puts
# first on PATH to find diagd and envoy.
package:
  name: quench-emissary
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Emissary-ingress, built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - python-3.13            # the venv references the system interpreter
      - ca-certificates-bundle
      - glibc
      - libstdc++

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go
      - python-3.13
      - py3.13-pip

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/emissary-ingress/emissary/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - name: busyambassador (Go)
    runs: |
      set -eu
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      export GOTOOLCHAIN=local
      # 0-CVE FLOORS, not pins (docs/go-module-float.md); the same set as apps/emissary-apiext.
      FLOOR="golang.org/x/crypto@v0.56.0 golang.org/x/mod@v0.40.0 golang.org/x/net@v0.58.0 golang.org/x/text@v0.41.0 golang.org/x/sys@v0.47.0 google.golang.org/grpc@v1.83.2 github.com/go-git/go-git/v5@v5.19.2 github.com/go-git/go-billy/v5@v5.9.0 github.com/gorilla/websocket@v1.5.3 github.com/moby/spdystream@v0.5.1"
      # Go semver order (a release outranks its prereleases); busybox sort -V does not.
      vlt() { awk -v a="${1#v}" -v b="${2#v}" 'function pp(s,  p){sub(/\+.*/,"",s);p=index(s,"-");if(p){C=substr(s,1,p-1);P=substr(s,p+1)}else{C=s;P=""}} function cmp(x,y,  i,n,m,X,Y){n=split(x,X,".");m=split(y,Y,".");for(i=1;i<=n&&i<=m;i++){if(X[i]==Y[i])continue;if(X[i]~/^[0-9]+$/&&Y[i]~/^[0-9]+$/)return (X[i]+0<Y[i]+0)?-1:1;if(X[i]~/^[0-9]+$/)return -1;if(Y[i]~/^[0-9]+$/)return 1;return (X[i]<Y[i])?-1:1}return (n<m)?-1:(n>m)?1:0} BEGIN{pp(a);ca=C;pa=P;pp(b);cb=C;pb=P;c=cmp(ca,cb);if(c==0){if(pa==pb)c=0;else if(pa=="")c=1;else if(pb=="")c=-1;else c=cmp(pa,pb)}exit !(c<0)}'; }
      need=""
      for mv in $FLOOR; do
        have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${mv%@*}" 2>/dev/null)"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        vlt "$have" "${mv#*@}" && need="$need $mv"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || go get $need
      go mod tidy
      # vex.openvex.json holds only while no kubelet, volume, controller or admission
      # package of k8s.io/kubernetes is linked (busyambassador links API types and utils).
      if go list -deps ./cmd/busyambassador | grep -E '^k8s.io/kubernetes/(pkg/kubelet|pkg/volume|pkg/controller|plugin/pkg/admission)'; then
        echo "busyambassador now links vulnerable k8s.io/kubernetes code: re-check vex.openvex.json"; exit 1
      fi
      d="${{targets.destdir}}"
      install -d "$d/opt/ambassador/bin" "$d/usr/local/bin"
      go build -trimpath -ldflags "-s -w" -o "$d/opt/ambassador/bin/busyambassador" ./cmd/busyambassador
      for name in apiext entrypoint kubestatus; do ln -s busyambassador "$d/opt/ambassador/bin/$name"; done
  - name: diagd (Python venv)
    runs: |
      set -eu
      d="${{targets.destdir}}"
      VENV=/opt/ambassador/emissary
      # upstream's runtime pins (pyproject.toml [dependency-groups] runtime) as constraints,
      # each raised to its 0-CVE floor when it pins lower (orjson CVE-2025-67221, requests
      # CVE-2026-25645 at 4.1.0's pins). A pin already at or above its floor is kept.
      python3.13 - <<'PY' > /tmp/constraints.txt
      import tomllib
      floors = {"orjson": "3.11.6", "requests": "2.33.0"}
      key = lambda v: tuple(int(x) for x in v.split("."))
      for pin in tomllib.load(open("pyproject.toml", "rb"))["dependency-groups"]["runtime"]:
          name, ver = pin.split("==")
          if name in floors and key(ver) < key(floors[name]):
              ver = floors[name]
          print(f"{name}=={ver}")
      PY
      cat /tmp/constraints.txt
      # hatchling refuses a readme outside the package dir (readme = "../README.md")
      for p in ambassador ambassador-diag; do
        cp python/README.md "python/$p/README.md"
        sed -i 's|^readme = "../README.md"|readme = "README.md"|' "python/$p/pyproject.toml"
      done
      python3.13 -m venv "$VENV"
      "$VENV/bin/pip" install --no-cache-dir -c /tmp/constraints.txt ./python/ambassador ./python/ambassador-diag
      "$VENV/bin/python" -c "import ambassador, ambassador_diag.diagd; print('ambassador packages import')"
      SITE="$VENV/lib/python3.13/site-packages"
      if ls -d "$SITE"/*.libs 2>/dev/null | grep -q .; then echo "bundled native libs:"; ls -d "$SITE"/*.libs; exit 1; fi
      "$VENV/bin/pip" uninstall -y pip
      install -d "$d/opt/ambassador"
      cp -a "$VENV" "$d$VENV"
      ln -s ../emissary/bin/diagd "$d/opt/ambassador/bin/diagd"
      for name in apiext busyambassador diagd entrypoint kubestatus; do
        ln -s ../../../opt/ambassador/bin/$name "$d/usr/local/bin/$name"
      done
      ln -s /usr/bin/envoy "$d/usr/local/bin/envoy"
      install -d "$d/buildroot/ambassador/python"
      printf '%s\n%s\n' "${{package.version}}" "v${{package.version}}" > "$d/buildroot/ambassador/python/ambassador.version"
      chmod -R a+rX "$d/opt/ambassador"
