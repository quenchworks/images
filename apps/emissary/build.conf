# emissary (Emissary-ingress API gateway): from-source via melange, the Go
# busyambassador plus the Python control plane (diagd) from the tag tarball, on Wolfi Envoy
# 1.37 (upstream 4.1.0 ships stock Envoy 1.37.2; Wolfi envoy-1.37 is the same line). Newest
# line only for now: 3.x needs Emissary's own Envoy fork.
# STATUS 2026-11-01: BLOCKED (BLOCKED=0 -> 1), upstream-gated on the Wolfi envoy apk. The image
#   ships Wolfi's envoy-1.37 (1.37.1-r3), which carries CVE-2026-111497 (CRITICAL, bundled brotli decoder)
#   and on 1.38 CVE-2026-111943 (HIGH). Wolfi's secdb names 1.37.8-r0 / 1.38.6-r0 / 1.38.9-r1 as
#   the fixes, but the public APKINDEX (read 2026-11-01) still tops out at 1.37.1-r3 and 1.38.1-r0
#   (memory: Wolfi fix revisions are not always public). The Go floors (x/net 0.62.0, go-jose
#   4.1.6) are already in the recipe and ship with the next build. Unblock when the APKINDEX
#   carries an envoy revision at or past those fixes: move the pin, gate, dispatch.
BLOCKED=1
BLOCKED_BY=wolfi-envoy-apk
FROM_SOURCE=1
VERSIONS=(4.1.0)
declare -A SHA256=(
  [4.1.0]=b5e5bffdc7f27732924fd71ef4327f2231b4c7090385adf119860cdea8866831
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
