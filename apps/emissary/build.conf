# emissary (Emissary-ingress API gateway): from-source via melange, the Go busyambassador plus the Python control
# plane (diagd) from the tag tarball. Envoy comes from our from-source envoy image (apps/envoy), pinned by index
# digest per release below: 4.2.0 pairs with Envoy 1.40.2 (upstream CHANGELOG.md:32). Newest line only: 3.x needs
# Emissary's own Envoy fork.
# STATUS 2026-11-18: UNBLOCKED. Held from 2026-11-01 on Wolfi's frozen envoy-1.37 apk (CVE-2026-111497 CRITICAL with
#   no public fix revision). 4.2.0 moved to Envoy 1.40.2, the line apps/envoy builds from source (#71, #107).
FROM_SOURCE=1
VERSIONS=(4.2.0)
declare -A SHA256=(
  [4.2.0]=da4b1aab49820ee237c02a12d6411cab2e856b9cb7117e97444eeece153275d8
)
# index digest of ghcr.io/quenchworks/images/envoy at the Envoy line upstream pairs with
declare -A ENVOY_INDEX=(
  [4.2.0]=sha256:ec71c22ab4c46c7bbde1a82c4ec45d5e85c249763e1feb8d35c83dbbd22f9c2a  # envoy 1.40.2
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g; s|__ENVOY_INDEX__|${ENVOY_INDEX[$1]}|g"; }
