# Repackages Wolfi's own `gradle-9` apk with the bundled jackson patched, so the
# 0-CVE gate passes without waiting on a Wolfi rebuild. Wolfi's gradle-9 dist
# ships jackson-databind-2.18.8.jar under lib/ -> CVE-2026-54515 (MEDIUM, fixed
# in jackson 2.18.9). We install Wolfi's gradle tree verbatim from the build
# environment, then swap every bundled jackson-*-2.18.8.jar for the coordinated
# 2.18.9 release from Maven Central (sha256-pinned) and update Gradle's module
# descriptor sidecars (lib/<mod>.properties: alias.version + jarFile) so the
# launcher resolves the new jars. Clean-room-consistent: the gradle bits are
# Wolfi's, the jackson jars are Maven Central's official artifacts. The Trivy
# gate still applies in full.
#
# TEMPLATE NOTE: __VER__ (gradle X.Y.Z, the image tag), __GRADLEVER__ (the exact
# Wolfi gradle-9 apk pin), and __JDKVER__ (JDK LTS) are substituted by
# build.conf render() before the build.
package:
  name: quench-gradle
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Gradle, repackaged from Wolfi gradle-9 with jackson 2.18.9 (CVE-2026-54515 patched)"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - openjdk-__JDKVER__-default-jdk   # the full JDK gradle drives (java + javac)
      - busybox                          # /bin/sh + dirname/sed/tr/uname for the launcher
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - curl                             # fetch the fixed jackson jars from Maven Central
      - ca-certificates-bundle
      - gradle-9=__GRADLEVER__           # the exact Wolfi gradle dist we repackage

pipeline:
  - runs: |
      set -eux
      D="${{targets.destdir}}"
      # 1) Install Wolfi's gradle tree + launcher symlink verbatim.
      mkdir -p "$D/usr/share/java" "$D/usr/bin"
      cp -a /usr/share/java/gradle "$D/usr/share/java/gradle"
      cp -a /usr/bin/gradle "$D/usr/bin/gradle"
      LIB="$D/usr/share/java/gradle/lib"

      # 2) Swap each bundled jackson jar for the 2.18.9 coordinated release and
      #    rewrite its Gradle module descriptor so the launcher finds it.
      M=https://repo1.maven.org/maven2
      swap() {  # <artifact> <maven-group-path> <sha256>
        art="$1"; gpath="$2"; sha="$3"
        curl -fsSL -o "$LIB/${art}-2.18.9.jar" "$M/${gpath}/${art}/2.18.9/${art}-2.18.9.jar"
        echo "${sha}  $LIB/${art}-2.18.9.jar" | sha256sum -c -
        rm -f "$LIB/${art}-2.18.8.jar"
        sed -i -e 's/^alias\.version=2\.18\.8$/alias.version=2.18.9/' \
               -e "s/^jarFile=${art}-2\.18\.8\.jar$/jarFile=${art}-2.18.9.jar/" \
               "$LIB/${art}.properties"
      }
      swap jackson-annotations     com/fasterxml/jackson/core     798c85b86e7420d0b4eb91e7b3e37d4bee673c61de37a616ba51a7539631e6b7
      swap jackson-core            com/fasterxml/jackson/core     e03144f48c8d5307da2894570b4972aab8c72f22440f8dcdb745be2485ce2024
      swap jackson-databind        com/fasterxml/jackson/core     71595a3f7ff58344ec0496a9f9ec9f623ef7b85b45402d88f1ca261f1bc4b42c
      swap jackson-datatype-jdk8   com/fasterxml/jackson/datatype c0f2490297fd3d376e28eb3bdb58e8c99e4a079493f5dabd70cd0c7ab1713696
      swap jackson-datatype-jsr310 com/fasterxml/jackson/datatype 1b35df59d068f97e7b89e1cc2244644ffeadbf31aff970dc112fff0cabba8e9c

      # jackson-bom is jar-less (BOM alias); keep its recorded version consistent.
      sed -i 's/^alias\.version=2\.18\.8$/alias.version=2.18.9/' "$LIB/jackson-bom.properties"

      # 3) Gate the swap itself: no vulnerable jackson jar may remain.
      if ls "$LIB"/jackson-*-2.18.8.jar >/dev/null 2>&1; then
        echo "FATAL: a jackson-2.18.8 jar survived the swap"; exit 1
      fi
