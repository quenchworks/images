# gradle: the Gradle 9 line from Wolfi (FROM_SOURCE=0, apko-only, 0-CVE), on a full
# JDK. Latest 3 stable Gradle releases, each pinned to its exact apk; tag = X.Y.Z.
# The JDK gradle drives (openjdk-21) stays fixed.
FROM_SOURCE=0
VERSIONS=(9.5.1 9.6.0 9.6.1)
declare -A PIN=( [9.5.1]=9.5.1-r0 [9.6.0]=9.6.0-r0 [9.6.1]=9.6.1-r0 )
render() { echo "s|__PKG__|gradle-9=${PIN[$1]}|g; s/__JDKVER__/21/g"; }
