# gradle: Wolfi-packaged Gradle (gradle-N) layered on a fixed JDK 21.
# Only gradle-9 ships 0-CVE; Wolfi's gradle-8 package carries fixable HIGH CVEs
# (fails the hard 0-CVE gate), so it's excluded. VERSIONS = full X.Y.Z (as-is tag);
# PKG maps to gradle-N (apko.yaml's __PKG__); __JDKVER__ = fixed JDK major.
FROM_SOURCE=0
VERSIONS=(9.6.0)
declare -A PKG=(
  [9.6.0]=gradle-9
)
render() { echo "s|__PKG__|${PKG[$1]}|g; s/__JDKVER__/21/g"; }
