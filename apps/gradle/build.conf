# STATUS: UNBLOCKED 2026-09-20. The zlib block is gone: Wolfi shipped the fix
# for CVE-2026-85091 as zlib 1.3.2.1_rc20260601-r0 and the advisory was amended
# to name that version, so the 1.3.3-r0 this file used to wait for is a number
# that will never arrive. A stock wolfi-base scan reports the advisory as
# `zlib 1.3.2-r7 -> 1.3.2.1_rc20260601-r0`, which is what Wolfi publishes on
# both arches today. scripts/blocked.py now watches the shipped version.
#
# Evidence, stated exactly as measured:
#   x86_64  gated locally 2026-09-20, PUSH=0: 0 fixable CVEs AND the boot test
#           passed, so this is "runs", not just "scans clean".
#   aarch64 not measured locally; this host kills background melange builds and
#           a qemu-emulated arm build does not fit the foreground timeout. CI's
#           native arm64 runner is the first arm measurement, and its gate
#           refuses to publish on any finding.
# gradle: the Gradle 9 line, on a full JDK. tag = X.Y.Z. The JDK gradle drives
# (openjdk-21) stays fixed.
#
# 2026-07-09 UNBLOCKED: Wolfi's gradle-9=9.6.1-r2 still bundled the coordinated
# jackson 2.18.8 jars under lib/ -> jackson-databind-2.18.8.jar tripped
# CVE-2026-54515 (MEDIUM, fixed in jackson 2.18.9). Rather than stay blocked,
# melange.yaml repackages Wolfi's own gradle tree and swaps every bundled
# jackson-*-2.18.8.jar for the 2.18.9 coordinated release (sha256-pinned from
# Maven Central), updating Gradle's lib/<mod>.properties descriptors. FROM_SOURCE
# is a melange repackage; apko consumes quench-gradle@local.
#
# 2026-08-31: Wolfi HAS now rebuilt -- gradle-9 9.7.1-r0 bundles jackson 2.22.x --
# so the swap is now guarded on 2.18.8 actually being present and no-ops on 9.7.1
# (see the dated note at the top of melange.yaml: unguarded, it would have added
# 2.18.9 jars alongside the bundled 2.22 ones and step 3's 2.18.8-only check would
# still have said clean). The repackage layer is kept rather than reverted to a
# plain apko-only assembly because the CI workflow's melange steps are hard-coded;
# with the guard it is a verbatim repackage of Wolfi's tree and costs only a
# rebuild. Revert both together when someone wants the layer gone.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(9.8.0)
# test.sh takes its extra args from build-gradle.yml, which passes "${1%%.*} 21" rather
# than the version. Mirrored here so the local gate matches CI; passing the
# version instead fails an image that runs fine.
boot_args() { echo "${1%%.*} 21"; }
declare -A PIN=(
  [9.7.1]=9.7.1-r0
  [9.8.0]=9.8.0-r0
)
# render feeds BOTH apko.yaml and melange.yaml the same sed program:
#   __VER__      -> gradle X.Y.Z (image tag + melange package version)
#   __GRADLEVER__-> exact Wolfi gradle-9 apk pin (melange build env)
#   __JDKVER__   -> JDK LTS
render() { echo "s/__VER__/$1/g; s|__GRADLEVER__|${PIN[$1]}|g; s/__JDKVER__/21/g"; }
