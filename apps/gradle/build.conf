# JDK. Ship the latest CLEAN line only: bundled jackson-databind CVE-2026-54512 /
# 54513 / 54514 was fixed in gradle-9 9.6.1-r1, but Wolfi did NOT backport it to
# 9.6.0 or 9.5.1 (both still -r0 = fixable-but-unpublished, so they fail the 0-CVE
# gate). Those two lines are dropped until Wolfi ships their fixed apks. tag = X.Y.Z.
