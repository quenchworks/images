# gradle: the Gradle 9 line, on a full JDK. tag = X.Y.Z. The JDK gradle drives
# (openjdk-21) stays fixed.
#
# 2026-07-09 UNBLOCKED: Wolfi's gradle-9=9.6.1-r2 still bundles the coordinated
# jackson 2.18.8 jars under lib/ -> jackson-databind-2.18.8.jar trips
# CVE-2026-54515 (MEDIUM, fixed in jackson 2.18.9), and Wolfi has not rebuilt
# gradle-9 against the fix. Rather than stay blocked, melange.yaml now repackages
# Wolfi's own gradle tree and swaps every bundled jackson-*-2.18.8.jar for the
# 2.18.9 coordinated release (sha256-pinned from Maven Central), updating Gradle's
# lib/<mod>.properties descriptors. FROM_SOURCE flips to a melange repackage; apko
# consumes quench-gradle@local. Revert to the plain apko-only gradle-9 assembly
# once Wolfi ships a gradle-9 built against jackson >=2.18.9.
FROM_SOURCE=1
VERSIONS=(9.6.1)
declare -A PIN=( [9.6.1]=9.6.1-r2 )
# render feeds BOTH apko.yaml and melange.yaml the same sed program:
#   __VER__      -> gradle X.Y.Z (image tag + melange package version)
#   __GRADLEVER__-> exact Wolfi gradle-9 apk pin (melange build env)
#   __JDKVER__   -> JDK LTS
render() { echo "s/__VER__/$1/g; s|__GRADLEVER__|${PIN[$1]}|g; s/__JDKVER__/21/g"; }
