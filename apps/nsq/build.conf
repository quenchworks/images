# NSQ (nsqio): from-source via melange (Go build from the git tag tarball).
# Image-only (a messaging daemon suite, no chart). Ships the three core daemons
# nsqd / nsqlookupd / nsqadmin. NSQ tags on the last ~2-3 releases (1.2.0, 1.2.1,
# 1.3.0). Static Go binaries, CGO disabled. The release version is a hardcoded
# const in internal/version/binary.go, so `<bin> -version` already reports the
# real release with no -X stamping needed. Upstream tags carry a "v" prefix.
FROM_SOURCE=1
VERSIONS=(1.2.0 1.2.1 1.3.0)
declare -A SHA256=(
  [1.2.0]=98e24d748550f01dd8775e5e40f3ae657f5b513f875a15081cdcdc567b745480
  [1.2.1]=5fd252be4e9bf5bc0962e5b67ef5ec840895e73b1748fd0c1610fa4950cb9ee1
  [1.3.0]=c6289e295aaa40c8d9651de76e66bc9f23e7f5c40b1cc051ea5901965093e1f0
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
