# Builds NSQ (nsqio) from source onto Wolfi. Three static Go binaries, no CGO:
# nsqd (the daemon), nsqlookupd (discovery), nsqadmin (web UI, assets embedded via
# go:embed and shipped in the release tarball). Output is a signed APK in
# Quenchworks' own repo. No upstream distro binaries. The release version is a
# hardcoded const in internal/version/binary.go, so `-version` reports the real
# release without any -X stamping. A world-writable /data is created as the
# default nsqd --data-path (a mount point for a volume, so the rootfs stays
# read-only in production).
package:
  name: quench-nsq
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened NSQ (nsqd, nsqlookupd, nsqadmin), built from source on Wolfi"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/nsqio/nsq/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      for app in nsqd nsqlookupd nsqadmin; do
        go build -trimpath -ldflags "-s -w" \
          -o "${{targets.destdir}}/usr/bin/$app" ./apps/$app
      done
      install -d -m 0777 "${{targets.destdir}}/data"
