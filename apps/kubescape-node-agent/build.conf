# kubescape-node-agent: built from source from the kubescape/node-agent tag (2026-10-08), one of the Kubescape
# Operator's components. Upstream ships continuous v0.x releases; ship the newest.
# 2026-10-08: ships /root/tracers.tar (the 19 Inspektor Gadget images node-agent loads, built from source:
# ig v0.48.1 + `ig image build --local` with Wolfi clang-18 and libbpf v1.3.0 headers, matching ig v0.48.1 gadget-builder: clang 21 output failed the kernel verifier) and /root/.ig/config.yaml with WORKDIR /root,
# as upstream does; without them it died in kind on "open /tracers.tar". Trivy does not look inside
# tracers.tar (eBPF objects + WASM modules from IG gadget sources); the test asserts its index.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(0.3.273)
declare -A SHA256=(
  [0.3.273]=8e1c5de52f28aa20aae2496ce016e28033e87926d8f62c8319798826c8b1ba1a
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
