# Kubescape node-agent, built from the kubescape/node-agent tag with the floor pass (otel train from apps/kubescape).
package:
  name: quench-kubescape-node-agent
  version: __VER__
  epoch: 0
  description: "Quenchworks Kubescape node-agent"
  copyright:
    - license: Apache-2.0

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-1.27
      - curl
      - clang-18
      - llvm-18
      - linux-headers

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/kubescape/node-agent/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      set -eu
      export CGO_ENABLED=0 GOFLAGS=-mod=mod GOTOOLCHAIN=local GOWORK=off
      # x/* and grpc sit at what the 1.47.0 otel train requires (go get takes exact versions).
      # otel floats as ONE train at 1.47.0: the sdk/log fix (CVE-2026-81872) needs otel/log 0.21+,
      # which dropped log.Value, so otelslog and uptrace's otelutil/otelzap must move to the
      # releases built against it (otelslog 0.21.0, otelutil 0.4.0), and those require 1.47.0.
      # The CLI's trivy/cilium/containerd/x/image floors are left out: raising them broke this
      # component's build (moby/moby split, k8s skew); its own scan decides what moves.
      # Its scan (run 37738108826) flagged cilium 1.17.16 and containerd 1.7.33: same-line patches.
      # otlploggrpc and kubescape/go-logger move with the train (0.19.0 / v0.0.32 used the removed log API).
      FLOOR="github.com/moby/sys/user@v0.4.1 golang.org/x/crypto@v0.58.1-0.20261009181718-2f1f834330b2 golang.org/x/net@v0.62.0 golang.org/x/text@v0.43.0 golang.org/x/term@v0.47.0 golang.org/x/mod@v0.41.0 golang.org/x/sys@v0.49.0 google.golang.org/grpc@v1.84.0 go.opentelemetry.io/otel@v1.47.0 go.opentelemetry.io/otel/metric@v1.47.0 go.opentelemetry.io/otel/trace@v1.47.0 go.opentelemetry.io/otel/sdk@v1.47.0 go.opentelemetry.io/otel/sdk/metric@v1.47.0 go.opentelemetry.io/otel/log@v1.47.0 go.opentelemetry.io/otel/sdk/log@v1.47.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.47.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.47.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.47.0 go.opentelemetry.io/otel/exporters/otlp/otlpmetric/otlpmetricgrpc@v1.47.0 go.opentelemetry.io/otel/exporters/otlp/otlpmetric/otlpmetrichttp@v1.47.0 go.opentelemetry.io/otel/exporters/stdout/stdouttrace@v1.47.0 go.opentelemetry.io/otel/exporters/otlp/otlplog/otlploghttp@v0.23.0 go.opentelemetry.io/contrib/bridges/otelslog@v0.21.0 go.opentelemetry.io/contrib/instrumentation/net/http/otelhttp@v0.72.0 go.opentelemetry.io/contrib/instrumentation/google.golang.org/grpc/otelgrpc@v0.72.0 go.opentelemetry.io/contrib/instrumentation/runtime@v0.72.0 go.opentelemetry.io/contrib/instrumentation/net/http/httptrace/otelhttptrace@v0.72.0 go.opentelemetry.io/contrib/processors/minsev@v0.17.0 go.opentelemetry.io/contrib/detectors/gcp@v1.47.0 github.com/uptrace/uptrace-go@v1.47.0 github.com/uptrace/opentelemetry-go-extra/otelutil@v0.4.0 github.com/uptrace/opentelemetry-go-extra/otelzap@v0.4.0 go.opentelemetry.io/otel/exporters/otlp/otlplog/otlploggrpc@v0.23.0 github.com/kubescape/go-logger@v0.0.35 github.com/cilium/cilium@v1.17.17 github.com/containerd/containerd@v1.7.36 github.com/go-jose/go-jose/v4@v4.1.6"
      # Go semver order (a release outranks its prereleases); busybox sort -V does not.
      vlt() { awk -v a="${1#v}" -v b="${2#v}" 'function pp(s,  p){sub(/\+.*/,"",s);p=index(s,"-");if(p){C=substr(s,1,p-1);P=substr(s,p+1)}else{C=s;P=""}} function cmp(x,y,  i,n,m,X,Y){n=split(x,X,".");m=split(y,Y,".");for(i=1;i<=n&&i<=m;i++){if(X[i]==Y[i])continue;if(X[i]~/^[0-9]+$/&&Y[i]~/^[0-9]+$/)return (X[i]+0<Y[i]+0)?-1:1;if(X[i]~/^[0-9]+$/)return -1;if(Y[i]~/^[0-9]+$/)return 1;return (X[i]<Y[i])?-1:1}return (n<m)?-1:(n>m)?1:0} BEGIN{pp(a);ca=C;pa=P;pp(b);cb=C;pb=P;c=cmp(ca,cb);if(c==0){if(pa==pb)c=0;else if(pa=="")c=1;else if(pb=="")c=-1;else c=cmp(pa,pb)}exit !(c<0)}'; }
      # FLOORS, not pins: raise a module only where go.mod has it below the floor.
      need=""
      for mv in $FLOOR; do
        have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${mv%@*}" 2>/dev/null)"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        vlt "$have" "${mv#*@}" && need="$need $mv"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || go get $need
      # go.mod replaces containerd/v2 with v2.2.0 (it requires 2.4.1). A go get floor follows the
      # replace and downgrades the tree, so move the replace within its line: 2.2.10 closes
      # CVE-2026-46680, -53488, -53489, -53492, -53493, -53495, -95837 and -95838.
      grep -q '^replace github.com/containerd/containerd/v2 => github.com/containerd/containerd/v2 v2.2.0$' go.mod
      go mod edit -replace=github.com/containerd/containerd/v2=github.com/containerd/containerd/v2@v2.2.10
      # containerd 2.2.x builds against runtime-spec 1.3 (Pids.Limit is a pointer); go.mod replaces it with 1.2.1.
      grep -q '^replace github.com/opencontainers/runtime-spec => github.com/opencontainers/runtime-spec v1.2.1$' go.mod
      go mod edit -replace=github.com/opencontainers/runtime-spec=github.com/opencontainers/runtime-spec@v1.3.0
      # containerd v1.7.36 (still in the graph) has exactly one 1.2-only line, WithPidsLimit assigning
      # an int64 to Pids.Limit; a local copy takes its address, which is what 2.x does.
      CD1="$(go mod download -json github.com/containerd/containerd@v1.7.36 | sed -n 's/.*"Dir": "\(.*\)",/\1/p')"
      cp -r "$CD1" "$PWD/.containerd-v1" && chmod -R u+w "$PWD/.containerd-v1"
      f="$PWD/.containerd-v1/oci/spec_opts.go"
      grep -q '^		s.Linux.Resources.Pids.Limit = limit$' "$f"
      sed -i 's/^		s.Linux.Resources.Pids.Limit = limit$/		s.Linux.Resources.Pids.Limit = \&limit/' "$f"
      go mod edit -replace=github.com/containerd/containerd="$PWD/.containerd-v1"
      go mod tidy
      B="${{targets.destdir}}/usr/bin"
      mkdir -p "$B"
      # github.com/docker/docker v28.5.2+incompatible carries CVE-2026-33997 (the daemon's
      # plugin install); its fix exists only on the moby/moby path. Record which docker/docker
      # packages each binary links, and fail if any daemon, plugin or API server code is one.
      for p in ./cmd ./cmd/sbom-scanner; do
        echo "docker/docker packages linked by $p:"; go list -deps "$p" | grep -E '^github.com/(docker/docker|moby/moby)/' || true
        if go list -deps "$p" | grep -E '^github.com/(docker/docker|moby/moby)/(daemon|plugin|api/server|pkg/authorization)'; then
          echo "$p links Docker daemon code: CVE-2026-33997 applies"; exit 1
        fi
      done
      go build -buildvcs=false -trimpath -ldflags "-s -w" -o "$B/node-agent" ./cmd
      go build -buildvcs=false -trimpath -ldflags "-s -w" -o "$B/sbom-scanner" ./cmd/sbom-scanner
      v="$(go version -m "$B/node-agent" | awk '$2 == "golang.org/x/sys" { print $3 }')"
      [ -z "$v" ] || ! vlt "$v" v0.47.0 || { echo "FATAL: links golang.org/x/sys $v"; exit 1; }

  - runs: |
      set -eu
      # tracers.tar: the Inspektor Gadget images node-agent loads at startup (upstream Makefile
      # `gadgets` target + build/Dockerfile: /root/tracers.tar, /root/.ig/config.yaml, WORKDIR /root).
      # Everything is built here from source instead of pulling ghcr.io/inspektor-gadget images:
      # `ig` itself from the IG v0.48.1 tag (the version upstream installs), then every gadget with
      # `ig image build --local` (Wolfi clang/llvm, libbpf and kernel headers; the Go WASM parts
      # with this Go), then `ig image export`, exactly as upstream names and tags them.
      export GOTOOLCHAIN=local GOWORK=off
      IGV=v0.57.0
      IGSHA=1eee07549f718a12e0840f771217f817611a650a603169ad1a8d2b70185df420
      W="$PWD/.igbuild"; mkdir -p "$W"
      curl -fsSL -o "$W/ig.tgz" "https://github.com/inspektor-gadget/inspektor-gadget/archive/refs/tags/$IGV.tar.gz"
      echo "$IGSHA  $W/ig.tgz" | sha256sum -c -
      tar -xzf "$W/ig.tgz" -C "$W"
      IG_SRC="$W/inspektor-gadget-${IGV#v}"
      # ig keeps its image store at a fixed /var/lib/ig/oci-store, which the unprivileged build
      # user cannot create; this ig is a build tool only (not shipped), so point it at the workspace.
      grep -q '"/var/lib/ig/oci-store"' "$IG_SRC/pkg/oci/oci.go"
      sed -i "s|\"/var/lib/ig/oci-store\"|\"$W/oci-store\"|" "$IG_SRC/pkg/oci/oci.go"
      (cd "$IG_SRC" && CGO_ENABLED=0 GOFLAGS=-mod=mod GOTOOLCHAIN=local go build -trimpath -tags netgo \
        -ldflags "-X github.com/inspektor-gadget/inspektor-gadget/internal/version.version=$IGV" \
        -o "$W/ig" ./cmd/ig)
      IG="$W/ig"
      # Match ig v0.57.0's gadget builder (Dockerfiles/gadget-builder.Dockerfile): clang/LLVM 18
      # and libbpf v1.3.0 headers. Verifier complexity follows the compiler's output: built with
      # clang 21, trace_exec and trace_open hit the 1M-instruction limit in kind (charts run
      # 37777056908) while upstream's clang-18 builds load.
      grep -q '^ARG CLANG_LLVM_VERSION=18$' "$IG_SRC/Dockerfiles/gadget-builder.Dockerfile"
      grep -q '^ARG LIBBPF_VERSION=v1.3.0$' "$IG_SRC/Dockerfiles/gadget-builder.Dockerfile"
      CL="$(command -v clang-18 || ls /usr/lib/llvm-18/bin/clang 2>/dev/null || true)"
      ST="$(command -v llvm-strip-18 || ls /usr/lib/llvm-18/bin/llvm-strip 2>/dev/null || true)"
      [ -n "$CL" ] && [ -n "$ST" ] || { echo "clang-18/llvm-strip-18 not found"; ls /usr/lib/llvm*/bin | head -50; exit 1; }
      "$CL" --version | grep -q 'clang version 18\.' || { "$CL" --version; echo "not clang 18"; exit 1; }
      curl -fsSL -o "$W/libbpf.tgz" https://github.com/libbpf/libbpf/archive/refs/tags/v1.3.0.tar.gz
      echo "11db86acd627e468bc48b7258c1130aba41a12c4d364f78e184fd2f5a913d861  $W/libbpf.tgz" | sha256sum -c -
      tar -xzf "$W/libbpf.tgz" -C "$W"
      mkdir -p "$W/inc/bpf"
      # the set libbpf's `make install_headers` installs
      for h in bpf.h libbpf.h btf.h libbpf_common.h libbpf_legacy.h bpf_helpers.h bpf_helper_defs.h \
               bpf_tracing.h bpf_endian.h bpf_core_read.h skel_internal.h libbpf_version.h usdt.bpf.h; do
        cp "$W/libbpf-1.3.0/src/$h" "$W/inc/bpf/"
      done
      # ig (since v0.5x) runs `clang` and `llvm-strip` from PATH with the builder image's
      # include layout hardcoded (-I /usr/include/gadget/<arch>/). Wrappers first on PATH map
      # that to the source tree and add the libbpf headers, using clang-18 and its llvm-strip.
      mkdir -p "$W/bin"
      printf '%s\n' '#!/bin/sh' "IGS='$IG_SRC'" 'n=$#; i=0' \
        'while [ $i -lt $n ]; do a=$1; shift; case $a in /usr/include/gadget/*) a="$IGS/include/gadget/${a#/usr/include/gadget/}";; esac; set -- "$@" "$a"; i=$((i+1)); done' \
        "exec '$CL' -I'$W/inc' -I'$IG_SRC/include' \"\$@\"" > "$W/bin/clang"
      printf '%s\n' '#!/bin/sh' "exec '$ST' \"\$@\"" > "$W/bin/llvm-strip"
      chmod +x "$W/bin/clang" "$W/bin/llvm-strip"
      export PATH="$W/bin:$PATH"
      build() {  # <source dir> <image ref>
        echo "building gadget $2 from $1"
        (cd "$1" && "$IG" image build --local -t "$2" .)
      }
      UPSTREAM="advise_seccomp trace_capabilities trace_dns trace_exec"
      BUILT="trace_open"
      KUBESCAPE="bpf exit fork hardlink http iouring_new iouring_old kmod network ptrace randomx ssh symlink unshare"
      # The lists must match upstream's Makefile, or node-agent asks for an image tracers.tar lacks.
      grep -q "^GADGETS=$UPSTREAM\$" Makefile && grep -q "^BUILT_GADGETS=$BUILT\$" Makefile \
        && grep -q "^KUBESCAPE_GADGETS=$KUBESCAPE\$" Makefile && grep -q "^VERSION=$IGV\$" Makefile \
        || { echo "upstream Makefile gadget lists changed; update this recipe"; grep -E '^(GADGETS|BUILT_GADGETS|KUBESCAPE_GADGETS|VERSION)=' Makefile; exit 1; }
      refs=""
      for g in $UPSTREAM; do build "$IG_SRC/gadgets/$g" "ghcr.io/inspektor-gadget/gadget/$g:$IGV"; refs="$refs ghcr.io/inspektor-gadget/gadget/$g:$IGV"; done
      for g in $BUILT; do build "pkg/ebpf/gadgets/$g" "ghcr.io/inspektor-gadget/gadget/$g:$IGV"; refs="$refs ghcr.io/inspektor-gadget/gadget/$g:$IGV"; done
      for g in $KUBESCAPE; do build "pkg/ebpf/gadgets/$g" "$g:latest"; refs="$refs $g:latest"; done
      "$IG" image list
      "$IG" image export $refs "$W/tracers.tar"
      install -Dm644 "$W/tracers.tar" "${{targets.destdir}}/root/tracers.tar"
      install -Dm644 configuration/ig-config.yaml "${{targets.destdir}}/root/.ig/config.yaml"
      n="$(tar -tf "$W/tracers.tar" | grep -c '^blobs/sha256/' || true)"
      echo "tracers.tar: $(du -h "$W/tracers.tar" | cut -f1), $n blobs"
      [ "$n" -gt 0 ] || { echo "tracers.tar has no blobs"; exit 1; }

test:
  pipeline:
    - runs: |
        test -x /usr/bin/node-agent
        test -x /usr/bin/sbom-scanner
        test -s /root/tracers.tar
        test -s /root/.ig/config.yaml
