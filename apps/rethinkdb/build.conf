# rethinkdb: RethinkDB, the realtime document database with changefeeds.
# APKO-ONLY: Wolfi builds rethinkdb from source; its 2.4.4-r15 scanned 0 findings
# (comprehensive mode) on 2026-09-26, so apko assembles the image from the
# pinned apk. Image and chart.
#
# NEWEST-ONLY: upstream maintains one line (2.4).
BLOCKED=0
FROM_SOURCE=0
VERSIONS=(2.4.4)
declare -A PIN=(
  [2.4.4]=2.4.4-r15
)
render() { echo "s|__PKG__|rethinkdb=${PIN[$1]}|g"; }
