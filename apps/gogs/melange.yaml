# Builds Gogs from the release tag tarball onto Wolfi. The templates, public assets and
# default config are embedded with go:embed, so the binary is the whole app; the version
# is a constant in gogs.go.
package:
  name: quench-gogs
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Gogs, the self-hosted Git service, built from source on Wolfi"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
      - git              # every repository operation shells out to git
      - bash             # the server-side hooks Gogs writes run under bash (SCRIPT_TYPE)
      - busybox          # /bin/sh (git runs local-transport commands through it) and
                         # /usr/bin/env (the hook shebang is #!/usr/bin/env bash)
      - openssh-keygen   # the built-in SSH server generates its host keys with ssh-keygen

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/gogs/gogs/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      set -eu
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      export GO111MODULE=on
      export GOTOOLCHAIN=local
      # ---- 0-CVE module float (docs/go-module-float.md) ----------------------
      # FLOOR is a FLOOR, not a pin: only modules below it are floated, and the shipped
      # binary is asserted to carry nothing below it. Measured 2026-09-25 on 0.14.3:
      # pgx v5.6.0, go-ntlmssp (2022 pseudo-version), x/crypto v0.45.0, x/net v0.47.0,
      # x/text v0.31.0, x/mod v0.29.0, x/sys v0.38.0. The x set moves as one coherent
      # set. Gogs' go.mod declares no `replace` directives.
      FLOOR="github.com/jackc/pgx/v5@v5.9.2 github.com/Azure/go-ntlmssp@v0.1.1 golang.org/x/crypto@v0.56.0 golang.org/x/net@v0.58.0 golang.org/x/text@v0.41.0 golang.org/x/sys@v0.47.0 golang.org/x/mod@v0.40.0 golang.org/x/sync@v0.22.0"
      MODS="$(echo "$FLOOR" | tr ' ' '\n' | cut -d@ -f1)"
      below_floor() {
        awk -v floor="$FLOOR" -v tag="$1" '
          BEGIN { n = split(floor, f, " ")
                  for (i = 1; i <= n; i++) { split(f[i], kv, "@"); want[kv[1]] = kv[2] } }
          ($1 in want) {
            split(substr($2, 2), g, "."); split(substr(want[$1], 2), w, ".")
            for (i = 1; i <= 3; i++) {
              if ((g[i] + 0) > (w[i] + 0)) next
              if ((g[i] + 0) < (w[i] + 0)) { print $1 "@" want[$1] " (" tag " has " $2 ")"; next }
            }
          }'
      }
      go list -m -e $MODS
      need="$(go list -m -e $MODS | awk 'NF >= 2 && $NF ~ /^v[0-9]/ { print $1, $NF }' | below_floor go.mod | awk '{ print $1 }')"
      if [ -n "$need" ]; then go get $need; fi
      go mod tidy
      go build -trimpath -ldflags "-s -w" -o "${{targets.destdir}}/usr/bin/gogs" .
      bad="$(go version -m "${{targets.destdir}}/usr/bin/gogs" \
        | awk '$1 == "dep" || $1 == "=>" { print $2, $3 }' | below_floor gogs)"
      [ -z "$bad" ] || { echo "❌ 0-CVE float did not reach gogs:"; echo "$bad"; exit 1; }

test:
  pipeline:
    - runs: |
        gogs --version | grep -F "${{package.version}}"
