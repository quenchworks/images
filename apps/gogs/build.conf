# gogs: Gogs, the painless self-hosted Git service (web UI, issues, pull requests, wikis,
# webhooks, built-in SSH), built from source. One static Go binary with its templates and
# assets embedded; pure-Go SQLite, so no CGO.
#
# 0-CVE: melange.yaml floats pgx, go-ntlmssp and the coherent golang.org/x set (measured
# 2026-09-25 on 0.14.3: 14 findings, 0 after the float).
#
# NEWEST-ONLY: 0.13.4 carries Gogs' own advisories (fixed only in 0.14.x, several
# critical), and 0.12 is older still.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(0.14.3)
declare -A SHA256=(
  [0.14.3]=a2c8154974b0cee30346e1a63faa2da4e5bbc813f700f10edfbcf722135b51cf
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
