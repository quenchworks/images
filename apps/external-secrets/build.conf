# external-secrets (External Secrets Operator): from-source via melange (Go build
# from the git tag tarball). Latest patch of the last 3 minor lines (2.5, 2.6, 2.7).
# Single static Go binary (the controller manager; the chart drives the webhook and
# cert-controller via subcommands of the same binary), no CGO. Built with the
# `all_providers` build tag so every secret backend is compiled in, matching upstream.
# Upstream does not stamp a version into the controller, so none is injected.
FROM_SOURCE=1
VERSIONS=(2.7.0)
declare -A SHA256=(
  [2.7.0]=9d466e04ff1aa7fbfba5a814e5849dee7dc0c8a977ef07fdc6ca2721a19dd2e2
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
