# external-secrets (External Secrets Operator): from-source via melange (Go build
# from the git tag tarball). Latest patch of the last 3 minor lines (2.5, 2.6, 2.7).
# Single static Go binary (the controller manager; the chart drives the webhook and
# cert-controller via subcommands of the same binary), no CGO. Built with the
# `all_providers` build tag so every secret backend is compiled in, matching upstream.
# Upstream does not stamp a version into the controller, so none is injected.
FROM_SOURCE=1
VERSIONS=(2.11.0 2.13.0 2.14.0 2.15.0)
declare -A SHA256=(
  [2.11.0]=d86472e6de91c532100e02a63d0bffb3b22a47618383407a68383aff86289baf
  [2.13.0]=df417a72c63b496bec5b48556e5f9d5dbfb83a52bd18adc14316ea03e020820c
  [2.14.0]=b56ec63c6991a4ed17741f68058dab857eeff1529c992947f87459afceb06aa6
  [2.15.0]=3307c2ca512cf426722cb164de21baead7630f531fd13aee952aceb0f295e185
)
# Go line per release, from its go.mod (2.13.0 declares go 1.27.2, 2.14.0 go 1.27.0 / toolchain 1.27.3; 2.11/2.12 go 1.26.6).
declare -A GO=( [2.11.0]=1.26 [2.13.0]=1.27 [2.14.0]=1.27 [2.15.0]=1.27 )
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g; s|__GO__|${GO[$1]}|g"; }
