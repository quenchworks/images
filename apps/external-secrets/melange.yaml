# Builds the External Secrets Operator from source onto Wolfi. Single static Go
# binary, no CGO. The repo is a multi-module workspace (root go.mod `replace`s the
# apis/providers/generators submodules to local paths), so a plain `go build .` from
# the extracted root produces the full controller manager. The `all_providers` build
# tag (upstream default) compiles in every secret backend via pkg/register. The same
# binary serves the controller, webhook, and cert-controller (selected by subcommand
# in the chart). ESO requires Go 1.26, so the build pins go-1.26. Output is a signed
# APK in Quenchworks' own repo. No upstream distro binaries.
package:
  name: quench-external-secrets
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened External Secrets Operator, built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-1.26

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/external-secrets/external-secrets/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      export GOTOOLCHAIN=local      # use the installed go-1.26, do not fetch go.mod's directive
      export GO111MODULE=on
      # 0-CVE gate: minimal same-major bumps of indirect modules pulled in via the
      # replaced provider/generator submodules.
      #   go-ntlmssp   v0.0.0-2022... -> v0.1.1   clears CVE-2026-32952 (NTLM DoS).
      #   mongo-driver v1.17.6        -> v1.17.7  clears CVE-2026-2303.
      # Both are indirect utility libs; `go mod tidy` reconciles the workspace graph.
      #   x/text       v0.38.0            -> v0.39.0  clears CVE-2026-56852.
      #   cel-go       v0.26.1            -> v0.29.2  clears GHSA-gcjh-h69q-9w9g
      #     (MEDIUM: json:"-" fields readable from user CEL expressions; first fixed
      #     release is 0.29.0). Indirect, reached only through k8s.io/apiserver's CEL
      #     libs, which are source-compatible with 0.29.
      # 0-CVE FLOORS, not pins (docs/go-module-float.md): raise a module only where go.mod has it
      # below the floor; a module absent from the graph is skipped. Bare `go get` pins downgraded
      # newer upstream releases (found 2026-10-05).
      FLOOR="github.com/Azure/go-ntlmssp@v0.1.1 go.mongodb.org/mongo-driver@v1.17.7 golang.org/x/text@v0.41.0 golang.org/x/net@v0.58.0 golang.org/x/crypto@v0.56.0 golang.org/x/sys@v0.47.0 google.golang.org/grpc@v1.83.2 github.com/google/cel-go@v0.29.2 software.sslmate.com/src/go-pkcs12@v0.7.3 go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.45.0"
      # Go semver order (a release outranks its prereleases); busybox sort -V does not.
      vlt() { awk -v a="${1#v}" -v b="${2#v}" 'function pp(s,  p){sub(/\+.*/,"",s);p=index(s,"-");if(p){C=substr(s,1,p-1);P=substr(s,p+1)}else{C=s;P=""}} function cmp(x,y,  i,n,m,X,Y){n=split(x,X,".");m=split(y,Y,".");for(i=1;i<=n&&i<=m;i++){if(X[i]==Y[i])continue;if(X[i]~/^[0-9]+$/&&Y[i]~/^[0-9]+$/)return (X[i]+0<Y[i]+0)?-1:1;if(X[i]~/^[0-9]+$/)return -1;if(Y[i]~/^[0-9]+$/)return 1;return (X[i]<Y[i])?-1:1}return (n<m)?-1:(n>m)?1:0} BEGIN{pp(a);ca=C;pa=P;pp(b);cb=C;pb=P;c=cmp(ca,cb);if(c==0){if(pa==pb)c=0;else if(pa=="")c=1;else if(pb=="")c=-1;else c=cmp(pa,pb)}exit !(c<0)}'; }
      need=""
      for mv in $FLOOR; do
        have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${mv%@*}" 2>/dev/null)"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        vlt "$have" "${mv#*@}" && need="$need $mv"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || go get $need
      # otel: 2.11.0's root go.mod floats the CORE to 1.45.0 (otel, sdk, trace,
      # metric) and leaves the two EXPORTERS on 1.40.0, which carries
      # CVE-2026-81870 (exporter config logging may leak the endpoint). Float the
      # exporters to the same 1.45.0 the core is already on, so the family stays
      # coherent; mismatched otel modules scan clean and break at runtime.
      go mod tidy
      go build -trimpath -tags all_providers \
        -ldflags "-s -w" \
        -o "${{targets.destdir}}/usr/bin/external-secrets" .
