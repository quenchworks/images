# poetry: Poetry + /usr/bin/poetry console-script from Wolfi (FROM_SOURCE=0,
# apko-only, 0-CVE), on a pinned CPython minor. Latest 3 stable Poetry releases,
# each pinned to its exact py3.13-poetry-bin apk; tag = X.Y.Z. Interpreter fixed.
FROM_SOURCE=0
VERSIONS=(2.3.4 2.4.0 2.4.1)
declare -A PIN=( [2.3.4]=2.3.4-r0 [2.4.0]=2.4.0-r0 [2.4.1]=2.4.1-r0 )
render() { echo "s|__PKG__|py3.13-poetry-bin=${PIN[$1]}|g; s/__PYVER__/3.13/g"; }
