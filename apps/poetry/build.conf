# 2026-09-16: the quench-pip-vendor-fix shim was retired. pip's own vendored
# msgpack is now 1.2.1, past the GHSA-6v7p-g79w-8964 fix, so the shim had nothing
# left to replace and its self-check started failing the build. Back to apko-only.
# poetry: Poetry + /usr/bin/poetry console-script from Wolfi (FROM_SOURCE=0,
# apko-only, 0-CVE), on a pinned CPython minor. Latest 3 stable Poetry releases,
# each pinned to its exact py3.13-poetry-bin apk; tag = X.Y.Z. Interpreter fixed.
FROM_SOURCE=0
VERSIONS=(2.4.2)
declare -A PIN=(
  [2.4.2]=2.4.2-r0
)
render() { echo "s|__PKG__|py3.13-poetry-bin=${PIN[$1]}|g; s/__PYVER__/3.13/g; s/__VER__/3.13/g"; }
