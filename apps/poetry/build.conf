# STATUS 2026-08-20: 2 fixable findings, and NOT a stale pin.
#   msgpack     1.1.2  -> 1.2.1    (GHSA-6v7p-g79w-8964)
#   setuptools  70.3.0 -> 78.1.1
# py3.13-poetry-bin is pinned at 2.4.1-r0, which IS Wolfi's newest, and the poetry apk's own
# SBOM contains neither version. Both come from py3.13-pip's VENDORED tree, which this
# image installs.
#
# The repo already fixes exactly this: apps/python builds a `quench-pip-vendor-fix` melange
# package that rewrites pip's vendored msgpack in all four places it lives (sources,
# bytecode, the venv seed wheel, and the two bundled SBOMs) and `replaces:` the pip package
# so apk allows the overwrite.
#
# It cannot simply be reused here: this app is FROM_SOURCE=0, so its workflow runs apko only
# and there is no melange stage, which means `quench-pip-vendor-fix@local` does not exist in
# this build. Two ways forward, both needing a decision:
#   1. Convert poetry to FROM_SOURCE=1 with a melange.yaml carrying the pip-vendor-fix for
#      python 3.13. Principled, and the pattern is already written.
#   2. Drop py3.13-pip from apko.yaml. Removes both findings immediately, but takes `pip`
#      out of the poetry image, which is a capability change users may rely on.
# Do not "fix" this by floating a version: there is nothing to float in an apko-only build.
# poetry: Poetry + /usr/bin/poetry console-script from Wolfi (FROM_SOURCE=0,
# apko-only, 0-CVE), on a pinned CPython minor. Latest 3 stable Poetry releases,
# each pinned to its exact py3.13-poetry-bin apk; tag = X.Y.Z. Interpreter fixed.
FROM_SOURCE=0
VERSIONS=(2.4.1)
declare -A PIN=( [2.4.1]=2.4.1-r0 )
render() { echo "s|__PKG__|py3.13-poetry-bin=${PIN[$1]}|g; s/__PYVER__/3.13/g"; }
