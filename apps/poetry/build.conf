# poetry: Poetry + /usr/bin/poetry console-script from Wolfi, on a pinned CPython
# minor. Latest 3 stable Poetry releases, each pinned to its exact
# py3.13-poetry-bin apk; tag = X.Y.Z. Interpreter fixed.
#
# FROM_SOURCE=1 solely to build the quench-pip-vendor-fix manifest shim. poetry
# pulls py3.13-pip for Poetry's venv tooling and so inherits pip's bundled-
# manifest lies: a phantom vendored setuptools==70.3.0 that pip does not ship,
# and a CycloneDX still claiming msgpack 1.1.2 after the vendored code moved to
# 1.2.1. The shim corrects the manifests to match the filesystem; it touches no
# code, and neither pip nor the shim is removable without losing venv support.
FROM_SOURCE=1
VERSIONS=(2.4.2)
declare -A PIN=(
  [2.4.2]=2.4.2-r0
)
# __VER__ is the python minor the copied melange.yaml (pip-manifest shim) is keyed
# on -- it renders the site-packages paths and the py<ver>-pip-base `replaces`.
render() { echo "s|__PKG__|py3.13-poetry-bin=${PIN[$1]}|g; s/__PYVER__/3.13/g; s/__VER__/3.13/g"; }
