# STATUS: ZLIB-ONLY as of 2026-09-16. Measured, not assumed.
# Gate result on run 35097436436 (2.4.2, both arches): Total 1
# (CRITICAL 0, HIGH 0, MEDIUM 1), the single finding being zlib CVE-2026-85091 --
# the catalog-wide wall. Wolfi is at 1.3.2.1_rc20260601-r0, the advisory wants
# 1.3.3-r0, and upstream zlib has no 1.3.3 tag, so no apk version fixes it yet.
#
# Getting here took restoring the quench-pip-vendor-fix shim that a2dc77a
# deleted wholesale: pip's bundled manifests were reporting a phantom vendored
# setuptools 70.3.0 (CVE-2025-47273, CVE-2026-59890) and a stale CycloneDX
# msgpack 1.1.2 (GHSA-6v7p-g79w-8964). All 3 of those findings are gone; the
# Python python-pkg table now scans clean. Nothing in poetry itself is flagged.
#
# BLOCKED=1 skips build+merge. Clear it the week Wolfi ships zlib 1.3.3-r0; one
# rebuild should publish with no recipe change.
# poetry: Poetry + /usr/bin/poetry console-script from Wolfi, on a pinned CPython
# minor. Latest 3 stable Poetry releases, each pinned to its exact
# py3.13-poetry-bin apk; tag = X.Y.Z. Interpreter fixed.
#
# FROM_SOURCE=1 solely to build the quench-pip-vendor-fix manifest shim. poetry
# pulls py3.13-pip for Poetry's venv tooling and so inherits pip's bundled-
# manifest lies: a phantom vendored setuptools==70.3.0 that pip does not ship,
# and a CycloneDX still claiming msgpack 1.1.2 after the vendored code moved to
# 1.2.1. The shim corrects the manifests to match the filesystem; it touches no
# code, and neither pip nor the shim is removable without losing venv support.
BLOCKED=1
FROM_SOURCE=1
VERSIONS=(2.4.2)
declare -A PIN=(
  [2.4.2]=2.4.2-r0
)
# __VER__ is the python minor the copied melange.yaml (pip-manifest shim) is keyed
# on -- it renders the site-packages paths and the py<ver>-pip-base `replaces`.
render() { echo "s|__PKG__|py3.13-poetry-bin=${PIN[$1]}|g; s/__PYVER__/3.13/g; s/__VER__/3.13/g"; }
