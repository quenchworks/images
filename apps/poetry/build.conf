# 2026-08-26: converted to FROM_SOURCE=1 solely to build the quench-pip-vendor-fix
# shim (option 1 of the STATUS note this replaces). pip stays in the image.
# poetry: Poetry + /usr/bin/poetry console-script from Wolfi (FROM_SOURCE=1,
# apko-only, 0-CVE), on a pinned CPython minor. Latest 3 stable Poetry releases,
# each pinned to its exact py3.13-poetry-bin apk; tag = X.Y.Z. Interpreter fixed.
FROM_SOURCE=1
VERSIONS=(2.4.1)
declare -A PIN=( [2.4.1]=2.4.1-r0 )
# __VER__ is the python minor the copied melange.yaml (pip-vendor shim) is keyed on.
render() { echo "s|__PKG__|py3.13-poetry-bin=${PIN[$1]}|g; s/__PYVER__/3.13/g; s/__VER__/3.13/g"; }
