# backdrop (backdrop/backdrop): Backdrop CMS, the Drupal 7 fork. The official backdrop.zip
# release asset is finished PHP (no composer vendor tree), served by a Wolfi PHP-FPM + nginx
# runtime. Nothing is compiled, so FROM_SOURCE stays unset (like joomla).
# Lines: Backdrop gives security releases to the current and the previous minor only
# (1.33 got no patch beside 1.34.4/1.35.0 on 2026-09-15), so we ship 1.34 and 1.35.
# Each sha256 is from a download on 2026-10-12 and matches the GitHub asset digest.
BLOCKED=0
VERSIONS=(1.34.5 1.35.1)
declare -A SHA256=(
  [1.34.5]=e3d7902de118186e8a50ba4e20c190c9dcd97868af806b6de39e83610f293140
  [1.35.1]=7add8d49fdbfee6819cfb4866cd3501f5e06df8000e39652ecf896a2fa7a729c
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
