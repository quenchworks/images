# envoy-gateway: from-source via melange (Go controller built from the release tarball).
# This is the CONTROL PLANE only: it implements Gateway API and programs Envoy. The data
# plane is our own `envoy` image -- see the note at the bottom.
#
# WINDOW IS 2 MINOR LINES, NOT 3, and that is a CVE decision, not laziness:
# envoy-gateway 1.7.x links github.com/docker/docker/pkg/fileutils (pulled in by
# internal/gatewayapi/runner for the Wasm OCI cache), which drags in
# github.com/docker/docker v28.5.2+incompatible -> CVE-2026-34040 (HIGH) +
# CVE-2026-33997 (MEDIUM), "fixed in 29.3.1". There is no v29.x Go module: the proxy's
# newest version for BOTH github.com/docker/docker and github.com/moby/moby is
# v28.5.2+incompatible, so the finding cannot be floated away. Upstream dropped the
# import in 1.8.0, so 1.8.3 and 1.9.0 are clean and 1.7.5 is unshippable under the gate.
# Re-check when a v29 module tag appears.
#
# Each release pins its source tarball by sha256 and its tag COMMIT (annotated tags:
# resolved with `git ls-remote <repo> 'refs/tags/vX.Y.Z^{}'`, i.e. the commit, not the
# tag object). Both are stamped into the binary the way upstream's tools/make/golang.mk
# does it, so `envoy-gateway version` reports the real release.
#
# DATA PLANE COUPLING (report this to the chart, do not silently drift):
#   EG 1.8.4 -> DefaultEnvoyProxyImage envoy distroless-v1.38.4   (we ship envoy 1.38.1)
#   EG 1.9.1 -> DefaultEnvoyProxyImage envoy distroless-v1.39.1   (WE DO NOT SHIP 1.39;
#               Wolfi's newest envoy apk line is envoy-1.38)
FROM_SOURCE=1
VERSIONS=(1.8.5 1.9.2)
declare -A SHA256=(
  [1.8.5]=6630e7ea85578994f324205851b49841140a58e999e6f86bbcdaa7139aad8615
  [1.9.2]=52878ac962ec0b377974de7f62e336b0b26936ce6c65d01aa874bfa6e210c5ac
)
declare -A COMMIT=(
  [1.8.5]=1cc4d57cb94f6763f63ad08844cca24fcf2cde1a
  [1.9.2]=f9f92a112a4033abed5c8d43a5f7e37da257403c
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g; s|__COMMIT__|${COMMIT[$1]}|g"; }
