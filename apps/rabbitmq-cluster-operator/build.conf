# RabbitMQ Cluster Operator (runs RabbitmqCluster resources: provisioning, scaling, upgrades), from
# rabbitmq/cluster-operator (MPL-2.0). From the release tag via melange: one static Go binary (./cmd)
# with upstream's Dockerfile flags (CGO off, -tags timetzdata). Upstream stamps no version into the
# binary. LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(2.23.3)
declare -A SHA256=(
  [2.23.3]=f90c0cded7453a069dd07865d306a5fb81a5b8af0db16eb385982a6cfc247a33
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
