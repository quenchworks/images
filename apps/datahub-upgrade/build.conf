# datahub-upgrade: DataHub's upgrade and setup job (Apache-2.0). Its SystemUpdate task is
# what a fresh install runs first: it creates the SQL table, the Kafka topics and the
# search indices, and records the upgrade so GMS will start. Image-and-chart (quench/datahub
# runs it as a Helm hook).
#
# FROM_SOURCE=0: DataHub publishes this jar only inside its Docker images (GitHub releases
# carry no server artifacts), and the Gradle build of the whole metadata platform is not
# feasible on a CI runner. The recipe pulls upstream's per-arch image BY DIGEST (crane
# refuses any other content), asserts git.commit.id.describe=v<VER>, and repackages the
# exploded jar on Wolfi openjdk-25-jre.
#
# 0-CVE: the stock v1.7.0.1 jar scans 70 fixable findings (3 CRITICAL), all in jars:
# melange.yaml swaps eight library families and rebuilds the jackson copies that
# hazelcast, parquet-jackson and auth-api.jar bundle (Shade.java, see the recipe).
#
# NEWEST-ONLY: DataHub ships one supported line.
#   __DIG_AMD__ / __DIG_ARM__ = per-arch manifest digest of acryldata/datahub-upgrade:v<VER>
BLOCKED=0
FROM_SOURCE=0
VERSIONS=(1.7.0.1)
declare -A DIG_AMD=(
  [1.7.0.1]=sha256:777cfefb67e6b149ac88a2c8e9d23a9c2100bd42484b1825b839f7ccb1d71aec
)
declare -A DIG_ARM=(
  [1.7.0.1]=sha256:017e58d1ea2e06a1e0e0a88db502f2c8938322d4c4b09265690a7c53cc4c4e82
)
render() {
  echo "s/__VER__/$1/g; s|__DIG_AMD__|${DIG_AMD[$1]}|g; s|__DIG_ARM__|${DIG_ARM[$1]}|g"
}
