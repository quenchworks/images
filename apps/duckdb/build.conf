# duckdb: image-only CLI shell. DuckDB is large C++ — a from-source build needs clang
# and a heavy build (infeasible on a 2-core GitHub runner). Instead we ship DuckDB's
# OWN official precompiled CLI binary (the clickhouse upstream-artifact pattern):
# upstream publishes a per-arch CLI zip per release
# (duckdb_cli-linux-amd64.zip / duckdb_cli-linux-arm64.zip).
# Latest 3 stable MINOR lines, each at its newest patch. Tags are vX.Y.Z; VERSIONS
# hold the bare X.Y.Z and the recipe prefixes `v` on the download URL.
# Each per-arch zip has its own sha256, so all are pinned per version+arch:
#   __VER__     = version (X.Y.Z)
#   __SHA_AMD__ = duckdb_cli-linux-amd64 zip sha256
#   __SHA_ARM__ = duckdb_cli-linux-arm64 zip sha256
FROM_SOURCE=1
VERSIONS=(1.3.2 1.4.5 1.5.5)
declare -A SHA_AMD=(
  [1.3.2]=682ff48f988cb6f054fe42e755b7037ade3441e7a406cce3180b05ac0287279d
  [1.4.5]=ff4ef9ec59fe3e1a1f3dd1004c6218d1fd59c0533c185c968c4403fd0240d02b
  [1.5.5]=08c0ca117111fcede14239d0093792352befdc174218c344d232c13279643d05
)
declare -A SHA_ARM=(
  [1.3.2]=f322807f0f5d146d2bb1eea253f894d0a015561695408fa22981f085eb2b77ad
  [1.4.5]=c6d1c19631bb4d7a2a5dcf30586d888e167ce6fb22396060110c7a32e2bfc298
  [1.5.5]=02163197027a42149147364d31fa67cac82108517a4be43304a1cc226eaef07a
)
render() {
  echo "s/__VER__/$1/g; s|__SHA_AMD__|${SHA_AMD[$1]}|g; s|__SHA_ARM__|${SHA_ARM[$1]}|g"
}
