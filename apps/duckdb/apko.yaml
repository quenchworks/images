# Assembles the DuckDB runtime image. Minimal, nonroot, multi-arch, SBOM by apko.
# DuckDB is an in-process analytical SQL database CLI: the entrypoint is the binary, so
# `docker run ...duckdb <args>` works (e.g. `--version`, a SQL file, or an interactive
# shell). Ships upstream's official precompiled `duckdb` CLI binary. ca-certificates-bundle
# is included so it can reach remote data sources (httpfs/S3) over TLS.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-duckdb@local

accounts:
  groups:
    - groupname: duckdb
      gid: 1001
  users:
    - username: duckdb
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/bin/duckdb

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-duckdb"
  org.opencontainers.image.licenses: "MIT"
