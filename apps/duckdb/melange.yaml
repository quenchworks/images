# Packages DuckDB onto Wolfi. DuckDB is NOT built from source here: it is a large C++
# codebase whose from-source build needs clang and a heavy compile, infeasible on a
# 2-core/7GB GitHub runner. Instead we ship DuckDB's OWN official precompiled CLI
# binary (the same upstream-artifact pattern clickhouse/kafka/opensearch use), harden
# it on a minimal apko base and gate it 0-CVE with Trivy. This is clean-room-consistent:
# it is upstream's published artifact, not a Bitnami chart, and the scan still applies.
# The `duckdb` binary is the in-process analytical SQL shell. It dynamically links
# glibc plus libstdc++ and libgcc_s (verified via ldd), so those are runtime deps.
package:
  name: quench-duckdb
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened DuckDB CLI, packaged on Wolfi"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - glibc              # the CLI links glibc (libc/libm/libdl/libpthread)
      - libstdc++          # links libstdc++.so.6 (verified via ldd)
      - libgcc             # links libgcc_s.so.1 (verified via ldd)
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - curl
      - unzip              # DuckDB ships the CLI binary inside a .zip
      - ca-certificates-bundle

pipeline:
  # DuckDB publishes a separate per-arch CLI zip per release, so fetch the zip matching
  # the build arch by uname -m (x86_64 -> amd64, aarch64 -> arm64) with the arch-matching
  # sha256 — using the wrong arch yields a non-executable / wrong-arch binary. The zip
  # contains a single `duckdb` binary (the CLI shell) that we install to /usr/bin/duckdb.
  - runs: |
      VER="${{package.version}}"
      case "$(uname -m)" in
        x86_64)  ducharch=amd64; sha=__SHA_AMD__ ;;
        aarch64) ducharch=arm64; sha=__SHA_ARM__ ;;
        *) echo "unsupported arch $(uname -m)" >&2; exit 1 ;;
      esac

      url="https://github.com/duckdb/duckdb/releases/download/v${VER}/duckdb_cli-linux-${ducharch}.zip"
      curl -fsSL -o duckdb.zip "$url"
      echo "${sha}  duckdb.zip" | sha256sum -c -
      unzip -o duckdb.zip
      install -Dm0755 duckdb "${{targets.destdir}}/usr/bin/duckdb"

test:
  pipeline:
    - runs: |
        test -x /usr/bin/duckdb
        duckdb --version
