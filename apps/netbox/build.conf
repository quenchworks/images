# netbox: NetBox, the network and data-center source of truth (IPAM, DCIM, circuits, REST
# and GraphQL API), from the source tag: a Python 3.14 venv from requirements.txt, the
# committed static bundle (the in-app docs page points at the published docs), served by gunicorn with whitenoise
# for /static/. One image runs the web server, the RQ worker and the init commands.
#
# 0-CVE: requirements.txt carries one finding, social-auth-core 5.2.0 (CVE-2026-115910),
# fixed only in 6.2.0; NetBox pins social-auth-app-django 6.1.0, which caps core below 6.
# melange.yaml floats social-auth-app-django 7.2.0 + social-auth-core 6.2.0 (Django >= 5.2;
# NetBox is on 6.1). NetBox uses only load_backends, views.auth, the stock pipeline, the
# middleware and the URLs; manage.py check passed with the float (2026-11-23).
#
# NEWEST-ONLY: NetBox patches its newest minor.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(4.7.6)
# sha256 of the GitHub source tarball, from a download
declare -A SHA256=(
  [4.7.6]=849d9761c6d6ac549ebf9eca4b089f196982f454eabe92ec0ed4451e70a87513
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
