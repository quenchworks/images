package:
  name: quench-netbox
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened NetBox, built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - busybox
      - ca-certificates-bundle
      - libpq-18           # psycopg[c]
      - python-3.14        # the venv references the system interpreter
      - tzdata

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - postgresql-18-dev
      - python-3.14
      - python-3.14-dev

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/netbox-community/netbox/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
      strip-components: 1

  - name: Python venv
    runs: |
      set -eu
      grep -q "^version: \"${{package.version}}\"" netbox/release.yaml
      # CVE-2026-115910: social-auth-core is fixed only in 6.2.0, and the pinned
      # social-auth-app-django 6.1.0 caps core below 6; 7.2.0 takes core 6.2.0.
      sed -i -e 's/^social-auth-app-django==6\.1\.0$/social-auth-app-django==7.2.0/' \
             -e 's/^social-auth-core==5\.2\.0$/social-auth-core==6.2.0/' requirements.txt
      grep -qx 'social-auth-app-django==7.2.0' requirements.txt
      grep -qx 'social-auth-core==6.2.0' requirements.txt
      echo 'whitenoise==6.12.0' >> requirements.txt   # serves /static/ under gunicorn
      python3.14 -m venv /opt/netbox/venv
      export PIP_NO_CACHE_DIR=1 PIP_DISABLE_PIP_VERSION_CHECK=1
      /opt/netbox/venv/bin/pip install --no-compile -r requirements.txt
      /opt/netbox/venv/bin/python -I -c "import django, psycopg, social_core, whitenoise; print('django', django.get_version(), 'psycopg', psycopg.pq.__impl__, 'social-core', social_core.__version__)"

  - name: Docs and static files
    runs: |
      set -eu
      # The bundled docs build needs Zensical (mkdocs.yml), which requirements.txt does not
      # carry; ship a pointer to the published docs so /static/docs/ and the help links answer.
      mkdir -p netbox/project-static/docs
      printf '%s\n' '<!doctype html><meta charset="utf-8"><title>NetBox documentation</title>' \
        '<meta http-equiv="refresh" content="0; url=https://netboxlabs.com/docs/netbox/">' \
        '<p>The NetBox documentation is at <a href="https://netboxlabs.com/docs/netbox/">netboxlabs.com/docs/netbox</a>.</p>' \
        > netbox/project-static/docs/index.html
      cp configuration.py netbox/netbox/configuration.py
      cp quench_wsgi.py netbox/quench_wsgi.py
      cd netbox
      SECRET_KEY=build-only-build-only-build-only-build-only-build-only-0 \
        /opt/netbox/venv/bin/python manage.py collectstatic --no-input --verbosity 0
      test -f static/netbox.css && test -f static/docs/index.html

  - name: Install
    runs: |
      set -eu
      D="${{targets.destdir}}/opt/netbox"
      install -d "$D" "$D/media"
      /opt/netbox/venv/bin/pip uninstall -y pip
      cp -a /opt/netbox/venv "$D/venv"
      cp -a netbox "$D/netbox"
      rm -rf "$D/netbox/project-static"     # collected into netbox/static
      install -m 0644 gunicorn.py "$D/gunicorn.py"
      cp -a docs "$D/docs"                  # DOCS_ROOT: model help pages render these
      cp LICENSE.txt NOTICE "$D/"
      find "$D/netbox" -name __pycache__ -prune -exec rm -rf {} +
      case "$(head -1 "$D/venv/bin/gunicorn")" in '#!/opt/netbox/venv/bin/python'*) ;; *) echo "gunicorn shebang is not the venv" >&2; exit 1 ;; esac

test:
  pipeline:
    - runs: |
        /opt/netbox/venv/bin/python -I -c "import django, social_core; print(django.get_version(), social_core.__version__)"
