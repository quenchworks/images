# garak: NVIDIA's LLM vulnerability scanner (prompt injection, jailbreaks, data leakage, toxicity) as a CLI image.
# From the source tag: a Python 3.13 venv on Wolfi's builds of every compiled dependency Wolfi carries (system
# site-packages), the rest from requirements.lock (uv-compiled, installed with --no-deps), and torch from the
# PyTorch CPU index (no CUDA). Image only, no chart: run it as a Job or `docker run` against your model endpoint.
#
# 0-CVE (2026-11-24): the resolved set (177 packages incl. the Wolfi ones) scans 0 findings.
# The torch CPU wheel bundles its own libgomp (torch.libs): the one native-lib exception, as in the vllm image.
#
# NEWEST-ONLY: garak ships one line. Regenerate requirements.lock with every bump (see its header).
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(0.17.1)
# sha256 of the GitHub source tarball, from a download
declare -A SHA256=(
  [0.17.1]=273f53e7c1d4f3b2efac6201ca8de311ececfa91ab10f1e03e489f5cd1749c30
)
declare -A TORCH=( [0.17.1]=2.15.0 )
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g; s|__TORCH__|${TORCH[$1]}|g"; }
