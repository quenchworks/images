# Linkerd's CNI plugin, its installer (Go) and the cni-repair-controller (Rust), all from the
# linkerd/linkerd2-proxy-init cni-plugin tag. See build.conf for the image layout.
package:
  name: quench-linkerd-cni
  version: __VER__
  epoch: 0
  description: "Quenchworks Linkerd CNI plugin, installer and repair controller"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - libgcc

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-1.26
      - cmake
      - clang
      - perl
      - nasm
      - pkgconf
      - rust-1.90
      - cargo-auditable

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/linkerd/linkerd2-proxy-init/archive/refs/tags/cni-plugin/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      set -eu
      export CGO_ENABLED=0 GOFLAGS=-mod=mod GOTOOLCHAIN=local GOWORK=off
      # x/net 0.58.0 requires x/sys 0.47.0, x/term 0.45.0 and x/text 0.41.0: one coherent set.
      FLOOR="golang.org/x/net@v0.58.0 golang.org/x/text@v0.41.0 golang.org/x/sys@v0.47.0 golang.org/x/term@v0.45.0"
      # Go semver order (a release outranks its prereleases); busybox sort -V does not.
      vlt() { awk -v a="${1#v}" -v b="${2#v}" 'function pp(s,  p){sub(/\+.*/,"",s);p=index(s,"-");if(p){C=substr(s,1,p-1);P=substr(s,p+1)}else{C=s;P=""}} function cmp(x,y,  i,n,m,X,Y){n=split(x,X,".");m=split(y,Y,".");for(i=1;i<=n&&i<=m;i++){if(X[i]==Y[i])continue;if(X[i]~/^[0-9]+$/&&Y[i]~/^[0-9]+$/)return (X[i]+0<Y[i]+0)?-1:1;if(X[i]~/^[0-9]+$/)return -1;if(Y[i]~/^[0-9]+$/)return 1;return (X[i]<Y[i])?-1:1}return (n<m)?-1:(n>m)?1:0} BEGIN{pp(a);ca=C;pa=P;pp(b);cb=C;pb=P;c=cmp(ca,cb);if(c==0){if(pa==pb)c=0;else if(pa=="")c=1;else if(pb=="")c=-1;else c=cmp(pa,pb)}exit !(c<0)}'; }
      # FLOORS, not pins: raise a module only where go.mod has it below the floor.
      need=""
      for mv in $FLOOR; do
        have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${mv%@*}" 2>/dev/null)"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        vlt "$have" "${mv#*@}" && need="$need $mv"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || go get $need
      go mod tidy
      go build -buildvcs=false -trimpath -ldflags "-s -w" -o "${{targets.destdir}}/opt/cni/bin/linkerd-cni" ./cni-plugin
      go build -buildvcs=false -trimpath -ldflags "-s -w" -o "${{targets.destdir}}/usr/bin/linkerd2-cni-install" ./cni-install

  - runs: |
      set -eu
      export RUSTFLAGS='--cfg tokio_unstable'
      # Raise a crate on its own minor line only where Cargo.lock has it below the floor.
      cfloor() {
        line="${2%.*}"
        locked() { awk -v n="$1" '$0=="name = \""n"\"" {getline; gsub(/version = |"/,""); print}' Cargo.lock; }
        for v in $(locked "$1"); do
          case "$v" in "$line".*) ;; *) continue ;; esac
          [ "$v" = "$2" ] && continue
          [ "$(printf '%s\n%s\n' "$v" "$2" | sort -V | head -1)" = "$v" ] || continue
          cargo update -p "$1@$v" --precise "$2"
        done
        for v in $(locked "$1"); do
          case "$v" in "$line".*) ;; *) continue ;; esac
          [ "$(printf '%s\n%s\n' "$v" "$2" | sort -V | head -1)" = "$2" ] \
            || { echo "$1 $v is still below the $2 floor"; exit 1; }
        done
      }
      cfloor rustls 0.23.45   # GHSA-2mjx-qc3c-rqvc
      cfloor rand 0.9.3       # GHSA-cq8v-f236-94qc
      cargo auditable build --release --locked -p linkerd-cni-repair-controller
      install -Dm755 target/release/linkerd-cni-repair-controller \
        "${{targets.destdir}}/usr/lib/linkerd/linkerd-cni-repair-controller"
      install -Dm644 LICENSE "${{targets.destdir}}/linkerd/LICENSE"

  - uses: strip

test:
  pipeline:
    - runs: |
        test -x /opt/cni/bin/linkerd-cni
        test -x /usr/bin/linkerd2-cni-install
        /usr/lib/linkerd/linkerd-cni-repair-controller --version
