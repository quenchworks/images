# linkerd-cni: Linkerd's CNI plugin image (linkerd/linkerd2-proxy-init, tags cni-plugin/vX.Y.Z),
# the alternative to the proxy-init init container. Built from source (2026-10-08): the Go
# plugin (/opt/cni/bin/linkerd-cni) and installer (/usr/bin/linkerd2-cni-install), plus the
# Rust cni-repair-controller (/usr/lib/linkerd/), the same layout as cr.l5d.io/linkerd/cni-plugin
# so the upstream linkerd2-cni chart runs it unchanged. busybox stays: the chart's preStop hook
# runs /bin/sh. Root, like upstream: the installer writes the host's CNI bin and config dirs.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(1.7.0)
declare -A SHA256=(
  [1.7.0]=2647f5a1a19cec0c979e716f58aee5e522d6b13fcfdac045a6f43bb7e4ed01a2
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
