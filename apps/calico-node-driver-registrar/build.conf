# calico-node-driver-registrar: the CSI node-driver-registrar image Calico's operator names
# calico/node-driver-registrar, published with Calico's version. Built like
# csi-node-driver-registrar from kubernetes-csi/node-driver-registrar; REG is the upstream
# release per Calico version (Calico 3.32 pins a commit on the 2.x line; 2.18.0 is newest).
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(3.32.0)
declare -A REG=(
  [3.32.0]=2.18.0
)
declare -A SHA256=(
  [3.32.0]=f534a5294953a417ea29372abd5154ab3d8e7b9db4c78cb29f787410c16410a4
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g; s|__REG__|${REG[$1]}|g"; }
