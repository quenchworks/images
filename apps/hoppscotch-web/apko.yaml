# Assembles the Hoppscotch web runtime image: the static web app served by Caddy on 3000 and webapp-server (the
# desktop app's signed bundle) on 3200, on Wolfi Node 24 for the startup env injection. Nonroot (1001), multi-arch,
# read-only-rootfs friendly: mount a writable /tmp; mount /data/webapp-server to keep the bundle signing key across
# restarts (or set WEBAPP_SERVER_SIGNING_KEY). Env: VITE_BASE_URL, VITE_SHORTCODE_BASE_URL, VITE_ADMIN_URL,
# VITE_BACKEND_GQL_URL, VITE_BACKEND_WS_URL, VITE_BACKEND_API_URL (and any other VITE_* upstream documents).
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-hoppscotch-web@local

accounts:
  groups:
    - groupname: hoppscotch
      gid: 1001
  users:
    - username: hoppscotch
      uid: 1001
      gid: 1001
  run-as: 1001

paths:
  - path: /data
    type: directory
    uid: 0
    gid: 0
    permissions: 0o755
  - path: /data/webapp-server
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o700

entrypoint:
  command: /usr/bin/node /opt/hoppscotch/quench-run.mjs

environment:
  XDG_DATA_HOME: /tmp
  XDG_CONFIG_HOME: /tmp

work-dir: /opt/hoppscotch

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-hoppscotch-web"
  org.opencontainers.image.licenses: "MIT"
