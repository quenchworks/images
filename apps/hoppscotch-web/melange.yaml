# hoppscotch-web: pnpm workspace build of the self-hosted web app, webapp-server from source, on Wolfi Node 24.
package:
  name: quench-hoppscotch-web
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Hoppscotch web app, built from source on Wolfi"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - caddy
      - ca-certificates-bundle
      - nodejs-24

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - go
      - nodejs-24
      - npm
      - python-3

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/hoppscotch/hoppscotch/archive/refs/tags/${{package.version}}.tar.gz
      expected-sha256: __SHA256__
      strip-components: 1

  - name: Build the web app
    runs: |
      set -eu
      export HOME="$(mktemp -d)" npm_config_cache="$(mktemp -d)"
      npm install -g --prefix "$HOME/.g" pnpm@10.34.9
      export PATH="$HOME/.g/bin:$PATH"
      cp .env.example .env
      pnpm install --frozen-lockfile
      cd packages/hoppscotch-selfhost-web
      HOPP_ALLOW_RUNTIME_ENV=true pnpm run generate
      test -f dist/index.html
      install -d /opt/hoppscotch
      cp -a dist /opt/hoppscotch/selfhost-web

  - name: webapp-server
    runs: |
      set -eu
      cd packages/hoppscotch-selfhost-web/webapp-server
      CGO_ENABLED=0 GOTOOLCHAIN=local go build -trimpath -ldflags "-s -w" -o /usr/bin/webapp-server .

  - name: Install
    runs: |
      set -eu
      D="${{targets.destdir}}"
      install -d "$D/opt" "$D/usr/bin"
      cp -a /opt/hoppscotch "$D/opt/hoppscotch"
      install -m644 quench-run.mjs "$D/opt/hoppscotch/quench-run.mjs"
      install -m755 /usr/bin/webapp-server "$D/usr/bin/webapp-server"
      # not /etc/caddy/Caddyfile: Wolfi's caddy package owns that path
      install -m644 Caddyfile "$D/opt/hoppscotch/Caddyfile"
      # /site is where Caddy and webapp-server look; quench-run.mjs fills its /tmp target at startup
      ln -s /tmp/hoppscotch-site "$D/site"
      # self-check: quench-run.mjs replaces every VITE_* placeholder the build left
      node --input-type=module -e '
        const fs = await import("node:fs"), path = await import("node:path")
        const { inject } = await import(process.argv[2])
        let n = 0
        for (const f of fs.readdirSync(process.argv[1], { recursive: true }).map((f) => path.join(process.argv[1], f))) {
          if (f.endsWith(".map") || !fs.statSync(f).isFile()) continue
          const c = fs.readFileSync(f, "utf8")
          if (!c.includes("import_meta_env_placeholder")) continue
          const o = inject(c, { VITE_BACKEND_GQL_URL: "http://quench.check/graphql" })
          if (o.includes("import_meta_env_placeholder") || !o.includes("quench.check")) { console.error("not injected: " + f); process.exit(1) }
          n++
        }
        if (!n) { console.error("no VITE_* placeholder in the build"); process.exit(1) }
        console.log(n + " file(s) carry the VITE_* placeholder")' /opt/hoppscotch/selfhost-web "$PWD/quench-run.mjs"

test:
  pipeline:
    - runs: |
        test -f /opt/hoppscotch/selfhost-web/index.html
        test -x /usr/bin/webapp-server
