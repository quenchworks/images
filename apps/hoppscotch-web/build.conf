# hoppscotch-web: the Hoppscotch self-hosted web app (Vue, Vite): the API client UI on 3000, plus webapp-server
# (Go, the signed bundle the desktop app downloads) on 3200. Built from the source tag with pnpm on Wolfi Node 24;
# quench-run.mjs serves the static build on Node (Wolfi's public caddy lags its Go fixes).
# Pairs with hoppscotch-backend and hoppscotch-admin.
#
# Runtime env (VITE_BASE_URL, VITE_BACKEND_GQL_URL and the rest) is written into a copy of the build under /tmp at
# startup, so the rootfs stays read-only. quench-run.mjs does the replacement upstream runs @import-meta-env/cli for
# (ported, byte-identical output): the CLI's bundle carries serialize-javascript 6.0.2 (3 advisories) where no
# scanner sees it.
#
# NEWEST-ONLY: Hoppscotch ships monthly. The build needs an 8G Node heap (upstream's own build script).
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(2026.11.0)
# sha256 of the GitHub source tarball, from a download
declare -A SHA256=(
  [2026.11.0]=8f0c86010924cc86b74a14af229a6818fe73128e1abe4fece0bb9332f2851569
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
