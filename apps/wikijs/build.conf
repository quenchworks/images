# wikijs: Wiki.js (requarks/wiki, AGPL-3.0), a wiki with Markdown and visual editors, Git sync and many auth
# providers, on PostgreSQL. Images issue #22.
#
# From the release tag as upstream's CI builds it: the Vite frontend (into assets/), the content blocks (into
# blocks/compiled) and a production npm ci of the backend, on Wolfi nodejs-26. npm overrides raise the backend's
# fast-uri, fast-xml-parser, undici and yaml, and the frontend's dompurify, nanoid and lodash-es. The optional
# Puppeteer extension (server-side re-render) downloads Chrome at runtime and is not shipped: public Wolfi chromium
# is frozen (see linkwarden). LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(3.4.0)
declare -A SHA256=(
  [3.4.0]=3552b11e97bfaa57339e796846555b2c90be665cd83775d59634c457b2000028
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
