# Go binaries of calico-node built from source, laid over Wolfi's calico-node-__MINOR__.
package:
  name: quench-calico-node
  version: __VER__
  epoch: 0
  description: "Quenchworks calico-node Go binaries over Wolfi's Calico node package"
  copyright:
    - license: Apache-2.0
  dependencies:
    replaces:
      - calico-node-__MINOR__    # our calico-node, mountns and corrected SPDX win over its copies
    runtime:
      - calico-node-__MINOR__=__WOLFI__

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-1.26
      - libbpf-dev
      - elfutils-dev
      - zlib-dev
      - jq
      - calico-node-__MINOR__=__WOLFI__   # its SPDX is rewritten below

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/projectcalico/calico/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      set -eu
      export CGO_ENABLED=1 GOFLAGS=-mod=mod GOTOOLCHAIN=local GOWORK=off
      export CGO_CFLAGS="-I/usr/include/bpf" CGO_LDFLAGS="-lbpf -lelf -lz"
      # FLOORS, not pins: raise a module only where go.mod has it below the floor.
      FLOOR="golang.org/x/crypto@v0.56.0 golang.org/x/net@v0.58.0 golang.org/x/text@v0.41.0 golang.org/x/mod@v0.40.0 golang.org/x/sys@v0.47.0 google.golang.org/grpc@v1.83.2 go.opentelemetry.io/otel/sdk@v1.45.0"
      # Go semver order (a release outranks its prereleases); busybox sort -V does not.
      vlt() { awk -v a="${1#v}" -v b="${2#v}" 'function pp(s,  p){sub(/\+.*/,"",s);p=index(s,"-");if(p){C=substr(s,1,p-1);P=substr(s,p+1)}else{C=s;P=""}} function cmp(x,y,  i,n,m,X,Y){n=split(x,X,".");m=split(y,Y,".");for(i=1;i<=n&&i<=m;i++){if(X[i]==Y[i])continue;if(X[i]~/^[0-9]+$/&&Y[i]~/^[0-9]+$/)return (X[i]+0<Y[i]+0)?-1:1;if(X[i]~/^[0-9]+$/)return -1;if(Y[i]~/^[0-9]+$/)return 1;return (X[i]<Y[i])?-1:1}return (n<m)?-1:(n>m)?1:0} BEGIN{pp(a);ca=C;pa=P;pp(b);cb=C;pb=P;c=cmp(ca,cb);if(c==0){if(pa==pb)c=0;else if(pa=="")c=1;else if(pb=="")c=-1;else c=cmp(pa,pb)}exit !(c<0)}'; }
      need=""
      for mv in $FLOOR; do
        have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${mv%@*}" 2>/dev/null)"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        vlt "$have" "${mv#*@}" && need="$need $mv"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || go get $need
      go mod tidy

      M=github.com/projectcalico/calico/node
      out="${{targets.destdir}}/usr/bin"
      mkdir -p "$out"
      go build -tags cgo -buildvcs=false -trimpath \
        -ldflags "-s -w -X $M/pkg/lifecycle/startup.VERSION=v${{package.version}} -X $M/buildinfo.GitVersion=v${{package.version}}" \
        -o "$out/calico-node" ./node/cmd/calico-node
      go build -tags cgo -buildvcs=false -trimpath -ldflags "-s -w" -o "$out/mountns" ./node/cmd/mountns

      # Wolfi's SPDX for the package lists the Go modules of ITS binaries, which these
      # replace; keep its other entries (BIRD, files) and drop the pkg:golang ones.
      src="$(ls /var/lib/db/sbom/calico-node-__MINOR__-*.spdx.json)"
      test "$(echo "$src" | wc -l)" = 1
      mkdir -p "${{targets.destdir}}/var/lib/db/sbom"
      jq '.packages |= map(select(([.externalRefs[]?.referenceLocator | strings | startswith("pkg:golang/")] | any) | not))
        | ([.packages[].SPDXID] + [.SPDXID] + [.files[]?.SPDXID]) as $ids
        | .relationships |= map(select((.spdxElementId as $a | $ids | index($a)) and (.relatedSpdxElement as $b | $ids | index($b))))' \
        "$src" > "${{targets.destdir}}/var/lib/db/sbom/${src##*/}"
      n_before="$(jq '.packages | length' "$src")"; n_after="$(jq '.packages | length' "${{targets.destdir}}/var/lib/db/sbom/${src##*/}")"
      echo "SPDX packages: $n_before -> $n_after"
      [ "$n_after" -lt "$n_before" ] || { echo "FATAL: no pkg:golang entries removed; re-check the SPDX layout"; exit 1; }

test:
  pipeline:
    - runs: |
        /usr/bin/calico-node -v
