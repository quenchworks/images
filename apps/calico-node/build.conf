# calico-node: Project Calico's node agent (Felix, BIRD, confd) for the Calico CNI.
# Hybrid build (sized 2026-10-08): Wolfi's calico-node-3.32 package supplies the C and
# data parts (BIRD, the compiled BPF objects in /usr/lib/calico/bpf, runit services,
# confd templates; none flagged), and quench-calico-node replaces its Go binaries with
# ones built here from the same tag with the floor pass. Wolfi's own binaries carried
# stdlib 1.25.11 and old golang.org/x modules (521 findings across Calico's packages).
# WOLFI pins the package the overlay sits on: bump it with the version so the BPF
# objects and confd templates match the Go code.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(3.32.0)
declare -A SHA256=(
  [3.32.0]=55defb4135a7f04942ff596848b4decc5eeed67d0d97f81b57df5395f41354c9
)
declare -A WOLFI=(
  [3.32.0]=3.32.0-r4
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g; s|__WOLFI__|${WOLFI[$1]}|g; s|__MINOR__|${1%.*}|g"; }
