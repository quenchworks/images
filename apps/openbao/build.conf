# openbao: from-source via melange (Go build, git-checkout pinned per release).
# Newest stable patch only. Each release pins its git commit.
# UNBLOCKED 2026-07-30 on 2.6.1. The grpc GHSA-hrxh-6v49-42gf (HIGH) block rested on a
# wrong diagnosis: the canonical google.golang.org/grpc@v1.82.1 float was believed to
# cascade-downgrade github.com/openbao/go-kms-wrapping/wrappers/transit/v2 to v2.1.0
# (which calls `wrapping.WrapperTypeTransit` -- a symbol the CORE module dropped in
# v2.8.0 in favour of the wrapper-local `transit.Type`, so an old wrapper on the new
# core genuinely does not compile). Re-verified on 2.6.1: the float does NOT move it.
# Before and after `go get grpc@v1.82.1 && go mod tidy`, and in the shipped binary,
# both openbao/go-kms-wrapping/v2 and wrappers/transit/v2 stay at v2.8.0. The float now
# lives in the recipe as a FLOOR plus the `go version -m` binary assertion
# (docs/go-module-float.md).
FROM_SOURCE=1
VERSIONS=(2.7.0)
declare -A COMMIT=(
  [2.7.0]=ca305a02daa68b203325daa1b25c18d7a252d4b3
)
render() { echo "s/__VER__/$1/g; s/__COMMIT__/${COMMIT[$1]}/g"; }
