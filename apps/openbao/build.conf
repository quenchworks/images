# openbao: from-source via melange (Go build, git-checkout pinned per release).
# Latest 3 stable minor lines, newest patch each. Each release pins its git commit.
FROM_SOURCE=1
VERSIONS=(2.3.2 2.4.4 2.5.5)
declare -A COMMIT=(
  [2.3.2]=b1a68f558c89d18d38fbb8675bb6fc1d90b71e98
  [2.4.4]=4bfd70723d4f9b82be00e87b8c018ac661dd9b99
  [2.5.5]=028992583c693c4de6350b8aa52ff85e30375a99
)
render() { echo "s/__VER__/$1/g; s/__COMMIT__/${COMMIT[$1]}/g"; }
