# openbao: from-source via melange (Go build, git-checkout pinned per release).
# Newest stable patch only. Each release pins its git commit.
# Re-triaged 2026-07-23 on 2.6.1: local both-arch gate FAILS on
# google.golang.org/grpc v1.81.1 → GHSA-hrxh-6v49-42gf (HIGH, fixed 1.82.1).
# The canonical grpc@v1.82.1 float is UNSHIPPABLE here: it cascade-downgrades
# github.com/hashicorp/go-kms-wrapping/wrappers/transit/v2 to v2.1.0, which has
# no WrapperTypeTransit symbol → build break. Upstream 2.6.1's go.mod still
# resolves grpc v1.81.1 + transit/v2 v2.8.0, so the two constraints are
# irreconcilable until upstream bumps grpc. Stays BLOCKED until then.
FROM_SOURCE=1
BLOCKED=1  # grpc v1.81.1 HIGH (GHSA-hrxh-6v49-42gf); float to 1.82.1 breaks go-kms-wrapping transit/v2
VERSIONS=(2.6.1)
declare -A COMMIT=(
  [2.6.1]=ba7ad8861d0578cd4da4f7b9e5a6756d30484f8f
)
render() { echo "s/__VER__/$1/g; s/__COMMIT__/${COMMIT[$1]}/g"; }
