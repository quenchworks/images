# Builds OpenBao (the `bao` server + Vault-compatible CLI) FROM SOURCE onto Wolfi.
# OpenBao is the Linux Foundation's truly-open fork of HashiCorp Vault (which went BUSL);
# OpenBao stays MPL-2.0 (OSI-clean). Single static Go binary, no CGO. Output is a signed
# APK in Quenchworks' own repo -- no upstream distro binaries.
#
# BUILD METHOD: from-source from the pinned git tag (git-checkout + expected-commit),
# CGO_ENABLED=0, built WITHOUT the `ui` build tag. The web UI is gated behind `//go:build
# ui` and needs a heavy Node/ember asset build (web_ui/* is not in the source tree); the
# server + `bao` CLI (HTTP API, KV, raft storage, auth, all secret engines) are fully
# functional without it. This matches the etcd/nats/seaweedfs from-source pattern and is
# on-brand for provenance. The web UI is a follow-up (the official binary bundles it).
package:
  name: quench-openbao
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened OpenBao (the truly-open MPL-2.0 fork of Vault), built from source on Wolfi"
  copyright:
    - license: MPL-2.0
  dependencies:
    runtime:
      - busybox            # the entrypoint uses sh/mkdir/hostname
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - go

pipeline:
  # Pin to the exact tag AND its commit sha for clean-room provenance.
  - uses: git-checkout
    with:
      repository: https://github.com/openbao/openbao
      tag: v${{package.version}}
      expected-commit: __COMMIT__
  - runs: |
      set -eu
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      # ---- 0-CVE module float (docs/go-module-float.md) ----------------------
      # FLOOR is a FLOOR, not a pin. A bare `go get mod@vX` fails silently in two
      # directions: it is a NO-OP when an upstream `replace` overrides it, and it
      # becomes a DOWNGRADE once upstream requires more than vX -- re-introducing
      # the CVE it was added to clear. So float only what is below the floor, then
      # assert the SHIPPED BINARY carries nothing below it.
      #   go-ntlmssp          CVE-2026-32952  (2.6.1 pins v0.1.0)
      #   golang.org/x/net    CVE-2026-46600  (2.6.1 already ships v0.56.0 -- floor only)
      #   google.golang.org/grpc GHSA-hrxh-6v49-42gf HIGH (2.6.1 pins v1.81.1)
      #   github.com/google/cel-go GHSA-gcjh-h69q-9w9g MEDIUM (2.6.1 pins v0.28.1;
      #     fixed in 0.29.0 -- floored at v0.29.2, the same version apps/spicedb uses)
      #
      # The grpc floor was HELD out of this recipe for weeks on the belief that it
      # cascade-downgraded go-kms-wrapping/wrappers/transit/v2 to v2.1.0 (which calls
      # `wrapping.WrapperTypeTransit`, a symbol the core module dropped in v2.8.0 in
      # favour of the wrapper-local `transit.Type`) -- a real incompatibility, but NOT
      # one this float triggers. Re-verified on 2.6.1: after the float, `go list -m`
      # and the shipped binary both keep openbao/go-kms-wrapping/v2 v2.8.0 AND
      # wrappers/transit/v2 v2.8.0, so no co-float and no `replace` is needed. The
      # `=>`-aware binary assertion below is what keeps that honest.
      # 2.6.1's replaces are all local submodule redirects (./api, ./sdk, ...) plus
      # the boltdb stub -- none holds a FLOOR module down, so no -dropreplace.
      FLOOR="github.com/moby/go-archive@v0.3.0 github.com/Azure/go-ntlmssp@v0.1.1 golang.org/x/net@v0.58.0 google.golang.org/grpc@v1.83.2 github.com/google/cel-go@v0.29.2"
      MODS="$(echo "$FLOOR" | tr ' ' '\n' | cut -d@ -f1)"
      # prints "<mod>@<floor> (<tag> has <ver>)" for every module below its floor
      below_floor() {
        awk -v floor="$FLOOR" -v tag="$1" '
          BEGIN { n = split(floor, f, " ")
                  for (i = 1; i <= n; i++) { split(f[i], kv, "@"); want[kv[1]] = kv[2] } }
          ($1 in want) {
            split(substr($2, 2), g, "."); split(substr(want[$1], 2), w, ".")
            for (i = 1; i <= 3; i++) {
              if ((g[i] + 0) > (w[i] + 0)) next
              if ((g[i] + 0) < (w[i] + 0)) { print $1 "@" want[$1] " (" tag " has " $2 ")"; next }
            }
          }'
      }
      # `go list -m` prints "<mod> <ver>" or "<mod> <ver> => <mod> <ver>", so $NF is
      # the EFFECTIVE version and a replace cannot hide behind the require line.
      go list -m -e $MODS
      need="$(go list -m -e $MODS | awk 'NF >= 2 && $NF ~ /^v[0-9]/ { print $1, $NF }' | below_floor go.mod | awk '{ print $1 }')"
      if [ -n "$need" ]; then go get $need; fi
      go mod tidy
      # No guard needed for the go-kms-wrapping pair: a mixed core/wrapper pair is a
      # hard compile error (`undefined: wrapping.WrapperTypeTransit`), never a silent ship.
      # The repo root is `package main` -> the `bao` binary (Vault-compatible CLI/API).
      # Stamp version.GitCommit/BuildDate like upstream's scripts/build.sh (no `ui` tag).
      # -buildvcs=false: without it, a git-checkout build stamps the main module as the
      # VCS pseudo-version (v0.0.0-<commit-time>-<sha>+dirty), which Trivy sorts BELOW the
      # 2.5.4 fixed versions and thus false-flags every already-fixed openbao/openbao CVE
      # (CVE-2024-8185/-9180, CVE-2025-59043, CVE-2025-64761, CVE-2026-45808/-46358/-46405).
      # Dropping the VCS stamp makes Main.Version "(devel)" so Trivy cannot mis-match it;
      # provenance is still carried by git-checkout expected-commit + the -X GitCommit ldflag.
      go build -trimpath -buildvcs=false \
        -ldflags "-s -w \
          -X github.com/openbao/openbao/version.fullVersion=${{package.version}} \
          -X github.com/openbao/openbao/version.GitCommit=__COMMIT__ \
          -X github.com/openbao/openbao/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
        -o "${{targets.destdir}}/usr/bin/bao" .

      # The float is only real if it reached the BINARY. Every `dep`/`=>` line of
      # `go version -m` must be at or above its floor -- the `=>` line is what
      # catches a replace-shadowed float. Fail the build rather than ship it.
      bad="$(go version -m "${{targets.destdir}}/usr/bin/bao" \
        | awk '$1 == "dep" || $1 == "=>" { print $2, $3 }' | below_floor bao)"
      [ -z "$bad" ] || { echo "❌ 0-CVE float did not reach the binary:"; echo "$bad"; exit 1; }

      # Read-only-rootfs entrypoint. Seeds a bao.hcl into a writable path from env, then
      # exec's the real (non-dev) raft server by default. BAO_DEV=1 -> dev mode (for the
      # smoke test / quick start: auto-unsealed, in-memory, root token from BAO_DEV_ROOT_TOKEN).
      install -d "${{targets.destdir}}/usr/bin"
      cat > "${{targets.destdir}}/usr/bin/docker-entrypoint.sh" <<'EOS'
      #!/bin/sh
      set -eu

      # Data + config must live on a writable mount (read-only rootfs). raft integrated
      # storage writes its state under BAO_DATA_DIR.
      BAO_DATA_DIR="${BAO_DATA_DIR:-/openbao/data}"
      BAO_CONFIG_DIR="${BAO_CONFIG_DIR:-/openbao/config}"
      mkdir -p "$BAO_DATA_DIR" "$BAO_CONFIG_DIR"

      # The `bao` CLI token-helper writes ~/.vault-token; the default HOME (/home/openbao)
      # is on the read-only rootfs. Dev mode FAILS to start without a writable HOME. Point
      # HOME at the writable config dir so the token helper (and dev-mode bootstrap) work.
      export HOME="$BAO_CONFIG_DIR"

      # DEV MODE: auto-unsealed in-memory server for quick-start / smoke tests. NOT for prod.
      if [ "${BAO_DEV:-0}" = "1" ]; then
        exec bao server -dev \
          -dev-listen-address="0.0.0.0:8200" \
          -dev-root-token-id="${BAO_DEV_ROOT_TOKEN:-root}"
      fi

      # If the operator passes their own args, honor them verbatim.
      if [ "$#" -gt 0 ]; then
        exec bao "$@"
      fi

      # DEFAULT: real (non-dev) single node with raft integrated storage. Starts SEALED
      # and UNINITIALIZED -- that is expected; `bao operator init` + unseal is an operator
      # step (the chart documents it). disable_mlock=true because mlock needs CAP_IPC_LOCK
      # which a nonroot/cap-dropped container cannot hold. TLS is OFF by default for the
      # internal deployment (NetworkPolicy is the boundary); enabling TLS is a follow-up.
      NODE_ID="${BAO_NODE_ID:-$(hostname 2>/dev/null || echo node1)}"
      # api_addr / cluster_addr default to the container hostname so a node advertises a
      # routable address; override via BAO_API_ADDR / BAO_CLUSTER_ADDR.
      ADV="$(hostname -i 2>/dev/null | awk '{print $1}')"
      [ -n "$ADV" ] || ADV="127.0.0.1"
      API_ADDR="${BAO_API_ADDR:-http://${ADV}:8200}"
      CLUSTER_ADDR="${BAO_CLUSTER_ADDR:-http://${ADV}:8201}"

      CONFIG_FILE="$BAO_CONFIG_DIR/bao.hcl"
      cat > "$CONFIG_FILE" <<HCL
      disable_mlock = true
      ui            = false

      storage "raft" {
        path    = "$BAO_DATA_DIR"
        node_id = "$NODE_ID"
      }

      listener "tcp" {
        address     = "0.0.0.0:8200"
        tls_disable = true
      }

      api_addr     = "$API_ADDR"
      cluster_addr = "$CLUSTER_ADDR"
      HCL

      exec bao server -config="$CONFIG_FILE"
      EOS
      chmod 0755 "${{targets.destdir}}/usr/bin/docker-entrypoint.sh"

# No in-build `test:` block: the binary starts a long-running server and a real node boots
# sealed/uninitialized, so the functional smoke (dev-mode kv put/get roundtrip) runs on the
# assembled image via test.sh instead.
