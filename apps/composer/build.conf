# composer: Wolfi's floating `composer` package (single version, not per-minor)
# layered on a fixed latest PHP minor. VERSIONS = the full composer version,
# used AS-IS as the image tag; keep it in sync with the Wolfi composer package.
# render() only substitutes the fixed PHP minor (__PHPVER__) into apko.yaml's
# php-__PHPVER__ runtime; the `composer` package itself is un-versioned (floating).
FROM_SOURCE=0
VERSIONS=(2.10.1)
render() { echo "s/__PHPVER__/8.4/g"; }
