# composer: the Composer phar from Wolfi (FROM_SOURCE=0, apko-only, 0-CVE), driven
# by a pinned PHP CLI. Latest 3 stable Composer releases, each pinned to its exact
# apk; tag = X.Y.Z. The PHP runtime (php-8.4) stays fixed.
FROM_SOURCE=0
VERSIONS=(2.10.0 2.10.1 2.10.2)
declare -A PIN=( [2.10.0]=2.10.0-r0 [2.10.1]=2.10.1-r1 [2.10.2]=2.10.2-r0 )
render() { echo "s|__PKG__|composer=${PIN[$1]}|g; s/__PHPVER__/8.4/g"; }
