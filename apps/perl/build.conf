# perl: the Perl interpreter from Wolfi (FROM_SOURCE=0, apko-only, 0-CVE).
# NOTE: only 5.42.2 ships. The latest-3 patches would be 5.42.0/5.42.1/5.42.2,
# but CVE-2026-8376 (CRITICAL, heap buffer overflow, affects all perl through
# 5.43.10) is fixed only in 5.42.2-r3 -- so 5.42.0/5.42.1 fail the hard 0-CVE
# gate and are dropped. Each shipped version is pinned to its exact apk; tag=X.Y.Z.
FROM_SOURCE=0
VERSIONS=(5.42.2)
declare -A PIN=( [5.42.2]=5.42.2-r3 )
render() { echo "s|__PKG__|perl=${PIN[$1]}|g"; }
