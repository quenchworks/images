# netbird-server: NetBird combined server, built from source (github.com/netbirdio/netbird, ./combined). One of the
# NetBird images (#108); all build from the same release tarball with upstream's ldflags.
FROM_SOURCE=1
VERSIONS=(0.83.1)
declare -A SHA256=(
  [0.83.1]=5c8d32eab039acfa5720f280685bf864a7851504a0077a78d20b2f7cf6168f0f
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
