# NATS JetStream Controller (NACK: JetStream streams, consumers, key-value and object stores and
# accounts as Kubernetes resources), from nats-io/nack (Apache-2.0). From the release tag via
# melange: one static Go binary (./cmd/jetstream-controller) with upstream's -X main.Version flag and
# the house golang.org/x floor (the Kubernetes client links x/net). LATEST-ONLY: nack ships one line.
FROM_SOURCE=1
VERSIONS=(0.25.0)
declare -A SHA256=(
  [0.25.0]=06718241f6c362bbf8f370f63f4f9137b2f9fae15207cd838b098998d1677f82
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
