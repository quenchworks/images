# kube-vip (kube-vip/kube-vip): virtual IPs and load balancing for the control plane and
# for Services of type LoadBalancer, by ARP or BGP. From source via melange, static Go
# (CGO off), version stamped as upstream's Makefile (-X main.Version). Latest patch of
# the last 3 minor lines.
FROM_SOURCE=1
VERSIONS=(1.0.4 1.1.2 1.2.4)
declare -A SHA256=(
  [1.0.4]=f5168c11a916f701995d61af3604788603de526afbdcf898d44935abf4e56388
  [1.1.2]=e7275df1298183da151dfbb11f7813fd8d37fbf6179c719761be9bb9d5b6d6b1
  [1.2.4]=567b6a8ed13a1af60e7bb2ab63aa3201f482ca5f1d04cab9bb6a4b708e939f01
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
