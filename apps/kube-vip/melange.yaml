# Builds kube-vip from the release tag tarball, as upstream's Makefile build target.
package:
  name: quench-kube-vip
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened kube-vip, built from source"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - go

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/kube-vip/kube-vip/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      set -eu
      export CGO_ENABLED=0 GOFLAGS=-mod=mod GOTOOLCHAIN=local
      # 0-CVE float (docs/go-module-float.md), a floor: raise a module only where the
      # line links an older one.
      for want in golang.org/x/crypto@v0.56.0 golang.org/x/net@v0.58.0 golang.org/x/text@v0.41.0 google.golang.org/grpc@v1.83.2; do
        m="${want%@*}"; w="${want#*@}"
        have="$(go list -m -f '{{.Version}}' "$m" 2>/dev/null || true)"
        [ -n "$have" ] || continue
        [ "$(printf '%s\n%s\n' "$have" "$w" | sort -V | head -1)" = "$w" ] || go get "$want"
      done
      go mod tidy
      go build -trimpath -ldflags "-s -w -X main.Version=v${{package.version}} -X main.Build=v${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/kube-vip" .
      "${{targets.destdir}}/usr/bin/kube-vip" version 2>&1 | grep -q "v${{package.version}}"
      bad="$(go version -m "${{targets.destdir}}/usr/bin/kube-vip" | awk '$1 == "dep" && ($2 == "golang.org/x/crypto" && $3 < "v0.56.0" || $2 == "golang.org/x/net" && $3 < "v0.58.0" || $2 == "golang.org/x/text" && $3 < "v0.41.0") { print $2, $3 }')"
      [ -z "$bad" ] || { echo "float did not reach the binary: $bad"; exit 1; }

test:
  pipeline:
    - runs: |
        test -x /usr/bin/kube-vip
