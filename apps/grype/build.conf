# grype (Anchore): from-source via melange (Go build from the git tag tarball).
# Image-only (a CLI tool, no chart). Newest release only (0.116.1). Single static
# Go binary, CGO disabled. Version is stamped via -X on main.version (per upstream
# .goreleaser.yaml, no "v" prefix).
#
# 0-CVE note: grype still requires github.com/docker/docker v28.5.2+incompatible
# (CVE-2026-34040 / CVE-2026-33997, Moby daemon authz + plugin-install bypass), which
# has NO fix on the docker/docker import path — the fix lives only on the renamed
# github.com/moby/moby/v2 module (only beta module versions; a v29 repo tag is not a
# valid /v2 module version). docker/docker was pulled in by a SINGLE file
# (cmd/grype/cli/commands/completion.go, local-image shell completion). The melange
# build migrates that one file onto the split github.com/moby/moby/{client,api}
# modules grype ALREADY depends on, so docker/docker drops out of the build graph and
# the binary carries no CVE. Same-import-path/major gate rules are honoured (the swap
# targets modules already required by grype; nothing is force-downgraded/upgraded).
FROM_SOURCE=1
VERSIONS=(0.121.1)
declare -A SHA256=(
  [0.121.1]=e3037387939d3230531571d712baf180a96d0ace60042c2f7e15e6b6e7a3f127
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
