# grype (Anchore): from-source via melange (Go build from the git tag tarball).
# Image-only (a CLI tool, no chart). Latest patch of the last 3 minor lines
# (0.112, 0.113, 0.114). Single static Go binary, CGO disabled. Version is
# stamped via -X on main.version (per upstream .goreleaser.yaml, no "v" prefix).
FROM_SOURCE=1
VERSIONS=(0.113.0 0.114.0 0.115.0)
declare -A SHA256=(
  [0.113.0]=abd5547a5e5d9b01d93c51e3fdc6ad7319daf3cf150105f742f6fd33b7066c0d
  [0.114.0]=44044639e695ff46ab3ad342b99039030973e5215e3d04f88fdc46b873d4a96b
  [0.115.0]=146d944636f0d6ebfe21a1287306ef742a2d495e5cf629c1bbd47b7515164165
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
