# Assembles the Grype runtime image. Minimal, nonroot, multi-arch, SBOM by apko.
# Grype is a CLI: the entrypoint is the binary, so `docker run ...grype <args>`
# works (e.g. `version`, `db`, `<image-ref>`). ca-certificates-bundle is included
# so it can reach the vulnerability DB and registries over TLS.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-grype@local

accounts:
  groups:
    - groupname: grype
      gid: 1001
  users:
    - username: grype
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/bin/grype

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-grype"
  org.opencontainers.image.licenses: "Apache-2.0"
