# Builds Grype (Anchore) from source onto Wolfi. Single static Go binary, no CGO
# (matches upstream .goreleaser.yaml CGO_ENABLED=0). The version is stamped via
# -X main.version so `grype version` reports the real release. Output is a signed
# APK in Quenchworks' own repo. No upstream distro binaries. Image-only (CLI, no
# chart). Upstream tags carry a "v" prefix; goreleaser stamps the bare version.
package:
  name: quench-grype
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Grype (Anchore vulnerability scanner), built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/anchore/grype/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - name: Drop the vulnerable github.com/docker/docker dep, float the module graph, build
    runs: |
      set -eu
      # grype imports github.com/docker/docker ONLY in cmd/grype/cli/commands/completion.go
      # (listing local docker images for shell completion). That module caps at
      # v28.5.2+incompatible and carries CVE-2026-34040 / CVE-2026-33997 (Moby daemon
      # authz + plugin-install-privilege bypass); the fix ships only on the renamed
      # github.com/moby/moby/v2 path, with NO fix on the docker/docker import path.
      # grype ALREADY depends on the split client (github.com/moby/moby/client) + api
      # (github.com/moby/moby/api) modules, so we migrate that single file onto them
      # (identical NewClientWithOpts/FromEnv/APIVersionNegotiation + ImageList API).
      # docker/docker then drops out of the build graph entirely and the grype binary
      # embeds only moby/moby/{client,api} — the CVE is gone at the source, gate unchanged.
      F=cmd/grype/cli/commands/completion.go
      sed -i \
        -e '\#"github.com/docker/docker/api/types/filters"#d' \
        -e '\#"github.com/docker/docker/api/types/image"#d' \
        -e 's#"github.com/docker/docker/client"#"github.com/moby/moby/client"#' \
        -e 's#imageListArgs := filters.NewArgs()#imageListArgs := make(client.Filters).Add("dangling", "false")#' \
        -e '/^\timageListArgs.Add("dangling", "false")$/d' \
        -e 's#image.ListOptions{All: false, Filters: imageListArgs}#client.ImageListOptions{All: false, Filters: imageListArgs}#' \
        -e 's#for _, image := range images {#for _, img := range images.Items {#' \
        -e 's#for _, tag := range image.RepoTags {#for _, tag := range img.RepoTags {#' \
        "$F"
      # sed is silent when a pattern stops matching, and a leftover import would put
      # docker/docker straight back into the graph. Fail here instead.
      ! grep -q 'github.com/docker/docker' "$F"
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      export GO111MODULE=on
      export GOTOOLCHAIN=local
      # ---- 0-CVE module float (docs/go-module-float.md) ----------------------
      # FLOOR is a FLOOR, not a pin. A bare `go get mod@vX` fails silently in two
      # directions: it is a NO-OP when an upstream `replace` overrides it, and it
      # becomes a DOWNGRADE once upstream requires more than vX -- re-introducing
      # the CVE it was added to clear. So float only what is below the floor, then
      # assert the SHIPPED BINARY carries nothing below it.
      #
      # FLOOR CHECK at 0.118.0: the tag requires grpc v1.83.0 and the otel v1.44.0
      # family, i.e. ABOVE the v1.82.1 / v1.43.0 floors this recipe used to force
      # with a bare `go get`. Both pins had inverted and would have DOWNGRADED those
      # modules on this bump, re-introducing GHSA-hrxh-6v49-42gf (grpc xDS RBAC +
      # HTTP/2, HIGH). At this tag EVERY floor below is already met or exceeded, so
      # the float is a no-op -- the floors stay as regression guards. grype declares
      # no `replace` directives.
      # containerd/v2 added 2026-09-14: CVE-2026-53495 (CRI ExecSync goroutine
      # leak, MEDIUM), fixed in 2.0.12/2.2.8/2.3.5. 0.118.0 requires v2.3.4
      # indirect (same 2.3.x line as the fix), no `replace` covers it.
      FLOOR="google.golang.org/grpc@v1.83.2 golang.org/x/net@v0.58.0 golang.org/x/text@v0.41.0 golang.org/x/crypto@v0.56.0 golang.org/x/sys@v0.47.0 golang.org/x/mod@v0.40.0 golang.org/x/oauth2@v0.36.0 github.com/containerd/containerd/v2@v2.3.6 go.opentelemetry.io/otel@v1.45.0 go.opentelemetry.io/otel/metric@v1.45.0 go.opentelemetry.io/otel/sdk@v1.45.0 go.opentelemetry.io/otel/sdk/metric@v1.45.0 go.opentelemetry.io/otel/trace@v1.45.0"
      MODS="$(echo "$FLOOR" | tr ' ' '\n' | cut -d@ -f1)"
      # prints "<mod>@<floor> (<tag> has <ver>)" for every module below its floor
      below_floor() {
        awk -v floor="$FLOOR" -v tag="$1" '
          BEGIN { n = split(floor, f, " ")
                  for (i = 1; i <= n; i++) { split(f[i], kv, "@"); want[kv[1]] = kv[2] } }
          ($1 in want) {
            split(substr($2, 2), g, "."); split(substr(want[$1], 2), w, ".")
            for (i = 1; i <= 3; i++) {
              if ((g[i] + 0) > (w[i] + 0)) next
              if ((g[i] + 0) < (w[i] + 0)) { print $1 "@" want[$1] " (" tag " has " $2 ")"; next }
            }
          }'
      }
      # `go list -m` prints "<mod> <ver>" or "<mod> <ver> => <mod> <ver>", so $NF is
      # the EFFECTIVE version and a replace cannot hide behind the require line.
      go list -m -e $MODS
      need="$(go list -m -e $MODS | awk 'NF >= 2 && $NF ~ /^v[0-9]/ { print $1, $NF }' | below_floor go.mod | awk '{ print $1 }')"
      if [ -n "$need" ]; then go get $need; fi
      # Resolve the require graph after the import swap (moby/moby/client goes direct).
      go mod tidy
      go build -trimpath \
        -ldflags "-s -w -X main.version=${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/grype" ./cmd/grype
      # The float is only real if it reached the BINARY. Every `dep`/`=>` line of
      # `go version -m` must be at or above its floor -- the `=>` line is what
      # catches a replace-shadowed float. Fail the build rather than ship it.
      bad="$(go version -m "${{targets.destdir}}/usr/bin/grype" \
        | awk '$1 == "dep" || $1 == "=>" { print $2, $3 }' | below_floor grype)"
      [ -z "$bad" ] || { echo "❌ 0-CVE float did not reach grype:"; echo "$bad"; exit 1; }
      # Same assertion for the import swap: the fixless module must not be linked in.
      # Match the module name exactly -- a substring grep also hits the (harmless)
      # github.com/docker/docker-credential-helpers dep and fails a clean build.
      go version -m "${{targets.destdir}}/usr/bin/grype" \
        | awk '($1 == "dep" || $1 == "=>") && $2 == "github.com/docker/docker" { print; bad = 1 }
               END { exit bad }' \
        || { echo "❌ github.com/docker/docker is still linked into grype"; exit 1; }
