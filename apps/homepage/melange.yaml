# Builds Homepage from the release tag: pnpm install from the frozen lockfile,
# `next build --webpack` into the standalone bundle, then only what upstream's
# Dockerfile ships: .next/standalone, .next/static and public. src/skeleton is
# copied too: at startup the app copies a skeleton file into the config dir for
# any config file that is missing, and exits if it cannot.
package:
  name: quench-homepage
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Homepage dashboard, built from source on Wolfi"
  copyright:
    - license: GPL-3.0-only
  dependencies:
    runtime:
      - ca-certificates-bundle
      - nodejs-24              # 2026-11-02: 22 -> 24; nodejs-22 22.23.2 carries findings fixed only in the unpublished 22.23.4

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - nodejs-24
      - pnpm
      - python3

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/gethomepage/homepage/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      set -eu
      export NEXT_TELEMETRY_DISABLED=1
      # next 16.3.3 (GHSA-vcvr-r3jv-pc5j, CRITICAL RCE in next/og, fixed 16.3.6) is in
      # upstream's lockfile. A pnpm override moves next (and source-map-js below), so the build compiles with the
      # same next it ships; every other package keeps its locked version. 16.3.8 (2026-10)
      # clears CVE-2026-94483..94486 and -94543/-94544.
      # pnpm 10+ reads overrides from pnpm-workspace.yaml, not package.json.
      ! grep -q '^overrides:' pnpm-workspace.yaml || exit 1
      # source-map-js 1.2.2: CVE-2026-93749 (2026-10-06); sharp 0.35.5: GHSA-wq5f-xc86-pv6w
      # (2026-10-07). pnpm installs, so npm 12's cooldown does not apply.
      # vite 8.2.1 (CVE-2026-112942 HIGH, -112943/-112944, launch-editor; 2026-10-22) reaches 2.4.0's
      # standalone bundle; fixed on the same line in 8.2.4. A range selector, so no other line moves.
      printf '\noverrides:\n  next: 16.4.1\n  source-map-js: 1.2.2\n  sharp: 0.35.5\n  fast-xml-parser: 5.12.0\n  "vite@>=8.2.0 <8.2.4": 8.2.4\n' >> pnpm-workspace.yaml
      pnpm install --no-frozen-lockfile
      test "$(node -p 'require("next/package.json").version')" = 16.4.1
      pnpm run build
      app="${{targets.destdir}}/usr/share/homepage"
      install -d "$app/.next" "$app/src"
      cp -a .next/standalone/. "$app/"
      cp -a .next/static "$app/.next/static"
      cp -a public "$app/public"
      cp -a src/skeleton "$app/src/skeleton"
      # Next's file tracing drags the test runner into the standalone bundle
      # (vitest 4.1.10, CVE-2026-84373). Nothing at runtime imports it; the boot
      # test proves that.
      rm -rf "$app"/node_modules/.pnpm/vitest@* "$app"/node_modules/.pnpm/@vitest+*
      # That rm leaves pnpm's hoisted links to the removed stores dangling (this assert was inert
      # under set -e until c7834413, so nothing noticed). Show what is left, drop only links whose
      # target is gone, and let the assert below catch any real vitest code still in the bundle.
      left="$(find "$app/node_modules" -maxdepth 3 -name 'vitest*')"
      [ -z "$left" ] || { echo "vitest entries left after removing the .pnpm stores:"; ls -ld $left; }
      find "$app/node_modules" -maxdepth 3 -name 'vitest*' -type l ! -exec test -e {} \; -print -delete
      ! find "$app/node_modules" -maxdepth 3 -name 'vitest*' | grep -q . || exit 1
      # ip-address 10.5.0 (CVE-2026-101910 to -101913, fixed 10.7.1) and undici 8.10.0 (CVE-2026-85024) come from
      # upstream's frozen lockfile, so the traced copies are swapped in place for the fixed
      # same-line releases (the lockfile is not editable under --frozen-lockfile). Node fetches
      # them because the build env has no curl.
      swap_pnpm() {  # <name> <version> <sha256>; scoped names are stored as @scope+name
        node -e 'fetch(process.argv[1]).then(r=>r.arrayBuffer()).then(b=>require("fs").writeFileSync("/tmp/p.tgz",Buffer.from(b)))' "https://registry.npmjs.org/$1/-/${1##*/}-$2.tgz"
        echo "$3  /tmp/p.tgz" | sha256sum -c -
        rm -rf /tmp/pk && mkdir /tmp/pk && tar -xzf /tmp/p.tgz -C /tmp/pk
        n=0
        for d in "$app"/node_modules/.pnpm/"${1/\//+}"@*/node_modules/"$1"; do
          test -d "$d" || continue
          rm -rf "$d" && mkdir "$d" && cp -a /tmp/pk/package/. "$d/" && n=$((n+1))
        done
        test "$n" -gt 0 || { echo "no traced $1 copy found; the standalone layout moved"; exit 1; }
      }
      swap_pnpm ip-address 10.7.4 f9e1d0dd369c002f43770c6ee35942c8078e76d080a1e18e89113eef865f26ff
      swap_pnpm undici 8.12.2 a765b5e63ab5c6b1b91a59072c88f7857b36f47b09c376762241d177279cdefd
      # @grpc/grpc-js 1.14.4 (CVE-2026-101916 HIGH, -101915 LOW), fixed 1.14.5
      swap_pnpm @grpc/grpc-js 1.14.5 7619fe0a86a59de7ff47f12cb7416d024d51a1356a260a50b72df6fd0ed34b54
      # follow-redirects 1.16.0 (CVE-2026-111755/-111756 HIGH), fixed 1.16.1; no deps, CJS as before
      swap_pnpm follow-redirects 1.16.2 97926c99452df68ec21aa3d518101b6d93a803652d6e1e7d70b273a8930224c8
      # 2026-11-01: ip-address 10.7.4, undici 8.12.2, follow-redirects 1.16.2 (CVE-2026-116689), systeminformation 5.33.16
      swap_pnpm systeminformation 5.33.16 313c77944b719f68012fa3f114544bb0ca4e75b3107ce1954b8cbc6519b241ec
      test -f "$app/server.js"
      grep -q "\"version\": \"${{package.version}}\"" "$app/package.json"
