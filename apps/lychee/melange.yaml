# Lychee from the release zip on Wolfi php-8.5-fpm + nginx (nginx comes from the sibling
# quench-nginx package, installed by apko).
package:
  name: quench-lychee
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Lychee (photo management) on Wolfi php-fpm + nginx"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - php-8.5
      - php-8.5-config
      - php-8.5-fpm
      - php-8.5-fpm-config
      - php-8.5-bcmath
      - php-8.5-bcmath-config
      - php-8.5-ctype
      - php-8.5-ctype-config
      - php-8.5-curl
      - php-8.5-curl-config
      - php-8.5-dom
      - php-8.5-dom-config
      - php-8.5-exif
      - php-8.5-exif-config
      - php-8.5-fileinfo
      - php-8.5-fileinfo-config
      - php-8.5-gd
      - php-8.5-gd-config
      - php-8.5-iconv
      - php-8.5-iconv-config
      - php-8.5-intl
      - php-8.5-intl-config
      - php-8.5-ldap
      - php-8.5-ldap-config
      - php-8.5-mbstring
      - php-8.5-mbstring-config
      - php-8.5-mysqlnd
      - php-8.5-mysqlnd-config
      - php-8.5-openssl
      - php-8.5-openssl-config
      - php-8.5-pdo
      - php-8.5-pdo-config
      - php-8.5-pdo_sqlite
      - php-8.5-pdo_sqlite-config
      - php-8.5-pdo_mysql
      - php-8.5-pdo_mysql-config
      - php-8.5-pdo_pgsql
      - php-8.5-pdo_pgsql-config
      - php-8.5-simplexml
      - php-8.5-simplexml-config
      - php-8.5-sodium
      - php-8.5-sodium-config
      - php-8.5-xml
      - php-8.5-xml-config
      - php-8.5-xmlreader
      - php-8.5-xmlreader-config
      - php-8.5-xmlwriter
      - php-8.5-xmlwriter-config
      - php-8.5-zip
      - php-8.5-zip-config
      - supervisor
      - busybox

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - composer
      - git
      - jq
      - php-8.5
      - php-8.5-config
      - php-8.5-bcmath
      - php-8.5-bcmath-config
      - php-8.5-ctype
      - php-8.5-ctype-config
      - php-8.5-curl
      - php-8.5-curl-config
      - php-8.5-dom
      - php-8.5-dom-config
      - php-8.5-exif
      - php-8.5-exif-config
      - php-8.5-fileinfo
      - php-8.5-fileinfo-config
      - php-8.5-gd
      - php-8.5-gd-config
      - php-8.5-iconv
      - php-8.5-iconv-config
      - php-8.5-intl
      - php-8.5-intl-config
      - php-8.5-ldap
      - php-8.5-ldap-config
      - php-8.5-mbstring
      - php-8.5-mbstring-config
      - php-8.5-mysqlnd
      - php-8.5-mysqlnd-config
      - php-8.5-openssl
      - php-8.5-openssl-config
      - php-8.5-pdo
      - php-8.5-pdo-config
      - php-8.5-pdo_sqlite
      - php-8.5-pdo_sqlite-config
      - php-8.5-pdo_mysql
      - php-8.5-pdo_mysql-config
      - php-8.5-pdo_pgsql
      - php-8.5-pdo_pgsql-config
      - php-8.5-simplexml
      - php-8.5-simplexml-config
      - php-8.5-sodium
      - php-8.5-sodium-config
      - php-8.5-xml
      - php-8.5-xml-config
      - php-8.5-xmlreader
      - php-8.5-xmlreader-config
      - php-8.5-xmlwriter
      - php-8.5-xmlwriter-config
      - php-8.5-zip
      - php-8.5-zip-config

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/LycheeOrg/Lychee/releases/download/v${{package.version}}/Lychee.zip
      expected-sha256: __SHA256__
      extract: false

  - name: Unpack and raise laravel/framework and the symfony http stack
    runs: |
      set -eu
      export HOME="$(mktemp -d)" COMPOSER_HOME="$(mktemp -d)"
      unzip -q Lychee.zip && rm Lychee.zip
      cd Lychee
      php -m | grep -qix tokenizer && php -m | grep -qix ldap
      grep -qx '${{package.version}}' version.md
      # vcs repositories (LycheeOrg forks): clone over https with git, not the GitHub API or ssh
      jq '.repositories |= map(if .type == "vcs" then . + {"no-api": true} else . end)' composer.json > composer.json.new && mv composer.json.new composer.json
      composer config --global github-protocols https
      # ext-imagick and ext-posix are require-dev only (not installed with --no-dev)
      composer update --no-dev --no-interaction --no-progress --no-scripts --with-all-dependencies \
        --ignore-platform-req=ext-imagick --ignore-platform-req=ext-posix laravel/framework \
        symfony/http-foundation symfony/http-kernel symfony/routing symfony/serializer
      composer dump-autoload --no-dev --optimize --no-scripts
      for want in laravel/framework=13.40.0 symfony/http-foundation=7.4.23 symfony/http-kernel=8.1.11 symfony/routing=8.1.11 \
                  symfony/serializer=8.1.11; do
        p=${want%=*} min=${want#*=}
        have=$(jq -r --arg p "$p" '.packages[] | select(.name == $p) | .version' composer.lock | sed 's/^v//')
        [ -n "$have" ] || continue
        [ "$(printf '%s\n%s\n' "$min" "$have" | sort -V | head -1)" = "$min" ] || { echo "FATAL: $p $have below $min"; exit 1; }
      done
      APP_KEY=base64:$(head -c 32 /dev/urandom | base64) php artisan package:discover --ansi

  - name: Lay out /var/www/lychee and the init script
    runs: |
      set -eu
      cd Lychee
      d="${{targets.destdir}}/var/www/lychee"
      install -d "$d"
      cp -a app artisan bootstrap composer.json composer.lock config database index.php lang public resources routes simple_error_template.html vendor version.md "$d/"
      # photos (public/uploads), their symlinks (public/sym) and storage/ live on the volume
      install -d "${{targets.destdir}}/usr/share/lychee"
      cp -a storage "${{targets.destdir}}/usr/share/lychee/storage-skel"
      cp -a public/uploads "${{targets.destdir}}/usr/share/lychee/uploads-skel"
      rm -rf "$d/public/uploads" "$d/public/sym"
      ln -s /var/lib/lychee/storage "$d/storage"
      ln -s /var/lib/lychee/uploads "$d/public/uploads"
      ln -s /var/lib/lychee/sym "$d/public/sym"
      install -d "${{targets.destdir}}/usr/libexec"
      cat > "${{targets.destdir}}/usr/libexec/lychee-init" <<'SH'
      #!/bin/sh
      # seeds storage/ and uploads/ on the volume, migrates, creates the admin from the environment (once),
      # then runs supervisord (php-fpm + nginx)
      set -eu
      [ -n "${APP_KEY:-}" ] || { echo "APP_KEY is not set: base64:<32 random bytes>, e.g. from openssl rand -base64 32" >&2; exit 1; }
      V=/var/lib/lychee
      mkdir -p "$V/storage" "$V/uploads" "$V/sym"
      cp -rn /usr/share/lychee/storage-skel/. "$V/storage/"
      cp -rn /usr/share/lychee/uploads-skel/. "$V/uploads/"
      mkdir -p "$V/storage/framework/views" "$V/storage/framework/cache/data" "$V/storage/framework/sessions" "$V/storage/logs" "$V/storage/tmp"
      if [ "${DB_CONNECTION:-sqlite}" = sqlite ]; then
        f="${DB_DATABASE:-$V/storage/database.sqlite}"
        [ -f "$f" ] || : > "$f"
      else
        i=0
        until php -r 'new PDO(sprintf("%s:host=%s;port=%s;dbname=%s", getenv("DB_CONNECTION") === "pgsql" ? "pgsql" : "mysql", getenv("DB_HOST"), getenv("DB_PORT") ?: (getenv("DB_CONNECTION") === "pgsql" ? "5432" : "3306"), getenv("DB_DATABASE")), getenv("DB_USERNAME"), getenv("DB_PASSWORD"));' 2>/dev/null; do
          i=$((i + 1)); [ "$i" -lt 60 ] || { echo "the database (DB_HOST) did not answer" >&2; exit 1; }
          sleep 2
        done
      fi
      cd /var/www/lychee
      php artisan migrate --force
      if [ -n "${ADMIN_USER:-}" ] && [ -n "${ADMIN_PASSWORD:-}" ] && [ ! -f "$V/storage/.admin-created" ]; then
        php artisan lychee:create_user "$ADMIN_USER" "$ADMIN_PASSWORD" --may-administrate && : > "$V/storage/.admin-created"
      fi
      php artisan view:clear >/dev/null
      exec /usr/bin/supervisord -c /etc/lychee/supervisord.conf
      SH
      chmod 0755 "${{targets.destdir}}/usr/libexec/lychee-init"

  - name: nginx server block (FastCGI to php-fpm on :8080)
    runs: |
      set -eu
      d="${{targets.destdir}}"
      install -d "$d/etc/nginx/conf.d"
      cat > "$d/etc/nginx/conf.d/lychee.conf" <<'NGINX'
      server {
          listen 8080 default_server;
          listen [::]:8080 default_server;
          server_name _;
          root /var/www/lychee/public;
          index index.php;
          charset utf-8;
          client_max_body_size 200M;
          access_log off;

          location ~ /\. { return 403; }
          location / { try_files $uri /index.php$is_args$args; }
          location ~ \.php$ {
              try_files $uri =404;
              include        /etc/nginx/fastcgi_params;
              fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
              fastcgi_pass   127.0.0.1:9000;
          }
          location ~* \.(js|css|png|jpg|svg|ico|woff2?|ttf|eot|map)$ { expires 30d; access_log off; }
      }
      NGINX
  - name: php-fpm pool + php.ini (nonroot, read-only rootfs)
    runs: |
      set -eu
      d="${{targets.destdir}}"
      install -d "$d/etc/php/php-fpm.d" "$d/etc/php/conf.d"
      cat > "$d/etc/php/php-fpm.d/zzz-lychee.conf" <<'FPM'
      [global]
      daemonize = no
      error_log = /proc/self/fd/2

      [www]
      listen = 127.0.0.1:9000
      catch_workers_output = yes
      decorate_workers_output = no
      ; APP_KEY, DB_* and the other settings come from the container environment
      clear_env = no
      pm = dynamic
      pm.max_children = 16
      pm.start_servers = 2
      pm.min_spare_servers = 1
      pm.max_spare_servers = 4
      FPM
      cat > "$d/etc/php/conf.d/zzz-lychee.ini" <<'INI'
      expose_php = Off
      memory_limit = 256M
      upload_max_filesize = 200M
      post_max_size = 200M
      sys_temp_dir = /tmp
      upload_tmp_dir = /tmp
      session.save_path = /tmp
      display_errors = Off
      log_errors = On
      error_log = /proc/self/fd/2
      date.timezone = UTC
      opcache.enable = 1
      opcache.revalidate_freq = 60
      INI

  - name: supervisord (php-fpm + nginx)
    runs: |
      set -eu
      d="${{targets.destdir}}"
      install -d "$d/etc/lychee" "$d/etc/supervisor.d"
      cat > "$d/etc/lychee/supervisord.conf" <<'SUP'
      [supervisord]
      nodaemon=true
      logfile=/dev/stdout
      logfile_maxbytes=0
      pidfile=/tmp/supervisord.pid

      [unix_http_server]
      file=/tmp/supervisor.sock

      [supervisorctl]
      serverurl=unix:///tmp/supervisor.sock

      [rpcinterface:supervisor]
      supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

      [include]
      files = /etc/supervisor.d/*.conf
      SUP
      printf '%s\n' '[program:php-fpm]' 'command=/usr/bin/php-fpm --nodaemonize --fpm-config /etc/php/php-fpm.conf' \
        'autostart=true' 'autorestart=true' 'priority=10' 'stdout_logfile=/dev/stdout' 'stdout_logfile_maxbytes=0' \
        'stderr_logfile=/dev/stderr' 'stderr_logfile_maxbytes=0' > "$d/etc/supervisor.d/php-fpm.conf"
      printf '%s\n' '[program:nginx]' 'command=/usr/bin/nginx -g "daemon off;"' \
        'autostart=true' 'autorestart=true' 'priority=20' 'stdout_logfile=/dev/stdout' 'stdout_logfile_maxbytes=0' \
        'stderr_logfile=/dev/stderr' 'stderr_logfile_maxbytes=0' > "$d/etc/supervisor.d/nginx.conf"

test:
  pipeline:
    - runs: |
        set -eu
        test -f /var/www/lychee/public/index.php
        test -L /var/www/lychee/storage
        php -m | grep -qi pdo_sqlite
        php -m | grep -qi exif
