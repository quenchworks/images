# Lychee runtime: supervisord runs php-fpm (127.0.0.1:9000) and QuenchWorks' nginx (:8080) after
# /usr/libexec/lychee-init seeds /var/lib/lychee (storage/ with the SQLite database, uploads/ with the photos,
# sym/), migrates and creates ADMIN_USER once when set. APP_KEY is required. Nonroot uid 1001.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - busybox
    - supervisor
    # supervisor needs a supervisor-config provider; docker-selenium-supervisor-config (4.44) also provides it and
    # wins on version, so pin the real 4.3 line
    - supervisor-config~4.3
    - quench-nginx@local          # QuenchWorks' hardened nginx (from source), 8080/nonroot
    - quench-lychee@local
    - php-8.5
    - php-8.5-fpm
    - php-8.5-fpm-config
    - php-8.5-config
    - php-8.5-bcmath
    - php-8.5-bcmath-config
    - php-8.5-ctype
    - php-8.5-ctype-config
    - php-8.5-curl
    - php-8.5-curl-config
    - php-8.5-dom
    - php-8.5-dom-config
    - php-8.5-exif
    - php-8.5-exif-config
    - php-8.5-fileinfo
    - php-8.5-fileinfo-config
    - php-8.5-gd
    - php-8.5-gd-config
    - php-8.5-iconv
    - php-8.5-iconv-config
    - php-8.5-intl
    - php-8.5-intl-config
    - php-8.5-ldap
    - php-8.5-ldap-config
    - php-8.5-mbstring
    - php-8.5-mbstring-config
    - php-8.5-mysqlnd
    - php-8.5-mysqlnd-config
    - php-8.5-openssl
    - php-8.5-openssl-config
    - php-8.5-pdo
    - php-8.5-pdo-config
    - php-8.5-pdo_sqlite
    - php-8.5-pdo_sqlite-config
    - php-8.5-pdo_mysql
    - php-8.5-pdo_mysql-config
    - php-8.5-pdo_pgsql
    - php-8.5-pdo_pgsql-config
    - php-8.5-simplexml
    - php-8.5-simplexml-config
    - php-8.5-sodium
    - php-8.5-sodium-config
    - php-8.5-xml
    - php-8.5-xml-config
    - php-8.5-xmlreader
    - php-8.5-xmlreader-config
    - php-8.5-xmlwriter
    - php-8.5-xmlwriter-config
    - php-8.5-zip
    - php-8.5-zip-config

accounts:
  groups:
    - groupname: lychee
      gid: 1001
  users:
    - username: lychee
      uid: 1001
      gid: 1001
  run-as: 1001

environment:
  APP_ENV: production
  APP_DEBUG: "false"
  LOG_CHANNEL: stderr
  DB_CONNECTION: sqlite
  DB_DATABASE: /var/lib/lychee/storage/database.sqlite

entrypoint:
  command: /usr/libexec/lychee-init

work-dir: /var/www/lychee

paths:
  - path: /tmp
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o1777
  - path: /var/lib
    type: directory
    uid: 0
    gid: 0
    permissions: 0o755
  - path: /var/lib/lychee
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o750

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-lychee"
  org.opencontainers.image.licenses: "MIT"
  org.opencontainers.image.version: "__VER__"
