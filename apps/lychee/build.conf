# lychee: Lychee (LycheeOrg/Lychee, MIT), photo management with albums, sharing, smart albums, EXIF and map
# views and a REST API. Images issue #78.
#
# From the release zip (vendor/ and built assets included): composer raises laravel/framework and the symfony
# http stack to their fixed releases, each floor asserted; the LycheeOrg vcs forks are cloned over https with
# git. php-8.5-fpm (with ldap for the bundled ldaprecord) and QuenchWorks' nginx under supervisor. storage/,
# public/uploads and public/sym link to /var/lib/lychee (the volume; SQLite by default). The init migrates and
# creates ADMIN_USER with lychee:create_user --may-administrate once. The npm lockfile (picomatch) is
# build-time only and not shipped.
# LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(7.13.1)
declare -A SHA256=(
  [7.13.1]=025ec7a59b0e226d0bc39dd5aed38b602e7d478f090b6f5cb66c87735b92c468
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
