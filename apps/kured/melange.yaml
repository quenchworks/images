# Builds kured from the release tag tarball, as upstream's Makefile build target.
package:
  name: quench-kured
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened kured, the Kubernetes reboot daemon, built from source"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata
      - util-linux-misc   # /usr/bin/nsenter, which kured execs to reach the host

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - go

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/kubereboot/kured/archive/refs/tags/${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      set -eu
      export CGO_ENABLED=0 GOFLAGS=-mod=mod GOTOOLCHAIN=local
      # 0-CVE float (docs/go-module-float.md): x/net 0.55.0 carries CVE-2026-46600, and
      # spdystream 0.5.0 (the 1.21 line, via client-go) CVE-2026-35469. spdystream is a
      # floor only where the line already links it.
      go get golang.org/x/net@v0.58.0 golang.org/x/text@v0.41.0
      if go list -m github.com/moby/spdystream >/dev/null 2>&1; then go get github.com/moby/spdystream@v0.5.1; fi
      go mod tidy
      go build -trimpath -ldflags "-s -w -X main.version=${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/kured" ./cmd/kured
      grep -aq "${{package.version}}" "${{targets.destdir}}/usr/bin/kured"
      got="$(go version -m "${{targets.destdir}}/usr/bin/kured" | awk '$1 == "dep" && $2 == "golang.org/x/net" { print $3 }')"
      [ "$got" = v0.58.0 ] || { echo "kured links golang.org/x/net $got, not v0.58.0"; exit 1; }

test:
  pipeline:
    - runs: |
        test -x /usr/bin/kured
        test -x /usr/bin/nsenter
