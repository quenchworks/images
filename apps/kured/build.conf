# kured (kubereboot/kured): the Kubernetes reboot daemon. From source via melange,
# static Go (CGO off), version stamped via -X main.version as upstream's Makefile does.
# It reboots a node by exec'ing /usr/bin/nsenter into PID 1's mount namespace (the
# chart runs it privileged with hostPID), so the image ships util-linux-misc for nsenter.
# Latest patch of the last 3 minor lines.
FROM_SOURCE=1
VERSIONS=(1.21.0 1.22.1 1.23.0)
declare -A SHA256=(
  [1.21.0]=2e32f3a27f5c2498694189f1b5752a28a7ec90f1a08734f03ae1dfa9fa5843f5
  [1.22.1]=e67630b0035e5c325a37fb822901a5d07f25174f2d56f682d67a5c9106a5e706
  [1.23.0]=49d2c30619784cef48219366dddbd10baf456cb028ef7085c6f69d3caa59d0c1
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
