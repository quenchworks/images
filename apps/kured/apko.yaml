# Assembles the kured image: nonroot by default; the chart runs it as uid 0, privileged
# with hostPID, because rebooting a node means nsenter into PID 1.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-kured@local
    - util-linux-misc

accounts:
  groups:
    - groupname: kured
      gid: 1001
  users:
    - username: kured
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/bin/kured

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-kured"
  org.opencontainers.image.licenses: "Apache-2.0"
