# Packages the LiteLLM proxy into a self-contained venv at /opt/litellm/venv.
package:
  name: quench-litellm
  version: __VER__
  epoch: 1
  description: "Quenchworks hardened LiteLLM proxy (MIT build, no enterprise package), packaged on Wolfi"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - python-3.13            # the venv references the system interpreter
      - ca-certificates-bundle # TLS to the LLM provider APIs
      - glibc
      - libstdc++              # tokenizers wheel links it
      # Native code from Wolfi: the wheels carried their own (numpy.libs OpenBLAS, a static
      # OpenSSL in cryptography, BoringSSL in hf-xet), where the scan cannot see it.
      - py3.13-numpy-2.5
      - py3.13-cryptography
      - py3.13-hf-xet
      - libpq-18               # psycopg's python impl (1.105.0+ pulls psycopg[binary])
      - tzdata

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - python-3.13
      - py3.13-pip
      - py3.13-numpy-2.5
      - py3.13-cryptography
      - py3.13-hf-xet
      - libpq-18
      - build-base             # fallback for any transitive dep without a wheel
      - rust                   # Rust extensions rebuilt from sdist (see the pipeline)
      - cargo-auditable
      - cmake                  # aws-lc-sys (litellm rust_bridge)
      - perl

pipeline:
  - runs: |
      set -eu
      VER="${{package.version}}"
      dest="${{targets.destdir}}"
      VENV=/opt/litellm/venv
      python3.13 -m venv --system-site-packages "$VENV"
      "$VENV/bin/pip" install --no-cache-dir --upgrade pip
      "$VENV/bin/pip" install --no-cache-dir "litellm==${VER}"

      # The "proxy" extra minus litellm-enterprise (proprietary), from litellm's own
      # metadata so the list tracks each release. Markers other than the extra are kept.
      "$VENV/bin/python" - > proxy-reqs.txt <<'PY'
      import importlib.metadata as m
      from pip._vendor.packaging.requirements import Requirement
      for raw in m.requires("litellm") or []:
          r = Requirement(raw)
          # prisma lives in "extra-proxy", but the proxy's auth error handler does
          # `import prisma` on every rejected request (500 instead of 401 without it)
          if r.name.lower() == "prisma" and r.marker and r.marker.evaluate({"extra": "extra-proxy"}):
              print(f"{r.name}{r.specifier}")
              continue
          if r.marker is None or not r.marker.evaluate({"extra": "proxy"}):
              continue
          if r.marker.evaluate({"extra": ""}):
              continue                      # not proxy-specific; already installed
          if r.name.lower() in ("litellm-enterprise",):
              continue                      # proprietary; see build.conf
          marker = str(r.marker)
          keep = [p.strip() for p in marker.split(" and ") if "extra ==" not in p]
          print(f"{r.name}{r.specifier}" + (f"; {' and '.join(keep)}" if keep else ""))
      PY
      echo "proxy requirements (litellm-enterprise excluded):"; cat proxy-reqs.txt
      grep -qi '^litellm-proxy-extras' proxy-reqs.txt
      grep -qi '^prisma' proxy-reqs.txt
      "$VENV/bin/pip" install --no-cache-dir -r proxy-reqs.txt
      rm -f proxy-reqs.txt

      # polars (FOCUS, CloudZero and Vantage cost exports) and pyroscope-io (continuous
      # profiling, imported only when enabled) are Rust wheels with a static BoringSSL or
      # OpenSSL the scan cannot see, and Wolfi has neither; the proxy imports and serves
      # without them. numpy, cryptography and hf-xet leave the venv for Wolfi's copies.
      # psycopg-binary (1.105.0+) bundles libpq + OpenSSL in psycopg_binary.libs; psycopg
      # falls back to its python impl on Wolfi's libpq-18. pip skips it when absent.
      "$VENV/bin/pip" uninstall -y polars polars-runtime-32 pyroscope-io numpy cryptography hf-xet psycopg-binary
      # litellm-proxy-extras requires psycopg-binary by name; that one line is expected,
      # anything else pip check reports still fails the build.
      CHK=$("$VENV/bin/pip" check 2>&1) || {
        REST=$(printf '%s\n' "$CHK" | grep -v '^litellm-proxy-extras [^ ]* requires psycopg-binary, which is not installed\.$' || true)
        if [ -n "$REST" ]; then printf '%s\n' "$REST"; exit 1; fi
      }
      SITE="$VENV/lib/python3.13/site-packages"
      if ls -d "$SITE"/*.libs 2>/dev/null | grep -q .; then echo "bundled native libs:"; ls -d "$SITE"/*.libs; exit 1; fi
      for p in polars _polars_runtime_32 pyroscope numpy cryptography hf_xet; do
        test ! -e "$SITE/$p" || { echo "$p still in the venv"; exit 1; }
      done
      "$VENV/bin/python" -c "
      import numpy, cryptography, hf_xet
      for m in (numpy, cryptography, hf_xet):
          assert m.__file__.startswith('/usr/lib/python3.13/site-packages/'), m.__file__
      print('numpy', numpy.__version__, 'cryptography', cryptography.__version__, 'hf_xet from Wolfi')
      "
      if "$VENV/bin/pip" show psycopg >/dev/null 2>&1; then
        "$VENV/bin/python" -c "import psycopg; assert psycopg.pq.__impl__ == 'python', psycopg.pq.__impl__; print('psycopg python impl, libpq', psycopg.pq.version())"
      fi

      # sdist <dist>: unpack the sdist of the installed version; prints its directory
      sdist() {
        v=$("$VENV/bin/python" -c "import importlib.metadata as m, sys; print(m.version(sys.argv[1]))" "$1")
        d=$(mktemp -d)
        "$VENV/bin/pip" download -q --no-cache-dir --no-deps --no-binary "$1" "$1==$v" -d "$d"
        tar -xzf "$d"/*.tar.gz -C "$d"
        ls -d "$d"/*/
      }
      # --- Rust extensions: rebuilt from sdist with cargo auditable (2026-10-13) -----
      # A PyPI Rust wheel embeds no crate list, so Trivy scanned none of its crates (pyo3
      # below 0.29, GHSA-36hh HIGH, passed blind). Every Rust extension in the venv is
      # rebuilt from its sdist through `cargo auditable` (the wrapper reroutes only build
      # and rustc); the .dep-v0 section lists the crates and the gate scans them.
      RUSTSO="
      import importlib.metadata as m, os, sys
      for d in m.distributions(path=[sys.argv[1]]):
          for f in d.files or ():
              p = str(f.locate())
              if '.so' not in f.name or os.path.islink(p):
                  continue
              b = open(p, 'rb').read()
              if b'rustc version' not in b and b'.dep-v0' not in b and b'/cargo/registry/src/' not in b:
                  continue
              if sys.argv[2] == 'all' or b'.dep-v0' not in b or not os.stat(p).st_mode & 0o111:
                  print(d.metadata['Name'] + '==' + d.version)
                  break
      "
      CW=$(mktemp -d)
      printf '#!/bin/sh\ncase "$1" in build|rustc) exec /usr/bin/cargo auditable "$@";; esac\nexec /usr/bin/cargo "$@"\n' > "$CW/cargo"
      chmod +x "$CW/cargo"
      # fastuuid 0.14.0 (newest) is on pyo3 0.26 and does not build on 0.29 (downcast was
      # renamed); its rand 0.8.5 (LOW) floors to 0.8.6. The pyo3 VEX holds while its
      # source iterates no Python list or tuple and makes no closure (measured 2026-10-13).
      F=$(sdist fastuuid)
      test "$(grep -cE '[.](iter|nth|nth_back|skip|step_by)[(]|[.]rev[(]|new_closure' "${F}src/lib.rs")" = 0
      (cd "$F" && cargo update -p rand --precise 0.8.6)
      PATH="$CW:$PATH" "$VENV/bin/pip" install --no-cache-dir --no-deps --force-reinstall "$F"
      # litellm's own rust_bridge (litellm-rust in the sdist). The AWS SDK crates ask for
      # their "rustls" feature, which also compiles the legacy hyper 0.14 client on rustls
      # 0.21 and rustls-webpki 0.101.7 (GHSA-82j2 HIGH, no 0.101 fix). The SDKs get only
      # default-https-client, the rustls 0.23 client aws-smithy-runtime 1.14 selects for
      # BehaviorVersion v2026_01_12 and later (client/defaults.rs:75-94); litellm passes
      # latest() at every call site and aws-config does too. rustls and serde_with (pinned
      # =3.16.1, GHSA-7gcf) move to their fixed patch releases.
      L=$(sdist litellm)
      R="${L}litellm-rust"
      sed -i 's/features = \["rustls", "rt-tokio"\]/features = ["default-https-client", "rt-tokio"]/' "$R"/crates/*/Cargo.toml
      sed -i -E 's/^(aws-sdk-[a-z0-9]+) = "([0-9.]+)"$/\1 = { version = "\2", default-features = false, features = ["default-https-client", "rt-tokio"] }/' "$R"/crates/*/Cargo.toml
      sed -i 's/^serde_with = { version = "=3[.]16[.]1"/serde_with = { version = "=3.21.0"/' "$R/Cargo.toml"
      # metadata first: it drops rustls 0.21 from the lock, so -p rustls is unambiguous
      (cd "$R" && cargo metadata --format-version 1 >/dev/null && cargo update -p rustls -p serde_with)
      if grep -A1 '^name = "rustls"$' "$R/Cargo.lock" | grep -q 'version = "0[.]21'; then echo "rustls 0.21 still in litellm-rust"; exit 1; fi
      PATH="$CW:$PATH" "$VENV/bin/pip" install --no-cache-dir --no-deps --force-reinstall "$L"
      for spec in $("$VENV/bin/python" -c "$RUSTSO" "$SITE" blind); do
        PATH="$CW:$PATH" "$VENV/bin/pip" install --no-cache-dir --no-deps --force-reinstall --no-binary "${spec%%==*}" "$spec"
      done
      BLIND=$("$VENV/bin/python" -c "$RUSTSO" "$SITE" blind)
      test -z "$BLIND" || { echo "Rust extensions without .dep-v0: $BLIND"; exit 1; }
      echo "Rust extensions, all auditable:" $("$VENV/bin/python" -c "$RUSTSO" "$SITE" all)

      # license guard: the proprietary package must not be in the image
      if "$VENV/bin/pip" show litellm-enterprise >/dev/null 2>&1; then
        echo "litellm-enterprise got installed; the image must stay MIT"; exit 1
      fi
      "$VENV/bin/python" -c "import litellm.proxy.proxy_server as s; assert s.enterprise_proxy_config is None; print('proxy imports without enterprise')"
      "$VENV/bin/python" -c "import prisma; print('prisma importable')"
      "$VENV/bin/python" -c "import importlib.metadata as m, sys; v = m.version('litellm'); assert v == sys.argv[1], v" "${VER}"

      # pip is not needed at runtime and vendors its own copies of flagged libraries
      "$VENV/bin/pip" uninstall -y pip
      install -d "${dest}/opt/litellm"
      cp -a "$VENV" "${dest}/opt/litellm/venv"
      install -d "${dest}/usr/bin"
      ln -sf /opt/litellm/venv/bin/litellm "${dest}/usr/bin/litellm"
      chmod -R a+rX "${dest}/opt/litellm"

test:
  pipeline:
    - runs: |
        test -x /opt/litellm/venv/bin/litellm
