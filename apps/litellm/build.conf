# litellm: the LiteLLM proxy (one OpenAI-compatible API over 100+ LLM providers),
# installed from PyPI into a Python 3.13 venv on Wolfi.
#
# LICENSE: MIT only. The litellm repo is MIT except its enterprise/ directory, and the
# PyPI "proxy" extra hard-pins litellm-enterprise, which is LicenseRef-Proprietary
# (the BerriAI Enterprise license). melange.yaml installs litellm plus every "proxy"
# requirement EXCEPT litellm-enterprise, read from litellm's own metadata, and fails
# the build if it arrives anyway. The proxy imports it only inside try/except
# ImportError (checked on 1.102.1: all 16 references are guarded), so enterprise
# features stay off and the MIT proxy runs. litellm-proxy-extras (migrations) is MIT.
#
# LEFT OUT (2026-09-28): polars and pyroscope-io, Rust wheels with a static BoringSSL or
# OpenSSL the scan cannot see, and not in Wolfi. The FOCUS, CloudZero and Vantage cost
# exports need polars and fail with ImportError when enabled; profiling (pyroscope) is
# off unless configured. numpy, cryptography and hf-xet come from Wolfi.
#
# NEWEST-ONLY: LiteLLM releases several times a week; the image tracks the newest.
BLOCKED=0
FROM_SOURCE=0
VERSIONS=(1.103.3 1.104.0)
render() { echo "s/__VER__/$1/g"; }
