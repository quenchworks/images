# linkding (sissbruecker/linkding, MIT): a self-hosted bookmark manager with tags, full-text
# search, archived snapshots, a REST API and browser extensions, on SQLite or PostgreSQL.
# From the release tag via melange: the frontend built with npm, the Python app installed from
# upstream's uv.lock into a venv on Wolfi python-3.13 (psycopg built from source, as upstream's
# image does), and upstream's SQLite ICU extension compiled. LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(1.47.0)
declare -A SHA256=(
  [1.47.0]=6ada53ec63abef00a02dac80444b6469d83bb3e9e9d3a40e70c638aa818bf48b
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
