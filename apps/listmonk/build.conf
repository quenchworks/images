# listmonk (knadh/listmonk, AGPL-3.0): self-hosted newsletter and mailing-list manager on
# PostgreSQL. From source via melange: the Vue admin UI and the email builder are built with yarn
# in the sandbox, then packed with the SQL, templates and i18n into one CGO-free Go binary
# (stuffbin, as upstream's make dist). Node never reaches the runtime image.
# imaging 1.6.2 (CVE-2023-36308, no upstream fix) is mitigated at build time; see melange.yaml.
# LATEST-ONLY: per-release frontend toolchains.
FROM_SOURCE=1
VERSIONS=(6.2.0)
declare -A SHA256=(
  [6.2.0]=e2dc35b2300b344fbee5581fa73cd066fd901678d8743a38be67d14e152df658
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
