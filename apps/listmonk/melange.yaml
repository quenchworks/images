# listmonk from the release tag the way upstream's `make dist` builds it: yarn builds the admin
# UI and the email builder, go builds ./cmd (CGO off), stuffbin appends the static assets.
package:
  name: quench-listmonk
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened listmonk newsletter and mailing-list manager, built from source on Wolfi"
  copyright:
    - license: AGPL-3.0-only
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - bash
      - git
      - ca-certificates-bundle
      - go-1.26
      # build-only UI toolchain: yarn classic (packageManager yarn@1.22.22) + vite
      - nodejs-24
      - yarn

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/knadh/listmonk/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - name: Build the admin UI and the email builder (yarn + vite)
    runs: |
      set -eu
      export HOME="$(mktemp -d)" YARN_CACHE_FOLDER="$(mktemp -d)" VUE_APP_VERSION="v${{package.version}}"
      yarn --cwd frontend/email-builder install --frozen-lockfile --non-interactive
      yarn --cwd frontend/email-builder build
      mkdir -p frontend/public/static/email-builder
      cp -r frontend/email-builder/dist/* frontend/public/static/email-builder/
      yarn --cwd frontend install --frozen-lockfile --non-interactive
      yarn --cwd frontend build
      test -f frontend/dist/index.html

  - name: Build and pack the binary (static, CGO off)
    runs: |
      set -eu
      export CGO_ENABLED=0 GOTOOLCHAIN=local GOFLAGS=-mod=mod
      # floors, raised only when below (a bare go get downgrades once upstream passes it)
      FLOOR="golang.org/x/crypto@v0.58.1-0.20261009181718-2f1f834330b2 golang.org/x/net@v0.62.0 golang.org/x/text@v0.43.0 golang.org/x/sys@v0.49.0 golang.org/x/image@v0.47.0 github.com/labstack/echo/v4@v4.16.4 github.com/go-jose/go-jose/v4@v4.1.9"
      need=""
      for f in $FLOOR; do
        have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${f%@*}")"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        [ "$(printf '%s\n%s\n' "$have" "${f#*@}" | sort -V | head -1)" = "${f#*@}" ] || need="$need $f"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || go get $need
      go mod tidy
      # upstream's asset packer, from the version go.mod pins (vendor/ would not carry its main)
      sb="$(mktemp -d)/stuffbin"
      go build -o "$sb" github.com/knadh/stuffbin/stuffbin
      # CVE-2023-36308: imaging 1.6.2 (no fixed release, upstream inactive since 2020) indexes its
      # palette table with raw pixel values. Before x/image v0.41.0, x/image/bmp (registered by
      # imaging) returned Paletted images with indexes past the palette, and a crafted upload
      # panicked a goroutine and killed the server. The x/image floor above rejects those at decode;
      # this also sizes imaging's table for every uint8 index in case another decoder ever does.
      go mod vendor
      sc=vendor/github.com/disintegration/imaging/scanner.go
      sed -i 's/s\.palette = make(\[\]color\.NRGBA, len(img\.Palette))/s.palette = make([]color.NRGBA, 256+len(img.Palette))/' "$sc"
      grep -q '256+len(img.Palette)' "$sc"
      v="v${{package.version}}"
      go build -mod=vendor -trimpath \
        -ldflags "-s -w -X 'main.buildString=$v' -X 'main.versionString=$v'" -o listmonk ./cmd
      "$sb" -a stuff -in listmonk -out listmonk config.toml.sample \
        schema.sql queries:/queries permissions.json static/public:/public \
        static/email-templates frontend/dist:/admin i18n:/i18n
      install -Dm755 listmonk "${{targets.destdir}}/usr/bin/listmonk"
      "${{targets.destdir}}/usr/bin/listmonk" --version 2>&1 | grep -F "$v"

test:
  pipeline:
    - runs: |
        listmonk --version
