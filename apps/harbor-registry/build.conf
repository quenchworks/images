# harbor-registry: from-source (goharbor/distribution redis-patched fork).
# All three latest Harbor releases (2.13.5/2.14.4/2.15.1) bundle the SAME
# REGISTRYVERSION=v2.8.3-patch-redis (distribution @ v2.8.3-harbor.1-rc.4,
# commit 11540ea), so the build is byte-identical; only the image tag (the
# Harbor release version) differs. We publish all three tags for parity with
# the rest of the harbor-* cluster.
FROM_SOURCE=1
VERSIONS=(2.15.2)
render() { echo "s/__VER__/$1/g"; }
