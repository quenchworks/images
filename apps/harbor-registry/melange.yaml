# Builds the Harbor-pinned container registry (Docker distribution FORK) from
# source onto Wolfi. This is NOT upstream distribution/distribution: it is
# goharbor/distribution, the patched fork Harbor ships, carrying Harbor's redis
# layer-blob-cache + storage patches (the "-patch-redis" line). Substituting
# stock distribution would drop those patches and is WRONG.
#
# PIN (read from the Harbor v2.14.4 root Makefile, verbatim):
#   DISTRIBUTION_SRC = https://github.com/goharbor/distribution.git
#   REGISTRY_SRC_TAG = release/2.8        (a branch; its HEAD is the rc tag below)
#   REGISTRYVERSION  = v2.8.3-patch-redis (Harbor's canonical version string)
# The branch release/2.8 HEAD is commit 11540eae06cb772e8b65793c066fa8d5810fbe53,
# which is tagged v2.8.3-harbor.1-rc.4. We pin that exact commit for
# reproducibility and stamp the reported version to v2.8.3-patch-redis to match
# what Harbor publishes (its Makefile's REGISTRYURL release dir is
# release-v2.8.3-patch-redis), so `registry --version` prints what Harbor's
# bundled registry prints.
#
# Build method mirrors Harbor's make/photon/registry/Dockerfile.binary, which
# runs `CGO_ENABLED=0 make PREFIX=/go clean binaries` with
# BUILDTAGS="include_oss include_gcs" in the cloned fork. The fork's Makefile
# stamps version via -ldflags -X github.com/docker/distribution/version.Version.
# We override VERSION to the Harbor REGISTRYVERSION string. The module path is
# the legacy GOPATH path github.com/docker/distribution; the repo vendors its
# deps (vendor/), so the build is hermetic-ish (modules from vendor, not proxy).
#
# go.mod requires go 1.25.x -> use the Wolfi go-1.26 toolchain (go-1.25 tops
# out at 1.25.12 with fixable stdlib CVEs) for the latest stdlib CVE fixes. The fork is on the old v2.8.3 line so its vendored deps are
# stale; we bump the FIXABLE-CVE deps in a controlled `go get` step that keeps
# the Harbor redis/storage patches intact, then re-vendor, before the make build.
package:
  # APK version is numeric (the v2.8.3 base of the fork); the full Harbor
  # REGISTRYVERSION string "v2.8.3-patch-redis" is stamped into the binary via
  # ldflags (see the build step) and is what `registry --version` reports.
  name: quench-harbor-registry
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Harbor registry (goharbor/distribution fork, redis-patched Docker distribution), built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - busybox            # minimal shell for debugging; not on the entrypoint path

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - make
      - python3   # used only to apply the source patch that drops letsencrypt
      # go.mod requires go >= 1.25.x. Wolfi go-1.25 tops out at 1.25.12, whose
      # stdlib carries fixable CVEs (fixed in 1.25.13/1.26.6); go-1.26 satisfies
      # the go directive and ships a fixed stdlib.
      - go-1.26

pipeline:
  # Pin the Harbor fork at the exact commit that is release/2.8 HEAD
  # (tag v2.8.3-harbor.1-rc.4). git-checkout verifies the commit.
  - uses: git-checkout
    with:
      repository: https://github.com/goharbor/distribution
      expected-commit: 11540eae06cb772e8b65793c066fa8d5810fbe53
      tag: v2.8.3-harbor.1-rc.4
      destination: src

  - runs: |
      cd src
      export CGO_ENABLED=0
      export GOTOOLCHAIN=local
      export GOFLAGS=-mod=mod
      export GO111MODULE=on

      # ---- Drop the unused Let's Encrypt TLS feature ----
      # distribution's registry/registry.go imports rsc.io/letsencrypt, which
      # drags in xenolf/lego -> an ancient github.com/miekg/dns that carries
      # FIXABLE CVEs (CVE-2017-15133, CVE-2018-17419, CVE-2019-19794). That dns
      # version is the ONLY one lego compiles against (lego uses dns.ErrTruncated,
      # removed right after dns v1.0.0), so the dns CVE fix and the lego/letsencrypt
      # code path are mutually exclusive. Harbor NEVER uses the registry's built-in
      # Let's Encrypt (TLS is terminated at Harbor's proxy; the chart-mounted
      # config.yml has no http.tls.letsencrypt block), so we surgically remove the
      # feature: replace the LetsEncrypt branch with a hard error and drop the
      # import. This is an OPTIONAL upstream-distribution feature, NOT a Harbor
      # patch -- the Harbor redis layer-cache + storage patches (in
      # registry/storage/cache/redis and the storage drivers) are untouched.
      python3 - "registry/registry.go" <<'PY'
      import sys
      f = sys.argv[1]
      lines = open(f).read().split("\n")
      out, i, patched_import, patched_block = [], 0, False, False
      while i < len(lines):
          ln = lines[i]
          # drop the rsc.io/letsencrypt import line
          if ln.strip() == '"rsc.io/letsencrypt"':
              patched_import = True
              i += 1
              continue
          # find the LetsEncrypt-enabled branch and replace its body with a
          # hard error, preserving the surrounding `if ... { ... } else {` shape.
          if ln.strip() == 'if config.HTTP.TLS.LetsEncrypt.CacheFile != "" {' and not patched_block:
              indent = ln[:len(ln) - len(ln.lstrip())]
              out.append(ln)
              out.append(indent + "\treturn fmt.Errorf(\"built-in Let's Encrypt support is disabled in this build; terminate TLS at a proxy or provide http.tls.certificate\")")
              # skip original body up to and including the matching `} else {`
              i += 1
              while lines[i].strip() != "} else {":
                  i += 1
              out.append(lines[i])  # the `} else {`
              patched_block = True
              i += 1
              continue
          out.append(ln)
          i += 1
      assert patched_import, "rsc.io/letsencrypt import not found -- fork layout changed"
      assert patched_block, "letsencrypt branch not found -- fork layout changed"
      s = "\n".join(out)
      # logrus-logstash-hook v1.0.0's LogstashFormatter has no TimestampFormat
      # field (it embeds a logrus.Formatter). Reconstruct the v0-style literal
      # `&logstash.LogstashFormatter{TimestampFormat: time.RFC3339Nano}` as the
      # v1.0.0 form wrapping a JSON formatter that carries the timestamp format.
      old_ls = '&logstash.LogstashFormatter{\n\t\t\tTimestampFormat: time.RFC3339Nano,\n\t\t}'
      new_ls = '&logstash.LogstashFormatter{\n\t\t\tFormatter: &log.JSONFormatter{TimestampFormat: time.RFC3339Nano},\n\t\t}'
      assert old_ls in s, "logstash formatter literal not found -- fork layout changed"
      s = s.replace(old_ls, new_ls)
      open(f, "w").write(s)
      print("patched out letsencrypt feature + fixed logstash formatter")
      PY

      # ---- Controlled CVE bumps (fork is on the stale v2.8.3 line) ----
      # Bump only the deps that carry FIXABLE Trivy gobinary CVEs to a fixed
      # release. None touch the Harbor redis layer-cache / storage patches.
      #   gorilla/handlers   CVE-2017-20146 (CORS)                 -> >=1.3.0
      #   prometheus/client_golang CVE-2022-21698 (DoS)            -> >=1.11.1
      #   sirupsen/logrus    CVE-2025-65637 (DoS large line)       -> >=1.9.3
      #   google.golang.org/grpc GHSA-hrxh-6v49-42gf (xDS RBAC + HTTP/2, HIGH) -> 1.82.1
      #     (pin exactly; @latest was resolving to 1.82.0, still flagged)
      #   gopkg.in/square/go-jose.v1 CVE-2016-9121/9122 (invalid curve) -> >=1.1.0
      # logrus-logstash-hook v0 uses the removed logrus.DefaultTimestampFormat;
      # bump it to v1.0.0 so it compiles against the bumped logrus.
      go get golang.org/x/crypto@latest
      go get golang.org/x/net@latest
      go get golang.org/x/sys@latest
      go get golang.org/x/oauth2@latest
      go get github.com/aws/aws-sdk-go@latest
      go get github.com/gorilla/handlers@v1.5.2
      go get github.com/prometheus/client_golang@v1.20.5
      go get github.com/sirupsen/logrus@v1.9.3
      go get github.com/bshuster-repo/logrus-logstash-hook@v1.0.0
      # grpc@v1.82.1 clears GHSA-hrxh-6v49-42gf; pin its coherent otel cascade so
      # MVS resolves compatible versions (go mod tidy prunes any not imported).
      # oauth2 is already floated @latest above (>= 0.36.0).
      go get google.golang.org/grpc@v1.83.2 \
        go.opentelemetry.io/otel@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.45.0 \
        go.opentelemetry.io/otel/sdk@v1.45.0 \
        go.opentelemetry.io/otel/trace@v1.45.0 \
        go.opentelemetry.io/otel/metric@v1.45.0
      go get gopkg.in/square/go-jose.v1@v1.1.1
      # CVE-2020-26160 (HIGH): github.com/dgrijalva/jwt-go v3.2.0 is abandoned
      # upstream with no fixed release at that module path. It is pulled in
      # ONLY by github.com/Azure/go-autorest/autorest/adal (the old
      # v10.8.1+incompatible go-autorest monolith), used transitively by
      # registry/storage/driver/azure via azure-sdk-for-go/storage ->
      # go-autorest/autorest.
      #
      # A `replace dgrijalva/jwt-go=golang-jwt/jwt@v3.2.2+incompatible` (what
      # distribution/distribution#3466 did) does NOT work here: golang-jwt/jwt's
      # own v3 line still self-imports its real path "github.com/golang-jwt/jwt"
      # in its test/request/test-helper files, so `go mod tidy` errors with
      # "github.com/golang-jwt/jwt@v3.2.2+incompatible used for two different
      # module paths" -- the same content can't simultaneously satisfy a
      # replace target and its own true import path.
      #
      # Fix instead by bumping the actual dependency: adal v0.9.20+ migrated
      # off dgrijalva/jwt-go to github.com/golang-jwt/jwt/v4 (a proper,
      # independently-versioned module -- no path collision possible) itself.
      # go-autorest's later split-repo layout means `go get .../adal@v0.9.24`
      # pulls its own go-autorest v14.2.0+incompatible + autorest v0.11.30
      # via MVS; go.mod ends up with no dgrijalva/jwt-go requirement at all.
      # Verified: `go build ./...` succeeds, `go list -m all | grep jwt` shows
      # only golang-jwt/jwt/v4, and dgrijalva is absent from go.mod/go.sum/
      # vendor and from the built binary's strings.
      go get github.com/Azure/go-autorest/autorest/adal@v0.9.24
      # adal v0.9.24 lands on golang-jwt/jwt/v4 v4.5.0, which carries its own
      # CVE-2025-30204 (HIGH, excessive memory during header parsing; fixed in
      # 4.5.2) and CVE-2024-51744 (LOW, fixed in 4.5.1). Migrating off the
      # abandoned module is only half the job -- the replacement has to be
      # floated past its own advisories too.
      go get github.com/golang-jwt/jwt/v4@v4.5.2
      go mod tidy
      go mod vendor

      # ---- Build exactly like Harbor's Dockerfile.binary ----
      # BUILDTAGS match Harbor (include_oss include_gcs => Alibaba OSS + GCS
      # storage drivers compiled in). Override VERSION to Harbor's
      # REGISTRYVERSION so `registry --version` reports v2.8.3-patch-redis.
      # REVISION stays the real fork commit for provenance.
      export BUILDTAGS="include_oss include_gcs"
      make \
        VERSION="v2.8.3-patch-redis" \
        REVISION="11540eae06cb772e8b65793c066fa8d5810fbe53" \
        BUILDTAGS="${BUILDTAGS}" \
        binaries

      install -d "${{targets.destdir}}/usr/bin"
      install -m 0755 bin/registry "${{targets.destdir}}/usr/bin/registry"

      # Ship a MINIMAL sample config only (the chart mounts the real config.yml,
      # the htpasswd, and the Harbor core token-service root.crt). This sample
      # lets the image boot standalone for the smoke test: filesystem storage at
      # /storage, HTTP API on :5000, debug/metrics on :5001, no auth.
      install -d "${{targets.destdir}}/etc/registry"
      cat > "${{targets.destdir}}/etc/registry/config.yml" <<'EOF'
      version: 0.1
      log:
        level: info
        fields:
          service: registry
      storage:
        cache:
          blobdescriptor: inmemory
        filesystem:
          rootdirectory: /storage
        delete:
          enabled: true
      http:
        addr: :5000
        debug:
          addr: :5001
          prometheus:
            enabled: true
            path: /metrics
        headers:
          X-Content-Type-Options: [nosniff]
      health:
        storagedriver:
          enabled: true
          interval: 10s
          threshold: 3
      EOF
      chmod 0644 "${{targets.destdir}}/etc/registry/config.yml"

      # provenance: license marker
      install -d "${{targets.destdir}}/usr/share/doc/harbor-registry"
      cp LICENSE "${{targets.destdir}}/usr/share/doc/harbor-registry/" 2>/dev/null || true

  - uses: strip
