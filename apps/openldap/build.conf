# openldap: Wolfi apk (FROM_SOURCE=0, apko-only, 0-CVE). The OpenLDAP slapd
# standalone LDAP directory server plus the client tools (ldapadd/ldapsearch/
# ldapwhoami/slappasswd) needed for admin, bootstrap and smoke tests.
#
# Why apk and NOT from source: Wolfi already packages the whole 2.6 tree
# (openldap-2.6, -clients, -back-mdb, overlays) and tracks it at upstream's newest
# release, so an in-house melange build (openssl + cyrus-sasl + libtool + a
# --enable-mdb configure dance) would only duplicate work AND take the 0-CVE
# maintenance burden off Wolfi's shoulders and onto ours. Same fast clean path as
# ingress-nginx / kubectl.
#
# Versions: upstream now ships TWO release lines, 2.6.x and 2.7.x (2.7.1 is a
# Feature Release, the same label 2.6 carries, and both sit in the openldap-release
# directory), and Wolfi packages each as versioned `openldap-2.6*` / `openldap-2.7*`
# apks. So VERSIONS holds one entry per line -- the full X.Y.Z used as the image tag
# -- mapped to the exact apk release via PIN. The note this replaces said upstream
# maintained a single line, which was true when written.
# (The UNVERSIONED `openldap` apk is stale at 2.6.10-r5; never use it.)
#
# 2026-09-18: verified on BOTH arches that openldap-2.7, -2.7-clients and
# -2.7-back-mdb, the three packages this recipe installs, all exist at 2.7.1-r0.
FROM_SOURCE=0
VERSIONS=(2.6.14 2.7.1)
declare -A PIN=(
  [2.6.14]=2.6.14-r0
  [2.7.1]=2.7.1-r0
)
# The apk name carries the LINE, not the patch: 2.7.1 installs openldap-2.7 and
# 2.6.14 installs openldap-2.6. Derive it from the version rather than hardcoding
# one line, or a second line silently asks Wolfi for openldap-2.6=2.7.1-r0.
render() {
  local v=$1 p=${PIN[$1]} l=${1%.*}
  echo "s|__PKG_SERVER__|openldap-${l}=${p}|g; s|__PKG_CLIENTS__|openldap-${l}-clients=${p}|g; s|__PKG_MDB__|openldap-${l}-back-mdb=${p}|g"
}
