# k6 (grafana/k6): from-source via melange (Go build from the git tag tarball).
# Image-only (a load-testing CLI, no chart). NEWEST-ONLY: just the latest stable
# release (github.com/grafana/k6 tags vX.Y.Z). Single static Go binary, CGO off.
# The version is a source-level const (internal/build.Version, baked into the
# tagged tarball), so `k6 version` reports the real release with no -X stamping.
FROM_SOURCE=1
VERSIONS=(2.1.0)
declare -A SHA256=(
  [2.1.0]=04d9a1586b23db9d1746aa61f29ae4aee4d2a5da7d5782e11f7530405b5f57ab
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
