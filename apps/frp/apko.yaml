# frp runtime: frps is the entrypoint (control port 7000 by default); frpc is in the same image
# (`--entrypoint /usr/bin/frpc`). Pass a config with `-c <file>.toml`. Nonroot uid 1001, so
# proxied ports must be above 1023 unless the pod grants NET_BIND_SERVICE.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-frp@local

accounts:
  groups:
    - groupname: frp
      gid: 1001
  users:
    - username: frp
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/bin/frps

work-dir: /etc/frp

paths:
  - path: /etc/frp
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o755

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-frp"
  org.opencontainers.image.licenses: "Apache-2.0"
  org.opencontainers.image.version: "__VER__"
