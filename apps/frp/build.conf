# frp (fatedier/frp, Apache-2.0): fast reverse proxy that exposes services behind NAT or a
# firewall. From source via melange: frps (server) and frpc (client), both static Go binaries,
# in one image; the entrypoint is frps, run frpc with `--entrypoint /usr/bin/frpc`.
# The tag ships web/frps and web/frpc without their built dashboards (go:embed dist), so the
# Vue dashboards are built with npm in the sandbox first. LATEST-ONLY: one minor line a month,
# and the dashboard toolchain moves with each release.
FROM_SOURCE=1
VERSIONS=(0.72.0)
declare -A SHA256=(
  [0.72.0]=20e2249c2b17cb7624317b0a9a0baed06c80c547d27568d18a32c78e46d79230
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
