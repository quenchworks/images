# weaviate (Weaviate vector database): from-source via melange (Go build from the git
# tag tarball). Latest patch of the last 3 minor lines (1.36, 1.37, 1.38). Each release
# pins its source tarball by sha256. Single static Go binary, no CGO. Version is stamped
# into the binary via -X on github.com/weaviate/weaviate/usecases/build.Version.
FROM_SOURCE=1
VERSIONS=(1.38.2)
declare -A SHA256=(
  [1.38.2]=5293b72f7cb1a3dba0e30ac1863f4c4ab7234472f46ee3abfa8af0e78e9e3c9a
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
