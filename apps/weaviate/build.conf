# weaviate (Weaviate vector database): from-source via melange (Go build from the git
# tag tarball). Newest release only (1.38.8), pinned by sha256. Single static Go binary, no CGO. Version is stamped
# into the binary via -X on github.com/weaviate/weaviate/usecases/build.Version.
FROM_SOURCE=1
VERSIONS=(1.38.8)
declare -A SHA256=(
  [1.38.8]=9e86b1907d19ab5be36ed4e95d59bbb9e85e40e1fb823aaaa0e4d3c648a1b525
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
