# weaviate (Weaviate vector database): from-source via melange (Go build from the git
# tag tarball). Newest release only (1.39.5), pinned by sha256. Single static Go binary, no CGO. Version is stamped
# into the binary via -X on github.com/weaviate/weaviate/usecases/build.Version.
FROM_SOURCE=1
VERSIONS=(1.39.16 1.40.5)
declare -A SHA256=(
  [1.39.16]=2b3a616a3a52400e95b09461db45c84a7118a09758c9729acd4283789adbbdb4
  [1.40.5]=9bad9ed754d3b556ebedf9fe5244c63efd9e66d504b9ece1631bc540d0a46399
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
