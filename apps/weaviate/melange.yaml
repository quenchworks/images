# Builds Weaviate from source onto Wolfi. Single static Go binary, no CGO (matching
# upstream's .goreleaser.yaml, which sets CGO_ENABLED=0). The server's main package is
# ./cmd/weaviate-server, producing the full weaviate-server binary (REST API + gRPC).
# The version is stamped via -X on usecases/build.Version so the build_info metric and
# /v1/meta report the real release. Output is a signed APK in Quenchworks' own repo.
# No upstream distro binaries.
package:
  name: quench-weaviate
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Weaviate vector database, built from source on Wolfi"
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/weaviate/weaviate/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      # 0-CVE gate: minimal same-major bumps of vulnerable transitive modules.
      # CVE-2026-2303 (MEDIUM) in go.mongodb.org/mongo-driver <v1.17.7.
      # CVE-2026-46600 (UNKNOWN) in golang.org/x/net <v0.56.0 (dnsmessage panic).
      # CVE-2026-56852 (UNKNOWN) in golang.org/x/text <v0.39.0 (infinite loop).
      # otel CVE-2026-81870 / CVE-2026-81871: the published image drifted onto these
      # after release. Every module listed is one this app's own go.mod carries; a
      # floor naming a module absent from the graph is rejected by some recipes.
      # 0-CVE FLOORS, not pins (docs/go-module-float.md): raise a module only where go.mod has it
      # below the floor; a module absent from the graph is skipped. Bare `go get` pins downgraded
      # newer upstream releases (found 2026-10-05).
      FLOOR="go.mongodb.org/mongo-driver@v1.17.7 go.opentelemetry.io/otel@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.45.0 go.opentelemetry.io/otel/metric@v1.45.0 go.opentelemetry.io/otel/sdk@v1.45.0 go.opentelemetry.io/otel/sdk/metric@v1.45.0 go.opentelemetry.io/otel/trace@v1.45.0 golang.org/x/net@v0.58.0 golang.org/x/crypto@v0.56.0 golang.org/x/text@v0.41.0 google.golang.org/grpc@v1.83.2 golang.org/x/oauth2@v0.36.0"
      # Go semver order (a release outranks its prereleases); busybox sort -V does not.
      vlt() { awk -v a="${1#v}" -v b="${2#v}" 'function pp(s,  p){sub(/\+.*/,"",s);p=index(s,"-");if(p){C=substr(s,1,p-1);P=substr(s,p+1)}else{C=s;P=""}} function cmp(x,y,  i,n,m,X,Y){n=split(x,X,".");m=split(y,Y,".");for(i=1;i<=n&&i<=m;i++){if(X[i]==Y[i])continue;if(X[i]~/^[0-9]+$/&&Y[i]~/^[0-9]+$/)return (X[i]+0<Y[i]+0)?-1:1;if(X[i]~/^[0-9]+$/)return -1;if(Y[i]~/^[0-9]+$/)return 1;return (X[i]<Y[i])?-1:1}return (n<m)?-1:(n>m)?1:0} BEGIN{pp(a);ca=C;pa=P;pp(b);cb=C;pb=P;c=cmp(ca,cb);if(c==0){if(pa==pb)c=0;else if(pa=="")c=1;else if(pb=="")c=-1;else c=cmp(pa,pb)}exit !(c<0)}'; }
      need=""
      for mv in $FLOOR; do
        have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${mv%@*}" 2>/dev/null)"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        vlt "$have" "${mv#*@}" && need="$need $mv"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || go get $need
      # grpc GHSA-hrxh-6v49-42gf -> 1.82.1 (+ coherent otel 1.43.0 + oauth2 0.36.0 cascade).
      go mod tidy
      go build -trimpath \
        -ldflags "-s -w -X github.com/weaviate/weaviate/usecases/build.Version=${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/weaviate-server" ./cmd/weaviate-server
