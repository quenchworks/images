# tag with the web UI embedded. Latest line only; the sha256 is from a download of the tag
# archive on 2026-09-29.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(8.3.2)
declare -A SHA256=(
  [8.3.2]=a2d0e8819a256bf1a0a88365aa1e950457af90931cdfe894c4f1303fc9098177
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
