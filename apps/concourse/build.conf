# archive on 2026-09-29.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(8.3.3)
declare -A SHA256=(
  [8.3.3]=a49adf63ea3405f5498d6cd089b954f97ad1833bf82c557df5dff6c4c4cc4a89
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
