# Builds Concourse from the release tag: the Elm/less web UI with yarn, embedded into the
# one `concourse` binary (web/handler.go go:embeds web/public), and the static init that
# worker containers run as PID 1. The build-time Node tree never reaches the package.
package:
  name: quench-concourse
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Concourse CI (web and worker), built from source"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata
      # the worker's containerd runtime; the web node never execs these
      - containerd-2
      - runc
      - iptables

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - bash
      - build-base
      - glibc-dev            # libc.a: init is linked statically
      - ca-certificates-bundle
      - go-1.27
      - nodejs-24
      - corepack
      - git
      - curl                   # fetches the CNI plugins source

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/concourse/concourse/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - name: Build the web UI (less + elm + webpack) into web/public
    runs: |
      set -eu
      export HOME="$(mktemp -d)" COREPACK_HOME=/tmp/corepack COREPACK_ENABLE_DOWNLOAD_PROMPT=0
      mkdir -p /tmp/corepack-bin && corepack enable --install-directory /tmp/corepack-bin
      export PATH="/tmp/corepack-bin:$PATH"
      yarn install --immutable
      yarn build
      test -s web/public/elm.min.js && test -s web/public/main.css

  - name: Build the concourse binary and init
    runs: |
      set -eu
      export CGO_ENABLED=0 GOFLAGS=-mod=mod GO111MODULE=on GOTOOLCHAIN=local
      # ---- 0-CVE module float (docs/go-module-float.md) ----------------------
      # FLOOR is a floor, not a pin. Measured 2026-09-29 on 8.3.1: containerd/v2 2.3.5,
      # grpc 1.83.1, x/mod 0.38.0 and the otel 1.44.0 family (sdk carries
      # CVE-2026-81870); the otel modules release as a set, so they move together.
      FLOOR="github.com/containerd/containerd/v2@v2.3.6 google.golang.org/grpc@v1.83.2 golang.org/x/mod@v0.40.0 go.opentelemetry.io/otel@v1.45.0 go.opentelemetry.io/otel/sdk@v1.45.0 go.opentelemetry.io/otel/trace@v1.45.0 go.opentelemetry.io/otel/metric@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.45.0"
      MODS="$(echo "$FLOOR" | tr ' ' '\n' | cut -d@ -f1)"
      below_floor() {
        awk -v floor="$FLOOR" -v tag="$1" '
          BEGIN { n = split(floor, f, " ")
                  for (i = 1; i <= n; i++) { split(f[i], kv, "@"); want[kv[1]] = kv[2] } }
          ($1 in want) {
            split(substr($2, 2), g, "."); split(substr(want[$1], 2), w, ".")
            for (i = 1; i <= 3; i++) {
              if ((g[i] + 0) > (w[i] + 0)) next
              if ((g[i] + 0) < (w[i] + 0)) { print $1 "@" want[$1] " (" tag " has " $2 ")"; next }
            }
          }'
      }
      go list -m -e $MODS
      need="$(go list -m -e $MODS | awk 'NF >= 2 && $NF ~ /^v[0-9]/ { print $1, $NF }' | below_floor go.mod | awk '{ print $1 }')"
      if [ -n "$need" ]; then go get $need; fi
      go mod tidy
      # concourse finds its assets (init, resource-types) relative to its own path, so it
      # lives under /usr/local/concourse/bin; /usr/bin/concourse is a symlink, which
      # os.Executable resolves.
      B="${{targets.destdir}}/usr/local/concourse/bin"
      install -d "$B" "${{targets.destdir}}/usr/bin"
      go build -trimpath -ldflags "-s -w -X github.com/concourse/concourse.Version=${{package.version}}" \
        -o "$B/concourse" ./cmd/concourse
      ln -s /usr/local/concourse/bin/concourse "${{targets.destdir}}/usr/bin/concourse"
      bad="$(go version -m "$B/concourse" \
        | awk '$1 == "dep" || $1 == "=>" { print $2, $3 }' | below_floor concourse)"
      [ -z "$bad" ] || { echo "0-CVE float did not reach concourse:"; echo "$bad"; exit 1; }
      # PID 1 inside worker containers: a static C program, so it runs in any rootfs
      gcc -O2 -static -o "$B/init" cmd/init/init.c
      "$B/concourse" --version | grep -qx "${{package.version}}"

  # The worker's CNI plugins, built from source: Wolfi's cni-plugins 1.9.1-r14 links
  # golang.org/x/sys v0.35.0 (CVE-2026-39824, fixed 0.44.0) and v1.9.1 is the newest upstream.
  # They go in /usr/local/concourse/bin, the directory the worker searches by default.
  - name: Build the CNI plugins the worker uses (bridge, host-local, firewall, loopback)
    runs: |
      set -eu
      export CGO_ENABLED=0 GOFLAGS=-mod=mod GO111MODULE=on GOTOOLCHAIN=local
      mkdir -p /tmp/cni && cd /tmp/cni
      curl -fsSL -o cni.tgz https://github.com/containernetworking/plugins/archive/refs/tags/v1.9.1.tar.gz
      echo "34bd82d47e981940751619c9cc44c095bb90bfcaf8d71865cbb822c37690a764  cni.tgz" | sha256sum -c -
      tar -xzf cni.tgz --strip-components=1
      go get golang.org/x/sys@v0.47.0 && go mod tidy
      B="${{targets.destdir}}/usr/local/concourse/bin"
      for p in main/bridge ipam/host-local meta/firewall main/loopback; do
        go build -trimpath -ldflags "-s -w -X github.com/containernetworking/plugins/pkg/utils/buildversion.BuildVersion=v1.9.1" \
          -o "$B/$(basename $p)" "./plugins/$p"
      done
      for b in bridge host-local firewall loopback; do
        v="$(go version -m "$B/$b" | awk '$2 == "golang.org/x/sys" { print $3 }')"
        [ "$v" = v0.47.0 ] || { echo "$b links golang.org/x/sys $v, not v0.47.0"; exit 1; }
      done

test:
  pipeline:
    - runs: |
        concourse --version
        test -x /usr/local/concourse/bin/init
