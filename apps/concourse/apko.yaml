contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-concourse@local

# The web node runs as 1001. A worker needs root and a privileged pod (it creates
# containers), so the chart sets runAsUser 0 for that role only.
accounts:
  groups:
    - groupname: concourse
      gid: 1001
  users:
    - username: concourse
      uid: 1001
      gid: 1001
      homedir: /tmp
  run-as: 1001

environment:
  HOME: /tmp

entrypoint:
  command: /usr/bin/concourse
cmd: web

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-concourse"
  org.opencontainers.image.licenses: "Apache-2.0"
