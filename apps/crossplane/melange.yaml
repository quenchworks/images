# Builds the Crossplane control plane from source onto Wolfi. Static Go binary, no CGO.
#
# The repo is a Go module (github.com/crossplane/crossplane/v2) whose only command is
# cmd/crossplane -- a MULTI-CALL binary: `core start` runs the control plane, `core init`
# is the bootstrap step, `rbac start` the RBAC manager. All of them ship in one binary,
# so there is nothing to split.
#
# Besides the binary the image MUST carry two data trees that `crossplane core init`
# reads from the filesystem and applies to the cluster (defaults --crds-path=/crds and
# --webhook-configurations-path=/webhookconfigurations, see cmd/crossplane/core/init.go):
#   /crds                     the core CRDs (Provider, Function, Configuration,
#                             CompositeResourceDefinition, Composition, Operation, ...)
#   /webhookconfigurations    the core ValidatingWebhookConfiguration templates
# This is why the CHART does not ship a crds/ directory: the CRDs travel with the image
# at the exact revision that understands them, and the init container installs them.
#
# The version is stamped via crossplane-runtime's version package, WITH the leading "v"
# exactly as upstream's nix/build.nix does, so `crossplane --version` prints "vX.Y.Z".
package:
  name: quench-crossplane
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Crossplane control plane, built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-1.26

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/crossplane/crossplane/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      set -eu
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      export GOTOOLCHAIN=local   # use the installed go-1.26, don't fetch a newer go.mod toolchain

      # ---- 0-CVE module float (docs/go-module-float.md) --------------------
      # FLOOR is a FLOOR, not a pin. A bare `go get mod@vX` fails silently in two
      # directions: it is a NO-OP when an upstream `replace` overrides it, and it
      # becomes a DOWNGRADE once upstream requires more than vX -- re-introducing
      # the CVE it was added to clear. So float only what is below the floor, then
      # assert the SHIPPED BINARY carries nothing below it.
      #
      # As of 2.1.8/2.2.4/2.3.4 every floor below is ALREADY satisfied upstream, so
      # the float is a no-op today and exists purely as a regression guard for the
      # next version bump. The only `replace` in crossplane's go.mod points its own
      # ./apis submodule at the worktree, so nothing here is replace-shadowed.
      #
      # github.com/google/cel-go is deliberately NOT in FLOOR. Crossplane pulls it
      # transitively via k8s.io/apiserver (0.26/0.27, below the GHSA-gcjh-h69q-9w9g
      # fix in 0.29.0) but does not IMPORT it: `go version -m` on the built binary
      # lists no cel-go, so it is not part of the shipped artifact and not part of
      # the scan surface. Floating it would only churn the module graph. If a future
      # release starts linking it, the Trivy gate flags it -- add
      # `github.com/google/cel-go@v0.29.2` to FLOOR then (verified to compile
      # against k8s.io/apiserver v0.34/v0.35 on all three current lines).
      FLOOR="github.com/sigstore/sigstore-go@v1.3.0 golang.org/x/mod@v0.40.0 golang.org/x/net@v0.58.0 golang.org/x/crypto@v0.56.0 golang.org/x/sys@v0.47.0 golang.org/x/text@v0.41.0 golang.org/x/oauth2@v0.36.0 google.golang.org/grpc@v1.83.2 go.opentelemetry.io/otel@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.45.0 go.opentelemetry.io/otel/sdk@v1.45.0 go.opentelemetry.io/otel/trace@v1.45.0 go.opentelemetry.io/otel/metric@v1.45.0"
      MODS="$(echo "$FLOOR" | tr ' ' '\n' | cut -d@ -f1)"
      # prints "<mod>@<floor> (<tag> has <ver>)" for every module below its floor
      below_floor() {
        awk -v floor="$FLOOR" -v tag="$1" '
          BEGIN { n = split(floor, f, " ")
                  for (i = 1; i <= n; i++) { split(f[i], kv, "@"); want[kv[1]] = kv[2] } }
          ($1 in want) {
            split(substr($2, 2), g, "."); split(substr(want[$1], 2), w, ".")
            for (i = 1; i <= 3; i++) {
              if ((g[i] + 0) > (w[i] + 0)) next
              if ((g[i] + 0) < (w[i] + 0)) { print $1 "@" want[$1] " (" tag " has " $2 ")"; next }
            }
          }'
      }
      # `go list -m` prints "<mod> <ver>" or "<mod> <ver> => <mod> <ver>", so $NF is
      # the EFFECTIVE version and a replace cannot hide behind the require line.
      go list -m -e $MODS
      need="$(go list -m -e $MODS | awk 'NF >= 2 && $NF ~ /^v[0-9]/ { print $1, $NF }' | below_floor go.mod | awk '{ print $1 }')"
      if [ -n "$need" ]; then go get $need; go mod tidy; fi

      # The version symbol MOVED between releases, so the path cannot be hardcoded:
      #   2.1.x / 2.2.x  cmd/crossplane imports github.com/crossplane/crossplane/v2/internal/version
      #   2.3.x+         it imports    github.com/crossplane/crossplane-runtime/v2/pkg/version
      # crossplane-runtime v2.1.7 has no pkg/version package at all, so the old hardcoded
      # -X was silently dropped by the linker on 2.1.8 and 2.2.4 and `crossplane --version`
      # printed nothing. `-X` on a package that is not linked is not an error, which is why
      # this was invisible until test.sh started running in CI.
      #
      # Resolve the path from the source we are building instead of assuming either one.
      vpkg="$(grep -oE '"github.com/crossplane/[a-z0-9/-]*version"' ./cmd/crossplane/main.go \
              | tr -d '"' | head -1)"
      test -n "$vpkg" || { echo "FATAL: cannot find the version package imported by cmd/crossplane"; exit 1; }
      echo "stamping version into $vpkg"

      go build -trimpath \
        -ldflags "-s -w -X=${vpkg}.version=v${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/crossplane" ./cmd/crossplane

      # Assert the stamp actually landed. A silently-dropped -X is exactly the bug this
      # replaces, so failing the build here is cheaper than failing the boot test later.
      got="$("${{targets.destdir}}/usr/bin/crossplane" --version 2>&1 | tr -d '\r')"
      test "$got" = "v${{package.version}}" \
        || { echo "FATAL: version stamp is '$got', expected v${{package.version}}"; exit 1; }

      # The float is only real if it reached the BINARY. Every `dep`/`=>` line of
      # `go version -m` must be at or above its floor -- the `=>` line is what
      # catches a replace-shadowed float. Fail the build rather than ship it.
      bad="$(go version -m "${{targets.destdir}}/usr/bin/crossplane" \
        | awk '$1 == "dep" || $1 == "=>" { print $2, $3 }' | below_floor crossplane)"
      [ -z "$bad" ] || { echo "❌ 0-CVE float did not reach the binary:"; echo "$bad"; exit 1; }

      # Data trees `crossplane core init` applies to the cluster (see header).
      install -d "${{targets.destdir}}/crds" "${{targets.destdir}}/webhookconfigurations"
      install -m 0644 cluster/crds/*.yaml "${{targets.destdir}}/crds/"
      install -m 0644 cluster/webhookconfigurations/*.yaml "${{targets.destdir}}/webhookconfigurations/"
