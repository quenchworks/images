# crossplane: from-source via melange (Go build from the git tag tarball).
# Latest patch of the last 3 minor lines (2.1, 2.2, 2.3). Each release pins its
# source tarball by sha256. ONE multi-call binary is shipped (cmd/crossplane):
# `crossplane core start` is the control plane, `crossplane core init` the
# bootstrap step that installs the core CRDs, `crossplane rbac start` the RBAC
# manager. Single static Go binary, no CGO. Version is stamped into the binary
# via -X github.com/crossplane/crossplane-runtime/v2/pkg/version.version
# (upstream nix/build.nix), and upstream stamps it WITH the leading "v".
FROM_SOURCE=1
VERSIONS=(2.1.8 2.2.4 2.3.4)
declare -A SHA256=(
  [2.1.8]=841740947fce806bfbf15032e8f14922898986add9357fed1833c51bd0d14c5b
  [2.2.4]=c5c7cf524f69dccdacf4632c6161a4ebb5ee0b602ff83a6d6de663d52622e767
  [2.3.4]=7100fd96fa7f9d30fde82da181f9a515f7e75bd24dee387c2c7c6b0cd92b1750
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
