# Assembles the ko image: nonroot uid 1001, entrypoint ko; ships go and git for `ko build`.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-ko@local
    - go
    - git
    - busybox

accounts:
  groups:
    - groupname: ko
      gid: 1001
  users:
    - username: ko
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/bin/ko

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-ko"
  org.opencontainers.image.licenses: "Apache-2.0"
