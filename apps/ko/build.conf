# ko (ko-build/ko): builds Go applications into container images with no Dockerfile.
# From source via melange, static Go (CGO off), version stamped as upstream's
# .goreleaser.yml (-X github.com/google/ko/pkg/commands.Version). ko runs `go build`,
# so the image carries Wolfi's go toolchain and git, like upstream's golang-based image.
# Image only, no chart. The last 2 minor lines: 0.17.1 (2024) does not build once the
# floats move viper past the mapstructure API it uses (measured 2026-10-01).
FROM_SOURCE=1
VERSIONS=(0.18.1 0.19.1)
declare -A SHA256=(
  [0.18.1]=1006eb94b6260690ab3ec79cbd03342e09cb0f32cecdd1b8743fa216e2fe7b0e
  [0.19.1]=7accc1f4ad074285086573b084387bef5871872ef16e3f292d5818a99e4feeae
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
