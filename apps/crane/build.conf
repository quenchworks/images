# crane: crane, the go-containerregistry CLI for working with images and registries
# directly (copy, digest, append, export, mutate, catalog). APKO-ONLY: Wolfi builds
# crane from source; its 0.22.1-r0 scanned 0 findings on 2026-09-25, so apko assembles
# the image from the pinned apk. Image only, no chart.
#
# NEWEST-ONLY: go-containerregistry ships one supported line.
BLOCKED=0
FROM_SOURCE=0
VERSIONS=(0.22.1)
declare -A PIN=(
  [0.22.1]=0.22.1-r0
)
render() { echo "s|__PKG__|crane=${PIN[$1]}|g"; }
