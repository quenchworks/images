# soju (codeberg.org/emersion/soju, AGPL-3.0): an IRC bouncer that keeps users connected to their networks
# and plays back history to every client, with its own user database. Images issue #50.
#
# Pure Go with modernc SQLite (-tags=moderncsqlite, CGO off). Config at /etc/soju/config (plain IRC on
# 6667, database under /var/lib/soju, the volume; the admin socket at /tmp/soju-admin, since a socket
# file left on the volume blocks the next start). busybox is in the image so the chart's
# init container can pipe a password into `sojudb create-user` (it reads stdin).
# LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(0.11.1)
declare -A SHA256=(
  [0.11.1]=42f0b422267fb039ae598d34122f89857fe0cb590baf7136032bf46a244b00eb
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
