package:
  name: quench-soju
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened soju IRC bouncer, built from source on Wolfi"
  copyright:
    - license: AGPL-3.0-only
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.26

pipeline:
  - uses: fetch
    with:
      uri: https://codeberg.org/emersion/soju/archive/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - name: Build soju, sojuctl and sojudb
    runs: |
      set -eu
      export CGO_ENABLED=0 GOFLAGS="-mod=mod -tags=moderncsqlite" GOTOOLCHAIN=local
      FLOOR="golang.org/x/crypto@v0.58.1-0.20261009181718-2f1f834330b2 golang.org/x/net@v0.62.0 golang.org/x/sys@v0.49.0 golang.org/x/text@v0.43.0"
      MODS="$(echo "$FLOOR" | tr ' ' '\n' | cut -d@ -f1)"
      below_floor() {
        awk -v floor="$FLOOR" -v tag="$1" '
          BEGIN { n = split(floor, f, " ")
                  for (i = 1; i <= n; i++) { split(f[i], kv, "@"); want[kv[1]] = kv[2] } }
          ($1 in want) {
            split(substr($2, 2), g, "."); split(substr(want[$1], 2), w, ".")
            for (i = 1; i <= 3; i++) {
              if ((g[i] + 0) > (w[i] + 0)) next
              if ((g[i] + 0) < (w[i] + 0)) { print $1 "@" want[$1] " (" tag " has " $2 ")"; next }
            }
          }'
      }
      need="$(go list -m -e $MODS | awk 'NF >= 2 && $NF ~ /^v[0-9]/ { print $1, $NF }' | below_floor go.mod | awk '{ print $1 }')"
      if [ -n "$need" ]; then go get $need; fi
      go mod tidy
      ld="-s -w -X codeberg.org/emersion/soju/config.DefaultPath=/etc/soju/config -X codeberg.org/emersion/soju/config.DefaultUnixAdminPath=/tmp/soju-admin"
      for b in soju sojuctl sojudb; do
        go build -trimpath -ldflags "$ld" -o "${{targets.destdir}}/usr/bin/$b" ./cmd/$b
      done
      bad="$(go version -m "${{targets.destdir}}/usr/bin/soju" | awk '$1 == "dep" || $1 == "=>" { print $2, $3 }' | below_floor soju)"
      [ -z "$bad" ] || { echo "float did not reach the binary:"; echo "$bad"; exit 1; }
      "${{targets.destdir}}/usr/bin/soju" -h 2>&1 | grep -q -- -config

      mkdir -p "${{targets.destdir}}/etc/soju"
      cat > "${{targets.destdir}}/etc/soju/config" <<'CONF'
      listen irc+insecure://:6667
      listen unix+admin://
      db sqlite3 /var/lib/soju/main.db
      message-store db
      CONF

test:
  pipeline:
    - runs: soju -h 2>&1 | grep -q -- -config
