# Wakapi from the release tag as upstream's Dockerfile builds it: CGO off, GOEXPERIMENT=jsonv2.
package:
  name: quench-wakapi
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Wakapi coding statistics server, built from source on Wolfi"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27          # go.mod: go 1.27

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/muety/wakapi/archive/refs/tags/${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - runs: |
      set -eu
      export CGO_ENABLED=0 GOTOOLCHAIN=local GOFLAGS=-mod=mod
      # floors, raised only when below (a bare go get downgrades once upstream passes it)
      FLOOR="golang.org/x/crypto@v0.58.1-0.20261009181718-2f1f834330b2 golang.org/x/net@v0.62.0 golang.org/x/text@v0.43.0 golang.org/x/sys@v0.49.0 golang.org/x/image@v0.47.0 github.com/go-chi/chi/v5@v5.4.0 github.com/go-jose/go-jose/v4@v4.1.9"
      need=""
      for f in $FLOOR; do
        have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${f%@*}")"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        [ "$(printf '%s\n%s\n' "$have" "${f#*@}" | sort -V | head -1)" = "${f#*@}" ] || need="$need $f"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || go get $need
      go mod tidy
      # the tag ships version.txt as "dev"; upstream's CI writes the release before building
      echo "${{package.version}}" > version.txt
      GOEXPERIMENT=jsonv2 go build -trimpath -ldflags "-s -w" -o "${{targets.destdir}}/usr/bin/wakapi" main.go
      install -Dm644 config.default.yml "${{targets.destdir}}/etc/wakapi/config.yml"
      # IPv6 off in the default config, as upstream's image does (pods may have no ::1)
      sed -i 's/listen_ipv6: ::1/listen_ipv6: "-"/' "${{targets.destdir}}/etc/wakapi/config.yml"
      "${{targets.destdir}}/usr/bin/wakapi" -version 2>&1 | grep -F "${{package.version}}"

test:
  pipeline:
    - runs: |
        wakapi -version
