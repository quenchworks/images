# Wakapi (muety/wakapi, MIT): a self-hosted, WakaTime-compatible backend for coding statistics,
# with a web UI and API, on SQLite, PostgreSQL, MySQL or SQL Server. From source via melange: one
# CGO-free Go binary (GOEXPERIMENT=jsonv2, as upstream) with its templates and assets embedded,
# plus upstream's default config at /etc/wakapi/config.yml (settings via WAKAPI_* env).
# LATEST-ONLY: one release line. Tags have no v prefix.
FROM_SOURCE=1
VERSIONS=(2.18.2)
declare -A SHA256=(
  [2.18.2]=1c77089b75b6e88dbb984708d0a03476867913e29c61b09bf783063336e73e1e
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
