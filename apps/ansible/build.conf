# STATUS: ZLIB-ONLY as of 2026-09-16. Measured, not assumed: run 35065941762
# on af0623d gated with exactly one finding, zlib CVE-2026-85091, on every
# version and both arches. Nothing else in this image is flagged.
#
# Wolfi is at 1.3.2.1_rc20260601-r0 and the advisory wants 1.3.3-r0, which
# upstream madler/zlib has never tagged. Downgrading to Wolfi's 1.3.1-r51
# is not a way out either: it predates the 1.3.2-r0 fix for CVE-2026-27171.
#
# BLOCKED=1 skips build+merge so sweeps stop burning a red run here. Clear
# it with scripts/blocked.py --dispatch once Wolfi ships zlib 1.3.3-r0.
# ansible: image-only recipe input (an Ansible control-node image; no chart).
#
# Ansible is a pure-Python project distributed as the PyPI meta-package `ansible`
# (the "community" package), which pulls in `ansible-core` plus the curated set of
# bundled collections. There is no single Wolfi `ansible` apk that ships the whole
# control node, so we install `ansible==<VER>` from PyPI into a virtualenv on a Wolfi
# python-3.13 base (the mlflow/airflow venv-on-Wolfi pattern), add the control-node
# CLI tooling (openssh-client, git, sshpass, rsync) in apko, harden it on a minimal
# nonroot base, and gate it 0-CVE with Trivy (comprehensive mode, so the venv's
# Python packages are scanned too). Inspired by willhallonline/docker-ansible: an
# out-of-the-box control node ready to run playbooks over SSH.
#
# Versions = the newest 1-2 stable `ansible` COMMUNITY releases from PyPI (bare X.Y.Z,
# used as-is; no `v` prefix). The image TAG is the community version. Each community
# version pins one ansible-core line (14.x -> ansible-core ~=2.21) — `ansible --version`
# reports the CORE version, while `pip show ansible` reports the community version, so
# the build asserts BOTH. pip pins the install to __VER__, so there is no per-arch
# source SHA to track (PyPI is the source); render() substitutes the version into both
# recipes.
#   __VER__ = ansible community version (bare X.Y.Z), used as `ansible==<VER>`
BLOCKED=1
FROM_SOURCE=0
VERSIONS=(14.3.0 14.3.1)
render() { echo "s/__VER__/$1/g"; }
