# Vikunja (code.vikunja.io/vikunja, mirrored to github.com/go-vikunja/vikunja):
# from-source via melange. Image-only (the all-in-one to-do / project management
# server, no chart). NEWEST-ONLY: the single newest stable release. Vikunja is a
# single Go binary that serves both the REST API and the go:embed'd Vue 3 web UI,
# so the frontend is (re)built with pnpm+Node in the build sandbox first (see
# melange.yaml). Version is stamped via -X on
# code.vikunja.io/api/pkg/version.Version -- note the Go module path is
# code.vikunja.io/api (not .../vikunja); upstream tags carry a "v" prefix, the
# stamped version is the bare X.Y.Z. The github and gitea source archives are
# byte-identical; we fetch from github (reliably downloadable) and sha256-pin it.
FROM_SOURCE=1
VERSIONS=(2.6.0)
declare -A SHA256=(
  [2.6.0]=03c22467d0d41f96414b50c4d74f769e3034b45e5e9e88e27c87b8c0670c209e
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
