# redis: from-source via melange (C build). Latest 3 stable minor lines, newest
# patch each. Each release pins its source tarball by sha256.
FROM_SOURCE=1
VERSIONS=(8.4.4 8.6.4 8.8.0)
declare -A SHA256=(
  [8.4.4]=c41ce78682346c1caab0ea917826eb408d666746755a0772b55754227d72ebe9
  [8.6.4]=559c2e50c496b2d4afcfb491af27763a1b170037317789ecf309025d0caece24
  [8.8.0]=88422181efb0c9c0abba332e3e391d409e1e13714b838931669235e5796f704b
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
