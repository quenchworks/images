# redis: from-source via melange (C build). Latest 3 stable minor lines, newest
# patch each. Each release pins its source tarball by sha256.
#
# 8.10.0 BUILD NOTE: the 8.10 line rewrote the top-level Makefile so the default goal is
# `build` -> scripts/build.sh, which also builds the bundled modules vendored in the release
# tarball and fails the pipeline if any of them fails. The recipe therefore drives `make -C src`
# (core only) — the same thing 8.6/8.8 did by default, and what scripts/build.sh does for the
# `redis`/`core` argument. 8.10.0 stays in the window; nothing is dropped.
FROM_SOURCE=1
VERSIONS=(8.10.1)
declare -A SHA256=(
  [8.10.1]=60166c95ab7aedaa9dfe516de685be0a4dd87be95ded59ba429df14c13f1b663
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
