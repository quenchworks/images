# redis: from-source via melange (C build). Latest 3 stable minor lines, newest
# patch each. Each release pins its source tarball by sha256.
FROM_SOURCE=1
VERSIONS=(8.6.5 8.8.1 8.10.0)
declare -A SHA256=(
  [8.6.5]=cd04337495fda9be071d4e1e3c6a61134f83995bd23d1794cad18f878b7012ad
  [8.8.1]=1d1e423c9c808de3cb01dd3300d2b8d305b7691382e31a847ec17b66d3157477
  [8.10.0]=f1baa4b28befd417aa6577ebeedde9e9fc7814cfcc299b2a6d2fd99ef7420a6c
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
