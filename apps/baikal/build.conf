# baikal: Baikal (sabre-io/Baikal, GPL-3.0), a lightweight CalDAV and CardDAV server on sabre/dav with a web
# admin, on SQLite (or MySQL/PostgreSQL). Images issue #80.
#
# From the release zip (vendor/ included). php-8.5-fpm and QuenchWorks' nginx under supervisor; html/ is the
# docroot, /.well-known/caldav and /carddav redirect to dav.php. config/ and Specific/ (the SQLite database)
# live on /var/lib/baikal through BAIKAL_PATH_CONFIG and BAIKAL_PATH_SPECIFIC. The install wizard is replaced
# by /usr/libexec/baikal-setup.php on the first start: baikal.yaml from BAIKAL_ADMIN_PASSWORD (admin hash as
# Auth::hashAdminPassword), the SQLite schema, and an optional DAV user (BAIKAL_DAV_USER/_PASSWORD) through
# Baikal's own User model, which also makes its default calendar and address book.
# LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(0.13.0)
declare -A SHA256=(
  [0.13.0]=81e74df123230e863f608d228fdd7b9a1a788f60b04d37e6973c302192e83f32
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
