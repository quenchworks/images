# Assembles the Atlantis runtime image. Minimal, nonroot, multi-arch, SBOM by
# apko. Atlantis is ONE Go binary (atlantis) that runs the webhook server + web
# UI; this image bundles OpenTofu (/usr/bin/tofu) as the execution engine
# (Atlantis: --default-tf-distribution=opentofu). The chart supplies the VCS
# token, webhook secret, repo-allowlist, atlantis-url and (optionally) a
# repos.yaml via flags/env + a mounted config.
#
# We DO NOT bundle Terraform: Terraform is BUSL-1.1 (source-available, not
# clean). OpenTofu is MPL-2.0 (clean) and is the drop-in execution engine here.
#
# Port 4141: the atlantis server, which serves BOTH the web UI and the
# /events webhook endpoint, plus /healthz for liveness/readiness.
#
# Read-only rootfs friendly: Atlantis writes only to its --data-dir (cloned
# repos + plan files) and /tmp. The base image does not presume a data path;
# the chart mounts a writable PVC at /atlantis-data and an emptyDir at /tmp,
# and points --data-dir there (ATLANTIS_DATA_DIR=/atlantis-data). HOME is set
# to the data dir so git/ssh have a writable home.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - busybox
    - ca-certificates-bundle
    - git
    - openssh-client
    - quench-atlantis@local

accounts:
  groups:
    - groupname: atlantis
      gid: 1001
  users:
    - username: atlantis
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/bin/atlantis server

# Atlantis honours ATLANTIS_*-prefixed env for every server flag. We default the
# data dir to a writable mount so a read-only rootfs works out of the box; the
# chart mounts a PVC there. HOME points at the data dir so git/ssh/tofu have a
# writable home (no $HOME on the read-only rootfs otherwise).
environment:
  ATLANTIS_DATA_DIR: /atlantis-data
  ATLANTIS_PORT: "4141"
  ATLANTIS_DEFAULT_TF_DISTRIBUTION: opentofu
  HOME: /atlantis-data
  TMPDIR: /tmp

# Default port: 4141 (server + webhook + UI + /healthz). Advisory only -- the
# chart Service binds the actual port.
archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-atlantis"
  org.opencontainers.image.licenses: "Apache-2.0 AND MPL-2.0"
