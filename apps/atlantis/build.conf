# atlantis: from-source via melange (fetch tarball at a pinned tag + sha256).
# Latest 3 stable minor lines, each at its newest patch (full X.Y.Z, used as-is).
# Each atlantis release bundles a SPECIFIC OpenTofu version (its Dockerfile
# DEFAULT_OPENTOFU_VERSION), so OpenTofu is pinned PER atlantis version too.
#   __VER__     = atlantis version (release tag v__VER__)
#   __SHA256__  = atlantis tarball sha256
#   __TOFUVER__ = the OpenTofu version that atlantis release ships
#   __TOFUSHA__ = that OpenTofu tarball sha256
FROM_SOURCE=1
VERSIONS=(0.42.0 0.43.0 0.44.0)
declare -A SHA256=(
  [0.42.0]=70f9ba95e0fe2dd17328bea831691710007d4c4c2c532b69c67487f78143913f
  [0.43.0]=d40fb5c41321b239c259c369f833512b62813d99bc9c5e513b4ed5e2057b2b14
  [0.44.0]=ba871944e95a3b366f877d16e061e72e11ba02b898f131d22d3620aabee87fd0
)
declare -A TOFU=(
  [0.42.0]=1.11.6
  [0.43.0]=1.11.6
  [0.44.0]=1.12.0
)
declare -A TOFU_SHA=(
  [0.42.0]=4c16aaac1c8db7386488abb13226f93fed4141698d0ebc02711029e6d6676a82
  [0.43.0]=4c16aaac1c8db7386488abb13226f93fed4141698d0ebc02711029e6d6676a82
  [0.44.0]=d33c3c8ec139abae4c45e8a4187f1400032c8441a2eea4f976d2f16cdb5ec9f4
)
render() {
  echo "s/__VER__/$1/g; s/__SHA256__/${SHA256[$1]}/g; s/__TOFUVER__/${TOFU[$1]}/g; s/__TOFUSHA__/${TOFU_SHA[$1]}/g"
}
