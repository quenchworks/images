# ollama: official-binary via melange (fetch the per-arch prebuilt linux tarball
# from the GitHub release, sha256-verified). Ollama is Go + a bundled llama.cpp/GGML
# C++ inference engine; a plain `go build .` yields a CLI/server that boots and
# answers /api/version but CANNOT run inference (the GGML CPU runner needs a heavy
# cmake build, infeasible on the 2-core CI matrix), so we ship upstream's official
# tarball which bundles both the `ollama` binary and the prebuilt CPU runner libs.
# Ollama moves on one fast 0.30.x line — ship the newest 3 patches. Each release
# publishes separate amd64/arm64 .tar.zst assets, each with its own sha256:
#   __VER__     = version
#   __SHA_AMD__ = ollama-linux-amd64.tar.zst sha256
#   __SHA_ARM__ = ollama-linux-arm64.tar.zst sha256
# Version is stamped by upstream via -X github.com/ollama/ollama/version.Version, so
# `ollama --version` reports the real release (the source default is "0.0.0").
FROM_SOURCE=1
VERSIONS=(0.30.8 0.30.9 0.30.10)
declare -A SHA_AMD=(
  [0.30.8]=ffe2b2c2f2f5f5b30c081ec353c2e0bb2d9ead516064a8e22663b24b8fd8dca0
  [0.30.9]=670557d57f300b8ff98eb3b537e5bda69d4532594e180da7dc61358c614e3619
  [0.30.10]=046d8f28e58d58477a49558d8d1bcb2e81ca8b287f93c44b12ff919c10d178dd
)
declare -A SHA_ARM=(
  [0.30.8]=668a6f934b0b0455128bb4a76c9e50b9e5f274f9dc7710a066b7073e5bd36588
  [0.30.9]=674f70581e569b66f42b53fbdf9c0482276b579bc93b1d254a08c45f5d9f270a
  [0.30.10]=b626aef722ddb9d64dd20a76eeba9267abc5e9494faabb97839db85462b707d7
)
render() {
  echo "s/__VER__/$1/g; s|__SHA_AMD__|${SHA_AMD[$1]}|g; s|__SHA_ARM__|${SHA_ARM[$1]}|g"
}
