# ollama: HYBRID from-source build. Ollama is Go + a bundled llama.cpp/GGML C++
# inference engine. The GGML CPU runner needs a heavy cmake build that also
# FetchContent-pulls the pinned llama.cpp source (LLAMA_CPP_VERSION) and compiles
# the whole GGML tree -- expensive, and it produces C++ .so payloads that carry
# NO Go-module CVEs. So we split the two:
#   * the Go `ollama` binary  -> BUILT FROM SOURCE here (this is where every
#     Trivy-flagged CVE lives: buger/jsonparser, golang.org/x/{crypto,image,net}
#     and the compiled-in Go stdlib). Rebuilding it with the go-1.26 Wolfi
#     toolchain + minor/patch dep bumps clears the comprehensive 0-CVE gate.
#   * the CPU GGML runner libs -> taken from upstream's OFFICIAL per-arch linux
#     tarball (prebuilt, sha256-verified). A plain `go build .` yields a working
#     CLI/server that boots and answers /api/version but CANNOT run inference --
#     it looks for a `llama-server` runner the Go build does not produce -- so we
#     drop upstream's prebuilt runner tree into /usr/lib/ollama, exactly where the
#     binary probes (../lib/ollama). Clean-room-consistent: upstream's published
#     artifact, not a Bitnami chart, and the scan still fully applies.
# Ship the newest single patch on the fast 0.34.x line.
#   __VER__     = version (also stamped via -X .../version.Version)
#   __SRC_SHA__ = github source archive (v<ver>.tar.gz) sha256
#   __SHA_AMD__ = ollama-linux-amd64.tar.zst sha256 (runner libs)
#   __SHA_ARM__ = ollama-linux-arm64.tar.zst sha256 (runner libs)
FROM_SOURCE=1
VERSIONS=(0.34.4 0.40.7 0.40.8)
declare -A SRC_SHA=(
  [0.34.4]=c265dfff78cd2fe909f9f9fa0bb21b1e34dfcd354e1bfa13ed8eac2cfce90940
  [0.40.7]=9db79f02285556ace3f724c1609e6fbf3d17a9812049400f22567ced591b2c16
  [0.40.8]=e4a22341210a7590c84465173fac12e38901e3f1d30e108e9f470737703b7703
)
declare -A SHA_AMD=(
  [0.34.4]=c238986e61d40c0cc5f4a9b9e40b9eea104350b77efa34741fc134e105cb9533
  [0.40.7]=7f082e625b4c334df84ed1558fe282d6d8091fe3545790aef30b3a9c50d44d41
  [0.40.8]=0bb17cc19e9c1339ddbe0cba55148bf068f8f19dec8ec5fd531461aaa207282a
)
declare -A SHA_ARM=(
  [0.34.4]=96f50a1192133028cf4e010d8c333f8af14b1505db6be7b2034c11487e7fd7e6
  [0.40.7]=c74249e87795b1437ce0f484adfd05b4628d7497472c475b13ec6db69ecc69cf
  [0.40.8]=f2e512f67f86ac5c53847e4e586ca8a9d3f359faf7a71cd69e37f12dcc63ded0
)
render() {
  echo "s/__VER__/$1/g; s|__SRC_SHA__|${SRC_SHA[$1]}|g; s|__SHA_AMD__|${SHA_AMD[$1]}|g; s|__SHA_ARM__|${SHA_ARM[$1]}|g"
}
