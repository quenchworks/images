# Packages Ollama onto Wolfi with a HYBRID from-source build. Ollama is Go + a
# bundled llama.cpp/GGML C++ inference engine. We build the Go `ollama` binary
# FROM SOURCE (that is where every Trivy-flagged CVE lives -- buger/jsonparser,
# golang.org/x/{crypto,image,net} and the compiled-in Go stdlib) and reuse
# upstream's OFFICIAL prebuilt CPU GGML runner libs for actual inference.
#
# Why hybrid: the GGML CPU runner is compiled with cmake over the full llama.cpp
# tree (FetchContent-pulled at build time) -- tens of CPU-minutes -- and its
# output is C++ .so payloads that carry NO Go-module vulnerabilities. A plain
# `go build .` produces a working CLI/server (boots, answers /api/version) but
# CANNOT run inference: it looks for a `llama-server` runner the Go build does
# not produce. So we compile only the Go binary (cheap, and where the CVEs are)
# and drop upstream's prebuilt runner tree into /usr/lib/ollama, exactly where
# the binary probes ("/lib/ollama" and relative-to-exe "../lib/ollama"). This
# clears the comprehensive 0-CVE gate the prebuilt upstream binary failed, while
# keeping inference intact. Clean-room-consistent: upstream's own published
# source + runner artifact, not a Bitnami chart, and the scan still fully applies.
package:
  name: quench-ollama
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Ollama, packaged on Wolfi (CPU-only)"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
      - libstdc++          # the bundled GGML CPU runner links libstdc++/libgcc
      - libgcc

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - build-base         # gcc/g++ for CGO (github.com/mattn/go-sqlite3)
      - curl
      - git                # module fetches for go get / go mod tidy
      - go-1.26            # go.mod requires go 1.26.0
      - zstd               # the official runner tarballs are .tar.zst
      - ca-certificates-bundle

pipeline:
  # 1) Fetch + sha256-verify the ollama SOURCE (arch-independent), then build the
  #    Go binary from source with the flagged deps bumped. Trivy's comprehensive
  #    gate scans the Go module graph embedded in the binary; upstream's own
  #    prebuilt binary ships vulnerable deps + an older stdlib, so we recompile.
  - uses: fetch
    with:
      uri: https://github.com/ollama/ollama/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SRC_SHA__
  - runs: |
      export CGO_ENABLED=1        # github.com/mattn/go-sqlite3 needs cgo
      export GOTOOLCHAIN=local    # use the installed go-1.26, don't fetch go1.26.0
      export GOFLAGS=-mod=mod
      export GOBUILDVCS=false

      # Comprehensive 0-CVE gate: FIXABLE Go-module deps flagged by Trivy (all
      # minor/patch, same major, API-compatible -- no fork/force):
      #   github.com/buger/jsonparser v1.1.1  -> v1.1.2  (CVE-2026-32285)
      #   golang.org/x/crypto         v0.43.0 -> v0.52.0 (x/crypto/ssh* DoS/bypass)
      #   golang.org/x/image          v0.22.0 -> v0.43.0 (tiff/webp DoS)
      #   golang.org/x/net            v0.46.0 -> v0.55.0 (net/html + idna DoS/XSS)
      # The Go stdlib CVEs (net/http, html/template, crypto/x509, net/textproto,
      # os) are cleared by compiling with the go-1.26 Wolfi toolchain (latest
      # patched stdlib) instead of upstream's older go1.26.0.
      go get github.com/buger/jsonparser@v1.1.2 \
             golang.org/x/crypto@v0.52.0 \
             golang.org/x/image@v0.43.0 \
             golang.org/x/net@v0.55.0
      go mod tidy

      # Build the ollama binary with upstream's version-stamp ldflags
      # (scripts/env.sh): the source default is "0.0.0", so stamp the real release
      # so `ollama --version` reports it. buildmode=pie matches upstream's Dockerfile.
      LDFLAGS="-w -s -X=github.com/ollama/ollama/version.Version=${{package.version}} -X=github.com/ollama/ollama/server.mode=release"
      install -d "${{targets.destdir}}/usr/bin"
      go build -trimpath -buildmode=pie -ldflags "${LDFLAGS}" \
        -o "${{targets.destdir}}/usr/bin/ollama" .

  # 2) CPU GGML runner libs from upstream's official per-arch linux tarball.
  #    Fetch the arch matching the build arch by uname -m (x86_64->amd64,
  #    aarch64->arm64) with the arch-matching sha256. The tarball lays out
  #    ./bin/ollama (ignored -- we ship our from-source binary) and ./lib/ollama/*
  #    (the prebuilt CPU GGML runner libs + llama-server), which we install to
  #    /usr/lib/ollama -- exactly where our binary at /usr/bin/ollama probes
  #    ("../lib/ollama"). These are C++ .so payloads: no gobinary CVEs.
  - runs: |
      VER="${{package.version}}"
      case "$(uname -m)" in
        x86_64)  oarch=amd64; sha=__SHA_AMD__ ;;
        aarch64) oarch=arm64; sha=__SHA_ARM__ ;;
        *) echo "unsupported arch $(uname -m)" >&2; exit 1 ;;
      esac

      url="https://github.com/ollama/ollama/releases/download/v${VER}/ollama-linux-${oarch}.tar.zst"
      curl -fsSL -o ollama.tar.zst "$url"
      echo "${sha}  ollama.tar.zst" | sha256sum -c -

      # busybox tar (in the melange sandbox) has no --use-compress-program, so
      # decompress with zstd and pipe the plain tar stream into it.
      mkdir -p extracted
      zstd -d -c ollama.tar.zst | tar -x -C extracted

      # the bundled CPU runner libs -> /usr/lib/ollama (preserve the tree)
      install -d "${{targets.destdir}}/usr/lib/ollama"
      cp -a extracted/lib/ollama/. "${{targets.destdir}}/usr/lib/ollama/"
      chmod -R a+rX "${{targets.destdir}}/usr/lib/ollama"

test:
  pipeline:
    - runs: |
        test -x /usr/bin/ollama
        # No server running in the sandbox, so `ollama --version` prints the
        # client line "Warning: client version is <ver>" (cmd/cmd.go). Assert it
        # reports our stamped release, not the "0.0.0" source default.
        ollama --version 2>&1 | grep -i "client version is __VER__"
        test -d /usr/lib/ollama
