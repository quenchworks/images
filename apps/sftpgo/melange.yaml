package:
  name: quench-sftpgo
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened SFTPGo (SFTP, FTP/S, HTTP/S and WebDAV server), built from source on Wolfi"
  copyright:
    - license: AGPL-3.0-only
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-1.26

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/drakkan/sftpgo/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - name: Build sftpgo (static cgo sqlite)
    runs: |
      set -eu
      export CGO_ENABLED=1 GOFLAGS=-mod=mod GOTOOLCHAIN=local
      # FLOOR is a floor, not a pin: float only modules below it, then assert the binary.
      FLOOR="golang.org/x/crypto@v0.58.1-0.20261009181718-2f1f834330b2 golang.org/x/net@v0.62.0 golang.org/x/text@v0.43.0 github.com/go-jose/go-jose/v4@v4.1.6 github.com/jackc/pgx/v5@v5.9.2 filippo.io/edwards25519@v1.1.1 google.golang.org/grpc@v1.83.2 github.com/go-chi/chi/v5@v5.4.0"
      # CVE-2026-128085 (otel 1.47.0): floor every otel v1 module the build uses, as one family
      for m in $(go list -mod=mod -m -e -f '{{.Path}} {{.Version}}' all | awk '($1 ~ /^go\.opentelemetry\.io\/otel(\/|$)/ || $1 ~ /^go\.opentelemetry\.io\/contrib\/bridges\/otel(zap|logrus|slog)$/) && $1 !~ /\/exporters\/jaeger$/ { if ($1 ~ /\/contrib\/bridges\//) print $1"@v0.21.0"; else if ($1 ~ /\/exporters\/(otlp\/otlplog\/|stdout\/stdoutlog$)/) print $1"@v0.23.0"; else if ($1 ~ /\/exporters\/prometheus$/) print $1"@v0.69.0"; else if ($2 ~ /^v1\./ || $1 ~ /\/(sdk\/)?log$/) print $1"@v1.47.0" }'); do
        FLOOR="$FLOOR $m"
      done
      MODS="$(echo "$FLOOR" | tr ' ' '\n' | cut -d@ -f1)"
      below_floor() {
        awk -v floor="$FLOOR" -v tag="$1" '
          BEGIN { n = split(floor, f, " ")
                  for (i = 1; i <= n; i++) { split(f[i], kv, "@"); want[kv[1]] = kv[2] } }
          ($1 in want) {
            split(substr($2, 2), g, "."); split(substr(want[$1], 2), w, ".")
            for (i = 1; i <= 3; i++) {
              if ((g[i] + 0) > (w[i] + 0)) next
              if ((g[i] + 0) < (w[i] + 0)) { print $1 "@" want[$1] " (" tag " has " $2 ")"; next }
            }
          }'
      }
      need="$(go list -m -e $MODS | awk 'NF >= 2 && $NF ~ /^v[0-9]/ { print $1, $NF }' | below_floor go.mod | awk '{ print $1 }')"
      if [ -n "$need" ]; then go get $need; fi
      go mod tidy
      go build -trimpath -ldflags "-s -w \
        -X github.com/drakkan/sftpgo/v2/internal/version.commit=__COMMIT__ \
        -X github.com/drakkan/sftpgo/v2/internal/version.date=$(date -u +%FT%TZ) \
        -extldflags -static" -o "${{targets.destdir}}/usr/bin/sftpgo" .
      bad="$(go version -m "${{targets.destdir}}/usr/bin/sftpgo" | awk '$1 == "dep" || $1 == "=>" { print $2, $3 }' | below_floor sftpgo)"
      [ -z "$bad" ] || { echo "float did not reach the binary:"; echo "$bad"; exit 1; }
      "${{targets.destdir}}/usr/bin/sftpgo" -v | grep -q "^SFTPGo ${{package.version}}"

  - name: Install the web UI and default config
    runs: |
      set -eu
      d="${{targets.destdir}}/usr/share/sftpgo"
      mkdir -p "$d" "${{targets.destdir}}/etc/sftpgo"
      cp -r templates static openapi "$d/"
      # upstream's image points the users and backups dirs at /srv/sftpgo the same way
      sed -e 's|"users_base_dir": "",|"users_base_dir": "/srv/sftpgo/data",|' \
          -e 's|"backups"|"/srv/sftpgo/backups"|' sftpgo.json > "${{targets.destdir}}/etc/sftpgo/sftpgo.json"
      grep -q '"/srv/sftpgo/data"' "${{targets.destdir}}/etc/sftpgo/sftpgo.json"

test:
  pipeline:
    - runs: sftpgo -v
