# sftpgo: SFTPGo (drakkan/sftpgo), an SFTP, FTP/S, HTTP/S and WebDAV server with a web admin
# and a web client, built from source onto Wolfi. AGPL-3.0, the community edition only.
#
# NEWEST-ONLY: upstream patches the 2.7 line alone; older lines get no fixes.
#
# SQLite goes through mattn/go-sqlite3 (cgo), so the binary is built CGO_ENABLED=1 and linked
# static, as upstream's own Docker build does with cgo on. The web UI (templates, static, openapi)
# ships under /usr/share/sftpgo, the paths upstream's image uses.
FROM_SOURCE=1
VERSIONS=(2.7.6)
declare -A SHA256=(
  [2.7.6]=c4e023d926ced068284ac83494e2f51bacb430fe260d3cb2d6807d3bede0608d
)
declare -A COMMIT=(
  [2.7.6]=62ae9ba3957e9ed52b44a4f885e805e2d7b35972
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g; s|__COMMIT__|${COMMIT[$1]}|g"; }
