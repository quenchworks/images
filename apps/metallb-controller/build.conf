# metallb-controller: from-source via melange. MetalLB controller: assigns LoadBalancer IPs from IPAddressPools and serves its CRD validation webhook.
# Built from the metallb/metallb v<VER> source tag, one binary per image (upstream's own
# split: controller and speaker are separate images). CGO_ENABLED=0 and the version
# ldflags match upstream's Dockerfile (internal/version.gitCommit / gitBranch; the
# version string itself is a constant in internal/version).
#
# NEWEST-ONLY: MetalLB ships one active line, and the chart pins the newest.
FROM_SOURCE=1
VERSIONS=(0.16.2)
declare -A SHA256=(
  [0.16.2]=c61cce2272a8416f6eca558b6375646ccca98a83d8833e21359eaa03ed1676a3
)
# the commit the annotated v<VER> tag points at, stamped as gitCommit
declare -A COMMIT=(
  [0.16.2]=37f058643f74370e53f2c66220b11da9d37f1141
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g; s|__COMMIT__|${COMMIT[$1]:0:8}|g"; }
