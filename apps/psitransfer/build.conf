# psitransfer: PsiTransfer (psi-4ward/psitransfer, BSD-2-Clause), simple file sharing with resumable uploads, expiring
# links, password protection and an admin page, no database. Images issue #95.
#
# From the release tag: the Vue 2 client (app/) built with npm in the sandbox, the server's production dependencies
# installed with minimatch raised to 11.0.1 (CVE-2026-118764). Node 24 on Wolfi; uploads in /data. Settings are
# PSITRANSFER_* environment variables (admin and upload passwords, retention, TLS). LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(2.4.6)
declare -A SHA256=(
  [2.4.6]=f650c599d1098d91884a9f5e5b093f61493be09aa615518736ad317c525eeff8
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
