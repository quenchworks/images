# cloudnative-pg: the CloudNativePG operator (PostgreSQL HA on Kubernetes), from
# source via melange. Static Go (CGO_ENABLED=0, as upstream's goreleaser), version
# stamped via -X on pkg/versions.buildVersion. The operator copies its own binary
# into every PostgreSQL pod (bootstrap-controller initContainer), so this one image
# is both the operator and the in-pod instance manager; the pods run a separate
# PostgreSQL image. Latest patch of the last 3 minor lines.
FROM_SOURCE=1
VERSIONS=(1.28.4 1.29.3 1.30.1)
declare -A SHA256=(
  [1.28.4]=3ecb5d344908d8b1f519a218b4dcbc51d1e471ebef54d7ada31ac0f90be95de0
  [1.29.3]=836d8a9f237db0837d2c06e491c847168ac0d93ebd95267108a3e009b9641c85
  [1.30.1]=a7a814f2c5a67412de95061190772f6f297727c2a6178b0f54fbf766b8d56a59
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
