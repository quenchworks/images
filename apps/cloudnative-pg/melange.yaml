# Builds the CloudNativePG manager (cmd/manager) from source onto Wolfi: the same
# binary serves as the operator (`manager controller`) and, copied into each
# PostgreSQL pod, as the instance manager (`manager instance ...`). Both arches'
# binaries sit at /operator/manager_<goarch>, as in upstream's image; /manager
# points at the native one.
package:
  name: quench-cloudnative-pg
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened CloudNativePG operator, built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/cloudnative-pg/cloudnative-pg/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      set -eu
      export CGO_ENABLED=0 GOTOOLCHAIN=local GOFLAGS=-mod=mod
      # ---- 0-CVE module float (docs/go-module-float.md) ----------------------
      FLOOR="golang.org/x/net@v0.58.0 golang.org/x/text@v0.41.0 golang.org/x/crypto@v0.56.0 golang.org/x/sys@v0.47.0 golang.org/x/mod@v0.40.0 golang.org/x/oauth2@v0.36.0 google.golang.org/grpc@v1.83.2 go.opentelemetry.io/otel@v1.45.0 go.opentelemetry.io/otel/sdk@v1.45.0 go.opentelemetry.io/otel/trace@v1.45.0 go.opentelemetry.io/otel/metric@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.45.0"
      MODS="$(echo "$FLOOR" | tr ' ' '\n' | cut -d@ -f1)"
      below_floor() {
        awk -v floor="$FLOOR" -v tag="$1" '
          BEGIN { n = split(floor, f, " ")
                  for (i = 1; i <= n; i++) { split(f[i], kv, "@"); want[kv[1]] = kv[2] } }
          ($1 in want) {
            split(substr($2, 2), g, "."); split(substr(want[$1], 2), w, ".")
            for (i = 1; i <= 3; i++) {
              if ((g[i] + 0) > (w[i] + 0)) next
              if ((g[i] + 0) < (w[i] + 0)) { print $1 "@" want[$1] " (" tag " has " $2 ")"; next }
            }
          }'
      }
      need="$(go list -m -e $MODS | awk 'NF >= 2 && $NF ~ /^v[0-9]/ { print $1, $NF }' | below_floor go.mod | awk '{ print $1 }')"
      if [ -n "$need" ]; then go get $need; fi
      go mod tidy
      P=github.com/cloudnative-pg/cloudnative-pg/pkg/versions
      # The operator lists the architectures it can serve by scanning
      # /operator/manager_<goarch>, and refuses a pod whose arch has no file
      # ("invalid architecture: amd64"). Upstream ships both arches in every
      # image so mixed-arch clusters work; so does this (static, CGO off).
      dest="${{targets.destdir}}/operator"
      mkdir -p "$dest"
      for a in amd64 arm64; do
        GOARCH=$a go build -trimpath -ldflags "-s -w -X $P.buildVersion=${{package.version}}" \
          -o "$dest/manager_$a" ./cmd/manager
        bad="$(go version -m "$dest/manager_$a" \
          | awk '$1 == "dep" || $1 == "=>" { print $2, $3 }' | below_floor "manager_$a")"
        [ -z "$bad" ] || { echo "0-CVE float did not reach manager_$a:"; echo "$bad"; exit 1; }
      done
      native="$(go env GOARCH)"
      ln -s "operator/manager_$native" "${{targets.destdir}}/manager"
      mkdir -p "${{targets.destdir}}/usr/bin"
      ln -s "../../operator/manager_$native" "${{targets.destdir}}/usr/bin/manager"
      "${{targets.destdir}}/operator/manager_$native" version | grep -F "Version:${{package.version}}"
