# NetBird upload server: the server that receives client debug bundles. Nonroot uid 1001.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-netbird-upload@local

accounts:
  groups:
    - groupname: netbird
      gid: 1001
  users:
    - username: netbird
      uid: 1001
      gid: 1001
      homedir: /var/lib/netbird
  run-as: 1001

entrypoint:
  command: /usr/bin/netbird-upload

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-netbird-upload"
  org.opencontainers.image.licenses: "BSD-3-Clause"
