# Altinity ClickHouse Operator: the metrics-exporter binary (./cmd/metrics_exporter), from Altinity/clickhouse-operator
# (Apache-2.0). From the release tag via melange: one static Go binary with upstream's
# -X pkg/version.Version flag. The operator and the metrics-exporter run as two containers in one
# pod and ship as two images, as upstream does. LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(0.27.4)
declare -A SHA256=(
  [0.27.4]=e148fbc3dfd613f2e27da609db987c10472c49928089de255420bd510c0ae91e
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
