# Builds the Coolify helper component's NON-Wolfi build tools FROM SOURCE on Wolfi.
#
# WHAT coolify-helper IS, AND WHY IT IS PRIVILEGED BY DESIGN
# ---------------------------------------------------------
# coolify-helper (upstream ghcr.io/coollabsio/coolify-helper) is Coolify's on-demand
# BUILD ENGINE. The Coolify control plane spins up a helper container per deployment,
# mounts the HOST Docker socket (/var/run/docker.sock) into it, and the helper drives
# `docker build` / `docker compose` / buildpacks on the host daemon to build and run a
# user's application image. Because it talks to the host's root Docker daemon, the helper
# RUNS AS ROOT and is privileged BY DESIGN -- mounting the docker socket is equivalent to
# host root. This is NOT a hardening defect we can fix: a nonroot, cap-dropped helper
# cannot read the host socket nor invoke the buildkit/buildpack toolchain, and would
# break Coolify's deploy path entirely. So apko.yaml deliberately does NOT force a
# nonroot user. What we DO harden is the SOFTWARE SURFACE: every bundled tool is either a
# CVE-tracked Wolfi package or BUILT FROM SOURCE here at a pinned release (no curled
# upstream release blobs, no untracked layers), and the whole image passes a hard 0-CVE
# Trivy gate (--ignore-unfixed). The privileged runtime posture is documented here, in
# apko.yaml, and in test.sh.
#
# UPSTREAM PIN
# ------------
# Coolify pins helper.version 1.0.14 (versions.json) at coolify tag v4.1.2
# (commit e7dff30b7c998c301fd91bd169727b90c59ec291). The upstream helper Dockerfile
# (docker/coolify-helper/Dockerfile) is FROM alpine:3.21 and bundles, by curling release
# binaries: docker (28.0.0), docker compose (2.38.2), buildx (0.25.0), buildpacks `pack`
# (0.38.2), nixpacks (1.41.0), railpack (0.23.0), mise (2026.3.17), minio `mc`
# (RELEASE.2025-08-13T08-35-41Z), plus apk packages bash curl git git-lfs openssh-client
# tar tini. We reproduce that toolset, but split by provenance:
#
#   * FROM WOLFI (CVE-tracked apk, pinned in apko.yaml), instead of curled blobs:
#       docker-cli, docker-compose (compose v2 plugin), docker-cli-buildx (buildx plugin),
#       git, git-lfs, openssh-client, tini, bash, curl, busybox (tar/coreutils),
#       ca-certificates-bundle. Wolfi tracks current upstreams, so versions are NEWER
#       than the alpine Dockerfile's frozen pins (e.g. docker-cli 28.x->latest, compose
#       v2 latest) -- that is intentional: we follow the CVE-patched line, not a frozen tag.
#
#   * BUILT FROM SOURCE here (Go/Rust toolchains in Wolfi), instead of curled blobs --
#     these five have NO Wolfi package that ever clears their CVEs (see build.conf):
#       pack     0.38.2   (Go)   -- buildpacks/pack, `go build`, house x/* + docker/cli
#                                   float (docker/docker CVE-2026-33997 stays -- see below)
#       railpack 0.23.0   (Go)   -- railwayapp/railpack, `go build ./cmd/cli`, house float
#       nixpacks 1.41.0   (Rust) -- railwayapp/nixpacks, `cargo build --release`
#       mise     2026.3.17 (Rust)-- jdx/mise, `cargo build --release`
#       mc       RELEASE.2025-08-13T08-35-41Z (Go) -- minio/mc, house x/* float. Moved
#                OFF the Wolfi apk 2026-09-14: Wolfi's mc secdb secfixes carry
#                golang.org/x/net CVE-2026-46600 in bucket "0" (no apk version, past
#                or future, is tracked as fixing it) and minio/mc has cut no release
#                since this same tag -- a from-source build with the float is the only
#                way to clear it, not a lag a rebuild self-heals.
#
# NO VENDORED BINARY EXCEPTIONS: every one of the five non-Wolfi tools compiles cleanly
# from source here, so nothing is curled as a frozen release blob.
#
# docker/docker CVE-2026-33997 ("Moby: privilege validation bypass during plugin
# installation") is UPSTREAM-GATED for pack: the fixed line ships only as
# github.com/docker/docker v29.3.1+, which does not exist as a reachable Go module
# (newest tag is still v28.5.2+incompatible; the 29.x daemon only publishes the SPLIT
# moby/moby/api + moby/moby/client modules, which pack does not import). The pack
# build step floats docker/docker to v28.5.2 anyway -- that is a compile-compat bump
# for go-connections>=0.7.0, NOT a CVE fix. Same wall documented in build.conf and in
# apps/{gitness,grype,kratos,hydra,vault}; docker-cli-buildx and docker-compose carry
# the identical unfixed CVE from their Wolfi apks. See build.conf STATUS for the
# full BLOCKED rationale -- an earlier build.conf note claiming this was removable
# from pack via a process_volumes.go build-tag flip was WRONG (docker/docker/client
# is imported unconditionally by pkg/client/client.go and pkg/client/docker.go, not
# just the one build-tagged volume-mount file) and has been corrected there.
#
# RAILPACK <-> MISE COUPLING: railpack shells out to a mise binary it expects at
# /tmp/railpack/mise/mise-<MISE_VERSION> (core/mise: InstallDir=/tmp/railpack/mise,
# binary name mise-<version>). If absent it downloads a GLIBC mise from GitHub, which
# fails on musl. Upstream's alpine Dockerfile pre-places a musl mise there at build time;
# but /tmp is wiped on container start, so a build-time copy would not survive. We instead
# install our from-source mise at the stable /usr/local/bin/mise and ship an entrypoint
# wrapper (coolify-helper-entrypoint) that seeds /tmp/railpack/mise/mise-<version> from it
# on every start, then execs the container CMD -- so railpack finds the pinned mise without
# any network download. mise's pinned version MUST match railpack's core/mise/version.txt
# (2026.3.17 at railpack v0.23.0); bump the two in lockstep.
package:
  name: quench-coolify-helper-tools
  version: __VER__
  epoch: 0
  description: "From-source build tools for the Quenchworks hardened Coolify helper (pack, railpack, nixpacks, mise, mc) plus the railpack<->mise seeding entrypoint"
  copyright:
    - license: Apache-2.0   # coolify-helper itself is Apache-2.0 (pack Apache-2.0, railpack MIT, nixpacks MIT, mise MIT, mc AGPL-3.0)
  dependencies:
    runtime:
      - bash      # the entrypoint wrapper is a bash script
      - busybox   # install/mkdir/cp used by the entrypoint

vars:
  pack-version: 0.40.9
  railpack-version: 0.23.0
  nixpacks-version: 1.41.0
  # MUST equal railpack v0.23.0's core/mise/version.txt; railpack looks for
  # /tmp/railpack/mise/mise-<this> at runtime.
  mise-version: 2026.3.17
  # Wolfi's mc apk (0.20250813.083541-rNN) never fixes golang.org/x/net
  # CVE-2026-46600 for this release (Wolfi secdb secfixes bucket "0" = no apk
  # version anywhere carries the fix) -- and this IS upstream's newest release
  # tag (minio/mc has cut nothing since 2025-08-13), so a from-source build at
  # the same tag with the house float is the only way to clear it.
  mc-version: RELEASE.2025-08-13T08-35-41Z
  # docker-compose and docker-cli-buildx move from Wolfi apks to from-source
  # builds (2026-09-15). Wave-1 probes: no apk on either arch fixes CVE-2026-33997
  # (secdb bucket "0", re-verified live), the vulnerable daemon code never links
  # into either plugin binary, and OSV records NO fixed event for
  # github.com/docker/docker -- the gate's --ignore-unfixed ignores it. compose
  # v5.5.1 has zero docker/docker in its graph (upstream split to moby/api +
  # moby/client); buildx v0.37.1 still pins docker/docker v28.5.2+incompatible,
  # which stays because no fixed module exists to replace onto.
  compose-version: 5.5.1
  buildx-version: 0.37.1
  # source of the docker/docker leaf packages copied into pack and buildx below
  # (volume/mounts + its three leaf deps; namesgenerator; worker/label). Each
  # copied file was import-checked at this tag: stdlib-only.
  docker-version: 28.5.2

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - bash
      - ca-certificates-bundle
      - git
      - go-1.26        # railpack go.mod requires go 1.26; pack needs go 1.24+
      - rust-1.96      # provides cargo/rustc; nixpacks (edition 2021) + mise (rust-version 1.88) build with it
      - openssl-dev    # mise links openssl (native-tls); pkgconf finds it
      - pkgconf

pipeline:
  # ---- pack (Go) -- buildpacks/pack v0.38.2 ----
  - uses: git-checkout
    with:
      repository: https://github.com/buildpacks/pack
      tag: v${{vars.pack-version}}
      expected-commit: 8210eb15f191cad25a3f7745618417270ec07709
      destination: pack-src

  - uses: git-checkout
    with:
      repository: https://github.com/docker/compose
      tag: v${{vars.compose-version}}
      expected-commit: 5f94fb0aa42a2cd1248c6e6c7fafb87546b9c8de
      destination: compose-src

  - uses: git-checkout
    with:
      repository: https://github.com/docker/buildx
      tag: v${{vars.buildx-version}}
      expected-commit: 0b265a9f62db554fa9aba6dd19e1bd5704bc7d8a
      destination: buildx-src
  - uses: git-checkout
    with:
      repository: https://github.com/moby/moby
      tag: v${{vars.docker-version}}
      expected-commit: 89c5e8fd66634b6128fc4c0e6f1236e2540e46e0
      destination: docker-src

  - name: Build pack from source
    runs: |
      set -eu
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      export GOTOOLCHAIN=local   # use the installed go-1.26, never fetch a toolchain
      export GOPATH="$(mktemp -d)"
      export GOCACHE="$(mktemp -d)"
      cd pack-src
      # ---- eliminate github.com/docker/docker (CVE-2026-33997, gate-counted) --
      # pack v0.40.9 imports docker/docker in exactly one file, for a volume-spec
      # parser. Copy that parser and its three leaf deps from docker-src into
      # pack's own tree (each copied file import-checked at v28.5.2: stdlib
      # only), rewrite the import paths, and tidy drops the module from the
      # graph and the binary's build info. No fixed module version exists to
      # replace onto, so removal is the only clean exit.
      mkdir -p internal/ddcompat/mounts internal/ddcompat/types/mount internal/ddcompat/lazyregexp internal/ddcompat/volume
      cp ../docker-src/volume/mounts/*.go internal/ddcompat/mounts/
      rm -f internal/ddcompat/mounts/*_test.go
      cp ../docker-src/api/types/mount/*.go internal/ddcompat/types/mount/
      cp ../docker-src/internal/lazyregexp/*.go internal/ddcompat/lazyregexp/
      rm -f internal/ddcompat/lazyregexp/*_test.go
      cp ../docker-src/volume/volume.go internal/ddcompat/volume/
      sed -i -e 's|github.com/docker/docker/volume/mounts|github.com/buildpacks/pack/internal/ddcompat/mounts|g' \
             -e 's|github.com/docker/docker/api/types/mount|github.com/buildpacks/pack/internal/ddcompat/types/mount|g' \
             -e 's|github.com/docker/docker/internal/lazyregexp|github.com/buildpacks/pack/internal/ddcompat/lazyregexp|g' \
             -e 's|github.com/docker/docker/volume|github.com/buildpacks/pack/internal/ddcompat/volume|g' \
        internal/ddcompat/mounts/*.go internal/ddcompat/types/mount/*.go \
        internal/ddcompat/lazyregexp/*.go internal/ddcompat/volume/*.go \
        pkg/client/process_volumes.go
      if grep -Rq 'github.com/docker/docker' internal/ddcompat pkg/client/process_volumes.go; then
        echo "FATAL: docker/docker reference survived the compat rewrite"; exit 1
      fi
      # 0-CVE gate: pack v0.38.2's bundled module graph trails fixed releases across
      # x/net, x/crypto, x/text, x/mod, go-git/go-billy, buildkit, moby/go-archive,
      # circl, selinux, otel and docker/cli. Float ONLY modules below their floor (a
      # bare `go get M@V` would silently downgrade once upstream needs more).
      # docker/cli@v29.5.3 is buildkit's own transitive floor (buildkit v0.31.1
      # requires docker/cli>=v29.5.3). docker/docker was REMOVED from this floor
      # on 2026-09-15: pinning it held the module at v28.5.2 while Trivy counts
      # CVE-2026-33997 as fixed at 29.3.1. The module is now eliminated from the
      # build by the import rewrite at the top of this step, and a guard fails
      # the build if it ever reappears in go.mod.
      # docker/docker
      # CVE-2026-33997 has no reachable fixed module (newest is v28.5.2+incompatible;
      # the 29.x daemon only ships as the split moby/moby/api + moby/moby/client
      # modules, which pack does not import). Same upstream-gated wall documented in
      # build.conf and in apps/{gitness,grype,kratos,hydra,vault} -- BLOCKED, not fixed
      # here; this float only keeps pack compiling against the newer go-connections.
      FLOOR="golang.org/x/net@v0.58.0 golang.org/x/crypto@v0.56.0 golang.org/x/text@v0.41.0 golang.org/x/sys@v0.47.0 golang.org/x/mod@v0.40.0 github.com/moby/buildkit@v0.31.1 github.com/moby/go-archive@v0.3.0 github.com/opencontainers/selinux@v1.15.1 github.com/cloudflare/circl@v1.6.3 go.opentelemetry.io/otel@v1.44.0 github.com/docker/cli@v29.5.3 github.com/go-git/go-git/v5@v5.19.2 github.com/containerd/containerd/v2@v2.3.5 github.com/moby/go-archive@v0.3.0 github.com/prometheus/prometheus@v0.311.3 github.com/go-git/go-billy/v5@v5.9.0"
      MODS="$(echo "$FLOOR" | tr ' ' '\n' | cut -d@ -f1)"
      # prints "<mod>@<floor> (<tag> has <ver>)" for every module below its floor
      below_floor() {
        awk -v floor="$FLOOR" -v tag="$1" '
          BEGIN { n = split(floor, f, " ")
                  for (i = 1; i <= n; i++) { split(f[i], kv, "@"); want[kv[1]] = kv[2] } }
          ($1 in want) {
            split(substr($2, 2), g, "."); split(substr(want[$1], 2), w, ".")
            for (i = 1; i <= 3; i++) {
              if ((g[i] + 0) > (w[i] + 0)) next
              if ((g[i] + 0) < (w[i] + 0)) { print $1 "@" want[$1] " (" tag " has " $2 ")"; next }
            }
          }'
      }
      # `go list -m` prints "<mod> <ver>" or "<mod> <ver> => <mod> <ver>", so $NF is
      # the EFFECTIVE version and a replace cannot hide behind the require line.
      go list -m -e $MODS
      need="$(go list -m -e $MODS | awk 'NF >= 2 && $NF ~ /^v[0-9]/ { print $1, $NF }' | below_floor go.mod | awk '{ print $1 }')"
      if [ -n "$need" ]; then go get $need; fi
      go mod tidy
      # go mod tidy reverts a bare go-get bump on an INDIRECT module back to the
      # graph's MVS choice (this is how railpack shipped x/crypto v0.54 against a
      # v0.56 floor). Anything still below floor gets pinned as a replace, which
      # tidy preserves.
      below2="$(go list -m -e $MODS 2>/dev/null | awk 'NF >= 2 && $NF ~ /^v[0-9]/' | below_floor go.mod || true)"
      for row in $below2; do
        mod="${row%%@*}"
        want="$(printf '%s\n' "$FLOOR" | tr ' ' '\n' | grep -F "$mod@" | head -1)"
        [ -n "$want" ] || continue
        go mod edit -replace "${mod}=${want}"
      done
      [ -z "$below2" ] || go mod tidy
      if grep -q 'github.com/docker/docker' go.mod; then
        echo "FATAL: github.com/docker/docker still in go.mod -- elimination failed"; exit 1
      fi
      # Mirror the upstream Makefile build target: ldflags inject the version into
      # pkg/client.Version; main package is the repo root (main.go imports ./cmd).
      go build -trimpath \
        -ldflags "-s -w -X 'github.com/buildpacks/pack/pkg/client.Version=${{vars.pack-version}}'" \
        -o "${{targets.destdir}}/usr/local/bin/pack" .
      "${{targets.destdir}}/usr/local/bin/pack" version

  # ---- railpack (Go) -- railwayapp/railpack v0.23.0 ----
  - uses: git-checkout
    with:
      repository: https://github.com/railwayapp/railpack
      tag: v${{vars.railpack-version}}
      expected-commit: ffdb0331677897577eafe61edc600aafdec387be
      destination: railpack-src

  - name: Build railpack from source
    runs: |
      set -eu
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      export GOTOOLCHAIN=local   # use the installed go-1.26, never fetch a toolchain
      export GOPATH="$(mktemp -d)"
      export GOCACHE="$(mktemp -d)"
      cd railpack-src
      # 0-CVE gate: railpack v0.23.0's bundled module graph trails fixed releases
      # across x/net, x/crypto, x/text, x/mod, containerd/v2, buildkit, grpc,
      # in-toto-golang and otel/sdk. railpack does NOT import docker/docker (`go mod
      # why github.com/docker/docker` answers "main module does not need it"), so
      # unlike pack there is no upstream-gated wall here -- this float is a full fix.
      FLOOR="golang.org/x/net@v0.58.0 golang.org/x/crypto@v0.56.0 golang.org/x/text@v0.41.0 golang.org/x/sys@v0.47.0 golang.org/x/mod@v0.40.0 google.golang.org/grpc@v1.83.2 github.com/containerd/containerd/v2@v2.3.5 github.com/moby/buildkit@v0.31.1 github.com/in-toto/in-toto-golang@v0.11.0 github.com/moby/go-archive@v0.3.0 github.com/prometheus/prometheus@v0.311.3 go.opentelemetry.io/otel/sdk@v1.44.0"
      MODS="$(echo "$FLOOR" | tr ' ' '\n' | cut -d@ -f1)"
      # prints "<mod>@<floor> (<tag> has <ver>)" for every module below its floor
      below_floor() {
        awk -v floor="$FLOOR" -v tag="$1" '
          BEGIN { n = split(floor, f, " ")
                  for (i = 1; i <= n; i++) { split(f[i], kv, "@"); want[kv[1]] = kv[2] } }
          ($1 in want) {
            split(substr($2, 2), g, "."); split(substr(want[$1], 2), w, ".")
            for (i = 1; i <= 3; i++) {
              if ((g[i] + 0) > (w[i] + 0)) next
              if ((g[i] + 0) < (w[i] + 0)) { print $1 "@" want[$1] " (" tag " has " $2 ")"; next }
            }
          }'
      }
      # `go list -m` prints "<mod> <ver>" or "<mod> <ver> => <mod> <ver>", so $NF is
      # the EFFECTIVE version and a replace cannot hide behind the require line.
      go list -m -e $MODS
      need="$(go list -m -e $MODS | awk 'NF >= 2 && $NF ~ /^v[0-9]/ { print $1, $NF }' | below_floor go.mod | awk '{ print $1 }')"
      if [ -n "$need" ]; then go get $need; fi
      go mod tidy
      # go mod tidy reverts a bare go-get bump on an INDIRECT module back to the
      # graph's MVS choice (this is how railpack shipped x/crypto v0.54 against a
      # v0.56 floor). Anything still below floor gets pinned as a replace, which
      # tidy preserves.
      below2="$(go list -m -e $MODS 2>/dev/null | awk 'NF >= 2 && $NF ~ /^v[0-9]/' | below_floor go.mod || true)"
      for row in $below2; do
        mod="${row%%@*}"
        want="$(printf '%s\n' "$FLOOR" | tr ' ' '\n' | grep -F "$mod@" | head -1)"
        [ -n "$want" ] || continue
        go mod edit -replace "${mod}=${want}"
      done
      [ -z "$below2" ] || go mod tidy
      # Mirror .goreleaser.yml: main ./cmd/cli, binary railpack, version ldflag.
      go build -trimpath \
        -ldflags "-s -w -X main.version=${{vars.railpack-version}}" \
        -o "${{targets.destdir}}/usr/local/bin/railpack" ./cmd/cli
      "${{targets.destdir}}/usr/local/bin/railpack" --version

  # ---- nixpacks (Rust) -- railwayapp/nixpacks v1.41.0 ----
  - uses: git-checkout
    with:
      repository: https://github.com/railwayapp/nixpacks
      tag: v${{vars.nixpacks-version}}
      expected-commit: bece51fbebac1d59709061a36e59dc9e0cf7ad3f
      destination: nixpacks-src

  - name: Build nixpacks from source
    runs: |
      set -eu
      export CARGO_HOME="$(mktemp -d)"
      cd nixpacks-src
      # Single binary crate `nixpacks` (src/main.rs). Release profile, locked deps.
      cargo build --release --locked --bin nixpacks
      install -Dm0755 target/release/nixpacks "${{targets.destdir}}/usr/local/bin/nixpacks"
      "${{targets.destdir}}/usr/local/bin/nixpacks" --version

  # ---- mise (Rust) -- jdx/mise v2026.3.17 ----
  - uses: git-checkout
    with:
      repository: https://github.com/jdx/mise
      tag: v${{vars.mise-version}}
      expected-commit: 073698a857f1237d0359e203ca52ce8b3957f5bd
      destination: mise-src

  - name: Build mise from source
    runs: |
      set -eu
      export CARGO_HOME="$(mktemp -d)"
      cd mise-src
      # mise is the workspace root binary crate. Build release; openssl-dev satisfies
      # its native-tls link. Stable path /usr/local/bin/mise; the entrypoint seeds the
      # railpack-expected /tmp/railpack/mise/mise-<version> copy at start.
      cargo build --release --bin mise
      install -Dm0755 target/release/mise "${{targets.destdir}}/usr/local/bin/mise"
      "${{targets.destdir}}/usr/local/bin/mise" --version

  # ---- mc (Go) -- minio/mc, upstream's newest release tag ----
  # Was a Wolfi apk (`mc`); dropped from apko.yaml because Wolfi's secdb (secfixes
  # bucket "0") shows NO mc apk release, past or future, ever fixes
  # golang.org/x/net CVE-2026-46600 -- this is not a lag that a rebuild clears.
  - uses: git-checkout
    with:
      repository: https://github.com/minio/mc
      tag: ${{vars.mc-version}}
      expected-commit: 7394ce0dd2a80935aded936b09fa12cbb3cb8096
      destination: mc-src
  - name: Build mc from source
    runs: |
      set -eu
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      export GOTOOLCHAIN=local   # use the installed go-1.26, never fetch a toolchain
      export GOPATH="$(mktemp -d)"
      export GOCACHE="$(mktemp -d)"
      cd mc-src
      # 0-CVE gate: mc's RELEASE.2025-08-13T08-35-41Z go.mod carries x/net v0.42.0,
      # x/sys v0.34.0, x/text v0.27.0, x/crypto v0.40.0 (indirect), grpc v1.71.0
      # (indirect) -- all below their fixed releases. Float ONLY modules below floor.
      FLOOR="golang.org/x/net@v0.58.0 golang.org/x/crypto@v0.56.0 golang.org/x/text@v0.41.0 golang.org/x/sys@v0.47.0 google.golang.org/grpc@v1.83.2 github.com/containerd/containerd/v2@v2.3.5 github.com/moby/go-archive@v0.3.0 github.com/prometheus/prometheus@v0.311.3"
      MODS="$(echo "$FLOOR" | tr ' ' '\n' | cut -d@ -f1)"
      # prints "<mod>@<floor> (<tag> has <ver>)" for every module below its floor
      below_floor() {
        awk -v floor="$FLOOR" -v tag="$1" '
          BEGIN { n = split(floor, f, " ")
                  for (i = 1; i <= n; i++) { split(f[i], kv, "@"); want[kv[1]] = kv[2] } }
          ($1 in want) {
            split(substr($2, 2), g, "."); split(substr(want[$1], 2), w, ".")
            for (i = 1; i <= 3; i++) {
              if ((g[i] + 0) > (w[i] + 0)) next
              if ((g[i] + 0) < (w[i] + 0)) { print $1 "@" want[$1] " (" tag " has " $2 ")"; next }
            }
          }'
      }
      # `go list -m` prints "<mod> <ver>" or "<mod> <ver> => <mod> <ver>", so $NF is
      # the EFFECTIVE version and a replace cannot hide behind the require line.
      go list -m -e $MODS
      need="$(go list -m -e $MODS | awk 'NF >= 2 && $NF ~ /^v[0-9]/ { print $1, $NF }' | below_floor go.mod | awk '{ print $1 }')"
      if [ -n "$need" ]; then go get $need; fi
      go mod tidy
      # go mod tidy reverts a bare go-get bump on an INDIRECT module back to the
      # graph's MVS choice (this is how railpack shipped x/crypto v0.54 against a
      # v0.56 floor). Anything still below floor gets pinned as a replace, which
      # tidy preserves.
      below2="$(go list -m -e $MODS 2>/dev/null | awk 'NF >= 2 && $NF ~ /^v[0-9]/' | below_floor go.mod || true)"
      for row in $below2; do
        mod="${row%%@*}"
        want="$(printf '%s\n' "$FLOOR" | tr ' ' '\n' | grep -F "$mod@" | head -1)"
        [ -n "$want" ] || continue
        go mod edit -replace "${mod}=${want}"
      done
      [ -z "$below2" ] || go mod tidy
      # Mirror upstream's buildscripts/gen-ldflags.go (Version/ReleaseTag/CommitID);
      # CopyrightYear/CommitID are stamped statically since there is no git history
      # in a melange source fetch beyond this checkout's own commit.
      go build -trimpath \
        -ldflags "-s -w -X github.com/minio/mc/cmd.Version=${{vars.mc-version}} -X github.com/minio/mc/cmd.CopyrightYear=2025 -X github.com/minio/mc/cmd.ReleaseTag=${{vars.mc-version}} -X github.com/minio/mc/cmd.CommitID=7394ce0dd2a80935aded936b09fa12cbb3cb8096 -X github.com/minio/mc/cmd.ShortCommitID=7394ce0dd2a8" \
        -o "${{targets.destdir}}/usr/local/bin/mc" .
      "${{targets.destdir}}/usr/local/bin/mc" --version

  - name: Build docker-compose from source
    runs: |
      set -eu
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      export GOTOOLCHAIN=local
      export GOPATH="$(mktemp -d)"
      export GOCACHE="$(mktemp -d)"
      cd compose-src
      # compose v5.5.1 carries NO github.com/docker/docker at all (upstream split
      # to moby/moby/api + moby/moby/client + docker/cli), so CVE-2026-33997
      # cannot attach to this binary. Same house float as mc, for whatever the
      # graph DOES carry: float only modules below floor; go list -m -e plus the
      # NF/version guard so a module compose does not require is never added.
      FLOOR="golang.org/x/net@v0.58.0 golang.org/x/crypto@v0.56.0 golang.org/x/text@v0.41.0 golang.org/x/sys@v0.47.0 google.golang.org/grpc@v1.83.2 github.com/containerd/containerd/v2@v2.3.5 github.com/moby/go-archive@v0.3.0 github.com/prometheus/prometheus@v0.311.3"
      MODS="$(echo "$FLOOR" | tr ' ' '\n' | cut -d@ -f1)"
      below_floor() {
        awk -v floor="$FLOOR" -v tag="$1" '
          BEGIN { n = split(floor, f, " ")
                  for (i = 1; i <= n; i++) { split(f[i], kv, "@"); want[kv[1]] = kv[2] } }
          ($1 in want) {
            split(substr($2, 2), g, "."); split(substr(want[$1], 2), w, ".")
            for (i = 1; i <= 3; i++) {
              if ((g[i] + 0) > (w[i] + 0)) next
              if ((g[i] + 0) < (w[i] + 0)) { print $1 "@" want[$1] " (" tag " has " $2 ")"; next }
            }
          }'
      }
      need="$(go list -m -e $MODS 2>/dev/null | awk 'NF >= 2 && $NF ~ /^v[0-9]/ { print $1, $NF }' | below_floor go.mod | awk '{ print $1 }')"
      if [ -n "$need" ]; then go get $need; fi
      go mod tidy
      # go mod tidy reverts a bare go-get bump on an INDIRECT module back to the
      # graph's MVS choice (this is how railpack shipped x/crypto v0.54 against a
      # v0.56 floor). Anything still below floor gets pinned as a replace, which
      # tidy preserves.
      below2="$(go list -m -e $MODS 2>/dev/null | awk 'NF >= 2 && $NF ~ /^v[0-9]/' | below_floor go.mod || true)"
      for row in $below2; do
        mod="${row%%@*}"
        want="$(printf '%s\n' "$FLOOR" | tr ' ' '\n' | grep -F "$mod@" | head -1)"
        [ -n "$want" ] || continue
        go mod edit -replace "${mod}=${want}"
      done
      [ -z "$below2" ] || go mod tidy
      install -d "${{targets.destdir}}/usr/libexec/docker/cli-plugins"
      go build -trimpath \
        -ldflags "-s -w -X github.com/docker/compose/v5/internal.Version=v${{vars.compose-version}}" \
        -o "${{targets.destdir}}/usr/libexec/docker/cli-plugins/docker-compose" ./cmd
      "${{targets.destdir}}/usr/libexec/docker/cli-plugins/docker-compose" version

  - name: Build docker-buildx from source
    runs: |
      set -eu
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      export GOTOOLCHAIN=local
      export GOPATH="$(mktemp -d)"
      export GOCACHE="$(mktemp -d)"
      cd buildx-src
      # ---- eliminate github.com/docker/docker (CVE-2026-33997, gate-counted) --
      # buildx v0.37.1 imports it in exactly two places, both tiny utilities:
      # pkg/namesgenerator (stdlib-only) and builder/builder-next/worker/label
      # (stdlib-only). Copy both from docker-src into buildx's internal tree,
      # rewrite the import sites, and tidy drops the module. Upstream's own
      # migration to the split moby modules is pending; re-triage this block
      # when buildx releases past v0.37.1.
      mkdir -p internal/namesgenerator internal/workerlabel
      cp ../docker-src/pkg/namesgenerator/names-generator.go internal/namesgenerator/
      cp ../docker-src/builder/builder-next/worker/label/label.go internal/workerlabel/
      grep -rlF 'github.com/docker/docker/pkg/namesgenerator' --include='*.go' . \
        | xargs -r sed -i 's|github.com/docker/docker/pkg/namesgenerator|github.com/docker/buildx/internal/namesgenerator|g'
      grep -rlF 'github.com/docker/docker/builder/builder-next/worker/label' --include='*.go' . \
        | xargs -r sed -i 's|github.com/docker/docker/builder/builder-next/worker/label|github.com/docker/buildx/internal/workerlabel|g'
      if grep -Rq 'github.com/docker/docker/pkg/namesgenerator\|github.com/docker/docker/builder/builder-next' --include='*.go' .; then
        echo "FATAL: docker/docker reference survived the compat rewrite"; exit 1
      fi
      # buildx v0.37.1 still pins github.com/docker/docker v28.5.2+incompatible.
      # Deliberately NOT floored: no fixed module version exists (the fix lives
      # only in the renamed moby/moby/v2 path and the docker-v29.3.1 release tag,
      # neither resolvable as github.com/docker/docker), and the vulnerable
      # daemon code is never linked into this client binary -- only its two tiny
      # utility packages (namesgenerator, worker/label) compile in. OSV records
      # no fixed event for docker/docker, so the gate's --ignore-unfixed treats
      # the advisory as unfixed. Float everything else below floor as usual.
      FLOOR="golang.org/x/net@v0.58.0 golang.org/x/crypto@v0.56.0 golang.org/x/text@v0.41.0 golang.org/x/sys@v0.47.0 google.golang.org/grpc@v1.83.2 github.com/containerd/containerd/v2@v2.3.5 github.com/moby/go-archive@v0.3.0 github.com/prometheus/prometheus@v0.311.3"
      MODS="$(echo "$FLOOR" | tr ' ' '\n' | cut -d@ -f1)"
      below_floor() {
        awk -v floor="$FLOOR" -v tag="$1" '
          BEGIN { n = split(floor, f, " ")
                  for (i = 1; i <= n; i++) { split(f[i], kv, "@"); want[kv[1]] = kv[2] } }
          ($1 in want) {
            split(substr($2, 2), g, "."); split(substr(want[$1], 2), w, ".")
            for (i = 1; i <= 3; i++) {
              if ((g[i] + 0) > (w[i] + 0)) next
              if ((g[i] + 0) < (w[i] + 0)) { print $1 "@" want[$1] " (" tag " has " $2 ")"; next }
            }
          }'
      }
      need="$(go list -m -e $MODS 2>/dev/null | awk 'NF >= 2 && $NF ~ /^v[0-9]/ { print $1, $NF }' | below_floor go.mod | awk '{ print $1 }')"
      if [ -n "$need" ]; then go get $need; fi
      go mod tidy
      # go mod tidy reverts a bare go-get bump on an INDIRECT module back to the
      # graph's MVS choice (this is how railpack shipped x/crypto v0.54 against a
      # v0.56 floor). Anything still below floor gets pinned as a replace, which
      # tidy preserves.
      below2="$(go list -m -e $MODS 2>/dev/null | awk 'NF >= 2 && $NF ~ /^v[0-9]/' | below_floor go.mod || true)"
      for row in $below2; do
        mod="${row%%@*}"
        want="$(printf '%s\n' "$FLOOR" | tr ' ' '\n' | grep -F "$mod@" | head -1)"
        [ -n "$want" ] || continue
        go mod edit -replace "${mod}=${want}"
      done
      [ -z "$below2" ] || go mod tidy
      if grep -q 'github.com/docker/docker' go.mod; then
        echo "FATAL: github.com/docker/docker still in go.mod -- elimination failed"; exit 1
      fi
      install -d "${{targets.destdir}}/usr/libexec/docker/cli-plugins"
      go build -trimpath \
        -ldflags "-s -w" \
        -o "${{targets.destdir}}/usr/libexec/docker/cli-plugins/docker-buildx" ./cmd/buildx
      test -s "${{targets.destdir}}/usr/libexec/docker/cli-plugins/docker-buildx"

  # ---- railpack<->mise seeding entrypoint ----
  - name: Install the entrypoint wrapper that seeds railpack's mise path
    runs: |
      set -eu
      destdir="${{targets.destdir}}"
      install -d "$destdir/usr/local/bin"
      cat > "$destdir/usr/local/bin/coolify-helper-entrypoint" <<EOF
      #!/usr/bin/env bash
      # Seed the mise binary at the path railpack hardcodes (/tmp/railpack/mise/mise-<ver>)
      # from our from-source /usr/local/bin/mise, so railpack never tries to download a
      # glibc mise (which would fail on this musl image). Then exec whatever CMD was given.
      set -euo pipefail
      MISE_VERSION="${{vars.mise-version}}"
      RAILPACK_MISE_DIR="/tmp/railpack/mise"
      mkdir -p "\$RAILPACK_MISE_DIR"
      if [ ! -x "\$RAILPACK_MISE_DIR/mise-\$MISE_VERSION" ]; then
        cp /usr/local/bin/mise "\$RAILPACK_MISE_DIR/mise-\$MISE_VERSION"
        chmod 0755 "\$RAILPACK_MISE_DIR/mise-\$MISE_VERSION"
      fi
      exec "\$@"
      EOF
      chmod 0755 "$destdir/usr/local/bin/coolify-helper-entrypoint"
      bash -n "$destdir/usr/local/bin/coolify-helper-entrypoint"

test:
  pipeline:
    - runs: |
        set -eu
        pack version
        railpack --version
        nixpacks --version
        mise --version
        mc --version
        docker-compose version
        # plugin-named binary runs in plugin mode; accept either the direct
        # version subcommand or the full plugin-protocol form. Both are real
        # asserts: the step fails only if NEITHER resolves.
        /usr/libexec/docker/cli-plugins/docker-buildx version \
          || /usr/libexec/docker/cli-plugins/docker-buildx buildx version
        test -x /usr/local/bin/coolify-helper-entrypoint
        bash -n /usr/local/bin/coolify-helper-entrypoint
