#
# WHY THE TEMPO PAIR IS NOT FLOATABLE (proven 2026-08-27, not assumed)
# tempo declares `module github.com/grafana/tempo` with NO /vN suffix at v2.8.4,
# v2.10.2, v2.10.3 and v3.0.3 (fetched each go.mod and read line 1). Because a go.mod
# IS present, Go refuses the +incompatible escape hatch:
#   $ go list -m github.com/grafana/tempo@v2.10.3
#   invalid version: module contains a go.mod file, so module path must match major
#   version ("github.com/grafana/tempo/v2")
# and the same for v2.8.4 and v2.10.3+incompatible. So no CVE-fixed tempo release is
# go-gettable under the path grafana requires. Grafana pins tempo by commit, which
# renders as the pseudo-version v1.5.1-0.<date>-<sha>; Trivy ranks that below 2.8.4,
# permanently. This is STRUCTURAL, not staleness: no grafana release that ships the
# Tempo datasource backend can pass this gate, in any packaging shape -- 13.2.0's own
# prebuilt gpx_tempo backend carries the identical 2 HIGH. Building grafana from
# source would not help either; the module path is the same.
#
# THE ONE REMAINING OPTION: a per-app OpenVEX file (NOT added here -- needs a human
# decision, and this agent was instructed not to add one). The evidence for
# not_affected / vulnerable_code_not_present is strong and was collected:
# grafana 13.1.4's binary references ONLY these tempo packages --
#   pkg/tempopb, pkg/tempopb/common/v1, pkg/tempopb/resource/v1, pkg/tempopb/trace/v1
# i.e. generated protobuf message types for the OTLP trace model, and nothing else.
# There is no tempodb/, no modules/, no pkg/api, no cmd/tempo, no S3/object-store
# backend and no query-frontend in the binary. CVE-2026-21728 is a DoS in Tempo's
# query path and CVE-2026-28377 discloses an S3 key via Tempo's /status endpoint --
# grafana runs neither. If that VEX is authored and passes scripts/check-vex.py, this
# app flips to BLOCKED=0 immediately with no recipe change.
#
# ALTERNATIVE REAL FIX: tempo publishes its module under github.com/grafana/tempo/v2
# (or /v3) so the fixed releases become reachable and grafana repins to one.
#
# GUARD -- READ BEFORE ANY VERSION BUMP
# melange.yaml enforces both halves of "0-CVE AND not hollow": a POSITIVE check that
# every datasource the stacks provision still has public/app/plugins/datasource/<id>,
