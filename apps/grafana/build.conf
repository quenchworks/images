# grafana: from-source via melange (fetch the per-arch OSS tarball, sha256).
# Latest 3 stable minor lines (full X.Y.Z, used as-is). Per-arch sha256.
# __VER__ = version  __SHA_AMD__ = amd64 sha256  __SHA_ARM__ = arm64 sha256
FROM_SOURCE=1
VERSIONS=(13.0.2 13.0.3 13.1.0)
declare -A SHA_AMD=(
  [13.0.2]=6720d8b0b48d92e2b33b7bf30b38480c12964ccd87285e5e754aa554165edf2d
  [13.0.3]=6c45f0610cd5edfcf0cb2489ba35479f1050f4da33ae4d03aaff1b9c87df5e63
  [13.1.0]=4f562bb224b8bb758b47789381babb284cb41687da8d714f2ff0e118e945e775
)
declare -A SHA_ARM=(
  [13.0.2]=beabeddf14dd5f435ac0c6d7fac71a585381515e879cc44eeea79a4ff7f7e52c
  [13.0.3]=c8a70b90f9b7847f6a732d6917f365a4e16ea186648147617fddcda19ad6d319
  [13.1.0]=d5f98305792b917b173320d5fde6b394685ae5df179ae9f9a8f22b56436b389a
)
render() { echo "s/__VER__/$1/g; s|__SHA_AMD__|${SHA_AMD[$1]}|g; s|__SHA_ARM__|${SHA_ARM[$1]}|g"; }
