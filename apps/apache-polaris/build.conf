# apache-polaris: Apache Polaris, the open REST catalog for Apache Iceberg (a Quarkus server),
# from the official binary distribution (polaris-bin, Quarkus fast-jar layout) on a Wolfi
# openjdk-21-jre. The image carries the server (entrypoint) and the admin tool
# (/usr/lib/polaris/admin, `bootstrap` and `purge` for the JDBC and NoSQL metastores).
#
# NEWEST-ONLY: Polaris ships a new minor about monthly and does not patch older lines (1.4.1
# is the only patch release). Measured 2026-10-12 with the gate flags (trivy rootfs,
# comprehensive): 1.8.0 dist 40 findings, 1.7.0 63.
#
# 0-CVE on 1.8.0 (measured 2026-10-12, 1006 packages, 0 fixable after the recipe):
#   * whole-jar swaps under the same file name: jackson-core/databind 2.22.3 and 3.2.3,
#     lz4-java 1.11.4, commons-configuration2 2.15.0. jackson-core 2.22.3 adds the package
#     internal/shaded/fdp/v2_22_3, so the fast-jar index (quarkus-application.dat) is
#     re-indexed for the changed jars (memory quarkus-fast-jar-swap-limit).
#   * jetty-http 9.4.56 emptied: the 9.4 fix (9.4.60) is not on Maven Central. Users are the
#     Ranger authorizer Solr audit client and optional probes.
#   * hadoop-client-runtime 3.5.0 (newest, shaded): its shaded jackson, jetty and jline copies
#     are removed (YARN, Hadoop HTTP server, JSON helpers). Its commons-configuration2 2.10.1 is
#     used by metrics2 (FileSystem -> UserGroupInformation), so metrics2 is removed from
#     hadoop-client-api and loads from the unshaded hadoop-common 3.5.0 in the same dist, on
#     commons-configuration2 2.15.0. The boot test creates a FILE-storage table, which runs
#     Iceberg HadoopFileIO and the Hadoop local file system over the patched jars (measured
#     2026-10-12: stripping configuration2 without the metrics2 move failed with
#     ClassNotFoundException there; busybox is needed for the chmod Hadoop runs).
BLOCKED=0
FROM_SOURCE=0
VERSIONS=(1.8.0)
# sha256 of polaris-bin-<v>.tgz, from a download (its .sha512 from the release checked too)
declare -A SHA256=(
  [1.8.0]=2d295cafdae1c41a76739899988c61d6a6234dd92a96d89cf538d80166aa76d0
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
