# Packages Apache Polaris onto Wolfi from its official binary distribution (Quarkus fast-jar).
package:
  name: quench-apache-polaris
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Apache Polaris, the Iceberg REST catalog, on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - openjdk-21-jre       # the release is built with Java 21 (class files target 17)
      - busybox              # Hadoop local file system (FILE storage) shells out to chmod
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      - python-3
      - zip
      - maven-3.9              # regenerate iceberg-bundled-guava (see the pipeline)
      - openjdk-25-default-jdk
      - unzip

pipeline:
  - runs: mkdir -p dist
  - uses: fetch
    with:
      uri: https://github.com/apache/polaris/releases/download/apache-polaris-${{package.version}}/polaris-bin-${{package.version}}.tgz
      expected-sha256: __SHA256__
      strip-components: 1
      directory: dist
  - runs: |
      set -eu
      D="$PWD/dist"
      QIDX=/tmp/qidx.py
      cat > "$QIDX" <<'PY'
      import io, struct, sys, zipfile
      # Re-indexes quarkus-application.dat (Quarkus 3.x fast-jar, format version 3) after jars
      # were swapped in place: adds the package directories a new jar has and the index lacks,
      # and fails if a jar gained a fully-indexed resource (top level, META-INF, META-INF/services).
      root = sys.argv[1]
      changed = set(sys.argv[2:])  # lib paths whose jar was swapped or stripped
      dat = root + "/quarkus/quarkus-application.dat"
      b = open(dat, "rb").read()
      p = 0
      def take(n):
          global p
          v = b[p:p + n]; p += n; return v
      def u16(): return struct.unpack(">H", take(2))[0]
      def i32(): return struct.unpack(">i", take(4))[0]
      def utf(): return take(u16()).decode("utf-8")
      def wutf(s):
          e = s.encode("utf-8"); return struct.pack(">H", len(e)) + e
      def dirs_of(names):
          out = []
          for n in names:
              if n.endswith("/"): continue  # Quarkus visits file entries only
              d = "" if "/" not in n else n[:n.rindex("/")]
              out.append(d)
              if n.startswith("META-INF/versions/"):
                  part = n[len("META-INF/versions/"):]
                  s = part.find("/")
                  if s != -1 and part.rfind("/") != s:
                      out.append(part[s + 1:part.rindex("/")])
          return list(dict.fromkeys(out))
      def fully(names):
          r = set()
          for n in names:
              if n.endswith("/"): continue
              r.add(n.split("/", 1)[0])
              for pre in ("META-INF", "META-INF/services"):
                  sp = pre + "/"
                  if not n.startswith(sp): continue
                  if n == sp: r.add(pre); continue
                  j = n.find("/", len(sp)); r.add(n[:j] if j != -1 else n)
          return r
      assert i32() == 0xF0315432 - (1 << 32) and i32() == 3, "unexpected index format"
      out = io.BytesIO(); out.write(b[:8]); out.write(wutf(utf()))
      n = u16(); out.write(struct.pack(">H", n))
      jars, added = [], 0
      for _ in range(n):
          path = utf(); jars.append(path); out.write(wutf(path))
          s = p; has = take(1)[0]
          if has:
              for _ in range(6):
                  if take(1)[0]: utf()
          gen, tr = take(1)[0], take(1)[0]
          out.write(b[s:p])
          old = [utf() for _ in range(u16())]
          new = old
          if path in changed:
              names = zipfile.ZipFile(root + "/" + path).namelist()
              new = old + [d for d in dirs_of(names) if d not in set(old)]
          added += len(new) - len(old)
          out.write(struct.pack(">H", len(new)) + b"".join(wutf(d) for d in new))
          if gen or tr:
              s = p; cnt = i32()
              for _ in range(cnt): utf()
              out.write(b[s:p])
      s = p
      for _ in range(u16()): utf()
      fi = {}
      for _ in range(u16()):
          r = utf()
          for _ in range(u16()): fi.setdefault(u16(), set()).add(r)
      assert p == len(b), "trailing bytes in the index"
      for i, path in enumerate(jars):
          if path not in changed: continue
          extra = fully(zipfile.ZipFile(root + "/" + path).namelist()) - fi.get(i, set())
          if extra:
              # Quarkus never served these from this jar (its build-time index lacks them), so a
              # swapped jar that carries them loses them; classes are untouched
              src = root + "/" + path
              with zipfile.ZipFile(src) as zi, zipfile.ZipFile(src + ".new", "w", zipfile.ZIP_DEFLATED) as zo:
                  for e in zi.infolist():
                      if e.filename not in extra: zo.writestr(e, zi.read(e.filename))
              import os; os.replace(src + ".new", src)
              print(f"dropped from {path}: {sorted(extra)}")
      out.write(b[s:])
      open(dat, "wb").write(out.getvalue())
      assert changed <= set(jars), f"not in the index: {sorted(changed - set(jars))}"
      print(f"quarkus-application.dat: {n} jars, {len(changed)} changed, {added} package dirs added")
      PY
      M=https://repo1.maven.org/maven2
      CH=""
      # jswap <lib name prefix> <maven path> <version> <sha256>: whole-jar swap under the SAME file
      # name (the fast-jar index keys jars by path), only where the bundled version is older.
      jswap() {
        hit=0
        for j in "$D"/*/lib/main/"$1"-*.jar; do
          [ -f "$j" ] || continue
          have="${j##*/$1-}"; have="${have%.jar}"
          case "$have" in [0-9]*) ;; *) continue ;; esac
          hit=1
          [ "$have" = "$3" ] && continue
          [ "$(printf '%s\n%s\n' "$have" "$3" | sort -V | head -1)" = "$have" ] || continue
          [ -f "/tmp/jswap-$3-${2##*/}.jar" ] || {
            curl -fsSL -o "/tmp/jswap-$3-${2##*/}.jar" "$M/$2/$3/${2##*/}-$3.jar"
            echo "$4  /tmp/jswap-$3-${2##*/}.jar" | sha256sum -c -
          }
          # the Quarkus index cannot take new top-level or META-INF resources (guava 33.7 adds
          # module-info.class): keep only those the replaced jar had; classes are untouched
          rx='^[^/]+$|^META-INF/[^/]+$|^META-INF/(services|versions)/'
          { unzip -Z1 "$j" | grep -E "$rx" || true; } | sort > /tmp/jswap.old
          cp "/tmp/jswap-$3-${2##*/}.jar" "$j"; chmod 644 "$j"
          { unzip -Z1 "$j" | grep -E "$rx" || true; } | sort | comm -13 /tmp/jswap.old - > /tmp/jswap.extra
          [ ! -s /tmp/jswap.extra ] || zip -q -d "$j" -@ < /tmp/jswap.extra
          CH="$CH $j"
          echo "swapped ${j#$D/} -> $3"
        done
        [ "$hit" = 1 ] || { echo "no $1 jar in the dist; re-audit"; exit 1; }
      }
      jswap com.fasterxml.jackson.core.jackson-core com/fasterxml/jackson/core/jackson-core 2.22.3 8a501126a385b25841915d839508f8a66e2a0dbc8a6709d055ef3b3e852b094c
      jswap com.fasterxml.jackson.core.jackson-databind com/fasterxml/jackson/core/jackson-databind 2.22.3 556db5439e206114346043f68d200497dc96a0bca62a360a81784092ebd0e0a9
      jswap tools.jackson.core.jackson-core tools/jackson/core/jackson-core 3.2.3 a0c17e7e665a5e95c82f5fb45c0fec2ae3dc556c80f0016452c9c84cd23f3817
      jswap tools.jackson.core.jackson-databind tools/jackson/core/jackson-databind 3.2.3 235b72436af983857e44efa42449f4f0a2c571e69d6c5d9dd1253ae7d192dcf2
      jswap at.yawk.lz4.lz4-java at/yawk/lz4/lz4-java 1.11.4 58c8e0b813960d2a248e050c353baea73139b48a2ffc55382d42c69707e17325
      jswap org.apache.commons.commons-configuration2 org/apache/commons/commons-configuration2 2.15.0 a359968dda319134c4f187e6f82b66f5808bf7db48e0d6e40922e98084c87ba8

      # Jetty 9.4 is end of life: CVE-2026-2332 is fixed in 9.4.60, which is not on Maven Central.
      # jetty-http 9.4.x is kept as an empty jar (manifest only, so the index entry stays valid and a
      # class lookup ends in a plain ClassNotFoundException). Its only users are jetty-client
      # (Solr audit of the Ranger authorizer) and optional probes (micrometer, netty ALPN).
      for j in "$D"/*/lib/main/org.eclipse.jetty.jetty-http-9.4.*.jar; do
        [ -f "$j" ] || continue
        zip -q -d "$j" "org/*" "META-INF/maven/*" "META-INF/services/*"
        CH="$CH $j"; echo "emptied ${j#$D/}"
      done

      # hadoop-client-runtime is a shaded jar (newest 3.5.0) holding jackson 2.18.6, jetty 9.4.58,
      # jline 3.9.0 and commons-configuration2 2.10.1 under org/apache/hadoop/shaded. The jackson,
      # jetty and jline copies serve YARN clients, the Hadoop HTTP server and JSON helpers, which
      # Polaris never runs, so they are removed. commons-configuration2 IS used (FileSystem ->
      # UserGroupInformation -> metrics2): the dist also carries the unshaded hadoop-common of the
      # same Hadoop release, whose metrics2 uses the unshaded commons-configuration2 (swapped to
      # 2.15.0 above, with the lang3 3.20 and text 1.15 it wants). Removing metrics2 from
      # hadoop-client-api makes the fast-jar loader fall through to the hadoop-common copy.
      for j in "$D"/*/lib/main/org.apache.hadoop.hadoop-client-runtime-*.jar; do
        [ -f "$j" ] || continue
        lib="${j%/*}"
        api="$(ls "$lib"/org.apache.hadoop.hadoop-client-api-*.jar)"
        com="$(ls "$lib"/org.apache.hadoop.hadoop-common-*.jar)"
        [ "${api##*-}" = "${com##*-}" ] || { echo "hadoop-client-api and hadoop-common differ: $api $com"; exit 1; }
        unzip -Z1 "$com" org/apache/hadoop/metrics2/impl/MetricsSystemImpl.class >/dev/null
        zip -q -d "$api" "org/apache/hadoop/metrics2/*"
        zip -q -d "$j" "org/apache/hadoop/shaded/com/fasterxml/*" "org/apache/hadoop/shaded/org/eclipse/*" \
          "org/apache/hadoop/shaded/org/jline/*" "org/apache/hadoop/shaded/org/apache/commons/configuration2/*" \
          "META-INF/versions/*/com/fasterxml/*" "META-INF/maven/com.fasterxml.jackson.*" \
          "META-INF/maven/org.eclipse.jetty*" "META-INF/maven/org.jline/*" "META-INF/maven/org.apache.commons/commons-configuration2/*"
        if unzip -Z1 "$j" | grep -E "shaded/(com/fasterxml|org/eclipse|org/jline|org/apache/commons/configuration2)/" >/dev/null; then
          echo "strip left classes in $j"; exit 1
        fi
        CH="$CH $j $api"; echo "stripped ${j#$D/}, metrics2 of ${api#$D/}"
      done

      # 2026-11-02 scan: guava 33.7.2-jre (CVE-2026-102554; failureaccess stays 1.0.1: 1.0.3 has
      # the same classes but adds META-INF resources the Quarkus index cannot take), snappy-java 1.1.10.9. Same file names;
      # the re-index below adds any new package. OTel stays 1.62: see build.conf STATUS.
      jswap com.google.guava.guava com/google/guava/guava 33.7.2-jre b530942257fb935f8b2cfaa5f8eb5bd59c555fd8e8d01b8ce98912e077ea606c
      jswap org.xerial.snappy.snappy-java org/xerial/snappy/snappy-java 1.1.10.9 35228628442e4b9797681c7cbd3b26594f6da3379159dbd0cb07094ed3aece0d
      # iceberg-bundled-guava relocates guava under org.apache.iceberg.relocated, out of a jar
      # swap's reach; regenerate it from 33.7.2-jre with the same relocation (apps/trino does the
      # same), keep Iceberg's GuavaClasses anchor and the file name.
      export JAVA_HOME=/usr/lib/jvm/java-25-openjdk PATH="/usr/lib/jvm/java-25-openjdk/bin:$PATH"
      mkdir -p /tmp/ibg && cat > /tmp/ibg/pom.xml <<'POM'
      <project xmlns="http://maven.apache.org/POM/4.0.0">
        <modelVersion>4.0.0</modelVersion>
        <groupId>quench</groupId><artifactId>ibg</artifactId><version>1</version>
        <dependencies>
          <dependency><groupId>com.google.guava</groupId><artifactId>guava</artifactId><version>33.7.2-jre</version></dependency>
          <dependency><groupId>com.google.guava</groupId><artifactId>failureaccess</artifactId><version>1.0.3</version></dependency>
        </dependencies>
        <build><plugins><plugin>
          <groupId>org.apache.maven.plugins</groupId><artifactId>maven-shade-plugin</artifactId><version>3.6.2</version>
          <executions><execution><phase>package</phase><goals><goal>shade</goal></goals><configuration>
            <createDependencyReducedPom>false</createDependencyReducedPom>
            <artifactSet><includes><include>com.google.guava:guava</include><include>com.google.guava:failureaccess</include></includes></artifactSet>
            <filters><filter><artifact>*:*</artifact><excludes>
              <exclude>com/google/thirdparty/**</exclude><exclude>META-INF/versions/9/module-info.class</exclude>
            </excludes></filter></filters>
            <relocations><relocation><pattern>com.google.common</pattern><shadedPattern>org.apache.iceberg.relocated.com.google.common</shadedPattern></relocation></relocations>
          </configuration></execution></executions>
        </plugin></plugins></build>
      </project>
      POM
      (cd /tmp/ibg && mvn -B -q -C -Dmaven.repo.local=/tmp/m2 package)
      echo "b530942257fb935f8b2cfaa5f8eb5bd59c555fd8e8d01b8ce98912e077ea606c  /tmp/m2/com/google/guava/guava/33.7.2-jre/guava-33.7.2-jre.jar" | sha256sum -c -
      n=0
      for ibg in "$D"/*/lib/main/org.apache.iceberg.iceberg-bundled-guava-*.jar; do
        [ -f "$ibg" ] || continue; n=$((n+1))
        rm -rf /tmp/ibg/w && mkdir /tmp/ibg/w && cp /tmp/ibg/target/ibg-1.jar /tmp/ibg/w/new.jar
        (cd /tmp/ibg/w && unzip -q "$ibg" org/apache/iceberg/GuavaClasses.class && jar uf new.jar org/apache/iceberg/GuavaClasses.class)
        v="$(unzip -p /tmp/ibg/w/new.jar META-INF/maven/com.google.guava/guava/pom.properties | sed -n 's/^version=//p')"
        [ "$v" = 33.7.2-jre ] || { echo "regenerated bundle reports guava $v"; exit 1; }
        # the Quarkus index cannot take new top-level or META-INF resources: drop any the
        # original bundle did not have (licence files, multi-release trees), classes untouched
        idx='^[^/]+$|^META-INF/[^/]+$|^META-INF/(services|versions)/'
        unzip -Z1 "$ibg" | grep -E "$idx" | sort > /tmp/ibg/w/old.res || true
        unzip -Z1 /tmp/ibg/w/new.jar | grep -E "$idx" | sort > /tmp/ibg/w/new.res || true
        comm -13 /tmp/ibg/w/old.res /tmp/ibg/w/new.res > /tmp/ibg/w/extra.res
        [ ! -s /tmp/ibg/w/extra.res ] || (cd /tmp/ibg/w && zip -q -d new.jar -@ < extra.res)
        cp /tmp/ibg/w/new.jar "$ibg"; chmod 644 "$ibg"; CH="$CH $ibg"; echo "regenerated ${ibg#$D/} (dropped $(wc -l < /tmp/ibg/w/extra.res) extra resources)"
      done
      [ "$n" -gt 0 ] || { echo "no iceberg-bundled-guava jar in the dist; re-audit"; exit 1; }
      # hadoop-client-runtime carries guava 33.4.8 three times, relocated under hadoop's thirdparty
      # and shaded prefixes and Curator's own shaded copy, behind one guava pom. Each copy is
      # rebuilt from 33.7.2 with the same relocation and replaced class for class.
      for pre in org.apache.hadoop.thirdparty org.apache.hadoop.shaded org.apache.hadoop.shaded.org.apache.curator.shaded; do
        rm -rf /tmp/hg && mkdir -p /tmp/hg
        sed "s|<shadedPattern>org.apache.iceberg.relocated.com.google.common</shadedPattern>|<shadedPattern>$pre.com.google.common</shadedPattern>|" /tmp/ibg/pom.xml > /tmp/hg/pom.xml
        grep -q "<shadedPattern>$pre.com.google.common</shadedPattern>" /tmp/hg/pom.xml
        (cd /tmp/hg && mvn -B -q -C -o -Dmaven.repo.local=/tmp/m2 package)
        cp /tmp/hg/target/ibg-1.jar "/tmp/hg-$pre.jar"
      done
      n=0
      # hadoop-shaded-guava (server tree) is the thirdparty copy on its own
      for hcr in "$D"/*/lib/main/org.apache.hadoop.hadoop-client-runtime-*.jar "$D"/*/lib/main/org.apache.hadoop.thirdparty.hadoop-shaded-guava-*.jar; do
        [ -f "$hcr" ] || continue; n=$((n+1))
        rm -rf /tmp/hw && mkdir /tmp/hw && (cd /tmp/hw && unzip -q "$hcr")
        k=0
        for pre in org.apache.hadoop.thirdparty org.apache.hadoop.shaded org.apache.hadoop.shaded.org.apache.curator.shaded; do
          d="/tmp/hw/$(echo "$pre" | tr . /)/com/google/common"
          [ -d "$d" ] || continue; k=$((k+1))
          rm -rf "$d"
          (cd /tmp/hw && unzip -qo "/tmp/hg-$pre.jar" "$(echo "$pre" | tr . /)/com/google/common/*")
        done
        [ "$k" -gt 0 ] || { echo "no relocated guava in ${hcr##*/}; re-audit"; exit 1; }
        sed -i 's/^version=33\.4\.8-jre$/version=33.7.2-jre/' /tmp/hw/META-INF/maven/com.google.guava/guava/pom.properties
        grep -qx 'version=33.7.2-jre' /tmp/hw/META-INF/maven/com.google.guava/guava/pom.properties
        rm -f "$hcr" && (cd /tmp/hw && zip -qrX "$hcr" .) && chmod 644 "$hcr"
        CH="$CH $hcr"; echo "rebuilt guava in ${hcr#$D/}"
      done
      [ "$n" -gt 0 ] || { echo "no hadoop-client-runtime jar in the dist; re-audit"; exit 1; }

      # guava 33.7.2 dropped two anonymous classes that the server's build-time Hibernate
      # Validator step recorded by name and loads with Class.forName into a LinkedHashSet; boot
      # dies on ClassNotFoundException. Point those constants at a class already in the same set
      # (a duplicate add is a no-op). Rewriting a CONSTANT_Utf8 in place is safe: the class file
      # addresses the pool by index, never by byte offset. Exactly 2 hits or the build fails.
      python3 -I - "$D/server/quarkus/generated-bytecode.jar" <<'PY'
      import os, struct, sys, zipfile
      jar = sys.argv[1]
      to = b"com.google.common.base.Joiner$3"
      dead = [b"com.google.common.collect.ImmutableSet$Indexed$1",
              b"com.google.common.collect.ImmutableSortedMap$1EntrySet$1"]
      u = lambda s: b"\x01" + struct.pack(">H", len(s)) + s
      hits = 0
      with zipfile.ZipFile(jar) as zi, zipfile.ZipFile(jar + ".new", "w", zipfile.ZIP_DEFLATED) as zo:
          for e in zi.infolist():
              d = zi.read(e.filename)
              if e.filename.endswith(".class"):
                  for n in dead:
                      c = d.count(u(n))
                      if c:
                          assert u(to) in d, f"{e.filename}: {to} not already in the set"
                          d = d.replace(u(n), u(to)); hits += c
              zo.writestr(e, d)
      assert hits == 2, f"expected 2 dead guava names in generated-bytecode.jar, found {hits}; re-audit"
      os.replace(jar + ".new", jar)
      print("generated-bytecode.jar: 2 dead guava names remapped")
      PY

      for app in "$D"/*/quarkus/quarkus-application.dat; do
        a="${app%/quarkus/quarkus-application.dat}"
        rel=""
        for j in $CH; do case "$j" in "$a"/*) rel="$rel ${j#$a/}" ;; esac; done
        python3 -I "$QIDX" "$a" $rel
      done
      mkdir -p "${{targets.destdir}}/usr/lib/polaris" "${{targets.destdir}}/usr/share/licenses/apache-polaris"
      cp -a dist/server dist/admin "${{targets.destdir}}/usr/lib/polaris/"
      cp dist/LICENSE dist/NOTICE "${{targets.destdir}}/usr/share/licenses/apache-polaris/"
      chmod -R a+rX "${{targets.destdir}}/usr/lib/polaris"

test:
  pipeline:
    - runs: |
        test -f /usr/lib/polaris/server/quarkus-run.jar
        test -f /usr/lib/polaris/admin/quarkus-run.jar
