# Owncast from the release tag, CGO on (go-sqlite3), stamped like upstream's Dockerfile.
package:
  name: quench-owncast
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Owncast live streaming server, built from source on Wolfi"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
      - ffmpeg
      - tzdata

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-1.27

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/owncast/owncast/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - runs: |
      set -eu
      export CGO_ENABLED=1 GOTOOLCHAIN=local GOFLAGS=-mod=mod
      # floors, raised only when below (a bare go get downgrades once upstream passes it)
      FLOOR="golang.org/x/crypto@v0.58.1-0.20261009181718-2f1f834330b2 golang.org/x/net@v0.62.0 golang.org/x/text@v0.43.0 golang.org/x/sys@v0.49.0"
      # chi CVE-2026-114437 + GHSA-3fxj-6jh8-hvhx, jwt CVE-2025-30204, compress CVE-2026-63209
      FLOOR="$FLOOR github.com/go-chi/chi/v5@v5.4.0 github.com/golang-jwt/jwt/v5@v5.2.2 github.com/klauspost/compress@v1.18.7"
      need=""
      for f in $FLOOR; do
        have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${f%@*}")"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        [ "$(printf '%s\n%s\n' "$have" "${f#*@}" | sort -V | head -1)" = "${f#*@}" ] || need="$need $f"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || go get $need
      go mod tidy
      go build -trimpath -ldflags "-s -w -X github.com/owncast/owncast/config.VersionNumber=${{package.version}} -X github.com/owncast/owncast/config.BuildPlatform=quenchworks" \
        -o "${{targets.destdir}}/usr/bin/owncast" .

test:
  pipeline:
    - runs: |
        test -x /usr/bin/owncast
