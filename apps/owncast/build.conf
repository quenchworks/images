# Owncast (owncast/owncast, MIT): self-hosted live video streaming and chat (RTMP ingest, HLS out,
# web player, chat, admin UI). From the release tag via melange: Go with CGO for go-sqlite3, the
# prebuilt web UI from the tag's static/ tree embedded, Wolfi ffmpeg at runtime for transcoding.
# LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(0.3.0)
declare -A SHA256=(
  [0.3.0]=e37cd56e1fd31254553039999f4c22b709f536ea3c3b43b42282a3ff46bdb1f6
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
