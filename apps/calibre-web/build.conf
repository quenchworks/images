# calibre-web: Calibre-Web (janeczku/calibre-web, GPL-3.0), a web app for browsing, reading and downloading an
# ebook library kept in a Calibre database. Images issue #104.
#
# From the release tag into a Python 3.13 venv over Wolfi's native packages (cryptography, lxml, regex, tornado,
# nh3; libmagic and ImageMagick for Wand). Upstream's upper bounds hold pypdf, cryptography, tornado, certifi and
# regex below their fixes; the build lifts those five caps only. Calibre's ebook-convert is not in Wolfi, so
# conversion stays off. LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(0.6.27)
declare -A SHA256=(
  [0.6.27]=0f8790afa87d2755d762e687a16077e56dfa7a8272107990e19dddbefcd0f103
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
