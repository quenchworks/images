# kyverno: from-source via melange (Go build of Kyverno from the git tag tarball).
# Kubernetes policy engine, multiple binaries under ./cmd. NEWEST-ONLY: only the
# single newest stable release (github.com/kyverno/kyverno, tags vX.Y.Z). Older
# minor lines pin transitive deps below their CVE fixes and fail the 0-CVE matrix,
# so they are deliberately NOT built. Static Go, CGO disabled. The version is
# stamped via -X pkg/version.BuildVersion (matches upstream Makefile LD_FLAGS),
# with the upstream "v" prefix so `kyverno version` reports the real release.
FROM_SOURCE=1
VERSIONS=(1.19.2)
declare -A SHA256=(
  [1.19.2]=9c09a8cf176357852aaf9b81df0c609099ba72d6591b9e2148984a5b8cfe1dda
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
