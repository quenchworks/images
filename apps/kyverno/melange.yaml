# Builds Kyverno (Kubernetes policy engine) from source onto Wolfi. Static Go
# binaries, no CGO (matches upstream Makefile CGO_ENABLED=0). Ships the full core
# binary set from ./cmd: the kyverno admission controller, the background,
# cleanup and reports controllers, kyvernopre (the kyverno-init image), the
# readiness-checker, and the kubectl-kyverno CLI. The version is stamped via
# -X pkg/version.BuildVersion=v<ver> (upstream LD_FLAGS convention) so every
# binary reports the real release. Pins Go 1.26 per go.mod with GOTOOLCHAIN=local
# so the toolchain directive never triggers a network download. Output is a
# signed APK in Quenchworks' own repo. No upstream distro binaries. Image-only
# (no chart). Upstream tags carry a "v" prefix.
package:
  name: quench-kyverno
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Kyverno (Kubernetes policy engine), built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-1.26

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/kyverno/kyverno/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      export GOTOOLCHAIN=local
      # Minimal safe bumps for the transitive CVEs the comprehensive Trivy gate
      # flags (all minor/patch within the same major -- API-compatible, resolved
      # through the module graph via GOFLAGS=-mod=mod; not forks/forces):
      #   golang.org/x/crypto  0.50.0 -> 0.52.0  (ssh DoS et al, HIGH)
      #   golang.org/x/net     0.53.0 -> 0.55.0  (html/http2/idna, HIGH)
      #   sigstore/fulcio      1.8.5  -> 1.8.6   (CVE-2026-49478 SSRF, HIGH)
      #   sigstore/rekor       1.5.1  -> 1.5.2   (CVE-2026-48702, HIGH)
      #   sigstore/timestamp-authority/v2 2.0.6 -> 2.1.2 (CVE-2026-49835; min for sigstore-go 1.2.0)
      #   go-git/go-git/v5     5.18.0 -> 5.19.1  (path/ref handling, HIGH)
      #   go-git/go-billy/v5   5.8.0  -> 5.9.0   (CVE-2026-44740/44973)
      #   in-toto-golang       0.10.0 -> 0.11.0  (GHSA-pmwq-pjrm-6p5r)
      #   Azure/go-ntlmssp     -> 0.1.1          (CVE-2026-32952)
      #   oras.land/oras-go/v2 2.6.0  -> 2.6.1   (CVE-2026-48978 et al, HIGH)
      #   sigstore/sigstore-go 1.1.4  -> 1.2.0   (CVE-2026-49834, MEDIUM)
      #   google.golang.org/grpc 1.81.1 -> 1.82.1 (GHSA-hrxh-6v49-42gf xDS/HTTP2, HIGH;
      #     pulls the otel 1.43 + oauth2 0.36 coherent cascade)
      #   google/cel-go        0.27.0 -> 0.29.2  (GHSA-gcjh-h69q-9w9g, MEDIUM:
      #     ext.NativeTypes(ParseStructTag("json")) exposes json:"-" fields to
      #     user CEL expressions; first fixed release is 0.29.0)
      #
      # FLOOR is a FLOOR, not a pin (docs/go-module-float.md). A bare
      # `go get mod@vX` fails silently in two directions: it is a NO-OP when an
      # upstream `replace` overrides it, and it becomes a DOWNGRADE once upstream
      # requires more than vX -- re-introducing the CVE it was added to clear.
      # So float only what is below the floor, then assert the SHIPPED BINARIES
      # carry nothing below it.
      # 1.19.0 already requires fulcio 1.8.8, grpc 1.83.0 and cel-go 0.30.0, i.e.
      # ABOVE three of these floors -- the old bare `go get` line would have
      # downgraded all three.
      FLOOR="golang.org/x/mod@v0.40.0 golang.org/x/crypto@v0.56.0 golang.org/x/net@v0.58.0 golang.org/x/text@v0.41.0 github.com/sigstore/sigstore-go@v1.3.0 github.com/sigstore/fulcio@v1.8.6 github.com/sigstore/rekor@v1.5.3 github.com/sigstore/timestamp-authority/v2@v2.1.3 github.com/go-git/go-git/v5@v5.19.2 github.com/go-git/go-billy/v5@v5.9.0 github.com/in-toto/in-toto-golang@v0.11.0 github.com/Azure/go-ntlmssp@v0.1.1 oras.land/oras-go/v2@v2.6.2 google.golang.org/grpc@v1.83.2 go.opentelemetry.io/otel@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.45.0 go.opentelemetry.io/otel/sdk@v1.45.0 go.opentelemetry.io/otel/trace@v1.45.0 go.opentelemetry.io/otel/metric@v1.45.0 golang.org/x/oauth2@v0.36.0 github.com/google/cel-go@v0.29.2"
      MODS="$(echo "$FLOOR" | tr ' ' '\n' | cut -d@ -f1)"
      # prints "<mod>@<floor> (<tag> has <ver>)" for every module below its floor
      below_floor() {
        awk -v floor="$FLOOR" -v tag="$1" '
          BEGIN { n = split(floor, f, " ")
                  for (i = 1; i <= n; i++) { split(f[i], kv, "@"); want[kv[1]] = kv[2] } }
          ($1 in want) {
            split(substr($2, 2), g, "."); split(substr(want[$1], 2), w, ".")
            for (i = 1; i <= 3; i++) {
              if ((g[i] + 0) > (w[i] + 0)) next
              if ((g[i] + 0) < (w[i] + 0)) { print $1 "@" want[$1] " (" tag " has " $2 ")"; next }
            }
          }'
      }
      # `go list -m` prints "<mod> <ver>" or "<mod> <ver> => <mod> <ver>", so $NF is
      # the EFFECTIVE version and a replace cannot hide behind the require line.
      # (1.19.0 replaces k8s.io/pod-security-admission, which is not floored here.)
      go list -m -e $MODS
      need="$(go list -m -e $MODS | awk 'NF >= 2 && $NF ~ /^v[0-9]/ { print $1, $NF }' | below_floor go.mod | awk '{ print $1 }')"
      if [ -n "$need" ]; then go get $need; fi
      go mod tidy
      LDF="-s -w -X github.com/kyverno/kyverno/pkg/version.BuildVersion=v${{package.version}}"
      bindir="${{targets.destdir}}/usr/bin"
      mkdir -p "$bindir"
      # main admission controller + the other controllers
      go build -trimpath -ldflags "$LDF" -o "$bindir/kyverno"                ./cmd/kyverno
      go build -trimpath -ldflags "$LDF" -o "$bindir/background-controller"  ./cmd/background-controller
      go build -trimpath -ldflags "$LDF" -o "$bindir/cleanup-controller"     ./cmd/cleanup-controller
      go build -trimpath -ldflags "$LDF" -o "$bindir/reports-controller"     ./cmd/reports-controller
      go build -trimpath -ldflags "$LDF" -o "$bindir/readiness-checker"      ./cmd/readiness-checker
      # kyverno-init produces the "kyvernopre" init binary (upstream KYVERNOPRE_BIN)
      go build -trimpath -ldflags "$LDF" -o "$bindir/kyvernopre"             ./cmd/kyverno-init
      # the kubectl plugin / standalone CLI (upstream CLI_BIN = kubectl-kyverno)
      go build -trimpath -ldflags "$LDF" -o "$bindir/kubectl-kyverno"        ./cmd/cli/kubectl-kyverno
      # The float is only real if it reached the BINARIES. Every `dep`/`=>` line of
      # `go version -m` must be at or above its floor -- the `=>` line is what
      # catches a replace-shadowed float. `go version -m` reports only the modules
      # a binary actually links, so a floor a given binary does not import is
      # simply not checked. Fail the build rather than ship it.
      for b in kyverno background-controller cleanup-controller reports-controller readiness-checker kyvernopre kubectl-kyverno; do
        bad="$(go version -m "$bindir/$b" \
          | awk '$1 == "dep" || $1 == "=>" { print $2, $3 }' | below_floor "$b")"
        [ -z "$bad" ] || { echo "❌ 0-CVE float did not reach the binary:"; echo "$bad"; exit 1; }
      done
