# meilisearch: from-source via melange (Rust/cargo build from the git tag).
# Latest 3 stable releases (rolling window); each release pins its git
# commit (COMMIT map). All three pin rust 1.91.1 in rust-toolchain.toml, so the
# melange's rust-1.91 toolchain serves all of them (no per-version RUST map).
# The vendored mini-dashboard build.zip is a PER-VERSION pin (DASHTAG/DASHSHA256):
# each meilisearch tag's crates/meilisearch/Cargo.toml pins its own mini-dashboard
# release + sha1, and build.rs hard-asserts the vendored zip against that sha1
# (1.53.0 -> v0.4.1; 1.53.1/1.53.2 -> v0.4.2, whose build.zip upstream re-uploaded
# on 2026-08-11 to match the Cargo.toml sha1 6a8a76d9...).
FROM_SOURCE=1
# The workflow builds only the LAST THREE entries, so the first one (the chart's 1.53 line)
# stays in VERSIONS to keep it in the lock but is never rebuilt; a 1.53 patch needs the
# window changed or the chart moved to 1.54 (2026-10-04: a 1.53.3 put here never built).
VERSIONS=(1.53.2 1.54.1 1.54.2 1.54.3)
declare -A COMMIT=(
  [1.53.2]=ec006cecec6f684b1dcaee093a45ab4c05707127
  [1.54.1]=dae5eb6be8ae211298992f68ab9cf89b32549571
  [1.54.2]=2b1d96d0a3ca4ccb86329280002c875c8f5ffb60
  [1.54.3]=7ebd97e38c36882b0c78d79e433b9115b4f003b3
)
declare -A DASHTAG=(
  [1.53.2]=v0.4.2
  [1.54.1]=v0.4.2
  [1.54.2]=v0.4.2
  [1.54.3]=v0.4.2
)
declare -A DASHSHA256=(
  [1.53.2]=239ad6c1c47544ad5d7bd3d648814f24ea6797466b07ddfcac4a3523659aca6b
  [1.54.1]=239ad6c1c47544ad5d7bd3d648814f24ea6797466b07ddfcac4a3523659aca6b
  [1.54.2]=239ad6c1c47544ad5d7bd3d648814f24ea6797466b07ddfcac4a3523659aca6b
  [1.54.3]=239ad6c1c47544ad5d7bd3d648814f24ea6797466b07ddfcac4a3523659aca6b
)
# rust-toolchain.toml moved 1.91.1 -> 1.98.1 at v1.54.0.
declare -A RUST=(
  [1.53.2]=rust-1.91
  [1.54.1]=rust-1.98
  [1.54.2]=rust-1.98
  [1.54.3]=rust-1.98
)
render() { echo "s/__VER__/$1/g; s/__COMMIT__/${COMMIT[$1]}/g; s/__RUST__/${RUST[$1]}/g; s/__DASHTAG__/${DASHTAG[$1]}/g; s/__DASHSHA256__/${DASHSHA256[$1]}/g"; }
