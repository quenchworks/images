# meilisearch: from-source via melange (Rust/cargo build from the git tag).
# Latest 3 stable minor lines, newest patch each; each release pins its git
# commit (COMMIT map). All three pin rust 1.91.1 in rust-toolchain.toml, so the
# melange's rust-1.91 toolchain serves all of them (no per-version RUST map).
FROM_SOURCE=1
VERSIONS=(1.49.0 1.50.0 1.51.0)
declare -A COMMIT=(
  [1.48.3]=3390886a5d48ab8a3cc8100a45bbb2117f50b8cc
  [1.49.0]=17758dce3fcc21d8e2415176c29d1106e905de00
  [1.50.0]=2ecfd54ca7f3dd1c76d304efce86c9b8af9f82aa
  [1.51.0]=a765263e32424145adc18fa44462fd82c5666c56
)
render() { echo "s/__VER__/$1/g; s/__COMMIT__/${COMMIT[$1]}/g"; }
