# STATUS: shippable (0-CVE gate passes on all 3 lines; re-triaged 2026-07-08)
#   Previously BLOCKED on lib/jackson-databind-2.19.2.jar (STANDALONE, 5.0.8) --
#   CVE-2026-54515 needs jackson-databind >= 2.21.5, which was UNPUBLISHED on Maven
#   Central until early Jul-2026 (was 404). As of 2026-07-08 jackson 2.21.5 (and the
#   sibling core/annotations/datatype jars) IS published, so melange.yaml now does a
#   SHA256-pinned standalone jar swap for the 5.0.8 line only (jackson 2.19.2->2.21.5,
#   logback 1.5.18->1.5.35, netty 4.1.130->4.1.135.Final -- all same-major/minor,
#   NOT shaded). The 4.0.20 and 4.1.11 lines already pass the gate as-is (their older
#   bundled jars have no *fixable* findings), so all three lines stay in VERSIONS.
#
# cassandra: from-source via melange (fetch the apache binary dist + sha512).
# Latest 3 stable minor lines, each at its newest patch (full X.Y.Z, used as-is).
# Cassandra's supported JDK differs by line (4.0/4.1 -> Java 11, 5.0 -> Java 17),
# so the JRE package AND its /usr/lib/jvm home are pinned PER version too.
#   __VER__     = version (apache-cassandra-__VER__-bin.tar.gz)
#   __SHA512__  = that tarball's sha512
#   __JREPKG__  = the Wolfi JRE package for this cassandra line
#   __JHOME__   = the JAVA_HOME dir name under /usr/lib/jvm
# UNBLOCKED 2026-07-09: 5.0.8 standalone jar-swap (jackson 2.21.5, logback 1.5.35,
# netty 4.1.135.Final) clears the gate; 4.1.11 already clean. Both lines gate 0-CVE
# (x86_64) and 5.0.8 passes the boot/CQL smoke test.
FROM_SOURCE=1
VERSIONS=(5.0.9)
declare -A SHA512=(
  [4.0.20]=4abd74a1a488360d94ee3bca905c7095cac2e3328577e46622aa41144b1a612844af79ba5ec3e98b26d08fee168511fac128bc6ea2eb2026f981d72bfdeb9fdb
  [4.1.11]=c31ead4e137774964818b3acfc2a16c329cce412ebb003baf447c3d453800a590d970cbe98641bd81539fd7a7fb8a1b6b569e5072c93fc2e18f40eaa638225be
  [5.0.8]=06b7af18c8f41dc13dbfdae186d565a5f91e71ea413c3c5373aec8a4e5074c6dee5632a0e5e98c21665f08f7291d7ca384f61a323c02610c6bca51e074b5a0c4
  [5.0.9]=beaf3df6342ef1a0ccc83fa80214f250b32c35cfbb1af591b00e3fd539eef0915bc3b89f0e7ae73f6d50cbb03f6075c4e4cf32d3c46ff9c33f745542fcc925df
)
declare -A JRE=(
  [4.0.20]=openjdk-11-jre
  [4.1.11]=openjdk-11-jre
  [5.0.8]=openjdk-17-jre
  [5.0.9]=openjdk-17-jre
)
declare -A JHOME=(
  [4.0.20]=java-11-openjdk
  [4.1.11]=java-11-openjdk
  [5.0.8]=java-17-openjdk
  [5.0.9]=java-17-openjdk
)
render() {
  echo "s/__VER__/$1/g; s|__SHA512__|${SHA512[$1]}|g; s/__JREPKG__/${JRE[$1]}/g; s/__JHOME__/${JHOME[$1]}/g"
}
