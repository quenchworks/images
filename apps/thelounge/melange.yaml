# The Lounge from npm into /app, its exact dependency pins lifted by overrides to fixed versions.
package:
  name: quench-thelounge
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened The Lounge web IRC client, installed from npm on Wolfi"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
      - nodejs-24

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - git
      - nodejs-24
      - npm

pipeline:
  - runs: |
      set -eu
      export HOME="$(mktemp -d)" npm_config_cache="$(mktemp -d)"
      app="${{targets.destdir}}/app"
      install -d "$app"
      # thelounge pins every dependency exactly; these overrides lift the vulnerable ones. Majors, each
      # checked at its one call site: linkify-it 5 (shared/linkify.js, same factory), @fastify/busboy 3
      # (server/plugins/uploader.js, same constructor), file-type 21 (ESM-only: patched below).
      cat > "$app/package.json" <<EOF
      {
        "name": "quench-thelounge",
        "private": true,
        "dependencies": { "thelounge": "${{package.version}}" },
        "overrides": {
          "express": "4.22.3", "socket.io": "4.8.4", "lodash": "4.18.1", "node-forge": "1.4.3",
          "linkify-it": "5.0.2", "@fastify/busboy": "3.2.5", "file-type": "21.3.4"
        }
      }
      EOF
      # irc-framework is a GitHub commit dependency of thelounge
      ( cd "$app" && npm install --omit=dev --ignore-scripts --no-audit --no-fund --allow-git=all )
      tl="$app/node_modules/thelounge"
      v="$(node -p "require('$tl/package.json').version")"
      [ "$v" = "${{package.version}}" ] || { echo "installed $v"; exit 1; }
      # file-type 21 is ESM-only and has no default fromBuffer: load it with import() at the call site
      f="$tl/dist/server/plugins/uploader.js"
      sed -i -e 's|^const file_type_1 = __importDefault(require("file-type"));$|// file-type 21 is ESM-only: imported where it is used (quench patch)|' \
             -e 's|await file_type_1.default.fromBuffer(buffer)|await (await import("file-type")).fileTypeFromBuffer(buffer)|' "$f"
      ! grep -q 'file_type_1' "$f"
      grep -q 'fileTypeFromBuffer(buffer)' "$f"
      # the patched paths work: busboy 3 parses a multipart body, file-type 21 sniffs a PNG
      ( cd "$tl" && node -e '
        const B = require("@fastify/busboy"); let got = "";
        const b = new B({ headers: { "content-type": "multipart/form-data; boundary=x" } });
        b.on("file", (n, f) => f.on("data", d => got += d));
        b.on("finish", () => { if (got !== "hello") process.exit(1); });
        b.end("--x\r\nContent-Disposition: form-data; name=\"f\"; filename=\"a\"\r\n\r\nhello\r\n--x--\r\n");
        require("./dist/server/plugins/uploader.js");
        import("file-type").then(m => m.fileTypeFromBuffer(Buffer.from("89504e470d0a1a0a0000000d49484452", "hex")))
          .then(t => { if (!t || t.mime !== "image/png") process.exit(1); });' )
      rm -f "$app/package-lock.json"
      node "$tl/index.js" --version | grep -F "v${{package.version}}"

test:
  pipeline:
    - runs: node /app/node_modules/thelounge/index.js --version
