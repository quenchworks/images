# thelounge: The Lounge (thelounge/thelounge, MIT), a self-hosted web IRC client that stays connected:
# always-on networks, history, push notifications and file uploads. Images issue #49.
#
# From npm via melange: thelounge installed into /app on Wolfi nodejs-24 with overrides for its exact
# pins (express 4.22.3, socket.io 4.8.4, lodash, node-forge, linkify-it 5, @fastify/busboy 3 and
# file-type 21; the uploader is patched for file-type 21's ESM-only fileTypeFromBuffer).
# THELOUNGE_HOME=/var/opt/thelounge (config.js, users, logs, uploads): mount a volume there.
# LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(4.5.2)
render() { echo "s/__VER__/$1/g"; }
