# Packages Dagster into a self-contained venv at /opt/dagster/venv.
package:
  name: quench-dagster
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Dagster data orchestrator, packaged on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - python-3.13            # the venv references the system interpreter
      - ca-certificates-bundle
      - glibc
      - libstdc++
      - tzdata
      # Native code from Wolfi, on its scanned OpenSSL and libpq: the psycopg2-binary wheel
      # carried OpenSSL 3.5.8 in psycopg2_binary.libs and grpcio a static BoringSSL.
      - py3.13-grpcio-1.84
      - libpq-18

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - python-3.13
      - py3.13-pip
      - py3.13-grpcio-1.84
      - python-3.13-dev        # Python.h for the psycopg2-binary source build
      - postgresql-18-dev      # pg_config and libpq headers for the same build
      - build-base             # fallback for any transitive dep without a wheel

pipeline:
  - runs: |
      set -eu
      VER="${{package.version}}"
      dest="${{targets.destdir}}"
      VENV=/opt/dagster/venv
      python3.13 -m venv --system-site-packages "$VENV"
      "$VENV/bin/pip" install --no-cache-dir --upgrade pip
      # dagster-postgres follows its own 0.x numbering; pinning dagster makes pip pick the
      # matching release.
      "$VENV/bin/pip" install --no-cache-dir \
        "dagster==${VER}" "dagster-webserver==${VER}" "dagster-graphql==${VER}" dagster-postgres \
        "sqlalchemy<2.1"
      # sqlalchemy<2.1: 2.1 maps postgresql:// to psycopg (v3); dagster-postgres builds that
      # URL and is written for psycopg2, and under psycopg its pooled connections close
      # ("the connection is closed" on the daemon heartbeat query in the chart gate).
      "$VENV/bin/python" -c "import importlib.metadata as m, sys; v = m.version('dagster'); assert v == sys.argv[1], v; print('dagster', v, 'dagster-postgres', m.version('dagster-postgres'))" "${VER}"
      # dagster-postgres requires psycopg2-binary by name: keep that distribution at the
      # same version, compiled from its sdist against Wolfi libpq-18. grpcio leaves the
      # venv for Wolfi's (system site-packages); pip check confirms it fits the ranges.
      P2=$("$VENV/bin/python" -c "import importlib.metadata as m; print(m.version('psycopg2-binary'))")
      "$VENV/bin/pip" uninstall -y grpcio
      "$VENV/bin/pip" install --no-cache-dir --no-deps --force-reinstall --no-binary psycopg2-binary "psycopg2-binary==${P2}"
      "$VENV/bin/pip" check
      SITE="$VENV/lib/python3.13/site-packages"
      if ls -d "$SITE"/*.libs 2>/dev/null | grep -q .; then echo "bundled native libs:"; ls -d "$SITE"/*.libs; exit 1; fi
      test ! -e "$SITE/grpc" || { echo "grpcio still in the venv"; exit 1; }
      "$VENV/bin/python" -c "import grpc, psycopg2, sqlalchemy; assert grpc.__file__.startswith('/usr/lib/python3.13/site-packages/'), grpc.__file__; e = sqlalchemy.create_engine('postgresql://u:p@127.0.0.1/db'); assert e.dialect.driver == 'psycopg2', e.dialect.driver; print('grpc', grpc.__version__, 'from Wolfi; psycopg2', psycopg2.__version__, 'sqlalchemy', sqlalchemy.__version__)"
      "$VENV/bin/pip" uninstall -y pip
      install -d "${dest}/opt/dagster"
      cp -a "$VENV" "${dest}/opt/dagster/venv"
      install -d "${dest}/usr/bin"
      for b in dagster dagster-webserver dagster-daemon; do
        ln -sf "/opt/dagster/venv/bin/$b" "${dest}/usr/bin/$b"
      done
      chmod -R a+rX "${dest}/opt/dagster"

test:
  pipeline:
    - runs: |
        test -x /opt/dagster/venv/bin/dagster-webserver
