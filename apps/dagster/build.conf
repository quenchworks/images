# dagster: the Dagster data orchestrator (webserver + daemon + CLI), installed from PyPI
# into a Python 3.13 venv on Wolfi. One image runs every role: dagster-webserver (the UI,
# the default command), dagster-daemon (schedules, sensors, run queue), and user code
# servers built on top of it.
#
# Packages: dagster, dagster-webserver and dagster-graphql release in lockstep (1.x);
# dagster-postgres is on its own 0.x numbering, so pip resolves the release that pins
# dagster==<VER>. All Apache-2.0.
#
# NEWEST-ONLY: Dagster releases weekly; the image tracks the newest.
BLOCKED=0
FROM_SOURCE=0
VERSIONS=(1.13.24)
render() { echo "s/__VER__/$1/g"; }
