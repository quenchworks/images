# apache-pinot: Apache Pinot, the real-time distributed OLAP datastore, built from the source
# release (mvn -Pbin-dist -Pbuild-shaded-jar on Wolfi openjdk-25) on a Wolfi JRE.
#
# Why from source: the release tarball's fat jars hold relocated copies of jackson the scanner
# cannot see (fat-jar metadata names one copy; the classes hold several). Read by class on
# 1.6.0: pulsar.shade 2.18.9, awssdk thirdparty 2.21.4, shaded.parquet 2.22.2 and
# hadoop.shaded 2.12.7, besides 10 metadata findings. The build fixes them at the source:
#   - property bumps: aws.sdk.version 2.57.13 (thirdparty jackson 2.21.8), parquet.version
#     1.18.2 (2.22.4), pulsar.version 4.0.14 (2.18.11), async-http-client 3.0.14
#   - pom-pins.patch: hadoop-shaded-guava 1.6.0 (guava 33.7.2) and org.json 20260719
#   - hadoop-jackson-relocate.pom.xml: hadoop-client-runtime's relocated jackson (2.12.7, and
#     2.18.6 even on hadoop 3.5.0) is replaced in pinot-parquet by 2.18.12 relocated to the
#     same names, with the jaxrs and jaxb modules and hadoop's javax.* relocations
# Measured 2026-11-11: trivy 0, and every jackson copy by class at a fixed version.
#
# NEWEST-ONLY for now: one line.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(1.6.0)
declare -A SHA256=(
  [1.6.0]=726da5fe6f8fdeb7f6a99da87a1405aa756afb157521b3c7ea124a0a5c4cf4b8
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
