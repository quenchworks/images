contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-apache-pinot@local

accounts:
  groups:
    - groupname: nonroot
      gid: 1001
  users:
    - username: nonroot
      uid: 1001
      gid: 1001
      homedir: /var/pinot
  run-as: 1001

# controller, server and minion data; the chart mounts a volume here
paths:
  - path: /var/pinot
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o755

environment:
  JAVA_HOME: /usr/lib/jvm/java-25-openjdk
  PINOT_HOME: /opt/pinot

work-dir: /opt/pinot

# pinot-admin.sh StartController | StartBroker | StartServer | StartMinion ...
entrypoint:
  command: /opt/pinot/bin/pinot-admin.sh

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-apache-pinot"
  org.opencontainers.image.licenses: "Apache-2.0"
