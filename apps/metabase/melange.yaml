# Packages Metabase's official uberjar with one dependency swapped in place:
# lz4-java __LZ4_VER__ (from Maven Central, sha256-pinned) over the bundled 1.10.4,
# classes, JNI natives and Maven metadata alike. 1.11.1 is a superset of the
# bundled files (three more JNI classes, one more arch), so overwriting the
# entries leaves nothing of 1.10.4 behind. The jar is not signed, so editing it
# breaks no signature.
package:
  name: quench-metabase
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Metabase (open-source edition) on Wolfi"
  copyright:
    - license: AGPL-3.0-only
  dependencies:
    runtime:
      - ca-certificates-bundle
      - openjdk-25-jre
      - openjdk-25-default-jvm

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      - zip

pipeline:
  - runs: |
      set -eu
      curl -fsSL -o metabase.jar "https://downloads.metabase.com/v${{package.version}}/metabase.jar"
      echo "__SHA256__  metabase.jar" | sha256sum -c -
      curl -fsSL -o lz4.jar "https://repo1.maven.org/maven2/at/yawk/lz4/lz4-java/__LZ4_VER__/lz4-java-__LZ4_VER__.jar"
      echo "__LZ4_SHA256__  lz4.jar" | sha256sum -c -
      mkdir lz4 && unzip -q lz4.jar 'net/*' 'META-INF/maven/at.yawk.lz4/*' -d lz4
      (cd lz4 && zip -q -r ../metabase.jar net META-INF/maven/at.yawk.lz4)
      v="$(unzip -p metabase.jar META-INF/maven/at.yawk.lz4/lz4-java/pom.properties | sed -n 's/^version=//p')"
      [ "$v" = "__LZ4_VER__" ] || { echo "lz4-java is $v after the swap"; exit 1; }
      # jackson-databind is unshaded in the uberjar; same in-place class swap.
      curl -fsSL -o databind.jar "https://repo1.maven.org/maven2/com/fasterxml/jackson/core/jackson-databind/__DATABIND_VER__/jackson-databind-__DATABIND_VER__.jar"
      echo "__DATABIND_SHA256__  databind.jar" | sha256sum -c -
      v="$(unzip -p metabase.jar META-INF/maven/com.fasterxml.jackson.core/jackson-databind/pom.properties | sed -n 's/^version=//p')"
      [ -n "$v" ] || { echo "no jackson-databind in the uberjar; re-audit"; exit 1; }
      mkdir databind && unzip -q databind.jar 'com/fasterxml/jackson/databind/*' 'META-INF/maven/com.fasterxml.jackson.core/jackson-databind/*' -d databind
      (cd databind && zip -q -r ../metabase.jar com META-INF/maven/com.fasterxml.jackson.core)
      v="$(unzip -p metabase.jar META-INF/maven/com.fasterxml.jackson.core/jackson-databind/pom.properties | sed -n 's/^version=//p')"
      [ "$v" = "__DATABIND_VER__" ] || { echo "jackson-databind is $v after the swap"; exit 1; }
      # jackson-core likewise; it is multi-release, so the META-INF/versions classes go too.
      curl -fsSL -o core.jar "https://repo1.maven.org/maven2/com/fasterxml/jackson/core/jackson-core/__CORE_VER__/jackson-core-__CORE_VER__.jar"
      echo "__CORE_SHA256__  core.jar" | sha256sum -c -
      v="$(unzip -p metabase.jar META-INF/maven/com.fasterxml.jackson.core/jackson-core/pom.properties | sed -n 's/^version=//p')"
      [ -n "$v" ] || { echo "no jackson-core in the uberjar; re-audit"; exit 1; }
      mkdir core && unzip -q core.jar 'com/fasterxml/jackson/core/*' 'META-INF/versions/*/com/fasterxml/jackson/core/*' 'META-INF/maven/com.fasterxml.jackson.core/jackson-core/*' -d core
      (cd core && zip -q -r ../metabase.jar com META-INF)
      v="$(unzip -p metabase.jar META-INF/maven/com.fasterxml.jackson.core/jackson-core/pom.properties | sed -n 's/^version=//p')"
      [ "$v" = "__CORE_VER__" ] || { echo "jackson-core is $v after the swap"; exit 1; }
      install -Dm644 metabase.jar "${{targets.destdir}}/usr/share/metabase/metabase.jar"
