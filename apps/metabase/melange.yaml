# Packages Metabase's official uberjar with one dependency swapped in place:
# lz4-java __LZ4_VER__ (from Maven Central, sha256-pinned) over the bundled 1.10.4,
# classes, JNI natives and Maven metadata alike. 1.11.1 is a superset of the
# bundled files (three more JNI classes, one more arch), so overwriting the
# entries leaves nothing of 1.10.4 behind. The jar is not signed, so editing it
# breaks no signature.
package:
  name: quench-metabase
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Metabase (open-source edition) on Wolfi"
  copyright:
    - license: AGPL-3.0-only
  dependencies:
    runtime:
      - ca-certificates-bundle
      - openjdk-25-jre
      - openjdk-25-default-jvm

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      - zip

pipeline:
  - runs: |
      set -eu
      curl -fsSL -o metabase.jar "https://downloads.metabase.com/v${{package.version}}/metabase.jar"
      echo "__SHA256__  metabase.jar" | sha256sum -c -
      curl -fsSL -o lz4.jar "https://repo1.maven.org/maven2/at/yawk/lz4/lz4-java/__LZ4_VER__/lz4-java-__LZ4_VER__.jar"
      echo "__LZ4_SHA256__  lz4.jar" | sha256sum -c -
      mkdir lz4 && unzip -q lz4.jar 'net/*' 'META-INF/maven/at.yawk.lz4/*' -d lz4
      (cd lz4 && zip -q -r ../metabase.jar net META-INF/maven/at.yawk.lz4)
      v="$(unzip -p metabase.jar META-INF/maven/at.yawk.lz4/lz4-java/pom.properties | sed -n 's/^version=//p')"
      [ "$v" = "__LZ4_VER__" ] || { echo "lz4-java is $v after the swap"; exit 1; }
      install -Dm644 metabase.jar "${{targets.destdir}}/usr/share/metabase/metabase.jar"
