# metabase: Metabase open-source edition (v0.x; v1.x tags are Enterprise), the
# official uberjar from downloads.metabase.com on Wolfi's openjdk-25-jre (the
# jar's Build-Jdk-Spec is 25). FROM_SOURCE=0 for the jar: its build is Clojure
# plus a large JS front end.
#
# WINDOW: the chart's 0.63 line plus the newest line (2026-10-12: 0.64.1 added, image
# first; the chart moves after the 0.64 notes are read). Before that, latest only. 0.58.x is still patched, but 0.58.34 bundles 13 fixable
# findings (jackson, httpcore5, zookeeper, commons-configuration2) that 0.63 has
# moved past.
#
# The jar is flattened, so a dependency cannot be swapped as a file. melange.yaml
# replaces lz4-java's classes and natives in place (1.10.4 -> 1.11.1,
# CVE-2026-59949), and vex.openvex.json covers the mssql-jdbc false positive.
BLOCKED=0
FROM_SOURCE=0
VERSIONS=(0.63.19 0.64.1)
declare -A SHA256=(
  [0.63.19]=d4695f2d4b0e0ba79f37d39b2a1ae9937d1e133aff813c33c0772a6329b2af02
  [0.64.1]=ffe600f532875b4d3c738effbc0f42f8a1ad7f8255cb875569f73b36645ef11d
)
LZ4_VERSION=1.11.4
LZ4_SHA256=58c8e0b813960d2a248e050c353baea73139b48a2ffc55382d42c69707e17325
# jackson-databind 2.21.6 in the uberjar carries CVE-2026-91776/-91777 (fixed 2.21.7);
# sha256 from Maven Central, 2026-10-01.
DATABIND_VERSION=2.21.7
DATABIND_SHA256=1290c2795e93e8a6861a6c4d9ff0d844d32f5ea178362cb2721edf5561e828b1
# jackson-core 2.21.6 in the uberjar carries CVE-2026-89407/-89425 (2026-10-04).
CORE_VERSION=2.21.7
CORE_SHA256=8c5623b98f32d5f7e1287ff61ed50e08ab7b11381e991fff89327faabba42261
# netty-codec-dns 4.1.135 in the uberjar carries CVE-2026-73508 (fixed 4.1.136); sha256 from
# Maven Central (sha1 matched), 2026-10-12.
NETTY_DNS_VERSION=4.1.136.Final
NETTY_DNS_SHA256=89bddc4ec42756c41a0195a50a1323a324836162b6712a843c3de5c29096c93b
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g; s/__LZ4_VER__/$LZ4_VERSION/g; s|__LZ4_SHA256__|$LZ4_SHA256|g; s/__DATABIND_VER__/$DATABIND_VERSION/g; s|__DATABIND_SHA256__|$DATABIND_SHA256|g; s/__CORE_VER__/$CORE_VERSION/g; s|__CORE_SHA256__|$CORE_SHA256|g; s/__NETTY_DNS_VER__/$NETTY_DNS_VERSION/g; s|__NETTY_DNS_SHA256__|$NETTY_DNS_SHA256|g"; }
