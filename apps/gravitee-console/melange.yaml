# Installs the Gravitee APIM console (static Angular bundle) at /usr/share/nginx/html
# from the full distribution zip, plus a nonroot, read-only-root nginx config at
# /etc/gravitee-console/nginx.conf. nginx itself comes from Wolfi at runtime.
package:
  name: quench-gravitee-console
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Gravitee APIM console (static UI served by nginx)"
  copyright:
    - license: Apache-2.0

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - unzip

pipeline:
  - uses: fetch
    with:
      uri: https://download.gravitee.io/graviteeio-apim/distributions/graviteeio-full-${{package.version}}.zip
      expected-sha256: __SHA256__
      extract: false
  - runs: |
      set -eu
      v="${{package.version}}"
      html="${{targets.destdir}}/usr/share/nginx/html"
      unzip -q "graviteeio-full-$v.zip" "graviteeio-full-$v/graviteeio-apim-console-ui-$v/*"
      rm -f "graviteeio-full-$v.zip"
      install -d "$html"
      cp -a "graviteeio-full-$v/graviteeio-apim-console-ui-$v/." "$html/"
      # source maps are build debris, not part of the served app
      find "$html" -name '*.map' -delete
      # 4.13 ships monaco-editor's own DOMPurify package (3.4.8: CVE-2026-65898, GHSA-55q2/6688 and more, fixed by
      # 3.4.16) under assets/: replace it with 3.4.18, same 3.4 API and file names. 4.12 bundles none there.
      dp="$html/assets/monaco-editor/node_modules/dompurify"
      if [ -d "$dp" ]; then
        have="$(sed -n 's/^  "version": "\(.*\)",$/\1/p' "$dp/package.json")"
        if [ "$(printf '%s\n%s\n' 3.4.16 "$have" | sort -V | head -1)" != 3.4.16 ]; then
          wget -q -O dp.tgz https://registry.npmjs.org/dompurify/-/dompurify-3.4.18.tgz
          echo "8b86f79c6481fec23dd81d4de32179422668912ed033c0c47e786a6e70cb3379  dp.tgz" | sha256sum -c -
          rm -rf "$dp" && install -d "$dp" && tar -xzf dp.tgz -C "$dp" --strip-components=1 && rm -f dp.tgz
          find "$dp" -name '*.map' -delete
          grep -q '"version": "3.4.18"' "$dp/package.json"
        fi
      fi
      test -f "$html/index.html"
      test -f "$html/constants.json"
      chmod -R a+rX "$html"
      install -d "${{targets.destdir}}/etc/gravitee-console"
      cat > "${{targets.destdir}}/etc/gravitee-console/nginx.conf" <<'NGINX'
      # daemon off so nginx stays in the foreground as PID 1 (no shell wrapper).
      daemon off;
      worker_processes auto;
      pid /tmp/nginx.pid;
      error_log /dev/stderr notice;

      events {
          worker_connections 1024;
      }

      http {
          include       /etc/nginx/mime.types;
          default_type  application/octet-stream;

          client_body_temp_path /tmp/client_body_temp;
          proxy_temp_path       /tmp/proxy_temp;
          fastcgi_temp_path     /tmp/fastcgi_temp;
          uwsgi_temp_path       /tmp/uwsgi_temp;
          scgi_temp_path        /tmp/scgi_temp;

          access_log /dev/stdout;
          sendfile      on;
          gzip          on;
          server_tokens off;

          server {
              listen      8080;
              server_name _;
              root        /usr/share/nginx/html;
              index       index.html;

              # constants.json carries the management API URL; never cache it
              location = /constants.json {
                  add_header Cache-Control "no-store";
              }
              location / {
                  try_files $uri $uri/ /index.html;
              }
          }
      }
      NGINX

test:
  pipeline:
    - runs: |
        test -f /usr/share/nginx/html/index.html
        test -f /etc/gravitee-console/nginx.conf
