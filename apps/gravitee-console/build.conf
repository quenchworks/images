# gravitee-console: the Gravitee API Management (APIM) console, the Angular admin UI, from the
# graviteeio-full-<v>.zip distribution on download.gravitee.io (the only public artifact
# for 4.10+: Maven Central stops at 4.7.8 and the per-component zips answer 404), pinned
# by the sha256 of that zip. Two lines, newest patch of each.
#
# The UI is a static bundle (Apache-2.0, gravitee-api-management/gravitee-apim-console-webui)
# served by the Wolfi nginx on 8080; it talks to the management API at constants.json
# baseURL ("/management", same origin; the chart mounts its own constants.json).
FROM_SOURCE=1
VERSIONS=(4.11.33 4.12.27)
declare -A SHA256=(
  [4.11.33]=4ef52f631301dc0551d22c6a0e3d4d74f515696e4781aecfde309dd13409b890
  [4.12.27]=0fc08fd8df78dda8b39337f97c4da0c2df6bd560e139a6d4943016427478c675
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
