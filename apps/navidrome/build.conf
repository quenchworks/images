# Navidrome (navidrome/navidrome): from-source via melange. Image-only (a
# self-hosted music server + streamer, no chart). NEWEST-ONLY: we ship the
# latest stable tag only. Go backend that go:embeds a React web UI (ui/build),
# so the frontend is (re)built with npm in the build sandbox first, then the Go
# binary is compiled with CGO (mattn/go-sqlite3) and statically linked against
# musl (see melange.yaml). Version is stamped via -X on
# github.com/navidrome/navidrome/consts.gitTag (upstream keeps the "v" prefix on
# the tag and trims it at runtime) plus consts.gitSha (must be non-empty or the
# reported version falls back to "dev").
FROM_SOURCE=1
VERSIONS=(0.64.0)
declare -A SHA256=(
  [0.64.0]=0f395ee2672d32eed9da9ad6b16ec21d1a270d3ba5299fd638ddca237db5fa4c
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
