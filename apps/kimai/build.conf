# kimai: Kimai (kimai/kimai, AGPL-3.0), open-source time tracking for freelancers and teams: timesheets,
# projects, customers, invoices, reports and a REST API. Images issue #75.
#
# From the release tag: composer install --no-dev (LDAP login, which needs laminas-ldap and ext-ldap, is
# not included); the built assets come committed in public/build. php-8.5-fpm and QuenchWorks' nginx under supervisor (as
# Firefly III and Grocy). Code in /opt/kimai; var/ (cache, logs, sessions, data, plugins) is a symlink to
# /var/lib/kimai/var on the volume. /usr/libexec/kimai-init requires APP_SECRET and DATABASE_URL (MySQL or
# MariaDB: Kimai 2 has no SQLite), waits for the database, runs kimai:install, creates ADMIN_USER with
# ADMIN_PASSWORD when both are set, warms the cache and starts supervisord.
# LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(2.72.0)
declare -A SHA256=(
  [2.72.0]=f5ffaa9c7ca24a641fd38c93a3d72c34ce2e24930e487e9745f49f81eeceb6de
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
