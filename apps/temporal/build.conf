# temporal: from-source via melange (Go build of temporalio/temporal server).
# Newest stable patch only. Pins its tarball by sha256.
FROM_SOURCE=1
VERSIONS=(1.32.1)
declare -A SHA256=(
  [1.32.1]=9a1766efcdc2acf03165e0304549d00930e18ff4fbf2c5abe27732fe7c04f7ee
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
