# temporal: from-source via melange (Go build of temporalio/temporal server).
# Newest stable patch only. Pins its tarball by sha256.
FROM_SOURCE=1
VERSIONS=(1.32.2)
declare -A SHA256=(
  [1.32.2]=f56f8c4e2ea10e50cfddc8d66bbba54fcff4f157ae3dfcefc179acfc5de0315c
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
