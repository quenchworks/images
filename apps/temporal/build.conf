# temporal: from-source via melange (Go build of temporalio/temporal server).
# Newest stable patch only. Pins its tarball by sha256.
FROM_SOURCE=1
VERSIONS=(1.32.0)
declare -A SHA256=(
  [1.32.0]=a089b27f11b6910ee2ff7e7bb429831f87f1fe3dd6d82419cef3aca24039c47c
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
