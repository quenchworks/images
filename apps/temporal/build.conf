# temporal: from-source via melange (Go build of temporalio/temporal server).
# Newest stable patch only. Pins its tarball by sha256.
FROM_SOURCE=1
VERSIONS=(1.31.2)
declare -A SHA256=(
  [1.31.2]=b37e0096bd8609a4081180b1cb9b095c83f63de0e261875c74c2965f82204ea7
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
