# temporal: from-source via melange (Go build of temporalio/temporal server).
# Newest stable patch only. Pins its tarball by sha256.
FROM_SOURCE=1
VERSIONS=(1.31.1)
declare -A SHA256=(
  [1.31.1]=6092da886bf51c2f8b7751af9ce456b9bda3a90b0436007d84a0b8d9b7a911f9
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
