# cloudreve: Cloudreve (cloudreve/cloudreve), self-hosted file management and sharing with a web UI,
# storage policies, WebDAV and share links. GPL-3.0. Images issue #42.
#
# The frontend is the cloudreve/frontend submodule, pinned per release (FRONTEND = the submodule commit of
# the tag); it is built with yarn and embedded as application/statics/assets.zip, as upstream's
# .build/build-assets.sh does. Core server only: upstream's image also bundles ffmpeg, libvips,
# LibreOffice and aria2 for optional thumbnails and offline downloads.
FROM_SOURCE=1
VERSIONS=(4.19.1)
declare -A SHA256=(
  [4.19.1]=9dcc03653be86c412770a1f747d6c2dae3a677a17c623f40f0cb6f8b30a5803f
)
declare -A FRONTEND=(
  [4.19.1]=19da0fe1ecd40971fafa813983d769fdce41573c
)
declare -A FRONTEND_SHA256=(
  [4.19.1]=38c14a3d386f41eaf583119bc75f4239cc21ddfc801ed2d8c7a87fb448726ef8
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g; s|__FRONTEND__|${FRONTEND[$1]}|g; s|__FRONTEND_SHA256__|${FRONTEND_SHA256[$1]}|g"; }
