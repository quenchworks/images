package:
  name: quench-cloudreve
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Cloudreve, built from source on Wolfi"
  copyright:
    - license: GPL-3.0-only
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.26
      - nodejs-24
      - npm
      - zip

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/cloudreve/cloudreve/archive/refs/tags/${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - runs: mkdir -p assets
  - uses: fetch
    with:
      uri: https://github.com/cloudreve/frontend/archive/__FRONTEND__.tar.gz
      expected-sha256: __FRONTEND_SHA256__
      directory: assets

  - name: Build the frontend and embed it
    runs: |
      set -eu
      export npm_config_cache="$(mktemp -d)" HOME="$(mktemp -d)" YARN_CACHE_FOLDER="$(mktemp -d)" NODE_OPTIONS=--max-old-space-size=6144
      YARN_PREFIX="$(mktemp -d)"
      npm install -g --prefix "$YARN_PREFIX" yarn@1
      export PATH="$YARN_PREFIX/bin:$PATH"
      ( cd assets && yarn install --frozen-lockfile --network-timeout 1000000 && yarn version --new-version ${{package.version}} --no-git-tag-version && yarn run build )
      test -f assets/build/index.html
      rm -f application/statics/assets.zip
      zip -qr application/statics/assets.zip assets/build

  - name: Build cloudreve
    runs: |
      set -eu
      export CGO_ENABLED=0 GOFLAGS=-mod=mod GOTOOLCHAIN=local
      # rardecode 2.2.0 changed the reader interface; mholt/archives 0.1.5 is the release that follows it.
      # base64Captcha stays at Cloudreve's pin: see vex.openvex.json (v1.3.6 removed the API it calls).
      FLOOR="golang.org/x/crypto@v0.58.1-0.20261009181718-2f1f834330b2 golang.org/x/net@v0.62.0 golang.org/x/text@v0.43.0 golang.org/x/image@v0.45.0 golang.org/x/mod@v0.41.0 github.com/gorilla/websocket@v1.5.3 github.com/klauspost/compress@v1.18.7 github.com/nwaples/rardecode/v2@v2.2.0 github.com/mholt/archives@v0.1.5 github.com/ulikunitz/xz@v0.5.15"
      MODS="$(echo "$FLOOR" | tr ' ' '\n' | cut -d@ -f1)"
      below_floor() {
        awk -v floor="$FLOOR" -v tag="$1" '
          BEGIN { n = split(floor, f, " ")
                  for (i = 1; i <= n; i++) { split(f[i], kv, "@"); want[kv[1]] = kv[2] } }
          ($1 in want) {
            split(substr($2, 2), g, "."); split(substr(want[$1], 2), w, ".")
            for (i = 1; i <= 3; i++) {
              if ((g[i] + 0) > (w[i] + 0)) next
              if ((g[i] + 0) < (w[i] + 0)) { print $1 "@" want[$1] " (" tag " has " $2 ")"; next }
            }
          }'
      }
      need="$(go list -m -e $MODS | awk 'NF >= 2 && $NF ~ /^v[0-9]/ { print $1, $NF }' | below_floor go.mod | awk '{ print $1 }')"
      if [ -n "$need" ]; then go get $need; fi
      c=github.com/cloudreve/Cloudreve/v4/application/constants
      go build -trimpath -ldflags "-s -w -X '$c.BackendVersion=${{package.version}}' -X '$c.LastCommit=__FRONTEND__'" \
        -o "${{targets.destdir}}/cloudreve/cloudreve" .
      bad="$(go version -m "${{targets.destdir}}/cloudreve/cloudreve" | awk '$1 == "dep" || $1 == "=>" { print $2, $3 }' | below_floor cloudreve)"
      [ -z "$bad" ] || { echo "float did not reach the binary:"; echo "$bad"; exit 1; }

test:
  pipeline:
    - runs: test -x /cloudreve/cloudreve
