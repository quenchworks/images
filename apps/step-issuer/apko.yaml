# step-issuer runtime image: minimal, nonroot, multi-arch. The chart supplies the flags.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-step-issuer@local

accounts:
  groups:
    - groupname: step-issuer
      gid: 1001
  users:
    - username: step-issuer
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/bin/step-issuer

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-step-issuer"
  org.opencontainers.image.licenses: "Apache-2.0"
