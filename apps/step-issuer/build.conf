# step-issuer: smallstep's cert-manager external issuer (StepIssuer / StepClusterIssuer CRDs),
# which signs certificate requests through a step-ca JWK provisioner. From source via
# melange, static Go, no CGO. Latest of the last 3 minor lines, each pinned by sha256 of
# the GitHub tag tarball. No version variable exists to stamp.
FROM_SOURCE=1
VERSIONS=(0.10.2 0.11.0 0.12.0)
declare -A SHA256=(
  [0.10.2]=3a0cdf4570e3f478822cf23d4ce2660d0a27c2119361ed802df2bd85a8fc6276
  [0.11.0]=dcf011274a490a3020a096eff8540d7e4367080508ca553ab1370d53029500f5
  [0.12.0]=5b8dcca0074c4db6b94784ba30fe69ed0820ca54829da0a04594627e8ce4682e
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
