# argocd (argoproj/argo-cd): from-source via melange (Go build from the git tag
# tarball). Latest patch of the last 3 minor lines (3.2, 3.3, 3.4). Each release
# pins its source tarball by sha256 and its tag commit by sha1 (upstream's
# version string is only the plain tag when gitCommit is non-empty and the tree
# is clean -- see common/version.go GetVersion()).
#
# ONE multi-call binary serves EVERY Argo CD component. cmd/main.go switches on
# filepath.Base(os.Args[0]) (overridable with $ARGOCD_BINARY_NAME), so the image
# ships /usr/bin/argocd plus a symlink per component -- argocd-server,
# argocd-repo-server, argocd-application-controller,
# argocd-applicationset-controller, argocd-notifications, argocd-cmp-server,
# argocd-commit-server, argocd-dex, argocd-git-ask-pass, argocd-k8s-auth --
# exactly as upstream's Dockerfile does. Nothing is split into a second binary.
#
# THE UI IS SHIPPED. server/ serves the React SPA out of ui/dist/app, embedded by
# ui/embed.go (`//go:embed dist/app`). The source tag ships only
# ui/dist/app/gitkeep, so a plain `go build` WOULD compile and produce a server
# whose every UI route 404s -- a silently broken web console, not a build error.
# There is no "no-UI" build tag upstream; the placeholder gitkeep IS the stub. So
# the recipe reproduces upstream's own asset pipeline (yarn install + webpack
# production) in the melange sandbox before the Go build and asserts index.html
# plus a real chunk exists. Cost: ~90s and ~10 MB of embedded assets per arch.
# Node/yarn live ONLY in the build sandbox; the runtime image carries no JS
# toolchain, so none of it enters the Trivy surface.
#
# RUNTIME DEPENDENCIES (verified against upstream's Dockerfile argocd-base stage,
# not guessed): git + git-lfs + openssh-client (repo-server clones over https/ssh
# and honours enableLfs repos), gnupg (commit/tag signature verification),
# tzdata (AppProject syncWindows carry a timeZone), busybox (see below) and a
# Helm 3 + Kustomize binary on PATH -- util/helm/cmd.go and
# util/kustomize/kustomize.go exec them by bare name.
#
# This image is NOT shell-free, deliberately. util/gpg/gpg.go execs
# `gpg-wrapper.sh` and util/git/client.go execs `git-verify-wrapper.sh`; both are
# upstream POSIX-sh scripts and both are on the signature-verification path, so
# dropping the shell would silently break GPG-verified repos. git itself also
# shells out (GIT_SSH_COMMAND, core.askpass, credential helpers). busybox is the
# minimum that satisfies that, and it scans clean.
#
# Helm is built FROM SOURCE (v3.21.3, newest 3.x) rather than taken from Wolfi:
# the wolfi `helm-3` apk is stuck at 3.19.2-r2 (Dec 2025) and scans with 44
# apk-level + 58 Go-module fixable CVEs, including CVE-2026-35206 in
# helm.sh/helm/v3 itself. Kustomize DOES come from the Wolfi apk -- it is rebuilt
# continuously (5.8.1-r10) and scans clean; if it ever regresses, build it from
# source the same way helm is built here.
#
# 0-CVE FLOATS: the house coherent set (x/net, x/crypto, x/sys, x/text, x/oauth2,
# grpc, otel*) plus four app-specific floors the gate actually demanded, all of
# which every one of the three lines pins below the fix -- go-git/go-git 5.19.1,
# go-git/go-billy 5.9.0, oras-go/v2 2.6.1, slack-go 0.23.1. The go-git bump pulls
# filepath-securejoin to v0.6.1, which MOVED MkdirAll into its pathrs-lite
# subpackage; the 3.2 line still calls the old symbol, so melange.yaml rewrites that
# one call site rather than hold go-git (and seven advisories) back. See melange.yaml
# for the full floor-vs-upstream table and re-check it on every version bump.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(3.2.12 3.3.14 3.4.9)
declare -A SHA256=(
  [3.2.12]=546461e4fb80ef03bf58e73bb0760c0d7cb9e7957ab0b92b6309a673ad961614
  [3.3.14]=de1b8d730e1e774e8a5c40720cc41b190483d1bbb306f213aee6bd9668723b83
  [3.4.9]=c0e5e0eb78f957c099d86ee2651aa27d58fef28d5b31ff0d24dd64edcbaaa9f8
)
# Commit each tag points at. Stamped into common.gitCommit so `argocd version`
# reports the bare tag instead of "v3.4.5+unknown".
declare -A COMMIT=(
  [3.2.12]=4caf2709419b4f172d5a7adbe95d20cb1d86e3bd
  [3.3.14]=a0a99e187cb6126ef0f3be82d90705513d8f6f3e
  [3.4.9]=f4554f40bc545e1d633151cd43cf3784c4e35de3
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g; s|__COMMIT__|${COMMIT[$1]}|g"; }
