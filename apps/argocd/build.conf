#
# Evidence for this app, stated exactly as measured:
#   x86_64  re-gated locally 2026-09-19, PUSH=0: 0 fixable CVEs.
#   aarch64 NOT re-measured locally. Three attempts were killed by the host's
#           OOM watchdog (zram swap leaves no headroom for a qemu-emulated Go
