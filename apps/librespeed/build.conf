# librespeed: LibreSpeed, a self-hosted network speed test (download, upload, ping, jitter) with
# a web UI, from the speedtest-go release tag (the Go backend with the frontend embedded), one
# CGO-free binary (modernc sqlite).
#
# 0-CVE: go.mod carries go-chi v5.0.7, logrus v1.8.1, and 2021-2022 golang.org/x/crypto, x/image
# and x/text; melange.yaml raises chi v5.4.0, logrus v1.9.3, x/image v0.45.0 and the house x floor.
#
# NEWEST-ONLY: speedtest-go ships one line.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(1.1.6)
# sha256 of the GitHub source tarball, from a download
declare -A SHA256=(
  [1.1.6]=ca7c21db3f5dce7f305b09b9e881e90d50980e8b506c161643402f93ac4ba7f2
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
