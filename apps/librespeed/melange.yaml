# librespeed: speedtest-go from the release tag, CGO-free, with the dependency floors.
package:
  name: quench-librespeed
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened LibreSpeed speed test (speedtest-go), built from source on Wolfi"
  copyright:
    - license: LGPL-3.0-only
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/librespeed/speedtest-go/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - runs: |
      set -eu
      export CGO_ENABLED=0 GOTOOLCHAIN=local GOFLAGS=-mod=mod
      test -f web/assets/index.html   # the frontend is embedded (go:embed assets)
      # floors, raised only when below (a bare go get downgrades once upstream passes it); the
      # golang.org/x set moves together, as in the other recipes
      FLOOR="golang.org/x/crypto@v0.58.1-0.20261009181718-2f1f834330b2 golang.org/x/net@v0.62.0 golang.org/x/text@v0.43.0 golang.org/x/sys@v0.49.0 golang.org/x/image@v0.45.0 github.com/go-chi/chi/v5@v5.4.0 github.com/sirupsen/logrus@v1.9.3"
      need=""
      for f in $FLOOR; do
        have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${f%@*}")"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        [ "$(printf '%s\n%s\n' "$have" "${f#*@}" | sort -V | head -1)" = "${f#*@}" ] || need="$need $f"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || go get $need
      go mod tidy
      go build -trimpath -ldflags "-s -w" -o "${{targets.destdir}}/usr/bin/speedtest" .
      # the image's settings: results telemetry off (database_type none), the stats page disabled
      # until a statistics_password is set (the PASSWORD default keeps it off)
      install -d "${{targets.destdir}}/etc/librespeed"
      sed -e 's/^database_type=.*/database_type="none"/' settings.toml > "${{targets.destdir}}/etc/librespeed/settings.toml"
      grep -qx 'database_type="none"' "${{targets.destdir}}/etc/librespeed/settings.toml"
      grep -qx 'listen_port=8989' "${{targets.destdir}}/etc/librespeed/settings.toml"

test:
  pipeline:
    - runs: |
        test -x /usr/bin/speedtest
