# trufflehog: TruffleHog, the secret scanner for git history, filesystems, S3, Docker
# images and more, built from source on Wolfi (static Go, no cgo). Image only, no chart.
#
# Lines: the newest patch of the last three minor lines (3.97, 3.98, 3.99).
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(3.99.9)
# sha256 of the GitHub tag tarball, computed from a download
declare -A SHA256=(
  [3.99.9]=4709b07e25d7b637df3ba692cebb2b3a46e896cbebaa7b80bc4a81b77f2509cb
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
