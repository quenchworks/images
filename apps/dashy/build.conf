# dashy: Dashy (Lissy93/dashy, MIT), a self-hosted start page and dashboard with widgets, status checks, themes,
# multiple pages and auth (basic, Keycloak, OIDC). Images issue #122.
#
# From the release tag as upstream's Dockerfile builds it: yarn install, vite build, then production dependencies
# only, on Wolfi nodejs-24 run by server.js. Writable state is user-data/ (conf.yml and its backups: the volume).
# Unlike upstream's image there is no ping with cap_net_raw: ping-mode status checks are off, HTTP checks work.
# Web UI on 8080 (HTTPS when certificates are mounted at SSL_PUB_KEY_PATH / SSL_PRIV_KEY_PATH).
# LATEST-ONLY: one release line.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(4.9.0)
declare -A SHA256=(
  [4.9.0]=b5eb4b5ce4fa9a396fd2deafecdfa1c6a7c0a2255da8752313828ac907d69d72
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
