# yourls (YOURLS URL shortener): the release tag tarball (PHP, vendored composer tree) on
# Wolfi php-fpm + QuenchWorks nginx under supervisord, like apps/phpmyadmin. One active
# release line. Needs MySQL or MariaDB (the chart bundles the catalog mariadb).
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(1.10.6)
declare -A SHA256=(
  [1.10.6]=95549b8463c67a88eaa93f5dd8079599bc895f5ca047001ce385d1afdda26563
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
