# netbird-dashboard: NetBird's web dashboard (github.com/netbirdio/dashboard, AGPL-3.0), built from
# source with Next.js (static export) and served by Wolfi nginx as uid 1001 on a read-only rootfs (#108).
FROM_SOURCE=1
VERSIONS=(2.97.0)
declare -A SHA256=(
  [2.97.0]=dc81afeba48193eeea279a03f47be2b46de6cc05ca688b3695a65502870dc6e4
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
