# calico-pod2daemon-flexvol image: the flexvol driver installer. Root like upstream's: it writes the host's kubelet plugin directory.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - bash
    - busybox                    # flexvol.sh uses cp, mv, chmod
    - quench-calico-pod2daemon-flexvol@local

entrypoint:
  command: /usr/local/bin/flexvol.sh

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-calico-pod2daemon-flexvol"
  org.opencontainers.image.licenses: "Apache-2.0"
