# it-tools-sharevb: vite build with pnpm (the version package.json pins) and floors on the bundled libraries, served by nginx.
package:
  name: quench-it-tools-sharevb
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened IT-Tools (sharevb fork) dashboard, built from source on Wolfi"
  copyright:
    - license: GPL-3.0-only
  dependencies:
    runtime:
      - nginx

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - nodejs-24
      - npm

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/sharevb/it-tools/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - runs: |
      set -eu
      export HOME="$(mktemp -d)" npm_config_cache="$(mktemp -d)"
      # pnpm 12.6.0 and --ignore-scripts, as upstream's Dockerfile builds it
      npm install -g --prefix "$HOME/.g" pnpm@12.6.0
      export PATH="$HOME/.g/bin:$PATH"
      # floors for every library that ends up in the bundle (images#162), added to the fork's own overrides in
      # pnpm-workspace.yaml (pnpm 10+ reads them there; package.json overrides would displace them)
      : > floors.txt
      printf '%s\n' "  '@intlify/core-base': '^11.4.14'" >> floors.txt
      printf '%s\n' "  '@intlify/shared': '^11.4.14'" >> floors.txt
      printf '%s\n' "  'vue-i18n': '^11.4.14'" >> floors.txt
      printf '%s\n' "  'axios': '^1.20.0'" >> floors.txt
      printf '%s\n' "  'baseline-browser-mapping': '^2.11.0'" >> floors.txt
      printf '%s\n' "  'devalue': '^5.9.3'" >> floors.txt
      printf '%s\n' "  'dompurify': '^3.5.0'" >> floors.txt
      printf '%s\n' "  'fast-uri': '^3.1.9'" >> floors.txt
      printf '%s\n' "  'fast-xml-parser': '^5.12.0'" >> floors.txt
      printf '%s\n' "  'figlet': '^1.11.3'" >> floors.txt
      printf '%s\n' "  'follow-redirects': '^1.16.2'" >> floors.txt
      printf '%s\n' "  'image-size': '^2.0.3'" >> floors.txt
      printf '%s\n' "  'ip-address': '^10.7.4'" >> floors.txt
      printf '%s\n' "  'katex': '^0.18.2'" >> floors.txt
      printf '%s\n' "  'linkify-it': '^5.0.2'" >> floors.txt
      printf '%s\n' "  'lodash-es': '^4.18.1'" >> floors.txt
      printf '%s\n' "  'markdown-it': '^14.3.2'" >> floors.txt
      printf '%s\n' "  'mathjs': '^15.2.0'" >> floors.txt
      printf '%s\n' "  'moment': '^2.31.0'" >> floors.txt
      printf '%s\n' "  'node-forge': '1.4.4'" >> floors.txt
      printf '%s\n' "  'nodemailer': '^9.1.1'" >> floors.txt
      printf '%s\n' "  'prosemirror-view': '^1.42.3'" >> floors.txt
      printf '%s\n' "  'protobufjs': '^7.5.5'" >> floors.txt
      printf '%s\n' "  'sanitize-html': '^2.18.0'" >> floors.txt
      printf '%s\n' "  'underscore': '^1.13.8'" >> floors.txt
      printf '%s\n' "  'uuid': '^14.0.1'" >> floors.txt
      printf '%s\n' "  'deepmerge-ts': '^8.0.0'" >> floors.txt
      printf '%s\n' "  'phin': '^3.7.1'" >> floors.txt
      printf '%s\n' "  'protocol-buffers-schema': '^3.6.1'" >> floors.txt
      printf '%s\n' "  '@xmldom/xmldom': '^0.9.12'" >> floors.txt
      grep -q '^overrides:$' pnpm-workspace.yaml
      sed -i "/^  '@xmldom\/xmldom@0.9.10': 0.9.11$/d" pnpm-workspace.yaml
      sed -i '/^overrides:$/r floors.txt' pnpm-workspace.yaml
      # node-forge 1.4.4 with the fork's ECDSA/Ed25519 patch rebased onto it
      grep -q '^  node-forge@1.4.0: patches/node-forge@1.4.0.patch$' pnpm-workspace.yaml
      sed -i 's#^  node-forge@1.4.0: patches/node-forge@1.4.0.patch$#  node-forge@1.4.4: patches/node-forge@1.4.4.patch#' pnpm-workspace.yaml
      cp node-forge@1.4.4.patch patches/
      pnpm i --ignore-scripts --no-frozen-lockfile
      grep -q "^  node-forge@1.4.4" pnpm-lock.yaml
      ! grep -q "^  ip-address@9\." pnpm-lock.yaml
      # the sitemap plugin runs only when HOSTNAME is set, and a build container's HOSTNAME is not a URL
      env -u HOSTNAME pnpm build
      test -f dist/index.html
      grep -q '<base href="/">' dist/index.html

      D="${{targets.destdir}}"
      install -d "$D/usr/share/nginx/html" "$D/etc/it-tools-sharevb"
      cp -a dist/. "$D/usr/share/nginx/html/"
      cat > "$D/etc/it-tools-sharevb/nginx.conf" <<'EOF'
      daemon off;
      worker_processes auto;
      pid /tmp/nginx.pid;
      error_log /dev/stderr notice;

      events {
          worker_connections 1024;
      }

      http {
          include       /etc/nginx/mime.types;
          default_type  application/octet-stream;

          client_body_temp_path /tmp/client_body_temp;
          proxy_temp_path       /tmp/proxy_temp;
          fastcgi_temp_path     /tmp/fastcgi_temp;
          uwsgi_temp_path       /tmp/uwsgi_temp;
          scgi_temp_path        /tmp/scgi_temp;

          access_log /dev/stdout;
          sendfile      on;
          gzip          on;
          server_tokens off;

          server {
              listen      8080;
              server_name _;
              root        /usr/share/nginx/html;
              index       index.html;

              location / {
                  try_files $uri $uri/ /index.html;
              }
          }
      }
      EOF

test:
  pipeline:
    - runs: |
        test -f /usr/share/nginx/html/index.html
