# it-tools-sharevb: sharevb/it-tools, the actively maintained fork of IT-Tools (many more utilities, monthly
# releases). A static Vue SPA built from the source tag with pnpm 12.6.0 (as upstream's Dockerfile) on Node 24 and
# served by nginx as nonroot on 8080, like it-tools.
#
# 0-CVE (2026-11-25): the release lockfile carries 215 findings; melange.yaml adds floors for every bundled library to
# the fork's own pnpm-workspace.yaml overrides. node-forge moves to 1.4.4 with the fork's ECDSA/Ed25519 patch rebased
# onto it (node-forge@1.4.4.patch here: every hunk of upstream's 1.4.0 patch applies with offsets, regenerated for
# pnpm's exact patcher). Left: build tooling, nodemailer (present in dist only as a name in the licence tool's data),
# unhead 1.11 (advisories are in useHeadSafe/makeTagSafe, which the app does not call) and elliptic 6.6.1
# (CVE-2025-14505, LOW, no fixed version exists).
#
# NEWEST-ONLY: the fork ships one line.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(2026.11.22)
# sha256 of the GitHub source tarball, from a download
declare -A SHA256=(
  [2026.11.22]=b182f4721a4fb43ed0d58f8c7b7b2228beeb088a34c713b5c432c4c69ea11554
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
