# STATUS: ZLIB-ONLY as of 2026-09-16. Measured, not assumed: run 35066780315
# on af0623d gated with exactly one finding, zlib CVE-2026-85091, on every
# version and both arches. Nothing else in this image is flagged.
#
# Wolfi is at 1.3.2.1_rc20260601-r0 and the advisory wants 1.3.3-r0, which
# upstream madler/zlib has never tagged. Downgrading to Wolfi's 1.3.1-r51
# is not a way out either: it predates the 1.3.2-r0 fix for CVE-2026-27171.
#
# BLOCKED=1 skips build+merge so sweeps stop burning a red run here. Clear
# it with scripts/blocked.py --dispatch once Wolfi ships zlib 1.3.3-r0.
# STATUS: UNBLOCKED 2026-07-10 via a build-time CVE port (was BLOCKED on
# web-auth/webauthn-lib ^4.9.1, GHSA-gq4g-fpc9-vjfq, fix only in 5.3.5 = MAJOR;
# 4.x tops out at 4.9.3 unfixed; upstream master STILL pins ^4.9.1, so the 4->5
# port below is original, not an upstream backport).
#
# THE PORT (all in melange.yaml build steps; the fetched tarball is unmodified,
# the assembled tree is not):
#   1. Composer same-major bumps, BOTH vendored trees:
#      3rdparty/: guzzle ^7.12.1+, psr7 ^2.12.1+, phpseclib 2.0.55,
#        dom-crawler 6.4.40, jmespath ^2.9.1 (CVE-2026-54133, newly fixable),
#        webauthn-lib 5.3.5 (+ its new deps symfony/serializer|property-info|
#        property-access held at ^6.4, phpdocumentor/reflection-docblock).
#      apps/notifications/: web-token/jwt-library 4.1.7, guzzle, psr7 -- and
#        MOZART re-compose, because the app EXECUTES prefixed copies under
#        lib/Vendor/ (OCA\Notifications\Vendor\...) while vendor/ ships only
#        composer metadata; bumping metadata alone would game the gate.
#      `composer audit` (0 advisories) is a hard build gate on both trees.
#   2. webauthn-lib 4->5 source port of the ONLY 5 core files referencing
#      Webauthn\*: lib/private/Authentication/WebAuthn/{Manager,
#      CredentialRepository,Db/PublicKeyCredentialEntity}.php (full ported
#      replacements) + core/Controller/WebAuthnController.php +
#      apps/settings/lib/Controller/WebAuthnController.php (sed).
#      API deltas handled: PublicKeyCredentialLoader -> serializer;
#      TokenBinding\* deleted; validators take CeremonyStepManager (secured RP
#      id ['localhost'] moves to the factory; host string replaces the PSR-7
#      request, same Host-header source); assertion flow resolves the stored
#      credential itself and persists the updated sign counter (4.x did both
#      via the removed repository callback); options/source persistence moves
#      from jsonSerialize/createFromString/createFromArray to the serializer.
#
# VERIFICATION (beyond boot smoke -- the image test never exercises WebAuthn):
# a 23-assertion harness synthesized a REAL ES256 credential with webauthn-lib
# 4.9.3 (yielding the exact oc_webauthn.data format existing installs have in
# their DB) and replayed the ported logic on 5.3.5: 4.x-stored credentials
# deserialize; registration + login ceremonies PASS; the sign counter persists;
# a tampered assertion signature is REJECTED; the browser-facing options JSON
# keeps all 4.x keys (frontend-compatible); 4.x-format session data still
# parses (upgrade-in-flight). WebAuthn passwordless login is therefore WORKING,
# not silently broken, under the 5.3.5 bump.
#
# TRADE-OFFS:
#   * The assembled tree no longer matches Nextcloud GmbH's release signature
#     (cannot re-sign without their key), so the entrypoint seeds
#     'integrity.check.disabled' => true (operator-overridable; supply-chain
#     integrity moves to the image layer: cosign + SBOM + SLSA provenance +
#     read-only rootfs). Documented in the entrypoint step too.
#   * composer resolves the newest allowed patch at build time, so rebuilds may
#     float within the pinned same-major ranges (the 0-CVE gate + composer
#     audit re-verify every build).
#   * Drop the port steps when upstream ships a release with webauthn-lib
#     >= 5.3.5 (or a 4.9.x backport) -- check nextcloud/3rdparty on each bump.
#
# nextcloud: the official upstream release tarball (nextcloud-<VER>.tar.bz2 from
# download.nextcloud.com) assembled into a hardened Wolfi php-fpm + nginx runtime.
# NOTHING is compiled -- the tarball is the finished application with its PHP
# dependencies (3rdparty/) and bundled apps already vendored; we fetch it
# sha256-pinned and lay it down under /var/www/html. Like adminer this is a
# prebuilt-asset fetch, so FROM_SOURCE stays unset.
#
# Newest-only: pinned to the latest upstream release (34.0.2). The download server
# publishes a nextcloud-<VER>.tar.bz2.sha256 alongside each release; the digest
# below is that published sha256sum.
#
# PHP major: Nextcloud 34 supports PHP 8.2-8.5 (lib/versioncheck.php bounds).
# PHP 8.3 is the common, upstream-recommended major and is what this is built +
# run against here.
BLOCKED=1
VERSIONS=(34.0.4)
declare -A SHA256=(
  [34.0.4]=00f226e6364f96e0918ab06157158f66601b8cedc25af777f5ee5a3056f42b83
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
