# STATUS: BLOCKED (do not publish)
# The 0-CVE Trivy gate FAILS on the newest release (34.0.1) and cannot be made to
# pass without a major/fork move. All flagged packages are runtime PHP Composer
# libraries VENDORED (shaded) inside the signed upstream Nextcloud release tarball
# -- either in the core 3rdparty/ tree (covered by Nextcloud's core code-integrity
# signature) or inside the signed bundled `notifications` app
# (apps/notifications/vendor/, covered by that app's appinfo/signature.json).
#
# Flagged pkg  installed -> fixed (all SAME-MAJOR fixes exist upstream)  CVE(s):
#   guzzlehttp/guzzle       7.10.0            -> 7.12.1   CVE-2026-55568, CVE-2026-55767
#     (3rdparty/composer/installed.json + apps/notifications/vendor/composer/installed.json)
#   guzzlehttp/psr7         2.9.0 / 2.11.0    -> 2.12.1   CVE-2026-48998, CVE-2026-49214, CVE-2026-55766
#     (3rdparty/ + apps/notifications/vendor/)
#   phpseclib/phpseclib     2.0.54            -> 2.0.55   GHSA-m557-wrgg-6rp4  (3rdparty/)
#   symfony/dom-crawler     v6.4.32           -> 6.4.40   CVE-2026-45071 (LOW) (3rdparty/)
#   web-token/jwt-library   4.1.3             -> 4.1.7    GHSA-3prj-6hqw-cm82 (HIGH),
#       GHSA-jc38-x7x8-2xc8 (HIGH), GHSA-5739-39v2-5754, GHSA-6vvh-pxr4-25r7
#       (apps/notifications/vendor/)
#
# Why BLOCKED (rule 5): upstream STILL PINS the vulnerable versions. 34.0.1 is the
# newest Nextcloud release in existence (only 34.0.0 and 34.0.1 are published on
# download.nextcloud.com; no 34.0.2+, no 35.x, no "latest" endpoint), so the
# "trim to a newer release that ships the fix" path does NOT exist. In-place
# bumping the vendored libs is not a legitimate same-major path either: it would
# break Nextcloud's code-integrity signature (core covers 3rdparty/, and the
# notifications app is separately signed), get surfaced to admins as "integrity
# check failed" / disable the app, and violate this image's clean-room posture of
# shipping the UNMODIFIED upstream release. The melange sandbox also has no
# network for a composer update. Stripping the installed.json metadata is NOT
# valid here (unlike bundled JS dev-tooling) -- guzzle/psr7/phpseclib/jwt are
# RUNTIME PHP libraries; hiding them would mask real shipped vulnerabilities.
# Unblock when a newer Nextcloud release bundles the fixed deps above.
#
# nextcloud: the official upstream release tarball (nextcloud-<VER>.tar.bz2 from
# download.nextcloud.com) assembled into a hardened Wolfi php-fpm + nginx runtime.
# NOTHING is compiled -- the tarball is the finished application with its PHP
# dependencies (3rdparty/) and bundled apps already vendored; we fetch it
# sha256-pinned and lay it down under /var/www/html. Like adminer this is a
# prebuilt-asset fetch, so FROM_SOURCE stays unset.
#
# Newest-only: pinned to the latest upstream release (34.0.1). The download server
# publishes a nextcloud-<VER>.tar.bz2.sha256 alongside each release; the digest
# below is that published sha256sum.
#
# PHP major: Nextcloud 34 supports PHP 8.2-8.5 (lib/versioncheck.php bounds).
# PHP 8.3 is the common, upstream-recommended major and is what this is built +
# run against here.
VERSIONS=(34.0.1)
declare -A SHA256=(
  [34.0.1]=04e9c32fc3fe39f6b6a8a18915ef5afd280a56b4a7f744e18f5fa2efffbc4a63
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
