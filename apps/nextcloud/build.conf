#
# THE HARD BLOCKER is web-auth/webauthn-lib (3rdparty/), flagged for GHSA-gq4g-fpc9-vjfq
# (LOW; SimpleFakeCredentialGenerator empty-secret). Nextcloud core pins ^4.9.1; the 4.x
# line tops out at 4.9.3 with NO fix (Trivy/GHSA fix = 5.3.5 ONLY, a NEW MAJOR). Forcing
# 5.3.5 RESOLVES (symfony components can be held at ^6.4, no v8 cascade) BUT BREAKS THE
# APP: webauthn-lib 5.x REMOVED APIs that Nextcloud 34 core hard-depends on --
#   * interface Webauthn\PublicKeyCredentialSourceRepository  (Nextcloud's
#     lib/.../WebAuthn/CredentialRepository.php `implements` it -> fatal at autoload)
#   * namespace Webauthn\TokenBinding\* (TokenBindingNotSupportedHandler `use`d by Manager.php)
#   * new PublicKeyCredentialLoader(...)->load()  (removed in favor of a serializer API)
# So the ONLY version that clears the gate fatally breaks passwordless WebAuthn login.
# The image smoke test (status.php + pre-install setup page + occ) would NOT catch this
# (it never instantiates the WebAuthn Manager), so shipping the 5.3.5 bump would pass the
# gate while silently shipping a broken auth subsystem -- not acceptable.
#
# Why BLOCKED (rule 5): the gate cannot be made 0-CVE on 34.0.1 without a webauthn-lib
# MAJOR bump that upstream's code is not written for. That is neither a legitimate
# same-major fix nor consistent with shipping the UNMODIFIED upstream release, and
# falsifying installed.json to claim 5.3.5 over the shipped 4.x code would mask a real
# runtime library (forbidden -- never weaken the gate). Unblock when a newer Nextcloud
# release migrates its core WebAuthn code to webauthn-lib 5.x (bundling >=5.3.5), or when
# a 4.9.x patch backporting the GHSA-gq4g-fpc9-vjfq fix is published upstream.
#
# nextcloud: the official upstream release tarball (nextcloud-<VER>.tar.bz2 from
# download.nextcloud.com) assembled into a hardened Wolfi php-fpm + nginx runtime.
# NOTHING is compiled -- the tarball is the finished application with its PHP
# dependencies (3rdparty/) and bundled apps already vendored; we fetch it
# sha256-pinned and lay it down under /var/www/html. Like adminer this is a
# prebuilt-asset fetch, so FROM_SOURCE stays unset.
#
# Newest-only: pinned to the latest upstream release (34.0.1). The download server
# publishes a nextcloud-<VER>.tar.bz2.sha256 alongside each release; the digest
# below is that published sha256sum.
#
# PHP major: Nextcloud 34 supports PHP 8.2-8.5 (lib/versioncheck.php bounds).
# PHP 8.3 is the common, upstream-recommended major and is what this is built +
# run against here.
