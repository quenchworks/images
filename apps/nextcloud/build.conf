# nextcloud: the official upstream release tarball (nextcloud-<VER>.tar.bz2 from
# download.nextcloud.com) assembled into a hardened Wolfi php-fpm + nginx runtime.
# NOTHING is compiled -- the tarball is the finished application with its PHP
# dependencies (3rdparty/) and bundled apps already vendored; we fetch it
# sha256-pinned and lay it down under /var/www/html. Like adminer this is a
# prebuilt-asset fetch, so FROM_SOURCE stays unset.
#
# Latest patch of the last 3 stable major lines (32, 33, 34). The download server
# publishes a nextcloud-<VER>.tar.bz2.sha256 alongside each release; the digests
# below are those published sha256sums.
#
# PHP major: Nextcloud 32 supports PHP 8.1-8.4, and 33/34 support PHP 8.2-8.5
# (lib/versioncheck.php bounds). PHP 8.3 is the common, upstream-recommended major
# across all three lines and is what every version is built + run against here.
VERSIONS=(32.0.12 33.0.6 34.0.1)
declare -A SHA256=(
  [32.0.12]=af158f72571c8e15e29bc136c23a921188ce1d566855000ad94f89b80a8f180c
  [33.0.6]=791821a55029944de04319cfcafcac4ae8e7ef56b4cd1efc2631bf30b79d16de
  [34.0.1]=04e9c32fc3fe39f6b6a8a18915ef5afd280a56b4a7f744e18f5fa2efffbc4a63
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
