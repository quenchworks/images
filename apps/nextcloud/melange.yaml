# Assembles Nextcloud Server for Wolfi from the OFFICIAL upstream release tarball.
#
# Nextcloud ships each release as nextcloud-<VER>.tar.bz2 on download.nextcloud.com:
# the complete, finished PHP application with its Composer dependencies (3rdparty/)
# and all bundled first-party apps (apps/) already vendored. There is NOTHING to
# compile -- we fetch the sha256-pinned tarball and lay the tree down under
# /var/www/html, then wire the runtime (php-fpm + nginx + supervisord + the PHP
# ini/pool overrides) from Wolfi packages. Clean-room: we do NOT inherit the
# upstream `nextcloud` Docker image or its Debian base -- the whole runtime is
# reconstructed from Wolfi (php-8.3 + FPM + extensions, QuenchWorks' own nginx,
# supervisor). AGPL-3.0-only (copyleft) -- see the license field below.
#
# LICENSE NOTE: Nextcloud Server is AGPL-3.0-only. This is a strong copyleft
# license (network-use == distribution). The image ships the unmodified upstream
# release; consumers who modify the source and offer it over a network must make
# their modified source available. Flagged in the catalog row (tier note).
package:
  name: quench-nextcloud
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Nextcloud Server (self-hosted content collaboration / file sync), php-fpm + nginx on Wolfi"
  copyright:
    - license: AGPL-3.0-only   # Nextcloud Server is GNU AGPL v3 (COPYING)
  dependencies:
    runtime:
      # PHP 8.3 runtime + FPM + the extension surface Nextcloud requires and
      # recommends (declared here so the package pulls them even if installed
      # directly; the same set is listed in apko.yaml for the final image).
      - php-8.3
      - php-8.3-config
      - php-8.3-fpm
      - php-8.3-fpm-config
      - php-8.3-opcache
      - php-8.3-opcache-config
      # --- required by Nextcloud ---
      - php-8.3-ctype
      - php-8.3-ctype-config
      - php-8.3-curl
      - php-8.3-curl-config
      - php-8.3-dom
      - php-8.3-dom-config
      - php-8.3-gd
      - php-8.3-gd-config
      - php-8.3-fileinfo
      - php-8.3-fileinfo-config
      - php-8.3-iconv
      - php-8.3-iconv-config
      - php-8.3-mbstring
      - php-8.3-mbstring-config
      - php-8.3-openssl
      - php-8.3-openssl-config
      - php-8.3-posix
      - php-8.3-posix-config
      - php-8.3-simplexml
      - php-8.3-simplexml-config
      - php-8.3-xml
      - php-8.3-xml-config
      - php-8.3-xmlreader
      - php-8.3-xmlreader-config
      - php-8.3-xmlwriter
      - php-8.3-xmlwriter-config
      - php-8.3-zip
      - php-8.3-zip-config
      - php-8.3-phar
      - php-8.3-phar-config
      # --- database drivers (chart picks one: MySQL/MariaDB, PostgreSQL, SQLite) ---
      - php-8.3-pdo
      - php-8.3-pdo-config
      - php-8.3-pdo_mysql
      - php-8.3-pdo_mysql-config
      - php-8.3-mysqli
      - php-8.3-mysqli-config
      - php-8.3-mysqlnd
      - php-8.3-mysqlnd-config
      - php-8.3-pdo_pgsql
      - php-8.3-pdo_pgsql-config
      - php-8.3-pgsql
      - php-8.3-pgsql-config
      - php-8.3-pdo_sqlite
      - php-8.3-pdo_sqlite-config
      # --- strongly recommended (perf, previews, caching, LDAP, occ jobs) ---
      - php-8.3-intl
      - php-8.3-intl-config
      - php-8.3-bcmath
      - php-8.3-bcmath-config
      - php-8.3-gmp
      - php-8.3-gmp-config
      - php-8.3-exif
      - php-8.3-exif-config
      - php-8.3-sodium
      - php-8.3-sodium-config
      - php-8.3-sockets
      - php-8.3-sockets-config
      - php-8.3-ftp
      - php-8.3-ftp-config
      - php-8.3-pcntl
      - php-8.3-pcntl-config
      - php-8.3-sysvsem
      - php-8.3-sysvsem-config
      - php-8.3-gettext
      - php-8.3-gettext-config
      - php-8.3-apcu           # local memory cache (memcache.local)
      - php-8.3-apcu-config
      - php-8.3-redis          # distributed cache + file locking (memcache.distributed/locking)
      - php-8.3-redis-config
      - php-8.3-imagick        # image previews / avatars
      - php-8.3-imagick-config
      - php-8.3-ldap           # LDAP / Active Directory user backend
      - php-8.3-ldap-config

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      # PHP CLI + composer for the build-time CVE port (composer same-major
      # bumps of the vendored 3rdparty/ + apps/notifications trees and the
      # webauthn-lib 4->5 source port; see the "CVE port" pipeline step).
      - composer
      - php-8.3
      - php-8.3-phar
      - php-8.3-openssl
      - php-8.3-curl
      - php-8.3-mbstring
      - php-8.3-zip
      - php-8.3-xml
      - php-8.3-xmlwriter
      - php-8.3-xmlreader
      - php-8.3-dom
      - php-8.3-ctype
      - php-8.3-iconv
      - php-8.3-simplexml
      - php-8.3-fileinfo
      - php-8.3-posix
      - php-8.3-sodium

pipeline:
  # The release asset is the finished application (vendored deps + bundled apps),
  # not a source archive. Fetch + verify the published sha256; melange's fetch
  # extracts the .tar.bz2 natively. The tarball's top dir is `nextcloud/`, so
  # keep it (strip-components: 0) and copy from there.
  - uses: fetch
    with:
      uri: https://download.nextcloud.com/server/releases/nextcloud-${{package.version}}.tar.bz2
      expected-sha256: __SHA256__
      strip-components: 0

  # ==========================================================================
  # CVE port (2026-07-10). Two parts:
  #
  # 1. Composer same-major bumps of the vendored PHP deps in BOTH trees:
  #      3rdparty/:  guzzle ^7.12.1, psr7 ^2.12.1, phpseclib ^2.0.55,
  #                  dom-crawler ^6.4.40, jmespath ^2.9.1, webauthn-lib 5.3.5
  #      apps/notifications/: web-token/jwt-library ^4.1.7, guzzle, psr7
  #    The notifications app executes MOZART-PREFIXED copies under lib/Vendor/
  #    (OCA\Notifications\Vendor\...), NOT vendor/ (which ships metadata only),
  #    so mozart is re-run to regenerate the runtime copies -- bumping only the
  #    scanner-visible vendor/composer metadata would game the gate.
  #
  # 2. webauthn-lib 4.9.1 -> 5.3.5 is a MAJOR with removed APIs that Nextcloud
  #    34 core uses (GHSA-gq4g-fpc9-vjfq has no 4.x fix; 4.x tops out at 4.9.3;
  #    upstream master still pins ^4.9.1 so there is no upstream diff to
  #    backport). The 5 core files referencing Webauthn\* are ported here:
  #      * PublicKeyCredentialLoader        -> WebauthnSerializerFactory serializer
  #      * TokenBinding\*                   -> removed upstream (deleted)
  #      * validator ctors                  -> CeremonyStepManagerFactory ceremonies
  #        (securedRelyingPartyId ['localhost'] moves onto the factory)
  #      * assertion check()                -> caller resolves the stored credential
  #        (repository callback removed) and persists the updated sign counter
  #        (4.x saved it via the repository from inside the validator)
  #      * createFromString/createFromArray/json_encode of options + sources
  #                                         -> serializer (de)serialization
  #      * PublicKeyCredentialSourceRepository interface -> removed (plain class)
  #    VERIFIED functionally before shipping (not just compile): a harness
  #    synthesized a real ES256 credential with webauthn-lib 4.9.3 (producing
  #    the exact oc_webauthn.data DB format of existing installs) and replayed
  #    this ported logic on 5.3.5 -- 4.x stored credentials deserialize, the
  #    registration + login ceremonies pass, the sign counter persists, a
  #    tampered signature is rejected, and the browser-facing options JSON
  #    keeps the same keys (23/23 checks).
  #
  # Modifying signed core files invalidates Nextcloud's code-integrity
  # signature, so the entrypoint seeds 'integrity.check.disabled' => true
  # (see the entrypoint step; trade-off documented there and in build.conf).
  # ==========================================================================
  - name: CVE port -- composer same-major bumps (3rdparty + notifications)
    runs: |
      set -eu
      export COMPOSER_ALLOW_SUPERUSER=1
      export COMPOSER_HOME=/tmp/composer-home
      export COMPOSER_NO_INTERACTION=1

      # --- 3rdparty/ (vendor-dir = the tree itself) --------------------------
      cd nextcloud/3rdparty
      composer require --no-scripts --update-with-all-dependencies \
        'web-auth/webauthn-lib:^5.3.5' \
        'guzzlehttp/guzzle:^7.12.1' \
        'guzzlehttp/psr7:^2.12.1' \
        'phpseclib/phpseclib:^2.0.55' \
        'symfony/dom-crawler:^6.4.40' \
        'symfony/serializer:^6.4.41' \
        'symfony/property-info:^6.4' \
        'symfony/property-access:^6.4' \
        'phpdocumentor/reflection-docblock:^5.3'
      composer update --no-scripts --with 'mtdowling/jmespath.php:^2.9.1' 'mtdowling/jmespath.php'
      # HARD GATE: zero known advisories may remain in the resolved set.
      composer audit
      # The new webauthn serializer stack must autoload from the bundled tree.
      php -r 'require "autoload.php";
        foreach (["Webauthn\\Denormalizer\\WebauthnSerializerFactory",
                  "Webauthn\\CeremonyStep\\CeremonyStepManagerFactory",
                  "Webauthn\\PublicKeyCredentialSource",
                  "Symfony\\Component\\Serializer\\Serializer",
                  "Symfony\\Component\\PropertyInfo\\Extractor\\PhpDocExtractor"] as $c) {
          if (!class_exists($c)) { fwrite(STDERR, "missing: $c\n"); exit(1); }
        }'
      cd ..

      # --- apps/notifications (mozart-prefixed runtime copies) ---------------
      cd apps/notifications
      composer update --no-dev --no-scripts --no-plugins --with-all-dependencies \
        --with 'web-token/jwt-library:^4.1.7' \
        --with 'guzzlehttp/guzzle:^7.12.1' \
        --with 'guzzlehttp/psr7:^2.12.1' \
        web-token/jwt-library guzzlehttp/guzzle guzzlehttp/psr7 guzzlehttp/promises
      # Re-run mozart so the EXECUTED lib/Vendor/ (OCA\Notifications\Vendor\...)
      # copies pick up the fixed code, exactly like upstream's post-update-cmd
      # (vendor-bin is not shipped in the release, so install mozart directly).
      composer global require 'coenjacobs/mozart:^1.2.3'
      "$COMPOSER_HOME/vendor/bin/mozart" compose
      composer dump-autoload --no-dev --no-scripts --no-plugins
      composer audit
      # The release ships vendor/ as metadata only (composer/ + autoload.php);
      # the packages live solely in lib/Vendor/. Restore that layout.
      find vendor -mindepth 1 -maxdepth 1 ! -name composer ! -name autoload.php -exec rm -rf {} +
      # Prefixed runtime classes must resolve after the re-compose.
      php -r 'spl_autoload_register(function ($c) {
          $p = "lib/" . str_replace(["OCA\\Notifications\\", "\\"], ["", "/"], $c) . ".php";
          if (file_exists($p)) { require $p; }
        });
        foreach (["OCA\\Notifications\\Vendor\\Minishlink\\WebPush\\WebPush",
                  "OCA\\Notifications\\Vendor\\Jose\\Component\\Core\\JWK",
                  "OCA\\Notifications\\Vendor\\GuzzleHttp\\Client"] as $c) {
          if (!class_exists($c)) { fwrite(STDERR, "missing prefixed: $c\n"); exit(1); }
        }'
      cd ../../..

  - name: CVE port -- webauthn-lib 4->5 source port of the 5 core consumers
    runs: |
      set -eu
      cd nextcloud

      # ---- lib/private/Authentication/WebAuthn/Manager.php -------------------
      # Full replacement: startRegistration/startAuthentication bodies are
      # upstream-identical; finishRegister/finishAuthentication are ported to
      # the 5.x ceremony API; serialization helpers are added for the
      # controllers (5.x removed jsonSerialize/createFromString/createFromArray).
      cat > lib/private/Authentication/WebAuthn/Manager.php <<'NCEOF'
      <?php

      declare(strict_types=1);

      /**
       * SPDX-FileCopyrightText: 2020 Nextcloud GmbH and Nextcloud contributors
       * SPDX-License-Identifier: AGPL-3.0-or-later
       */
      namespace OC\Authentication\WebAuthn;

      use Cose\Algorithm\Signature\ECDSA\ES256;
      use Cose\Algorithm\Signature\RSA\RS256;
      use Cose\Algorithms;
      use GuzzleHttp\Psr7\ServerRequest;
      use OC\Authentication\WebAuthn\Db\PublicKeyCredentialEntity;
      use OC\Authentication\WebAuthn\Db\PublicKeyCredentialMapper;
      use OCP\AppFramework\Db\DoesNotExistException;
      use OCP\IConfig;
      use OCP\IUser;
      use Psr\Log\LoggerInterface;
      use Symfony\Component\Serializer\SerializerInterface;
      use Webauthn\AttestationStatement\AttestationStatementSupportManager;
      use Webauthn\AttestationStatement\NoneAttestationStatementSupport;
      use Webauthn\AuthenticatorAssertionResponse;
      use Webauthn\AuthenticatorAssertionResponseValidator;
      use Webauthn\AuthenticatorAttestationResponse;
      use Webauthn\AuthenticatorAttestationResponseValidator;
      use Webauthn\AuthenticatorSelectionCriteria;
      use Webauthn\CeremonyStep\CeremonyStepManagerFactory;
      use Webauthn\Denormalizer\WebauthnSerializerFactory;
      use Webauthn\PublicKeyCredential;
      use Webauthn\PublicKeyCredentialCreationOptions;
      use Webauthn\PublicKeyCredentialDescriptor;
      use Webauthn\PublicKeyCredentialParameters;
      use Webauthn\PublicKeyCredentialRequestOptions;
      use Webauthn\PublicKeyCredentialRpEntity;
      use Webauthn\PublicKeyCredentialSource;
      use Webauthn\PublicKeyCredentialUserEntity;

      /**
       * QuenchWorks build-time port of the upstream Manager to webauthn-lib 5.x
       * (the bundled 4.9.1 has GHSA-gq4g-fpc9-vjfq with no 4.x fix). Ceremony
       * behaviour is unchanged: 'none' attestation only, ES256 + RS256, the
       * host taken from the request, ['localhost'] as the secured RP id, and
       * the updated signature counter persisted after every login (4.x did the
       * same through the repository callback from inside the validator).
       */
      class Manager {
      	public function __construct(
      		private CredentialRepository $repository,
      		private PublicKeyCredentialMapper $credentialMapper,
      		private LoggerInterface $logger,
      		private IConfig $config,
      	) {
      	}

      	public function startRegistration(IUser $user, string $serverHost): PublicKeyCredentialCreationOptions {
      		$rpEntity = new PublicKeyCredentialRpEntity(
      			'Nextcloud', //Name
      			$this->stripPort($serverHost),  //ID
      			null                            //Icon
      		);

      		$userEntity = new PublicKeyCredentialUserEntity(
      			$user->getUID(),                             // Name
      			$user->getUID(),                             // ID
      			$user->getDisplayName()                      // Display name
      		);

      		$challenge = random_bytes(32);

      		$publicKeyCredentialParametersList = [
      			new PublicKeyCredentialParameters('public-key', Algorithms::COSE_ALGORITHM_ES256),
      			new PublicKeyCredentialParameters('public-key', Algorithms::COSE_ALGORITHM_RS256),
      		];

      		$timeout = 60000;

      		$excludedPublicKeyDescriptors = [
      		];

      		$authenticatorSelectionCriteria = new AuthenticatorSelectionCriteria(
      			AuthenticatorSelectionCriteria::AUTHENTICATOR_ATTACHMENT_NO_PREFERENCE,
      			AuthenticatorSelectionCriteria::USER_VERIFICATION_REQUIREMENT_PREFERRED,
      		);

      		return new PublicKeyCredentialCreationOptions(
      			$rpEntity,
      			$userEntity,
      			$challenge,
      			$publicKeyCredentialParametersList,
      			$authenticatorSelectionCriteria,
      			PublicKeyCredentialCreationOptions::ATTESTATION_CONVEYANCE_PREFERENCE_NONE,
      			$excludedPublicKeyDescriptors,
      			$timeout,
      		);
      	}

      	public function finishRegister(PublicKeyCredentialCreationOptions $publicKeyCredentialCreationOptions, string $name, string $data): PublicKeyCredentialEntity {
      		$csmFactory = new CeremonyStepManagerFactory();
      		$csmFactory->setAttestationStatementSupportManager($this->attestationStatementSupportManager());
      		$csmFactory->setSecuredRelyingPartyId(['localhost']);

      		$authenticatorAttestationResponseValidator = new AuthenticatorAttestationResponseValidator(
      			$csmFactory->creationCeremony(),
      		);
      		$authenticatorAttestationResponseValidator->setLogger($this->logger);

      		try {
      			// Load the data (5.x replaced the 4.x loader class with the serializer)
      			$publicKeyCredential = $this->serializer()->deserialize($data, PublicKeyCredential::class, 'json');
      			$response = $publicKeyCredential->response;

      			// Check if the response is an Authenticator Attestation Response
      			if (!$response instanceof AuthenticatorAttestationResponse) {
      				throw new \RuntimeException('Not an authenticator attestation response');
      			}

      			// Check the response against the request (5.x takes the host string
      			// instead of the PSR-7 request; same source: the Host header)
      			$request = ServerRequest::fromGlobals();

      			$credentialRecord = $authenticatorAttestationResponseValidator->check(
      				$response,
      				$publicKeyCredentialCreationOptions,
      				$request->getUri()->getHost(),
      			);
      			$publicKeyCredentialSource = PublicKeyCredentialSource::fromCredentialRecord($credentialRecord);
      		} catch (\Throwable $exception) {
      			throw $exception;
      		}

      		// Persist the data
      		$userVerification = $response->attestationObject->authData->isUserVerified();
      		return $this->repository->saveAndReturnCredentialSource($publicKeyCredentialSource, $name, $userVerification);
      	}

      	private function stripPort(string $serverHost): string {
      		return preg_replace('/(:\d+$)/', '', $serverHost);
      	}

      	public function startAuthentication(string $uid, string $serverHost): PublicKeyCredentialRequestOptions {
      		// List of registered PublicKeyCredentialDescriptor classes associated to the user
      		$userVerificationRequirement = AuthenticatorSelectionCriteria::USER_VERIFICATION_REQUIREMENT_REQUIRED;
      		$registeredPublicKeyCredentialDescriptors = array_map(function (PublicKeyCredentialEntity $entity) use (&$userVerificationRequirement) {
      			if ($entity->getUserVerification() !== true) {
      				$userVerificationRequirement = AuthenticatorSelectionCriteria::USER_VERIFICATION_REQUIREMENT_DISCOURAGED;
      			}
      			$credential = $entity->toPublicKeyCredentialSource();
      			return new PublicKeyCredentialDescriptor(
      				$credential->type,
      				$credential->publicKeyCredentialId,
      			);
      		}, $this->credentialMapper->findAllForUid($uid));

      		// Public Key Credential Request Options
      		return new PublicKeyCredentialRequestOptions(
      			random_bytes(32),                                                          // Challenge
      			$this->stripPort($serverHost),                                             // Relying Party ID
      			$registeredPublicKeyCredentialDescriptors,                                 // Registered PublicKeyCredentialDescriptor classes
      			$userVerificationRequirement,
      			60000,                                                                     // Timeout
      		);
      	}

      	public function finishAuthentication(PublicKeyCredentialRequestOptions $publicKeyCredentialRequestOptions, string $data, string $uid) {
      		$algorithmManager = new \Cose\Algorithm\Manager();
      		$algorithmManager->add(new ES256());
      		$algorithmManager->add(new RS256());

      		$csmFactory = new CeremonyStepManagerFactory();
      		$csmFactory->setAttestationStatementSupportManager($this->attestationStatementSupportManager());
      		$csmFactory->setAlgorithmManager($algorithmManager);
      		$csmFactory->setSecuredRelyingPartyId(['localhost']);

      		$authenticatorAssertionResponseValidator = new AuthenticatorAssertionResponseValidator(
      			$csmFactory->requestCeremony(),
      		);
      		$authenticatorAssertionResponseValidator->setLogger($this->logger);

      		try {
      			$this->logger->debug('Loading publickey credentials from: ' . $data);

      			// Load the data
      			$publicKeyCredential = $this->serializer()->deserialize($data, PublicKeyCredential::class, 'json');
      			$response = $publicKeyCredential->response;

      			// Check if the response is an Authenticator Assertion Response
      			if (!$response instanceof AuthenticatorAssertionResponse) {
      				throw new \RuntimeException('Not an authenticator assertion response');
      			}

      			// 5.x dropped the repository callback; resolve the stored
      			// credential ourselves (rawId is the binary credential id).
      			$publicKeyCredentialSource = $this->repository->findOneByCredentialId($publicKeyCredential->rawId);
      			if ($publicKeyCredentialSource === null) {
      				throw new \RuntimeException('Unknown WebAuthn credential');
      			}

      			// Check the response against the request
      			$request = ServerRequest::fromGlobals();

      			$checkedRecord = $authenticatorAssertionResponseValidator->check(
      				$publicKeyCredentialSource,
      				$response,
      				$publicKeyCredentialRequestOptions,
      				$request->getUri()->getHost(),
      				$uid,
      			);

      			// 4.x persisted the updated signature counter through the
      			// repository from inside the validator; 5.x leaves it to us.
      			$this->repository->saveCredentialSource(PublicKeyCredentialSource::fromCredentialRecord($checkedRecord));
      		} catch (\Throwable $e) {
      			throw $e;
      		}

      		return true;
      	}

      	public function deleteRegistration(IUser $user, int $id): void {
      		try {
      			$entry = $this->credentialMapper->findById($user->getUID(), $id);
      		} catch (DoesNotExistException $e) {
      			$this->logger->warning("WebAuthn device $id does not exist, can't delete it");
      			return;
      		}

      		$this->credentialMapper->delete($entry);
      	}

      	public function isWebAuthnAvailable(): bool {
      		if (!$this->config->getSystemValueBool('auth.webauthn.enabled', true)) {
      			return false;
      		}

      		return true;
      	}

      	// --- serialization helpers for the controllers (5.x removed the
      	// json round-trip the 4.x options/session code relied on) -----------

      	public function serializeCreationOptions(PublicKeyCredentialCreationOptions $options): string {
      		return $this->serializer()->serialize($options, 'json');
      	}

      	public function deserializeCreationOptions(string $json): PublicKeyCredentialCreationOptions {
      		return $this->serializer()->deserialize($json, PublicKeyCredentialCreationOptions::class, 'json');
      	}

      	public function serializeRequestOptions(PublicKeyCredentialRequestOptions $options): string {
      		return $this->serializer()->serialize($options, 'json');
      	}

      	public function deserializeRequestOptions(string $json): PublicKeyCredentialRequestOptions {
      		return $this->serializer()->deserialize($json, PublicKeyCredentialRequestOptions::class, 'json');
      	}

      	private function attestationStatementSupportManager(): AttestationStatementSupportManager {
      		$attestationStatementSupportManager = new AttestationStatementSupportManager();
      		$attestationStatementSupportManager->add(new NoneAttestationStatementSupport());
      		return $attestationStatementSupportManager;
      	}

      	private function serializer(): SerializerInterface {
      		return (new WebauthnSerializerFactory($this->attestationStatementSupportManager()))->create();
      	}
      }
      NCEOF

      # ---- lib/private/Authentication/WebAuthn/CredentialRepository.php ------
      # 5.x removed the Webauthn\PublicKeyCredentialSourceRepository interface;
      # the class keeps its exact methods (Manager + Entity still call them)
      # but no longer implements anything (so the #[\Override] attributes go
      # too -- they would be a PHP 8.3 compile error without a parent).
      cat > lib/private/Authentication/WebAuthn/CredentialRepository.php <<'NCEOF'
      <?php

      declare(strict_types=1);

      /**
       * SPDX-FileCopyrightText: 2020 Nextcloud GmbH and Nextcloud contributors
       * SPDX-License-Identifier: AGPL-3.0-or-later
       */
      namespace OC\Authentication\WebAuthn;

      use OC\Authentication\WebAuthn\Db\PublicKeyCredentialEntity;
      use OC\Authentication\WebAuthn\Db\PublicKeyCredentialMapper;
      use OCP\AppFramework\Db\IMapperException;
      use Webauthn\PublicKeyCredentialSource;
      use Webauthn\PublicKeyCredentialUserEntity;

      class CredentialRepository {
      	public function __construct(
      		private PublicKeyCredentialMapper $credentialMapper,
      	) {
      	}

      	public function findOneByCredentialId(string $publicKeyCredentialId): ?PublicKeyCredentialSource {
      		try {
      			$entity = $this->credentialMapper->findOneByCredentialId($publicKeyCredentialId);
      			return $entity->toPublicKeyCredentialSource();
      		} catch (IMapperException $e) {
      			return  null;
      		}
      	}

      	/**
      	 * @return PublicKeyCredentialSource[]
      	 */
      	public function findAllForUserEntity(PublicKeyCredentialUserEntity $publicKeyCredentialUserEntity): array {
      		$uid = $publicKeyCredentialUserEntity->id;
      		$entities = $this->credentialMapper->findAllForUid($uid);

      		return array_map(function (PublicKeyCredentialEntity $entity) {
      			return $entity->toPublicKeyCredentialSource();
      		}, $entities);
      	}

      	public function saveAndReturnCredentialSource(PublicKeyCredentialSource $publicKeyCredentialSource, ?string $name = null, bool $userVerification = false): PublicKeyCredentialEntity {
      		$oldEntity = null;

      		try {
      			$oldEntity = $this->credentialMapper->findOneByCredentialId($publicKeyCredentialSource->publicKeyCredentialId);
      		} catch (IMapperException $e) {
      		}

      		$defaultName = false;
      		if ($name === null) {
      			$defaultName = true;
      			$name = 'default';
      		}

      		$entity = PublicKeyCredentialEntity::fromPublicKeyCrendentialSource($name, $publicKeyCredentialSource, $userVerification);

      		if ($oldEntity) {
      			$entity->setId($oldEntity->getId());
      			if ($defaultName) {
      				$entity->setName($oldEntity->getName());
      			}

      			// Don't downgrade UV just because it was skipped during a login due to another key
      			if ($oldEntity->getUserVerification()) {
      				$entity->setUserVerification(true);
      			}
      		}

      		return $this->credentialMapper->insertOrUpdate($entity);
      	}

      	public function saveCredentialSource(PublicKeyCredentialSource $publicKeyCredentialSource, ?string $name = null): void {
      		$this->saveAndReturnCredentialSource($publicKeyCredentialSource, $name);
      	}
      }
      NCEOF

      # ---- lib/private/Authentication/WebAuthn/Db/PublicKeyCredentialEntity.php
      # 5.x removed PublicKeyCredentialSource::createFromArray + jsonSerialize
      # and the getUserHandle/getPublicKeyCredentialId getters (public readonly
      # properties now). Persistence goes through the webauthn serializer; the
      # 5.x denormalizer reads the 4.x json_encode format, so EXISTING
      # oc_webauthn rows keep working (fixture-verified).
      cat > lib/private/Authentication/WebAuthn/Db/PublicKeyCredentialEntity.php <<'NCEOF'
      <?php

      declare(strict_types=1);

      /**
       * SPDX-FileCopyrightText: 2020 Nextcloud GmbH and Nextcloud contributors
       * SPDX-License-Identifier: AGPL-3.0-or-later
       */
      namespace OC\Authentication\WebAuthn\Db;

      use JsonSerializable;
      use OCP\AppFramework\Db\Entity;
      use Symfony\Component\Serializer\SerializerInterface;
      use Webauthn\AttestationStatement\AttestationStatementSupportManager;
      use Webauthn\AttestationStatement\NoneAttestationStatementSupport;
      use Webauthn\Denormalizer\WebauthnSerializerFactory;
      use Webauthn\PublicKeyCredentialSource;

      /**
       * @since 19.0.0
       *
       * @method string getUid();
       * @method void setUid(string $uid)
       * @method string getName();
       * @method void setName(string $name);
       * @method string getPublicKeyCredentialId();
       * @method void setPublicKeyCredentialId(string $id);
       * @method string getData();
       * @method void setData(string $data);
       *
       * @since 30.0.0 Add userVerification attribute
       * @method bool|null getUserVerification();
       * @method void setUserVerification(bool $userVerification);
       */
      class PublicKeyCredentialEntity extends Entity implements JsonSerializable {
      	/** @var string */
      	protected $name;

      	/** @var string */
      	protected $uid;

      	/** @var string */
      	protected $publicKeyCredentialId;

      	/** @var string */
      	protected $data;

      	/** @var bool|null */
      	protected $userVerification;

      	public function __construct() {
      		$this->addType('name', 'string');
      		$this->addType('uid', 'string');
      		$this->addType('publicKeyCredentialId', 'string');
      		$this->addType('data', 'string');
      		$this->addType('userVerification', 'boolean');
      	}

      	public static function fromPublicKeyCrendentialSource(string $name, PublicKeyCredentialSource $publicKeyCredentialSource, bool $userVerification): PublicKeyCredentialEntity {
      		$publicKeyCredentialEntity = new self();

      		$publicKeyCredentialEntity->setName($name);
      		$publicKeyCredentialEntity->setUid($publicKeyCredentialSource->userHandle);
      		$publicKeyCredentialEntity->setPublicKeyCredentialId(base64_encode($publicKeyCredentialSource->publicKeyCredentialId));
      		$publicKeyCredentialEntity->setData(self::serializer()->serialize($publicKeyCredentialSource, 'json'));
      		$publicKeyCredentialEntity->setUserVerification($userVerification);

      		return $publicKeyCredentialEntity;
      	}

      	public function toPublicKeyCredentialSource(): PublicKeyCredentialSource {
      		// The 5.x serializer accepts both the legacy 4.x json_encode format
      		// and its own output, but returns a CredentialRecord -- bridge it
      		// back to the (deprecated but still shipped) source subclass.
      		return PublicKeyCredentialSource::fromCredentialRecord(
      			self::serializer()->deserialize($this->getData(), PublicKeyCredentialSource::class, 'json')
      		);
      	}

      	/**
      	 * @inheritDoc
      	 */
      	#[\Override]
      	public function jsonSerialize(): array {
      		return [
      			'id' => $this->getId(),
      			'name' => $this->getName(),
      		];
      	}

      	private static function serializer(): SerializerInterface {
      		$attestationStatementSupportManager = new AttestationStatementSupportManager();
      		$attestationStatementSupportManager->add(new NoneAttestationStatementSupport());
      		return (new WebauthnSerializerFactory($attestationStatementSupportManager))->create();
      	}
      }
      NCEOF

      # ---- controllers: options (de)serialization now goes via the Manager ---
      # core/Controller/WebAuthnController.php (login flow)
      sed -i \
        -e 's|$this->session->set(self::WEBAUTHN_LOGIN, json_encode($publicKeyCredentialRequestOptions));|$this->session->set(self::WEBAUTHN_LOGIN, $this->webAuthnManger->serializeRequestOptions($publicKeyCredentialRequestOptions));|' \
        -e 's|return new JSONResponse($publicKeyCredentialRequestOptions);|return new JSONResponse(json_decode($this->webAuthnManger->serializeRequestOptions($publicKeyCredentialRequestOptions), true));|' \
        -e 's|$publicKeyCredentialRequestOptions = PublicKeyCredentialRequestOptions::createFromString($this->session->get(self::WEBAUTHN_LOGIN));|$publicKeyCredentialRequestOptions = $this->webAuthnManger->deserializeRequestOptions($this->session->get(self::WEBAUTHN_LOGIN));|' \
        core/Controller/WebAuthnController.php
      grep -q 'serializeRequestOptions' core/Controller/WebAuthnController.php
      grep -q 'deserializeRequestOptions' core/Controller/WebAuthnController.php
      if grep -q 'createFromString' core/Controller/WebAuthnController.php; then echo "core controller port incomplete"; exit 1; fi

      # apps/settings/lib/Controller/WebAuthnController.php (registration flow)
      # (4.x stored the OPTIONS OBJECT in the session and relied on the removed
      # jsonSerialize/createFromArray round-trip; store the serializer JSON.)
      sed -i \
        -e 's|$this->session->set(self::WEBAUTHN_REGISTRATION, $credentialOptions);|$this->session->set(self::WEBAUTHN_REGISTRATION, $this->manager->serializeCreationOptions($credentialOptions));|' \
        -e 's|return new JSONResponse($credentialOptions);|return new JSONResponse(json_decode($this->manager->serializeCreationOptions($credentialOptions), true));|' \
        -e 's|$publicKeyCredentialCreationOptions = PublicKeyCredentialCreationOptions::createFromArray($this->session->get(self::WEBAUTHN_REGISTRATION));|$publicKeyCredentialCreationOptions = $this->manager->deserializeCreationOptions($this->session->get(self::WEBAUTHN_REGISTRATION));|' \
        apps/settings/lib/Controller/WebAuthnController.php
      grep -q 'serializeCreationOptions' apps/settings/lib/Controller/WebAuthnController.php
      if grep -q 'createFromArray' apps/settings/lib/Controller/WebAuthnController.php; then echo "settings controller port incomplete"; exit 1; fi

      # ---- gate: lint + no removed 4.x-only API may remain --------------------
      for f in lib/private/Authentication/WebAuthn/Manager.php \
               lib/private/Authentication/WebAuthn/CredentialRepository.php \
               lib/private/Authentication/WebAuthn/Db/PublicKeyCredentialEntity.php \
               core/Controller/WebAuthnController.php \
               apps/settings/lib/Controller/WebAuthnController.php; do
        php -l "$f"
        for sym in 'PublicKeyCredentialLoader' 'TokenBinding' 'PublicKeyCredentialSourceRepository' \
                   'createFromArray' 'createFromString' '->getUserHandle()' '->getPublicKeyCredentialId()'; do
          if grep -qF -- "$sym" "$f"; then echo "removed 4.x API '$sym' still referenced in $f"; exit 1; fi
        done
      done
      # The ported classes must actually load against the updated 3rdparty tree
      # (catches signature drift between the port and webauthn-lib 5.x).
      php -r 'require "3rdparty/autoload.php";
        require "lib/private/Authentication/WebAuthn/CredentialRepository.php";
        foreach (["OC\\Authentication\\WebAuthn\\CredentialRepository"] as $c) {
          if (!class_exists($c, false)) { fwrite(STDERR, "port class missing: $c\n"); exit(1); }
        }'

  - name: Lay the release tree down under /var/www/html
    runs: |
      set -eu
      destdir="${{targets.destdir}}"
      app="$destdir/var/www/html"
      install -d -m 0755 "$app"

      test -f nextcloud/version.php
      test -f nextcloud/occ
      test -f nextcloud/status.php

      # Lay the finished application tree down as the docroot. cp -a preserves the
      # bundled apps/, 3rdparty/, core/, lib/, etc.
      cp -a nextcloud/. "$app/"

      # Writable carve-outs (mounted as tmpfs/emptyDir/PVC on the read-only rootfs
      # at runtime; created here so they exist and are owned correctly). data/ holds
      # user files, config/ holds config.php, custom_apps/ is the writable app dir
      # (Nextcloud's standard split: bundled apps/ stays read-only/immutable).
      install -d -m 0770 "$app/data"
      install -d -m 0770 "$app/config"
      install -d -m 0755 "$app/custom_apps"

      # occ is executed as `php occ`; strip any exec bit (it is invoked via php).
      chmod 0644 "$app/occ" || true

  - name: Install the nginx site config (front controller -> php-fpm on :9000, listen :8080)
    runs: |
      set -eu
      destdir="${{targets.destdir}}"
      install -d "$destdir/etc/nginx/conf.d"
      # Ported from Nextcloud's documented nginx configuration, adapted for the
      # QuenchWorks nginx layout (included from quench-nginx's nginx.conf via
      # /etc/nginx/conf.d/*.conf). `listen 8080 default_server` makes this the
      # default vhost (overriding quench-nginx's placeholder server on 8080 --
      # nginx only errors on a DUPLICATE explicit default, not on shadowing an
      # implicit one). FastCGI-passes .php to php-fpm on 127.0.0.1:9000.
      cat > "$destdir/etc/nginx/conf.d/nextcloud.conf" <<'EOF'
      upstream php-handler {
          server 127.0.0.1:9000;
      }

      server {
          listen 8080 default_server;
          listen [::]:8080 default_server;
          server_name _;

          root /var/www/html;
          index index.php index.html /index.php$request_uri;

          # Large uploads (sync clients, big files). Chart can raise/lower.
          client_max_body_size 10G;
          client_body_timeout 3600s;
          client_body_buffer_size 512k;
          fastcgi_buffers 64 4K;

          # Security response headers (Nextcloud admin recommendations).
          add_header Referrer-Policy                   "no-referrer"       always;
          add_header X-Content-Type-Options            "nosniff"           always;
          add_header X-Frame-Options                   "SAMEORIGIN"        always;
          add_header X-Permitted-Cross-Domain-Policies "none"              always;
          add_header X-Robots-Tag                       "noindex, nofollow" always;
          add_header X-XSS-Protection                  "1; mode=block"     always;
          fastcgi_hide_header X-Powered-By;

          # Service discovery for CalDAV / CardDAV / webfinger / nodeinfo.
          location = /.well-known/carddav { return 301 /remote.php/dav/; }
          location = /.well-known/caldav  { return 301 /remote.php/dav/; }
          location = /.well-known/webfinger { return 301 /index.php/.well-known/webfinger; }
          location = /.well-known/nodeinfo  { return 301 /index.php/.well-known/nodeinfo; }
          location ^~ /.well-known/acme-challenge  { try_files $uri $uri/ =404; }
          location ^~ /.well-known/pki-validation  { try_files $uri $uri/ =404; }
          location  /.well-known { return 301 /index.php$request_uri; }

          # Never serve these paths (source, config, data, dotfiles, tooling).
          location ~ ^/(?:build|tests|config|lib|3rdparty|templates|data)(?:$|/)   { return 404; }
          location ~ ^/(?:\.|autotest|occ|issue|indie|db_|console)                 { return 404; }

          # Front controller.
          location / {
              try_files $uri $uri/ /index.php$request_uri;
          }

          location ~ \.php(?:$|/) {
              fastcgi_split_path_info ^(.+?\.php)(/.*)$;
              set $path_info $fastcgi_path_info;
              try_files $fastcgi_script_name =404;
              include fastcgi_params;
              fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
              fastcgi_param PATH_INFO $path_info;
              fastcgi_param HTTPS $https if_not_empty;
              fastcgi_param modHeadersAvailable true;
              fastcgi_param front_controller_active true;
              fastcgi_pass php-handler;
              fastcgi_intercept_errors on;
              fastcgi_request_buffering off;
              fastcgi_max_temp_file_size 0;
              fastcgi_read_timeout 3600s;
          }

          # Static assets straight from disk, fall back to the front controller.
          location ~ \.(?:css|js|mjs|svg|gif|png|jpg|jpeg|ico|wasm|tflite|map|ogg|flac|woff2?)$ {
              try_files $uri /index.php$request_uri;
              access_log off;
              expires 6M;
          }
      }
      EOF

  - name: Install php-fpm pool + php.ini overrides (nonroot, read-only rootfs)
    runs: |
      set -eu
      destdir="${{targets.destdir}}"
      install -d "$destdir/etc/php/php-fpm.d"
      install -d "$destdir/etc/php/conf.d"

      # Pool override (sorts after the Wolfi default www.conf; [www] directives
      # merge). php-fpm runs as the nonroot runtime uid -- the default pool's
      # user/group directives are IGNORED by FPM when it is not started as root,
      # so workers run as uid 1001. We only need to pin the listen socket, keep
      # the env, and log to stderr (supervisord captures it).
      cat > "$destdir/etc/php/php-fpm.d/zzz-nextcloud.conf" <<'EOF'
      [global]
      daemonize = no
      error_log = /proc/self/fd/2

      [www]
      listen = 127.0.0.1:9000
      catch_workers_output = yes
      decorate_workers_output = no
      clear_env = no
      access.log = /proc/self/fd/2
      pm = dynamic
      pm.max_children = 32
      pm.start_servers = 4
      pm.min_spare_servers = 2
      pm.max_spare_servers = 8
      ; Nextcloud shells out (occ, previews) and needs a sane PATH in the workers.
      env[PATH] = /usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin
      EOF

      # PHP settings tuned to Nextcloud's admin recommendations (memory, opcache
      # with a large interned-strings buffer + JIT, big uploads, apcu on CLI so
      # occ uses the local cache). Errors to stderr for container logging.
      cat > "$destdir/etc/php/conf.d/zzz-nextcloud.ini" <<'EOF'
      memory_limit = 512M
      upload_max_filesize = 10G
      post_max_size = 10G
      max_execution_time = 3600
      max_input_time = 3600
      max_file_uploads = 100
      output_buffering = 0
      display_errors = Off
      log_errors = On
      error_log = /proc/self/fd/2
      expose_php = Off
      date.timezone = UTC

      opcache.enable = 1
      opcache.enable_cli = 1
      opcache.interned_strings_buffer = 16
      opcache.max_accelerated_files = 10000
      opcache.memory_consumption = 128
      opcache.save_comments = 1
      opcache.revalidate_freq = 60
      opcache.jit = 1255
      opcache.jit_buffer_size = 128M

      apc.enable_cli = 1
      EOF

  - name: Install the supervisord configuration (php-fpm + nginx)
    runs: |
      set -eu
      destdir="${{targets.destdir}}"
      install -d "$destdir/etc/supervisor.d"
      install -d "$destdir/etc/nextcloud"

      # Main supervisord config at /etc/nextcloud/supervisord.conf (NOT
      # /etc/supervisord.conf -- that path is owned by the Wolfi supervisor-config
      # package and would collide in apko's solve). Nonroot-friendly: pid + sock
      # under /tmp (writable tmpfs), logs to stdout.
      cat > "$destdir/etc/nextcloud/supervisord.conf" <<'EOF'
      [supervisord]
      nodaemon=true
      user=nextcloud
      logfile=/dev/stdout
      logfile_maxbytes=0
      pidfile=/tmp/supervisord.pid

      [unix_http_server]
      file=/tmp/supervisor.sock

      [supervisorctl]
      serverurl=unix:///tmp/supervisor.sock

      [rpcinterface:supervisor]
      supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

      [include]
      files = /etc/supervisor.d/*.conf
      EOF

      cat > "$destdir/etc/supervisor.d/php-fpm.conf" <<'EOF'
      [program:php-fpm]
      command=/usr/bin/php-fpm --nodaemonize --fpm-config /etc/php/php-fpm.conf
      autostart=true
      autorestart=true
      priority=10
      stdout_logfile=/dev/stdout
      stdout_logfile_maxbytes=0
      stderr_logfile=/dev/stderr
      stderr_logfile_maxbytes=0
      EOF

      cat > "$destdir/etc/supervisor.d/nginx.conf" <<'EOF'
      [program:nginx]
      command=/usr/bin/nginx -g "daemon off;"
      autostart=true
      autorestart=true
      priority=20
      stdout_logfile=/dev/stdout
      stdout_logfile_maxbytes=0
      stderr_logfile=/dev/stderr
      stderr_logfile_maxbytes=0
      EOF

  - name: Install the container entrypoint
    runs: |
      set -eu
      destdir="${{targets.destdir}}"
      install -d "$destdir/usr/bin"
      cat > "$destdir/usr/bin/nextcloud-entrypoint.sh" <<'EOF'
      #!/bin/sh
      set -eu
      # Recreate the writable carve-outs on every boot (data/config/custom_apps are
      # emptyDir/PVC/tmpfs on a read-only rootfs; /tmp holds the supervisor + nginx
      # + php runtime scratch). Idempotent.
      mkdir -p /var/www/html/data \
               /var/www/html/config \
               /var/www/html/custom_apps \
               /tmp 2>/dev/null || true

      # Seed an apps_paths config so the writable custom_apps/ dir is used for
      # app installs/updates while the bundled apps/ stays read-only/immutable
      # (a security win on a read-only rootfs). Only written if the operator has
      # not supplied their own apps config yet -- config/ is a mount, so a real
      # config.php (from the chart/installer) always takes precedence.
      if [ ! -e /var/www/html/config/apps.config.php ]; then
        cat > /var/www/html/config/apps.config.php <<'PHP' 2>/dev/null || true
      <?php
      $CONFIG = array (
        'apps_paths' => array (
          array ( 'path' => '/var/www/html/apps',        'url' => '/apps',        'writable' => false ),
          array ( 'path' => '/var/www/html/custom_apps', 'url' => '/custom_apps', 'writable' => true ),
        ),
      );
      PHP
      fi

      # TRADE-OFF (documented in build.conf): this image ships a CVE-ported
      # tree (composer bumps in 3rdparty/ + apps/notifications, webauthn-lib
      # 4->5 source port), so Nextcloud's code-integrity signature (signed by
      # Nextcloud GmbH's release key) no longer matches and CANNOT be
      # regenerated without their private key. Disable the built-in integrity
      # checker; supply-chain integrity is provided at the image layer instead
      # (cosign signature + SBOM + SLSA provenance on the OCI artifact, plus
      # the read-only rootfs at runtime). Operators can override via their own
      # config.php (config/ is a mount; this seed only applies when absent).
      if [ ! -e /var/www/html/config/integrity.config.php ]; then
        cat > /var/www/html/config/integrity.config.php <<'PHP' 2>/dev/null || true
      <?php
      $CONFIG = array (
        'integrity.check.disabled' => true,
      );
      PHP
      fi

      exec supervisord -c /etc/nextcloud/supervisord.conf
      EOF
      chmod 0755 "$destdir/usr/bin/nextcloud-entrypoint.sh"

  - name: Sanity-check the assembled tree
    runs: |
      set -eu
      destdir="${{targets.destdir}}"
      app="$destdir/var/www/html"
      test -f "$app/version.php"
      test -f "$app/index.php"
      test -f "$app/status.php"
      test -f "$app/occ"
      test -d "$app/3rdparty"
      test -d "$app/apps"
      test -f "$destdir/etc/nginx/conf.d/nextcloud.conf"
      test -f "$destdir/etc/php/php-fpm.d/zzz-nextcloud.conf"
      test -f "$destdir/etc/nextcloud/supervisord.conf"
      test -x "$destdir/usr/bin/nextcloud-entrypoint.sh"

test:
  pipeline:
    - runs: |
        set -eu
        php --version
        test -f /var/www/html/version.php
        test -f /var/www/html/occ
        # The required + recommended extensions must be loaded in the runtime.
        for ext in ctype curl dom gd fileinfo mbstring openssl posix simplexml \
                   xmlreader xmlwriter zip pdo pdo_mysql pdo_pgsql pdo_sqlite \
                   intl bcmath gmp exif sodium apcu redis imagick ldap; do
          php -m | grep -qi "^${ext}$" || { echo "missing PHP ext: $ext"; php -m; exit 1; }
        done
        # opcache is reported as "Zend OPcache" by php -m.
        php -m | grep -qi "opcache" || { echo "missing PHP ext: opcache"; php -m; exit 1; }
        # occ prints the Nextcloud version without a database/config.
        php /var/www/html/occ --version --no-warnings
