# Assembles the Nextcloud Server runtime image: php-fpm (the app on :9000) +
# QuenchWorks' own nginx (:8080), supervised by supervisord. Minimal, nonroot
# (uid/gid 1001), multi-arch, read-only-rootfs friendly. SBOM generated by apko.
#
# Clean-room: we do NOT inherit the upstream `nextcloud` image (Debian + Apache).
# The whole runtime is reconstructed from Wolfi packages -- the application tree,
# nginx site config, php-fpm/php.ini overrides and supervisor wiring all come from
# the quench-nextcloud@local package (built from the official release tarball).
#
# Ports:
#   8080/tcp  nginx -- serves /var/www/html, FastCGI-passes .php to php-fpm
#                      (nonroot can't bind <1024)
#   9000/tcp  php-fpm (loopback only; nginx -> 127.0.0.1:9000)
#
# Read-only rootfs: the writable surfaces (tmpfs/emptyDir/PVC) are
#   * /var/www/html/data         -- user files (chart: PVC)
#   * /var/www/html/config       -- config.php + apps.config.php (chart: PVC/Secret)
#   * /var/www/html/custom_apps  -- writable app-store dir (bundled apps/ stays RO)
#   * /tmp                       -- supervisord pid/sock, nginx pid + temp, php scratch
# Everything else (the app source, 3rdparty/, bundled apps/, /etc, binaries) is RO.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - busybox
    - ca-certificates-bundle
    - supervisor                 # process supervisor (s6-overlay isn't packaged in Wolfi)
    - quench-nginx@local         # QuenchWorks' hardened nginx (from source), NOT nginx.org/Debian
    - quench-nextcloud@local     # the Nextcloud app tree + nginx/php/supervisor wiring
    # PHP 8.3 runtime + FPM + the full extension surface (see melange.yaml for the
    # required-vs-recommended rationale). Kept in sync with the package's runtime deps.
    - php-8.3
    - php-8.3-config
    - php-8.3-fpm
    - php-8.3-fpm-config
    - php-8.3-opcache
    - php-8.3-opcache-config
    - php-8.3-ctype
    - php-8.3-ctype-config
    - php-8.3-curl
    - php-8.3-curl-config
    - php-8.3-dom
    - php-8.3-dom-config
    - php-8.3-gd
    - php-8.3-gd-config
    - php-8.3-fileinfo
    - php-8.3-fileinfo-config
    - php-8.3-iconv
    - php-8.3-iconv-config
    - php-8.3-mbstring
    - php-8.3-mbstring-config
    - php-8.3-openssl
    - php-8.3-openssl-config
    - php-8.3-posix
    - php-8.3-posix-config
    - php-8.3-simplexml
    - php-8.3-simplexml-config
    - php-8.3-xml
    - php-8.3-xml-config
    - php-8.3-xmlreader
    - php-8.3-xmlreader-config
    - php-8.3-xmlwriter
    - php-8.3-xmlwriter-config
    - php-8.3-zip
    - php-8.3-zip-config
    - php-8.3-phar
    - php-8.3-phar-config
    - php-8.3-pdo
    - php-8.3-pdo-config
    - php-8.3-pdo_mysql
    - php-8.3-pdo_mysql-config
    - php-8.3-mysqli
    - php-8.3-mysqli-config
    - php-8.3-mysqlnd
    - php-8.3-mysqlnd-config
    - php-8.3-pdo_pgsql
    - php-8.3-pdo_pgsql-config
    - php-8.3-pgsql
    - php-8.3-pgsql-config
    - php-8.3-pdo_sqlite
    - php-8.3-pdo_sqlite-config
    - php-8.3-intl
    - php-8.3-intl-config
    - php-8.3-bcmath
    - php-8.3-bcmath-config
    - php-8.3-gmp
    - php-8.3-gmp-config
    - php-8.3-exif
    - php-8.3-exif-config
    - php-8.3-sodium
    - php-8.3-sodium-config
    - php-8.3-sockets
    - php-8.3-sockets-config
    - php-8.3-ftp
    - php-8.3-ftp-config
    - php-8.3-pcntl
    - php-8.3-pcntl-config
    - php-8.3-sysvsem
    - php-8.3-sysvsem-config
    - php-8.3-gettext
    - php-8.3-gettext-config
    - php-8.3-apcu
    - php-8.3-apcu-config
    - php-8.3-redis
    - php-8.3-redis-config
    - php-8.3-imagick
    - php-8.3-imagick-config
    - php-8.3-ldap
    - php-8.3-ldap-config

accounts:
  groups:
    - groupname: nextcloud
      gid: 1001
  users:
    - username: nextcloud
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/bin/nextcloud-entrypoint.sh

work-dir: /var/www/html

environment:
  PHP_OPCACHE_ENABLE: "1"

paths:
  # User files (chart mounts a PVC here).
  - path: /var/www/html/data
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o770
    recursive: true
  # config.php + apps.config.php (chart mounts a PVC/Secret here).
  - path: /var/www/html/config
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o770
    recursive: true
  # Writable app-store dir (bundled apps/ stays read-only).
  - path: /var/www/html/custom_apps
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o755
    recursive: true
  # Bundled apps owned by the runtime user (writable only if a volume is mounted;
  # otherwise read-only under the read-only rootfs).
  - path: /var/www/html/apps
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o755
    recursive: true
  # supervisord pid/sock, nginx pid + temp dirs, php session/upload scratch.
  - path: /tmp
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o1777

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-nextcloud"
  org.opencontainers.image.licenses: "AGPL-3.0-only"
