# is not a way out either: it predates the 1.3.2-r0 fix for CVE-2026-27171.
#
# BLOCKED=1 skips build+merge so sweeps stop burning a red run here. Clear
# it with scripts/blocked.py --dispatch once Wolfi ships zlib 1.3.3-r0.
# Forgejo (codeberg.org/forgejo/forgejo): self-hosted Git forge, a Gitea fork.
# From-source via melange, built from the codeberg RELEASE source tarball
# (forgejo-src-X.Y.Z.tar.gz), NOT a git-archive. Image-only (a server, no chart).
# NEWEST-ONLY: only the newest stable line is shipped. Tags are vX.Y.Z on codeberg.
#
# The release src tarball already contains the pre-generated bindata
# (modules/public/bindata.go etc.) AND the prebuilt Vite frontend under
# public/assets, so `-tags bindata` embeds the full web UI with NO Node build.
# Forgejo's SQLite driver is github.com/mattn/go-sqlite3 (CGO; upstream has no
# pure-go/modernc option), so the binary is built CGO_ENABLED=1 and statically
# linked against musl (build-base) -- same proven pattern as apps/rqlite.
# Version is stamped via -X main.Version so `forgejo --version` reports the release.
BLOCKED=1
FROM_SOURCE=1
VERSIONS=(15.0.8)
declare -A SHA256=(
  [15.0.8]=84420c009547a56e8b5ee8ad8a9603d923ca1e5eecda0965385241ebf0ce034f
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
