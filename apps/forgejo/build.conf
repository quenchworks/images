# STATUS: UNBLOCKED 2026-09-20. The zlib block is gone: Wolfi shipped the fix
# for CVE-2026-85091 as zlib 1.3.2.1_rc20260601-r0 and the advisory was amended
# to name that version, so the 1.3.3-r0 this file used to wait for is a number
# that will never arrive. A stock wolfi-base scan reports the advisory as
# `zlib 1.3.2-r7 -> 1.3.2.1_rc20260601-r0`, which is what Wolfi publishes on
# both arches today. scripts/blocked.py now watches the shipped version.
#
# Evidence, stated exactly as measured:
#   x86_64  gated locally 2026-09-20, PUSH=0: 0 fixable CVEs AND the boot test
#           passed, so this is "runs", not just "scans clean".
#   aarch64 not measured locally; this host kills background melange builds and
#           a qemu-emulated arm build does not fit the foreground timeout. CI's
#           native arm64 runner is the first arm measurement, and its gate
#           refuses to publish on any finding.
# Forgejo (codeberg.org/forgejo/forgejo): self-hosted Git forge, a Gitea fork.
# From-source via melange, built from the codeberg RELEASE source tarball
# (forgejo-src-X.Y.Z.tar.gz), NOT a git-archive. Image-only (a server, no chart).
# NEWEST-ONLY: only the newest stable line is shipped. Tags are vX.Y.Z on codeberg.
#
# The release src tarball already contains the pre-generated bindata
# (modules/public/bindata.go etc.) AND the prebuilt Vite frontend under
# public/assets, so `-tags bindata` embeds the full web UI with NO Node build.
# Forgejo's SQLite driver is github.com/mattn/go-sqlite3 (CGO; upstream has no
# pure-go/modernc option), so the binary is built CGO_ENABLED=1 and statically
# linked against musl (build-base) -- same proven pattern as apps/rqlite.
# Version is stamped via -X main.Version so `forgejo --version` reports the release.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(15.0.9)
declare -A SHA256=(
  [15.0.9]=22aabf1edfc88aa25ff9c755c0ee95734392c865408a020094f85832fbfb68e5
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
