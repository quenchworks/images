# step-ca (smallstep/certificates): from-source via melange (Go build of
# ./cmd/step-ca from the git tag tarball). Image-only (an online CA server, no
# chart). Newest patch only (0.30). Single static Go binary, CGO disabled
# (pure-Go build; only PKCS#11/HSM needs CGO, omitted for the hardened default).
# Version is stamped via -X main.Version (per upstream Makefile LDFLAGS, bare
# version, no "v" prefix). Apache-2.0.
#
# The image ALSO ships the `step` CLI (smallstep/cli), built the same way from
# its own git tag tarball. The step-ca Helm chart needs `step ca init` to
# bootstrap the PKI on first boot, and smallstep's own official image ships both
# binaries, so we match that. The CLI has its own version line (0.30.x, tracks
# step-ca closely). Same LDFLAGS convention (-X main.Version, bare version).
#   __VER__      = step-ca version (release tag v__VER__)
#   __SHA256__   = step-ca tarball sha256
#   __STEPVER__  = step CLI version (release tag v__STEPVER__)
#   __STEPSHA__  = step CLI tarball sha256
FROM_SOURCE=1
VERSIONS=(0.30.2)
declare -A SHA256=(
  [0.30.2]=327391f301b79818f2418302516b4f6b41bdf08e38edc9011cc7f1b351e19452
)
# step CLI version paired with each step-ca release (newest stable compatible).
declare -A STEP=(
  [0.30.2]=0.30.6
)
declare -A STEP_SHA=(
  [0.30.2]=0c8562b95150cc24bf69ba18fcf9f0bf671f334f5d3ccb39f287692b61531b7c
)
render() {
  echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g; s/__STEPVER__/${STEP[$1]}/g; s|__STEPSHA__|${STEP_SHA[$1]}|g"
}
