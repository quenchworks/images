# Builds the cert-manager webhook from source onto Wolfi. Static Go binary, no CGO.
# cert-manager's cmd/webhook is its own Go module (it `replace`s the parent repo to a
# local path), so the build runs from inside cmd/webhook. The version is stamped via -X
# into pkg/util.AppVersion so the component reports the real release. Output is a
# signed APK in Quenchworks' own repo. No upstream distro binaries.
package:
  name: quench-cert-manager-webhook
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened cert-manager webhook, built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-1.26

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/cert-manager/cert-manager/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      export GOTOOLCHAIN=local   # use the installed go-1.26, don't fetch a newer go.mod toolchain
      cd cmd/webhook
      # 0-CVE gate: bump vulnerable Go modules to their Trivy-advised fixed versions
      # before building. Older release lines (e.g. 1.18.x) pin x/net, x/crypto, grpc,
      # go-jose, go-ntlmssp and otel below the fixed versions; newer lines already
      # satisfy these, so the bump is a no-op there. cmd/<target> replaces the parent
      # cert-manager module (../../), so bumping here (the main module) wins via MVS.
      # cel-go 0.26.0 -> 0.29.2 clears GHSA-gcjh-h69q-9w9g (MEDIUM: json:"-" fields
      # readable from user CEL expressions; first fixed release is 0.29.0). cel-go is
      # only reached via k8s.io/apiserver's CEL libs, which are source-compatible with
      # 0.29. On the 1.18.x/1.19.x tags cel-go is not in the build graph at all, so
      # `go mod tidy` drops the requirement again there.
      # FLOOR, NOT A PIN (docs/go-module-float.md): x/text was raised 0.39.0 -> 0.40.0
      # because cmd/<target>/go.mod on 1.21.1 already REQUIRES x/text v0.40.0 -- the old
      # @v0.39.0 line had inverted into a downgrade there. 1.20.3/1.19.6 sit at v0.37.0,
      # so for them the new floor is still a genuine raise.
      # The only `replace` in cmd/<target>/go.mod is the parent cert-manager => ../../
      # local path, which shadows no floated module.
      go get \
        golang.org/x/net@v0.58.0 \
        golang.org/x/crypto@v0.55.0 \
        golang.org/x/text@v0.41.0 \
        google.golang.org/grpc@v1.82.1 \
        github.com/go-jose/go-jose/v4@v4.1.4 \
        github.com/Azure/go-ntlmssp@v0.1.1 \
        go.opentelemetry.io/otel/sdk@v1.43.0 \
        github.com/google/cel-go@v0.29.2
      go mod tidy || true
      go build -trimpath \
        -ldflags "-s -w -X github.com/cert-manager/cert-manager/pkg/util.AppVersion=v${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/webhook" .
