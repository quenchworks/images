# cert-manager-webhook: from-source via melange. All four cert-manager component
# images (controller, webhook, cainjector, acmesolver) build from the SAME upstream
# source tarball; only the cmd/ target differs. Latest patch of the last 3 minor
# lines (1.19, 1.20, 1.21), each pinned by sha256. Static Go binary, no CGO. Version
# is stamped via -X github.com/cert-manager/cert-manager/pkg/util.AppVersion=vX.Y.Z.
#
# WINDOW IS EXACTLY 3: the build workflow's prep job slices VERSIONS to the last 3,
# so a 4th entry is silently never built. The list carried 4 (1.18.6 was already dead
# weight); trimmed back to 3 so the file says what CI actually builds.
FROM_SOURCE=1
VERSIONS=(1.20.5 1.21.1 1.21.3)
declare -A SHA256=(
  [1.20.5]=cc33c2bb7071b1e9b8d9c3b49cc244963646996db830617c0670303daed31dc0
  [1.21.1]=d0db29599f9982a5ed0ac09c5afa1d0123be0975bd5ecd810f872652bb264d39
  [1.21.3]=fa2ea8e1a014289f12d1b1c939afa4b119ee116f8a5990e4662d439e10378c3f
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
