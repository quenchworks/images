# Builds Kuma (kumahq/kuma) from source onto Wolfi. Kuma is a CNCF service-mesh
# control plane. We build two static Go binaries with CGO disabled (matching
# upstream mk/build.mk GOENV=CGO_ENABLED=0, GOFLAGS=-trimpath):
#   kuma-cp   -- the control plane. It go:embeds the Kuma GUI, which is already
#                PRE-BUILT and vendored in the release tarball at
#                app/kuma-ui/pkg/resources/data/** (see fs.go: `//go:embed
#                data/* data/assets/*`, no build tag). So NO Node/pnpm toolchain
#                is needed -- a plain `go build ./app/kuma-cp` bakes in the UI.
#   kumactl   -- the CLI.
# kuma-dp is intentionally NOT shipped: it is the data-plane sidecar and only
# does anything paired with an Envoy binary (fetched at runtime by upstream from
# kumahq/envoy-builds), which this control-plane image does not bundle. A
# data-plane image is a separate concern.
#
# Version is stamped via -X on github.com/kumahq/kuma/v2/pkg/version so
# `kuma-cp version` / `kumactl version` report the real release (mirrors upstream
# mk/build.mk LD_FLAGS). Envoy compat version is a plain string constant from
# mk/dev.mk (ENVOY_VERSION 1.38.2); it only affects the reported build info.
#
# go.mod now requires go >= 1.27, so this builds with go-1.27. Building on
# go-1.26 failed with "go.mod requires go >= 1.27 (running go 1.26.8;
# GOTOOLCHAIN=local)" -- GOTOOLCHAIN=local is deliberate, it stops go from
# silently downloading a toolchain, so the pinned package has to be new enough.
# stdlib CVE advisories) and GOTOOLCHAIN=local so the go.mod toolchain directive
# does not trigger a download. GOFLAGS=-mod=mod lets the module graph resolve any
# patched transitive deps. Output is a signed APK in Quenchworks' own repo; no
# upstream distro binaries. Image-only (no chart). Upstream tags carry a "v"
# prefix; the stamped version is the bare X.Y.Z.
package:
  name: quench-kuma
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Kuma (CNCF service-mesh control plane), built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-1.27

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/kumahq/kuma/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - name: Build kuma-cp and kumactl (static, CGO off; GUI embedded from the tarball)
    runs: |
      set -eu
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      export GOTOOLCHAIN=local      # use the installed go-1.27, do not fetch go.mod's toolchain
      export GO111MODULE=on
      VERPKG="github.com/kumahq/kuma/v2/pkg/version"
      ENVOY_VERSION="1.38.2"        # mk/dev.mk: build-info string only
      LDFLAGS="-s -w \
        -X ${VERPKG}.version=${{package.version}} \
        -X ${VERPKG}.gitTag=v${{package.version}} \
        -X ${VERPKG}.buildDate=released \
        -X ${VERPKG}.Envoy=${ENVOY_VERSION}"
      # 0-CVE gate: float transitive deps Trivy flags on the kuma binaries.
      #   golang.org/x/net  v0.55.0 -> v0.56.0 (CVE-2026-46600: panic on invalid SVCB/HTTPS RR)
      #   golang.org/x/text v0.37.0 -> v0.39.0 (CVE-2026-56852: infinite loop on invalid input)
      #   github.com/google/cel-go v0.26.1 -> v0.29.2 (GHSA-gcjh-h69q-9w9g, MEDIUM:
      #     json:"-" fields readable from user CEL expressions; first fixed in 0.29.0).
      #     Indirect here (reached through k8s.io/apiserver's CEL libs), which are
      #     source-compatible with 0.29 -- kuma has no cel-go call sites of its own.
      # otel CVE-2026-81870 / CVE-2026-81871: the published image drifted onto these
      # after release. Every module listed is one this app's own go.mod carries; a
      # floor naming a module absent from the graph is rejected by some recipes.
      # 0-CVE FLOORS, not pins (docs/go-module-float.md): raise a module only where go.mod has it
      # below the floor; a module absent from the graph is skipped. Bare `go get` pins downgraded
      # newer upstream releases (found 2026-10-05).
      FLOOR="golang.org/x/net@v0.58.0 golang.org/x/sys@v0.47.0 google.golang.org/grpc@v1.83.2 golang.org/x/crypto@v0.56.0 golang.org/x/text@v0.41.0 github.com/google/cel-go@v0.29.2 github.com/cilium/ebpf@v0.22.0 go.opentelemetry.io/otel@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlpmetric/otlpmetricgrpc@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.45.0 go.opentelemetry.io/otel/exporters/prometheus@v0.67.0 go.opentelemetry.io/otel/metric@v1.45.0 go.opentelemetry.io/otel/sdk@v1.45.0 go.opentelemetry.io/otel/sdk/metric@v1.45.0 go.opentelemetry.io/otel/trace@v1.45.0"
      # Go semver order (a release outranks its prereleases); busybox sort -V does not.
      vlt() { awk -v a="${1#v}" -v b="${2#v}" 'function pp(s,  p){sub(/\+.*/,"",s);p=index(s,"-");if(p){C=substr(s,1,p-1);P=substr(s,p+1)}else{C=s;P=""}} function cmp(x,y,  i,n,m,X,Y){n=split(x,X,".");m=split(y,Y,".");for(i=1;i<=n&&i<=m;i++){if(X[i]==Y[i])continue;if(X[i]~/^[0-9]+$/&&Y[i]~/^[0-9]+$/)return (X[i]+0<Y[i]+0)?-1:1;if(X[i]~/^[0-9]+$/)return -1;if(Y[i]~/^[0-9]+$/)return 1;return (X[i]<Y[i])?-1:1}return (n<m)?-1:(n>m)?1:0} BEGIN{pp(a);ca=C;pa=P;pp(b);cb=C;pb=P;c=cmp(ca,cb);if(c==0){if(pa==pb)c=0;else if(pa=="")c=1;else if(pb=="")c=-1;else c=cmp(pa,pb)}exit !(c<0)}'; }
      need=""
      for mv in $FLOOR; do
        have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${mv%@*}" 2>/dev/null)"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        vlt "$have" "${mv#*@}" && need="$need $mv"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || go get $need
      go mod tidy
      go build -trimpath -ldflags "${LDFLAGS}" \
        -o "${{targets.destdir}}/usr/bin/kuma-cp" ./app/kuma-cp
      go build -trimpath -ldflags "${LDFLAGS}" \
        -o "${{targets.destdir}}/usr/bin/kumactl" ./app/kumactl
