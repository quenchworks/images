# kuma (kumahq/kuma): from-source via melange (Go build of the control plane
# from the git tag tarball). Image-only (a service-mesh control plane, no chart).
# NEWEST-ONLY: just the single newest stable release. Upstream tags DO carry a
# "v" prefix (e.g. v2.14.0); the stamped version is the bare X.Y.Z. Two static Go
# binaries, CGO disabled (matches upstream GOENV=CGO_ENABLED=0): kuma-cp (control
# plane, which go:embeds the pre-built Kuma GUI shipped in the tarball) and
# kumactl (CLI). Version stamped via -X on github.com/kumahq/kuma/v2/pkg/version.
FROM_SOURCE=1
VERSIONS=(2.14.7 3.0.1)
declare -A SHA256=(
  [2.14.7]=04d2ba6452109e67c6185560b1d9222dfc8be33fde1bada458f6fca017abbfe5
  [3.0.1]=42873f8cea085979efe544472e561235c32055be822684b97959f5fb162fde64
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
