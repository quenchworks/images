# falco: Falco runtime threat detection, built FROM SOURCE: the falco binary
# with falcosecurity/libs (the version the tag pins, fetched and sha256-checked
# by Falco's own CMake) and the modern eBPF probe compiled into it, plus the
# container plugin (falcosecurity/plugins, plugins/container, Go + C++) built
# from source and shipped as /usr/share/falco/plugins/libcontainer.so. Rules
# come from Wolfi falco-rules (the 5.2.0 line the tag pins).
#
# Why not upstream's tarball: 0.45.0 bundles OpenSSL 3.1.4 (end of life) and
# zlib 1.3.1 statically. Why not Wolfi falco-no-driver: the public index stops
# at 0.44.0-r0, and its container plugin scans at 57 Go findings (2026-09-28).
#
# Built with USE_BUNDLED_DEPS=OFF and every per-dependency USE_BUNDLED_* flag
# OFF (Falco's libs module turns tbb, jsoncpp, valijson, re2 and uthash back ON
# unless told otherwise), USE_DYNAMIC_LIBELF=ON: OpenSSL 4, zlib, curl, tbb,
# re2, jsoncpp, yaml-cpp and libelf are Wolfi shared libraries the gate scans.
# Header-only parts (nlohmann-json, valijson, cxxopts, cpp-httplib) are Wolfi's
# newest. Still bundled: bs_threadpool (header, not in Wolfi) and, inside the
# plugin, fmt + RE-flex + plugin-sdk-cpp (pinned by the plugin's CMake).
# Modern eBPF probe only: no kernel module, no legacy eBPF.
#
# The plugin's Go worker is a c-archive linked into libcontainer.so. Trivy reads
# Go build info from it only while the file is executable (measured
# 2026-10-19: 0755 lists 156 modules, 0644 lists none), so the recipe installs
# it 0755 and fails if `go version -m` cannot read it. Floats: containerd/v2
# 2.2.9, podman/v6 6.1.3 (CRITICAL), x/net 0.60, x/crypto 0.57. docker/docker
# CVE-2026-33997 is VEXed (client packages only; build fails if daemon code is
# linked).
#
# Falco needs root, privileges and host mounts to capture. The image default
# user is 1001 like every image; a deployment runs the container as root.
#
# WINDOW: latest only (0.45 line). PLUGIN is the container plugin version the
# Falco tag pins (CONTAINER_VERSION in its CMakeLists.txt; the recipe asserts it).
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(0.45.1)
declare -A SHA256=( [0.45.1]=b8f2c5d195d778b1f82f7f52dd440ea38cc50e9335a9c322d4564f2ed6fc1697 )
declare -A PLUGIN=( [0.45.1]=0.7.5 )
declare -A PLUGIN_SHA256=( [0.45.1]=820d66250f4537acb1e121cca86b7ce9c47ac7d3e87b16de03047eedd29ebc7f )
render() { echo "s/__VER__/$1/g; s/__SHA256__/${SHA256[$1]}/g; s/__PLUGIN__/${PLUGIN[$1]}/g; s/__PLUGIN_SHA256__/${PLUGIN_SHA256[$1]}/g"; }
