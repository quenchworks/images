# victoriametrics: from-source via melange (Go build, git-checkout pinned per
# release; tag = v<version>, go-1.26). Newest stable patch only. COMMIT map pins
# the git tag.
FROM_SOURCE=1
VERSIONS=(1.150.0)
declare -A COMMIT=(
  [1.150.0]=413f95d65f08d2c3fb03e227b1f3ba42884ca796
)
render() { echo "s/__VER__/$1/g; s/__COMMIT__/${COMMIT[$1]}/g"; }
