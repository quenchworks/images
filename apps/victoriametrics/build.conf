  [1.144.0]=d82ad68f604cd73c5728ca2a33884068538a5278
  [1.145.0]=3147f9c24bb95dec1d12b96f924154a549730186
)
render() { echo "s/__VER__/$1/g; s/__COMMIT__/${COMMIT[$1]}/g"; }
