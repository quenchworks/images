# Assembles the VictoriaMetrics single-node runtime image. Minimal, nonroot,
# multi-arch, SBOM by apko.
#
# VictoriaMetrics is configured by flags. The thin entrypoint pins the storage
# path to a writable mount (VM_STORAGE, default /storage) so the image runs on a
# read-only rootfs, and the HTTP API to :8428. There is no auth by default --
# the NetworkPolicy is the security boundary, consistent with the catalog posture.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - busybox                       # the thin entrypoint needs a tiny shell
    - ca-certificates-bundle
    - quench-victoriametrics@local

accounts:
  groups:
    - groupname: victoriametrics
      gid: 1001
  users:
    - username: victoriametrics
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/local/bin/docker-entrypoint.sh

environment:
  VM_STORAGE: /storage
  VM_HTTP_LISTEN: ":8428"

work-dir: /storage

paths:
  - path: /storage
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o700

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-victoriametrics"
  org.opencontainers.image.licenses: "Apache-2.0"
