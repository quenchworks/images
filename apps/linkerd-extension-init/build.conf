# Rust, built from source (2026-10-08) from linkerd/linkerd-extension-init tags release/vX.Y.Z.
# uid 2103, the viz chart's default UID; the chart passes only args, so the binary is the ENTRYPOINT.
BLOCKED=0
FROM_SOURCE=1
