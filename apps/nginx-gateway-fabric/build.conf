# NGINX Gateway Fabric (control plane): from-source via melange (Go build from the git
# tag tarball). Single static Go binary, no CGO, main package at ./cmd/gateway.
#
# LATEST ONLY, deliberately. NGF 2.x is a two-image app: this control plane and the
# data plane at apps/nginx-gateway-fabric-nginx, and the pair is version-locked in both
# directions. The control plane injects its OWN image as the data-plane pod's init
# container (provisioner buildInitContainers uses GatewayPodConfig.Image), and it
# defaults the data-plane image TAG to its own ldflag version
# (DetermineNginxImageName -> `<repo>:<control-plane version>`). Each NGF release also
# pins a specific nginx / nginx-agent / njs trio in build/Dockerfile.nginx. Shipping
# three lines would mean three data-plane trios kept in lockstep for no gain, so the
# window is one release -- same call as apps/kong.
FROM_SOURCE=1
VERSIONS=(2.7.2)
declare -A SHA256=(
  [2.7.2]=530cf735b2ba276cd38c22355c284da14b8471247e0033170af22facf944729b
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
