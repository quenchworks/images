# flux-source-watcher: Flux's source-watcher, from source via melange (Go build of cmd/main.go from the git tag
# tarball). Static Go binary, no CGO. Flux ships one version of each controller per
# Flux release, so this tracks the latest only. The binary carries no version stamp.
FROM_SOURCE=1
VERSIONS=(2.2.4)
declare -A SHA256=(
  [2.2.4]=f01d3eb03353089627dc384842da2fe7fdfedc05178f25ded8104affb1e90d3f
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
