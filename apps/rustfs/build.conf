# rustfs: installs the official prebuilt per-arch musl binary (zip). rustfs has no
# stable release yet (all 1.0.0-beta.*), so latest 3 = the 3 newest betas. The
# image version uses an apk-valid form (1.0.0_betaN) while the GitHub release tag
# is 1.0.0-beta.N (UPSTREAM map). Per-arch sha256 via SHA_AMD/SHA_ARM.
FROM_SOURCE=1
VERSIONS=(1.0.0_beta6 1.0.0_beta7 1.0.0_beta8)
declare -A UPSTREAM=(
  [1.0.0_beta6]=1.0.0-beta.6
  [1.0.0_beta7]=1.0.0-beta.7
  [1.0.0_beta8]=1.0.0-beta.8
)
declare -A SHA_AMD=(
  [1.0.0_beta6]=e2dfa35259a65f3635f754af8414e79486d5b1134ddf901252a7a9444ba7b4cc
  [1.0.0_beta7]=f13bc89efa7881a199bf286390a89c7320ee2e52d90c341affd41bc5e7ba2677
  [1.0.0_beta8]=8175fc82f23ec4ae42bc285c321f87f3fe1763d201c01537cb8e80acfa72aeaf
)
declare -A SHA_ARM=(
  [1.0.0_beta6]=67134f0193034e5246fce7ceb7130ce2f594e25f4b80c69140f7266c764c3e8b
  [1.0.0_beta7]=989552479bfb2cc8e1ffa3af9c95da072d082a2e7124f54a1af1b1dcb68264ce
  [1.0.0_beta8]=7003f45070ec634f85c21e3c46dcff4d25de22dd3af3f3a4a1ddbd1cea89502b
)
render() { echo "s/__VER__/$1/g; s|__UPSTREAM__|${UPSTREAM[$1]}|g; s|__SHA_AMD__|${SHA_AMD[$1]}|g; s|__SHA_ARM__|${SHA_ARM[$1]}|g"; }
