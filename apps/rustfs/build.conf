# rustfs: installs the official prebuilt per-arch musl binary (zip) plus the tag
# Cargo.lock. The binary carries no cargo-auditable .dep-v0 section, so Trivy sees its
# crates only through that lock, installed at /usr/share/doc/rustfs/Cargo.lock (sha256
# pinned). Checked 2026-10-13: every one of the 384 crate-version strings in the 1.0.1
# x86_64 binary is in the 1.0.1 tag lock, and `rustfs --version` reports the tag commit.
# Per-arch zip sha256 via SHA_AMD/SHA_ARM, from the release SHA256SUMS and re-verified
# against the downloaded zips. UPSTREAM maps the apk version to the release tag.
#
# 2026-10-13: window moved from the 1.0.0 betas to the stable releases (1.0.0 GA was
# 2026-09-16). The beta.10/11/12 tag locks hold russh 0.62.x (CVE-2026-102823 HIGH, fix
# only on 0.63), hickory-resolver 0.26.1 (GHSA-5j98-2g5x-46v6, GHSA-6w6g-hm98-mhgm HIGH),
# pageant 0.2.1 and rustls 0.23.42/43, none fixable in a prebuilt binary; the 1.0.0 and
# 1.0.1 locks scan 0 with the gate flags. The published beta tags stay in GHCR but are no
# longer in the lock, so they are no longer scanned. 1.0.x migrates beta IAM data on start.
# 2026-10-19: 1.0.2 + 1.0.3 added (zip sha256 from downloads, matching SHA256SUMS; tag locks
# scan 0 with the gate flags); 1.0.0 dropped from the window, the chart pins 1.0.1.
FROM_SOURCE=1
VERSIONS=(1.0.1 1.0.2 1.0.3)
declare -A UPSTREAM=(
  [1.0.1]=1.0.1
  [1.0.2]=1.0.2
  [1.0.3]=1.0.3
)
declare -A SHA_AMD=(
  [1.0.1]=a834096dafa1f1a55825a2cdaf49d006a193978d344f2d508c2be475133738a3
  [1.0.2]=452bf5f000507e7b91bc18f5a52c9945be7ffa4d254a3816a97e23aa76880d7d
  [1.0.3]=29a083f156fe1a246f0336afe16ff77fffe587628e97339448d8f4fba38dba54
)
declare -A SHA_ARM=(
  [1.0.1]=d2533e293204597416cb8d30790ea35df14cb4521633fa3574c64333141bafdf
  [1.0.2]=39712ed2bcad5bbf6fbbae15abe753f0c4a726744b7383a445d6aec835140943
  [1.0.3]=28e973c6e630dfa1c7a6d7af86b360e598a34c476d34a0dcbcfbeb70b1f06747
)
# sha256 of raw.githubusercontent.com/rustfs/rustfs/<tag>/Cargo.lock, from a download
declare -A SHA_LOCK=(
  [1.0.1]=6d4b862e9158dd1488416c4bba41eb2c3472b33980191992f01f0f5b7591424f
  [1.0.2]=f534159931f7fc03f4347ff5f71251d471fff4680d9207f86c23133d79eaf23b
  [1.0.3]=58cb1791481f287686b9458ee21efd05543901b7ae951332a4565a8dddf9f20c
)
render() { echo "s/__VER__/$1/g; s|__UPSTREAM__|${UPSTREAM[$1]}|g; s|__SHA_AMD__|${SHA_AMD[$1]}|g; s|__SHA_ARM__|${SHA_ARM[$1]}|g; s|__SHA_LOCK__|${SHA_LOCK[$1]}|g"; }
