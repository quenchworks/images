# rustfs: installs the official prebuilt per-arch musl binary (zip). rustfs has no
# stable release yet (now on the 1.0.0-beta.11 line), so latest 3 = the 3 newest
# tags by the check-script's numeric vkey: beta.11-preview.1 [..11,1] > beta.11
# [..11] > beta.10-preview.5 [..10,5]. The image version uses an apk-valid form
# (beta.N -> _betaN, preview.N -> trailing _pN post-release) while the GitHub
# release tag is the dashed 1.0.0-beta.N[-preview.N] (UPSTREAM map). apk sorts the
# _pN preview ABOVE its plain beta (post-release), matching the check-script order,
# so beta11_p1 > beta11 > beta10_p5. Per-arch sha256 via SHA_AMD/SHA_ARM.
FROM_SOURCE=1
VERSIONS=(1.0.0_beta10_p5 1.0.0_beta11 1.0.0_beta11_p1)
declare -A UPSTREAM=(
  [1.0.0_beta10_p5]=1.0.0-beta.10-preview.5
  [1.0.0_beta11]=1.0.0-beta.11
  [1.0.0_beta11_p1]=1.0.0-beta.11-preview.1
)
declare -A SHA_AMD=(
  [1.0.0_beta10_p5]=c92318b5f354353dcd583542d6938a78370aafd4f0b847d9e58a33337b37c1ae
  [1.0.0_beta11]=137bcb49d94b19d0796884959e3b884e4c5b701c441ac0a55ecadcd32c0d2320
  [1.0.0_beta11_p1]=7f6104cab9914d31654e7bfc5fc6d59f1f622c2d91f92639b261c73ebdd448ed
)
declare -A SHA_ARM=(
  [1.0.0_beta10_p5]=b5cf46c07de63c74ab5a03ff45c9a4c42126208b179eaeac3ee709b1345879dc
  [1.0.0_beta11]=5e9f6a38fb878d4bc3328359a73d55988e778728919e1ed9befbfec6d84cbddd
  [1.0.0_beta11_p1]=4d5920fe0599843cb76442c8be8c8216f9ed17cf23c13f8a6c29f5ab07ba2c4d
)
render() { echo "s/__VER__/$1/g; s|__UPSTREAM__|${UPSTREAM[$1]}|g; s|__SHA_AMD__|${SHA_AMD[$1]}|g; s|__SHA_ARM__|${SHA_ARM[$1]}|g"; }
