# rustfs: installs the official prebuilt per-arch musl binary (zip). rustfs has no
# stable release yet (now on the 1.0.0-beta.12 line), so latest 3 = the 3 newest
# tags by the check-script's numeric vkey: beta.12-preview.1 [..12,1] > beta.12
# [..12] > beta.11-preview.1 [..11,1]. The image version uses an apk-valid form
# (beta.N -> _betaN, preview.N -> trailing _pN post-release) while the GitHub
# release tag is the dashed 1.0.0-beta.N[-preview.N] (UPSTREAM map). apk sorts the
# _pN preview ABOVE its plain beta (post-release), matching the check-script order,
# so beta12_p1 > beta12 > beta11_p1 (verified with `apk version -t`, and both new
# entries pass `apk version -c`). Per-arch sha256 via SHA_AMD/SHA_ARM, taken from
# the release's own SHA256SUMS and re-verified against the downloaded zips.
FROM_SOURCE=1
VERSIONS=(1.0.0_beta11_p1 1.0.0_beta12 1.0.0_beta12_p1)
declare -A UPSTREAM=(
  [1.0.0_beta11_p1]=1.0.0-beta.11-preview.1
  [1.0.0_beta12]=1.0.0-beta.12
  [1.0.0_beta12_p1]=1.0.0-beta.12-preview.1
)
declare -A SHA_AMD=(
  [1.0.0_beta11_p1]=7f6104cab9914d31654e7bfc5fc6d59f1f622c2d91f92639b261c73ebdd448ed
  [1.0.0_beta12]=683bef16247ab04bedb76d0444736f286d21943375d2d57d2ded9ec277498427
  [1.0.0_beta12_p1]=d4261f6094f99cd2d208d7c9eacc3c1a9e29925d408e86c9f5f45f89e9fbd997
)
declare -A SHA_ARM=(
  [1.0.0_beta11_p1]=4d5920fe0599843cb76442c8be8c8216f9ed17cf23c13f8a6c29f5ab07ba2c4d
  [1.0.0_beta12]=1a6425145977c55a05549aa72f9af5bd314893a7424e352bfe852fe68fc2b50c
  [1.0.0_beta12_p1]=86360e2cd21a5c5dd5957f92c72c91bd0e10aefb4c4a0085589e68df4a877d76
)
render() { echo "s/__VER__/$1/g; s|__UPSTREAM__|${UPSTREAM[$1]}|g; s|__SHA_AMD__|${SHA_AMD[$1]}|g; s|__SHA_ARM__|${SHA_ARM[$1]}|g"; }
