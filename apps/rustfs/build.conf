# rustfs: installs the official prebuilt per-arch musl binary (zip). rustfs has no
# stable release yet (now on the 1.0.0-beta.10-preview.N line), so latest 3 = the 3
# newest previews. The image version uses an apk-valid form (1.0.0_beta10_preN,
# preview.N -> _preN) while the GitHub release tag is 1.0.0-beta.10-preview.N
# (UPSTREAM map). Per-arch sha256 via SHA_AMD/SHA_ARM.
FROM_SOURCE=1
VERSIONS=(1.0.0_beta10_pre3 1.0.0_beta10_pre4 1.0.0_beta10_pre5)
declare -A UPSTREAM=(
  [1.0.0_beta10_pre3]=1.0.0-beta.10-preview.3
  [1.0.0_beta10_pre4]=1.0.0-beta.10-preview.4
  [1.0.0_beta10_pre5]=1.0.0-beta.10-preview.5
)
declare -A SHA_AMD=(
  [1.0.0_beta10_pre3]=5f2078d82e211a81481e1379eada20ca27bc0a0aad5cb67d6190e71022539bac
  [1.0.0_beta10_pre4]=f90bfd67aac833325e9bed3c10a754168e669f5049a495ccba4647a5d35e4d27
  [1.0.0_beta10_pre5]=c92318b5f354353dcd583542d6938a78370aafd4f0b847d9e58a33337b37c1ae
)
declare -A SHA_ARM=(
  [1.0.0_beta10_pre3]=5a87468667dd6a49367f2d53075af0772855c25af74aefe97c7037708305719f
  [1.0.0_beta10_pre4]=959a7c5b4891710559db59a3d2983eac5410604664d2205439c7ec4b9bd4fd10
  [1.0.0_beta10_pre5]=b5cf46c07de63c74ab5a03ff45c9a4c42126208b179eaeac3ee709b1345879dc
)
render() { echo "s/__VER__/$1/g; s|__UPSTREAM__|${UPSTREAM[$1]}|g; s|__SHA_AMD__|${SHA_AMD[$1]}|g; s|__SHA_ARM__|${SHA_ARM[$1]}|g"; }
