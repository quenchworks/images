# rustfs: installs the official prebuilt per-arch musl binary (zip). rustfs has no stable
# release yet (now on the 1.0.0-beta.12 line), so latest 3 = the 3 newest RELEASES:
# beta.12 > beta.11 > beta.10. The image version uses an apk-valid form (beta.N -> _betaN,
# preview.N -> trailing _pN post-release) while the GitHub release tag is the dashed
# 1.0.0-beta.N[-preview.N] (UPSTREAM map). apk sorts the _pN preview ABOVE its plain beta
# (post-release), so beta12 > beta11 > beta10 (verified with `apk version -t`, and all three
# entries pass `apk version -c`). Per-arch sha256 via SHA_AMD/SHA_ARM, taken from the
# release's own SHA256SUMS and re-verified against the downloaded zips.
#
# 2026-07-30 — DROPPED the two `-preview.N` entries (1.0.0_beta12_p1 and 1.0.0_beta11_p1):
# both 404 (curl exit 22) because upstream publishes preview builds as GIT TAGS ONLY. The
# tags 1.0.0-beta.12-preview.1 and 1.0.0-beta.11-preview.1 still exist, but their GitHub
# RELEASES (and therefore the rustfs-linux-<arch>-musl-v<tag>.zip assets the recipe fetches)
# are gone — `gh api /repos/rustfs/rustfs/releases` lists no preview newer than
# 1.0.0-beta.10-preview.3. scripts/check/rustfs.py reads TAGS, not releases, so it will keep
# proposing preview versions; only accept one after confirming the release has assets.
# Replaced them with the next two real releases (beta.11, beta.10) to keep the window at 3.
FROM_SOURCE=1
VERSIONS=(1.0.0_beta10 1.0.0_beta11 1.0.0_beta12)
declare -A UPSTREAM=(
  [1.0.0_beta10]=1.0.0-beta.10
  [1.0.0_beta11]=1.0.0-beta.11
  [1.0.0_beta12]=1.0.0-beta.12
)
declare -A SHA_AMD=(
  [1.0.0_beta10]=900c4ef4a3e3ace2696437b1c3b4e26a6bda935eddcbb772d8f9075627316d56
  [1.0.0_beta11]=137bcb49d94b19d0796884959e3b884e4c5b701c441ac0a55ecadcd32c0d2320
  [1.0.0_beta12]=683bef16247ab04bedb76d0444736f286d21943375d2d57d2ded9ec277498427
)
declare -A SHA_ARM=(
  [1.0.0_beta10]=f785ce1d3a7dd5a86a58c1649f94bac6a98052d2c42c53199b13e30fd833c98f
  [1.0.0_beta11]=5e9f6a38fb878d4bc3328359a73d55988e778728919e1ed9befbfec6d84cbddd
  [1.0.0_beta12]=1a6425145977c55a05549aa72f9af5bd314893a7424e352bfe852fe68fc2b50c
)
render() { echo "s/__VER__/$1/g; s|__UPSTREAM__|${UPSTREAM[$1]}|g; s|__SHA_AMD__|${SHA_AMD[$1]}|g; s|__SHA_ARM__|${SHA_ARM[$1]}|g"; }
