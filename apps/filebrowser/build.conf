# File Browser (filebrowser/filebrowser): from-source via melange. Image-only (a
# web file manager, no chart). Latest patch of the last 3 releases (2.63.15,
# 2.63.16, 2.63.17 -- upstream is on a single 2.63.x patch line). Go backend
# (single static binary, CGO disabled) that go:embeds a Vite/Vue web UI, so the
# frontend is (re)built with pnpm+Node in the build sandbox first (see
# melange.yaml). Version is stamped via -X on
# github.com/filebrowser/filebrowser/v2/version.Version (upstream tags carry a
# "v" prefix; the stamped version is the bare X.Y.Z).
FROM_SOURCE=1
VERSIONS=(2.63.22 2.63.23)
declare -A SHA256=(
  [2.63.22]=fa753df37df9e2b8fa5e38b8bf22a5242fa122bfdf3a7f5ad796885fbb224440
  [2.63.23]=18020983f6a4e43d679738738c3f95c52a333a282144046ec152491f2341a152
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
