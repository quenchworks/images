# Packages MediaWiki (releases.wikimedia.org) for Wolfi. The release tarball is the
# finished application: PHP sources plus a resolved composer vendor/ tree, so there
# is nothing to compile. We fetch mediawiki-<VER>.tar.gz, verify its sha256, and
# install it as the docroot at /var/www/html. PHP-FPM, its extensions and nginx
# come from Wolfi (apko.yaml); this package lays down the app tree and the runtime
# wiring (nginx config, php-fpm pool + php.ini overrides, supervisord, entrypoint).
#
# Configuration: MediaWiki reads LocalSettings.php from $MW_CONFIG_FILE when set,
# so the chart mounts it outside the read-only docroot. Without one, the front page
# links to the web installer at /mw-config/.
package:
  name: quench-mediawiki
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened MediaWiki (PHP), served by a Wolfi PHP-FPM + nginx runtime"
  copyright:
    - license: GPL-2.0-or-later   # MediaWiki core is GPL-2.0-or-later (COPYING)

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      # composer + the runtime's PHP line, for the vendor float below. Composer
      # checks every locked package's ext-* requirements, so the build carries
      # the same extension set the image runs with.
      - composer
      - php-8.3
      - php-8.3-ctype
      - php-8.3-ctype-config
      - php-8.3-mbstring
      - php-8.3-mbstring-config
      - php-8.3-openssl
      - php-8.3-openssl-config
      - php-8.3-phar
      - php-8.3-phar-config
      - php-8.3-curl
      - php-8.3-curl-config
      - php-8.3-iconv
      - php-8.3-iconv-config
      - php-8.3-zip
      - php-8.3-zip-config
      - php-8.3-dom
      - php-8.3-dom-config
      - php-8.3-xml
      - php-8.3-xml-config
      - php-8.3-xmlreader
      - php-8.3-xmlreader-config
      - php-8.3-xmlwriter
      - php-8.3-xmlwriter-config
      - php-8.3-simplexml
      - php-8.3-simplexml-config
      - php-8.3-fileinfo
      - php-8.3-fileinfo-config
      - php-8.3-intl
      - php-8.3-intl-config
      - php-8.3-sodium
      - php-8.3-sodium-config
      - php-8.3-calendar
      - php-8.3-calendar-config
      - php-8.3-gmp
      - php-8.3-gmp-config
      - php-8.3-bcmath
      - php-8.3-bcmath-config

pipeline:
  # Keep the top-level mediawiki-<VER>/ (strip 0): the workspace also holds
  # melange-out, so the install step must copy the named directory, not ./.
  - uses: fetch
    with:
      uri: https://releases.wikimedia.org/mediawiki/__LINE__/mediawiki-${{package.version}}.tar.gz
      expected-sha256: __SHA256__
      strip-components: "0"

  - name: Install the MediaWiki tree as the docroot at /var/www/html
    runs: |
      set -eu
      app="${{targets.destdir}}/var/www/html"
      install -d -m 0755 "$app"
      cp -a "mediawiki-${{package.version}}/." "$app/"
      test -f "$app/index.php"
      test -f "$app/api.php"
      test -f "$app/maintenance/run.php"
      grep -q "define( 'MW_VERSION', '${{package.version}}' )" "$app/includes/Defines.php"
      # Shellbox ships the pip requirements for its SEPARATE syntaxhighlight
      # container (a Pygments pin). No Python and no Pygments are installed here:
      # it is a build input for another image, and the scanner reads it as an
      # installed package. SyntaxHighlight in this image shells out to a
      # pygmentize binary that is not present, so nothing loads this file.
      rm -f "$app/vendor/wikimedia/shellbox/syntaxhighlight/requirements.txt"
      # Scribunto bundles prebuilt Lua 5.1.5 interpreters for x86_64 and i386 only:
      # third-party binaries no scanner can see into, the i386 one pulls in a
      # so:ld-linux.so.2 dependency Wolfi cannot solve, and there is no aarch64
      # build. Scribunto ships disabled; enabling it needs a Lua 5.1 binary, which
      # Wolfi does not package (only luajit, which Scribunto does not support).
      rm -rf "$app/extensions/Scribunto/includes/Engines/LuaStandalone/binaries"
      # images/ (uploads) is the one writable app path at runtime; apko owns it to 1001.
      install -d -m 0755 "$app/images"

  # The release vendor/ is a composer project of its own (composer.json + lock,
  # classmap-authoritative), so a fixed library goes in with a targeted
  # `composer update` that regenerates the authoritative classmap. Copying files
  # over would leave new classes unloadable. Only packages a line actually ships
  # are floated; composer refuses the update if the set is incoherent with the
  # rest of the lock, and never floats anything not named here.
  #   guzzlehttp/guzzle 7.15.2: CVE-2026-69246 (HIGH), -69245, -67339, -67353,
  #     -67354, -67355. 7.15.2 needs promises >=2.5.1 and psr7 >=2.13, so those
  #     float with it (the newest 2.x of each).
  #   web-auth/webauthn-lib 5.3.5: GHSA-gq4g-fpc9-vjfq; the lowest fix, because
  #     5.3.9 would also drag cbor-php and cose-lib forward.
  - name: Float vendored libraries to their fixed releases
    runs: |
      set -eu
      cd "${{targets.destdir}}/var/www/html/vendor"
      export COMPOSER_ALLOW_SUPERUSER=1 COMPOSER_NO_INTERACTION=1 COMPOSER_HOME=/tmp/composer-home
      want="guzzlehttp/guzzle:7.15.2 guzzlehttp/psr7:2.13.1 guzzlehttp/promises:2.5.3 web-auth/webauthn-lib:5.3.5"
      specs=""; names=""
      for spec in $want; do
        n="${spec%%:*}"
        grep -q "\"$n\"" composer.json || continue
        specs="$specs $spec"; names="$names $n"
      done
      composer require --no-update --no-plugins --no-scripts $specs
      composer update --no-plugins --no-scripts --no-dev --optimize-autoloader $names
      # Assert what the scanner will read: every floated package is at or above
      # its floor in installed.json, the file the autoloader was built from.
      for spec in $specs; do
        php -r '$w=$argv[1]; [$n,$v]=explode(":",$w); $j=json_decode(file_get_contents("composer/installed.json"),true);
          foreach(($j["packages"]??$j) as $p){ if($p["name"]===$n){ $have=ltrim($p["version"],"v");
            if(version_compare($have,$v,"<")){fwrite(STDERR,"$n $have below $v\n"); exit(1);} echo "$n $have\n"; exit(0);} }
          fwrite(STDERR,"$n missing after update\n"); exit(1);' "$spec"
      done
      rm -rf /tmp/composer-home

  - name: Install the nginx site config (FastCGI to php-fpm, port 8080, /var/www/html)
    runs: |
      set -eu
      destdir="${{targets.destdir}}"
      install -d "$destdir/etc/mediawiki/conf.d"
      # Run via `nginx -c /etc/mediawiki/nginx.conf`; /etc/nginx/nginx.conf belongs
      # to the Wolfi nginx package. Nonroot and read-only-rootfs friendly: no user
      # directive, pid and temp paths under /tmp, logs to stdout/stderr.
      cat > "$destdir/etc/mediawiki/nginx.conf" <<'EOF'
      worker_processes auto;
      pid /tmp/nginx.pid;
      error_log /dev/stderr warn;

      events {
          worker_connections 1024;
      }

      http {
          include       /etc/nginx/mime.types;
          default_type  application/octet-stream;
          access_log    /dev/stdout;

          client_body_temp_path /tmp/nginx-client-body;
          proxy_temp_path       /tmp/nginx-proxy;
          fastcgi_temp_path     /tmp/nginx-fastcgi;
          uwsgi_temp_path       /tmp/nginx-uwsgi;
          scgi_temp_path        /tmp/nginx-scgi;

          sendfile      on;
          tcp_nopush    on;
          keepalive_timeout 65;
          server_tokens off;
          # Matches upload_max_filesize/post_max_size in the php.ini below.
          client_max_body_size 64m;

          server {
              listen 8080 default_server;
              listen [::]:8080 default_server;
              server_name _;

              root  /var/www/html;
              index index.php;
              charset utf-8;

              location = /favicon.ico { access_log off; log_not_found off; }
              location ~ /\.(?!well-known).* { deny all; }

              # Never reachable over HTTP: CLI scripts, the file cache, the tests.
              location ^~ /maintenance/ { return 403; }
              location ^~ /cache/       { return 403; }
              location ^~ /tests/       { return 403; }
              # Uploads are served as files. ^~ stops the regex match below, so an
              # uploaded .php is returned as bytes and never executed.
              location ^~ /images/ {
                  try_files $uri =404;
                  add_header X-Content-Type-Options nosniff;
              }

              # Short URLs: with $wgArticlePath = "/wiki/$1" MediaWiki parses the
              # original REQUEST_URI, so the rewrite only has to reach index.php.
              location /wiki/ {
                  rewrite ^/wiki/(?<pagename>.*)$ /index.php;
              }
              location /rest.php/ {
                  try_files $uri $uri/ /rest.php?$query_string;
              }
              location / {
                  try_files $uri $uri/ /index.php?$query_string;
              }

              location ~ \.php$ {
                  try_files $uri =404;
                  include        /etc/nginx/fastcgi_params;
                  fastcgi_split_path_info ^(.+\.php)(/.+)$;
                  fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
                  fastcgi_param  PATH_INFO $fastcgi_path_info;
                  fastcgi_index  index.php;
                  fastcgi_pass   127.0.0.1:9000;
                  fastcgi_buffers 16 16k;
                  fastcgi_buffer_size 32k;
                  fastcgi_read_timeout 300;
              }

              location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
                  expires 30d;
                  log_not_found off;
                  access_log off;
              }

              # Chart drop-in server-level config (ConfigMap mounts land here).
              include /etc/mediawiki/conf.d/*.conf;
          }
      }
      EOF
      : > "$destdir/etc/mediawiki/conf.d/.keep.conf"

  - name: Install the php-fpm pool + php.ini overrides for nonroot / read-only rootfs
    runs: |
      set -eu
      destdir="${{targets.destdir}}"
      install -d "$destdir/etc/php/php-fpm.d"
      install -d "$destdir/etc/php/conf.d"

      # The Wolfi php pool config (www.conf) sets user/group = nobody and zz-apko.conf
      # pins listen to [::]:9000. A nonroot master (uid 1001) can't setuid workers, so
      # the user/group directives are ignored with a warning (fine). This zzz- override
      # (loaded last) pins the listen socket back to 127.0.0.1:9000 (what nginx
      # FastCGI-passes to), keeps the master in the foreground and logs to stderr.
      cat > "$destdir/etc/php/php-fpm.d/zzz-mediawiki.conf" <<'EOF'
      [global]
      daemonize = no
      error_log = /proc/self/fd/2

      [www]
      listen = 127.0.0.1:9000
      catch_workers_output = yes
      decorate_workers_output = no
      clear_env = no
      pm = dynamic
      pm.max_children = 16
      pm.start_servers = 2
      pm.min_spare_servers = 1
      pm.max_spare_servers = 4
      access.log = /proc/self/fd/2
      EOF

      # MediaWiki runtime PHP tuning: sane upload/memory limits, opcache on, sessions +
      # upload scratch under /tmp (writable tmpfs on a read-only rootfs), errors to
      # stderr (captured by supervisord), expose_php off.
      cat > "$destdir/etc/php/conf.d/zzz-mediawiki.ini" <<'EOF'
      expose_php = Off
      memory_limit = 256M
      apc.enable = 1
      apc.shm_size = 64M
      upload_max_filesize = 64M
      post_max_size = 64M
      max_execution_time = 300
      max_input_time = 300
      max_input_vars = 3000
      sys_temp_dir = /tmp
      upload_tmp_dir = /tmp
      session.save_path = /tmp
      error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
      display_errors = Off
      log_errors = On
      error_log = /proc/self/fd/2
      opcache.enable = 1
      opcache.enable_cli = 0
      opcache.memory_consumption = 128
      opcache.max_accelerated_files = 10000
      opcache.revalidate_freq = 2
      EOF

  - name: Install the supervisord config + container entrypoint
    runs: |
      set -eu
      destdir="${{targets.destdir}}"
      install -d "$destdir/etc/mediawiki"
      install -d "$destdir/usr/bin"

      # supervisord runs php-fpm (on 127.0.0.1:9000) + nginx (on :8080) as the two
      # always-on programs. It lives at /etc/mediawiki/supervisord.conf (NOT
      # /etc/supervisord.conf, which the Wolfi supervisor-config package owns and would
      # collide in apko's solve). Nonroot-friendly: pid + sock under /tmp, logs to
      # stdout. The entrypoint points supervisord at this file explicitly.
      cat > "$destdir/etc/mediawiki/supervisord.conf" <<'EOF'
      [supervisord]
      nodaemon=true
      logfile=/dev/stdout
      logfile_maxbytes=0
      pidfile=/tmp/supervisord.pid

      [unix_http_server]
      file=/tmp/supervisor.sock

      [supervisorctl]
      serverurl=unix:///tmp/supervisor.sock

      [rpcinterface:supervisor]
      supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

      [program:php-fpm]
      command=/usr/bin/php-fpm --nodaemonize --fpm-config /etc/php/php-fpm.conf
      autostart=true
      autorestart=true
      priority=10
      stdout_logfile=/dev/stdout
      stdout_logfile_maxbytes=0
      stderr_logfile=/dev/stderr
      stderr_logfile_maxbytes=0

      [program:nginx]
      command=/usr/sbin/nginx -c /etc/mediawiki/nginx.conf -g "daemon off;"
      autostart=true
      autorestart=true
      priority=20
      stdout_logfile=/dev/stdout
      stdout_logfile_maxbytes=0
      stderr_logfile=/dev/stderr
      stderr_logfile_maxbytes=0
      EOF

      # Container entrypoint: create the writable scratch dirs nginx + php need under
      # /tmp (emptyDir/tmpfs on a read-only rootfs), then exec supervisord as PID 1.
      cat > "$destdir/usr/bin/mediawiki-entrypoint.sh" <<'EOF'
      #!/bin/sh
      set -eu
      # nginx temp paths + pid, php sessions/uploads all live under /tmp.
      mkdir -p /tmp/nginx-client-body /tmp/nginx-proxy /tmp/nginx-fastcgi \
               /tmp/nginx-uwsgi /tmp/nginx-scgi 2>/dev/null || true
      exec supervisord -c /etc/mediawiki/supervisord.conf
      EOF
      chmod 0755 "$destdir/usr/bin/mediawiki-entrypoint.sh"

  - name: Sanity-check the assembled tree
    runs: |
      set -eu
      destdir="${{targets.destdir}}"
      test -f "$destdir/var/www/html/index.php"
      test -d "$destdir/var/www/html/vendor"
      test ! -e "$destdir/var/www/html/vendor/wikimedia/shellbox/syntaxhighlight/requirements.txt"
      # no prebuilt ELF may remain anywhere in the app tree
      if find "$destdir/var/www/html" -type f -exec sh -c 'head -c4 "$1" | grep -q ELF' _ {} \; -print | grep -q .; then
        echo "prebuilt ELF binaries left in the app tree" >&2; exit 1
      fi
      test -f "$destdir/etc/mediawiki/nginx.conf"
      test -f "$destdir/etc/php/php-fpm.d/zzz-mediawiki.conf"
      test -f "$destdir/etc/php/conf.d/zzz-mediawiki.ini"
      test -f "$destdir/etc/mediawiki/supervisord.conf"
      test -x "$destdir/usr/bin/mediawiki-entrypoint.sh"
