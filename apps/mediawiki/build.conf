# mediawiki (the wiki engine behind Wikipedia): the official release tarball from
# releases.wikimedia.org, served by a Wolfi PHP-FPM + nginx runtime. The tarball is
# finished PHP with its composer vendor/ tree already resolved, so there is nothing
# to compile and FROM_SOURCE stays unset (like wordpress).
#
# Lines: 1.43 is the LTS (EOL 2027-12), 1.45 legacy stable (EOL 2026-12), 1.46 the
# current stable (EOL 2027-07). 1.44 went obsolete on 2026-07-31 and is skipped,
# per https://www.mediawiki.org/wiki/Version_lifecycle. PHP 8.3 meets every line's
# composer.json floor (1.43 >=8.1, 1.45 >=8.2, 1.46 >=8.3).
# Each sha256 is from a download of the tarball on 2026-09-26.
VERSIONS=(1.43.9 1.45.4 1.46.0)
declare -A SHA256=(
  [1.43.9]=4595f8cfd39f1c4b5278ec43836c6720586e639518aa76a1db4b5532a3955ee6
  [1.45.4]=cb7c824468eb5a511a72f08e6291d09dc8af12e0a0ffdc2532ee3f76bb0cad7c
  [1.46.0]=ac395e4ffd3b63b86a242efd679257503e463445ba9f989b514d9d3b342c456a
)
render() { echo "s/__VER__/$1/g; s/__LINE__/${1%.*}/g; s|__SHA256__|${SHA256[$1]}|g"; }
