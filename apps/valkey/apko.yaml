# Assembles the runtime image from our own package plus the Wolfi base.
# No Dockerfile. Minimal, nonroot, multi-arch, SBOM generated by apko.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub            # our package signing key, generated in CI
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"          # melange output from the build step
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-valkey@local

accounts:
  groups:
    - groupname: valkey
      gid: 1001
  users:
    - username: valkey
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/bin/valkey-server

work-dir: /data

paths:
  - path: /data
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o755

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-valkey"
  org.opencontainers.image.licenses: "BSD-3-Clause"
