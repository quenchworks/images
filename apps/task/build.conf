# task (go-task/task, MIT): a task runner and simpler make alternative driven by Taskfile.yml.
# Image only, no chart. Images issue #67.
#
# Pure Go (CGO off) from ./cmd/task; the version comes from the embedded
# internal/version/version.txt. Commands run through task's built-in shell interpreter
# (mvdan.cc/sh), so plain commands need no /bin/sh. Floats: the house golang.org/x floor,
# go-jose 4.1.6 and the otel 1.47 train.
FROM_SOURCE=1
VERSIONS=(3.54.0)
declare -A SHA256=(
  [3.54.0]=d9e92770c2c18f135701431d04bb24fb77b5f13464699683892bdfc0b26f2eb8
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
