# mimir: from-source via melange (Go build from the grafana/mimir git tag tarball).
# NEWEST-ONLY: just the latest Mimir release. Upstream tags are `mimir-X.Y.Z`
# (no leading "v"). Each release pins its source tarball by sha256.
#
# STATUS: BLOCKED (do not publish) — the melange sandbox is offline and has no git.
#   Any `go get ...` in module mode (needed to float the 0-CVE gate set: x/net,
#   x/text, google.golang.org/grpc@v1.82.1 for GHSA-hrxh-6v49-42gf HIGH) forces MVS
#   to re-resolve github.com/grafana/dskit@v0.0.0-20260505171221-7f6e6a43e255, a git
#   pseudo-version → "unable to resolve git version: exec: git not found in $PATH".
#   Confirmed 2026-07-23: fails identically with the grpc float AND with the prior
#   x/net-only float, so the recipe cannot self-heal in-sandbox. Un-block when the
#   coherent float set no longer drags a pseudo-version dep (e.g. upstream tags dskit
#   to a real semver, or git+network is available to the melange build sandbox).
FROM_SOURCE=1
BLOCKED=1  # offline sandbox lacks git; go get re-resolves dskit git pseudo-version — see STATUS above
VERSIONS=(3.1.2)
declare -A SHA256=(
  [3.1.2]=06fdcbe3d101ee41553beac56a238c2286eccffb92440c3c50cc8397eab1a5ab
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
