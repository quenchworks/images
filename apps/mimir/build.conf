# mimir: from-source via melange (Go build from the grafana/mimir git tag tarball).
# NEWEST-ONLY: just the latest Mimir release. Upstream tags are `mimir-X.Y.Z`
# (no leading "v"). Each release pins its source tarball by sha256.
#
# STATUS: UNBLOCKED 2026-08-27. The previous note (2026-07-23) said the blocker was
#   structural -- "the melange sandbox is offline and has no git", so no `go get` could
#   ever run and the recipe could not self-heal. That was half right and led to the
#   wrong conclusion. The sandbox is NOT offline: the Go module proxy is reachable, and
#   every other Go recipe in this catalog floats modules through it without git. What
#   the sandbox lacks is only the git binary.
#
#   The real blocker was mimir-specific and self-inflicted by upstream's tarball:
#   mimir's source tree ships its own `.config/go/env` containing
#       GOPRIVATE=github.com/grafana/*
#   melange extracts the tarball into the build workspace /home/build, which IS $HOME,
#   so that file lands exactly where `go` looks for its user config file and takes
#   effect. GOPRIVATE implies GONOPROXY+GONOSUMDB, so every github.com/grafana/* module
#   -- dskit, mimir-prometheus, memberlist, go-yaml, regexp, mimir-otlptranslator --
#   was fetched by cloning with git instead of from the proxy, hence
#       github.com/grafana/dskit@v0.0.0-20260505171221-7f6e6a43e255: unable to resolve
#       git version: exec: "git": executable file not found in $PATH
#   The dskit pseudo-version was a red herring: it resolves fine through the proxy. No
#   sibling grafana tarball (loki, tempo, pyroscope) ships that file, which is why only
#   mimir hit this.
#
#   Fix (melange.yaml): `export GOPRIVATE= GONOPROXY= GONOSUMDB=` -- the environment
#   outranks go's config file -- plus `rm -f .config/go/env`. Nothing in this build
#   needs private access, and clearing it RESTORES checksum-database verification for
#   those modules rather than weakening anything. No git build dependency added. With
#   module mode working, the recipe now carries the canonical coherent float set
#   (docs/go-module-float.md): x/net v0.58.0, x/text v0.41.0, x/crypto v0.55.0,
#   x/sys v0.47.0, x/mod v0.40.0, grpc v1.82.1, as a FLOOR with the shipped-binary
#   assertion, replacing the old lone hardcoded `go get golang.org/x/net@v0.58.0`.
#
#   Gate 2026-08-27, x86_64: "✅ 0 fixable CVEs" (wolfi 0, gobinary usr/bin/mimir 0).
#   Boot test passed: mimir 3.1.2, nonroot uid 1001, read-only rootfs, /ready 200,
#   /metrics 200. aarch64 melange build also succeeded with the same recipe.
FROM_SOURCE=1
BLOCKED=0
VERSIONS=(3.1.2)
declare -A SHA256=(
  [3.1.2]=06fdcbe3d101ee41553beac56a238c2286eccffb92440c3c50cc8397eab1a5ab
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
