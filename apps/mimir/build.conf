# mimir: from-source via melange (Go build from the grafana/mimir git tag tarball).
# NEWEST-ONLY: just the latest Mimir release. Upstream tags are `mimir-X.Y.Z`
# (no leading "v"). Each release pins its source tarball by sha256.
#
# STATUS 2026-08-27: UNBLOCKED. 0 fixable CVEs on BOTH arches.
#   The old note (below, kept for the record) diagnosed this as unfixable: "the melange
#   sandbox is offline and has no git", so any `go get` forced MVS to re-resolve
#   grafana/dskit's git pseudo-version and died with "exec: git not found in $PATH".
#   The symptom was real; the cause was not the sandbox.
#
#   Mimir's own source tree ships `.config/go/env` containing
#   GOPRIVATE=github.com/grafana/* — a convenience for Grafana staff whose grafana/*
#   repos are partly private. melange extracts the tarball into the very directory Go
#   treats as its user config location, so that file took effect during our build.
#   GOPRIVATE implies GONOPROXY, which tells Go to bypass the module proxy and fetch
#   github.com/grafana/dskit DIRECTLY over git — hence the git error. Nothing about the
#   sandbox needed to change: clearing GOPRIVATE/GONOPROXY/GONOSUMDB and removing
#   .config/go/env lets the proxy serve the pseudo-version like any other module.
#
#   The float then applies normally, and the compile still runs -mod=vendor: `go get`
#   in module mode followed by `go mod vendor` when anything moved. `go mod tidy` is
#   deliberately skipped — it would raise the go directive above Wolfi's go-1.26 and
#   break GOTOOLCHAIN=local.
#
#   Gate: `0 fixable CVEs` on x86_64 and aarch64.
#   Lesson worth keeping: a build failure inside a hermetic sandbox is not proof the
#   sandbox is at fault. Upstream source can carry its own Go environment.
#
# --- superseded 2026-07-23 note, kept so the reasoning trail survives ---
# OLD: BLOCKED (do not publish) — the melange sandbox is offline and has no git.
#   Any `go get ...` in module mode forces MVS to re-resolve
#   github.com/grafana/dskit@v0.0.0-20260505171221-7f6e6a43e255, a git pseudo-version
#   → "unable to resolve git version: exec: git not found in $PATH". (Correct symptom,
#   wrong cause: see above.)
FROM_SOURCE=1
BLOCKED=0  # unblocked 2026-08-27 — the blocker was mimir's own .config/go/env, see STATUS above
VERSIONS=(3.1.2)
declare -A SHA256=(
  [3.1.2]=06fdcbe3d101ee41553beac56a238c2286eccffb92440c3c50cc8397eab1a5ab
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
