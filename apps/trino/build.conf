# trino: the Trino distributed SQL engine, assembled from upstream's official release
# assets (trino-server-core tarball + per-connector plugin zips from the GitHub
# release; Maven Central stopped publishing trino-server after 476). Java 25 on
# Wolfi's openjdk-25. Trino ships one release line, so latest only.
# The bundled airlift launcher (Go, stale stdlib) is rebuilt from source at the tag
# airbase pins (dep.launcher.version). See melange.yaml for what is left out.
VERSIONS=(483)
declare -A SHA256=(
  [483]=3ec8804eff1ac82a7e493aac9b974e0fc87368392b02bf2551f509cecb03f5c9
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
