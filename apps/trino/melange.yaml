# Assembles Trino from upstream's release assets. Nothing in the engine is rebuilt:
#   - trino-server-core-<v>.tar.gz: the engine (lib/) and the core plugins
#   - connector plugins: upstream's default container catalogs (jmx, memory,
#     tpcds, tpch) plus postgresql and iceberg, each from its release zip;
#     iceberg's bundled netty, httpclient5 and libthrift are swapped for fixed
#     releases from Maven Central
#   - bin/linux-<arch>/launcher: airlift launcher 318 (the version airbase 395
#     pins), rebuilt from source with the current Go toolchain
# Left out, with the reason:
#   - plugin/exchange-filesystem and plugin/spooling-filesystem: fault-tolerant
#     execution and the spooling protocol on S3/Azure/GCS. They are the only
#     carriers of every jar finding in the core (netty 4.2.16, httpclient5 5.6.2).
#   - bin/darwin-*, linux-ppc64le and the other arch's binaries.
#   - libjvmkill.so (upstream's image adds it from a separate image);
#     -XX:+ExitOnOutOfMemoryError in jvm.config covers the same case.
package:
  name: quench-trino
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Trino, assembled from upstream release assets on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - openjdk-25-default-jvm
      # brotli4j (Jetty's Brotli compression) loads a native library linked to it
      - libstdc++

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - curl
      - go

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/trinodb/trino/releases/download/${{package.version}}/trino-server-core-${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      set -eu
      V=${{package.version}}
      R=https://github.com/trinodb/trino/releases/download/$V
      dest="${{targets.destdir}}/usr/lib/trino"
      mkdir -p "$dest"
      cp -a lib plugin secrets-plugin NOTICE README.txt "$dest/"
      rm -rf "$dest/plugin/exchange-filesystem" "$dest/plugin/spooling-filesystem"

      # Connector plugins. sha256 from each asset's download (they match the
      # digests GitHub publishes on the release).
      plug() {
        curl -fsSL -o "/tmp/$1.zip" "$R/trino-$1-$V.zip"
        echo "$2  /tmp/$1.zip" | sha256sum -c -
        unzip -q "/tmp/$1.zip" -d /tmp/plug
        mv "/tmp/plug/trino-$1-$V" "$dest/plugin/$1"
      }
      plug jmx d28d6182227a87c1459504d405a8c9f0d7d9a847bf40a4e1ccbc2a673e6f5ca9
      plug memory 267d46f0c80790e1cd7390b5d1831eeef604bf319e9be066a165684f86451544
      plug postgresql 04eaa15357b5d3e74783d098ab2ebb570e2e1fe069cc3c128f28916e81e41650
      plug tpcds 902f4d866babc32c7a7148433174d2f397bea5cc8e9a46031735a1df28d01ca6
      plug tpch 303d89111e6ed671074bd54d9967d3a18a99d7510c26ac7b0c342abe26d76fe0
      plug iceberg 59b4b9c5013b6df4b4459583aff6f4cb97c40cab9edf8d133dca04ea869b1140
      # jackson-databind 2.22.1 (CVE-2026-68497/-19032/-83557) (and tools.jackson 3.2.1) sit in lib/ and
      # every plugin; 2.22.3 and 3.2.3 fix them and CVE-2026-91776/-91777. Content swap, filename kept.
      jd=$(mktemp)
      curl -fsSL -o "$jd" https://repo1.maven.org/maven2/com/fasterxml/jackson/core/jackson-databind/2.22.3/jackson-databind-2.22.3.jar
      echo "556db5439e206114346043f68d200497dc96a0bca62a360a81784092ebd0e0a9  $jd" | sha256sum -c -
      jd3=$(mktemp)
      curl -fsSL -o "$jd3" https://repo1.maven.org/maven2/tools/jackson/core/jackson-databind/3.2.3/jackson-databind-3.2.3.jar
      echo "235b72436af983857e44efa42449f4f0a2c571e69d6c5d9dd1253ae7d192dcf2  $jd3" | sha256sum -c -
      # the name prefix varies (group-prefixed in most plugins, bare in others), so match the suffix
      test -n "$(find "$dest" -name '*jackson-databind-2.22.1.jar')" || { echo "databind 2.22.1 missing; dist moved"; exit 1; }
      test -n "$(find "$dest" -name '*jackson-databind-3.2.1.jar')" || { echo "databind 3.2.1 missing; dist moved"; exit 1; }
      chmod 644 "$jd" "$jd3"  # mktemp is 0600, cp copies the mode, and uid 1001 could not read the jars
      find "$dest" -name '*jackson-databind-2.22.1.jar' -exec cp "$jd" {} \;
      find "$dest" -name '*jackson-databind-3.2.1.jar' -exec cp "$jd3" {} \;
      rm -f "$jd" "$jd3"
      # iceberg bundles netty 4.2.16 (CVE-2026-75595 CRITICAL and three more),
      # httpclient5 5.6.2 and libthrift 0.23.0. The whole netty family moves to
      # 4.2.17 together; natives for other operating systems are dropped.
      ice="$dest/plugin/iceberg"
      jswap() {  # <old jar> <maven group path> <artifact> <version> <new jar name> <sha256>
        test -f "$ice/$1" || { echo "swap target $1 missing"; exit 1; }
        rm "$ice/$1"
        curl -fsSL -o "$ice/$5" "https://repo1.maven.org/maven2/$2/$3/$4/$5"
        echo "$6  $ice/$5" | sha256sum -c -
      }
      jswap 'io.netty_netty-all-4.2.16.Final.jar' io/netty netty-all 4.2.17.Final netty-all-4.2.17.Final.jar fd66659c35601336df8c3586bfc504549bbedce29755dac6572287f9443c4237
      jswap 'io.netty_netty-buffer-4.2.16.Final.jar' io/netty netty-buffer 4.2.17.Final netty-buffer-4.2.17.Final.jar 0d249178ec0204b35a6ad3e5ac8a6c2ecb3eb496c6cdae40b8eca4fa3cb6a0c7
      jswap 'io.netty_netty-codec-4.2.16.Final.jar' io/netty netty-codec 4.2.17.Final netty-codec-4.2.17.Final.jar ac76f972446a2f72818441f746d0e73c58519a4687bf680d2b687d7dc5e28e2e
      jswap 'io.netty_netty-codec-base-4.2.16.Final.jar' io/netty netty-codec-base 4.2.17.Final netty-codec-base-4.2.17.Final.jar 3b92bc3b7d231fa6f4889b2b9281cae6b634428b8121fb1b9b5fccba1543d352
      jswap 'io.netty_netty-codec-classes-quic-4.2.16.Final.jar' io/netty netty-codec-classes-quic 4.2.17.Final netty-codec-classes-quic-4.2.17.Final.jar 542e718fdd8fa4f6d57bef9f91a5fa01200940cb8b381fd4c21fb5c170276c71
      jswap 'io.netty_netty-codec-compression-4.2.16.Final.jar' io/netty netty-codec-compression 4.2.17.Final netty-codec-compression-4.2.17.Final.jar 425b287a1f36986a5c8edd76379a49decdf99d284f3454f3fa607a073bfb2c18
      jswap 'io.netty_netty-codec-dns-4.2.16.Final.jar' io/netty netty-codec-dns 4.2.17.Final netty-codec-dns-4.2.17.Final.jar 394f4649a824683735f28b299d0a48caff059ae30e654e2abf8b3f392af4d374
      jswap 'io.netty_netty-codec-haproxy-4.2.16.Final.jar' io/netty netty-codec-haproxy 4.2.17.Final netty-codec-haproxy-4.2.17.Final.jar 6650894f9c429fc29ad7876092a25cc973e8435d13fa70c0e48aab1ca73a6d37
      jswap 'io.netty_netty-codec-http2-4.2.16.Final.jar' io/netty netty-codec-http2 4.2.17.Final netty-codec-http2-4.2.17.Final.jar 450af97424cf58d2d72ad4d476d9e290f2fdf69fa181c289a6e6dd176bb86a7b
      jswap 'io.netty_netty-codec-http3-4.2.16.Final.jar' io/netty netty-codec-http3 4.2.17.Final netty-codec-http3-4.2.17.Final.jar 9fcf9873e31b2899c407b42d320aaf6afeb69807e63d9a865c391b4339fa24c7
      jswap 'io.netty_netty-codec-http-4.2.16.Final.jar' io/netty netty-codec-http 4.2.17.Final netty-codec-http-4.2.17.Final.jar a5bde91ac82ab90579df6559c0bd7ea6ae37460e3f18116ab4122194283b3669
      jswap 'io.netty_netty-codec-marshalling-4.2.16.Final.jar' io/netty netty-codec-marshalling 4.2.17.Final netty-codec-marshalling-4.2.17.Final.jar ee5ffed638da6b7e2b4567559bd5f78b18f635cdaa4f3b6d23aa27ccf6cb57c2
      jswap 'io.netty_netty-codec-memcache-4.2.16.Final.jar' io/netty netty-codec-memcache 4.2.17.Final netty-codec-memcache-4.2.17.Final.jar 7627b976a405de4169d972acf7e170a4dfc27d5a0d6e5e2bcc41ea2cb5f6fef9
      jswap 'io.netty_netty-codec-mqtt-4.2.16.Final.jar' io/netty netty-codec-mqtt 4.2.17.Final netty-codec-mqtt-4.2.17.Final.jar 420ddb6d8135165f8755804230033d6b1093da146169c30eb36dbac3ed3b394d
