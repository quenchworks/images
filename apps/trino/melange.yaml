# Assembles Trino from upstream's release assets. Nothing in the engine is rebuilt:
#   - trino-server-core-<v>.tar.gz: the engine (lib/) and the core plugins
#   - connector plugins: upstream's default container catalogs (jmx, memory,
#     tpcds, tpch) plus postgresql and iceberg, each from its release zip;
#     iceberg's bundled netty, httpclient5 and libthrift are swapped for fixed
#     releases from Maven Central
#   - bin/linux-<arch>/launcher: airlift launcher 318 (the version airbase 395
#     pins), rebuilt from source with the current Go toolchain
# Left out, with the reason:
#   - plugin/exchange-filesystem and plugin/spooling-filesystem: fault-tolerant
#     execution and the spooling protocol on S3/Azure/GCS. They are the only
#     carriers of every jar finding in the core (netty 4.2.16, httpclient5 5.6.2).
#   - bin/darwin-*, linux-ppc64le and the other arch's binaries.
#   - libjvmkill.so (upstream's image adds it from a separate image);
#     -XX:+ExitOnOutOfMemoryError in jvm.config covers the same case.
package:
  name: quench-trino
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Trino, assembled from upstream release assets on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - openjdk-25-default-jvm
      # brotli4j (Jetty's Brotli compression) loads a native library linked to it
      - libstdc++

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - curl
      - go
      - maven-3.9               # regenerate iceberg's relocated guava and parquet-jackson (see below)
      - unzip                   # unzip -Z1 (busybox unzip has no -Z)
      - openjdk-25-default-jdk
      - python-3                # parquet-jackson merge (zipfile)

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/trinodb/trino/releases/download/${{package.version}}/trino-server-core-${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      set -eu
      V=${{package.version}}
      R=https://github.com/trinodb/trino/releases/download/$V
      dest="${{targets.destdir}}/usr/lib/trino"
      mkdir -p "$dest"
      cp -a lib plugin secrets-plugin NOTICE README.txt "$dest/"
      rm -rf "$dest/plugin/exchange-filesystem" "$dest/plugin/spooling-filesystem"

      # Connector plugins. sha256 from each asset's download (they match the
      # digests GitHub publishes on the release).
      plug() {
        curl -fsSL -o "/tmp/$1.zip" "$R/trino-$1-$V.zip"
        echo "$2  /tmp/$1.zip" | sha256sum -c -
        unzip -q "/tmp/$1.zip" -d /tmp/plug
        mv "/tmp/plug/trino-$1-$V" "$dest/plugin/$1"
      }
      case "$V" in
        483)
          plug jmx d28d6182227a87c1459504d405a8c9f0d7d9a847bf40a4e1ccbc2a673e6f5ca9
          plug memory 267d46f0c80790e1cd7390b5d1831eeef604bf319e9be066a165684f86451544
          plug postgresql 04eaa15357b5d3e74783d098ab2ebb570e2e1fe069cc3c128f28916e81e41650
          plug tpcds 902f4d866babc32c7a7148433174d2f397bea5cc8e9a46031735a1df28d01ca6
          plug tpch 303d89111e6ed671074bd54d9967d3a18a99d7510c26ac7b0c342abe26d76fe0
          plug iceberg 59b4b9c5013b6df4b4459583aff6f4cb97c40cab9edf8d133dca04ea869b1140 ;;
        484)
          plug jmx 807fa774bd7529c10d0d1bac7f7de33c63407bb1a11301a61fbb1344a0fe6645
          plug memory 719161889876e5504f845239608a6899ba8c8f0ac3617fa3739fd90df71b24d9
          plug postgresql c1caca9fe09e17dbbefb93653df582ca87941bff03b1af7dc935837dc9d0376f
          plug tpcds c8be35c857811818598bfe1f5603a0b4dfbce8455d1abab0beaf9304651b92b3
          plug tpch c21c0cc1781da630343efe27088e83a09550695c2cb6ecd0250e6534209cd538
          plug iceberg eba73e90f063cd4cdc376af1f517e3314b568b250561ab51e817bd342497639a ;;
        *) echo "no plugin sha256 for $V"; exit 1 ;;
      esac
      # 483 only: 484 already ships jackson 2.22.3 (no tools.jackson 3.x), lz4-java 1.12.0,
      # netty 4.2.19, httpclient5 5.6.5, libthrift 0.25.0 and snowflake-jdbc-thin 4.4.0
      # (listed from the 484 core tarball and plugin zips, 2026-10-19). The gate scans both.
      M=https://repo1.maven.org/maven2
      if [ "$V" = 483 ]; then
      # jackson-databind 2.22.1 (CVE-2026-68497/-19032/-83557) (and tools.jackson 3.2.1) sit in lib/ and
      # every plugin; 2.22.3 and 3.2.3 fix them and CVE-2026-91776/-91777. jackson-core 2.22.1 and
      # tools core 3.2.1 carry CVE-2026-89407/-89425 (2026-10-04), fixed at the same versions.
      # Content swap, filename kept; the name prefix varies (group-prefixed in most plugins, bare
      # in others), so match the suffix. lz4-java 1.11.1 -> 1.11.4 (CVE-2026-106449..106453) rides
      # the same loop: 1.11.4 has the identical file list and module name (diffed against 1.11.1).
      for spec in "jackson-databind-2.22.1.jar com/fasterxml/jackson/core/jackson-databind/2.22.3/jackson-databind-2.22.3.jar 556db5439e206114346043f68d200497dc96a0bca62a360a81784092ebd0e0a9" \
                  "jackson-databind-3.2.1.jar tools/jackson/core/jackson-databind/3.2.3/jackson-databind-3.2.3.jar 235b72436af983857e44efa42449f4f0a2c571e69d6c5d9dd1253ae7d192dcf2" \
                  "jackson-core-2.22.1.jar com/fasterxml/jackson/core/jackson-core/2.22.3/jackson-core-2.22.3.jar 8a501126a385b25841915d839508f8a66e2a0dbc8a6709d055ef3b3e852b094c" \
                  "jackson-core-3.2.1.jar tools/jackson/core/jackson-core/3.2.3/jackson-core-3.2.3.jar a0c17e7e665a5e95c82f5fb45c0fec2ae3dc556c80f0016452c9c84cd23f3817" \
                  "lz4-java-1.11.1.jar at/yawk/lz4/lz4-java/1.11.4/lz4-java-1.11.4.jar 58c8e0b813960d2a248e050c353baea73139b48a2ffc55382d42c69707e17325" ; do
        set -- $spec
        test -n "$(find "$dest" -name "*$1")" || { echo "$1 missing; dist moved"; exit 1; }
        j=$(mktemp)
        curl -fsSL -o "$j" "$M/$2"
        echo "$3  $j" | sha256sum -c -
        chmod 644 "$j"  # mktemp is 0600, cp copies the mode, and uid 1001 could not read the jars
        find "$dest" -name "*$1" -exec cp "$j" {} \;
        rm -f "$j"
      done
      fi
      # Every version from here to the next 483 block. guava -> 33.7.2-jre (CVE-2026-102554; 483 ships
      # 33.6.0, 484's keystore secrets plugin 33.7.1) and snappy-java -> 1.1.10.9 (483's iceberg ships
      # 1.1.10.8): content swap with the filename kept, only copies older than the fix.
      lift() {  # <find -name glob> <sed giving the version from the file name> <fixed> <maven path> <sha256>
        find "$dest" -name "$1" > /tmp/lift.list
        while IFS= read -r j; do
          v="$(basename "$j" | sed -E "$2")"
          [ "$(printf '%s\n%s\n' "$v" "$3" | sort -V | head -1)" = "$3" ] && continue
          n="/tmp/lift-$3.jar"
          [ -f "$n" ] || { curl -fsSL -o "$n" "$M/$4"; echo "$5  $n" | sha256sum -c - >/dev/null; chmod 644 "$n"; }
          cp "$n" "$j"; echo "  $j <- $3"
        done < /tmp/lift.list
      }
      lift '*guava-[0-9]*-jre.jar' 's/.*guava-([0-9.]+)-jre\.jar$/\1/' 33.7.2 com/google/guava/guava/33.7.2-jre/guava-33.7.2-jre.jar b530942257fb935f8b2cfaa5f8eb5bd59c555fd8e8d01b8ce98912e077ea606c
      lift '*snappy-java-1.1.10.*.jar' 's/.*snappy-java-([0-9.]+)\.jar$/\1/' 1.1.10.9 org/xerial/snappy/snappy-java/1.1.10.9/snappy-java-1.1.10.9.jar 35228628442e4b9797681c7cbd3b26594f6da3379159dbd0cb07094ed3aece0d
      # OpenTelemetry core moves as ONE set to 1.67.0 (the opentelemetry-api fix): the 1.x SDK
      # reaches into api internals that move between releases (1.67 moved api.internal.ConfigUtil
      # into opentelemetry-common). Content swap with the filename kept, like the loop above.
      # instrumentation, semconv and the alpha exporter-prometheus are not in the set.
      otel167() { case "$1" in
          api) echo "1.67.0 538d1dff2f9a37aecbc0ef98fd17273a3affb058e734e6763a3a07a38a5fdc59" ;;
          api-incubator) echo "1.67.0-alpha fea3d78726e49620168c3f6194ff491edfd1ec89b2df06fd5d5b73e55d74a342" ;;
          common) echo "1.67.0 da97bdb395418e16ecdcbe7ad3497f45b9e767ceda4ae7e86133e7a757ac377f" ;;
          context) echo "1.67.0 40fb813fb5e27ec2691daa29c81b572b5b1541ef9b41e62490c3ee3e6407c55e" ;;
          exporter-common) echo "1.67.0 eb61aab6d20bf105102dfa061b478b659cec17e82a50969898046456768ba09b" ;;
          exporter-otlp) echo "1.67.0 6724a9c8f9f42de757682c6194c48d9fee4670cd19a85c37954eba526c58b836" ;;
          exporter-otlp-common) echo "1.67.0 75530ab4d93e6fdef478d3e112713337625e70a63df357e6e7b9060c13788015" ;;
          sdk) echo "1.67.0 52a8f599a368a3d62185e37053f6a53175d6fbe3ecc1d565baba13b1a854267f" ;;
          sdk-common) echo "1.67.0 628a4c00db9561ff4c608a650d5e7fd66a1e153ccdf1ba3cdc5ac0b7c6518fea" ;;
          sdk-extension-autoconfigure) echo "1.67.0 09021cf4e41f081e11e1c00577fe03b98db0ae7fd5f73eaf4020e760fa0edb7e" ;;
          sdk-extension-autoconfigure-spi) echo "1.67.0 41eb19f6caf2c655ac3139d331f5c34283f2efdb0f0b0e58765a6cc9e27f66bc" ;;
          sdk-logs) echo "1.67.0 dd0f0b625e08787af49d7e270abc6def4c2eabc2f18f5f145b7924024a3311e3" ;;
          sdk-metrics) echo "1.67.0 c157ff10da59a87a57e5236d9f3290792d9b749433be5e5b449a7d1604c320a9" ;;
          sdk-trace) echo "1.67.0 14d9615c8a5dcf471dcbb74902b771dcfa8656b755ac38dce904042289ccd198" ;;
          exporter-sender-okhttp) echo "1.67.0 0ccb54e5e1db24680b0b7b818299552477dcc7114de7ca0f7b054e6e20958b83" ;;
          sdk-testing) echo "1.67.0 c3d74c825e423e7bf28f0e3f22f10bbf7fe3b00984d0d9ea6ef1327b05c274e2" ;;
          *) return 1 ;;
        esac; }
      find "$dest" -name '*opentelemetry-*.jar' > /tmp/otel.list
      while IFS= read -r j; do
        b="$(basename "$j" .jar)"; b="opentelemetry-${b##*opentelemetry-}"
        a="$(echo "$b" | sed -E 's/^opentelemetry-(.+)-[0-9]+\.[0-9]+\.[0-9]+(-alpha)?$/\1/')"
        v="$(echo "$b" | sed -E 's/^.*-([0-9]+\.[0-9]+\.[0-9]+)(-alpha)?$/\1/')"
        r="$(otel167 "$a")" || continue; set -- $r
        [ "$(printf '%s\n1.67.0\n' "$v" | sort -V | head -1)" = 1.67.0 ] && continue
        n="/tmp/opentelemetry-$a-$1.jar"
        [ -f "$n" ] || { curl -fsSL -o "$n" "$M/io/opentelemetry/opentelemetry-$a/$1/opentelemetry-$a-$1.jar"; echo "$2  $n" | sha256sum -c - >/dev/null; chmod 644 "$n"; }
        cp "$n" "$j"; echo "  $j <- $a $1"
      done < /tmp/otel.list
      grep -q . /tmp/otel.list || { echo "no opentelemetry jars found; dist moved"; exit 1; }
      # iceberg bundles netty 4.2.16 (CVE-2026-75595 CRITICAL and three more),
      # httpclient5 5.6.2 and libthrift 0.23.0. The whole netty family moves to
      # 4.2.17 together; natives for other operating systems are dropped.
      ice="$dest/plugin/iceberg"
      # iceberg-bundled-guava (1.11.0: guava 33.6.0, 1.12.0: 33.7.1, + failureaccess) is relocated to
      # org.apache.iceberg.relocated.com.google.common, so a plain jar swap cannot reach it,
      # and CVE-2026-102554 (CompactHashMap/CompactHashSet/MapMakerInternalMap readObject) is
      # in it. No Iceberg release ships 33.7.2 yet (1.12.0 bundles 33.7.1; main bumped it on
      # 2026-10-11). Regenerate the jar from guava 33.7.2-jre with the same relocation via
      # maven-shade; upstream's is a minimized subset, so the full set is a superset of what
      # iceberg links. Iceberg's own anchor class GuavaClasses is carried over, filename kept.
      ibg="$(find "$ice" -name '*iceberg-bundled-guava-*.jar')"
      test "$(echo "$ibg" | grep -c .)" -eq 1 || { echo "expected one iceberg-bundled-guava jar: $ibg"; exit 1; }
      export JAVA_HOME=/usr/lib/jvm/java-25-openjdk PATH="/usr/lib/jvm/java-25-openjdk/bin:$PATH"
      mkdir -p /tmp/ibg && cat > /tmp/ibg/pom.xml <<'POM'
      <project xmlns="http://maven.apache.org/POM/4.0.0">
        <modelVersion>4.0.0</modelVersion>
        <groupId>quench</groupId><artifactId>ibg</artifactId><version>1</version>
        <dependencies>
          <dependency><groupId>com.google.guava</groupId><artifactId>guava</artifactId><version>33.7.2-jre</version></dependency>
          <dependency><groupId>com.google.guava</groupId><artifactId>failureaccess</artifactId><version>1.0.3</version></dependency>
        </dependencies>
        <build><plugins><plugin>
          <groupId>org.apache.maven.plugins</groupId><artifactId>maven-shade-plugin</artifactId><version>3.6.2</version>
          <executions><execution><phase>package</phase><goals><goal>shade</goal></goals><configuration>
            <createDependencyReducedPom>false</createDependencyReducedPom>
            <artifactSet><includes><include>com.google.guava:guava</include><include>com.google.guava:failureaccess</include></includes></artifactSet>
            <filters><filter><artifact>*:*</artifact><excludes>
              <exclude>com/google/thirdparty/**</exclude><exclude>META-INF/versions/9/module-info.class</exclude>
            </excludes></filter></filters>
            <relocations><relocation><pattern>com.google.common</pattern><shadedPattern>org.apache.iceberg.relocated.com.google.common</shadedPattern></relocation></relocations>
          </configuration></execution></executions>
        </plugin></plugins></build>
      </project>
      POM
      (cd /tmp/ibg && mvn -B -q -C -Dmaven.repo.local=/tmp/m2 package)
      echo "b530942257fb935f8b2cfaa5f8eb5bd59c555fd8e8d01b8ce98912e077ea606c  /tmp/m2/com/google/guava/guava/33.7.2-jre/guava-33.7.2-jre.jar" | sha256sum -c -
      (cd /tmp/ibg && unzip -q "$ibg" org/apache/iceberg/GuavaClasses.class && jar uf target/ibg-1.jar org/apache/iceberg/GuavaClasses.class)
      v="$(unzip -p /tmp/ibg/target/ibg-1.jar META-INF/maven/com.google.guava/guava/pom.properties | sed -n 's/^version=//p')"
      [ "$v" = 33.7.2-jre ] || { echo "regenerated bundle reports guava $v"; exit 1; }
      ! unzip -Z1 /tmp/ibg/target/ibg-1.jar | grep -q '^com/google/common/' || { echo "unrelocated guava in the bundle"; exit 1; }
      unzip -Z1 /tmp/ibg/target/ibg-1.jar | grep -qx 'org/apache/iceberg/relocated/com/google/common/util/concurrent/internal/InternalFutureFailureAccess.class'
      cp /tmp/ibg/target/ibg-1.jar "$ibg"; chmod 644 "$ibg"
      # parquet-jackson (484 iceberg: 1.18.1, the newest) shades jackson-core/databind 2.22.2 under
      # shaded.parquet (CVE-2026-89407/-89425/-91776/-91777, fixed 2.22.3). Re-shade 2.22.3 with the same
      # relocation into the original jar: its pom, manifest, licenses and module-info stay. maven-shade
      # 3.6.2 rewrites multi-release classes but leaves their paths unrelocated, so the merge moves them
      # under shaded/parquet. Upstream's copy is the full jackson set (class lists diffed, 2026-11-02).
      find "$dest" -name '*parquet-jackson-*.jar' > /tmp/pj.list
      while IFS= read -r pj; do
        v="$(unzip -p "$pj" META-INF/maven/com.fasterxml.jackson.core/jackson-databind/pom.properties | sed -n 's/^version=//p')"
        [ "$(printf '%s\n2.22.3\n' "$v" | sort -V | head -1)" = 2.22.3 ] && continue
        if [ ! -f /tmp/pj/target/pj-1.jar ]; then
          mkdir -p /tmp/pj && cat > /tmp/pj/pom.xml <<'POM'
      <project xmlns="http://maven.apache.org/POM/4.0.0">
        <modelVersion>4.0.0</modelVersion>
        <groupId>quench</groupId><artifactId>pj</artifactId><version>1</version>
        <dependencies>
          <dependency><groupId>com.fasterxml.jackson.core</groupId><artifactId>jackson-databind</artifactId><version>2.22.3</version></dependency>
        </dependencies>
        <build><plugins><plugin>
          <groupId>org.apache.maven.plugins</groupId><artifactId>maven-shade-plugin</artifactId><version>3.6.2</version>
          <executions><execution><phase>package</phase><goals><goal>shade</goal></goals><configuration>
            <createDependencyReducedPom>false</createDependencyReducedPom>
            <artifactSet><includes><include>com.fasterxml.jackson.core:*</include></includes></artifactSet>
            <relocations><relocation><pattern>com.fasterxml.jackson</pattern><shadedPattern>shaded.parquet.com.fasterxml.jackson</shadedPattern></relocation></relocations>
            <transformers><transformer implementation="org.apache.maven.plugins.shade.resource.ServicesResourceTransformer"/></transformers>
          </configuration></execution></executions>
        </plugin></plugins></build>
      </project>
      POM
          (cd /tmp/pj && mvn -B -q -C -Dmaven.repo.local=/tmp/m2 package)
          echo "556db5439e206114346043f68d200497dc96a0bca62a360a81784092ebd0e0a9  /tmp/m2/com/fasterxml/jackson/core/jackson-databind/2.22.3/jackson-databind-2.22.3.jar" | sha256sum -c -
          echo "8a501126a385b25841915d839508f8a66e2a0dbc8a6709d055ef3b3e852b094c  /tmp/m2/com/fasterxml/jackson/core/jackson-core/2.22.3/jackson-core-2.22.3.jar" | sha256sum -c -
        fi
        python3 -I - "$pj" /tmp/pj/target/pj-1.jar <<'PY'
      import os, re, sys, zipfile
      old, new = sys.argv[1], sys.argv[2]
      def mine(n):
          if n.startswith("META-INF/versions/"): return "/module-info.class" not in n
          return n.startswith(("shaded/parquet/", "META-INF/maven/com.fasterxml.jackson.core/", "META-INF/services/shaded.parquet."))
      with zipfile.ZipFile(old) as zo, zipfile.ZipFile(new) as zn, zipfile.ZipFile(old + ".new", "w", zipfile.ZIP_DEFLATED) as w:
          for e in zo.infolist():
              if not mine(e.filename): w.writestr(e, zo.read(e.filename))
          for e in zn.infolist():
              n = re.sub(r"^(META-INF/versions/\d+/)com/fasterxml/", r"\1shaded/parquet/com/fasterxml/", e.filename)
              if mine(n) and not n.endswith("/"): w.writestr(n, zn.read(e.filename))
      os.replace(old + ".new", old)
      PY
        chmod 644 "$pj"
        [ "$(unzip -p "$pj" META-INF/maven/com.fasterxml.jackson.core/jackson-databind/pom.properties | sed -n 's/^version=//p')" = 2.22.3 ]
        ! unzip -Z1 "$pj" | grep -qE '^com/fasterxml/|^META-INF/versions/[0-9]+/com/' || { echo "unrelocated jackson in $pj"; exit 1; }
        echo "  $pj <- shaded jackson 2.22.3"
      done < /tmp/pj.list
      if [ "$V" = 483 ]; then
      jswap() {  # <old jar> <maven group path> <artifact> <version> <new jar name> <sha256>
        test -f "$ice/$1" || { echo "swap target $1 missing"; exit 1; }
        rm "$ice/$1"
        curl -fsSL -o "$ice/$5" "https://repo1.maven.org/maven2/$2/$3/$4/$5"
        echo "$6  $ice/$5" | sha256sum -c -
      }
