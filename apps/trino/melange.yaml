      jswap 'io.netty_netty-codec-native-quic-4.2.16.Final-linux-x86_64.jar' io/netty netty-codec-native-quic 4.2.17.Final netty-codec-native-quic-4.2.17.Final-linux-x86_64.jar 9225b069850e2238126359b6d3ad00df1c8c528ce5123682b8090c09ec37bdbf
      jswap 'io.netty_netty-codec-protobuf-4.2.16.Final.jar' io/netty netty-codec-protobuf 4.2.17.Final netty-codec-protobuf-4.2.17.Final.jar 44b2fcc4bc1d6c01edafe6ae6c8a7de7c3c5bad59697a93b6b879a45a78a5387
      jswap 'io.netty_netty-codec-redis-4.2.16.Final.jar' io/netty netty-codec-redis 4.2.17.Final netty-codec-redis-4.2.17.Final.jar 7d72146f09c2e63be307a6a24516e1bc208bc345328b9c59540da131ccf5754c
      jswap 'io.netty_netty-codec-smtp-4.2.16.Final.jar' io/netty netty-codec-smtp 4.2.17.Final netty-codec-smtp-4.2.17.Final.jar 32e30ffe89acda2a457f16cf6f8b366f58d0b4b025563803bb0854962b81de3c
      jswap 'io.netty_netty-codec-socks-4.2.16.Final.jar' io/netty netty-codec-socks 4.2.17.Final netty-codec-socks-4.2.17.Final.jar 6b5760cc512cee1f7515e25010892471f3995045f84cd6c1d1b6e6cee534733c
      jswap 'io.netty_netty-codec-stomp-4.2.16.Final.jar' io/netty netty-codec-stomp 4.2.17.Final netty-codec-stomp-4.2.17.Final.jar 179dd61246bbe15468032a071faa21d392bfeaff9341a80e5ce2b744e509e687
      jswap 'io.netty_netty-codec-xml-4.2.16.Final.jar' io/netty netty-codec-xml 4.2.17.Final netty-codec-xml-4.2.17.Final.jar c453be5dda52127ac82e4883cf03b3326741ff460a4ceebe9a54b23058537fb1
      jswap 'io.netty_netty-common-4.2.16.Final.jar' io/netty netty-common 4.2.17.Final netty-common-4.2.17.Final.jar 502aae2a6680e9bca3558a3fa098f06dc4d87340b8b714e925a6d690871c092a
      jswap 'io.netty_netty-handler-4.2.16.Final.jar' io/netty netty-handler 4.2.17.Final netty-handler-4.2.17.Final.jar 4df11c7520b556c5e2c84b939182699d48fcbb09e97a6bb5e1c0b6835227d126
      jswap 'io.netty_netty-handler-proxy-4.2.16.Final.jar' io/netty netty-handler-proxy 4.2.17.Final netty-handler-proxy-4.2.17.Final.jar 94089bea6ba6f3248725f2bf233aa2bc70ac1547c21b9bdfc7548f710a845aa0
      jswap 'io.netty_netty-handler-ssl-ocsp-4.2.16.Final.jar' io/netty netty-handler-ssl-ocsp 4.2.17.Final netty-handler-ssl-ocsp-4.2.17.Final.jar 6cf70966f679e58c9c5fcb3e85cac30ab112911bdfd0645522bb5ee15ceffc7f
      jswap 'io.netty_netty-resolver-4.2.16.Final.jar' io/netty netty-resolver 4.2.17.Final netty-resolver-4.2.17.Final.jar 7a4b599b9c0c29a505d3b7311f142df883fb27d0f67495a7cbaf533b0e456623
      jswap 'io.netty_netty-resolver-dns-4.2.16.Final.jar' io/netty netty-resolver-dns 4.2.17.Final netty-resolver-dns-4.2.17.Final.jar d332481c22136a68c2ee9e45e86212174932587d93a5dd4d201e196828bf9f91
      jswap 'io.netty_netty-transport-4.2.16.Final.jar' io/netty netty-transport 4.2.17.Final netty-transport-4.2.17.Final.jar d2409ce3a735cbab4188d0ea5d82abed823a6a07a8389f49af4a9e1243a562bc
      jswap 'io.netty_netty-transport-classes-epoll-4.2.16.Final.jar' io/netty netty-transport-classes-epoll 4.2.17.Final netty-transport-classes-epoll-4.2.17.Final.jar 4e21d8a2e3429d9de967a716d58119f57585786bd2f7213bf5b27770425269de
      jswap 'io.netty_netty-transport-classes-kqueue-4.2.16.Final.jar' io/netty netty-transport-classes-kqueue 4.2.17.Final netty-transport-classes-kqueue-4.2.17.Final.jar f0b2dd4757a22345b0b28e2856dc7ee44e5dea256cc520ddc27e4dce4ea9efb3
      jswap 'io.netty_netty-transport-native-epoll-4.2.16.Final-linux-aarch_64.jar' io/netty netty-transport-native-epoll 4.2.17.Final netty-transport-native-epoll-4.2.17.Final-linux-aarch_64.jar def0629c9e99f0d896e810d94252e5eb0227e3dd660a5ec8b7b4bbf3a8b25d41
      jswap 'io.netty_netty-transport-native-unix-common-4.2.16.Final.jar' io/netty netty-transport-native-unix-common 4.2.17.Final netty-transport-native-unix-common-4.2.17.Final.jar e01aa467b9104de54a57c08c290f70b22e53ec97cf5583c87c112170ef5832cc
      jswap 'io.netty_netty-transport-rxtx-4.2.16.Final.jar' io/netty netty-transport-rxtx 4.2.17.Final netty-transport-rxtx-4.2.17.Final.jar 2940945bcf9b249ebf06c1c2cefa9266eafdf4abd45dc178a9127e4824208bb0
      jswap 'io.netty_netty-transport-sctp-4.2.16.Final.jar' io/netty netty-transport-sctp 4.2.17.Final netty-transport-sctp-4.2.17.Final.jar 5345dabce2cbf10bc9c6a80a8d7beeaa4cd975028aa04f1903a96b8e440529f6
      jswap 'io.netty_netty-transport-udt-4.2.16.Final.jar' io/netty netty-transport-udt 4.2.17.Final netty-transport-udt-4.2.17.Final.jar bd3d40e949077dd0f0ba62e87db5f0f55afc8fab99d20450ec22c2b84267badb
      jswap 'i...y_netty-transport-native-epoll-4.2.16.Final-linux-x86_64.jar' io/netty netty-transport-native-epoll 4.2.17.Final netty-transport-native-epoll-4.2.17.Final-linux-x86_64.jar c295b1d7f46e3c7375c93fa4c8abcc3944398c5e4eb53e31587cbbf0bf559d4f
      jswap org.apache.httpcomponents.client5_httpclient5-5.6.2.jar org/apache/httpcomponents/client5 httpclient5 5.6.3 httpclient5-5.6.3.jar 80712ff129210d7c73d9fcc1195cbee5c3c34744965c7a05ea107b3648922f18
      jswap org.apache.thrift_libthrift-0.23.0.jar org/apache/thrift libthrift 0.24.0 libthrift-0.24.0.jar b72e321ff144e3e5211964764bd45794b96fdf250085f153c44416b35df89a07
      rm "$ice"/'io.netty_netty-codec-native-quic-4.2.16.Final-osx-aarch_64.jar'
      rm "$ice"/'io.netty_netty-codec-native-quic-4.2.16.Final-osx-x86_64.jar'
      rm "$ice"/'io.netty_netty-codec-native-quic-4.2.16.Final-windows-x86_64.jar'
      rm "$ice"/'io.netty_netty-resolver-dns-classes-macos-4.2.16.Final.jar'
      rm "$ice"/'io.netty_netty-resolver-dns-native-macos-4.2.16.Final-osx-aarch_64.jar'
      rm "$ice"/'io.netty_netty-resolver-dns-native-macos-4.2.16.Final-osx-x86_64.jar'
      rm "$ice"/'io.netty_netty-transport-native-epoll-4.2.16.Final-linux-riscv64.jar'
      rm "$ice"/'io.netty_netty-transport-native-kqueue-4.2.16.Final-osx-aarch_64.jar'
      rm "$ice"/'io...y_netty-transport-native-kqueue-4.2.16.Final-osx-x86_64.jar'
      ! ls "$ice" | grep -q 'netty.*4\.2\.16'

      # The launcher finds the install root by walking up from its own (resolved)
      # path to the directory holding bin/launcher, and preloads
      # bin/linux-<arch>/libprocname.so when present. Keep that layout: upstream's
      # bin/launcher script as the marker, this arch's libprocname.so, and the
      # rebuilt Go binary beside it.
      case "$(uname -m)" in x86_64) a=amd64 ;; aarch64) a=arm64 ;; esac
      mkdir -p "$dest/bin/linux-$a"
      cp bin/launcher bin/launcher.properties "$dest/bin/"
      cp "bin/linux-$a/libprocname.so" "$dest/bin/linux-$a/"
      curl -fsSL -o /tmp/launcher.tgz https://github.com/airlift/launcher/archive/refs/tags/318.tar.gz
      echo "b9293b91a04578caa67018dfb8eba6c6fd52f709e3a765e9d74a7e9027c90afd  /tmp/launcher.tgz" | sha256sum -c -
      tar xzf /tmp/launcher.tgz -C /tmp
      # x/text v0.33.0 (CVE-2026-56852) floats to the canonical v0.41.0 floor; the
      # grep asserts the float reached the binary.
      (cd /tmp/launcher-318/src/main/go \
        && GOTOOLCHAIN=local go get golang.org/x/text@v0.41.0 && go mod tidy \
        && CGO_ENABLED=0 GOTOOLCHAIN=local go build -trimpath \
             -ldflags "-s -w -X launcher/args.Version=318" \
             -o "$dest/bin/linux-$a/launcher" .)
      go version -m "$dest/bin/linux-$a/launcher" | grep -q "golang.org/x/text[[:space:]]*v0.41.0"
      # os.Executable resolves symlinks, so one arch-neutral entrypoint works.
      mkdir -p "${{targets.destdir}}/usr/bin"
      ln -s "../lib/trino/bin/linux-$a/launcher" "${{targets.destdir}}/usr/bin/trino-launcher"

      # Default config: upstream's container defaults (single-node coordinator,
      # the four default catalogs) without the jvmkill agent line, plus a
      # postgresql catalog left for the operator to add.
      etc="${{targets.destdir}}/etc/trino"
      mkdir -p "$etc/catalog"
      printf '%s\n' 'coordinator=true' 'node-scheduler.include-coordinator=true' \
        'http-server.http.port=8080' 'discovery.uri=http://localhost:8080' > "$etc/config.properties"
      printf '%s\n' 'node.environment=quench' 'node.data-dir=/data/trino' > "$etc/node.properties"
      printf '%s\n' -server -XX:InitialRAMPercentage=80 -XX:MaxRAMPercentage=80 \
        -XX:G1HeapRegionSize=32M -XX:+ExplicitGCInvokesConcurrent \
        -XX:+HeapDumpOnOutOfMemoryError -XX:+ExitOnOutOfMemoryError \
        -XX:-OmitStackTraceInFastThrow -XX:ReservedCodeCacheSize=256M \
        -XX:PerMethodRecompilationCutoff=10000 -XX:PerBytecodeRecompilationCutoff=10000 \
        -Djdk.attach.allowAttachSelf=true -Djdk.nio.maxCachedBufferSize=2000000 > "$etc/jvm.config"
      : > "$etc/log.properties"
      for c in jmx memory tpcds tpch; do echo "connector.name=$c" > "$etc/catalog/$c.properties"; done
