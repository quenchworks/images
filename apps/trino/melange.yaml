      jswap 'io.netty_netty-buffer-4.2.16.Final.jar' io/netty netty-buffer 4.2.17.Final netty-buffer-4.2.17.Final.jar 0d249178ec0204b35a6ad3e5ac8a6c2ecb3eb496c6cdae40b8eca4fa3cb6a0c7
      jswap 'io.netty_netty-codec-4.2.16.Final.jar' io/netty netty-codec 4.2.17.Final netty-codec-4.2.17.Final.jar ac76f972446a2f72818441f746d0e73c58519a4687bf680d2b687d7dc5e28e2e
      jswap 'io.netty_netty-codec-base-4.2.16.Final.jar' io/netty netty-codec-base 4.2.17.Final netty-codec-base-4.2.17.Final.jar 3b92bc3b7d231fa6f4889b2b9281cae6b634428b8121fb1b9b5fccba1543d352
      jswap 'io.netty_netty-codec-classes-quic-4.2.16.Final.jar' io/netty netty-codec-classes-quic 4.2.17.Final netty-codec-classes-quic-4.2.17.Final.jar 542e718fdd8fa4f6d57bef9f91a5fa01200940cb8b381fd4c21fb5c170276c71
      jswap 'io.netty_netty-codec-compression-4.2.16.Final.jar' io/netty netty-codec-compression 4.2.17.Final netty-codec-compression-4.2.17.Final.jar 425b287a1f36986a5c8edd76379a49decdf99d284f3454f3fa607a073bfb2c18
