# static: distroless/static equivalent (wolfi-baselayout + ca-certificates-bundle,
# no shell/apk/coreutils). No upstream version, so it is tagged by BUILD DATE
# (YYYYMMDD) -- a fixed, immutable tag, no :latest (per the no-latest policy).
# Single dated tag per build; bump VERSIONS on each rebuild.
FROM_SOURCE=0
VERSIONS=(20260621)
# test.sh takes its extra args from build-static.yml, which passes "" rather
# than the version. Mirrored here so the local gate matches CI.
boot_args() { echo ""; }
render() { :; }
