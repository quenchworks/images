# trilium: Trilium Notes (TriliumNext/Trilium, AGPL-3.0), hierarchical note-taking with rich text, code notes, scripting
# and sync. Images issue #100.
#
# From the release tag: pnpm install of the monorepo (Electron's download turned off, better-sqlite3's native build
# turned on), then apps/server's build: an esbuild bundle of the server, the client, assets and better-sqlite3. Node 24,
# SQLite in TRILIUM_DATA_DIR. LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(0.107.0)
declare -A SHA256=(
  [0.107.0]=011e22eeab44a9932a61f9dd749f850ac74f4e669d3ee3011f7a46f202eb41ca
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
