# plone: the Plone 6 backend (Products.CMFPlone with plone.restapi on Zope), the piece
# upstream ships as plone/plone-backend; not the Volto frontend. Installed into a venv on
# Wolfi python-3.13 from PyPI, pinned by the release's official constraints file
# (dist.plone.org/release/<v>/constraints.txt, sha256-pinned), served by waitress.
#
# Storage: ZODB FileStorage + blobs under /data by default; RelStorage on PostgreSQL
# (pg8000 driver) when PLONE_RELSTORAGE_DSN is set. The entrypoint creates the admin
# user and the site (plone.distribution, "volto" by default) on first boot.
#
# 0-CVE and what the scan cannot see: Pillow, lxml, cffi, pyyaml and rpds-py build from
# sdist (no bundled .libs, no static libxml2/libffi), rpds-py through cargo auditable
# (.dep-v0 asserted). pip is removed from the venv.
#
# Lines (measured 2026-10-14): 6.2 is current; 6.1 stopped with 6.2.0. 6.0 has security
# support to 2027 but its newest constraints (6.0.15, 2025-03) scan 31 fixable, need ~25
# floors (7 of them Plone core packages) and import pkg_resources, so setuptools cannot
# reach the CVE-2026-59890 fix (83.0.0 has no pkg_resources). 6.0 not shipped.
BLOCKED=0
FROM_SOURCE=0
VERSIONS=(6.2.2)
declare -A CSHA256=(
  [6.2.2]=3f1e15e64f855348d4767ac511c9ed964bf260a8070da98d50912b73877deda6
)
# floors over the constraints file (scan findings) plus the RelStorage pins
declare -A FLOORS=(
  [6.2.2]="PyJWT==2.15.1 urllib3==2.8.0 setuptools==84.0.0 rpds-py==2026.9.1 RelStorage==4.3.0 pg8000==1.31.5 certifi==2026.10.19 Pillow==13.0.0"
)
render() { echo "s/__VER__/$1/g; s|__CSHA256__|${CSHA256[$1]}|g; s|__FLOORS__|${FLOORS[$1]}|g"; }
