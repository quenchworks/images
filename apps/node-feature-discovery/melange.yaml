# node-feature-discovery from the release tag, cgo on (arm64 cpuid), with upstream's version and host-prefix flags.
package:
  name: quench-node-feature-discovery
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened node-feature-discovery, built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27
      - build-base

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/kubernetes-sigs/node-feature-discovery/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - runs: |
      set -eu
      export CGO_ENABLED=1 GOTOOLCHAIN=local GOFLAGS=-mod=mod
      # floors, raised only when below (a bare go get downgrades once upstream passes it); the
      # golang.org/x set moves together, as in the other recipes
      FLOOR="golang.org/x/crypto@v0.58.1-0.20261009181718-2f1f834330b2 golang.org/x/net@v0.62.0 golang.org/x/text@v0.43.0 golang.org/x/sys@v0.49.0"
      # CVE-2026-128085 (otel 1.47.0): floor every otel v1 module the build uses, as one family
      for m in $(go list -m -f '{{.Path}} {{.Version}}' all | awk '$1 ~ /^go\.opentelemetry\.io\/otel(\/|$)/ && $2 ~ /^v1\./ {print $1}'); do
        FLOOR="$FLOOR $m@v1.47.0"
      done
      need=""
      for f in $FLOOR; do
        have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${f%@*}")"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        [ "$(printf '%s\n%s\n' "$have" "${f#*@}" | sort -V | head -1)" = "${f#*@}" ] || need="$need $f"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || go get $need
      go mod tidy
      LDF="-s -w -X sigs.k8s.io/node-feature-discovery/pkg/version.version=v${{package.version}} -X sigs.k8s.io/node-feature-discovery/pkg/utils/hostpath.pathPrefix=/host-"
      for bin in nfd-master nfd-worker nfd-topology-updater nfd-gc kubectl-nfd nfd; do
        go build -trimpath -tags osusergo,netgo -ldflags "$LDF" -o "${{targets.destdir}}/usr/bin/$bin" ./cmd/$bin
      done
      # upstream's guard: without cgo the arm64 worker has no cpuid wrapper and labels no CPU features
      case "$(uname -m)" in
        aarch64)
          go build -tags osusergo,netgo -o /tmp/nfd-worker-guard ./cmd/nfd-worker
          go tool nm /tmp/nfd-worker-guard > /tmp/nm.txt
          grep -q 'source/cpu\._Cfunc_gethwcap' /tmp/nm.txt ;;
      esac
      "${{targets.destdir}}/usr/bin/nfd-master" -version 2>&1 | grep -F "v${{package.version}}"

test:
  pipeline:
    - runs: |
        nfd-master -version
