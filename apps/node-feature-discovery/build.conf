# Node Feature Discovery (labels nodes with hardware, kernel and OS features; NodeFeatureRule resources),
# from kubernetes-sigs/node-feature-discovery (Apache-2.0). From the release tag via melange: all six
# binaries in one image as upstream ships them (nfd-master, nfd-worker, nfd-gc, nfd-topology-updater,
# nfd, kubectl-nfd), with upstream's version and /host- mount-prefix flags. cgo is on: on arm64 the
# cpuid code calls glibc getauxval, and without cgo the worker builds but labels no CPU features.
# Linked dynamically against Wolfi glibc (upstream links -static). LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(0.20.1)
declare -A SHA256=(
  [0.20.1]=c55500d7fb4bea32fbbe864838dd1b2d9c48102f4d2ec8808b7901a353d4145e
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
