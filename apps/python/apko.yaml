# Assembles a hardened Python runtime/base image directly from Wolfi's own
# versioned python packages. No Dockerfile; the only melange build is the
# quench-pip-vendor-fix manifest shim (see melange.yaml) -- apko pulls the
# pinned `python-__VER__` package (plus its matching pip) straight from the
# Wolfi `os` repository, so each minor version is a pure package-assembly.
#
# IMAGE-ONLY -- no Helm chart. This is a LANGUAGE/BASE image: the 0-CVE, signed,
# nonroot, multi-arch answer to `python:3.x-slim`. Developers `FROM` it (like
# Chainguard's language images) or run scripts directly.
#
# TEMPLATE NOTE: `__VER__` is a build-time placeholder. CI substitutes the
# minor version (3.12 / 3.13 / 3.14) per matrix entry with `sed` before apko
# runs, so this single file covers every shipped version. To roll this pattern
# to another runtime, copy this file and swap the package names + entrypoint.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub          # generated by the melange keygen step in CI
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"        # the melange-built quench-pip-vendor-fix
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - python-__VER__            # the pinned CPython minor release from Wolfi
    - py__VER__-pip             # matching pip for this exact interpreter
    # Corrects pip's bundled manifests: drops the phantom vendored
    # setuptools==70.3.0 (CVE-2025-47273, CVE-2026-59890 -- pip ships NO
    # pip/_vendor/setuptools) and re-labels the stale CycloneDX msgpack 1.1.2
    # entry (GHSA-6v7p-g79w-8964) to the 1.2.1 that is actually on disk.
    # `@local` is a REPOSITORY PIN, not a version comparison: apko takes the
    # package from ./packages regardless of version. See melange.yaml -- it
    # fails the build the day pip stops needing either correction.
    - quench-pip-vendor-fix@local

accounts:
  groups:
    - groupname: nonroot
      gid: 1001
  users:
    - username: nonroot
      uid: 1001
      gid: 1001
  run-as: 1001

# Interpreter as the entrypoint: `docker run <img> script.py` or `-c '...'`.
# `python3` and `python3.__VER__` both resolve to this interpreter.
entrypoint:
  command: /usr/bin/python3

# HOME under a writable mount so pip / venvs work on a read-only rootfs.
environment:
  HOME: /home/nonroot
  PYTHONUNBUFFERED: "1"

work-dir: /home/nonroot

paths:
  - path: /home/nonroot
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o755

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-python"
  org.opencontainers.image.licenses: "PSF-2.0"
