# STATUS: UNBLOCKED 2026-09-20. Two separate things kept this blocked and
# neither is real any more.
#
# 1. The zlib wall was an expired advisory. Wolfi shipped the CVE-2026-85091
#    fix as zlib 1.3.2.1_rc20260601-r0 and the advisory was amended to name it,
#    so the 1.3.3-r0 the header below waited for is a number that will never
#    arrive. Same correction applied across the catalog on 2026-09-19.
#
# 2. The local gate REFUSED to run this recipe at all, which is why it stayed
#    blocked after the rest of the wave cleared. scripts/build-image.sh compared
#    the version apko installed against $VERSION, but this recipe's melange
#    package is the helper quench-pip-vendor-fix 2.0.0, whose version has
#    nothing to do with the python minor. The guard read "installed 2.0.0-r0,
#    targeting 3.14.7" and refused a correct build. Fixed by taking the expected
#    name AND version from the rendered melange file instead; the guard is now
#    stricter, since it pins the name too.
#
# Evidence, stated exactly as measured (x86_64, PUSH=0, 2026-09-20):
#   3.14.7   0 fixable CVEs, boot test passed
#   3.13.15  0 fixable CVEs, boot test passed
#   3.12.14  0 fixable CVEs, boot test passed
#   aarch64  NOT measured locally. CI gates both arches and refuses to publish
#            on any finding.
# STATUS: ZLIB-ONLY as of 2026-09-16. Measured, not assumed.
# Gate result on run 35097432048 (all 3 minors x both arches, 6/6 jobs): Total 1
# (CRITICAL 0, HIGH 0, MEDIUM 1), the single finding being zlib CVE-2026-85091 --
# the catalog-wide wall. Wolfi is at 1.3.2.1_rc20260601-r0, the advisory wants
# 1.3.3-r0, and upstream zlib has no 1.3.3 tag, so no apk version fixes it yet.
#
# Getting here took restoring the quench-pip-vendor-fix shim that a2dc77a
# deleted wholesale: pip's bundled manifests were reporting a phantom vendored
# setuptools 70.3.0 (CVE-2025-47273, CVE-2026-59890) and a stale CycloneDX
# msgpack 1.1.2 (GHSA-6v7p-g79w-8964). All 3 of those findings are gone; the
# Python python-pkg table now scans clean. Nothing in python itself is flagged.
#
# BLOCKED=1 skips build+merge. Clear it the week Wolfi ships zlib 1.3.3-r0; one
# rebuild should publish with no recipe change.
# python: apko-runtime from Wolfi's python-<minor> packages. Published tag = FULL
# version Wolfi resolves (latest 3 lines); render maps __VER__ -> the minor (the
# Wolfi package + pip suffix), workflow tags the full version.
#
# FROM_SOURCE=1 solely to build the quench-pip-vendor-fix manifest shim: pip's
# bundled vendor.txt / CycloneDX / SPDX / seed wheel claim a vendored
# setuptools==70.3.0 that pip does not ship, and pip's CycloneDX still claims
# msgpack 1.1.2 after the vendored code moved to 1.2.1. The shim corrects the
# manifests to match the filesystem; it touches no code. See melange.yaml --
# it fails the build the day pip stops needing either correction.
BLOCKED=0
FROM_SOURCE=1
# scripts/check-updates.py reports python-3.13 and python-3.14 as UPDATE to
# 3.13.15_git20260918 and 3.14.7_git20260918. Do NOT put those in VERSIONS. The
# _git suffix is Wolfi's build snapshot, not a Python version: measured
# 2026-09-20, the apk installed is python-3.13 3.13.15_git20260918-r1 and the
# interpreter reports "Python 3.13.15". The tag is already correct, and a plain
# rebuild takes the new apk with no recipe change.
#
# This is the opposite of jdk/jre and erlang, where the Wolfi version IS what the
# runtime reports (openjdk prints 25.0.4.1, erlang is OTP 29.1) and the tag has to
# follow. Check what the runtime prints before retagging either way.
VERSIONS=(3.12.14 3.13.15 3.14.7)
# test.sh takes its extra args from build-python.yml, which passes "${1%.*}" rather
# than the version. Mirrored here so the local gate matches CI; passing the
# version instead fails an image that runs fine.
boot_args() { echo "${1%.*}"; }
render() { local v="$1"; echo "s/__VER__/${v%.*}/g"; }
