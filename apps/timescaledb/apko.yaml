# Assembles the PostgreSQL 17 + TimescaleDB runtime image. No Dockerfile. Minimal,
# nonroot, multi-arch, SBOM by apko. PostgreSQL 17 comes from Wolfi; our package adds
# the timescaledb extension and the bootstrap entrypoint that preloads it and runs
# CREATE EXTENSION timescaledb CASCADE.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - tzdata
    - busybox                      # the bootstrap entrypoint needs a tiny shell
    - postgresql-17
    - postgresql-17-client
    - postgresql-17-contrib
    - python-3.13                  # interpreter for the Patroni venv (/opt/patroni/venv)
    - libgcc                       # C runtime for the psycopg / PyYAML manylinux wheels
    - glibc
    - quench-timescaledb@local     # carries the timescaledb extension and the bootstrap entrypoint

accounts:
  groups:
    - groupname: postgres
      gid: 1001
  users:
    - username: postgres
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/local/bin/docker-entrypoint.sh

environment:
  PGDATA: /var/lib/postgresql/data

work-dir: /var/lib/postgresql

paths:
  - path: /var/lib/postgresql
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o755
  - path: /var/lib/postgresql/data
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o700
  - path: /var/run/postgresql
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o755

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-timescaledb"
  org.opencontainers.image.licenses: "Apache-2.0"
