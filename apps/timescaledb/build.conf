# STATUS: UNBLOCKED 2026-09-20. The zlib block is gone: Wolfi shipped the fix
# for CVE-2026-85091 as zlib 1.3.2.1_rc20260601-r0 and the advisory was amended
# to name that version, so the 1.3.3-r0 this file used to wait for is a number
# that will never arrive. A stock wolfi-base scan reports the advisory as
# `zlib 1.3.2-r7 -> 1.3.2.1_rc20260601-r0`, which is what Wolfi publishes on
# both arches today. scripts/blocked.py now watches the shipped version.
#
# Evidence, stated exactly as measured:
#   x86_64  gated locally 2026-09-20, PUSH=0: 0 fixable CVEs AND the boot test
#           passed, so this is "runs", not just "scans clean".
#   aarch64 not measured locally; this host kills background melange builds and
#           a qemu-emulated arm build does not fit the foreground timeout. CI's
#           native arm64 runner is the first arm measurement, and its gate
#           refuses to publish on any finding.
# timescaledb: from-source via melange (PostgreSQL extension; time-series). Built
# Apache-only (-DAPACHE_ONLY=1, drops the TSL community-licensed code) against
# Wolfi's postgresql-17 and layered on top, like postgres-documentdb. The image
# version is the timescaledb extension version (e.g. 2.28.1). Tags are lightweight
# and point straight at the commit, so COMMIT pins each one (GitHub archive tarballs
# are not sha-stable; git-checkout + expected-commit is used for the same reason as
# documentdb). Latest 3 releases: the tail of the 2.28 line + the current 2.29.
#
# PG SUPPORT: 2.29.0 REMOVES PostgreSQL 15 and supports PG 16/17/18. We build against
# Wolfi's postgresql-17, which stays in range, so no runtime change is needed here.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(2.30.0)
declare -A COMMIT=(
  [2.30.0]=efbc0de6cbd3da0042723b03121067b11c4b2535
)
render() { echo "s/__VER__/$1/g; s/__COMMIT__/${COMMIT[$1]}/g"; }
