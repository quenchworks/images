# timescaledb: from-source via melange (PostgreSQL extension; time-series). Built
# Apache-only (-DAPACHE_ONLY=1, drops the TSL community-licensed code) against
# Wolfi's postgresql-17 and layered on top, like postgres-documentdb. The image
# version is the timescaledb extension version (e.g. 2.28.1). Tags are lightweight
# and point straight at the commit, so COMMIT pins each one (GitHub archive tarballs
# are not sha-stable; git-checkout + expected-commit is used for the same reason as
# documentdb). Latest 3 releases: the tail of the 2.28 line + the current 2.29.
#
# PG SUPPORT: 2.29.0 REMOVES PostgreSQL 15 and supports PG 16/17/18. We build against
# Wolfi's postgresql-17, which stays in range, so no runtime change is needed here.
FROM_SOURCE=1
VERSIONS=(2.29.2)
declare -A COMMIT=(
  [2.29.2]=165b77b9670b8f13103f9d3da733559d27ca4293
)
render() { echo "s/__VER__/$1/g; s/__COMMIT__/${COMMIT[$1]}/g"; }
