# kvrocks: Apache Kvrocks, a distributed key-value database on RocksDB that speaks the
# Redis protocol, built from the Apache source release like upstream's Dockerfile
# (clang, OpenSSL on, portable, release). Its CMake fetches and statically links its
# C/C++ dependencies at pinned versions.
#
# 0-CVE: Trivy cannot see statically linked C libraries, so the bundled set was checked
# by version on 2026-09-25: zlib-ng 2.3.3, lz4 1.10.0, zstd 1.5.7, snappy 1.2.2, rocksdb
# 11.8.1, libevent 2.1.13 (the release that fixes CVE-2026-63382..63388), jemalloc 5.4.0 (bumped
# from the pinned 5.3.1, which does not build against GCC 16's libstdc++),
# fmt 12.2.0, spdlog 1.17.0, oneTBB 2023.0.0. Each is at or past Wolfi's patched version
# of the same library, and OSV lists no open CVE for them. OpenSSL is Wolfi's, linked
# dynamically and scanned with the apk.
#
# NEWEST-ONLY: Kvrocks ships one supported line.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(2.17.0)
# sha256 of the Apache source release, from a download (its sha512 matches the
# published .sha512)
declare -A SHA256=(
  [2.17.0]=77db394e75c9cf62ec9ab6f4a5d278d99d872dbe9222343baf390c1a99807bdb
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
