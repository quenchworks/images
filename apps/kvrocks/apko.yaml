contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-kvrocks@local

accounts:
  groups:
    - groupname: nonroot
      gid: 1001
  users:
    - username: nonroot
      uid: 1001
      gid: 1001
      homedir: /var/lib/kvrocks
  run-as: 1001

# the data directory; the chart mounts a PVC here
paths:
  - path: /var/lib/kvrocks
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o750

environment:
  # jemalloc profiling available but off, as upstream's image sets it
  MALLOC_CONF: "prof:true,prof_active:false,background_thread:true"

# Upstream's entrypoint, with the pidfile under /tmp so the root filesystem can be
# read-only and logs on stdout. Extra flags (--requirepass, --workers, ...) follow.
entrypoint:
  command: /usr/bin/kvrocks -c /etc/kvrocks/kvrocks.conf --dir /var/lib/kvrocks --pidfile /tmp/kvrocks.pid --bind 0.0.0.0 --log-dir stdout

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-kvrocks"
  org.opencontainers.image.licenses: "Apache-2.0"
