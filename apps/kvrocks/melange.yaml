# Builds Apache Kvrocks from the Apache source release onto Wolfi with upstream's
# Dockerfile flags. CMake fetches the pinned third-party sources during the build.
package:
  name: quench-kvrocks
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Apache Kvrocks, the Redis-protocol database on RocksDB, built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - libatomic
      - libssl3
      - libcrypto3

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - clang-21
      - cmake
      - curl
      - git
      - libatomic
      - libtool
      - linux-headers
      - openssl-dev
      - python3

pipeline:
  - uses: fetch
    with:
      uri: https://downloads.apache.org/kvrocks/${{package.version}}/apache-kvrocks-${{package.version}}-src.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      set -eu
      export CC=clang CXX=clang++
      # jemalloc 5.3.1 calls std::__throw_bad_alloc, which GCC 16's libstdc++ removed;
      # 5.4.0 (Wolfi's jemalloc) builds. The MD5 is of the GitHub archive zip the CMake
      # fetch verifies, computed from a download.
      grep -q 'jemalloc/jemalloc 5.3.1' cmake/jemalloc.cmake || { echo "FATAL: jemalloc pin moved; re-audit"; exit 1; }
      sed -i 's|jemalloc/jemalloc 5.3.1|jemalloc/jemalloc 5.4.0|; s|MD5=d421650ffe4b9e0ec463a9c26135f657|MD5=eb806125bd59f7a405f3b3662babf411|' cmake/jemalloc.cmake
      grep -q 'MD5=eb806125bd59f7a405f3b3662babf411' cmake/jemalloc.cmake
      # CMake 4 rejects the pre-3.5 minimums some fetched dependencies still declare
      # -latomic must come after the objects that need it: CMAKE_EXE_LINKER_FLAGS (what
      # upstream's Dockerfile uses) lands before them with this toolchain
      ./x.py build --compiler=clang -DCMAKE_CXX_STANDARD_LIBRARIES="-latomic" -DENABLE_OPENSSL=ON \
        -DPORTABLE=1 -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -j "$(nproc)"
      install -Dm755 build/kvrocks "${{targets.destdir}}/usr/bin/kvrocks"
      install -Dm644 kvrocks.conf "${{targets.destdir}}/etc/kvrocks/kvrocks.conf"
      "${{targets.destdir}}/usr/bin/kvrocks" --version

test:
  pipeline:
    - runs: |
        kvrocks --version
