# Assembles a hardened .NET SDK base image from Wolfi's own versioned
# `dotnet-N-sdk` packages. No Dockerfile.
#
# The shipped band (10) renders `__PKG__` to `quench-dotnet@local`, the melange
# repackage of Wolfi's dotnet-10-sdk with the bundled NuGet client patched to the
# released 7.0.3 (see melange.yaml -- GHSA-g4vj-cjjj-v7hg). apko layers that local
# package (+ its native-lib deps) over the Wolfi base; the `@local` repo + melange
# keyring below carry it. (Bands 8 & 9 are held out -- see build.conf STATUS.)
#
# IMAGE-ONLY -- no Helm chart. This is a LANGUAGE/SDK image: the 0-CVE, signed,
# nonroot, multi-arch developer answer to `mcr.microsoft.com/dotnet/sdk:N`.
# Developers `FROM` it (like Chainguard's language images) or run `dotnet`
# directly.
#
# TEMPLATE NOTE: `__PKG__` is a build-time placeholder substituted by build.conf
# render() before apko runs (to quench-dotnet@local for every shipped band), so
# this single file covers every version. To roll this pattern to another runtime,
# copy this file and swap the package names + entrypoint.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - __PKG__                     # bands 8/9: Wolfi dotnet-N-sdk (pulls runtime + aspnet + targeting packs); band 10: quench-dotnet@local (NuGet-patched repackage, see melange.yaml)

accounts:
  groups:
    - groupname: nonroot
      gid: 1001
  users:
    - username: nonroot
      uid: 1001
      gid: 1001
  run-as: 1001

# The .NET driver as the entrypoint: `docker run <img> --version`,
# `docker run <img> build`, etc. Lives at /usr/bin/dotnet in Wolfi.
entrypoint:
  command: /usr/bin/dotnet

# .NET wants a writable HOME / CLI home for NuGet, the SDK first-run experience,
# and extraction caches. Point them under a writable mount so the SDK works on a
# read-only rootfs. Telemetry + first-run banner are disabled for clean,
# reproducible, network-free runs.
environment:
  HOME: /home/nonroot
  DOTNET_CLI_HOME: /home/nonroot
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  NUGET_PACKAGES: /home/nonroot/.nuget/packages

work-dir: /home/nonroot

paths:
  - path: /home/nonroot
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o755

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-dotnet"
  org.opencontainers.image.licenses: "MIT"
