# dotnet: Wolfi-packaged .NET SDK, latest 3 major bands (8 LTS, 9 STS, 10 LTS).
# VERSIONS holds the full X.Y.Z versions, used AS-IS as the image tag. Wolfi keys
# the package by major (dotnet-N-sdk), so PKG maps each version to its exact
# package; apko.yaml's __PKG__ is replaced with it. Keep in sync with Wolfi.
#
# STATUS: BLOCKED (do not publish). Re-triaged 2026-07-09 against a freshly
# refreshed Trivy DB. The NEWEST band (10.0.109 == dotnet-10-sdk-10.0.109-r2, the
# newest dotnet-10-sdk apk Wolfi ships) bundles the NuGet client assemblies
# (NuGet.Packaging, NuGet.Protocol) stamped 7.0.3-rc.65534 -> GHSA-g4vj-cjjj-v7hg
# "Defense in Depth update for NuGet Client" (LOW). This is the SOLE blocker; the
# rest of the SDK is 0-CVE. Why it stays blocked (verified, NOT allowlisted):
#   * NOT a plain tooling bug: OSV's affected range for the 7.0.x line is
#     [7.0.0, 7.0.3); the SDK's pre-release 7.0.3-rc.65534 sorts BELOW 7.0.3, so
#     it legitimately falls inside the affected window and Trivy flags it.
#   * The bundled assembly is a distinct RC build (informational version
#     7.0.3-rc.65534+901ca94...) from a DIFFERENT commit than the released
#     nuget.org 7.0.3 (…+64bdb47…); whether Microsoft's RC already carries the
#     defense-in-depth fix is not verifiable from the artifact.
#   * Can't bump: 10.0.109-r2 is the newest dotnet-10-sdk apk in Wolfi.
#   * Can't jar/DLL-swap like gradle: the released NuGet.Packaging/Protocol 7.0.3
#     on nuget.org ships ONLY a lib/net8.0 build, while the SDK needs the
#     net10.0-built, version-locked NuGet assembly SET (Commands/Configuration/
#     Build.Tasks/…). Injecting a net8.0 or 7.3.1 DLL pair would skew the SDK's
#     NuGet assembly set and risk breaking `dotnet restore` — not a safe recipe
#     edit, and it would ship non-Wolfi/non-Microsoft-SDK provenance.
# Self-heals on the next Wolfi dotnet-10-sdk built against a NuGet stamped
# >= 7.0.3 final (label drops the -rc, or advances to 7.3.1). Then flip to ship.
BLOCKED=1  # held — GHSA-g4vj-cjjj-v7hg on bundled NuGet 7.0.3-rc.65534 (see STATUS); un-actionable w/o weakening the gate
FROM_SOURCE=0
VERSIONS=(8.0.127 9.0.118 10.0.109)
declare -A PKG=(
  [8.0.127]=dotnet-8-sdk
  [9.0.118]=dotnet-9-sdk
  [10.0.109]=dotnet-10-sdk
)
render() { echo "s|__PKG__|${PKG[$1]}|g"; }
