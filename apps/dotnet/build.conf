# dotnet: Wolfi-packaged .NET SDK. Shipped band: 10 (LTS). Bands 8 and 9 held out
# (see STATUS). VERSIONS holds the full X.Y.Z version, used AS-IS as the image
# tag. Wolfi keys each package by major (dotnet-N-sdk).
#
# The shipped band is a melange REPACKAGE of Wolfi's dotnet-10-sdk with the
# bundled NuGet client patched to the released build -- see melange.yaml. apko
# consumes quench-dotnet@local; render() feeds melange.yaml the version, the
# Wolfi apk to repackage (__MELENV__), the released NuGet version to swap in
# (__RELVER__), the nupkg TFM to extract (__NUGET_TFM__), and the four sha256 pins.
#
# STATUS: held BLOCKED=1 pending the coordinator's publish go-ahead; the shipped
# band (10) gates 0-CVE on both arches after the swap. Re-triaged 2026-07-13
# (Trivy DB drifted since the 2026-07-09 triage, surfacing new findings on the
# 8/9 bands that were clean then).
#
#   * Band 10 (10.0.109) -- FIXED, ships 0-CVE both arches. dotnet-10-sdk-
#     10.0.109-r2 bundled NuGet.Packaging + NuGet.Protocol at 7.0.3-rc.65534 ->
#     GHSA-g4vj-cjjj-v7hg "Defense in Depth update for NuGet Client" (LOW): OSV's
#     affected range for the 7.0.x line is [7.0.0, 7.0.3), and the pre-release
#     sorts BELOW 7.0.3, so Trivy's dotnet-core analyzer (which reads the version
#     from the SDK's *.deps.json) flagged it. melange.yaml overwrites each bundled
#     NuGet.Packaging.dll / NuGet.Protocol.dll with the sha256-pinned RELEASED
#     7.0.3 net8.0 assembly from nuget.org and rewrites those two packages'
#     version keys in the *.deps.json from 7.0.3-rc.65534 to 7.0.3. Safe because
#     the released 7.0.3 shares the RC's assemblyVersion (7.0.3.0) AND strong-name
#     public key (token 31bf3856ad364e35) -- a drop-in binding replacement on the
#     net10.0 runtime, confirmed via `dotnet --info` + `dotnet restore`/`build`.
#     Gate NOT weakened (no .trivyignore / ignore-list).
#
#   * Band 8 (8.0.127) -- HELD OUT. Sole finding is the same GHSA-g4vj-cjjj-v7hg
#     on NuGet 6.8.2-rc.32767, BUT the swap that clears band 10 is UN-SAFE here:
#     unlike the 7.0.x line (assemblyVersion Major.Minor.Patch.0, so RC == final),
#     the 6.8.x line stamps assemblyVersion Major.Minor.Patch.REVISION, and the
#     bundled RC is 6.8.2.32767 while the released 6.8.2 fix is 6.8.2.3 -- a
#     DOWNGRADE. The SDK's own CLI assemblies (Microsoft.TemplateEngine.Cli, ...)
#     hard-reference NuGet.Protocol Version=6.8.2.32767, so loading 6.8.2.3
#     throws FileLoadException and breaks even `dotnet --version` (verified). No
#     released 6.8.x has assemblyVersion >= .32767, so no in-branch drop-in
#     exists. (A whole-family swap to a higher 6.x minor, e.g. 6.14.3, is the only
#     theoretical path -- ~16 NuGet.* assemblies across an MSBuild/restore minor
#     -- deemed too risky/out-of-scope; not attempted.)
#
#   * Band 9 (9.0.118) -- HELD OUT. Same NuGet GHSA (also un-swappable, see band
#     8) PLUS CVE-2025-26646 (HIGH, ".NET/VS Spoofing") on Microsoft.Build.Tasks.
#     Core via a bundled tool's OLD copy at 17.3.4 -- below EVERY listed fix
#     (earliest 17.8.29), no same-branch drop-in, and 9.0.118-r5 is already the
#     newest dotnet-9-sdk apk in Wolfi.
#
# RE-ADD 8 / 9 to VERSIONS (+ their PIN/REL/TFM/sha rows) once Wolfi rebuilds the
# respective dotnet-N-sdk against a FINAL NuGet (dropping the -rc, so RC ==
# release assemblyVersion) -- and, for 9, an MSBuild tool >= the CVE-2025-26646 fix.
FROM_SOURCE=0
VERSIONS=(10.0.109)
# Per-band repackage parameters. PIN = exact Wolfi dotnet-N-sdk apk to repackage;
# REL = released NuGet version to swap in; TFM = nupkg lib/ folder to pull the DLL
# from. SHA_* = sha256 pins for the two nupkgs + the two extracted DLLs.
declare -A PIN=(
  [10.0.109]=dotnet-10-sdk=10.0.109-r2
)
declare -A REL=( [10.0.109]=7.0.3  )
declare -A TFM=( [10.0.109]=net8.0 )
declare -A SHA_PKG_NUPKG=(
  [10.0.109]=2b87d2610f4ece2e92d5472357c6ff192af4ab0e9d408234075e0d2de23e60fb
)
declare -A SHA_PKG_DLL=(
  [10.0.109]=803c0b19d0a7c6cf3a218fb32888b595289909535d9003c5dfc98d4a93254f52
)
declare -A SHA_PROTO_NUPKG=(
  [10.0.109]=b7b2e5dcdefa4961b66ebdb7d405b20582f1b7f19a7f39d3ade7312c74c277c3
)
declare -A SHA_PROTO_DLL=(
  [10.0.109]=46f278bc21a93c44aa16e9d7f1d8e8b03253d8b8c05910167d50b1adfdafb947
)
# render feeds apko.yaml (__PKG__ = quench-dotnet@local) and melange.yaml
# (__VER__/__MELENV__/__RELVER__/__NUGET_TFM__ + the 4 sha256 pins).
render() {
  local v="$1"
  echo "s|__PKG__|quench-dotnet@local|g; s|__VER__|$v|g; s|__MELENV__|${PIN[$v]}|g;"\
"s|__RELVER__|${REL[$v]}|g; s|__NUGET_TFM__|${TFM[$v]}|g;"\
"s|__PKG_NUPKG_SHA__|${SHA_PKG_NUPKG[$v]}|g; s|__PKG_DLL_SHA__|${SHA_PKG_DLL[$v]}|g;"\
"s|__PROTO_NUPKG_SHA__|${SHA_PROTO_NUPKG[$v]}|g; s|__PROTO_DLL_SHA__|${SHA_PROTO_DLL[$v]}|g"
}
