# dotnet: Wolfi-packaged .NET SDK. Shipped band: 10 (LTS). Bands 8 and 9 held out
# (see STATUS). VERSIONS holds the full X.Y.Z version, used AS-IS as the image
# tag. Wolfi keys each package by major (dotnet-N-sdk).
#
# The shipped band is a melange REPACKAGE of Wolfi's dotnet-10-sdk with the
# bundled NuGet client patched to the released build -- see melange.yaml. apko
# consumes quench-dotnet@local; render() feeds melange.yaml the version, the
# Wolfi apk to repackage (__MELENV__), the released NuGet version to swap in
# (__RELVER__), the nupkg TFM to extract (__NUGET_TFM__), and the four sha256 pins.
#
# STATUS: publishing APPROVED -- not blocked (the earlier BLOCKED=1 flag is gone;
# this note previously claimed otherwise, which was stale). Re-triaged 2026-09-01
# against the newest dotnet-N-sdk apks in Wolfi on that date.
#
#   * Band 10 (10.0.111) -- SHIPS, 0-CVE both arches. Re-verified 2026-09-01 that
#     the swap premise still holds for the new apk rather than assuming it carried
#     over: dotnet-10-sdk-10.0.111-r1 STILL bundles NuGet.Packaging +
#     NuGet.Protocol at 7.0.3-rc.65534 (no final NuGet upstream yet), so the swap
#     is still required. Trivy on the unpatched 10.0.111-r1 tree reports exactly
#     ONE finding class: GHSA-g4vj-cjjj-v7hg "Defense in Depth update for NuGet
#     Client" (LOW). OSV's affected range for the 7.0.x line is [7.0.0, 7.0.3) and
#     the pre-release sorts BELOW 7.0.3, so Trivy's dotnet-core analyzer (which
#     reads the version from the SDK's *.deps.json) flags it. melange.yaml
#     overwrites each bundled NuGet.Packaging.dll / NuGet.Protocol.dll with the
#     sha256-pinned RELEASED 7.0.3 net8.0 assembly from nuget.org and rewrites
#     those two packages' version keys in the *.deps.json from 7.0.3-rc.65534 to
#     7.0.3. Still safe: both the bundled RC and the released 7.0.3 net8.0 build
#     stamp assemblyVersion 7.0.3.0 with strong-name public key token
#     31bf3856ad364e35 (read out of the CLI metadata Assembly table on both, and
#     every intra-SDK hard reference is to 7.0.3.0) -- a drop-in binding
#     replacement on the net10.0 runtime. Gate NOT weakened (no .trivyignore /
#     ignore-list / VEX).
#
#   * Band 8 (8.0.127) -- STILL HELD OUT, and it got worse. dotnet-8-sdk-8.0.127-r0
#     is STILL the newest apk in Wolfi (unchanged since the 2026-07-13 triage --
#     Wolfi has not rebuilt band 8 in ~7 weeks), so the "rebuild against a FINAL
#     NuGet" condition is simply not met: it still bundles 6.8.2-rc.32767. That
#     finding remains UN-swappable -- unlike the 7.0.x line (assemblyVersion
#     Major.Minor.Patch.0, so RC == final), the 6.8.x line stamps
#     Major.Minor.Patch.REVISION: bundled RC = 6.8.2.32767, released 6.8.2 fix =
#     6.8.2.3 (re-measured 2026-09-01), a DOWNGRADE. The SDK's own CLI assemblies
#     hard-reference the .32767 identity, so loading 6.8.2.3 throws
#     FileLoadException and breaks even `dotnet --version` (verified). No released
#     6.8.x has assemblyVersion >= .32767, so no in-branch drop-in exists. (A
#     whole-family swap to a higher 6.x minor -- ~16 NuGet.* assemblies across an
#     MSBuild/restore minor -- stays out of scope: too risky, not attempted.)
#     NEW as of 2026-09-01: the band also carries FIVE HIGH findings on
#     System.Security.Cryptography.Xml 8.0.3 (CVE-2026-47302, CVE-2026-47304,
#     CVE-2026-50525, CVE-2026-50527, CVE-2026-50648; fixed in 8.0.4) referenced
#     from the SDK's FSharp (fsc/fsi), MSBuild, NuGet.CommandLine.XPlat and dotnet
#     deps.json manifests. Those need a Wolfi rebuild against the 8.0.4 servicing
#     release; they are outside what a two-assembly NuGet swap can reach.
#
#   * Band 9 (9.0.120) -- STILL HELD OUT. The apk DID move (9.0.118-r5 ->
#     9.0.120-r1), but neither re-add condition is met:
#       - NuGet moved 6.8.2-rc.32767 -> 6.12.5-rc.32767. Still an -rc, still
#         flagged (OSV range [6.12.0, 6.12.5), fix 6.12.5), and still un-swappable
#         for the same revision reason as band 8: bundled = 6.12.5.32767, the only
#         released 6.12.5 = 6.12.5.1 (both measured 2026-09-01), and
#         NuGet.CommandLine.XPlat, Microsoft.TemplateEngine.Cli and
#         NuGet.Build.Tasks all hard-reference 6.12.5.32767 -- so the swap would be
#         the same FileLoadException downgrade.
#       - CVE-2025-26646 (HIGH, ".NET/VS Spoofing") on Microsoft.Build.Tasks.Core
#         is still there, now on TWO installed versions: the bundled tool copies at
#         17.3.4 (Roslyn + dotnet-watch/dotnet-format BuildHost), which is below
#         EVERY listed fix (earliest 17.8.29), AND the SDK's own 17.12.57, which
#         OSV's [17.12.6, 17.13.26) range swallows even though 17.12.57 is past the
#         17.12.36 fix on that branch. Clearing the second would take a VEX or an
#         ignore-list; the gate stays unweakened, so the band stays held.
#
# RE-ADD 8 / 9 to VERSIONS (+ their PIN/REL/TFM/sha rows) once Wolfi rebuilds the
# respective dotnet-N-sdk against a FINAL NuGet (dropping the -rc, so RC ==
# release assemblyVersion); for 8, additionally against System.Security.
# Cryptography.Xml >= 8.0.4; for 9, additionally an MSBuild whose Tasks.Core
# copies all satisfy CVE-2025-26646 (no 17.3.4 tool copy, and an SDK MSBuild
# outside OSV's over-broad 17.12.x range). Do NOT try a whole-family 6.x minor
# swap and do NOT downgrade an assemblyVersion -- both are known-broken above.
FROM_SOURCE=0
VERSIONS=(10.0.111)
# Per-band repackage parameters. PIN = exact Wolfi dotnet-N-sdk apk to repackage;
# REL = released NuGet version to swap in; TFM = nupkg lib/ folder to pull the DLL
# from. SHA_* = sha256 pins for the two nupkgs + the two extracted DLLs.
declare -A PIN=(
  [10.0.111]=dotnet-10-sdk=10.0.111-r1
)
declare -A REL=( [10.0.111]=7.0.3  )
declare -A TFM=( [10.0.111]=net8.0 )
declare -A SHA_PKG_NUPKG=(
  [10.0.111]=2b87d2610f4ece2e92d5472357c6ff192af4ab0e9d408234075e0d2de23e60fb
)
declare -A SHA_PKG_DLL=(
  [10.0.111]=803c0b19d0a7c6cf3a218fb32888b595289909535d9003c5dfc98d4a93254f52
)
declare -A SHA_PROTO_NUPKG=(
  [10.0.111]=b7b2e5dcdefa4961b66ebdb7d405b20582f1b7f19a7f39d3ade7312c74c277c3
)
declare -A SHA_PROTO_DLL=(
  [10.0.111]=46f278bc21a93c44aa16e9d7f1d8e8b03253d8b8c05910167d50b1adfdafb947
)
# render feeds apko.yaml (__PKG__ = quench-dotnet@local) and melange.yaml
# (__VER__/__MELENV__/__RELVER__/__NUGET_TFM__ + the 4 sha256 pins).
render() {
  local v="$1"
  echo "s|__PKG__|quench-dotnet@local|g; s|__VER__|$v|g; s|__MELENV__|${PIN[$v]}|g;"\
"s|__RELVER__|${REL[$v]}|g; s|__NUGET_TFM__|${TFM[$v]}|g;"\
"s|__PKG_NUPKG_SHA__|${SHA_PKG_NUPKG[$v]}|g; s|__PKG_DLL_SHA__|${SHA_PKG_DLL[$v]}|g;"\
"s|__PROTO_NUPKG_SHA__|${SHA_PROTO_NUPKG[$v]}|g; s|__PROTO_DLL_SHA__|${SHA_PROTO_DLL[$v]}|g"
}
