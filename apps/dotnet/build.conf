# dotnet: Wolfi-packaged .NET SDK, latest 3 major bands (8 LTS, 9 STS, 10 LTS).
# VERSIONS holds the full X.Y.Z versions, used AS-IS as the image tag. Wolfi keys
# the package by major (dotnet-N-sdk), so PKG maps each version to its exact
# package; apko.yaml's __PKG__ is replaced with it. Keep in sync with Wolfi.
FROM_SOURCE=0
VERSIONS=(8.0.122 9.0.112 10.0.100)
declare -A PKG=(
  [8.0.122]=dotnet-8-sdk
  [9.0.112]=dotnet-9-sdk
  [10.0.100]=dotnet-10-sdk
)
render() { echo "s|__PKG__|${PKG[$1]}|g"; }
