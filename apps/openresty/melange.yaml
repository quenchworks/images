# Builds OpenResty from source onto Wolfi: nginx plus LuaJIT and the lua-nginx-module
# set, linked against Wolfi's openssl, pcre2 and zlib (nothing vendored). Output is a
# signed APK in Quenchworks' own repo. Laid out like the official image
# (/usr/local/openresty, drop-ins in /etc/nginx/conf.d), configured for a nonroot
# (uid 1001) read-only-rootfs runtime: listens on 8080, pid and temp paths under
# /tmp, logs to stdout/stderr, and `daemon off;` in the config so the entrypoint is
# the binary itself with no shell.
package:
  name: quench-openresty
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened OpenResty (nginx + LuaJIT), built from source on Wolfi"
  copyright:
    - license: BSD-2-Clause
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - linux-headers
      - openssl-dev
      - pcre2-dev
      - perl
      - zlib-dev

pipeline:
  - uses: fetch
    with:
      uri: https://openresty.org/download/openresty-${{package.version}}.tar.gz
      expected-sha256: "__SHA256__"

  - runs: |
      set -eu
      # OpenResty's configure is a perl wrapper that passes the nginx options
      # through. No comments inside the continuation: a `#` ends it.
      ./configure -j"$(nproc)" \
        --prefix=/usr/local/openresty \
        --pid-path=/tmp/nginx.pid \
        --lock-path=/tmp/nginx.lock \
        --error-log-path=/dev/stderr \
        --http-log-path=/dev/stdout \
        --http-client-body-temp-path=/tmp/client_body_temp \
        --http-proxy-temp-path=/tmp/proxy_temp \
        --http-fastcgi-temp-path=/tmp/fastcgi_temp \
        --http-uwsgi-temp-path=/tmp/uwsgi_temp \
        --http-scgi-temp-path=/tmp/scgi_temp \
        --with-pcre-jit \
        --with-http_ssl_module \
        --with-http_v2_module \
        --with-http_realip_module \
        --with-http_stub_status_module \
        --with-http_gzip_static_module \
        --with-http_sub_module \
        --with-http_auth_request_module \
        --with-stream \
        --with-stream_ssl_module \
        --with-stream_ssl_preread_module \
        --with-threads \
        --with-compat \
        --with-cc-opt=-Wno-error
      make -j"$(nproc)"
      make DESTDIR="${{targets.destdir}}" install

  - name: Trim to the runtime and write the nonroot config
    runs: |
      set -eu
      d="${{targets.destdir}}"
      R="$d/usr/local/openresty"
      # resty, opm, restydoc and the pod tools are perl scripts; the image carries no
      # perl, and a proxy does not need a package manager or doc browser at runtime.
      rm -f "$R/bin/resty" "$R/bin/opm" "$R/bin/restydoc" "$R/bin/restydoc-index" \
            "$R/bin/md2pod.pl" "$R/bin/nginx-xml2pod"
      rm -rf "$R/pod" "$R/site/pod" "$R/luajit/include" "$R/luajit/lib/libluajit-5.1.a" \
             "$R/luajit/share/man"
      test -x "$R/nginx/sbin/nginx"
      test -L "$R/bin/openresty" || ln -sf ../nginx/sbin/nginx "$R/bin/openresty"

      install -d "$d/etc/nginx/conf.d"
      cat > "$R/nginx/conf/nginx.conf" <<'CONF'
      # Quenchworks OpenResty. Nonroot (uid 1001) and read-only rootfs: foreground,
      # pid and temp paths under /tmp (mount a writable emptyDir there), logs to
      # stdout/stderr. Server blocks live in /etc/nginx/conf.d.
      daemon off;
      worker_processes auto;
      pid /tmp/nginx.pid;
      error_log /dev/stderr notice;

      events {
          worker_connections 1024;
      }

      http {
          include       mime.types;
          default_type  application/octet-stream;

          client_body_temp_path /tmp/client_body_temp;
          proxy_temp_path       /tmp/proxy_temp;
          fastcgi_temp_path     /tmp/fastcgi_temp;
          uwsgi_temp_path       /tmp/uwsgi_temp;
          scgi_temp_path        /tmp/scgi_temp;

          access_log /dev/stdout;
          sendfile      on;
          tcp_nopush    on;
          keepalive_timeout 65;
          server_tokens off;

          # System CA bundle for cosockets (resty.http and friends) verifying TLS.
          lua_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

          include /etc/nginx/conf.d/*.conf;
      }
      CONF
      cat > "$d/etc/nginx/conf.d/default.conf" <<'CONF'
      server {
          listen      8080;
          server_name _;

          location / {
              root  /usr/local/openresty/nginx/html;
              index index.html;
          }

          location = /stub_status {
              stub_status;
          }
      }
      CONF

test:
  pipeline:
    - runs: |
        /usr/local/openresty/bin/openresty -V 2>&1 | grep -q "openresty/${{package.version}}"
        /usr/local/openresty/bin/openresty -t
