# openresty: from source via melange (OpenResty's perl ./configure over its bundled
# nginx + LuaJIT + lua-nginx-module set). Newest release of the last two lines,
# 1.29 and 1.31. 1.27 is left out: OpenResty does not backport to old lines, so its
# bundled nginx stops getting fixes. Each tarball's sha256 is from a download whose
# detached .asc verified as a Good signature from agentzh's key
# 25451EB088460026195BD62CB550E09EA0E98066 on 2026-09-26.
#
# Wolfi's own `openresty` apk is not used: it links gd, geoip, libxslt and needs
# perl, all surface a proxy image does not need. apps/apisix and apps/kong build
# their own patched OpenResty for their own reasons; this is the stock one.
FROM_SOURCE=1
VERSIONS=(1.29.2.5 1.31.1.1)
declare -A SHA256=(
  [1.29.2.5]=3195e665c97023419051dc51d195e9f774a3d00ed6e7cd8a3751c4722ea0a8c1
  [1.31.1.1]=65b78baadd3f0984055de89bf13f4a1932e5bfe9c31932037a134ea2b1a0ce42
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
