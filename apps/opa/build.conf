# opa (Open Policy Agent): from-source via melange (Go build from the git tag tarball).
# Latest patch of the last 3 minor lines (1.16, 1.17, 1.18). Each release pins its
# source tarball by sha256. Single static Go binary, no CGO. Version is stamped
# into the binary via -X on github.com/open-policy-agent/opa/v1/version.Version.
FROM_SOURCE=1
VERSIONS=(1.20.2)
declare -A SHA256=(
  [1.20.2]=3689adff37794f117989a0e57f55f49eb4bcf6872560368cad14624d4fd4ca88
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
