# Builds Open Policy Agent from source onto Wolfi. Single static Go binary, no CGO.
# OPA's main package is at the repo root, so a plain `go build .` produces the full
# `opa` binary (REPL, eval, and the `run --server` policy API). The version is
# stamped via -X so `opa version` reports the real release. Output is a signed APK
# in Quenchworks' own repo. No upstream distro binaries.
package:
  name: quench-opa
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Open Policy Agent (OPA), built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/open-policy-agent/opa/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      # 0-CVE gate float: golang.org/x/net v0.55.0 -> v0.56.0 (CVE-2026-46600:
      # panic parsing an invalid SVCB/HTTPS DNS RR). Minor, API-compatible.
      go get golang.org/x/net@v0.58.0 golang.org/x/text@v0.41.0 google.golang.org/grpc@v1.82.1 go.opentelemetry.io/otel@v1.43.0 go.opentelemetry.io/otel/sdk@v1.43.0 go.opentelemetry.io/otel/trace@v1.43.0 go.opentelemetry.io/otel/metric@v1.43.0 golang.org/x/oauth2@v0.36.0
      go mod tidy
      go build -trimpath \
        -ldflags "-s -w -X github.com/open-policy-agent/opa/v1/version.Version=${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/opa" .
