# Builds Open Policy Agent from source onto Wolfi. Single static Go binary, no CGO.
# OPA's main package is at the repo root, so a plain `go build .` produces the full
# `opa` binary (REPL, eval, and the `run --server` policy API). The version is
# stamped via -X so `opa version` reports the real release. Output is a signed APK
# in Quenchworks' own repo. No upstream distro binaries.
package:
  name: quench-opa
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Open Policy Agent (OPA), built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/open-policy-agent/opa/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      set -eu
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      export GO111MODULE=on
      export GOTOOLCHAIN=local
      # ---- 0-CVE module float (docs/go-module-float.md) ----------------------
      # FLOOR is a FLOOR, not a pin. A bare `go get mod@vX` fails silently in two
      # directions: it is a NO-OP when an upstream `replace` overrides it, and it
      # becomes a DOWNGRADE once upstream requires more than vX -- re-introducing
      # the CVE it was added to clear. So float only what is below the floor, then
      # assert the SHIPPED BINARY carries nothing below it.
      #
      # FLOOR CHECK at 1.20.1: the tag requires the otel v1.44.0 family, i.e. ABOVE
      # the v1.43.0 floor this recipe used to force with a bare `go get`. That pin
      # had inverted and would have DOWNGRADED otel/sdk/trace/metric on this bump.
      # Still below their floors at this tag and genuinely floated: x/net (0.57.0),
      # x/text (0.40.0), x/crypto (0.54.0), x/mod (0.37.0 -- see the x/mod note in
      # docs/go-module-float.md, the floor is v0.40.0 not Trivy's v0.37.0).
      # grpc (v1.82.1), x/sys (v0.47.0) and x/oauth2 (v0.36.0) sit exactly on their
      # floors: no-ops, kept so a future tag cannot slip back under them.
      # opa's root go.mod declares no `replace` directives.
      FLOOR="golang.org/x/net@v0.58.0 golang.org/x/text@v0.41.0 golang.org/x/crypto@v0.56.0 golang.org/x/sys@v0.47.0 golang.org/x/mod@v0.40.0 golang.org/x/oauth2@v0.36.0 google.golang.org/grpc@v1.83.2 go.opentelemetry.io/otel@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.45.0 go.opentelemetry.io/otel/sdk@v1.45.0 go.opentelemetry.io/otel/trace@v1.45.0 go.opentelemetry.io/otel/metric@v1.45.0"
      MODS="$(echo "$FLOOR" | tr ' ' '\n' | cut -d@ -f1)"
      # prints "<mod>@<floor> (<tag> has <ver>)" for every module below its floor
      below_floor() {
        awk -v floor="$FLOOR" -v tag="$1" '
          BEGIN { n = split(floor, f, " ")
                  for (i = 1; i <= n; i++) { split(f[i], kv, "@"); want[kv[1]] = kv[2] } }
          ($1 in want) {
            split(substr($2, 2), g, "."); split(substr(want[$1], 2), w, ".")
            for (i = 1; i <= 3; i++) {
              if ((g[i] + 0) > (w[i] + 0)) next
              if ((g[i] + 0) < (w[i] + 0)) { print $1 "@" want[$1] " (" tag " has " $2 ")"; next }
            }
          }'
      }
      # `go list -m` prints "<mod> <ver>" or "<mod> <ver> => <mod> <ver>", so $NF is
      # the EFFECTIVE version and a replace cannot hide behind the require line.
      go list -m -e $MODS
      need="$(go list -m -e $MODS | awk 'NF >= 2 && $NF ~ /^v[0-9]/ { print $1, $NF }' | below_floor go.mod | awk '{ print $1 }')"
      if [ -n "$need" ]; then go get $need; fi
      go mod tidy
      go build -trimpath \
        -ldflags "-s -w -X github.com/open-policy-agent/opa/v1/version.Version=${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/opa" .
      # The float is only real if it reached the BINARY. Every `dep`/`=>` line of
      # `go version -m` must be at or above its floor -- the `=>` line is what
      # catches a replace-shadowed float. Fail the build rather than ship it.
      bad="$(go version -m "${{targets.destdir}}/usr/bin/opa" \
        | awk '$1 == "dep" || $1 == "=>" { print $2, $3 }' | below_floor opa)"
      [ -z "$bad" ] || { echo "❌ 0-CVE float did not reach opa:"; echo "$bad"; exit 1; }
