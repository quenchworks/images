# Assembles the OPA runtime image. Minimal, nonroot, multi-arch, SBOM by apko.
# The default command starts the policy server on :8181 (unprivileged, so the image
# runs as nonroot with no capabilities) with an empty policy set; /health returns 200
# once it is up. The chart mounts policies/data and overrides the args as needed.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-opa@local

accounts:
  groups:
    - groupname: opa
      gid: 1001
  users:
    - username: opa
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/bin/opa run --server --addr=0.0.0.0:8181

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-opa"
  org.opencontainers.image.licenses: "Apache-2.0"
