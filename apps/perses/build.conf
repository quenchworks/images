# Perses (perses/perses): from-source via melange. Image-only (a CNCF dashboards
# / observability visualization tool, no chart). Latest patch of the last two
# minor lines: 0.52.0 (last patch of 0.52.x) and 0.53.1 (last patch of 0.53.x).
# Go backend that go:embeds a React UI (built with npm/turbo/rspack in the build
# sandbox first) and ships the default panel/datasource plugin archives, so the
# runtime image is a static Go binary with no JS toolchain on the scan surface.
# Version is stamped via -X on github.com/prometheus/common/version.Version
# (upstream tags carry a "v" prefix; the stamped version is the bare X.Y.Z).
FROM_SOURCE=1
VERSIONS=(0.53.1)
declare -A SHA256=(
  [0.53.1]=2e5e7f1ef1a6ab0ee7852a482ba8b9b357d46a703d69e2870f484cbb7cb56216
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
