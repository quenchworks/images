# Builds Litestream from source onto Wolfi. Litestream is streaming replication for
# SQLite databases to object storage. Single static Go binary. The version is
# stamped via -X main.Version so `litestream version` reports the real release.
# Most lines are pure Go (CGO_ENABLED=0); the 0.3.x line uses mattn/go-sqlite3 and
# needs cgo, so the build detects that in go.mod and links a static cgo binary
# against musl (build-base) instead. Output is a signed APK in Quenchworks' own
# repo. No upstream distro binaries. Image-only (daemon/CLI, no chart).
package:
  name: quench-litestream
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Litestream (streaming SQLite replication), built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/benbjohnson/litestream/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      export GOFLAGS=-mod=mod
      # Comprehensive 0-CVE gate: three FIXABLE transitive deps flagged (all
      # minor/patch, API-compatible, same major -- not a fork/force):
      #   github.com/aws/aws-sdk-go-v2/aws/protocol/eventstream v1.7.4 -> v1.7.8
      #     (GHSA-xmrv-pmrh-hhx2: DoS via panic in the eventstream decoder)
      #   github.com/aws/aws-sdk-go-v2/service/s3            v1.95.0 -> v1.97.3
      #     (same GHSA-xmrv-pmrh-hhx2, pulls the fixed eventstream)
      #   go.opentelemetry.io/otel                          v1.39.0 -> v1.41.0
      #     (CVE-2026-29181: DoS via crafted multi-value baggage headers)
      #   golang.org/x/net  v0.55.0 -> v0.56.0 (CVE-2026-46600: panic on invalid SVCB/HTTPS RR)
      #   golang.org/x/text v0.37.0 -> v0.39.0 (CVE-2026-56852: infinite loop on invalid input)
      #   google.golang.org/grpc v1.79.3 -> v1.82.1 (GHSA-hrxh-6v49-42gf: xDS RBAC / HTTP/2)
      #     -> keep otel@1.43.0 + x/oauth2@0.36.0 coherent with grpc@1.82.1.
      # 0-CVE FLOORS, not pins (docs/go-module-float.md): raise a module only where go.mod has it
      # below the floor; a module absent from the graph is skipped. Bare `go get` pins downgraded
      # newer upstream releases (found 2026-10-05).
      FLOOR="github.com/aws/aws-sdk-go-v2/aws/protocol/eventstream@v1.7.8 github.com/aws/aws-sdk-go-v2/service/s3@v1.97.3 google.golang.org/grpc@v1.83.2 golang.org/x/oauth2@v0.36.0 go.opentelemetry.io/otel@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.45.0 go.opentelemetry.io/otel/sdk@v1.45.0 go.opentelemetry.io/otel/trace@v1.45.0 go.opentelemetry.io/otel/metric@v1.45.0 golang.org/x/net@v0.58.0 golang.org/x/crypto@v0.56.0 golang.org/x/text@v0.41.0"
      # Go semver order (a release outranks its prereleases); busybox sort -V does not.
      vlt() { awk -v a="${1#v}" -v b="${2#v}" 'function pp(s,  p){sub(/\+.*/,"",s);p=index(s,"-");if(p){C=substr(s,1,p-1);P=substr(s,p+1)}else{C=s;P=""}} function cmp(x,y,  i,n,m,X,Y){n=split(x,X,".");m=split(y,Y,".");for(i=1;i<=n&&i<=m;i++){if(X[i]==Y[i])continue;if(X[i]~/^[0-9]+$/&&Y[i]~/^[0-9]+$/)return (X[i]+0<Y[i]+0)?-1:1;if(X[i]~/^[0-9]+$/)return -1;if(Y[i]~/^[0-9]+$/)return 1;return (X[i]<Y[i])?-1:1}return (n<m)?-1:(n>m)?1:0} BEGIN{pp(a);ca=C;pa=P;pp(b);cb=C;pb=P;c=cmp(ca,cb);if(c==0){if(pa==pb)c=0;else if(pa=="")c=1;else if(pb=="")c=-1;else c=cmp(pa,pb)}exit !(c<0)}'; }
      need=""
      for mv in $FLOOR; do
        have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${mv%@*}" 2>/dev/null)"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        vlt "$have" "${mv#*@}" && need="$need $mv"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || go get $need
      go mod tidy
      # 0.3.x uses the mattn/go-sqlite3 cgo driver; everything else is pure Go.
      if grep -q 'mattn/go-sqlite3' go.mod; then
        export CGO_ENABLED=1
        go build -trimpath \
          -ldflags '-s -w -X main.Version=v${{package.version}} -extldflags "-static"' \
          -o "${{targets.destdir}}/usr/bin/litestream" ./cmd/litestream
      else
        export CGO_ENABLED=0
        go build -trimpath \
          -ldflags "-s -w -X main.Version=v${{package.version}}" \
          -o "${{targets.destdir}}/usr/bin/litestream" ./cmd/litestream
      fi
