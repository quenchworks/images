# litestream: streaming replication for SQLite to object storage. From-source via
# melange (Go build from the git tag tarball). Image-only (a daemon/CLI, no chart).
# Latest patch of the last 3 minor lines (0.2, 0.3, 0.5). Tag format is vX.Y.Z.
# Version is stamped via -X on main.Version (verified in .goreleaser.yml).
# NOTE on CGO: the SQLite driver differs by line. 0.5.x and 0.2.x build pure-Go
# with CGO_ENABLED=0; 0.3.x pulls mattn/go-sqlite3 (cgo) and needs CGO_ENABLED=1.
# The melange build auto-detects mattn in go.mod and links a static cgo binary;
# otherwise it builds CGO_ENABLED=0. Either way the result is a static binary.
FROM_SOURCE=1
VERSIONS=(0.2.0 0.3.14 0.5.12)
declare -A SHA256=(
  [0.2.0]=4d6b0312d163d3140c0cffd11fe7228751345f20b5d1355da7d1e1f259b96377
  [0.3.14]=2cb7ae95adb0e19d027b62a69c4639167ed95818a31c67387aa8da198b1f2743
  [0.5.12]=c449fff23e45143fe71226c1bef12948f389c594852a7db79bce14c545b6140c
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
