# wildfly: the official WildFly distribution (a JVM app server) from the GitHub
# release, on a Wolfi openjdk-21 JRE. WildFly patches only its newest line, so
# this ships LATEST ONLY. The image version drops upstream's ".Final" suffix
# (apk versions cannot carry it); the fetch URL puts it back.
# sha256 is from a download whose sha1 matched the published .sha1 (41.0.1 on 2026-09-26,
# 42.0.0 on 2026-10-22). 41.0.1 stays while the chart pins that line.
FROM_SOURCE=0
VERSIONS=(41.0.1 42.0.0)
declare -A SHA256=(
  [41.0.1]=26e27908f5c720d53f24abb95f9575d04f580510e5d85fad513cda9ade8119c3
  [42.0.0]=6c2e50b8f3e2c0c3ad8f5241e18276f12bfd3e6e37b750e3fe1d6ce1dd2800ce
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
