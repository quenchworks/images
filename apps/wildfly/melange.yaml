# Packages the official WildFly distribution onto Wolfi with a hardened runtime
# layout: nonroot, read-only rootfs (every runtime write lands under /tmp), bound to
# 0.0.0.0 on 8080, management on 127.0.0.1:9990. Output is a signed APK in
# QuenchWorks' own repo.
package:
  name: quench-wildfly
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened WildFly application server, packaged on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - openjdk-21-jre
      - busybox          # bin/standalone.sh is /bin/sh with sed/awk/tr/readlink

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - curl

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/wildfly/wildfly/releases/download/${{package.version}}.Final/wildfly-${{package.version}}.Final.tar.gz
      expected-sha256: "__SHA256__"
      strip-components: 1

  - name: Swap OpenTelemetry core, guava and snappy-java below their fixes
    runs: |
      set -eu
      # JBoss Modules loads jars by the filename in each module.xml, so every swap renames
      # the jar AND rewrites its resource-root. modswap replaces each copy of a library that
      # is below the fix, whatever version upstream ships; a library missing entirely is an
      # error only where the caller says it must exist.
      modswap() { # <old jar path> <new jar name> <url> <sha256>
        dir="$(dirname "$1")"; old="$(basename "$1")"
        grep -q "path=\"$old\"" "$dir/module.xml" || { echo "module.xml in $dir does not name $old" >&2; exit 1; }
        curl -fsSL -o "$dir/$2" "$3"
        echo "$4  $dir/$2" | sha256sum -c -
        rm -f "$1"
        sed -i "s|path=\"$old\"|path=\"$2\"|" "$dir/module.xml"
        echo "  $1 -> $2"
      }
      below() { [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | head -1)" != "$2" ]; }  # <have> <fix>
      # OpenTelemetry: the api fix is 1.67.0 and the SDK reaches into api internals that move
      # between releases (1.67 moved api.internal.ConfigUtil into opentelemetry-common), so every
      # core jar moves to 1.67.0 together. instrumentation and semconv are other trains.
      otel167() { case "$1" in
          api) echo "1.67.0 538d1dff2f9a37aecbc0ef98fd17273a3affb058e734e6763a3a07a38a5fdc59" ;;
          api-incubator) echo "1.67.0-alpha fea3d78726e49620168c3f6194ff491edfd1ec89b2df06fd5d5b73e55d74a342" ;;
          common) echo "1.67.0 da97bdb395418e16ecdcbe7ad3497f45b9e767ceda4ae7e86133e7a757ac377f" ;;
          context) echo "1.67.0 40fb813fb5e27ec2691daa29c81b572b5b1541ef9b41e62490c3ee3e6407c55e" ;;
          exporter-common) echo "1.67.0 eb61aab6d20bf105102dfa061b478b659cec17e82a50969898046456768ba09b" ;;
          exporter-otlp) echo "1.67.0 6724a9c8f9f42de757682c6194c48d9fee4670cd19a85c37954eba526c58b836" ;;
          exporter-otlp-common) echo "1.67.0 75530ab4d93e6fdef478d3e112713337625e70a63df357e6e7b9060c13788015" ;;
          sdk) echo "1.67.0 52a8f599a368a3d62185e37053f6a53175d6fbe3ecc1d565baba13b1a854267f" ;;
          sdk-common) echo "1.67.0 628a4c00db9561ff4c608a650d5e7fd66a1e153ccdf1ba3cdc5ac0b7c6518fea" ;;
          sdk-extension-autoconfigure) echo "1.67.0 09021cf4e41f081e11e1c00577fe03b98db0ae7fd5f73eaf4020e760fa0edb7e" ;;
          sdk-extension-autoconfigure-spi) echo "1.67.0 41eb19f6caf2c655ac3139d331f5c34283f2efdb0f0b0e58765a6cc9e27f66bc" ;;
          sdk-logs) echo "1.67.0 dd0f0b625e08787af49d7e270abc6def4c2eabc2f18f5f145b7924024a3311e3" ;;
          sdk-metrics) echo "1.67.0 c157ff10da59a87a57e5236d9f3290792d9b749433be5e5b449a7d1604c320a9" ;;
          sdk-trace) echo "1.67.0 14d9615c8a5dcf471dcbb74902b771dcfa8656b755ac38dce904042289ccd198" ;;
          exporter-sender-okhttp) echo "1.67.0 0ccb54e5e1db24680b0b7b818299552477dcc7114de7ca0f7b054e6e20958b83" ;;
          sdk-testing) echo "1.67.0 c3d74c825e423e7bf28f0e3f22f10bbf7fe3b00984d0d9ea6ef1327b05c274e2" ;;
          exporter-logging) echo "1.67.0 cc5edf7dde86b301908d40a7de5b121119c110a6ee453bc41179af84b19b794a" ;;
          *) return 1 ;;
        esac; }
      M=https://repo1.maven.org/maven2
      find modules -name 'opentelemetry-*.jar' > /tmp/otel.list
      grep -q 'opentelemetry-api-[0-9]' /tmp/otel.list || { echo "no opentelemetry-api jar; dist moved" >&2; exit 1; }
      while IFS= read -r j; do
        b="$(basename "$j" .jar)"
        a="$(echo "$b" | sed -E 's/^opentelemetry-(.+)-[0-9]+\.[0-9]+\.[0-9]+(-alpha)?$/\1/')"
        v="$(echo "$b" | sed -E 's/^.*-([0-9]+\.[0-9]+\.[0-9]+)(-alpha)?$/\1/')"
        r="$(otel167 "$a")" || continue; set -- $r
        below "$v" 1.67.0 || continue
        modswap "$j" "opentelemetry-$a-$1.jar" "$M/io/opentelemetry/opentelemetry-$a/$1/opentelemetry-$a-$1.jar" "$2"
      done < /tmp/otel.list
      # guava 33.7.2-jre (CVE-2026-102554; 41.0.1 ships 33.0.0) and snappy-java 1.1.10.9
      # (41.0.1 ships 1.1.10.8). 42.0.0 may already carry fixed ones; only older copies move.
      for j in $(find modules -name 'guava-[0-9]*-jre.jar'); do
        v="$(basename "$j" | sed -E 's/^guava-(.+)-jre\.jar$/\1/')"
        below "$v" 33.7.2 && modswap "$j" guava-33.7.2-jre.jar "$M/com/google/guava/guava/33.7.2-jre/guava-33.7.2-jre.jar" b530942257fb935f8b2cfaa5f8eb5bd59c555fd8e8d01b8ce98912e077ea606c
      done
      for j in $(find modules -name 'snappy-java-[0-9]*.jar'); do
        v="$(basename "$j" .jar | sed 's/^snappy-java-//')"
        below "$v" 1.1.10.9 && modswap "$j" snappy-java-1.1.10.9.jar "$M/org/xerial/snappy/snappy-java/1.1.10.9/snappy-java-1.1.10.9.jar" 35228628442e4b9797681c7cbd3b26594f6da3379159dbd0cb07094ed3aece0d
      done
      true
  - name: Swap jackson-databind and jackson-core below 2.21.7 to 2.21.7
    runs: |
      set -eu
      # databind: CVE-2026-68497 (HIGH), -19032 and -83557 (MEDIUM), fixed in 2.21.6, and
      # CVE-2026-91776/-91777 in 2.21.7. core: CVE-2026-89407/-89425 (HIGH), fixed in 2.21.7
      # (2026-10-04). Same line for both. JBoss Modules loads the jar by the filename in
      # module.xml, so the swap renames the jar AND rewrites its resource-root, as the
      # OpenTelemetry swap does. The sha256s are from Maven Central downloads.
      # 41.0.1 ships 2.21.5; 42.0.0 already ships 2.21.7, so match any older 2.21.x and
      # leave 2.21.7 alone; any other version fails so it gets looked at.
      for spec in "jackson-databind 1290c2795e93e8a6861a6c4d9ff0d844d32f5ea178362cb2721edf5561e828b1" \
                  "jackson-core 8c5623b98f32d5f7e1287ff61ed50e08ab7b11381e991fff89327faabba42261"; do
        set -- $spec; a="$1"; sha="$2"
        old="$(find modules -name "$a-2.*.jar")"
        [ "$(printf '%s\n' "$old" | grep -c .)" = 1 ] || { echo "expected one $a jar, found: $old" >&2; exit 1; }
        o="$(basename "$old")"; dir="$(dirname "$old")"
        case "$o" in
          "$a-2.21.7.jar") echo "$o already fixed, nothing to swap"; continue ;;
          "$a"-2.21.[0-6].jar) ;;
          *) echo "unexpected $o; check it against the CVEs above" >&2; exit 1 ;;
        esac
        grep -q "path=\"$o\"" "$dir/module.xml" || { echo "module.xml in $dir does not name $o" >&2; exit 1; }
        curl -fsSL -o "$dir/$a-2.21.7.jar" "https://repo1.maven.org/maven2/com/fasterxml/jackson/core/$a/2.21.7/$a-2.21.7.jar"
        echo "$sha  $dir/$a-2.21.7.jar" | sha256sum -c -
        rm -f "$old"
        sed -i "s|path=\"$o\"|path=\"$a-2.21.7.jar\"|" "$dir/module.xml"
        if find modules -name "$a-*.jar" ! -name "$a-2.21.7.jar" | grep -q .; then
          echo "another $a jar is shipped:" >&2; find modules -name "$a-*.jar" >&2; exit 1
        fi
      done

  - name: Swap lz4-java to 1.11.4
    runs: |
      set -eu
      # CVE-2026-106449..106453 (one HIGH) in lz4-java below 1.11.4; 41.0.1 ships 1.11.2.
      # 1.11.4 has the identical file list and Automatic-Module-Name as 1.11.1 (diffed).
      # Match any vulnerable version so the next release does not turn this into a no-op;
      # rename the jar and rewrite the module.xml resource-root, as the swaps above do.
      old="$(find modules -name 'lz4-java-*.jar')"
      [ "$(printf '%s\n' "$old" | grep -c .)" = 1 ] || { echo "expected one lz4-java jar, found: $old" >&2; exit 1; }
      o="$(basename "$old")"; dir="$(dirname "$old")"
      case "$o" in
        lz4-java-1.10.*|lz4-java-1.11.[0-3].jar)
          grep -q "path=\"$o\"" "$dir/module.xml" || { echo "module.xml in $dir does not name $o" >&2; exit 1; }
          curl -fsSL -o "$dir/lz4-java-1.11.4.jar" https://repo1.maven.org/maven2/at/yawk/lz4/lz4-java/1.11.4/lz4-java-1.11.4.jar
          echo "58c8e0b813960d2a248e050c353baea73139b48a2ffc55382d42c69707e17325  $dir/lz4-java-1.11.4.jar" | sha256sum -c -
          rm -f "$old"
          sed -i "s|path=\"$o\"|path=\"lz4-java-1.11.4.jar\"|" "$dir/module.xml"
          ;;
        *) echo "lz4-java is $o; not below 1.11.4, nothing to swap" ;;
      esac

  - name: Install under /opt/wildfly with a read-only-rootfs layout
    runs: |
      set -eu
      dest="${{targets.destdir}}/opt/wildfly"
      install -d "$dest"
      cp -a bin modules jboss-modules.jar standalone welcome-content copyright.txt LICENSE.txt README.txt version.txt "$dest/"
      install -d "$dest/docs" && cp -a docs/licenses "$dest/docs/"
      # Domain mode, the Windows and PowerShell launchers, the appclient and the XSD
      # docs are not used by a standalone container. welcome-content is: the default
      # config serves it at / and fails a boot operation without it.
      find "$dest/bin" \( -name '*.bat' -o -name '*.ps1' \) -delete
      rm -rf "$dest/bin/client" "$dest/bin/service"
      # Runtime writes all go to /tmp/wildfly (emptyDir/tmpfs), which the entrypoint
      # makes the server base dir. standalone/ here stays the read-only SOURCE:
      # configuration/ and deployments/ are copied into the base on every start, so a
      # derived image can COPY a WAR into standalone/deployments and a mount over a
      # file there takes effect. (A symlink into /tmp was tried first: Docker then
      # creates /tmp/wildfly as root for a WAR mounted beneath it, uid 1001 cannot
      # create its siblings, and a COPY into it vanishes under the tmpfs.)
      install -d "$dest/standalone/deployments"
      chmod -R a+rX "$dest"

      install -d "${{targets.destdir}}/usr/bin"
      cat > "${{targets.destdir}}/usr/bin/wildfly-entrypoint.sh" <<'EOS'
      #!/bin/sh
      set -eu
      W=/tmp/wildfly
      mkdir -p "$W/configuration" "$W/deployments"
      cp -r /opt/wildfly/standalone/configuration/. "$W/configuration/"
      cp -r /opt/wildfly/standalone/deployments/. "$W/deployments/"
      # standalone.sh derives the log and config dirs from JBOSS_BASE_DIR and passes
      # it as jboss.server.base.dir, so data, log, tmp and deployments all resolve
      # under /tmp. Set through the environment, not -D: the script rewrites those -D
      # values with `readlink -m`, which busybox lacks, and they came back empty.
      export JBOSS_BASE_DIR="$W"
      exec /opt/wildfly/bin/standalone.sh \
        -b "${WILDFLY_BIND:-0.0.0.0}" \
        -bmanagement "${WILDFLY_BIND_MANAGEMENT:-127.0.0.1}" \
        "$@"
      EOS
      chmod 0755 "${{targets.destdir}}/usr/bin/wildfly-entrypoint.sh"
