# Assembles the WildFly image: the distribution on Wolfi's openjdk-21 JRE. Nonroot
# (uid 1001), multi-arch, read-only-rootfs friendly (mount a writable /tmp). HTTP on
# 8080 (all interfaces), management on 9990 (loopback). Drop a WAR into
# /opt/wildfly/standalone/deployments (a symlink to /tmp/wildfly/deployments), or
# pass -c standalone-microprofile.xml and friends as arguments.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - openjdk-21-jre
    - busybox
    - quench-wildfly@local

accounts:
  groups:
    - groupname: wildfly
      gid: 1001
  users:
    - username: wildfly
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/bin/wildfly-entrypoint.sh

environment:
  # openjdk-21-jre has no /usr/bin/java symlink; standalone.sh uses $JAVA_HOME.
  JAVA_HOME: /usr/lib/jvm/java-21-openjdk
  JBOSS_HOME: /opt/wildfly
  PATH: /usr/lib/jvm/java-21-openjdk/bin:/usr/bin:/bin:/opt/wildfly/bin

work-dir: /opt/wildfly

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-wildfly"
  org.opencontainers.image.licenses: "Apache-2.0"
