# Packages Apache ActiveMQ Classic (official binary distribution) onto Wolfi. The Java
# Service Wrapper directories (per-OS native launchers) and the demo webapps are left
# out; the image starts the broker with bin/activemq's own JVM command line, without
# the shell. Output is a signed APK in Quenchworks' own repo.
package:
  name: quench-activemq
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Apache ActiveMQ Classic, packaged on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - openjdk-21-jre     # ActiveMQ 6 needs Java 17+

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle

pipeline:
  - uses: fetch
    with:
      uri: https://downloads.apache.org/activemq/${{package.version}}/apache-activemq-${{package.version}}-bin.tar.gz
      expected-sha256: "__SHA256__"
      strip-components: 1
  - runs: |
      set -eu
      home="${{targets.destdir}}/opt/activemq"
      install -d "$home/bin"
      cp -r conf lib webapps LICENSE NOTICE activemq-all-*.jar "$home/"
      cp bin/activemq.jar "$home/bin/"
      # jackson-databind 2.22.2 carries CVE-2026-91776/-91777; swap in the same-line fix,
      # and fail if the dist stops shipping the jar this replaces.
      old="$home/lib/jackson-databind-2.22.2.jar"
      test -f "$old"
      wget -q -O "$home/lib/jackson-databind-2.22.3.jar" "https://repo1.maven.org/maven2/com/fasterxml/jackson/core/jackson-databind/2.22.3/jackson-databind-2.22.3.jar"
      echo "556db5439e206114346043f68d200497dc96a0bca62a360a81784092ebd0e0a9  $home/lib/jackson-databind-2.22.3.jar" | sha256sum -c -
      rm -f "$old"
      # jackson-core 2.22.2 carries CVE-2026-89407/-89425 (2026-10-04); same swap, same line.
      old="$home/lib/jackson-core-2.22.2.jar"
      test -f "$old"
      wget -q -O "$home/lib/jackson-core-2.22.3.jar" "https://repo1.maven.org/maven2/com/fasterxml/jackson/core/jackson-core/2.22.3/jackson-core-2.22.3.jar"
      echo "8a501126a385b25841915d839508f8a66e2a0dbc8a6709d055ef3b3e852b094c  $home/lib/jackson-core-2.22.3.jar" | sha256sum -c -
      rm -f "$old"
      chmod -R a+rX "$home"

test:
  pipeline:
    - runs: |
        test -f /opt/activemq/bin/activemq.jar
        test -f /opt/activemq/conf/activemq.xml
