# activemq: Apache ActiveMQ Classic from its official binary distribution, on a Wolfi
# JRE. FROM_SOURCE=0: fetch + unpack; each sha256 is from a download whose sha512
# matched the one Apache publishes.
#
# 6.3 ONLY for now. 6.2.9 scans at 5 findings and 5.19.11 at 34; 6.3.2 at 0. Measured
# 2026-09-26. Artemis is a separate product: apps/activemq-artemis.
FROM_SOURCE=0
VERSIONS=(6.3.3)
declare -A SHA256=(
  [6.3.3]=1b922bcab8cbef92793b8eff6cf97af5f5512f7f541adb3ba76fad53dd3ddc77
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
