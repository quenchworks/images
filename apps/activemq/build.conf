# activemq: Apache ActiveMQ Classic from its official binary distribution, on a Wolfi
# JRE. FROM_SOURCE=0: fetch + unpack; each sha256 is from a download whose sha512
# matched the one Apache publishes.
#
# 6.3 ONLY for now. 6.2.9 scans at 5 findings and 5.19.11 at 34; 6.3.2 at 0. Artemis
# is a separate product and not built here: the newest on downloads.apache.org
# (2.44.0) carries dozens of findings (netty, jetty, zookeeper, jline). Measured
# 2026-09-26.
FROM_SOURCE=0
VERSIONS=(6.3.2)
declare -A SHA256=(
  [6.3.2]=543e9ca8a234d118a8c195d802a110994a59b7973d75ae0a7ccd47dc2cc2c5c1
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
