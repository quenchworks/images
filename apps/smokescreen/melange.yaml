# Smokescreen from the release tag, CGO-free, with the release named in its --version.
package:
  name: quench-smokescreen
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Smokescreen egress proxy, built from source on Wolfi"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27          # go.mod: go 1.25.0; Wolfi go-1.27 for the stdlib fixes

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/stripe/smokescreen/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - runs: |
      set -eu
      export CGO_ENABLED=0 GOTOOLCHAIN=local GOFLAGS=-mod=mod
      # floors, raised only when below (a bare go get downgrades once upstream passes it); the
      # golang.org/x set moves together, as in the other recipes
      FLOOR="golang.org/x/crypto@v0.58.1-0.20261009181718-2f1f834330b2 golang.org/x/net@v0.62.0 golang.org/x/text@v0.43.0 golang.org/x/sys@v0.49.0 github.com/sirupsen/logrus@v1.9.3"
      need=""
      for f in $FLOOR; do
        have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${f%@*}")"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        [ "$(printf '%s\n%s\n' "$have" "${f#*@}" | sort -V | head -1)" = "${f#*@}" ] || need="$need $f"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || go get $need
      go mod tidy
      rm -rf vendor
      # versioninfo's init sets Version from the main module version, "(devel)" for a tarball
      # build, so -X cannot stamp it: name the release in the one place the CLI reads it
      grep -q 'app.Version = versioninfo.Short()' cmd/smokescreen.go
      sed -i 's|app.Version = versioninfo.Short()|app.Version = "v${{package.version}}"; _ = versioninfo.Short|' cmd/smokescreen.go
      go build -trimpath -ldflags "-s -w" \
        -o "${{targets.destdir}}/usr/bin/smokescreen" .
      v="$("${{targets.destdir}}/usr/bin/smokescreen" --version 2>&1 || true)"
      echo "smokescreen --version: $v"
      case "$v" in *"v${{package.version}}"*) ;; *) exit 1 ;; esac

test:
  pipeline:
    - runs: |
        smokescreen --version
