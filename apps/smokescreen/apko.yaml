# Smokescreen runtime: smokescreen is the entrypoint (listens on 4750; --config-file or flags).
# Nonroot 1001, so listen on ports above 1023 unless the pod grants NET_BIND_SERVICE.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-smokescreen@local

accounts:
  groups:
    - groupname: smokescreen
      gid: 1001
  users:
    - username: smokescreen
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/bin/smokescreen

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-smokescreen"
  org.opencontainers.image.licenses: "MIT"
  org.opencontainers.image.version: "__VER__"
