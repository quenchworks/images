# Smokescreen (stripe/smokescreen, MIT): an egress HTTP CONNECT and HTTP proxy that refuses
# connections to internal and private addresses (SSRF protection) and enforces per-role egress
# ACLs keyed by client certificate. From source via melange: one static Go binary with the
# release named in --version. LATEST-ONLY: upstream has one release line.
FROM_SOURCE=1
VERSIONS=(0.1.0)
declare -A SHA256=(
  [0.1.0]=9609a708aa0b6d1cdabc7b3f47e834e2afe94d4361889f62537fdb895f32c8a8
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
