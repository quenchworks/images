# ntfy (binwiederhier/ntfy): from-source via melange. Image-only (a pub-sub
# notification server, no chart). NEWEST-ONLY: build.conf is the single source
# of truth and lists just the newest stable tag. Go backend that go:embeds a
# React/Vite web UI (server/site) and the docs (server/docs) -- neither is
# shipped populated in the source tarball, so the web UI is (re)built with
# Node/npm+vite in the build sandbox first (see melange.yaml); docs are stubbed.
# The server links SQLite (mattn/go-sqlite3), so the build is CGO-on (dynamic
# glibc; melange SCA adds the runtime lib). Version is stamped via -X on
# main.version (upstream tags carry a "v" prefix; the stamped version is the
# bare X.Y.Z).
FROM_SOURCE=1
VERSIONS=(2.28.0)
declare -A SHA256=(
  [2.28.0]=edfa7efdfd7e76a250bdec021c464ac3dfcaf928a4710433946e2a86c6d66c9e
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
