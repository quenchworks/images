# Builds ntfy (binwiederhier/ntfy) from source onto Wolfi. ntfy is a Go pub-sub
# notification server that go:embeds a React web UI and the docs into the binary:
#   server/server.go:  //go:embed site   and   //go:embed docs
# The source tarball ships BOTH dirs empty (0 files), and go:embed fails to
# compile against an empty directory -- so we must populate them before `go build`:
#   * web UI: the Vite/React app under web/ is built with Node+npm in the sandbox
#     (npm ci + vite build -> web/build), then arranged exactly as upstream's
#     Makefile `web-build` does: index.html -> app.html (server.go serves the app
#     from /app.html), moved to server/site, and the static config.js dropped
#     (the server generates config.js dynamically at runtime).
#   * docs: upstream's full build runs mkdocs (Python) to fill server/docs; that
#     heavy toolchain is not worth pulling into the build for an API+web server,
#     so we stub server/docs/index.html exactly like upstream's own fast-build
#     path (Makefile `cli-deps-static-sites`). The canonical docs live at
#     docs.ntfy.sh; the API and web UI are fully functional.
# Node/npm live ONLY in the build sandbox; the runtime image carries just the
# single ntfy binary, so the JS toolchain never enters the Trivy scan surface.
#
# The server links SQLite via mattn/go-sqlite3 (CGO), so this is a CGO-on build
# (dynamic against glibc via build-base; melange's SCA adds glibc to the runtime
# deps automatically). A static glibc link is avoided on purpose: ntfy resolves
# DNS for SMTP and Web Push, and static glibc breaks NSS/getaddrinfo.
#
# go.mod declares go 1.25.8; we build with go-1.26 (newest, clears stdlib CVE
# advisories) and GOTOOLCHAIN=local so go.mod's directive does not trigger a
# toolchain download. GOFLAGS=-mod=mod lets the module graph resolve patched deps.
package:
  name: quench-ntfy
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened ntfy (pub-sub notification server), built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      # ntfy schedules delivery by time zone and formats timestamps; the upstream
      # image installs tzdata for the same reason.
      - tzdata

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-1.26
      # Web UI toolchain (build sandbox only): the React app is built with Vite.
      - nodejs-24
      - npm

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/binwiederhier/ntfy/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - name: Build the web UI from source (npm + vite)
    runs: |
      set -eu
      # Writable caches/HOME for npm inside the sandbox.
      export npm_config_cache="$(mktemp -d)"
      export HOME="$(mktemp -d)"
      (
        cd web
        # "npm ci" installs exactly the pinned lockfile (no lockfile mutation).
        npm ci
        # vite build -> web/build (outDir "build", per web/vite.config.js).
        npm run build
        # Mirror upstream Makefile `web-build`: the SPA entry is served as app.html
        # (server.go webAppIndex = "/app.html"), and config.js is generated by the
        # server at runtime, so the static one is dropped.
        mv build/index.html build/app.html
        rm -rf ../server/site
        mv build ../server/site
        rm -f ../server/site/config.js
      )
      # server.go go:embed requires app.html to exist.
      test -f server/site/app.html

  - name: Stub the embedded docs dir (go:embed docs needs a file)
    runs: |
      set -eu
      mkdir -p server/docs
      # Matches upstream Makefile `cli-deps-static-sites`; real docs at docs.ntfy.sh.
      [ -e server/docs/index.html ] || printf '<!doctype html><title>ntfy</title>See https://docs.ntfy.sh/\n' > server/docs/index.html

  - name: Build the ntfy binary (CGO on for SQLite, dynamic glibc)
    runs: |
      set -eu
      export CGO_ENABLED=1
      export GOFLAGS=-mod=mod
      export GOTOOLCHAIN=local      # use the installed go-1.26, do not fetch go.mod's 1.25.8
      export GO111MODULE=on
      # 0-CVE gate float: golang.org/x/text v0.38.0 -> v0.39.0 (CVE-2026-56852:
      # infinite loop on invalid input). Minor, API-compatible.
      go get golang.org/x/text@v0.39.0
      go mod tidy
      # Mirror upstream ldflags so `ntfy --version` reports the real release.
      # No git in the tarball, so commit/date are stamped statically.
      go build -trimpath \
        -ldflags "-s -w -X main.version=${{package.version}} -X main.commit=release -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
        -o "${{targets.destdir}}/usr/bin/ntfy" .
