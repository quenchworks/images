# Builds the FerretDB proxy from source onto Wolfi. Single static Go binary, no CGO.
# Output is a signed APK in Quenchworks' own repo. No upstream distro binaries.
#
# FerretDB v2 is a stateless proxy that speaks the MongoDB wire protocol and stores
# data in PostgreSQL with the DocumentDB extension. This package is just the proxy;
# it needs a DocumentDB-extended PostgreSQL backend (FERRETDB_POSTGRESQL_URL) to serve.
package:
  name: quench-ferretdb
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened FerretDB (MongoDB-compatible proxy), built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - __GOPKG__

pipeline:
  # git-checkout, not fetch: the 56MB GitHub archive tarball is served by
  # codeload.github.com over chunked transfer and stalls mid-stream unreliably
  # (it died at the same byte on every wget retry, including on CI). A git clone
  # at the tag is robust for a repo this size.
  - uses: git-checkout
    with:
      repository: https://github.com/FerretDB/FerretDB
      tag: v${{package.version}}
      expected-commit: __COMMIT__
  - runs: |
      # Version files are normally written by `task gen-version` from git metadata,
      # which is absent in a tarball build. mongodb.txt ships in the repo (so the
      # //go:embed compiles); write version/package so the binary reports v2.7.0.
      printf 'v%s' "${{package.version}}" > build/version/version.txt
      printf 'quench'                     > build/version/package.txt
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      export GOTOOLCHAIN=local
      # 0-CVE gate: minimal same-major bumps of directly/transitively linked
      # modules flagged by trivy. All verified to compile from-source.
      go get github.com/jackc/pgx/v5@v5.9.2 \
             go.mongodb.org/mongo-driver@v1.17.7 \
             go.mongodb.org/mongo-driver/v2@v2.4.2 \
             go.opentelemetry.io/otel@v1.43.0 \
             go.opentelemetry.io/otel/sdk@v1.43.0 \
             go.opentelemetry.io/otel/trace@v1.43.0 \
             go.opentelemetry.io/otel/metric@v1.43.0 \
             go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.43.0 \
             go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.43.0 \
             golang.org/x/crypto@v0.53.0 \
             golang.org/x/net@v0.56.0 \
             golang.org/x/text@v0.39.0 \
             google.golang.org/grpc@v1.82.1
      # github.com/modelcontextprotocol/go-sdk v0.2.0 (DIRECT dep) is flagged by
      #   CVE-2026-27896, CVE-2026-33252, CVE-2026-34742, GHSA-q382-vc8q-7jhj (HIGH),
      #   all fixed only in v1.x -- a v0->v1 MAJOR bump. v1 removed the generic
      #   mcp.CallToolParamsFor / mcp.CallToolResultFor types that FerretDB's
      #   internal/mcp/*.go uses. The bump is SAFE because the migration is tiny and
      #   self-contained: go-sdk v1 replaced those generics with the ToolHandlerFor
      #   shape `func(ctx, *CallToolRequest, In) (*CallToolResult, Out, error)`, and
      #   only 3 tool handlers + one result literal reference the removed types. We
      #   port them in-place below (no behavior change; MCP is a runtime-optional
      #   listener, off unless --listen-mcp-addr is set). Verified 0-CVE.
      go get github.com/modelcontextprotocol/go-sdk@v1.4.1
      # --- MCP v0->v1 API port (modelcontextprotocol/go-sdk) --------------------
      # v1 dropped mcp.CallToolResultFor[T]/CallToolParamsFor[T]; migrate the three
      # tool handlers (find, listCollections, listDatabases) and handle() to v1's
      # ToolHandlerFor signature. AddTool infers In/Out, so the addTools() calls are
      # unchanged. Each handler returns the extra Out value (nil) alongside result+err.
      sed -i 's#mcp\.CallToolResultFor\[any\]#mcp.CallToolResult#' internal/mcp/server.go
      for pair in \
        "find.go:findArgs" \
        "listcollections.go:listCollectionsArgs" \
        "listdatabases.go:any"; do
        f="internal/mcp/${pair%%:*}"; in="${pair#*:}"
        sed -i \
          -e "s#_ \*mcp.ServerSession, params \*mcp.CallToolParamsFor\[${in}\]) (\*mcp.CallToolResult, error)#_ *mcp.CallToolRequest, args ${in}) (*mcp.CallToolResult, any, error)#" \
          -e 's#slog.Any("params", params)#slog.Any("args", args)#' \
          -e 's#params\.Arguments\.#args.#g' \
          -e 's#^\treturn s.handle(ctx, req)#\tres, err := s.handle(ctx, req)\n\treturn res, nil, err#' \
          "$f"
      done
      # -------------------------------------------------------------------------
      go mod tidy
      go build -trimpath -ldflags "-s -w" \
        -o "${{targets.destdir}}/usr/bin/ferretdb" ./cmd/ferretdb

test:
  pipeline:
    - runs: |
        ferretdb --version
