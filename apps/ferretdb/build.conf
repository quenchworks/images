# ferretdb: from-source via melange (git-checkout tag + peeled commit).
# Latest 3 stable minor lines (full X.Y.Z, used as-is). 2.5.0 only builds with
# Go < 1.25 (its gomaxprocs.go is //go:build !go1.25 but main.go calls
# setGOMAXPROCS unconditionally; fixed by 2.7), so its BUILD-TIME go is pinned to
# go-1.24 (build-only; 0-CVE of the final static binary is unaffected).
#   __VER__ = version  __COMMIT__ = peeled tag commit  __GOPKG__ = build-time go
FROM_SOURCE=1
VERSIONS=(2.4.0 2.5.0 2.7.0)
declare -A COMMITS=(
  [2.4.0]=9a45f6bc26c555bf6fb5f85d1868230cb4ebda63
  [2.5.0]=b4eda04f375ca6eb63867d36901787e5af6d0eb6
  [2.7.0]=0d5eb3343a50b800634cc08ace608bb6f3a3f74b
)
declare -A GOPKG=(
  [2.4.0]=go
  [2.5.0]=go-1.24
  [2.7.0]=go
)
render() { echo "s/__VER__/$1/g; s/__COMMIT__/${COMMITS[$1]}/g; s/__GOPKG__/${GOPKG[$1]}/g"; }
