# UNBLOCKED 2026-07-09 (fresh Trivy DB, live Wolfi APKINDEX, go-1.26.5): 0 fixable CVEs.
#   The former blocker was github.com/modelcontextprotocol/go-sdk v0.2.0 (DIRECT dep):
#   CVE-2026-27896 / -33252 / -34742 / GHSA-q382-vc8q-7jhj (all HIGH), fixed only in
#   go-sdk v1.x (v0->v1 major). v1 removed the generic mcp.CallToolParamsFor /
#   mcp.CallToolResultFor types. Rather than a fork, this turned out to be a TINY,
#   self-contained in-place API port (go-sdk v1's ToolHandlerFor shape:
#   `func(ctx, *CallToolRequest, In) (*CallToolResult, Out, error)`): only 3 tool
#   handlers + one result literal in internal/mcp/*.go, no behaviour change (MCP is a
#   runtime-optional listener, disabled unless --listen-mcp-addr is set). The port is
#   applied via sed in melange.yaml right after `go get go-sdk@v1.4.1`. Combined with
#   the pre-existing same-major bumps (pgx/v5, mongo-driver v1+v2, otel, x/crypto,
#   x/net, grpc) the from-source binary now scans 0 fixable CVEs.
#
# ferretdb: from-source via melange (git-checkout tag + peeled commit).
# newest-only: gate/publish the newest stable line (2.7.0).
#   __VER__ = version  __COMMIT__ = peeled tag commit  __GOPKG__ = build-time go
FROM_SOURCE=1
VERSIONS=(2.7.0)
declare -A COMMITS=(
  [2.7.0]=0d5eb3343a50b800634cc08ace608bb6f3a3f74b
)
declare -A GOPKG=(
  [2.7.0]=go
)
render() { echo "s/__VER__/$1/g; s/__COMMIT__/${COMMITS[$1]}/g; s/__GOPKG__/${GOPKG[$1]}/g"; }
