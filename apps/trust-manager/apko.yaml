# trust-manager runtime image: minimal, nonroot, multi-arch. The chart supplies the flags.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-trust-manager@local

accounts:
  groups:
    - groupname: trust-manager
      gid: 1001
  users:
    - username: trust-manager
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/bin/trust-manager

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-trust-manager"
  org.opencontainers.image.licenses: "Apache-2.0"
