# trust-manager: cert-manager's trust bundle distributor (Bundle CRD -> ConfigMaps/Secrets
# in every namespace), from source via melange. Static Go binary, no CGO. Latest of the
# last 3 minor lines, each pinned by sha256 of the GitHub tag tarball.
#
# No version stamp: upstream's Makefile passes -X .../internal/version.AppVersion, but no Go
# code defines that variable (checked 0.23.0..0.25.0), so the flag is a no-op there too.
# The debian trust-package images (the default public CA bundle) are not built; the chart
# leaves defaultPackage off and bundles name their own sources.
FROM_SOURCE=1
VERSIONS=(0.23.0 0.24.0 0.25.0)
declare -A SHA256=(
  [0.23.0]=27d2e3329c8987de0a2b096498d92e7a361c13cb3925f5dc5d97d2ad8a1eb7e3
  [0.24.0]=c1ba3525637adc858a8addb24b87be4d0189a77c0e532734d9aeac41b3351f71
  [0.25.0]=e4f05f49c662efa7c1df3a333d8b812f2972fbb8701352bc6607ae4120034a05
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
