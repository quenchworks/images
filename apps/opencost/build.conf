# opencost: Kubernetes cost monitoring and allocation (CNCF). From-source via
# melange (static Go build of the release tarball, CGO disabled). Newest patch
# of the last three stable MINOR lines.
#
# Upstream also tags a 2.x line, but every 2.x tag is still a release candidate
# (2.6.0-rc.0 and below as of 2026-09-21), so the stable window is 1.119, 1.120
# and 1.121. scripts/check/opencost.py reads the releases endpoint with its
# prerelease filter rather than tags, which is what keeps the RCs out.
#
# One toolchain for all three lines: the go directives are 1.26.4, 1.26.0 and
# 1.25.5, and Wolfi's go-1.26 is 1.26.8, at or above every one. go-1.25 is not
# an option even for the 1.119 line, because Wolfi's newest go-1.25 is 1.25.12
# and that stdlib carries seven HIGH advisories of its own.
#
# CONFIG PATH, the one place this image diverges from upstream's. The cloud
# pricing JSONs (aws.json, azure.json, default.json, ...) are resolved at
# runtime as path.Join(CONFIG_PATH, name), and core/pkg/env defaults
# CONFIG_PATH to /var/configs. Upstream's own Dockerfile installs them to
# /models instead, which only works because their chart sets CONFIG_PATH=/models.
# This image installs them where the binary looks by default, so it runs with no
# environment at all. A deployment ported from upstream must drop that
# CONFIG_PATH override or point it at /var/configs.
FROM_SOURCE=1
VERSIONS=(1.119.2 1.120.4 1.121.3)
declare -A SHA256=(
  [1.119.2]=8462ef421da34f4fc10e1051dad1b43e5367a44b751174ea2f90d97c8d7a44f7
  [1.120.4]=3e9a5088ac1fdf5e6fc97d11167a89dda8b6b3af79a165d61ada507be414b681
  [1.121.3]=47449fcd29be3e7ce781bf801a7dbeaaee29f9e42992368cedef7d718572395b
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
