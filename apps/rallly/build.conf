# rallly: Rallly (lukevella/rallly, AGPL-3.0), meeting scheduling polls (a self-hosted Doodle alternative) on Next.js
# and PostgreSQL. Images issue #97.
#
# From the release tag: pnpm install of the monorepo, prisma generate, the Next.js standalone build of @rallly/web
# (NEXT_PUBLIC_SELF_HOSTED=true), plus an exact prisma CLI with its schema engine for `migrate deploy` at start (upstream
# runs `npm add prisma@7` in its Dockerfile, a floating version). Node 24. Open core: without a license key a space has
# one seat; poll participants need no account. LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(4.17.1)
declare -A SHA256=(
  [4.17.1]=748dfef5b48834966bb1d814242bd6ec2129b013d2bd26cb5313b9928c0e1b6b
)
PRISMA=7.8.0
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g; s/__PRISMA__/$PRISMA/g"; }
