# percona-xtradb-cluster-operator: the Percona Operator for MySQL based on
# Percona XtraDB Cluster (Apache-2.0), which runs synchronous multi-primary
# Galera clusters with HAProxy or ProxySQL in front. Built from source on Wolfi,
# static Go. The operator image is also the init image: PXC, HAProxy, ProxySQL
# and backup pods copy their entrypoint scripts and helper binaries out of it
# with bash, so it keeps upstream's file layout and ships bash and busybox.
# 1.18.0 and 1.19.1 also need edwards25519, cert-manager, spdystream and
# mongo-driver from the float. Image and chart.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(1.18.0 1.19.1 1.20.0)
declare -A SHA=(
  [1.18.0]=e08940a62d9892ca7db00f07d5b3d09c70f7a1a57b23680f7730bed50461048a
  [1.19.1]=3ef429a1d56f91df856373f698e5f82cabd8d54225415865607341ae064d9b86
  [1.20.0]=541ef85e2713057ec486f7e2cd482765046a52315f4db9f4f8b2fc0d9bbf2502
)
render() { echo "s/__VER__/$1/g; s/__SHA256__/${SHA[$1]}/g"; }
