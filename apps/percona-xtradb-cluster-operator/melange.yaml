# Builds the Percona XtraDB Cluster Operator from source onto Wolfi: CGO off,
# the manager plus the helper binaries upstream's Dockerfile builds, and the
# scripts under build/ at the image root where the operator's generated pods
# expect them. The xtrabackup sidecars exist from 1.19 on.
package:
  name: quench-percona-xtradb-cluster-operator
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Percona XtraDB Cluster Operator, built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - bash
      - busybox

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/percona/percona-xtradb-cluster-operator/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      set -eu
      export CGO_ENABLED=0
      export GOTOOLCHAIN=local
      export GOFLAGS=-mod=mod
      # ---- 0-CVE module float (docs/go-module-float.md) ----------------------
      # FLOOR is a floor, not a pin: only modules below it are raised, and every
      # shipped binary is asserted at or above it after the build. 1.18.0 and
      # 1.19.1 carry edwards25519 v1.1.0, cert-manager v1.19.2, spdystream
      # v0.5.0 and mongo-driver v1.17.6.
      FLOOR="golang.org/x/net@v0.58.0 golang.org/x/text@v0.41.0 golang.org/x/crypto@v0.56.0 golang.org/x/sys@v0.47.0 golang.org/x/mod@v0.40.0 golang.org/x/oauth2@v0.36.0 google.golang.org/grpc@v1.83.2 filippo.io/edwards25519@v1.1.1 github.com/cert-manager/cert-manager@v1.19.3 github.com/moby/spdystream@v0.5.1 go.mongodb.org/mongo-driver@v1.17.7 go.opentelemetry.io/otel@v1.45.0 go.opentelemetry.io/otel/sdk@v1.45.0 go.opentelemetry.io/otel/trace@v1.45.0 go.opentelemetry.io/otel/metric@v1.45.0"
      MODS="$(echo "$FLOOR" | tr ' ' '\n' | cut -d@ -f1)"
      below_floor() {
        awk -v floor="$FLOOR" -v tag="$1" '
          BEGIN { n = split(floor, f, " ")
                  for (i = 1; i <= n; i++) { split(f[i], kv, "@"); want[kv[1]] = kv[2] } }
          ($1 in want) {
            split(substr($2, 2), g, "."); split(substr(want[$1], 2), w, ".")
            for (i = 1; i <= 3; i++) {
              if ((g[i] + 0) > (w[i] + 0)) next
              if ((g[i] + 0) < (w[i] + 0)) { print $1 "@" want[$1] " (" tag " has " $2 ")"; next }
            }
          }'
      }
      need="$(go list -m -e $MODS | awk 'NF >= 2 && $NF ~ /^v[0-9]/ { print $1, $NF }' | below_floor go.mod | awk '{ print $1 }')"
      if [ -n "$need" ]; then go get $need; fi
      go mod tidy
      rm -rf vendor
      d="${{targets.destdir}}"
      mkdir -p "$d/usr/local/bin"
      # cmd dir:installed path, as upstream's Dockerfile lays them out
      for p in manager:/usr/local/bin/percona-xtradb-cluster-operator peer-list:/peer-list pitr:/pitr \
               mysql-state-monitor:/mysql-state-monitor xtrabackup/server:/xtrabackup-server-sidecar \
               xtrabackup/run-backup:/xtrabackup-run-backup; do
        [ -d "./cmd/${p%%:*}" ] || continue
        go build -trimpath -ldflags "-s -w -X main.GitCommit=v${{package.version}} -X main.GitBranch=v${{package.version}}" \
          -o "$d${p#*:}" "./cmd/${p%%:*}"
        bad="$(go version -m "$d${p#*:}" | awk '$1 == "dep" || $1 == "=>" { print $2, $3 }' | below_floor "${p#*:}")"
        [ -z "$bad" ] || { echo "0-CVE float did not reach ${p#*:}:"; echo "$bad"; exit 1; }
      done
      # The entrypoint and probe scripts, configs, logcollector and backup trees.
      rm -f build/Dockerfile build/build-versionservice-client.sh
      cp -a build/. "$d/"
      test -x "$d/pxc-init-entrypoint.sh" && test -x "$d/peer-list"
      grep -qx "${{package.version}}" pkg/version/version.txt

test:
  pipeline:
    - runs: |
        test -x /usr/local/bin/percona-xtradb-cluster-operator
        test -x /pxc-init-entrypoint.sh
