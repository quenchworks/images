# Assembles the Percona XtraDB Cluster Operator image: the static manager and
# helper binaries, nonroot uid 1001, multi-arch, SBOM by apko. The same image is
# the operator's init image, so it keeps upstream's layout (scripts and helpers
# at /) and ships bash and busybox for the init scripts that copy them into
# the PXC, HAProxy, ProxySQL and backup pods.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - bash
    - busybox
    - quench-percona-xtradb-cluster-operator@local

accounts:
  groups:
    - groupname: nonroot
      gid: 1001
  users:
    - username: nonroot
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/local/bin/percona-xtradb-cluster-operator

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-percona-xtradb-cluster-operator"
  org.opencontainers.image.licenses: "Apache-2.0"
