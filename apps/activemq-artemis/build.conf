# activemq-artemis: Apache Artemis (formerly ActiveMQ Artemis) from its official binary
# distribution, on a Wolfi JRE. FROM_SOURCE=0: fetch + unpack; each sha256 is from a
# download whose sha512 matched the one Apache publishes.
#
# Artemis left the ActiveMQ project: 2.50+ ship from dlcdn.apache.org/artemis/artemis/
# and Maven group org.apache.artemis. The last ActiveMQ-era dist, 2.44.0, scans at 22
# vulnerable jars (netty CRITICAL, jetty, zookeeper, log4j); 2.57.0 scans at 0. Only
# 2.57.0 is published there, so this ships one line. Measured 2026-09-28.
FROM_SOURCE=0
VERSIONS=(2.57.0)
declare -A SHA256=(
  [2.57.0]=c2930af01e234c6bc3c824deacb119c31385f1611d7675b4e9740f38b9a960d3
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
