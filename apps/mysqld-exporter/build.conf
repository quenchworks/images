# mysqld-exporter: from-source via melange (Go build of prometheus/mysqld_exporter
# tag tarball). Newest stable line only. Each release pins its source tarball by sha256.
FROM_SOURCE=1
VERSIONS=(0.20.0)
declare -A SHA256=(
  [0.20.0]=78c04e7d11a762684fa48f3264c06b61cb115194668cf1e1be383108dd75fbb9
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
