# Actual's sync server from npm into /app. A small package.json pins the release and carries the
# overrides; native addons build from source with node-gyp (npm 12 runs only allowScripts installs).
package:
  name: quench-actual
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Actual budget sync server, npm package on Wolfi Node 24"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
      - libstdc++
      - nodejs-24
      - tzdata

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - nodejs-24
      - node-gyp
      - npm
      - python3

pipeline:
  - runs: |
      set -eu
      export HOME="$(mktemp -d)" npm_config_cache="$(mktemp -d)"
      app="${{targets.destdir}}/app"
      install -d "$app"
      # minimatch CVE-2026-118764: migrate 2.1.0 wants ^9 but only loads it from its CLI scripts
      # (bin/migrate-*), which Actual never runs; 11.x keeps the same CommonJS minimatch.filter.
      cat > "$app/package.json" <<EOF
      {
        "name": "quench-actual",
        "private": true,
        "dependencies": { "@actual-app/sync-server": "${{package.version}}" },
        "overrides": { "minimatch": "11.0.1" },
        "allowScripts": { "argon2": true, "bcrypt": true, "better-sqlite3": true }
      }
      EOF
      ( cd "$app" && npm install --omit=dev --no-audit --no-fund )
      v="$(node -p "require('$app/node_modules/@actual-app/sync-server/package.json').version")"
      [ "$v" = "${{package.version}}" ] || { echo "installed $v"; exit 1; }
      test -s "$app/node_modules/@actual-app/web/build/index.html"
      # the addons ship prebuilt binaries for every platform (npm 12 has no build-from-source):
      # compile each against Wolfi's Node headers (better-sqlite3 skips without force_build=1),
      # then drop the prebuilds
      for m in better-sqlite3 argon2 bcrypt; do
        ( cd "$app/node_modules/$m" && node-gyp rebuild --release --nodedir=/usr --force_build=1 )
      done
      find "$app/node_modules" -type d -name prebuilds -prune -exec rm -rf {} +
      for m in better-sqlite3 argon2 bcrypt; do
        find "$app/node_modules/$m/build" -name '*.node' | grep -q . || { echo "$m has no native build"; exit 1; }
      done
      ( cd "$app" && node -e 'require("better-sqlite3")(":memory:").prepare("select 1").get(); require("bcrypt"); import("argon2")' )
      rm -rf "$app/package-lock.json"

test:
  pipeline:
    - runs: |
        test -f /app/node_modules/@actual-app/sync-server/build/bin/actual-server.js
