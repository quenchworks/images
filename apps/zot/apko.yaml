# Assembles the zot (OCI-native registry) runtime image. Minimal, nonroot,
# multi-arch, SBOM by apko. The default command serves the bundled config, which
# stores blobs under /var/lib/zot and listens on :5000. Data lives entirely under
# the /var/lib/zot volume, so the rest of the rootfs can be mounted read-only; the
# chart provides persistence by mounting over /etc/zot and /var/lib/zot.
# ca-certificates-bundle is included so remote/sync backends and registries can be
# reached over TLS.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-zot@local

accounts:
  groups:
    - groupname: zot
      gid: 1001
  users:
    - username: zot
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/bin/zot serve /etc/zot/config.json

work-dir: /var/lib/zot

paths:
  - path: /var/lib/zot
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o700

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-zot"
  org.opencontainers.image.licenses: "Apache-2.0"
