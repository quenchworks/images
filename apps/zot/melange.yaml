# Builds zot (project-zot/zot, an OCI-native container registry) from source onto
# Wolfi. Single static Go binary (./cmd/zot), no CGO — matching upstream's
# `make binary` (env CGO_ENABLED=0 GOEXPERIMENT=jsonv2). The base binary is built
# with no extensions/UI, so no cgo and no browser assets are pulled in. Version
# info is stamped via -X into pkg/buildinfo so `zot --version` reports the real
# release. Output is a signed APK in Quenchworks' own repo. No upstream distro
# binaries. A minimal default config ships at /etc/zot/config.json: filesystem
# storage under /var/lib/zot and the HTTP API on :5000 (unprivileged, so the
# image runs nonroot). The chart mounts its own config over this default.
package:
  name: quench-zot
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened zot (OCI-native container registry), built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/project-zot/zot/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      export CGO_ENABLED=0
      export GOEXPERIMENT=jsonv2
      export GOFLAGS=-mod=mod
      # 0-CVE gate bump (patch, same major, no API break):
      #   golang.org/x/text v0.38.0 -> v0.39.0 (CVE-2026-56852: infinite loop on
      #                     invalid input). tidy keeps it in the graph at the bump.
      #   github.com/google/cel-go v0.28.1 -> v0.29.2 (GHSA-gcjh-h69q-9w9g, MEDIUM:
      #                     ext.NativeTypes(ParseStructTag("json")) exposes json:"-"
      #                     fields to user CEL expressions; first fixed in 0.29.0).
      #                     zot's own cel usage (pkg/api CEL access control) touches
      #                     no API that changed in 0.29.
      go get golang.org/x/text@v0.41.0 golang.org/x/net@v0.58.0 golang.org/x/crypto@v0.56.0 golang.org/x/sys@v0.47.0 google.golang.org/grpc@v1.83.2 github.com/google/cel-go@v0.29.2
      go mod tidy
      GOVER="$(go env GOVERSION)"
      BI=zotregistry.dev/zot/v2/pkg/buildinfo
      go build -trimpath \
        -ldflags "-s -w \
          -X ${BI}.ReleaseTag=v${{package.version}} \
          -X ${BI}.Commit=v${{package.version}} \
          -X ${BI}.BinaryType=minimal \
          -X ${BI}.GoVersion=${GOVER}" \
        -o "${{targets.destdir}}/usr/bin/zot" ./cmd/zot
      mkdir -p "${{targets.destdir}}/etc/zot"
      printf '%s\n' \
        '{' \
        '  "distSpecVersion": "1.1.1",' \
        '  "storage": {' \
        '    "rootDirectory": "/var/lib/zot"' \
        '  },' \
        '  "http": {' \
        '    "address": "0.0.0.0",' \
        '    "port": "5000"' \
        '  },' \
        '  "log": {' \
        '    "level": "info"' \
        '  }' \
        '}' \
        > "${{targets.destdir}}/etc/zot/config.json"
