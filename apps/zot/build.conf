# zot (project-zot/zot): from-source via melange (Go build from the git tag
# tarball). Image-only (an OCI-native registry server, no chart). zot's only
# actively-maintained minor line under v2 is 2.1; we ship its two most recent
# releases (2.1.17, 2.1.18). Both use the /v2 module path, GOEXPERIMENT=jsonv2
# and stamp version vars in pkg/buildinfo. The older 2.0 line is intentionally
# excluded (pre-/v2 module path, ldflags in pkg/api/config, go 1.21, superseded
# deps) — it cannot share this recipe and is CVE-risky/EOL. Single static Go
# binary, CGO disabled. ReleaseTag/Commit are stamped with the v-prefixed tag.
FROM_SOURCE=1
VERSIONS=(2.1.17 2.1.18)
declare -A SHA256=(
  [2.1.17]=c182a648655f1a1e0c38814235767133dd2217e0cb3372c8b017e940c29597a1
  [2.1.18]=74fb3e358bd92ac3f74d5fdcd8841f842428d23593ca6a8f86ae4b734d1a8a37
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
