# trivy-scanner: the QuenchWorks trivy build with a busybox userland, for the scan Jobs
# Trivy Operator launches. Those Jobs always run `/bin/sh -c "trivy ... ; cat|bzip2|base64
# ..."`, so the shell-free trivy CLI image cannot be the scanner. This image adds busybox
# and bzip2 to the same quench-trivy package apps/trivy builds (a sibling apk: the CI
# workflow builds apps/trivy's recipe into ./packages first). Image only, no chart; the
# trivy-operator chart points its scan Jobs here.
#
# VERSIONS tracks apps/trivy: bump both together.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(0.74.0)
render() { echo "s/__VER__/$1/g"; }
