# A meta package: the trivy binary comes from quench-trivy (apps/trivy); this adds the
# userland the operator's scan Job command line needs.
package:
  name: quench-trivy-scanner
  version: __VER__
  epoch: 0
  description: "Quenchworks trivy with a busybox userland for Trivy Operator scan Jobs"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - quench-trivy
      - busybox
      - bzip2
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox

pipeline:
  - runs: |
      install -d "${{targets.destdir}}/usr/share/quench-trivy-scanner"
      echo "trivy ${{package.version}} with busybox and bzip2, for Trivy Operator scan Jobs" \
        > "${{targets.destdir}}/usr/share/quench-trivy-scanner/README"
