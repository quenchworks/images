# rekor-tiles: Rekor v2, the Sigstore transparency log (Apache-2.0), built on
# Trillian Tessera tiles; it needs no Trillian or MySQL. Built from source on
# Wolfi, static Go, POSIX storage backend (a directory of tiles). Image and chart.
# 2.1.0 also needs edwards25519 v1.1.1 and sigstore/sigstore v1.10.4 from the float.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(2.1.0 2.2.1 2.3.0)
declare -A SHA=(
  [2.1.0]=4c0dc508986ca53f782dc6639ecd45191b6107ea604301574c075f3f1f935e40
  [2.2.1]=8d15fc14b634faa1296cabf8e9f2141af9ddec26df06bb16ca4859ddd1bf7339
  [2.3.0]=f92ccc2b8640534d43284af56661f20948b83bd9e12f604dce04ce9bdde15d22
)
render() { echo "s/__VER__/$1/g; s/__SHA256__/${SHA[$1]}/g"; }
