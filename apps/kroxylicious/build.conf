# kroxylicious: the Kroxylicious proxy (Kafka protocol proxy with filters) from the release's
# kroxylicious-app-<ver>-bin.tar.gz (libs/ of separate jars), run on a Wolfi JRE with the
# vulnerable libraries swapped one jar at a time (melange.yaml). The operator and admission
# webhook are separate artifacts and not part of this image.
# LATEST ONLY: pre-1.0, one supported line; the swap list is measured per release.
BLOCKED=0
FROM_SOURCE=0
VERSIONS=(0.25.1)
declare -A SHA256=(
  [0.25.1]=e6b670784be06cebb298b349c34f6ff7ffc86de2fbd4d60430efed2ebc594c92
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
