# cyberchef: CyberChef (gchq/CyberChef, Apache-2.0), a web app for encoding, decoding, encryption,
# compression and data analysis that runs entirely in the browser. Images issue #53.
#
# Built from the release tag with Node 24 (npm ci + grunt prod, as upstream's Dockerfile does) and served
# as static files by Wolfi nginx on 8080, nonroot. The build's release zip, bundle report and digest file
# are not shipped. LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(11.5.0)
declare -A SHA256=(
  [11.5.0]=b81cf7195b43026995be13f015118e1cc9a488823eee123bdd3d9c76b6b6c92d
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
