# kestra: Kestra, a declarative event-driven orchestration platform (YAML flows, plugins, a web
# UI and an API), from the release's self-running uber-jar on a Wolfi openjdk-25 JRE (class file
# major 69). The image runs it with java -jar.
#
# 0-CVE: the stock 2.0.11 jar carries one finding, org.json 20231013, shaded by posthog-java 1.2.0
# (its newest release still shades it) under com/posthog/java/shaded/org/json. melange.yaml
# rebuilds org.json 20260814 with the same relocation (maven-shade) and overlays the classes and
# the org.json metadata.
#
# NEWEST-ONLY: Kestra patches its newest line.
BLOCKED=0
FROM_SOURCE=0
VERSIONS=(2.0.13)
# sha256 of the release asset kestra-<version>, as checksums_sha256.txt publishes it (matched the download)
declare -A SHA256=(
  [2.0.13]=37890d8e44e49514a4b493cab02e62df2c656534add741540be2516914c5d77c
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
