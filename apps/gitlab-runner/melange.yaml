# Builds gitlab-runner from the release tag onto Wolfi: the root main package,
# static, with upstream's ldflags (common.NAME/VERSION/BRANCH). The canonical
# module floor is floated and asserted in the binary.
package:
  name: quench-gitlab-runner
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened GitLab Runner, built from source on Wolfi"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go

pipeline:
  - uses: fetch
    with:
      uri: https://gitlab.com/gitlab-org/gitlab-runner/-/archive/v${{package.version}}/gitlab-runner-v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      set -eu
      export CGO_ENABLED=0 GOTOOLCHAIN=local GOFLAGS=-mod=mod
      # ---- 0-CVE module float (docs/go-module-float.md) ----------------------
      FLOOR="golang.org/x/net@v0.58.0 golang.org/x/text@v0.41.0 golang.org/x/crypto@v0.56.0 golang.org/x/sys@v0.47.0 golang.org/x/mod@v0.40.0 golang.org/x/oauth2@v0.36.0 google.golang.org/grpc@v1.83.2 go.opentelemetry.io/otel@v1.45.0 go.opentelemetry.io/otel/sdk@v1.45.0 go.opentelemetry.io/otel/trace@v1.45.0 go.opentelemetry.io/otel/metric@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.45.0"
      MODS="$(echo "$FLOOR" | tr ' ' '\n' | cut -d@ -f1)"
      below_floor() {
        awk -v floor="$FLOOR" -v tag="$1" '
          BEGIN { n = split(floor, f, " ")
                  for (i = 1; i <= n; i++) { split(f[i], kv, "@"); want[kv[1]] = kv[2] } }
          ($1 in want) {
            split(substr($2, 2), g, "."); split(substr(want[$1], 2), w, ".")
            for (i = 1; i <= 3; i++) {
              if ((g[i] + 0) > (w[i] + 0)) next
              if ((g[i] + 0) < (w[i] + 0)) { print $1 "@" want[$1] " (" tag " has " $2 ")"; next }
            }
          }'
      }
      need="$(go list -m -e $MODS | awk 'NF >= 2 && $NF ~ /^v[0-9]/ { print $1, $NF }' | below_floor go.mod | awk '{ print $1 }')"
      if [ -n "$need" ]; then go get $need; fi
      go mod tidy
      C=gitlab.com/gitlab-org/gitlab-runner/common
      go build -trimpath \
        -ldflags "-s -w -X $C.NAME=gitlab-runner -X $C.VERSION=${{package.version}} -X $C.BRANCH=v${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/gitlab-runner" .
      bad="$(go version -m "${{targets.destdir}}/usr/bin/gitlab-runner" \
        | awk '$1 == "dep" || $1 == "=>" { print $2, $3 }' | below_floor gitlab-runner)"
      [ -z "$bad" ] || { echo "0-CVE float did not reach gitlab-runner:"; echo "$bad"; exit 1; }
      "${{targets.destdir}}/usr/bin/gitlab-runner" --version | grep -E "^Version: +${{package.version}}$"
