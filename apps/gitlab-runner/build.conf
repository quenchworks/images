# gitlab-runner (gitlab-org/gitlab-runner on gitlab.com): the GitLab CI job runner,
# from source via melange. Static Go (CGO off; upstream's non-FIPS target), with
# NAME, VERSION and BRANCH stamped on common/ as upstream's Makefile does. VERSION
# also picks the helper image tag (v<version>) the Kubernetes and Docker
# executors pull. Latest patch of the last 3 minor lines.
FROM_SOURCE=1
VERSIONS=(19.3.6 19.4.4 19.5.3)
declare -A SHA256=(
  [19.3.6]=28868bb21ffec1fbc618d329d907c7b5a794e29f862bf328bff87de88594d1d3
  [19.4.4]=d3eccc855ceee19fcf397af60d6647ce1f2412f62123da7cc798e6839090f1fe
  [19.5.3]=9d3a38b7129f1f99ccab0683e383b1e49620638d6dc4159a4bb600de4320ec7e
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
