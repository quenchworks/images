# pgadmin4: pgAdmin 4, the web administration and development platform for PostgreSQL, from
# the source tag (REL-X_Y): a Python 3.14 venv from requirements.txt plus the yarn-built web
# bundle, served by gunicorn in server mode on 8080, with the PostgreSQL 18 client tools for
# backup and restore. Data (the SQLite config DB, sessions, storage) lives in /var/lib/pgadmin.
#
# 0-CVE: the installed venv carries pip's vendored urllib3, msgpack and setuptools (dropped
# with pip and setuptools) and paramiko 3.5.1 (CVE-2026-44405, fixed only in 5.0.0, pinned).
# paramiko is reached only through sshtunnel 0.5.1, which guards every DSSKey use (paramiko
# 4+ removed DSS), so melange.yaml floats paramiko 5.0.0.
#
# NEWEST-ONLY: pgAdmin ships one line. The image version is X.Y; the tag is REL-X_Y.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(9.19)
# sha256 of the GitHub source tarball, from a download
declare -A SHA256=(
  [9.19]=a78485f162748b4383f9d97ea334338c3e737e81a98f461718e948211bb99ba2
)
render() { echo "s/__VER__/$1/g; s/__TAG__/REL-${1//./_}/g; s|__SHA256__|${SHA256[$1]}|g"; }
