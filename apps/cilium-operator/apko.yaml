# Cilium Operator (generic) runtime image. Minimal, nonroot, multi-arch, SBOM by apko.
# The operator is a Kubernetes controller: it needs only its service account and the
# cilium-config ConfigMap the chart mounts at --config-dir. Health on :9234 (/healthz).
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-cilium-operator@local

accounts:
  groups:
    - groupname: nonroot
      gid: 1001
  users:
    - username: nonroot
      uid: 1001
      gid: 1001
  run-as: 1001

environment:
  # upstream's image sets this: the gops agent writes its config dir here
  GOPS_CONFIG_DIR: /tmp

entrypoint:
  command: /usr/bin/cilium-operator-generic

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-cilium-operator"
  org.opencontainers.image.licenses: "Apache-2.0"
