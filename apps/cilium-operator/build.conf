# cilium-operator: the Cilium Operator, generic variant (cluster-pool and Kubernetes IPAM,
# CRD registration, garbage collection of Cilium identities and endpoints), built from
# source (./operator with the ipam_provider_operator tag, as upstream's
# cilium-operator-generic). The cloud variants (aws, azure, alibabacloud) are not built.
# Newest patch of the last 3 minor lines. Static Go binary, no CGO.
#
# 0-CVE: melange.yaml floats the modules below their floor and re-vendors (measured
# 2026-09-25: 1.20.2 grpc, cel-go, gobgp/v4, x/crypto; 1.19.8 grpc, mongo-driver, cel-go,
# gopacket, x/crypto; 1.18.14 mongo-driver, cilium/ebpf, cel-go, gopacket, x/crypto).
# A local build of each line with the float scanned 0.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(1.18.15 1.19.9 1.20.3)
declare -A SHA256=(
  [1.18.15]=aae18669d12c38b4b6b7cccab7d16cbcfea10352d58945f21691fc7fdde221d8
  [1.19.9]=0487a8c99b4fdf1e2877e5beaec36ab4bd0414f44f43e65e040f53dc6762d7b4
  [1.20.3]=5ebbd251ed8890d809aee3a6dcaec4cb15cc00bd8e9e8c0be379d220e44aa743
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
