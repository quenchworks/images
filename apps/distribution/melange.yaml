# Builds the CNCF Distribution registry from source onto Wolfi. Single static Go
# binary (./cmd/registry), no CGO. Output is a signed APK in Quenchworks' own repo.
# No upstream distro binaries. A minimal default config ships at
# /etc/distribution/config.yml: filesystem storage under /var/lib/registry and the
# HTTP API on :5000 (unprivileged, so the image runs nonroot). The chart mounts its
# own config over this default.
package:
  name: quench-distribution
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Distribution (OCI registry), built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/distribution/distribution/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      # 0-CVE gate: minimal same-major MINOR bumps of the flagged transitive deps.
      # golang.org/x/crypto v0.49.0->0.52.0 (13 ssh/agent/knownhosts CVEs);
      # golang.org/x/net    v0.52.0->0.55.0 (7 net/html + idna + http2 CVEs).
      go get golang.org/x/crypto@v0.56.0
      go get golang.org/x/net@v0.58.0 golang.org/x/text@v0.41.0
      # grpc GHSA-hrxh-6v49-42gf (xDS RBAC + HTTP/2, HIGH): bump to v1.82.1. grpc@1.82.1
      # requires the otel@1.44.0 family + x/oauth2@0.36.0, so float that cascade too.
      # CVE-2026-81871 (MEDIUM): otlploggrpc <0.21.0 ignores the env TLS cert vars, so a
      # configured CA/pin is silently dropped. The otel LOG family moves as one set;
      # 0.21.0 is its version in the otel 1.45.0 release train.
      go get google.golang.org/grpc@v1.83.2 \
             go.opentelemetry.io/otel@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.45.0 go.opentelemetry.io/otel/sdk@v1.45.0 \
             go.opentelemetry.io/otel/trace@v1.45.0 go.opentelemetry.io/otel/metric@v1.45.0 \
             go.opentelemetry.io/otel/log@v0.21.0 go.opentelemetry.io/otel/sdk/log@v0.21.0 go.opentelemetry.io/otel/exporters/otlp/otlplog/otlploggrpc@v0.21.0 go.opentelemetry.io/otel/exporters/otlp/otlplog/otlploghttp@v0.21.0 go.opentelemetry.io/otel/exporters/stdout/stdoutlog@v0.21.0 \
             golang.org/x/oauth2@v0.36.0
      go mod tidy
      go build -trimpath \
        -ldflags "-s -w -X github.com/distribution/distribution/v3/version.version=v${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/registry" ./cmd/registry
      mkdir -p "${{targets.destdir}}/etc/distribution"
      printf '%s\n' \
        'version: 0.1' \
        'log:' \
        '  level: info' \
        'storage:' \
        '  filesystem:' \
        '    rootdirectory: /var/lib/registry' \
        '  cache:' \
        '    blobdescriptor: inmemory' \
        'http:' \
        '  addr: :5000' \
        '  headers:' \
        '    X-Content-Type-Options: [nosniff]' \
        'health:' \
        '  storagedriver:' \
        '    enabled: true' \
        '    interval: 10s' \
        '    threshold: 3' \
        > "${{targets.destdir}}/etc/distribution/config.yml"
