# distribution: from-source via melange (Go build of the registry from the git tag
# tarball). Latest 3 stable releases on the 3.x line. Each pins its source by sha256.
# Single static Go binary, no CGO.
FROM_SOURCE=1
VERSIONS=(3.0.0 3.1.0 3.1.1)
declare -A SHA256=(
  [3.0.0]=92f4c81ea8cdbc190dea4109dffc6ffbc9f1724c00410913e9e17278d006bf9f
  [3.1.0]=81735b78f4a653bcfac1959284c6eb7e6b114574d758a623229eee6fa36292ae
  [3.1.1]=419183e8c1426b5d625732cf6846a2d48ad8e898a1659d7bec7171b7d156673e
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
