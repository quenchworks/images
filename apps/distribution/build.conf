# distribution: from-source via melange (Go build of the registry from the git tag
# tarball). Newest stable release on the 3.x line. Pins its source by sha256.
# Single static Go binary, no CGO.
FROM_SOURCE=1
VERSIONS=(3.1.2)
declare -A SHA256=(
  [3.1.2]=2f9b6fc00bec854e62e9b720903a9c9b48018505177f7c7a8ce7b74da2b23e4f
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
