# Packages Grist onto Wolfi: the tagged source compiled with yarn (tsc + webpack), the
# production dependencies with the 0-CVE pins below, and the gVisor formula sandbox (runsc
# from source with the unprivileged-mode port, plus a Python venv for the data engine).
package:
  name: quench-grist
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Grist spreadsheet-database with the gVisor formula sandbox, on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - nodejs-22
      - libstdc++            # @gristlabs/sqlite3 addon
      - python-3.13          # the data engine, run inside runsc from /grist/sandbox_venv3
      - procps               # pgrep: Grist finds and kills each sandbox's runsc processes
      - ca-certificates-bundle
      - tzdata

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - bash                 # buildtools/build.sh
      - build-base           # make + g++ if @gristlabs/sqlite3 has no prebuilt for this arch; gcc for the prewarmer
      - busybox
      - ca-certificates-bundle
      - curl
      - go-1.27              # gvisor go.mod: go 1.27.2
      - linux-headers        # the freestanding prewarmer includes asm/unistd.h
      - nodejs-22
      - npm                  # native modules probe their prebuilt through npm first
      - node-gyp
      - python-3.13          # node-gyp, and the sandbox venv
      - python-3.13-dev      # wrapt has no cp313 wheel and builds from source
      - yarn

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/gristlabs/grist-core/archive/refs/tags/v__VER__.tar.gz
      expected-sha256: __SHA256__
  # gVisor runsc, built from the go branch commit pinned in build.conf. Upstream Grist ships
  # gristlabs/gvisor-unprivileged (runsc of 2022 on go1.17.6) whose --unprivileged flag starts
  # the gofer and sentry without new namespaces, chroot or capabilities, so it runs in a
  # default nonroot container. Stock runsc cannot (measured 2026-10-14: fork/exec
  # /proc/self/exe: operation not permitted, it must unshare namespaces). The edit below
  # re-applies that flag to current gVisor; every substitution must match exactly once.
  # The go branch has no main for the gvisor_sentry sidecar and no prewarmer (both are
  # bazel targets), so those two files come from the matching master commit.
  - runs: |
      set -eu
      export GOTOOLCHAIN=local CGO_ENABLED=0 GOFLAGS="-buildvcs=false -trimpath"
      src=/tmp/gvisor; mkdir -p "$src"
      curl -fsSL -o /tmp/gvisor.tgz "https://github.com/google/gvisor/archive/__GVISOR_GO__.tar.gz"
      echo "__GVISOR_GO_SHA__  /tmp/gvisor.tgz" | sha256sum -c -
      tar xzf /tmp/gvisor.tgz -C "$src" --strip-components=1
      raw="https://raw.githubusercontent.com/google/gvisor/__GVISOR_SRC__"
      mkdir -p "$src/runsc/cmd/sentry"
      curl -fsSL -o "$src/runsc/cmd/sentry/sentry_main.go" "$raw/runsc/cmd/sentry/sentry_main.go"
      curl -fsSL -o /tmp/prewarmer.c "$raw/runsc/prewarmer/prewarmer.c"
      printf '%s  %s\n' __SENTRY_MAIN_SHA__ "$src/runsc/cmd/sentry/sentry_main.go" __PREWARMER_SHA__ /tmp/prewarmer.c | sha256sum -c -
      cd "$src"
      python3.13 - <<'PY'
      def sub(path, old, new, everywhere=False):
          s = open(path).read()
          n = s.count(old)
          if n == 0 or (n != 1 and not everywhere):
              raise SystemExit(f"{path}: expected one match, found {n}: {old[:60]!r}")
          open(path, "w").write(s.replace(old, new))
      sub("runsc/config/config.go",
          '\tTestOnlyAllowRunAsCurrentUserWithoutChroot bool `flag:"TESTONLY-unsafe-nonroot"`\n',
          '\tTestOnlyAllowRunAsCurrentUserWithoutChroot bool `flag:"TESTONLY-unsafe-nonroot"`\n\n'
          '\t// Unprivileged starts the sandbox and gofer as the current user without new\n'
          '\t// namespaces, chroot or capabilities (gristlabs/gvisor --unprivileged).\n'
          '\tUnprivileged bool `flag:"unprivileged"`\n')
      sub("runsc/config/flags.go", '\tflagSet.Bool("rootless", false,',
          '\tflagSet.Bool("unprivileged", false, "start the sandbox and gofer as the current user without new namespaces, chroot or capabilities.")\n'
          '\tflagSet.Bool("rootless", false,')
      for f in ("runsc/cmd/run.go", "runsc/cmd/do.go"):
          sub(f, "\t\tif err := specutils.MaybeRunAsRoot(); err != nil {",
              "\t\tif conf.Unprivileged {\n\t\t} else if err := specutils.MaybeRunAsRoot(); err != nil {")
      g = "runsc/cmd/gofer.go"
      sub(g, "\tconf := args[0].(*config.Config)\n\n\t// Set traceback level",
          "\tconf := args[0].(*config.Config)\n\tif conf.Unprivileged {\n\t\tg.applyCaps = false\n\t\tg.setUpRoot = false\n\t}\n\n\t// Set traceback level")
      sub(g, "conf.TestOnlyAllowRunAsCurrentUserWithoutChroot",
          "(conf.TestOnlyAllowRunAsCurrentUserWithoutChroot || conf.Unprivileged)", everywhere=True)
      sub(g, "\tif err := unix.Chroot(root); err != nil {",
          "\tif conf.Unprivileged {\n\t\tlog.Warningf(\"Unprivileged: gofer serves %q without chroot\", root)\n"
          "\t} else if err := unix.Chroot(root); err != nil {")
      sub("runsc/container/container.go",
          "\tif !rootlessEUID {\n\t\tif userNS, ok := specutils.GetNS(specs.UserNamespace, c.Spec); ok {",
          "\tif conf.Unprivileged {\n\t\tnss = nil\n\t\tpinGoferNetNS = false\n"
          "\t} else if !rootlessEUID {\n\t\tif userNS, ok := specutils.GetNS(specs.UserNamespace, c.Spec); ok {")
      sb = "runsc/sandbox/sandbox.go"
      sub(sb, "\tif conf.Network == config.NetworkHost || conf.DirectFS {\n\t\tif userns, ok := specutils.GetNS(specs.UserNamespace, args.Spec); ok {",
          "\tif conf.Unprivileged {\n\t\tlog.Warningf(\"Unprivileged: sandbox starts as the current user without new namespaces or chroot\")\n\t\tnss = nil\n"
          "\t} else if conf.Network == config.NetworkHost || conf.DirectFS {\n\t\tif userns, ok := specutils.GetNS(specs.UserNamespace, args.Spec); ok {")
      sub(sb, "\tif conf.Rootless || conf.TestOnlyAllowRunAsCurrentUserWithoutChroot {\n\t\t// Cannot change ownership without CAP_CHOWN.",
          "\tif conf.Rootless || conf.Unprivileged || conf.TestOnlyAllowRunAsCurrentUserWithoutChroot {\n\t\t// Cannot change ownership without CAP_CHOWN.")
      print("unprivileged port applied")
      PY
      bin="${{targets.destdir}}/usr/bin"
      install -d "$bin/gvisor-bin"
      go build -o "$bin/runsc" ./runsc
      go build -o "$bin/gvisor-bin/gvisor_sentry" ./runsc/cmd/sentry
      # flags from runsc/prewarmer/BUILD (prewarmer_binary)
      gcc -Os -ffreestanding -fno-sanitize=all -fno-stack-protector -fno-asynchronous-unwind-tables \
        -fno-unwind-tables -fno-pie -no-pie -static -nostdlib -nostartfiles \
        -Wl,--build-id=none -Wl,--gc-sections -Wl,-s -Wl,-n \
        -o "$bin/gvisor-bin/gvisor-sentry-prewarmer" /tmp/prewarmer.c
      flags="$("$bin/runsc" flags 2>&1)"
      case "$flags" in *-unprivileged*) ;; *) echo "runsc lacks -unprivileged"; exit 1 ;; esac
      cd / && rm -rf "$src" /tmp/gvisor.tgz /tmp/prewarmer.c
  - runs: |
      set -eu
      export GRIST_SKIP_EXT_AUTOSETUP=1 YARN_CACHE_FOLDER=/tmp/yarn-cache
      export PYTHON="$(command -v python3.13)" npm_config_python="$(command -v python3.13)"
      # 0-CVE pins (measured 2026-10-13 against 1.7.21). Direct deps move in dependencies; the
      # transitive ones whose fix is outside their declared range go through yarn resolutions
      # (yarn 1 path resolutions lose to shared lock entries, so each is one version for every
      # copy); the rest lose their lock entries so yarn re-resolves them to the newest in range.
      node -e '
        const fs = require("fs");
        const p = JSON.parse(fs.readFileSync("package.json"));
        Object.assign(p.dependencies, {
          "axios": "1.20.0", "colord": "2.10.0", "csv": "6.6.4", "dompurify": "3.4.17",
          "engine.io": "6.6.11", "express": "4.22.3", "handlebars": "4.7.10", "image-size": "2.0.4",
          "js-yaml": "4.3.2", "minio": "8.0.7", "moment": "2.31.0", "morgan": "1.12.1", "piscina": "4.9.4",
          "uuid": "11.1.1", "ws": "8.22.0",
        });
        p.resolutions = Object.assign(p.resolutions || {}, {
          "basic-ftp": "6.2.3", "socks": "2.8.10", "ip-address": "10.7.4", "dompurify": "3.4.17",
          "decode-uri-component": "0.5.0", "js-yaml": "4.3.2", "on-headers": "1.1.0", "qs": "6.16.0",
          "ws": "8.22.0", "uuid": "11.1.1", "moment": "2.31.0",
        });
        fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");
        const refresh = new Set(["bn.js", "body-parser", "brace-expansion", "diff", "fast-uri", "form-data",
          "jws", "path-to-regexp", "pbkdf2", "proxy-addr", "shell-quote", "undici", "on-headers", "qs",
          "dompurify", "js-yaml", "uuid", "moment"]);
        const blocks = fs.readFileSync("yarn.lock", "utf8").split(/\n\n/);
        fs.writeFileSync("yarn.lock", blocks.filter(b => {
          const h = b.split("\n").find(l => l && !l.startsWith("#"));
          const m = h && h.replace(/^"/, "").match(/^(@?[^@]+)@/);
          return !(m && refresh.has(m[1]));
        }).join("\n\n"));
      '
      # image-size 2 is buffer-only and has no default export (CVE-2025-71330 is fixed only in 2.x)
      sed -i 's|^import imageSize from "image-size";|import { imageSize } from "image-size";|; s|await bluebird.fromCallback((cb: any) => imageSize(fileData.absPath, cb))|imageSize(await readFile(fileData.absPath))|' app/server/lib/ActiveDoc.ts
      grep -q 'imageSize(await readFile(fileData.absPath))' app/server/lib/ActiveDoc.ts
      # SubprocessControl finds the sandbox memory process as an "exe" child of "exe" (the
      # ptrace stub of old runsc). Current runsc (systrap) names its stubs gvisor_sentry, so
      # the scan never matched and every getUsage() call, made on each user action, waited
      # forever (measured 2026-10-14: actions hung until the doc timed out). Match both.
      sed -i 's#return p.label.includes("exe") && p.parentLabel.includes("exe");#return (p.label.includes("exe") \&\& p.parentLabel.includes("exe")) || (p.label.includes("gvisor_sentry") \&\& p.parentLabel.includes("gvisor_sentry"));#' app/server/lib/NSandbox.ts
      grep -q 'p.parentLabel.includes("gvisor_sentry"));' app/server/lib/NSandbox.ts
      yarn install --network-timeout 600000
      yarn run build:prod
      yarn install --production --frozen-lockfile --ignore-scripts --network-timeout 600000
      # query-string 7 (minio) requires decode-uri-component as CommonJS; 0.5.0 (CVE-2026-45822) is
      # ESM-only, so take its default export (Node 22 loads ESM through require)
      sed -i "s|^const decodeComponent = require('decode-uri-component');|const decodeComponent = require('decode-uri-component').default;|" node_modules/query-string/index.js
      grep -q "require('decode-uri-component').default" node_modules/query-string/index.js
      # xmlbuilder2 2.x (saml2-js) calls js-yaml 3 safeLoad, which 4.x renamed to load (safe by default)
      sed -i 's|js_yaml_1.safeLoad(|js_yaml_1.load(|' node_modules/xmlbuilder2/lib/readers/YAMLReader.js
      grep -q 'js_yaml_1.load(' node_modules/xmlbuilder2/lib/readers/YAMLReader.js
      # stream-json 1.x (CVE-2026-71429, CVE-2026-104182/3; the fixes are the ESM-only 3.x with another
      # API) is used only by minio listenBucketNotification, which Grist never calls: stub that parser
      # and drop the package
      sed -i 's|^var _Parser = require("stream-json/jsonl/Parser.js");|var _Parser = { make() { throw new Error("listenBucketNotification is not available in this image"); } };|' node_modules/minio/dist/main/notification.js
      sed -i "s|^import jsonLineParser from 'stream-json/jsonl/Parser.js';|const jsonLineParser = { make() { throw new Error('listenBucketNotification is not available in this image'); } };|" node_modules/minio/dist/esm/notification.mjs
      if grep -q "stream-json" node_modules/minio/dist/main/notification.js node_modules/minio/dist/esm/notification.mjs; then exit 1; fi
      rm -rf node_modules/stream-json node_modules/stream-chain
      # every pin must be what actually got installed, and the patched modules must load
      node -e '
        const want = { dompurify: "3.4.17", "js-yaml": "4.3.2", moment: "2.31.0", "image-size": "2.0.4",
          uuid: "11.1.1", "basic-ftp": "6.2.3", "ip-address": "10.7.4", "decode-uri-component": "0.5.0",
          qs: "6.16.0", ws: "8.22.0", minio: "8.0.7", express: "4.22.3" };
        for (const [k, v] of Object.entries(want)) {
          const got = require("./node_modules/" + k + "/package.json").version;
          if (got !== v) { console.error(k, "is", got, "not", v); process.exit(1); }
        }
        require("minio"); require("query-string").parse("a=%E0%A4%A");
        require("isomorphic-dompurify").sanitize("<b>x</b>");
        require("xmlbuilder2").convert("<a>1</a>", { format: "object" });
        console.log("pins installed, patched modules load");
      '
      app="${{targets.destdir}}/grist"
      install -d "$app"
      cp -a _build static sandbox plugins assets bower_components node_modules package.json "$app/"
      # gvisor is the only flavor shipped: no deno, no pyodide
      rm -rf "$app/sandbox/pyodide" "$app/sandbox/docker"
      # run.py starts with /usr/bin/env python3; the image has no env binary
      sed -i '1s|^#!/usr/bin/env python3$|#!/usr/bin/python3.13|' "$app/sandbox/gvisor/run.py"
      test "$(head -1 "$app/sandbox/gvisor/run.py")" = '#!/usr/bin/python3.13'
      # The data engine venv. NSandbox.ts mounts <app>/sandbox_venv3 into the sandbox and starts
      # its python (upstream's install:python3 layout); the requirements are upstream's pins.
      venv="$app/sandbox_venv3"
      python3.13 -m venv "$venv"
      "$venv/bin/python" -m pip install --no-cache-dir --no-deps -r sandbox/requirements.txt
      "$venv/bin/python" -m pip uninstall -y pip
      find "$venv/bin" -mindepth 1 ! -name 'python*' -delete
      "$venv/bin/python" -c 'import astroid, asttokens, chardet, dateutil, friendly_traceback, iso8601, openpyxl, phonenumbers, roman, six, sortedcontainers, wrapt; print("engine requirements import")'

test:
  pipeline:
    - runs: |
        cd /grist
        node -e 'require("@gristlabs/sqlite3"); console.log("modules load")'
        runsc --version
        test -x /usr/bin/gvisor-bin/gvisor_sentry
        test -x /usr/bin/gvisor-bin/gvisor-sentry-prewarmer
        sandbox_venv3/bin/python -c 'import astroid, openpyxl'
        test ! -e sandbox/pyodide
