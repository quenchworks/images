# grist: Grist (grist-core), the self-hosted spreadsheet-database, from the tagged source
# on Node 22 (Wolfi). The server and UI are compiled with the repo's yarn 1 (tsc + webpack),
# then the tree is cut to production deps.
#
# FORMULA SANDBOX: pyodide (Python compiled to WASM) run under Wolfi deno with read and write
# permissions dropped before user code runs; the image sets GRIST_SANDBOX_FLAVOR=pyodide.
# Upstream's default image uses gVisor (runsc), which needs privileges a nonroot read-only pod
# does not have, and the image has no native Python at all, so "unsandboxed" cannot run
# formulas. The pyodide wheels are upstream's, fetched by sandbox/pyodide `make setup`.
#
# DENO: upstream's release binary (per-arch zip + sha256 below), the artifact apps/deno ships.
# Wolfi's apk lags at 2.8.2 with CVE-2026-50185 and CVE-2026-48504. Measured 2026-10-13: deno
# 2.9.7 (newest) still pins hickory-resolver 0.25.2 (GHSA-5j98-2g5x-46v6), rustls 0.23.40
# (GHSA-2mjx-qc3c-rqvc), rand and xxhash-rust in its Cargo.lock, and the release binary carries
# no cargo-auditable data, so Trivy cannot see them. Grist starts deno with --allow-read and
# --allow-write on its own dirs only, never --allow-net (app/server/lib/SandboxPyodide.ts), so
# the DNS and TLS code is not reached. Re-check when deno moves to hickory 0.26.2/rustls 0.23.45.
#
# 0-CVE: a stock 1.7.21 production tree carries 40 vulnerable package versions (90 advisories,
# measured 2026-10-13). melange.yaml moves
# 15 direct deps, forces 11 through yarn resolutions and re-resolves 18 in-range ones; four
# fixes need a small patch, all asserted in the recipe: image-size 2 (buffer API, ActiveDoc),
# decode-uri-component 0.5.0 (ESM-only, query-string takes .default), js-yaml 4 (xmlbuilder2
# safeLoad -> load) and stream-json (removed; only minio listenBucketNotification used it,
# which Grist never calls). A local build plus a comprehensive trivy rootfs measured 0
# and the pyodide sandbox computed a formula as uid 1001 (2026-10-13).
#
# NEWEST-ONLY: Grist ships one line with frequent releases.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(1.7.21)
# sha256 of the GitHub tag tarball, from a download
declare -A SHA256=(
  [1.7.21]=acec2079f43afced2b8cba1243ada451259b129bebaa56b8e2194ed5595b106f
)
# deno release zips, sha256 from downloads (match apps/deno)
DENO=2.9.7
DENO_SHA_AMD=c6527f24f4b16031d3ae4fa9f658d5f11534c8d84ce7dc8502420280919c3490
DENO_SHA_ARM=c832298b1ad4422481334855f6003e0f54145762c5a134f20a489511d2f65bbf
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g; s/__DENO__/$DENO/g; s/__DENO_SHA_AMD__/$DENO_SHA_AMD/g; s/__DENO_SHA_ARM__/$DENO_SHA_ARM/g"; }
