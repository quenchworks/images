# grist: Grist (grist-core), the self-hosted spreadsheet-database, from the tagged source
# on Node 22 (Wolfi). The server and UI are compiled with the repo's yarn 1 (tsc + webpack),
# then the tree is cut to production deps.
#
# FORMULA SANDBOX (2026-10-14, user decision: deno out, gVisor in): Grist's upstream default
# flavor, GRIST_SANDBOX_FLAVOR=gvisor. sandbox/gvisor/run.py starts the data engine in runsc
# with no network, a read-only view of /usr and the engine, and tmpfs over the rest. Python is
# Wolfi python-3.13 with upstream's sandbox/requirements.txt pins in /grist/sandbox_venv3 (the
# path NSandbox.ts mounts and starts). runsc is built from source: the gVisor go branch at
# GVISOR_GO, plus the gvisor_sentry main and the prewarmer from master at GVISOR_SRC (the go
# branch lacks both). The recipe re-applies Grist's --unprivileged flag (gristlabs/gvisor,
# whose own binary is a 2022 runsc on go1.17.6) to current gVisor, so the pod needs no
# privileges. MEASURED 2026-10-14 in a container with uid 1001, --cap-drop ALL,
# no-new-privileges, read-only root and Docker's default seccomp: stock runsc fails in both
# -rootless and default mode ("fork/exec /proc/self/exe: operation not permitted", it must
# create namespaces and chroot, which needs CAP_SYS_ADMIN); the ported -unprivileged build
# runs python in the sandbox (hostname gristland, network unreachable, /etc empty).
#
# HOLD HISTORY:
# 2026-10-13 BLOCKED on deno 2.9.7 (the pyodide sandbox ran under deno): its release binary
#   has no cargo-auditable data, so the gate passed 1.7.21 blind to 7 crate findings
#   (hickory-resolver/proto 0.25.2, rustls 0.23.40, rand, xxhash-rust), and a dead npm deno
#   2.6.3 carried 21 more. Not VEXable (rustls reachable through remote imports).
# 2026-10-14 deno frozen (apps/deno STATUS); deno and pyodide removed from grist, sandbox
#   moved to gVisor. Unblocked when the build-grist gate passes.
#
# 0-CVE: a stock 1.7.21 production tree carries 40 vulnerable package versions (90 advisories,
# measured 2026-10-13). melange.yaml moves
# 15 direct deps, forces 11 through yarn resolutions and re-resolves 18 in-range ones; four
# fixes need a small patch, all asserted in the recipe: image-size 2 (buffer API, ActiveDoc),
# decode-uri-component 0.5.0 (ESM-only, query-string takes .default), js-yaml 4 (xmlbuilder2
# safeLoad -> load) and stream-json (removed; only minio listenBucketNotification used it,
# which Grist never calls). A local build plus a comprehensive trivy rootfs measured 0
# (2026-10-13).
#
# NEWEST-ONLY: Grist ships one line with frequent releases.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(1.7.21)
# sha256 of the GitHub tag tarball, from a download
declare -A SHA256=(
  [1.7.21]=acec2079f43afced2b8cba1243ada451259b129bebaa56b8e2194ed5595b106f
)
# gVisor: go-branch commit (tarball sha256) and the master commit it was generated from
# (release-20261005.0-295-ga9f9fd444), with the sha256 of the two files taken from it.
# All from downloads, 2026-10-14.
GVISOR_GO=489f2b78d4bd153aeabb76d4302799928b55c72d
GVISOR_GO_SHA=d159875a08e9e6e4063d0b5a6988d9b38b56a9dbc3300e8eaa39300d1766dff5
GVISOR_SRC=a9f9fd44488f9aa68b40cc85ce34c51a92836671
SENTRY_MAIN_SHA=9137aab7d5f277350f8c11ff622712d200d130af38181c2fc542e7e42e258250
PREWARMER_SHA=fb75a1e7b44f9d307230019493b4643478e0f032e24e805e051d51edf2c7f9f5
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g; s/__GVISOR_GO_SHA__/$GVISOR_GO_SHA/g; s/__GVISOR_GO__/$GVISOR_GO/g; s/__GVISOR_SRC__/$GVISOR_SRC/g; s/__SENTRY_MAIN_SHA__/$SENTRY_MAIN_SHA/g; s/__PREWARMER_SHA__/$PREWARMER_SHA/g"; }
