# pgadmin: pgAdmin 4, the web administration and development UI for PostgreSQL (query
# tool, ERD, schema diff, backup and restore), from the official PyPI wheel (the Flask
# app with its built UI) under gunicorn on Wolfi python-3.13.
#
# 0-CVE and what the scan cannot see: the manylinux wheels pip would pick bundle their own
# native libraries (psycopg-binary: libpq and OpenSSL; Pillow: libjpeg, libtiff, libwebp
# and more; cryptography and PyNaCl link OpenSSL and libsodium statically), and trivy
# does not look inside them. The recipe takes those five from Wolfi instead (built
# against Wolfi's scanned system libraries) through a --system-site-packages venv, and
# asserts no bundled .libs directory or psycopg-binary made it in.
#
# NEWEST-ONLY: pgAdmin ships one line, a 9.N release every month.
BLOCKED=0
FROM_SOURCE=0
VERSIONS=(9.18)
# sha256 of pgadmin4-<v>-py3-none-any.whl, from a download (matches PyPI's digest)
declare -A SHA256=(
  [9.18]=9ea084fc416265e4fc95c9fb6e6ae0f6668d34da8670c9b65c79cea054124356
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
