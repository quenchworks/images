# prometheus-config-reloader (the sidecar the Prometheus Operator injects to render and reload config), from prometheus-operator/prometheus-operator (Apache-2.0). From the release tag via
# melange: one static Go binary (./cmd/prometheus-config-reloader) with upstream's -X prometheus/common/version flags.
# The operator and the reloader ship as two images from the same tag, as upstream does: the operator
# injects the reloader into every Prometheus pod by image. LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(0.95.2)
declare -A SHA256=(
  [0.95.2]=1e3846889baae811aef006e387b883c77db8875dd5c3734f8c9e84de06575c17
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
