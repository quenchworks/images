# Builds authentik (identity provider: OIDC / SAML / LDAP) entirely from source on
# Wolfi. This is a four-language build that mirrors upstream's multi-stage Dockerfile:
#
#   1. web UI       nodejs-24 + npm      -> web/dist + web/authentik (static assets)
#   2. Go server    go-1.26 (CGO)        -> /usr/bin/authentik-server  (server, healthcheck)
#   3. Rust core    rust + cmake/clang   -> /usr/bin/authentik         (worker, allinone)
#   4. Python core  python-3.14 + uv     -> /ak-root/.venv             (Django, `manage`)
#
# The `ak` bash launcher (installed to /lifecycle/ak) dispatches subcommands to the
# right binary. authentik needs PostgreSQL + Redis at RUNTIME; nothing at build time.
#
# Clean-room hardening vs upstream's FedRAMP image: built on Wolfi's OpenSSL (no
# fips-python/fips-debian base), FIPS mode NOT forced (GOFIPS140 dropped; Rust aws-lc
# `fips` feature left off), and the license-gated MaxMind GeoIP download is omitted
# (authentik boots fine without it).
package:
  name: quench-authentik
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened authentik identity provider (OIDC/SAML/LDAP), built from source on Wolfi"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      # Python interpreter the venv references (must match the build interpreter major).
      - python-3.14
      - ca-certificates-bundle
      - glibc
      - tzdata
      # `ak` is a bash launcher; it uses coreutils/shadow tools for the (root-only)
      # permission-fix path, which we skip as nonroot, plus chpst from runit.
      - bash
      - busybox
      - runit                    # provides chpst used by the launcher's exec path
      - dumb-init                # ENTRYPOINT wrapper upstream uses (reaps zombies)
      # Native runtime libs the Python extensions + Go/Rust binaries link against.
      - libpq-17                 # psycopg (Postgres driver)
      - libxml2                  # lxml / xmlsec
      - libxslt                  # lxml
      - xmlsec                   # python xmlsec (SAML signing)
      - krb5                     # gssapi / python-kadmin-rs (MIT krb5 provides kadm5 + gssapi)
      - krb5-libs
      - libffi                   # cffi / argon2-cffi / cryptography
      - libmaxminddb             # geoip2 (optional DBs, but the lib is linked)
      - openssl                  # cryptography / rust tls
      - libgcc

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - bash
      - ca-certificates-bundle
      - curl
      - git
      - cmake
      - pkgconf
      - perl             # aws-lc-fips-sys generates asm via perl during its cmake build
      # --- Node (web UI) ---
      - nodejs-24
      - npm
      # --- Go (server/proxy) ---
      - go-1.26
      # --- Rust (orchestrator/worker) ---
      - rust
      - clang            # aws-lc / bindgen (python-kadmin-rs, ring) need a C/clang toolchain
      # --- Python (Django core) via uv ---
      - python-3.14
      - python-3.14-dev
      - uv
      # native dev libs for the from-source Python wheels
      - openssl-dev      # cryptography
      - libffi-dev       # cffi / argon2 / cryptography
      - libxml2-dev      # lxml / xmlsec
      - libxslt-dev      # lxml
      - xmlsec-dev       # python xmlsec
      - krb5-dev         # gssapi + python-kadmin-rs (MIT krb5-dev provides kadm5; heimdal-dev conflicts with it in Wolfi)
      - libpq-17
      - postgresql-17-dev # libpq headers for psycopg[c]
      - zlib-dev
      - libmaxminddb-dev

pipeline:
  # ---------------------------------------------------------------------------
  # 0. Check out the exact tag (immutable commit pin). authentik CalVer tags are
  #    prefixed `version/`; we pin by commit so the build is reproducible.
  # ---------------------------------------------------------------------------
  - uses: git-checkout
    with:
      repository: https://github.com/goauthentik/authentik
      tag: version/__VER__
      expected-commit: __COMMIT__
      destination: src

  # ---------------------------------------------------------------------------
  # 1. Web UI (nodejs-24 + npm). Mirrors upstream's node-builder stage:
  #    npm ci in web/, then `npm run build` + `npm run build:sfe`. Outputs land
  #    in web/dist and web/authentik. NODE_ENV=production ONLY for the build step;
  #    devDependencies (vite/wireit/esbuild) are needed for `npm ci`.
  # ---------------------------------------------------------------------------
  - runs: |
      cd src/web
      export npm_config_fund=false npm_config_audit=false
      npm ci
      NODE_ENV=production GIT_BUILD_HASH="quench" npm run build
      NODE_ENV=production GIT_BUILD_HASH="quench" npm run build:sfe

  # ---------------------------------------------------------------------------
  # 2. Go server (go-1.26, CGO on). Version is embedded from the in-tree
  #    internal/constants/VERSION file, so no ldflag stamping is needed. FIPS140
  #    is intentionally NOT set (clean-room hardening on stock Wolfi OpenSSL).
  # ---------------------------------------------------------------------------
  - runs: |
      cd src
      mkdir -p /usr/bin-stage
      export GOFLAGS="-buildvcs=false"
      export CGO_ENABLED=1
      export GOTOOLCHAIN=local
      # 0-CVE GATE: upstream go.mod pins golang.org/x/net v0.52.0 (indirect), which the
      # Trivy gobinary scan flags for 7 fixable CVEs (CVE-2026-25680/25681/27136/33814/
      # 39821/42502/42506) — all fixed in v0.55.0. Bump the module (minor, no API break)
      # before building so the from-source authentik-server binary links the fixed x/net.
      go get golang.org/x/net@v0.58.0 golang.org/x/text@v0.41.0
      go mod tidy
      go build -o /usr/bin-stage/authentik-server ./cmd/server

  # ---------------------------------------------------------------------------
  # 3. Rust orchestrator (worker/allinone). 2026.x ships a cargo workspace with a
  #    top-level `authentik` binary (features: core -> pyo3 + sqlx). aws-lc is built
  #    WITHOUT the fips feature (clean-room). Older lines (2025.12.x) have no Cargo
  #    workspace; the step is a no-op there and `worker` falls back to python.
  # ---------------------------------------------------------------------------
  - runs: |
      cd src
      mkdir -p /usr/bin-stage
      if [ -f Cargo.toml ] && grep -q 'name = "authentik"' Cargo.toml 2>/dev/null; then
        # KEEP .cargo/config.toml — it sets `--cfg tokio_unstable`, which the code
        # requires (JoinSet::build_task / join_set::Builder are tokio-unstable APIs).
        # Also export it explicitly as belt-and-suspenders.
        export RUSTFLAGS="--cfg tokio_unstable"
        # aws-lc-fips-sys builds its FIPS module via cmake (needs go + perl + clang).
        export AWS_LC_FIPS_SYS_CC=clang
        export PYO3_PYTHON="$(command -v python3.14)"
        cargo build --package authentik --no-default-features --features core --release --locked
        install -Dm0755 target/release/authentik /usr/bin-stage/authentik
      else
        echo "no Rust authentik workspace at this version (pre-2026.x); worker runs via python"
      fi

  # ---------------------------------------------------------------------------
  # 4. Python Django core via uv. `uv sync --no-dev --no-install-project` builds a
  #    venv with the locked deps (cryptography/lxml/xmlsec/python-kadmin-rs from
  #    source against Wolfi libs). The venv lives at /ak-root/.venv.
  # ---------------------------------------------------------------------------
  - runs: |
      cd src
      export UV_PYTHON="$(command -v python3.14)"
      export UV_PYTHON_DOWNLOADS=0
      export UV_LINK_MODE=copy
      export UV_COMPILE_BYTECODE=1
      export UV_SYSTEM_CERTS=1
      export VENV_PATH=/ak-root/.venv
      mkdir -p /ak-root
      # CLEAN-ROOM HARDENING: upstream forces lxml + xmlsec from SOURCE (its [tool.uv]
      # no-binary-package = [...] pin) so they link against the image's FIPS libxml2/openssl.
      # Wolfi's static libxmlsec1 isn't -fPIC and there's no py3.14 Wolfi xmlsec package, so
      # the source extension fails to link. We CLEAR that multi-line pin so uv uses the PyPI
      # manylinux WHEELS for lxml + xmlsec (xmlsec ships a cp314 wheel; both bundle their own
      # libxml2/xmlsec). Trivy still scans the wheel contents. cryptography + python-kadmin-rs
      # + psycopg-c + gssapi still build from source against Wolfi's OpenSSL / krb5 / libpq.
      # (Python -c, not sed: the pin is a multi-line TOML array a line regex can't match.)
      # Two pyproject rewrites in one pass (Python, not sed: multi-line TOML arrays):
      #  (1) clear the no-binary-package pin (see above);
      #  (2) 0-CVE GATE: force fixed versions of every Trivy-flagged python-pkg.
      #      authentik pins cryptography/pyjwt EXACTLY and locks the transitives
      #      (aiohttp/idna/msgpack/urllib3) in uv.lock; uv keeps the locked versions on
      #      re-resolve, so a plain rebuild would ship the vulnerable ones. `[tool.uv]
      #      override-dependencies` wins over both the `==` pins and the lock. All are
      #      forward patch/minor bumps within the same major (no API break):
      #        cryptography 48.0.0 -> 48.0.1  GHSA-537c-gmf6-5ccf
      #        pyjwt        2.11.0 -> 2.13.0  CVE-2026-32597/48522/48523/48524/48525/48526
      #        aiohttp      3.13.5 -> 3.14.1  CVE-2026-34993/47265/50269/54273..54280
      #        idna         3.13   -> 3.15    CVE-2026-45409
      #        msgpack      1.1.2  -> 1.2.1   GHSA-6v7p-g79w-8964
      #        urllib3      2.6.3  -> 2.7.0   CVE-2026-44431/44432
      #        httplib2     0.31.2 -> 0.32.0  CVE-2026-59939 (HIGH; pure-python,
      #                                       only new dep is pyparsing<4,>=3.1)
      #      The two python-3.14 / python-3.14-base rows (CVE-2026-15308, fixed in
      #      3.14.6-r4) need NO edit: apko.yaml lists `python-3.14` UNPINNED, so a
      #      plain rebuild resolves Wolfi's newest (r4 is published on both arches).
      python3.14 - <<'PYFIX'
      import re, pathlib
      p = pathlib.Path('pyproject.toml')
      t = p.read_text()
      t = re.sub(r'no-binary-package\s*=\s*\[[^\]]*\]', 'no-binary-package = []', t, flags=re.S)
      overrides = (
          '[tool.uv]\n'
          'override-dependencies = [\n'
          '  "cryptography==48.0.1",\n'
          '  "pyjwt==2.13.0",\n'
          '  "aiohttp==3.14.1",\n'
          '  "idna==3.15",\n'
          '  "msgpack==1.2.1",\n'
          '  "urllib3==2.7.0",\n'
          '  "pyasn1==0.6.4",\n'
          '  "setuptools==83.0.0",\n'
          '  "httplib2==0.32.0",\n'
          ']\n'
      )
      t, n = re.subn(r'(?m)^\[tool\.uv\]\s*$', overrides, t, count=1)
      assert n == 1, "did not find a [tool.uv] table to extend with override-dependencies"
      p.write_text(t)
      PYFIX
      grep -n "no-binary-package\|override-dependencies\|cryptography==\|pyjwt==\|aiohttp==\|idna==\|msgpack==\|urllib3==\|httplib2==" pyproject.toml || true
      # Clearing the pin makes uv re-resolve, so we don't pass --locked.
      uv venv --python "$UV_PYTHON" "$VENV_PATH"
      # --no-editable: authentik is a uv WORKSPACE with local path members under
      # packages/ (ak-guardian, django-channels-postgres, django-dramatiq-postgres,
      # django-postgres-cache). By default `uv sync` installs each as an EDITABLE
      # install: a `_editable_impl_<pkg>.pth` in site-packages pointing at the
      # build-time source path (/home/build/src/packages/<pkg>). That path does NOT
      # exist in the runtime image (only the .dist-info metadata is copied), so the
      # stubs dangle and `import django_channels_postgres` (referenced unconditionally
      # by INSTALLED_APPS + CHANNEL_LAYERS) raises ModuleNotFoundError, crashing
      # `ak server`/`ak worker` at django.setup(). --no-editable builds a real wheel
      # for each workspace member and installs the package tree INTO site-packages,
      # so the imports resolve with no dependency on the build-time source path.
      VIRTUAL_ENV="$VENV_PATH" uv sync --no-dev --no-install-project --no-editable --active
      # Assert the editable stubs are gone and the real workspace packages landed in
      # site-packages (fail the build here rather than ship a dangling venv).
      sp="$VENV_PATH/lib/python3.14/site-packages"
      if ls "$sp"/_editable_impl_*.pth >/dev/null 2>&1; then
        echo "FAIL: editable .pth stubs still present after --no-editable:"; ls "$sp"/_editable_impl_*.pth; exit 1
      fi
      for mod in guardian django_channels_postgres django_dramatiq_postgres django_postgres_cache; do
        test -e "$sp/$mod/__init__.py" || { echo "FAIL: workspace package '$mod' not materialized in site-packages"; exit 1; }
      done

  # ---------------------------------------------------------------------------
  # 5. Assemble the package tree, mirroring upstream's final-image COPY layout.
  # ---------------------------------------------------------------------------
  - runs: |
      cd src
      dest="${{targets.destdir}}"

      # Binaries
      install -Dm0755 /usr/bin-stage/authentik-server "${dest}/usr/bin/authentik-server"
      if [ -f /usr/bin-stage/authentik ]; then
        install -Dm0755 /usr/bin-stage/authentik "${dest}/usr/bin/authentik"
      fi

      # Python app tree + lifecycle launcher (exactly what the Dockerfile copies)
      install -d "${dest}/lifecycle"
      cp -a authentik "${dest}/authentik"
      cp -a lifecycle/. "${dest}/lifecycle/"
      cp -a blueprints "${dest}/blueprints"
      cp -a schemas "${dest}/schemas" 2>/dev/null || true
      cp -a locale "${dest}/locale" 2>/dev/null || true
      cp -a tests "${dest}/tests" 2>/dev/null || true
      install -Dm0644 manage.py "${dest}/manage.py"
      install -Dm0644 pyproject.toml "${dest}/pyproject.toml"
      [ -f uv.lock ] && install -Dm0644 uv.lock "${dest}/uv.lock" || true
      # workspace packages/ (python + client libs) referenced by pyproject sources.
      # Upstream keeps them at /ak-root/packages and symlinks /packages -> it.
      install -d "${dest}/ak-root"
      cp -a packages "${dest}/ak-root/packages"
      ln -sf /ak-root/packages "${dest}/packages"
      # 0-CVE GATE + de-bloat: only the 4 PYTHON workspace members are runtime
      # (ak-guardian, django-channels-postgres, django-dramatiq-postgres,
      # django-postgres-cache) — and uv --no-editable already materialized them into
      # the venv, so even these are only carried for reference. The JS/TS build-tooling
      # packages (client-ts, *-config, logger-js, tsconfig, docusaurus-config, esbuild-
      # plugin-live-reload) and the Go/Rust client stubs (client-go, client-rust,
      # ak-axum, ak-common) are pure build artifacts. Their package.json files make
      # Trivy's node-pkg analyzer flag build-only deps (e.g. @goauthentik/api@0.0.0 ->
      # the stale goauthentik server advisory CVE-2023-39522). Drop everything that
      # isn't a Python member, plus any node_modules and SBOM sidecars, so the runtime
      # image ships only what it actually runs.
      for d in "${dest}/ak-root/packages"/*/; do
        case "$(basename "$d")" in
          ak-guardian|django-channels-postgres|django-dramatiq-postgres|django-postgres-cache) ;;
          *) rm -rf "$d" ;;
        esac
      done
      find "${dest}/ak-root/packages" -type d -name node_modules -prune -exec rm -rf {} + 2>/dev/null || true
      find "${dest}/ak-root/packages" -type f -name '*.spdx.json' -delete 2>/dev/null || true
      # NOTE: we deliberately do NOT ship /etc/krb5.conf — the Wolfi `krb5-conf`
      # runtime dep already provides it, and shipping our own collides at apko
      # assembly ("conflicting file: etc/krb5.conf"). authentik reads the system
      # /etc/krb5.conf (or $KRB5_CONFIG); the chart can mount a custom one.

      # The venv (ak-root already created above)
      cp -a /ak-root/.venv "${dest}/ak-root/.venv"
      # uv leaves a world-writable (0666) advisory lock in the venv; it's only used
      # during installs, not at runtime. Remove it so the melange worldwrite linter passes.
      rm -f "${dest}/ak-root/.venv/.lock"
      # Belt-and-suspenders: strip any other world-writable bits under the venv.
      find "${dest}/ak-root/.venv" -perm -0002 -exec chmod o-w {} + 2>/dev/null || true

      # Web assets
      install -d "${dest}/web"
      cp -a web/dist "${dest}/web/dist"
      cp -a web/authentik "${dest}/web/authentik"

      # Runtime data dirs (owned to uid 1001 in apko; here just create them)
      install -d "${dest}/data" "${dest}/media" "${dest}/certs" "${dest}/blueprints" "${dest}/geoip"

      # A convenient `ak` on PATH
      install -d "${dest}/usr/bin"
      ln -sf /lifecycle/ak "${dest}/usr/bin/ak"

      chmod -R a+rX "${dest}/ak-root" "${dest}/authentik" "${dest}/lifecycle" "${dest}/web"

  # ---------------------------------------------------------------------------
  # 6. Build-time assertion: the Go binary reports the version we built.
  # ---------------------------------------------------------------------------
  - runs: |
      dest="${{targets.destdir}}"
      # Assert the source tree carried the version we built (the Go binary embeds this
      # file via go:embed, and authentik/__init__.py exposes it to Python).
      test "$(cat src/internal/constants/VERSION)" = "__VER__" \
        || { echo "VERSION file != __VER__"; exit 1; }
      # Sanity: the four build outputs landed in the package tree.
      test -x "${dest}/usr/bin/authentik-server"
      test -f "${dest}/ak-root/.venv/bin/python"
      test -d "${dest}/web/dist"
      test -f "${dest}/lifecycle/ak"

test:
  pipeline:
    - runs: |
        test -x /usr/bin/authentik-server
        test -d /ak-root/.venv
        /usr/bin/authentik-server --version
