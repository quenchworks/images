# authentik: image-only recipe input (the chart is authored in the charts repo).
#
# authentik is a multi-language identity provider (OIDC / SAML / LDAP). Upstream's
# container is a genuine four-language, multi-stage build, which we replicate
# from source on Wolfi (see melange.yaml for the full pipeline):
#   1. web UI            -> nodejs-24 + npm  (npm ci; npm run build + build:sfe)  => web/dist + web/authentik
#   2. Go server/proxy   -> go-1.26 (CGO)    (go build ./cmd/server)             => /usr/bin/authentik-server
#   3. Rust orchestrator -> rust-1.x + cmake/clang (cargo build -p authentik --features core)
#                                                                                => /usr/bin/authentik  (worker/allinone)
#   4. Python Django core -> python-3.14 + uv (uv sync --no-dev) into a venv       => /ak-root/.venv
# The `ak` bash launcher dispatches: `server`/`healthcheck` -> the Go binary,
# `worker`/`allinone` -> the Rust binary, everything else -> `python -m manage`.
#
# CLEAN-ROOM / HARDENING NOTES (independent of upstream's FedRAMP image):
# - We build against Wolfi's OpenSSL (not upstream's fips-python/fips-debian bases)
#   and do NOT force FIPS mode: GOFIPS140 is dropped from the Go build and the Rust
#   aws-lc `fips` feature is disabled. FIPS is a compliance mode, not a functional
#   requirement; dropping it lets us build on stock Wolfi with a smaller CVE surface.
# - MaxMind GeoIP (an optional, license-gated download) is omitted; authentik itself
#   treats it as best-effort and boots fine without the databases.
#
# RUNTIME: authentik needs PostgreSQL + Redis at RUNTIME (not at build). Full readiness
# is deferred to the chart's kind gate (which bundles PG + Redis); the image smoke here
# only asserts the image assembles nonroot, the Go CLI reports its version, and Python
# can import the authentik core package (no DB required).
#
# Versions = newest patch of each of the last 3 stable MINOR lines. Upstream tags are
# CalVer with a `version/` prefix (e.g. `version/2026.5.3`); the version proper is the
# bare `YYYY.M.P`. render() substitutes it into both recipes (__VER__). The source is
# pinned by IMMUTABLE git commit (melange git-checkout expected-commit) rather than the
# volatile GitHub auto-generated archive tarball. For reference, the archive-tarball
# sha256 of https://codeload.github.com/goauthentik/authentik/tar.gz/refs/tags/version/<V>:
#   2026.5.4  -> 3b69d110e4f6597ebc5cabe3de6e13dd674bfd67e9eaa727463af67949cbbf76  commit a748432a8582bfff0be71aafafd6da55fbbb106f
#   2026.5.3  -> 9471fda6aaa660fa7205b92d40ae307ccea17e3b225ab46782a485f0b46e23ba  commit b94d1f11124cad80523c46936636124cdfa8907c
#   2026.2.4  -> c5a7b214daac88e92b526cc6545e77035e73fc8a31f64e8c07625de56aa504f3  commit d7dedc86d2f59bf958ee03c39f2cc3618347ea2f
#   2025.12.6 -> a60d10ec4ae246b42d3b233f21a9dce9a354bdcefedb5c640c3d811b9a6dd2e0  commit e1c90f3fae9d86d6a7a4f36018dafa9a1554f670
FROM_SOURCE=1
# 2025.12.6 is DROPPED: that line pins Python `==3.13.*`, but the 2026 lines (and
# our Wolfi build) use python-3.14, so 2025.12.6 fails `uv sync` from source. Per
# the cadence gotcha we ship the latest lines rather than carry a second Python
# toolchain. Re-add if a 2025.12 patch relaxes the 3.13 pin.
# newest-only: ship just the newest stable line (2026.5.5). 2026.2.4 is dropped to
# keep the build + 0-CVE gate surface to a single line (per the newest-only rule).
VERSIONS=(2026.5.5)

# Map version -> immutable commit for the melange git-checkout pin.
commit_for() {
  case "$1" in
    2026.5.5)  echo 2bc061e4a06e109a5e6cad4605dab0288a2abfd5 ;;
    2026.5.4)  echo a748432a8582bfff0be71aafafd6da55fbbb106f ;;
    2026.5.3)  echo b94d1f11124cad80523c46936636124cdfa8907c ;;
    2026.2.4)  echo d7dedc86d2f59bf958ee03c39f2cc3618347ea2f ;;
    *) echo "UNKNOWN_COMMIT_FOR_$1" ;;
  esac
}

render() {
  local ver="$1" commit
  commit="$(commit_for "$ver")"
  echo "s/__VER__/${ver}/g; s/__COMMIT__/${commit}/g"
}
