# blackbox-exporter: from-source via melange (git-checkout at a pinned tag + commit).
# Latest 3 stable minor lines, each at its newest patch (full X.Y.Z, used as-is).
# __VER__ = version (git tag v__VER__); __COMMIT__ = that tag's commit (integrity pin).
FROM_SOURCE=1
VERSIONS=(0.28.0 0.29.1)
declare -A COMMITS=(
  [0.28.0]=5a059bee8d8ffa4e75947c5055fb0abeefc582e6
  [0.29.1]=ad91668339ca265f460c23fc422a27ba6d788db9
)
render() { echo "s/__VER__/$1/g; s/__COMMIT__/${COMMITS[$1]}/g"; }
