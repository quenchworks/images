# Builds the Prometheus blackbox_exporter from source onto Wolfi. One static Go
# binary, no CGO. Output is a signed APK in Quenchworks' own repo. No upstream
# distro binaries. Same Prometheus-family Go-from-source pattern as alertmanager
# / node-exporter.
#
# blackbox_exporter probes endpoints over HTTP, HTTPS, DNS, TCP, ICMP and gRPC.
# It requires a --config.file describing the probe modules; we ship a minimal
# default (a single http_2xx module) so the server starts out of the box. The
# chart mounts a richer ConfigMap over /etc/blackbox_exporter/blackbox.yml.
package:
  name: quench-blackbox-exporter
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Prometheus blackbox_exporter (HTTP/DNS/TCP/ICMP/gRPC probing), built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      # go.mod declares go 1.24; .promu.yml pins the build toolchain to 1.25. Use
      # go-1.26 (newest, clears stdlib CVE advisories) and GOTOOLCHAIN=local so
      # go.mod's directive does not trigger a toolchain download.
      - go-1.26

pipeline:
  # git-checkout (not fetch) pinned to the release tag's commit: builds from the
  # verified git tag, avoiding the codeload CDN. Mirrors the alertmanager image.
  - uses: git-checkout
    with:
      repository: https://github.com/prometheus/blackbox_exporter
      tag: v${{package.version}}
      expected-commit: __COMMIT__

  - name: Build blackbox_exporter (static, CGO off)
    runs: |
      set -eu
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      export GOTOOLCHAIN=local      # use the installed go-1.26, do not fetch go.mod's directive
      export GO111MODULE=on

      # Bump the transitive deps the comprehensive Trivy gate flags. All are
      # minor/patch, same-major, API-compatible (no fork/force):
      #   x/crypto v0.45.0 -> v0.52.0  clears x/crypto/ssh + ssh/agent advisories
      #     (CVE-2026-39827..39835 / 42508 / 46595 / 46597 / 46598).
      #   x/net    v0.47.0 -> v0.55.0  clears x/net/html + idna + http2 advisories
      #     (CVE-2026-25680/25681/27136/33814/39821/42502/42506).
      #   grpc     v1.77.0 -> v1.82.1  clears grpc/authz HTTP/2 path validation
      #     (CVE-2026-33186, CRITICAL) + GHSA-hrxh-6v49-42gf (xDS RBAC + HTTP/2, HIGH).
      #   quic-go  v0.57.1 -> v0.59.1  clears the QUIC advisory (CVE-2026-40898).
      #   cel-go   v0.26.1 -> v0.29.2  clears GHSA-gcjh-h69q-9w9g (MEDIUM:
      #     ext.NativeTypes(ParseStructTag("json")) exposes json:"-" fields to user
      #     CEL expressions; first fixed release is 0.29.0). The prober's cel usage
      #     touches none of the API that changed in 0.29.
      # 0-CVE FLOORS, not pins (docs/go-module-float.md): raise a module only where go.mod has it
      # below the floor; a module absent from the graph is skipped. Bare `go get` pins downgraded
      # newer upstream releases (found 2026-10-05).
      FLOOR="golang.org/x/crypto@v0.56.0 golang.org/x/net@v0.58.0 golang.org/x/text@v0.41.0 google.golang.org/grpc@v1.83.2 go.opentelemetry.io/otel@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.45.0 go.opentelemetry.io/otel/sdk@v1.45.0 go.opentelemetry.io/otel/trace@v1.45.0 go.opentelemetry.io/otel/metric@v1.45.0 golang.org/x/oauth2@v0.36.0 github.com/google/cel-go@v0.29.2 github.com/quic-go/quic-go@v0.59.1"
      # Go semver order (a release outranks its prereleases); busybox sort -V does not.
      vlt() { awk -v a="${1#v}" -v b="${2#v}" 'function pp(s,  p){sub(/\+.*/,"",s);p=index(s,"-");if(p){C=substr(s,1,p-1);P=substr(s,p+1)}else{C=s;P=""}} function cmp(x,y,  i,n,m,X,Y){n=split(x,X,".");m=split(y,Y,".");for(i=1;i<=n&&i<=m;i++){if(X[i]==Y[i])continue;if(X[i]~/^[0-9]+$/&&Y[i]~/^[0-9]+$/)return (X[i]+0<Y[i]+0)?-1:1;if(X[i]~/^[0-9]+$/)return -1;if(Y[i]~/^[0-9]+$/)return 1;return (X[i]<Y[i])?-1:1}return (n<m)?-1:(n>m)?1:0} BEGIN{pp(a);ca=C;pa=P;pp(b);cb=C;pb=P;c=cmp(ca,cb);if(c==0){if(pa==pb)c=0;else if(pa=="")c=1;else if(pb=="")c=-1;else c=cmp(pa,pb)}exit !(c<0)}'; }
      need=""
      for mv in $FLOOR; do
        have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${mv%@*}" 2>/dev/null)"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        vlt "$have" "${mv#*@}" && need="$need $mv"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || go get $need
      # grpc@1.82.1 requires the otel@1.44.0 family + x/oauth2@0.36.0; float the cascade.
      go mod tidy

      REVISION="$(git rev-parse HEAD)"
      DATE="$(date -u +'%Y%m%d-%H:%M:%S')"
      VERPKG="github.com/prometheus/common/version"
      # Mirror upstream/promu version stamping so `blackbox_exporter --version`,
      # the /metrics build_info and blackbox_exporter_build_info report v0.28.0.
      LDFLAGS="-s -w \
        -X ${VERPKG}.Version=${{package.version}} \
        -X ${VERPKG}.Revision=${REVISION} \
        -X ${VERPKG}.Branch=HEAD \
        -X ${VERPKG}.BuildUser=quenchworks \
        -X ${VERPKG}.BuildDate=${DATE}"

      # netgo: pure-Go resolver (no libc dependency, matches upstream's static
      # build, which sets the netgo tag in .promu.yml). main package is at root.
      go build -trimpath -tags "netgo" -ldflags "${LDFLAGS}" \
        -o "${{targets.destdir}}/usr/bin/blackbox_exporter" .

  - name: Install a minimal default probe config
    runs: |
      set -eu
      # Ship a minimal default blackbox.yml (a single http_2xx module) so the
      # server starts without an external config. The chart mounts a custom
      # ConfigMap over this read-only path via --config.file.
      install -d "${{targets.destdir}}/etc/blackbox_exporter"
      cat > "${{targets.destdir}}/etc/blackbox_exporter/blackbox.yml" <<'YAML'
      # Quenchworks default blackbox_exporter config. Minimal: a single http_2xx
      # module that probes over IPv4. Override via --config.file (the chart
      # mounts a ConfigMap). Real probe modules are supplied by the chart.
      modules:
        http_2xx:
          prober: http
          timeout: 5s
          http:
            preferred_ip_protocol: "ip4"
      YAML

  # The exporter user is provided by apko (accounts), not the package, to avoid
  # conflicting with wolfi-baselayout's /etc files.

test:
  pipeline:
    - runs: blackbox_exporter --version
