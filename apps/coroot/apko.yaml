# Assembles the Coroot runtime image. Minimal, nonroot, multi-arch, SBOM by apko.
# Coroot is an observability / APM server: the entrypoint is the binary, which
# reads all settings from flags or matching env vars (kingpin), so no wrapper is
# needed. It serves its embedded Vue UI + API on :8080 (default LISTEN). lz4 (the
# shared library) is pulled by the package's runtime dep for the cgo golz4 link;
# ca-certificates-bundle is included for outbound TLS (Prometheus/ClickHouse, the
# update check, OIDC).
#
# Read-only rootfs friendly. Coroot needs ONE writable path, created here owned by
# the nonroot uid 1001 and meant to be mounted as a volume:
#   /data -> the sqlite DB + local cache (DATA_DIR=/data). Written on every change;
#            auto-created content on first run. Upstream defaults DATA_DIR to
#            ./data (relative to cwd); we set it to an absolute /data so it does
#            not depend on the working directory.
# Everything else (the binary, embedded UI) is read-only. The server binds
# :8080 (LISTEN), which is >1024, so the nonroot user can bind it.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-coroot@local

accounts:
  groups:
    - groupname: coroot
      gid: 1001
  users:
    - username: coroot
      uid: 1001
      gid: 1001
  run-as: 1001

environment:
  DATA_DIR: /data
  LISTEN: ":8080"

paths:
  - path: /data
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o755

entrypoint:
  command: /usr/bin/coroot

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-coroot"
  org.opencontainers.image.licenses: "Apache-2.0"
