# Coroot (coroot/coroot): from-source via melange. Image-only (an observability /
# APM server, no chart). NEWEST-ONLY: the single newest stable tag (upstream tags
# carry a "v" prefix; the stamped version is the bare X.Y.Z). Go backend that
# go:embeds a Vue web UI, so the frontend is (re)built with npm+Node in the build
# sandbox first (see melange.yaml). Version is stamped via -X on main.version.
# CGO is REQUIRED: coroot links github.com/DataDog/golz4 (a cgo wrapper around
# liblz4) in cache/chunk, so the binary is dynamically linked (CGO_ENABLED=1)
# against Wolfi's lz4 + glibc -- a fully-static cgo/glibc binary would break
# hostname resolution (coroot dials Prometheus/ClickHouse by name).
#
# re-gated 2026-07-09 (fresh Trivy DB, live Wolfi APKINDEX, go-1.26.5): STILL BLOCKED.
#   v1.23.3 is still the newest coroot tag (no v1.24.x), and it still pins
#   prometheus v0.300.0 + ch-go v0.62.0 / clickhouse-go v2.8.3 -- so there is no
#   newer release to bump to. The prometheus v0.300.0 -> v0.311.3 jump is a fork
#   (labels.Labels slice->struct is pervasive across coroot's prom/ package; promql
#   parser is now an interface; chunks.Sample.ST(); storage.NewMergeSeriesSet sig
#   change). ch-go 0.65 still breaks the pinned clickhouse-go/v2 v2.8.3 compress API.
#   Both are API-breaking source ports; per policy, hard BLOCK.
# STATUS: BLOCKED (do not publish). The build succeeds and the UI embeds, and the
# safe dep bumps in melange.yaml clear the fixable advisories (incl. a CRITICAL
# grpc authz bypass), but the comprehensive Trivy gate still fails on upstream
# pins that cannot be advanced without an API-breaking fork:
#   github.com/prometheus/prometheus v0.300.0 -> needs >=0.311.3
#     CVE-2026-42151 (HIGH), CVE-2026-42154 (HIGH), CVE-2026-44903 (MEDIUM),
#     CVE-2026-40179 (MEDIUM)   [0.311.3 breaks coroot's prom/ package]
#   github.com/ClickHouse/ch-go v0.62.0 -> needs 0.65.0
#     CVE-2025-1386 (MEDIUM)    [0.65.0 breaks pinned clickhouse-go/v2 v2.8.3]
# Revisit when a newer coroot tag bumps these deps; then flip to publish.
BLOCKED=1  # held/delisted — see STATUS header above; pipeline skips build+publish
FROM_SOURCE=1
VERSIONS=(1.23.3)
declare -A SHA256=(
  [1.23.3]=130f22d24706a62eb529f03be0c5449f8ef4c150b919d687a1e5a3b48a1f5adf
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
