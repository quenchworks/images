# Coroot (coroot/coroot): from-source via melange. Image-only (an observability /
# APM server, no chart). NEWEST-ONLY: the single newest stable tag (upstream tags
# carry a "v" prefix; the stamped version is the bare X.Y.Z). Go backend that
# go:embeds a Vue web UI, so the frontend is (re)built with npm+Node in the build
# sandbox first (see melange.yaml). Version is stamped via -X on main.version.
# CGO is REQUIRED: coroot links github.com/DataDog/golz4 (a cgo wrapper around
# liblz4) in cache/chunk, so the binary is dynamically linked (CGO_ENABLED=1)
# against Wolfi's lz4 + glibc -- a fully-static cgo/glibc binary would break
# hostname resolution (coroot dials Prometheus/ClickHouse by name).
#
# PORTED 2026-07-13: the two API-breaking pins were resolved in-tree (see the
# source-port block in melange.yaml), so v1.23.3 now builds 0-CVE:
#   prometheus v0.300.0 -> v0.311.3  (CVE-2026-42151/42154 HIGH, 44903/40179 MED)
#     - promql parser funcs -> parser.NewParser(parser.Options{}).Parse* methods
#     - storage.NewMergeSeriesSet gained a `limit int` arg (pass 0 = unlimited)
#     - tsdb/chunks.Sample gained ST() int64 (our float sample returns 0 = unset)
#     - labels.Labels struct-by-default: build with -tags slicelabels (an
#       upstream-supported build mode) to keep coroot's slice usage; no gate weaken
#   ch-go v0.62.0 -> v0.65.0  (CVE-2025-1386 MED); its compress API break is
#     absorbed by clickhouse-go/v2 v2.8.3 -> v2.32.0 (minimal pair for ch-go 0.65).
#     coroot's ch/ + clickhouse/ driver compiles unchanged on this pair.
# GATE: `PUSH=0 ARCHES=x86_64 scripts/build-image.sh coroot` => "✅ 0 fixable CVEs"
#   (gobinary 0, wolfi 0; comprehensive Trivy, isolated cache). UI embeds; version
#   stamps 1.23.3. x86_64 verified locally; aarch64 not yet gated (cgo/glibc apk).
# STATUS: still held (BLOCKED=1) pending an aarch64 local gate + publish go-ahead;
#   flip to publish once both arches are confirmed and the user approves.
FROM_SOURCE=1
VERSIONS=(1.23.3)
declare -A SHA256=(
  [1.23.3]=130f22d24706a62eb529f03be0c5449f8ef4c150b919d687a1e5a3b48a1f5adf
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
