# Builds Coroot (coroot/coroot) from source onto Wolfi. Output is a signed APK in
# Quenchworks' own repo. No upstream distro binaries. Image-only (an observability
# / APM server, no chart).
#
# Coroot is a Go backend that go:embeds its Vue web UI (`//go:embed static` in
# main.go). The source tree gitignores /static (the UI is NOT pre-built in the
# tag), so we reproduce upstream's own asset pipeline here first:
#   frontend: npm ci + `vue-cli-service build --dest=../static`  ->  static/**
#   go build -> main.go's `//go:embed static` picks up the compiled UI.
# We run the build via `npm run build-prod` (the exact upstream script). Node/npm
# live ONLY in this build sandbox; the runtime image is a Go binary with no JS
# toolchain, so Node never enters the Trivy scan surface. vue-cli-service is
# webpack-based; NODE_OPTIONS=--openssl-legacy-provider keeps its md4 chunk
# hashing working on modern Node (OpenSSL 3).
#
# CGO is REQUIRED: coroot imports github.com/DataDog/golz4 (a cgo wrapper around
# liblz4, `#cgo pkg-config: liblz4`) in cache/chunk, so we build with
# CGO_ENABLED=1 and link dynamically against Wolfi's lz4 + glibc. A fully-static
# cgo/glibc binary is deliberately avoided: it would disable getaddrinfo and break
# hostname resolution, and coroot dials Prometheus/ClickHouse by name. pkgconf +
# lz4-dev satisfy the cgo pkg-config lookup at build time; the runtime image pulls
# the lz4 shared library (auto-detected by melange, and pinned in runtime deps).
#
# go.mod declares go 1.25.5; we build with go-1.26 (newest, clears stdlib CVE
# advisories) and GOTOOLCHAIN=local so go.mod's directive does not trigger a
# toolchain download. GOFLAGS=-mod=mod lets the module graph resolve patched deps.
package:
  name: quench-coroot
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Coroot (observability / APM), built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - lz4

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - bash
      - ca-certificates-bundle
      - go-1.26
      - pkgconf
      - lz4-dev
      # UI toolchain: front/ is built with vue-cli-service (webpack). Node/npm
      # are build-sandbox only and never reach the runtime image.
      - nodejs-20
      - npm

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/coroot/coroot/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - name: Build the web UI from source (npm + vue-cli-service)
    runs: |
      set -eu
      # Writable caches/HOME for npm inside the sandbox.
      export npm_config_cache="$(mktemp -d)"
      export HOME="$(mktemp -d)"
      # vue-cli-service (webpack) uses md4 for chunk hashing; enable the OpenSSL 3
      # legacy provider so it works on modern Node.
      export NODE_OPTIONS=--openssl-legacy-provider
      (
        cd front
        npm ci
        # Upstream's exact production build; --dest=../static writes to the repo
        # root's static/ dir, which main.go embeds via //go:embed static.
        npm run build-prod
      )
      # //go:embed static requires the dir to exist and be non-empty at build time.
      test -f static/index.html

  - name: Build the coroot binary (CGO on, dynamic link to lz4 + glibc)
    runs: |
      set -eu
      export CGO_ENABLED=1
      export GOFLAGS=-mod=mod
      export GOTOOLCHAIN=local      # use the installed go-1.26, do not fetch go.mod's 1.25.5
      export GO111MODULE=on
      # --- source port: prometheus v0.300.0 -> v0.311.3 API break --------------
      # The prometheus bump below is a real API break across coroot's prom/ pkg.
      # We port the affected call sites in-tree (small, mechanical) rather than
      # forking upstream; each edit maps 1:1 to an upstream API change:
      #   * promql parser funcs became methods on a parser.Parser interface
      #     (ParseExpr / ParseMetricSelector / ParseMetricSelectors are no longer
      #     package-level). Construct one with parser.NewParser(parser.Options{})
      #     and call the method. (parser.Inspect / VectorSelector / ValueType,
      #     etc. are still package-level and untouched.)
      #   * storage.NewMergeSeriesSet gained a `limit int` arg (0 = unlimited,
      #     matching coroot's prior no-limit behaviour).
      #   * tsdb/chunks.Sample gained ST() int64 (sample start/created ts); our
      #     ClickHouse float samples have none, so ST() returns 0 (== unset, the
      #     same value prometheus' own sample uses when no start ts is present).
      #   * labels.Labels went struct-by-default; the slice representation coroot
      #     relies on (make/append/index over labels.Label) is still supported
      #     upstream behind the `slicelabels` build tag, which we pass to go build
      #     below. This is a supported upstream build mode, not a gate weakening:
      #     it changes only the in-memory label layout, never which CVEs are fixed.
      sed -i 's/parser\.ParseMetricSelectors(/parser.NewParser(parser.Options{}).ParseMetricSelectors(/g' prom/clickhouse.go
      sed -i 's/parser\.ParseMetricSelector(/parser.NewParser(parser.Options{}).ParseMetricSelector(/g' config/utils.go
      sed -i -e 's/parser\.ParseMetricSelector(/parser.NewParser(parser.Options{}).ParseMetricSelector(/g' \
             -e 's/parser\.ParseExpr(/parser.NewParser(parser.Options{}).ParseExpr(/g' prom/http.go
      sed -i 's/parser\.ParseExpr(/parser.NewParser(parser.Options{}).ParseExpr(/g' api/forms/forms.go
      sed -i 's/storage\.NewMergeSeriesSet(sets, storage\.ChainedSeriesMerge)/storage.NewMergeSeriesSet(sets, 0, storage.ChainedSeriesMerge)/' prom/clickhouse.go
      # Only add the ST() shim if upstream does not define it. coroot 1.26.0 added
      # its own `func (s sample) ST() int64` (clickhouse_querier.go:205), so an
      # unconditional append now declares the method twice and the build fails with
      # "method sample.ST already declared". Skipping here is correct rather than a
      # silent no-op: either branch leaves exactly one ST() on the type.
      if grep -q ') ST() int64' prom/clickhouse_querier.go; then
        echo "note: upstream already defines sample.ST(), skipping the shim"
      else
        printf '\nfunc (s sample) ST() int64 { return 0 }\n' >> prom/clickhouse_querier.go
      fi
      # --- CVE bumps (all verified to compile against the ported source) --------
      # These clear the fixable advisories the comprehensive Trivy gate flags on
      # the pinned dep graph:
      #   grpc       v1.67.1 -> v1.79.3  CVE-2026-33186 (CRITICAL, HTTP/2 authz bypass)
      #   x/crypto   v0.36.0 -> v0.52.0  CVE-2026-39831/39833/39834/46598 (ssh) + more
      #   x/net      v0.38.0 -> v0.55.0  CVE-2026-25680/25681/27136/33814/39821/42502/42506
      #   otel       v1.31.x -> v1.41.0+ (prometheus 0.311.3 pulls 1.42.0) clears CVE-2026-29181 (HIGH)
      #   jsonparser v1.1.1  -> v1.1.2   CVE (HIGH)
      #   slack-go   v0.11.3 -> v0.23.1  CVE (MEDIUM)
      #   prometheus v0.300.0 -> v0.311.3 CVE-2026-42151/42154 (HIGH), 44903/40179 (MEDIUM)
      #   ch-go      v0.62.0 -> v0.65.0  CVE-2025-1386 (MEDIUM); its compress API
      #              break is absorbed by moving clickhouse-go/v2 v2.8.3 -> v2.32.0
      #              (the minimal clickhouse-go that pins ch-go 0.65.0). coroot's
      #              ch/ + clickhouse/ driver usage compiles unchanged on this pair.
      # FLOOR is a FLOOR, not a pin (docs/go-module-float.md). A bare
      # `go get mod@vX` fails silently in two directions: it is a NO-OP when an
      # upstream `replace` overrides it, and it becomes a DOWNGRADE once upstream
      # requires more than vX -- re-introducing the CVE it was added to clear.
      # So float only what is below the floor, one module at a time (the original
      # sequencing, preserved: MVS raises only what is asked for and the
      # ch-go/clickhouse-go pair must settle in that order), then assert the
      # SHIPPED BINARY carries nothing below the floor.
      # 1.25.0 still requires the same low versions 1.23.3 did, so today every
      # floor floats UP; the assertion is what keeps that true after a future bump.
      # grpc 1.79.3 -> 1.82.1 is GHSA-hrxh-6v49-42gf (xDS RBAC + HTTP/2, HIGH);
      # grpc@1.82.1 requires the otel@1.44.0 family + x/oauth2@0.36.0.
      FLOOR="golang.org/x/crypto@v0.56.0 golang.org/x/net@v0.58.0 golang.org/x/text@v0.41.0 google.golang.org/grpc@v1.83.2 go.opentelemetry.io/otel@v1.44.0 go.opentelemetry.io/otel/sdk@v1.44.0 go.opentelemetry.io/otel/metric@v1.44.0 go.opentelemetry.io/otel/trace@v1.44.0 golang.org/x/oauth2@v0.36.0 github.com/buger/jsonparser@v1.1.2 github.com/slack-go/slack@v0.23.1 github.com/prometheus/prometheus@v0.311.3 github.com/ClickHouse/clickhouse-go/v2@v2.32.0 github.com/ClickHouse/ch-go@v0.65.0"
      MODS="$(echo "$FLOOR" | tr ' ' '\n' | cut -d@ -f1)"
      # prints "<mod>@<floor> (<tag> has <ver>)" for every module below its floor
      below_floor() {
        awk -v floor="$FLOOR" -v tag="$1" '
          BEGIN { n = split(floor, f, " ")
                  for (i = 1; i <= n; i++) { split(f[i], kv, "@"); want[kv[1]] = kv[2] } }
          ($1 in want) {
            split(substr($2, 2), g, "."); split(substr(want[$1], 2), w, ".")
            for (i = 1; i <= 3; i++) {
              if ((g[i] + 0) > (w[i] + 0)) next
              if ((g[i] + 0) < (w[i] + 0)) { print $1 "@" want[$1] " (" tag " has " $2 ")"; next }
            }
          }'
      }
      # `go list -m` prints "<mod> <ver>" or "<mod> <ver> => <mod> <ver>", so $NF is
      # the EFFECTIVE version and a replace cannot hide behind the require line.
      go list -m -e $MODS
      need="$(go list -m -e $MODS | awk 'NF >= 2 && $NF ~ /^v[0-9]/ { print $1, $NF }' | below_floor go.mod | awk '{ print $1 }')"
      for m in $need; do go get "$m"; done
      go mod tidy
      # Build with -tags slicelabels (keeps labels.Labels as a slice; see above).
      # Mirror upstream ldflags so coroot reports the real release at startup.
      go build -tags slicelabels -trimpath \
        -ldflags "-s -w -X main.version=${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/coroot" .
      # The float is only real if it reached the BINARY. Every `dep`/`=>` line of
      # `go version -m` must be at or above its floor -- the `=>` line is what
      # catches a replace-shadowed float. Fail the build rather than ship it.
      bad="$(go version -m "${{targets.destdir}}/usr/bin/coroot" \
        | awk '$1 == "dep" || $1 == "=>" { print $2, $3 }' | below_floor coroot)"
      [ -z "$bad" ] || { echo "❌ 0-CVE float did not reach the binary:"; echo "$bad"; exit 1; }
