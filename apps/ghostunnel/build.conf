# ghostunnel (ghostunnel/ghostunnel, Apache-2.0): a TLS proxy with mutual authentication. Server
# mode wraps a plaintext service in mTLS; client mode connects a plaintext client to an mTLS
# server. From source via melange, CGO on (as upstream builds it, for PKCS#11 keys), stamped
# with upstream's -X main.version.
# LATEST-ONLY: upstream patches only the newest line; 1.9/1.10 pin old grpc and otel through OPA.
FROM_SOURCE=1
VERSIONS=(1.11.5)
declare -A SHA256=(
  [1.11.5]=4e422caf02e8fc2082f749f56b37dd64133da0e288cebdfdde52be8537ead69a
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
