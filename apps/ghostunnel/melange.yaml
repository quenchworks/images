# ghostunnel from the release tag, CGO on like upstream's release binaries (PKCS#11 support).
package:
  name: quench-ghostunnel
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened ghostunnel mTLS proxy, built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - glibc

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-1.27          # 1.11.5 go.mod: go 1.27.3

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/ghostunnel/ghostunnel/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - runs: |
      set -eu
      export CGO_ENABLED=1 GOTOOLCHAIN=local GOFLAGS=-mod=mod
      # floors, raised only when below (a bare go get downgrades once upstream passes it); the
      # golang.org/x set moves together, as in the other recipes
      FLOOR="golang.org/x/crypto@v0.58.1-0.20261009181718-2f1f834330b2 golang.org/x/net@v0.62.0 golang.org/x/text@v0.43.0 golang.org/x/sys@v0.49.0 github.com/go-jose/go-jose/v4@v4.1.6"
      need=""
      for f in $FLOOR; do
        have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${f%@*}")"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        [ "$(printf '%s\n%s\n' "$have" "${f#*@}" | sort -V | head -1)" = "${f#*@}" ] || need="$need $f"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || go get $need
      go mod tidy
      rm -rf vendor
      go build -trimpath -ldflags "-s -w -X main.version=v${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/ghostunnel" .
      "${{targets.destdir}}/usr/bin/ghostunnel" --version 2>&1 | grep -F "${{package.version}}"

test:
  pipeline:
    - runs: |
        ghostunnel --version
