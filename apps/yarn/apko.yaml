# Assembles a hardened Yarn package-manager image: the vendored upstream Yarn
# CLI bundle (built by apps/yarn/melange.yaml as `quench-yarn@local`) layered
# onto a pinned Node.js runtime. No Dockerfile. melange fetches the official
# single-file bundle per release (Classic 1.x and Berry 3.x/4.x); apko then
# assembles it with nodejs-22 from the Wolfi `os` repo.
#
# IMAGE-ONLY -- no Helm chart. This is a BUILD/PACKAGE-TOOL image: the 0-CVE,
# signed, nonroot, multi-arch answer to the community `yarn`/`node` CI images.
# Developers `FROM` it in CI or run `yarn` directly.
#
# The `/usr/bin/yarn` launcher (installed by the melange package) is a `/bin/sh`
# wrapper that `exec node`s the bundled CLI, so BOTH a POSIX shell (busybox) and
# the node runtime are required -- both are added below. CI renders nothing into
# this file; the per-release __VER__/__URL__/__SHA256__ live in melange.yaml.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - busybox                     # provides /bin/sh + dirname/readlink/sed for the yarn launcher
    - nodejs-22                   # LTS Node runtime the yarn launcher exec's
    - quench-yarn@local           # vendored upstream yarn CLI bundle (melange)

accounts:
  groups:
    - groupname: nonroot
      gid: 1001
  users:
    - username: nonroot
      uid: 1001
      gid: 1001
  run-as: 1001

# yarn as the entrypoint: `docker run <img> --version`, `docker run <img> install`.
entrypoint:
  command: /usr/bin/yarn

# HOME under a writable mount; yarn's cache/global dirs and npm's cache are
# pointed at /tmp so a single `--tmpfs /tmp` keeps everything happy on a
# read-only rootfs.
environment:
  HOME: /home/nonroot
  YARN_CACHE_FOLDER: /tmp/.yarn-cache
  XDG_DATA_HOME: /tmp/.local/share
  XDG_CACHE_HOME: /tmp/.cache
  XDG_CONFIG_HOME: /tmp/.config
  NPM_CONFIG_CACHE: /tmp/.npm
  NODE_ENV: production

work-dir: /home/nonroot

paths:
  - path: /home/nonroot
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o755

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-yarn"
  org.opencontainers.image.licenses: "BSD-2-Clause"
