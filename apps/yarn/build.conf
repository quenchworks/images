# STATUS: UNBLOCKED 2026-09-20. The zlib block is gone: Wolfi shipped the fix
# for CVE-2026-85091 as zlib 1.3.2.1_rc20260601-r0 and the advisory was amended
# to name that version, so the 1.3.3-r0 this file used to wait for is a number
# that will never arrive. A stock wolfi-base scan reports the advisory as
# `zlib 1.3.2-r7 -> 1.3.2.1_rc20260601-r0`, which is what Wolfi publishes on
# both arches today. scripts/blocked.py now watches the shipped version.
#
# Evidence, stated exactly as measured:
#   x86_64  gated locally 2026-09-20, PUSH=0: 0 fixable CVEs AND the boot test
#           passed, so this is "runs", not just "scans clean".
#   aarch64 not measured locally; this host kills background melange builds and
#           a qemu-emulated arm build does not fit the foreground timeout. CI's
#           native arm64 runner is the first arm measurement, and its gate
#           refuses to publish on any finding.
# yarn: vendored upstream single-file CLI bundle run by Wolfi's Node (FROM_SOURCE
# via melange). Three stable release lines, each tagged with its full version:
#   1.22.22  Classic (yarn 1.x)
#   3.8.7    Berry v3
#   4.17.0   Berry v4 (latest stable; 4.16.0-dev is an unpublished master snapshot)
# Each bundle is pinned by sha256. Node runs the bundle via a /usr/bin/yarn wrapper.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(1.22.22 4.17.1 4.18.0)
# test.sh takes its extra args from build-yarn.yml, which passes "${1%%.*}" rather
# than the version. Mirrored here so the local gate matches CI; passing the
# version instead fails an image that runs fine.
boot_args() { echo "${1%%.*}"; }
declare -A URL=(
  [1.22.22]="https://github.com/yarnpkg/yarn/releases/download/v1.22.22/yarn-1.22.22.js"
  [4.17.1]="https://repo.yarnpkg.com/4.17.1/packages/yarnpkg-cli/bin/yarn.js"
  [4.18.0]="https://repo.yarnpkg.com/4.18.0/packages/yarnpkg-cli/bin/yarn.js"
)
declare -A SHA256=(
  [1.22.22]=1ba910c84256998c4bf4b925857c2693adebdc962a2e3075f4f8b67045f45105
  [4.17.1]=471ffb15e0523663865bbf46a69e7d157ecf532412eb436c48dfab6e3f2abe88
  [4.18.0]=fb8b1d20be72a0b544a35bcec4c7ed0ff55a9b173c01f191b02ba164b2051db5
)
render() { echo "s/__VER__/$1/g; s|__URL__|${URL[$1]}|g; s|__SHA256__|${SHA256[$1]}|g"; }
