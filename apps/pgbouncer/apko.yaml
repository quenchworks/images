# Assembles the PgBouncer runtime image from our own package plus the Wolfi base.
# No Dockerfile. Minimal, nonroot, multi-arch, SBOM generated by apko. PgBouncer
# listens on 6432 and is driven by a pgbouncer.ini the chart supplies (ConfigMap)
# plus auth (userlist.txt Secret or auth_query). Runs as nonroot uid 1001 on a
# read-only rootfs: its socket + pidfile live under /var/run/pgbouncer (mount a
# writable emptyDir/tmpfs there), logs go to stderr.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-pgbouncer@local

accounts:
  groups:
    - groupname: pgbouncer
      gid: 1001
  users:
    - username: pgbouncer
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/bin/pgbouncer /etc/pgbouncer/pgbouncer.ini

paths:
  # Writable runtime dir for the unix socket + pidfile (read-only rootfs friendly;
  # the chart mounts a writable volume here).
  - path: /var/run/pgbouncer
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o755

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-pgbouncer"
  org.opencontainers.image.licenses: "ISC"
