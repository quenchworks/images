# pgbouncer: from-source via melange (autoconf ./configure && make). Latest 3
# stable minor lines, newest patch each. Fetched from the canonical pgbouncer.org
# download host (consistent dotted-version path across releases, unlike the
# GitHub release tags which use underscores and are missing for some patches).
# Each release pins its source tarball by sha256.
FROM_SOURCE=1
VERSIONS=(1.23.1 1.24.1 1.25.2)
declare -A SHA256=(
  [1.23.1]=1963b497231d9a560a62d266e4a2eae6881ab401853d93e5d292c3740eec5084
  [1.24.1]=da72a3aba13072876d055a3e58dd4aba4a5de4ed6148e73033185245598fd3e0
  [1.25.2]=924ad35113fd0a71c8e2dbe85b5d03445532e2b7b37a9f8a48983beea238b332
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
