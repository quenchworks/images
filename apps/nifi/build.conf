# nifi: Apache NiFi, the visual dataflow engine, assembled from Apache's signed
# binary distribution (nifi-<v>-bin.zip, pinned by the sha256 of the download,
# which matches Apache's published .sha512) on Wolfi openjdk-21. Latest only:
# NiFi ships one active release line.
VERSIONS=(2.12.0)
declare -A SHA256=(
  [2.12.0]=46482ddb2a5869a9ef005d7b19a463739695b1a7a8a646030aa3eadc427a61a3
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
