# Assembles the terragrunt image: terragrunt plus OpenTofu (the 0-CVE tofu build from
# apps/opentofu, a sibling apk) and git, nonroot.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-opentofu@local      # tofu, which terragrunt runs (sibling apk)
    - quench-terragrunt@local

accounts:
  groups:
    - groupname: nonroot
      gid: 1001
  users:
    - username: nonroot
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/bin/terragrunt

work-dir: /work

paths:
  - path: /work
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o755

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-terragrunt"
  org.opencontainers.image.licenses: "MIT AND MPL-2.0"
