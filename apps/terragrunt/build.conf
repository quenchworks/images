# terragrunt (gruntwork-io/terragrunt): the thin wrapper that keeps Terraform/OpenTofu
# configurations DRY. From source, static Go (CGO off), version stamped via internal/version as
# upstream's Makefile does. Terragrunt runs tofu,
# so the image installs quench-opentofu (apps/opentofu) at its newest version as a sibling apk.
# Image only. Newest line only, measured 2026-10-05:
# - 0.99.5 carries an advisory against terragrunt itself, fixed only from 1.0.4.
# - 1.0.8 links go-git/v6 alpha.1 (CVE-2026-45022, fixed in alpha.3), and alpha.3 deletes the
#   backend/http package that 1.0.8's internal/git imports, so the fix cannot be floated in.
#   1.1.6 does not link go-git/v6.
FROM_SOURCE=1
VERSIONS=(1.1.6)
declare -A SHA256=(
  [1.1.6]=13d96feff7d0cbd47d3bb875ff4ca4f27f871dee98bf7ac32acb8d766cd33dc3
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
