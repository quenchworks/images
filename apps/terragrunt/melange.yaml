# Builds terragrunt from the release tag tarball, as upstream's Makefile build target.
package:
  name: quench-terragrunt
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Terragrunt, built from source"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
      - git   # terragrunt fetches remote module sources with go-getter (git::)

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - go

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/gruntwork-io/terragrunt/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      set -eu
      export CGO_ENABLED=0 GOTOOLCHAIN=local
      # 0-CVE floors (docs/go-module-float.md), raised only where go.mod is below them; a
      # module absent from the graph is skipped.
      FLOOR="golang.org/x/crypto@v0.56.0 golang.org/x/mod@v0.40.0 golang.org/x/net@v0.58.0 golang.org/x/text@v0.41.0 google.golang.org/grpc@v1.83.2 go.opentelemetry.io/otel@v1.45.0 go.opentelemetry.io/otel/metric@v1.45.0 go.opentelemetry.io/otel/trace@v1.45.0 go.opentelemetry.io/otel/sdk@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.45.0"
      need=""
      for mv in $FLOOR; do
        have="$(GOFLAGS=-mod=mod go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${mv%@*}" 2>/dev/null)"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        [ "$(printf '%s\n%s\n' "$have" "${mv#*@}" | sort -V | head -1)" = "${mv#*@}" ] || need="$need $mv"
      done
      echo "raising:${need:- nothing}"
      if [ -n "$need" ]; then
        GOFLAGS=-mod=mod go get $need
        GOFLAGS=-mod=mod go mod tidy
      fi
      GOFLAGS=-mod=mod go build -trimpath -ldflags "-s -w -X github.com/gruntwork-io/terragrunt/internal/version.Version=v${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/terragrunt" .
      "${{targets.destdir}}/usr/bin/terragrunt" --version | grep -q "v${{package.version}}"

test:
  pipeline:
    - runs: |
        terragrunt --version
