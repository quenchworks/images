# derper (tailscale/tailscale cmd/derper, BSD-3-Clause): Tailscale's DERP relay server, which relays encrypted
# WireGuard traffic between tailnet nodes that cannot connect directly and serves STUN for NAT traversal.
# Images issue #65.
#
# From the Tailscale release tag with the tailscale recipe's floors, -X version stamps, CGO off. The image holds
# derper and derpprobe (a DERP client for checking a deployed region). It listens with TLS on 443 (derper serves TLS only there; certmode manual,
# certificates in /certs named <hostname>.crt/.key) and STUN on 3478/udp. LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(1.104.7)
declare -A SHA256=(
  [1.104.7]=fa1c922b33d0f6db6b073800d7a62fa84081323d247b21547c63a98ed7ecac14
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
