# cAdvisor (google/cadvisor): from-source via melange (Go build from the git tag
# tarball). Image-only (a daemon/CLI, no chart). Latest patch of the last 3 minor
# lines (0.56, 0.57, 0.60). Single static Go binary, CGO disabled, -tags=netgo.
#
# The main package lives in the `cmd/` submodule (its go.mod `replace`s the
# library back to `../`), so the build runs from inside cmd/ and targets `./`.
# The version is stamped via -X on the version package's Version var. NOTE the
# ldflag path MOVED: <=0.57 it is .../version.Version; >=0.60 the version package
# was relocated into the lib submodule, so it is .../lib/version.Version. Hence
# LDPATH is per-version and rendered into melange.yaml alongside the version/sha.
FROM_SOURCE=1
VERSIONS=(0.56.2 0.57.0 0.60.1)
declare -A SHA256=(
  [0.56.2]=7f217031931c16ed4726dc49ae7575dbfd2108548e3edf5e0e488202b081e2d5
  [0.57.0]=2f700ada18220d6da193e6ecf2d35a52b84e4c38bc20aa08b2e5e3a17f68d1f5
  [0.60.1]=c4df2ffb3e4085975751927875665a7f0eb8b52aaad2b0eff305996d15b78324
)
declare -A LDPATH=(
  [0.56.2]=github.com/google/cadvisor/version.Version
  [0.57.0]=github.com/google/cadvisor/version.Version
  [0.60.1]=github.com/google/cadvisor/lib/version.Version
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g; s|__LDPATH__|${LDPATH[$1]}|g"; }
