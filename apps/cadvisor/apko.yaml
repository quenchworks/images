# Assembles the cAdvisor runtime image. Minimal, nonroot, multi-arch, SBOM by apko.
# cAdvisor is a daemon that exposes container resource-usage & performance metrics
# (default on :8080); the entrypoint is the binary, so `docker run ...cadvisor`
# starts it and `docker run ...cadvisor --version` works. ca-certificates-bundle
# is included so it can reach storage backends / registries over TLS.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-cadvisor@local

accounts:
  groups:
    - groupname: cadvisor
      gid: 1001
  users:
    - username: cadvisor
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/bin/cadvisor

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-cadvisor"
  org.opencontainers.image.licenses: "Apache-2.0"
