# Builds cAdvisor (google/cadvisor) from source onto Wolfi. Single static Go
# binary, no CGO (-tags=netgo), so it runs on the minimal nonroot image. The main
# package is the `cmd/` submodule whose go.mod replaces the library back to ../,
# so we build from inside cmd/ against ./. The version is stamped via -X so
# `cadvisor --version` reports the real release (the version package path differs
# by release line, so it is rendered in via __LDPATH__). Output is a signed APK in
# Quenchworks' own repo. No upstream distro binaries. Image-only (no chart).
package:
  name: quench-cadvisor
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened cAdvisor (container resource usage & performance metrics), built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/google/cadvisor/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      cd cmd
      # 0-CVE gate: minimal same-major bumps of transitive modules. grpc bumped to
      # v1.82.1 for GHSA-hrxh-6v49-42gf (xDS RBAC + HTTP/2, HIGH); grpc@1.82.1 requires
      # the otel@1.43.0 family + x/oauth2@0.36.0, so float that cascade (otel bumped
      # 1.41.0 -> 1.43.0 in place).
      go get github.com/opencontainers/runc@v1.4.3 \
             google.golang.org/grpc@v1.82.1 \
             go.opentelemetry.io/otel@v1.43.0 \
             go.opentelemetry.io/otel/sdk@v1.43.0 \
             go.opentelemetry.io/otel/trace@v1.43.0 \
             go.opentelemetry.io/otel/metric@v1.43.0 \
             golang.org/x/oauth2@v0.36.0 \
             golang.org/x/crypto@v0.52.0 \
             golang.org/x/net@v0.55.0
      go mod tidy
      go build -trimpath -tags netgo \
        -ldflags "-s -w -X __LDPATH__=v${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/cadvisor" ./
