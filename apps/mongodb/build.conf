# STATUS: ZLIB-ONLY as of 2026-09-16. Measured, not assumed: run 35066750263
# on af0623d gated with exactly one finding, zlib CVE-2026-85091, on every
# version and both arches. Nothing else in this image is flagged.
#
# Wolfi is at 1.3.2.1_rc20260601-r0 and the advisory wants 1.3.3-r0, which
# upstream madler/zlib has never tagged. Downgrading to Wolfi's 1.3.1-r51
# is not a way out either: it predates the 1.3.2-r0 fix for CVE-2026-27171.
#
# BLOCKED=1 skips build+merge so sweeps stop burning a red run here. Clear
# it with scripts/blocked.py --dispatch once Wolfi ships zlib 1.3.3-r0.
# mongodb: from official precompiled per-arch server tarballs (ubuntu2204 /
# modern-glibc target) + the separate mongosh shell. Latest 3 maintained GA
# lines, newest patch each (6.0, 7.0, 8.0). Per-version, per-arch server sha256
# (SHA_AMD/SHA_ARM, from downloads.mongodb.org/full.json); mongosh stays a single
# version pinned in melange.yaml (its shas are arch-only, version-independent).
BLOCKED=1
FROM_SOURCE=1
VERSIONS=(8.0.29)
declare -A SHA_AMD=(
  [8.0.29]=9b7b1091e313f5616e0c24a4ba7748058634444ac37eb37d1b18b42484e9815f
)
declare -A SHA_ARM=(
  [8.0.29]=9a67a0097b0735e57e51f4b481951d572741819eb9e040f7a83cc3e0528ff3b4
)
render() { echo "s/__VER__/$1/g; s|__SHA_AMD__|${SHA_AMD[$1]}|g; s|__SHA_ARM__|${SHA_ARM[$1]}|g"; }
