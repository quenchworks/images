# mongodb: from official precompiled per-arch server tarballs (ubuntu2204 /
# modern-glibc target) + the separate mongosh shell. Latest 3 maintained GA
# lines, newest patch each (6.0, 7.0, 8.0). Per-version, per-arch server sha256
# (SHA_AMD/SHA_ARM, from downloads.mongodb.org/full.json); mongosh stays a single
# version pinned in melange.yaml (its shas are arch-only, version-independent).
FROM_SOURCE=1
VERSIONS=(6.0.29 7.0.37 8.0.26)
declare -A SHA_AMD=(
  [6.0.29]=46de5a28be8066e0c44b60e9919e5edd00c28f55fc187f8e0c60ab38dedc9054
  [7.0.37]=2ecdcf8c6939b5e8572e4bb2ff0cbe77dc217cb51d3f312fefe72bcbd0a59c54
  [8.0.26]=f339089cca30504e07a293fe766cff7afe19c370bdf4d6de58f2165affc05d46
)
declare -A SHA_ARM=(
  [6.0.29]=81003080fd01a95dc7bbc08a5e62c80d22b55df0ce5df6b674c2ec915a4b825b
  [7.0.37]=769d083ba0185ce3bfda9c6b7fb3cf46a8cda24bf1b99c7a8254c114f0845d61
  [8.0.26]=aaaad56fe225ace4a350838359873da43ea9362f91d92877f8945303f046054a
)
render() { echo "s/__VER__/$1/g; s|__SHA_AMD__|${SHA_AMD[$1]}|g; s|__SHA_ARM__|${SHA_ARM[$1]}|g"; }
