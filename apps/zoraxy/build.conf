# zoraxy (tobychui/zoraxy): general-purpose reverse proxy with a web UI (virtual hosts, ACME,
# stream proxy, uptime monitor). From the release tag; the web UI is embedded in the binary.
# Upstream's image also bundles ZeroTier (not OSI at 1.10.x); this image leaves it out, so the
# ZeroTier network page reports it as unavailable. AGPL-3.0. Newest stable only (3.3.5 is rc).
FROM_SOURCE=1
VERSIONS=(3.3.4)
declare -A SHA256=(
  [3.3.4]=575667970349f95d9529b6f9cd872d1bdc95826a23512218945c4c851dfa0ea0
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
