# croc from the release tag: a static binary at /usr/bin/croc (relay server and CLI in one).
package:
  name: quench-croc
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened croc relay and CLI, built from source on Wolfi"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - coreutils          # sort -V for the floor check
      - go-1.27

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/schollz/croc/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - name: Build
    runs: |
      set -eu
      export CGO_ENABLED=0 GOTOOLCHAIN=local GOFLAGS=-mod=mod
      # house floor (go get is exact, so raise a module only when it is below its floor)
      for m in golang.org/x/crypto@v0.58.1-0.20261009181718-2f1f834330b2 golang.org/x/net@v0.62.0 \
               golang.org/x/text@v0.43.0 golang.org/x/sys@v0.49.0; do
        have="$(go list -m -f '{{.Version}}' "${m%@*}" 2>/dev/null || true)"
        [ -n "$have" ] || continue
        [ "$(printf '%s\n%s\n' "${m#*@}" "$have" | sort -V | head -1)" = "${m#*@}" ] || go get "$m"
      done
      go mod tidy
      # upstream's Dockerfile flags; the version is a constant in src/version
      go build -buildvcs=false -trimpath -tags netgo,osusergo -ldflags "-s -w -buildid=" \
        -o "${{targets.destdir}}/usr/bin/croc" .
      go version -m "${{targets.destdir}}/usr/bin/croc" | grep -E 'golang.org/x/(crypto|net)'
      "${{targets.destdir}}/usr/bin/croc" --version | grep -F "${{package.version}}"

test:
  pipeline:
    - runs: |
        croc --version
