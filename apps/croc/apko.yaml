# Assembles the croc image: the static binary, nonroot uid 1001. The default command runs the relay
# on TCP 9009-9013 (CROC_PORTS); CROC_PASS sets the relay password. `croc send` and `croc` (receive)
# work from the same image against a relay with --relay or CROC_RELAY.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-croc@local

accounts:
  groups:
    - groupname: croc
      gid: 1001
  users:
    - username: croc
      uid: 1001
      gid: 1001
      homedir: /home/croc
  run-as: 1001

paths:
  - path: /home/croc
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o755

environment:
  CROC_NO_UPDATE_CHECK: "true"

work-dir: /home/croc

entrypoint:
  command: /usr/bin/croc

cmd: relay

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-croc"
  org.opencontainers.image.licenses: "MIT"
  org.opencontainers.image.version: "__VER__"
