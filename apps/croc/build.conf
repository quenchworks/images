# croc (schollz/croc, MIT): send files and folders between two computers with a code phrase,
# end-to-end encrypted (PAKE), through a relay. This image runs the relay (the default command)
# and carries the croc CLI for sending and receiving through it. From the release tag via melange:
# a static CGO-free build with upstream's netgo,osusergo tags on Wolfi go-1.27. The croc-web UI
# is not built. LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(11.6.5)
declare -A SHA256=(
  [11.6.5]=2558b6d44f661e4fb32d5146a6c76ce0c2af9a732baeeaf42c717e17245be8b2
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
