# argo-rollouts: the Argo Rollouts controller, progressive delivery for Kubernetes (the
# Rollout CRD: canary and blue-green strategies, analysis runs, traffic shaping through
# ingresses and service meshes), built from source (./cmd/rollouts-controller). Static Go
# binary, no CGO. The kubectl plugin and its UI are not built.
#
# 0-CVE: melange.yaml floats the modules below their floor (measured 2026-09-25: 1.10.0
# otel 1.39, x/crypto, x/text, grpc; 1.9.1 also expr, slack-go, x/net, x/sys and
# k8s.io/kubernetes 1.34.1, moved to 1.34.2 with its staging replaces). A local build of
# each line with the float scanned 0.
#
# Two lines: 1.8.4 pins k8s.io/kubernetes 1.29 with advisories fixed only from 1.32, a
# five-minor move of the whole Kubernetes client stack.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(1.9.2 1.10.1)
declare -A SHA256=(
  [1.9.2]=76bb2aecd69ca5575357e4a36d7845074a69c71a77bbcbeab199b564683b0636
  [1.10.1]=574efc2b612f19f281a24b81cc06771f336cac2be2fb07b5e2b55b438c96cc7d
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
