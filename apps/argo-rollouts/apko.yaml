# Argo Rollouts controller runtime image. Minimal, nonroot, multi-arch, SBOM by apko.
# A Kubernetes controller: health on :8080 (/healthz), metrics on :8090.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-argo-rollouts@local

accounts:
  groups:
    - groupname: nonroot
      gid: 1001
  users:
    - username: nonroot
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/bin/rollouts-controller

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-argo-rollouts"
  org.opencontainers.image.licenses: "Apache-2.0"
