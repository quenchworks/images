# Apache Camel K operator runtime image. Nonroot, multi-arch, SBOM by apko.
# `kamel operator` runs the controller (health on :8081 /healthz, metrics on :8080) and
# `kamel builder` runs in build pods from the same image; both drive Maven, so the image
# carries Wolfi's OpenJDK 17 (upstream's base is eclipse-temurin:17-jdk), Maven 3.9 and
# busybox for the mvn launcher. Writable paths follow upstream: /etc/maven/m2 (local
# repository) and /usr/share/maven are owned by 1001 and group-0 writable.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - busybox
    - openjdk-17-default-jdk
    - maven-3.9
    - quench-camel-k@local

accounts:
  groups:
    - groupname: nonroot
      gid: 1001
  users:
    - username: nonroot
      uid: 1001
      gid: 1001
  run-as: 1001

environment:
  JAVA_HOME: /usr/lib/jvm/java-17-openjdk
  MAVEN_CMD: /usr/bin/mvn
  MAVEN_USER_HOME: /usr/share/maven
  LANG: C.UTF-8

paths:
  - path: /etc/maven/m2
    type: directory
    uid: 1001
    gid: 0
    permissions: 0o775
  - path: /usr/share/maven
    type: directory
    uid: 1001
    gid: 0
    permissions: 0o775

entrypoint:
  command: /usr/local/bin/kamel

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-camel-k"
  org.opencontainers.image.licenses: "Apache-2.0"
