# camel-k: the Apache Camel K operator (kamel), built from source, on Wolfi's OpenJDK 17 and
# Maven 3.9 apks. Upstream's image is eclipse-temurin:17-jdk plus a Maven wrapper; this one
# keeps the operator contract (kamel at /usr/local/bin, /usr/share/maven/mvnw, local repo
# /etc/maven/m2 group-0 writable, uid 1001) and points MAVEN_CMD at Wolfi's mvn, so builds
# never download a Maven distribution at runtime. The camel-k-runtime artifacts upstream
# pre-fills into /etc/maven/m2 are not shipped: the operator resolves them from Maven Central.
#
# 0-CVE: melange.yaml floors the golang.org/x set (2.11.0 ships x/crypto 0.54, x/net 0.57)
# and builds with go-1.26 >= 1.26.9 for the stdlib fixes.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(2.10.2 2.11.0)
declare -A SHA256=(
  [2.10.2]=53743f013e33dbaecbc908bf31db30b7d976af66a13b2698e25ac97608ba564e
  [2.11.0]=aace4782b7f4fcb5ff7c49f8c4ead8a5d33b1139678c6f9253c6c37e83d4e78b
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
