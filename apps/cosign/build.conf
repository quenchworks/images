# cosign (Sigstore): from-source via melange (Go build from the git tag tarball).
# Image-only (a CLI tool, no chart). Latest patch of the last 3 minor lines
# (2.6, 3.0, 3.1). Single static Go binary, CGO disabled (no pivkey/pkcs11 HW-key
# tags). Version is stamped via -X on sigs.k8s.io/release-utils/version.gitVersion.
FROM_SOURCE=1
VERSIONS=(2.6.3 3.0.6 3.1.1)
declare -A SHA256=(
  [2.6.3]=6da4dc941498f87863dfe0be7ac85901e58f2d443de92156b602ec94af04948d
  [3.0.6]=ea2f4094d944d79671784ba3d7601d7fdf78c15b0d92cdc4ca31b4d5cff3cd89
  [3.1.1]=2b44374321cd19b0eb27026ee16e519393139edd7ffe01860c2d78d6084c68eb
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
