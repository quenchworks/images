# cosign (Sigstore): from-source via melange (Go build from the git tag tarball).
# Image-only (a CLI tool, no chart). Latest patch of the last 3 minor lines
# (2.6, 3.0, 3.1). Single static Go binary, CGO disabled (no pivkey/pkcs11 HW-key
# tags). Version is stamped via -X on sigs.k8s.io/release-utils/version.gitVersion.
FROM_SOURCE=1
VERSIONS=(3.1.4)
declare -A SHA256=(
  [3.1.4]=438339dec811a8352837bc140ca0e987c12e6b6403d4da7ce12cd226fee6c800
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
