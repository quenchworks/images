# STATUS 2026-10-11: shippable WITHOUT Cruise Control. Round 1 (run 37818776789,
# 2026-10-08) booted green (kafka_readiness.sh, produce/consume, JMX exporter) and
# scanned 83 findings: 5 in /opt/kafka/libs (lz4-java, now floored to 1.11.4) and
# 78 in Cruise Control's libs. Cruise Control 2.5.146 (Strimzi 1.2.0's pin) and
# 3.0.4 (newest, linkedin.jfrog.io) both depend on Jetty 9.4, and Strimzi runs
# CC's Jetty servlet app (cruise_control_config_generator.sh sets webserver.*,
# no vertx), so Jetty 9.4 is in the request path. Three of its findings have no
# 9.4 fix at all: CVE-2024-6763 (fixed only in 12.0.12), CVE-2025-11143
# (12.0.31/12.1.5), CVE-2026-6790 (12.0.35/12.1.9). That is not VEX-able and not
# swappable (Jetty 12 is not binary compatible with CC's servlet code), so
# /opt/cruise-control is left out. A Kafka CR with spec.cruiseControl will not
# work against this image. Unblock: a Cruise Control release on Jetty >= 12.
#
# strimzi-kafka: Strimzi's own Kafka image (upstream quay.io/strimzi/kafka:
# <strimzi>-kafka-<kafka>), the image the Strimzi cluster operator runs brokers,
# controllers, Connect, Cruise Control and Kafka Exporter from. The operator
# launches it with fixed paths (/opt/kafka/kafka_run.sh, /opt/cruise-control/
# cruise_control_run.sh, /opt/kafka-exporter/kafka_exporter_run.sh), so this
# follows upstream's docker-images/kafka-based/kafka layout, not apps/kafka's.
#
# Contents, all fetched by checksum:
#   Kafka binary dist         (same tarball + same 4.3.1 jar swaps as apps/kafka)
#   kafka-agent, tracing-agent (built from the Strimzi source tag)
#   third-party libs 4.3.x (Strimzi's own pom, mvn copy-dependencies)
#   Prometheus JMX exporter javaagent jar (GitHub release)
#   kafka_exporter            (Go, built from source as in apps/kafka-exporter)
#
# A version is <strimzi>-kafka-<kafka>, the upstream tag shape; the Kafka line is
# the chosen Strimzi release's default in kafka-versions.yaml.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(1.2.0-kafka-4.3.1)
declare -A SHA256=(
  [1.2.0]=ba6a881d71a3f8eba3041057d1c3a2cd1bd737ff1467807df2c7afdee278dbcd   # strimzi source tag
  [4.3.1]=f118328b2d053497350d5befd82c08db7ffd710327ff52943dd5caaa1b25db21   # kafka_2.13-4.3.1.tgz
)
JMX_EXPORTER=1.7.0
JMX_SHA256=0ad843261c567d1924a017d542e14c40f2afff523d940c25ee000742fde4b3a9
KAFKA_EXPORTER=1.10.0
KAFKA_EXPORTER_SHA256=b76e9882a07d5ae23d32b3e801c3b7bc88fec4444d122bb052c009c8583cb237
render() {
  local s="${1%%-kafka-*}" k="${1##*-kafka-}"
  echo "s/__VER__/$s/g; s/__KAFKA__/$k/g; s/__SHA256__/${SHA256[$s]}/g; s/__KAFKA_SHA256__/${SHA256[$k]}/g; s/__JMX__/$JMX_EXPORTER/g; s/__JMX_SHA256__/$JMX_SHA256/g; s/__KEXP__/$KAFKA_EXPORTER/g; s/__KEXP_SHA256__/$KAFKA_EXPORTER_SHA256/g"
}
