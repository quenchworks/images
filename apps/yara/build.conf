# YARA (VirusTotal/yara, BSD-3-Clause): pattern matching for malware research. Rules describe byte, string and
# module conditions; `yara rules.yar <target>` reports matches. From the source tag via autotools, with the crypto
# (OpenSSL), magic (libmagic), dotnet, dex and macho modules. Image only, no chart: the CLI is the entrypoint.
# Upstream keeps 4.x in maintenance while YARA-X (Rust) is the successor; both 4.6 and 4.5 still get patches.
FROM_SOURCE=1
VERSIONS=(4.5.8 4.6.0)
declare -A SHA256=(
  [4.5.8]=c322414975ff6f701149856613afdcd92a7e6939c284c798ae3c85618197efaa
  [4.6.0]=61ab80084e3f83e1b73a95057058e2ae1db5f87f291e32654e191d410297f0e5
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
