# YARA from the GitHub source tag (no configure in the tarball: bootstrap.sh runs autoreconf).
package:
  name: quench-yara
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened YARA pattern-matching tool, built from source on Wolfi"
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - libmagic-dev
      - libtool
      - openssl-dev
      - pkgconf
      - pkgconf-dev

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/VirusTotal/yara/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
      strip-components: 1

  - runs: |
      set -eu
      ./bootstrap.sh
      ./configure --prefix=/usr --with-crypto --enable-magic --enable-dotnet --enable-dex --enable-macho
      make -j"$(nproc)"
      make check
      make install DESTDIR="${{targets.destdir}}"
      rm -rf "${{targets.destdir}}/usr/share/man" "${{targets.destdir}}/usr/include" "${{targets.destdir}}/usr/lib/pkgconfig"
      # the static lib exists only for make check (its tests link internal symbols); it does not ship
      find "${{targets.destdir}}/usr/lib" \( -name '*.la' -o -name '*.a' \) -delete
      strip "${{targets.destdir}}/usr/bin/yara" "${{targets.destdir}}/usr/bin/yarac"
      LD_LIBRARY_PATH="${{targets.destdir}}/usr/lib" "${{targets.destdir}}/usr/bin/yara" --version | grep -Fx "${{package.version}}"

test:
  pipeline:
    - runs: |
        yara --version
