# Assembles the httpd runtime image from our own package plus the Wolfi base.
# No Dockerfile. Minimal, nonroot (uid 1001), multi-arch, SBOM generated by apko.
# Listens on 8080 (http); writes its pid + runtime scoreboard/mutexes under /tmp,
# logs to stdout/stderr. Runs on a read-only rootfs when /tmp is a writable tmpfs
# (mode=1777). All httpd modules are compiled statically, so the entrypoint execs
# the httpd binary directly in the foreground — no shell in the image.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-httpd@local

accounts:
  groups:
    - groupname: httpd
      gid: 1001
  users:
    - username: httpd
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  # Shell-free: exec the httpd binary directly in the foreground (PID 1). httpd's
  # compiled-in default config is /etc/httpd/httpd.conf (--sysconfdir), so no -f is
  # needed. Logs go to stdout/stderr; pid + runtime state live under /tmp.
  command: /usr/bin/httpd -DFOREGROUND

# The default config writes pid + runtime state under /tmp; mount it writable
# (tmpfs, mode=1777) at runtime. The doc root and /etc/httpd are shipped read-only;
# the chart can mount custom config into /etc/httpd/conf.d and user content into
# /usr/share/httpd/htdocs.
work-dir: /usr/share/httpd/htdocs

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-httpd"
  org.opencontainers.image.licenses: "Apache-2.0"
