# cilium-envoy: Cilium's Envoy (cilium/proxy, Apache-2.0) from source with Bazel, #111.
# The version is the Envoy release cilium/proxy builds on; COMMIT is the cilium/proxy commit the
# cilium chart's values.yaml pins for the matching cilium line (envoy.image.tag
# v<envoy>-<timestamp>-<commit>), ENVOY_COMMIT the Envoy release commit that proxy/WORKSPACE names
# as ENVOY_SHA (the recipe asserts it).
#   cilium 1.20.5 -> cilium-envoy v1.39.6-1794557904-dee711ff0e84b106edd0abcdd71961af1b870359
# Window: the 1.20 cilium line only. 1.19 pairs with Envoy 1.38, a Bazel 7 build.
# The build is CI-sized (like apps/envoy): run it on the runners, not qw-gate.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(1.39.6)
declare -A COMMIT=(
  [1.39.6]=dee711ff0e84b106edd0abcdd71961af1b870359
)
declare -A ENVOY_COMMIT=(
  [1.39.6]=aacd0340210b536e99ec44ebe59ab9d16b259552
)
render() { echo "s/__VER__/$1/g; s/__COMMIT__/${COMMIT[$1]}/g; s/__ENVOY_COMMIT__/${ENVOY_COMMIT[$1]}/g"; }
