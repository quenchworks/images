# STATUS: SHIPPED (0-CVE). Eight CVE classes are cleared image-side via pnpm overrides
# injected into pnpm-workspace.yaml (see melange.yaml): babel-traverse@6->@babel/traverse@7
# (rename alias), jsonwebtoken 8->9.0.3, nodemailer 8->9.0.1, validator (7.x + 13.12
# copies)->13.15.35, uuid (3.x + 9.x copies)->11.1.1, multer 2.1.1->2.2.0, vite->7.3.5,
# esbuild->0.28.1.
#
# The long-standing ninth blocker — @tryghost/members-csv@2.0.7 / CVE-2024-34448 (CSV
# injection on member export) — is RESOLVED UPSTREAM as of 6.54.0. It was unfixable by
# override because the advisory's "Fixed version" 5.82.0 is a Ghost-monorepo-internal number
# never published to npm while the standalone package topped out at 2.0.7, so 6.51-6.53 were
# shipped with a hand-patched + version-realigned copy. 6.54.0 DROPPED the dependency
# entirely (absent from both package.json and pnpm-lock.yaml) and inlined the module into
# core/server/services/members/csv/, where unparse() defaults escapeFormulae to true. No
# versioned package left for Trivy to match, and the defense is upstream — so the surgery is
# gone and the recipe now just asserts that inlined default (its `assert copies` on
# node_modules is what broke the 6.54.0 build).
#
# ghost: from the official npm distribution. Ghost ships as the npm package `ghost`
# (exactly what ghost-cli installs) — an immutable registry tarball with a published
# sha256. The recipe fetches that tarball, installs PRODUCTION deps in a melange `runs`
# step (network is available at build time; native modules like sqlite3/bcrypt compile
# via node-gyp), then runs `node index.js` on Wolfi nodejs-22.
#
# LATEST-ONLY (not the usual latest-3): Ghost is a churny app whose toolchain is pinned
# per release (Ghost 6 requires Node ^22.18.0 via core/package.json engines; older lines
# need other Node majors). Like Excalidraw, no single Node builds every line and a CMS
# has no need to ship stale releases, so the catalog ships the current stable line only.
# Built on Node 22.
FROM_SOURCE=1
VERSIONS=(6.54.0)
declare -A SHA256=(
  [6.54.0]=5ff64fe3912a07be9ec08696de4e61c377dc97407a710b5a10bacc885d9c144a
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
