# ghost: from the official npm distribution. Ghost ships as the npm package `ghost`
# (exactly what ghost-cli installs) — an immutable registry tarball with a published
# sha256. The recipe fetches that tarball, installs PRODUCTION deps in a melange `runs`
# step (network is available at build time; native modules like sqlite3/bcrypt compile
# via node-gyp), then runs `node index.js` on Wolfi nodejs-22.
#
# LATEST-ONLY (not the usual latest-3): Ghost is a churny app whose toolchain is pinned
# per release (Ghost 6 requires Node ^22.18.0 via core/package.json engines; older lines
# need other Node majors). Like Excalidraw, no single Node builds every line and a CMS
# has no need to ship stale releases, so the catalog ships the current stable line only.
# Built on Node 22.
FROM_SOURCE=1
VERSIONS=(6.49.0)
declare -A SHA256=(
  [6.49.0]=a56d228058a49058af54bde4ffc8f394f806502b12af9196a11f4a9a77de22df
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
