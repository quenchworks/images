# 6.54.1 (2026-07-28): a patch bump on top of the GREEN 6.54.0. The third-party dependency
# set is byte-identical (both lockfiles resolve the same 934 external packages; the only
# pnpm-lock/pnpm-workspace changes are Ghost's own bundled `file:components/*.tgz` entries
# reordering plus adapter-base-scheduling 0.1.1 -> 0.2.0), so the whole override set below
# carries forward unchanged and the pnpm-store purge is untouched. ONE recipe change was
# required: 6.54.1 refactored the inlined members-CSV module, moving
# core/server/services/members/csv/unparse.js -> members/import-export/csv/serialize.js and
# turning the `escapeFormulae = true` destructured default into a literal `escapeFormulae:
# true` at the papaparse call. The CVE-2024-34448 assertion in melange.yaml follows it; the
# old path would have failed the build.
#
# 6.54.0, second attempt — the override set is now caught up with the tree (2026-07-27).
# Fourteen CVE classes are cleared image-side via pnpm overrides injected into
# pnpm-workspace.yaml (see melange.yaml): babel-traverse@6->@babel/traverse@7 (rename alias),
# body-parser->1.20.6, brace-expansion->5.0.8, dompurify->3.4.12, esbuild->0.28.1,
# fast-uri->3.1.4, jsonwebtoken 8->9.0.3, multer->2.2.0, nodemailer 8->9.0.1, postcss->8.5.23,
# tar->7.5.22, uuid (3.x + 9.x copies)->11.1.1, validator (7.x + 13.12 copies)->13.15.35,
# vite->7.3.5.
#
# The first 6.54.0 attempt (2026-07-26) was reverted to 6.53.0 because it gated with 18
# findings (1 CRITICAL, 10 HIGH). Those were NOT new dependencies: a Trivy scan of the 6.53.0
# and 6.54.0 lockfiles produces the SAME vulnerable set, so 6.53.0 would fail identically if
# rebuilt today. What changed was the advisory feed (brace-expansion CVE-2026-14257 landed
# 2026-07-23, plus new tar/postcss/fast-uri/body-parser/dompurify advisories), so the six new
# overrides above are the real work and the version bump rides along.
#
# Two entries deserve their own note:
#   * tar — Ghost's OWN override was `tar@<7.5.11: ^7.5.11`, and a CARET is why the tree still
#     shipped the locked 7.5.16 (CVE-2026-59873 CRITICAL): 7.5.16 satisfies ^7.5.11, so
#     --no-frozen-lockfile had no reason to move it. Our injector DROPS that entry (asserting
#     it was found, so a rename fails the build rather than silently leaving two overlapping
#     selectors for one package) and replaces it with the exact `tar@<7.5.22: 7.5.22`. Every
#     replacement value in our set is exact for the same reason.
#   * brace-expansion — needs a code-level interop shim on top of the version pin; see the
#     long comment in melange.yaml. Short version: the advisory's affected range is a single
#     `<= 5.0.7` spanning EVERY line, so 1.1.16/2.1.2 (the maintenance heads) are affected too
#     and 5.0.8 is the only escape; 5.0.8 changed the CJS export to named-only, which breaks
#     minimatch 3.1.5 and 9.0.9 at load, so the recipe re-exports the function as
#     module.exports and asserts the result with node before the package is assembled.
#
# The long-standing blocker — @tryghost/members-csv@2.0.7 / CVE-2024-34448 (CSV injection on
# member export) — is RESOLVED UPSTREAM as of 6.54.0. It was unfixable by override because the
# advisory's "Fixed version" 5.82.0 is a Ghost-monorepo-internal number never published to npm
# while the standalone package topped out at 2.0.7, so 6.51-6.53 shipped a hand-patched +
# version-realigned copy. 6.54.0 DROPPED the dependency entirely (absent from both
# package.json and pnpm-lock.yaml) and inlined the module into core/server/services/members/
# csv/, where unparse() defaults escapeFormulae to true. No versioned package left for Trivy
# to match, and the defense is upstream — so the surgery is gone and the recipe now just
# asserts that inlined default (its `assert copies` on node_modules is what broke the first
# 6.54.0 build).
#
# ghost: from the official npm distribution. Ghost ships as the npm package `ghost`
# (exactly what ghost-cli installs) — an immutable registry tarball with a published
# sha256. The recipe fetches that tarball, installs PRODUCTION deps in a melange `runs`
# step (network is available at build time; native modules like sqlite3/bcrypt compile
# via node-gyp), then runs `node index.js` on Wolfi nodejs-22.
#
# LATEST-ONLY (not the usual latest-3): Ghost is a churny app whose toolchain is pinned
# per release (Ghost 6 requires Node ^22.18.0 via core/package.json engines; older lines
# need other Node majors). Like Excalidraw, no single Node builds every line and a CMS
# has no need to ship stale releases, so the catalog ships the current stable line only.
# Built on Node 22.
FROM_SOURCE=1
VERSIONS=(6.54.1)
declare -A SHA256=(
  [6.54.0]=5ff64fe3912a07be9ec08696de4e61c377dc97407a710b5a10bacc885d9c144a
  [6.54.1]=f74479548ca1c76268e405e65093b879079b53617a0789d39654b2f46474db57
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
