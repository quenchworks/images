# Assembles the Ghost runtime image: Ghost's npm distribution (app + production
# node_modules, installed at build time by quench-ghost) running on the Wolfi nodejs-22
# package. Minimal, nonroot, multi-arch, SBOM by apko. Ghost is configured ENTIRELY by
# environment variables (url, NODE_ENV, database__*, server__*), so the entrypoint is a
# bare `node index.js` from the app dir — no shell, no wrapper.
#
# Default standalone DB is sqlite3; the chart wires an external MySQL/MariaDB via
# database__client=mysql + database__connection__*. Ghost writes to its content dir
# (themes, images, data, logs, settings) — mounted as a PVC and made writable for uid
# 1001 below. /tmp must be a writable tmpfs for a read-only rootfs.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - tzdata
    - nodejs-22
    - quench-ghost@local

accounts:
  groups:
    - groupname: ghost
      gid: 1001
  users:
    - username: ghost
      uid: 1001
      gid: 1001
  run-as: 1001

# Exec node directly on Ghost's bootstrap (PID 1, foreground). Ghost boots via
# `node index.js`, which loads ghost.js and the core server. No shell in the image.
entrypoint:
  command: /usr/bin/node /var/lib/ghost/index.js

environment:
  NODE_ENV: production
  # Bind all interfaces, not Ghost's default 127.0.0.1 — otherwise the server only answers
  # on container loopback and a Kubernetes Service (or docker port-forward) can't reach it.
  # The official Ghost image forces this too.
  server__host: "0.0.0.0"
  server__port: "2368"
  # Where Ghost stores themes/images/data/logs/settings. Overridable by the chart, but
  # this default points at the writable PVC mount baked below.
  paths__contentPath: /var/lib/ghost/content
  PATH: /usr/bin:/bin

work-dir: /var/lib/ghost

paths:
  # The whole app tree must be owned by the runtime user (uid/gid 1001). The package's
  # files are copied with cp -a (build-user ownership) and the melange sandbox cannot
  # chown to 1001, so apko does it here at assembly time as root. recursive: true also
  # fixes the content/ SUBDIRS (data, themes, logs, ...) — leaving content/data root-owned
  # breaks Ghost (SQLITE_CANTOPEN on dev sqlite, and write failures for logs/images).
  # Ghost writes caches/lock files onto its app tree at runtime, so the chart runs with
  # readOnlyRootFilesystem disabled and the runtime user needs ownership of the tree.
  # The chart mounts a content PVC over /var/lib/ghost/content (seeded by an initContainer).
  - path: /var/lib/ghost
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o755
    recursive: true

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-ghost"
  org.opencontainers.image.licenses: "MIT"
