# Packages Ghost from its OFFICIAL npm distribution onto Wolfi. Ghost ships as the npm
# package `ghost` (exactly what ghost-cli installs): an immutable registry tarball with a
# published sha256. We fetch that tarball (uses: fetch, sha-pinned), strip its leading
# `package/` component into /var/lib/ghost, then install PRODUCTION dependencies in a
# melange `runs` step. melange `runs` steps have network access at build time (same as the
# postgres-documentdb recipe's curl), so `pnpm install --prod` works; Ghost 6 ships a
# pnpm-lock.yaml + pnpm-workspace.yaml, and pnpm is the install path that cleanly produces a
# bootable tree (npm chokes on the workspace protocol).
#
# Ghost has NATIVE modules (sqlite3, the default standalone DB driver, plus
# @tryghost/html-to-mobiledoc) compiled via node-gyp, so the build env needs python3 +
# build-base (make/g++) on top of nodejs-22 + pnpm. We prune dev/test cruft after install.
#
# The tarball already ships a default content tree (content/themes/source +
# content/themes/casper, adapters, data, images, logs, settings) — without an active theme
# Ghost 500s. We keep that tree at /var/lib/ghost/content so a standalone container boots;
# the chart mounts a PVC over it and is responsible for seeding the default theme on a fresh
# volume.
package:
  name: quench-ghost
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Ghost (Node.js publishing platform), from the official npm distribution on Wolfi"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - nodejs-22              # Ghost 6 requires Node ^22.18.0 (core/package.json engines)
      - ca-certificates-bundle # TLS to the external MySQL/MariaDB, SMTP, update checks
      - tzdata                 # Ghost schedules/publishes against the configured timezone

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base             # make + g++ for node-gyp (native modules: sqlite3, bcrypt-ish)
      - busybox
      - ca-certificates-bundle
      - nodejs-22
      - npm                    # re2/sharp probe a PREBUILT binary via npm FIRST; without npm
                               # that path fails and they fall back to a GCC-16 source compile
                               # (re2's vendored abseil won't compile under GCC 16). With npm
                               # present they use the prebuilt and the install succeeds.
      - node-gyp               # the standalone node-gyp install scripts shell out to
      - pnpm                   # Ghost 6 ships pnpm-lock.yaml; pnpm is the prod-install path (Wolfi package)
      - python-3.13            # node-gyp requires python3 at build time (Wolfi names it python-3.13)

pipeline:
  - uses: fetch
    with:
      # Immutable npm registry tarball (the same artifact ghost-cli installs).
      uri: https://registry.npmjs.org/ghost/-/ghost-${{package.version}}.tgz
      expected-sha256: __SHA256__
      # npm tarballs extract under package/; drop that leading component.
      strip-components: 1

  - runs: |
      set -eu
      # Install ONLY production deps; --no-frozen-lockfile because the published tarball's
      # lockfile is the upstream dev lockfile and we install the prod subset. This compiles
      # the native sqlite3 module via node-gyp (python3 + build-base present above).
      export CI=true
      export npm_config_loglevel=warn
      # Wolfi ships the interpreter as python3.13; point node-gyp at it explicitly so the
      # native sqlite3 build doesn't fail probing for a bare `python3`/`python`.
      export PYTHON="$(command -v python3.13 || command -v python3)"
      export npm_config_python="$PYTHON"
      # --- 0-CVE gate: inject pnpm dependency overrides -----------------------------------
      # Ghost 6.x's prod tree still pins a set of CVE-flagged deps. pnpm reads dependency
      # overrides from the `overrides:` map in pnpm-workspace.yaml (Ghost already uses this to
      # patch e.g. fast-xml-parser/axios/tar). We append our own entries to that map so every
      # copy is pinned to its Trivy "Fixed version"; scoped `name@<range` keys keep the blast
      # radius minimal (matching Ghost's own convention). None of these are exercised on the
      # boot path except `validator` (Ghost's admin app already runs on validator 13, and
      # @tryghost/validator@3.2.1 uses 13.15.35, so validator 13 is API-compatible).
      #   babel-traverse@6 CVE-2023-45133 is a package RENAME -> alias to @babel/traverse@7.
      #   jsonwebtoken 8->9 matches what express-jwt@8.5.1 already wants (jsonwebtoken ^9).
      # Every replacement value is EXACT, never a `^range`: the published tarball ships a
      # lockfile and we install with --no-frozen-lockfile, so a caret whose range the locked
      # version already satisfies leaves the stale version in place (exactly how tar sat at
      # 7.5.16 under Ghost's own `tar@<7.5.11: ^7.5.11`).
      python3.13 - <<'PYEOF'
      f="pnpm-workspace.yaml"
      lines=open(f).read().splitlines()
      # Ghost's own tar entry (`tar@<7.5.11: ^7.5.11`) is SUPERSEDED by our exact pin below:
      # two overlapping selectors for one package is ambiguous, and its caret let the locked
      # 7.5.16 (CVE-2026-59873 CRITICAL) survive. Drop it, and fail if it ever moves.
      # Ghost's own undici entry (`undici@<6.24.0: ^6.24.0`) is likewise superseded: its
      # selector catches @elastic/transport@8.4.1's declared `^5.22.1` and rewrites it to a
      # CARET ^6.24.0, which the shipped lockfile already satisfies at the flagged 6.27.0 --
      # so the stale copy survived every install. Dropped here; the exact-target
      # 'undici@<6.28.0': 6.28.0 below covers that edge and forces the re-resolution.
      drops=("tar@<7.5.11:", "undici@<6.24.0:")
      add=[
        "  babel-traverse: 'npm:@babel/traverse@7.23.2'",  # CVE-2023-45133 rename fix
        "  'body-parser@<1.20.6': 1.20.6",       # CVE-2026-12590 (only the express-4 1.x copy;
                                                 # the express-5 2.3.0 copy is already clean)
        "  'brace-expansion@<5.0.9': 5.0.9",     # CVE-2026-14257, then CVE-2026-69152 which
                                                 # landed ON 5.0.8 -- the version pinned to fix
                                                 # the first. See the interop step below.
        "  'dompurify@<3.4.13': 3.4.13",         # GHSA-c2j3-45gr-mqc4, then a further advisory
                                                 # ON 3.4.12 (the version pinned to fix it)
        "  'esbuild@<0.28.1': 0.28.1",           # GHSA-g7r4-m6w7-qqqr
        "  'fast-uri@<3.1.5': 3.1.5",            # CVE-2026-13676 + CVE-2026-16221; then 3.1.4
                                                 # itself became flagged. 3.1.x is the
                                                 # only 3.x clearing both (ajv 8 wants fast-uri ^3)
        "  'jsonwebtoken@<9.0.0': 9.0.3",        # CVE-2022-23539/23540/23541
        "  'multer@<2.2.0': 2.2.0",              # CVE-2026-5079/5038
        "  'nodemailer@<9.0.1': 9.0.1",          # GHSA-p6gq-j5cr-w38f
        "  'postcss@<8.5.23': 8.5.23",           # GHSA-r28c-9q8g-f849 (fix 8.5.18; newest 8.5.x)
        # re2 is a NATIVE module, so the pin is only safe because a PREBUILT exists for
        # it: node-re2 1.25.2 publishes linux-x64-127.br + linux-arm64-127.br, and ABI
        # 127 is the Node 22 Ghost runs on (glibc, not the -musl variants). Without a
        # matching prebuilt this would fall back to compiling re2's vendored abseil,
        # which does NOT build under GCC 16 -- the reason `npm` is a build dep above.
        # Staying on 1.25.x (not 1.26) keeps the same ABI set and the minimal bump.
        "  're2@<1.26.1': 1.26.1",               # CVE-2026-67550, then a further advisory on 1.25.2
        "  'ip-address@<10.3.1': 10.3.1",        # same advisory code-server needed
        "  'js-yaml@<4.3.1': 4.3.1",             # CVE on 4.3.0 (4.3.0 was itself a fix pin)
        "  'undici@<6.28.0': 6.28.0",           # TWO undici majors coexist in this tree, so each
        "  'undici@7.28.0': 7.29.0",            # line needs its own pin -- a single
                                                 # `undici@<7.29.0` would drag the 6.x copy
                                                 # forward across a major.
                                                 # 2026-08-26 (2nd fix): the 6.x line WAS the exact
                                                 # 'undici@6.27.0', but pnpm matches a selector
                                                 # against the spec a dependent DECLARES, never the
                                                 # resolved version. @elastic/transport@8.4.1
                                                 # declares ^5.22.1; Ghost's own
                                                 # 'undici@<6.24.0: ^6.24.0' caught that edge first
                                                 # and rewrote it to a caret the shipped lockfile
                                                 # already satisfied at the flagged 6.27.0 -- so
                                                 # 6.27.0 survived while 7.28.0 moved. Ghost's own
                                                 # line is dropped above; '<6.28.0' catches BOTH
                                                 # declaring edges (^5.22.1, ^6.21.1) with an exact
                                                 # target that forces re-resolution. Verified on a
                                                 # fresh local install: only 6.28.0/7.29.0/8.10.0
                                                 # remain. The assertion below makes future drift
                                                 # fail loudly instead of quietly reverting.
        "  'tar@<7.5.22': 7.5.22",               # CVE-2026-59873 CRIT/59874 HIGH/59871+59875 MED +
                                                 # GHSA-r292-9mhp-454m MED (needs >= 7.5.21)
        "  'uuid@<11': 11.1.1",                  # CVE-2026-41907 (3.x + 9.x copies)
        "  'validator@<13.15.20': 13.15.35",     # CVE-2025-12758/56200/2021-3765 (7.x + 13.12 copies)
        "  'vite@<7.3.5': 7.3.5",                # CVE-2026-53571/53632
      ]
      out=[]
      done=False; dropped=set()
      for ln in lines:
          hit=[d for d in drops if ln.strip().startswith(d)]
          if hit:
              dropped.add(hit[0]); continue
          out.append(ln)
          if not done and ln=="overrides:":
              out.extend(add); done=True
      assert done, "overrides: block not found in pnpm-workspace.yaml"
      assert dropped==set(drops), "expected Ghost overrides to supersede, missing: %s" % (set(drops)-dropped)
      open(f,"w").write("\n".join(out)+"\n")
      PYEOF
      # pnpm 10.33 treats unapproved dependency build scripts as a HARD FAILURE
      # (ERR_PNPM_IGNORED_BUILDS), where older pnpm only warned. re2 is deliberately
      # taken as an npm PREBUILT above (its vendored abseil will not compile under
      # GCC 16), so the ignore is intentional -- declare it instead of letting the
      # install exit 1 with the decision left implicit.
      # Write the key directly rather than with `pnpm config set`: that writes a
      # SCALAR ("ignoredBuiltDependencies: re2") and current pnpm requires a
      # SEQUENCE, so pnpm then fails parsing its own file with
      # "line N column M: unexpected event: expected sequence start".
      sed -i '/^ignoredBuiltDependencies:/,/^[^ -]/{/^ignoredBuiltDependencies:/d; /^  *- /d}' pnpm-workspace.yaml 2>/dev/null || true
      printf 'ignoredBuiltDependencies:\n  - re2\n' >> pnpm-workspace.yaml
      pnpm install --prod --no-frozen-lockfile --config.strictDepBuilds=false

      # Prove every override that names an EXACT resolved version actually applied. pnpm
      # silently ignores a selector it cannot match (a bare major like 'undici@7', a
      # space-containing range, or a `catalog:` spec), so an override that does nothing looks
      # exactly like one that worked. That is how 'undici@7' sat here shipping an unpatched
      # 7.28.0 while the recipe read as if it were pinned.
      #
      # pnpm's real copies live in the hidden store as node_modules/.pnpm/<name>@<version>,
      # so the store directory names ARE the resolved versions.
      python3 - <<'ASSERT'
      import pathlib, re, sys
      store = pathlib.Path("node_modules/.pnpm")
      have = {}
      for d in store.iterdir() if store.is_dir() else []:
          # pnpm appends a peer-dependency suffix after "_" (vite@7.3.5_@types+node@22.0.0),
          # so cut that off FIRST. Parsing the raw name matches the trailing peer version
          # instead of the package's own, which would let a peer-suffixed copy of a banned
          # version slip through as a false pass.
          base = d.name.split("_", 1)[0]
          m = re.match(r"^(.+)@(\d[^@]*)$", base)
          if m:
              have.setdefault(m.group(1).replace("+", "/"), set()).add(m.group(2))
      # (package, version that must NOT survive) for every exact-version override above
      banned = [("undici", "6.27.0"), ("undici", "7.28.0")]
      bad = [f"{p}@{v}" for p, v in banned if v in have.get(p, ())]
      if bad:
          print("FATAL: override did not apply, these resolved versions survived:", ", ".join(bad))
          for p, _ in banned:
              print(f"  {p} present:", sorted(have.get(p, ())) or "none")
          sys.exit(1)
      print("override check: no banned resolved version survived")
      ASSERT

      # --- CVE-2024-34448 (@tryghost/members-csv CSV injection): FIXED UPSTREAM in 6.54.0 --
      # Up to 6.53.0 this recipe carried surgery on the installed @tryghost/members-csv copies:
      # the GHSA (GHSA-xgwh-cgv9-783v) keys its "Fixed version" to the Ghost MONOREPO number
      # 5.82.0 with affected range [0, 5.82.0), a version never published to npm, while the
      # standalone package topped out at 2.0.7 — so no `pnpm override` could satisfy Trivy and
      # we re-asserted the `escapeFormulae` fix and realigned the version by hand.
      # Ghost 6.54.0 DELETED that dependency (gone from both package.json and pnpm-lock.yaml)
      # and inlined the module into core/server/services/members/csv/. So there is no longer a
      # versioned package for Trivy to match, and the surgery has nothing to operate on — the
      # old `assert copies` is what broke the first 6.54.0 build.
      # The fix itself did NOT disappear: the inlined serializer forces escapeFormulae on, which
      # is the actual CSV-injection defense (papaparse prefixes a leading =,+,-,@ or tab with an
      # apostrophe). Assert that instead of the vanished node_modules copy, so a future release
      # that silently drops it fails the build rather than shipping quietly.
      # 6.54.1 moved the module: members/csv/unparse.js -> members/import-export/csv/serialize.js,
      # and the `escapeFormulae = true` destructured default became a literal `escapeFormulae:
      # true` on the papaparse.unparse call. Both the path and the pattern below track that.
      # Not a gate bypass: no .trivyignore, no --skip, no VEX.
      grep -q 'escapeFormulae: true' core/server/services/members/import-export/csv/serialize.js

      # --- brace-expansion CVE-2026-14257: 5.0.8 + the CJS interop it broke ---------------
      # Why the `brace-expansion@<5.0.8` override above has to reach every line: the advisory
      # (GHSA-mh99-v99m-4gvg) declares a SINGLE affected range, `<= 5.0.7`, spanning every
      # line — so the maintenance heads (1.1.16 = maintenance-v1, 2.1.2 = maintenance-v2) are
      # affected too and no future 1.x/2.x release can ever sort above 5.0.7. 5.0.8 is the only
      # escape. Parent-bumping does not help: Ghost's tree gets brace-expansion only through
      # minimatch, and it already pins minimatch 3.1.5 / 9.0.9 / 10.2.5 — of which 9.0.9 (the
      # newest 9.x) deliberately REVERTED from brace-expansion ^5.0.2 back to ^2.0.2.
      #
      # 5.0.8 rewrote the CJS entry to a NAMED-only export (`exports.expand`, `__esModule: true`,
      # no callable default), but minimatch 3.1.5 does `require("brace-expansion")(pattern)` and
      # 9.0.9 does `__importDefault(...).default(pattern)` — both throw "expand is not a
      # function" at LOAD time, which is why a blunt bump alone would break Ghost. So re-export
      # the function AS module.exports with the named props kept: the patched implementation (the
      # EXPANSION_MAX_LENGTH accumulator bound that fixes the CVE) is what runs, and all three
      # consumer shapes work. Verified against the published tarballs: minimatch 3.1.5 / 9.0.9 /
      # 10.2.5 all braceExpand() correctly afterwards and stay bounded.
      # NOT a gate bypass — no .trivyignore, no --skip, no VEX; the installed version genuinely
      # IS the fixed one. The assert fails the build if any copy escaped the override.
      python3.13 - <<'PYEOF'
      import json, os
      SHIM = ('\n// QuenchWorks: brace-expansion 5.x exports a NAMED-only CJS binding; re-export the\n'
              '// function itself (named props kept) so minimatch 3.x/9.0.9 consumers keep working.\n'
              'module.exports = Object.assign(expand, exports, { default: expand });\n')
      # os.walk, not glob: pnpm's REAL copies live under the hidden node_modules/.pnpm/ store,
      # which glob's ** never enters (the top-level entries are just symlinks into it).
      # Symlinks are not followed here, so nothing is visited twice.
      copies = sorted(os.path.join(r, 'brace-expansion', 'package.json')
                      for r, dirs, _ in os.walk('node_modules') if 'brace-expansion' in dirs)
      assert copies, "brace-expansion not found under node_modules"
      stale = [p for p in copies if json.load(open(p))['version'].split('.')[0] != '5']
      assert not stale, "override missed brace-expansion copies: %s" % stale
      n = 0
      for pj in copies:
          cjs = os.path.join(os.path.dirname(pj), 'dist/commonjs/index.js')
          if 'Object.assign(expand' not in open(cjs).read():
              open(cjs, 'a').write(SHIM); n += 1
      print("brace-expansion: %d copy(ies) at 5.x, %d shimmed" % (len(copies), n))
      PYEOF
      # Prove the shim on the REAL installed copies (pnpm keeps them in node_modules/.pnpm/,
      # which `find` walks but glob would miss): require() must yield a callable that expands.
      # A future 5.x that moves the CJS entry fails the build here, not at Ghost's boot.
      for d in $(find node_modules -type d -name brace-expansion); do
        node -e "const b=require(require('path').resolve('$d'));
                 if (typeof b!=='function'||b('a{b,c}').join()!=='ab,ac')
                   throw new Error('brace-expansion CJS interop broken at $d');"
      done

      # Trim build-time cruft that bloats the image and the CVE surface but is never run:
      # caches, source maps for vendored deps, and pnpm's own store metadata.
      rm -rf node_modules/.cache .pnpm-store 2>/dev/null || true
      find . -type d -name '.cache' -prune -exec rm -rf {} + 2>/dev/null || true
      # pnpm's HOME store must go too. `.local/share/pnpm/store/...` ships pnpm's OWN
      # vendored node_modules (its bundled tar 7.5.20 was the last gate finding —
      # GHSA-r292-9mhp-454m — and it is pure build cache, not part of Ghost). The app's
      # own tar is correctly 7.5.22 via the override; this copy was never reachable by it.
      rm -rf .local/share/pnpm .local/state/pnpm .cache/pnpm .npm 2>/dev/null || true
      # Fail the build if any pnpm store survives into the image, so this cannot regress.
      if find . -path './node_modules' -prune -o -type d -name pnpm -print 2>/dev/null | grep -q .; then
        echo "pnpm store/artifacts still present in the image tree:"
        find . -path './node_modules' -prune -o -type d -name pnpm -print
        exit 1
      fi

  - runs: |
      set -eu
      dest="${{targets.destdir}}"
      app="$dest/var/lib/ghost"
      install -d "$app"
      # Install the whole app tree (index.js, ghost.js, core/, content/, node_modules/,
      # package.json, ...) read-only under /var/lib/ghost. The server boots via
      # `node index.js` from this dir. Copy top-level entries individually and SKIP
      # melange-out: melange's build-output dir (which holds destdir) lives inside this
      # workspace, so a blanket `cp -a ./.` would recurse into the very dir we're writing.
      # CI runs melange with working-directory apps/ghost, so the workspace also holds the
      # recipe + CI-generated files (build.conf, *.yaml, test.sh, rendered files, signing
      # keys, packages/, image.tar, melange-out, sbom). Copy ONLY the extracted+installed
      # Ghost tree by skipping that fixed denylist; a blanket `cp -a *` would leak them in.
      for item in * .[!.]* ..?*; do
        [ -e "$item" ] || continue
        case "$item" in
          melange-out|melange.rsa|melange.rsa.pub|packages|build.conf|melange.yaml|apko.yaml|test.sh|melange.rendered.yaml|apko.rendered.yaml|image.tar|sbom-*|*.log|.git) continue ;;
        esac
        cp -a "$item" "$app/"
      done
      # The bootable default content tree (themes/source is the active default theme) ships
      # inside the tarball at content/ — keep it so a standalone container serves a 200.
      # World-readable so a read-only deployment can still serve; ownership (uid 1001) is
      # set recursively in apko (the melange sandbox cannot chown to a uid it doesn't map).
      chmod -R a+rX "$app"

test:
  pipeline:
    - runs: |
        test -f /var/lib/ghost/index.js
        test -f /var/lib/ghost/core/server/web/parent/app.js
        test -d /var/lib/ghost/node_modules
        test -d /var/lib/ghost/content/themes/source
        # the native sqlite3 binding must have compiled
        find /var/lib/ghost/node_modules -path '*sqlite3*/build/Release/*.node' | grep -q .
