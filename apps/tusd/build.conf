# tusd (tus/tusd, MIT): the reference server for the tus resumable-upload protocol. Uploads
# survive dropped connections and resume at the last byte; stored on disk or S3/GCS/Azure,
# with hooks for processing. From source via melange: one static Go binary stamped with
# upstream's -X cli.VersionName. LATEST-ONLY: upstream patches one line.
FROM_SOURCE=1
VERSIONS=(2.10.1)
declare -A SHA256=(
  [2.10.1]=ab47dd763c7d5269b13738cc731ea85b0670b62f49bccf046587b2588e71bd95
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
