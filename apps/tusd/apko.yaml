# tusd runtime: tusd is the entrypoint; listens on 8080, uploads to -upload-dir (mount a volume) or S3, GCS or Azure.
# Nonroot 1001, so listen on ports above 1023 unless the pod grants NET_BIND_SERVICE.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-tusd@local

accounts:
  groups:
    - groupname: tusd
      gid: 1001
  users:
    - username: tusd
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/bin/tusd

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-tusd"
  org.opencontainers.image.licenses: "MIT"
  org.opencontainers.image.version: "__VER__"
