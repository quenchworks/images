# Packages the MLflow Tracking Server onto Wolfi. MLflow is a pure-Python
# (FastAPI/Flask + Gunicorn/Uvicorn) web app distributed as a pip package, not a
# binary — there is no Wolfi `mlflow` package — so we install it from PyPI into a
# virtualenv on a Wolfi python-3.12 base, then harden it on a minimal apko base and
# gate it 0-CVE with Trivy (which scans the venv's Python packages too). This is the
# first pure-Python app in the catalog and establishes the venv-on-Wolfi pattern.
#
# We install `mlflow-skinny` (the lightweight package, WITHOUT the heaviest CVE-prone
# ML libs scipy/scikit-learn/matplotlib) and add ONLY the modules `mlflow server`
# actually imports at boot. mlflow-skinny alone is client-only and `mlflow server`
# crashes on a chain of ModuleNotFoundErrors; the complete minimal server set, found
# empirically by booting the server until both /health and the experiments API return
# 200, is: flask, flask-cors, sqlalchemy, alembic (DB schema/migrations for the backend
# store), gunicorn (the WSGI server `mlflow server` launches), querystring-parser,
# graphene (GraphQL endpoint), markdown, numpy, pandas (mlflow 3.x's genai scorer job
# runner imports pandas at startup), huey (3.x background-job runner) and aiohttp. Plus
# psycopg2-binary (Postgres backend-store driver) and boto3 (S3 artifact store). We do
# NOT install full `mlflow` (it drags in scipy/scikit-learn/matplotlib — huge image +
# CVE surface). The venv lives at /opt/mlflow/venv; mlflow-skinny is pinned to the build
# version so the install matches the catalog version exactly.
package:
  name: quench-mlflow
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened MLflow Tracking Server, packaged on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - python-3.12            # the venv references the system interpreter; it must be present at runtime
      - ca-certificates-bundle # TLS to the external Postgres backend store / S3 artifact store
      - glibc
      - tzdata
      # psycopg2-binary ships a manylinux wheel with a vendored libpq, so no system
      # libpq runtime dep is needed. If Trivy ever flags the vendored libpq, switch the
      # pip dep to the Wolfi py3.12-psycopg2 package + a `libpq` runtime dep here.

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - python-3.12
      - py3.12-pip
      - build-base             # fallback for any transitive dep that has no wheel (sdist build)

pipeline:
  # Create an isolated venv and install the tracking-server stack from PyPI, pinned to
  # the build version. --no-cache-dir keeps the layer small. The package list is the
  # complete minimal set `mlflow server` needs to boot and serve HTTP (see header). All
  # shebangs in the venv point at /opt/mlflow/venv/bin/python.
  # GitPython is pinned to 3.1.55 (a transitive mlflow-skinny dep; its declared range is
  # gitpython<4,>=3.1.9, so the pin is in-range). 3.1.55 is the FIRST release that clears
  # all six HIGH advisories on that line -- GHSA-rwj8-pgh3-r573 (fixed 3.1.52),
  # GHSA-3rp5-jjmw-4wv2 (3.1.53), GHSA-fjr4-x663-mwxc + GHSA-6p8h-3wgx-97gf +
  # GHSA-r9mr-m37c-5fr3 (3.1.54) and GHSA-94p4-4cq8-9g67 (3.1.55) -- so nothing lower
  # (including the 3.1.52 this recipe used to pin) is enough.
  # 2026-08-17: switched from `==` to a FLOOR (>=3.1.59). This exact pin has had to move
  # three times (3.1.52 -> 3.1.55 -> 3.1.57 -> 3.1.59), each time because a new HIGH
  # landed on the version pinned to fix the last one. A floor lets a rebuild pick up the
  # next patch on its own, and matches the convention the airflow recipe already uses for
  # security bumps ("cryptography>=48.0.1"). mlflow-skinny declares gitpython<4,>=3.1.9,
  # so the floor stays inside upstream's range and the resolver still governs the ceiling.
  - runs: |
      VER="${{package.version}}"
      dest="${{targets.destdir}}"

      python3.12 -m venv /opt/mlflow/venv
      /opt/mlflow/venv/bin/pip install --no-cache-dir --upgrade pip
      /opt/mlflow/venv/bin/pip install --no-cache-dir \
        "mlflow-skinny==${VER}" \
        "GitPython>=3.1.59" \
        flask \
        flask-cors \
        sqlalchemy \
        alembic \
        gunicorn \
        querystring-parser \
        graphene \
        markdown \
        numpy \
        pandas \
        huey \
        aiohttp \
        psycopg2-binary \
        boto3
      # --- pip-vendored msgpack (GHSA-6v7p-g79w-8964, HIGH) --------------------
      # pip 26.2.1 vendors msgpack 1.1.2 and no fixed pip RELEASE exists yet, so the venv
      # inherits it. Same four-part fix as apps/python and apps/ansible: sources, BYTECODE,
      # vendor.txt, and the CycloneDX -- fixing fewer leaves the finding live, and fixing
      # only the sources is worse (Wolfi pyc are hash-based UNCHECKED, so the interpreter
      # keeps running the OLD vulnerable bytecode while scanners read the new sources).
      # Fetch + SBOM edits are single-line `python -c`: no curl/wget here, and a multi-line
      # heredoc would need column 0, which terminates this YAML block scalar.
      VENV=/opt/mlflow/venv
      SP="$VENV/lib/python3.12/site-packages"
      # The pip vendored-msgpack shim that used to live here is GONE (2026-09-06).
      # It replaced pip's vendored msgpack 1.1.2 (GHSA-6v7p-g79w-8964) with 1.2.1, and
      # was deliberately written to `exit 1` the day pip stopped vendoring 1.1.2 rather
      # than silently patching nothing. That day came: pip now vendors msgpack 1.2.1,
      # the guard fired, and every Python-family build failed on it. Removing the shim
      # is what the guard was asking for -- do not re-add it.

      # mlflow --version must work without a DB; assert it at build time. (The full
      # server-boot HTTP check runs in test.sh against the assembled image, and in the
      # chart's kind gate with a bundled Postgres.)
      /opt/mlflow/venv/bin/mlflow --version | grep -q "version ${VER}$"

      # Remove pip from the venv. The last two findings on this image are pip's OWN
      # vendored copies under pip/_vendor/ -- setuptools 70.3.0 (CVE-2025-47273,
      # CVE-2026-59890) and msgpack 1.1.2 (GHSA-6v7p-g79w-8964). Those exact versions
      # are what pip's vendor.txt pins, so NO top-level pin can reach them and every
      # current pip release vendors the same set. mlflow is a server, never a package
      # installer, so deleting pip removes the vulnerable CODE rather than suppressing
      # the finding -- no .trivyignore, no --skip, no VEX. Must run AFTER every pip
      # install above, and nothing later in this step uses pip.
      /opt/mlflow/venv/bin/pip uninstall -y pip
      # `test !` and not `! test`: set -e ignores a status inverted with `!`, so
      # `! test -e f` would never fail the build. This form does.
      test ! -e /opt/mlflow/venv/lib/python3.12/site-packages/pip/_vendor/vendor.txt

      # Relocate the venv into the package tree under /opt/mlflow.
      install -d "${dest}/opt/mlflow"
      cp -a /opt/mlflow/venv "${dest}/opt/mlflow/venv"

      # Convenience symlink on PATH.
      install -d "${dest}/usr/bin"
      ln -sf /opt/mlflow/venv/bin/mlflow "${dest}/usr/bin/mlflow"

      chmod -R a+rX "${dest}/opt/mlflow"

test:
  pipeline:
    - runs: |
        test -x /opt/mlflow/venv/bin/mlflow
        mlflow --version
