# mlflow: image-only recipe input (the chart is authored in the charts repo).
# MLflow is a pure-Python pip package, not a binary — there is no Wolfi `mlflow`
# package — so the melange pipeline installs `mlflow-skinny` (plus gunicorn,
# psycopg2-binary, boto3) from PyPI into a virtualenv on a Wolfi python-3.12 base,
# then hardens it on a minimal apko base and gates it 0-CVE with Trivy.
#
# Versions = newest patch of the latest 3 minor lines (PyPI versions, no `v` prefix,
# used as-is). pip pins the install to __VER__, so there is no per-arch source SHA to
# track (PyPI is the source); render() just substitutes the version into both recipes.
#   __VER__ = version (bare X.Y.Z), used directly as `mlflow-skinny==<VER>`
FROM_SOURCE=0
VERSIONS=(3.12.0 3.13.0 3.14.0)
render() { echo "s/__VER__/$1/g"; }
