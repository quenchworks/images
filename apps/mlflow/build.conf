# STATUS: ZLIB-ONLY as of 2026-09-16. Measured, not assumed: run 35066746990
# on af0623d gated with exactly one finding, zlib CVE-2026-85091, on every
# version and both arches. Nothing else in this image is flagged.
#
# Wolfi is at 1.3.2.1_rc20260601-r0 and the advisory wants 1.3.3-r0, which
# upstream madler/zlib has never tagged. Downgrading to Wolfi's 1.3.1-r51
# is not a way out either: it predates the 1.3.2-r0 fix for CVE-2026-27171.
#
# BLOCKED=1 skips build+merge so sweeps stop burning a red run here. Clear
# it with scripts/blocked.py --dispatch once Wolfi ships zlib 1.3.3-r0.
# mlflow: image-only recipe input (the chart is authored in the charts repo).
# MLflow is a pure-Python pip package, not a binary — there is no Wolfi `mlflow`
# package — so the melange pipeline installs `mlflow-skinny` plus the minimal server
# deps (flask/sqlalchemy/alembic/gunicorn/graphene/huey/pandas/... + psycopg2-binary +
# boto3) from PyPI into a virtualenv on a Wolfi python-3.12 base, then hardens it on a
# minimal apko base and gates it 0-CVE with Trivy. See melange.yaml for the full set.
#
# Versions = newest patch of the latest minor lines (PyPI versions, no `v` prefix,
# used as-is). pip pins the install to __VER__, so there is no per-arch source SHA to
# track (PyPI is the source); render() just substitutes the version into both recipes.
#   __VER__ = version (bare X.Y.Z), used directly as `mlflow-skinny==<VER>`
# NOTE: 3.12.0 dropped — its mlflow-skinny pins starlette 0.52.1 (5 fixable CVEs incl.
# CVE-2026-48710), which fails the 0-CVE gate; fastapi caps starlette <1.0 on that line
# so it can't be upgraded in place. 3.13.0+ pull a patched starlette and pass clean.
BLOCKED=1
FROM_SOURCE=0
VERSIONS=(3.15.2)
render() { echo "s/__VER__/$1/g"; }
