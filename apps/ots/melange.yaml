# ots: frontend and API docs (pnpm), then the Go binary embedding them, as upstream's Makefile does.
package:
  name: quench-ots
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened OTS one-time secret sharing, built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27
      - nodejs-24
      - npm

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/Luzifer/ots/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - runs: |
      set -eu
      export HOME="$(mktemp -d)" npm_config_cache="$(mktemp -d)"
      # upstream's Dockerfile builds with pnpm v11.28.12
      npm install -g --prefix "$HOME/.g" pnpm@11.28.12
      export PATH="$HOME/.g/bin:$PATH"
      pnpm install --frozen-lockfile
      NODE_ENV=production pnpm node ci/build.mjs
      pnpm redocly -o frontend/api.html build-docs docs/openapi.yaml
      test -f frontend/index.html && test -f frontend/api.html
      export CGO_ENABLED=0 GOTOOLCHAIN=local SOURCE_DATE_EPOCH=1
      go build -trimpath -ldflags "-s -w -buildid= -X main.version=v${{package.version}}" -o "${{targets.destdir}}/usr/bin/ots" .
      "${{targets.destdir}}/usr/bin/ots" --version > /tmp/v.txt 2>&1
      grep -F "${{package.version}}" /tmp/v.txt

test:
  pipeline:
    - runs: |
        ots --version
