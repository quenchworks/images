# ots: OTS, one-time secret sharing (secrets encrypted in the browser, the server stores only
# ciphertext, the link self-destructs after one read), from the release tag: the Vue frontend and
# the API docs built with pnpm, then one CGO-free Go binary with them embedded.
#
# 0-CVE: go.mod and pnpm-lock.yaml scanned 0 findings at v1.24.0 (2026-11-23); the stdlib goes
# with Wolfi's Go toolchain.
#
# NEWEST-ONLY: OTS ships one line.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(1.24.0)
# sha256 of the GitHub source tarball, from a download
declare -A SHA256=(
  [1.24.0]=3e18a7c53f50898a754395de488276d5a28be66645ac7eb2f1be7a6a1493f38f
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
