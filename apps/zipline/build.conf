# zipline: Zipline (diced/zipline, MIT), a file and image sharing server with a web UI, ShareX/Flameshot uploads,
# URL shortening, folders, invites, OAuth and passkeys. Images issue #91.
#
# From the release tag: pnpm install (Wolfi pnpm 10 with package-manager version management off: upstream pins pnpm
# 11, the lockfile is v9 either way), the Vite/tsup build, then a production-only node_modules. Node 24, sharp's
# prebuilt libvips, ffmpeg from Wolfi for video thumbnails. PostgreSQL via DATABASE_URL; uploads in
# /var/lib/zipline/uploads. LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(4.8.4)
declare -A SHA256=(
  [4.8.4]=4185587a42bc30f5bc6d513f44d726eaf70d3db809aeef9ad999136e37745c2d
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
