# Zipline from the release tag, built with pnpm on Wolfi nodejs-24; the package holds the build, the drizzle
# migrations and a production-only node_modules.
package:
  name: quench-zipline
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Zipline file sharing server, built from source on Wolfi"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - nodejs-24
      - ffmpeg
      - ca-certificates-bundle
      - tzdata

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - nodejs-24
      - pnpm
      - python-3.13

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/diced/zipline/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - name: pnpm install, build, production install
    runs: |
      set -eu
      export CI=true HOME="$(mktemp -d)" npm_config_store_dir="$(mktemp -d)"
      # upstream pins pnpm 11 in packageManager; Wolfi's pnpm 10 fetches and runs that version
      export npm_config_fetch_retries=5 npm_config_fetch_retry_maxtimeout=120000
      grep -q '"version": "${{package.version}}"' package.json
      pnpm install --frozen-lockfile
      # upstream's build starts with a style check (oxfmt --check) over the whole tree, which in the sandbox includes
      # this recipe's files and build leftovers; style does not change the output, so drop that step
      sed -i "/step('format', 'oxfmt --check'),/d" scripts/build.ts
      ! grep -q "oxfmt --check" scripts/build.ts
      ZIPLINE_BUILD=true pnpm run build
      test -f build/server/index.js
      rm -rf node_modules
      # CVE-2026-118764: minimatch 10.2.6 reaches the production install; 11.0.1 keeps the named export
      printf '%s\n' 'overrides:' "  'minimatch@<11.0.1': 11.0.1" >> pnpm-workspace.yaml
      pnpm install --prod --no-frozen-lockfile
      for m in node_modules/.pnpm/minimatch@*; do
        case "$m" in *minimatch@1[1-9].*|*minimatch@[2-9][0-9].*) ;; *) echo "FATAL: $m below 11.0.1"; exit 1 ;; esac
      done
      d="${{targets.destdir}}/zipline"
      install -d "$d"
      cp -a build drizzle node_modules package.json mimes.json code.json "$d/"
      # sharp ships glibc and musl builds of libvips; keep the glibc one (a musl .so makes melange add so:libc.musl)
      find "$d/node_modules" -depth -type d -name '*linuxmusl*' -exec rm -rf {} +
      # prebuilds/ dirs (argon2, ...) carry every OS and arch: keep linux-<this arch>, drop musl builds
      arch="$(node -p process.arch)"
      find "$d/node_modules" -type d -name prebuilds | while read -r pb; do
        for x in "$pb"/*; do [ "$(basename "$x")" = "linux-$arch" ] || rm -rf "$x"; done
        find "$pb" -name '*musl*' -exec rm -f {} +
      done
      cd "$d" && node -e "require('sharp'); console.log('sharp ok')"

test:
  pipeline:
    - runs: |
        test -f /zipline/build/server/index.js
        cd /zipline && node -e "require('sharp')"
