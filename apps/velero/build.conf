# velero: from-source via melange (Go build of the velero binary from the git
# tag tarball). Image-only (no chart). NEWEST-ONLY: just the single newest stable
# release from github.com/vmware-tanzu/velero (tags vX.Y.Z). One SHA256, one
# render(). Single static Go binary, CGO disabled. Upstream tags carry a "v"
# prefix; the tarball path uses v${version}. buildinfo.Version is stamped with
# the "v" prefix to match upstream `velero version` output.
FROM_SOURCE=1
VERSIONS=(1.18.2)
declare -A SHA256=(
  [1.18.2]=68d8c95817d882b2832c4c08689eb5f7b14dd581f71292a6c794acd15633b6d9
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
