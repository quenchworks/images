# Builds Velero (VMware Tanzu, CNCF) from source onto Wolfi. Velero's `./cmd/velero`
# is the combined server + CLI, so a single static Go binary (CGO disabled, matching
# upstream hack/build.sh) is both the `velero` CLI and the server that runs in-cluster.
# Version is stamped via the go linker's -X flags on pkg/buildinfo (Version + a clean
# GitTreeState) so `velero version` reports the real release. Output is a signed APK
# in Quenchworks' own repo. No upstream distro binaries. Image-only (no chart).
#
# go.mod requires go 1.25.8; we pin the go-1.25 toolchain package and force
# GOTOOLCHAIN=local so the build never downloads a toolchain over the network.
package:
  name: quench-velero
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Velero (Kubernetes backup/restore), built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      # go-1.26: stdlib 1.25.12 findings are fixed only in 1.25.13/1.26.6+, and Wolfi's
      # go-1.25 line tops out at 1.25.12 (same reasoning as cadence, harbor-registry).
      - go-1.26

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/vmware-tanzu/velero/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      export CGO_ENABLED=0
      export GOTOOLCHAIN=local
      export GOFLAGS=-mod=mod
      # 0-CVE gate bumps (patch/minor, same major, no API break):
      #   golang.org/x/net  v0.55.0 -> v0.56.0 (CVE-2026-46600: panic parsing an
      #                     invalid SVCB/HTTPS DNS resource record)
      #   golang.org/x/text v0.38.0 -> v0.39.0 (CVE-2026-56852: infinite loop on
      #                     invalid input)
      # otel CVE-2026-81870 on sdk 1.44.0, drifted onto the published image after
      # release. The 1.x core moves as a set; go mod tidy drops what velero does not use.
      # 0-CVE FLOORS, not pins (docs/go-module-float.md): raise a module only where go.mod has it
      # below the floor; a module absent from the graph is skipped. Bare `go get` pins downgraded
      # newer upstream releases (found 2026-10-05).
      FLOOR="golang.org/x/net@v0.58.0 golang.org/x/sys@v0.47.0 google.golang.org/grpc@v1.83.2 golang.org/x/crypto@v0.56.0 golang.org/x/text@v0.41.0 golang.org/x/mod@v0.40.0 go.opentelemetry.io/otel@v1.45.0 go.opentelemetry.io/otel/trace@v1.45.0 go.opentelemetry.io/otel/metric@v1.45.0 go.opentelemetry.io/otel/sdk@v1.45.0"
      # Go semver order (a release outranks its prereleases); busybox sort -V does not.
      vlt() { awk -v a="${1#v}" -v b="${2#v}" 'function pp(s,  p){sub(/\+.*/,"",s);p=index(s,"-");if(p){C=substr(s,1,p-1);P=substr(s,p+1)}else{C=s;P=""}} function cmp(x,y,  i,n,m,X,Y){n=split(x,X,".");m=split(y,Y,".");for(i=1;i<=n&&i<=m;i++){if(X[i]==Y[i])continue;if(X[i]~/^[0-9]+$/&&Y[i]~/^[0-9]+$/)return (X[i]+0<Y[i]+0)?-1:1;if(X[i]~/^[0-9]+$/)return -1;if(Y[i]~/^[0-9]+$/)return 1;return (X[i]<Y[i])?-1:1}return (n<m)?-1:(n>m)?1:0} BEGIN{pp(a);ca=C;pa=P;pp(b);cb=C;pb=P;c=cmp(ca,cb);if(c==0){if(pa==pb)c=0;else if(pa=="")c=1;else if(pb=="")c=-1;else c=cmp(pa,pb)}exit !(c<0)}'; }
      need=""
      for mv in $FLOOR; do
        have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${mv%@*}" 2>/dev/null)"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        vlt "$have" "${mv#*@}" && need="$need $mv"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || go get $need
      go mod tidy
      PKG=github.com/vmware-tanzu/velero
      go build -trimpath -installsuffix static \
        -ldflags "-s -w \
          -X ${PKG}/pkg/buildinfo.Version=v${{package.version}} \
          -X ${PKG}/pkg/buildinfo.GitTreeState=clean" \
        -o "${{targets.destdir}}/usr/bin/velero" ./cmd/velero
