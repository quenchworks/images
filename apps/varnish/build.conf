# STATUS: ZLIB-ONLY as of 2026-09-16. Measured, not assumed: run 35066977448
# on af0623d gated with exactly one finding, zlib CVE-2026-85091, on every
# version and both arches. Nothing else in this image is flagged.
#
# Wolfi is at 1.3.2.1_rc20260601-r0 and the advisory wants 1.3.3-r0, which
# upstream madler/zlib has never tagged. Downgrading to Wolfi's 1.3.1-r51
# is not a way out either: it predates the 1.3.2-r0 fix for CVE-2026-27171.
#
# BLOCKED=1 skips build+merge so sweeps stop burning a red run here. Clear
# it with scripts/blocked.py --dispatch once Wolfi ships zlib 1.3.3-r0.
# varnish: the varnishd BINARY comes from Wolfi's own `varnish` apk
# (FROM_SOURCE=0 for the program itself); melange only bakes a bootable default
# VCL, it compiles nothing. Same fast clean path as ingress-nginx / openldap:
# Wolfi already tracks Varnish at upstream's newest release (9.0.3, the current
# release as of 2026-07), so an in-house autotools build would duplicate work AND
# move the 0-CVE maintenance burden off Wolfi and onto us.
#
# UPSTREAM MOVED, twice -- do not chase the old links:
#   * github.com/varnishcache/varnish-cache is ARCHIVED (Feb 2026) at 8.0.0, and
#     varnish-cache.org now 301s to vinyl-cache.org ("Vinyl Cache", the renamed
#     community project).
#   * The releases this image ships come from github.com/varnish/varnish
#     (homepage varnish.org), which is where 9.0.x lands. That is also what Wolfi
#     builds from (its melange git-checkout points at varnish/varnish).
#
# Versions: the three newest lines Wolfi packages -- 7.7.3 (last of the 7 line),
# 8.0.0 and 9.0.3. VERSIONS holds the full X.Y.Z used as the image tag, mapped to
# the exact apk release via PIN. Upstream has 8.0.2, but Wolfi's newest 8 apk is
# still 8.0.0-r4; the pin follows Wolfi, so 8.0.x lags by two patches until Wolfi
# bumps it (scripts/check/varnish.py reports both numbers).
BLOCKED=1
FROM_SOURCE=0
VERSIONS=(7.7.3 8.0.0 9.0.3)
declare -A PIN=( [7.7.3]=7.7.3-r0 [8.0.0]=8.0.0-r4 [9.0.3]=9.0.3-r5 )
render() { local v=$1; echo "s/__VER__/$v/g; s|__PKG__|varnish=${PIN[$v]}|g"; }
