# Assembles the Varnish Cache runtime image from Wolfi's own pinned `varnish` apk
# (__PKG__, substituted per matrix entry by apps/varnish/build.conf render()) plus
# our tiny quench-varnish-config package, which carries the bootable default VCL.
# No Dockerfile. Minimal, nonroot (uid 1001), multi-arch, SBOM generated by apko.
#
# WHY gcc IS IN A RUNTIME IMAGE (it is not an oversight):
#   varnishd has no VCL interpreter -- it translates VCL to C and calls a C compiler
#   at every start and every `vcl.load`, then dlopen()s the result. Without a
#   compiler the process dies immediately with
#     "Message from C-compiler: ... gcc: not found / Running C-compiler failed"
#   so a "lean" image without gcc would not boot at all. The official varnish
#   images carry a compiler for exactly this reason. `gcc` pulls binutils,
#   glibc-dev and linux-headers, which is the whole toolchain varnishd needs;
#   varnish-dev is NOT required (verified on 7.7.3, 8.0.0 and 9.0.3 -- the
#   generated C needs no installed Varnish headers).
#
# PORTS: nonroot cannot bind Varnish's traditional :80, so HTTP listens on 8080 and
# the varnishadm CLI on 6082 -- both unprivileged.
#
# WRITABLE PATHS on a read-only rootfs (the chart mounts an emptyDir at each):
#   /var/lib/varnish  varnishd's working dir (-n): the shared-memory log
#                     (_.vsm_mgt/_.vsm_child), the CLI secret and the compiled
#                     vcl_*.so live here. It must NOT be noexec -- varnishd
#                     dlopen()s the VCL it just compiled out of this directory and
#                     refuses to start otherwise. Kubernetes emptyDir is fine;
#                     docker --tmpfs needs an explicit `exec` option.
#   /tmp              gcc's scratch space while it compiles the VCL.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - __PKG__                        # pinned varnish=<X.Y.Z-rN> (varnishd + varnishadm + varnishlog + vmods)
    - gcc                            # MANDATORY: varnishd compiles VCL to a .so at startup
    - busybox                        # MANDATORY: varnishd calls system("rm -rf vmod_cache ...") -> needs /bin/sh
    - quench-varnish-config@local    # /etc/varnish/default.vcl

accounts:
  groups:
    - groupname: varnish
      gid: 1001
  users:
    - username: varnish
      uid: 1001
      gid: 1001
  run-as: 1001

# varnishd is exec'd directly -- no entrypoint wrapper script, so it stays PID 1 and
# receives signals. -F keeps the manager in the FOREGROUND; without it varnishd
# daemonizes and the container exits immediately.
# Storage is left at varnishd's default (malloc) so the chart can pass its own
# `-s malloc,<size>` without ending up with two storage backends.
entrypoint:
  command: /usr/bin/varnishd -F -f /etc/varnish/default.vcl -a 0.0.0.0:8080 -T 0.0.0.0:6082 -n /var/lib/varnish

paths:
  # varnishd's working directory (-n). Must be writable by uid 1001; mount a
  # tmpfs/emptyDir here on a read-only rootfs.
  - path: /var/lib/varnish
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o755

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-varnish"
  org.opencontainers.image.licenses: "BSD-2-Clause"
