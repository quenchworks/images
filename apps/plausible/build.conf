# plausible: Plausible Analytics Community Edition, privacy-friendly web analytics. Elixir/Phoenix release on
# PostgreSQL (accounts, sites) and ClickHouse (events). Built from the source tag with MIX_ENV=ce on Wolfi Erlang 27
# and Elixir 1.19.4 built from source (upstream's own toolchain; Wolfi's Elixir is OTP 28 only), uid 1001, port 8000.
#
# extra/ is deleted before the build: it is proprietary ("no rights to use, distribute or otherwise exploit"), and
# the CE build never compiles it (mix.exs elixirc_paths(:ce) is ["lib"]); assets/css/app.css's @source line for it
# goes too. Migrations: bin/plausible eval Plausible.Release.createdb, then Plausible.Release.interweave_migrate.
#
# NEWEST-ONLY: one release line.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(3.2.2)
# sha256 of the GitHub source tarball, from a download
declare -A SHA256=(
  [3.2.2]=fe3a7331cdf30997061e1e9d5014a26ad139378e1545f7a9329cc1b845ce8b5d
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
