contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-selenium-node-firefox@local

accounts:
  groups:
    - groupname: nonroot
      gid: 1001
  users:
    - username: nonroot
      uid: 1001
      gid: 1001
      homedir: /home/nonroot
  run-as: 1001

environment:
  JAVA_HOME: /usr/lib/jvm/java-21-openjdk
  HOME: /home/nonroot
  LANG: C.UTF-8
  # no display server in the image: every Firefox session runs headless
  MOZ_HEADLESS: "1"

paths:
  - path: /home/nonroot
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o755

work-dir: /home/nonroot

# A Firefox node by default; append `--hub <url>` (or the event-bus flags) to join a grid,
# or run `standalone --config /etc/selenium/config.toml`. JVM flags go in JAVA_TOOL_OPTIONS.
entrypoint:
  command: /usr/lib/jvm/java-21-openjdk/bin/java -jar /usr/share/selenium/selenium-server.jar
cmd: node --config /etc/selenium/config.toml

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-selenium-node-firefox"
  org.opencontainers.image.licenses: "Apache-2.0"
