# kfp-persistence-agent: Kubeflow Pipelines persistence_agent, built from the kubeflow/pipelines release tag (2026-10-20).
# One app per KFP component; all of them build from the same tarball, so a version bump moves
# every kfp-* app together (the chart pins one release).
FROM_SOURCE=1
VERSIONS=(2.17.2)
declare -A SHA256=(
  [2.17.2]=d220e895bff838c43557a5bb5269fe1b995b6470abccc4989dc83269bba443dd
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
