# kafka: from-source via melange (installs the Apache kafka_2.13-X.Y.Z binary
# distribution under /opt/kafka). Latest 3 stable minor lines, newest patch each.
# Each release pins its distribution tarball by sha256 (SHA256 map).
# STATUS: BLOCKED (do not publish)
# Re-triaged 2026-07-08 against kafka 4.3.1 (the newest release; 4.4.0 not yet out).
# The 3->4 jline major jar lock is STILL REAL and confirmed:
#   jar : opt/kafka/libs/jline-3.30.4.jar  (org.jline:jline-remote-telnet 3.30.4)
#   CVEs: GHSA-2r2c-cx56-8933 (HIGH, telnet NAWS DoS),
#         GHSA-47qp-hqvx-6r3f (HIGH, telnet NEW-ENVIRON memory exhaustion)
#   fix : ONLY in jline 4.2.1 == a 3.x -> 4.x MAJOR bump. No jline 3.x patch exists,
#         so a same-major swap is impossible; kafka 4.3.1 (newest) still ships jline
#         3.30.4 and is compiled against the jline 3 API, so dropping jline-4.2.1.jar
#         into libs/ would break the kafka console/CLI tools. Needs an upstream kafka
#         release built against jline 4.x, which does not yet exist.
#   (Secondary, moot while jline blocks: shaded/standalone jackson-databind 2.21.2 in
#    libs/ -> CVE-2026-54512/54513 HIGH + -54514..-54518 MEDIUM, same-major fix
#    2.21.4 — would be a swap candidate but does not clear the HIGH jline lock.)
# Unblock when a kafka release ships jline >= 4.2.1.
BLOCKED=1  # jline 3->4 major jar lock — see STATUS header above
FROM_SOURCE=1
VERSIONS=(4.1.2 4.2.1 4.3.1)
declare -A SHA256=(
  [4.1.2]=18795e0b9a89de0ed8443ad83365e26f6407813afec4fe139c1acb0c3364e6dc
  [4.2.1]=cff839a5994a8fd9b026b554d09852807a6ef9fd4d8246ef151732631da49dfa
  [4.3.1]=f118328b2d053497350d5befd82c08db7ffd710327ff52943dd5caaa1b25db21
)
render() { echo "s/__VER__/$1/g; s/__SHA256__/${SHA256[$1]}/g"; }
