# kafka: from-source via melange (installs the Apache kafka_2.13-X.Y.Z binary
# distribution under /opt/kafka). Latest 3 stable minor lines, newest patch each.
# Each release pins its distribution tarball by sha256 (SHA256 map).
FROM_SOURCE=1
VERSIONS=(4.1.2 4.2.1 4.3.0)
declare -A SHA256=(
  [4.1.2]=18795e0b9a89de0ed8443ad83365e26f6407813afec4fe139c1acb0c3364e6dc
  [4.2.1]=cff839a5994a8fd9b026b554d09852807a6ef9fd4d8246ef151732631da49dfa
  [4.3.0]=28cfdb0ca55b4ad85e84d090c10e3f4f970e250db226ae3756b209461e48b54d
)
render() { echo "s/__VER__/$1/g; s/__SHA256__/${SHA256[$1]}/g"; }
