# kafka: from-source via melange (installs the Apache kafka_2.13-X.Y.Z binary
# distribution under /opt/kafka). Newest release only (see below).
# Each release pins its distribution tarball by sha256 (SHA256 map).
# STATUS: shippable (0-CVE gate passes on 4.3.1; UNBLOCKED 2026-07-09)
# Previously BLOCKED on the jline 3->4 jar lock + jackson-databind 2.21.2. Both are
# cleared by a standalone libs/ jar swap in melange.yaml (guarded to 4.3.1):
#   jackson 2.21.2 -> 2.21.5 (CVE-2026-54512..54518; databind needs 2.21.5 for -54515).
#   jline   3.30.4 -> 4.2.1  (GHSA-2r2c-cx56-8933 / GHSA-47qp-hqvx-6r3f, telnet-server
#     DoS; the only fix is the 3->4 bundle). The jline telnet server is unused by kafka
#     and the broker + console/topic/storage CLIs don't touch jline -- the smoke test
#     (broker boot + topic create + produce/consume + --version) passes on jline 4.2.1.
#     CAVEAT: the interactive kafka-metadata-shell links jline and is NOT exercised by
#     the smoke test; if a future audit needs it, verify it against jline 4.x.
# Newest-only: older kafka lines (4.1.2/4.2.1) bundle a different jackson AND the same
# CVE'd jline 3.x, so they can't pass with the 4.3.1-pinned swap; dropped from VERSIONS.
# Re-add older lines only with their own per-version swaps. Revisit if kafka ships a
# release already built on jline >= 4.2.1 (then the jline swap becomes unnecessary).
FROM_SOURCE=1
VERSIONS=(4.3.1)
declare -A SHA256=(
  [4.1.2]=18795e0b9a89de0ed8443ad83365e26f6407813afec4fe139c1acb0c3364e6dc
  [4.2.1]=cff839a5994a8fd9b026b554d09852807a6ef9fd4d8246ef151732631da49dfa
  [4.3.1]=f118328b2d053497350d5befd82c08db7ffd710327ff52943dd5caaa1b25db21
)
render() { echo "s/__VER__/$1/g; s/__SHA256__/${SHA256[$1]}/g"; }
