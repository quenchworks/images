# scylla-operator: ScyllaDB clusters on Kubernetes (ScyllaCluster resources), from the release tag via melange. The
# same static binary runs as the operator, its webhook, and inside the Scylla pods (sidecar, ignition), as upstream's
# image does. Latest only. Sized 2026-11-23 at v1.23.0: stdlib, x/net and otel clear with Wolfi Go and the house
# floors; with them no docker/docker package is linked (the build asserts nothing beyond api/types/versions).
FROM_SOURCE=1
VERSIONS=(1.23.0)
declare -A SHA256=(
  [1.23.0]=766cc235f273738ca3a24ea61d2f64eab965c3c65c192b397a21f3bbaf720a64
)
declare -A COMMIT=(
  [1.23.0]=8473052a829d5545aedad9e359bd1c82a48850c7
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g; s|__COMMIT__|${COMMIT[$1]}|g"; }
