# ScyllaDB Operator runtime: the static binary plus busybox (upstream's image carries a shell and procps; the operator
# image also serves init and sidecar containers inside Scylla pods). Nonroot uid 1001, multi-arch, SBOM by apko.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - busybox
    - quench-scylla-operator@local

accounts:
  groups:
    - groupname: scylla
      gid: 1001
  users:
    - username: scylla
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/bin/scylla-operator

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-scylla-operator"
  org.opencontainers.image.licenses: "Apache-2.0"
  org.opencontainers.image.version: "__VER__"
