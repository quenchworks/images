# clamav: ClamAV antivirus engine (clamd daemon, freshclam, clamscan, clamdscan),
# built FROM SOURCE from the release tarball, which vendors its Rust crates.
#
# Why not Wolfi's clamav-<line> apks: they lag upstream by patch releases
# (checked 2026-09-27: Wolfi 1.5.2 and 1.4.3, upstream 1.5.4 and 1.4.6), and an
# antivirus engine is exactly where a missed patch release matters.
#
# WINDOW: 1.5 (feature) and 1.4 (LTS). sha256 verified against both
# www.clamav.net and the GitHub release asset.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(1.4.6 1.5.4)
declare -A SHA256=(
  [1.4.6]=06dbc7adf96e2f6a27c548a841ce83c95360d1e121b106a6f7cf56f282a3c61b
  [1.5.4]=1af1117a228f1b5bc7fa91a0dabc37848a99e7d25188e9be8043332ce721dfd3
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
