# shellcheck: the official static binary from the GitHub release (the shell script static analysis tool), per arch.
# FROM_SOURCE=0: upstream builds it with GHC; the release binary is static. Each sha256
# is from a download that matched the digest GitHub publishes for the asset.
FROM_SOURCE=0
VERSIONS=(0.11.0)
declare -A SHA_AMD=(
  [0.11.0]=8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
)
declare -A SHA_ARM=(
  [0.11.0]=12b331c1d2db6b9eb13cfca64306b1b157a86eb69db83023e261eaa7e7c14588
)
render() { echo "s/__VER__/$1/g; s|__SHA_AMD__|${SHA_AMD[$1]}|g; s|__SHA_ARM__|${SHA_ARM[$1]}|g"; }
