# helmfile (helmfile/helmfile, MIT): declarative deployment of Helm charts and releases from a helmfile.yaml,
# with environments, templating and secrets. Image only, no chart.
#
# Built from the release tag with the house Go floors and the otel 1.47 family loop (the cosign recipe),
# -X go.szostok.io/version.version, plus helm 4 (Apache-2.0) from its release tag with the helm recipe's
# floors, as upstream's image bundles helm. Plugins (helm-diff for `helmfile diff/apply`) are not included.
# HELM_* homes point at /tmp, so a read-only rootfs needs a writable /tmp. LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(1.8.5)
declare -A SHA256=(
  [1.8.5]=916370931c502d9b33f7aec56737b990d65e4b342c946506cdf8e8a9259c0303
)
# the bundled helm (keep in step with apps/helm's newest 4.x)
HELM=4.3.2
HELM_SHA256=7d848fa8880cca40f9548e46255d38e3e25259847fe81775c5a09af0c3dda2e1
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g; s|__HELM_SHA256__|$HELM_SHA256|g; s|__HELM__|$HELM|g"; }
