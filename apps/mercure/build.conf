# mercure: Mercure (dunglas/mercure), a real-time push hub (server-sent events) with JWT-authorised
# publishing, built as a Caddy module. AGPL-3.0. Images issue #46.
#
# Built like upstream's goreleaser: the caddy/mercure main with the deprecated_transport tag and the
# Caddy CustomVersion / CustomBinaryName / ServerHeader ldflags; upstream's Caddyfile reads everything
# from the environment (SERVER_NAME, MERCURE_PUBLISHER_JWT_KEY, ...).
FROM_SOURCE=1
VERSIONS=(1.1.6)
declare -A SHA256=(
  [1.1.6]=91a3116ca6c06428e6ff074a39144c76820f54f023d01c74b11423e022cb4218
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
