package:
  name: quench-mercure
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Mercure hub, built from source on Wolfi"
  copyright:
    - license: AGPL-3.0-only
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/dunglas/mercure/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - name: Build mercure (Caddy with the Mercure module)
    working-directory: caddy
    runs: |
      set -eu
      export CGO_ENABLED=0 GOFLAGS=-mod=mod GOTOOLCHAIN=local
      FLOOR="golang.org/x/crypto@v0.58.1-0.20261009181718-2f1f834330b2 golang.org/x/net@v0.62.0"
      MODS="$(echo "$FLOOR" | tr ' ' '\n' | cut -d@ -f1)"
      below_floor() {
        awk -v floor="$FLOOR" -v tag="$1" '
          BEGIN { n = split(floor, f, " ")
                  for (i = 1; i <= n; i++) { split(f[i], kv, "@"); want[kv[1]] = kv[2] } }
          ($1 in want) {
            split(substr($2, 2), g, "."); split(substr(want[$1], 2), w, ".")
            for (i = 1; i <= 3; i++) {
              if ((g[i] + 0) > (w[i] + 0)) next
              if ((g[i] + 0) < (w[i] + 0)) { print $1 "@" want[$1] " (" tag " has " $2 ")"; next }
            }
          }'
      }
      need="$(go list -m -e $MODS | awk 'NF >= 2 && $NF ~ /^v[0-9]/ { print $1, $NF }' | below_floor go.mod | awk '{ print $1 }')"
      if [ -n "$need" ]; then go get $need; fi
      c=github.com/caddyserver/caddy/v2
      go build -trimpath -tags deprecated_transport -ldflags "-s -w \
        -X '$c/modules/caddyhttp.ServerHeader=Mercure.rocks Caddy' \
        -X '$c.CustomVersion=Mercure.rocks v${{package.version}} Caddy' \
        -X '$c.CustomBinaryName=mercure'" -o "${{targets.destdir}}/usr/bin/mercure" ./mercure
      bad="$(go version -m "${{targets.destdir}}/usr/bin/mercure" | awk '$1 == "dep" || $1 == "=>" { print $2, $3 }' | below_floor mercure)"
      [ -z "$bad" ] || { echo "float did not reach the binary:"; echo "$bad"; exit 1; }
      install -Dm644 ../Caddyfile "${{targets.destdir}}/etc/caddy/Caddyfile"
      "${{targets.destdir}}/usr/bin/mercure" version | grep -F "v${{package.version}}"

test:
  pipeline:
    - runs: mercure version
