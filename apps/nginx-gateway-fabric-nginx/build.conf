# STATUS: ZLIB-ONLY as of 2026-09-16. Measured, not assumed: run 35066789976
# on af0623d gated with exactly one finding, zlib CVE-2026-85091, on every
# version and both arches. Nothing else in this image is flagged.
#
# Wolfi is at 1.3.2.1_rc20260601-r0 and the advisory wants 1.3.3-r0, which
# upstream madler/zlib has never tagged. Downgrading to Wolfi's 1.3.1-r51
# is not a way out either: it predates the 1.3.2-r0 fix for CVE-2026-27171.
#
# BLOCKED=1 skips build+merge so sweeps stop burning a red run here. Clear
# it with scripts/blocked.py --dispatch once Wolfi ships zlib 1.3.3-r0.
# NGINX Gateway Fabric DATA PLANE: nginx + the njs module + nginx-agent, from source.
#
# WHY THIS IS A SEPARATE IMAGE AND NOT apps/nginx
# apps/nginx cannot serve as NGF's data plane, and not for a tunable reason. NGF 2.x
# does not template nginx.conf into a ConfigMap: the control plane pushes configuration
# over gRPC to an nginx-agent v3 process that lives NEXT TO nginx in the same container
# and writes the files itself. The data-plane image therefore has to contain three
# things apps/nginx does not have:
#   1. nginx-agent (a separate Go program from github.com/nginx/agent),
#   2. the njs dynamic module -- NGF's own nginx.conf opens with
#      `load_module modules/ngx_http_js_module.so;` and `js_import modules/njs/*.js`,
#      so nginx exits on start without it,
#   3. NGF's njs scripts (httpmatches.js, epp.js) and its nginx.conf +
#      grpc-error-{locations,pages}.conf, which ship in the NGF SOURCE tree.
# It also needs `--with-stream` + stream_ssl_preread (NGF's nginx.conf has a stream{}
# block using $ssl_preread_server_name for TLSRoute) and the whole /etc/nginx layout
# NGF mounts over. apps/nginx has none of that and shouldn't grow it: it is a hardened
# web server for the nginx chart, listening on 8080 as uid 1001.
#
# VERSION = the NGF version, because that is what the pair is keyed on: the control
# plane defaults the data-plane image tag to its own version. The nginx / njs / agent
# trio below is what NGF v2.6.7's build/Dockerfile.nginx pins (NGINX_VERSION=1.31.3,
# NGINX_AGENT_VERSION=v3.11.2, plus nginx-module-njs from the same alpine repo -- njs
# 1.0.0 is the release that matches nginx 1.31.x). Re-read that Dockerfile on every
# bump; a mismatched agent and control plane fail to negotiate over gRPC.
#
# NOT SHIPPED: ngx_otel_module. Upstream's data-plane image adds nginx-module-otel, and
# NGF emits `load_module modules/ngx_otel_module.so;` ONLY when an NginxProxy sets
# spec.telemetry.exporter.endpoint (internal/controller/nginx/config/
# main_config_template.go). Building it means dragging gRPC/protobuf C++ into a 0-CVE
# image for one optional feature, so tracing is deliberately unsupported here and the
# chart's values.schema.json rejects the field rather than letting nginx die at reload.
BLOCKED=1
FROM_SOURCE=1
VERSIONS=(2.6.7)
declare -A SHA256=(
  [2.6.7]=c04aa832a348023170989762d70d14967a800a426708c3257dd36f44d16717ab
)
# Per-NGF-release component pins, from that release's build/Dockerfile.nginx. Note the
# two pins are NOT equally strict there, and this file mirrors that exactly:
#   apk add nginx~=1.31.3          fuzzy -- any 1.31.x patch at or above 1.31.3
#   apk add nginx-agent=3.11.2     exact -- the agent negotiates a protocol version
#                                  with the control plane, so it is release-locked
# So nginx tracks the newest patch of the pinned MINOR line (1.31.4 today), which is
# also where nginx's own security fixes land, while nginx-agent stays where NGF put it.
declare -A NGINX_VER=(   [2.6.7]=1.31.4 )
declare -A NGINX_SHA=(   [2.6.7]=e6f20b644a17a643f059ae6467a1971fe2811587d025e071068753a1f1e3b3c3 )
declare -A NJS_VER=(     [2.6.7]=1.0.0 )
declare -A NJS_SHA=(     [2.6.7]=56fe6560549cbcb7fb5740534b541bb153250d8772aa16ac18bc30eb0cc498dd )
declare -A AGENT_VER=(   [2.6.7]=3.11.2 )
declare -A AGENT_SHA=(   [2.6.7]=85c676d22a08bc5c268f7fbc584552fc86acc67927c7b0957f631c5d9febefd6 )
# nginx-agent stamps -X main.commit; the tarball has no .git, so the tag's commit is
# pinned here (`gh api repos/nginx/agent/commits/v<tag> --jq .sha`).
declare -A AGENT_COMMIT=( [2.6.7]=006f54b9eedd426f40ce364654ce6c301c754210 )
render() {
  echo "s/__VER__/$1/g;\
s|__SHA256__|${SHA256[$1]}|g;\
s|__NGINX_VER__|${NGINX_VER[$1]}|g;\
s|__NGINX_SHA__|${NGINX_SHA[$1]}|g;\
s|__NJS_VER__|${NJS_VER[$1]}|g;\
s|__NJS_SHA__|${NJS_SHA[$1]}|g;\
s|__AGENT_VER__|${AGENT_VER[$1]}|g;\
s|__AGENT_SHA__|${AGENT_SHA[$1]}|g;\
s|__AGENT_COMMIT__|${AGENT_COMMIT[$1]}|g"
}
