# terralist: Terralist, a private Terraform and OpenTofu registry for modules and
# providers (the registry protocol, a web UI, OAuth login, API keys), built from source:
# the Svelte UI with yarn, then the Go server embedding it. Pure-Go SQLite, no CGO.
#
# 0-CVE: melange.yaml floats the otel train (core 1.45.0, contrib 0.70.0/1.45.0), grpc
# and the golang.org/x set (measured 2026-09-25 on 0.10.9: 6 findings, 0 after).
#
# NEWEST-ONLY: upstream ships one line (0.10.x) and patches only its newest release.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(0.10.9)
declare -A SHA256=(
  [0.10.9]=3895facc4f2793c6dede2b3a5874bd1d8a8bf546aca3d941229c57be2f501c06
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
