# Builds Terralist from the release tag tarball onto Wolfi: the Svelte UI with yarn
# (build-only, it never reaches the image), embedded into the Go server via
# web/fs.go (go:embed all:dist).
package:
  name: quench-terralist
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Terralist, the private Terraform registry, built from source on Wolfi"
  copyright:
    - license: MPL-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - git              # module uploads and VCS webhooks can fetch from git remotes

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go
      - nodejs-24          # upstream builds the UI on node 24
      - yarn               # web/yarn.lock is a yarn classic lockfile

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/terralist/terralist/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - name: Build the Svelte UI (yarn + vite)
    runs: |
      set -eu
      export HOME="$(mktemp -d)"
      export YARN_CACHE_FOLDER="$(mktemp -d)"
      export TERRALIST_VERSION=${{package.version}}
      yarn --cwd web install --frozen-lockfile --non-interactive
      yarn --cwd web build
      test -f web/dist/index.html

  - name: Build the Terralist server (static, CGO off)
    runs: |
      set -eu
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      export GO111MODULE=on
      export GOTOOLCHAIN=local
      # ---- 0-CVE module float (docs/go-module-float.md) ----------------------
      # FLOOR is a FLOOR, not a pin: only modules below it are floated, and the shipped
      # binary is asserted to carry nothing below it. Measured 2026-09-25 on 0.10.9:
      # otel/sdk 1.44.0, x/crypto 0.54.0, grpc 1.83.0. otel moves as one train (core
      # 1.45.0 with contrib 0.70.0 and detectors/gcp 1.45.0) so the semconv schema URLs
      # agree at boot. No `replace` directives.
      FLOOR="go.opentelemetry.io/otel@v1.45.0 go.opentelemetry.io/otel/metric@v1.45.0 go.opentelemetry.io/otel/sdk@v1.45.0 go.opentelemetry.io/otel/sdk/metric@v1.45.0 go.opentelemetry.io/otel/trace@v1.45.0 go.opentelemetry.io/contrib/detectors/gcp@v1.45.0 go.opentelemetry.io/contrib/instrumentation/google.golang.org/grpc/otelgrpc@v0.70.0 go.opentelemetry.io/contrib/instrumentation/net/http/otelhttp@v0.70.0 google.golang.org/grpc@v1.83.2 golang.org/x/crypto@v0.56.0 golang.org/x/net@v0.58.0 golang.org/x/text@v0.41.0"
      MODS="$(echo "$FLOOR" | tr ' ' '\n' | cut -d@ -f1)"
      below_floor() {
        awk -v floor="$FLOOR" -v tag="$1" '
          BEGIN { n = split(floor, f, " ")
                  for (i = 1; i <= n; i++) { split(f[i], kv, "@"); want[kv[1]] = kv[2] } }
          ($1 in want) {
            split(substr($2, 2), g, "."); split(substr(want[$1], 2), w, ".")
            for (i = 1; i <= 3; i++) {
              if ((g[i] + 0) > (w[i] + 0)) next
              if ((g[i] + 0) < (w[i] + 0)) { print $1 "@" want[$1] " (" tag " has " $2 ")"; next }
            }
          }'
      }
      go list -m -e $MODS
      need="$(go list -m -e $MODS | awk 'NF >= 2 && $NF ~ /^v[0-9]/ { print $1, $NF }' | below_floor go.mod | awk '{ print $1 }')"
      if [ -n "$need" ]; then go get $need; fi
      go mod tidy
      go build -trimpath \
        -ldflags "-s -w -X main.Version=${{package.version}} -X main.Mode=release" \
        -o "${{targets.destdir}}/usr/bin/terralist" ./cmd/terralist
      bad="$(go version -m "${{targets.destdir}}/usr/bin/terralist" \
        | awk '$1 == "dep" || $1 == "=>" { print $2, $3 }' | below_floor terralist)"
      [ -z "$bad" ] || { echo "❌ 0-CVE float did not reach terralist:"; echo "$bad"; exit 1; }

test:
  pipeline:
    - runs: |
        terralist version | grep -F "${{package.version}}"
