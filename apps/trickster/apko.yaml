# Trickster runtime: trickster is the entrypoint (-config <file>, or -origin-url + -provider); proxy 8480, metrics 8481.
# Nonroot 1001, so listen on ports above 1023 unless the pod grants NET_BIND_SERVICE.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-trickster@local

accounts:
  groups:
    - groupname: trickster
      gid: 1001
  users:
    - username: trickster
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/bin/trickster

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-trickster"
  org.opencontainers.image.licenses: "Apache-2.0"
  org.opencontainers.image.version: "__VER__"
