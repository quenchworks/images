# Trickster (trickstercache/trickster, Apache-2.0): a caching reverse proxy and accelerator for
# time-series databases (Prometheus, InfluxDB, ClickHouse) and plain HTTP origins, with delta
# proxy caching of dashboard range queries. From source via melange: one static Go binary
# stamped with upstream's -X main.applicationVersion. Newest patch of the 2.1 and 2.2 lines; 2.0
# (last patch 2.0.5, 2026-07-31) pins grpc 1.82 and otel 1.44, so it is not shipped.
FROM_SOURCE=1
VERSIONS=(2.1.0 2.2.1)
declare -A SHA256=(
  [2.1.0]=fe8814abaefd9ba7f9d882329ed184303ed52a20a50f15d8165d09c7d3c91137
  [2.2.1]=68a9cde9a1459750ec2c457adffd8cae5e544c85d6429ed85983958d183d7a50
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
