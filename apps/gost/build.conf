# GOST (go-gost/gost, MIT): GO Simple Tunnel, a multi-protocol forward proxy and tunnel (HTTP,
# SOCKS5, Shadowsocks, relay; TLS, QUIC, WebSocket and other transports; port forwarding). From
# source via melange: one static Go binary stamped with upstream's -X main.version.
# LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(3.3.3)
declare -A SHA256=(
  [3.3.3]=2c79c7675894cfd5849d646f037dc82e4278cd43439e3e0b0160fdf112269564
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
