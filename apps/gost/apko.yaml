# GOST runtime: gost is the entrypoint; pass services as flags (-L, -F) or a config with -C.
# Nonroot 1001, so listen on ports above 1023 unless the pod grants NET_BIND_SERVICE.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-gost@local

accounts:
  groups:
    - groupname: gost
      gid: 1001
  users:
    - username: gost
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/bin/gost

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-gost"
  org.opencontainers.image.licenses: "MIT"
  org.opencontainers.image.version: "__VER__"
