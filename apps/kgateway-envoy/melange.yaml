# Builds kgateway's `envoyinit` bootstrap shim from source onto Wolfi. Single static Go
# binary, no CGO, same build flags as the controller (upstream Makefile builds
# ./cmd/envoyinit with GO111MODULE=on CGO_ENABLED=0 and the same LDFLAGS).
#
# Also installs upstream's own /docker-entrypoint.sh verbatim from the source tree
# (cmd/envoyinit/docker-entrypoint.sh) rather than a rewrite of it, so the two modes the
# deployer can ask for keep working: the default execs envoyinit, and ENVOY_SIDECAR=true
# (the Istio-ambient path) execs envoy against the sidecar bootstrap instead.
package:
  name: quench-kgateway-envoy
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened kgateway data plane (Envoy plus the envoyinit bootstrap shim), built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      # /bin/sh for the entrypoint script, and `wget` for the preStop hook the kgateway
      # deployer generates on every proxy pod:
      #   /bin/sh -c 'wget --post-data "" -O /dev/null 127.0.0.1:19000/healthcheck/fail; sleep 10'
      # That hook is how a Gateway drains connections before termination. Without a
      # shell and a wget it fails as FailedPreStopHook and the drain is lost.
      #
      # busybox-FULL, not busybox, and the local boot test is what found it: Wolfi's
      # plain `busybox` apk is built WITHOUT the wget applet (222 applets in
      # busybox-full versus a trimmed set in busybox), so the drain hook would have
      # failed on every terminating proxy pod while the image otherwise looked fine.
      # Upstream sidesteps this by copying the Docker Hub busybox, which does carry
      # wget. busybox-full installs its applets under /usr/bin, and wolfi-baselayout
      # already links /bin -> usr/bin, so /bin/sh still resolves.
      - busybox-full

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-1.26

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/kgateway-dev/kgateway/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      set -eu
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      # go.mod declares `go 1.26.7` and Wolfi's go-1.26 IS 1.26.7: satisfied locally,
      # so no toolchain download.
      export GOTOOLCHAIN=local

      # 2026-09-14: the nightly scan flagged google.golang.org/grpc below its fix
      # (CVE-2026-84304, CVE-2026-84445, CVE-2026-84303) in the published image; this
      # recipe had no float at all. FLOOR, not a bare `go get mod@vX`, per
      # docs/go-module-float.md: an exact pin is a no-op under a `replace` and becomes
      # a DOWNGRADE once upstream requires more. Note envoyinit does NOT link
      # istio.io/istio, which is why this app needs no VEX file while apps/kgateway
      # does.
      FLOOR="google.golang.org/grpc@v1.83.2 golang.org/x/crypto@v0.56.0 golang.org/x/net@v0.58.0 golang.org/x/text@v0.41.0 golang.org/x/sys@v0.47.0 go.opentelemetry.io/otel@v1.45.0 go.opentelemetry.io/otel/trace@v1.45.0 go.opentelemetry.io/otel/metric@v1.45.0 go.opentelemetry.io/otel/sdk@v1.45.0 go.opentelemetry.io/otel/sdk/metric@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlpmetric/otlpmetricgrpc@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlpmetric/otlpmetrichttp@v1.45.0 go.opentelemetry.io/otel/exporters/stdout/stdouttrace@v1.45.0 go.opentelemetry.io/otel/exporters/stdout/stdoutmetric@v1.45.0 go.opentelemetry.io/otel/log@v0.21.0 go.opentelemetry.io/otel/sdk/log@v0.21.0 go.opentelemetry.io/otel/exporters/otlp/otlplog/otlploggrpc@v0.21.0 go.opentelemetry.io/otel/exporters/otlp/otlplog/otlploghttp@v0.21.0 go.opentelemetry.io/otel/exporters/stdout/stdoutlog@v0.21.0 go.opentelemetry.io/otel/exporters/prometheus@v0.67.0"
      MODS="$(echo "$FLOOR" | tr ' ' '\n' | cut -d@ -f1)"
      below_floor() {
        awk -v floor="$FLOOR" -v tag="$1" '
          BEGIN { n = split(floor, f, " ")
                  for (i = 1; i <= n; i++) { split(f[i], kv, "@"); want[kv[1]] = kv[2] } }
          ($1 in want) {
            split(substr($2, 2), g, "."); split(substr(want[$1], 2), w, ".")
            for (i = 1; i <= 3; i++) {
              if ((g[i] + 0) > (w[i] + 0)) next
              if ((g[i] + 0) < (w[i] + 0)) { print $1 "@" want[$1] " (" tag " has " $2 ")"; next }
            }
          }'
      }
      # -e + the version guard: plain `go list -m M` FAILS when the app does not
      # require M, and -e's version-less output would otherwise be read as
      # below-floor and `go get`ed, ADDING a dependency the app never had.
      GOFLAGS=-mod=mod go list -m -e $MODS 2>/dev/null || true
      need="$(GOFLAGS=-mod=mod go list -m -e $MODS 2>/dev/null | awk 'NF >= 2 && $NF ~ /^v[0-9]/ { print $1, $NF }' | below_floor go.mod | awk '{ print $1 }')"
      if [ -n "$need" ]; then GOFLAGS=-mod=mod go get $need; fi
      GOFLAGS=-mod=mod go mod tidy

      go build -trimpath \
        -ldflags "-s -w -X github.com/kgateway-dev/kgateway/v2/pkg/version.Version=v${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/envoyinit" ./cmd/envoyinit

      # Upstream's entrypoint, byte for byte from the release tarball.
      install -Dm0755 cmd/envoyinit/docker-entrypoint.sh \
        "${{targets.destdir}}/docker-entrypoint.sh"
