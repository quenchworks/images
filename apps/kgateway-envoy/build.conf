# kgateway-envoy: the kgateway DATA PLANE. This is upstream's `envoy-wrapper` image,
# rebuilt clean-room: our own hardened Wolfi envoy apk (the same one behind the quench
# `envoy` image) plus kgateway's `envoyinit` bootstrap shim built from source.
#
# WHY A SECOND IMAGE AND NOT JUST `envoy`: the kgateway deployer generates the proxy
# Deployment with NO `command`, only args (`--disable-hot-restart --service-node
# $(POD_NAME).$(POD_NAMESPACE) --log-level info`) -- no `-c`. The image entrypoint is
# what has to find the bootstrap. `envoyinit` reads /etc/envoy/envoy.yaml (the ConfigMap
# the controller writes), expands Kubernetes Downward API templates such as
# {{.PodName}} in it, appends the OS CA bundle as the `system_trust` static secret, and
# then syscall.Exec's envoy with `--config-yaml <expanded>` plus whatever args the pod
# spec passed. Our stock `envoy` image cannot do that, so it cannot be the data plane on
# its own -- but its envoy binary is exactly the binary this image runs.
#
# VERSION LOCKSTEP: this image's version IS the kgateway version, because envoyinit is
# built from the same source tree as the controller and consumes the bootstrap that
# controller generates. Keep VERSIONS and ENVOY_PKG identical to apps/kgateway.
#   kgateway 2.3.7 -> upstream ENVOY_IMAGE envoyproxy/envoy:v1.37.5 (Wolfi: 1.37.1)
#   kgateway 2.4.3 -> upstream ENVOY_IMAGE envoyproxy/envoy:v1.38.3 (Wolfi: 1.38.1)
#
# NOT SHIPPED: librust_module.so and ENVOY_DYNAMIC_MODULES_SEARCH_PATH -- see
# apps/kgateway/build.conf for the full reasoning (Rust 1.95 vs Wolfi rust-1.92, plus an
# ABI-pinned git SDK dependency on envoyproxy/envoy at the exact patch tag). Only
# TrafficPolicy `transformation` and `rbac` reach for it; core Gateway API routing,
# listener and backend policy do not.
FROM_SOURCE=1
VERSIONS=(2.3.7 2.4.3)
declare -A SHA256=(
  [2.3.7]=331c3d571d7d0ca7d21f54175bb6b60e49c8cbe3246b9373ca76f21aa018dc2b
  [2.4.3]=ed7b4486cfc1f524f6c247152377b60b9c4e6fa6565570684861f24a77a99014
)
declare -A ENVOY_PKG=(
  [2.3.7]=envoy-1.37=1.37.1-r3
  [2.4.3]=envoy-1.38=1.38.1-r0
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g; s|__ENVOY_PKG__|${ENVOY_PKG[$1]}|g"; }
