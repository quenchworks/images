# Kopia (kopia/kopia, Apache-2.0): fast, encrypted, deduplicated backups to object storage or a
# filesystem, with a repository server and web UI that clients back up to. From the release tag
# via melange: a static CGO-free build with upstream's release ldflags; the web UI is the prebuilt
# htmluibuild Go module. The house golang.org/x floor (x/mod at the 0.41 it demands), gRPC 1.83.2 (what OTel 1.47 needs), go-jose and the OpenTelemetry 1.47
# train are raised only where below, and asserted in the shipped binary. LATEST-ONLY.
FROM_SOURCE=1
VERSIONS=(0.23.1)
declare -A SHA256=(
  [0.23.1]=0009ca0b2249a7042f779e722e87f8d8c12262117b308db522f7c8d46720a22e
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
