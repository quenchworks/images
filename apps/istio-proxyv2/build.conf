# istio-proxyv2: Istio's sidecar and gateway data plane, pilot-agent plus Istio's own
# Envoy fork. pilot-agent builds from the istio/istio source like istiod. Envoy is the
# Wolfi istio-envoy-<line> apk, which builds istio/proxy with Bazel at the exact commit
# istio/istio pins as PROXY_REPO_SHA in istio.deps. The recipe checks that pin against
# PROXY_SHA below, and the smoke test checks the shipped envoy reports the same commit.
#
# STATUS (2026-09-30): UNBLOCKED. The old hold said no melange path to Istio's Envoy
# existed; Wolfi now ships it. Lines ship only when the istio-envoy apk has reached the
# istiod patch: 1.31.1 matches; 1.30 (apk 1.30.4, istiod 1.30.5) and 1.29 (apk 1.29.3,
# istiod 1.29.8) wait for Wolfi. Add a line when its apk catches up.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(1.31.2)
# Source tarball sha256 from a download on 2026-10-19 (same value istiod records).
declare -A SHA256=(
  [1.31.2]=48758d42a47fe41b1a3ed3cbfda9390397428d0ce234f53d812f53b55124fc69
)
# PROXY_REPO_SHA from istio.deps at each tag (read 2026-10-19).
declare -A PROXY_SHA=(
  [1.31.2]=8c7d15f0482424f4eea86580c745976377633b34
)
render() { echo "s/__VER__/$1/g; s/__LINE__/${1%.*}/g; s|__SHA256__|${SHA256[$1]}|g; s|__PROXY_SHA__|${PROXY_SHA[$1]}|g"; }
