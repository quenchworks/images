# istio-proxyv2: Istio's sidecar/gateway data plane. Upstream ships this as
# pilot-agent (built from istio/istio, same as istiod -- that part IS a normal
# Go build) statically linked into a container ALONGSIDE Istio's own patched
# Envoy binary, built from the SEPARATE istio/proxy repo pinned in istio/istio's
# istio.deps (PROXY_REPO_SHA). That Envoy fork is not fetchable as a plain
# source tarball + `go build`: istio/proxy builds Envoy with Bazel + clang
# (envoyproxy/envoy upstream plus Istio's proxy_wasm/metadata-exchange/stats
# extensions), a multi-hour, multi-GB-RAM/disk C++ toolchain build that has no
# equivalent in melange's fetch-and-compile pipeline model, and cannot reuse the
# QuenchWorks `envoy` image (different extension set, different version lock --
# same conclusion the gateway/mesh wave plan already reached for this item:
# "the single most expensive item in the wave... we cannot reuse our stock
# envoy image").
#
# STATUS (2026-08-30, true today): BLOCKED=1, not attempted. This is not a
# CVE-residual block like gitness/coolify-helper -- there is no melange.yaml to
# gate in the first place, because there is no source-tarball-plus-go-build (or
# any Wolfi-native package build) path to Istio's patched Envoy. Building it
# would mean standing up a Bazel/clang toolchain and compiling Envoy from source
# via istio/proxy's own build system, which is a materially different (and far
# heavier) undertaking than every other app in this factory, on a box already
# memory-constrained by a concurrent build. Revisit only as a dedicated,
# separately-scoped spike (as the gateway/mesh wave plan already flags: "SPIKE
# (timeboxed) -- decide ... posture before spending N units", the same
# treatment given to cilium-agent's eBPF build).
# RE-MEASURED 2026-09-30: the reason above is stale. Wolfi now builds Istio's Envoy fork
# as istio-envoy-<line> apks (x86_64 and aarch64): 1.29.3-r1, 1.30.4-r0, 1.31.1-r0. istiod ships
# 1.29.8, 1.30.5 and 1.31.1, so only 1.31.1 has a matching Envoy today. Plan: pilot-agent from
# source as istiod does, Envoy from the istio-envoy apk, ship 1.31.1 first, and add a line
# when its istio-envoy apk reaches the istiod patch.
BLOCKED=1   # No melange-buildable path: requires Istio's own Bazel/clang Envoy build (istio/proxy), not a source-tarball Go build
FROM_SOURCE=1
VERSIONS=(1.28.10 1.29.7 1.30.4)
declare -A SHA256=(
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
