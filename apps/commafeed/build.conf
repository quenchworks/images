# commafeed: CommaFeed, a self-hosted RSS reader inspired by Google Reader, from the release's
# postgresql-jvm distribution (a Quarkus fast-jar) on a Wolfi openjdk-25 JRE (class file major 69).
#
# 0-CVE: the stock 7.5.3 distribution carries one finding, guava 33.6.0-jre (fixed in 33.7.2).
# melange.yaml swaps it under the same file name (the fast-jar index keys jars by path) and
# re-indexes quarkus-application.dat with apps/apache-polaris's qidx.
#
# NEWEST-ONLY: CommaFeed ships one line.
BLOCKED=0
FROM_SOURCE=0
VERSIONS=(7.5.3)
# sha256 of the release's postgresql-jvm zip, from a download
declare -A SHA256=(
  [7.5.3]=07f7dac98d032b237a4cea52fbca53d72d5dccf1aa2a2ebb3be617eba6f7772c
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
