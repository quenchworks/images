# grav: Grav (getgrav/grav, MIT), a flat-file CMS with a web admin, Markdown pages, themes and plugins (no
# database). Images issue #81.
#
# From the grav-admin release zip (vendor/ and the admin2, api, login, form, email and flex-objects plugins).
# composer raises symfony/http-client and symfony/yaml (root lock) and symfony/mime (email plugin lock) to
# their fixed patch releases, each asserted; Grav's vcs forks are cloned over https with git. php-8.5-fpm and
# QuenchWorks' nginx (upstream's deny rules) under supervisor. Plugins and themes stay in the image so updates
# reach them; user/accounts, config, data and pages plus assets, backup, cache, images, logs and tmp live on
# /var/lib/grav, seeded on the first start. GRAV_ADMIN_USER/_PASSWORD create the first admin once (login
# plugin new-user). The email plugin's tests (their own lock and vendor) are not shipped.
# LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(2.2.33)
declare -A SHA256=(
  [2.2.33]=59e6aa6e6099ca3d019c277f46a946a6e1ea879989089dfe44fe111763508f13
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
