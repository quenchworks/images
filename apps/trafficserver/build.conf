# trafficserver: Apache Traffic Server built from the release tarball with cmake on Wolfi.
# Sha256 below is of the downloads.apache.org tarball, checked against Apache's .sha512.
# LATEST LINE ONLY: 10.1 still requires PCRE1 (find_package(PCRE REQUIRED), pcre is EOL), and
# Wolfi ships only 9.2. 10.2 is PCRE2-only.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(10.2.1)
declare -A SHA256=(
  [10.2.1]=352957dc55cab2dd9accfa6b02f1c827109a6b6bb34607381743dbfb8de3b87f
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
