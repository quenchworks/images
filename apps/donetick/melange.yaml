# donetick from the release tag (Go, CGO off) with the React frontend from donetick/frontend v__FRONTEND__ embedded.
package:
  name: quench-donetick
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened donetick chore and task manager, built from source on Wolfi"
  copyright:
    - license: AGPL-3.0-only
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-1.27
      - nodejs-24
      - npm

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/donetick/donetick/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: mkdir -p frontend-src
  - uses: fetch
    with:
      uri: https://github.com/donetick/frontend/archive/refs/tags/v__FRONTEND__.tar.gz
      expected-sha256: __FRONTEND_SHA256__
      directory: frontend-src

  - name: Build the frontend (npm ci + vite, selfhosted mode)
    runs: |
      set -eu
      export HOME="$(mktemp -d)" npm_config_cache="$(mktemp -d)" npm_config_fetch_retries=5 npm_config_fetch_retry_maxtimeout=120000
      cd frontend-src
      # upstream's build-selfhosted script deletes the lockfile and forces x64 rollup; build from the lockfile instead
      # (it carries every platform's native rollup and swc), devDependencies included (vite is one)
      npm ci --include=dev --include=optional
      NODE_ENV=production npx vite build --mode selfhosted
      test -f dist/index.html
      cd ..
      rm -rf frontend/dist
      cp -r frontend-src/dist frontend/dist

  - name: Build donetick
    runs: |
      set -eu
      export CGO_ENABLED=0 GOFLAGS=-mod=mod GOTOOLCHAIN=local
      # 0-CVE FLOORS, not pins (docs/go-module-float.md): raise a module only where go.mod has it below the floor; a
      # module absent from the graph is skipped. otel moves as one train.
      FLOOR="github.com/jackc/pgx/v5@v5.9.2 github.com/ClickHouse/clickhouse-go/v2@v2.51.0 github.com/ClickHouse/ch-go@v0.75.0 google.golang.org/grpc@v1.83.2 github.com/klauspost/compress@v1.20.3 github.com/go-jose/go-jose/v4@v4.1.6 github.com/quic-go/quic-go@v0.59.1 go.opentelemetry.io/otel@v1.47.0 go.opentelemetry.io/otel/metric@v1.47.0 go.opentelemetry.io/otel/trace@v1.47.0 go.opentelemetry.io/otel/sdk@v1.47.0 go.opentelemetry.io/otel/sdk/metric@v1.47.0 golang.org/x/crypto@v0.58.1-0.20261009181718-2f1f834330b2 golang.org/x/net@v0.62.0 golang.org/x/text@v0.43.0 golang.org/x/sys@v0.49.0 golang.org/x/mod@v0.41.0 golang.org/x/oauth2@v0.36.0"
      # Go semver order (a release outranks its prereleases); busybox sort -V does not.
      vlt() { awk -v a="${1#v}" -v b="${2#v}" 'function pp(s,  p){sub(/\+.*/,"",s);p=index(s,"-");if(p){C=substr(s,1,p-1);P=substr(s,p+1)}else{C=s;P=""}} function cmp(x,y,  i,n,m,X,Y){n=split(x,X,".");m=split(y,Y,".");for(i=1;i<=n&&i<=m;i++){if(X[i]==Y[i])continue;if(X[i]~/^[0-9]+$/&&Y[i]~/^[0-9]+$/)return (X[i]+0<Y[i]+0)?-1:1;if(X[i]~/^[0-9]+$/)return -1;if(Y[i]~/^[0-9]+$/)return 1;return (X[i]<Y[i])?-1:1}return (n<m)?-1:(n>m)?1:0} BEGIN{pp(a);ca=C;pa=P;pp(b);cb=C;pb=P;c=cmp(ca,cb);if(c==0){if(pa==pb)c=0;else if(pa=="")c=1;else if(pb=="")c=-1;else c=cmp(pa,pb)}exit !(c<0)}'; }
      need=""
      for mv in $FLOOR; do
        have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${mv%@*}" 2>/dev/null)"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        vlt "$have" "${mv#*@}" && need="$need $mv"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || go get $need
      go mod tidy
      b="${{targets.destdir}}/usr/bin/donetick"
      go build -trimpath -buildvcs=false -ldflags "-s -w -X donetick.com/core/config.Version=${{package.version}} -X donetick.com/core/config.Commit=v${{package.version}}" -o "$b" .
      # every floored module that reached the binary is at or above its floor
      go version -m "$b" | awk '$1 == "dep" || $1 == "=>" { print $2, $3 }' > deps.txt
      for mv in $FLOOR; do
        have="$(awk -v m="${mv%@*}" '$1 == m { print $2 }' deps.txt | tail -n1)"
        [ -z "$have" ] || ! vlt "$have" "${mv#*@}" || { echo "float did not reach the binary: ${mv%@*} $have < ${mv#*@}"; exit 1; }
      done
      rm -f deps.txt

test:
  pipeline:
    - runs: test -x /usr/bin/donetick
