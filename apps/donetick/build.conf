# donetick: donetick (donetick/donetick, AGPL-3.0), a chore and task manager for households and teams: recurring
# schedules, assignees, points, labels and notifications. Images issue #89.
#
# Go backend from the release tag (gin, pure-Go SQLite or PostgreSQL, CGO off) with the house floors, and the React
# frontend (donetick/frontend, AGPL-3.0) built with npm ci + vite in the sandbox and embedded (frontend/dist).
# Upstream's release builds the frontend's default branch at release time; the recipe pins FRONTEND, the newest
# frontend tag before the backend release. LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(0.1.86)
declare -A SHA256=(
  [0.1.86]=8ef14672f2318dd4ceb8a9ddb557035863f9d4df5c2c0ba86ed6ebfd558f1c2d
)
FRONTEND=1.2.65
FRONTEND_SHA256=c7eea12d425abb8e51879a9a5c6be2ae2245369b05caad12036d493bc5791f9a
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g; s/__FRONTEND__/$FRONTEND/g; s/__FRONTEND_SHA256__/$FRONTEND_SHA256/g"; }
