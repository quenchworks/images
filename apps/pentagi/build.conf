# pentagi: PentAGI (vxcontrol/pentagi), autonomous AI agents for penetration testing. Images issue #132.
# LICENSE: the source is MIT; EULA.md (shipped in the image) limits use to lawful penetration testing and allows
# redistribution of the MIT source and derivatives. For authorized security testing only.
# From the release tag as upstream's Dockerfile builds it: the Vite frontend (pnpm) into /opt/pentagi/fe and the Go
# server plus its ctester/ftester/etester tools (CGO off). Upstream's entrypoint only makes a self-signed TLS pair and an
# Ollama key at start; this image runs the server directly, TLS comes from SERVER_SSL_KEY/CRT. Needs PostgreSQL with
# pgvector (DATABASE_URL) and a Docker API (DOCKER_HOST) for the agents' tool containers.
# LATEST-ONLY: one release line.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(2.2.0)
declare -A SHA256=(
  [2.2.0]=60155a1f9f307be4bd90979208b4278ce58a4045878e78af92eac3f7e54b8f5a
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
