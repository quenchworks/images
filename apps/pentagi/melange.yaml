# PentAGI from the release tag, laid out like upstream's image under /opt/pentagi.
package:
  name: quench-pentagi
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened PentAGI, built from source on Wolfi"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - go-1.26
      - nodejs-24
      - npm

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/vxcontrol/pentagi/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - name: Frontend (pnpm, as upstream's frontend-compiler stage)
    runs: |
      set -eu
      export HOME="$(mktemp -d)" npm_config_cache="$(mktemp -d)" CI=true NODE_OPTIONS=--max-old-space-size=4096
      pv="$(node -p 'require("./frontend/package.json").packageManager.split("@")[1]')"
      npm install -g --prefix "$HOME/.npm-global" "pnpm@$pv"
      export PATH="$HOME/.npm-global/bin:$PATH"
      cd frontend
      pnpm install --frozen-lockfile
      pnpm run build -- --mode production --minify esbuild --outDir dist --emptyOutDir --sourcemap false --target es2020
      test -f dist/index.html

  - name: Server and tools (Go, CGO off) with the house floors
    runs: |
      set -eu
      export CGO_ENABLED=0 GOTOOLCHAIN=local GOFLAGS=-mod=mod
      cd backend
      # floors, raised only when below (a bare go get downgrades once upstream passes it)
      FLOOR="golang.org/x/crypto@v0.58.1-0.20261009181718-2f1f834330b2 golang.org/x/net@v0.62.0 golang.org/x/text@v0.43.0 golang.org/x/sys@v0.49.0"
      need=""
      for f in $FLOOR; do
        have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${f%@*}")"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        [ "$(printf '%s\n%s\n' "$have" "${f#*@}" | sort -V | head -1)" = "${f#*@}" ] || need="$need $f"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || go get $need
      go mod tidy
      bin="${{targets.destdir}}/opt/pentagi/bin"
      install -d "$bin"
      for t in pentagi ctester ftester etester; do
        go build -trimpath -ldflags "-s -w -X pentagi/pkg/version.PackageName=$t -X pentagi/pkg/version.PackageVer=${{package.version}} -X pentagi/pkg/version.Edition=ce" \
          -o "$bin/$t" "./cmd/$t"
      done
      go version -m "$bin/pentagi" | grep -q "PackageVer=${{package.version}}"

  - name: Lay out /opt/pentagi
    runs: |
      set -eu
      d="${{targets.destdir}}/opt/pentagi"
      install -d "$d/conf" "$d/licenses" "${{targets.destdir}}/var/lib/pentagi"
      cp -a frontend/dist "$d/fe"
      cp examples/configs/*.provider.yml "$d/conf/"
      cp LICENSE EULA.md NOTICE "$d/licenses/"
      # runtime state (DATA_DIR) on the volume
      ln -s /var/lib/pentagi "$d/data"

test:
  pipeline:
    - runs: |
        test -x /opt/pentagi/bin/pentagi
        test -f /opt/pentagi/fe/index.html
