# knative-operator runtime: the binary is the entrypoint; flags configure it. Nonroot 1001.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-knative-operator@local

accounts:
  groups:
    - groupname: knative-operator
      gid: 1001
  users:
    - username: knative-operator
      uid: 1001
      gid: 1001
  run-as: 1001

environment:
  # kodata (ko would use /var/run/ko); the operator reads its release manifests from here
  KO_DATA_PATH: /usr/share/knative-operator/kodata

entrypoint:
  command: /operator

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-knative-operator"
  org.opencontainers.image.licenses: "Apache-2.0"
  org.opencontainers.image.version: "__VER__"
