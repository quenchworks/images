# Knative Operator (installs and upgrades Knative Serving and Eventing from KnativeServing and
# KnativeEventing resources), from knative/operator (Apache-2.0). Upstream builds with ko; this
# recipe builds the operator and webhook binaries (/operator, /webhook) with the house golang.org/x
# floor and ships the operator's kodata (the Serving, Eventing, ingress and source release manifests
# it installs, 18 MB) at /usr/share/knative-operator/kodata with KO_DATA_PATH set (melange's tempdir lint rejects ko's /var/run/ko). The manifests reference
# upstream Knative images; only the operator image is ours. LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(1.24.1)
declare -A SHA256=(
  [1.24.1]=17203238b4c09ada133a7b9a682aa135e6af58f81bdfc0cda1fbb196564b392e
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
