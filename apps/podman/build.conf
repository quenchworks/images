# podman: Podman, the daemonless container engine, built from source on Wolfi and
# run rootless as uid 1001. Image only, no chart.
# Wolfi's podman 6.0.0-r4 apk carries grpc, x/crypto, x/mod, x/text, go-archive
# and Go 1.26.4 stdlib findings, so the binaries are built here with the 0-CVE
# module float instead.
# Lines: 6.1 and 6.0. The 5.8 line is HELD: the moby/buildkit v0.31.1 floor
# raises cyphar/filepath-securejoin to v0.6.0, which removed OpenatInRoot, and
# 5.8.7's go.podman.io/storage v1.62.1 still calls it.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(6.0.2 6.1.4)
declare -A SHA=(
  [6.0.2]=0895a541aeb7aa8e99133ed2b328c1bb40fd397b7c3b01e083396c90e8628756
  [6.1.4]=200fd9b4b6d820cae24fc99d8e290ec945512365cf3cda8283b3905c0c284ea8
)
render() { echo "s/__VER__/$1/g; s/__SHA256__/${SHA[$1]}/g"; }
