# restic (restic/restic, BSD-2-Clause): fast, encrypted, deduplicating backups to local disk, SFTP,
# S3-compatible stores, Azure, GCS, B2 and the restic REST server. Image only, no chart (a CLI; the
# rest-server chart's gate uses it as its client). Images issue #48.
#
# Pure Go (CGO off) with upstream's -X main.version. Floats: the house golang.org/x floor, grpc 1.83.2,
# klauspost/compress 1.18.7, go-jose 4.1.6 and the otel 1.47 train (0.19.1 ships 1.43 through the GCS client).
FROM_SOURCE=1
VERSIONS=(0.20.0)
declare -A SHA256=(
  [0.20.0]=7def5bbe05e62640f7b030b865b6f304701fd876f7836f5a6a603b56e1f4e30a
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
