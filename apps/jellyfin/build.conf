# STATUS: BLOCKED 2026-09-29 on SkiaSharp's prebuilt native library. Everything gates
# clean (0 fixable CVEs, and the boot test passes: health, version 12.1.0, first-run
# wizard, login, ffmpeg), but /usr/lib/jellyfin/libSkiaSharp.so is a 10 MB binary from
# the SkiaSharp NuGet package, built on Debian 10 with clang 13, that statically links
# its own image libraries. It embeds libjpeg-turbo 2.1.5.1 (libjpeg-turbo has shipped
# security fixes since, among them CVE-2026-75466 in 3.2.1) and libpng 1.6.58, plus
# freetype, harfbuzz, webp and zlib at versions it does not print. The scanner cannot
# see any of it, and this catalog does not ship code that hides from its own gate
# (the same class as the wheel-bundled OpenSSL found on 2026-09-28). Unblock by
# building Skia against the system libraries, or by an upstream Jellyfin that does.
# Wolfi's jellyfin apk carries the same NuGet blob.
# RE-MEASURED 2026-09-30: unchanged. Wolfi has no Skia package and jellyfin is still
# 12.1-r0; upstream's latest is v12.1.
# jellyfin: Jellyfin (GPL-2.0), the self-hosted media server, from Wolfi's pinned jellyfin
# and jellyfin-web apks (FROM_SOURCE=0), which build it from source on Wolfi's .NET runtime
# and system ffmpeg. Upstream ships the same version (12.1, 2026-09-15); the checker
# tracks Wolfi. NEWEST LINE ONLY: Wolfi's index still lists 10.11.x revisions, and 12.x
# is the line upstream maintains.
#
# Transcoding uses Wolfi's ffmpeg (software encoders); hardware acceleration needs the
# GPU device and drivers on the node and is not part of this image.
BLOCKED=1
FROM_SOURCE=0
VERSIONS=(12.1)
declare -A PIN=( [12.1]=12.1-r0 )
render() { local v=$1; echo "s/__VER__/$v/g; s/__REL__/${PIN[$v]}/g"; }
