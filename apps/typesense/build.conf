# typesense: NOT built from source. Typesense's from-source build is a very large
# C++ tree (Bazel, LLVM/clang, ~tens of GB) — infeasible on a 2-core/7GB GitHub
# runner. Instead we ship Typesense's OWN official precompiled per-arch server
# binary (the same upstream-artifact pattern clickhouse/kafka/opensearch use), then
# harden it on a minimal apko base and gate it 0-CVE with Trivy. Clean-room-safe:
# it is upstream's published artifact, not a Bitnami chart, and the scan applies.
#
# Latest 3 stable major lines, newest patch each. Per-arch tarballs live at
# https://dl.typesense.org/releases/<ver>/typesense-server-<ver>-linux-<arch>.tar.gz
# (amd64/arm64), each with its own sha256:
#   __VER__     = version
#   __SHA_AMD__ = amd64 tarball sha256   __SHA_ARM__ = arm64 tarball sha256
FROM_SOURCE=1
VERSIONS=(28.0 29.1 30.2)
declare -A SHA_AMD=(
  [28.0]=ec848ac8d451e48ff694e69082dde0d4ad14a81694f9f44cb948a904964a3eb1
  [29.1]=26ae48efca4d34929816d93eac16ceb7f26a03423e30c2d5ef916ca6abc5f115
  [30.2]=cd791605e7c6cc7be457794f534cd4b9f9d361781adb10e40020efc22840ebc3
)
declare -A SHA_ARM=(
  [28.0]=f8056fe37182aec1ab0cbffc0069c753cd40a8485d7d10e05f9aeb539a39618f
  [29.1]=0391e6aca678590eb0879b8b05c9ecd9bb18c8a205f1e01d662eafdbd5d48175
  [30.2]=a9b9d6e2927c863900306290e8532c17f66bdff34ef2ad043b24ed4ccec8a6bc
)
render() {
  echo "s/__VER__/$1/g; s|__SHA_AMD__|${SHA_AMD[$1]}|g; s|__SHA_ARM__|${SHA_ARM[$1]}|g"
}
