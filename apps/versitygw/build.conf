# versitygw (Versity S3 Gateway): from-source via melange (Go build from the git tag tarball).
# Newest patch of the last 3 minor lines. Single static Go binary, no CGO; the web UI is
# static files embedded with go:embed (no Node build). Version stamped via -X main.Version.
FROM_SOURCE=1
VERSIONS=(1.6.0 1.7.0 1.8.0)
declare -A SHA256=(
  [1.6.0]=6621fe4c1b3a644ac37ef923078be570aa71292396b879db67549b29ed4d0616
  [1.7.0]=7e63315ced171ced2dc32482e8c2916121bdf77a63c0ef3e3124d6b5e1b2201a
  [1.8.0]=0ac3f5f81bcf8833a9d5c4bc134721fa95d7f062bd48eb1ed18bd5edd738e78b
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
