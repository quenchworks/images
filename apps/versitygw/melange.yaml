# Builds the Versity S3 Gateway from source onto Wolfi. Single static Go binary, no CGO.
# The main package is cmd/versitygw; Makefile stamps main.Version/Build/BuildTime with -X.
# The web UI is committed static files embedded with go:embed, so no Node build.
package:
  name: quench-versitygw
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Versity S3 Gateway, built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/versity/versitygw/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      set -eu
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      export GOTOOLCHAIN=local
      # 0-CVE FLOORS, not pins (docs/go-module-float.md): raise a module only where go.mod
      # has it below the floor; a module absent from the graph is skipped. 1.8.0 needs only
      # x/crypto (0.55.0 to 0.56.0); 1.6/1.7 also raise amqp091-go 1.12.0 (five DoS CVEs). go.mod has no replaces.
      FLOOR="golang.org/x/crypto@v0.56.0 golang.org/x/net@v0.58.0 golang.org/x/text@v0.41.0 golang.org/x/sys@v0.47.0 golang.org/x/oauth2@v0.36.0 google.golang.org/grpc@v1.83.2 github.com/rabbitmq/amqp091-go@v1.13.0"
      need=""
      for mv in $FLOOR; do
        have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${mv%@*}" 2>/dev/null)"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        [ "$(printf '%s\n%s\n' "$have" "${mv#*@}" | sort -V | head -1)" = "${mv#*@}" ] || need="$need $mv"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || go get $need
      go mod tidy
      go build -trimpath \
        -ldflags "-s -w -X main.Version=v${{package.version}} -X main.Build=v${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/versitygw" ./cmd/versitygw
      mkdir -p "${{targets.destdir}}/data"
