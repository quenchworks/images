# Builds Centrifugo (centrifugal) from source onto Wolfi. Single static Go binary,
# no CGO (matches upstream .goreleaser.yml CGO_ENABLED=0). The version is stamped
# via -X internal/build.Version so `centrifugo version` reports the real release.
# Output is a signed APK in Quenchworks' own repo. No upstream distro binaries.
# Image-only (a server, no chart). Upstream tags carry a "v" prefix; goreleaser
# stamps the bare version (module path is .../centrifugo/v6). go.mod requires
# Go 1.26, so build with the go-1.26 toolchain explicitly.
package:
  name: quench-centrifugo
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Centrifugo (real-time messaging server), built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-1.26

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/centrifugal/centrifugo/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      # 0-CVE gate: 6.9.1 already requires webtransport-go v0.11.1 (CVE-2026-57497),
      # x/net v0.57.0, x/text v0.40.0, x/crypto v0.54.0 and x/sys v0.47.0, so the float
      # set sits at those versions -- floating LOWER would downgrade the module graph.
      # Only grpc actually moves (v1.82.0 -> v1.82.1).
      # FLOORS, not pins (docs/go-module-float.md): raise only where go.mod is below. The bare
      # `go get` here downgraded centrifugo's own core library (centrifuge) and nats.go along
      # with grpc and x/* (2026-10-05 scan).
      FLOOR="golang.org/x/net@v0.58.0 golang.org/x/sys@v0.47.0 google.golang.org/grpc@v1.83.2 golang.org/x/crypto@v0.56.0 golang.org/x/text@v0.41.0"
      # Go semver order (a release outranks its prereleases); busybox sort -V does not.
      vlt() { awk -v a="${1#v}" -v b="${2#v}" 'function pp(s,  p){sub(/\+.*/,"",s);p=index(s,"-");if(p){C=substr(s,1,p-1);P=substr(s,p+1)}else{C=s;P=""}} function cmp(x,y,  i,n,m,X,Y){n=split(x,X,".");m=split(y,Y,".");for(i=1;i<=n&&i<=m;i++){if(X[i]==Y[i])continue;if(X[i]~/^[0-9]+$/&&Y[i]~/^[0-9]+$/)return (X[i]+0<Y[i]+0)?-1:1;if(X[i]~/^[0-9]+$/)return -1;if(Y[i]~/^[0-9]+$/)return 1;return (X[i]<Y[i])?-1:1}return (n<m)?-1:(n>m)?1:0} BEGIN{pp(a);ca=C;pa=P;pp(b);cb=C;pb=P;c=cmp(ca,cb);if(c==0){if(pa==pb)c=0;else if(pa=="")c=1;else if(pb=="")c=-1;else c=cmp(pa,pb)}exit !(c<0)}'; }
      need=""
      for mv in $FLOOR; do
        have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${mv%@*}" 2>/dev/null)"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        vlt "$have" "${mv#*@}" && need="$need $mv"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || go get $need
      go mod tidy
      go build -trimpath \
        -ldflags "-s -w -X github.com/centrifugal/centrifugo/v6/internal/build.Version=${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/centrifugo" .
