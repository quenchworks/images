# Assembles the Centrifugo runtime image. Minimal, nonroot, multi-arch, SBOM by
# apko. Centrifugo is a server + CLI: the entrypoint is the binary, so
# `docker run ...centrifugo <args>` works (e.g. `version`, `genconfig`, and by
# default `centrifugo` starts the server). ca-certificates-bundle is included so
# it can reach proxy/webhook backends and brokers over TLS.
#
# Config comes from a mounted config.json/.yaml/.toml (CENTRIFUGO_CONFIG /
# --config) or CENTRIFUGO_* env vars -- nothing writable is baked in, so this
# runs fine on a read-only rootfs. Default HTTP port is 8000 (API, WebSocket,
# /health, /metrics); it binds 0.0.0.0:8000 which the nonroot uid can use since
# 8000 is unprivileged. Advisory only -- the deployment sets the real listener.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-centrifugo@local

accounts:
  groups:
    - groupname: centrifugo
      gid: 1001
  users:
    - username: centrifugo
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/bin/centrifugo

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-centrifugo"
  org.opencontainers.image.licenses: "Apache-2.0"
