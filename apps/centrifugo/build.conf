# Centrifugo (centrifugal): from-source via melange (Go build from the git tag
# tarball). Image-only (a real-time messaging server, no chart). Latest patch of
# the last 3 minor lines (6.6, 6.7, 6.8). Single static Go binary, CGO disabled.
# Version is stamped via -X on internal/build.Version (per upstream
# .goreleaser.yml, no "v" prefix). Apache-2.0.
FROM_SOURCE=1
VERSIONS=(6.6.2 6.7.2 6.8.4)
declare -A SHA256=(
  [6.6.2]=72ba1babd32d2a57d477eee9b6a0c7e5c81e014066d5599cc39473f3ef78d427
  [6.7.2]=c7f3d75b1578501181de5955f78a5e8abf56ce4ac787444e0dcd325016da9375
  [6.8.4]=3690633e8c59c9cab75681ce03bf42795423623b65658cf6f34674207145b0ec
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
