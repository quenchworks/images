# Centrifugo (centrifugal): from-source via melange (Go build from the git tag
# tarball). Image-only (a real-time messaging server, no chart). Latest patch of
# the last 3 minor lines (6.6, 6.7, 6.8). Single static Go binary, CGO disabled.
# Version is stamped via -X on internal/build.Version (per upstream
# .goreleaser.yml, no "v" prefix). Apache-2.0.
FROM_SOURCE=1
# 6.9.1 (2026-07-26): clears CVE-2026-57497 -- this release's go.mod requires
# quic-go/webtransport-go v0.11.1 (the fixed release; 6.8.4 was on v0.11.0). It also
# already carries x/net v0.57.0, x/text v0.40.0, x/crypto v0.54.0, x/sys v0.47.0, so
# the melange float set was raised to match (see melange.yaml).
VERSIONS=(6.9.5)
declare -A SHA256=(
  [6.9.5]=2a10b4968b807953cb891e32f01fe57932258b2c07d379debe62982576909c54
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
