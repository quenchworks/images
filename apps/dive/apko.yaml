# Assembles the dive image: nonroot uid 1001, entrypoint dive.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-dive@local

accounts:
  groups:
    - groupname: dive
      gid: 1001
  users:
    - username: dive
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/bin/dive

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-dive"
  org.opencontainers.image.licenses: "MIT"
