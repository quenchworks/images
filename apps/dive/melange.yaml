# Builds dive from the release tag tarball, as upstream's .goreleaser.yaml.
package:
  name: quench-dive
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened dive, built from source"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - go

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/wagoodman/dive/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      set -eu
      export CGO_ENABLED=0 GOFLAGS=-mod=mod GOTOOLCHAIN=local
      # 0-CVE float (docs/go-module-float.md), a floor: raise a module only where the
      # line links an older one.
      # docker/cli 29.2.0 fixes CVE-2025-15558 and needs docker/docker 28.5.2 (the newest
      # +incompatible release) for the go-connections it brings; vex.openvex.json covers
      # docker/docker's daemon-only CVE-2026-33997.
      for want in golang.org/x/crypto@v0.56.0 golang.org/x/net@v0.58.0 golang.org/x/text@v0.41.0 \
                  github.com/docker/cli@v29.2.0+incompatible github.com/docker/docker@v28.5.2+incompatible \
                  github.com/go-viper/mapstructure/v2@v2.4.0; do
        m="${want%@*}"; w="${want#*@}"
        have="$(go list -m -f '{{.Version}}' "$m" 2>/dev/null || true)"
        [ -n "$have" ] || continue
        [ "$(printf '%s\n%s\n' "$have" "$w" | sort -V | head -1)" = "$w" ] || go get "$want"
      done
      go mod tidy
      go build -trimpath \
        -ldflags "-s -w -X main.version=${{package.version}} -X main.commit=v${{package.version}} -X main.buildTime=1970-01-01T00:00:00Z" \
        -o "${{targets.destdir}}/usr/bin/dive" .
      "${{targets.destdir}}/usr/bin/dive" --version | grep -qx "dive ${{package.version}}"
      bad="$(go version -m "${{targets.destdir}}/usr/bin/dive" | awk '$1 == "dep" && ($2 == "golang.org/x/crypto" && $3 < "v0.56.0" || $2 == "golang.org/x/net" && $3 < "v0.58.0" || $2 == "golang.org/x/text" && $3 < "v0.41.0") { print $2, $3 }')"
      [ -z "$bad" ] || { echo "float did not reach the binary: $bad"; exit 1; }
      # the VEX statement holds only while no daemon or plugin-manager package is linked
      if go list -deps . | grep -E '^github.com/docker/docker/(daemon|plugin|api/server)'; then
        echo "dive now links Docker daemon code: re-check vex.openvex.json"; exit 1
      fi

test:
  pipeline:
    - runs: |
        test -x /usr/bin/dive
