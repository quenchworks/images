# dive (wagoodman/dive): explore a container image layer by layer and measure wasted
# space. From source via melange, static Go (CGO off), version stamped as upstream's
# .goreleaser.yaml (-X main.version). Image only, no chart: run it against a saved
# image (`dive --source docker-archive image.tar`) or a mounted Docker socket.
# NEWEST LINE ONLY (measured 2026-10-01): 0.11.0 cannot read the image archives current
# Docker writes ("could not find image config"), and 0.12.0's floated module graph hits
# an ambiguous genproto import. Upstream maintains only 0.13.
FROM_SOURCE=1
VERSIONS=(0.13.1)
declare -A SHA256=(
  [0.13.1]=2a9666e9c3fddd5e2e5bad81dccda520b8102e7cea34e2888f264b4eb0506852
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
