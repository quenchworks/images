# Dragonfly Operator (Dragonfly instances with replication, snapshots and TLS from Dragonfly resources),
# from dragonflydb/dragonfly-operator (Apache-2.0). From the release tag via melange: one static Go
# binary (./cmd) and the house golang.org/x floor. Upstream's Version is a const ("source"), so the
# binary carries no version; the image label does.
# LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(1.8.0)
declare -A SHA256=(
  [1.8.0]=c5cfdae19eb1c4f45843570e752ea286e529fc831340ac58f4ce8d382db7cd98
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
