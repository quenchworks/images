# cephcsi: the Ceph CSI driver (Apache-2.0) for RBD, CephFS and NFS volumes, built from
# source as upstream's Makefile does (CGO against Ceph's librados/librbd/libcephfs from
# Wolfi's ceph-20-dev, tags tentacle,ceph_preview), with module floors. Runtime: the
# ceph-20 client tools and libraries, ceph-fuse, mount/mkfs tools, cryptsetup, nfs-utils,
# like upstream's image. Root (CSI node plugins mount on the host). Newest only. Rook 1.21
# deploys it through the ceph-csi-operator.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(3.18.2)
declare -A SHA256=(
  [3.18.2]=66956ce93b8bb545f9a4f236febaf6127a69236362cb5081bedeb14478460e5f
)
CEPH=20.2.4-r6
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g; s/__CEPH__/$CEPH/g"; }
