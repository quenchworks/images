# Builds the cephcsi binary from source with CGO against Wolfi's Ceph 20 libraries.
package:
  name: quench-cephcsi
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Ceph CSI driver, built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ceph-20-librados=__CEPH__
      - ceph-20-librbd=__CEPH__
      - ceph-20-libcephfs=__CEPH__

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-1.26
      - ceph-20-dev=__CEPH__

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/ceph/ceph-csi/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      set -eu
      # -mod=mod: the floor pass edits go.mod, so the vendor/ tree upstream builds from is
      # bypassed; the module cache supplies the same sources at the raised versions.
      export CGO_ENABLED=1 GOFLAGS=-mod=mod GOTOOLCHAIN=local
      # FLOORS, not pins: raise a module only where go.mod has it below the floor.
      FLOOR="golang.org/x/crypto@v0.56.0 golang.org/x/net@v0.58.0 golang.org/x/text@v0.41.0 golang.org/x/mod@v0.40.0 google.golang.org/grpc@v1.83.2"
      # Go semver order (a release outranks its prereleases); busybox sort -V does not.
      vlt() { awk -v a="${1#v}" -v b="${2#v}" 'function pp(s,  p){sub(/\+.*/,"",s);p=index(s,"-");if(p){C=substr(s,1,p-1);P=substr(s,p+1)}else{C=s;P=""}} function cmp(x,y,  i,n,m,X,Y){n=split(x,X,".");m=split(y,Y,".");for(i=1;i<=n&&i<=m;i++){if(X[i]==Y[i])continue;if(X[i]~/^[0-9]+$/&&Y[i]~/^[0-9]+$/)return (X[i]+0<Y[i]+0)?-1:1;if(X[i]~/^[0-9]+$/)return -1;if(Y[i]~/^[0-9]+$/)return 1;return (X[i]<Y[i])?-1:1}return (n<m)?-1:(n>m)?1:0} BEGIN{pp(a);ca=C;pa=P;pp(b);cb=C;pb=P;c=cmp(ca,cb);if(c==0){if(pa==pb)c=0;else if(pa=="")c=1;else if(pb=="")c=-1;else c=cmp(pa,pb)}exit !(c<0)}'; }
      need=""
      for mv in $FLOOR; do
        have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${mv%@*}")"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        vlt "$have" "${mv#*@}" && need="$need $mv"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || go get $need
      go mod tidy
      go build -trimpath -tags tentacle,ceph_preview \
        -ldflags "-s -w -X github.com/ceph/ceph-csi/internal/util.DriverVersion=v${{package.version}}" \
        -o "${{targets.destdir}}/usr/local/bin/cephcsi" ./cmd/

test:
  pipeline:
    - runs: |
        /usr/local/bin/cephcsi --version
