# kubectl: Wolfi apk (FROM_SOURCE=0, apko-only, 0-CVE). A hardened CI/tooling image
# (the alpine/k8s use case): kubectl plus helm, kustomize, jq, and a busybox shell.
# IMAGE-ONLY -- no Helm chart. apko pulls the versioned `kubectl-<minor>` apk from
# Wolfi (binary installs as /usr/bin/kubectl-<minor>; we symlink it to /usr/bin/kubectl).
# The 1.35 line is dropped: its Go-stdlib CVE rebuild is not yet published in Wolfi.
FROM_SOURCE=0
# CVE 2026-08-20: both lines moved forward a PATCH, not just a revision, because the
# earlier residual was never Wolfi-gated -- it was us pinning behind Wolfi.
#   1.34.10-r2 -> 1.34.11-r2   (stdlib 1.26.5 -> 1.26.6, x/text 0.38.0 -> 0.41.0)
#   1.36.3-r1  -> 1.36.4-r2    (same)
# The previous note claimed "1.36.3-r1 is already the newest apk". That was true when it
# was written and quietly stopped being true, which is the whole failure mode of this
# campaign: a pinned repackage does not drift on its own, so it reads as "blocked upstream"
# when it is actually just stale. Re-check `apk policy` before recording a Wolfi gate.
#
# CVE 2026-09-14: same drift, again -- r2 sat unrebuilt while Wolfi shipped six more
# revisions of each line. Verified against the live x86_64 AND aarch64 APKINDEX today:
#   1.34.11-r2 -> 1.34.11-r8   (clears CVE-2026-56854/r3, 84304/r6, 56855+78662/r7, 84445/r8)
#   1.36.4-r2  -> 1.36.4-r8    (same four CVEs, same revision ladder)
# Both are the newest revision of their patch line on both arches; no newer 1.34.x/1.36.x
# patch exists to jump to instead. The glibc-2.44/libcrypt1/ld-linux family (r1->r6) and
# helm (bare dep, resolves to helm-4 4.3.0-r0 with golang.org/x/crypto v0.56.0 verified via
# `go version -m` on the downloaded apk) need no pin change here -- unpinned, a rebuild
# alone picks up Wolfi's current builds. NOTE (not acted on, out of this fix's scope):
# kubectl-1.35 now exists in Wolfi (up to 1.35.4-r1) -- the "1.35 dropped, rebuild not yet
# published" comment above is stale; adding a third tracked minor is a catalog decision,
# not a CVE fix, so left alone.
#
# 2026-09-18: added the new 1.37 line (1.37.0-r0, clean on both arches) and kept
# 1.34. 1.35 was tried again and still cannot ship: Wolfi's kubectl-1.35 is stuck
# at 1.35.4-r1 and its own apk carries 29 fixable findings in usr/bin/kubectl-1.35
# (8 MEDIUM, 21 HIGH), so the image totals 44. That is a Wolfi rebuild that has not
# happened, not a pin we chose, and it is why the line stays skipped. Re-try when
# kubectl-1.35 gets a revision past r1. Every pin below is the newest revision of
# its line on BOTH x86_64 and aarch64, read from the live APKINDEX.
# CVE 2026-09-20: CVE-2026-81870 (otel-go, LOW) landed on all three pinned apks.
# Measured against Wolfi's own APKINDEX on BOTH arches, not against Trivy's
# "fixed in" column alone:
#   kubectl-1.34  r8 -> 1.34.11-r9  EXISTS, and r9 is what Trivy names. Bumped.
#   kubectl-1.37  r0 -> 1.37.0-r1   EXISTS, and r1 is what Trivy names. Bumped.
#   kubectl-1.36  Trivy names 1.36.4-r10. Wolfi's newest kubectl-1.36 is r8 on
#                 both arches, so the named fix DOES NOT EXIST yet -- there is
#                 nothing to bump to. The 1.36 line is dropped from VERSIONS
#                 rather than pinned to a revision that cannot pass the gate,
#                 because leaving it in fails the whole matrix and publishes
#                 NOTHING, including the two lines that are now clean.
# RE-ADD 1.36.4 (with [1.36.4]=1.36.4-rN) once Wolfi ships kubectl-1.36 at r10 or
# later; check with the APKINDEX, not the advisory, since a named fix version can
# be amended away. The already-published 1.36.4 image tag is untouched by this.
VERSIONS=(1.34.11 1.37.0)
# test.sh takes its extra args from build-kubectl.yml, which passes "3.13" rather
# than the version. Mirrored here so the local gate matches CI.
boot_args() { echo "3.13"; }
declare -A PIN=( [1.34.11]=1.34.11-r9 [1.37.0]=1.37.0-r1 )
# 1.36.3 -> package kubectl-1.36=1.36.3-r1, binary /usr/bin/kubectl-1.36
render() { local v=$1; echo "s|__PKG__|kubectl-${v%.*}=${PIN[$v]}|g; s|__KBIN__|kubectl-${v%.*}|g"; }
