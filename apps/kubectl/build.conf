# kubectl: Wolfi apk (FROM_SOURCE=0, apko-only, 0-CVE). A hardened CI/tooling image
# (the alpine/k8s use case): kubectl plus helm, kustomize, jq, and a busybox shell.
# IMAGE-ONLY -- no Helm chart. Latest 3 Kubernetes minor lines; apko pulls the
# versioned `kubectl-<minor>` apk straight from Wolfi. Tag = full X.Y.Z.
FROM_SOURCE=0
VERSIONS=(1.34.9 1.35.4 1.36.2)
declare -A PIN=( [1.34.9]=1.34.9-r0 [1.35.4]=1.35.4-r1 [1.36.2]=1.36.2-r0 )
# version 1.34.9 -> Wolfi package kubectl-1.34=1.34.9-r0
render() { local v=$1; echo "s|__PKG__|kubectl-${v%.*}=${PIN[$v]}|g"; }
