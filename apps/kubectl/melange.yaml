# helm for the kubectl image, built from the release tag instead of taken from Wolfi:
# helm-4 4.3.1-r1 links golang.org/x/crypto v0.58.0 (GO-2026-5932; helm's provenance code
# uses x/crypto/openpgp, so no VEX) and golang.org/x/net v0.60.0. Same version, same ldflags
# as upstream's Makefile, with x/crypto at the fix commit and x/net 0.62.0.
package:
  name: quench-helm
  version: 4.3.1
  epoch: 0
  description: "helm, built from source with the x/crypto and x/net fixes"
  copyright:
    - license: Apache-2.0

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/helm/helm/archive/refs/tags/v4.3.1.tar.gz
      expected-sha256: e7b803b6a248c18aea067dbccacaf651c29946db75d05fb23f318ff2f15961c6
  - runs: |
      set -eu
      export CGO_ENABLED=0 GOTOOLCHAIN=local GOFLAGS=-mod=mod
      go get golang.org/x/crypto@v0.58.1-0.20261009181718-2f1f834330b2 golang.org/x/net@v0.62.0
      # CVE-2026-128085 (otel 1.47.0): move every otel v1 module the build uses, as one family
      otel=$(go list -mod=mod -m -e -f '{{.Path}} {{.Version}}' all | awk '($1 ~ /^go\.opentelemetry\.io\/otel(\/|$)/ || $1 ~ /^go\.opentelemetry\.io\/contrib\/bridges\/otel(zap|logrus|slog)$/) && $1 !~ /\/exporters\/jaeger$/ { if ($1 ~ /\/contrib\/bridges\//) print $1"@v0.21.0"; else if ($1 ~ /\/exporters\/(otlp\/otlplog\/|stdout\/stdoutlog$)/) print $1"@v0.23.0"; else if ($1 ~ /\/exporters\/prometheus$/) print $1"@v0.69.0"; else if ($2 ~ /^v1\./ || $1 ~ /\/(sdk\/)?log$/) print $1"@v1.47.0" }')
      [ -z "$otel" ] || go get $otel
      go mod tidy
      go build -trimpath \
        -ldflags "-s -w -X helm.sh/helm/v4/internal/version.version=v4.3.1 -X helm.sh/helm/v4/internal/version.gitCommit=c0d08d0d6d9424d4a14febb5e8a3e51b0dd00dff -X helm.sh/helm/v4/internal/version.gitTreeState=clean" \
        -o "${{targets.destdir}}/usr/bin/helm" ./cmd/helm
      go version -m "${{targets.destdir}}/usr/bin/helm" | grep -q 'golang.org/x/crypto[[:space:]]*v0.58.1-0.20261009181718-2f1f834330b2'
      go version -m "${{targets.destdir}}/usr/bin/helm" | grep -q 'golang.org/x/net[[:space:]]*v0.62.0'
      "${{targets.destdir}}/usr/bin/helm" version --short | grep -q '^v4.3.1+gc0d08d0'

test:
  pipeline:
    - runs: helm version --short
