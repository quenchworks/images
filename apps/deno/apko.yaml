# Assembles a hardened Deno runtime/base image directly from Wolfi's own `deno`
# package. No Dockerfile, NO melange build -- apko pulls the prebuilt `deno`
# package straight from the Wolfi `os` repository. Deno is a large Rust/V8
# build, but Wolfi ALREADY packages it (0-CVE), so this is a pure
# package-assembly -- we never compile Deno from source.
#
# IMAGE-ONLY -- no Helm chart. This is a LANGUAGE/BASE image: the 0-CVE, signed,
# nonroot, multi-arch answer to `denoland/deno`. Developers `FROM` it (like
# Chainguard's language images) or `docker run <img> run script.ts` directly.
#
# VERSIONING: Wolfi ships a SINGLE floating `deno` package (not per-minor
# packages), so there is nothing to fan a matrix over. We publish ONE tag -- the
# `2` major line -- tracking whatever 2.x Wolfi has packaged; the DAILY rebuild
# keeps it current and re-runs the 0-CVE gate.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - deno                         # prebuilt Deno runtime from Wolfi (0-CVE)

accounts:
  groups:
    - groupname: nonroot
      gid: 1001
  users:
    - username: nonroot
      uid: 1001
      gid: 1001
  run-as: 1001

# Deno as the entrypoint: `docker run <img> --version`, `<img> run script.ts`,
# `<img> eval '...'`, etc.
entrypoint:
  command: /usr/bin/deno

# Deno needs a WRITABLE cache (DENO_DIR) for compiled modules / remote deps. On
# a read-only rootfs this MUST live under a writable mount, so we point it (and
# HOME) at the tmpfs -- a single `--tmpfs /tmp` keeps Deno happy.
environment:
  HOME: /tmp
  DENO_DIR: /tmp/deno

work-dir: /home/nonroot

paths:
  - path: /home/nonroot
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o755

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quenchworks.mkabumattar.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-deno"
  org.opencontainers.image.licenses: "MIT"
