# Assembles a hardened Deno runtime/base image from the melange package
# `quench-deno`, which repackages the OFFICIAL UPSTREAM prebuilt `deno` binary
# (see melange.yaml). We do NOT use the Wolfi `deno` apk: it lags at 2.8.2 with
# CVE-2026-50185 (vulnerable rustls-webpki baked into the binary; fixed only in
# Deno 2.9.1). Fetching upstream's own per-arch release zip lets us ship 2.9.1
# ahead of Wolfi while keeping the 0-CVE gate honest.
#
# IMAGE-ONLY -- no Helm chart. This is a LANGUAGE/BASE image: the 0-CVE, signed,
# nonroot, multi-arch answer to `denoland/deno`. Developers `FROM` it (like
# Chainguard's language images) or `docker run <img> run script.ts` directly.
#
# VERSIONING: one tag -- the `2` major line -- tracking the newest stable Deno
# upstream ships; the DAILY rebuild keeps it current and re-runs the 0-CVE gate.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-deno@local            # upstream prebuilt Deno runtime, repackaged via melange (0-CVE)

accounts:
  groups:
    - groupname: nonroot
      gid: 1001
  users:
    - username: nonroot
      uid: 1001
      gid: 1001
  run-as: 1001

# Deno as the entrypoint: `docker run <img> --version`, `<img> run script.ts`,
# `<img> eval '...'`, etc.
entrypoint:
  command: /usr/bin/deno

# Deno needs a WRITABLE cache (DENO_DIR) for compiled modules / remote deps. On
# a read-only rootfs this MUST live under a writable mount, so we point it (and
# HOME) at the tmpfs -- a single `--tmpfs /tmp` keeps Deno happy.
environment:
  HOME: /tmp
  DENO_DIR: /tmp/deno

work-dir: /home/nonroot

paths:
  - path: /home/nonroot
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o755

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-deno"
  org.opencontainers.image.licenses: "MIT"
