# deno: Wolfi ships a SINGLE floating `deno` package (not per-minor), so there is
# only ONE version to build -- the current deno package version, tagged full
# X.Y.Z (used as-is). PKG maps it to the (un-versioned) `deno` package.
# Keep VERSIONS in sync with the Wolfi `deno` package version.
FROM_SOURCE=0
VERSIONS=(2.8.2)
declare -A PKG=(
  [2.8.2]=deno
)
render() { echo "s|__PKG__|${PKG[$1]}|g"; }
