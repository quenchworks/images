# deno: prebuilt Deno runtime from Wolfi (FROM_SOURCE=0, apko-only, 0-CVE).
# Latest 3 stable releases, each pinned to its exact Wolfi apk (name=ver-rN);
# the image tag is the bare X.Y.Z version.
FROM_SOURCE=0
VERSIONS=(2.8.0 2.8.1 2.8.2)
declare -A PIN=( [2.8.0]=2.8.0-r0 [2.8.1]=2.8.1-r0 [2.8.2]=2.8.2-r0 )
render() { echo "s|__PKG__|deno=${PIN[$1]}|g"; }
