# deno: OFFICIAL UPSTREAM prebuilt binary, repackaged via melange (per-arch fetch
# + sha256), NOT the Wolfi apk. Wolfi lags at 2.8.2 (CVE-2026-50185 rustls-webpki),
# so we ship Deno 2.9.1 straight from denoland/deno's own release zips. The image
# tag is the bare X.Y.Z version. Per-arch sha256 of the release zips is pinned.
FROM_SOURCE=1
VERSIONS=(2.9.4)
declare -A SHA_AMD=( [2.9.4]=c24f955d9fbfe0ea5ae2b501c8e71ae76e31e4c9782390a54a284b3364fda725 )
declare -A SHA_ARM=( [2.9.4]=111da5c05c240cfdc4340f234a0e3539d39dbcb6755221f19dcd60bacc8be5aa )
render() { echo "s/__VER__/$1/g; s|__SHA_AMD__|${SHA_AMD[$1]}|g; s|__SHA_ARM__|${SHA_ARM[$1]}|g"; }
