# unleash: Unleash, the feature-flag and gradual-rollout server (flags, strategies,
# segments, environments, the admin UI and the client and frontend APIs), from the
# official npm distribution (unleash-server: compiled dist/ plus the built frontend) on
# Wolfi nodejs-24. It needs PostgreSQL.
#
# LICENSE: 8.x is AGPL-3.0-or-later (upstream relicensed at 8.0; 7.x was Apache-2.0).
#
# 0-CVE: melange.yaml raises two dependencies before install (measured 2026-09-25):
# path-to-regexp 0.1.7 pinned by router@1.3.8 (all lines) and ip-address 10.2.0, a direct
# dependency of 8.0.3. trivy rootfs of each installed tree measured 0.
BLOCKED=0
FROM_SOURCE=0
VERSIONS=(8.0.3 8.1.0 8.2.0)
# sha256 of the npm registry tarball, from a download
declare -A SHA256=(
  [8.0.3]=4dbf0d9fd17e1dbbbdd859966b08198e239f7bdfd6c0420284020823ce31394c
  [8.1.0]=879a8edebe38a93311a2cbc28c3421bfdc696b7e5e6467ae419b7cb439b85542
  [8.2.0]=1c9c981709a7261661c4754ef3a2030c5ebde5e90033b05255a310c47e28efbf
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
