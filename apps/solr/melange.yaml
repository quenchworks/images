      fi  # end 10.0.0-only jar swap

      # the dist ships configs/launchers with restrictive perms; the nonroot runtime
      # user must read the default SOLR_HOME (to seed the writable mount) and exec the
      # launchers.
      chmod -R a+rX "$dest"

      # bake a config-from-env entrypoint. A read-only rootfs means SOLR_HOME (cores,
      # configsets), logs, the PID dir and java.io.tmpdir all live under writable
      # mounts; SOLR_* env overrides every default. Single-node standalone by default;
      # SolrCloud (-z <zkhost>) is env-gated.
      install -d "${{targets.destdir}}/usr/bin"
      cat > "${{targets.destdir}}/usr/bin/docker-entrypoint.sh" <<'EOS'
      #!/bin/bash
      set -euo pipefail

      SOLR_INSTALL=/opt/solr

      # Writable mounts (read-only rootfs). bin/solr otherwise defaults SOLR_HOME to
      # $SOLR_INSTALL/server/solr, SOLR_PID_DIR to $SOLR_INSTALL/bin and the logs dir
      # under the install tree -- all on the read-only rootfs. Relocate them all.
      export SOLR_HOME="${SOLR_HOME:-/var/solr/data}"
      export SOLR_LOGS_DIR="${SOLR_LOGS_DIR:-/var/solr/logs}"
      export SOLR_PID_DIR="${SOLR_PID_DIR:-/var/solr}"
      # bin/solr resolves -Djava.io.tmpdir from $TMPDIR; point it at a writable dir so
      # the JVM does not try to write under the read-only /tmp.
      export TMPDIR="${SOLR_TMP_DIR:-/var/solr/tmp}"
      mkdir -p "$SOLR_HOME" "$SOLR_LOGS_DIR" "$SOLR_PID_DIR" "$TMPDIR"

      # Seed SOLR_HOME from the dist's default once (solr.xml + the _default configset
      # cores are created from). Solr 9 falls back to a built-in solr.xml if absent,
      # but seeding the shipped solr.xml + configsets keeps core creation self-contained.
      if [ ! -f "$SOLR_HOME/solr.xml" ]; then
        cp -r "$SOLR_INSTALL"/server/solr/. "$SOLR_HOME"/
      fi

      # Bind to all interfaces (bin/solr defaults SOLR_JETTY_HOST to 127.0.0.1, which is
      # unreachable from outside the container).
      export SOLR_JETTY_HOST="${SOLR_JETTY_HOST:-0.0.0.0}"

      export SOLR_JAVA_HOME="${SOLR_JAVA_HOME:-${JAVA_HOME:-/usr/lib/jvm/java-21-openjdk}}"

      SOLR_PORT="${SOLR_PORT:-8983}"

      # Standalone (user-managed) single-node by default. Solr 10 flipped the default
      # start mode to SolrCloud (embedded ZooKeeper) — without --user-managed it brings
      # up cloud, where cores need a ZK-assigned coreNodeName and the Cores API fails
      # with "coreNodeName missing". Pass --user-managed for the standalone cores model.
      # SolrCloud is opt-in: set SOLR_ZK_HOST to a ZK connect string (then we run cloud,
      # NOT user-managed, and bin/solr reads SOLR_ZK_HOST / the -z arg natively).
      START_ARGS=()
      if [ -n "${SOLR_ZK_HOST:-}" ]; then
        START_ARGS+=("-z" "${SOLR_ZK_HOST}")
      else
        START_ARGS+=("--user-managed")
      fi
      if [ -n "${SOLR_OPTS_EXTRA:-}" ]; then
        export SOLR_OPTS="${SOLR_OPTS:-} ${SOLR_OPTS_EXTRA}"
      fi

      # Optional: precreate a core on first boot when SOLR_CORE is set. Done via the
      # core's instance dir + the _default configset so it is ready before start.
      if [ -n "${SOLR_CORE:-}" ] && [ ! -d "$SOLR_HOME/${SOLR_CORE}" ]; then
        mkdir -p "$SOLR_HOME/${SOLR_CORE}"
        cp -r "$SOLR_INSTALL"/server/solr/configsets/_default/. "$SOLR_HOME/${SOLR_CORE}/"
        printf 'name=%s\n' "${SOLR_CORE}" > "$SOLR_HOME/${SOLR_CORE}/core.properties"
      fi

      # Run Solr in the foreground (-f) as PID 1.
      exec "$SOLR_INSTALL/bin/solr" start -f -p "$SOLR_PORT" "${START_ARGS[@]}"
      EOS
      chmod 0755 "${{targets.destdir}}/usr/bin/docker-entrypoint.sh"

test:
  pipeline:
    - runs: |
        test -x /opt/solr/bin/solr
        test -x /usr/bin/docker-entrypoint.sh
        test -f /opt/solr/server/solr/solr.xml
