# Packages Apache Solr onto Wolfi. Solr is a Lucene-based JVM search server: we ship
# the upstream binary distribution (prebuilt jars) on a hardened Wolfi JRE, which is
# the CVE surface the Trivy gate scans (a bundled JDK would escape attribution). Solr 9
# supports JDK 11/17/21, so this runs on openjdk-21-jre -- the shared base the JVM tier
# (kafka/opensearch/zookeeper) uses.
#
# The binary dist is arch-independent: Solr/Lucene are pure JVM with no per-arch native
# bundles, so a single tarball serves both amd64 and arm64. No per-arch fetch needed.
package:
  name: quench-solr
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Apache Solr, packaged on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - openjdk-21-jre     # the JRE Solr runs on (the scanned CVE surface)
      - bash               # Solr's bin/solr launcher is bash
      - busybox
      - procps             # bin/solr requires a full `ps -p` (busybox ps lacks -p)

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle

pipeline:
  - uses: fetch
    with:
      # archive.apache.org is the permanent mirror (downloads.apache.org only keeps the
      # current release, which would break the daily rebuild once 10.0.x/11 lands).
      uri: https://archive.apache.org/dist/solr/solr/${{package.version}}/solr-${{package.version}}.tgz
      expected-sha512: "__SHA512__"
      strip-components: 1
  - runs: |
      # install the distribution under /opt/solr. Ship the runtime pieces: bin (the
      # bash launcher + post/postlogs tools), server (Jetty + solr-webapp + default
      # SOLR_HOME under server/solr), lib, modules, licenses. Drop docs/example (not
      # needed at runtime) and the Windows .cmd launchers.
      dest="${{targets.destdir}}/opt/solr"
      install -d "$dest"
      cp -r bin server lib modules licenses LICENSE.txt NOTICE.txt README.txt "$dest/"
      # Drop the Windows launchers (we run on bash only).
      find "$dest/bin" -name '*.cmd' -delete

      # --- QuenchWorks CVE pin: swap standalone jars to patched versions (10.0.0 only) --
      # Every finding is a STANDALONE jar (no fork-required shaded blocker). Families are
      # bumped in lockstep: jackson 2.20->2.21.5, jetty 12.0.27->12.0.33, netty
      # 4.2.6->4.2.15.Final, log4j 2.25.3->2.25.4, opentelemetry 1.56.0->1.62.0 (incl.
      # -alpha modules), grpc-netty-shaded 1.65.1->1.75.0, opennlp 2.5.6->2.5.9,
      # zookeeper 3.9.4->3.9.5. netty-tcnative (2.0.70) and the otel 2.x instrumentation/
      # semconv trains are NOT flagged and left as-is. SHA256-pinned from Maven Central.
      if [ "${{package.version}}" = "10.0.0" ]; then
      # Drop the optional cross-dc module: it bundles lz4-java 1.8.0 whose only fix
      # (1.8.1) is a POM-only release with NO jar on Maven Central, so it is not
      # swappable; the module (Kafka-based cross-datacenter mirror) is niche/optional.
      rm -rf "$dest/modules/cross-dc"
      M=https://repo1.maven.org/maven2
      MCV="https://repo1.maven.org/maven2"
      swap() { # reldir newfile sha256 url oldfile
        local rd="$1" nf="$2" sha="$3" url="$4" old="$5"
        rm -f "$dest/$rd/$old"
        wget -q -O "$dest/$rd/$nf" "$url"
        echo "$sha  $dest/$rd/$nf" | sha256sum -c - >/dev/null
      }
      swap modules/analysis-extras/lib opennlp-tools-2.5.9.jar bc2d28082607b211fdf3185c1496ea8e130fa1fe1bead85622d38487920017e2 "https://repo1.maven.org/maven2/org/apache/opennlp/opennlp-tools/2.5.9/opennlp-tools-2.5.9.jar" opennlp-tools-2.5.6.jar
      swap modules/gcs-repository/lib grpc-netty-shaded-1.75.0.jar d33d47a9720a392512c4e4ceaa17a458a0e3ed6188d17e98d6c4faf0679374d7 "https://repo1.maven.org/maven2/io/grpc/grpc-netty-shaded/1.75.0/grpc-netty-shaded-1.75.0.jar" grpc-netty-shaded-1.65.1.jar

      # --- 2026-08-26 gate wave -------------------------------------------------------
      # httpcomponents: 5.2.x -> the only fixed line (5.6.3 / 5.4.3). NOTE the jump crosses
      # the 5.5->5.6 behaviour change that broke graylog's OpenSearch client; here the
      # consumer is SolrJ in the sql module, and the boot test's core-create + query path
      # is the guard. licenses/ carries scan-visible duplicate jars, so both copies move.
      swap modules/sql/lib httpclient5-5.6.3.jar 80712ff129210d7c73d9fcc1195cbee5c3c34744965c7a05ea107b3648922f18 "$MCV/org/apache/httpcomponents/client5/httpclient5/5.6.3/httpclient5-5.6.3.jar" httpclient5-5.2.1.jar
      swap modules/sql/lib httpcore5-5.4.3.jar 18bfbbabb478dfb67f31aeaf428c387f3c3df654582e1309f708ee1f3086830a "$MCV/org/apache/httpcomponents/core5/httpcore5/5.4.3/httpcore5-5.4.3.jar" httpcore5-5.2.3.jar
      swap modules/sql/lib httpcore5-h2-5.4.3.jar c7db7026b8e2dea39132b04a6069f6671e2858309b20a146ec5c7dd6ed73a0b6 "$MCV/org/apache/httpcomponents/core5/httpcore5-h2/5.4.3/httpcore5-h2-5.4.3.jar" httpcore5-h2-5.2.jar
      swap licenses httpclient5-5.6.3.jar 80712ff129210d7c73d9fcc1195cbee5c3c34744965c7a05ea107b3648922f18 "$MCV/org/apache/httpcomponents/client5/httpclient5/5.6.3/httpclient5-5.6.3.jar" httpclient5-5.2.1.jar
      swap licenses httpcore5-5.4.3.jar 18bfbbabb478dfb67f31aeaf428c387f3c3df654582e1309f708ee1f3086830a "$MCV/org/apache/httpcomponents/core5/httpcore5/5.4.3/httpcore5-5.4.3.jar" httpcore5-5.2.3.jar
      swap licenses httpcore5-h2-5.4.3.jar c7db7026b8e2dea39132b04a6069f6671e2858309b20a146ec5c7dd6ed73a0b6 "$MCV/org/apache/httpcomponents/core5/httpcore5-h2/5.4.3/httpcore5-h2-5.4.3.jar" httpcore5-h2-5.2.jar
      # log4j-api 2.25.4 -> 2.25.5 on the classpath; licenses/ carried a mismatched 2.25.3.
      swap server/lib/ext log4j-api-2.25.5.jar 64777f73ea0b3104c04eb82befbdccc30a425a19e83ad06cb2f93aa303511863 "$MCV/org/apache/logging/log4j/log4j-api/2.25.5/log4j-api-2.25.5.jar" log4j-api-2.25.3.jar
      swap licenses log4j-api-2.25.5.jar 64777f73ea0b3104c04eb82befbdccc30a425a19e83ad06cb2f93aa303511863 "$MCV/org/apache/logging/log4j/log4j-api/2.25.5/log4j-api-2.25.5.jar" log4j-api-2.25.3.jar
      # netty-codec-http 4.2.16 has NO standalone jar here: it is bundled inside
      # grpc-netty-shaded. 1.83.1 scans 0 findings (verified with trivy rootfs on the jar
      # itself before pinning), so the shaded artifact moves rather than any netty file.
      swap modules/gcs-repository/lib grpc-netty-shaded-1.83.1.jar fc7a54cca004df57d8d416f335e851d53b188926b598151c5714498ff60dced5 "$MCV/io/grpc/grpc-netty-shaded/1.83.1/grpc-netty-shaded-1.83.1.jar" grpc-netty-shaded-1.75.0.jar
      swap licenses grpc-netty-shaded-1.83.1.jar fc7a54cca004df57d8d416f335e851d53b188926b598151c5714498ff60dced5 "$MCV/io/grpc/grpc-netty-shaded/1.83.1/grpc-netty-shaded-1.83.1.jar" grpc-netty-shaded-1.65.1.jar
      swap modules/langid/lib opennlp-tools-2.5.9.jar bc2d28082607b211fdf3185c1496ea8e130fa1fe1bead85622d38487920017e2 "https://repo1.maven.org/maven2/org/apache/opennlp/opennlp-tools/2.5.9/opennlp-tools-2.5.9.jar" opennlp-tools-2.5.6.jar
      swap modules/opentelemetry/lib netty-codec-compression-4.2.16.Final.jar 13c8565414dd2115281303ef4ad1f7cc69bd7771d8d12c7d2fb31307dff26d11 "https://repo1.maven.org/maven2/io/netty/netty-codec-compression/4.2.16.Final/netty-codec-compression-4.2.16.Final.jar" netty-codec-compression-4.2.6.Final.jar
      # codec-http goes straight to 4.2.17 (CVE fixed there). An earlier duplicate swap
      # above this block was removed: THIS line runs later and re-downloaded 4.2.16
      # after it -- the last-swap-wins ordering bug, third instance (pulsar netty,
      # solr log4j, this).
      swap modules/opentelemetry/lib netty-codec-http-4.2.17.Final.jar a5bde91ac82ab90579df6559c0bd7ea6ae37460e3f18116ab4122194283b3669 "https://repo1.maven.org/maven2/io/netty/netty-codec-http/4.2.17.Final/netty-codec-http-4.2.17.Final.jar" netty-codec-http-4.2.6.Final.jar
