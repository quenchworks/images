# maddy: Maddy Mail Server (foxcpp/maddy), a composable all-in-one mail server: SMTP (MX and submission),
# IMAP, DKIM, SPF, DMARC, MTA-STS and local mailbox storage in one binary. GPL-3.0. Images issue #45.
#
# Built like upstream's image: build tag "docker" (config and state under /data, runtime under /tmp) and
# CGO off, which selects the pure-Go modernc SQLite driver (internal/sqlite build tags).
FROM_SOURCE=1
VERSIONS=(0.9.7)
declare -A SHA256=(
  [0.9.7]=cce236667f9f4592f4c08eb31d94c177a5314a9f8f75b6dc2aa1fd12177b556f
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
