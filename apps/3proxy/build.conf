# 3proxy (3proxy/3proxy): tiny multi-protocol proxy suite in C (HTTP, SOCKS4/5, POP3, FTP,
# TCP/UDP port mapping). From the release tarball with upstream's Makefile.Linux, linked
# against Wolfi OpenSSL and PCRE2 (plugins built too, PAM off). License: the 3proxy 0.9 Public
# License, which also offers Apache-2.0; shipped under Apache-2.0. Newest release only.
FROM_SOURCE=1
VERSIONS=(1.0.3)
declare -A SHA256=(
  [1.0.3]=464553674be2b6d4f36c007604fb547df7841a8277f8282a3e3cda88134e0708
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
