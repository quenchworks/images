# Assembles the 3proxy image. Nonroot uid 1001, multi-arch, SBOM by apko. Reads
# /etc/3proxy/3proxy.cfg (closed by default: strong auth with no users);
# plugins live in /usr/local/3proxy/libexec. HTTP proxy on 3128, SOCKS on 1080.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-3proxy@local

accounts:
  groups:
    - groupname: proxy3
      gid: 1001
  users:
    - username: proxy3
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/bin/3proxy
cmd: /etc/3proxy/3proxy.cfg

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-3proxy"
  org.opencontainers.image.licenses: "Apache-2.0"
