# cosmian-kms (Cosmian KMS): from-source Rust build via melange.
#
# =============================================================================
# !!! LICENSE: BUSL-1.1 AND MORE RESTRICTIVE THAN VAULT'S. READ THIS. !!!
#
# GitHub reports NOASSERTION; the actual LICENSE file is the Business Source
# License 1.1 with this Additional Use Grant:
#
#   "You may use the Licensed Work in production, provided your total use does
#    not exceed a total of 2 vCPUS on virtual machines or 1 physical core on
#    bare metal machines. This use does not include offering the Licensed Work
#    to third parties."
#
# So unlike apps/vault (BUSL, but unlimited INTERNAL production use), scaling
# this past 2 vCPUs in production is a licence violation, and offering it to
# third parties is barred outright. The catalog row, the chart README and the
# chart NOTES must all say so plainly -- a user must not be able to deploy this
# from QuenchWorks and scale it without seeing the cap.
#
# There is no open KMIP alternative to point at: Vault's KMIP secrets engine is
# Enterprise-only, so OpenBao does not inherit it either. Nothing else in the
# catalog speaks KMIP 2.1. Shipped at the user's explicit request after the
# licence terms were raised.
# =============================================================================
#
# WHY THIS IS BUILDABLE 0-CVE -- the one thing that decides it:
# crate/crypto/build.rs DOWNLOADS AND COMPILES ITS OWN OpenSSL 3.6.2 from
# package.cosmian.com by default. A vendored, pinned, older-than-Wolfi OpenSSL is
# precisely the bundled-dependency pattern that fails the 0-CVE gate (Wolfi is on
# 3.6.3), and it also means an SBOM that does not match reality.
#
# BUT build.rs line ~51 checks OPENSSL_DIR first and SKIPS its own OpenSSL build
# when that directory contains ssl/openssl.cnf and lib/ossl-modules (it calls this
# the "Nix environment" path). So the recipe sets OPENSSL_DIR at a small shim tree
# that symlinks Wolfi's current openssl into the layout build.rs expects, and no
# vendored OpenSSL is ever fetched or compiled. Same float-to-the-fixed-version
# discipline the Go apps use. VERIFY per release that this branch still exists --
# if upstream drops it, this app becomes CVE-blocked on the vendored 3.6.x.
#
# FIPS: build.rs defaults to FIPS mode (fips unless CARGO_FEATURE_NON_FIPS is set),
# which needs OpenSSL's FIPS provider -- Wolfi's openssl does not ship one. So the
# build enables the `non-fips` feature. This image is therefore NOT FIPS 140-3
# validated; say so in the catalog summary rather than inheriting upstream's claim.
#
# Rust toolchain is PINNED per release in rust-toolchain.toml (5.26.0 -> 1.97.0);
# Wolfi has rust-1.97. Check it every bump.
#
# Binary: `cosmian_kms` from crate/server (package cosmian_kms_server). The PKCS#11
# provider and the `ckms` CLI are separate workspace members and are not shipped in
# the server image.
FROM_SOURCE=1
# Newest patch of each of the last 3 MINOR lines. Every line is a single patch so
# far, so this is simply the last three releases.
VERSIONS=(5.24.0 5.25.0 5.26.0)
# NOTE: Cosmian uses ANNOTATED tags, so `git/ref/tags/<v>` returns the TAG OBJECT
# sha, not the commit -- feeding that to git-checkout's expected-commit fails. These
# are dereferenced commits (`gh api repos/Cosmian/kms/commits/<tag>`). Kong and Vault
# use lightweight tags where the ref sha IS the commit; do not assume either way.
declare -A COMMIT=(
  [5.24.0]=f4ab7e47b64865f54f185b52e4138069cf75ae1c
  [5.25.0]=067681b5ab4607fdfa9868c389ab93ffc2b55bae
  [5.26.0]=6f53d685d28f031f4a08ec91cd5a79dc6fdd68a1
)
# Pinned Rust toolchain per release, read from rust-toolchain.toml AT THAT TAG.
# 5.24.0/5.25.0 pin 1.91; 5.26.0 moved the pin to 1.97.0 (Wolfi has rust-1.97=1.97.1).
declare -A RUST=(
  [5.24.0]=1.91
  [5.25.0]=1.91
  [5.26.0]=1.97
)
# Source comes from the GitHub release TARBALL, not a git clone. melange's git-checkout
# fails intermittently with "fatal: remote helper 'https' aborted session" -- it killed
# the arm64 legs for 5.24.0 and 5.25.0 in CI (run 30895950627) while 5.23.0 happened to
# survive, so nothing published. Same failure Kong hit. The tag is in the URL and the
# sha256 covers the bytes, so provenance is unchanged.
declare -A SHA256=(
  [5.24.0]=2ea7015416d3a969f5f92992ed9416a38ed3216d7c4724e02bb328990feb140c
  [5.25.0]=e4e5b5bb41ad55d1cf09fac1bd9b14e4953192c874b0e41ac40f7f808ccf0c0f
  [5.26.0]=4ff0bdbf6b48dfa7fd3785f9c6f463f1f88ea6bec381c9a2a9dce2ed47cc163c
)
render() {
  echo "s/__VER__/$1/g; s/__COMMIT__/${COMMIT[$1]}/g; s/__SHA256__/${SHA256[$1]}/g; s/__RUST__/${RUST[$1]}/g"
}
