# Skipper (zalando/skipper, Apache-2.0; pathmux subdirectory MIT): HTTP router and reverse proxy,
# also a Kubernetes ingress controller. From source via melange: skipper (entrypoint), eskip (the
# route-file tool) and routesrv (the route server for large ingress fleets), static Go binaries.
# LATEST-ONLY: upstream tags a patch release almost daily on a single 0.28 line.
FROM_SOURCE=1
VERSIONS=(0.28.76 0.28.75)
declare -A SHA256=(
  [0.28.76]=41eb45b88759ceb0c812d9e2521f7ae6bfd897ddfe0650cae518e3bb96ed2d24
  [0.28.75]=ba3cc4af4f6fdde94fa267664da25de587c3e6273d15ff5ebec0bac4dba7f510
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
