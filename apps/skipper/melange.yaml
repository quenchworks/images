# Skipper from the release tag: skipper, eskip and routesrv built CGO-free with upstream's
# -X main.version stamp (the Makefile's flags; the tarball has no git, so the version comes
# from the tag instead of git describe).
package:
  name: quench-skipper
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Skipper HTTP router and ingress, built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27            # go.mod: go 1.27.3

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/zalando/skipper/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - runs: |
      set -eu
      export CGO_ENABLED=0 GOTOOLCHAIN=local GOFLAGS=-mod=mod
      install -d "${{targets.destdir}}/usr/bin"
      for b in skipper eskip routesrv; do
        go build -trimpath -ldflags "-s -w -X main.version=v${{package.version}}" \
          -o "${{targets.destdir}}/usr/bin/$b" ./cmd/$b
      done
      "${{targets.destdir}}/usr/bin/skipper" -version | grep -F "v${{package.version}}"

test:
  pipeline:
    - runs: |
        skipper -version
        eskip -help >/dev/null 2>&1 || true
        test -x /usr/bin/routesrv
