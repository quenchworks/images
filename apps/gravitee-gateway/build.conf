# gravitee-gateway: the Gravitee API Management (APIM) community API gateway, from the
# graviteeio-full-<v>.zip distribution on download.gravitee.io (the only public artifact
# for 4.10+: Maven Central stops at 4.7.8 and the per-component zips answer 404), pinned
# by the sha256 of that zip. Two lines, newest patch of each.
#
# LICENSE GATE (measured 2026-10-19 on 4.12.23): the full zip ships 159 gateway plugins;
# 74 are Gravitee Enterprise plugins (com.graviteesource code and/or a `feature=` license
# key in plugin.properties) and are removed at build time, with alert-engine-connectors-ws
# (no public source) and two lib jars from private repos (gravitee-cloud-initializer,
# gravitee-common-mcp). Every kept plugin maps to an Apache-2.0 gravitee-io repository.
# The recipe applies the rule, not a list, so a new EE plugin in a later release is
# dropped too.
FROM_SOURCE=1
VERSIONS=(4.11.31 4.12.25)
declare -A SHA256=(
  [4.11.31]=720c781698c74f7df1ef1ca3cedee2c31b54118e1d05d2b22a1eee3d5de7a4d7
  [4.12.25]=aefbf1eade4104839a755c4b4235ebc13fcf528632450a91d4932ac6036a8e94
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
