# Builds nats-server from source onto Wolfi. Single static Go binary, no CGO.
# Output is a signed APK in Quenchworks' own repo. No upstream distro binaries.
package:
  name: quench-nats
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened NATS server, built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git              # `go get` resolves module versions via git
      - go

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/nats-io/nats-server/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - name: Bump vulnerable Go modules to their fixed versions (0-CVE gate)
    runs: |
      set -eu
      export GOFLAGS=-mod=mod
      export GO111MODULE=on
      export GOTOOLCHAIN=local   # use the installed go, don't fetch go.mod's toolchain
      # Trivy flags x/net and x/crypto/ssh in the binary's module graph.
      # FLOORS, not pins (docs/go-module-float.md): raise only where go.mod is below. Minimal
      # version selection already gives every importer the highest required version, so no
      # `replace` is needed; the replaces that forced x/net 0.58.0 and x/crypto 0.56.0 were
      # dropped 2026-10-05 after they downgraded newer releases.
      FLOOR="golang.org/x/net@v0.58.0 golang.org/x/sys@v0.47.0 google.golang.org/grpc@v1.83.2 golang.org/x/text@v0.41.0 golang.org/x/crypto@v0.56.0"
      # Go semver order (a release outranks its prereleases); busybox sort -V does not.
      vlt() { awk -v a="${1#v}" -v b="${2#v}" 'function pp(s,  p){sub(/\+.*/,"",s);p=index(s,"-");if(p){C=substr(s,1,p-1);P=substr(s,p+1)}else{C=s;P=""}} function cmp(x,y,  i,n,m,X,Y){n=split(x,X,".");m=split(y,Y,".");for(i=1;i<=n&&i<=m;i++){if(X[i]==Y[i])continue;if(X[i]~/^[0-9]+$/&&Y[i]~/^[0-9]+$/)return (X[i]+0<Y[i]+0)?-1:1;if(X[i]~/^[0-9]+$/)return -1;if(Y[i]~/^[0-9]+$/)return 1;return (X[i]<Y[i])?-1:1}return (n<m)?-1:(n>m)?1:0} BEGIN{pp(a);ca=C;pa=P;pp(b);cb=C;pb=P;c=cmp(ca,cb);if(c==0){if(pa==pb)c=0;else if(pa=="")c=1;else if(pb=="")c=-1;else c=cmp(pa,pb)}exit !(c<0)}'; }
      need=""
      for mv in $FLOOR; do
        have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${mv%@*}" 2>/dev/null)"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        vlt "$have" "${mv#*@}" && need="$need $mv"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || go get $need
      go mod tidy || true
  - runs: |
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      go build -trimpath \
        -ldflags "-s -w -X github.com/nats-io/nats-server/v2/server.gitCommit=v${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/nats-server" .

# No in-build `test:` block: NATS's source tree ships broken symlinks under its
# filesystem-test fixtures (e.g. test-dirfs-0) that break melange's test-workspace
# population. The functional smoke runs on the assembled image via test.sh instead.
