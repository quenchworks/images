# nats: from-source via melange (Go build of nats-server from the git tag tarball).
# Latest 3 patches of the current stable 2.14 line. Each release pins its source
# tarball by sha256.
FROM_SOURCE=1
VERSIONS=(2.14.2 2.14.3 2.14.4)
declare -A SHA256=(
  [2.14.1]=5543bd3757c596994d116986a99965b3b2d61a416f24dd98cefde91c094c102e
  [2.14.2]=54cfe4361aa09a55a92524b737993941cd37fd444ccedd9ba60fc0d4a0c0cd72
  [2.14.3]=dba5286035ce9017b897ea24a783551dc28b07ad50c78da5471ead2bcfab3e86
  [2.14.4]=fb873897f826686dc4407112613e80c61fba10a1b381375458784995cd9f295d
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
