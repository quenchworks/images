# nats: from-source via melange (Go build of nats-server from the git tag tarball).
# Latest 3 stable minor lines, newest patch each (2.11, 2.12, 2.14; upstream
# skipped a 2.13 GA line). Each release pins its source tarball by sha256.
FROM_SOURCE=1
VERSIONS=(2.11.17 2.12.11 2.14.2)
declare -A SHA256=(
  [2.11.17]=93d504d56067a61972ae139d8d4e524032d62b4d129ee621d47c44872a130fde
  [2.12.11]=b00fa91ef029830cbf05d2a049c75136cb0e9e219ce2d2744102dab31bbb0bd4
  [2.14.2]=54cfe4361aa09a55a92524b737993941cd37fd444ccedd9ba60fc0d4a0c0cd72
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
