# nats: from-source via melange (Go build of nats-server from the git tag tarball).
# Latest 3 patches of the current stable 2.14 line. Each release pins its source
# tarball by sha256.
FROM_SOURCE=1
VERSIONS=(2.14.5 2.14.6 2.14.7)
declare -A SHA256=(
  [2.14.5]=e52606786923a346de676ae238889a79f55df61680f492ee5e2b1353b58418b5
  [2.14.6]=90aec2c35eaa94105354cbcdfb6d88cea5082415dc39409efdbe320fb66328bb
  [2.14.7]=094114987c7f7d45347a77e1731a394d002115669b802b5475ef515d342358cc
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
