# nats: from-source via melange (Go build of nats-server from the git tag tarball).
# Latest 3 patches of the current stable 2.14 line. Each release pins its source
# tarball by sha256.
FROM_SOURCE=1
VERSIONS=(2.14.10 2.15.3)
declare -A SHA256=(
  [2.14.10]=28cbecba7a578e521f93ff66dfcdac1a9b4955f7cf080537ca76948b94dcf57f
  [2.15.3]=034a2a7535d67ae6f28962976a530dad1bd912dd2d9af05a3990f3b7e674008e
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
