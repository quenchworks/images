# nats: from-source via melange (Go build of nats-server from the git tag tarball).
# Latest 3 patches of the current stable 2.14 line. Each release pins its source
# tarball by sha256.
FROM_SOURCE=1
VERSIONS=(2.14.8 2.15.1)
declare -A SHA256=(
  [2.14.8]=2104983242c41d6b7ed2616a651c86fd401dce4d7f7797e486224edea366a465
  [2.15.1]=41b25fcb78a174f3afce4ec1eca0c1035439abf580f0a0569dbb03bd0d955e08
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
