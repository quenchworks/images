# nats: from-source via melange (Go build of nats-server from the git tag tarball).
# Latest 3 patches of the current stable 2.14 line. Each release pins its source
# tarball by sha256.
FROM_SOURCE=1
VERSIONS=(2.14.9 2.15.2)
declare -A SHA256=(
  [2.14.9]=c67a8c109260f5fb7731488db35942b630689c221d4bf491dd604edccba94bfb
  [2.15.2]=78399249f4f65366f2af60ff5833029f66f1939a094e110fcf86d96c4da4b8b4
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
