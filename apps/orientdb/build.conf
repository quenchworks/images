# STATUS: SHIPPABLE 2026-10-19. STANDALONE ONLY, NO DISTRIBUTED MODE.
#   The dist bundles Hazelcast 3.12.13 for distributed mode (CVE-2026-107726 CRITICAL,
#   CVE-2026-107725, CVE-2023-33265/45859/45860; fixes only on Hazelcast 5.x, which
#   OrientDB 3.2 cannot link) and a shaded jackson-core 2.11.2 inside it. The recipe
#   removes hazelcast-3.12.13.jar, hazelcast-kubernetes-1.5.6.jar,
#   orientdb-distributed-<ver>.jar, the OHazelcastPlugin handler, hazelcast.xml,
#   default-distributed-db-config.json and dserver.sh. Unblock distributed mode only if
#   an OrientDB release links a fixed Hazelcast.
#   Other swaps (version-aware, see melange.yaml): jackson-core 2.22.0 -> 2.22.4
#   (CVE-2026-89407/89425), lz4-java 1.11.0 -> 1.11.4 (CVE-2026-106449..106453, 59949).
# orientdb: OrientDB Community (Apache-2.0) binary dist from Maven Central, run on
# openjdk-21-jre (the jars are Java 8 bytecode, class major 52). Only the 3.2 line exists.
BLOCKED=0
FROM_SOURCE=1
