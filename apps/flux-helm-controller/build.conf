# flux-helm-controller: Flux's helm-controller, from source via melange (Go build of main.go from the git tag
# tarball). Static Go binary, no CGO. Flux ships one version of each controller per
# Flux release, so this tracks the latest only. The binary carries no version stamp.
FROM_SOURCE=1
VERSIONS=(1.6.4)
declare -A SHA256=(
  [1.6.4]=e2cc3dd5e306f7525183ed3ac4d07146b04135b6d4050585b017645373387047
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
