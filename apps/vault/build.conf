# vault (HashiCorp Vault): from-source via melange (Go build of the repo root,
# git-checkout pinned per release by tag + expected-commit). Newest patch of each
# SHIPPABLE stable MINOR line. Enterprise (`+ent`) tags are skipped.
#
# !!! LICENSE: BUSL-1.1 -- NOT OSI-approved open source. See melange.yaml's header.
#     OpenBao (MPL-2.0, apps/openbao) is the truly-open drop-in fork. CAUTION TIER.
#
# WHY TWO LINES, NOT THREE: the third-newest line (1.20.x, newest patch 1.20.4) does
# NOT pass the 0-CVE gate and CANNOT be floated onto it. Its `vault` binary LINKS
# github.com/docker/docker v28.4.0+incompatible, which carries CVE-2026-34040 (HIGH);
# the advisory is first fixed in 29.3.1, and docker/docker's v29 line is not reachable
# on the `+incompatible` module path at all (the module tops out at v28.5.2+incompatible
# on proxy.golang.org, and v29 moved to github.com/moby/moby/*). 1.20.4 also needed 9
# other floats (pgx/v5, kiota-http-go, mongo-driver, jose2go, go-jose/v3, circl,
# edwards25519, aws eventstream, go-ntlmssp) -- all of those ARE floatable, but the
# docker HIGH is not, so the line is upstream-gated and stays out.
# 1.21.4 and 2.0.3 require the same docker version but do NOT link it into the binary
# (test-only), and both pass the gate on the canonical float set alone. Re-check 1.20.x
# only if upstream migrates it off github.com/docker/docker.
#
# grpc/go-kms-wrapping NOTE (the wall that keeps apps/openbao BLOCKED): openbao cannot
# take the canonical google.golang.org/grpc@v1.82.1 float because its go.mod resolves
# go-kms-wrapping/wrappers/transit/v2 v2.8.0 and the float cascade-downgrades that to
# v2.1.0 (no WrapperTypeTransit symbol -> build break). Vault does NOT hit that wall: it
# requires wrappers/transit/v2 v2.0.13 and go-kms-wrapping/v2 v2.0.23, and
# `go get grpc@v1.82.1 && go mod tidy` leaves both untouched (verified on both lines).
# LOCAL GATE 2026-07-28: both shipped versions built on BOTH arches (x86_64 native +
# aarch64 emulated) and scanned "✅ 0 fixable CVEs" with the canonical float set alone.
# The assembled 2.0.3 image also passed test.sh (real init -> unseal -> kv-v2 roundtrip)
# and the chart's kind install gate in dev AND default sealed mode.
FROM_SOURCE=1
# 2026-07-30 CI RESULT: the 1.x line is DROPPED. 1.21.4 failed the gate on BOTH arches
# with 12 findings (2 CRITICAL, 4 HIGH, 5 MEDIUM, 1 LOW), including the same
# github.com/docker/docker v28.4.0+incompatible CVE-2026-34040 (HIGH) that already
# ruled out 1.20.4 -- so the whole Vault 1.x line LINKS docker, not just 1.20.x. The
# earlier local-gate note claiming 1.21.4 was clean was wrong; CI's identical
# comprehensive scan found it on both arches. 2.0.3 passed both arches cleanly, so
# Vault ships 2.x only. Because one matrix leg failed, `merge` was skipped and nothing
# was published from that run.
# UNBLOCK 1.x when: a 1.x release stops linking docker, or docker >= 29.3.1 becomes
# reachable on the +incompatible module path (v29 moved to github.com/moby/moby/*).
VERSIONS=(2.0.4)
declare -A COMMIT=(
  [2.0.4]=c9e9d1d4ddd4b55aae79a8949adffa9e96338720
)
render() { echo "s/__VER__/$1/g; s/__COMMIT__/${COMMIT[$1]}/g"; }
