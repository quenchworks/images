# Assembles a hardened Bun runtime/base image directly from Wolfi's own `bun`
# package. No Dockerfile, NO melange build -- apko pulls the prebuilt `bun`
# package straight from the Wolfi `os` repository. Bun is a large Zig/C++ build,
# but Wolfi ALREADY packages it (0-CVE), so this is a pure package-assembly --
# we never compile Bun from source.
#
# IMAGE-ONLY -- no Helm chart. This is a LANGUAGE/BASE image: the 0-CVE, signed,
# nonroot, multi-arch answer to `oven/bun`. Developers `FROM` it (like
# Chainguard's language images) or `docker run <img> script.ts` directly.
#
# VERSIONING: unlike Go/Rust/Erlang, Wolfi ships a SINGLE floating `bun` package
# (not per-minor `bun-1.x` packages), so there is nothing to fan a matrix over.
# We publish ONE tag -- the `1` major line -- tracking whatever 1.x Wolfi has
# packaged; the DAILY rebuild keeps it current and re-runs the 0-CVE gate.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - bun                          # prebuilt Bun runtime from Wolfi (0-CVE)

accounts:
  groups:
    - groupname: nonroot
      gid: 1001
  users:
    - username: nonroot
      uid: 1001
      gid: 1001
  run-as: 1001

# Bun as the entrypoint: `docker run <img> --version`, `<img> run script.ts`,
# `<img> -e '...'`, etc. `bunx` is also on PATH at /usr/bin/bunx.
entrypoint:
  command: /usr/bin/bun

# HOME points at the writable tmpfs so Bun's install cache / lockfile work on a
# read-only rootfs (a single `--tmpfs /tmp` is enough, like Python's pip).
environment:
  HOME: /tmp
  BUN_INSTALL_CACHE_DIR: /tmp/.bun-cache

work-dir: /home/nonroot

paths:
  - path: /home/nonroot
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o755

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-bun"
  org.opencontainers.image.licenses: "MIT"
