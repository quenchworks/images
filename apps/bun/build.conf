# bun: Wolfi ships a SINGLE floating `bun` package (not per-minor bun-1.x), so
# there is only ONE version to build -- the current bun package version, tagged
# full X.Y.Z (used as-is). PKG maps it to the (un-versioned) `bun` package.
# Keep VERSIONS in sync with the Wolfi `bun` package version.
FROM_SOURCE=0
VERSIONS=(1.3.1)
declare -A PKG=(
  [1.3.1]=bun
)
render() { echo "s|__PKG__|${PKG[$1]}|g"; }
