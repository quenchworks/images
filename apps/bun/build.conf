# bun: prebuilt Bun runtime from Wolfi (FROM_SOURCE=0, apko-only, 0-CVE).
# Latest 3 stable releases, each pinned to its exact Wolfi apk; tag = X.Y.Z.
FROM_SOURCE=0
# 2026-11-01: 1.4.4 only. CVE-2026-111497 (brotli, CRITICAL) is fixed in Wolfi bun 1.4.4-r0 and the
# advisory covers every earlier bun version, so the 1.3.13, 1.3.14 and 1.4.2 lines cannot rebuild clean.
VERSIONS=(1.4.4)
# test.sh takes its extra args from build-bun.yml, which passes "${1%%.*}" rather
# than the version. Mirrored here so the local gate matches CI.
boot_args() { echo "${1%%.*}"; }
declare -A PIN=(
  [1.4.4]=1.4.4-r0
)
render() { echo "s|__PKG__|bun=${PIN[$1]}|g"; }
