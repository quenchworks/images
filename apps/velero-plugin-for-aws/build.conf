# velero-plugin-for-aws: Velero's object-store and volume-snapshot plugin for
# AWS S3 and any S3-compatible store (Apache-2.0). Built from source on Wolfi,
# static Go. The image is an init container: its cp-plugin copies the plugin
# binary into Velero's plugins volume. Line 1.14 pairs with Velero 1.18.
# Image only, no chart (the velero chart consumes it).
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(1.14.3)
declare -A SHA=(
  [1.14.3]=4dfb9989551c55c8b9b9a14ffb51087c80fbccd462e9ca28c35c5afa541b87fa
)
render() { echo "s/__VER__/$1/g; s/__SHA256__/${SHA[$1]}/g"; }
