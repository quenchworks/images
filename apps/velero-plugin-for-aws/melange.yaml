# Builds velero-plugin-for-aws from source onto Wolfi: CGO off, the plugin plus
# upstream's cp-plugin helper, as upstream's Dockerfile does.
package:
  name: quench-velero-plugin-for-aws
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Velero plugin for AWS and S3-compatible stores, built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/vmware-tanzu/velero-plugin-for-aws/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      set -eu
      export CGO_ENABLED=0
      export GOTOOLCHAIN=local
      export GOFLAGS=-mod=mod
      # ---- 0-CVE module float (docs/go-module-float.md) ----------------------
      # FLOOR is a floor, not a pin: only modules below it are raised, and the
      # shipped binaries are asserted at or above it after the build.
      FLOOR="golang.org/x/net@v0.58.0 golang.org/x/text@v0.41.0 golang.org/x/crypto@v0.56.0 golang.org/x/sys@v0.47.0 golang.org/x/mod@v0.40.0 golang.org/x/oauth2@v0.36.0 google.golang.org/grpc@v1.83.2 go.opentelemetry.io/otel@v1.45.0 go.opentelemetry.io/otel/sdk@v1.45.0 go.opentelemetry.io/otel/trace@v1.45.0 go.opentelemetry.io/otel/metric@v1.45.0"
      MODS="$(echo "$FLOOR" | tr ' ' '\n' | cut -d@ -f1)"
      below_floor() {
        awk -v floor="$FLOOR" -v tag="$1" '
          BEGIN { n = split(floor, f, " ")
                  for (i = 1; i <= n; i++) { split(f[i], kv, "@"); want[kv[1]] = kv[2] } }
          ($1 in want) {
            split(substr($2, 2), g, "."); split(substr(want[$1], 2), w, ".")
            for (i = 1; i <= 3; i++) {
              if ((g[i] + 0) > (w[i] + 0)) next
              if ((g[i] + 0) < (w[i] + 0)) { print $1 "@" want[$1] " (" tag " has " $2 ")"; next }
            }
          }'
      }
      need="$(go list -m -e $MODS | awk 'NF >= 2 && $NF ~ /^v[0-9]/ { print $1, $NF }' | below_floor go.mod | awk '{ print $1 }')"
      if [ -n "$need" ]; then go get $need; fi
      go mod tidy
      rm -rf vendor
      d="${{targets.destdir}}"
      mkdir -p "$d/plugins" "$d/usr/bin"
      go build -trimpath -ldflags "-s -w" -o "$d/plugins/velero-plugin-for-aws" ./velero-plugin-for-aws
      go build -trimpath -ldflags "-s -w" -o "$d/usr/bin/cp-plugin" ./hack/cp-plugin
      for b in "$d/plugins/velero-plugin-for-aws" "$d/usr/bin/cp-plugin"; do
        bad="$(go version -m "$b" | awk '$1 == "dep" || $1 == "=>" { print $2, $3 }' | below_floor "$b")"
        [ -z "$bad" ] || { echo "0-CVE float did not reach $b:"; echo "$bad"; exit 1; }
      done
      "$d/plugins/velero-plugin-for-aws" 2>&1 | grep -q "This binary is a plugin"

test:
  pipeline:
    - runs: |
        test -x /plugins/velero-plugin-for-aws && test -x /usr/bin/cp-plugin
