# Assembles the Velero AWS plugin image: static binaries, nonroot uid 1001,
# multi-arch, SBOM by apko. Run it as an init container with Velero's plugins
# volume mounted at /target; it copies the plugin there and exits.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-velero-plugin-for-aws@local

accounts:
  groups:
    - groupname: nonroot
      gid: 1001
  users:
    - username: nonroot
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/bin/cp-plugin /plugins/velero-plugin-for-aws /target/velero-plugin-for-aws

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-velero-plugin-for-aws"
  org.opencontainers.image.licenses: "Apache-2.0"
