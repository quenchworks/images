# nautobot: Nautobot, the network source of truth and automation platform (a Django fork of
# NetBox with Jobs, GraphQL and Git-backed data), from the PyPI wheel (sha256-pinned; it ships
# the built frontend and docs) plus its resolved dependencies in a Python 3.14 venv. uWSGI
# (bundled pyuwsgi) serves the app and the collected /static on 8080. One image runs the web
# server, the Celery worker and beat, and nautobot-server commands.
#
# 0-CVE: the installed venv (nautobot[postgresql]) scanned 0 findings, fixed or unfixed, once
# pip and setuptools left it (2026-11-23).
#
# NEWEST-ONLY: Nautobot patches its newest minor.
BLOCKED=0
FROM_SOURCE=0
VERSIONS=(3.2.10)
# sha256 of the PyPI wheel, as PyPI publishes it (checked against the download)
declare -A SHA256=(
  [3.2.10]=ebe266a72cd73eeadaa0c57854afd39cdf4e71805bde09bdb24efaad400a11b7
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
