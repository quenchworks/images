; uWSGI for the Quenchworks Nautobot image: `nautobot-server start --ini /opt/nautobot/uwsgi.ini`.
[uwsgi]
http = 0.0.0.0:8080
master = true
strict = true
need-app = true
enable-threads = true
die-on-term = true
vacuum = true
single-interpreter = true
lazy-apps = true
processes = $(NAUTOBOT_UWSGI_PROCESSES)
threads = $(NAUTOBOT_UWSGI_THREADS)
listen = 128
buffer-size = 65535
harakiri = 120
; uWSGI sizes its tables from RLIMIT_NOFILE, and containerd sets ~1e9: cap it or it is OOM-killed
max-fd = $(NAUTOBOT_UWSGI_MAX_FD)
static-map = /static=/opt/nautobot/static
static-gzip-all = true
http-keepalive = 1
