# Assembles the Nautobot image: the venv, collected static files and config under
# /opt/nautobot on Wolfi's python-3.14. Nonroot (uid 1001), multi-arch, read-only-rootfs
# friendly: mount a writable /tmp and /var/lib/nautobot (media, git, jobs). uWSGI on 8080.
# Other roles run the same image: nautobot-server post_upgrade --no-collectstatic |
# createsuperuser --no-input | celery worker | celery beat. Configure with NAUTOBOT_*.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - libpq-18           # before the app: keeps the solver off the libpq-19 provider
    - busybox
    - quench-nautobot@local

accounts:
  groups:
    - groupname: nautobot
      gid: 1001
  users:
    - username: nautobot
      uid: 1001
      gid: 1001
      homedir: /var/lib/nautobot
  run-as: 1001

paths:
  - path: /var/lib/nautobot
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o755

entrypoint:
  command: /opt/nautobot/venv/bin/nautobot-server start --ini /opt/nautobot/uwsgi.ini

environment:
  PATH: /opt/nautobot/venv/bin:/usr/bin:/bin
  NAUTOBOT_ROOT: /opt/nautobot
  NAUTOBOT_CONFIG: /opt/nautobot/nautobot_config.py
  NAUTOBOT_UWSGI_PROCESSES: "3"
  NAUTOBOT_UWSGI_THREADS: "2"
  NAUTOBOT_UWSGI_MAX_FD: "4096"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

work-dir: /var/lib/nautobot

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-nautobot"
  org.opencontainers.image.licenses: "Apache-2.0"
