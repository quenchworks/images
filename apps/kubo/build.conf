# kubo (IPFS): from-source via melange (Go build of cmd/ipfs from the git tag tarball).
# Latest patch of the last 3 minor lines (0.41, 0.42, 0.43). Each release pins its
# source tarball by sha256. Static Go binary, no CGO. The version is a constant in
# version.go, so no -X is needed for `ipfs version`; the tag is stamped as
# taggedRelease the way upstream's Makefile does.
FROM_SOURCE=1
VERSIONS=(0.41.0 0.42.0 0.43.1)
declare -A SHA256=(
  [0.41.0]=e9f6056c4d66da55f2632ec814f2d3d8dc61d8d97b9e4d2f0ed4cfa5a9d63537
  [0.42.0]=8b80786f547b2afbfb0b52811462020f5c38c0887d067436238e4804f4727fc6
  [0.43.1]=f8c9a584a4588a469a3029bc10d7334f63552678a07b9f8cd530345e666f2646
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
