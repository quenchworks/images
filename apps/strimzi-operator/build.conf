# strimzi-operator: the Strimzi operator image (cluster-operator, topic-operator,
# user-operator and kafka-init share it upstream, quay.io/strimzi/operator).
# Built from the GitHub source tag with the Wolfi JDK 21 + Maven (the release
# ships only install YAML, no jars), laid out as upstream's image: /opt/strimzi/
# {bin,lib}, uid 1001, no ENTRYPOINT, because the operator and its Deployment pass
# /opt/strimzi/bin/<component>_run.sh as container args.
# Newest line only (1.2.0); add older lines when one is needed by a chart.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(1.2.0)
declare -A SHA256=(
  [1.2.0]=ba6a881d71a3f8eba3041057d1c3a2cd1bd737ff1467807df2c7afdee278dbcd
)
render() { echo "s/__VER__/$1/g; s/__SHA256__/${SHA256[$1]}/g"; }
