# Builds the Strimzi operator from source: `mvn install` over the reactor (minus
# systemtest) emits the cluster-operator, topic-operator, user-operator and
# kafka-init -dist.zip assemblies, and this recipe unpacks them into upstream's
# image layout (docker-images/operator/Dockerfile): /opt/strimzi/bin holds the
# filtered *_run.sh scripts plus launch_java.sh, /opt/strimzi/lib the union of
# the four runtime classpaths. The jars are noarch; the arch comes from the JRE.
package:
  name: quench-strimzi-operator
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Strimzi operator (cluster, topic, user operators and kafka-init), packaged on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - openjdk-21-jre   # maven.compiler.release=21 upstream; the scanned CVE surface
      - bash             # every run script is bash
      - busybox
      - tini             # launch_java.sh execs /usr/bin/tini -w -e 143 -- java ...
      - openssl          # certificate-issuer's OpenSslCertIssuer shells out to it

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - bash             # config-model-generator/build-config-models.sh
      - ca-certificates-bundle
      - openjdk-21
      - openjdk-21-default-jvm
      - maven-3.9
      - yq               # tools/kafka-versions-tools.sh parses kafka-versions.yaml with it

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/strimzi/strimzi-kafka-operator/archive/refs/tags/${{package.version}}.tar.gz
      expected-sha256: "__SHA256__"
  - runs: |
      set -eux
      export JAVA_HOME=/usr/lib/jvm/java-21-openjdk
      export PATH="${JAVA_HOME}/bin:${PATH}"
      # Hermetic local repo. config-model-generator runs a NESTED mvn from its
      # build script, which reads MAVEN_OPTS and MVN_ARGS too, and needs the
      # reactor modules before it INSTALLED (hence install, not package).
      export MAVEN_OPTS="-Dmaven.repo.local=$(pwd)/.m2repo -Duser.home=$(pwd)"
      # --- QuenchWorks CVE floors (CLI properties beat the pom's own) ---------
      #   jackson 2.x 2.22.1 -> 2.22.3: CVE-2026-89407 (HIGH), CVE-2026-19032, CVE-2026-68497.
      #     jackson-annotations stays on the pom's 2.22 (annotations has no patch line).
      J=2.22.3
      export MVN_ARGS="-B -ntp -DskipTests -Dmaven.javadoc.skip=true -Dcheckstyle.skip -Dspotbugs.skip -Dfasterxml.jackson-core.version=$J -Dfasterxml.jackson-databind.version=$J -Dfasterxml.jackson-dataformat.version=$J -Dfasterxml.jackson-datatype.version=$J -Dfasterxml.jackson-jaxrs.version=$J"
      # Two pins have no pom property, so they go into the root dependencyManagement
      # (first in the block; neither GAV is declared there already, checked on 1.2.0):
      #   tools.jackson.core 3.1.5 -> 3.1.7 (Jackson 3, transitive): CVE-2026-89407,
      #     CVE-2026-19032 (core 3.1.7), CVE-2026-68497 (databind 3.1.6).
      #   at.yawk.lz4:lz4-java 1.10.2 -> 1.11.4 (via kafka-clients): CVE-2026-106449/50/51.
      if grep -q -e '<groupId>tools.jackson.core</groupId>' -e '<artifactId>lz4-java</artifactId>' pom.xml; then
        echo "root pom now declares a pinned GAV itself; revisit the pin"; exit 1
      fi
      PIN='<dependency><groupId>tools.jackson.core</groupId><artifactId>jackson-core</artifactId><version>3.1.7</version></dependency>'
      PIN="$PIN"'<dependency><groupId>tools.jackson.core</groupId><artifactId>jackson-databind</artifactId><version>3.1.7</version></dependency>'
      PIN="$PIN"'<dependency><groupId>at.yawk.lz4</groupId><artifactId>lz4-java</artifactId><version>1.11.4</version></dependency>'
      sed -i "/<dependencyManagement>/{n;s|<dependencies>|<dependencies>$PIN|}" pom.xml
      test "$(grep -c '<version>3.1.7</version>' pom.xml)" = 2
      grep -q '<version>1.11.4</version>' pom.xml
      mvn $MVN_ARGS install -pl '!systemtest'

      bin=docker-images/artifacts/binaries
      dest="${{targets.destdir}}/opt/strimzi"
      install -d "$dest/bin" "$dest/lib"
      for c in cluster-operator topic-operator user-operator kafka-init; do
        z="$bin/$c-${{package.version}}-dist.zip"
        test -f "$z"
        unzip -qo "$z" -d "$dest"
      done
      install -m 0755 docker-images/operator/scripts/launch_java.sh "$dest/bin/"
      chmod 0755 "$dest"/bin/*.sh
      for s in cluster_operator_run.sh topic_operator_run.sh user_operator_run.sh kafka_init_run.sh launch_java.sh; do
        test -x "$dest/bin/$s"
      done
      # the filtered scripts must name a real classpath, not the raw @tokens@
      # every pin must have reached the shipped classpath
      for j in jackson-databind-$J tools.jackson.core.jackson-databind-3.1.7 tools.jackson.core.jackson-core-3.1.7 lz4-java-1.11.4; do
        ls "$dest"/lib/*"$j".jar >/dev/null || { echo "pin $j missing from lib/"; ls "$dest/lib"; exit 1; }
      done
      if grep -l '@project\.' "$dest"/bin/*.sh; then echo "unfiltered run script"; exit 1; fi

test:
  pipeline:
    - runs: |
        test -x /opt/strimzi/bin/cluster_operator_run.sh
        ls /opt/strimzi/lib/io.strimzi.cluster-operator-*.jar
