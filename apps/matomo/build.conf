# Matomo (matomo-org/matomo): the free/libre web-analytics platform, packaged from
# the OFFICIAL build tarball at builds.matomo.org/matomo-<VER>.tar.gz. That tarball
# is the finished, deployable application -- it already carries the vendored Composer
# dependencies and the built front-end assets, so there is nothing to compile: we
# `fetch` it (sha256-pinned per version) and lay it down under /var/www/html. The PHP
# runtime (php-8.3 + FPM + the extension set Matomo needs) and nginx come from Wolfi
# (declared in apko.yaml), not from this package. image+chart (chart wires MySQL).
#
# Latest patch of the last 3 MINOR lines (5.10, 5.11, 5.12). Matomo maintains a single
# active major (5.x); tag = X.Y.Z (no `v` prefix), which is also the tarball version.
# 2026-07-27: added 5.12.0 and dropped 5.9.0 -- the window is 3 (build-matomo.yml's
# prep job builds only the last 3 VERSIONS entries). 5.12.0 still declares
# $piwik_minimumPHPVersion = '7.2.5' and unpacks to a top-level matomo/ dir, so the
# php-8.3 runtime in apko.yaml and `strip-components: 0` are unchanged.
FROM_SOURCE=0
# BLOCKED 2026-07-27: not our code — the bundled Wolfi `nginx-stable` apk resolves to
# 1.30.2-r0 (Wolfi's NEWEST) while Trivy requires 1.30.4-r2 for CVE-2026-42055 (HIGH)
# and CVE-2026-48142 (MEDIUM). Those land on 6 nginx subpackages x 2 CVEs = 12 findings
# on EVERY band, so no matomo version can gate today. The published images are clean
# (they predate the advisory); a rebuild is what fails. Also why the 5.12.0 band was
# NOT added — it would only add a version that cannot ship.
# UNBLOCK when: Wolfi publishes nginx-stable >= 1.30.4-r2.
BLOCKED=1
VERSIONS=(5.10.1 5.11.2)
declare -A SHA256=(
  [5.10.1]=4cfd6043738085d836204b24a1cbcfe958419075045c576ae7e3efa268d49d70
  [5.11.2]=ceb9c6111fabce8541efea22548bd30c602e4067b825fc29fbc6b2b6229b56f1
  [5.12.0]=ca24145dbf721a027c3c538bd6dc97b57126802be26aa0ad3740f0c4a706655d
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
