# Matomo (matomo-org/matomo): the free/libre web-analytics platform, packaged from
# the OFFICIAL build tarball at builds.matomo.org/matomo-<VER>.tar.gz. That tarball
# is the finished, deployable application -- it already carries the vendored Composer
# dependencies and the built front-end assets, so there is nothing to compile: we
# `fetch` it (sha256-pinned per version) and lay it down under /var/www/html. The PHP
# runtime (php-8.3 + FPM + the extension set Matomo needs) comes from Wolfi and the web
# tier from QuenchWorks' own nginx built FROM SOURCE (quench-nginx, apps/nginx -- hence
# FROM_SOURCE=1), both declared in apko.yaml rather than in this package.
# image+chart (chart wires MySQL).
#
# Latest patch of the last 3 MINOR lines (5.10, 5.11, 5.12). Matomo maintains a single
# active major (5.x); tag = X.Y.Z (no `v` prefix), which is also the tarball version.
# 2026-07-27: added 5.12.0 and dropped 5.9.0 -- the window is 3 (build-matomo.yml's
# prep job builds only the last 3 VERSIONS entries, so a 4th entry would silently never
# be built). 5.12.0 still declares $piwik_minimumPHPVersion = '7.2.5' and unpacks to a
# top-level matomo/ dir, so the php-8.3 runtime in apko.yaml and `strip-components: 0`
# are unchanged.
FROM_SOURCE=1
#
# UNBLOCKED 2026-07-30. This was BLOCKED on 2026-07-27 for the fact that Wolfi's newest
# `nginx-stable` apk is 1.30.2-r0 while Trivy requires 1.30.4-r2 for CVE-2026-42055
# (HIGH) + CVE-2026-48142 (MEDIUM) -- 6 nginx subpackages x 2 CVEs = 12 findings on
# every band. The FACT was right; the CONCLUSION ("no matomo version can gate today")
# was WRONG: it assumed Wolfi's apk is the only way to get nginx. It is not. apps/nginx
# is FROM_SOURCE and builds nginx 1.30.4 as `quench-nginx`, which is exactly how
# apps/drupal, apps/nextcloud and apps/phpmyadmin already dodge this CVE pair. Swapping
# nginx-stable -> quench-nginx@local in apko.yaml removed all 12 findings; 5.10.1,
# 5.11.2 and the restored 5.12.0 each gate 0 fixable CVEs on x86_64 + aarch64.
# Do NOT re-derive the old conclusion: waiting on Wolfi is not the only option.
# 2026-08-02: 5.10.1 DROPPED, so this line ships two bands instead of three. After the
# twig 3.11.3 -> 3.28.0 swap cleared 14 advisories on every band, CI found ONE finding
# left and only on the oldest band: symfony/monolog-bridge v5.4.45, CVE-2026-45077
# (HIGH), fixed in 5.4.52. 5.11.2 and 5.12.0 already vendor a fixed bridge and both
# gate 0 fixable on both arches.
# Dropping the band rather than swapping a second vendored package: the swap machinery
# is justified for twig, which every supported band shares, but 5.10 is superseded by
# two clean newer bands and each older band keeps accreting stale vendored deps that
# only it carries. Re-add 5.10.x only if upstream ships a 5.10 patch that refreshes
# its vendor tree.
VERSIONS=(5.11.2 5.12.0)
declare -A SHA256=(
  [5.11.2]=ceb9c6111fabce8541efea22548bd30c602e4067b825fc29fbc6b2b6229b56f1
  [5.12.0]=ca24145dbf721a027c3c538bd6dc97b57126802be26aa0ad3740f0c4a706655d
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
