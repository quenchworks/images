# Assembles the Matomo runtime image: the Matomo application tree (quench-matomo) +
# a hardened Wolfi PHP 8.3 runtime with php-fpm + the extension surface Matomo's
# System Check requires, plus Wolfi's nginx. All under supervisord. Minimal, nonroot
# (uid/gid 1001), multi-arch, read-only-rootfs friendly. SBOM by apko.
#
# CLEAN-ROOM: nothing is inherited from an upstream Matomo/Bitnami image. The whole
# runtime is reconstructed from Wolfi packages here; the app tree + all the runtime
# config come from the quench-matomo@local package.
#
# Ports:
#   8080/tcp  nginx -- serves /var/www/html, FastCGI-passes Matomo's PHP entry points
#                      (nonroot can't bind <1024)
#   9000/tcp  php-fpm (loopback only; nginx -> 127.0.0.1:9000)
#
# Read-only rootfs: the only writable surfaces (emptyDir/PVC/tmpfs-friendly) are
#   * /var/www/html/tmp     -- Matomo's cache/sessions/templates_c/logs (emptyDir)
#   * /var/www/html/config  -- config.ini.php (generated by the installer; PVC)
#   * /tmp                  -- supervisord pid/sock, nginx pid + temp paths, php sessions
# Everything else (vendor/, core/, plugins/, /etc, the binaries) stays read-only.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - busybox
    - bash                          # entrypoint is /bin/sh; bash for interactive debugging
    - ca-certificates-bundle
    - supervisor                    # keeps php-fpm + nginx alive
    - nginx-stable                  # Wolfi nginx; pulls nginx-stable-config (mime.types, fastcgi_params)
    - quench-matomo@local           # the app tree + nginx/php-fpm/supervisor wiring + entrypoint
    # PHP 8.3 runtime + FPM + the extensions Matomo's System Check requires (pdo_mysql,
    # gd, mbstring, dom/xml/simplexml, curl, zip, gmp, intl) plus opcache. Each ext is a
    # .so package + its -config drop-in; BOTH are needed for `php -m` to load it.
    - php-8.3
    - php-8.3-fpm
    - php-8.3-fpm-config
    - php-8.3-config
    - php-8.3-opcache
    - php-8.3-opcache-config
    - php-8.3-pdo
    - php-8.3-pdo-config
    - php-8.3-mysqlnd              # native MySQL driver backend (pdo_mysql/mysqli need it)
    - php-8.3-mysqlnd-config
    - php-8.3-pdo_mysql             # Matomo's DB driver (MySQL/MariaDB)
    - php-8.3-pdo_mysql-config
    - php-8.3-mysqli
    - php-8.3-mysqli-config
    - php-8.3-gd                    # image/graph rendering
    - php-8.3-gd-config
    - php-8.3-mbstring
    - php-8.3-mbstring-config
    - php-8.3-xml
    - php-8.3-xml-config
    - php-8.3-dom
    - php-8.3-dom-config
    - php-8.3-simplexml
    - php-8.3-simplexml-config
    - php-8.3-curl
    - php-8.3-curl-config
    - php-8.3-openssl
    - php-8.3-openssl-config
    - php-8.3-zip
    - php-8.3-zip-config
    - php-8.3-gmp                   # big-int math (recommended by Matomo)
    - php-8.3-gmp-config
    - php-8.3-intl                  # locale/formatting
    - php-8.3-intl-config
    - php-8.3-bcmath
    - php-8.3-bcmath-config
    - php-8.3-ctype
    - php-8.3-ctype-config
    - php-8.3-iconv
    - php-8.3-iconv-config
    - php-8.3-fileinfo
    - php-8.3-fileinfo-config
    - php-8.3-phar
    - php-8.3-phar-config
    - php-8.3-posix
    - php-8.3-posix-config
    - php-8.3-sodium
    - php-8.3-sodium-config

accounts:
  groups:
    - groupname: matomo
      gid: 1001
  users:
    - username: matomo
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/bin/matomo-entrypoint.sh

work-dir: /var/www/html

paths:
  # Matomo's writable cache tree (cache, sessions, templates_c, logs) -- emptyDir/tmpfs.
  - path: /var/www/html/tmp
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o755
    recursive: true
  # config/ holds the installer-generated config.ini.php -- a writable volume (PVC).
  - path: /var/www/html/config
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o755
    recursive: true
  # /tmp holds supervisord pid/sock, nginx pid + temp dirs, php session files.
  - path: /tmp
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o1777

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-matomo"
  org.opencontainers.image.licenses: "GPL-3.0-or-later"
