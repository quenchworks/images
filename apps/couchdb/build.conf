# STATUS: ZLIB-ONLY as of 2026-09-16. Measured, not assumed: run 35066506852
# on af0623d gated with exactly one finding, zlib CVE-2026-85091, on every
# version and both arches. Nothing else in this image is flagged.
#
# Wolfi is at 1.3.2.1_rc20260601-r0 and the advisory wants 1.3.3-r0, which
# upstream madler/zlib has never tagged. Downgrading to Wolfi's 1.3.1-r51
# is not a way out either: it predates the 1.3.2-r0 fix for CVE-2026-27171.
#
# BLOCKED=1 skips build+merge so sweeps stop burning a red run here. Clear
# it with scripts/blocked.py --dispatch once Wolfi ships zlib 1.3.3-r0.
# couchdb: from-source via melange (fetch the apache source tarball, sha256).
# Latest 3 stable releases in the QUICKJS era (3.4+). NOTE: 3.3.x predates the
# bundled QuickJS view server and used SpiderMonkey/mozjs, which the recipe drops
# to keep the mozjs CVE surface off the image -- so the buildable, 0-CVE set is
# 3.4.3 / 3.5.1 / 3.5.2 (the 3 newest QuickJS-era releases).
# __VER__ = version; __SHA256__ = that source tarball's sha256.
BLOCKED=1
FROM_SOURCE=1
VERSIONS=(3.4.3 3.5.1 3.5.2)
declare -A SHA256=(
  [3.4.3]=0357511b6fed70e3e64f4e75aa5d7cc2000cb0f264ef301702b1816427f72f20
  [3.5.1]=c22cf31d6d91a3f5aa04f0cad493babdc723213494cb5e6170a507d359c50136
  [3.5.2]=e561102aaadfdda1e499e6e9e12d2473433291b608bcd390bcbcf590bbb6cf68
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
