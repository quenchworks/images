# Kubescape storage, built from the kubescape/storage tag with the floor pass (otel train from apps/kubescape).
package:
  name: quench-kubescape-storage
  version: __VER__
  epoch: 0
  description: "Quenchworks Kubescape storage"
  copyright:
    - license: Apache-2.0

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-1.27

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/kubescape/storage/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      set -eu
      export CGO_ENABLED=0 GOFLAGS=-mod=mod GOTOOLCHAIN=local GOWORK=off
      # x/* and grpc sit at what the 1.47.0 otel train requires (go get takes exact versions).
      # otel floats as ONE train at 1.47.0: the sdk/log fix (CVE-2026-81872) needs otel/log 0.21+,
      # which dropped log.Value, so otelslog and uptrace's otelutil/otelzap must move to the
      # releases built against it (otelslog 0.21.0, otelutil 0.4.0), and those require 1.47.0.
      # The CLI's trivy/cilium/containerd/x/image floors are left out: raising them broke this
      # component's build (moby/moby split, k8s skew); its own scan decides what moves.
      # Its scan (run 37735425296) flagged cilium 1.17.16: same-line patch 1.17.17.
      FLOOR="golang.org/x/crypto@v0.57.0 golang.org/x/net@v0.59.0 golang.org/x/text@v0.42.0 golang.org/x/term@v0.46.0 golang.org/x/mod@v0.41.0 golang.org/x/sys@v0.48.0 google.golang.org/grpc@v1.84.0 go.opentelemetry.io/otel@v1.47.0 go.opentelemetry.io/otel/metric@v1.47.0 go.opentelemetry.io/otel/trace@v1.47.0 go.opentelemetry.io/otel/sdk@v1.47.0 go.opentelemetry.io/otel/sdk/metric@v1.47.0 go.opentelemetry.io/otel/log@v1.47.0 go.opentelemetry.io/otel/sdk/log@v1.47.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.47.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.47.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.47.0 go.opentelemetry.io/otel/exporters/otlp/otlpmetric/otlpmetricgrpc@v1.47.0 go.opentelemetry.io/otel/exporters/otlp/otlpmetric/otlpmetrichttp@v1.47.0 go.opentelemetry.io/otel/exporters/stdout/stdouttrace@v1.47.0 go.opentelemetry.io/otel/exporters/otlp/otlplog/otlploghttp@v0.23.0 go.opentelemetry.io/contrib/bridges/otelslog@v0.21.0 go.opentelemetry.io/contrib/instrumentation/net/http/otelhttp@v0.72.0 go.opentelemetry.io/contrib/instrumentation/google.golang.org/grpc/otelgrpc@v0.72.0 go.opentelemetry.io/contrib/instrumentation/runtime@v0.72.0 go.opentelemetry.io/contrib/instrumentation/net/http/httptrace/otelhttptrace@v0.72.0 go.opentelemetry.io/contrib/processors/minsev@v0.17.0 go.opentelemetry.io/contrib/detectors/gcp@v1.47.0 github.com/uptrace/uptrace-go@v1.47.0 github.com/uptrace/opentelemetry-go-extra/otelutil@v0.4.0 github.com/uptrace/opentelemetry-go-extra/otelzap@v0.4.0 github.com/cilium/cilium@v1.17.17"
      # Go semver order (a release outranks its prereleases); busybox sort -V does not.
      vlt() { awk -v a="${1#v}" -v b="${2#v}" 'function pp(s,  p){sub(/\+.*/,"",s);p=index(s,"-");if(p){C=substr(s,1,p-1);P=substr(s,p+1)}else{C=s;P=""}} function cmp(x,y,  i,n,m,X,Y){n=split(x,X,".");m=split(y,Y,".");for(i=1;i<=n&&i<=m;i++){if(X[i]==Y[i])continue;if(X[i]~/^[0-9]+$/&&Y[i]~/^[0-9]+$/)return (X[i]+0<Y[i]+0)?-1:1;if(X[i]~/^[0-9]+$/)return -1;if(Y[i]~/^[0-9]+$/)return 1;return (X[i]<Y[i])?-1:1}return (n<m)?-1:(n>m)?1:0} BEGIN{pp(a);ca=C;pa=P;pp(b);cb=C;pb=P;c=cmp(ca,cb);if(c==0){if(pa==pb)c=0;else if(pa=="")c=1;else if(pb=="")c=-1;else c=cmp(pa,pb)}exit !(c<0)}'; }
      # FLOORS, not pins: raise a module only where go.mod has it below the floor.
      need=""
      for mv in $FLOOR; do
        have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${mv%@*}" 2>/dev/null)"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        vlt "$have" "${mv#*@}" && need="$need $mv"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || go get $need
      go mod tidy
      B="${{targets.destdir}}/usr/bin"
      mkdir -p "$B"
      # github.com/docker/docker v28.5.2+incompatible carries CVE-2026-33997 (the daemon's
      # plugin install); its fix exists only on the moby/moby path. Record which docker/docker
      # packages each binary links, and fail if any daemon, plugin or API server code is one.
      for p in . ./cmd/migration ./cmd/cpexport; do
        echo "docker/docker packages linked by $p:"; go list -deps "$p" | grep '^github.com/docker/docker/' || true
        if go list -deps "$p" | grep -E '^github.com/docker/docker/(daemon|plugin|api/server)'; then
          echo "$p links Docker daemon code: CVE-2026-33997 applies"; exit 1
        fi
      done
      go build -buildvcs=false -trimpath -ldflags "-s -w" -o "$B/storage" .
      go build -buildvcs=false -trimpath -ldflags "-s -w" -o "$B/migration" ./cmd/migration
      go build -buildvcs=false -trimpath -ldflags "-s -w" -o "$B/cpexport" ./cmd/cpexport
      v="$(go version -m "$B/storage" | awk '$2 == "golang.org/x/sys" { print $3 }')"
      [ -z "$v" ] || ! vlt "$v" v0.47.0 || { echo "FATAL: links golang.org/x/sys $v"; exit 1; }

test:
  pipeline:
    - runs: |
        test -x /usr/bin/storage
        test -x /usr/bin/migration
        test -x /usr/bin/cpexport
