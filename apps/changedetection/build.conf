# changedetection.io (dgtlmoon/changedetection.io, Apache-2.0): website change detection and
# monitoring with visual diffs, filters, an API and notifications. From the release tag via melange:
# requirements.txt installed with uv into a venv on Wolfi python-3.13. Playwright and OpenCV are left
# out (both optional upstream: pages are fetched over HTTP, or through a separate browser service via
# PLAYWRIGHT_DRIVER_URL, and image diffs fall back to pixelmatch). LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(0.70.3)
declare -A SHA256=(
  [0.70.3]=319288473f8506904663eadf6b5a6c46f0ab4e001ff8015bac24770d66f6cda9
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
