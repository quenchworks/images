# cluster-autoscaler (Kubernetes Cluster Autoscaler): from-source via melange, Go build of
# the cluster-autoscaler/ module from the kubernetes/autoscaler tag tarball
# (cluster-autoscaler-<ver>). Newest patch of the last 3 minor lines, which track
# Kubernetes minors. Every cloud provider is compiled in, like upstream's image.
FROM_SOURCE=1
VERSIONS=(1.34.5 1.35.2 1.36.1)
declare -A SHA256=(
  [1.34.5]=b7bb14b89e45a6cbd3a4263516987d81ea68f261588626d03e98e3fbca0a8fbb
  [1.35.2]=1dd6b28fc88ee296425860027f15ca915b8ef62cc9b5959778fba2e55e0b8cfa
  [1.36.1]=63b599b0929b3e28aba26637be1c2e2cda747f808559816ba9312a5eac481cb9
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
