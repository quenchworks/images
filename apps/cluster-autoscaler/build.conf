# cluster-autoscaler (Kubernetes Cluster Autoscaler): from-source via melange, Go build of
# the cluster-autoscaler/ module from the kubernetes/autoscaler tag tarball
# (cluster-autoscaler-<ver>). Newest patch of the last 3 minor lines, which track
# Kubernetes minors. Every cloud provider is compiled in, like upstream's image.
FROM_SOURCE=1
VERSIONS=(1.34.6 1.35.3 1.36.2)
declare -A SHA256=(
  [1.34.6]=558c150c75123a063f7760b3446accb9d1e0df5532fb1830c36b3380b1e035b2
  [1.35.3]=064fb5361c53141e23b12dd851c55506c1a0c9412d97e2cc8d4c4b3303b8e9ad
  [1.36.2]=86acd7fe6f6cadd1016102d94cf22674619b4156462e482839c74915bb1cb8fd
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
