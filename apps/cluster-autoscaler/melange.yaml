# Builds the Kubernetes Cluster Autoscaler from source onto Wolfi. Single static Go binary,
# no CGO, every cloud provider compiled in (upstream's default build, no builder tags).
# The Makefile stamps k8s.io/autoscaler/cluster-autoscaler/version.ClusterAutoscalerVersion.
package:
  name: quench-cluster-autoscaler
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Kubernetes Cluster Autoscaler, built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/kubernetes/autoscaler/archive/refs/tags/cluster-autoscaler-${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - working-directory: cluster-autoscaler
    runs: |
      set -eu
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      export GOTOOLCHAIN=local
      # 0-CVE FLOORS, not pins (docs/go-module-float.md): raise a module only where go.mod
      # has it below the floor; a module absent from the graph is skipped. None of these
      # sit behind go.mod's replaces (those pin the k8s.io staging repos). cel-go 0.29.0
      # and the otel 1.45.0 family are the set the CSI sidecars float against the same
      # k8s.io libraries.
      FLOOR="golang.org/x/crypto@v0.56.0 golang.org/x/mod@v0.40.0 golang.org/x/net@v0.58.0 golang.org/x/text@v0.41.0 golang.org/x/sys@v0.47.0 google.golang.org/grpc@v1.83.2 github.com/google/cel-go@v0.29.0 github.com/opencontainers/selinux@v1.13.0 go.opentelemetry.io/otel@v1.45.0 go.opentelemetry.io/otel/metric@v1.45.0 go.opentelemetry.io/otel/trace@v1.45.0 go.opentelemetry.io/otel/sdk@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.45.0"
      need=""
      for mv in $FLOOR; do
        have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${mv%@*}" 2>/dev/null)"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        [ "$(printf '%s\n%s\n' "$have" "${mv#*@}" | sort -V | head -1)" = "${mv#*@}" ] || need="$need $mv"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || go get $need
      go mod tidy
      go build -trimpath \
        -ldflags "-s -w -X k8s.io/autoscaler/cluster-autoscaler/version.ClusterAutoscalerVersion=${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/cluster-autoscaler" .
