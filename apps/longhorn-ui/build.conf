# longhorn-ui (longhorn/longhorn-ui): the Longhorn web UI, a webpack bundle served by nginx, which
# proxies /v1 to longhorn-manager. Built from source with Node 20 as upstream's Dockerfile does;
# upstream's start-nginx.sh and nginx.conf.template are kept, uid 499 like upstream.
# Latest patch of the last 3 minor lines (the Longhorn release lines).
FROM_SOURCE=1
VERSIONS=(1.11.3 1.12.1 1.13.0)
declare -A SHA256=(
  [1.11.3]=b96e93831406a738947644d7998ffb1f3bb65ee59e2ac9c46452fb183d9851f4
  [1.12.1]=3f4986fefe94a3961c9389430b9a915b4232b0a6e42791c223e35ed57a5894d2
  [1.13.0]=c62ba488150176c7fb596e7726047de16fdf4fe3ab003f7ec4d13d0701e2c686
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
