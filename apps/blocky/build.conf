# Blocky (0xERR0R/blocky, Apache-2.0): DNS proxy and ad blocker for the local network, with
# blocklists, conditional forwarding, DNS-over-HTTPS/TLS upstreams, caching and Prometheus
# metrics. From source via melange: one static Go binary stamped with upstream's
# -X util.Version. LATEST-ONLY: upstream ships one release line.
FROM_SOURCE=1
VERSIONS=(0.36.0)
declare -A SHA256=(
  [0.36.0]=98b613b88c2b960b091ebfa7c3622a325e47528da6c636d313efdf183a8bd254
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
