# Blocky runtime: blocky is the entrypoint; it reads /app/config.yml unless --config points elsewhere.
# Nonroot 1001, so listen on ports above 1023 unless the pod grants NET_BIND_SERVICE.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-blocky@local

accounts:
  groups:
    - groupname: blocky
      gid: 1001
  users:
    - username: blocky
      uid: 1001
      gid: 1001
  run-as: 1001

environment:
  BLOCKY_CONFIG_FILE: /app/config.yml

entrypoint:
  command: /usr/bin/blocky

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-blocky"
  org.opencontainers.image.licenses: "Apache-2.0"
  org.opencontainers.image.version: "__VER__"
