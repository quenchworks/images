# Builds the Sealed Secrets controller from source onto Wolfi. Static Go binary, no CGO.
# The repo is a single Go module (github.com/bitnami/sealed-secrets) with two commands:
# cmd/controller (the cluster-side unsealing controller) and cmd/kubeseal (the client
# CLI). Only the controller belongs in a server image, so that is all we build. The
# version is stamped via -X main.VERSION so `controller --version` reports the real
# release. Output is a signed APK in Quenchworks' own repo. No upstream distro binaries.
package:
  name: quench-sealed-secrets
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Sealed Secrets controller, built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-1.26

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/bitnami-labs/sealed-secrets/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      export GOTOOLCHAIN=local   # use the installed go-1.26, don't fetch a newer go.mod toolchain
      # 0-CVE gate: float the coherent golang.org/x/* set together (they share internal
      # APIs, so bumping one alone breaks the build). Older lines (0.36/0.37) pin net,
      # crypto, sys, text and oauth2 below their fixed versions; on 0.38.4 most of these
      # are already satisfied and the bump is a no-op. grpc/otel are not in this module's
      # graph, so they are deliberately absent from the float set.
      # 0-CVE FLOORS, not pins (docs/go-module-float.md): raise a module only where go.mod has it
      # below the floor; a module absent from the graph is skipped. Bare `go get` pins downgraded
      # newer upstream releases (found 2026-10-05).
      FLOOR="golang.org/x/net@v0.58.0 golang.org/x/crypto@v0.56.0 golang.org/x/sys@v0.47.0 golang.org/x/text@v0.41.0 golang.org/x/oauth2@v0.36.0"
      # Go semver order (a release outranks its prereleases); busybox sort -V does not.
      vlt() { awk -v a="${1#v}" -v b="${2#v}" 'function pp(s,  p){sub(/\+.*/,"",s);p=index(s,"-");if(p){C=substr(s,1,p-1);P=substr(s,p+1)}else{C=s;P=""}} function cmp(x,y,  i,n,m,X,Y){n=split(x,X,".");m=split(y,Y,".");for(i=1;i<=n&&i<=m;i++){if(X[i]==Y[i])continue;if(X[i]~/^[0-9]+$/&&Y[i]~/^[0-9]+$/)return (X[i]+0<Y[i]+0)?-1:1;if(X[i]~/^[0-9]+$/)return -1;if(Y[i]~/^[0-9]+$/)return 1;return (X[i]<Y[i])?-1:1}return (n<m)?-1:(n>m)?1:0} BEGIN{pp(a);ca=C;pa=P;pp(b);cb=C;pb=P;c=cmp(ca,cb);if(c==0){if(pa==pb)c=0;else if(pa=="")c=1;else if(pb=="")c=-1;else c=cmp(pa,pb)}exit !(c<0)}'; }
      need=""
      for mv in $FLOOR; do
        have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${mv%@*}" 2>/dev/null)"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        vlt "$have" "${mv#*@}" && need="$need $mv"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || go get $need
      go mod tidy
      go build -trimpath \
        -ldflags "-s -w -X main.VERSION=${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/controller" ./cmd/controller
