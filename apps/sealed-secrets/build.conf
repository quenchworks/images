# sealed-secrets: from-source via melange (Go build from the git tag tarball).
# Latest patch of the last 3 minor lines (0.38, 0.39, 0.40). Each release pins its
# source tarball by sha256. The image ships the CONTROLLER (cmd/controller), the
# cluster-side half of Sealed Secrets; kubeseal (cmd/kubeseal) is a client-side CLI
# and is deliberately NOT installed here. Single static Go binary, no CGO. Version
# is stamped into the binary via -X main.VERSION (upstream Makefile/.goreleaser).
FROM_SOURCE=1
VERSIONS=(0.38.4 0.39.1 0.40.0)
declare -A SHA256=(
  [0.38.4]=7076a3278ac29e5f3f8ac6676414e4c24f01303c1405b99a1caebe88f5977d7e
  [0.39.1]=f96f7edbf887852e5e2c0e05a4b2dcefa4cc2a93470b9c078e22974e7e8e2706
  [0.40.0]=d80d44401f3516d2b31c3e51dcd0826ad8ae90d976c2e86010be2c665ff23d99
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
