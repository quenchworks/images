# krakend (KrakenD Community Edition): from-source via melange (Go build of the
# CE distribution from the git tag tarball). Image + chart.
#
# NEWEST-ONLY. Not a toolchain-churn call -- upstream says it outright in
# SECURITY.md: "KrakenD Community Edition only fixes the latest version of the
# software, and does not patch prior versions." Shipping a 2.12/2.11 line would
# be shipping a line upstream will never patch, so the window is one release.
#
# Single static Go binary, no CGO. Version is stamped via
# -X github.com/luraproject/lura/v2/core.KrakendVersion so `krakend version`
# reports the real release (see melange.yaml for why that is the only ldflag
# from upstream's Makefile that actually resolves).
FROM_SOURCE=1
VERSIONS=(2.13.11 3.0.2)
declare -A SHA256=(
  [2.13.11]=eb69e9f515922d705d865ee75ee3cc9ea0d5787f6f5062c15b77ccb9bb702215
  [3.0.2]=8f05f699e3161ec7396011f5eaf0cf4995f0f9f2ff9b925e044e1668d1bdbaac
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
