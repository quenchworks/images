# opensearch-operator from the release tag, CGO-free; upstream stamps no version into the binary.
package:
  name: quench-opensearch-operator
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened opensearch-operator, built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/opensearch-project/opensearch-k8s-operator/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - runs: |
      set -eu
      cd opensearch-operator
      export CGO_ENABLED=0 GOTOOLCHAIN=local GOFLAGS=-mod=mod GOWORK=off
      # floors, raised only when below (a bare go get downgrades once upstream passes it); the
      # golang.org/x set moves together, as in the other recipes
      FLOOR="golang.org/x/crypto@v0.58.1-0.20261009181718-2f1f834330b2 golang.org/x/net@v0.62.0 golang.org/x/text@v0.43.0 golang.org/x/sys@v0.49.0"
      # otel moves as a family: otlptrace 1.33 and sdk 1.44 carry CVE-2026-81870 (fixed 1.45.0)
      FLOOR="$FLOOR go.opentelemetry.io/otel@v1.47.0 go.opentelemetry.io/otel/metric@v1.47.0 go.opentelemetry.io/otel/trace@v1.47.0 go.opentelemetry.io/otel/sdk@v1.47.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.47.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.47.0"
      need=""
      for f in $FLOOR; do
        have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${f%@*}")"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        [ "$(printf '%s\n%s\n' "$have" "${f#*@}" | sort -V | head -1)" = "${f#*@}" ] || need="$need $f"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || go get $need
      go mod tidy
      go build -trimpath -ldflags "-s -w" \
        -o "${{targets.destdir}}/usr/bin/opensearch-operator" .

test:
  pipeline:
    - runs: |
        opensearch-operator --help 2>&1 | grep -q -- -watch-namespace
