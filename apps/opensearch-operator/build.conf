# OpenSearch Operator (OpenSearch clusters and Dashboards, rolling upgrades, security config and
# TLS from OpenSearchCluster resources), from opensearch-project/opensearch-k8s-operator (Apache-2.0).
# From the release tag via melange: one static Go binary (opensearch-operator/main.go) and the house
# golang.org/x floor. Upstream stamps no version into the binary; the image label carries it.
# LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(3.0.0)
declare -A SHA256=(
  [3.0.0]=daccfe8130cc4534dedb008e4fbaee3e77395775ddade48bdb212aad1142bf8e
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
