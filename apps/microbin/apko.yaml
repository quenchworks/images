# MicroBin runtime: microbin on 8080 with its data (SQLite database and uploads) in /var/lib/microbin,
# the volume. Telemetry and update checks off. Nonroot uid 1001, multi-arch.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-microbin@local

accounts:
  groups:
    - groupname: microbin
      gid: 1001
  users:
    - username: microbin
      uid: 1001
      gid: 1001
      homedir: /var/lib/microbin
  run-as: 1001

work-dir: /var/lib/microbin

environment:
  MICROBIN_DATA_DIR: /var/lib/microbin
  MICROBIN_PORT: "8080"
  MICROBIN_DISABLE_TELEMETRY: "true"
  MICROBIN_DISABLE_UPDATE_CHECKING: "true"

paths:
  - path: /var/lib/microbin
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o750

entrypoint:
  command: /usr/bin/microbin

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-microbin"
  org.opencontainers.image.licenses: "BSD-3-Clause"
