# MicroBin from the release tag, built with cargo auditable against Wolfi OpenSSL.
package:
  name: quench-microbin
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened MicroBin pastebin, built from source on Wolfi"
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      # cargo auditable embeds the crate list in a .dep-v0 section; without it Trivy sees no crates
      - cargo-auditable
      - openssl-dev
      - pkgconf
      - rust-1.96

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/szabodanika/microbin/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - runs: |
      set -eu
      export CARGO_HOME="$(mktemp -d)"
      # link Wolfi's OpenSSL instead of the vendored copy
      sed -i '/^\[dependencies.openssl\]$/,/^$/{/^features = \["vendored"\]$/d}' Cargo.toml
      ! grep -q '"vendored"' Cargo.toml || { echo "FATAL: vendored openssl still enabled"; exit 1; }
      cargo update
      cargo auditable build --release --locked
      install -Dm755 target/release/microbin "${{targets.destdir}}/usr/bin/microbin"
      readelf -S "${{targets.destdir}}/usr/bin/microbin" | grep -q '\.dep-v0'
      readelf -d "${{targets.destdir}}/usr/bin/microbin" | grep -q 'libssl'
      "${{targets.destdir}}/usr/bin/microbin" --version | grep -F "${{package.version}}"

test:
  pipeline:
    - runs: microbin --version
