# MicroBin (szabodanika/microbin, BSD-3-Clause): a small pastebin and file-sharing server with private,
# read-only and encrypted uploads, expiry and an admin page, on SQLite. Images issue #68.
#
# Rust from the release tag with cargo auditable. The default features use OpenSSL; upstream vendors it,
# the recipe drops `vendored` so it links Wolfi's. The lockfile is refreshed with `cargo update` (all
# semver-compatible) for actix, bytes, hashbrown, openssl, ring, time, tokio and url/idna; rustls and rsa
# only come with the no-c-deps feature, which is not built. Telemetry and update checks are off in the
# image. The upstream default admin password (m1cr0b1n) is replaced by the chart.
# LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(2.1.0)
declare -A SHA256=(
  [2.1.0]=5e5310e07ef6e58583f7cc543b1e22ce2584ba4ae0a35c87b961effcd00d307c
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
