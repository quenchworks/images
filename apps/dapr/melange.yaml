# Builds Dapr from source onto Wolfi: the daprd sidecar and the control plane (operator,
# placement, sentry, injector, scheduler) in one package, static Go, no CGO, the
# allcomponents flavor. The chart runs each control-plane component from this image
# and the injector injects this image as the sidecar. Output is a signed APK in
# Quenchworks' own repo. No upstream distro binaries.
package:
  name: quench-dapr
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Dapr (sidecar and control plane), built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/dapr/dapr/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      set -eu
      export CGO_ENABLED=0
      export GOFLAGS="-mod=mod -buildvcs=false"
      export GO111MODULE=on
      export GOTOOLCHAIN=local
      # ---- 0-CVE module float (docs/go-module-float.md) ----------------------
      # FLOOR is a FLOOR, not a pin. A bare `go get mod@vX` fails silently in two
      # directions: it is a NO-OP when an upstream `replace` overrides it, and it
      # becomes a DOWNGRADE once upstream requires more than vX -- re-introducing
      # the CVE it was added to clear. So float only what is below the floor, then
      # assert the SHIPPED BINARY carries nothing below it.
      FLOOR="golang.org/x/net@v0.58.0 golang.org/x/text@v0.41.0 golang.org/x/crypto@v0.56.0 golang.org/x/sys@v0.47.0 golang.org/x/mod@v0.40.0 golang.org/x/oauth2@v0.36.0 google.golang.org/grpc@v1.83.2 go.opentelemetry.io/otel@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.45.0 go.opentelemetry.io/otel/sdk@v1.45.0 go.opentelemetry.io/otel/trace@v1.45.0 go.opentelemetry.io/otel/metric@v1.45.0 go.opentelemetry.io/otel/exporters/zipkin@v1.45.0 github.com/rabbitmq/amqp091-go@v1.13.0 github.com/go-chi/chi/v5@v5.2.4"
      MODS="$(echo "$FLOOR" | tr ' ' '\n' | cut -d@ -f1)"
      # prints "<mod>@<floor> (<tag> has <ver>)" for every module below its floor
      below_floor() {
        awk -v floor="$FLOOR" -v tag="$1" '
          BEGIN { n = split(floor, f, " ")
                  for (i = 1; i <= n; i++) { split(f[i], kv, "@"); want[kv[1]] = kv[2] } }
          ($1 in want) {
            split(substr($2, 2), g, "."); split(substr(want[$1], 2), w, ".")
            for (i = 1; i <= 3; i++) {
              if ((g[i] + 0) > (w[i] + 0)) next
              if ((g[i] + 0) < (w[i] + 0)) { print $1 "@" want[$1] " (" tag " has " $2 ")"; next }
            }
          }'
      }
      # `go list -m` prints "<mod> <ver>" or "<mod> <ver> => <mod> <ver>", so $NF is
      # the EFFECTIVE version and a replace cannot hide behind the require line.
      go list -m -e $MODS
      need="$(go list -m -e $MODS | awk 'NF >= 2 && $NF ~ /^v[0-9]/ { print $1, $NF }' | below_floor go.mod | awk '{ print $1 }')"
      if [ -n "$need" ]; then go get $need; fi
      go mod tidy
      # The float moves otelgrpc to 0.61, which dropped the gRPC interceptors, and the
      # scheduler embeds etcd server 3.5.33, which still calls them. etcd 3.6 fixed this
      # with a stats handler, but go-etcd-cron (the scheduler's cron engine, newest 0.12.8)
      # only builds against etcd 3.5. So vendor, and make the same one-line change etcd
      # 3.6 made; the block only runs with etcd's distributed tracing on.
      go mod vendor
      F=vendor/go.etcd.io/etcd/server/v3/etcdserver/api/v3rpc/grpc.go
      sed -i -e 's|chainUnaryInterceptors = append(chainUnaryInterceptors, otelgrpc.UnaryServerInterceptor(s.Cfg.ExperimentalTracerOptions...))|opts = append(opts, grpc.StatsHandler(otelgrpc.NewServerHandler(s.Cfg.ExperimentalTracerOptions...)))|' \
        -e '/chainStreamInterceptors = append(chainStreamInterceptors, otelgrpc.StreamServerInterceptor/d' "$F"
      grep -q 'grpc.StatsHandler(otelgrpc.NewServerHandler' "$F"
      ! grep -q 'otelgrpc.UnaryServerInterceptor\|otelgrpc.StreamServerInterceptor' "$F"
      export GOFLAGS="-mod=vendor -buildvcs=false"
      V=${{package.version}}
      LD="-s -w -X github.com/dapr/dapr/pkg/buildinfo.version=$V -X github.com/dapr/dapr/pkg/buildinfo.gitversion=v$V -X github.com/dapr/kit/logger.DaprVersion=$V"
      for b in daprd operator placement sentry injector scheduler; do
        go build -trimpath -tags=allcomponents -ldflags "$LD" -o "${{targets.destdir}}/usr/bin/$b" ./cmd/$b
        bad="$(go version -m "${{targets.destdir}}/usr/bin/$b" \
          | awk '$1 == "dep" || $1 == "=>" { print $2, $3 }' | below_floor "$b")"
        [ -z "$bad" ] || { echo "❌ 0-CVE float did not reach $b:"; echo "$bad"; exit 1; }
      done
