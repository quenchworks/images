# dapr: from-source via melange (Go build of the six binaries in cmd/ from the git tag
# tarball: daprd, operator, placement, sentry, injector, scheduler). Static Go, no CGO,
# the allcomponents sidecar flavor (upstream's default). Version stamped via -X like the
# Makefile.
#
# 1.18 and 1.17 only. 1.16.20 (still patched upstream) does not build with Go 1.26: its
# github.com/choleraehyq/pid dependency has amd64 assembly the assembler rejects
# ("expected pseudo-register; found R14"); 1.17 and 1.18 no longer carry it.
# Measured 2026-09-26.
FROM_SOURCE=1
VERSIONS=(1.17.18 1.18.9)
declare -A SHA256=(
  [1.17.18]=de958b3680cc99acfb546a84b187206791f319df52701b8c652d0f35f29fde61
  [1.18.9]=5389a2c1105e572abcd10372044d41e4bd0e38f422dd87c49fdf2fe247a0e9df
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
