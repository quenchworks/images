# Assembles the Dapr runtime image: daprd plus the control-plane binaries (operator,
# placement, sentry, injector, scheduler) under /usr/bin. Nonroot, multi-arch, SBOM by
# apko. The default command is the sidecar; the chart sets the command per component.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-dapr@local

accounts:
  groups:
    - groupname: dapr
      gid: 1001
  users:
    - username: dapr
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/bin/daprd

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-dapr"
  org.opencontainers.image.licenses: "Apache-2.0"
