# tyk: from-source via melange (Go build of the Tyk Gateway from the git tag
# tarball). Image-only (no chart). NEWEST-ONLY: just the newest stable release
# (github.com/TykTechnologies/tyk vX.Y.Z, no -alpha/-rc/-fips suffix). Single
# static Go binary, no CGO. Version is stamped via
# -X .../internal/build.Version so `tyk version` reports the real release.
FROM_SOURCE=1
# 2026-11-11 HOLD (go-jose v3, CVE-2026-116587/-116585/-116586, no v3 fix): the gateway's own JWT
# middleware parses JWKS with v3 (gateway/mw_jwt.go:147), reachable. Upstream moved to v4 in 891917d363
# (2026-10-29, +2169 lines incl. internal/jwkcompat); release-5.16 and release-5.15 carry it, release-5.14
# does not, and no tagged 5.14/5.15/5.16 release has it yet (5.13.5 and 5.8.20 LTS do). Unblock: bump to
# 5.16.1 / 5.15.2 when tagged; drop 5.14 unless a 5.14.x ships v4.
VERSIONS=(5.14.0 5.15.1 5.16.0)
declare -A SHA256=(
  [5.14.0]=4b09efce96d166c3ee68ad8cd57821f974ea4dfb73a7c4157d51744a9f9334bb
  [5.15.1]=c0b24ffc00bf02eedfcdf85fe7a0e4c7343aecb603dff2e0ad99ff34dc7abfa5
  [5.16.0]=d9d0911a85366780412d0fb515dae581b526a5b9f770c65fc9d9fdaa4f5a99b3
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
