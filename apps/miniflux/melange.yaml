# Builds Miniflux (github.com/miniflux/v2) from source onto Wolfi. Miniflux is a
# minimalist RSS/feed reader: a single static Go binary that embeds all of its
# assets (CSS/JS/templates/translations) via go:embed, so a plain `go build` at
# the repo root yields the complete server -- no Node/pnpm/vite step. Output is a
# signed APK in Quenchworks' own repo. No upstream distro binaries. Image-only
# (a server, no chart). Apache-2.0.
#
# CGO off: the PostgreSQL driver is pure-Go (github.com/lib/pq), so the binary is
# fully static and the runtime image carries no libc. The DB itself is the
# operator's concern -- Miniflux needs a PostgreSQL server at runtime (DATABASE_URL),
# which is NOT baked into this image.
#
# go.mod declares `go 1.26.0`; we build with go-1.26 (newest, clears stdlib CVE
# advisories) and GOTOOLCHAIN=local so the go.mod toolchain directive does not
# trigger a download. GOFLAGS=-mod=mod lets the module graph resolve any patched
# deps. The version is stamped via -X on internal/version.Version so `miniflux
# -version` reports the real release (not the "2.3.x-dev" build-info fallback).
package:
  name: quench-miniflux
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Miniflux (minimalist RSS/feed reader), built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      # Outbound TLS for fetching feeds, favicons, OAuth/OIDC and the DB over SSL.
      - ca-certificates-bundle
      # Timezone data: Miniflux schedules feed refresh/cleanup and renders user
      # timezones via time.LoadLocation, which needs the zoneinfo database.
      - tzdata

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-1.26

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/miniflux/v2/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - name: Build the miniflux binary (static, CGO off, assets embedded)
    runs: |
      set -eu
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      export GOTOOLCHAIN=local          # use the installed go-1.26, not go.mod's toolchain
      # 0-CVE gate float: golang.org/x/text v0.38.0 -> v0.39.0 (CVE-2026-56852:
      # infinite loop on invalid input). Minor, API-compatible.
      go get golang.org/x/text@v0.39.0
      go mod tidy
      # Mirror upstream ldflags so `miniflux -version` reports the real release.
      LDFLAGS="-s -w -X 'miniflux.app/v2/internal/version.Version=${{package.version}}'"
      go build -trimpath -ldflags "$LDFLAGS" \
        -o "${{targets.destdir}}/usr/bin/miniflux" .

test:
  pipeline:
    - runs: |
        miniflux -version
