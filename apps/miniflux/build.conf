# miniflux: from-source via melange (Go build of miniflux from the git tag tarball).
# NEWEST-ONLY: the single newest stable release. Upstream tags carry a "v" prefix
# (v2.3.2); the bare X.Y.Z is stamped into the binary. Each release pins its
# source tarball by sha256. Single static Go binary, no CGO (pure-go lib/pq
# driver, assets embedded via go:embed).
FROM_SOURCE=1
VERSIONS=(2.3.4)
declare -A SHA256=(
  [2.3.4]=52bae2d0433d87cde9591c96905460046d2ee38e7a7e7ac536bd4e5f1ac66a57
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
