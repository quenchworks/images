# victorialogs: from-source via melange (Go build, git-checkout pinned per
# release; tag = v<version>, go-1.26). NEWEST-ONLY: a single VictoriaLogs
# release. VictoriaLogs now ships from its own repo
# (github.com/VictoriaMetrics/VictoriaLogs, Apache-2.0) with plain v<X.Y.Z> tags;
# it vendors the VictoriaMetrics module (which carries lib/buildinfo). COMMIT map
# pins each git tag to the commit it dereferences to.
FROM_SOURCE=1
VERSIONS=(1.52.1 1.53.0)
declare -A COMMIT=(
  [1.52.1]=46a54c976fa3d404396050e8a5ee6c5b0320efc5
  [1.53.0]=915d91904bf7f5be66ab00f88947ae7fc1431acc
)
render() { echo "s/__VER__/$1/g; s/__COMMIT__/${COMMIT[$1]}/g"; }
