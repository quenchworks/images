# Builds VictoriaLogs single-node from source onto Wolfi. Single static Go
# binary, no CGO. Output is a signed APK in Quenchworks' own repo. No upstream
# distro binaries.
#
# VictoriaLogs is a fast, cost-effective logs database. This package is the
# single-node `victoria-logs` server binary (not the cluster components, not
# enterprise). It ships from its own repo (github.com/VictoriaMetrics/
# VictoriaLogs) under app/victoria-logs and vendors the VictoriaMetrics module,
# which is where lib/buildinfo (the version stamp target) lives.
package:
  name: quench-victorialogs
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened VictoriaLogs (single-node logs DB), built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      # go.mod requires go >= 1.27.1 (1.53.0); pin the matching toolchain rather than the
      # bare `go` meta (which can lag a major behind). Building on the current Go
      # major is also what keeps the compiled-in stdlib free of fixable CVEs
      # (the older Go lines no longer receive those security backports).
      # GOTOOLCHAIN=local then keeps the build offline on this exact toolchain.
      - go-1.27

pipeline:
  # git-checkout, not fetch: building from the pinned git tag avoids the
  # codeload.github.com CDN entirely (some upstream CDNs 403 GitHub Actions IPs),
  # and is the robust source for a repo this size. expected-commit is the commit
  # the annotated release tag dereferences to.
  - uses: git-checkout
    with:
      repository: https://github.com/VictoriaMetrics/VictoriaLogs
      tag: v${{package.version}}
      expected-commit: __COMMIT__
  - runs: |
      export CGO_ENABLED=0
      # The repo vendors all deps, so build from vendor/ -- hermetic and offline,
      # no module downloads.
      export GOFLAGS=-mod=vendor
      export GOTOOLCHAIN=local
      # buildinfo.Version (in the vendored VictoriaMetrics module) is consumed by
      # `-version` and the HTTP UI. Mirror upstream's "<app>-<date>-<tag>" shape
      # so `victoria-logs -version` reports the real release token.
      set -eu
      # 0-CVE FLOORS, not pins (docs/go-module-float.md): raise a module only where go.mod has it
      # below the floor. The repo vendors its deps, so float with -mod=mod and re-vendor, or
      # go build would compile the stale vendor/ tree. klauspost/compress: CVE-2026-63209 (2026-10-22).
      FLOOR="github.com/klauspost/compress@v1.18.7"
      # Go semver order (a release outranks its prereleases); busybox sort -V does not.
      vlt() { awk -v a="${1#v}" -v b="${2#v}" 'function pp(s,  p){sub(/\+.*/,"",s);p=index(s,"-");if(p){C=substr(s,1,p-1);P=substr(s,p+1)}else{C=s;P=""}} function cmp(x,y,  i,n,m,X,Y){n=split(x,X,".");m=split(y,Y,".");for(i=1;i<=n&&i<=m;i++){if(X[i]==Y[i])continue;if(X[i]~/^[0-9]+$/&&Y[i]~/^[0-9]+$/)return (X[i]+0<Y[i]+0)?-1:1;if(X[i]~/^[0-9]+$/)return -1;if(Y[i]~/^[0-9]+$/)return 1;return (X[i]<Y[i])?-1:1}return (n<m)?-1:(n>m)?1:0} BEGIN{pp(a);ca=C;pa=P;pp(b);cb=C;pb=P;c=cmp(ca,cb);if(c==0){if(pa==pb)c=0;else if(pa=="")c=1;else if(pb=="")c=-1;else c=cmp(pa,pb)}exit !(c<0)}'; }
      need=""
      for mv in $FLOOR; do
        have="$(GOFLAGS=-mod=mod go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${mv%@*}" 2>/dev/null)"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        vlt "$have" "${mv#*@}" && need="$need $mv"
      done
      echo "raising:${need:- nothing}"
      if [ -n "$need" ]; then
        GOFLAGS=-mod=mod go get $need
        GOFLAGS=-mod=mod go mod tidy
        GOFLAGS=-mod=mod go mod vendor
      fi
      LDFLAGS="-s -w -X github.com/VictoriaMetrics/VictoriaMetrics/lib/buildinfo.Version=victoria-logs-quench-v${{package.version}}"
      go build -trimpath -ldflags "${LDFLAGS}" \
        -o "${{targets.destdir}}/usr/bin/victoria-logs" ./app/victoria-logs
  - runs: |
      # Thin entrypoint. VictoriaLogs writes to -storageDataPath (default
      # ./victoria-logs-data in CWD), which fails on a read-only rootfs.
      # Pin it to a writable mount (VL_STORAGE, default /victoria-logs-data) and
      # the HTTP API to :9428. Ensure the dir exists, then exec the server so it
      # is PID 1 and receives signals directly. Extra flags pass through via "$@".
      install -d "${{targets.destdir}}/usr/local/bin"
      cat > "${{targets.destdir}}/usr/local/bin/docker-entrypoint.sh" <<'SCRIPT'
      #!/bin/sh
      set -eu
      VL_STORAGE="${VL_STORAGE:-/victoria-logs-data}"
      VL_HTTP_LISTEN="${VL_HTTP_LISTEN:-:9428}"
      mkdir -p "${VL_STORAGE}"
      exec /usr/bin/victoria-logs \
        -storageDataPath="${VL_STORAGE}" \
        -httpListenAddr="${VL_HTTP_LISTEN}" \
        "$@"
      SCRIPT
      chmod 0755 "${{targets.destdir}}/usr/local/bin/docker-entrypoint.sh"

test:
  pipeline:
    - runs: |
        victoria-logs -version
