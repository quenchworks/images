# postgresql: from-source via melange (configure/make of the official release
# tarball + a curated contrib set). Latest 3 maintained major lines, newest patch
# each (16, 17, 18). Each release pins its source tarball by sha256.
FROM_SOURCE=1
VERSIONS=(16.14 17.10 18.4)
declare -A SHA256=(
  [16.14]=f6d077142737920858ce958ccdb75c6ee137a63b5b0853c70693d401ac7e3471
  [17.10]=078a03516dcdbdb705fecaf415ea3d13a956c589e46f09fed68a06fb00598c90
  [18.4]=81a81ec695fb0c7901407defaa1d2f7973617154cf27ba74e3a7ab8e64436094
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
