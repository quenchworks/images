# STATUS: UNBLOCKED 2026-09-20. The zlib block is gone: Wolfi shipped the fix
# for CVE-2026-85091 as zlib 1.3.2.1_rc20260601-r0 and the advisory was amended
# to name that version, so the 1.3.3-r0 this file used to wait for is a number
# that will never arrive. A stock wolfi-base scan reports the advisory as
# `zlib 1.3.2-r7 -> 1.3.2.1_rc20260601-r0`, which is what Wolfi publishes on
# both arches today. scripts/blocked.py now watches the shipped version.
#
# Evidence, stated exactly as measured:
#   x86_64  gated locally 2026-09-20, PUSH=0: 0 fixable CVEs AND the boot test
#           passed, so this is "runs", not just "scans clean".
#   aarch64 not measured locally; this host kills background melange builds and
#           a qemu-emulated arm build does not fit the foreground timeout. CI's
#           native arm64 runner is the first arm measurement, and its gate
#           refuses to publish on any finding.
# postgresql: from-source via melange (configure/make of the official release
# tarball + a curated contrib set + the pgvector extension). Latest 3 maintained major lines, newest patch
# each (16, 17, 18). Each release pins its source tarball by sha256.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(16.16 17.12 18.7 18.6)
declare -A SHA256=(
  [16.16]=9d5cd8633043b75740d5d59749c6b7365e6aeb53c47098b1a5e80bb18f87881a
  [17.12]=9cf136a703d8ee2f83465c43be4e9e8e7930c82b0bfba13be7e2537be769ac55
  [18.7]=441dfae4280cae3e0425e5f876f80559fb0731c140f1aae22b3e5a54d0411bfd
  [18.6]=555610c24d53e4316da5b7d3fc25c279d96856d5e0e23ee308c328c5fa881d9f
)
# pgvector, built into every line (vector similarity search: CREATE EXTENSION vector),
# and the sha256 of its tag tarball, from a download
PGVECTOR_VERSION=0.8.6
PGVECTOR_SHA256=10bf9938906e5d643bbc4a7eea104b6f57ba4898e5b76b20e60484ea1d5a7f8f
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g; s|__PGVECTOR_VER__|$PGVECTOR_VERSION|g; s|__PGVECTOR_SHA256__|$PGVECTOR_SHA256|g"; }
