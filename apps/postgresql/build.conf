# postgresql: from-source via melange (configure/make of the official release
# tarball + a curated contrib set). Latest 3 maintained major lines, newest patch
# each (16, 17, 18). Each release pins its source tarball by sha256.
FROM_SOURCE=1
VERSIONS=(16.15 17.11 18.6)
declare -A SHA256=(
  [16.15]=c1575341fa7bd40f5274ea465b34390f4dc64cdd0770af327005caaeb9f6b7ed
  [17.11]=dd27f2b3c59e73ed14aa3324901242bf69a032a6347805f274e6260322d42979
  [18.6]=555610c24d53e4316da5b7d3fc25c279d96856d5e0e23ee308c328c5fa881d9f
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
