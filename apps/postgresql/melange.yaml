# Builds the postgresql package from source onto Wolfi. Output is a signed APK in
# Quenchworks' own repo. No upstream distro binaries.
package:
  name: quench-postgresql
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened PostgreSQL, built from source on Wolfi"
  copyright:
    - license: PostgreSQL
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata           # postgres is built --with-system-tzdata and reads it at runtime
      # Patroni HA add-on (venv under /opt/patroni). The venv references the system
      # interpreter, so python must be present at runtime; libgcc/glibc back the
      # psycopg + PyYAML C-extension manylinux wheels.
      - python-3.13
      - libgcc
      - glibc

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - openssl-dev
      - readline-dev
      - zlib-dev
      - icu-dev
      - linux-headers
      - pkgconf
      - perl                # required by the build for some generated headers
      - bison               # parser generator (gram.y)
      - flex                # scanner generator (scan.l)
      - python-3.13         # Patroni venv interpreter
      - py3.13-pip          # installs Patroni + deps from PyPI into the venv

pipeline:
  - uses: fetch
    with:
      # Official release tarball with a published, stable sha256.
      uri: https://ftp.postgresql.org/pub/source/v${{package.version}}/postgresql-${{package.version}}.tar.bz2
      expected-sha256: "__SHA256__"
  - runs: |
      ./configure \
        --prefix=/usr \
        --with-openssl \
        --with-readline \
        --with-zlib \
        --with-icu \
        --with-system-tzdata=/usr/share/zoneinfo
      make -j"$(nproc)"
      make DESTDIR="${{targets.destdir}}" install
  # Build + install a curated set of dependency-free contrib extensions from the
  # SAME source tree (no extra external packages). These all build with the configure
  # flags above; btree_gin is required by Temporal's visibility schema. We do NOT run a
  # blanket `make -C contrib install` because some contribs (uuid-ossp, sepgsql, bool_plperl,
  # ...) need optional deps we don't configure and would fail the build.
  - runs: |
      for ext in btree_gin btree_gist pg_trgm pgcrypto hstore citext pg_stat_statements intarray ltree unaccent fuzzystrmatch tablefunc; do
        make -C "contrib/$ext" -j"$(nproc)"
        make -C "contrib/$ext" DESTDIR="${{targets.destdir}}" install
      done
  # Bake the bootstrap entrypoint into the package (self-contained, no external file).
  # First boot runs initdb with a scram superuser password; subsequent boots just start.
  - runs: |
      install -d "${{targets.destdir}}/usr/local/bin"
      cat > "${{targets.destdir}}/usr/local/bin/docker-entrypoint.sh" <<'SCRIPT'
      #!/bin/sh
      set -eu
      PGDATA="${PGDATA:-/var/lib/postgresql/data}"
      POSTGRES_USER="${POSTGRES_USER:-postgres}"
      POSTGRES_DB="${POSTGRES_DB:-$POSTGRES_USER}"
      SOCKET_DIR="${PGSOCKET_DIR:-/var/run/postgresql}"

      if [ ! -s "$PGDATA/PG_VERSION" ]; then
        if [ -z "${POSTGRES_PASSWORD:-}" ]; then
          echo "POSTGRES_PASSWORD is required for first initialization" >&2
          exit 1
        fi
        pwfile="$(mktemp)"
        printf '%s' "$POSTGRES_PASSWORD" > "$pwfile"
        initdb -D "$PGDATA" -U "$POSTGRES_USER" \
          --auth-local=scram-sha-256 --auth-host=scram-sha-256 \
          --pwfile="$pwfile" --encoding=UTF8 --locale=C
        rm -f "$pwfile"

        # listen on all interfaces; the cluster network is the trust boundary, auth is scram
        printf "\nlisten_addresses = '*'\n" >> "$PGDATA/postgresql.conf"
        printf "host all all all scram-sha-256\n" >> "$PGDATA/pg_hba.conf"

        # create the application database when it differs from the default
        if [ "$POSTGRES_DB" != "postgres" ] && [ "$POSTGRES_DB" != "$POSTGRES_USER" ]; then
          pg_ctl -D "$PGDATA" -o "-c listen_addresses='' -k $SOCKET_DIR" -w start
          PGPASSWORD="$POSTGRES_PASSWORD" createdb -h "$SOCKET_DIR" -U "$POSTGRES_USER" "$POSTGRES_DB"
          pg_ctl -D "$PGDATA" -m fast -w stop
        fi
      fi

      exec postgres -D "$PGDATA" -k "$SOCKET_DIR"
      SCRIPT
      chmod 0755 "${{targets.destdir}}/usr/local/bin/docker-entrypoint.sh"
  # --- Patroni HA add-on -----------------------------------------------------
  # Patroni is a pure-Python supervisor that wraps postgres, elects a leader via a
  # DCS, and drives streaming replication + pg_rewind rejoin. There is no Wolfi apk
  # for it, so — mirroring the mlflow/ansible venv-on-Wolfi pattern — we install it
  # from PyPI into an isolated venv on the build's python-3.13. `[kubernetes]` pulls
  # the k8s client so Patroni can use the Kubernetes API as its DCS (no external
  # etcd; leader election + cluster state live in k8s endpoints/configmaps, and it
  # maintains a `role` pod label the chart's primary Service selects). psycopg[binary]
  # is Patroni's Postgres driver (bundled libpq wheel, no system libpq dep). The
  # postgres binaries Patroni shells out to (postgres, pg_ctl, pg_rewind, initdb) are
  # already on PATH at /usr/bin from the install above. This is an ADDED capability:
  # the default entrypoint still runs plain single-node postgres; the chart's HA mode
  # runs `patroni /etc/patroni/patroni.yml` instead.
  - runs: |
      dest="${{targets.destdir}}"

      python3.13 -m venv /opt/patroni/venv
      /opt/patroni/venv/bin/pip install --no-cache-dir --upgrade pip
      /opt/patroni/venv/bin/pip install --no-cache-dir \
        "patroni[kubernetes]" \
        "psycopg[binary]"

      # SECURITY BUMPS: Patroni's transitive tree (via the kubernetes client) pulls
      # urllib3 / requests / certifi / setuptools, which routinely lag a fixable CVE.
      # Bump the affected packages to their patched releases so the 0-CVE gate passes,
      # then `pip check` to confirm the dependency graph still resolves. Keep this list
      # minimal — only what Trivy actually flags for the pinned build.
      /opt/patroni/venv/bin/pip install --no-cache-dir --upgrade \
        "urllib3>=2.5.0" \
        "requests>=2.32.4" \
        "certifi>=2025.1.31" \
        "setuptools==83.0.0"
      /opt/patroni/venv/bin/pip check

      # Remove pip from the shipped venv. pip VENDORS its own copies of msgpack and
      # setuptools under pip/_vendor/, and those are what Trivy flags -- pip 26.x pins
      # msgpack==1.1.2 (GHSA-6v7p-g79w-8964 HIGH) and setuptools==70.3.0
      # (CVE-2026-59890) in its vendor.txt, so no top-level pin can reach them and every
      # pip release 26.0-26.2 vendors the same pair. Deleting pip DELETES the vulnerable
      # code rather than suppressing the finding -- no .trivyignore, no --skip, no VEX.
      # Patroni is a pure supervisor and never shells out to pip at runtime. Runs AFTER
      # the installs and `pip check` above, so nothing later in this step needs pip.
      /opt/patroni/venv/bin/pip uninstall -y pip
      # `test !` and not `! test`: set -e ignores a status inverted with `!`, so
      # `! test -e f` would never fail the build. This form does.
      test ! -e /opt/patroni/venv/lib/python3.13/site-packages/pip/_vendor/vendor.txt

      # Assert the CLIs import + run without a DCS (full failover is exercised in the
      # chart's kind gate).
      /opt/patroni/venv/bin/patroni --version
      /opt/patroni/venv/bin/patronictl version

      # Relocate the venv into the package tree under /opt/patroni.
      install -d "${dest}/opt/patroni"
      cp -a /opt/patroni/venv "${dest}/opt/patroni/venv"

      # Convenience symlinks on PATH so the chart can invoke `patroni` / `patronictl`.
      install -d "${dest}/usr/bin"
      ln -sf /opt/patroni/venv/bin/patroni    "${dest}/usr/bin/patroni"
      ln -sf /opt/patroni/venv/bin/patronictl "${dest}/usr/bin/patronictl"

      chmod -R a+rX "${dest}/opt/patroni"

test:
  pipeline:
    - runs: |
        postgres --version
        initdb --version
        psql --version
        pg_rewind --version
        pg_ctl --version
        patroni --version
        patronictl version
