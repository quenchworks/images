# temporal-ui runtime: the binary is the entrypoint; flags configure it. Nonroot 1001.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-temporal-ui@local

accounts:
  groups:
    - groupname: temporal-ui
      gid: 1001
  users:
    - username: temporal-ui
      uid: 1001
      gid: 1001
  run-as: 1001

work-dir: /home/ui-server

entrypoint:
  command: /home/ui-server/ui-server --env docker start

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-temporal-ui"
  org.opencontainers.image.licenses: "MIT"
  org.opencontainers.image.version: "__VER__"
