# Temporal UI (the web UI for Temporal: workflows, histories, schedules, namespaces), from
# temporalio/ui-server (MIT). The repository carries the built SvelteKit assets, so the server is a
# plain Go build that embeds them; no Node build. It templates its own config/docker.yaml from env
# vars (TEMPORAL_ADDRESS and others), so the image needs no shell or dockerize. LATEST-ONLY.
FROM_SOURCE=1
VERSIONS=(2.58.1)
declare -A SHA256=(
  [2.58.1]=d018c63f96481d4805f03850d23cbf4d46c2544cd5d5c515470463966043d382
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
