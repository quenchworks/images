package:
  name: quench-temporal-ui
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened temporal-ui, built from source on Wolfi"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/temporalio/ui-server/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - runs: |
      set -eu
      export CGO_ENABLED=0 GOTOOLCHAIN=local GOFLAGS=-mod=mod GOWORK=off
      # floors, raised only when below (a bare go get downgrades once upstream passes it)
      FLOOR="golang.org/x/crypto@v0.58.1-0.20261009181718-2f1f834330b2 golang.org/x/net@v0.62.0 golang.org/x/text@v0.43.0 golang.org/x/sys@v0.49.0"
      need=""
      for f in $FLOOR; do
        have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${f%@*}")"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        [ "$(printf '%s\n%s\n' "$have" "${f#*@}" | sort -V | head -1)" = "${f#*@}" ] || need="$need $f"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || go get $need
      go mod tidy
      # upstream's layout: /home/ui-server/ui-server reads ./config/docker.yaml (--env docker)
      d="${{targets.destdir}}/home/ui-server"
      install -d "$d/config"
      go build -trimpath -ldflags "-s -w" -o "$d/ui-server" ./cmd/server
      install -m 0644 config/docker.yaml "$d/config/docker.yaml"

test:
  pipeline:
    - runs: |
        test -x /home/ui-server/ui-server && test -f /home/ui-server/config/docker.yaml
