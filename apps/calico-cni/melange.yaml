# Calico's CNI plugin + installer and the reference CNI plugins it ships, all built
# from source with the floor pass. See build.conf for why none comes from Wolfi.
package:
  name: quench-calico-cni
  version: __VER__
  epoch: 0
  description: "Quenchworks Calico CNI plugin, installer and reference CNI plugins"
  copyright:
    - license: Apache-2.0

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - curl
      - go-1.26

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/projectcalico/calico/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      set -eu
      export CGO_ENABLED=0 GOFLAGS=-mod=mod GOTOOLCHAIN=local GOWORK=off
      FLOOR="golang.org/x/crypto@v0.56.0 golang.org/x/net@v0.58.0 golang.org/x/text@v0.41.0 golang.org/x/mod@v0.40.0 golang.org/x/sys@v0.47.0 google.golang.org/grpc@v1.83.2 go.opentelemetry.io/otel/sdk@v1.45.0 github.com/google/cel-go@v0.29.0"
      # Go semver order (a release outranks its prereleases); busybox sort -V does not.
      vlt() { awk -v a="${1#v}" -v b="${2#v}" 'function pp(s,  p){sub(/\+.*/,"",s);p=index(s,"-");if(p){C=substr(s,1,p-1);P=substr(s,p+1)}else{C=s;P=""}} function cmp(x,y,  i,n,m,X,Y){n=split(x,X,".");m=split(y,Y,".");for(i=1;i<=n&&i<=m;i++){if(X[i]==Y[i])continue;if(X[i]~/^[0-9]+$/&&Y[i]~/^[0-9]+$/)return (X[i]+0<Y[i]+0)?-1:1;if(X[i]~/^[0-9]+$/)return -1;if(Y[i]~/^[0-9]+$/)return 1;return (X[i]<Y[i])?-1:1}return (n<m)?-1:(n>m)?1:0} BEGIN{pp(a);ca=C;pa=P;pp(b);cb=C;pb=P;c=cmp(ca,cb);if(c==0){if(pa==pb)c=0;else if(pa=="")c=1;else if(pb=="")c=-1;else c=cmp(pa,pb)}exit !(c<0)}'; }
      # FLOORS, not pins: raise a module only where go.mod has it below the floor.
      floorpass() {
        need=""
        for mv in $FLOOR; do
          have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${mv%@*}" 2>/dev/null)"
          case "$have" in v[0-9]*) ;; *) continue ;; esac
          vlt "$have" "${mv#*@}" && need="$need $mv"
        done
        echo "raising:${need:- nothing}"
        [ -z "$need" ] || go get $need
        go mod tidy
      }
      B="${{targets.destdir}}/opt/cni/bin"
      mkdir -p "$B"

      # Port of upstream 04415b7057 (on master and release-v3.32, in no 3.32 tag): under Go
      # 1.26's map implementation encoding/json panics on uniquelabels' unique.Handle keys
      # ("makeslice: len out of range") and json-iterator trips the concurrent map check.
      # Typha crash-looped in the chart's kind gate. Marshal labels as map[string]string
      # and drop the jsoniter wrapper for encoding/json, as upstream did.
      cat > libcalico-go/lib/json/json.go <<'GO'
      package json

      import "encoding/json"

      func Marshal(v any) ([]byte, error) { return json.Marshal(v) }

      func Unmarshal(data []byte, v any) error { return json.Unmarshal(data, v) }
      GO
      ul=lib/std/uniquelabels/unique_labels.go
      sed -i 's|return json.Marshal(i.m)|return json.Marshal(i.RecomputeOriginalMap())|' "$ul"
      awk '/^func \(i \*Map\) UnmarshalJSON\(data \[\]byte\) error \{$/ {
          print
          print "\tvar sm map[string]string"
          print "\tif err := json.Unmarshal(data, &sm); err != nil {\n\t\treturn err\n\t}"
          print "\tif sm == nil {\n\t\ti.m = nil\n\t\treturn nil\n\t}"
          print "\thm := make(handleMap, len(sm))"
          print "\tfor k, v := range sm {\n\t\thm[uniquestr.Make(k)] = uniquestr.Make(v)\n\t}"
          print "\ti.m = hm\n\treturn nil"
          skip = 1; next }
        skip && /^}$/ { skip = 0 }
        !skip' "$ul" > "$ul.new" && mv "$ul.new" "$ul"
      grep -q 'json.Marshal(i.RecomputeOriginalMap())' "$ul" && grep -q 'var sm map\[string\]string' "$ul" \
        && ! grep -q jsoniter libcalico-go/lib/json/json.go || { echo "FATAL: Go 1.26 JSON port did not apply"; exit 1; }

      floorpass
      go build -buildvcs=false -trimpath -ldflags "-s -w -X main.VERSION=v${{package.version}} -X github.com/projectcalico/calico/pkg/buildinfo.Version=v${{package.version}}" \
        -o "$B/calico" ./cni-plugin/cmd/calico
      go build -buildvcs=false -trimpath -ldflags "-s -w -X main.VERSION=v${{package.version}} -X github.com/projectcalico/calico/pkg/buildinfo.Version=v${{package.version}}" \
        -o "$B/install" ./cni-plugin/cmd/install
      cp "$B/calico" "$B/calico-ipam"   # one binary, dispatched on argv[0]

      # Reference plugins Calico's image ships (containernetworking/plugins v1.9.1, newest).
      mkdir -p /tmp/cni && cd /tmp/cni
      curl -fsSL -o cni.tgz https://github.com/containernetworking/plugins/archive/refs/tags/v1.9.1.tar.gz
      echo "34bd82d47e981940751619c9cc44c095bb90bfcaf8d71865cbb822c37690a764  cni.tgz" | sha256sum -c -
      tar -xzf cni.tgz --strip-components=1
      floorpass
      for p in meta/bandwidth ipam/host-local main/loopback meta/portmap meta/tuning; do
        go build -trimpath -ldflags "-s -w -X github.com/containernetworking/plugins/pkg/utils/buildversion.BuildVersion=v1.9.1" \
          -o "$B/$(basename $p)" "./plugins/$p"
      done

      # flannel CNI plugin (flannel-io/cni-plugin v1.9.1-flannel3, newest).
      mkdir -p /tmp/flannel && cd /tmp/flannel
      curl -fsSL -o f.tgz https://github.com/flannel-io/cni-plugin/archive/refs/tags/v1.9.1-flannel3.tar.gz
      echo "23ed19c545ab63eabf899e70abd8a4ae161cf6a2700926259c6b59381d9df171  f.tgz" | sha256sum -c -
      tar -xzf f.tgz --strip-components=1
      rm -rf vendor
      floorpass
      go build -trimpath -ldflags "-s -w" -o "$B/flannel" .

      for b in "$B"/*; do
        v="$(go version -m "$b" | awk '$2 == "golang.org/x/sys" { print $3 }')"
        [ -z "$v" ] || ! vlt "$v" v0.47.0 || { echo "FATAL: ${b##*/} links golang.org/x/sys $v"; exit 1; }
      done
      ls -l "$B"

test:
  pipeline:
    - runs: |
        for b in calico calico-ipam install bandwidth host-local loopback portmap tuning flannel; do test -x /opt/cni/bin/$b; done
