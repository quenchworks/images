# calico-cni: Calico's CNI plugin and its installer (the install-cni init container).
# Built entirely from source (2026-10-08): calico + install from the projectcalico/calico
# tag, the CNI reference plugins Calico ships (bandwidth, host-local, loopback, portmap,
# tuning; containernetworking/plugins v1.9.1) and flannel. Wolfi's packages for all of
# them link golang.org/x/sys v0.35.0/v0.40.0 (and flannel stdlib 1.25.11). Real files in
# /opt/cni/bin like upstream: the installer copies that directory onto the host.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(3.32.0)
declare -A SHA256=(
  [3.32.0]=55defb4135a7f04942ff596848b4decc5eeed67d0d97f81b57df5395f41354c9
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
