# sim-realtime: Sim's collaboration socket server (apps/realtime, socket.io on 3002) from the release tag, the image
# upstream ships as simstudioai/realtime. Built like docker/realtime.Dockerfile: turbo prune @sim/realtime, upstream's
# prune-production-workspace script, bun install --omit=dev; bun runs the TypeScript source directly.
