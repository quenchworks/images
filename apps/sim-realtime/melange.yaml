# Sim's apps/realtime with production dependencies only, run by bun. The package holds the pruned workspace under /app.
package:
  name: quench-sim-realtime
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Sim realtime server, built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - bun

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - bun

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/simstudioai/sim/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - name: prune to @sim/realtime, install production dependencies
    runs: |
      set -eu
      export HOME="$(mktemp -d)" BUN_INSTALL_CACHE_DIR="$(mktemp -d)" HUSKY=0
      tv="$(bun -e "console.log(require('./package.json').devDependencies.turbo)")"
      bunx --bun "turbo@$tv" prune @sim/realtime --docker
      cp -R out production
      bun scripts/prune-production-workspace.ts @sim/realtime production/full production/json
      d="${{targets.destdir}}/app"
      install -d "$d"
      cp -a production/json/. "$d/"
      cp production/bun.lock "$d/bun.lock"
      (cd "$d" && bun install --linker=hoisted --omit=dev --ignore-scripts)
      cp -a production/full/. "$d/"
      test -f "$d/apps/realtime/src/bootstrap.ts"
      test -d "$d/node_modules/socket.io"

test:
  pipeline:
    - runs: |
        test -f /app/apps/realtime/src/bootstrap.ts
        cd /app && bun -e "require('socket.io')"
