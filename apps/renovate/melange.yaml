# Builds the Quenchworks Renovate package: the upstream renovate npm package
# installed at a PINNED version onto Wolfi. Renovate is a Node.js CLI (not a Go
# binary), so this is an npm global install rather than a from-source compile.
# `npm install -g renovate@<ver> --prefix=<destdir>/usr` lays down the launcher at
# /usr/bin/renovate (a symlink to ../lib/node_modules/renovate/dist/renovate.js,
# shebang `#!/usr/bin/env node`) plus its bundled node_modules under
# /usr/lib/node_modules/renovate. npm verifies the registry tarball's own
# integrity hash, so the exact version is the pin (no source sha256). The node
# runtime, git (renovate shells out to git for clone/commit/branch) and the CA
# bundle (HTTPS to registries + the renovate platform API) are runtime deps.
package:
  name: quench-renovate
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Renovate (automated dependency updates), npm package on a Wolfi Node 24 runtime"
  copyright:
    - license: AGPL-3.0-only
  dependencies:
    runtime:
      - nodejs-24
      - git
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - nodejs-24
      - npm

pipeline:
  - runs: |
      set -eu
      destdir="${{targets.destdir}}"
      # Global install of the exact pinned version into the image prefix. npm
      # creates ${destdir}/usr/bin/renovate -> ../lib/node_modules/renovate/...
      # and unpacks the bundled deps under ${destdir}/usr/lib/node_modules.
      npm install -g "renovate@${{package.version}}" --prefix="${destdir}/usr"

      # --- brace-expansion CVE-2026-14257 + CVE-2026-69152 (both HIGH): install the fixed
      # 5.0.9 over every stale copy
      # A GLOBAL install has no project package.json, so npm `overrides` are unavailable here —
      # the fix is applied to the installed tree instead. Renovate's own top-level copy already
      # floats to 5.0.9 (glob 13 -> minimatch 10.2.6 -> brace-expansion ^5.0.8); the stragglers
      # are two nested copies that CANNOT float:
      #   bunyan (optionalDep) -> mv 2.1.1 -> rimraf ~2.4.0 -> glob ^6.0.1 -> minimatch 3.1.5 -> ^1.1.7  => 1.1.16
      #   gaxios 7.x           -> rimraf ^5.0.1 -> glob 10.5.0 -> minimatch 9.0.9 -> ^2.0.2            => 2.1.2
      # Both ranges are pinned to lines that have NO fix: the advisory (GHSA-mh99-v99m-4gvg) has a
      # single affected range, `<= 5.0.7`, spanning every line, so the maintenance heads 1.1.16 and
      # 2.1.2 are affected too and no future 1.x/2.x can sort above it — 5.x is the only escape.
      # 2026-08-10: CVE-2026-69152 then landed on 5.0.8 itself (fixed in 5.0.9), so the staged
      # version moves to 5.0.9. Per-line fixes now exist (1.1.18 / 2.1.4 / 3.0.6), but forcing
      # one 5.x copy everywhere keeps a single version to audit instead of three.
      # Parent-bumping is not available either: rimraf 6 / glob 11 are promise-only and callback-
      # style mv/rimraf 2 would break, and minimatch 9.0.9 (the newest 9.x) deliberately REVERTED
      # from brace-expansion ^5.0.2 back to ^2.0.2.
      # 5.0.8 also changed the CJS entry to a NAMED-only export (5.0.9 keeps that shape,
      # verified against the published package.json: same exports map, same balanced-match dep) (`exports.expand`, `__esModule`,
      # no callable default) while minimatch 3.1.5 does `require("brace-expansion")(pattern)` and
      # 9.0.9 does `__importDefault(...).default(pattern)` — so each copy gets a one-line
      # re-export of the function as module.exports (named props kept). The patched
      # implementation is what runs; the EXPANSION_MAX_LENGTH bound that fixes the CVE is
      # untouched. No .trivyignore, no --skip, no VEX. Verified against the published tarballs:
      # minimatch 3.1.5 / 9.0.9 / 10.2.5 all braceExpand() correctly and stay bounded afterwards.
      # The staging dir carries its own package.json so npm treats it as an isolated root and
      # cannot hoist into (and rewrite) the tree we just installed.
      mkdir -p .be-stage
      echo '{"name":"quench-be-stage","private":true}' > .be-stage/package.json
      ( cd .be-stage && npm install --no-audit --no-fund --no-package-lock brace-expansion@5.0.9 )
      # Enumerate with `find`, NOT fs.readdirSync({recursive:true}). The readdir walker
      # matched only the hoisted top-level copy — which already floats to 5.0.9 on its
      # own — so it replaced nothing and the two NESTED copies shipped vulnerable
      # (mv/node_modules/brace-expansion 1.1.16 and rimraf/node_modules/... 2.1.2,
      # confirmed by extracting the built layer). find cannot miss a nesting depth.
      find "${destdir}/usr/lib/node_modules" -type d -name brace-expansion -print0 \
        > "${PWD}/.be-copies"
      BE_STAGE="${PWD}/.be-stage/node_modules" NM_ROOT="${destdir}/usr/lib/node_modules" \
      BE_COPIES="${PWD}/.be-copies" node -e '
        const fs=require("fs"), path=require("path");
        const stage=process.env.BE_STAGE, root=process.env.NM_ROOT;
        const SHIM="\n// QuenchWorks: brace-expansion 5.x exports a NAMED-only CJS binding; re-export\n"
                  +"// the function itself (named props kept) so minimatch 3.x/9.0.9 keep working.\n"
                  +"module.exports = Object.assign(expand, exports, { default: expand });\n";
        const ver=d=>JSON.parse(fs.readFileSync(path.join(d,"package.json"),"utf8")).version;
        const copies=fs.readFileSync(process.env.BE_COPIES,"utf8").split("\0").filter(Boolean);
        if(!copies.length) throw new Error("no brace-expansion copy under "+root);
        let rep=0, shim=0;
        for(const d of copies){
          if(!ver(d).startsWith("5.")){
            fs.rmSync(d,{recursive:true});
            fs.cpSync(path.join(stage,"brace-expansion"),d,{recursive:true});
            // 5.x needs balanced-match ^4 while the tree hoists ^1 for the old copies, so nest it.
            fs.cpSync(path.join(stage,"balanced-match"),path.join(d,"node_modules","balanced-match"),{recursive:true});
            rep++;
          }
          const cjs=path.join(d,"dist","commonjs","index.js");
          if(!fs.readFileSync(cjs,"utf8").includes("Object.assign(expand")){fs.appendFileSync(cjs,SHIM);shim++;}
          if(!ver(d).startsWith("5.")) throw new Error("brace-expansion still "+ver(d)+" at "+d);
          const b=require(d);
          if(typeof b!=="function"||b("a{b,c}").join()!=="ab,ac")
            throw new Error("brace-expansion CJS interop broken at "+d);
        }
        console.log("brace-expansion: "+copies.length+" copies, "+rep+" replaced, "+shim+" shimmed");
      '
      rm -rf .be-stage

      # --- adm-zip CVE-2026-77301 (HIGH): 0.6.0 -> 0.6.1. Uncontrolled memory allocation
      # from the DECLARED entry size in the zip header, so a small crafted archive can make
      # the reader allocate arbitrarily. Renovate reads zip archives when extracting
      # tool/datasource artifacts, so the parser is reachable.
      # Same constraint as brace-expansion above: a global install has no project
      # package.json, so npm `overrides` do not apply -- the fixed copy is staged and
      # written over every copy in the installed tree. adm-zip has NO dependencies and
      # 0.6.1 keeps the same `main` and the same `engines` (>=14.0), so this is a
      # drop-in swap with no interop shim.
      mkdir -p .az-stage
      echo '{"name":"quench-az-stage","private":true}' > .az-stage/package.json
      ( cd .az-stage && npm install --no-audit --no-fund --no-package-lock adm-zip@0.6.1 )
      find "${destdir}/usr/lib/node_modules" -type d -name adm-zip -print0 > "${PWD}/.az-copies"
      AZ_STAGE="${PWD}/.az-stage/node_modules/adm-zip" NM_ROOT="${destdir}/usr/lib/node_modules" \
      AZ_COPIES="${PWD}/.az-copies" node -e '
        const fs=require("fs"), path=require("path");
        const stage=process.env.AZ_STAGE, root=process.env.NM_ROOT;
        const ver=d=>JSON.parse(fs.readFileSync(path.join(d,"package.json"),"utf8")).version;
        const copies=fs.readFileSync(process.env.AZ_COPIES,"utf8").split("\0").filter(Boolean);
        if(!copies.length) throw new Error("no adm-zip copy under "+root);
        let rep=0;
        for(const d of copies){
          if(ver(d)!=="0.6.1"){ fs.rmSync(d,{recursive:true}); fs.cpSync(stage,d,{recursive:true}); rep++; }
          if(ver(d)!=="0.6.1") throw new Error("adm-zip still "+ver(d)+" at "+d);
          if(typeof require(d)!=="function") throw new Error("adm-zip is not constructible at "+d);
        }
        console.log("adm-zip: "+copies.length+" copies, "+rep+" replaced");
      '
      rm -rf .az-stage

      # --- qs CVE-2026-82417 + CVE-2026-82562 (both MEDIUM): 6.15.3 -> 6.16.0. Two DoS
      # paths in query-string parsing, one improper validation and one array-limit
      # bypass. Renovate parses query strings from platform API URLs, so the parser is
      # reachable. Arrived with the 44.103 dependency tree; 44.30.4 scanned clean.
      # Staged the same way as adm-zip and brace-expansion above, for the same reason:
      # a global install has no project package.json, so npm `overrides` are ignored.
      # qs 6.16.0 is a minor within the same 6.x API and keeps the same entry point.
      mkdir -p .qs-stage
      echo '{"name":"quench-qs-stage","private":true}' > .qs-stage/package.json
      ( cd .qs-stage && npm install --no-audit --no-fund --no-package-lock qs@6.16.0 )
      find "${destdir}/usr/lib/node_modules" -type d -name qs -print0 > "${PWD}/.qs-copies"
      QS_STAGE="${PWD}/.qs-stage/node_modules/qs" NM_ROOT="${destdir}/usr/lib/node_modules" \
      QS_COPIES="${PWD}/.qs-copies" node -e '
        const fs=require("fs"), path=require("path");
        const stage=process.env.QS_STAGE, root=process.env.NM_ROOT;
        const ver=d=>JSON.parse(fs.readFileSync(path.join(d,"package.json"),"utf8")).version;
        const copies=fs.readFileSync(process.env.QS_COPIES,"utf8").split("\0").filter(Boolean);
        if(!copies.length) throw new Error("no qs copy under "+root);
        let rep=0;
        for(const d of copies){
          if(ver(d)!=="6.16.0"){ fs.rmSync(d,{recursive:true}); fs.cpSync(stage,d,{recursive:true}); rep++; }
          if(ver(d)!=="6.16.0") throw new Error("qs still "+ver(d)+" at "+d);
          const q=require(d);
          if(typeof q.parse!=="function"||typeof q.stringify!=="function") throw new Error("qs lost parse/stringify at "+d);
          if(q.parse("a[0]=1&a[1]=2").a[1]!=="2") throw new Error("qs parse round-trip failed at "+d);
        }
        console.log("qs: "+copies.length+" copies, "+rep+" replaced");
      '
      rm -rf .qs-stage

      # Sanity: the launcher symlink must exist (build fails loudly otherwise).
      test -L "${destdir}/usr/bin/renovate"
      test -f "${destdir}/usr/lib/node_modules/renovate/dist/renovate.js"
      # ...and renovate's own minimatch (a brace-expansion 5.x consumer) must still expand braces.
      RENOVATE_NM="${destdir}/usr/lib/node_modules/renovate/node_modules" node -e '
        if (require(process.env.RENOVATE_NM + "/minimatch").braceExpand("a{b,c}").join() !== "ab,ac")
          throw new Error("minimatch braceExpand broken");'
