# 2026-07-27 nightly sweep: brace-expansion CVE-2026-14257 (HIGH). Renovate's own top-level
# copy already floats to the fixed 5.0.8 (glob 13 -> minimatch 10.2.5 -> ^5.0.5); the two that
# do NOT are pinned to lines with no fix at all:
#   bunyan (optionalDep) -> mv 2.1.1 -> rimraf ~2.4.0 -> glob ^6.0.1 -> minimatch 3.1.5 -> ^1.1.7 => 1.1.16
#   gaxios 7.x           -> rimraf ^5.0.1 -> glob 10.5.0 -> minimatch 9.0.9 -> ^2.0.2           => 2.1.2
# The advisory's affected range is a single `<= 5.0.7` covering every line, so the maintenance
# heads are affected too and 5.0.8 is the only escape; parent-bumping is blocked because rimraf
# 6 / glob 11 are promise-only (mv and rimraf 2 are callback-style) and minimatch 9.0.9, the
# newest 9.x, deliberately reverted to brace-expansion ^2.0.2. A GLOBAL npm install has no
# project package.json, so `overrides` are unavailable — melange.yaml stages 5.0.8 and installs
# it over each stale copy instead, plus the CJS interop shim 5.0.8 needs. See melange.yaml.
#
# renovate (renovatebot/renovate): a Node.js dependency-update CLI distributed as
# an npm package -- NOT a Go build. The image is a hardened Wolfi Node 24 runtime
# with renovate installed at a pinned version via `npm install -g`. Renovate's
# package.json pins engines.node ^24.11.0, so the build + runtime use nodejs-24.
#
# NEWEST-ONLY window. Tags have NO `v` prefix (e.g. 44.2.3), and renovate is fetched
# from the npm registry by exact version -- there is no source tarball to checksum, so
# SHA256 pinning does not apply. The npm version string IS the integrity pin (npm
# verifies the registry tarball's own integrity hash); FROM_SOURCE is left unset for
# that reason.
#
# 2026-07-30: 43 -> 44 line. This "major" is a MISLABEL, not a breaking change —
# upstream's own 44.0.0 notes say "This release was incorrectly flagged as a major
# bump. Now it is released, we will - unfortunately - have to continue on the 44.x
# release train" (renovatebot/renovate discussion 44952); the only functional change in
# 44.0.0 is a pep621/pixi.lock feature. Packaging is byte-for-byte the same shape as
# 43.285.4, checked against the published package.json rather than assumed:
#   * engines.node still ^24.11.0    -> nodejs-24 stays the correct runtime
#   * bin still {renovate: dist/renovate.js, renovate-config-validator: ...}
#                                    -> the recipe's launcher/symlink assertions hold
#   * same 118 dependencies, same optionalDependencies (re2, openpgp)
#   * glob 13.0.6 / minimatch 10.2.5 / bunyan 1.8.15 unchanged -> the brace-expansion
#     staging + CJS interop shim below targets the exact same two un-floatable nested
#     copies (bunyan->mv->rimraf 2->glob 6 and gaxios->rimraf 5->glob 10), so it is
#     carried forward unchanged.
VERSIONS=(44.2.3)
render() { echo "s/__VER__/$1/g"; }
