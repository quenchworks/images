# renovate (renovatebot/renovate): a Node.js dependency-update CLI distributed as
# an npm package -- NOT a Go build. The image is a hardened Wolfi Node 24 runtime
# with renovate installed at a pinned version via `npm install -g`. Renovate's
# package.json pins engines.node ^24.11.0, so the build + runtime use nodejs-24.
#
# Latest 3 stable releases (Renovate ships major.minor.patch with very frequent
# major bumps; the 3 newest happen to be on the same 43 line). Tags have NO `v`
# prefix (e.g. 43.237.1), and renovate is fetched from the npm registry by exact
# version -- there is no source tarball to checksum, so SHA256 pinning does not
# apply. The npm version string IS the integrity pin (npm verifies the registry
# tarball's own integrity hash); FROM_SOURCE is left unset for that reason.
VERSIONS=(43.256.3)
render() { echo "s/__VER__/$1/g"; }
