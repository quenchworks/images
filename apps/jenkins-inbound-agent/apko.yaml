# Assembles a hardened Jenkins inbound agent image from Wolfi packages. No Dockerfile:
# apko pulls the jenkins-agent script (jenkins-docker-agent-openjdk-21, which brings
# OpenJDK 21 + jenkins-utils + bash) and the remoting agent.jar (jenkins-remoting)
# straight from the Wolfi `os` repository. Wolfi retired the flat
# `jenkins-docker-agent` apk in favour of the per-JDK subpackages -- see build.conf
# for the rename rationale.
#
# The ONE melange package this app builds is a SHADOW git-lfs (see melange.yaml); the
# Jenkins bits themselves are still pure Wolfi apk assembly.
#
# IMAGE-ONLY -- no Helm chart. The 0-CVE, signed, nonroot, multi-arch answer to
# jenkins/inbound-agent: the controller launches it over JNLP/websocket. The entrypoint
# is the jenkins-agent script, which execs `java -jar agent.jar` with the connection args
# the controller injects (-url / -secret / -name). `__PKG__` is the pinned docker-agent apk.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - __PKG__            # jenkins-docker-agent-openjdk-21: /usr/local/bin/jenkins-agent + OpenJDK 21 + bash
    - jenkins-remoting   # the remoting agent.jar (/usr/share/jenkins/agent.jar)
    # git-lfs is NOT optional here: jenkins-utils (a hard dep of the docker-agent
    # apk) hard-depends on it UNPINNED, so it lands in the image whether we ask
    # or not. melange.yaml builds our own git-lfs 3.7.1-r22 from source with the
    # golang.org/x/* family floated (x/net, x/text, and as of 2026-09-14 x/crypto
    # too), into ./packages, and this line is what makes apko install it. Same
    # package NAME, so this one package also satisfies jenkins-utils's bare
    # `git-lfs` dep and Wolfi's own git-lfs is never fetched.
    #
    # RE-CHECKED 2026-09-14: Wolfi has since published git-lfs 3.8.0-r1 (a real
    # new upstream release, both arches) -- but its golang.org/x/crypto is
    # v0.54.0, WORSE than our v0.55.0 at the time and still below the v0.56.0
    # CVE-2026-56855/78662 need, so switching back to Wolfi's apk is still not an
    # option. Shadow stays; see melange.yaml for the x/crypto float this added.
    #
    # THE `@local` TAG IS REQUIRED, not decoration. Measured both ways on
    # 2026-08-27: with a bare `- git-lfs`, relying on r22 > r21 winning on
    # version, apko resolved to Wolfi's `git-lfs (3.7.1-r21)` -- apko's resolver
    # does NOT simply take the highest version across repositories, it needs the
    # repository pin. With `@local` it installs `git-lfs (3.7.1-r22)`.
    #
    # Consequence: the shadow does NOT expire on its own. When Wolfi publishes a
    # git-lfs built against x/net >= 0.56.0 AND x/crypto >= 0.56.0, delete
    # melange.yaml, drop this line plus the `@local` repo and `./melange.rsa.pub`
    # keyring entries above, and revert the workflow to apko-only. build.conf
    # records that condition.
    - git-lfs@local

accounts:
  groups:
    - groupname: jenkins
      gid: 1001
  users:
    - username: jenkins
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/local/bin/jenkins-agent

environment:
  HOME: /home/jenkins
  # the agent writes its workspace/remoting cache under the work dir; keep it writable
  AGENT_WORKDIR: /home/jenkins/agent

work-dir: /home/jenkins

paths:
  - path: /home/jenkins
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o755

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-jenkins-inbound-agent"
  org.opencontainers.image.licenses: "MIT"
