#
# jenkins-inbound-agent: the Jenkins inbound (JNLP/websocket) build agent -- the
# jenkins-agent launch script + the remoting agent.jar + an OpenJDK. IMAGE-ONLY --
# no Helm chart; the Jenkins controller launches it. apko pulls
# `jenkins-docker-agent-openjdk-21` (the agent script + its OpenJDK 21 dep, which
# also drags in jenkins-utils) and `jenkins-remoting` (agent.jar) straight from
# Wolfi. Latest 3 docker-agent lines; tag = the docker-agent version.
#
# FROM_SOURCE=1 as of 2026-08-27, and it means LESS than usual: the Jenkins bits
# are still pure Wolfi apk assembly and version discovery is unchanged
# (scripts/check/jenkins-inbound-agent.py reads the Wolfi apk index). The single
# melange package is the SHADOW git-lfs described in the STATUS note above --
# jenkins-utils drags an unpinned, vulnerable git-lfs in, so we ship our own at a
# higher revision. Same instrument apps/poetry uses for its pip-vendor shim.
#
# PACKAGE RENAME 2026-07-27 (still true 2026-08-27): Wolfi RETIRED the flat
# `jenkins-docker-agent` apk -- it is absent from the APKINDEX at ANY version, so
# the old `jenkins-docker-agent=2.544-r0` pin is unresolvable. It was split per
# JDK. Only -openjdk-21 and -openjdk-25 exist now; the -17 variant has since
# disappeared from the index entirely (jenkins-2-openjdk-17 is frozen at
# 2.544-r1). We track -openjdk-21 (LTS). The shipped /usr/local/bin/jenkins-agent
# script is byte-for-byte the same upstream launcher (same /usr/share/jenkins/
# agent.jar path, same bash dep), so test.sh is unchanged. No openjdk-21 CVEs.
FROM_SOURCE=1
VERSIONS=(2.564 2.565 2.566)
declare -A PIN=( [2.564]=2.564-r1 [2.565]=2.565-r0 [2.566]=2.566-r1 )
# melange.yaml carries no placeholders (the shadow git-lfs is pinned at 3.7.1
# independently of the agent version); only apko.yaml's __PKG__ is substituted.
render() { echo "s|__PKG__|jenkins-docker-agent-openjdk-21=${PIN[$1]}|g"; }
