# jenkins-inbound-agent: Wolfi apk (FROM_SOURCE=0, apko-only, 0-CVE). The Jenkins
# inbound (JNLP/websocket) build agent: the jenkins-agent launch script + the
# remoting agent.jar + an OpenJDK. IMAGE-ONLY -- no Helm chart; the Jenkins
# controller launches it. apko pulls `jenkins-docker-agent-openjdk-21` (the agent
# script + its OpenJDK 21 dep, which also drags in jenkins-utils) and
# `jenkins-remoting` (agent.jar) straight from Wolfi.
# Latest 3 docker-agent lines; tag = the docker-agent version.
#
# PACKAGE RENAME 2026-07-27: Wolfi RETIRED the flat `jenkins-docker-agent` apk --
# it no longer exists in the APKINDEX at ANY version, so the old
# `jenkins-docker-agent=2.544-r0` pin is unresolvable and the recipe could not
# rebuild. It was split per JDK: jenkins-docker-agent-openjdk-{17,21,25}. The -17
# variant is FROZEN at 2.544-r1 (its only revision -- Wolfi dropped JDK 17 for the
# newer lines), so we move to -openjdk-21 (LTS; 2.566-r1 is Wolfi's newest for the
# whole o:jenkins-2 origin, incl. jenkins-remoting and jenkins-utils). The shipped
# /usr/local/bin/jenkins-agent script is byte-for-byte the same upstream launcher
# (same /usr/share/jenkins/agent.jar path, same bash dep), so test.sh is unchanged.
# No openjdk-21 CVEs anywhere in the nightly scan.
#
# CVE STATUS 2026-07-27: the 2.544-r0 -> 2.566-r1 bump clears 33 of the 57 nightly
# rows -- 32 jenkins-docker-agent + jenkins-utils rows (2 CRITICAL incl.
# CVE-2026-2332, 10 HIGH, 10 MEDIUM, 10 LOW: everything with a fixed-version at or
# below 2.566-r1, i.e. 2.544-r1 / 2.555-r3 / 2.555.1-r1 / 2.560-r0 / 2.563-r0 /
# 2.564-r1) plus the git-lfs apk row (3.7.1-r17 -> r18). jenkins-remoting was already
# floating at 2.566-r1 (unpinned), so it contributes none.
# A further row (git-lfs x/text v0.37.0 -> v0.39.0) clears itself:
# git-lfs arrives UNPINNED via jenkins-utils, so the rebuild picks up 3.7.1-r18,
# whose SBOM ships x/text v0.39.0. => 34 of 57 cleared, and the remaining git-lfs
# x/net v0.55.0 + x/crypto v0.52.0 rows are Wolfi-gated (r18 is the newest apk).
#
# STILL FLAGGED (21 rows: 6 HIGH + 15 MEDIUM) with fixed-versions 2.572-r0 /
# 2.574-r0. Those revisions DO NOT EXIST for the o:jenkins-2 origin -- Wolfi only
# publishes 2.569..2.574 under the separate o:jenkins-docker origin (jenkins-docker,
# jenkins-entrypoint), i.e. the CONTROLLER image packages. They are the SAME class
# of origin-inherited false-positive already documented below, keyed to new CVE IDs.
# MAINTAINER ACTION at release time: re-verify by layer extraction and extend
# vex.openvex.json -- both the CVE list and the product purls, which must follow the
# rename to pkg:apk/wolfi/jenkins-docker-agent-openjdk-21 (the existing 22
# statements are keyed to the retired flat purls and no longer match). Until that
# is done the 0-CVE gate CANNOT pass, so BLOCKED=1 is re-set below (same convention
# as apps/sonar-scanner-cli); drop it once the VEX covers the new CVE set.
BLOCKED=1
#
# STATUS 2026-07-13: 0-CVE gate now PASSES via a documented VEX clearance
# (apps/jenkins-inbound-agent/vex.openvex.json). The 22 fixable CVEs (1 CRITICAL,
# 7 HIGH, 9 MEDIUM, 5 LOW) are PROVEN false-positives: Wolfi os-pkg advisories
# keyed to the shared origin `o:jenkins-2` and INHERITED by every subpackage
# (docker-agent/remoting/utils) from the controller (jenkins.war), where the
# flagged libs (jackson-databind, Apache MINA, Spring Security, Jenkins core
# CVE-2026-2332) actually live. Verified by full-image extraction: those libs are
# NOT present in the agent image — grep across every layer = 0 matches; the only
# jars shipped are remoting-*.jar (+ agent.jar/slave.jar symlinks) and jrt-fs.jar.
# The OpenVEX doc records each CVE as not_affected / vulnerable_code_not_present;
# both the local gate (scripts/build-image.sh --vex) and CI (trivy-action `vex:`)
# consume it. No .trivyignore, no --skip-* — all 22 clear through not_affected.
# BLOCKED=1 keeps CI from publishing until the maintainer drops it at release time.
FROM_SOURCE=0
VERSIONS=(2.564 2.565 2.566)
declare -A PIN=( [2.564]=2.564-r1 [2.565]=2.565-r0 [2.566]=2.566-r1 )
render() { echo "s|__PKG__|jenkins-docker-agent-openjdk-21=${PIN[$1]}|g"; }
