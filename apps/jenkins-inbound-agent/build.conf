# jenkins-inbound-agent: Wolfi apk (FROM_SOURCE=0, apko-only, 0-CVE). The Jenkins
# inbound (JNLP/websocket) build agent: the jenkins-agent launch script + the
# remoting agent.jar + an OpenJDK. IMAGE-ONLY -- no Helm chart; the Jenkins
# controller launches it. apko pulls `jenkins-docker-agent` (the agent script +
# its OpenJDK 17 dep) and `jenkins-remoting` (agent.jar) straight from Wolfi.
# Latest 3 docker-agent lines; tag = the docker-agent version.
FROM_SOURCE=0
VERSIONS=(2.542 2.543 2.544)
declare -A PIN=( [2.542]=2.542-r0 [2.543]=2.543-r0 [2.544]=2.544-r0 )
render() { echo "s|__PKG__|jenkins-docker-agent=${PIN[$1]}|g"; }
