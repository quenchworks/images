# jenkins-inbound-agent: Wolfi apk (FROM_SOURCE=0, apko-only, 0-CVE). The Jenkins
# inbound (JNLP/websocket) build agent: the jenkins-agent launch script + the
# remoting agent.jar + an OpenJDK. IMAGE-ONLY -- no Helm chart; the Jenkins
# controller launches it. apko pulls `jenkins-docker-agent` (the agent script +
# its OpenJDK 17 dep) and `jenkins-remoting` (agent.jar) straight from Wolfi.
# Latest 3 docker-agent lines; tag = the docker-agent version.
#
# STATUS 2026-07-12: NOT catalog-listed / not cleanly publishable. The 0-CVE gate
# fails with 35 fixable CVEs (1 CRITICAL, 11 HIGH) — ALL inside the upstream jars
# Wolfi ships in `jenkins-docker-agent` (22), `jenkins-remoting` (6) and
# `jenkins-utils` (6): jackson-databind (CVE-2026-54512/54513/54514/54516/54517/
# 54518) plus others. These are apko-pulled Wolfi packages, not built here, so they
# can only be fixed by Wolfi rebuilding those packages with patched bundled deps
# (Wolfi self-heal) — nothing in this recipe clears them, and a jackson-only jar-swap
# leaves the other ~29. Wolfi's newest jenkins-remoting is 2.566-r1 (still vulnerable).
# Re-list + publish once Wolfi ships patched jenkins-docker-agent/remoting/utils.
FROM_SOURCE=0
VERSIONS=(2.542 2.543 2.544)
declare -A PIN=( [2.542]=2.542-r0 [2.543]=2.543-r0 [2.544]=2.544-r0 )
render() { echo "s|__PKG__|jenkins-docker-agent=${PIN[$1]}|g"; }
