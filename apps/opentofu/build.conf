# OpenTofu (the open-source Terraform fork, an IaC CLI): from-source via melange
# (Go build from the git tag tarball). Image-only (a CLI tool, no chart). Latest
# patch of the last 3 minor lines (1.10, 1.11, 1.12). Single static Go binary,
# CGO disabled. The displayed version comes from the embedded VERSION file in the
# repo (matches the tag); the only release ldflag is -X version.dev=no, which
# turns off the "-dev" prerelease marker so `tofu version` reports the real tag.
FROM_SOURCE=1
VERSIONS=(1.10.10 1.11.10 1.12.3)
declare -A SHA256=(
  [1.10.10]=e44e6ed3e3260530901913ffbf2faa3569291e316bd797f113ac514c0b26b3fd
  [1.11.10]=dbd098ceb7b1d1fc671109392c691d8d04a60f0cd30c969004088658a37932ee
  [1.12.3]=0691d6c4ab43bcfa708120a0c71ece4be43ece4327445a572d91649e4e09af0e
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
