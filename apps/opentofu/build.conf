# OpenTofu (the open-source Terraform fork, an IaC CLI): from-source via melange
# (Go build from the git tag tarball). Image-only (a CLI tool, no chart). Newest
# release only (1.12.5). Single static Go binary,
# CGO disabled. The displayed version comes from the embedded VERSION file in the
# repo (matches the tag); the only release ldflag is -X version.dev=no, which
# turns off the "-dev" prerelease marker so `tofu version` reports the real tag.
FROM_SOURCE=1
VERSIONS=(1.13.0)
declare -A SHA256=(
  [1.13.0]=ef769284412b20eb30b883be10519242ab0c92ea54d8a509261e62ba28da4663
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
