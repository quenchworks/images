# Builds OpenTofu (the open-source Terraform fork, an IaC CLI) from source onto
# Wolfi. Single static Go binary, no CGO. The displayed version comes from the
# VERSION file embedded in the source at the tag, so it already matches the
# release; the only release ldflag is -X version.dev=no, which clears the "-dev"
# prerelease marker so `tofu version` reports the real release. Output is a signed
# APK in Quenchworks' own repo. No upstream distro binaries. Image-only (CLI, no chart).
package:
  name: quench-opentofu
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened OpenTofu (open-source Terraform fork), built from source on Wolfi"
  copyright:
    - license: MPL-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/opentofu/opentofu/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      export CGO_ENABLED=0
      export GOTOOLCHAIN=local
      export GOFLAGS=-mod=mod
      # 0-CVE gate: minor/patch dep bumps (same major) to clear Trivy findings
      # in the tofu binary, then tidy. All leaf/transitive bumps -- no forks,
      # no major bumps, no `replace`.
      go get github.com/Azure/go-ntlmssp@v0.1.1
      go get github.com/aws/aws-sdk-go-v2/aws/protocol/eventstream@v1.7.8
      go get github.com/aws/aws-sdk-go-v2/service/s3@v1.97.3
      go get go.opentelemetry.io/otel/sdk@v1.43.0
      go get go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.43.0
      go get go.opentelemetry.io/otel/exporters/otlp/otlpmetric/otlpmetrichttp@v1.43.0
      go get go.opentelemetry.io/otel/exporters/otlp/otlplog/otlploghttp@v0.19.0
      go get golang.org/x/net@v0.57.0 golang.org/x/text@v0.40.0
      go get oras.land/oras-go/v2@v2.6.1
      go mod tidy
      go build -trimpath \
        -ldflags "-s -w -X github.com/opentofu/opentofu/version.dev=no" \
        -o "${{targets.destdir}}/usr/bin/tofu" ./cmd/tofu
