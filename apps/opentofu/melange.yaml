# Builds OpenTofu (the open-source Terraform fork, an IaC CLI) from source onto
# Wolfi. Single static Go binary, no CGO. The displayed version comes from the
# VERSION file embedded in the source at the tag, so it already matches the
# release; the only release ldflag is -X version.dev=no, which clears the "-dev"
# prerelease marker so `tofu version` reports the real release. Output is a signed
# APK in Quenchworks' own repo. No upstream distro binaries. Image-only (CLI, no chart).
package:
  name: quench-opentofu
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened OpenTofu (open-source Terraform fork), built from source on Wolfi"
  copyright:
    - license: MPL-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/opentofu/opentofu/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      export CGO_ENABLED=0
      export GOTOOLCHAIN=local
      export GOFLAGS=-mod=mod
      # 0-CVE gate: minor/patch dep bumps (same major) to clear Trivy findings
      # in the tofu binary, then tidy. All leaf/transitive bumps -- no forks,
      # no major bumps, no `replace`.
      go get github.com/Azure/go-ntlmssp@v0.1.1
      go get github.com/aws/aws-sdk-go-v2/aws/protocol/eventstream@v1.7.8
      go get github.com/aws/aws-sdk-go-v2/service/s3@v1.97.3
      go get go.opentelemetry.io/otel/sdk@v1.45.0
      # Float the exporters as FAMILIES, not just the http variants: the gate found
      # otlptrace/otlptracegrpc still at v1.42.0 (CVE-2026-81870) and otlploggrpc at
      # v0.18.0 (CVE-2026-81871) because only the http sibling was listed here.
      go get go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.45.0 \
        go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.45.0 \
        go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.45.0
      go get go.opentelemetry.io/otel/exporters/otlp/otlpmetric/otlpmetrichttp@v1.45.0 \
        go.opentelemetry.io/otel/exporters/otlp/otlpmetric/otlpmetricgrpc@v1.45.0
      # 0.21.0 is the log-family version of the otel 1.45.0 release train.
      go get go.opentelemetry.io/otel/log@v0.21.0 \
        go.opentelemetry.io/otel/sdk/log@v0.21.0 \
        go.opentelemetry.io/otel/exporters/otlp/otlplog/otlploggrpc@v0.21.0 \
        go.opentelemetry.io/otel/exporters/otlp/otlplog/otlploghttp@v0.21.0 \
        go.opentelemetry.io/otel/exporters/stdout/stdoutlog@v0.21.0
      go get golang.org/x/net@v0.58.0 golang.org/x/text@v0.41.0 golang.org/x/mod@v0.40.0
      go get oras.land/oras-go/v2@v2.6.2
      # grpc GHSA-hrxh-6v49-42gf -> 1.82.1; keep otel/oauth2 coherent with grpc@1.82.1.
      go get google.golang.org/grpc@v1.83.2 golang.org/x/oauth2@v0.36.0 \
        go.opentelemetry.io/otel@v1.45.0 go.opentelemetry.io/otel/trace@v1.45.0 \
        go.opentelemetry.io/otel/metric@v1.45.0
      # x/crypto added 2026-09-14: 1.12.6 requires v0.52.0 direct (CVE-2026-56855,
      # CVE-2026-78662, x/crypto/ssh DoS), fixed in v0.56.0. No `replace` covers it.
      go get golang.org/x/crypto@v0.56.0
      go mod tidy
      go build -trimpath \
        -ldflags "-s -w -X github.com/opentofu/opentofu/version.dev=no" \
        -o "${{targets.destdir}}/usr/bin/tofu" ./cmd/tofu
