# sozu (sozu-proxy/sozu): HTTP/HTTPS reverse proxy in Rust that reconfigures at runtime
# over its command socket and upgrades without dropping connections. From the release
# tag with `cargo auditable build`, features as upstream's Dockerfile
# (jemallocator, crypto-ring). Upstream patches only its newest line: latest only.
FROM_SOURCE=1
VERSIONS=(2.3.4)
declare -A SHA256=(
  [2.3.4]=4e2cb1ee866509d73bf34fc85f4d420a2c6ff282dfc02d8463adc014e23ed200
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
