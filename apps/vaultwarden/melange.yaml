# Vaultwarden from the release tag with `cargo auditable build`, so the crate list lands in a
# .dep-v0 section and the gate scans every crate. Features as upstream's image: sqlite (bundled),
# mysql, postgresql. Wolfi OpenSSL 4 (postgresql-18-dev pulls its headers).
package:
  name: quench-vaultwarden
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Vaultwarden password manager server, built from source on Wolfi"
  copyright:
    - license: AGPL-3.0-only
  dependencies:
    runtime:
      - ca-certificates-bundle
      - libgcc
      - libpq-18
      - mariadb-connector-c
      - openssl-4.0-libssl
      - tzdata

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - cargo-auditable
      - mariadb-connector-c-dev
      - openssl-4.0-dev
      - pkgconf
      - postgresql-18-dev
      - rust-1.99

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/dani-garcia/vaultwarden/archive/refs/tags/${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - runs: mkdir -p web-vault

  - uses: fetch
    with:
      uri: https://github.com/dani-garcia/bw_web_builds/releases/download/v__WEB__/bw_web_v__WEB__.tar.gz
      expected-sha256: __WEB_SHA256__
      directory: web-vault

  - runs: |
      set -eu
      # the pinned web vault must be the one this release's image ships
      grep -qx 'vault_version: "v__WEB__"' docker/DockerSettings.yaml || { echo "web vault pin moved"; exit 1; }
      # rust-toolchain.toml pins a rustup channel; build with Wolfi's toolchain instead
      rm -f rust-toolchain rust-toolchain.toml
      # the crate is versioned 1.0.0 upstream; stamp the release so scanners match the right version
      # busybox sed has no 0,/re/ address: anchor on the name line, as in the lock
      sed -i '/^name = "vaultwarden"$/{n;s/^version = "1.0.0"$/version = "${{package.version}}"/}' Cargo.toml
      grep -A1 '^name = "vaultwarden"$' Cargo.toml | grep -qx 'version = "${{package.version}}"'
      sed -i '/^name = "vaultwarden"$/{n;s/^version = "1.0.0"$/version = "${{package.version}}"/}' Cargo.lock
      grep -A1 '^name = "vaultwarden"$' Cargo.lock | grep -qx 'version = "${{package.version}}"'
      export VW_VERSION="${{package.version}}"
      cargo auditable build --release --locked --features sqlite,mysql,postgresql
      readelf -S target/release/vaultwarden | grep dep-v0 >/dev/null || { echo "no .dep-v0 section"; exit 1; }
      install -Dm0755 target/release/vaultwarden "${{targets.destdir}}/usr/bin/vaultwarden"
      "${{targets.destdir}}/usr/bin/vaultwarden" --version | grep -F "${{package.version}}"
      mkdir -p "${{targets.destdir}}/web-vault"
      cp -a web-vault/. "${{targets.destdir}}/web-vault/"
      test -s "${{targets.destdir}}/web-vault/index.html"

test:
  pipeline:
    - runs: |
        vaultwarden --version
