# Vaultwarden (dani-garcia/vaultwarden, AGPL-3.0): Bitwarden-compatible password manager server for
# the official clients, on SQLite, PostgreSQL or MySQL. From the release tag via melange with
# `cargo auditable build` (all three database backends, as upstream's image) on Wolfi rust, plus the
# web vault from dani-garcia/bw_web_builds at the version upstream's DockerSettings.yaml pins.
# LATEST-ONLY: one release line. WEB_VAULT moves with each release: read docker/DockerSettings.yaml.
FROM_SOURCE=1
VERSIONS=(1.37.5)
declare -A SHA256=(
  [1.37.5]=6be37dcc95b91a058ecbe614f1a7acff68ca8d23dc2c016cec18517c7173e4cc
)
declare -A WEB_VAULT=( [1.37.5]=2026.10.1 )
declare -A WEB_SHA256=( [1.37.5]=354de9056c871e48db84975985e7d57c111ac6537bd4e4720488019e8638060f )
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g; s/__WEB__/${WEB_VAULT[$1]}/g; s|__WEB_SHA256__|${WEB_SHA256[$1]}|g"; }
