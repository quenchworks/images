# Assembles the Fluent Bit runtime image from our own package plus the Wolfi base.
# No Dockerfile. Minimal, nonroot (uid 1001), multi-arch, SBOM generated by apko.
# The HTTP monitoring server listens on :2020 (/api/v1/health, /api/v1/metrics, /).
# Runs on a read-only rootfs when /tmp is a writable tmpfs (the chart mounts it, plus
# any buffer/storage dir if filesystem buffering is enabled in the config).
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-fluent-bit@local

accounts:
  groups:
    - groupname: fluent-bit
      gid: 1001
  users:
    - username: fluent-bit
      uid: 1001
      gid: 1001
  run-as: 1001

# The image ships a minimal default config (dummy input -> stdout + HTTP server on
# :2020). The chart mounts the real config over /fluent-bit/etc/fluent-bit.conf.
entrypoint:
  command: /usr/bin/fluent-bit -c /fluent-bit/etc/fluent-bit.conf

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quenchworks.mkabumattar.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-fluent-bit"
  org.opencontainers.image.licenses: "Apache-2.0"
