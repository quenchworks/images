# fluent-bit: from-source via melange (fetch github archive tarball, sha256).
# Latest 3 stable minor lines (full X.Y.Z, used as-is).
# __VER__ = version  __SHA256__ = that tarball's sha256
FROM_SOURCE=1
VERSIONS=(4.1.2 4.2.5 5.0.7)
declare -A SHA256=(
  [4.1.2]=f04e7e241ed224f4f64121ca2d0db49bca13ff2b33995067727e30ee1b765880
  [4.2.5]=199471d6ff63d93d79042c6ffe225f414c361451d8da4485cd6a82be7372ed3b
  [5.0.7]=a760cdce272d6025100346d27315cc03a9b3466e5a8a24aaae6f2ad6a9cda29f
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
