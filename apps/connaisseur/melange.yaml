# Builds Connaisseur from source onto Wolfi. Single static Go binary, no CGO, installed at
# /app/bin/connaisseur (upstream's path; the server reads /app/config, /app/alerts and
# /app/certs relative to /app).
package:
  name: quench-connaisseur
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Connaisseur, built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-1.27

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/sse-secure-systems/connaisseur/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      set -eu
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      export GOTOOLCHAIN=local
      # 0-CVE FLOORS, not pins (docs/go-module-float.md): raise a module only where go.mod
      # has it below the floor; a module absent from the graph is skipped. go.mod has no
      # replaces. sigstore-go 1.2.1, fulcio 1.8.6 and timestamp-authority 2.1.2 (what sigstore-go 1.2.1 requires) are the
      # sigstore fixes; docker/docker stays at 28.5.2 (see vex.openvex.json).
      FLOOR="golang.org/x/crypto@v0.56.0 golang.org/x/mod@v0.40.0 golang.org/x/net@v0.58.0 golang.org/x/text@v0.41.0 google.golang.org/grpc@v1.83.2 github.com/sigstore/sigstore-go@v1.2.1 github.com/sigstore/fulcio@v1.8.6 github.com/sigstore/timestamp-authority/v2@v2.1.2"
      need=""
      for mv in $FLOOR; do
        have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${mv%@*}" 2>/dev/null)"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        [ "$(printf '%s\n%s\n' "$have" "${mv#*@}" | sort -V | head -1)" = "${mv#*@}" ] || need="$need $mv"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || go get $need
      go mod tidy
      # The VEX statement holds only while no Docker daemon, plugin or API server package
      # is linked; connaisseur uses docker/docker's registry client and API types only.
      if go list -deps ./cmd/connaisseur | grep -E '^github.com/docker/docker/(daemon|plugin|api/server)'; then
        echo "connaisseur now links Docker daemon code: re-check vex.openvex.json"; exit 1
      fi
      go build -trimpath -ldflags "-s -w" \
        -o "${{targets.destdir}}/app/bin/connaisseur" ./cmd/connaisseur
