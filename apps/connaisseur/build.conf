# connaisseur (admission controller verifying container image signatures): from-source via
# melange (Go build from the git tag tarball). Newest patch of the last 3 minor lines.
# Single static Go binary, no CGO, at /app/bin/connaisseur like upstream's image.
FROM_SOURCE=1
VERSIONS=(3.11.1 3.12.0 3.13.1)
declare -A SHA256=(
  [3.11.1]=d78e409fbcd1e156c1b51d7047e923bbede62f7d7d71d4ec165dad14d30e1bc3
  [3.12.0]=76bd8a26aa5ee97a9aee587b4f6ac7a2211dc5407a075031b924af52db2743d5
  [3.13.1]=02bcc55bd256deec1deaa91c4ff46f1a88cc32623af32fcce7826c7e03ba9642
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
