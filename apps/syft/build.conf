# syft (Anchore): from-source via melange (Go build from the git tag tarball).
# Image-only (a CLI tool, no chart). Newest release only (1.50.0). Single static Go
# binary, CGO disabled. The version is stamped via -X on main.version (per the
# upstream .goreleaser.yaml).
FROM_SOURCE=1
VERSIONS=(1.51.0)
declare -A SHA256=(
  [1.51.0]=d48bca3091ec4862f5041af6cbdeedb3f2322ae7a059199a22d99e099cabd4ae
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
