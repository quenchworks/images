# syft (Anchore): from-source via melange (Go build from the git tag tarball).
# Image-only (a CLI tool, no chart). Latest patch of the last 3 minor lines
# (1.43, 1.44, 1.45). Single static Go binary, CGO disabled. The version is
# stamped via -X on main.version (per the upstream .goreleaser.yaml).
FROM_SOURCE=1
VERSIONS=(1.49.0)
declare -A SHA256=(
  [1.49.0]=7fa1d225a50be61a17c86a0d523412d60b3d8678a1864839217769d3472a8700
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
