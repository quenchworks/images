# Builds Syft (Anchore) from source onto Wolfi. Single static Go binary, no CGO
# (matches the upstream release build). The version is stamped via -X main.version
# so `syft version` reports the real release. Output is a signed APK in
# Quenchworks' own repo. No upstream distro binaries. Image-only (CLI, no chart).
package:
  name: quench-syft
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Syft (Anchore SBOM generator), built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/anchore/syft/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      export GO111MODULE=on
      export GOTOOLCHAIN=local   # use the installed go, don't fetch go.mod's toolchain
      # Bump vulnerable Go modules to their Trivy-listed fixed versions (0-CVE gate).
      go get golang.org/x/net@v0.56.0 golang.org/x/crypto@v0.53.0
      go mod edit -replace golang.org/x/net=golang.org/x/net@v0.56.0
      go mod edit -replace golang.org/x/crypto=golang.org/x/crypto@v0.53.0
      go mod tidy || true
      go build -trimpath \
        -ldflags "-s -w -X main.version=${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/syft" ./cmd/syft
