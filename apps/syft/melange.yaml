# Builds Syft (Anchore) from source onto Wolfi. Single static Go binary, no CGO
# (matches the upstream release build). The version is stamped via -X main.version
# so `syft version` reports the real release. Output is a signed APK in
# Quenchworks' own repo. No upstream distro binaries. Image-only (CLI, no chart).
package:
  name: quench-syft
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Syft (Anchore SBOM generator), built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/anchore/syft/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      export GO111MODULE=on
      export GOTOOLCHAIN=local   # use the installed go, don't fetch go.mod's toolchain
      # 0-CVE module float: NOTHING TO FLOAT at 1.50.0 (docs/go-module-float.md).
      # syft 1.50.0's own go.mod already requires x/net v0.57.0, x/crypto v0.54.0,
      # x/sys v0.47.0, x/text v0.40.0 and grpc v1.82.1 -- every one at or ABOVE the
      # house floor -- and it carries no `replace` directives at all.
      # The 1.49.0 float (`go get ...@v0.56.0 ...` plus `go mod edit -replace` on
      # x/net and x/crypto) has therefore INVERTED into a downgrade: `go get mod@vX`
      # pins exactly vX, and the two `-replace` lines made that downgrade
      # unconditional -- it would drag x/net 0.57.0 -> 0.56.0 and x/crypto
      # 0.54.0 -> 0.53.0 and re-introduce the very CVEs the float was added to clear.
      # Removed rather than raised: with upstream above every floor there is nothing
      # left for the float to do. Re-check on the next bump.
      # 1.51.0 re-check: one new floor. golang.org/x/mod v0.38.0 -> v0.40.0
      # (CVE-2026-56864/56865: sumdb/tlog transparency-log verification bypass).
      go get golang.org/x/mod@v0.40.0
      go mod tidy
      # 2026-09-06: the nightly scan and this app's own 0-CVE gate flagged the shared
      # Go modules below in the published image; this recipe had no float at all.
      # FLOOR, not a bare `go get mod@vX`: an exact pin is a silent no-op under a
      # `replace` and becomes a silent DOWNGRADE once upstream requires more,
      # re-introducing the CVE while the gate still reports green (docs/go-module-float.md).
      FLOOR="golang.org/x/crypto@v0.56.0 google.golang.org/grpc@v1.83.2 golang.org/x/net@v0.58.0 golang.org/x/text@v0.41.0 golang.org/x/sys@v0.47.0 github.com/containerd/containerd/v2@v2.3.5 go.opentelemetry.io/otel@v1.45.0 go.opentelemetry.io/otel/trace@v1.45.0 go.opentelemetry.io/otel/metric@v1.45.0 go.opentelemetry.io/otel/sdk@v1.45.0 go.opentelemetry.io/otel/sdk/metric@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlpmetric/otlpmetricgrpc@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlpmetric/otlpmetrichttp@v1.45.0 go.opentelemetry.io/otel/exporters/stdout/stdouttrace@v1.45.0 go.opentelemetry.io/otel/exporters/stdout/stdoutmetric@v1.45.0 go.opentelemetry.io/otel/log@v0.21.0 go.opentelemetry.io/otel/sdk/log@v0.21.0 go.opentelemetry.io/otel/exporters/otlp/otlplog/otlploggrpc@v0.21.0 go.opentelemetry.io/otel/exporters/otlp/otlplog/otlploghttp@v0.21.0 go.opentelemetry.io/otel/exporters/stdout/stdoutlog@v0.21.0 go.opentelemetry.io/otel/exporters/prometheus@v0.67.0"
      MODS="$(echo "$FLOOR" | tr ' ' '\n' | cut -d@ -f1)"
      # prints "<mod>@<floor> (<tag> has <ver>)" for every module below its floor
      below_floor() {
        awk -v floor="$FLOOR" -v tag="$1" '
          BEGIN { n = split(floor, f, " ")
                  for (i = 1; i <= n; i++) { split(f[i], kv, "@"); want[kv[1]] = kv[2] } }
          ($1 in want) {
            split(substr($2, 2), g, "."); split(substr(want[$1], 2), w, ".")
            for (i = 1; i <= 3; i++) {
              if ((g[i] + 0) > (w[i] + 0)) next
              if ((g[i] + 0) < (w[i] + 0)) { print $1 "@" want[$1] " (" tag " has " $2 ")"; next }
            }
          }'
      }
      # `go list -m` prints "<mod> <ver>" or "<mod> <ver> => <mod> <ver>", so $NF is
      # the EFFECTIVE version and a replace cannot hide behind the require line.
      # A module this app does not require is NOT simply absent: plain `go list -m`
      # FAILS on it ("not a known dependency") and kills the step, so -e is required.
      # -e then prints the module with no version, and feeding that to below_floor
      # would read it as below the floor and `go get` it -- ADDING a dependency the app
      # never had. Hence the awk guard that only passes real v-prefixed versions.
      GOFLAGS=-mod=mod go list -m -e $MODS 2>/dev/null || true
      need="$(GOFLAGS=-mod=mod go list -m -e $MODS 2>/dev/null | awk 'NF >= 2 && $NF ~ /^v[0-9]/ { print $1, $NF }' | below_floor go.mod | awk '{ print $1 }')"
      if [ -n "$need" ]; then GOFLAGS=-mod=mod go get $need; fi
      GOFLAGS=-mod=mod go mod tidy

      go build -trimpath \
        -ldflags "-s -w -X main.version=${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/syft" ./cmd/syft
