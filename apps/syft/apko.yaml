# Assembles the Syft runtime image. Minimal, nonroot, multi-arch, SBOM by apko.
# Syft is a CLI: the entrypoint is the binary, so `docker run ...syft <args>`
# works (e.g. `version`, `scan`, `dir:.`). ca-certificates-bundle is included so
# it can reach registries over TLS when scanning remote images.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-syft@local

accounts:
  groups:
    - groupname: syft
      gid: 1001
  users:
    - username: syft
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/bin/syft

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-syft"
  org.opencontainers.image.licenses: "Apache-2.0"
