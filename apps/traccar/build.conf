# traccar: Traccar, a GPS tracking server (200+ device protocols, live maps, geofences, reports, notifications)
# with its React web UI and REST API. Packaged from the official platform-neutral release zip (traccar-other:
# tracker-server.jar, lib/, web/, templates/, schema/) on a Wolfi OpenJDK 21 JRE (class major 65).
#
# 0-CVE (2026-11-25): the 6.17.0 zip carries 23 findings in 10 jars; melange.yaml swaps 23 jars by content with
# the file names kept (the server jar's Class-Path lists exact names): jackson-core, guava, lz4-java, snappy-java,
# commons-beanutils, logback-core, POI 5.5.1 with its xmlbeans/commons-compress/log4j-api/SparseBitSet/curvesapi
# levels, and the OpenTelemetry 1.62 train to 1.67.0 together. Boot-tested offline: a device posting over OsmAnd.
#
# NEWEST-ONLY: Traccar patches its newest release. A version bump re-measures the swap list (they are pinned).
BLOCKED=0
VERSIONS=(6.17.0)
# sha256 of traccar-other-<ver>.zip from the GitHub release, from a download
declare -A SHA256=(
  [6.17.0]=f6c2958f7a8cfd31945f300fd087b7fe2a713385796553df84fa45d12b85283d
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
