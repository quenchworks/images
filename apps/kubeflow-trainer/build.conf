# Kubeflow Trainer (distributed training jobs for PyTorch, JAX and MPI as TrainJob resources on
# TrainingRuntime templates), from kubeflow/trainer (Apache-2.0). From the release tag via melange: the
# trainer-controller-manager, one static Go binary at /manager like upstream's image, with the house
# golang.org/x floor. Upstream stamps no version into the binary. The dataset/model initializers and
# trainer images are separate (Python) and run inside training jobs; they are not part of this image.
# LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(2.4.0)
declare -A SHA256=(
  [2.4.0]=698dba90d2528dbea2dc550f86a7af3a6500b25216d0b49f1c3cfe52bfea592b
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
