# Packages TigerBeetle onto Wolfi. TigerBeetle is NOT built from source here: it
# ships its OWN official precompiled static binary (a self-contained Zig executable
# that links nothing — see `file`: "statically linked"), so we fetch that upstream
# artifact and harden it on a minimal apko base, gated 0-CVE by Trivy. Clean-room
# consistent: it is upstream's published binary, not a Bitnami chart, and the scan
# still fully applies. busybox is the only runtime dep — the binary itself is
# self-contained; busybox provides the /bin/sh the chart's format-once initContainer
# guard uses.
package:
  name: quench-tigerbeetle
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened TigerBeetle, packaged on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - busybox            # /bin/sh + test/mkdir for the chart's format-once guard

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - curl
      - unzip
      - ca-certificates-bundle

pipeline:
  # TigerBeetle publishes separate x86_64/aarch64 zips of the self-contained binary,
  # so fetch the one matching the build arch by uname -m with its arch-matching
  # sha256 — the wrong arch would yield a non-executable binary. Each zip holds a
  # single `tigerbeetle` binary at its root.
  - runs: |
      VER="${{package.version}}"
      case "$(uname -m)" in
        x86_64)  tbarch=x86_64;  sha=__SHA_AMD__ ;;
        aarch64) tbarch=aarch64; sha=__SHA_ARM__ ;;
        *) echo "unsupported arch $(uname -m)" >&2; exit 1 ;;
      esac
      url="https://github.com/tigerbeetle/tigerbeetle/releases/download/${VER}/tigerbeetle-${tbarch}-linux.zip"
      curl -fsSL -o tigerbeetle.zip "$url"
      echo "${sha}  tigerbeetle.zip" | sha256sum -c -
      unzip -o tigerbeetle.zip
      install -Dm0755 tigerbeetle "${{targets.destdir}}/usr/bin/tigerbeetle"

test:
  pipeline:
    - runs: |
        test -x /usr/bin/tigerbeetle
        tigerbeetle version
