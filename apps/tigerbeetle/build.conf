# tigerbeetle: TigerBeetle ships a SINGLE official prebuilt static binary per arch
# (a self-contained Zig executable, no runtime deps). We fetch the per-arch release
# zip from GitHub and sha256-verify it — the OFFICIAL-PREBUILT-BINARY pattern (same
# as clickhouse/opa's binary track). One fast-moving release line; ship the latest 3.
#   __VER__     = version
#   __SHA_AMD__ = tigerbeetle-x86_64-linux.zip  sha256
#   __SHA_ARM__ = tigerbeetle-aarch64-linux.zip sha256
FROM_SOURCE=1
VERSIONS=(0.17.4 0.17.8 0.17.9)
declare -A SHA_AMD=(
  [0.17.4]=642bd30b24e551c67ff179decb09a5bcb4f5158257e0223c835bf720d5f32264
  [0.17.8]=c69b548018c9fef9dfce83efc2f36e880ab1ef7f7e9c2182b81f9077b9a999a7
  [0.17.9]=af71f2c0057e3b409bf79940fa94894b738187b0d4f1e711097bca15df5d8cd4
)
declare -A SHA_ARM=(
  [0.17.4]=cdbe826a78a91528a3743af30a4115ddb9079c58476d2238d449f52e5f936d69
  [0.17.8]=6397d2c50a2a725716255e22301001aa8c4a0595cb75782ada3965dfb2263ef1
  [0.17.9]=413994920fe48b04f5aa86895b7a1d9d98d14803b29d4e91d2a6d0098fff4ef2
)
render() {
  echo "s/__VER__/$1/g; s|__SHA_AMD__|${SHA_AMD[$1]}|g; s|__SHA_ARM__|${SHA_ARM[$1]}|g"
}
