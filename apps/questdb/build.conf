# NOTE 2026-08-16 (10.0.0): QuestDB 10 runs its workers on JDK continuations, so the
# entrypoint MUST pass --add-exports=java.base/jdk.internal.vm=io.questdb (upstream's
# own questdb.sh does). Without it the JVM starts, the HTTP port answers, and the image
# SMOKE TEST PASSES -- but every worker dies with
#   IllegalAccessError -> NoClassDefFoundError: io.questdb.mp.continuation.WorkerContinuation
# so the pod never goes Ready and only the CHART install gate catches it. Re-check the
# flag list in questdb.sh on every major bump.
# questdb: JVM app. We ship the official arch-independent `no-jre` binary tarball
# (prebuilt questdb.jar) on a hardened Wolfi openjdk-21-jre. That JRE is the CVE
# surface the Trivy gate scans; the questdb.jar itself is a single fat/modular jar
# with no CVE'd standalone libs to swap (unlike kafka). Latest-3 stable lines,
# newest last. Each version pins its no-jre tarball by sha256.
# STATUS: shippable (0-CVE gate passes on 9.4.3 both arches).
FROM_SOURCE=1
VERSIONS=(9.4.2 9.4.3 10.0.0)
declare -A SHA256=(
  [9.4.2]=39a902bb46ea42132f6a99b01b965eabae272c3f18307c8399b354ad20af0063
  [9.4.3]=7fc11a03b8e2ab85314226b7b10bed54dfefe1d87c7ec836e85c8ad6175e7d5c
  [10.0.0]=ff9665953227b522c3bad26245ee9fdbb6e58eccc6d8489722f7c04c200c52ab
)
render() { echo "s/__VER__/$1/g; s/__SHA256__/${SHA256[$1]}/g"; }
