# Gokapi (Forceu/Gokapi, AGPL-3.0): lightweight self-hosted file sharing with expiring links,
# download limits, end-to-end encryption and optional S3 storage, on SQLite or Redis. From the
# release tag via melange: upstream's go generate (WASM modules, minified JS/CSS, API routing), then
# a static CGO-free build with the house golang.org/x floor and go-jose raised. LATEST-ONLY.
FROM_SOURCE=1
VERSIONS=(2.2.4)
declare -A SHA256=(
  [2.2.4]=de4ec69692818d0310c42a8091ae8fec38ba2c6199160f672434d860f3e18394
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
