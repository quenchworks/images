# coolify-app: from-source via melange (Laravel/PHP build of coollabsio/coolify),
# git-checkout pinned per release. Newest-only (4.1.2 is the latest stable v4 tag);
# tag = X.Y.Z. (helper + realtime are internal components versioned by the coolify
# release and track the latest only -- see apps/coolify-helper, apps/coolify-realtime.)
#
# CVE 2026-07-27: the two nightly rows (golang.org/x/net v0.55.0 -> 0.56.0
# CVE-2026-46600 and golang.org/x/crypto v0.52.0 GO-2026-5932 with no fixed version
# published, both UNKNOWN
# severity so neither blocks the CHML gate) come from Wolfi's git-lfs apk, not from
# our build. git-lfs is UNPINNED in apko.yaml and already resolves to 3.7.1-r18,
# Wolfi's newest; I unpacked that apk and its SBOM still reports
# golang.org/x/net@v0.55.0 + golang.org/x/crypto@v0.52.0 (r18 did pick up
# x/text@v0.39.0, which is why the x/text row is already gone). Wolfi-gated: no
# in-repo fix and nothing a rebuild would change.
FROM_SOURCE=1
VERSIONS=(4.2.0)
declare -A COMMIT=(
  [4.2.0]=b53ae426b881a1b895c4946253f8dd201a7f1747
)
render() { echo "s/__VER__/$1/g; s/__COMMIT__/${COMMIT[$1]}/g"; }
