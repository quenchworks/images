# (helper + realtime are internal components versioned by the coolify release and
# track the latest only -- see apps/coolify-helper, apps/coolify-realtime.)
FROM_SOURCE=1
VERSIONS=(4.1.0 4.1.1 4.1.2)
declare -A COMMIT=(
  [4.1.0]=49656aa1edbe8aa6f7f7077dbf689cb1a08f05ee
  [4.1.1]=5a27427cad54e98c21a691a08077c20f94f84f73
  [4.1.2]=e7dff30b7c998c301fd91bd169727b90c59ec291
)
render() { echo "s/__VER__/$1/g; s/__COMMIT__/${COMMIT[$1]}/g"; }
