# coolify-app: from-source via melange (Laravel/PHP build of coollabsio/coolify),
# git-checkout pinned per release. Newest-only (4.1.2 is the latest stable v4 tag);
# tag = X.Y.Z. (helper + realtime are internal components versioned by the coolify
# release and track the latest only -- see apps/coolify-helper, apps/coolify-realtime.)
FROM_SOURCE=1
VERSIONS=(4.1.2)
declare -A COMMIT=(
  [4.1.2]=e7dff30b7c998c301fd91bd169727b90c59ec291
)
render() { echo "s/__VER__/$1/g; s/__COMMIT__/${COMMIT[$1]}/g"; }
