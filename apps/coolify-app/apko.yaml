# Assembles the Coolify core app runtime image: php-fpm (the Laravel app on :9000) +
# QuenchWorks' own nginx (:8080) + the ported s6 services, all supervised by supervisord.
# Minimal, nonroot (uid/gid 9999 = www-data, matching upstream), multi-arch, read-only
# rootfs friendly. SBOM generated by apko.
#
# We do NOT inherit serversideup/php -- the whole runtime is reconstructed from Wolfi
# packages (clean-room). The app tree, supervisor config, service scripts, nginx site
# config and php-fpm/php.ini overrides all come from the quench-coolify-app@local package.
#
# Ports:
#   8080/tcp  nginx -- serves /var/www/html/public, FastCGI-passes .php to php-fpm
#                      (nonroot can't bind <1024; upstream already used 8080)
#   9000/tcp  php-fpm (loopback only; nginx -> 127.0.0.1:9000)
#
# Read-only rootfs: the only writable surfaces (tmpfs/emptyDir-friendly) are
#   * /var/www/html/storage  -- Laravel logs, sessions, framework cache, app/ssh keys
#   * /var/www/html/bootstrap/cache -- Laravel compiled config/route/service caches
#   * /var/www/html/.env     -- written from .env.production on boot if not mounted
#   * /tmp                   -- supervisord pid/sock, nginx pid + temp paths, php tmp
# Everything else (vendor/, public/, app source, /etc, the binaries) stays read-only.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - busybox
    - bash                          # service wrappers + entrypoint are /bin/sh, bash for interactive
    - ca-certificates-bundle
    - supervisor                    # the process supervisor (s6-overlay isn't packaged in Wolfi)
    - quench-nginx@local            # QuenchWorks' hardened nginx (built from source), NOT nginx.org/Alpine
    - quench-coolify-app@local      # the app tree + vendor + built assets + supervisor wiring
    # PHP runtime + FPM + the full extension surface coolify needs at runtime.
    - php-8.4
    - php-8.4-fpm
    - php-8.4-fpm-config
    - php-8.4-config
    - php-8.4-opcache
    - php-8.4-opcache-config
    - php-8.4-ctype
    - php-8.4-ctype-config
    - php-8.4-curl
    - php-8.4-curl-config
    - php-8.4-dom
    - php-8.4-dom-config
    - php-8.4-fileinfo
    - php-8.4-fileinfo-config
    - php-8.4-iconv
    - php-8.4-iconv-config
    - php-8.4-mbstring
    - php-8.4-mbstring-config
    - php-8.4-openssl
    - php-8.4-openssl-config
    - php-8.4-pcntl                 # horizon/queue workers fork via pcntl
    - php-8.4-pcntl-config
    - php-8.4-posix
    - php-8.4-posix-config
    - php-8.4-simplexml
    - php-8.4-simplexml-config
    - php-8.4-sodium
    - php-8.4-sodium-config
    - php-8.4-phar
    - php-8.4-phar-config
    - php-8.4-xml
    - php-8.4-xml-config
    - php-8.4-xmlreader
    - php-8.4-xmlreader-config
    - php-8.4-xmlwriter
    - php-8.4-xmlwriter-config
    - php-8.4-pdo
    - php-8.4-pdo-config
    - php-8.4-pdo_pgsql             # default DB driver (DB_CONNECTION=pgsql)
    - php-8.4-pdo_pgsql-config
    - php-8.4-pgsql
    - php-8.4-pgsql-config
    - php-8.4-redis                 # phpredis: queue/cache/horizon (REDIS_CLIENT=phpredis)
    - php-8.4-redis-config
    - php-8.4-bcmath
    - php-8.4-bcmath-config
    - php-8.4-gd
    - php-8.4-gd-config
    - php-8.4-zip
    - php-8.4-zip-config
    - php-8.4-intl
    - php-8.4-intl-config
    - php-8.4-sockets
    - php-8.4-sockets-config
    # Tooling coolify shells out to at runtime (deploys to target hosts over ssh/git).
    - postgresql-18-client          # pg_dump/psql for DB backups (upstream uses pg18 client)
    - openssh-client                # coolify connects to target servers over ssh
    - git                           # git-based application deploys
    - git-lfs                       # large-file git deploys

accounts:
  groups:
    - groupname: www-data
      gid: 9999
  users:
    - username: www-data
      uid: 9999
      gid: 9999
  run-as: 9999

entrypoint:
  command: /usr/bin/coolify-entrypoint.sh

work-dir: /var/www/html

environment:
  # Production posture; workers self-gate on these (the .env greps in the wrappers).
  APP_ENV: "production"
  HORIZON_ENABLED: "true"
  SCHEDULER_ENABLED: "true"
  NIGHTWATCH_ENABLED: "false"
  PHP_OPCACHE_ENABLE: "1"

paths:
  # Laravel's writable tree (logs, sessions, framework cache, app/ssh) -- emptyDir/tmpfs.
  - path: /var/www/html/storage
    type: directory
    uid: 9999
    gid: 9999
    permissions: 0o755
    recursive: true
  - path: /var/www/html/bootstrap/cache
    type: directory
    uid: 9999
    gid: 9999
    permissions: 0o755
    recursive: true
  # /tmp holds supervisord pid/sock, nginx pid + temp dirs, php session/upload tmp.
  - path: /tmp
    type: directory
    uid: 9999
    gid: 9999
    permissions: 0o1777

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quenchworks.mkabumattar.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-coolify-app"
  org.opencontainers.image.licenses: "Apache-2.0"
