# policy-reporter: Kyverno's Policy Reporter core (PolicyReport aggregation, REST + metrics
# APIs, notification targets), from source via melange. CGO for its sqlite store
# (sqlite_unlock_notify tag, as upstream). Latest of the last 3 minor lines, each pinned by
# sha256 of the GitHub tag tarball. The UI (policy-reporter-ui) is a separate project.
FROM_SOURCE=1
VERSIONS=(3.8.1 3.9.0 3.10.0)
declare -A SHA256=(
  [3.8.1]=3212d49cffd3c37f5cd63a8e92c08ed93b789f4313b5af1211571d2d66875504
  [3.9.0]=5f4d0d78ea45bffe1127b3439832f23313b760d2776a1444c5f18ea7615e499c
  [3.10.0]=0bc4b46eab9e63d83771054bf8ea0f103727ca8b8a0fd607f0898762b0aa9ad0
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
