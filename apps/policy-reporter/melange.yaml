# Builds Policy Reporter from source onto Wolfi, in upstream's image layout (/app with the
# binary and its email templates), so the image also drops into upstream's chart.
package:
  name: quench-policy-reporter
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Policy Reporter, built from source on Wolfi"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-1.27

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/kyverno/policy-reporter/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      export CGO_ENABLED=1
      export GOFLAGS=-mod=mod
      export GOTOOLCHAIN=local
      # 0-CVE FLOORS, not pins (docs/go-module-float.md): raise a module only where go.mod has
      # it below the floor (3.10.0 ships x/crypto 0.55.0 and links x/mod 0.39.0). 3.8/3.9 also
      # carry grpc 1.82.0 and otel 1.44.0 (indirect, via the cloud target SDKs): the whole otel
      # family moves to 3.10.0's own set, contrib detectors included, so the pairs stay the
      # ones upstream ships together.
      FLOOR="golang.org/x/crypto@v0.56.0 golang.org/x/net@v0.58.0 golang.org/x/text@v0.41.0 golang.org/x/mod@v0.40.0
        google.golang.org/grpc@v1.83.2 go.opentelemetry.io/otel@v1.46.0 go.opentelemetry.io/otel/metric@v1.46.0
        go.opentelemetry.io/otel/sdk@v1.46.0 go.opentelemetry.io/otel/sdk/metric@v1.46.0
        go.opentelemetry.io/otel/trace@v1.46.0 go.opentelemetry.io/contrib/detectors/gcp@v1.46.0
        go.opentelemetry.io/contrib/instrumentation/google.golang.org/grpc/otelgrpc@v0.71.0
        go.opentelemetry.io/contrib/instrumentation/net/http/otelhttp@v0.71.0"
      # Go semver order (a release outranks its prereleases); busybox sort -V does not.
      vlt() { awk -v a="${1#v}" -v b="${2#v}" 'function pp(s,  p){sub(/\+.*/,"",s);p=index(s,"-");if(p){C=substr(s,1,p-1);P=substr(s,p+1)}else{C=s;P=""}} function cmp(x,y,  i,n,m,X,Y){n=split(x,X,".");m=split(y,Y,".");for(i=1;i<=n&&i<=m;i++){if(X[i]==Y[i])continue;if(X[i]~/^[0-9]+$/&&Y[i]~/^[0-9]+$/)return (X[i]+0<Y[i]+0)?-1:1;if(X[i]~/^[0-9]+$/)return -1;if(Y[i]~/^[0-9]+$/)return 1;return (X[i]<Y[i])?-1:1}return (n<m)?-1:(n>m)?1:0} BEGIN{pp(a);ca=C;pa=P;pp(b);cb=C;pb=P;c=cmp(ca,cb);if(c==0){if(pa==pb)c=0;else if(pa=="")c=1;else if(pb=="")c=-1;else c=cmp(pa,pb)}exit !(c<0)}'; }
      need=""
      for mv in $FLOOR; do
        have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${mv%@*}" 2>/dev/null)"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        vlt "$have" "${mv#*@}" && need="$need $mv"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || go get $need
      go mod tidy
      go build -trimpath -tags sqlite_unlock_notify \
        -ldflags "-s -w -X main.Version=${{package.version}}" -o policyreporter .
      install -Dm755 policyreporter "${{targets.destdir}}/app/policyreporter"
      mkdir -p "${{targets.destdir}}/app/templates"
      cp -a templates/*.html "${{targets.destdir}}/app/templates/"
