# BookStack (BookStackApp/BookStack, MIT): wiki and documentation platform (shelves, books,
# chapters, pages) with WYSIWYG and Markdown editors and a REST API, on MySQL or MariaDB. The release
# tag carries the built frontend (public/dist); composer installs vendor/ at build. Served by
# php-fpm 8.4 behind QuenchWorks' nginx (quench-nginx, built from source in the same build) under
# supervisord, after `artisan migrate` has run. Configuration is Laravel's
# environment variables (APP_KEY, APP_URL, DB_*). LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(26.09.3)
declare -A SHA256=(
  [26.09.3]=d2547a63aee9bca10281eeffcb4965cb3a85f20217d62430c538ec6ad4817a75
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
