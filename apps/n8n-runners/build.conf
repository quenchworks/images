# UNBLOCKED 2026-07-09: n8n-runners now builds + passes the 0-CVE gate + boots (smoke test:
# launcher loads config, node/python runtimes + runner deps import, all package managers ok).
# The two flagged transitive deps in the JS runner tree are cleared IMAGE-SIDE via npm
# `overrides` in melange.yaml: fast-xml-parser 4.4.1 -> 5.7.0 and uuid 8.3.2 -> 11.1.1 (their
# Trivy "Fixed versions"). file-type is no longer flagged. Also fixed the npm >=12 install-
# script gating with --dangerously-allow-all-scripts (see melange.yaml).
#
# n8n-runners: the EXTERNAL task-runner sidecar for n8n (image `n8nio/runners` upstream).
# A companion image to quench-n8n — NOT a standalone app and NOT its own chart. The n8n
# chart references it. It bundles three things, exactly as upstream's
# docker/images/runners/Dockerfile does:
#
#   1. task-runner-launcher  — a small Go binary (github.com/n8n-io/task-runner-launcher)
#      that reads /etc/n8n-task-runners.json, connects to the n8n task broker
#      (N8N_RUNNERS_TASK_BROKER_URI, auth N8N_RUNNERS_AUTH_TOKEN) and launches runners.
#      We build it FROM SOURCE (git-checkout by commit) on Wolfi go-1.25.
#   2. JavaScript runner    — the npm package `@n8n/task-runner` (immutable registry
#      tarball, sha-pinned) + its production node_modules, run on nodejs-24.
#   3. Python runner        — `@n8n/task-runner-python`, whose source lives in the n8n
#      monorepo (packages/@n8n/task-runner-python). We fetch the sha-pinned GitHub source
#      archive, then build its venv at /opt/runners/task-runner-python/.venv with `uv`
#      (the venv carries ONLY the runner's own pinned deps: urllib3, websockets, sentry-sdk).
#
# n8n-runners ships on its OWN cadence (it is not version-locked to quench-n8n). For each
# runners release we pin the exact
# JS-runner version, launcher version, and monorepo commit that upstream's runners image
# for that n8n release bundles (read from the Dockerfile / package.json at the n8n@X.Y.Z tag).
#
# NO USER PACKAGES ARE BAKED IN. Unlike the reference runner.Dockerfile (which baked
# `requests`), this shipped image contains ONLY the launcher + runners + package managers.
# Operators install their own extra Python/JS packages at deploy time via the chart hook
# (a mounted requirements.txt/package.json + an init step running uv/pip/npm/poetry). Any
# CVEs in user-added packages are the operator's responsibility, not this image's.
#
# LICENSE — CAUTION: fair-code, NOT OSI. The JS + Python runners are under the n8n
# Sustainable Use License v1.0; the launcher is Apache-2.0. We tag the image with the
# runner license (the CAUTION-tier component).
FROM_SOURCE=1
# STATUS 2026-07-28: UNBLOCKED for gating on 2.31.7.
#
# History: 2.31.6 was a real improvement over the published 2.29.11 (4 fixable vs 13) but
# still tripped the gate — 2 HIGH + 2 MEDIUM in its npm tree — so it was held BLOCKED. On
# 2026-07-27 the fixes for exactly those 4 landed in melange.yaml as npm `overrides`, the
# same treatment apps/n8n uses: brace-expansion -> 5.0.8 (the 2 HIGH: CVE-2026-14257 has a
# single `<= 5.0.7` affected range spanning every line, so 5.0.8 is the only fix, and it
# needs the CJS interop shim in the recipe) and tar -> 7.5.22 (the MEDIUMs: GHSA-r292-9mhp-454m
# needs >= 7.5.21, and n8n packages pin tar exactly so it cannot float). BLOCKED=1 was then
# kept for one reason only: no gate had been RUN against those edits.
#
# 2.31.7 does NOT change the CVE surface those overrides address, so it inherits the fix
# rather than needing a new one. Verified against upstream, not assumed:
#   * the JS runner is @n8n/task-runner 2.31.3 at BOTH n8n@2.31.6 and n8n@2.31.7 — the same
#     immutable registry tarball, same sha256 (JSSHA below is unchanged), so the npm tree the
#     4 findings live in is byte-identical;
#   * the python runner's pins are identical too (urllib3==2.7.0, websockets>=15.0.1,
#     sentry-sdk>=2.35.2 at both tags);
#   * task-runner-launcher is still 1.4.7 at the same commit, so the Go binary is unchanged.
# Only the monorepo source archive differs (MONOSHA re-pinned). The residual 4 are therefore
# the same 4, and they are the ones the overrides pin to their published fixed versions —
# the identical mechanism that shipped apps/n8n and apps/renovate green. So BLOCKED is
# removed and the gate decides; the apk-side python-3.1x findings on the published 2.29.11
# need no recipe change either, since no apk version is pinned here and a rebuild resolves
# the current Wolfi -rN.
#
# 2026-07-30 — 2.31 BAND REPLACED BY 2.32. apps/n8n moved to 2.32.6, and this sidecar is
# tagged with the n8n version it pairs with, so the band moves with it rather than adding a
# 4th entry (the build workflow's prep job slices VERSIONS to the last 3, so a 4th would
# silently never build). Re-read from the n8n@2.32.6 tag, not assumed:
#   * JS runner  -> @n8n/task-runner 2.32.2 (packages/@n8n/task-runner/package.json);
#     its DIRECT deps are unchanged from 2.31.3 apart from first-party @n8n/* bumps, and
#     none of the four npm `overrides` (brace-expansion / fast-xml-parser / tar / uuid) is a
#     direct dep, so no EOVERRIDE and no override is a downgrade. dist/start.js unmoved.
#   * launcher   -> still LAUNCHER_VERSION=1.4.7 at the same commit, so the Go binary and
#     its 0-CVE module-float floors are untouched (nothing to re-check per
#     docs/go-module-float.md).
#   * python runner pins unchanged: urllib3==2.7.0, websockets>=15.0.1, sentry-sdk>=2.35.2.
# The brace-expansion shim stays ASSERT-IF-PRESENT: whether 2.32.2's tree pulls the dep is
# not guaranteed either way, and an absent copy is legitimate (it broke the build once).
#
# STATUS 2026-09-16 — BLOCKED ON ZLIB ONLY. Not broken: the image builds, the npm tree is
# clean, and the gate is down to a single finding that has no fix to apply.
#
# Measured, run 35096882879 (commit d06453b), BOTH arches, identical result:
#   Total: 1 (LOW: 0, MEDIUM: 1, HIGH: 0, CRITICAL: 0)
#   zlib 1.3.2.1_rc20260601-r0  CVE-2026-85091  MEDIUM  "Fixed version" 1.3.3-r0
# Wolfi has no 1.3.3-r0 — its newest zlib IS the installed 1.3.2.1_rc20260601-r0 (checked
# against the live APKINDEX: 1.3.1-r5..r51, 1.3.1.2-r1..r3, 1.3.2-r0..r7, 1.3.2.1_rc...-r0,
# and nothing beyond), because upstream zlib has not tagged 1.3.3. Nothing in this recipe
# can clear it; it lifts when Wolfi ships the fixed apk and a plain rebuild picks it up.
#
# The previous gate (run 35069925197, commit c656c09) also flagged two npm packages; both
# are fixed in melange.yaml as of d06453b and now scan clean:
#   * qs         6.15.2 -> 6.16.0 (CVE-2026-82417, CVE-2026-82562) — transitive via n8n-core
#     and @n8n/backend-network, same major, no API change.
#   * stream-json 1.9.1 -> 3.5.0 (CVE-2026-71429) — transitive via @n8n/backend-common.
#     3.5.0 is the first fixed release, so the two-major jump is forced, and 3.x is an
#     ESM-only API redesign; the recipe migrates the single consumer's three call shapes
#     and proves the result on the real installed tree. See melange.yaml.
# So this stays BLOCKED for exactly one reason, and it is not one we can fix.
BLOCKED=1
VERSIONS=(2.32.7)

# --- per-n8n-version component pins -------------------------------------------------------
# JS runner (npm package `@n8n/task-runner`) version bundled with each n8n release
# (read from packages/@n8n/task-runner/package.json at the n8n@X.Y.Z tag)
# n8n-runners releases on its own cadence: n8n@2.32.6 bundles JS runner 2.32.2 + launcher
# 1.4.7 (the launcher tag/commit has not moved since the 2.29 line).
declare -A JSVER=(   [2.31.6]=2.31.3 [2.31.7]=2.31.3 [2.32.6]=2.32.2 [2.32.7]=2.32.2 )
# sha256 of the @n8n/task-runner npm registry tarball (immutable)
declare -A JSSHA=(
  [2.31.6]=0dc5728fe0a4da16ad9e5d79e27d76d50bcc822ac3886c273b62007a23244504
  [2.31.7]=0dc5728fe0a4da16ad9e5d79e27d76d50bcc822ac3886c273b62007a23244504
  [2.32.6]=656a51fc4a76857d0c73e431810e0e38667653d3f2e9584db627cba9621b36d4
  [2.32.7]=656a51fc4a76857d0c73e431810e0e38667653d3f2e9584db627cba9621b36d4
)
# task-runner-launcher release (Go) + its immutable commit
# (LAUNCHER_VERSION ARG in docker/images/runners/Dockerfile at the n8n@X.Y.Z tag)
declare -A LVER=(    [2.31.6]=1.4.7 [2.31.7]=1.4.7 [2.32.6]=1.4.7 [2.32.7]=1.4.7 )
declare -A LCOMMIT=(
  [2.31.6]=fad71fc0dab52a6b6558765d1431c7846cfd816f
  [2.31.7]=fad71fc0dab52a6b6558765d1431c7846cfd816f
  [2.32.6]=fad71fc0dab52a6b6558765d1431c7846cfd816f
  [2.32.7]=fad71fc0dab52a6b6558765d1431c7846cfd816f
)
# sha256 of the n8n monorepo GitHub source archive (holds the python runner source)
declare -A MONOSHA=(
  [2.31.6]=5f8023b4a146f44e3aaf97073b3d2319281d6a14726ae7bd370c199a85c86e20
  [2.31.7]=39e2bbd9cbd7f4b6a76cee6f60c1fcedcc2f7f8ed76e5861dbd35969e36204e7
  [2.32.6]=7a925903038f4f7b45c9f6782c6a198d6be4c0c0dcce57e3e1eccaea436ddcb5
  [2.32.7]=ee72e6d7d5f3890aa3ef89785f54fac751ac460cc73ee3ce30895db7c7e4676a
)

render() {
  local v="$1"
  echo "s/__VER__/${v}/g;" \
       "s/__JSVER__/${JSVER[$v]}/g;" \
       "s|__JSSHA__|${JSSHA[$v]}|g;" \
       "s/__LVER__/${LVER[$v]}/g;" \
       "s/__LCOMMIT__/${LCOMMIT[$v]}/g;" \
       "s|__MONOSHA__|${MONOSHA[$v]}|g"
}
