# Packages the n8n EXTERNAL task-runner sidecar (upstream `n8nio/runners`) onto Wolfi.
# Three components, assembled exactly as upstream's docker/images/runners/Dockerfile does,
# but built hardened + clean-room from immutable sources:
#
#   1. task-runner-launcher  (Go)      -> /usr/bin/task-runner-launcher
#      Built FROM SOURCE (git-checkout, commit-pinned) on Wolfi go-1.25. Apache-2.0.
#   2. JavaScript runner (@n8n/task-runner npm dist) -> /opt/runners/task-runner-javascript
#      Fetched as the immutable npm registry tarball + production node_modules (nodejs-24).
#   3. Python runner (@n8n/task-runner-python)       -> /opt/runners/task-runner-python
#      Source from the sha-pinned n8n monorepo archive; venv built at .venv with `uv`,
#      carrying ONLY the runner's own pinned deps (urllib3, websockets, sentry-sdk).
#
# The launcher is the entrypoint; it reads /etc/n8n-task-runners.json and connects to the
# n8n task broker (N8N_RUNNERS_TASK_BROKER_URI) with N8N_RUNNERS_AUTH_TOKEN, then launches
# the JS runner (health port 5681) and Python runner (health port 5682).
#
# NO user packages baked in (unlike the reference runner.Dockerfile). Operators add their
# own extra Python/JS packages at deploy time via the chart hook; those are their concern.
#
# LICENSE — CAUTION: fair-code, NOT OSI. Runners are under the n8n Sustainable Use License
# v1.0; the launcher is Apache-2.0.
package:
  name: quench-n8n-runners
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened n8n task runners (launcher + JavaScript + Python), external sidecar for n8n"
  copyright:
    - license: LicenseRef-n8n-Sustainable-Use-License-1.0
  dependencies:
    runtime:
      - nodejs-24              # JS runner + the launcher spawns node
      - python-3.13            # base interpreter the Python runner venv references
      - ca-certificates-bundle # TLS to the task broker and any user integrations
      - tzdata                 # runners honour GENERIC_TIMEZONE
      - tini                   # PID-1 init: reaps runner subprocesses (matches upstream entrypoint)
      # --- package managers: operator "bring your own packages" at deploy time ----------
      # All Wolfi-tracked (0-CVE maintained). Present so a chart-time init step can install
      # extra deps into the venv / JS tree with whichever tool the operator prefers.
      - uv                     # Python (fast; also builds the shipped venv at build time)
      - py3.13-poetry          # Python (poetry)
      - npm                    # JS (npm)
      - yarn                   # JS (yarn classic)
      - pnpm                   # JS (pnpm)

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - wget                   # download the JS runner tarball + monorepo source in runs steps
      - git                    # git-checkout of the launcher source
      # --- Go (launcher) --- newer than the launcher go.mod's `go 1.25.11` directive so
      # GOTOOLCHAIN=local never triggers a toolchain download.
      - go-1.26
      # --- Node (JS runner install) ---
      - nodejs-24
      - npm
      - node-gyp               # native modules in the JS runner tree (n8n-core deps)
      - python-3.13            # node-gyp needs python3 at build time
      # --- Python runner venv (uv) ---
      - uv

pipeline:
  # ---------------------------------------------------------------------------
  # 1. task-runner-launcher (Go, from source). Upstream ships a prebuilt release
  #    binary; we build it ourselves on Wolfi go-1.25 for a clean-room, 0-CVE
  #    static binary. The Makefile is a plain `go build cmd/launcher/main.go`
  #    (no version ldflag), so we mirror that.
  # ---------------------------------------------------------------------------
  - uses: git-checkout
    with:
      repository: https://github.com/n8n-io/task-runner-launcher
      tag: __LVER__
      expected-commit: __LCOMMIT__
      destination: launcher-src

  - runs: |
      set -eu
      cd launcher-src
      export CGO_ENABLED=0
      export GOFLAGS="-buildvcs=false -mod=mod"
      export GOTOOLCHAIN=local
      # 0-CVE float: the launcher's transitive tree pins golang.org/x/sys v0.18.0
      # (CVE-2026-39824) and golang.org/x/text v0.14.0 (CVE-2026-56852). Bump both
      # to their fixed releases and re-resolve. (-mod=mod above lets go get edit go.mod.)
      go get golang.org/x/sys@v0.44.0
      go get golang.org/x/text@v0.41.0 golang.org/x/net@v0.58.0 golang.org/x/crypto@v0.56.0 golang.org/x/sys@v0.47.0 google.golang.org/grpc@v1.83.2
      go mod tidy
      mkdir -p /home/build/stage/usr/bin
      go build -trimpath -ldflags="-s -w" \
        -o /home/build/stage/usr/bin/task-runner-launcher ./cmd/launcher
      /home/build/stage/usr/bin/task-runner-launcher --help >/dev/null 2>&1 || true

  # ---------------------------------------------------------------------------
  # 2. JavaScript runner: the immutable @n8n/task-runner npm tarball + its
  #    production node_modules. Mirrors the quench-n8n recipe (delete the
  #    unpublished internal devDependencies, legacy-peer-deps install, strip
  #    foreign-arch / musl prebuilt native binaries so apko can solve the apk).
  #    melange `runs` steps have network access at build time.
  # ---------------------------------------------------------------------------
  - runs: |
      set -eu
      js="/home/build/stage/opt/runners/task-runner-javascript"
      mkdir -p "$js"
      cd "$js"
      # Fetch + verify the immutable npm registry tarball.
      url="https://registry.npmjs.org/@n8n/task-runner/-/task-runner-__JSVER__.tgz"
      wget -q -O tr.tgz "$url"
      echo "__JSSHA__  tr.tgz" | sha256sum -c -
      tar --strip-components=1 -xzf tr.tgz
      rm -f tr.tgz
      export CI=true npm_config_loglevel=warn
      export PYTHON="$(command -v python3.13 || command -v python3)"
      export npm_config_python="$PYTHON"
      # The published @n8n/task-runner package.json lists UNPUBLISHED internal workspace
      # packages under devDependencies; delete them so npm's arborist doesn't 404 while
      # resolving the tree even under --omit=dev (same issue/fix as the n8n recipe).
      npm pkg delete devDependencies
      # --- npm dependency overrides (0-CVE gate) ------------------------------------------
      # The JS runner's transitive tree pins two CVE-flagged deps; pin every copy to its Trivy
      # "Fixed version" (both are TRANSITIVE, not direct deps of @n8n/task-runner, so a plain
      # override does not trip npm's EOVERRIDE direct-dependency guard):
      #   * fast-xml-parser 4.4.1 -> 5.7.0 (CVE-2026-25896 CRITICAL + 5 more; 5.7.0 is the only
      #     version clearing all, incl. CVE-2026-41650 which has no 4.x fix)
      #   * uuid 8.3.2 -> 11.1.1 (CVE-2026-41907; fix only in the 11.x major)
      #   * brace-expansion -> 5.0.8 (CVE-2026-14257 HIGH). The advisory's affected range is a
      #     single `<= 5.0.7` spanning EVERY line, so the 1.x/2.x maintenance heads (1.1.16 /
      #     2.1.2) are affected too and 5.0.8 is the only fix; see the interop step below.
      #   * tar -> 7.5.22 (GHSA-r292-9mhp-454m MED needs >= 7.5.21). Overridden rather than left
      #     to float because n8n packages pin tar EXACTLY; 7.5.22 is the newest 7.5.x.
      #   * qs 6.15.2 -> 6.16.0 (CVE-2026-82417 + CVE-2026-82562 DoS). Transitive via n8n-core
      #     and @n8n/backend-network (both pin 6.15.2 exactly, so it cannot float); same 6.x
      #     major, no API change.
      #   * stream-json 1.9.1 -> 3.5.0 (CVE-2026-71429 DoS). Transitive via @n8n/backend-common
      #     (pinned 1.9.1 exactly). 3.5.0 is the first fixed release, so the two-major jump is
      #     forced -- and 3.x is an ESM-only API redesign, hence the migration step below.
      node -e '
        const fs=require("fs");const p=JSON.parse(fs.readFileSync("package.json","utf8"));
        // nanoid is a DIRECT dep here (pinned 3.3.8), and npm refuses an override that
        // conflicts with a direct dependency (EOVERRIDE) -- bump the dep itself; the
        // scoped overrides below still cover every transitive copy per major.
        if (p.dependencies && p.dependencies.nanoid) p.dependencies.nanoid="3.3.18";
        p.overrides=Object.assign(p.overrides||{},{
          "brace-expansion":"5.0.9",
          "fast-xml-parser":"5.7.0",
          "nanoid@3":"3.3.18",
          "nanoid@5":"5.1.6",
          "qs":"6.16.0",
          "stream-json":"3.5.0",
          "tar":"7.5.22",
          "uuid":"11.1.1"
        });
        fs.writeFileSync("package.json",JSON.stringify(p,null,2));
      '
      # --dangerously-allow-all-scripts: npm >=12 blocks dependency install/postinstall scripts
      # by default (allowScripts gating) and only WARNS, so native bindings in the JS runner tree
      # would be silently skipped. This hermetic, sha-pinned build wants the pre-npm-12 behavior.
      npm install --omit=dev --no-audit --no-fund --legacy-peer-deps --dangerously-allow-all-scripts

      # --- brace-expansion CVE-2026-14257: 5.0.8 + the CJS interop it broke ---------------
      # 5.0.8 rewrote the CJS entry to a NAMED-only export (`exports.expand`, `__esModule: true`,
      # no callable default). minimatch 10.x consumes that shape natively, but minimatch 3.x/5.x
      # do `require("brace-expansion")(pattern)` and 9.0.9 (the newest 9.x, which REVERTED to
      # brace-expansion ^2.0.2) does `__importDefault(...).default(pattern)` — both throw
      # "expand is not a function" at LOAD time. The override above pins every copy to the fixed
      # 5.0.8, and this step re-exports the function as module.exports (named props kept) so any
      # consumer shape the tree happens to resolve keeps working on the patched code. The
      # EXPANSION_MAX_LENGTH bound that fixes the CVE is untouched: no .trivyignore, no --skip,
      # no VEX. The assert fails the build if a copy escaped the override.
      python3.13 - <<'PYEOF'
      import json, os
      SHIM = ('\n// QuenchWorks: brace-expansion 5.x exports a NAMED-only CJS binding; re-export the\n'
              '// function itself (named props kept) so minimatch 3.x/5.x/9.0.9 consumers keep working.\n'
              'module.exports = Object.assign(expand, exports, { default: expand });\n')
      # os.walk, not glob: a hidden store dir (pnpm's node_modules/.pnpm/) is invisible to
      # glob's **. Symlinks are not followed, so nothing is visited twice.
      copies = sorted(os.path.join(r, 'brace-expansion', 'package.json')
                      for r, dirs, _ in os.walk('node_modules') if 'brace-expansion' in dirs)
      # Absence is LEGITIMATE here and must not fail the build: 2.31.7's runner tree no
      # longer pulls brace-expansion at all (2.31.6's did, via glob->minimatch). The
      # override is then a harmless no-op. What must still fail is a copy that EXISTS
      # and escaped the pin, so assert-if-present rather than assert-exists.
      stale = [p for p in copies if json.load(open(p))['version'].split('.')[0] != '5']
      assert not stale, "override missed brace-expansion copies: %s" % stale
      if not copies:
          print("brace-expansion: absent from this tree, override is a no-op")
      n = 0
      for pj in copies:
          cjs = os.path.join(os.path.dirname(pj), 'dist/commonjs/index.js')
          if 'Object.assign(expand' not in open(cjs).read():
              open(cjs, 'a').write(SHIM); n += 1
      print("brace-expansion: %d copy(ies) at 5.x, %d shimmed" % (len(copies), n))
      PYEOF
      # Prove the shim on the REAL installed copies: require() must yield a callable that
      # expands. A future 5.x that moves the CJS entry fails the build here instead of at runtime.
      for d in $(find node_modules -type d -name brace-expansion); do
        node -e "const b=require(require('path').resolve('$d'));
                 if (typeof b!=='function'||b('a{b,c}').join()!=='ab,ac')
                   throw new Error('brace-expansion CJS interop broken at $d');"
      done

      # --- qs / stream-json: assert the overrides landed, then migrate stream-json's API ---
      # An override that silently does not apply would ship a false green, so every installed
      # copy is checked against the pin BEFORE anything else. stream-json 3.5.0 additionally
      # needs a consumer-side migration: it is ESM-only with a redesigned API, and the one
      # consumer in this tree (@n8n/backend-common's dist/utils/flatted-async.js) speaks 1.x:
      #   require('stream-json/Assembler')  -> subpath gone; it is './assembler.js' now, and the
      #                                        3.x exports map has no extensionless resolution
      #   parser()                          -> an async generator in 3.x, not a Transform stream;
      #                                        the pipe()-able one is parserStream()
      #   asm.on('done', cb)                -> Assembler is no longer an EventEmitter; asm.onDone(cb)
      # Rewrite exactly those three at every consumer. The CVE fix itself is untouched: no
      # .trivyignore, no --skip, no VEX.
      python3.13 - <<'PYEOF'
      import json, os, re

      def copies(name):
          # os.walk, not glob: a hidden store dir (pnpm's node_modules/.pnpm/) is invisible to
          # glob's **. Symlinks are not followed, so nothing is visited twice. The parent must
          # be a node_modules dir -- an INSTALLED package always is, whereas a vendored source
          # folder that merely shares the name is not (langsmith ships a .../internal/qs/ with
          # no package.json, which an unanchored match would try to read).
          return sorted(os.path.join(r, name, 'package.json')
                        for r, dirs, _ in os.walk('node_modules')
                        if name in dirs and os.path.basename(r) == 'node_modules')

      for name, want in (('qs', '6.16.0'), ('stream-json', '3.5.0')):
          found = [(p, json.load(open(p))['version']) for p in copies(name)]
          stale = [(p, v) for p, v in found if v != want]
          assert not stale, "%s override missing or incompatible: %s" % (name, stale)
          # Absence is legitimate (a later runner may drop the dep); the override is then a
          # no-op. What must fail is a copy that EXISTS and escaped the pin -- caught above.
          print("%s: %d copy(ies) at %s" % (name, len(found), want or ''))

      migrated = []
      for root, dirs, files in os.walk('node_modules'):
          if os.path.basename(root) == 'stream-json':
              dirs[:] = []
              continue
          for f in files:
              if not f.endswith('.js'):
                  continue
              p = os.path.join(root, f)
              try:
                  src = open(p, encoding='utf-8').read()
              except (UnicodeDecodeError, OSError):
                  continue
              if 'stream-json' not in src:
                  continue
              out = src.replace('stream-json/Assembler', 'stream-json/assembler.js')
              # \b, not '.parser(': tsc emits the indirect-call form `(0, mod.parser)()`, so the
              # token is followed by ')' rather than '('. \b also leaves `.parserStream` alone.
              bindings = re.findall(r'(?:const|var|let)\s+(\w+)\s*=\s*require\(["\']stream-json["\']\)', out)
              for var in bindings:
                  out = re.sub(r'\b%s\.parser\b' % re.escape(var), '%s.parserStream' % var, out)
              out = re.sub(r"\.on\((['\"])done\1\s*,\s*", '.onDone(', out)
              if out != src:
                  open(p, 'w', encoding='utf-8').write(out)
                  migrated.append(p)
              left = [m for m in ('stream-json/Assembler', ".on('done'", '.on("done"') if m in out]
              left += ['%s.parser' % v for v in bindings if re.search(r'\b%s\.parser\b' % re.escape(v), out)]
              assert not left, "stream-json 1.x API survived the migration at %s: %s" % (p, left)
      print("stream-json: migrated %d consumer file(s) to the 3.x API" % len(migrated))
      PYEOF
      # Prove the migration on the REAL installed consumers: the flatted parser must still
      # return what it returned on 1.9.1. A future stream-json that moves the API again fails
      # the build here instead of at runtime inside a workflow.
      node - <<'JSEOF'
      const fs = require("fs"), path = require("path"), hits = [];
      (function walk(d) {
        for (const e of fs.readdirSync(d, { withFileTypes: true })) {
          const p = path.join(d, e.name);
          if (e.isDirectory()) { if (e.name !== "stream-json") walk(p); }
          else if (e.name.endsWith(".js")) {
            let s; try { s = fs.readFileSync(p, "utf8"); } catch { continue; }
            if (s.includes("stream-json") && s.includes("parseFlattedAsync")) hits.push(p);
          }
        }
      })("node_modules");
      if (!hits.length) {
        console.error("stream-json: no flatted consumer found -- the 3.x migration is unproven, re-check the tree");
        process.exit(1);
      }
      (async () => {
        for (const p of hits) {
          const r = await require(path.resolve(p)).parseFlattedAsync(JSON.stringify([{ a: "1" }, "x"]));
          if (JSON.stringify(r) !== '{"a":"x"}')
            throw new Error("parseFlattedAsync regressed at " + p + ": " + JSON.stringify(r));
        }
        console.log("stream-json: " + hits.length + " flatted consumer(s) parse correctly on 3.x");
      })().catch(e => { console.error(e.message); process.exit(1); });
      JSEOF

      # Strip foreign-arch + musl prebuilt native binaries (the JS runner pulls n8n-core /
      # n8n-workflow, whose deps vendor multi-arch .node files: @sentry/node-*, isolated-vm,
      # oracledb, ...). Non-host-arch or musl ELFs make melange's SCA emit unsatisfiable
      # so:ld-linux-<foreign> / so:libc.musl-* deps and break apko. We ship ONE glibc arch
      # per image, so keep host-arch glibc objects only. Also trims size + CVE surface.
      case "$(uname -m)" in
        x86_64)  keep=3e00 ;;
        aarch64) keep=b700 ;;
        *)       keep="" ;;
      esac
      # Candidate binaries: shared objects (.node/.so) AND bare prebuilt executables shipped
      # with NO extension (in bin/ dirs or arch-suffixed names). Drop any whose real ELF
      # e_machine isn't the host arch, plus any musl-linked one (Wolfi is glibc).
      if [ -n "$keep" ]; then
        find node_modules -type f \( -name '*.node' -o -name '*.so' -o -name '*.so.*' \
             -o -path '*/bin/*' -o ! -name '*.*' \) | \
        while IFS= read -r f; do
          case "$f" in *musl*) rm -f "$f"; continue ;; esac   # Wolfi is glibc
          [ "$(od -An -tx1 -N4 "$f" 2>/dev/null | tr -d ' \n')" = "7f454c46" ] || continue
          m="$(od -An -tx1 -j18 -N2 "$f" 2>/dev/null | tr -d ' \n')"
          [ "$m" = "$keep" ] || rm -f "$f"
        done
      fi
      rm -rf node_modules/.cache 2>/dev/null || true
      find node_modules -type d -empty -delete 2>/dev/null || true

  # ---------------------------------------------------------------------------
  # 3. Python runner (@n8n/task-runner-python). Source lives in the n8n monorepo;
  #    fetch the sha-pinned GitHub source archive and build a relocatable venv at
  #    /opt/runners/task-runner-python/.venv with uv, mirroring upstream's
  #    `uv sync --frozen --no-dev --all-extras --no-editable` + `uv pip install .`.
  #    The venv is built AT its final runtime path so its interpreter symlink +
  #    prefix resolve correctly at runtime (python-3.13 is a runtime dep).
  # ---------------------------------------------------------------------------
  - runs: |
      set -eu
      work=/home/build/pysrc
      mkdir -p "$work"
      cd "$work"
      wget -q -O mono.tgz "https://codeload.github.com/n8n-io/n8n/tar.gz/refs/tags/n8n@__VER__"
      echo "__MONOSHA__  mono.tgz" | sha256sum -c -
      tar xzf mono.tgz
      rm -f mono.tgz
      src="$(dirname "$(find . -type f -path '*task-runner-python/pyproject.toml' | head -1)")"
      [ -n "$src" ] && [ -d "$src" ] || { echo "python runner source not found"; exit 1; }
      # Build the venv at the FINAL path so baked interpreter/prefix paths are valid at runtime.
      py="/opt/runners/task-runner-python"
      mkdir -p "$py"
      cp -a "$src"/. "$py"/
      cd "$py"
      export UV_LINK_MODE=copy UV_PYTHON_DOWNLOADS=never
      # Built AT the final runtime path (/opt/runners/task-runner-python/.venv), so the venv's
      # interpreter symlink + prefix resolve correctly at runtime (python-3.13 is a runtime dep).
      uv venv --python "$(command -v python3.13)" .venv
      # Installs the runner's pinned deps (urllib3, websockets) + the sentry extra + the
      # project itself (the `src` package) into the venv, non-editable. Mirrors upstream.
      uv sync --frozen --no-dev --all-extras --no-editable
      # Prune caches/bytecode that bloat the image.
      find . -type d -name '__pycache__' -prune -exec rm -rf {} + 2>/dev/null || true
      rm -rf .venv/share 2>/dev/null || true
      # uv leaves a world-writable .venv/.lock (mode 666); it's an internal build-time lock,
      # not needed at runtime, and the melange worldwrite linter rejects it. Remove it.
      rm -f .venv/.lock 2>/dev/null || true
      # Stage it for install into destdir.
      mkdir -p /home/build/stage/opt/runners
      cp -a "$py" /home/build/stage/opt/runners/

  # ---------------------------------------------------------------------------
  # 4. Config + assemble into destdir. The launcher reads /etc/n8n-task-runners.json.
  #    We ship a config with the health-check host bound to 0.0.0.0 (so k8s probes
  #    reach 5681/5682) and the code-execution allowlists OPEN (stdlib/external "*",
  #    builtin/external "*") — this is a self-hosted automation runner where the
  #    operator owns the workflows; the allowlist is the mechanism the chart can
  #    tighten. Mirrors the reference n8n-task-runners.json.
  # ---------------------------------------------------------------------------
  - runs: |
      set -eu
      dest="${{targets.destdir}}"
      mkdir -p "$dest"
      cp -a /home/build/stage/. "$dest"/
      install -d "$dest/etc"
      install -m 0644 "$(pwd)/n8n-task-runners.json" "$dest/etc/n8n-task-runners.json"
      # The py3.13-poetry apk ships poetry as a MODULE only (no /usr/bin/poetry console
      # script). Bake a tiny launcher so operators can invoke `poetry` directly at deploy
      # time (python3.13 + the poetry module are both present at runtime).
      printf '#!/usr/bin/python3.13\nimport sys\nfrom poetry.console.application import main\nsys.exit(main())\n' > "$dest/usr/bin/poetry"
      chmod 0755 "$dest/usr/bin/poetry"
      # World-readable, but never group/other-writable (melange's worldwrite linter is strict);
      # apko sets runtime ownership (uid 1001) recursively.
      chmod -R a+rX,go-w "$dest/opt/runners" "$dest/usr/bin/task-runner-launcher"
      # runners run with HOME=/home/runner and workdir there.
      install -d "$dest/home/runner"

test:
  pipeline:
    - runs: |
        test -x /usr/bin/task-runner-launcher
        test -f /opt/runners/task-runner-javascript/dist/start.js
        test -d /opt/runners/task-runner-javascript/node_modules
        test -x /opt/runners/task-runner-python/.venv/bin/python
        test -f /etc/n8n-task-runners.json
        # the python runner venv must import its pinned deps + the runner module
        /opt/runners/task-runner-python/.venv/bin/python -c "import urllib3, websockets; print('py-runner deps ok')"
        # package managers present for operator customization
        for t in uv poetry npm yarn pnpm; do command -v "$t" >/dev/null || { echo "missing $t"; exit 1; }; done
