# chartdb: ChartDB (chartdb/chartdb, AGPL-3.0), a database diagram editor and visualizer: import a schema with one
# query, edit ER diagrams, export DDL. Images issue #94.
#
# From the release tag: npm install with DOMPurify overridden to its fixed 3.x release (it lands in the bundle), then
# tsc + vite build (upstream's build script also lints, which in the sandbox would scan this recipe). The static app
# is served by Wolfi nginx on 8080 with a static config.js: ChartDB Cloud links hidden, analytics off, no OpenAI key
# (upstream fills config.js with envsubst at start; the chart mounts its own). LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(1.21.0)
declare -A SHA256=(
  [1.21.0]=2ba4b774c078b38218c7d0405cdc3976fcd853a5b74eae89cc862a6d69c9d3ea
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
