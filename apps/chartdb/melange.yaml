# ChartDB (static Vite SPA served by nginx), built from the release tag.
package:
  name: quench-chartdb
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened ChartDB database diagram editor (static SPA served by nginx), built from source on Wolfi"
  copyright:
    - license: AGPL-3.0-only

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - nodejs-24
      - npm

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/chartdb/chartdb/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - runs: |
      set -eu
      export HOME="$(mktemp -d)" npm_config_cache="$(mktemp -d)" npm_config_fetch_retries=5
      grep -q '"version": "${{package.version}}"' package.json
      # DOMPurify 3.2.7 (HIGH and more, fixed on 3.x) is bundled into the app
      node -e 'const f="package.json",p=JSON.parse(require("fs").readFileSync(f));p.overrides={...(p.overrides||{}),dompurify:"^3.4.17"};require("fs").writeFileSync(f,JSON.stringify(p,null,2))'
      npm install --include=dev --no-audit --no-fund
      node -e 'const v=require("./node_modules/dompurify/package.json").version; if(!/^3\.(4\.(1[7-9]|[2-9][0-9])|[5-9])/.test(v)){console.error("FATAL: dompurify "+v);process.exit(1)} console.log("dompurify",v)'
      npx tsc -b
      # the bundle is large: the default V8 heap runs out
      NODE_OPTIONS=--max-old-space-size=6144 NODE_ENV=production npx vite build
      test -f dist/index.html

      d="${{targets.destdir}}"
      install -d "$d/usr/share/nginx/html" "$d/etc/chartdb"
      cp -a dist/. "$d/usr/share/nginx/html/"
      # upstream renders this at start from environment variables; here it is static (the chart can mount its own)
      printf '%s\n' 'window.env = { OPENAI_API_KEY: "", OPENAI_API_ENDPOINT: "", LLM_MODEL_NAME: "", HIDE_CHARTDB_CLOUD: "true", DISABLE_ANALYTICS: "true" };' > "$d/etc/chartdb/config.js"
      cat > "$d/etc/chartdb/nginx.conf" <<'EOF'
      daemon off;
      worker_processes auto;
      pid /tmp/nginx.pid;
      error_log /dev/stderr notice;

      events {
          worker_connections 1024;
      }

      http {
          include       /etc/nginx/mime.types;
          default_type  application/octet-stream;

          client_body_temp_path /tmp/client_body_temp;
          proxy_temp_path       /tmp/proxy_temp;
          fastcgi_temp_path     /tmp/fastcgi_temp;
          uwsgi_temp_path       /tmp/uwsgi_temp;
          scgi_temp_path        /tmp/scgi_temp;

          access_log /dev/stdout;
          sendfile      on;
          tcp_nopush    on;
          gzip          on;
          server_tokens off;

          server {
              listen      8080;
              server_name _;
              root        /usr/share/nginx/html;
              index       index.html;

              location = /config.js {
                  default_type application/javascript;
                  alias /etc/chartdb/config.js;
              }
              location / {
                  try_files $uri $uri/ /index.html;
              }
          }
      }
      EOF

test:
  pipeline:
    - runs: |
        test -f /usr/share/nginx/html/index.html
        test -f /etc/chartdb/config.js
