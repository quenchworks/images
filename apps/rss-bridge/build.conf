# rss-bridge: RSS-Bridge (RSS-Bridge/rss-bridge, Unlicense), feeds (Atom, JSON, HTML, Mrss, plaintext) for sites
# that have none, with 400+ bridges. Images issue #87.
#
# From the release tarball (PHP, no runtime composer dependencies: composer.lock holds dev tools only). php-fpm
# and QuenchWorks' nginx under supervisord as uid 1001; nginx executes index.php only. Settings come from
# RSSBRIDGE_<section>_<key> environment variables (upstream's mechanism); the file cache is /var/cache/rss-bridge.
# Releases are dated tags. LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(2025-08-05)
declare -A SHA256=(
  [2025-08-05]=0ec59576ccc2947925cad3255923d086b2b59b6fbbed54747eb97b7ad63f3218
)
# apk versions cannot carry dashes: the package is 2025.08.05, the tag and image stay 2025-08-05
render() { echo "s/__PKGVER__/${1//-/.}/g; s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
