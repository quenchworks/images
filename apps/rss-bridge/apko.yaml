# RSS-Bridge runtime: supervisord runs php-fpm (127.0.0.1:9000) and QuenchWorks' nginx (:8080, index.php only).
# Settings: RSSBRIDGE_<section>_<key> environment variables (e.g. RSSBRIDGE_system_enabled_bridges,
# RSSBRIDGE_authentication_enable). The file cache is /var/cache/rss-bridge (mount an emptyDir or volume there).
# Nonroot uid 1001.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - busybox
    - supervisor
    - quench-nginx@local          # QuenchWorks' hardened nginx (from source), 8080/nonroot
    - quench-rss-bridge@local
    - php-8.5-xml-config
    - php-8.5-xml
    - php-8.5-simplexml-config
    - php-8.5-simplexml
    - php-8.5
    - php-8.5-fpm
    - php-8.5-fpm-config
    - php-8.5-config
    - php-8.5-ctype
    - php-8.5-ctype-config
    - php-8.5-curl
    - php-8.5-curl-config
    - php-8.5-dom
    - php-8.5-dom-config
    - php-8.5-fileinfo
    - php-8.5-fileinfo-config
    - php-8.5-iconv
    - php-8.5-iconv-config
    - php-8.5-intl
    - php-8.5-intl-config
    - php-8.5-mbstring
    - php-8.5-mbstring-config
    - php-8.5-openssl
    - php-8.5-openssl-config
    - php-8.5-zip
    - php-8.5-zip-config

accounts:
  groups:
    - groupname: rss-bridge
      gid: 1001
  users:
    - username: rss-bridge
      uid: 1001
      gid: 1001
  run-as: 1001

environment:
  TZ: UTC
  RSSBRIDGE_FileCache_path: /var/cache/rss-bridge

entrypoint:
  command: /usr/bin/supervisord -c /etc/rss-bridge/supervisord.conf

work-dir: /var/www/rss-bridge

paths:
  - path: /tmp
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o1777
  - path: /var/cache
    type: directory
    uid: 0
    gid: 0
    permissions: 0o755
  - path: /var/cache/rss-bridge
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o750

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-rss-bridge"
  org.opencontainers.image.licenses: "Unlicense"
  org.opencontainers.image.version: "__VER__"
