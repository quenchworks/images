# RSS-Bridge from the release tarball on Wolfi php-8.5-fpm + nginx (nginx comes from the sibling quench-nginx
# package, installed by apko).
package:
  name: quench-rss-bridge
  version: __PKGVER__
  epoch: 0
  description: "Quenchworks hardened RSS-Bridge feed generator on Wolfi php-fpm + nginx"
  copyright:
    - license: Unlicense
  dependencies:
    runtime:
      - php-8.5
      - php-8.5-config
      - php-8.5-fpm
      - php-8.5-fpm-config
      - php-8.5-ctype
      - php-8.5-ctype-config
      - php-8.5-curl
      - php-8.5-curl-config
      - php-8.5-dom
      - php-8.5-dom-config
      - php-8.5-fileinfo
      - php-8.5-fileinfo-config
      - php-8.5-iconv
      - php-8.5-iconv-config
      - php-8.5-intl
      - php-8.5-intl-config
      - php-8.5-mbstring
      - php-8.5-mbstring-config
      - php-8.5-openssl
      - php-8.5-openssl-config
      - php-8.5-simplexml
      - php-8.5-simplexml-config
      - php-8.5-xml
      - php-8.5-xml-config
      - php-8.5-zip
      - php-8.5-zip-config
      - supervisor
      - busybox

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - php-8.5
      - php-8.5-config
      - php-8.5-fpm
      - php-8.5-fpm-config
      - php-8.5-ctype
      - php-8.5-ctype-config
      - php-8.5-curl
      - php-8.5-curl-config
      - php-8.5-dom
      - php-8.5-dom-config
      - php-8.5-fileinfo
      - php-8.5-fileinfo-config
      - php-8.5-iconv
      - php-8.5-iconv-config
      - php-8.5-intl
      - php-8.5-intl-config
      - php-8.5-mbstring
      - php-8.5-mbstring-config
      - php-8.5-openssl
      - php-8.5-openssl-config
      - php-8.5-simplexml
      - php-8.5-simplexml-config
      - php-8.5-xml
      - php-8.5-xml-config
      - php-8.5-zip
      - php-8.5-zip-config

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/RSS-Bridge/rss-bridge/archive/refs/tags/__VER__.tar.gz
      expected-sha256: __SHA256__

  - name: Lay out /var/www/rss-bridge
    runs: |
      set -eu
      test -f index.php && test -f bridges/DemoBridge.php
      d="${{targets.destdir}}/var/www/rss-bridge"
      install -d "$d"
      cp -a actions bridges caches config.default.ini.php formats index.php lib middlewares static templates "$d/"
      # the stock cache dir stays empty and read-only: RSSBRIDGE_FileCache_path points at /var/cache/rss-bridge
      install -d "$d/cache"

  - name: nginx server block (index.php only, FastCGI to php-fpm on :8080)
    runs: |
      set -eu
      d="${{targets.destdir}}"
      install -d "$d/etc/nginx/conf.d"
      cat > "$d/etc/nginx/conf.d/rss-bridge.conf" <<'NGINX'
      server {
          listen 8080 default_server;
          listen [::]:8080 default_server;
          server_name _;
          root /var/www/rss-bridge;
          index index.php;
          charset utf-8;
          access_log off;

          location ~ (^|/)\. { return 403; }
          location ~ ^/(actions|bridges|cache|caches|formats|lib|middlewares|templates|vendor|tests)(/|$) { return 403; }
          location = /config.default.ini.php { return 403; }
          location = /index.php {
              include       /etc/nginx/fastcgi_params;
              fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
              fastcgi_read_timeout 45s;
              fastcgi_pass  127.0.0.1:9000;
          }
          location ~ \.php$ { return 403; }
          location / { try_files $uri /index.php?$query_string; }
      }
      NGINX

  - name: php-fpm pool + php.ini (nonroot, read-only rootfs)
    runs: |
      set -eu
      d="${{targets.destdir}}"
      install -d "$d/etc/php/php-fpm.d" "$d/etc/php/conf.d" "$d/etc/rss-bridge"
      cat > "$d/etc/php/php-fpm.d/zzz-rss-bridge.conf" <<'FPM'
      [global]
      daemonize = no
      error_log = /proc/self/fd/2

      [www]
      listen = 127.0.0.1:9000
      catch_workers_output = yes
      decorate_workers_output = no
      ; RSSBRIDGE_* settings come from the container environment
      clear_env = no
      pm = dynamic
      pm.max_children = 16
      pm.start_servers = 2
      pm.min_spare_servers = 1
      pm.max_spare_servers = 4
      FPM
      cat > "$d/etc/php/conf.d/zzz-rss-bridge.ini" <<'INI'
      expose_php = Off
      memory_limit = 256M
      max_execution_time = 45
      sys_temp_dir = /tmp
      upload_tmp_dir = /tmp
      session.save_path = /tmp
      display_errors = Off
      log_errors = On
      error_log = /proc/self/fd/2
      opcache.enable = 1
      opcache.revalidate_freq = 60
      INI

  - name: supervisord (php-fpm + nginx)
    runs: |
      set -eu
      d="${{targets.destdir}}"
      install -d "$d/etc/supervisor.d"
      cat > "$d/etc/rss-bridge/supervisord.conf" <<'SUP'
      [supervisord]
      nodaemon=true
      logfile=/dev/stdout
      logfile_maxbytes=0
      pidfile=/tmp/supervisord.pid

      [unix_http_server]
      file=/tmp/supervisor.sock

      [supervisorctl]
      serverurl=unix:///tmp/supervisor.sock

      [rpcinterface:supervisor]
      supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

      [include]
      files = /etc/supervisor.d/*.conf
      SUP
      printf '%s\n' '[program:php-fpm]' 'command=/usr/bin/php-fpm --nodaemonize --fpm-config /etc/php/php-fpm.conf' \
        'autostart=true' 'autorestart=true' 'priority=10' 'stdout_logfile=/dev/stdout' 'stdout_logfile_maxbytes=0' \
        'stderr_logfile=/dev/stderr' 'stderr_logfile_maxbytes=0' > "$d/etc/supervisor.d/php-fpm.conf"
      printf '%s\n' '[program:nginx]' 'command=/usr/bin/nginx -g "daemon off;"' \
        'autostart=true' 'autorestart=true' 'priority=20' 'stdout_logfile=/dev/stdout' 'stdout_logfile_maxbytes=0' \
        'stderr_logfile=/dev/stderr' 'stderr_logfile_maxbytes=0' > "$d/etc/supervisor.d/nginx.conf"

test:
  pipeline:
    - runs: |
        set -eu
        test -f /var/www/rss-bridge/index.php
        test -f /var/www/rss-bridge/bridges/DemoBridge.php
        php -m | grep -qi curl
