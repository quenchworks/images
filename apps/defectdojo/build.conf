# defectdojo: vulnerability management (Django + Celery), from the release tag, laid out like upstream's image (app
# in /app, entrypoints at /). One image runs every role: uWSGI (entrypoint-uwsgi.sh, its HTTP router on 8081 with
# whitenoise serving the collected static files, so no separate nginx image), Celery worker and beat, and the
# initializer. Sized 2026-11-22 at 3.5.202: requirements.txt and components/yarn.lock scan 0 fixable. Latest only:
# upstream releases weekly on one line.
FROM_SOURCE=1
VERSIONS=(3.5.202)
declare -A SHA256=(
  [3.5.202]=49d21522767415959726c172c4125693c18329efa19d9264ea6b6ae8b2a65192
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
