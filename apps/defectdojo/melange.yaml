# DefectDojo from the release tag: a Python 3.14 venv with requirements.txt (native wheels built here against
# Wolfi's libpq, libcurl, libxml2), the components build (tailwind CSS and the production node_modules), compiled
# translations and the collected static files.
package:
  name: quench-defectdojo
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened DefectDojo, built from source on Wolfi"
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - bash               # the entrypoints are bash scripts
      - busybox
      - ca-certificates-bundle
      - libcurl-openssl4   # pycurl
      - libpq-18           # psycopg[c]
      - postgresql-18-client  # the initializer runs psql (manage.py dbshell)
      - libxml2
      - libxslt
      - python-3.14        # the venv references the system interpreter
      - tzdata

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - curl-dev
      - gettext
      - git                # components/yarn.lock pulls a dependency from git
      - libxml2-dev
      - libxslt-dev
      - nodejs-24
      - npm
      - openssl-dev
      - pcre2-dev
      - postgresql-18-dev
      - python-3.14
      - python-3.14-dev
      - zlib-dev
      - libjpeg-turbo-dev

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/DefectDojo/django-DefectDojo/archive/refs/tags/${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - name: Python venv
    runs: |
      set -eu
      grep -q "__version__ = \"${{package.version}}\"" dojo/__init__.py
      python3.14 -m venv /app/venv
      export PYCURL_SSL_LIBRARY=openssl PIP_NO_CACHE_DIR=1 PIP_DISABLE_PIP_VERSION_CHECK=1
      /app/venv/bin/pip install --no-compile -r requirements.txt
      /app/venv/bin/python -c "import django, psycopg, pycurl, lxml, PIL; print('django', django.get_version(), 'psycopg', psycopg.pq.__impl__)"
      test -x /app/venv/bin/uwsgi && test -x /app/venv/bin/celery
      # pip itself is not needed at runtime (its vendored copies are a scanner surface of their own)
      /app/venv/bin/pip uninstall -y pip

  - name: Components and static files
    runs: |
      set -eu
      export HOME="$(mktemp -d)" npm_config_cache="$(mktemp -d)"
      npm install -g --prefix "$HOME/.g" yarn@1.22.22
      export PATH="$HOME/.g/bin:$PATH"
      cd components
      yarn install --frozen-lockfile --non-interactive
      yarn build:css
      rm -rf node_modules
      yarn install --production --ignore-scripts --frozen-lockfile --non-interactive
      cd ..
      find dojo/locale -name 'django.po' -exec sh -c 'msgfmt "$1" -o "${1%.po}.mo"' _ {} \;
      DD_SECRET_KEY=build-only /app/venv/bin/python manage.py collectstatic --noinput --verbosity=0 \
        --ignore yarn.lock --ignore package-lock.json --ignore npm-shrinkwrap.json --ignore pnpm-lock.yaml
      test -f static/dojo/css/tailwind-out.css

  - name: Install
    runs: |
      set -eu
      D="${{targets.destdir}}"
      # /var/run/defectdojo comes from apko paths (melange refuses packages that write to temp dirs)
      install -d "$D/app" "$D/app/media"
      cp -a manage.py dojo static components "$D/app/"
      cp -a docker/extra_fixtures/. "$D/app/dojo/fixtures/"
      rm -f "$D/app/dojo/fixtures/readme.txt"
      mkdir -p "$D/app/dojo/migrations"
      cp -a /app/venv "$D/app/venv"
      for s in entrypoint-celery-beat.sh entrypoint-celery-worker.sh entrypoint-initializer.sh entrypoint-uwsgi.sh \
               wait-for-it.sh secret-file-loader.sh reach_database.sh reach_broker.sh; do
        install -m 0755 "docker/$s" "$D/$s"
      done
      # the scripts call python3, uwsgi and celery from PATH: the venv's bin goes first (apko.yaml)
      head -1 "$D/app/venv/bin/celery" | grep -q '^#!/app/venv/bin/python'

test:
  pipeline:
    - runs: |
        /app/venv/bin/python -c "import dojo; print(dojo.__version__)"
