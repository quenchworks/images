# Firefly III runtime: supervisord runs php-fpm (127.0.0.1:9000) and QuenchWorks' nginx (:8080) after
# /usr/libexec/firefly-iii-init prepares /var/lib/firefly-iii/storage (the volume: SQLite database,
# uploads, Passport keys, logs) and migrates the database. APP_KEY (32 characters) is required.
# Nonroot uid 1001, writable paths /tmp and /var/lib/firefly-iii.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - busybox
    - supervisor
    # supervisor needs a supervisor-config provider; docker-selenium-supervisor-config (4.44) also provides it and
    # wins on version, so pin the real 4.3 line
    - supervisor-config~4.3
    - quench-nginx@local          # QuenchWorks' hardened nginx (from source), 8080/nonroot
    - quench-firefly-iii@local
    - php-8.5
    - php-8.5-fpm
    - php-8.5-fpm-config
    - php-8.5-config
    - php-8.5-ctype
    - php-8.5-ctype-config
    - php-8.5-curl
    - php-8.5-curl-config
    - php-8.5-fileinfo
    - php-8.5-fileinfo-config
    - php-8.5-iconv
    - php-8.5-iconv-config
    - php-8.5-intl
    - php-8.5-intl-config
    - php-8.5-mbstring
    - php-8.5-mbstring-config
    - php-8.5-bcmath
    - php-8.5-bcmath-config
    - php-8.5-openssl
    - php-8.5-openssl-config
    - php-8.5-pdo
    - php-8.5-pdo-config
    - php-8.5-pdo_sqlite
    - php-8.5-pdo_sqlite-config
    - php-8.5-pdo_pgsql
    - php-8.5-pdo_pgsql-config
    - php-8.5-mysqlnd
    - php-8.5-mysqlnd-config
    - php-8.5-pdo_mysql
    - php-8.5-pdo_mysql-config
    - php-8.5-simplexml
    - php-8.5-simplexml-config
    - php-8.5-xml
    - php-8.5-xml-config
    - php-8.5-xmlwriter
    - php-8.5-xmlwriter-config
    - php-8.5-dom
    - php-8.5-dom-config
    - php-8.5-sodium
    - php-8.5-sodium-config

accounts:
  groups:
    - groupname: firefly-iii
      gid: 1001
  users:
    - username: firefly-iii
      uid: 1001
      gid: 1001
  run-as: 1001

environment:
  APP_ENV: production
  APP_DEBUG: "false"
  DB_CONNECTION: sqlite
  LOG_CHANNEL: stdout

entrypoint:
  command: /usr/libexec/firefly-iii-init

work-dir: /var/www/firefly-iii

paths:
  - path: /tmp
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o1777
  - path: /var/lib
    type: directory
    uid: 0
    gid: 0
    permissions: 0o755
  - path: /var/lib/firefly-iii
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o750

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-firefly-iii"
  org.opencontainers.image.licenses: "AGPL-3.0-or-later"
  org.opencontainers.image.version: "__VER__"
