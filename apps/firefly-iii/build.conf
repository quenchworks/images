# firefly-iii: Firefly III (firefly-iii/firefly-iii, AGPL-3.0), a self-hosted personal finance manager:
# accounts, budgets, categories, rules, recurring transactions, reports and a REST API. Images issue #74.
#
# From upstream's release tarball (built JS in public/build, vendor/ included; its sha256 matches the
# published .sha256), with composer raising laravel/framework and the symfony http stack to their fixed
# patch releases inside the locked minors. php-8.5-fpm and QuenchWorks' nginx under supervisor (as Grocy
# and PrivateBin). Code in /var/www/firefly-iii; storage/ is a symlink to /var/lib/firefly-iii/storage
# (the volume: SQLite database, uploads, Passport OAuth keys, logs). /usr/libexec/firefly-iii-init
# requires APP_KEY, creates the storage tree, runs firefly-iii:upgrade-database and
# firefly-iii:laravel-passport-keys, then starts supervisord. package-lock.json (build-time) is not shipped.
# LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(6.7.9)
declare -A SHA256=(
  [6.7.9]=f905729c3be6e66d5333c22992281224ef1dc7e21cea13f4ef09af643d09b825
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
