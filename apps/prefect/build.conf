# prefect: the Prefect workflow orchestration server (API + UI + background services)
# and CLI, installed from PyPI into a Python 3.13 venv on Wolfi. One image runs the
# server (the default command) and flow code: workers and flows build on top of it.
#
# The UI ships inside the prefect wheel; the server copies it into PREFECT_HOME at
# start, so PREFECT_HOME must be writable (the chart mounts a volume there).
#
# NEWEST-ONLY: Prefect releases weekly; the image tracks the newest.
BLOCKED=0
FROM_SOURCE=0
VERSIONS=(3.8.6)
render() { echo "s/__VER__/$1/g"; }
