# STATUS 2026-08-27: BLOCKED -- one residual finding class, upstream-gated.
# (This block replaces two contradictory notes: a 2026-08-17 "BLOCKED, published 7.1.7 is
# broken" header sitting above a stale 2026-07-09 "SHIPPED (0-CVE) -- UNBLOCKED" block.
# Re-verified from the recipe and a fresh local build, not from either note. BLOCKED is
# the correct flag; the "SHIPPED/UNBLOCKED" claim was superseded on 2026-08-17.)
#
# WHAT BLOCKS IT, exactly:
#   org.apache.httpcomponents.client5:httpclient5  5.5.1  ->  Trivy demands 5.6.3
#     CVE-2026-64607 MEDIUM, bundled in plugin/graylog-storage-opensearch3-<ver>.jar.
#   org.apache.httpcomponents.core5:httpcore5      5.3.4  ->  5.4.3   (CVE-2026-54399 HIGH)
#   org.apache.httpcomponents.core5:httpcore5-h2   5.3.4  ->  5.4.3   (CVE-2026-54428 HIGH)
# The two core5 findings ARE clearable by overlay; httpclient5 is not, and one fixable
# finding fails the gate just as three do, so all three are left alone.
#
# Why httpclient5 cannot be fixed today (re-checked against Maven Central 2026-08-27):
#   * the 5.5 line tops out at 5.5.2 and 5.5.2 does NOT clear the advisory -- Trivy still
#     demands 5.6.3 (tested 2026-08-17).
#   * the only fixed line is 5.6.x (5.6.3, 5.6.4). Overlaying 5.6.3 + core5 5.4.3 DID reach
#     0-CVE but broke Graylog at runtime: verified in kind with healthy MongoDB +
#     OpenSearch, graylog CrashLoopBackOffs with
#       java.util.zip.ZipException: Not in GZIP format
#         at org.opensearch.client.json.jackson.JacksonJsonProvider$ParserFactory.createParser
#     i.e. the OpenSearch client can no longer decode the response body. The 0-CVE gate AND
#     the image smoke test both passed -- only the CHART install gate caught it, so the
#     image build alone can never clear this one.
#   * upstream has not moved: graylog 7.1.8 (2026-08-18) still bundles httpclient5 5.5.1 and
#     core5 5.3.4 in the opensearch3 storage plugin (checked in the pristine tarball).
# UNBLOCK when upstream graylog bumps the storage plugin's httpcomponents itself, or when a
# 5.5.x release carries the CVE-2026-64607 fix.
#
# ONE LEAD NOT YET TESTED (needs the chart kind gate, out of reach from the image build):
# the reverted attempt overlaid 5.6.3 with a plain cp -a, which cannot delete files, and
# 5.5.1 -> 5.6.3 is a MINOR bump that drops 14 classes (org/apache/hc/client5/http/impl/
# compat/**) while core5 5.3.4 -> 5.4.3 drops 9 (incl. impl/io/IncomingHttpEntity, on the
# classic response-entity path). So the jar that broke was a 5.6.3/5.5.1 hybrid, and
# "5.6.3 breaks Graylog" is not proven about 5.6.3 itself. A pruned overlay (delete the
# org/apache/hc trees before copying) plus 5.6.4 deserves one more chart-gate run before
# this is called permanently gated.
#
# WHAT WAS FIXED 2026-08-27 (10 fixable -> 3):
#   * bumped 7.1.7 -> 7.1.8, which clears io.netty:netty-codec-http 4.2.16 -> 4.2.17.Final
#     (CVE-2026-59903) upstream, no surgery needed.
#   * com.rabbitmq:amqp-client 5.29.0 -> 5.33.1 by class overlay: 6 findings
#     (CVE-2026-63337/69219/69220 HIGH, 63335/63336 MEDIUM, 61634 LOW). graylog.jar only.
#   * MULTI-RELEASE GAP in the pre-existing surgery, found and closed: graylog.jar is a
#     Multi-Release fat jar and jackson-core, log4j-api and jsoup each ship per-JDK
#     overrides under META-INF/versions/<n>/. On Java 21 a versioned entry WINS over the
#     base one, so the old overlay (base tree only) left 4 log4j-api 2.26.0 and 3 jsoup
#     1.22.1 class files as the bytecode that ACTUALLY RAN while Trivy read the patched
#     pom.properties and stayed quiet. The recipe now overlays META-INF/versions/*/<pkg>/*
#     as well (never module-info.class), and prunes classes the patched releases deleted.
#
# HOW THE SURGERY IS VERIFIED (not just "Trivy went quiet"): every class the patched
# upstream jar ships is compared by CRC-32 against the class of the same name in the built
# jar. As of 7.1.8: jackson-databind 812/812, jackson-core 213/213, log4j-api 209/209,
# jsoup 309/309, shiro (9 modules) 381/381, jakarta.mail 346/346, lz4-java 94/94,
# amqp-client 580/580 -- all identical, zero different, zero missing. On top of that the
# JVM in the built image loads each patched class off the fat jar (java -cp graylog.jar
# <class> reaching "Main method not found" = resolved + initialized), including the three
# multi-release-only ones: log4j util.StackLocator (versions/9), jsoup helper.
# HttpClientExecutor (versions/11) and jackson fdp.v2_21_5.FastDoubleSwar (versions/21).
#
# LOCAL GATE, x86_64, 2026-08-27, graylog 7.1.8:
#   Total: 3 (LOW: 0, MEDIUM: 1, HIGH: 2, CRITICAL: 0)
#   wolfi OS packages 0 | graylog.jar 0 | elasticsearch7 plugin 0 | opensearch2 plugin 0
#   | opensearch3 plugin 3
# Smoke test PASSES on 7.1.8 (nonroot 1001, JRE present, jar reports "Graylog 7.1.8+c7d1072").
#
# Bundled and surgically patched (all sha256-pinned Maven Central, see melange.yaml):
#   jackson-core + jackson-databind 2.21.2 -> 2.21.5   (CVE-2026-54512..54518)
#   org.apache.shiro:shiro-* 2.1.0 -> 2.2.1, 9 modules (CVE-2026-49268, CVE-2026-43827)
#   com.sun.mail:jakarta.mail 1.6.7 -> 1.6.8           (CVE-2025-7962)
#   at.yawk.lz4:lz4-java 1.10.4 -> 1.11.1              (CVE-2026-59949)
#   org.apache.logging.log4j:log4j-api 2.26.0 -> 2.26.1
#   org.jsoup:jsoup 1.22.1 -> 1.23.1
#   com.rabbitmq:amqp-client 5.29.0 -> 5.33.1
# The two org.apache.shiro.crypto modules (shiro-hashes-argon2, shiro-hashes-bcrypt) stay
# at 2.1.0 on purpose: neither is flagged, and they are the password-hashing path, which
# the image smoke cannot exercise. 2.2.1 exists for both if a CVE ever lands on them.
#
# TRADE-OFFS: the image smoke exercises jar classload + `version` only. The shiro auth
# path, SMTP alerting and the AMQP inputs need MongoDB + a search store, so they are
# deferred to the chart's kind install gate -- which is exactly the gate that caught the
# httpcomponents regression, and the reason this app is not unblocked on a green scan alone.
#
# ACTION OWED on the published tag: ghcr.io/quenchworks/images/graylog:7.1.7 still serves
# the BROKEN httpcomponents build (digest 95f844acb81b...). It must be WITHDRAWN, not
# republished -- 7.1.7 is superseded by 7.1.8 here, and no chart points at it (the chart
# re-pin release failed, so published charts still reference the previous good digest).
# Deleting the 7.1.7 tag/digest from GHCR is therefore safe and is the fix.
BLOCKED=1
# graylog: ships the upstream official tarball (graylog-<ver>.tgz from
# packages.graylog2.org) on a hardened Wolfi JRE, the CVE surface the Trivy gate
# scans. The tarball is graylog.jar (a Multi-Release fat jar) + bin/graylogctl +
# plugin/*.jar -- pure Java, architecture-independent, so ONE sha256 per version
# (the arch comes entirely from the JRE, jenkins-style). Newest-only: just the
# newest patch of the newest stable line.
#
# JRE: 6.3.x is compiled for Java 17 (bytecode 61), 7.0/7.1 for Java 21 (bytecode
# 65). Java 21 runs 17 bytecode, so openjdk-21-jre covers all three lines.
#
# LICENSE = SSPL-1.0 (Server Side Public License) -- SOURCE-AVAILABLE, NOT OSI
# approved. caution tier + a loud note in the catalog. Server app: image + chart.
FROM_SOURCE=1
# newest-only: keep just the newest patch of the newest stable line (7.1.8, 2026-08-18).
VERSIONS=(7.1.8)
declare -A SHA256=(
  [7.1.8]=f578d805865a00cdc4d97d9b4224693e7474e6fcd4c35e31369158e02f0510c5
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
