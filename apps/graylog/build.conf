# STATUS: SHIPPED (0-CVE) -- UNBLOCKED 2026-07-09 via CLASS-LEVEL SURGERY inside the
# shaded uber-jars. The prior "shaded, not swappable" verdict was based on there being
# no standalone lib jar -- but the shaded classes are LOOSE and UN-RELOCATED (plain
# package paths), so they ARE overlay-swappable. Gate passes; the image boots and
# reports `Graylog 7.1.5` (jar classloads + initializes). 7.1.5 bundled:
#   jackson-databind 2.21.2 -> 2.21.5 (CVE-2026-54512..54518; 2.21.5 needed for -54515;
#     HIGH ACE). jackson-core bumped 2.21.2 -> 2.21.5 in lockstep to match databind ABI.
#   org.apache.shiro:shiro-core 2.1.0 -> 2.2.1 (CVE-2026-49268 HIGH LDAP injection,
#     CVE-2026-43827 MEDIUM session fixation) -- the WHOLE 9-module shiro family
#     (core/cache/config-core/config-ogdl/crypto-cipher/crypto-core/crypto-hash/event/
#     lang) bumped in lockstep so the minor stays internally consistent.
#   com.sun.mail:jakarta.mail 1.6.7 -> 1.6.8 (CVE-2025-7962 MEDIUM SMTP injection).
# All are exploded as loose .class files + META-INF/maven/.../pom.properties directly
# inside graylog.jar (~299MB Multi-Release fat jar) AND the graylog-storage-opensearch3
# plugin jar. TECHNIQUE (see melange.yaml): explode each uber-jar, OVERLAY the patched
# upstream class trees + their maven pom.properties (sha256-pinned Maven Central), and
# repackage. Not relocated => the patched classes drop in at identical package paths.
#
# TRADE-OFFS / caveats: the image smoke exercises jar classload + `version`; the shiro
# auth path and SMTP alerting run under MongoDB + a search store, which are deferred to
# the chart's kind install gate (Graylog cannot fully boot without them -- unchanged
# posture). shiro 2.1->2.2 and jackson/mail patch bumps are same-major, low-risk. If a
# future Graylog release bundles jackson-databind >= 2.21.5 / shiro >= 2.2.1 / mail >=
# 1.6.8 natively, this surgery becomes a no-op and can be dropped.
#
# graylog: ships the upstream official tarball (graylog-<ver>.tgz from
# packages.graylog2.org) on a hardened Wolfi JRE, the CVE surface the Trivy gate
# scans. The tarball is graylog.jar (a Multi-Release fat jar) + bin/graylogctl +
# plugin/*.jar -- pure Java, architecture-independent, so ONE sha256 per version
# (the arch comes entirely from the JRE, jenkins-style). We ship the newest patch
# of each of the last 3 stable minor lines (6.3.x, 7.0.x, 7.1.x).
#
# JRE: 6.3.x is compiled for Java 17 (bytecode 61), 7.0/7.1 for Java 21 (bytecode
# 65). Java 21 runs 17 bytecode, so openjdk-21-jre covers all three lines.
#
# LICENSE = SSPL-1.0 (Server Side Public License) -- SOURCE-AVAILABLE, NOT OSI
# approved. caution tier + a loud note in the catalog. Server app: image + chart.
FROM_SOURCE=1
# newest-only: keep just the newest patch of the newest stable line (7.1.5).
VERSIONS=(7.1.5)
declare -A SHA256=(
  [7.1.5]=c619fc1cf13f0e6f1d1ece047c99da165177ec46b7faa0e1cb56cba3c9a64758
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
