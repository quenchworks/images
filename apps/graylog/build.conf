# STATUS: UNBLOCKED 2026-09-19. The zlib block is gone: Wolfi shipped the fix
# for CVE-2026-85091 as zlib 1.3.2.1_rc20260601-r0 and the advisory was amended
# to name that version, so the 1.3.3-r0 this file used to wait for is a number
# that will never arrive. A stock wolfi-base scan reports the advisory as
# `zlib 1.3.2-r7 -> 1.3.2.1_rc20260601-r0`, which is what Wolfi publishes on
# both arches today. scripts/blocked.py now watches the shipped version.
#
# Re-gated locally on 2026-09-19, PUSH=0, BOTH arches: 0 fixable CVEs on each,
# with zlib 1.3.2.1_rc20260601-r0 installed and no CVE-2026-85091 row.
# STATUS 2026-08-27: SHIPPED (0-CVE) -- UNBLOCKED. graylog 7.1.8, 0 fixable CVEs on every
# target. The three httpcomponents findings in plugin/graylog-storage-opensearch3 are FIXED.
# (This replaces the same-day "BLOCKED -- upstream-gated" block. That block's verdict was
# wrong, and so was the "pruned overlay" lead it left behind: stale leftover classes were
# never the cause. The real cause is named below and the fix is runtime-verified.)
#
# WHAT WAS BLOCKING IT:
#   org.apache.httpcomponents.client5:httpclient5  5.5.1 -> 5.6.4  (CVE-2026-64607 MEDIUM)
#   org.apache.httpcomponents.core5:httpcore5      5.3.4 -> 5.4.3  (CVE-2026-54399 HIGH)
#   org.apache.httpcomponents.core5:httpcore5-h2   5.3.4 -> 5.4.3  (CVE-2026-54428 HIGH)
# 5.5.2 does NOT clear CVE-2026-64607 -- the advisory's only fixed line is 5.6.x -- so the
# MINOR bump was unavoidable, and on 2026-08-17 overlaying it broke the OpenSearch storage
# path at runtime with `java.util.zip.ZipException: Not in GZIP format`, which the CVE gate
# and the image smoke test both missed and only the chart's kind install gate caught.
#
# ROOT CAUSE (read out of the bytecode, then confirmed in kind):
#   httpclient5 5.6 added ContentCompressionAsyncExec to the DEFAULT async exec chain; 5.5.1
#   did no content decoding on the async path at all. It adds Accept-Encoding itself, inflates
#   the gzip response body, and hands the response consumer an EntityDetails whose
#   getContentEncoding() is null -- but it does NOT remove the response's own
#   `Content-Encoding: gzip` HEADER. opensearch-java's
#   HeapBufferedAsyncResponseConsumer.buildResult() reads that HEADER, not the EntityDetails,
#   and stamps "gzip" onto the ByteArrayEntity it builds; ApacheHttpClient5Transport
#   .convertResponse() then wraps any entity claiming gzip in a GzipDecompressingEntity. The
#   already-inflated body is inflated a SECOND time and the first read throws ZipException,
#   surfacing inside JacksonJsonProvider$ParserFactory.createParser -- exactly the frame the
#   2026-08-17 attempt reported. It is unconditional: no Graylog or chart setting avoids it
#   (Graylog's RequestConfig callback never touches contentCompressionEnabled, and httpclient5
#   adds Accept-Encoding whenever the request carries none), and the bundled OpenSearch does
#   answer Accept-Encoding: gzip with Content-Encoding: gzip -- checked on the wire in kind --
#   so the double-decode path is always taken. The hybrid-jar theory was wrong: nothing
#   outside org/apache/hc/** references any of the 25 classes the bump deletes.
#
# THE FIX -- ship the pairing upstream itself ships:
#   opensearch-java 3.6.0 is the release that moved ITS OWN dependency to httpclient5 5.6 /
#   httpcore5 5.4 and, in that same release, dropped the GzipDecompressingEntity wrap and let
#   httpclient5 do the decoding. Graylog 7.1.8 bundles opensearch-java 3.0-3.2
#   (ApacheHttpClient5Transport is CRC-identical to those three releases), which is why the
#   httpcomponents bump alone could never work. melange.yaml now overlays, all PRISTINE
#   upstream classes, nothing hand-modified:
#     httpclient5 5.6.4 + httpcore5 5.4.3 + httpcore5-h2 5.4.3
#     + opensearch-java 3.6.0's ApacheHttpClient5Transport (10 inner classes plus the new
#       internal/NodeState, which nothing else in the jar references)
#   Only that one class and its inner classes changed on the opensearch-java side: every other
#   class in org/opensearch/client/transport/httpclient5/** is CRC-identical from 3.0.0 through
#   3.9.0, so the overlay stays this small.
#   Because 5.5.1 -> 5.6.4 is a MINOR bump it DELETES classes (14 under
#   org/apache/hc/client5/http/impl/compat/**, which moved into httpcore5 5.4's
#   http/nio/support/classic/**; 5.3.4 -> 5.4.3 drops 9 more incl. impl/io/IncomingHttpEntity
#   and the IOWorkers family; h2 drops 2) and an overlay cannot delete, so the recipe removes
#   the whole org/apache/hc tree first (PRUNE_HC in melange.yaml). The bundled tree was
#   verified file-set-IDENTICAL to the union of the three pristine 5.5.1/5.3.4 jars, so
#   remove-then-overlay reproduces 5.6.4 + 5.4.3 + 5.4.3 exactly, with no hybrid left behind.
#
# WHAT WAS FIXED EARLIER THE SAME DAY (10 fixable -> 3, before the httpcomponents work):
#   * bumped 7.1.7 -> 7.1.8, which clears io.netty:netty-codec-http 4.2.16 -> 4.2.17.Final
#     (CVE-2026-59903) upstream, no surgery needed.
#   * com.rabbitmq:amqp-client 5.29.0 -> 5.33.1 by class overlay: 6 findings
#     (CVE-2026-63337/69219/69220 HIGH, 63335/63336 MEDIUM, 61634 LOW). graylog.jar only.
#   * MULTI-RELEASE GAP in the pre-existing surgery, found and closed: graylog.jar is a
#     Multi-Release fat jar and jackson-core, log4j-api and jsoup each ship per-JDK
#     overrides under META-INF/versions/<n>/. On Java 21 a versioned entry WINS over the
#     base one, so the old overlay (base tree only) left 4 log4j-api 2.26.0 and 3 jsoup
#     1.22.1 class files as the bytecode that ACTUALLY RAN while Trivy read the patched
#     pom.properties and stayed quiet. The recipe now overlays META-INF/versions/*/<pkg>/*
#     as well (never module-info.class), and prunes classes the patched releases deleted.
#     The opensearch3 plugin carries NO META-INF/versions entry for org/apache/hc/** or for
#     org/opensearch/client/transport/**, so the httpcomponents overlay has no such gap
#     (asserted, not assumed).
#
# HOW THE SURGERY IS VERIFIED (not just "Trivy went quiet"): every class the patched upstream
# jar ships is compared by CRC-32 against the class of the same name in the built jar. As of
# 7.1.8: jackson-databind 812/812, jackson-core 213/213, log4j-api 209/209, jsoup 309/309,
# shiro (9 modules) 381/381, jakarta.mail 346/346, lz4-java 94/94, amqp-client 580/580, and in
# the opensearch3 plugin httpclient5 596/596, httpcore5 679/679, httpcore5-h2 160/160,
# opensearch-java transport 18/18 -- all identical, zero different, zero missing, and zero
# stale org/apache/hc entries left over. On top of that the JVM in the built image loads each
# patched class off the fat jar (java -cp graylog.jar <class> reaching "Main method not found"
# = resolved + initialized), including the three multi-release-only ones: log4j
# util.StackLocator (versions/9), jsoup helper.HttpClientExecutor (versions/11) and jackson
# fdp.v2_21_5.FastDoubleSwar (versions/21).
#
# LOCAL GATE, x86_64, 2026-08-27, graylog 7.1.8:
#   image.tar (wolfi) 0 | Java 0 | graylog.jar 0 | elasticsearch7 plugin 0 |
#   opensearch2 plugin 0 | opensearch3 plugin 0
#   "✅ 0 fixable CVEs (x86_64)"
# Smoke test PASSES on 7.1.8 (nonroot 1001, JRE present, jar reports "Graylog 7.1.8+c7d1072").
# CHART KIND GATE PASSES -- the gate that caught the 2026-08-17 regression and the only one
# that can. Ran charts/quench/graylog with its own ci/default-values.yaml on a private kind
# cluster against THIS build: helm install --wait --timeout 15m green, rollout complete,
# runAsUser 1001, /api/system/lbstatus = ALIVE, and the OpenSearch storage path exercised
# through the plugin (cluster health green, cluster name, index sets, per-index stats -- the
# fat gzip-eligible responses), with ZERO ZipException in the pod log. aarch64 was not built
# locally; the surgery is pure Java and architecture-independent (one sha256 per version), so
# CI's arm64 leg is expected to match, but it is unverified here.
#
# Bundled and surgically patched (all sha256-pinned Maven Central, see melange.yaml):
#   jackson-core + jackson-databind 2.21.2 -> 2.21.5   (CVE-2026-54512..54518)
#   org.apache.shiro:shiro-* 2.1.0 -> 2.2.1, 9 modules (CVE-2026-49268, CVE-2026-43827)
#   com.sun.mail:jakarta.mail 1.6.7 -> 1.6.8           (CVE-2025-7962)
#   at.yawk.lz4:lz4-java 1.10.4 -> 1.11.1              (CVE-2026-59949)
#   org.apache.logging.log4j:log4j-api 2.26.0 -> 2.26.1
#   org.jsoup:jsoup 1.22.1 -> 1.23.1
#   com.rabbitmq:amqp-client 5.29.0 -> 5.33.1
#   httpclient5 5.5.1 -> 5.6.4, httpcore5 + httpcore5-h2 5.3.4 -> 5.4.3, and
#     opensearch-java 3.6.0's ApacheHttpClient5Transport   (opensearch3 plugin only)
# The two org.apache.shiro.crypto modules (shiro-hashes-argon2, shiro-hashes-bcrypt) stay
# at 2.1.0 on purpose: neither is flagged, and they are the password-hashing path, which
# the image smoke cannot exercise. 2.2.1 exists for both if a CVE ever lands on them.
#
# TRADE-OFFS: the image smoke exercises jar classload + `version` only. The shiro auth path,
# SMTP alerting and the AMQP inputs need MongoDB + a search store, so they are deferred to the
# chart's kind install gate -- which is exactly the gate that caught the httpcomponents
# regression. Rule learned here: any httpcomponents or opensearch-java movement in the
# opensearch3 storage plugin MUST be chart-gated, because a green scan plus a green image
# smoke is not evidence for that plugin.
#
# ACTION OWED on the published tags:
#   * ghcr.io/quenchworks/images/graylog:7.1.7 still serves the BROKEN httpcomponents build
#     (digest 95f844acb81b...). WITHDRAW it -- delete the tag/digest from GHCR. It is
#     superseded by 7.1.8 and no PUBLISHED chart points at it (the 0.0.7 re-pin release
#     failed, so published charts still reference the previous good digest).
#   * charts/quench/graylog is NOT re-pinned here on purpose: values.yaml and Chart.yaml still
#     carry the broken 95f844... digest and appVersion 7.1.7, and repinning needs a digest that
#     exists in the registry (scripts/repin.py verifies it). Once 7.1.8 is pushed, run
#     `uv run scripts/repin.py graylog 7.1.8 <new-digest> --kind security --desc "..."`.
#     Until then the chart's own release gate correctly refuses to ship it.
BLOCKED=0
# graylog: ships the upstream official tarball (graylog-<ver>.tgz from
# packages.graylog2.org) on a hardened Wolfi JRE, the CVE surface the Trivy gate
# scans. The tarball is graylog.jar (a Multi-Release fat jar) + bin/graylogctl +
# plugin/*.jar -- pure Java, architecture-independent, so ONE sha256 per version
# (the arch comes entirely from the JRE, jenkins-style). Newest-only: just the
# newest patch of the newest stable line.
#
# JRE: 6.3.x is compiled for Java 17 (bytecode 61), 7.0/7.1 for Java 21 (bytecode
# 65). Java 21 runs 17 bytecode, so openjdk-21-jre covers all three lines.
#
# LICENSE = SSPL-1.0 (Server Side Public License) -- SOURCE-AVAILABLE, NOT OSI
# approved. caution tier + a loud note in the catalog. Server app: image + chart.
FROM_SOURCE=1
# newest-only: keep just the newest patch of the newest stable line (7.1.8, 2026-08-18).
VERSIONS=(7.1.9)
declare -A SHA256=(
  [7.1.9]=c9574e67f4018ac4fd7941547dd4b62472688fb8137e802dab2fce621ae63f08
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
