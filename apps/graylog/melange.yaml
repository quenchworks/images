# Packages Graylog onto Wolfi. Graylog is a JVM app: we ship the upstream official
# tarball (prebuilt graylog.jar + plugins) on a hardened Wolfi JRE, which is the
# CVE surface the Trivy gate scans. No compilation -- fetch the tarball, drop the
# server jar + plugins under /opt/graylog, and bake an env-driven entrypoint that
# renders server.conf and launches `java -jar graylog.jar server`.
#
# LICENSE: SSPL-1.0 (Server Side Public License) -- source-available, NOT OSI.
package:
  name: quench-graylog
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Graylog log management server (SSPL), packaged on Wolfi"
  copyright:
    - license: SSPL-1.0
  dependencies:
    runtime:
      - openjdk-21-jre        # the JRE Graylog runs on (the scanned CVE surface; 6.3=Java17, 7.x=Java21, 21 runs both)
      - bash                  # the baked entrypoint is bash
      - busybox
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - curl    # build-time only: fetch sha256-pinned patched jars from Maven Central
      - unzip   # build-time only: explode the uber-jars for class-level surgery
      - zip     # build-time only: repackage the patched uber-jars

pipeline:
  - uses: fetch
    with:
      # The tarball is architecture-independent (jars): same artifact on amd64/arm64.
      uri: https://packages.graylog2.org/releases/graylog/graylog-${{package.version}}.tgz
      expected-sha256: "__SHA256__"
      strip-components: 1
  - runs: |
      # ============================================================================
      # 0-CVE remediation via CLASS-LEVEL SURGERY inside the shaded uber-jars.
      # graylog.jar (a Multi-Release fat jar) and plugin/graylog-storage-opensearch3
      # bundle vulnerable libraries as LOOSE, UN-RELOCATED classes (plain package
      # paths com/fasterxml/jackson/**, org/apache/shiro/**, com/sun/mail|javax/mail,
      # net/jpountz/**),
      # so we overlay the patched upstream classes (+ their META-INF/maven pom.properties
      # that Trivy reads for the version) and repackage. Not relocated => swappable.
      #   * jackson-core + jackson-databind 2.21.2 -> 2.21.5 (CVE-2026-54512..54518;
      #     2.21.5 required for -54515; core bumped in lockstep to match databind ABI)
      #   * org.apache.shiro:shiro-* 2.1.0 -> 2.2.1 IN LOCKSTEP across the 9 bundled
      #     org.apache.shiro modules (CVE-2026-49268 LDAP injection, CVE-2026-43827
      #     session fixation; only shiro-core is flagged but the modules are bumped
      #     together to keep the minor consistent). The two org.apache.shiro.crypto
      #     modules -- shiro-hashes-argon2 and shiro-hashes-bcrypt -- are deliberately
      #     LEFT at 2.1.0: neither is flagged, and they are the password-hashing path,
      #     which the image smoke cannot exercise (it needs MongoDB). 2.2.1 exists for
      #     both if a CVE ever lands on them.
      #   * com.sun.mail:jakarta.mail 1.6.7 -> 1.6.8 (CVE-2025-7962 SMTP injection)
      #   * at.yawk.lz4:lz4-java 1.10.4 -> 1.11.1 (CVE-2026-59949 MEDIUM: the native
      #     XXHash implementations can crash the JVM). Sole artifact in the at.yawk.lz4
      #     group -- no sibling modules to keep aligned -- and only graylog.jar bundles
      #     it (all three storage plugin jars are clean).
      #   * com.rabbitmq:amqp-client 5.29.0 -> 5.34.0 (7 CVEs, 4 of them HIGH) -- added
      #     for 7.1.8. graylog.jar only; the storage plugins do not bundle it.
      #   * httpclient5 5.5.1 -> 5.6.4 and httpcore5 + httpcore5-h2 5.3.4 -> 5.4.3
      #     (CVE-2026-64607, CVE-2026-54399, CVE-2026-54428) in the opensearch3 storage
      #     plugin -- see the long note at the httpcomponents block below: the bump is
      #     only safe together with the opensearch-java transport that pairs with it.
      # All fetches are sha256-pinned Maven Central. Scratch lives under the on-disk
      # build workspace (NOT /tmp, which is a small tmpfs in the sandbox).
      set -eu
      ROOT="$(pwd)"
      MC="https://repo1.maven.org/maven2"
      PW="$ROOT/.patchwork"; DL="$PW/dl"; ST="$PW/stage"
      mkdir -p "$DL" "$ST/jackson" "$ST/shiro" "$ST/mail" "$ST/lz4" "$ST/log4j" "$ST/jsoup" "$ST/amqp" "$ST/hc" "$ST/osj"
      getj() { curl -fsSL -o "$DL/$2" "$1"; echo "$3  $DL/$2" | sha256sum -c -; }

      # --- jackson (databind + core) 2.21.5: overlay class trees + maven metadata ---
      getj "$MC/com/fasterxml/jackson/core/jackson-databind/2.21.5/jackson-databind-2.21.5.jar" jackson-databind-2.21.5.jar 507418c0fafd38b2b2cfb704521630da613a8e4cc8381195a6f418017883e2c0
      getj "$MC/com/fasterxml/jackson/core/jackson-core/2.21.5/jackson-core-2.21.5.jar" jackson-core-2.21.5.jar b64b5874162b503a0e58a8f7758266e8dd9f91bf49e3a59ae0b5f47589a231b7
      # MULTI-RELEASE: these jars also ship per-JDK overrides under META-INF/versions/<n>/.
      # On Java 21 a versioned entry WINS over the base one for the same class name, so
      # overlaying only the base tree would leave the old bytecode as the code that
      # actually runs. Those paths are taken too -- but NOT META-INF/versions/*/module-info
      # .class, which is a per-library module descriptor that must not land in a fat jar.
      # jackson-databind is deliberately NOT given a META-INF/versions pattern: its only
      # versioned entry IS module-info.class. unzip exits 11 when a pattern matches nothing,
      # so with `set -e` a future release that stops shipping the versioned classes below
      # fails the build loudly instead of silently reverting to a base-tree-only overlay.
      ( cd "$ST/jackson" \
          && unzip -qo "$DL/jackson-databind-2.21.5.jar" 'com/fasterxml/jackson/databind/*' 'META-INF/maven/com.fasterxml.jackson.core/jackson-databind/*' \
          && unzip -qo "$DL/jackson-core-2.21.5.jar"     'com/fasterxml/jackson/core/*'     'META-INF/versions/*/com/fasterxml/jackson/core/*'     'META-INF/maven/com.fasterxml.jackson.core/jackson-core/*' )

      # --- log4j-api 2.26.0 -> 2.26.1 and jsoup 1.22.1 -> 1.23.1 (both SHADED in graylog.jar,
      #     so they need the same class+pom.properties overlay rather than a file swap) ---
      getj "$MC/org/apache/logging/log4j/log4j-api/2.26.1/log4j-api-2.26.1.jar" log4j-api-2.26.1.jar f1810a4704ccce019d02bba029dc02a4f2ac0c997f647b465e7d409c1927f822
      getj "$MC/org/jsoup/jsoup/1.23.1/jsoup-1.23.1.jar" jsoup-1.23.1.jar 8b15e2b28eeb1e0a88a9b7dab4dc0c23524491c56959785dea22f7846897b668
      # log4j-api ships META-INF/versions/9/org/apache/logging/log4j/util/** and jsoup ships
      # META-INF/versions/11/org/jsoup/helper/** -- both live overrides on Java 21.
      ( cd "$ST/log4j" && unzip -qo "$DL/log4j-api-2.26.1.jar" 'org/apache/logging/log4j/*' 'META-INF/versions/*/org/apache/logging/log4j/*' 'META-INF/maven/org.apache.logging.log4j/log4j-api/*' )
      ( cd "$ST/jsoup" && unzip -qo "$DL/jsoup-1.23.1.jar"     'org/jsoup/*'                'META-INF/versions/*/org/jsoup/*'                'META-INF/maven/org.jsoup/jsoup/*' )

      # --- shiro family 2.2.1 (all 9 bundled modules, in lockstep) ---
      for row in \
        "shiro-core:688489d58e00d40476e67be2cae8f349a6d51a21c0d16e4d856bcc6f6c9c2001" \
        "shiro-cache:cf5bb8a3349165b34773abb17cc0e2e926cc292ce0a2f9b26af095ee2d376c8e" \
        "shiro-config-core:7f64fe07e75d3afb48222d1020c6ab0e91445aa918fa852dd744802e3da2c72d" \
        "shiro-config-ogdl:411b983dee3c7b7256c5140a1a4cd86b1004966e62029ec6e4a7795418bdb31a" \
        "shiro-crypto-cipher:f2c083d03eef731772b97728718d5ffeb71107ac0850c79b78283f8b1f29a193" \
        "shiro-crypto-core:e8ac7be2365397dbc5f2b9dfad2a98941670202c612fd7e535afcefa7a503feb" \
        "shiro-crypto-hash:2ae3b681f6618ba56ff928255091d3ba72a364acdf0deebd55d4c4e093c3d7e8" \
        "shiro-event:739446ee8581e13e670b8a27310e35902b8b8258e363e7bdd5f37758abbd86d7" \
        "shiro-lang:a803f62e597b05d9550f0fd11943738442e4aa0d3f8432a430cd9bf3aef39ea9" ; do
        m="${row%%:*}"; sh="${row#*:}"
        getj "$MC/org/apache/shiro/$m/2.2.1/$m-2.2.1.jar" "$m-2.2.1.jar" "$sh"
        ( cd "$ST/shiro" && unzip -qo "$DL/$m-2.2.1.jar" 'org/apache/shiro/*' 'META-INF/maven/org.apache.shiro/*' )
      done

      # --- jakarta.mail 1.6.8 ---
      getj "$MC/com/sun/mail/jakarta.mail/1.6.8/jakarta.mail-1.6.8.jar" jakarta.mail-1.6.8.jar c83f1a1ed580a35878957de7367071be27026d02d34ace6267d0c3da23e193c2
      ( cd "$ST/mail" && unzip -qo "$DL/jakarta.mail-1.6.8.jar" 'com/sun/mail/*' 'javax/mail/*' 'META-INF/maven/com.sun.mail/*' )

      # --- at.yawk.lz4:lz4-java 1.11.1 ---
      # graylog.jar's bundled net/jpountz/** tree is byte-for-byte the SAME FILE SET as the
      # published 1.10.4 jar, and 1.11.1's tree is a strict superset of it, so the overlay
      # leaves no stale classes behind. net/jpountz/util/**/liblz4-java.so are the prebuilt
      # natives shipped inside the jar -- they are part of this tree, so the overlay replaces
      # the vulnerable native XXHash code too, not just the Java side.
      getj "$MC/at/yawk/lz4/lz4-java/1.11.1/lz4-java-1.11.1.jar" lz4-java-1.11.1.jar e5e31b195fcc7e9c5da4b191af3b0082ee616c13f61cbd79409ffa65e4dd5c47
      ( cd "$ST/lz4" && unzip -qo "$DL/lz4-java-1.11.1.jar" 'net/jpountz/*' 'META-INF/maven/at.yawk.lz4/*' )

      # --- com.rabbitmq:amqp-client 5.29.0 -> 5.33.1 (6 CVEs: CVE-2026-63335/63336/63337/
      #     69219/69220/61634). Loose + un-relocated at com/rabbitmq/** and bundled ONLY by
      #     graylog.jar (all three storage plugin jars are amqp-free). 5.33.1 is the lowest
      #     version that clears all six, so the drift stays as small as it can be.
      #     rabbitmq-amqp-client.properties is the client's own version file and is taken
      #     with the classes. Its sibling root-level version.properties is NOT: graylog.jar
      #     has its own version.properties (project.version=<graylog ver>) at the same path,
      #     which the entrypoint's `version` subcommand reports -- overlaying amqp's copy
      #     would clobber it.
      #     2026-09-19: 5.33.1 itself is now flagged for CVE-2026-75516 (HIGH, frame-level
      #     OOM: an oversized declared frame length is allocated before it is validated),
      #     fixed in 5.34.0. Entry sets compared jar-to-jar before bumping: 5.34.0 is
      #     file-set-IDENTICAL to 5.33.1 (596 entries each), and the only entry the
      #     bundled 5.29.0 has that 5.34.0 lacks is still SocketFrameHandler$1.class,
      #     which apply() already deletes -- so the overlay needs no new prune.
      getj "$MC/com/rabbitmq/amqp-client/5.34.0/amqp-client-5.34.0.jar" amqp-client-5.34.0.jar 407bab4db77453b42b052554934095873db0f1c9b8018aebb97f19eb9f5575fa
      ( cd "$ST/amqp" && unzip -qo "$DL/amqp-client-5.34.0.jar" 'com/rabbitmq/*' 'META-INF/maven/com.rabbitmq/*' 'rabbitmq-amqp-client.properties' )

      # --- httpcomponents 5.x in plugin/graylog-storage-opensearch3 (3 CVEs) --------------
      #   httpclient5  5.5.1 -> 5.6.4  (CVE-2026-64607 MEDIUM, connection leak on a
      #                                 Content-Encoding decode error)
      #   httpcore5    5.3.4 -> 5.4.3  (CVE-2026-54399 HIGH, DoS via excessive headers)
      #   httpcore5-h2 5.3.4 -> 5.4.3  (CVE-2026-54428 HIGH, DoS via oversized HPACK header)
      # 5.5.2 does NOT clear CVE-2026-64607 (the advisory's only fixed line is 5.6.x), so the
      # MINOR bump is unavoidable -- and it is a THREE-part change, not a jar swap:
      #
      #   1. httpclient5 5.6 added ContentCompressionAsyncExec to the DEFAULT async exec chain
      #      (5.5.1 had no content decoding on the async path at all). It inflates the body and
      #      hands the response consumer an EntityDetails whose getContentEncoding() is null --
      #      but it does NOT remove the response's own `Content-Encoding: gzip` HEADER.
      #      opensearch-java's HeapBufferedAsyncResponseConsumer.buildResult() reads that
      #      HEADER (not the EntityDetails) and stamps it on the ByteArrayEntity it builds, and
      #      ApacheHttpClient5Transport.convertResponse() then wraps any entity claiming gzip in
      #      a GzipDecompressingEntity. The already-inflated body is therefore inflated a second
      #      time, and the first read fails with
      #        java.util.zip.ZipException: Not in GZIP format
      #      surfacing inside JacksonJsonProvider$ParserFactory.createParser. That is what broke
      #      the reverted 2026-08-17 attempt -- NOT stale leftover classes. It is unconditional:
      #      no Graylog or chart setting avoids it, because httpclient5 adds Accept-Encoding
      #      itself whenever the request does not already carry one.
      #      opensearch-java fixed this in 3.6.0, the SAME release that moved its own dependency
      #      to httpclient5 5.6 / httpcore5 5.4: it dropped the GzipDecompressingEntity wrap and
      #      relies on httpclient5 to decode. Graylog 7.1.8 bundles opensearch-java 3.0-3.2
      #      (ApacheHttpClient5Transport is byte-identical to those releases), so the httpcomponents
      #      bump MUST be paired with 3.6.0's ApacheHttpClient5Transport. Only that one class and
      #      its inner classes changed, plus a new internal/NodeState referenced by nothing else;
      #      every other class in org/opensearch/client/transport/httpclient5/** is CRC-identical
      #      from 3.0.0 through 3.9.0, so the overlay stays this small. All overlaid classes are
      #      pristine upstream -- nothing here is hand-modified.
      #   2. This is a MINOR bump, so it DELETES classes: 5.5.1 -> 5.6.4 drops the 14
      #      org/apache/hc/client5/http/impl/compat/** helpers (they moved into httpcore5 5.4's
      #      http/nio/support/classic/**), 5.3.4 -> 5.4.3 drops 9 (incl. impl/io/IncomingHttpEntity
      #      and the IOWorkers family) and h2 drops 2. An overlay cannot delete, so the whole
      #      org/apache/hc tree is REMOVED first (see PRUNE_HC in apply below). The bundled tree
      #      is exactly the union of the three pristine jars -- verified file-set-identical -- so
      #      remove-then-overlay reproduces 5.6.4 + 5.4.3 + 5.4.3 exactly, with no hybrid left
      #      behind. Nothing outside org/apache/hc/** references any of the 25 dropped classes.
      #   3. Verified at runtime, not just by the scanner: the chart's kind install gate brings up
      #      MongoDB + OpenSearch and Graylog must reach /api/system/lbstatus = ALIVE, which
      #      exercises the OpenSearch storage path where the ZipException appeared. The image
      #      smoke test and the CVE gate BOTH passed on the broken build, so neither is proof.
      getj "$MC/org/apache/httpcomponents/client5/httpclient5/5.6.4/httpclient5-5.6.4.jar" httpclient5-5.6.4.jar bdef5f8841145cd76c4c605ff301bc840eea0d5292332b7b892a93316c0d8ee1
      getj "$MC/org/apache/httpcomponents/core5/httpcore5/5.4.3/httpcore5-5.4.3.jar" httpcore5-5.4.3.jar 18bfbbabb478dfb67f31aeaf428c387f3c3df654582e1309f708ee1f3086830a
      getj "$MC/org/apache/httpcomponents/core5/httpcore5-h2/5.4.3/httpcore5-h2-5.4.3.jar" httpcore5-h2-5.4.3.jar c7db7026b8e2dea39132b04a6069f6671e2858309b20a146ec5c7dd6ed73a0b6
      getj "$MC/org/opensearch/client/opensearch-java/3.6.0/opensearch-java-3.6.0.jar" opensearch-java-3.6.0.jar fafb80b7cdaf2c0b9571a01669267a5e760eb4cbf5c0daf8e0fbdf262b68c67d
      # httpcore5 and httpcore5-h2 share the org/apache/hc/core5/** namespace but have separate
      # META-INF/maven dirs (both are read by Trivy), so each is taken by its own artifact path.
      ( cd "$ST/hc" \
          && unzip -qo "$DL/httpclient5-5.6.4.jar"  'org/apache/hc/*' 'META-INF/maven/org.apache.httpcomponents.client5/*' \
          && unzip -qo "$DL/httpcore5-5.4.3.jar"    'org/apache/hc/*' 'META-INF/maven/org.apache.httpcomponents.core5/httpcore5/*' \
          && unzip -qo "$DL/httpcore5-h2-5.4.3.jar" 'org/apache/hc/*' 'META-INF/maven/org.apache.httpcomponents.core5/httpcore5-h2/*' )
      ( cd "$ST/osj" && unzip -qo "$DL/opensearch-java-3.6.0.jar" \
          'org/opensearch/client/transport/httpclient5/ApacheHttpClient5Transport*' \
          'org/opensearch/client/transport/httpclient5/internal/NodeState.class' )

      # --- apply: explode each uber-jar, overlay the patched trees, repackage ---
      apply() {
        jarp="$1"; shift
        w="$PW/exploded"; rm -rf "$w"; mkdir -p "$w"
        ( cd "$w" && unzip -qo "$jarp" )
        # An overlay can only ADD or REPLACE, so a class the patched release DELETED would
        # survive as stale old bytecode. Every bump here is a patch bump whose file set is a
        # superset of the bundled one except for these anonymous inner classes, which the
        # patched releases dropped -- remove them explicitly. (rm -f is a no-op on the jars
        # that do not carry them, e.g. the storage plugin.)
        rm -f "$w/com/rabbitmq/client/impl/SocketFrameHandler\$1.class" \
              "$w/com/fasterxml/jackson/databind/jsontype/BasicPolymorphicTypeValidator\$Builder\$7.class" \
              "$w/org/jsoup/parser/HtmlTreeBuilderState\$25.class"
        # jackson-core shades fastdoubleparser under a version-stamped package, so 2.21.5
        # brings v2_21_5 and the bundled v2_21_2 tree would be left behind unreferenced.
        rm -rf "$w/com/fasterxml/jackson/core/internal/shaded/fdp/v2_21_2" \
               "$w"/META-INF/versions/*/com/fasterxml/jackson/core/internal/shaded/fdp/v2_21_2
        # httpcomponents is the one MINOR bump here, so a class-level overlay is not enough:
        # the whole org/apache/hc tree goes first and is rebuilt from the three pristine jars.
        # Same for the opensearch-java transport, whose inner classes are all recompiled.
        # Only the opensearch3 storage plugin carries either tree -- graylog.jar and the other
        # two storage plugins bundle no org/apache/hc/** and no opensearch transport at all.
        if [ "${PRUNE_HC:-0}" = 1 ]; then
          rm -rf "$w/org/apache/hc" \
                 "$w/META-INF/maven/org.apache.httpcomponents.client5" \
                 "$w/META-INF/maven/org.apache.httpcomponents.core5"
          rm -f "$w"/org/opensearch/client/transport/httpclient5/ApacheHttpClient5Transport*.class
        fi
        for s in "$@"; do cp -a "$s/." "$w/"; done
        rm -f "$jarp"
        ( cd "$w" && zip -qrX "$jarp" . )
        rm -rf "$w"
      }
      apply "$ROOT/graylog.jar" "$ST/jackson" "$ST/shiro" "$ST/mail" "$ST/lz4" "$ST/log4j" "$ST/jsoup" "$ST/amqp"
      PRUNE_HC=1
      apply "$ROOT/plugin/graylog-storage-opensearch3-${{package.version}}.jar" "$ST/jackson" "$ST/hc" "$ST/osj"
      rm -rf "$PW"
  - runs: |
      # install the server jar, launcher, plugins and config example under /opt/graylog
      dest="${{targets.destdir}}/opt/graylog"
      install -d "$dest"
      cp -r graylog.jar bin plugin graylog.conf.example LICENSE "$dest/"
      # bake the env-driven entrypoint. A read-only rootfs means server.conf and all
      # state (node-id, message journal) live under the writable data dir; every
      # config key is overridable via a GRAYLOG_<KEY> env var (Graylog's own
      # convention), which is what the chart wires MongoDB + the search store into.
      install -d "${{targets.destdir}}/usr/bin"
      cat > "${{targets.destdir}}/usr/bin/docker-entrypoint.sh" <<'EOS'
      #!/bin/bash
      set -euo pipefail

      GRAYLOG_HOME="${GRAYLOG_HOME:-/opt/graylog}"
      CONF="${GRAYLOG_SERVER_CONF:-/var/lib/graylog/server.conf}"

      # Non-server subcommands (version, --help, ...) run the jar directly: no config,
      # no MongoDB/OpenSearch needed. This is what the smoke test drives.
      if [ "${1:-server}" != "server" ]; then
        exec java -jar "$GRAYLOG_HOME/graylog.jar" "$@"
      fi

      DATA_DIR="${GRAYLOG_DATA_DIR:-/var/lib/graylog/data}"
      mkdir -p "$DATA_DIR" "$DATA_DIR/journal" "$(dirname "$CONF")"

      # Defaults for the keys Graylog needs to boot; each is overridable via env.
      # Exported so the render loop below emits them into server.conf.
      export GRAYLOG_DATA_DIR="$DATA_DIR"
      export GRAYLOG_IS_LEADER="${GRAYLOG_IS_LEADER:-true}"
      export GRAYLOG_NODE_ID_FILE="${GRAYLOG_NODE_ID_FILE:-$DATA_DIR/node-id}"
      export GRAYLOG_BIN_DIR="${GRAYLOG_BIN_DIR:-$GRAYLOG_HOME/bin}"
      export GRAYLOG_PLUGIN_DIR="${GRAYLOG_PLUGIN_DIR:-$GRAYLOG_HOME/plugin}"
      export GRAYLOG_MESSAGE_JOURNAL_DIR="${GRAYLOG_MESSAGE_JOURNAL_DIR:-$DATA_DIR/journal}"
      export GRAYLOG_HTTP_BIND_ADDRESS="${GRAYLOG_HTTP_BIND_ADDRESS:-0.0.0.0:9000}"
      export GRAYLOG_MONGODB_URI="${GRAYLOG_MONGODB_URI:-mongodb://localhost/graylog}"

      # Required to start; fail fast with a clear message (the chart supplies these).
      : "${GRAYLOG_PASSWORD_SECRET:?set GRAYLOG_PASSWORD_SECRET (>= 16 chars)}"
      : "${GRAYLOG_ROOT_PASSWORD_SHA2:?set GRAYLOG_ROOT_PASSWORD_SHA2 (sha256 of the admin password)}"

      # Render server.conf: every GRAYLOG_<KEY> env var becomes a lowercased
      # <key> = <value> line. A few control vars are consumed by this script only.
      : > "$CONF"
      while IFS='=' read -r name value; do
        case "$name" in
          GRAYLOG_HOME|GRAYLOG_SERVER_CONF|GRAYLOG_SERVER_JAVA_OPTS) continue ;;
        esac
        key="$(printf '%s' "${name#GRAYLOG_}" | tr '[:upper:]' '[:lower:]')"
        printf '%s = %s\n' "$key" "$value" >> "$CONF"
      done < <(env | grep '^GRAYLOG_')

      exec java ${GRAYLOG_SERVER_JAVA_OPTS:-} -jar "$GRAYLOG_HOME/graylog.jar" server -f "$CONF"
      EOS
      chmod 0755 "${{targets.destdir}}/usr/bin/docker-entrypoint.sh"

test:
  pipeline:
    - runs: |
        test -f /opt/graylog/graylog.jar
        test -x /usr/bin/docker-entrypoint.sh
