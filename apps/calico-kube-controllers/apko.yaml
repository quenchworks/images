# calico-kube-controllers image: Calico's Kubernetes controllers (policy, node, IPAM, service accounts). Nonroot like upstream's image.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-calico-kube-controllers@local

accounts:
  groups:
    - groupname: calico
      gid: 1001
  users:
    - username: calico
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/bin/calico-kube-controllers

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-calico-kube-controllers"
  org.opencontainers.image.licenses: "Apache-2.0"
