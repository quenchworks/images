# nats-server-config-reloader: the NATS config reloader sidecar (from nats-io/nack): it
# watches the NATS config file and signals nats-server to reload, through a shared pid
# file. Built from source, static Go, no CGO. Image only, no chart: the argo-events chart
# runs it next to the QuenchWorks nats image in each JetStream EventBus pod.
#
# 0-CVE: the 0.24.0 build scanned 0 with no module float (measured 2026-09-25).
#
# NEWEST-ONLY: nack ships one line.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(0.24.0)
declare -A SHA256=(
  [0.24.0]=7557710f907f7be6218ab59628b751909e4bacceb148801ad4e35787f1454b10
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
