# Builds nats-server-config-reloader from the nats-io/nack tag tarball onto Wolfi.
package:
  name: quench-nats-server-config-reloader
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened NATS config reloader sidecar, built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - go

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/nats-io/nack/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      set -eu
      export CGO_ENABLED=0 GOFLAGS=-mod=mod GO111MODULE=on GOTOOLCHAIN=local
      go build -trimpath -ldflags "-s -w -X main.Version=${{package.version}}" -o "${{targets.destdir}}/usr/bin/nats-server-config-reloader" ./cmd/nats-server-config-reloader

test:
  pipeline:
    - runs: |
        test -x /usr/bin/nats-server-config-reloader
