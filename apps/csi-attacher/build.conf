# csi-attacher (kubernetes-csi/external-attacher): the CSI external-attacher, which attaches and detaches CSI volumes (VolumeAttachment). A Kubernetes CSI
# sidecar used by every CSI driver (Longhorn pins it in dep-versions). From source, static Go (CGO
# off), version stamped via -X main.version as release-tools/build.make does. Upstream's layout:
# the binary at /csi-attacher, root by default (upstream's image is distroless/static, uid 0; the
# CSI socket it dials is created by the driver, usually as root).
# Latest patch of the last 3 minor lines.
FROM_SOURCE=1
VERSIONS=(4.11.0 4.12.0 4.13.0)
declare -A SHA256=(
  [4.11.0]=5ca3a0769a2a042daa2091d3d55c8d0ec7ee8828d805c80729061baee8050a86
  [4.12.0]=a8abf5f40a8f2c6019b35c2bbb48af0304b5413d96ff0999430592bd3c4dba21
  [4.13.0]=6d3b1b1e50a2faed41859abc8f8ab873654d994cd17d1dc2d376044bf24aa1b7
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
