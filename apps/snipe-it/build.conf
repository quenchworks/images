# snipe-it: Snipe-IT (grokability/snipe-it, AGPL-3.0), IT asset management: hardware, licenses,
# accessories and consumables, check-in and check-out, audits and a REST API. Images issue #76.
#
# From the release tag: composer install --no-dev, then laravel/framework and livewire raised to their fixed
# releases inside the root ranges (-W moves the symfony http stack); the build asserts each floor. Built
# assets come committed upstream. php-8.5-fpm and QuenchWorks' nginx under supervisor (as Firefly III and
# Kimai). storage/ and public/uploads link to /var/lib/snipeit (the volume), seeded from skeletons on first
# start. /usr/libexec/snipe-it-init requires APP_KEY and DB_* (MySQL or MariaDB), waits for the database,
# makes the Passport keys, migrates, creates ADMIN_USER when set and the settings row the setup wizard
# would (so /setup never opens), then starts supervisord.
# LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(8.8.3)
declare -A SHA256=(
  [8.8.3]=bf87d544d3f05cc082bd7cfc72b57573ad809ee5b364b8383eac905d55407867
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
