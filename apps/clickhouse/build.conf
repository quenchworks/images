# clickhouse: from-source via melange (fetch the per-arch prebuilt static binary
# + server-config tarball from the GitHub release, sha512-verified).
# WINDOW: the newest stable patch of each of the two newest lines (26.7 and
# 26.9 as of 2026-09-27). It used to be the 3 newest patches overall, which
# kept a superseded 26.9 patch and missed 26.7.15.52 when it shipped;
# scripts/check/clickhouse.py now checks per line.
# The release channel differs by line (-lts vs -stable), and each asset has its
# own sha512, so all are pinned per version:
#   __VER__     = version           __CHANNEL__ = release channel (lts|stable)
#   __SHA_AMD__ = common-static amd64 sha512   __SHA_ARM__ = common-static arm64 sha512
#   __SHA_SRV__ = clickhouse-server (config) tarball sha512 (arch-independent)
FROM_SOURCE=1
VERSIONS=(26.7.15.52 26.9.4.3)
declare -A CHANNEL=(
  [26.7.15.52]=stable
  [26.9.4.3]=stable
)
declare -A SHA_AMD=(
  [26.7.15.52]=d4333b277fdcde2134ce69bbe1cf183edf0a5d68eba7a27184f7f6f381b3a67ff4f94749b7905177a92d74faf66a52da9f993248c69f6e3e4f468f8b6a42620b
  [26.9.4.3]=ee4fcb10617f9c72e372aa89656e670771fc5a1ea74eae0fca596bbd3be8013695f05eb998e65b70706b07fa31bc331b3fd1da7eb6343a63296745ba88b76ebb
)
declare -A SHA_ARM=(
  [26.7.15.52]=fcfa63b6865af55a75537004d64a468f15cf093b960b652cabbe629786c77c4c883b3d2a9889c1bbd914fc360bd7f9b851b8b6e3f0dba2449ba7322f09333c5b
  [26.9.4.3]=865c3b627a3ec7215ab20db0b5b9a5c167e332cb8854d4ceed1a80be2672b11cd10e8e468ded34964dfcc228508af35e2a92f2523052314c1cd5edb6189d32ad
)
declare -A SHA_SRV=(
  [26.7.15.52]=51570643870c2fc8dd2ba3027074b5a6ecd3e1f5e3fff8e75281a21a135980884a7cf3db5ffb876fa3c08e5d57f4fe846055f743a7997bace75be88e2c0e3820
  [26.9.4.3]=283b7737c4d98dd5f78e3bf9b418b9df8d3beea9e8636ab1705a193d91c7ccac21bc378aa7f09d1061b38bc516ab4fe571ecbba08b00fe802a6b71cbec75d748
)
render() {
  echo "s/__VER__/$1/g; s/__CHANNEL__/${CHANNEL[$1]}/g; s|__SHA_AMD__|${SHA_AMD[$1]}|g; s|__SHA_ARM__|${SHA_ARM[$1]}|g; s|__SHA_SRV__|${SHA_SRV[$1]}|g"
}
