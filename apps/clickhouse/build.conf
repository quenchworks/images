# clickhouse: from-source via melange (fetch the per-arch prebuilt static binary
# + server-config tarball from the GitHub release, sha512-verified).
# The 3 newest stable patches (full X.Y.Z.B, used as-is), flat across lines: when a
# new line starts, the previous line's last patch stays (26.7.14.3 beside 26.9.x).
# The release channel differs by line (-lts vs -stable), and each asset has its
# own sha512, so all are pinned per version:
#   __VER__     = version           __CHANNEL__ = release channel (lts|stable)
#   __SHA_AMD__ = common-static amd64 sha512   __SHA_ARM__ = common-static arm64 sha512
#   __SHA_SRV__ = clickhouse-server (config) tarball sha512 (arch-independent)
FROM_SOURCE=1
VERSIONS=(26.7.14.3 26.9.2.8 26.9.3.38)
declare -A CHANNEL=(
  [26.7.14.3]=stable
  [26.9.2.8]=stable
  [26.9.3.38]=stable
)
declare -A SHA_AMD=(
  [26.7.14.3]=73208035a849059b0d772754dee52590bbcce42f9b947ed5612c8cf66d9753963d5e6215facb730bd703916dc737a3db1e1056efd7424e9523cfd7334a43fcc9
  [26.9.2.8]=fc3836cac1c65b9825a1ea9a09a16f368806d7448229d939d9f4335bb9b63f3c67852ca5834aa6d3ebc432ec1f7c31ae3c9dc7a62128e5ae441ea29423c1606b
  [26.9.3.38]=98ddc17287d94d2847170c98b590ffeb6352add38c2dea5e8a13dc1f083251497f68132b022343957959041300bbc443d883676730dfa1e59384c4e71d7cb58e
)
declare -A SHA_ARM=(
  [26.7.14.3]=60c560f967186b41110e7587b951cf62041da235a1465f6f65c7a598d7ae8ff1acdeccab1ef02d547845d0a24b4dc1f1bca4750b4869a9f4981461d3345d5c02
  [26.9.2.8]=d697308e8f528d3ed7a67d3d0df313d079e15c56b256c39a2f7f424a9873f03317e55209f2e1d62dc36dc0f5299a2e4196d32ea94a49a31ca1c65e5392894582
  [26.9.3.38]=df682e2027cc883eb6f30221a5588dceb14feec2a423159731e486e87982a0ce8fb7e2a1a9b879a90c0ed8d73da27dbc989bc7a8d390506e60ffd1efd437513d
)
declare -A SHA_SRV=(
  [26.7.14.3]=5720674414a49ba47cfb2a5cf50f2e65165c308552cdd4ee811cebfc3d3e5c5417db2066a551281979e284d4d21bab834b57c2501361cb0cae6c1110c84b662c
  [26.9.2.8]=7efe09b80bef97a6881ae53df60bff80693135f622221a1db1a347e8e82920b9df73bd02c2bbb75a1dc65fd6b57f765f7fcd55af5617c7361bc084001f4a4a45
  [26.9.3.38]=1523be8316f39bdd20b373bba2fffacc4bea39ba0a96ebc9b6745f983e11ab24b0121ee8856633956833e90ed5c94512547c27df22ea069a03d610386d5b94b8
)
render() {
  echo "s/__VER__/$1/g; s/__CHANNEL__/${CHANNEL[$1]}/g; s|__SHA_AMD__|${SHA_AMD[$1]}|g; s|__SHA_ARM__|${SHA_ARM[$1]}|g; s|__SHA_SRV__|${SHA_SRV[$1]}|g"
}
