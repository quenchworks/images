)
declare -A SHA_SRV=(
  [26.3.13.31]=c71156af5dba80d6b5fec9fbdf7ede35c505a9a3293325747068235e2cfa90ca8d119b64a87f24feba3b72f15385a428f680bdbf169da7f110408ef9d3478d54
