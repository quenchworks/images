# clickhouse: from-source via melange (fetch the per-arch prebuilt static binary
# + server-config tarball from the GitHub release, sha512-verified).
# WINDOW: the newest stable patch of each of the two newest lines (26.7 and
# 26.9 as of 2026-09-27). It used to be the 3 newest patches overall, which
# kept a superseded 26.9 patch and missed 26.7.15.52 when it shipped;
# scripts/check/clickhouse.py now checks per line.
# The release channel differs by line (-lts vs -stable), and each asset has its
# own sha512, so all are pinned per version:
#   __VER__     = version           __CHANNEL__ = release channel (lts|stable)
#   __SHA_AMD__ = common-static amd64 sha512   __SHA_ARM__ = common-static arm64 sha512
#   __SHA_SRV__ = clickhouse-server (config) tarball sha512 (arch-independent)
FROM_SOURCE=1
VERSIONS=(26.7.28.6 26.9.17.8)
declare -A CHANNEL=(
  [26.7.28.6]=stable
  [26.9.17.8]=stable
)
declare -A SHA_AMD=(
  [26.7.28.6]=4d255bb525a73e31af10efb617e65f489986f09cd5056490ab189e02a403c8be1619bc5e2382fee9c0314b6bd2ba509a90d99e8def8f438dc0f8fe62c125dc11
  [26.9.17.8]=6fc6b563c18d140d6f7d96eb0ffdf90fb28b1730ea009dade2d11586a4f234619a891ab920a389f9af06cd5b12719026f1ffda633bd999754f7eaefe1a57e458
)
declare -A SHA_ARM=(
  [26.7.28.6]=a310c4033d4ad2cbeb6aaf60314cf728a4cbf4b5d5bbcdfb47aff34b7063760143ec9254049617499842d91f4952c0a5180837b73f9bb38b2a4a50c764318b43
  [26.9.17.8]=00eac72ced2b3b43f6dc7334e8e75326a45ee333b6a26f1868e2194f7f27b39932d21b9b15ef3acacee17f91236796b305b949dfeed0a9d15db4c35fc868f4d4
)
declare -A SHA_SRV=(
  [26.7.28.6]=55cda506311b9a2fbeab82909876e1ac42d40ad493f5e785d725ed856fc46ef7cfc8095cff43fb3a5392b51ca3d4d7a6f859a9d49a8189479ac8a4cfca9d22ef
  [26.9.17.8]=644f9dbeb26b5709cf1d8166593c1a0f671490f824d59a5a4d14003bc10314baf33c035e53f7b85f923620fdc925f4e3ec0a456dd9d50b0bf9c1d5f4afc2efa4
)
render() {
  echo "s/__VER__/$1/g; s/__CHANNEL__/${CHANNEL[$1]}/g; s|__SHA_AMD__|${SHA_AMD[$1]}|g; s|__SHA_ARM__|${SHA_ARM[$1]}|g; s|__SHA_SRV__|${SHA_SRV[$1]}|g"
}
