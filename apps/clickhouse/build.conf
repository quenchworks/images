  [26.10.5.57]=cdb52eb016a8e328e4d6c951f7d327e9ffc25cae6f6a20a7f6b77f2d16319408e810e894d68de886b67ba8f817c1a38f760e15fbd1273cbc7022acbc8881ef2a
)
declare -A SHA_ARM=(
  [26.7.37.6]=930fb4788cd6e6fb6cac1872650c9745c16c7415ccc891df6a02dc233609d1d206fdd3740e22d556abe8a6f7c4baa6ce37b5ddfe3b4a2420802cce60f1c6c293
  [26.9.31.21]=7d8c0b8df51253a6aa83dd7caa339ed6d7112e9d5811dafedab1410d3969c95c90adcc5a3823530d0ed5c962f20723cc1e19dd14a69cbe69e647e0e99671f4c1
  [26.10.5.57]=6882a7a1e3adc4c950ff7bd1493a0e440048457063c49c4023d4054d2535339fa67cd1a2e43d0233cfe0d9e1ad749149e816b32092e733c75a2688e2099e09b3
)
declare -A SHA_SRV=(
  [26.7.37.6]=fd28cacdc27ad7241bb30828c19ce6188318b18e66434e84fd082b1ebd941a007e675386a5c6d86d603a4a14f240a33629b4e8d8e8637b333095a21cdfa0cd9f
  [26.9.31.21]=720e077611cef7698d37640d70677fa94a70c117a2890042023d31ef7c616f25665fa0ea3e7623f2cec6e2849c3b940fe71a319157dec44cc68eca63303216a7
  [26.10.5.57]=a3e26986d3116fd3a3dcfba0d18c299f9d132dd3472e244dc2e28e0a9127710c4855b01cad5eed0c85628d83b59476aec01765a72b713a2e7c89d31a3858c781
)
render() {
  echo "s/__VER__/$1/g; s/__CHANNEL__/${CHANNEL[$1]}/g; s|__SHA_AMD__|${SHA_AMD[$1]}|g; s|__SHA_ARM__|${SHA_ARM[$1]}|g; s|__SHA_SRV__|${SHA_SRV[$1]}|g"
}
