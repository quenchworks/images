  [26.10.10.3]=24da5a762a2c24ef9493dd0a154c61294746c74d9f67679a7b9e8cbf1ccf5bda28d3a148949f5200b937e00debc15b3e99995163c365c60d8a117975792783d6
)
declare -A SHA_ARM=(
  [26.7.37.6]=930fb4788cd6e6fb6cac1872650c9745c16c7415ccc891df6a02dc233609d1d206fdd3740e22d556abe8a6f7c4baa6ce37b5ddfe3b4a2420802cce60f1c6c293
  [26.9.36.3]=575a6d67701528fd0ceb77ab41bb34f7dac7a163f0e3484d393e21a9c9c23e5201fed9b011279b17b9682fdcec18245f00d34b5cfc2b03f6c1f87df8e2e5f53d
  [26.10.10.3]=dc3da255e33fa1870864635a851efcaff6f48b245362a4fe7eaa12295b4a86a3097c75cb33e12ba2e71306a6d21dd231ac6de7bb06cb59af68a3befae033bbe2
)
declare -A SHA_SRV=(
  [26.7.37.6]=fd28cacdc27ad7241bb30828c19ce6188318b18e66434e84fd082b1ebd941a007e675386a5c6d86d603a4a14f240a33629b4e8d8e8637b333095a21cdfa0cd9f
  [26.9.36.3]=f2d792705c81d231b3dc99ecb7c701743d5264165fdb993019ed3df53ecd345110081041a695328e68118acd3007a17cf9b347846f73ef15cb28fb508df93fcb
  [26.10.10.3]=3ec523d2829c0f71db6c34f0d7c8ec163df650e0fbad774ae1eb7e594974ae01943a42a1fdfc6c2a2463dce1d3a4e96532e53993bd8713b47396063df3062095
)
render() {
  echo "s/__VER__/$1/g; s/__CHANNEL__/${CHANNEL[$1]}/g; s|__SHA_AMD__|${SHA_AMD[$1]}|g; s|__SHA_ARM__|${SHA_ARM[$1]}|g; s|__SHA_SRV__|${SHA_SRV[$1]}|g"
}
