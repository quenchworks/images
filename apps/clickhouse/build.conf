# clickhouse: from-source via melange (fetch the per-arch prebuilt static binary
# + server-config tarball from the GitHub release, sha512-verified).
# WINDOW: the newest stable patch of each of the two newest lines (26.7 and
# 26.9 as of 2026-09-27). It used to be the 3 newest patches overall, which
# kept a superseded 26.9 patch and missed 26.7.15.52 when it shipped;
# scripts/check/clickhouse.py now checks per line.
# The release channel differs by line (-lts vs -stable), and each asset has its
# own sha512, so all are pinned per version:
#   __VER__     = version           __CHANNEL__ = release channel (lts|stable)
#   __SHA_AMD__ = common-static amd64 sha512   __SHA_ARM__ = common-static arm64 sha512
#   __SHA_SRV__ = clickhouse-server (config) tarball sha512 (arch-independent)
FROM_SOURCE=1
VERSIONS=(26.7.27.3 26.9.16.11)
declare -A CHANNEL=(
  [26.7.27.3]=stable
  [26.9.16.11]=stable
)
declare -A SHA_AMD=(
  [26.7.27.3]=9e1ff1226670c7b7d3fef810d2025686dc5720f4518ccee1dd7b0e25bea35a7fc9b2c9aadf0543e5f7f663e5c3ce6aa8ca9b7575932d03c2f8055ac8944efe6e
  [26.9.16.11]=1a815952495f1c9a844523168c5161fdbe078985574b20c7fab0de4ecd70fade0fcbecb5174cf19c29146aca2e387ee932529d058aa9a13b164a9b79af340eb0
)
declare -A SHA_ARM=(
  [26.7.27.3]=0b39f7ce6f97d47ddfe004e0253cf86bead404254caf523d0a50db02dc2fa0fabfd36619ff7571f853b6fb112f897c525a77616588f91ad5cc88ec6176c9f7bc
  [26.9.16.11]=1e0a9cde4cf16c70035f7cc54e86ace7ec861bb8839c4bac2ab288756d6915d9fba186e6cb7ae57401c342618770ade741531fbc5a43328c8d1e44914584309e
)
declare -A SHA_SRV=(
  [26.7.27.3]=bbaf51572110bbbaa1a579f1911cb152fc247b3702942c253f4b0bddace28dfcab2e5665452a15f7346e5a7a2cc693946d4019281737d55544862de16292f9c8
  [26.9.16.11]=22021943f80fb294ed36feaa9d7d1bf58b5515cae9c0cd9ec45f7315f9cf8afbeea55bbd7246eca6243fb1b82f4d5fb25a0637c5e51947b085fd95f99044dedc
)
render() {
  echo "s/__VER__/$1/g; s/__CHANNEL__/${CHANNEL[$1]}/g; s|__SHA_AMD__|${SHA_AMD[$1]}|g; s|__SHA_ARM__|${SHA_ARM[$1]}|g; s|__SHA_SRV__|${SHA_SRV[$1]}|g"
}
