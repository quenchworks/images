# clickhouse: from-source via melange (fetch the per-arch prebuilt static binary
# + server-config tarball from the GitHub release, sha512-verified).
# WINDOW: the newest stable patch of each of the two newest lines (26.7 and
# 26.9 as of 2026-09-27). It used to be the 3 newest patches overall, which
# kept a superseded 26.9 patch and missed 26.7.15.52 when it shipped;
# the clickhouse check (tools/qw) now checks per line.
# The release channel differs by line (-lts vs -stable), and each asset has its
# own sha512, so all are pinned per version:
#   __VER__     = version           __CHANNEL__ = release channel (lts|stable)
#   __SHA_AMD__ = common-static amd64 sha512   __SHA_ARM__ = common-static arm64 sha512
#   __SHA_SRV__ = clickhouse-server (config) tarball sha512 (arch-independent)
FROM_SOURCE=1
VERSIONS=(26.7.37.6 26.9.25.15)
declare -A CHANNEL=(
  [26.7.37.6]=stable
  [26.9.25.15]=stable
)
declare -A SHA_AMD=(
  [26.7.37.6]=9bd56bee5f3b68a61159ec94207ac01e8c4e53708a20c8929494c77c9d2a8bdf0bf62676e1d660d027392633d20b1f906aaff6c91f23f5fcc9d81da758add8a1
  [26.9.25.15]=84b73c6da55f3fc90314466d9fe7d761117fa9f8c1c39d293405871ea0019df2536f6702426c28f8e43f4b0a1bb2ea3127990233419f26033db2e22c780b6a8c
)
declare -A SHA_ARM=(
  [26.7.37.6]=930fb4788cd6e6fb6cac1872650c9745c16c7415ccc891df6a02dc233609d1d206fdd3740e22d556abe8a6f7c4baa6ce37b5ddfe3b4a2420802cce60f1c6c293
  [26.9.25.15]=51d693596dff5e64c377908d3fc21a5f688f99704718a5517693cfb6c4a85e51f18cc8dbfadb2004e6855bc36bbbf142bca76c3daca71856cdc38d0ce77a8929
)
declare -A SHA_SRV=(
  [26.7.37.6]=fd28cacdc27ad7241bb30828c19ce6188318b18e66434e84fd082b1ebd941a007e675386a5c6d86d603a4a14f240a33629b4e8d8e8637b333095a21cdfa0cd9f
  [26.9.25.15]=0f815bed19f0cd8cf99c3b5495746640496de42304dc94b6ed6cba734f6937d8c85db8eb92eff420e7f77633dc41225d81cfc896171adb86f2441041983210a9
)
render() {
  echo "s/__VER__/$1/g; s/__CHANNEL__/${CHANNEL[$1]}/g; s|__SHA_AMD__|${SHA_AMD[$1]}|g; s|__SHA_ARM__|${SHA_ARM[$1]}|g; s|__SHA_SRV__|${SHA_SRV[$1]}|g"
}
