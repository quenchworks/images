)
declare -A SHA_SRV=(
  [26.5.6.113]=cdda9f8adc2888386f7adad0a19bb6d03883d0f1bab2a90c92a7ad2bf79470b2a9317c856c50156a1c9241780338322a2897b2f31ef2c5f69cdd4cc2d955002b
