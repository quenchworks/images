# clickhouse: from-source via melange (fetch the per-arch prebuilt static binary
# + server-config tarball from the GitHub release, sha512-verified).
# WINDOW: the newest stable patch of each of the two newest lines (26.7 and
# 26.9 as of 2026-09-27). It used to be the 3 newest patches overall, which
# kept a superseded 26.9 patch and missed 26.7.15.52 when it shipped;
# scripts/check/clickhouse.py now checks per line.
# The release channel differs by line (-lts vs -stable), and each asset has its
# own sha512, so all are pinned per version:
#   __VER__     = version           __CHANNEL__ = release channel (lts|stable)
#   __SHA_AMD__ = common-static amd64 sha512   __SHA_ARM__ = common-static arm64 sha512
#   __SHA_SRV__ = clickhouse-server (config) tarball sha512 (arch-independent)
FROM_SOURCE=1
VERSIONS=(26.7.34.3 26.9.22.3)
declare -A CHANNEL=(
  [26.7.34.3]=stable
  [26.9.22.3]=stable
)
declare -A SHA_AMD=(
  [26.7.34.3]=ff7d119363e1168c3a0c5a7a1485ca9eba089b886c78d1c87732094038a11933158739ca7b1be5d5dabbb3fc6f9534b54b189222835ab36767eb8fe317718741
  [26.9.22.3]=095a868ab34d739d55c303bfff47c806344a84592650b27316aa51a5790f22e03d3bb23df6dcb48d7c21011c2be7723183ab61773a1db345329c269f3e1cdb49
)
declare -A SHA_ARM=(
  [26.7.34.3]=6d4a02c8e9f8e209b0637b759d907317df3834cab94a85b79c7bf1991837eee314faa0afafad7ad72370e4d6bbf5c350533a8585a618e6ad6babf124de237239
  [26.9.22.3]=baa0ef9cab6ebeb5adbceca05dfaa449ed4ae4757a3320fbe2c0466174ce01c9137cc8d0e7a88f8c8711045f885d9d8dbd5a1794db26dff85c8eb1ecdc88995a
)
declare -A SHA_SRV=(
  [26.7.34.3]=b689af1726bb3437d3a3aea90638e759f59e74b73790009b56fa9213d9ab7c31c9613ef90e4aa8bde51b3db4bede2eb70d04320f89b8a8fe59421b1b1a1443dc
  [26.9.22.3]=6555afdc61842d5276c6704170080c2c52f5348d58ca745f67fce963f56c96e183cba96af193bfdf436d4c8c54b148531339015a75ae7de54be451b285585681
)
render() {
  echo "s/__VER__/$1/g; s/__CHANNEL__/${CHANNEL[$1]}/g; s|__SHA_AMD__|${SHA_AMD[$1]}|g; s|__SHA_ARM__|${SHA_ARM[$1]}|g; s|__SHA_SRV__|${SHA_SRV[$1]}|g"
}
