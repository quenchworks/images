  [26.10.4.207]=98b42179de847b184d819202b561f275a765d340cbd055a68cd258c8a166e34e850b73d49862ab9acafa35e5ef677ec121e9c0c39882c5ca6da5cb212fffc057
)
declare -A SHA_ARM=(
  [26.7.37.6]=930fb4788cd6e6fb6cac1872650c9745c16c7415ccc891df6a02dc233609d1d206fdd3740e22d556abe8a6f7c4baa6ce37b5ddfe3b4a2420802cce60f1c6c293
  [26.9.29.5]=63ceebde1a4f0a455287864b6d663e62fefd32d00398cb254aace8c90a30622753a21cf665cfc9a0460fd8c41531e09553dbc84c5d2d61f6cea19fab4bc079be
  [26.10.4.207]=bc9a4e5f28bb9db59041e91db81fafc4a55b5a50a0dd0968bc9d387595e3296028cd3411449360b17910300336833cd1928657df50c63f2d6e6f56145d0bfba8
)
declare -A SHA_SRV=(
  [26.7.37.6]=fd28cacdc27ad7241bb30828c19ce6188318b18e66434e84fd082b1ebd941a007e675386a5c6d86d603a4a14f240a33629b4e8d8e8637b333095a21cdfa0cd9f
  [26.9.29.5]=bac296cdb5395d95cc56b6d8735d6305d1311b12fea2279101899154091fd8b3ef38d545a1aca184e6fda5ae032ffe7d99f842011bfedc7f1714e425e0983a5c
  [26.10.4.207]=d61c4d2a8c8ef49690cd68bcf03591071728528aeb28e4e042e09942b938113d118cff02ac51b0cc9314551e13026490503075e688c43ced47926fa9139471f2
)
render() {
  echo "s/__VER__/$1/g; s/__CHANNEL__/${CHANNEL[$1]}/g; s|__SHA_AMD__|${SHA_AMD[$1]}|g; s|__SHA_ARM__|${SHA_ARM[$1]}|g; s|__SHA_SRV__|${SHA_SRV[$1]}|g"
}
