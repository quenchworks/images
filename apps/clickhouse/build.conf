# clickhouse: from-source via melange (fetch the per-arch prebuilt static binary
# + server-config tarball from the GitHub release, sha512-verified).
# WINDOW: the newest stable patch of each of the two newest lines (26.7 and
# 26.9 as of 2026-09-27). It used to be the 3 newest patches overall, which
# kept a superseded 26.9 patch and missed 26.7.15.52 when it shipped;
# scripts/check/clickhouse.py now checks per line.
# The release channel differs by line (-lts vs -stable), and each asset has its
# own sha512, so all are pinned per version:
#   __VER__     = version           __CHANNEL__ = release channel (lts|stable)
#   __SHA_AMD__ = common-static amd64 sha512   __SHA_ARM__ = common-static arm64 sha512
#   __SHA_SRV__ = clickhouse-server (config) tarball sha512 (arch-independent)
FROM_SOURCE=1
VERSIONS=(26.7.29.12 26.9.18.11)
declare -A CHANNEL=(
  [26.7.29.12]=stable
  [26.9.18.11]=stable
)
declare -A SHA_AMD=(
  [26.7.29.12]=a7fb1ba753463e4a5a250c654913c3ee35fa5520c1dcdd97479e938ac20c7393bbb34befdb860e26e0dff322a5585d2e1c8ae4ccba2dbc391504af4f2e1adeb0
  [26.9.18.11]=c606ede01a828cec70500475aba76918193aa940bc26d547d4406226e6651e37f454f3befd02a6febe24fb7af010dcf040c4e4f59e7e09fd05806db18b0c977d
)
declare -A SHA_ARM=(
  [26.7.29.12]=9efb82145f235cedcf7c98a8b24646ca8950e1d577913f118149d171d0b8643b7574120092a59c0435cd07e6b73aafb55b820cbf202fa03daa8d9410d48b1233
  [26.9.18.11]=ab0e961aa4e8d8158e5284960bfbe72f042d5f70386795bfda528a8e58c095e4e1a93f9b0030be318de6239ee0c491f8287d21c49dc61d84d1e17715df4b9d99
)
declare -A SHA_SRV=(
  [26.7.29.12]=4ca2cae004ebfe0f94c1bab5605a9709b56421a101a1c3576d653c28a5004accd0d2a187ec318f6238e7e363bf13d85126a4389eb617377d9b5f7957fefcba07
  [26.9.18.11]=333b50d9f878c1110da8b90424959cc2463cc7da4d4fcb2f6949f7cba322b8add1de447da127314938c4c4fba067156ff31c4e1269854447137d1143b812e07e
)
render() {
  echo "s/__VER__/$1/g; s/__CHANNEL__/${CHANNEL[$1]}/g; s|__SHA_AMD__|${SHA_AMD[$1]}|g; s|__SHA_ARM__|${SHA_ARM[$1]}|g; s|__SHA_SRV__|${SHA_SRV[$1]}|g"
}
