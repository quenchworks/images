  [26.10.9.12]=477ab66cc9e5f21b7e27d2b08586950dc9b9c540412c7dda6a658a8e9da0eb38ad118c1de73a8bf7f714170dd8faf0936e1a6e5471d92cdc1405d6efc07c2be9
)
declare -A SHA_ARM=(
  [26.7.37.6]=930fb4788cd6e6fb6cac1872650c9745c16c7415ccc891df6a02dc233609d1d206fdd3740e22d556abe8a6f7c4baa6ce37b5ddfe3b4a2420802cce60f1c6c293
  [26.9.35.9]=952c07a42c3274ce7a22e6b8de0abfa37b31dc5a65ff02283f9205977121b81681975d003081854c34ee6134b67f1d039ad3fe10b0f6a40209f085d1d64a8c88
  [26.10.9.12]=10888dcd8aa10b79752a2864ce2f0684ed1d95e806ab1c4afcbce61449ffa97bd6efc55b0164e66fddd2455b303da6e7b109008cd693b1332a79cad87fd5d34c
)
declare -A SHA_SRV=(
  [26.7.37.6]=fd28cacdc27ad7241bb30828c19ce6188318b18e66434e84fd082b1ebd941a007e675386a5c6d86d603a4a14f240a33629b4e8d8e8637b333095a21cdfa0cd9f
  [26.9.35.9]=0fc080b5368d43b05a8ad16391ca1f11049b756b5fdf70d620e6f97c3c9afb035777d8208ba6ec95a7e1bd6040dbdf24145f1f2ea70dc2a1928363c511927f21
  [26.10.9.12]=624bcfb0172b16a6fba598954bfcd4ab83ddc6fa11aa1ce25f36f59afb5083c6a589f56172fa1414cd703ce2654d7b91136706a5945408234dbb20c6a59c27dc
)
render() {
  echo "s/__VER__/$1/g; s/__CHANNEL__/${CHANNEL[$1]}/g; s|__SHA_AMD__|${SHA_AMD[$1]}|g; s|__SHA_ARM__|${SHA_ARM[$1]}|g; s|__SHA_SRV__|${SHA_SRV[$1]}|g"
}
