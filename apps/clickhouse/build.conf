# clickhouse: from-source via melange (fetch the per-arch prebuilt static binary
# + server-config tarball from the GitHub release, sha512-verified).
# WINDOW: the newest stable patch of each of the two newest lines (26.7 and
# 26.9 as of 2026-09-27). It used to be the 3 newest patches overall, which
# kept a superseded 26.9 patch and missed 26.7.15.52 when it shipped;
# scripts/check/clickhouse.py now checks per line.
# The release channel differs by line (-lts vs -stable), and each asset has its
# own sha512, so all are pinned per version:
#   __VER__     = version           __CHANNEL__ = release channel (lts|stable)
#   __SHA_AMD__ = common-static amd64 sha512   __SHA_ARM__ = common-static arm64 sha512
#   __SHA_SRV__ = clickhouse-server (config) tarball sha512 (arch-independent)
FROM_SOURCE=1
VERSIONS=(26.7.16.2 26.9.5.2)
declare -A CHANNEL=(
  [26.7.16.2]=stable
  [26.9.5.2]=stable
)
declare -A SHA_AMD=(
  [26.7.16.2]=f5a67bc90761106617d4dd0c583bcd3cf15d3025773abf3c4ef58a9c974bb35ef89f207b91ea658992fb144a99dc69189372d5b63d646c86d1f086c649b30cf0
  [26.9.5.2]=434ddbe3b5963fc16df7e778e6b89565e07a0d9dd608baf8bbfdb5fb4af4f4bbdeeb32abbace71f6bf85808186ea2e59e6aa003152e84c23c45b0ff34e8200d2
)
declare -A SHA_ARM=(
  [26.7.16.2]=80b7a72b575a5c60f634d60be348aee0d821004e30c935e000ed784979c82ae87508ddd6fd31e4f26c2cd6072f3728c7ecc8f3c1b7032b70e149f706db021413
  [26.9.5.2]=a493a078667d79602b740fe2264dad495a7ea7fb19208f0f5b6e188efcea3f1f0d1202487cbe007c1a05f4e9841a31925c4b1fd3d700c53f8a75333a7899e579
)
declare -A SHA_SRV=(
  [26.7.16.2]=131cb5b572a280448c0c36f0210672c90dd9dd2ac3c8f6d8718fd0296fa57fbb2a286c90288b463e548d851d02b2ba7416092e3d3d11f292579a85a5c485ac7f
  [26.9.5.2]=db546fcd1e1439e0b266ac62ade93a251239ca53075b248b4b8becb395b0000e8b40b3410a1d93ca483a8865df0280bc78e7f86ea4c09aeb4192522f104471f5
)
render() {
  echo "s/__VER__/$1/g; s/__CHANNEL__/${CHANNEL[$1]}/g; s|__SHA_AMD__|${SHA_AMD[$1]}|g; s|__SHA_ARM__|${SHA_ARM[$1]}|g; s|__SHA_SRV__|${SHA_SRV[$1]}|g"
}
