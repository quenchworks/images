# clickhouse: from-source via melange (fetch the per-arch prebuilt static binary
# + server-config tarball from the GitHub release, sha512-verified).
# WINDOW: the newest stable patch of each of the two newest lines (26.7 and
# 26.9 as of 2026-09-27). It used to be the 3 newest patches overall, which
# kept a superseded 26.9 patch and missed 26.7.15.52 when it shipped;
# scripts/check/clickhouse.py now checks per line.
# The release channel differs by line (-lts vs -stable), and each asset has its
# own sha512, so all are pinned per version:
#   __VER__     = version           __CHANNEL__ = release channel (lts|stable)
#   __SHA_AMD__ = common-static amd64 sha512   __SHA_ARM__ = common-static arm64 sha512
#   __SHA_SRV__ = clickhouse-server (config) tarball sha512 (arch-independent)
FROM_SOURCE=1
VERSIONS=(26.7.36.9 26.9.24.8)
declare -A CHANNEL=(
  [26.7.36.9]=stable
  [26.9.24.8]=stable
)
declare -A SHA_AMD=(
  [26.7.36.9]=da71bb14209626fbf16fbcc22869a4d4e801e708d585281c0bb8eb6b0410abb07e08819a1cba1b4b20528782ec5a30a291abff1e12a7bff9ba9070c74456c20d
  [26.9.24.8]=991eb5f082c03c9f9921a211885895419b8efc605156f55f45bb18ff0ba9238a60194de636adb9d86b82a41a48f960dc4ce852032df356547f399f9fd5531ee0
)
declare -A SHA_ARM=(
  [26.7.36.9]=c5008d097ccdb51963f1f105b48655c3b4fa00a9e7f2a8ace19817ac75cc2f37c07f2b0c2ff111f6a78dddb213a896e565f8cd22e4093242a014dcf14e92914a
  [26.9.24.8]=eaf03bcf6da280424d9d2cece3ea8984814fa1c4eaa9ceea3321c72eb63bca4ff084fc29ec761e56be2b41465b946b34ebb6271f6dd3bd5b491ad61538de3d9a
)
declare -A SHA_SRV=(
  [26.7.36.9]=c36819e607860381cb0dc57c6144056883b006922bafe5b53ad0e8888a515237d441aa0e7310660cbd7e331179b5adc0761ed4e9e1cde879be36875f312a56d0
  [26.9.24.8]=5c91abb8982cadb6e5c0712061401fafe1fa0b529f4194744e1869715d97c90e2d5b5b38827d7a18bec67a5f8f4d8a7362f49b0705a316d4d88eb1232c970e09
)
render() {
  echo "s/__VER__/$1/g; s/__CHANNEL__/${CHANNEL[$1]}/g; s|__SHA_AMD__|${SHA_AMD[$1]}|g; s|__SHA_ARM__|${SHA_ARM[$1]}|g; s|__SHA_SRV__|${SHA_SRV[$1]}|g"
}
