# metallb-speaker: from-source via melange. MetalLB speaker: announces assigned LoadBalancer IPs over L2 (ARP/NDP) or BGP from every node.
# Built from the metallb/metallb v<VER> source tag, one binary per image (upstream's own
# split: controller and speaker are separate images). CGO_ENABLED=0 and the version
# ldflags match upstream's Dockerfile (internal/version.gitCommit / gitBranch; the
# version string itself is a constant in internal/version).
#
# NEWEST-ONLY: MetalLB ships one active line, and the chart pins the newest.
#
# NATIVE MODE ONLY: upstream's speaker image also bundles frr-metrics, cp-tool and the
# FRR reloader script for FRR mode, which additionally needs the FRR daemon image. This
# image ships /usr/bin/speaker for the native L2/BGP implementation, the default.
FROM_SOURCE=1
VERSIONS=(0.16.0)
declare -A SHA256=(
  [0.16.0]=16881b69bce5e77e25b12c50bb34f0c664e87efb977cfed5c02bbaa3459e006f
)
# the commit the annotated v<VER> tag points at, stamped as gitCommit
declare -A COMMIT=(
  [0.16.0]=4c613e152c3434f71137b5f2a2ce15ee93681606
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g; s|__COMMIT__|${COMMIT[$1]:0:8}|g"; }
