#
# From the release tag with the house Go floors and the otel 1.47 family loop (cosign's recipe). Both binaries (age, age-keygen) are stamped with -X main.Version.
# LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(1.3.2)
declare -A SHA256=(
  [1.3.2]=b07c28c6c4bdafa272073a310b75bc22c49da8904585a89c30e5ca4233e63843
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
