# Builds the Harbor Trivy scanner adapter from source onto Wolfi, bundling the
# Trivy CLI it shells out to. This is the OPTIONAL Harbor v2.14.4 image-scanning
# component (the registry works without it). TWO pure-Go binaries, both built
# CGO-free (CGO_ENABLED=0), multi-arch, from pinned source tarballs:
#
#   1. scanner-trivy  -- github.com/goharbor/harbor-scanner-trivy, the HTTP API
#      adapter Harbor calls to start scans. It does NOT scan itself: it shells
#      out to the `trivy` CLI (pkg/trivy/wrapper.go: trivyCmd="trivy", resolved
#      via exec.LookPath -> PATH), parses the report, and serves results back to
#      Harbor over its REST API.
#   2. trivy          -- github.com/aquasecurity/trivy, the scanner CLI the
#      adapter invokes. Baked into the image on PATH at /usr/bin/trivy. The vuln
#      DB is NOT baked: trivy downloads it at RUNTIME into its cache dir (the
#      chart mounts a writable PVC/emptyDir at SCANNER_TRIVY_CACHE_DIR).
#
# PIN (read VERBATIM from the Harbor v2.14.4 root Makefile):
#   TRIVYADAPTERVERSION = v0.36.0   (goharbor/harbor-scanner-trivy release tag)
#   TRIVYVERSION        = v0.70.0   (aquasecurity/trivy version to bundle)
# The APK/image version tracks the ADAPTER version (0.36.0); the bundled trivy
# version (0.70.0) is stamped into the trivy binary via ldflags and reported by
# `trivy --version`.
#
# Both go.mod files require go 1.25.x; we use the Wolfi go-1.26 toolchain for the
# latest stdlib CVE fixes. Neither repo vendors deps -> modules resolve from the
# Go proxy at build time (GOFLAGS=-mod=mod). Trivy has a very large module graph;
# CI/local builds set TMPDIR=/home/mkabumattar/.cache/melange-tmp.
package:
  name: quench-harbor-trivy-adapter
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Harbor Trivy scanner adapter (harbor-scanner-trivy v0.36.0) bundling the Trivy CLI v0.70.0, built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - git              # trivy downloads/clones the vuln DB OCI repo at runtime
      - busybox          # minimal shell for debugging; not on the entrypoint path

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      # both go.mod files require go >= 1.25.x; use the current go-1.26 toolchain.
      - go-1.26

pipeline:
  # ---- 1) Build the Trivy CLI (github.com/aquasecurity/trivy @ v0.70.0) ----
  # Fetched + sha256-verified from the git tag tarball. Built exactly the way
  # trivy's magefile does: pure Go, version stamped via
  #   -X github.com/aquasecurity/trivy/pkg/version/app.ver=<ver>
  # (magefiles/magefile.go buildLdflags + Build target -> `go build ./cmd/trivy`).
  # The DB is NOT baked; trivy downloads it at runtime into its cache dir.
  - runs: mkdir -p trivy scanner
  - uses: fetch
    with:
      uri: https://github.com/aquasecurity/trivy/archive/refs/tags/v__TRIVY__.tar.gz
      expected-sha256: __TRIVY_SHA__
      directory: trivy

  # ---- 2) Build the scanner adapter (goharbor/harbor-scanner-trivy @ v0.36.0) ----
  # Fetched + sha256-verified from the git tag tarball. Built like the repo's
  # Makefile build target (GOOS=linux CGO_ENABLED=0 go build cmd/scanner-trivy/main.go),
  # with the GoReleaser version ldflags (main.version/commit/date) so
  # `scanner-trivy` logs its real version at startup.
  - uses: fetch
    with:
      uri: https://github.com/goharbor/harbor-scanner-trivy/archive/refs/tags/v__SCANNER__.tar.gz
      expected-sha256: __SCANNER_SHA__
      directory: scanner

  - runs: |
      export CGO_ENABLED=0
      export GOOS=linux
      export GOTOOLCHAIN=local
      export GOFLAGS=-mod=mod

      install -d "${{targets.destdir}}/usr/bin"

      # ---- trivy CLI ----
      # Trivy v0.70.0 imports the Go 1.25 experimental encoding/json/v2 +
      # encoding/json/jsontext packages (pkg/x/json), which are gated behind
      # GOEXPERIMENT=jsonv2; enable it for the trivy build (upstream's release
      # CI builds with the same experiment for the 0.70 line).
      ( cd trivy
        # ---- 0-CVE module float (docs/go-module-float.md) --------------------
        # Trivy's pinned deps carry FIXABLE gobinary CVEs; the workflow's
        # gobinary scan is the hard gate. FLOOR is a FLOOR, not a pin: the old
        # hardcoded `go get X@vN` chain turns into a DOWNGRADE the moment
        # trivy's own go.mod moves past one of these, silently re-introducing
        # the CVE the bump was added to clear. Only modules genuinely BELOW
        # their floor are touched.
        #
        # Floors are applied as SELF-REPLACES, not `go get`: most of these are
        # `// indirect` here, and a bare `go get` on an indirect require is
        # reverted to the graph's MVS minimum by the next resolution. That is
        # exactly why containerd used to need bumping LAST, right before tidy --
        # a sibling `go get` kept knocking containerd/v2 back down. `go mod
        # tidy` never drops a replace, so ordering stops mattering.
        #
        #   containerd            CVE-2026-46680 (runAsNonRoot bypass) +
        #                         CVE-2026-53488                       -> 1.7.33
        # 2026-09-16: the floor for containerd/v2 was v2.2.8 and the build still
        # shipped CVE-2026-53495, because the graph resolved v2.3.3 and a single
        # floor value only asks "is it higher". CVE-2026-53495 is fixed per line,
        # in 2.0.12, 2.2.8 AND 2.3.5, so v2.3.3 clears the floor while still
        # carrying the CVE. Raised to v2.3.5, the fix on the line this actually
        # resolves to. Any per-line backport needs the floor set to the fix on
        # the highest line the graph can reach, not the lowest fix that exists.
        #   containerd/v2         CVE-2026-53488 + CVE-2026-53495 (CRI
        #                         ExecSync goroutine leak DoS; fixed in
        #                         2.0.12/2.2.8/2.3.5 -- take the fix on the
        #                         v2.2 line trivy is already on)        -> 2.2.8
        #   go-git/go-billy/v5    CVE-2026-44973/44740                 -> 5.9.0
        #   go-git/go-git/v5      CVE-2026-45022/41506/45571/45570 +   -> 5.19.2
        #                         GHSA-w5pp-99ch-qj29
        #   in-toto-golang        GHSA-pmwq-pjrm-6p5r (negation)       -> 0.11.0
        #   sigstore/rekor        CVE-2026-48702                       -> 1.5.2
        #   sigstore/timestamp-authority/v2 CVE-2026-49835            -> 2.1.0
        #   sigstore/sigstore-go  CVE-2026-49834 (multi-log bypass)    -> 1.3.0
        #   golang.org/x/crypto   CVE-2026-39827 + ssh CVE cluster     -> 0.56.0
        #   golang.org/x/net      CVE-2026-25681/27136/39821/42502 +   -> 0.58.0
        #                         html/idna cluster
        #   oras.land/oras-go/v2  CVE-2026-50151/50162/48978           -> 2.6.2
        #   google.golang.org/grpc GHSA-hrxh-6v49-42gf (xDS RBAC + HTTP/2, HIGH) -> 1.83.2
        #                         (pulls the otel 1.44 + oauth2 0.36 coherent cascade)
        FLOOR="github.com/containerd/containerd@v1.7.33 github.com/containerd/containerd/v2@v2.3.5 github.com/go-git/go-billy/v5@v5.9.0 github.com/go-git/go-git/v5@v5.19.2 github.com/in-toto/in-toto-golang@v0.11.0 github.com/sigstore/rekor@v1.5.2 github.com/sigstore/timestamp-authority/v2@v2.1.0 github.com/sigstore/sigstore-go@v1.3.0 github.com/moby/buildkit@v0.32.2 golang.org/x/crypto@v0.56.0 golang.org/x/mod@v0.40.0 golang.org/x/net@v0.58.0 golang.org/x/text@v0.41.0 golang.org/x/oauth2@v0.36.0 oras.land/oras-go/v2@v2.6.2 google.golang.org/grpc@v1.83.2 go.opentelemetry.io/otel@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.45.0 go.opentelemetry.io/otel/sdk@v1.45.0 go.opentelemetry.io/otel/trace@v1.45.0 go.opentelemetry.io/otel/metric@v1.45.0"
        MODS="$(echo "$FLOOR" | tr ' ' '\n' | cut -d@ -f1)"
        # prints "<mod>@<floor> (<tag> has <ver>)" for every module below its floor
        below_floor() {
          awk -v floor="$FLOOR" -v tag="$1" '
            BEGIN { n = split(floor, f, " ")
                    for (i = 1; i <= n; i++) { split(f[i], kv, "@"); want[kv[1]] = kv[2] } }
            ($1 in want) {
              split(substr($2, 2), g, "."); split(substr(want[$1], 2), w, ".")
              for (i = 1; i <= 3; i++) {
                if ((g[i] + 0) > (w[i] + 0)) next
                if ((g[i] + 0) < (w[i] + 0)) { print $1 "@" want[$1] " (" tag " has " $2 ")"; next }
              }
            }'
        }
        # `go list -m` prints "<mod> <ver>" or "<mod> <ver> => <mod> <ver>", so
        # $NF is the EFFECTIVE version and a replace cannot hide behind the
        # require line. -e keeps modules absent from this graph from aborting.
        go list -m -e $MODS
        need="$(go list -m -e $MODS | awk 'NF >= 2 && $NF ~ /^v[0-9]/ { print $1, $NF }' \
          | below_floor go.mod | awk '{ print $1 }')"
        for f in $need; do go mod edit -replace "${f%%@*}=${f}"; done
        # tidy over trivy's very large graph (enlarged by the rekor/tsa bumps)
        # intermittently trips DNS timeouts on the sandbox resolver mid-download.
        # The module cache persists across retries in this sandbox, so a bounded
        # retry loop progressively fills it and converges.
        for i in 1 2 3 4 5 6 7 8; do
          go mod tidy && break
          echo "go mod tidy attempt $i failed (transient net); retrying" >&2
          sleep 5
        done
        go mod verify >/dev/null 2>&1 || true
        GOEXPERIMENT=jsonv2 go build -trimpath \
          -ldflags="-s -w -X=github.com/aquasecurity/trivy/pkg/version/app.ver=v__TRIVY__" \
          -o "${{targets.destdir}}/usr/bin/trivy" ./cmd/trivy

        # The float is only real if it reached the BINARY -- assert the OUTCOME,
        # not the edit. `go version -m` prints a `dep` line and, when the module
        # was replaced, an immediately following `=>` line holding the version
        # actually LINKED. Collapse each pair to that effective version (a
        # replace-shadowed float shows up as a `=>` below the floor) and fail
        # the build rather than ship a green-looking recipe that pinned nothing.
        bad="$(go version -m "${{targets.destdir}}/usr/bin/trivy" | awk '
            $1 == "dep" { if (h) print h; h = $2 " " $3; next }
            $1 == "=>"  { h = $2 " " $3; next }
            { if (h) { print h; h = "" } }
            END { if (h) print h }' | below_floor trivy)"
        [ -z "$bad" ] || { echo "❌ 0-CVE float did not reach trivy:"; echo "$bad"; exit 1; }
      )

      # ---- scanner-trivy adapter ----
      ( cd scanner
        # Controlled CVE bumps -- v0.36.0's pinned deps carry FIXABLE gobinary
        # CVEs (the workflow's gobinary scan is the hard gate):
        #   golang.org/x/net      CVE-2025-22870 (proxy bypass) +
        #                         CVE-2025-22872 (html tokenizer)  -> latest (>=0.38.0)
        #   redis/go-redis/v9     CVE-2025-29923 (out-of-bounds)   -> v9.7.3
        go get golang.org/x/net@latest
        go get github.com/redis/go-redis/v9@v9.7.3
        go mod tidy
        go build -trimpath \
          -ldflags="-s -w -X main.version=v__SCANNER__ -X main.commit=v__SCANNER__ -X main.date=unknown" \
          -o "${{targets.destdir}}/usr/bin/scanner-trivy" ./cmd/scanner-trivy
      )

      # provenance: license markers
      install -d "${{targets.destdir}}/usr/share/doc/harbor-trivy-adapter"
      cp scanner/LICENSE "${{targets.destdir}}/usr/share/doc/harbor-trivy-adapter/LICENSE.scanner-trivy" 2>/dev/null || true
      cp trivy/LICENSE   "${{targets.destdir}}/usr/share/doc/harbor-trivy-adapter/LICENSE.trivy" 2>/dev/null || true

  - uses: strip

test:
  pipeline:
    - runs: |
        # the bundled trivy CLI reports the pinned TRIVYVERSION
        /usr/bin/trivy --version
        /usr/bin/trivy --version | grep -q "0.70.0"
        # the adapter binary exists and prints help (it has no --version flag;
        # it logs its version at startup -- the apko smoke test boots it)
        test -x /usr/bin/scanner-trivy
        # trivy must be resolvable on PATH (the adapter shells out via LookPath)
        command -v trivy
