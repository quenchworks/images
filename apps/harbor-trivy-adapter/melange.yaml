# Builds the Harbor Trivy scanner adapter from source onto Wolfi, bundling the
# Trivy CLI it shells out to. This is the OPTIONAL Harbor v2.14.4 image-scanning
# component (the registry works without it). TWO pure-Go binaries, both built
# CGO-free (CGO_ENABLED=0), multi-arch, from pinned source tarballs:
#
#   1. scanner-trivy  -- github.com/goharbor/harbor-scanner-trivy, the HTTP API
#      adapter Harbor calls to start scans. It does NOT scan itself: it shells
#      out to the `trivy` CLI (pkg/trivy/wrapper.go: trivyCmd="trivy", resolved
#      via exec.LookPath -> PATH), parses the report, and serves results back to
#      Harbor over its REST API.
#   2. trivy          -- github.com/aquasecurity/trivy, the scanner CLI the
#      adapter invokes. Baked into the image on PATH at /usr/bin/trivy. The vuln
#      DB is NOT baked: trivy downloads it at RUNTIME into its cache dir (the
#      chart mounts a writable PVC/emptyDir at SCANNER_TRIVY_CACHE_DIR).
#
# PIN (read VERBATIM from the Harbor v2.14.4 root Makefile):
#   TRIVYADAPTERVERSION = v0.36.0   (goharbor/harbor-scanner-trivy release tag)
#   TRIVYVERSION        = v0.70.0   (aquasecurity/trivy version to bundle)
# The APK/image version tracks the ADAPTER version (0.36.0); the bundled trivy
# version (0.70.0) is stamped into the trivy binary via ldflags and reported by
# `trivy --version`.
#
# Both go.mod files require go 1.25.x; we use the Wolfi go-1.25 toolchain for the
# latest stdlib CVE fixes. Neither repo vendors deps -> modules resolve from the
# Go proxy at build time (GOFLAGS=-mod=mod). Trivy has a very large module graph;
# CI/local builds set TMPDIR=/home/mkabumattar/.cache/melange-tmp.
package:
  name: quench-harbor-trivy-adapter
  version: 0.36.0
  epoch: 0
  description: "Quenchworks hardened Harbor Trivy scanner adapter (harbor-scanner-trivy v0.36.0) bundling the Trivy CLI v0.70.0, built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - git              # trivy downloads/clones the vuln DB OCI repo at runtime
      - busybox          # minimal shell for debugging; not on the entrypoint path

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      # both go.mod files require go >= 1.25.x; use the current go-1.25 toolchain.
      - go-1.25

pipeline:
  # ---- 1) Build the Trivy CLI (github.com/aquasecurity/trivy @ v0.70.0) ----
  # Fetched + sha256-verified from the git tag tarball. Built exactly the way
  # trivy's magefile does: pure Go, version stamped via
  #   -X github.com/aquasecurity/trivy/pkg/version/app.ver=<ver>
  # (magefiles/magefile.go buildLdflags + Build target -> `go build ./cmd/trivy`).
  # The DB is NOT baked; trivy downloads it at runtime into its cache dir.
  - runs: mkdir -p trivy scanner
  - uses: fetch
    with:
      uri: https://github.com/aquasecurity/trivy/archive/refs/tags/v0.70.0.tar.gz
      expected-sha256: ff9ac06468aab89802388f16d1d179f4680db714afbf6a8132a417d288aa008e
      directory: trivy

  # ---- 2) Build the scanner adapter (goharbor/harbor-scanner-trivy @ v0.36.0) ----
  # Fetched + sha256-verified from the git tag tarball. Built like the repo's
  # Makefile build target (GOOS=linux CGO_ENABLED=0 go build cmd/scanner-trivy/main.go),
  # with the GoReleaser version ldflags (main.version/commit/date) so
  # `scanner-trivy` logs its real version at startup.
  - uses: fetch
    with:
      uri: https://github.com/goharbor/harbor-scanner-trivy/archive/refs/tags/v0.36.0.tar.gz
      expected-sha256: 774b79f4dd98d38cfc5125b9aa03223d3d57d10c77a01da74913846ccc35ceac
      directory: scanner

  - runs: |
      export CGO_ENABLED=0
      export GOOS=linux
      export GOTOOLCHAIN=local
      export GOFLAGS=-mod=mod

      install -d "${{targets.destdir}}/usr/bin"

      # ---- trivy CLI ----
      # Trivy v0.70.0 imports the Go 1.25 experimental encoding/json/v2 +
      # encoding/json/jsontext packages (pkg/x/json), which are gated behind
      # GOEXPERIMENT=jsonv2; enable it for the trivy build (upstream's release
      # CI builds with the same experiment for the 0.70 line).
      ( cd trivy
        # Controlled CVE bumps -- v0.70.0's pinned deps carry FIXABLE gobinary
        # CVEs (the workflow's gobinary scan is the hard gate). Bump only the
        # affected modules to a fixed release:
        #   containerd            CVE-2026-46680 (runAsNonRoot bypass)  -> 2.2.4
        #   go-git/go-billy/v5    CVE-2026-44973/44740                  -> 5.9.0
        #   go-git/go-git/v5      CVE-2026-45022/41506/45571/45570 +    -> 5.19.1
        #                         GHSA-w5pp-99ch-qj29
        #   in-toto-golang        GHSA-pmwq-pjrm-6p5r (negation)        -> 0.11.0
        go get github.com/containerd/containerd@v1.7.32
        go get github.com/containerd/containerd/v2@v2.2.4
        go get github.com/go-git/go-billy/v5@v5.9.0
        go get github.com/go-git/go-git/v5@v5.19.1
        go get github.com/in-toto/in-toto-golang@v0.11.0
        go mod tidy
        GOEXPERIMENT=jsonv2 go build -trimpath \
          -ldflags="-s -w -X=github.com/aquasecurity/trivy/pkg/version/app.ver=v0.70.0" \
          -o "${{targets.destdir}}/usr/bin/trivy" ./cmd/trivy
      )

      # ---- scanner-trivy adapter ----
      ( cd scanner
        # Controlled CVE bumps -- v0.36.0's pinned deps carry FIXABLE gobinary
        # CVEs (the workflow's gobinary scan is the hard gate):
        #   golang.org/x/net      CVE-2025-22870 (proxy bypass) +
        #                         CVE-2025-22872 (html tokenizer)  -> latest (>=0.38.0)
        #   redis/go-redis/v9     CVE-2025-29923 (out-of-bounds)   -> v9.7.3
        go get golang.org/x/net@latest
        go get github.com/redis/go-redis/v9@v9.7.3
        go mod tidy
        go build -trimpath \
          -ldflags="-s -w -X main.version=v0.36.0 -X main.commit=v0.36.0 -X main.date=unknown" \
          -o "${{targets.destdir}}/usr/bin/scanner-trivy" ./cmd/scanner-trivy
      )

      # provenance: license markers
      install -d "${{targets.destdir}}/usr/share/doc/harbor-trivy-adapter"
      cp scanner/LICENSE "${{targets.destdir}}/usr/share/doc/harbor-trivy-adapter/LICENSE.scanner-trivy" 2>/dev/null || true
      cp trivy/LICENSE   "${{targets.destdir}}/usr/share/doc/harbor-trivy-adapter/LICENSE.trivy" 2>/dev/null || true

  - uses: strip

test:
  pipeline:
    - runs: |
        # the bundled trivy CLI reports the pinned TRIVYVERSION
        /usr/bin/trivy --version
        /usr/bin/trivy --version | grep -q "0.70.0"
        # the adapter binary exists and prints help (it has no --version flag;
        # it logs its version at startup -- the apko smoke test boots it)
        test -x /usr/bin/scanner-trivy
        # trivy must be resolvable on PATH (the adapter shells out via LookPath)
        command -v trivy
