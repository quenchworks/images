# STATUS: ZLIB-ONLY as of 2026-09-16. Measured, not assumed: run 35109680830
# on eebd9b8 gated with exactly one finding, zlib CVE-2026-85091, on both
# arches. containerd is gone from the table entirely.
#
# Getting here took two goes. Flooring containerd/v2 at v2.2.8 left
# CVE-2026-53495 in place, because the graph resolves the 2.3 line and a single
# floor value only asks whether the version is higher. That CVE is fixed per
# line, in 2.0.12, 2.2.8 and 2.3.5, so the v2.3.3 it landed on cleared the floor
# while still carrying the CVE. v2.3.5 is the fix on the line it actually
# reaches, and it is what the other eight FLOOR entries in this catalog already
# used.
#
# Wolfi is at 1.3.2.1_rc20260601-r0 and the advisory wants 1.3.3-r0, which
# upstream madler/zlib has never tagged. Downgrading to Wolfi's 1.3.1-r51 is not
# a way out: it predates the 1.3.2-r0 fix for CVE-2026-27171.
#
# Clear it with scripts/blocked.py --dispatch once 1.3.3-r0 lands.
# harbor-trivy-adapter: from-source; tagged at the Harbor release version.
# Each Harbor release pins a harbor-scanner-trivy (adapter) version and the
# Trivy CLI version to bundle (from the harbor Makefile TRIVYADAPTERVERSION /
# TRIVYVERSION):
#   2.13.5 -> scanner 0.35.1 + trivy 0.69.3
#   2.14.4 -> scanner 0.36.0 + trivy 0.70.0
#   2.15.2 -> scanner 0.38.0 + trivy 0.72.0
BLOCKED=1
FROM_SOURCE=1
VERSIONS=(2.15.2)
declare -A SCANNER=( [2.13.5]=0.35.1 [2.14.4]=0.36.0 [2.15.2]=0.38.0 )
declare -A SCANNER_SHA=(
  [0.35.1]=16045ee240fb414adf96139702310399bc30b415b118431a0a62a66237c869f4
  [0.36.0]=774b79f4dd98d38cfc5125b9aa03223d3d57d10c77a01da74913846ccc35ceac
  [0.38.0]=0fd3eb5eca48c0e8cd32339720deab46a2abccff17e7894f9253fe5faf82f0a5
)
declare -A TRIVY=( [2.13.5]=0.69.3 [2.14.4]=0.70.0 [2.15.2]=0.72.0 )
declare -A TRIVY_SHA=(
  [0.69.3]=3ca5fa62932273dd7eef3b6ec762625da42304ebb8f13e4be9fdd61545ca1773
  [0.70.0]=ff9ac06468aab89802388f16d1d179f4680db714afbf6a8132a417d288aa008e
  [0.72.0]=2c6e0e5a4b1b08241aab8e379155dfb31855a50cb1d04fa790039cf3010477cf
)
render() {
  local s="${SCANNER[$1]}" t="${TRIVY[$1]}"
  echo "s/__VER__/$1/g; s/__SCANNER__/${s}/g; s/__SCANNER_SHA__/${SCANNER_SHA[$s]}/g; s/__TRIVY__/${t}/g; s/__TRIVY_SHA__/${TRIVY_SHA[$t]}/g"
}
