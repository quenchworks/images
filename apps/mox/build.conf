# mox: a modern full-featured mail server (SMTP with SPF/DKIM/DMARC/MTA-STS, IMAP4,
# webmail, admin and account web UIs, ACME) from the release tag, one CGO-free Go binary.
#
# 0-CVE: go.mod carries x/crypto v0.55.0, x/net v0.58.0 and protobuf v1.31.0 (CVE-2024-24786);
# melange.yaml raises the house golang.org/x floor and protobuf v1.36.12, and builds with
# Wolfi's go-1.27 for the stdlib findings of go 1.25.0.
#
# NEWEST-ONLY: mox ships one line.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(0.0.17)
# sha256 of the GitHub source tarball, from a download
declare -A SHA256=(
  [0.0.17]=22f0d7deeaef6e8bae21f98e37ebcff7d18499591638b89eff484eb7fd06ea37
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
