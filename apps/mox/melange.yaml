# mox from the release tag, CGO-free, with the dependency floors, the version stamped, and a
# patch that lets mox serve start directly as an unprivileged user.
package:
  name: quench-mox
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened mox mail server, built from source on Wolfi"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - busybox            # the chart's init container writes and copies the config
      - ca-certificates-bundle
      - tzdata

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27
      - python-3.14        # applies the nonroot patch to serve_unix.go

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/mjl-/mox/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - runs: |
      set -eu
      export CGO_ENABLED=0 GOTOOLCHAIN=local GOFLAGS=-mod=mod
      # vendor/ is regenerated by the module graph below; build from the module cache instead
      rm -rf vendor
      # mox reads its version from the build info, which a source tarball leaves "(devel)"
      sed -i -e 's|^\tVersion = "(devel)"$|\tVersion = "v${{package.version}}"|' \
             -e 's|^\tVersionBare = "(devel)"$|\tVersionBare = "v${{package.version}}"|' \
             -e 's|^\tbuildInfo, ok := debug.ReadBuildInfo()$|\tbuildInfo, ok := debug.ReadBuildInfo()\n\tok = ok \&\& buildInfo.Main.Version != "(devel)"|' moxvar/version.go
      grep -q 'Version = "v${{package.version}}"' moxvar/version.go
      # mox serve insists on starting as root, binding the sockets and dropping to its User. Started
      # directly as an unprivileged user (no $MOX_SOCKETS from a root parent), bind and open files in
      # the same process instead, as `mox localserve` does (FilesImmediate). The root path is unchanged.
      python3 - <<'EOP'
      p = 'serve_unix.go'
      s = open(p).read()
      old = "\t} else {\n\t\tmox.RestorePassedFiles()\n"
      assert old in s, "serve_unix.go moved: re-check the nonroot patch"
      s = s.replace(old, "\t} else if os.Getenv(\"MOX_SOCKETS\") != \"\" {\n\t\tmox.RestorePassedFiles()\n", 1)
      tail = "\t\t\tslog.Any(\"pid\", os.Getpid()))\n\t}\n\n\tsyscall.Umask"
      assert s.count(tail) == 1, "serve_unix.go moved: re-check the nonroot patch"
      s = s.replace(tail, "\t\t\tslog.Any(\"pid\", os.Getpid()))\n\t} else {\n\t\tmox.FilesImmediate = true\n\t\tmox.MustLoadConfig(true, checkACMEHosts)\n\t\tlog.Print(\"starting directly as unprivileged user, no privilege drop\", slog.Any(\"uid\", os.Getuid()), slog.Any(\"pid\", os.Getpid()))\n\t}\n\n\tsyscall.Umask", 1)
      open(p, 'w').write(s)
      EOP
      grep -q 'mox.FilesImmediate = true' serve_unix.go
      # floors, raised only when below (a bare go get downgrades once upstream passes it); the
      # golang.org/x set moves together, as in the other recipes. protobuf: CVE-2024-24786.
      FLOOR="golang.org/x/crypto@v0.58.1-0.20261009181718-2f1f834330b2 golang.org/x/net@v0.62.0 golang.org/x/text@v0.43.0 golang.org/x/sys@v0.49.0 google.golang.org/protobuf@v1.36.12"
      need=""
      for f in $FLOOR; do
        have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${f%@*}")"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        [ "$(printf '%s\n%s\n' "$have" "${f#*@}" | sort -V | head -1)" = "${f#*@}" ] || need="$need $f"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || go get $need
      go mod tidy
      go build -trimpath -ldflags "-s -w" -o "${{targets.destdir}}/usr/bin/mox" .
      "${{targets.destdir}}/usr/bin/mox" version > /tmp/v.txt
      grep -F "v${{package.version}}" /tmp/v.txt

test:
  pipeline:
    - runs: |
        mox version
