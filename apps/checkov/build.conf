# checkov: Checkov, the static analysis scanner for infrastructure as code (Terraform,
# CloudFormation, Kubernetes, Helm, Dockerfile, GitHub Actions and more), from PyPI into
# a Python 3.13 venv on Wolfi. Image only, no chart.
#
# Why not Wolfi's checkov apk: it is 3.2.495, far behind PyPI's 3.3.x.
#
# 0-CVE: checkov pins asteval==1.0.6 (fixed in 1.0.9). The venv installs 1.0.9 over the
# pin; asteval is what renders Terraform variables, and the boot test checks that a
# result flips with a variable's value on 1.0.9.
#
# NEWEST-ONLY: Checkov releases several times a week; the image tracks the newest.
BLOCKED=0
FROM_SOURCE=0
VERSIONS=(3.3.19)
render() { echo "s/__VER__/$1/g"; }
