# Packages Checkov into a self-contained venv at /opt/checkov/venv.
package:
  name: quench-checkov
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Checkov infrastructure-as-code scanner, packaged on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - python-3.13            # the venv references the system interpreter
      - ca-certificates-bundle
      - glibc
      - libstdc++
      - tzdata
      - git                    # checkov clones remote modules and reads repo metadata

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - python-3.13
      - py3.13-pip
      - build-base             # fallback for any transitive dep without a wheel

pipeline:
  - runs: |
      set -eu
      VER="${{package.version}}"
      dest="${{targets.destdir}}"
      VENV=/opt/checkov/venv
      python3.13 -m venv "$VENV"
      "$VENV/bin/pip" install --no-cache-dir --upgrade pip
      "$VENV/bin/pip" install --no-cache-dir "checkov==${VER}"
      # 0-CVE: checkov pins asteval==1.0.6; 1.0.9 is the fix (see build.conf)
      "$VENV/bin/pip" install --no-cache-dir --no-deps "asteval==1.0.9"
      "$VENV/bin/python" -c "import importlib.metadata as m, sys; v = m.version('checkov'); assert v == sys.argv[1], v; a = m.version('asteval'); assert a == '1.0.9', a; print('checkov', v, 'asteval', a)" "${VER}"
      "$VENV/bin/pip" uninstall -y pip
      install -d "${dest}/opt/checkov"
      cp -a "$VENV" "${dest}/opt/checkov/venv"
      install -d "${dest}/usr/bin"
      ln -sf /opt/checkov/venv/bin/checkov "${dest}/usr/bin/checkov"
      chmod -R a+rX "${dest}/opt/checkov"

test:
  pipeline:
    - runs: |
        /opt/checkov/venv/bin/checkov --version
