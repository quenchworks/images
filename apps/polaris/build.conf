# polaris (Fairwinds Polaris): from-source via melange (Go build from the git tag tarball).
# Newest patch of the last 3 minor lines. Tags drop the v prefix before 10.2 (10.1.8,
# 10.0.0) and carry it from 10.2.0, so the fetch uses TAG. Single static Go binary,
# no CGO; dashboard templates, assets and checks are embedded with go:embed.
FROM_SOURCE=1
VERSIONS=(10.0.0 10.1.8 10.2.5)
declare -A SHA256=(
  [10.0.0]=b5ee1a9f31c11c44a11364d838f14c661c1af1c188c78ca431b66e5533df3aff
  [10.1.8]=d141addc407163aeaa09239b5bf1a93beccaee58fb339c7ff24e4ad3e75a547d
  [10.2.5]=a11095274e919643a0589080f99dcecd8f38d76306a87b803feebd7bb3ff9471
)
declare -A TAG=(
  [10.0.0]=10.0.0
  [10.1.8]=10.1.8
  [10.2.5]=v10.2.5
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g; s|__TAG__|${TAG[$1]}|g"; }
