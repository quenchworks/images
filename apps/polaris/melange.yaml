# Builds Fairwinds Polaris from source onto Wolfi. Single static Go binary, no CGO.
# main.go is at the repo root; goreleaser stamps main.Version and main.Commit with -X.
# The dashboard templates, assets and the built-in checks are embedded with go:embed.
package:
  name: quench-polaris
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Fairwinds Polaris, built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-1.27

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/FairwindsOps/polaris/archive/refs/tags/__TAG__.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      set -eu
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      export GOTOOLCHAIN=local
      # 0-CVE FLOORS, not pins (docs/go-module-float.md): raise a module only where go.mod
      # has it below the floor; a module absent from the graph is skipped. Every line raises
      # x/net and x/text (10.0/10.1 also x/sys); go.mod has no replaces.
      FLOOR="golang.org/x/net@v0.58.0 golang.org/x/text@v0.41.0 golang.org/x/sys@v0.47.0 golang.org/x/crypto@v0.56.0 golang.org/x/oauth2@v0.36.0 google.golang.org/grpc@v1.83.2"
      need=""
      for mv in $FLOOR; do
        have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${mv%@*}" 2>/dev/null)"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        [ "$(printf '%s\n%s\n' "$have" "${mv#*@}" | sort -V | head -1)" = "${mv#*@}" ] || need="$need $mv"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || go get $need
      go mod tidy
      go build -trimpath \
        -ldflags "-s -w -X main.Version=${{package.version}} -X main.Commit=__TAG__" \
        -o "${{targets.destdir}}/usr/bin/polaris" .
