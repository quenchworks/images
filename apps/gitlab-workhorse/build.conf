# gitlab-workhorse: GitLab Workhorse, the smart reverse proxy in front of the GitLab Rails app (Git
# over HTTP, uploads, downloads, artifacts, image resizing), from the workhorse/ directory of the MIT
# gitlab-foss source. Part of the GitLab CE build (images issue #20); its version is the GitLab version.
#
# Measured 2026-11-15 on 19.5.5: 22 fixable findings in workhorse/go.mod; with the floors in melange.yaml
# all four binaries scan at 0 (prometheus/prometheus v0.54 is in go.mod but not linked).
FROM_SOURCE=1
VERSIONS=(19.6.0)
declare -A SHA256=(
  [19.6.0]=ed5202de0b60bdbe375d7b9b48064a3080fcae39fd767e72fede59669a4285d5
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
