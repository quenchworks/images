# Hugo (gohugoio/hugo, Apache-2.0): the static site generator. Image only, no chart (a CLI for site
# builds in CI; `hugo server --bind 0.0.0.0` serves previews on 1313). Images issue #66.
#
# Pure Go (CGO off, as upstream releases it: the cgo extended build was dropped in 0.170.0) with
# upstream's vendorInfo ldflag. git is in the image for enableGitInfo (Hugo runs `git log` itself, no
# shell). Wolfi has no dart-sass package, so Sass transpiling is not included. Floats: the house
# golang.org/x floor and the otel 1.47 train.
FROM_SOURCE=1
VERSIONS=(0.168.0 0.169.0 0.170.0)
declare -A SHA256=(
  [0.168.0]=45ba430ac86cfe8e5fb07b81eaef78769973af9b4d1c51f1d88195e0d438be3e
  [0.169.0]=47edb66f76f2c3653210bdac09883fa0a232eba2de43a0a6fdea9855e8e542d9
  [0.170.0]=dac429f01212d06979a1e939307f5bffdbfd3f75a63eba0fe3c817383d0525fe
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
