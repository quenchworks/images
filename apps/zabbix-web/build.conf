# zabbix-web: the Zabbix web frontend (ui/ of the same release tarball as zabbix-server).
# The newest patch of each supported line: 6.0 LTS, 7.0 LTS and 7.4. Release tarballs from
# https://cdn.zabbix.com/zabbix/sources/stable/<X.Y>/ ship a generated configure and the
# database schema (database/postgresql/{schema,images,data}.sql), each pinned by sha256.
FROM_SOURCE=1
VERSIONS=(6.0.48 7.0.31 7.4.15)
declare -A SHA256=(
  [6.0.48]=70889b062eced5ee582a3ce7a32962fe5abb817fd48683c473c2bc6b5903649c
  [7.0.31]=9df1069aa1cfdf67b7131e93f2f5fe6d0ad005e416c9902016fd8cb68f330e8c
  [7.4.15]=5e1d9b3747ebf9b81d5d62d8ce00ef9b3f7f4c081394ad11a2dd18897a24f394
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g; s/__LINE__/${1%.*}/g"; }
