# node-exporter: from-source via melange (Go build of prometheus/node_exporter,
# git-checkout pinned per release). Latest 3 stable minor lines, newest patch each.
# Image-only (no Helm chart). Each release pins its git commit (COMMIT map).
FROM_SOURCE=1
VERSIONS=(1.12.0)
declare -A COMMIT=(
  [1.12.0]=eb1711fa890acf69110c4b82930910ecd44113c5
)
render() { echo "s/__VER__/$1/g; s/__COMMIT__/${COMMIT[$1]}/g"; }
