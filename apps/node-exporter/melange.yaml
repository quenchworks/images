# Builds the Prometheus node_exporter from source onto Wolfi. One static Go
# binary, no CGO. Output is a signed APK in Quenchworks' own repo. No upstream
# distro binaries. Same Prometheus-family Go-from-source pattern as alertmanager
# / postgres-exporter.
#
# node_exporter exposes hardware/OS metrics from *NIX kernels. It reads the host
# /proc, /sys and root filesystem; in Kubernetes a DaemonSet bind-mounts those
# into the container. The IMAGE just ships the static binary (nonroot uid 1001,
# read-only rootfs friendly); the chart/DaemonSet supplies the host mounts.
package:
  name: quench-node-exporter
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Prometheus node_exporter (hardware/OS metrics), built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      # go.mod declares go 1.25; .promu.yml pins the build toolchain to 1.26. Use
      # go-1.26 (newest, clears stdlib CVE advisories) and GOTOOLCHAIN=local so
      # go.mod's 1.25 directive does not trigger a toolchain download.
      - go-1.26

pipeline:
  # git-checkout (not fetch) pinned to the release tag's commit: builds from the
  # verified git tag, avoiding the codeload CDN. Mirrors the alertmanager image.
  - uses: git-checkout
    with:
      repository: https://github.com/prometheus/node_exporter
      tag: v${{package.version}}
      expected-commit: __COMMIT__

  - name: Build node_exporter (static, CGO off)
    runs: |
      set -eu
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      export GOTOOLCHAIN=local      # use the installed go-1.26, do not fetch go.mod's 1.25
      export GO111MODULE=on

      # Bump the two transitive deps the comprehensive Trivy gate flags (minor,
      # same-major, API-compatible -- not a fork/force). node_exporter 1.11.1's
      # module graph resolves x/crypto to v0.49.0 and x/net to v0.52.0.
      #   x/crypto v0.52.0 clears the x/crypto/ssh + ssh/agent + ssh/knownhosts
      #     advisories (CVE-2026-39827..39835 / 42508 / 46595 / 46597 / 46598).
      #   x/net    v0.55.0 clears the x/net/html + idna + http2 advisories
      #     (CVE-2026-25680/25681/27136/33814/39821/42502/42506).
      # 0-CVE FLOORS, not pins (docs/go-module-float.md): raise a module only where go.mod has it
      # below the floor; a module absent from the graph is skipped. Bare `go get` pins downgraded
      # newer upstream releases (found 2026-10-05).
      FLOOR="golang.org/x/crypto@v0.56.0 golang.org/x/net@v0.58.0 golang.org/x/text@v0.41.0"
      # Go semver order (a release outranks its prereleases); busybox sort -V does not.
      vlt() { awk -v a="${1#v}" -v b="${2#v}" 'function pp(s,  p){sub(/\+.*/,"",s);p=index(s,"-");if(p){C=substr(s,1,p-1);P=substr(s,p+1)}else{C=s;P=""}} function cmp(x,y,  i,n,m,X,Y){n=split(x,X,".");m=split(y,Y,".");for(i=1;i<=n&&i<=m;i++){if(X[i]==Y[i])continue;if(X[i]~/^[0-9]+$/&&Y[i]~/^[0-9]+$/)return (X[i]+0<Y[i]+0)?-1:1;if(X[i]~/^[0-9]+$/)return -1;if(Y[i]~/^[0-9]+$/)return 1;return (X[i]<Y[i])?-1:1}return (n<m)?-1:(n>m)?1:0} BEGIN{pp(a);ca=C;pa=P;pp(b);cb=C;pb=P;c=cmp(ca,cb);if(c==0){if(pa==pb)c=0;else if(pa=="")c=1;else if(pb=="")c=-1;else c=cmp(pa,pb)}exit !(c<0)}'; }
      need=""
      for mv in $FLOOR; do
        have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${mv%@*}" 2>/dev/null)"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        vlt "$have" "${mv#*@}" && need="$need $mv"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || go get $need
      go mod tidy

      REVISION="$(git rev-parse HEAD)"
      DATE="$(date -u +'%Y%m%d-%H:%M:%S')"
      VERPKG="github.com/prometheus/common/version"
      # Mirror upstream/promu version stamping so `node_exporter --version`,
      # the /metrics build_info and node_exporter_build_info report v1.11.1.
      LDFLAGS="-s -w \
        -X ${VERPKG}.Version=${{package.version}} \
        -X ${VERPKG}.Revision=${REVISION} \
        -X ${VERPKG}.Branch=HEAD \
        -X ${VERPKG}.BuildUser=quenchworks \
        -X ${VERPKG}.BuildDate=${DATE}"

      # netgo: pure-Go resolver (no libc dependency, matches upstream's static
      # build, which sets the netgo tag in .promu.yml). main package is at root.
      go build -trimpath -tags "netgo" -ldflags "${LDFLAGS}" \
        -o "${{targets.destdir}}/usr/bin/node_exporter" .

  # The exporter user is provided by apko (accounts), not the package, to avoid
  # conflicting with wolfi-baselayout's /etc files.

test:
  pipeline:
    - runs: node_exporter --version
