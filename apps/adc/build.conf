# adc (api7/adc -- "API Declarative CLI"): the SIDECAR of the APISIX Ingress
# Controller, NOT a Go binary. Despite the per-OS/arch release tarballs it looks
# like a Go project from the outside, upstream is a pnpm + nx TypeScript monorepo
# (apps/cli + libs/*): `nx build cli` esbuild-bundles everything -- third-party
# deps included -- into ONE self-contained CommonJS file, dist/apps/cli/main.cjs.
# The release tarballs are Node SEA (Single Executable Application) blobs: the
# same main.cjs postject'd into a node binary DOWNLOADED FROM nodejs.org
# (apps/cli/scripts/download-node.ts). We do not ship those -- they embed an
# unpatched upstream Node we do not control, which is both a clean-room and a
# 0-CVE problem. Upstream's OWN container image does not use the SEA either
# (libs/tools/src/docker/Dockerfile: `COPY main.cjs` + `ENTRYPOINT node main.cjs`),
# so building the bundle and running it on Wolfi's nodejs-24 IS the upstream
# container recipe, just with a hardened interpreter.
#
# WHY THIS IMAGE EXISTS
# apisix-ingress-controller 2.2.0 CANNOT RUN WITHOUT IT. Upstream's Deployment
# (config/manager/manager.yaml at tag 2.2.0) is a TWO-container pod: `manager`
# plus an `adc-server` sidecar (ghcr.io/api7/adc), talking HTTP over a shared
# Unix socket. The controller drives it from internal/adc/client; it does not
# embed adc.
#
# VERSION COUPLING -- read before bumping (wave cross-cutting decision 4).
# We ship 0.27.1 because that is the EXACT version apisix-ingress-controller
# 2.2.0 pins: Makefile at tag 2.2.0 line 32, `ADC_VERSION ?= 0.27.1`, used for
# both `kustomize edit set image ... sidecar=ghcr.io/api7/adc:$(ADC_VERSION)` and
# `kind-load-adc-image`. Upstream adc's newest is 0.29.0, and we deliberately do
# NOT ship it:
#   * the wire contract MOVED. apps/cli/src/server/{sync,validate,schema}.ts all
#     differ between v0.27.1 and v0.29.0 (0.29.0 also adds an agent-pool), and
#     the request body is zod-validated -- a controller/sidecar mismatch fails at
#     request time, inside a running pod, not at install time.
#   * 0.29.0 declares packageManager pnpm@11.20.0; Wolfi's newest pnpm apk is
#     11.8.0 (pnpm-11.8), which is exactly what 0.27.1 pins. Building 0.29.0
#     would mean fetching a pnpm outside Wolfi.
# So: bump this ONLY together with apps/apisix-ingress-controller, and take the
# new version from that release's Makefile ADC_VERSION -- never from api7/adc's
# tag list. scripts/check/adc.py encodes exactly that and will not report a
# standalone adc release as an update.
#
# NEWEST-COUPLED-ONLY (n=1). Extra versions would be dead weight: the only
# consumer is the apisix-ingress-controller chart, which pins one digest.
#
# sha256 is of the GitHub source archive for the tag, computed from the fetched
# tarball (266157 bytes). Tags carry a `v` prefix (v0.27.1) and are LIGHTWEIGHT
# (`git ls-remote refs/tags/v0.27.1^{}` returns nothing), so the tag sha IS the
# commit: b8841057f455a539b8c90702ade4b1f9f949acd4. No commit stamping is needed
# or possible -- adc hardcodes its version in the source
# (apps/cli/src/command/index.ts: `const versionCode = '0.27.1'`), verified to
# match the tag, so `adc -v` reports 0.27.1 with no ldflag equivalent.
# 0-CVE NOTE: Trivy is STRUCTURALLY BLIND to this app. Every dependency is
# esbuild-inlined into one main.cjs, so the image ships no package.json and no
# node_modules and the scan finds zero JS packages regardless of what is inside
# the bundle. melange.yaml therefore runs `pnpm audit --prod` as the real CVE
# gate, floats the three flagged prod deps (js-yaml, fast-uri, brace-expansion),
# and de-vendors glob -- whose default export is a PREBUNDLED index.min.js with a
# vulnerable brace-expansion inlined, invisible to both Trivy and pnpm audit.
# Read melange.yaml's header before touching any of that.
FROM_SOURCE=1
VERSIONS=(0.27.1)
declare -A SHA256=(
  [0.27.1]=524eae5c67f19301e23d74fc0602c4ab39d05a6c830a26186f457fcbe797be15
)
# The apisix-ingress-controller release this sidecar is paired with. The checker
# reads this release's Makefile ADC_VERSION and asserts it equals VERSIONS[-1].
PAIRED_CONTROLLER=2.2.0
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
