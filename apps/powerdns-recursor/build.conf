# powerdns-recursor: PowerDNS Recursor, the caching resolver, built FROM SOURCE
# from the release tarballs on downloads.powerdns.com.
#
# Why not Wolfi's pdns-<line>-recursor apks: they lag upstream (checked
# 2026-09-27: Wolfi 5.4.2, upstream 5.4.6). The tarball does not vendor the
# Rust crates of rec-rust-lib, so cargo fetches them at build time, pinned by
# the shipped Cargo.lock.
#
# WINDOW: 5.3 and 5.4, the two lines upstream still patches.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(5.3.13 5.4.8)
declare -A SHA256=(
  [5.3.13]=230f2f36a11504cc552ba4e68c29c2aaa01a60365d9658d6150c39f1eaec0a99
  [5.4.8]=bb2fac755c3c301b6e1b9892e94ccdc652752f2bf88ec970e9358056973fe9bd
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
