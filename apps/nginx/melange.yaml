# Builds nginx from source onto Wolfi. Output is a signed APK in Quenchworks' own
# repo. No upstream distro binaries. Configured for a nonroot (uid 1001),
# read-only-rootfs runtime: listens on 8080/8443 (nonroot can't bind <1024), writes
# its pid and all temp paths under /tmp, and logs to stdout/stderr. This mirrors the
# official nginx-unprivileged approach.
package:
  name: quench-nginx
  version: 1.30.2
  epoch: 0
  description: "Quenchworks hardened nginx, built from source on Wolfi (nonroot, read-only rootfs)"
  copyright:
    - license: BSD-2-Clause
  dependencies:
    runtime:
      - ca-certificates-bundle
      - pcre2
      - zlib
      - openssl
      - busybox

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - pcre2-dev
      - zlib-dev
      - openssl-dev
      - linux-headers
      - pkgconf

pipeline:
  - uses: fetch
    with:
      # Official nginx.org release tarball. sha256 computed and verified locally; nginx
      # publishes a detached .asc signature alongside it.
      uri: https://nginx.org/download/nginx-${{package.version}}.tar.gz
      expected-sha256: "7df3090907fca3cc0e456d6dc00ceb230da74ea88026ceff0affc29dbbd9ac4c"
  - runs: |
      # Lean, 0-CVE-friendly module set. Paths chosen for the nonroot/read-only layout:
      #  - sbin/conf/modules under standard FHS locations (read-only at runtime)
      #  - pid + all *_temp_path default under /tmp (writable tmpfs at runtime); the
      #    shipped nginx.conf also sets these explicitly.
      # ssl, http/2, realip, gzip_static, stub_status and threads are enabled; the
      # mail and stream proxy modules are intentionally omitted to keep the surface lean.
      ./configure \
        --prefix=/etc/nginx \
        --sbin-path=/usr/bin/nginx \
        --modules-path=/usr/lib/nginx/modules \
        --conf-path=/etc/nginx/nginx.conf \
        --error-log-path=/dev/stderr \
        --http-log-path=/dev/stdout \
        --pid-path=/tmp/nginx.pid \
        --lock-path=/tmp/nginx.lock \
        --http-client-body-temp-path=/tmp/client_body_temp \
        --http-proxy-temp-path=/tmp/proxy_temp \
        --http-fastcgi-temp-path=/tmp/fastcgi_temp \
        --http-uwsgi-temp-path=/tmp/uwsgi_temp \
        --http-scgi-temp-path=/tmp/scgi_temp \
        --with-http_ssl_module \
        --with-http_v2_module \
        --with-http_realip_module \
        --with-http_gzip_static_module \
        --with-http_stub_status_module \
        --with-threads \
        --with-pcre \
        --with-compat
      make -j"$(nproc)"
      make DESTDIR="${{targets.destdir}}" install

      # nginx's `make install` also drops sample configs and an html docroot under
      # /etc/nginx and /etc/nginx/html. Replace the default nginx.conf with a
      # nonroot/read-only-rootfs config and relocate the docroot to the conventional
      # /usr/share/nginx/html so the chart can mount user content there.
      destdir="${{targets.destdir}}"

      # Default document root (shipped read-only; chart can mount over it).
      install -d "$destdir/usr/share/nginx/html"
      if [ -d "$destdir/etc/nginx/html" ]; then
        cp -a "$destdir/etc/nginx/html/." "$destdir/usr/share/nginx/html/"
        rm -rf "$destdir/etc/nginx/html"
      fi

      # A clean Quenchworks default index page.
      cat > "$destdir/usr/share/nginx/html/index.html" <<'EOF'
      <!DOCTYPE html>
      <html>
      <head><title>Quenchworks nginx</title></head>
      <body>
      <h1>Quenchworks nginx</h1>
      <p>Hardened, nonroot, read-only-rootfs nginx is running.</p>
      </body>
      </html>
      EOF

      # conf.d directory for drop-in server blocks (chart mounts ConfigMaps here).
      install -d "$destdir/etc/nginx/conf.d"

      # The nonroot / read-only-rootfs main config: foreground (daemon off), no `user`
      # directive (we already run as uid 1001), pid + temp under /tmp, logs to
      # stdout/stderr, default server on 8080 with /stub_status. TLS server on 8443 is
      # left to the chart (needs mounted certs) but the listen port is documented.
      cat > "$destdir/etc/nginx/nginx.conf" <<'EOF'
      # Quenchworks hardened nginx default config.
      # Nonroot (uid 1001) + read-only rootfs: runs in the foreground, writes pid and
      # all temp paths under /tmp (mount a writable tmpfs there), logs to stdout/stderr.
      worker_processes auto;
      pid /tmp/nginx.pid;
      error_log /dev/stderr notice;

      events {
          worker_connections 1024;
      }

      http {
          include       mime.types;
          default_type  application/octet-stream;

          # All temp paths under /tmp (writable tmpfs on a read-only rootfs).
          client_body_temp_path /tmp/client_body_temp;
          proxy_temp_path       /tmp/proxy_temp;
          fastcgi_temp_path     /tmp/fastcgi_temp;
          uwsgi_temp_path       /tmp/uwsgi_temp;
          scgi_temp_path        /tmp/scgi_temp;

          access_log /dev/stdout;

          sendfile      on;
          tcp_nopush    on;
          keepalive_timeout 65;
          gzip          on;
          server_tokens off;

          server {
              listen      8080;
              server_name _;

              location / {
                  root  /usr/share/nginx/html;
                  index index.html index.htm;
              }

              # Lightweight liveness/readiness endpoint.
              location /stub_status {
                  stub_status;
              }

              error_page 500 502 503 504 /50x.html;
              location = /50x.html {
                  root /usr/share/nginx/html;
              }
          }

          # Drop-in server blocks (the chart mounts ConfigMaps into /etc/nginx/conf.d).
          include /etc/nginx/conf.d/*.conf;
      }
      EOF

      # daemon off is enforced by the entrypoint's `-g 'daemon off;'`, so the config
      # itself stays free of it (keeps `nginx -t` clean when run ad hoc).

      # Thin entrypoint: exec nginx in the foreground. Extra args/flags pass through.
      install -d "$destdir/usr/bin"
      cat > "$destdir/usr/bin/docker-entrypoint.sh" <<'EOF'
      #!/bin/sh
      set -eu
      # Foreground (daemon off) so nginx is PID 1 and logs to stdout/stderr. Any args
      # passed to the container are forwarded to nginx.
      if [ "${1:-}" = "nginx" ]; then
          shift
      fi
      exec nginx -g 'daemon off;' "$@"
      EOF
      chmod 0755 "$destdir/usr/bin/docker-entrypoint.sh"

test:
  pipeline:
    - runs: |
        nginx -v
        nginx -t -c /etc/nginx/nginx.conf
