# Assembles the nginx runtime image from our own package plus the Wolfi base.
# No Dockerfile. Minimal, nonroot (uid 1001), multi-arch, SBOM generated by apko.
# Mirrors the official nginx-unprivileged design: listens on 8080 (http) / 8443 (https),
# writes its pid and all temp paths under /tmp, logs to stdout/stderr. Runs on a
# read-only rootfs when /tmp is a writable tmpfs (mode=1777).
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-nginx@local

accounts:
  groups:
    - groupname: nginx
      gid: 1001
  users:
    - username: nginx
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/bin/docker-entrypoint.sh

# The default config writes pid + all temp paths under /tmp; mount it writable
# (tmpfs, mode=1777) at runtime. The doc root and /etc/nginx are shipped read-only;
# the chart can mount custom config into /etc/nginx/conf.d (or replace nginx.conf)
# and user content into /usr/share/nginx/html.
work-dir: /usr/share/nginx/html

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-nginx"
  org.opencontainers.image.licenses: "BSD-2-Clause"
