# nginx: from-source via melange (autoconf ./configure && make). Latest 3 stable
# lines, newest patch each (nginx even-minor = stable: 1.26, 1.28, 1.30; 1.31 is
# mainline). Each release pins its source tarball by sha256. The newest version
# (VERSIONS[-1]) is also what harbor-portal/coolify-app prebuild as quench-nginx.
FROM_SOURCE=1
VERSIONS=(1.26.3 1.28.3 1.30.4)
declare -A SHA256=(
  [1.26.3]=69ee2b237744036e61d24b836668aad3040dda461fe6f570f1787eab570c75aa
  [1.28.3]=2c96a946bfb0882a21744ed429770a2123ae1828c7c48665092993ddee91a918
  [1.30.4]=4261dc90e9e47c1c4041276e9aaa3d48ebe2e664f728e14fa95ae6c67d57a08b
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
