# Runtime image for the Kubeflow Pipelines apiserver binary: nonroot uid 1001, no shell.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-kfp-api-server@local

accounts:
  groups:
    - groupname: kfp
      gid: 1001
  users:
    - username: kfp
      uid: 1001
      gid: 1001
  run-as: 1001

environment:
  TAG_NAME: __VER__

entrypoint:
  command: /usr/bin/apiserver --config=/config -logtostderr=true

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-kfp-api-server"
  org.opencontainers.image.licenses: "Apache-2.0"
