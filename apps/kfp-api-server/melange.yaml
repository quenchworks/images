# Builds the Kubeflow Pipelines apiserver binary (backend/src/apiserver) from the kubeflow/pipelines
# release tag onto Wolfi. The API server (REST 8888, gRPC 8887) that stores pipelines, runs and experiments in MySQL and compiles runs to Argo Workflows.
# CGO on for mattn/go-sqlite3, built with -tags libsqlite3 so it links Wolfi's libsqlite3
# instead of compiling the amalgamation it vendors (a C copy the scanner cannot see).
# The floor pass raises only modules below the floor (docs/go-module-float.md), and
# the shipped binary is asserted against the same floors afterwards.
package:
  name: quench-kfp-api-server
  version: __VER__
  epoch: 0
  description: "Quenchworks Kubeflow Pipelines API server, built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - sqlite-libs

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-1.26
      - sqlite-dev           # go-sqlite3 links the system library (-tags libsqlite3)

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/kubeflow/pipelines/archive/refs/tags/${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      set -eu
      export CGO_ENABLED=1 GOFLAGS=-mod=mod GOTOOLCHAIN=local GOWORK=off
      # Measured 2026-10-20 on 2.17.2 (trivy rootfs, comprehensive): argo-workflows/v4 4.0.5,
      # cel-go 0.27.0, otel/sdk 1.43.0, x/crypto 0.52.0, x/net 0.55.0, x/text 0.37.0 and
      # grpc 1.80.0 carry fixable advisories. argo 4.0.13 (our argo-workflows line) requires
      # cel-go 0.30.0, so that is the cel-go floor; the otel 1.x series and its prometheus
      # exporter (0.67.0 pairs with 1.45.0) move as one set.
      FLOOR="golang.org/x/crypto@v0.57.0 golang.org/x/net@v0.60.0 golang.org/x/text@v0.42.0 golang.org/x/sys@v0.48.0 golang.org/x/mod@v0.41.0 google.golang.org/grpc@v1.83.2 github.com/google/cel-go@v0.30.0 github.com/argoproj/argo-workflows/v4@v4.0.13 go.opentelemetry.io/otel@v1.45.0 go.opentelemetry.io/otel/sdk@v1.45.0 go.opentelemetry.io/otel/sdk/metric@v1.45.0 go.opentelemetry.io/otel/trace@v1.45.0 go.opentelemetry.io/otel/metric@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlpmetric/otlpmetricgrpc@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlpmetric/otlpmetrichttp@v1.45.0 go.opentelemetry.io/otel/exporters/prometheus@v0.67.0 github.com/klauspost/compress@v1.18.7"
      # Go semver order (a release outranks its prereleases); busybox sort -V does not.
      vlt() { awk -v a="${1#v}" -v b="${2#v}" 'function pp(s,  p){sub(/\+.*/,"",s);p=index(s,"-");if(p){C=substr(s,1,p-1);P=substr(s,p+1)}else{C=s;P=""}} function cmp(x,y,  i,n,m,X,Y){n=split(x,X,".");m=split(y,Y,".");for(i=1;i<=n&&i<=m;i++){if(X[i]==Y[i])continue;if(X[i]~/^[0-9]+$/&&Y[i]~/^[0-9]+$/)return (X[i]+0<Y[i]+0)?-1:1;if(X[i]~/^[0-9]+$/)return -1;if(Y[i]~/^[0-9]+$/)return 1;return (X[i]<Y[i])?-1:1}return (n<m)?-1:(n>m)?1:0} BEGIN{pp(a);ca=C;pa=P;pp(b);cb=C;pb=P;c=cmp(ca,cb);if(c==0){if(pa==pb)c=0;else if(pa=="")c=1;else if(pb=="")c=-1;else c=cmp(pa,pb)}exit !(c<0)}'; }
      need=""
      for mv in $FLOOR; do
        have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${mv%@*}" 2>/dev/null)"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        vlt "$have" "${mv#*@}" && need="$need $mv"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || go get $need
      go mod tidy
      B="${{targets.destdir}}/usr/bin"
      mkdir -p "$B"
      go build -buildvcs=false -trimpath -tags libsqlite3 -ldflags "-s -w" -o "$B/apiserver" ./backend/src/apiserver
      # The floors must reach the binary: every dep (and any => replacement) at or above its floor.
      bad=""
      for mv in $FLOOR; do
        for v in $(go version -m "$B/apiserver" | awk -v m="${mv%@*}" '($1 == "dep" || $1 == "=>") && $2 == m { print $3 }'); do
          vlt "$v" "${mv#*@}" && bad="$bad ${mv%@*}@$v"
        done
      done
      [ -z "$bad" ] || { echo "FATAL: apiserver links modules below the floor:$bad"; exit 1; }
      # The server reads <--config>/config.json at start. Samples are not shipped: upstream compiles
      # them with the Python SDK at image build, and without --sampleconfig the server skips them.
      install -D -m 0644 backend/src/apiserver/config/config.json "${{targets.destdir}}/config/config.json"
