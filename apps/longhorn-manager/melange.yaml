# Builds longhorn-manager from the release tag tarball, as upstream's scripts/build.
package:
  name: quench-longhorn-manager
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Longhorn manager, built from source"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - bash
      - bind-tools
      - ca-certificates-bundle
      - cifs-utils
      - e2fsprogs
      - iproute2
      - iputils
      - kmod
      - mount
      - nfs-utils
      - smartmontools
      - umount
      - unzip
      - util-linux-misc   # nsenter, used by nsmounter
      - xfsprogs
      - zip

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - go

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/longhorn/longhorn-manager/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      set -eu
      export CGO_ENABLED=0 GOTOOLCHAIN=local
      # 0-CVE floors (docs/go-module-float.md), raised only where go.mod is below them; a
      # module absent from the graph is skipped. 1.11/1.12 link x/crypto 0.53-0.54
      # (CVE-2026-56854), x/mod 0.36-0.37 (CVE-2026-56864), x/text 0.38 (CVE-2026-56852),
      # grpc 1.79-1.83.0 (CVE-2026-84304). 1.13.0 already clears all of them.
      FLOOR="golang.org/x/crypto@v0.56.0 golang.org/x/mod@v0.40.0 golang.org/x/net@v0.58.0 golang.org/x/text@v0.41.0 google.golang.org/grpc@v1.83.2"
      need=""
      for mv in $FLOOR; do
        have="$(GOFLAGS=-mod=mod go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${mv%@*}" 2>/dev/null)"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        [ "$(printf '%s\n%s\n' "$have" "${mv#*@}" | sort -V | head -1)" = "${mv#*@}" ] || need="$need $mv"
      done
      echo "raising:${need:- nothing}"
      if [ -n "$need" ]; then
        GOFLAGS=-mod=mod go get $need
        GOFLAGS=-mod=mod go mod tidy
        GOFLAGS=-mod=mod go mod vendor
      fi
      d="${{targets.destdir}}/usr/local/sbin"
      install -d "$d"
      go build -trimpath -ldflags "-s -w -X github.com/longhorn/longhorn-manager/meta.Version=v${{package.version}}" \
        -o "$d/longhorn-manager" .
      install -m755 package/launch-manager package/nsmounter "$d/"
      grep -aq "v${{package.version}}" "$d/longhorn-manager"

test:
  pipeline:
    - runs: |
        set -eu
        /usr/local/sbin/longhorn-manager --version | grep -q "v${{package.version}}"
        for t in nsenter mount umount mkfs.ext4 mkfs.xfs mount.nfs; do command -v $t; done
