# longhorn-manager (longhorn/longhorn-manager): the Longhorn control plane DaemonSet, a
# drop-in for upstream's Longhorn chart. From source, static Go (CGO off), version stamped
# via meta.Version as upstream's scripts/build. Upstream's layout is kept: binaries and the
# launch-manager and nsmounter scripts in /usr/local/sbin, root by default (the chart runs
# it privileged and it mounts host paths), and the host tools its Dockerfile installs.
# Latest patch of the last 3 minor lines.
FROM_SOURCE=1
VERSIONS=(1.11.3 1.12.1 1.13.0)
declare -A SHA256=(
  [1.11.3]=91ddecf9bf3d1f541cc0520203a465d7652df632e0549c4b74f646657fde9fc6
  [1.12.1]=591b82a204917b46726af6cdf9b791c10b74754428ecd1d56901cde7d502c53e
  [1.13.0]=b98b0e11493ecbaffede046813609dea59afe93e6a63d73329104c566478b64a
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
