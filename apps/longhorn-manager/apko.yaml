# Assembles the longhorn-manager image. Root by default like upstream's image: the chart
# runs it privileged, launch-manager rbinds /host/dev and the manager mounts host paths.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-longhorn-manager@local

accounts:
  groups:
    - groupname: longhorn
      gid: 1001
  users:
    - username: longhorn
      uid: 1001
      gid: 1001
  run-as: 0

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

# No ENTRYPOINT, only CMD, as upstream: the Longhorn chart runs this image with args alone
# (the CSI plugin passes `longhorn-manager -d csi ...`), which must replace the CMD.
cmd: /usr/local/sbin/launch-manager

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-longhorn-manager"
  org.opencontainers.image.licenses: "Apache-2.0"
