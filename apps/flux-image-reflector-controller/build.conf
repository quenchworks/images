# flux-image-reflector-controller: Flux's image-reflector-controller, from source via melange (Go build of main.go from the git tag
# tarball). Static Go binary, no CGO. Flux ships one version of each controller per
# Flux release, so this tracks the latest only. The binary carries no version stamp.
FROM_SOURCE=1
VERSIONS=(1.2.5 1.3.0)
declare -A SHA256=(
  [1.2.5]=bd203834a3026239cd7ab01d0d823e4c9db2b7230f36ae4a4cb3cd9d09957b61
  [1.3.0]=1415278c93453d772bdb947f2cdc08fbc5a0531065856636c0ae2db5eb12212f
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
