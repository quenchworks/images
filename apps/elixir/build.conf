# STATUS: UNBLOCKED 2026-09-20. The zlib block is gone: Wolfi shipped the fix
# for CVE-2026-85091 as zlib 1.3.2.1_rc20260601-r0 and the advisory was amended
# to name that version, so the 1.3.3-r0 this file used to wait for is a number
# that will never arrive. A stock wolfi-base scan reports the advisory as
# `zlib 1.3.2-r7 -> 1.3.2.1_rc20260601-r0`, which is what Wolfi publishes on
# both arches today. scripts/blocked.py now watches the shipped version.
#
# Evidence, stated exactly as measured:
#   x86_64  gated locally 2026-09-20, PUSH=0: 0 fixable CVEs AND the boot test
#           passed, so this is "runs", not just "scans clean".
#   aarch64 not measured locally; this host kills background melange builds and
#           a qemu-emulated arm build does not fit the foreground timeout. CI's
#           native arm64 runner is the first arm measurement, and its gate
#           refuses to publish on any finding.
# elixir: Wolfi packages elixir as erlNN-elixir-X.Y which PROVIDES elixir-<minor>;
# apko resolves the bare `elixir-<minor>` virtual (and pulls erlang). Latest 3
# minor lines, full X.Y.Z (as-is tag); PKG maps each to its elixir-<minor> virtual.
BLOCKED=0
FROM_SOURCE=0
VERSIONS=(1.17.3 1.18.4 1.19.5)
# test.sh takes its extra args from build-elixir.yml, which passes "${1%.*}" rather
# than the version. Mirrored here so the local gate matches CI; passing the
# version instead fails an image that runs fine.
boot_args() { echo "${1%.*}"; }
declare -A PKG=(
  [1.17.3]=elixir-1.17
  [1.18.4]=elixir-1.18
  [1.19.5]=elixir-1.19
)
render() { echo "s|__PKG__|${PKG[$1]}|g"; }
