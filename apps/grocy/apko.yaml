# Grocy runtime: supervisord runs php-fpm (127.0.0.1:9000) and QuenchWorks' nginx (:8080) after
# /usr/libexec/grocy-init prepares GROCY_DATAPATH=/var/lib/grocy (the volume: config.php, grocy.db,
# storage). Set GROCY_HTTP_USER / GROCY_HTTP_PASSWORD before the first start to name the first user.
# Nonroot uid 1001, writable paths /tmp and /var/lib/grocy.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - busybox
    - supervisor
    - quench-nginx@local          # QuenchWorks' hardened nginx (from source), 8080/nonroot
    - quench-grocy@local
    - php-8.5
    - php-8.5-fpm
    - php-8.5-fpm-config
    - php-8.5-config
    - php-8.5-ctype
    - php-8.5-ctype-config
    - php-8.5-curl
    - php-8.5-curl-config
    - php-8.5-fileinfo
    - php-8.5-fileinfo-config
    - php-8.5-gd
    - php-8.5-gd-config
    - php-8.5-iconv
    - php-8.5-iconv-config
    - php-8.5-intl
    - php-8.5-intl-config
    - php-8.5-mbstring
    - php-8.5-mbstring-config
    - php-8.5-pdo
    - php-8.5-pdo-config
    - php-8.5-pdo_sqlite
    - php-8.5-pdo_sqlite-config
    # SQLite 3.54.x fails Grocy's migrations and product writes ("VIEWs and/or subqueries nested too
    # deep", a new cursor guard; grocy/grocy#3010). 3.53.4 works. Drop the pin when a fixed SQLite ships.
    - sqlite-libs=3.53.4-r2
    - php-8.5-sodium        # PASSWORD_ARGON2ID: Grocy hashes passwords with Argon2id
    - php-8.5-sodium-config
    - php-8.5-simplexml
    - php-8.5-dom
    - php-8.5-xml

accounts:
  groups:
    - groupname: grocy
      gid: 1001
  users:
    - username: grocy
      uid: 1001
      gid: 1001
  run-as: 1001

environment:
  GROCY_DATAPATH: /var/lib/grocy

entrypoint:
  command: /usr/libexec/grocy-init

work-dir: /var/www/grocy

paths:
  - path: /tmp
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o1777
  - path: /var/lib
    type: directory
    uid: 0
    gid: 0
    permissions: 0o755
  - path: /var/lib/grocy
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o750

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-grocy"
  org.opencontainers.image.licenses: "MIT"
  org.opencontainers.image.version: "__VER__"
