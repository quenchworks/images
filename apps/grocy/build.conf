# grocy: Grocy (grocy/grocy, MIT), groceries and household management: stock and expiry tracking,
# shopping lists, recipes, chores, batteries, equipment, a barcode-friendly UI and a REST API. Images
# issue #56.
#
# From the release tag: composer install --no-dev (vendor dir "packages") and yarn's production install
# (into public/packages), with moment raised to 2.31.0. php-8.5-fpm and QuenchWorks' nginx under
# supervisor, like the PrivateBin image. Code in /var/www/grocy (docroot public/), data in
# GROCY_DATAPATH=/var/lib/grocy (the volume): config.php is copied there on first start and creates
# the first user from GROCY_HTTP_USER/GROCY_HTTP_PASSWORD when set, so admin/admin never exists.
# 2026-11-15: sqlite-libs pinned to 3.53.4-r2 in apko.yaml: SQLite 3.54.0 and 3.54.1 fail Grocy writes and migrations
# (grocy/grocy#3008/#3010, upstream SQLite fix expected in the next release). Re-check on each update round:
# remove the pin once Wolfi has sqlite-libs 3.54.2 or later. The smoke test adds a product to catch it.
# LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(4.7.1)
declare -A SHA256=(
  [4.7.1]=7711d0e4fd5416489e48ced5092530ad2a0ec187e4af91a664f21321541dd619
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
