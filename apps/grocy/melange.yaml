# Grocy from the release tag on Wolfi php-8.5-fpm + nginx (nginx comes from the sibling quench-nginx
# package, installed by apko).
package:
  name: quench-grocy
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Grocy (groceries and household management) on Wolfi php-fpm + nginx"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - php-8.5
      - php-8.5-config
      - php-8.5-fpm
      - php-8.5-fpm-config
      - php-8.5-ctype
      - php-8.5-ctype-config
      - php-8.5-curl
      - php-8.5-curl-config
      - php-8.5-fileinfo
      - php-8.5-fileinfo-config
      - php-8.5-gd
      - php-8.5-gd-config
      - php-8.5-iconv
      - php-8.5-iconv-config
      - php-8.5-intl
      - php-8.5-intl-config
      - php-8.5-mbstring
      - php-8.5-mbstring-config
      - php-8.5-pdo
      - php-8.5-pdo-config
      - php-8.5-pdo_sqlite
      - php-8.5-pdo_sqlite-config
      - php-8.5-sodium        # PASSWORD_ARGON2ID: Grocy hashes passwords with Argon2id
      - php-8.5-sodium-config
      - php-8.5-simplexml
      - php-8.5-dom
      - php-8.5-xml
      - supervisor
      - busybox

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - composer
      - jq
      - php-8.5
      - php-8.5-config
      - php-8.5-ctype
      - php-8.5-ctype-config
      - php-8.5-curl
      - php-8.5-curl-config
      - php-8.5-fileinfo
      - php-8.5-fileinfo-config
      - php-8.5-gd
      - php-8.5-gd-config
      - php-8.5-iconv
      - php-8.5-iconv-config
      - php-8.5-intl
      - php-8.5-intl-config
      - php-8.5-mbstring
      - php-8.5-mbstring-config
      - php-8.5-pdo
      - php-8.5-pdo-config
      - php-8.5-pdo_sqlite
      - php-8.5-pdo_sqlite-config
      - php-8.5-sodium        # PASSWORD_ARGON2ID: Grocy hashes passwords with Argon2id
      - php-8.5-sodium-config
      - php-8.5-simplexml
      - php-8.5-dom
      - php-8.5-xml
      - nodejs-24
      - yarn

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/grocy/grocy/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - name: Dependencies (composer into packages/, yarn into public/packages)
    runs: |
      set -eu
      export HOME="$(mktemp -d)" COMPOSER_HOME="$(mktemp -d)" YARN_CACHE_FOLDER="$(mktemp -d)"
      composer install --no-dev --no-interaction --no-progress --optimize-autoloader
      # moment 2.30.1 (CVE fixed in 2.31.0) comes in through ^2 ranges; resolve them all to 2.31.0
      jq '.dependencies.moment = "2.31.0" | .resolutions = {"moment": "2.31.0"}' package.json > package.json.new && mv package.json.new package.json
      yarn install --non-interactive
      [ "$(node -p "require('./public/packages/moment/package.json').version")" = 2.31.0 ]
      # no other copy of moment below 2.31.0
      ! find public/packages -path '*/moment/package.json' -exec grep -l '"version": *"2\.30' {} + | grep -q .
      # a dev lock file shipped inside toastr names jquery 3.2.1, which is not installed
      find public/packages -name package-lock.json -delete

  - name: Lay out /var/www/grocy and the data path
    runs: |
      set -eu
      d="${{targets.destdir}}/var/www/grocy"
      install -d "$d"
      cp -a app.php config-dist.php controllers helpers localization middleware migrations packages plugins \
        public routes.php services version.json views grocy.openapi.json "$d/"
      grep -F "${{package.version}}" "$d/version.json"
      # the data path's config.php: upstream's defaults, plus the first user from the environment
      # (migration 0027 creates GROCY_HTTP_USER with GROCY_HTTP_PASSWORD when they are defined, else admin/admin)
      install -d "${{targets.destdir}}/usr/share/grocy"
      { cat config-dist.php; cat <<'PHP'

      // QuenchWorks: the first user comes from GROCY_HTTP_USER / GROCY_HTTP_PASSWORD (used once, when the
      // database is created), so the default admin/admin account is never made.
      if (getenv('GROCY_HTTP_USER') !== false && getenv('GROCY_HTTP_PASSWORD') !== false && !defined('GROCY_HTTP_USER'))
      {
      	define('GROCY_HTTP_USER', getenv('GROCY_HTTP_USER'));
      	define('GROCY_HTTP_PASSWORD', getenv('GROCY_HTTP_PASSWORD'));
      }
      PHP
      } > "${{targets.destdir}}/usr/share/grocy/config.php"
      install -d "${{targets.destdir}}/usr/libexec"
      cat > "${{targets.destdir}}/usr/libexec/grocy-init" <<'SH'
      #!/bin/sh
      # prepares GROCY_DATAPATH on the volume, then runs supervisord (php-fpm + nginx)
      set -eu
      : "${GROCY_DATAPATH:=/var/lib/grocy}"
      mkdir -p "$GROCY_DATAPATH/viewcache" "$GROCY_DATAPATH/storage"
      [ -f "$GROCY_DATAPATH/config.php" ] || cp /usr/share/grocy/config.php "$GROCY_DATAPATH/config.php"
      rm -rf "$GROCY_DATAPATH/viewcache/"*
      exec /usr/bin/supervisord -c /etc/grocy/supervisord.conf
      SH
      chmod 0755 "${{targets.destdir}}/usr/libexec/grocy-init"

  - name: nginx server block (FastCGI to php-fpm on :8080)
    runs: |
      set -eu
      d="${{targets.destdir}}"
      install -d "$d/etc/nginx/conf.d"
      cat > "$d/etc/nginx/conf.d/grocy.conf" <<'NGINX'
      server {
          listen 8080 default_server;
          listen [::]:8080 default_server;
          server_name _;
          root /var/www/grocy/public;
          index index.php;
          charset utf-8;
          client_max_body_size 50M;
          access_log off;

          location ~ /\. { return 403; }
          location / { try_files $uri /index.php$is_args$args; }
          location ~ \.php$ {
              try_files $uri =404;
              include        /etc/nginx/fastcgi_params;
              fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
              fastcgi_pass   127.0.0.1:9000;
          }
          location ~* \.(js|css|png|jpg|svg|ico|woff2?|ttf|eot|map)$ { expires 30d; access_log off; }
      }
      NGINX
  - name: php-fpm pool + php.ini (nonroot, read-only rootfs)
    runs: |
      set -eu
      d="${{targets.destdir}}"
      install -d "$d/etc/php/php-fpm.d" "$d/etc/php/conf.d"
      cat > "$d/etc/php/php-fpm.d/zzz-grocy.conf" <<'FPM'
      [global]
      daemonize = no
      error_log = /proc/self/fd/2

      [www]
      listen = 127.0.0.1:9000
      catch_workers_output = yes
      decorate_workers_output = no
      ; GROCY_DATAPATH and GROCY_* settings come from the container environment
      clear_env = no
      pm = dynamic
      pm.max_children = 16
      pm.start_servers = 2
      pm.min_spare_servers = 1
      pm.max_spare_servers = 4
      FPM
      cat > "$d/etc/php/conf.d/zzz-grocy.ini" <<'INI'
      expose_php = Off
      memory_limit = 256M
      upload_max_filesize = 50M
      post_max_size = 50M
      sys_temp_dir = /tmp
      upload_tmp_dir = /tmp
      session.save_path = /tmp
      display_errors = Off
      log_errors = On
      error_log = /proc/self/fd/2
      date.timezone = UTC
      opcache.enable = 1
      opcache.revalidate_freq = 60
      INI

  - name: supervisord (php-fpm + nginx)
    runs: |
      set -eu
      d="${{targets.destdir}}"
      install -d "$d/etc/grocy" "$d/etc/supervisor.d"
      cat > "$d/etc/grocy/supervisord.conf" <<'SUP'
      [supervisord]
      nodaemon=true
      logfile=/dev/stdout
      logfile_maxbytes=0
      pidfile=/tmp/supervisord.pid

      [unix_http_server]
      file=/tmp/supervisor.sock

      [supervisorctl]
      serverurl=unix:///tmp/supervisor.sock

      [rpcinterface:supervisor]
      supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

      [include]
      files = /etc/supervisor.d/*.conf
      SUP
      printf '%s\n' '[program:php-fpm]' 'command=/usr/bin/php-fpm --nodaemonize --fpm-config /etc/php/php-fpm.conf' \
        'autostart=true' 'autorestart=true' 'priority=10' 'stdout_logfile=/dev/stdout' 'stdout_logfile_maxbytes=0' \
        'stderr_logfile=/dev/stderr' 'stderr_logfile_maxbytes=0' > "$d/etc/supervisor.d/php-fpm.conf"
      printf '%s\n' '[program:nginx]' 'command=/usr/bin/nginx -g "daemon off;"' \
        'autostart=true' 'autorestart=true' 'priority=20' 'stdout_logfile=/dev/stdout' 'stdout_logfile_maxbytes=0' \
        'stderr_logfile=/dev/stderr' 'stderr_logfile_maxbytes=0' > "$d/etc/supervisor.d/nginx.conf"

test:
  pipeline:
    - runs: |
        set -eu
        test -f /var/www/grocy/public/index.php
        test -f /usr/share/grocy/config.php
        php -m | grep -qi pdo_sqlite
        php -r 'exit(defined("PASSWORD_ARGON2ID") ? 0 : 1);'
