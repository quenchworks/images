# Pocket ID (pocket-id/pocket-id, BSD-2-Clause): a simple OIDC provider whose users sign in with
# passkeys only, on SQLite or PostgreSQL. From source via melange: the SvelteKit frontend is built
# with pnpm (upstream's `pnpm build`, vite-plus) into backend/frontend/dist and embedded in one
# CGO-free Go binary. Node never reaches the runtime image.
# LATEST-ONLY: per-release frontend toolchains.
FROM_SOURCE=1
VERSIONS=(2.19.3)
declare -A SHA256=(
  [2.19.3]=ee2525db7061b355deb5f12eb6c15465faf7e7b5fffd7b9915919d40cd8af54c
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
