# Pocket ID from the release tag as upstream builds it: pnpm build (vite-plus) writes the SPA to
# frontend/dist, which the backend embeds; go builds backend/cmd (CGO off).
package:
  name: quench-pocket-id
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Pocket ID passkey OIDC provider, built from source on Wolfi"
  copyright:
    - license: BSD-2-Clause
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - git                # the root prepare script (vp config) installs git hooks
      - ca-certificates-bundle
      - go-1.27          # backend/go.mod: go 1.27.3
      # build-only web toolchain: .node-version 24; pnpm 11.8 switches itself to the
      # packageManager pin (pnpm@11.28.3, sha512-verified)
      - nodejs-24
      - pnpm-11.8

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/pocket-id/pocket-id/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - name: Build the SPA (pnpm build)
    runs: |
      set -eu
      export HOME="$(mktemp -d)" CI=true
      # the tarball is not a git checkout; prepare's vp config needs one
      git init -q
      pnpm install --frozen-lockfile
      BUILD_OUTPUT_PATH=dist pnpm build
      test -f frontend/dist/index.html
      mkdir -p backend/frontend
      cp -a frontend/dist backend/frontend/dist

  - name: Build the binary (static, CGO off)
    runs: |
      set -eu
      export CGO_ENABLED=0 GOTOOLCHAIN=local GOFLAGS=-mod=mod
      cd backend
      # floors, raised only when below (a bare go get downgrades once upstream passes it)
      FLOOR="golang.org/x/crypto@v0.58.1-0.20261009181718-2f1f834330b2 golang.org/x/net@v0.62.0 golang.org/x/text@v0.43.0 golang.org/x/sys@v0.49.0 golang.org/x/image@v0.47.0"
      need=""
      for f in $FLOOR; do
        have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${f%@*}")"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        [ "$(printf '%s\n%s\n' "$have" "${f#*@}" | sort -V | head -1)" = "${f#*@}" ] || need="$need $f"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || go get $need
      go mod tidy
      go build -trimpath \
        -ldflags "-s -w -X github.com/pocket-id/pocket-id/backend/internal/common.Version=${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/pocket-id" ./cmd
      "${{targets.destdir}}/usr/bin/pocket-id" version 2>&1 | grep -F "${{package.version}}"

test:
  pipeline:
    - runs: |
        pocket-id version
