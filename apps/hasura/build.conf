# hasura: Hasura GraphQL Engine v2 (Apache-2.0), an instant GraphQL API over
# PostgreSQL. Image-and-chart. The server is Haskell and upstream publishes it
# only inside its Docker image (the GitHub releases carry just the CLI), so the
# recipe pulls upstream's per-arch Community Edition image (the -ce tags) BY
# DIGEST, takes the graphql-engine binary and the console assets, and
# repackages them on Wolfi. The pull is
# content-addressed: crane refuses anything whose digest differs.
# The untagged-edition images (hasura/graphql-engine:vX.Y.Z) carry the
# proprietary Enterprise build ("Pro Edition"); only the -ce tags are Apache-2.0.
# The recipe asserts the binary reports "v<VER>-ce".
# The amd64 binary is UPX-packed upstream and is unpacked so its shared-library
# needs are visible; the arm64 one is not packed.
# Latest patch of the last 3 minor lines (2.51 is a pre-release).
#   __DIG_AMD__ / __DIG_ARM__ = per-arch manifest digest of hasura/graphql-engine:v<VER>-ce
BLOCKED=0
FROM_SOURCE=0
VERSIONS=(2.48.16 2.49.5 2.50.3)
declare -A DIG_AMD=(
  [2.48.16]=sha256:ed33d98f1c314ece29b10f685e290f91a92c29b6514bd94d87a5067c3c19615c
  [2.49.5]=sha256:31f35ed8259c223a0f356cd1c44bc4014a9ca3f21c19fe99b6e1758af4e250bf
  [2.50.3]=sha256:8e4317d4173f64271eb97ec37532ddf6b8134029b378e60dea1722e93f38d9a9
)
declare -A DIG_ARM=(
  [2.48.16]=sha256:2aa6391810a8e916d36fcc45f788bc39c5fe67a3d382ddfcbf4e272b1557b490
  [2.49.5]=sha256:ce15d74f4aebb20ee73f226127a31afb9d9213808581c346833f7b287acd18c4
  [2.50.3]=sha256:a12c23610ecf77876f2a2856c61d7b72a7d9f41de24104ad24c9748c7437df6b
)
render() {
  echo "s/__VER__/$1/g; s|__DIG_AMD__|${DIG_AMD[$1]}|g; s|__DIG_ARM__|${DIG_ARM[$1]}|g"
}
