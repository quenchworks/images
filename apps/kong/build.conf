# kong (Kong Gateway OSS): from-source via melange. Apache-2.0 -- the OSS gateway,
# NOT Kong Enterprise (which is proprietary and is not built here).
#
# WHY LATEST ONLY, NOT THE USUAL THREE LINES: Kong pins its ENTIRE native toolchain
# per release in its `.requirements` file -- a specific OpenResty, OpenSSL, PCRE, and
# six git-pinned nginx/Lua modules, plus 39 source patches that are written against
# that exact OpenResty/nginx version and do not apply to another. 3.9.3 wants OpenResty
# 1.25.3.2; older lines want different ones. Building three lines therefore means
# building three complete, separately-patched OpenResty toolchains, and a patch set that
# is version-locked cannot be shared between them. Same call as apps/excalidraw, whose
# per-release toolchains also force latest-only. Revisit if Kong ever tracks a stable
# OpenResty across minor lines.
#
# THE 0-CVE ANGLE, and where this differs from upstream's own build: Kong pins OpenSSL
# 3.2.3 and PCRE 10.44 and vendors them via Bazel. Those are old enough to carry fixed
# CVEs, so this recipe deliberately does NOT vendor them -- it builds OpenResty against
# Wolfi's CURRENT openssl and pcre2 packages, which is the same "float to the fixed
# version" discipline the Go apps use. Kong's own nginx patches are still applied in
# full, including the six backported nginx CVE fixes, because Kong's Lua code depends on
# API those patches add.
#
# NOT SHELL-FREE, unlike most of this catalog: Kong's `kong` CLI is a Lua script run
# through OpenResty's `resty`, which is itself Perl, and the CLI shells out. So the
# runtime carries busybox + perl. Documented rather than fought.
#
# NO KONG MANAGER (the browser GUI): unlike the Vault console, Kong Manager's compiled
# assets are NOT in the source tree and are not built from source by upstream either --
# Kong's build downloads a prebuilt bundle from a Kong-hosted bucket keyed by
# KONG_MANAGER=v3.9.0.0. Pulling a vendor binary blob would break the clean-room rule
# and could not be SBOM'd honestly, so the Admin API is shipped without the GUI.
# Konga / other OSS UIs can front the Admin API instead.
FROM_SOURCE=1
VERSIONS=(3.9.3)
declare -A COMMIT=(
  [3.9.3]=a643428bc4d5397152164a63bcc0f8bc65fce69d
)
# Native toolchain, taken verbatim from Kong's .requirements at this tag (except
# OpenSSL/PCRE, see above -- those come from Wolfi).
declare -A OPENRESTY=(
  [3.9.3]=1.25.3.2
)
# Kong's own source comes from the GitHub release TARBALL, not a git clone: melange's
# git-checkout fails instantly and repeatably in this sandbox with
# "fatal: remote helper 'https' aborted session" on Kong's repo (the host clones it
# fine, so it is the sandbox's git, not the network). The tarball is 2.5MB, is fetched
# with curl, and is pinned by sha256 -- equal provenance, no git involved.
declare -A KONG_SHA256=(
  [3.9.3]=13da24a6117b3213fa89a39547e8dd37467afb9dbac913e1abb32be97b15e32f
)
declare -A OPENRESTY_SHA256=(
  [3.9.3]=2d564022b06e33b45f7e5cfaf1e5dc571d38d61803af9fa2754dfff353c28d9c
)
render() {
  echo "s/__VER__/$1/g; s/__COMMIT__/${COMMIT[$1]}/g; s/__KONG_SHA256__/${KONG_SHA256[$1]}/g; s/__OPENRESTY__/${OPENRESTY[$1]}/g; s/__OPENRESTY_SHA256__/${OPENRESTY_SHA256[$1]}/g"
}
