# yq (YAML/JSON/XML/CSV/TOML processor) runtime: the binary as the entrypoint (`docker run ... <args>`), ca-certificates for TLS.
# Minimal, nonroot uid 1001, multi-arch, shell-free.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-yq@local

accounts:
  groups:
    - groupname: yq
      gid: 1001
  users:
    - username: yq
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/bin/yq

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-yq"
  org.opencontainers.image.licenses: "MIT"
