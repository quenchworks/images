# Builds the redis_exporter Prometheus exporter from source onto Wolfi.
# Used as the hardened metrics sidecar for the redis chart.
package:
  name: quench-redis-exporter
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened redis_exporter, built from source on Wolfi"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/oliver006/redis_exporter/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: "__SHA256__"
  - runs: |
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      # 0-CVE bump: the older tags built by the matrix (e.g. 1.84.0) pin
      # golang.org/x/crypto v0.51.0, flagged by the x/crypto/ssh advisory batch
      # (CVE-2026-39828..39835). Force x/crypto (and x/net, same batch) up to the
      # patched releases before building. The newest tag already ships >= these,
      # so the bump is a no-op there; behavior-preserving on the older tags.
      # x/net >= 0.55.0, x/crypto >= 0.52.0.
      go get golang.org/x/net@v0.57.0 golang.org/x/text@v0.40.0 golang.org/x/crypto@v0.53.0
      go mod tidy || true
      go build -trimpath -ldflags "-s -w -X main.BuildVersion=${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/redis_exporter" .
  # The exporter user is provided by apko (accounts), not the package, to avoid
  # conflicting with wolfi-baselayout's /etc files.

test:
  pipeline:
    - runs: redis_exporter -version
