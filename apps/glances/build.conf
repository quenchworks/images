# glances: Glances, cross-platform system monitoring with a web UI, a REST API and exporters, from
# the sha256-pinned PyPI wheel (it ships the built web UI) with glances[web] resolved into a
# Python 3.14 venv. Serves the web UI and the API on 61208.
#
# 0-CVE: the installed venv (glances[web]==4.5.9) scanned 0 findings, fixed or unfixed, once pip
# and setuptools left it (2026-11-23).
#
# NEWEST-ONLY: Glances patches its newest line.
BLOCKED=0
FROM_SOURCE=0
VERSIONS=(4.5.9)
# sha256 of the PyPI wheel, as PyPI publishes it
declare -A SHA256=(
  [4.5.9]=e52f16f5b254ff5135e7a78e823dd0dadbcbd835e73a18ec24dda2b06c5b6959
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
