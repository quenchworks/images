# apisix (Apache APISIX gateway/data plane): from-source via melange. Apache-2.0.
#
# THREE PINS PER RELEASE, NOT ONE. APISIX's `.requirements` file at each tag pins:
#   APISIX_RUNTIME           -- api7's OpenResty distribution (see below)
#   APISIX_DASHBOARD_COMMIT  -- the admin SPA, which APISIX now SERVES ITSELF at /ui
# Both are read from the tag we build, never from master. scripts/check/apisix.py
# re-reads `.requirements` at the newest upstream tag and reports drift on all three.
#
# WHY LATEST ONLY, NOT THE USUAL THREE LINES -- same call as apps/kong, and for the
# same reason, verified against the real build scripts:
#   3.16.0 -> APISIX_RUNTIME 1.3.3  -> OpenResty 1.27.1.2 + apisix-nginx-module 1.19.3
#   3.17.0 -> APISIX_RUNTIME 1.3.6  -> OpenResty 1.29.2.4 + apisix-nginx-module 1.19.5
#   3.18.0 -> APISIX_RUNTIME 1.3.16 -> OpenResty 1.29.2.4 + apisix-nginx-module 1.19.9
#                                       + ngx_http_ffi_client (a module that does not
#                                         exist in either older runtime)
# apisix-nginx-module ships its patch set in per-OpenResty directories and its
# patch.sh matches the OpenResty version EXACTLY (`*openresty-1.29.2.4`), erroring
# out with "can't detect OpenResty version" on anything else. Three APISIX lines
# therefore mean two complete OpenResty trees, three separately version-locked patch
# sets (37 patches at 1.19.9 alone) and three different module rosters. A
# version-locked patch set cannot be shared between lines. Revisit if APISIX ever
# tracks one runtime across minors.
#
# APISIX only ever has ONE maintained line anyway: it releases 3.16 -> 3.17 -> 3.18 as
# successive minors, not as parallel supported branches (only 3.8.1 and 3.14.1 ever got
# a patch release), so "latest 3 minor lines" would mean shipping two superseded
# releases, not three supported ones.
FROM_SOURCE=1
VERSIONS=(3.18.0)

# APISIX source: the GitHub release tarball, pinned by sha256 (same provenance choice
# as apps/kong -- melange's git-checkout fails in this sandbox on GitHub repos).
declare -A SHA256=(
  [3.18.0]=5cf1e2b1cf57208b6b4a63cb64a853449501c3c7548348ea9af84cac3f7b0ca5
)

# ---- from .requirements AT THE TAG ----------------------------------------------
declare -A RUNTIME=(          [3.18.0]=1.3.16 )
declare -A DASHBOARD_COMMIT=( [3.18.0]=045e3142867e3b7d5d1b8ec40bf8f66a7ce24a64 )
declare -A DASHBOARD_SHA256=( [3.18.0]=ec85d7efda106e67dbf66bcd612594f4cd5c6ce067945fad81d3d681ce6bc4d6 )

# ---- the runtime roster, taken verbatim from api7/apisix-build-tools at
#      refs/heads/apisix-runtime/${RUNTIME} (build-apisix-runtime.sh) ------------
# EXCEPT OpenSSL/PCRE/zlib: upstream vendors OpenSSL 3.4.1 built with
# `enable-weak-ssl-ciphers enable-md2 enable-rc5`, plus its own zlib and pcre. This
# recipe deliberately does NOT vendor any of them and links Wolfi's current
# openssl/pcre2/zlib instead -- the same float-to-the-fix discipline as apps/kong.
# Verified: the whole runtime compiles and APISIX boots against Wolfi OpenSSL 3.6.3.
declare -A OPENRESTY=(        [3.18.0]=1.29.2.4 )
declare -A OPENRESTY_SHA256=( [3.18.0]=39bdac218249b7917464e6159acffef25a320ae89adaeb23514f078f473497bd )
declare -A ANM=(              [3.18.0]=1.19.9 )
declare -A ANM_SHA256=(       [3.18.0]=cdf3fa297070a8a24af7be25a13c6ef4bf2fbb77e074c7526d78d23cb354b961 )
declare -A NMUM=(             [3.18.0]=1.3.3 )
declare -A NMUM_SHA256=(      [3.18.0]=442922b12f1ddcb7b6236864f9d0c437c047b5ce9bc800fc73cef605f17dfd61 )
declare -A DUBBO=(            [3.18.0]=1.0.2 )
declare -A DUBBO_SHA256=(     [3.18.0]=1fb02fccb89a042ebdd2a0da26c050ea9a3807e75fdbf67e79da91eaea0e6953 )
declare -A LVAR=(             [3.18.0]=0.5.3 )
declare -A LVAR_SHA256=(      [3.18.0]=66792871b21d9e81f1ec6f8416bc18878ab28db0fbaad41877a0569e6a5c1b20 )
declare -A LRE=(              [3.18.0]=0.2.0 )
declare -A LRE_SHA256=(       [3.18.0]=accc80ad81c6258bf277f40b4d2feb10099e4d315036a8c285889d3991f9e224 )
declare -A FFIC=(             [3.18.0]=0.1.3 )
declare -A FFIC_SHA256=(      [3.18.0]=072f7be95ca8fcac0f31ec86fffbaa32aaa1e260e6e4b87a0e35d397a2f6630e )
# api7's fork of lua-resty-limit-traffic REPLACES OpenResty's bundled 0.09 copy; the
# limit-req / limit-conn / limit-count plugins are written against the fork.
declare -A LIMIT=(            [3.18.0]=1.2.0 )
declare -A LIMIT_SHA256=(     [3.18.0]=aca960438de0476f738280a0e5b81030143b9ab9a393e393ef82b70e112e764d )

# ---- rocks that cannot come straight off luarocks.org ---------------------------
# lua-resty-saml (the saml-auth plugin, which IS in APISIX's default plugin list)
# needs two out-of-band fixes; see melange.yaml. Its own source tarball plus api7's
# xmlsec1 fork tarball are pinned here so nothing is fetched unpinned mid-build.
declare -A SAML=(             [3.18.0]=0.2.5 )
declare -A SAML_SHA256=(      [3.18.0]=ca2d68702dc54cb3b53d7f1b97fc0cc3904b89af6263684c5bea9a12b913ab04 )
declare -A XMLSEC=(           [3.18.0]=1.2.28 )
declare -A XMLSEC_SHA256=(    [3.18.0]=13eec4811ea30e3f0e16a734d1dbf7f9d246a71d540b48d143a07b489f6222d4 )

render() {
  echo "s/__VER__/$1/g;\
s|__SHA256__|${SHA256[$1]}|g;\
s/__RUNTIME__/${RUNTIME[$1]}/g;\
s/__DASHBOARD_COMMIT__/${DASHBOARD_COMMIT[$1]}/g;\
s|__DASHBOARD_SHA256__|${DASHBOARD_SHA256[$1]}|g;\
s/__OPENRESTY__/${OPENRESTY[$1]}/g;\
s|__OPENRESTY_SHA256__|${OPENRESTY_SHA256[$1]}|g;\
s/__ANM__/${ANM[$1]}/g;\
s|__ANM_SHA256__|${ANM_SHA256[$1]}|g;\
s/__NMUM__/${NMUM[$1]}/g;\
s|__NMUM_SHA256__|${NMUM_SHA256[$1]}|g;\
s/__DUBBO__/${DUBBO[$1]}/g;\
s|__DUBBO_SHA256__|${DUBBO_SHA256[$1]}|g;\
s/__LVAR__/${LVAR[$1]}/g;\
s|__LVAR_SHA256__|${LVAR_SHA256[$1]}|g;\
s/__LRE__/${LRE[$1]}/g;\
s|__LRE_SHA256__|${LRE_SHA256[$1]}|g;\
s/__FFIC__/${FFIC[$1]}/g;\
s|__FFIC_SHA256__|${FFIC_SHA256[$1]}|g;\
s/__LIMIT__/${LIMIT[$1]}/g;\
s|__LIMIT_SHA256__|${LIMIT_SHA256[$1]}|g;"

}
