# dragonfly: from-source via melange (fetch the per-arch prebuilt binary, sha256).
# Latest 3 stable minor lines (full X.Y.Z, used as-is). Per-arch sha256 since the
# x86_64/aarch64 tarballs differ.
#   __VER__ = version  __SHA_AMD__ = x86_64 sha256  __SHA_ARM__ = aarch64 sha256
FROM_SOURCE=1
VERSIONS=(1.38.1 1.39.0 1.40.1)
declare -A SHA_AMD=(
  [1.38.1]=26d69d1724d4905b193109d3dc8a18508e0aa235cec434d6d886a1feedbdab1e
  [1.39.0]=81f88cfd0096c550e415a700c97eb5bf606db1df6106cc03584e878fd7aa126a
  [1.40.1]=fc9b9b6faf388d700d1a9d964b51f5721b8efedc659239330b03b4ce855261de
)
declare -A SHA_ARM=(
  [1.38.1]=f7367f15215a0b49058da39d8e8ac132aac7ca493c5fb5e11feac768405849cd
  [1.39.0]=52a14e88cd8bd9d086a3a4794b8cb4e60efe8e2c61fb4d9ea3f141bcd27982e3
  [1.40.1]=45c26a549bf91bc49a313e20dbd5a554993678a02513240f284c4ac3ae4616f8
)
render() { echo "s/__VER__/$1/g; s|__SHA_AMD__|${SHA_AMD[$1]}|g; s|__SHA_ARM__|${SHA_ARM[$1]}|g"; }
