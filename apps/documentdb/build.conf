# STATUS: UNBLOCKED 2026-09-20. The zlib block is gone: Wolfi shipped the
# CVE-2026-85091 fix as 1.3.2.1_rc20260601-r0 and the advisory was amended to
# name it, so the 1.3.3-r0 this file waited for never arrives. Run 35066521869
# measured every version on BOTH arches and found only that zlib row.
#
# A second blocker had to be fixed first, and it was in this file: the COMMITS
# map carried duplicate keys, so 0.116.0 and 0.117.0 both resolved to one wrong
# commit and the build died at the git-checkout guard. See the note on that map.
#
# Evidence, stated exactly as measured:
#   x86_64  0.117.0 gated locally 2026-09-20 at PUSH=0: 0 fixable CVEs. The
#           boot test did NOT run: this is a ~9 minute Rust and C build and the
#           local window closes first, so there is no boot verdict to quote.
#   0.114.0 and 0.116.0 not gated locally at all.
#   aarch64 not measured locally.
# CI builds every version on both native runners, runs test.sh before
# publishing, and refuses to publish on any finding. That is the first full
# measurement this app will have had since the commit-map bug was introduced.
# documentdb: from-source via melange (git-checkout the documentdb postgres
# extension + fixed helper libs: intelrdfpmath, mongo-c-driver, rum).
# Latest 3 stable minor lines (full X.Y.Z image tag, used as-is). The upstream
# SOURCE tag uses a different format (v0.112-0, not 0.112.0), so it's mapped per
# version alongside the commit; the 3 helper libs are stable and stay pinned in
# melange.yaml.
#   __VER__    = image version (full X.Y.Z)   __SRCTAG__ = source git tag (0.N-0)
#   __COMMIT__ = that source tag's commit
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(0.114.0 0.116.0 0.117.0)
declare -A SRCTAG=(
  [0.116.0]=0.116-0
  [0.117.0]=0.117-0
  [0.114.0]=0.114-0
)
declare -A COMMITS=(
  [0.116.0]=7bceb7ef6193df79a26893e7d442957c6952232f
  [0.117.0]=28cc012070ce798361ed265251ec159180b7889f
  [0.114.0]=f3682330aab8de4e7f6efcb60a86400029782554
)
# 2026-09-20: two DUPLICATE keys were appended below this map, both set to
# 367cf033a910954b4220d78f558a221f9b9dd329. Bash keeps the LAST assignment, so
# 0.116.0 and 0.117.0 both resolved to that one commit and the build failed at
# the git-checkout guard:
#   FAIL Expected commit 367cf033... for v0.117-0, found 28cc012070ce...
# The three entries above are the correct ones, each confirmed by dereferencing
# the annotated tag upstream (gh api repos/microsoft/documentdb/git/tags/<obj>):
#   v0.114-0 -> f3682330  v0.116-0 -> 7bceb7ef  v0.117-0 -> 28cc0120
# The expected-commit guard is what made this visible instead of silently
# building the wrong source for two of the three versions.
render() { echo "s/__VER__/$1/g; s/__SRCTAG__/${SRCTAG[$1]}/g; s/__COMMIT__/${COMMITS[$1]}/g"; }
