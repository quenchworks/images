# STATUS: ZLIB-ONLY as of 2026-09-16. Measured, not assumed: run 35066521869
# on af0623d gated with exactly one finding, zlib CVE-2026-85091, on every
# version and both arches. Nothing else in this image is flagged.
#
# Wolfi is at 1.3.2.1_rc20260601-r0 and the advisory wants 1.3.3-r0, which
# upstream madler/zlib has never tagged. Downgrading to Wolfi's 1.3.1-r51
# is not a way out either: it predates the 1.3.2-r0 fix for CVE-2026-27171.
#
# BLOCKED=1 skips build+merge so sweeps stop burning a red run here. Clear
# it with scripts/blocked.py --dispatch once Wolfi ships zlib 1.3.3-r0.
# documentdb: from-source via melange (git-checkout the documentdb postgres
# extension + fixed helper libs: intelrdfpmath, mongo-c-driver, rum).
# Latest 3 stable minor lines (full X.Y.Z image tag, used as-is). The upstream
# SOURCE tag uses a different format (v0.112-0, not 0.112.0), so it's mapped per
# version alongside the commit; the 3 helper libs are stable and stay pinned in
# melange.yaml.
#   __VER__    = image version (full X.Y.Z)   __SRCTAG__ = source git tag (0.N-0)
#   __COMMIT__ = that source tag's commit
BLOCKED=1
FROM_SOURCE=1
VERSIONS=(0.114.0 0.116.0 0.117.0)
declare -A SRCTAG=(
  [0.116.0]=0.116-0
  [0.117.0]=0.117-0
  [0.114.0]=0.114-0
)
declare -A COMMITS=(
  [0.116.0]=7bceb7ef6193df79a26893e7d442957c6952232f
  [0.117.0]=28cc012070ce798361ed265251ec159180b7889f
  [0.114.0]=f3682330aab8de4e7f6efcb60a86400029782554
  [0.116.0]=367cf033a910954b4220d78f558a221f9b9dd329
  [0.117.0]=367cf033a910954b4220d78f558a221f9b9dd329
)
render() { echo "s/__VER__/$1/g; s/__SRCTAG__/${SRCTAG[$1]}/g; s/__COMMIT__/${COMMITS[$1]}/g"; }
