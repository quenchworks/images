# documentdb: from-source via melange (git-checkout the documentdb postgres
# extension + fixed helper libs: intelrdfpmath, mongo-c-driver, rum).
# Latest 3 stable minor lines (full X.Y.Z image tag, used as-is). The upstream
# SOURCE tag uses a different format (v0.112-0, not 0.112.0), so it's mapped per
# version alongside the commit; the 3 helper libs are stable and stay pinned in
# melange.yaml.
#   __VER__    = image version (full X.Y.Z)   __SRCTAG__ = source git tag (0.N-0)
#   __COMMIT__ = that source tag's commit
FROM_SOURCE=1
VERSIONS=(0.110.0 0.111.0 0.112.0)
declare -A SRCTAG=(
  [0.110.0]=0.110-0
  [0.111.0]=0.111-0
  [0.112.0]=0.112-0
)
declare -A COMMITS=(
  [0.110.0]=e198330a24f5f3967c55bcf4dd228006e1aa7740
  [0.111.0]=d781310a1b0d104978edb78aa3352ad4f545a3f4
  [0.112.0]=2b076555426d47700213e9f2ef935d8ab30d68e6
)
render() { echo "s/__VER__/$1/g; s/__SRCTAG__/${SRCTAG[$1]}/g; s/__COMMIT__/${COMMITS[$1]}/g"; }
