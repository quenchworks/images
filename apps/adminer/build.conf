# adminer (vrana/adminer): the upstream single-file PHP database manager, fetched
# as the prebuilt full-edition release asset (adminer-<VER>.php) and served by a
# hardened Wolfi PHP runtime. NO compilation. Image-only (web UI, no chart).
# Latest patch of the last 3 minor lines (5.3, 5.4, 5.5). The asset is a release
# download, not a source tarball, so FROM_SOURCE stays unset.
VERSIONS=(5.5.1 6.0.0 6.0.1)
declare -A SHA256=(
  [5.5.1]=f2c70c6403a042d554be1dd8d69b6f6270a97e5b40d2fb7626f46aad821e9a18
  [6.0.0]=8181c9be10f290243724acb0e4dc930fe04440a343fb11dcc8ddb9821095e274
  [6.0.1]=1815c03f26e21d533e729c0b09bc69a59c902a6440409d013105ee679dff006c
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
