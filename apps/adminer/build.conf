# adminer (vrana/adminer): the upstream single-file PHP database manager, fetched
# as the prebuilt full-edition release asset (adminer-<VER>.php) and served by a
# hardened Wolfi PHP runtime. NO compilation. Image-only (web UI, no chart).
# Latest patch of the last 3 minor lines (5.2, 5.3, 5.4). The asset is a release
# download, not a source tarball, so FROM_SOURCE stays unset.
VERSIONS=(5.2.1 5.3.0 5.4.3)
declare -A SHA256=(
  [5.2.1]=572118dff2305f136a4b8d59404d01c3d8450e99e3abd506081ffdddd8816573
  [5.3.0]=7dcc196e941b18b74635afe1740dcd86970ab08b8eba0f00f149925aea3972ed
  [5.4.3]=01b7c01b0c736a31c98dda87e9fdcefba56efd531ff212c316b0be2b65002031
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
