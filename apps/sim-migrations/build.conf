# sim-migrations: Sim's database migrations (packages/db, drizzle) from the release tag, the image upstream ships as
# simstudioai/migrations. Built like docker/db.Dockerfile's runner stage: turbo prune @sim/db, upstream's
# prune-production-workspace script, bun install --omit=dev. The entrypoint runs scripts/migrate.ts once and exits.
# Same tag and source as apps/sim (images issue #115). LATEST-ONLY.
FROM_SOURCE=1
VERSIONS=(0.9.62)
declare -A SHA256=(
  [0.9.62]=d8e186d9775578dffafdb795d1d0400c3f95a4dcd6eb1c04d65847a8354f3ae0
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
