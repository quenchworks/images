# TiDB Operator (TiDB, TiKV and PD clusters from TidbCluster resources), from pingcap/tidb-operator
# (Apache-2.0). Upstream ships the four control-plane binaries (controller-manager, scheduler extender,
# discovery, admission webhook) in one image at /usr/local/bin; this recipe builds the same four with
# the house golang.org/x floor. The backup manager (BR/Dumpling) is a separate upstream image and is
# not built. The clusters it creates run PingCAP's own PD/TiKV/TiDB images. LATEST-ONLY: the v1.6 line
# (v2.2 is alpha).
FROM_SOURCE=1
VERSIONS=(1.6.6)
declare -A SHA256=(
  [1.6.6]=f69dc040956302fa2a9cd61987158cf88978db9b1f5a1a4a70849310118d2a2a
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
