# Glance runtime: reads /app/config/glance.yml (mount it; it may !include other files there) and
# serves on 8080. Stateless.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-glance@local

accounts:
  groups:
    - groupname: glance
      gid: 1001
  users:
    - username: glance
      uid: 1001
      gid: 1001
  run-as: 1001

work-dir: /app

entrypoint:
  command: /usr/bin/glance --config /app/config/glance.yml

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-glance"
  org.opencontainers.image.licenses: "AGPL-3.0"
  org.opencontainers.image.version: "__VER__"
