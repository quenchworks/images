# Glance (glanceapp/glance, AGPL-3.0): self-hosted dashboard that puts feeds, bookmarks, weather,
# releases and service status on one page from a YAML config. From source via melange: one static Go
# binary stamped with upstream's -X internal/glance.buildVersion. LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(0.8.8)
declare -A SHA256=(
  [0.8.8]=1e17fb7d029f03a7958000fce961044218add66f7961e946717f5325558db417
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
