# csi-node-driver-registrar (kubernetes-csi/node-driver-registrar): the CSI node-driver-registrar, which registers a node CSI driver with the kubelet. A Kubernetes CSI
# sidecar used by every CSI driver (Longhorn pins it in dep-versions). From source, static Go (CGO
# off), version stamped via -X main.version as release-tools/build.make does. Upstream's layout:
# the binary at /csi-node-driver-registrar, root by default (upstream's image is distroless/static, uid 0; the
# CSI socket it dials is created by the driver, usually as root).
# Latest patch of the last 3 minor lines.
FROM_SOURCE=1
VERSIONS=(2.16.0 2.17.0 2.18.0)
declare -A SHA256=(
  [2.16.0]=7b8cc23782c8a91f40dbd51b6b541216484607dee5422aa575bc9e0bd1f9ede1
  [2.17.0]=b8ec9c905a33ca2a6f1cfe28b090aaacde351496827c1c729abb0812ce6a853e
  [2.18.0]=f534a5294953a417ea29372abd5154ab3d8e7b9db4c78cb29f787410c16410a4
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
