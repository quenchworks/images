# spicedb (authzed): from-source via melange (Go build of ./cmd/spicedb from the
# git tag tarball). Image-only (a server, no chart lives here). Latest patch of
# the last 2 minor lines (1.53, 1.54). Each release pins its source tarball by
# sha256. Single static Go binary, CGO disabled, built with the upstream release
# build tags (memoryprotection + -checklinkname=0). Version is stamped via -X on
# github.com/jzelinskie/cobrautil/v2.Version WITH a leading "v" (per upstream
# .goreleaser.yml), so `spicedb version` reports the real release.
FROM_SOURCE=1
VERSIONS=(1.54.0)
declare -A SHA256=(
  [1.54.0]=16ddc20aab4afaa00ab2ed439a196b510fb20bd72ce66fdd602b1a44da07e11d
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
