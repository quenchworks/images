# spicedb (authzed): from-source via melange (Go build of ./cmd/spicedb from the
# git tag tarball). Image-only (a server, no chart lives here). NEWEST STABLE
# ONLY. Each release pins its source tarball by sha256. Single static Go binary,
# CGO disabled, built with the upstream release build tags (memoryprotection +
# -checklinkname=0). Version is stamped via -X on
# github.com/jzelinskie/cobrautil/v2.Version WITH a leading "v" (per upstream
# .goreleaser.yml), so `spicedb version` reports the real release.
#
# 1.54.0 -> 1.56.0: upstream moved its own module graph past the house 0-CVE
# floors (x/net 0.57.0, x/text 0.40.0, x/crypto 0.54.0, x/sys 0.47.0, grpc
# 1.82.1) and dropped the docker/docker replace, which clears three of the four
# CVEs the 1.54.0 image carried. Only google/cel-go still needs floating.
FROM_SOURCE=1
VERSIONS=(1.56.0)
declare -A SHA256=(
  [1.56.0]=e8c15ecc241e3f50feeab0c63062c961e4558608f25376623ce38e44ec3897b1
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
