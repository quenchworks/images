# Assembles the Gotify server runtime image. Minimal, nonroot (uid 1001),
# multi-arch, SBOM by apko. Gotify is a push-notification server: the entrypoint
# is the static binary, which reads all config from GOTIFY_-prefixed env vars
# (configor), so no config file or wrapper is needed. ca-certificates-bundle is
# included for outbound TLS (plugins, webhooks) and Let's Encrypt.
#
# Read-only rootfs friendly. Gotify needs ONE writable tree, created here owned by
# the nonroot uid 1001 and meant to be mounted as a volume:
#   /app/data -> the SQLite DB (gotify.db), uploaded images, plugins, and (if
#                enabled) the Let's Encrypt cache. Auto-created/populated on first
#                run. Everything else (the binary, the embedded UI) is read-only.
#
# Upstream defaults the HTTP port to 80, which a nonroot user cannot bind. We set
# GOTIFY_SERVER_PORT=8080 (>1024) so the server binds it without any capability.
# listenaddr is empty by default -> binds all interfaces (reachable in a
# container). Override any of these at runtime with the matching GOTIFY_* env var.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-gotify@local

accounts:
  groups:
    - groupname: gotify
      gid: 1001
  users:
    - username: gotify
      uid: 1001
      gid: 1001
  run-as: 1001

environment:
  GOTIFY_SERVER_PORT: "8080"
  GOTIFY_DATABASE_DIALECT: sqlite3
  GOTIFY_DATABASE_CONNECTION: /app/data/gotify.db
  GOTIFY_UPLOADEDIMAGESDIR: /app/data/images
  GOTIFY_PLUGINSDIR: /app/data/plugins

paths:
  - path: /app/data
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o755

entrypoint:
  command: /usr/bin/gotify

work-dir: /app

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-gotify"
  org.opencontainers.image.licenses: "MIT"
