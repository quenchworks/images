# Gotify server (gotify/server): from-source via melange. Image-only (a self-
# hosted push-notification server, no chart). NEWEST-ONLY: the single newest
# stable release (upstream tags carry a "v" prefix; the stamped version is the
# bare X.Y.Z). Each release pins its source tarball by sha256.
#
# Go backend that go:embeds a Vite/React web UI (`//go:embed build/*` in
# ui/serve.go), so the frontend is (re)built with yarn+Node in the build sandbox
# first (see melange.yaml) -- the tag ships ui/build gitignored (empty), so an
# embed with no UI would not even compile. The SQLite storage engine is
# gorm.io/driver/sqlite -> mattn/go-sqlite3 (CGO), so the binary is built
# CGO_ENABLED=1 and statically linked against musl (like apps/rqlite). Version is
# stamped via upstream's -X on main.Version/Commit/BuildDate/Mode.
FROM_SOURCE=1
VERSIONS=(2.9.1)
declare -A SHA256=(
  [2.9.1]=fcf3abc76d841f1a248272c20251ee6f2dc8ef2d6c21fda9f459f5c919389d15
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
