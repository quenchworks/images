# STATUS: ZLIB-ONLY as of 2026-09-16. Measured, not assumed: run 35065961958
# on af0623d gated with exactly one finding, zlib CVE-2026-85091, on every
# version and both arches. Nothing else in this image is flagged.
#
# This recipe carried an explicit BLOCKED=0 and so kept building and failing
# on every sweep. The measurement above is what changes it to 1: the gate
# cannot pass until Wolfi ships zlib 1.3.3-r0, which upstream madler/zlib
# has never tagged. Downgrading to Wolfi's 1.3.1-r51 is not a way out: it
# predates the 1.3.2-r0 fix for CVE-2026-27171.
#
# Clear it with scripts/blocked.py --dispatch once 1.3.3-r0 lands.
# STATUS 2026-08-27: UNBLOCKED by dropping the 8.x band. Re-tested all three
# bands locally (x86_64, comprehensive-mode Trivy, --ignore-unfixed):
#   10.0.111 -> 0 fixable CVEs, smoke test passed
#    9.0.120 -> 0 fixable CVEs, smoke test passed
#    8.0.127 -> 12 fixable (3 CRITICAL / 9 HIGH): CVE-2026-47304 (CRITICAL),
#               CVE-2026-47302, CVE-2026-50525, CVE-2026-50648, each reported
#               against all three of aspnet-8-runtime / dotnet-8 /
#               dotnet-8-runtime. Every one wants 8.0.129-r1.
# Wolfi's newest 8.x is still 8.0.127-r0 on BOTH x86_64 and aarch64 (checked
# against the live APKINDEX on 2026-08-27), so there is nothing to raise: this
# apko recipe installs the unpinned Wolfi package, it has no version floor of
# its own to bump. The 8.x band is therefore Wolfi-gated, not fixable here.
#
# The 8.x band is COMMENTED OUT rather than deleted so the two supported bands
# can keep shipping 0-CVE. RESTORE it (uncomment both lines, refresh the patch
# number) as soon as Wolfi publishes aspnet-8-runtime >= 8.0.129-r1.
# CATALOG COST while it is out: no quench-aspnet 8.0.x tag is refreshed, and the
# already-published 8.0.122 tag stays in GHCR un-rebuilt and dirty.
#
# The previous note also matched a build.conf that had been corrupted: VERSIONS
# was narrowed to (10.0.111) while PKG mapped 10.0.111 -> aspnet-8-runtime, so a
# build would have installed the 8.x runtime under a 10.x tag. Mapping fixed.
BLOCKED=1
# aspnet: Wolfi-packaged ASP.NET Core runtime, latest 3 major bands (8/9/10).
# VERSIONS holds the full X.Y.Z versions, used AS-IS as the image tag.
# Wolfi names the package by major (aspnet-N-runtime), which is NOT derivable
# from the full version without mangling, so PKG maps each version to its exact
# Wolfi package. apko.yaml's `__PKG__` is replaced with PKG[version].
# NOTE apko installs the package UNPINNED, so each tag must name the newest
# revision Wolfi actually carries for that band or the tag lies about content.
FROM_SOURCE=0
VERSIONS=(9.0.120 10.0.111)     # 8.0.127 held out -- see STATUS above
# test.sh takes its extra args from build-aspnet.yml, which passes "${1%%.*}" rather
# than the version. Mirrored here so the local gate matches CI; passing the
# version instead fails an image that runs fine.
boot_args() { echo "${1%%.*}"; }
declare -A PKG=(
# [8.0.127]=aspnet-8-runtime    # restore with VERSIONS when Wolfi ships 8.0.129-r1
  [9.0.120]=aspnet-9-runtime
  [10.0.111]=aspnet-10-runtime
)
render() { echo "s|__PKG__|${PKG[$1]}|g"; }
