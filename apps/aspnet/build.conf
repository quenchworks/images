# BLOCKED 2026-08-16: aspnet-8-runtime 8.0.127-r0 carries CVE-2026-47304 (CRITICAL),
# fixed in 8.0.129-r1 -- which Wolfi has NOT packaged yet (verified against the
# APKINDEX, newest is still 8.0.127-r0). The 10.x line bumped fine to 10.0.111;
# the 8.x line is what blocks the image. NOTE the currently PUBLISHED image has
# this same CRITICAL, since 8.0.127 was already shipped -- this is a newly filed
# advisory against an existing version, not a regression from the bump.
# UNBLOCK when Wolfi ships aspnet-8-runtime/dotnet-8-runtime >= 8.0.129-r1.
BLOCKED=1
# aspnet: Wolfi-packaged ASP.NET Core runtime, latest 3 major bands (8/9/10).
# VERSIONS holds the full X.Y.Z versions, used AS-IS as the image tag.
# Wolfi names the package by major (aspnet-N-runtime), which is NOT derivable
# from the full version without mangling, so PKG maps each version to its exact
# Wolfi package. apko.yaml's `__PKG__` is replaced with PKG[version].
FROM_SOURCE=0
VERSIONS=(10.0.111)
declare -A PKG=(
  [10.0.111]=aspnet-8-runtime
)
render() { echo "s|__PKG__|${PKG[$1]}|g"; }
