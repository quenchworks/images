# RESOLVED 2026-11-19 (#117): the 2026-11-18 hold waited for Wolfi 10.0.115, which never comes public (dotnet-10 moved to enterprise-packages 2026-11-12). The image now packages Microsoft's official 10.0.15 release; see the 2026-11-19 note above VERSIONS.
# STATUS: UNBLOCKED 2026-09-20. The zlib block is gone: Wolfi shipped the fix
# for CVE-2026-85091 as zlib 1.3.2.1_rc20260601-r0 and the advisory was amended
# to name that version, so the 1.3.3-r0 this file used to wait for is a number
# that will never arrive. A stock wolfi-base scan reports the advisory as
# `zlib 1.3.2-r7 -> 1.3.2.1_rc20260601-r0`, which is what Wolfi publishes on
# both arches today. scripts/blocked.py now watches the shipped version.
#
# Evidence, stated exactly as measured:
#   x86_64  gated locally 2026-09-20, PUSH=0: 0 fixable CVEs AND the boot test
#           passed, so this is "runs", not just "scans clean".
#   aarch64 not measured locally; this host kills background melange builds and
#           a qemu-emulated arm build does not fit the foreground timeout. CI's
#           native arm64 runner is the first arm measurement, and its gate
#           refuses to publish on any finding.
# STATUS 2026-08-27: UNBLOCKED by dropping the 8.x band. Re-tested all three
# bands locally (x86_64, comprehensive-mode Trivy, --ignore-unfixed):
#   10.0.111 -> 0 fixable CVEs, smoke test passed
#    9.0.120 -> 0 fixable CVEs, smoke test passed
#    8.0.127 -> 12 fixable (3 CRITICAL / 9 HIGH): CVE-2026-47304 (CRITICAL),
#               CVE-2026-47302, CVE-2026-50525, CVE-2026-50648, each reported
#               against all three of aspnet-8-runtime / dotnet-8 /
#               dotnet-8-runtime. Every one wants 8.0.129-r1.
# Wolfi's newest 8.x is still 8.0.127-r0 on BOTH x86_64 and aarch64 (checked
# against the live APKINDEX on 2026-08-27), so there is nothing to raise: this
# apko recipe installs the unpinned Wolfi package, it has no version floor of
# its own to bump. The 8.x band is therefore Wolfi-gated, not fixable here.
#
# The 8.x band is COMMENTED OUT rather than deleted so the two supported bands
# can keep shipping 0-CVE. RESTORE it (uncomment both lines, refresh the patch
# number) as soon as Wolfi publishes aspnet-8-runtime >= 8.0.129-r1.
# CATALOG COST while it is out: no quench-aspnet 8.0.x tag is refreshed, and the
# already-published 8.0.122 tag stays in GHCR un-rebuilt and dirty.
#
# The previous note also matched a build.conf that had been corrupted: VERSIONS
# was narrowed to (10.0.111) while PKG mapped 10.0.111 -> aspnet-8-runtime, so a
# build would have installed the 8.x runtime under a 10.x tag. Mapping fixed.
BLOCKED=0
# HELD 2026-10-19 (9.0.121 line): CVE-2026-70159/84008/96958/96959/96960/70162 in
# dotnet-9 + aspnet-9-runtime 9.0.121-r2, fixed in 9.0.122-r0 (.NET 9.0.21, released 2026-10-13).
# Wolfi's newest on both arches today is 9.0.121-r2. HELD keeps 9.0.121 in VERSIONS (and the
# lock) but the prep job skips it, so the fixed 10.x line publishes. Unblock: drop it from
# HELD and bump to 9.0.122 once aspnet-9-runtime >= 9.0.122-r0 is in the APKINDEX.
HELD=(9.0.121)
# aspnet: Wolfi-packaged ASP.NET Core runtime, latest 3 major bands (8/9/10).
# VERSIONS holds the full X.Y.Z versions, used AS-IS as the image tag.
# Wolfi names the package by major (aspnet-N-runtime), which is NOT derivable
# from the full version without mangling, so PKG maps each version to its exact
# Wolfi package. apko.yaml's `__PKG__` is replaced with PKG[version].
# NOTE apko installs the package UNPINNED, so each tag must name the newest
# revision Wolfi actually carries for that band or the tag lies about content.
FROM_SOURCE=1
# RETIRED 2026-11-11: the 9.0 band. .NET 9 reached end of life on 2026-11-10 (Microsoft
#   releases-index.json: support-phase eol), and Wolfi moved dotnet-9 to enterprise-packages on
#   2026-10-13 (wolfi-dev/os "build(dotnet-9): move to enterprise-packages"), so the public index
#   stops at 9.0.121-r2 while CVE-2026-70159, -84008, -96958, -96959, -96960 and -70162 are fixed
#   only in 9.0.122-r0. Same treatment as 8.x: out of VERSIONS (and the lock); the published
#   9.0.121 tag stays pullable by exact tag. Move to 10.0 (active until 2028-11-14).
# 2026-11-19 (#117): Microsoft's official .NET 10.0.15 Linux tarball, not Wolfi. Wolfi moved dotnet-10 to
# enterprise-packages on 2026-11-12 (wolfi-dev/os #433300), so its public index stops at 10.0.114 while
# CVE-2026-114149 and CVE-2026-118747 are fixed in .NET 10.0.15. The tag stays on the SDK-band line (10.0.1xx);
# VER_RT is the runtime version inside. URL + sha512 per arch copied from
# https://builds.dotnet.microsoft.com/dotnet/release-metadata/10.0/releases.json.
VERSIONS=(10.0.115)
# test.sh takes its extra args from build-aspnet.yml, which passes "${1%%.*}" rather
# than the version. Mirrored here so the local gate matches CI; passing the
# version instead fails an image that runs fine.
boot_args() { echo "${1%%.*}"; }
declare -A VER_RT=( [10.0.115]=10.0.15 )
declare -A URL_X64=( [10.0.115]=https://builds.dotnet.microsoft.com/dotnet/aspnetcore/Runtime/10.0.15/aspnetcore-runtime-10.0.15-linux-x64.tar.gz )
declare -A SHA_X64=( [10.0.115]=704751c6d671b720935a18849e8f10cdb6938549e9cf25493050ebc838a95eb5cb1caa9936d2edae3b85c5975778ed926e9b736e3a2582d861411babba3229c3 )
declare -A URL_ARM=( [10.0.115]=https://builds.dotnet.microsoft.com/dotnet/aspnetcore/Runtime/10.0.15/aspnetcore-runtime-10.0.15-linux-arm64.tar.gz )
declare -A SHA_ARM=( [10.0.115]=1d82a6822871c0e750d2d3d3b9b27657d24a2083eb999c2f78b39b0cd10862178cb2c6d21f941579cd521baf5738a78d3378e5754c5895a93d7546135eb40ec6 )
render() {
  local v="$1"
  echo "s|__PKG__|quench-aspnet@local|g; s|__PKGNAME__|quench-aspnet|g; s|__VER__|$v|g; s|__VER_RT__|${VER_RT[$v]}|g;"\
"s|__URL_X64__|${URL_X64[$v]}|g; s|__SHA_X64__|${SHA_X64[$v]}|g; s|__URL_ARM__|${URL_ARM[$v]}|g; s|__SHA_ARM__|${SHA_ARM[$v]}|g"
}
