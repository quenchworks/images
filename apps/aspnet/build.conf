# aspnet: Wolfi-packaged .NET major bands (8 LTS, 9 STS, 10 LTS = latest 3).
# VERSIONS = the major lines we ship. apko installs `aspnet-<line>-runtime`
# (render substitutes __VER__ = the line). The PUBLISHED IMAGE TAG is the full
# X.Y.Z, resolved at build time from the Wolfi package version via wolfi_pkg()
# (the CI prep job reads APKINDEX -> e.g. aspnet-8-runtime = 8.0.122 -> tag 8.0.122).
FROM_SOURCE=0
VERSIONS=(8 9 10)
# Given a line, the Wolfi package whose full version becomes the image tag.
wolfi_pkg() { echo "aspnet-$1-runtime"; }
render() { echo "s/__VER__/$1/g"; }
