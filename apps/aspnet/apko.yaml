# Hardened ASP.NET Core RUNTIME image: melange.yaml packages Microsoft's official .NET Linux release tarball
# (sha512-verified, build.conf) on Wolfi glibc, ICU, zlib and OpenSSL 4, and apko installs that package.
# Until 10.0.114 this image installed Wolfi's apk directly; Wolfi moved dotnet-10 to enterprise-packages
# on 2026-11-12 (#117). No SDK here: build with quench-dotnet, run the output on this image.
#
# IMAGE-ONLY, no Helm chart: the signed, nonroot, multi-arch answer to `mcr.microsoft.com/dotnet/aspnet:N`.
# `__PKG__`, `__VER__` and the pins are build-time placeholders filled by build.conf render().
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - __PKG__      # Microsoft's official .NET release tarball, packaged by melange.yaml (Wolfi moved dotnet-10 to enterprise)

accounts:
  groups:
    - groupname: nonroot
      gid: 1001
  users:
    - username: nonroot
      uid: 1001
      gid: 1001
  run-as: 1001

# The .NET driver as the entrypoint: `docker run <img> --info`,
# `docker run <img> app.dll`, etc. Lives at /usr/bin/dotnet in Wolfi (provided
# by the dotnet-N host package pulled in transitively).
entrypoint:
  command: /usr/bin/dotnet

# .NET wants a writable HOME / CLI home for extraction caches and the first-run
# experience. Point them under a writable mount so the runtime works on a
# read-only rootfs. Telemetry + first-run banner are disabled for clean,
# reproducible, network-free runs.
environment:
  HOME: /home/nonroot
  DOTNET_CLI_HOME: /home/nonroot
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  # Bind Kestrel to all interfaces on 8080 by default so the image is usable as
  # a web-service base out of the box (overridable by the consuming app).
  ASPNETCORE_URLS: http://+:8080

work-dir: /home/nonroot

paths:
  - path: /home/nonroot
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o755

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-aspnet"
  org.opencontainers.image.licenses: "MIT"
