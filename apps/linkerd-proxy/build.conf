# linkerd-proxy (linkerd/linkerd2-proxy, a SEPARATE repo from linkerd2): from-
# source Rust build via melange.
#
# THE THING THIS TASK SPECIFICALLY FLAGGED AS THE RISK, CHECKED EXPLICITLY:
# istio-proxyv2 is BLOCKED because Istio's data plane bundles a Bazel/clang-
# built C++ Envoy FORK from a separate repo (istio/proxy) with no plain
# source-tarball-plus-compiler path. Linkerd's proxy is architecturally
# nothing like that: it is Linkerd's OWN from-scratch data plane, 100% Rust,
# built with plain `cargo build` (confirmed by reading linkerd2-proxy's own
# Dockerfile and justfile, not assumed -- `just build` resolves to a normal
# `cargo build --release --target <triple>`). There is no vendored C++ proxy
# engine here at all -- rustls + aws-lc-rs is the only "compiles vendored C
# code" surface, same ordinary Rust-dependency shape as the policy-controller
# (see that app's build.conf for why that is NOT the same risk class as
# Cosmian KMS's pinned-OpenSSL-download problem). This is genuinely buildable
# from source here, unlike istio-proxyv2.
#
# linkerd/linkerd2's own release process does NOT build this proxy -- it
# FETCHES a prebuilt release asset (confirmed by reading linkerd2's
# bin/fetch-proxy and Dockerfile.proxy: `ARG LINKERD2_PROXY_VERSION` +
# `bin/fetch-proxy` downloads `linkerd2-proxy-<version>-linux-<arch>.tar.gz`
# from linkerd2-proxy's OWN GitHub releases). This app builds it from that
# repo's real source tarball instead, on Wolfi, rather than repackaging
# upstream's binary release.
#
# VERSION PAIRING -- the proxy version is NOT independently chosen. It MUST
# match what each linkerd-control-plane release actually ships, or the data
# plane and control plane speak mismatched xDS/policy API versions. linkerd2's
# `.proxy-version` file at each of the three edge tags this factory builds
# gives the exact pin (read directly at each tag, not the tip of main):
#   edge-26.6.3 -> v2.359.0
#   edge-26.7.2 -> v2.363.0
#   edge-26.8.4 -> v2.366.0
# linkerd2-proxy's own tags are `release/vX.Y.Z` (confirmed:
# `gh api repos/linkerd/linkerd2-proxy/releases` lists tag_name values like
# "release/v2.367.0", NOT "vX.Y.Z" bare and NOT "stable-"/"edge-" like the
# linkerd2 monorepo -- a different convention per repo, checked rather than
# assumed to be the same).
#
# Rust toolchain: linkerd2-proxy's own rust-toolchain.toml reads channel =
# "1.90.0" at all three release/vX.Y.Z tags used here (checked per-tag).
# Same rust-1.90 Wolfi package as linkerd-policy-controller.
FROM_SOURCE=1
VERSIONS=(2.359.0 2.363.0 2.366.0)
declare -A SHA256=(
  [2.359.0]=41e7544bf79d33f692d610411531d00f0c66f025dafee46d0baf8957e85f35b5
  [2.363.0]=ae06cfd5c9e532d3ac4a333c2e74e0f4ba1e1418d6e81b610d270d1930df4cfd
  [2.366.0]=8439b8cace16730fc44e9fdfebbcfb509c5fd8237a4eec13d9b98f1277a1e84f
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
