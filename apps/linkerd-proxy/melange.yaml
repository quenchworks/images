# Builds linkerd2-proxy from source on Wolfi. Rust, from the linkerd/linkerd2-
# proxy repo (a separate repo/cadence from the linkerd2 monorepo -- see
# build.conf for the version-pairing rule and why this is buildable, unlike
# istio-proxyv2).
#
# Binary crate: `linkerd2-proxy/` (workspace member, package name
# `linkerd2-proxy`, binary name `linkerd2-proxy` -- confirmed by reading
# linkerd2-proxy/Cargo.toml, no [[bin]] override). Built with plain
# `cargo build --release -p linkerd2-proxy` from the workspace root, matching
# what linkerd2-proxy's own Dockerfile does via `just build` (which resolves
# to the equivalent `cargo build --release --target <triple>` -- read the
# justfile, don't reimplement its cross-compile machinery since melange
# already builds natively per-arch).
#
# TOOLCHAIN: same aws-lc-rs-via-rustls shape as linkerd-policy-controller (see
# that app's melange.yaml/build.conf for why this is an ordinary Rust
# dependency, not a Cosmian-style pinned-vendor-download problem) -- needs
# build-base, cmake, clang, perl, nasm. The workspace also pulls
# `kubert-prometheus-tokio` from a GIT dependency (same linkerd-kubert repo,
# pinned tag) -- needs `git` and CARGO_NET_GIT_FETCH_WITH_CLI=true.
#
# tikv-jemallocator is pulled only on the x86_64-unknown-linux-gnu target
# (`[target.x86_64-unknown-linux-gnu.dependencies]` in linkerd2-proxy/Cargo.toml)
# -- cargo skips it automatically on aarch64, nothing extra needed here.
#
# VERSION: linkerd2-proxy stamps its own build info at compile time via
# LINKERD2_PROXY_VERSION (read by main.rs as `BUILD_INFO.version`, generated by
# a build.rs -- this is this crate's equivalent of istiod's -ldflags -X, a
# real compile-time stamp, NOT a runtime env override like the Go control
# plane binary). Set from package.version below.
#
# Built with `cargo auditable` for the same reason as linkerd-policy-controller:
# Trivy's Rust dependency scanning needs the embedded Cargo.lock metadata to
# see anything at all in a compiled binary.
package:
  name: quench-linkerd-proxy
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Linkerd data-plane proxy (linkerd2-proxy: the Rust sidecar that terminates mTLS and routes meshed traffic), built from source on Wolfi. Version-paired to a specific linkerd-control-plane release per linkerd2's own .proxy-version pin (see build.conf)."
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - libgcc

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - curl
      - cmake
      - clang
      - perl
      - nasm
      - pkgconf
      - rust-1.90
      - cargo-auditable

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/linkerd/linkerd2-proxy/archive/refs/tags/release/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - runs: |
      set -eu
      export CARGO_NET_GIT_FETCH_WITH_CLI=true
      # kubert-prometheus-tokio has a compile_error! that fires without this, so
      # the build cannot complete at all:
      #   error: RUSTFLAGS='--cfg tokio_unstable' must be set to use `tokio-metrics/rt`
      # Upstream's own Dockerfile sets RUSTFLAGS="-D warnings -A deprecated
      # --cfg tokio_unstable" at release/v2.366.0. Only the cfg is copied here:
      # -D warnings promotes every warning to an error, which is right for their CI
      # and wrong for ours, where a newer rustc emitting one new warning would break
      # a build that is otherwise fine.
      export RUSTFLAGS='--cfg tokio_unstable'
      export LINKERD2_PROXY_VERSION="__VER__"
      export LINKERD2_PROXY_VENDOR="QuenchWorks"
      # 0-CVE float. With the build finally compiling, the gate found one MEDIUM:
      # opentelemetry_sdk 0.31.0, CVE-2026-48504 (unbounded memory allocation in
      # W3C baggage parsing), fixed in 0.32.1.
      #
      # Named with its exact source version because a bare `-p <crate>` is
      # ambiguous the moment a tree carries two majors, and cargo refuses rather
      # than guessing; the sibling recipe hit exactly that with rand. Asserted in
      # both directions afterwards, since arriving alongside the vulnerable copy
      # is not the same as replacing it.
      # Both shipped lines require opentelemetry_sdk "0.32", so the lockfile may sit
      # at 0.32.0 and the bare crate name is unambiguous. If a future version ever
      # brings in two majors, cargo refuses the bare -p outright rather than picking
      # one, and set -eu surfaces that with the ambiguity message intact.
      cargo update -p opentelemetry_sdk --precise 0.32.1
      cargo tree -i opentelemetry_sdk@0.32.1 >/dev/null 2>&1 \
        || { echo "opentelemetry_sdk did not reach 0.32.1"; exit 1; }
      # Cargo floor (2026-10-06 scan), the version-aware sibling of the --precise lines: raise
      # every locked copy of <crate> on the floor's own minor line that sits below the floor
      # (other lines are left alone), then assert none is left below it. Release versions
      # only, so sort -V orders them correctly.
      cfloor() {
        line="${2%.*}"
        locked() { awk -v n="$1" '$0=="name = \""n"\"" {getline; gsub(/version = |"/,""); print}' Cargo.lock; }
        for v in $(locked "$1"); do
          case "$v" in "$line".*) ;; *) continue ;; esac
          [ "$v" = "$2" ] && continue
          [ "$(printf '%s\n%s\n' "$v" "$2" | sort -V | head -1)" = "$v" ] || continue
          cargo update -p "$1@$v" --precise "$2"
        done
        for v in $(locked "$1"); do
          case "$v" in "$line".*) ;; *) continue ;; esac
          [ "$(printf '%s\n%s\n' "$v" "$2" | sort -V | head -1)" = "$2" ] \
            || { echo "$1 $v is still below the $2 floor"; exit 1; }
        done
      }
      cfloor rustls 0.23.45            # GHSA-2mjx-qc3c-rqvc
      # hickory moves as a family: resolver 0.26.2 uses NetError variants that only
      # hickory-proto/hickory-net 0.26.2 define (resolver alone failed to compile, E0599).
      cfloor hickory-proto 0.26.2
      cfloor hickory-net 0.26.2
      cfloor hickory-resolver 0.26.2   # GHSA-5j98-2g5x-46v6, -6w6g-hm98-mhgm, -6f2x-v7q7-m7m5
      cargo auditable build --release --locked -p linkerd2-proxy

      install -Dm755 target/release/linkerd2-proxy \
        "${{targets.destdir}}/usr/lib/linkerd/linkerd2-proxy"
      # /usr/bin symlink so the binary shows up where every other app in this
      # catalog puts its main executable, and so a plain `docker run <image>`
      # (no path knowledge needed) works for the smoke test below. The real
      # chart is free to invoke either path.
      install -d "${{targets.destdir}}/usr/bin"
      ln -s /usr/lib/linkerd/linkerd2-proxy "${{targets.destdir}}/usr/bin/linkerd2-proxy"

  - runs: |
      set -eu
      # linkerd2-network-validator: with CNI on (no proxy-init), the injector adds a
      # linkerd-network-validator init container that runs this binary from the proxy image.
      # linkerd2's Dockerfile.proxy fetches validator/v0.1.9 (LINKERD_VALIDATOR_VERSION, the same on
      # edge-26.7.2, 26.8.4 and 26.9.3) as a prebuilt; build that tag from source instead.
      export RUSTFLAGS='--cfg tokio_unstable'
      V="$PWD/.validator"; mkdir -p "$V"
      curl -fsSL -o "$V/src.tgz" "https://github.com/linkerd/linkerd2-proxy-init/archive/refs/tags/validator/v0.1.9.tar.gz"
      echo "f9d2fa777704dfa7b1b613abc0b4f0c25cc1869985d71983fb7ae19e30e77d3a  $V/src.tgz" | sha256sum -c -
      tar -xzf "$V/src.tgz" -C "$V" --strip-components=1
      cd "$V"
      cfloor() {
        line="${2%.*}"
        locked() { awk -v n="$1" '$0=="name = \""n"\"" {getline; gsub(/version = |"/,""); print}' Cargo.lock; }
        for v in $(locked "$1"); do
          case "$v" in "$line".*) ;; *) continue ;; esac
          [ "$v" = "$2" ] && continue
          [ "$(printf '%s\n%s\n' "$v" "$2" | sort -V | head -1)" = "$v" ] || continue
          cargo update -p "$1@$v" --precise "$2"
        done
        for v in $(locked "$1"); do
          case "$v" in "$line".*) ;; *) continue ;; esac
          [ "$(printf '%s\n%s\n' "$v" "$2" | sort -V | head -1)" = "$2" ] \
            || { echo "$1 $v is still below the $2 floor"; exit 1; }
        done
      }
      cfloor rustls 0.23.45   # GHSA-2mjx-qc3c-rqvc
      cfloor rand 0.9.3       # GHSA-cq8v-f236-94qc
      cargo auditable build --release --locked -p linkerd-network-validator
      install -Dm755 target/release/linkerd-network-validator \
        "${{targets.destdir}}/usr/lib/linkerd/linkerd2-network-validator"

  - uses: strip

test:
  pipeline:
    - runs: |
        test -x /usr/lib/linkerd/linkerd2-proxy
        test -x /usr/lib/linkerd/linkerd2-network-validator
