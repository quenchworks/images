# Builds Argo Events and the argo CLI from their tag tarballs onto Wolfi.
package:
  name: quench-argo-events
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Argo Events, built from source on Wolfi, with the argo CLI"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata               # calendar EventSources run in the configured timezone

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - patch              # the go-jose v4 port below
      - ca-certificates-bundle
      - curl
      - go

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/argoproj/argo-events/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - name: Build argo-events
    runs: |
      set -eu
      export CGO_ENABLED=0 GOFLAGS=-mod=mod GO111MODULE=on GOTOOLCHAIN=local
      # ---- 0-CVE module float (docs/go-module-float.md) ----------------------
      # FLOOR is a FLOOR, not a pin: only modules below it are floated, and the shipped
      # binary is asserted to carry nothing below it. Measured 2026-09-25 on 1.9.11:
      # go-git 5.19.1, amqp091-go 1.11.0, x/crypto 0.54.0, x/mod 0.38.0, grpc 1.82.0.
      # pulsar-client-go 0.12.0 pulls github.com/golang-jwt/jwt v3.2.2 (CVE-2025-30204,
      # never fixed on v3); 0.21.0 uses jwt/v5, so v3 drops out of the binary.
      FLOOR="github.com/go-git/go-git/v5@v5.19.2 github.com/rabbitmq/amqp091-go@v1.14.0 golang.org/x/crypto@v0.58.1-0.20261009181718-2f1f834330b2 golang.org/x/net@v0.62.0 golang.org/x/text@v0.43.0 golang.org/x/sys@v0.49.0 golang.org/x/mod@v0.41.0 google.golang.org/grpc@v1.83.2 github.com/apache/pulsar-client-go@v0.21.0 github.com/klauspost/compress@v1.19.1 github.com/go-jose/go-jose/v4@v4.1.6"
      MODS="$(echo "$FLOOR" | tr ' ' '\n' | cut -d@ -f1)"
      below_floor() {
        awk -v floor="$FLOOR" -v tag="$1" '
          BEGIN { n = split(floor, f, " ")
                  for (i = 1; i <= n; i++) { split(f[i], kv, "@"); want[kv[1]] = kv[2] } }
          ($1 in want) {
            split(substr($2, 2), g, "."); split(substr(want[$1], 2), w, ".")
            for (i = 1; i <= 3; i++) {
              if ((g[i] + 0) > (w[i] + 0)) next
              if ((g[i] + 0) < (w[i] + 0)) { print $1 "@" want[$1] " (" tag " has " $2 ")"; next }
            }
          }'
      }
      go list -m -e $MODS
      need="$(go list -m -e $MODS | awk 'NF >= 2 && $NF ~ /^v[0-9]/ { print $1, $NF }' | below_floor go.mod | awk '{ print $1 }')"
      if [ -n "$need" ]; then go get $need; fi
      go mod tidy
      P=github.com/argoproj/argo-events
      go build -trimpath -ldflags "-s -w -X $P.version=v${{package.version}} -X $P.gitTag=v${{package.version}} -X $P.gitTreeState=clean" \
        -o "${{targets.destdir}}/usr/bin/argo-events" ./cmd
      bad="$(go version -m "${{targets.destdir}}/usr/bin/argo-events" \
        | awk '$1 == "dep" || $1 == "=>" { print $2, $3 }' | below_floor argo-events)"
      [ -z "$bad" ] || { echo "❌ 0-CVE float did not reach argo-events:"; echo "$bad"; exit 1; }
      if go version -m "${{targets.destdir}}/usr/bin/argo-events" | grep -qE '[[:space:]]github.com/golang-jwt/jwt[[:space:]]'; then
        echo "❌ golang-jwt/jwt v3 is still linked into argo-events"; exit 1
      fi
  - name: Build the argo CLI (argoWorkflow trigger)
    runs: |
      set -eu
      export CGO_ENABLED=0 GOFLAGS=-mod=mod GO111MODULE=on GOTOOLCHAIN=local
      V=__ARGO_VER__
      curl -fsSL -o aw.tar.gz "https://github.com/argoproj/argo-workflows/archive/refs/tags/v$V.tar.gz"
      echo "__ARGO_SHA256__  aw.tar.gz" | sha256sum -c -
      mkdir aw && tar -xzf aw.tar.gz -C aw --strip-components=1 && cd aw
      # the CLI embeds ui/dist for its server subcommand, which a sensor never runs
      mkdir -p ui/dist/app && touch ui/dist/app/index.html
      # the same coherent set as apps/argo-workflows
      # 0-CVE FLOORS, not pins (docs/go-module-float.md): raise a module only where go.mod has it
      # below the floor; a module absent from the graph is skipped. Bare `go get` pins downgraded
      # newer upstream releases (found 2026-10-05).
      # go-jose v3 has no fixed release for CVE-2026-116587, -116585 and -116586 (fixed in v4 4.1.6
      # only). Lines before 4.1 import v3 in server/auth; port upstream c786f25b9c + 326c5d77b7 (the v4
      # API: SSO session tokens are signed, then encrypted, so existing SSO sessions log in once more).
      # 4.1.x ships this already and skips the block.
      if grep -q 'github.com/go-jose/go-jose/v3 ' go.mod; then
        f=server/auth/sso/sso.go
        find . -name '*.go' -exec grep -l 'github.com/go-jose/go-jose/v3' {} + | xargs sed -i 's|github.com/go-jose/go-jose/v3|github.com/go-jose/go-jose/v4|'
        sed -i 's|jwt.Encrypted(s.encrypter).Claims(argoClaims).CompactSerialize()|jwt.Encrypted(s.encrypter).Claims(argoClaims).Serialize()|' "$f"
        patch -p1 <<'PATCH'
      diff --git a/server/auth/sso/sso.go b/server/auth/sso/sso.go
      --- a/server/auth/sso/sso.go
      +++ b/server/auth/sso/sso.go
      @@ -59,6 +59,7 @@ type sso struct {
       	baseHRef          string
       	secure            bool
       	privateKey        crypto.PrivateKey
      +	signer            jose.Signer
       	encrypter         jose.Encrypter
       	rbacConfig        *config.RBACConfig
       	expiry            time.Duration
      @@ -190,7 +191,12 @@ func newSso(
       		Scopes:       append(c.Scopes, oidc.ScopeOpenID),
       	}
       	idTokenVerifier := provider.Verifier(&oidc.Config{ClientID: config.ClientID})
      -	encrypter, err := jose.NewEncrypter(jose.A256GCM, jose.Recipient{Algorithm: jose.RSA_OAEP_256, Key: privateKey.Public()}, &jose.EncrypterOptions{Compression: jose.DEFLATE})
      +	signer, err := jose.NewSigner(jose.SigningKey{Algorithm: jose.RS256, Key: privateKey}, nil)
      +	if err != nil {
      +		return nil, fmt.Errorf("failed to create JWT signer: %w", err)
      +	}
      +	encrypterOptions := (&jose.EncrypterOptions{Compression: jose.DEFLATE}).WithContentType("JWT")
      +	encrypter, err := jose.NewEncrypter(jose.A256GCM, jose.Recipient{Algorithm: jose.RSA_OAEP_256, Key: privateKey.Public()}, encrypterOptions)
       	if err != nil {
       		return nil, fmt.Errorf("failed to create JWT encrpytor: %w", err)
       	}
      @@ -220,6 +226,7 @@ func newSso(
       		httpClient:        httpClient,
       		secure:            secure,
       		privateKey:        privateKey,
      +		signer:            signer,
       		encrypter:         encrypter,
       		rbacConfig:        c.RBAC,
       		expiry:            c.GetSessionExpiry(),
      @@ -340,7 +347,7 @@ func (s *sso) HandleCallback(w http.ResponseWriter, r *http.Request) {
       		PreferredUsername:       c.PreferredUsername,
       		ServiceAccountNamespace: c.ServiceAccountNamespace,
       	}
      -	raw, err := jwt.Encrypted(s.encrypter).Claims(argoClaims).Serialize()
      +	raw, err := jwt.SignedAndEncrypted(s.signer, s.encrypter).Claims(argoClaims).Serialize()
       	if err != nil {
       		s.logger.WithError(err).Error(r.Context(), "failed to encrypt and serialize the jwt token")
       		w.WriteHeader(http.StatusUnauthorized)
      PATCH
        cat > /tmp/authorize.go <<'GO'
      func (s *sso) Authorize(authorization string) (*types.Claims, error) {
      	enc, err := jose.ParseEncrypted(strings.TrimPrefix(authorization, Prefix), []jose.KeyAlgorithm{jose.RSA_OAEP_256}, []jose.ContentEncryption{jose.A256GCM})
      	if err != nil {
      		return nil, fmt.Errorf("failed to parse encrypted token: %w", err)
      	}
      	payload, err := enc.Decrypt(s.privateKey)
      	if err != nil {
      		return nil, fmt.Errorf("failed to decrypt token: %w", err)
      	}
      	tok, err := jwt.ParseSigned(string(payload), []jose.SignatureAlgorithm{jose.RS256})
      	if err != nil {
      		return nil, fmt.Errorf("failed to parse signed token: %w", err)
      	}
      	c := &types.Claims{}
      	if err := tok.Claims(s.privateKey.(*rsa.PrivateKey).Public(), c); err != nil {
      		return nil, fmt.Errorf("failed to verify signed token: %w", err)
      	}
      	if err := c.Validate(jwt.Expected{Issuer: issuer}); err != nil {
      		return nil, fmt.Errorf("failed to validate claims: %w", err)
      	}
      	return c, nil
      }
      GO
        awk 'BEGIN{skip=0}
        /^func \(s \*sso\) Authorize\(authorization string\)/ {skip=1; while ((getline l < "/tmp/authorize.go") > 0) print l; next}
        skip && /^}/ {skip=0; next}
        !skip {print}' "$f" > "$f.new" && mv "$f.new" "$f"
        if ! grep -q '"crypto/rsa"' "$f"; then
          awk '!d && /^import \(/ {print; print "\t\"crypto/rsa\""; d=1; next} {print}' "$f" > "$f.new"
          mv "$f.new" "$f"
        fi
        go mod tidy
        ! grep -q 'go-jose/go-jose/v3' go.mod
      fi
      FLOOR="golang.org/x/net@v0.62.0 golang.org/x/sys@v0.49.0 google.golang.org/grpc@v1.83.2 golang.org/x/crypto@v0.58.1-0.20261009181718-2f1f834330b2 golang.org/x/text@v0.43.0 github.com/go-git/go-git/v5@v5.19.2 go.opentelemetry.io/otel@v1.47.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.47.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.47.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.47.0 go.opentelemetry.io/otel/sdk@v1.47.0 go.opentelemetry.io/otel/trace@v1.47.0 go.opentelemetry.io/otel/metric@v1.47.0 github.com/klauspost/compress@v1.19.1 github.com/go-jose/go-jose/v4@v4.1.6"
      # Go semver order (a release outranks its prereleases); busybox sort -V does not.
      vlt() { awk -v a="${1#v}" -v b="${2#v}" 'function pp(s,  p){sub(/\+.*/,"",s);p=index(s,"-");if(p){C=substr(s,1,p-1);P=substr(s,p+1)}else{C=s;P=""}} function cmp(x,y,  i,n,m,X,Y){n=split(x,X,".");m=split(y,Y,".");for(i=1;i<=n&&i<=m;i++){if(X[i]==Y[i])continue;if(X[i]~/^[0-9]+$/&&Y[i]~/^[0-9]+$/)return (X[i]+0<Y[i]+0)?-1:1;if(X[i]~/^[0-9]+$/)return -1;if(Y[i]~/^[0-9]+$/)return 1;return (X[i]<Y[i])?-1:1}return (n<m)?-1:(n>m)?1:0} BEGIN{pp(a);ca=C;pa=P;pp(b);cb=C;pb=P;c=cmp(ca,cb);if(c==0){if(pa==pb)c=0;else if(pa=="")c=1;else if(pb=="")c=-1;else c=cmp(pa,pb)}exit !(c<0)}'; }
      need=""
      for mv in $FLOOR; do
        have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${mv%@*}" 2>/dev/null)"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        vlt "$have" "${mv#*@}" && need="$need $mv"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || go get $need
      go mod tidy
      go build -trimpath -ldflags "-s -w -X github.com/argoproj/argo-workflows/v3.version=v$V -X github.com/argoproj/argo-workflows/v3.gitTag=v$V -X github.com/argoproj/argo-workflows/v3.gitTreeState=clean" \
        -o "${{targets.destdir}}/usr/bin/argo" ./cmd/argo

test:
  pipeline:
    - runs: |
        test -x /usr/bin/argo-events
        argo version --short | grep -F "v__ARGO_VER__"
