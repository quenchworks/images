# argo-events: Argo Events, the event-driven automation framework for Kubernetes
# (EventSources for webhooks, queues, schedules and cloud events; Sensors that trigger
# workflows, resources and HTTP calls; the EventBus), built from source. One static Go
# binary serves as controller, eventsource and sensor; no CGO.
#
# The image also carries the argo CLI, as upstream's does: the Sensor's argoWorkflow
# trigger runs `argo submit`. It is built from the argo-workflows 3.7 source (the line
# upstream bundles) with the same float as apps/argo-workflows.
#
# 0-CVE: melange.yaml floats go-git, amqp091-go, grpc and the golang.org/x set for
# argo-events (measured 2026-09-25: 8 findings, 0 after), and the argo-workflows float
# set for the CLI (0 after).
#
# NEWEST-ONLY: upstream ships one line (1.9.x).
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(1.9.11)
declare -A SHA256=(
  [1.9.11]=b967b1d64a85f9ccabb7ac171553bcb2a15666d7b60c9e8cb412dfd182a7676a
)
# the argo CLI bundled into every version, and the sha256 of its source tarball
ARGO_CLI_VERSION=3.7.18
ARGO_CLI_SHA256=3d9ba1bb2cf4b6d306a8895b2f5ca7eae9850c55008fd0e525295c773b06e3d4
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g; s|__ARGO_VER__|$ARGO_CLI_VERSION|g; s|__ARGO_SHA256__|$ARGO_CLI_SHA256|g"; }
