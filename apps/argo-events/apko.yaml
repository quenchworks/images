# Argo Events runtime image. Minimal, nonroot, multi-arch, SBOM by apko.
# One binary: `argo-events controller`, `argo-events eventsource-service`,
# `argo-events sensor-service`. The controller starts EventSource and Sensor pods from
# this same image (the chart passes it as ARGO_EVENTS_IMAGE).
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - tzdata
    - quench-argo-events@local

accounts:
  groups:
    - groupname: nonroot
      gid: 1001
  users:
    - username: nonroot
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/bin/argo-events

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-argo-events"
  org.opencontainers.image.licenses: "Apache-2.0"
