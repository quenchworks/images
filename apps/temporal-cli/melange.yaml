# Builds the Temporal CLI (`temporal`) from source onto Wolfi. This is the
# command-line client for Temporal -- the companion to the already-shipped
# quench-temporal server image (same upstream org, temporalio). It talks to a
# Temporal frontend over gRPC, e.g.:
#   temporal --address <host>:7233 workflow list
#   temporal operator namespace create ...
# and also bundles a dev-server (`temporal server start-dev`) for local use.
#
# ONE static, CGO-free (CGO_ENABLED=0) Go binary, multi-arch. Output is a signed
# APK in QuenchWorks' own repo -- no upstream distro binaries.
#
# Build notes:
#   - Upstream cmd is ./cmd/temporal, binary name `temporal` (matches upstream's
#     .goreleaser.yml: dir cmd/temporal, binary temporal).
#   - The release version is injected via ldflags into
#     github.com/temporalio/cli/internal/temporalcli.Version (default "0.0.0-DEV"),
#     exactly as upstream's goreleaser does
#     (-X .../internal/temporalcli.Version={{.Version}}). `temporal --version`
#     then prints e.g. "1.7.2 (Server <ver>, UI <ver>)".
#   - go.mod requires go >= 1.26.x; use the current go-1.26 Wolfi toolchain to
#     pick up the latest stdlib CVE fixes (clears the Trivy gate without manual
#     bumps). GOTOOLCHAIN=local pins to that toolchain.
#   - The generated sources (internal/temporalcli/commands.gen.go,
#     cliext/flags.gen.go) are committed in the release tarball, so no `make gen`
#     / codegen step is needed -- a plain `go build ./cmd/temporal` works.
#   - No vendor/ dir; melange fetches modules via the default module proxy
#     (GOFLAGS=-mod=mod).
package:
  name: quench-temporal-cli
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Temporal CLI (the `temporal` command-line client for the Temporal workflow engine), built from source on Wolfi"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle    # TLS to the frontend over gRPC

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      # go.mod requires go >= 1.26.x; use the current go-1.26 toolchain.
      - go-1.26

pipeline:
  # Build from the git tag source tarball. Pinned to the tag; verified by sha256.
  - uses: fetch
    with:
      uri: https://github.com/temporalio/cli/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      export CGO_ENABLED=0
      export GOTOOLCHAIN=local
      export GOFLAGS=-mod=mod

      # 0-CVE bump: force every module Trivy flags as a FIXED advisory up to its
      # patched release before building. The newest CLI tag (1.7.2) already pins
      # these at/above the fix floor, so the bumps are no-ops there; the older
      # tags still built by the matrix (1.5.1, 1.6.2) pin vulnerable versions and
      # need the lift. All are behavior-preserving patch/minor bumps within the
      # same major (grpc/x-net/x-text/x-crypto/otel/thrift/pgx/go-jose/
      # edwards25519/gomarkdown) plus a same-minor patch of the bundled dev-server
      # (go.temporal.io/server 1.29.1 -> 1.29.6, clears CVE-2025-14987 +
      # CVE-2026-5724) and the AWS lambda leaf (GHSA-xmrv-pmrh-hhx2). tidy keeps
      # go.sum consistent. x/text v0.38.0 -> v0.39.0 clears CVE-2026-56852
      # (infinite loop on invalid input).
      # 0-CVE FLOORS, not pins (docs/go-module-float.md): raise a module only where go.mod has it
      # below the floor; a module absent from the graph is skipped. Bare `go get` pins downgraded
      # newer upstream releases (found 2026-10-05).
      FLOOR="github.com/labstack/echo/v4@v4.15.4 github.com/aws/aws-sdk-go-v2/service/lambda@v1.88.5 golang.org/x/net@v0.58.0 golang.org/x/text@v0.41.0 golang.org/x/crypto@v0.56.0 google.golang.org/grpc@v1.83.2 github.com/jackc/pgx/v5@v5.9.2 github.com/go-jose/go-jose/v4@v4.1.4 github.com/apache/thrift@v0.24.0 github.com/gomarkdown/markdown@v0.0.0-20260411013819-759bbc3e3207 filippo.io/edwards25519@v1.1.1 go.opentelemetry.io/otel@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.45.0 go.opentelemetry.io/otel/sdk@v1.45.0 go.temporal.io/server@v1.29.6"
      # Go semver order (a release outranks its prereleases); busybox sort -V does not.
      vlt() { awk -v a="${1#v}" -v b="${2#v}" 'function pp(s,  p){sub(/\+.*/,"",s);p=index(s,"-");if(p){C=substr(s,1,p-1);P=substr(s,p+1)}else{C=s;P=""}} function cmp(x,y,  i,n,m,X,Y){n=split(x,X,".");m=split(y,Y,".");for(i=1;i<=n&&i<=m;i++){if(X[i]==Y[i])continue;if(X[i]~/^[0-9]+$/&&Y[i]~/^[0-9]+$/)return (X[i]+0<Y[i]+0)?-1:1;if(X[i]~/^[0-9]+$/)return -1;if(Y[i]~/^[0-9]+$/)return 1;return (X[i]<Y[i])?-1:1}return (n<m)?-1:(n>m)?1:0} BEGIN{pp(a);ca=C;pa=P;pp(b);cb=C;pb=P;c=cmp(ca,cb);if(c==0){if(pa==pb)c=0;else if(pa=="")c=1;else if(pb=="")c=-1;else c=cmp(pa,pb)}exit !(c<0)}'; }
      need=""
      for mv in $FLOOR; do
        have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${mv%@*}" 2>/dev/null)"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        vlt "$have" "${mv#*@}" && need="$need $mv"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || go get $need
      go mod tidy

      # Stamp the version exactly like upstream's goreleaser so
      # `temporal --version` reports the pinned release. -s -w strips debug info.
      LDFLAGS="-s -w -X github.com/temporalio/cli/internal/temporalcli.Version=${{package.version}}"

      install -d "${{targets.destdir}}/usr/bin"
      go build -trimpath -ldflags "${LDFLAGS}" \
        -o "${{targets.destdir}}/usr/bin/temporal" ./cmd/temporal

      # license marker for provenance
      install -d "${{targets.destdir}}/usr/share/doc/temporal-cli"
      cp LICENSE "${{targets.destdir}}/usr/share/doc/temporal-cli/" 2>/dev/null || true

test:
  pipeline:
    - runs: |
        temporal --version
        temporal --help
