# temporal-cli: from-source via melange (Go build of temporalio/cli). Latest 3
# stable minor lines, newest patch each. Image-only. Each pins its tarball by sha256.
FROM_SOURCE=1
VERSIONS=(1.5.1 1.6.2 1.7.3)
declare -A SHA256=(
  [1.5.1]=7f0e9ac007df107f6efc05e8ac257642956ec0e04d565bf800ccc3ce62cf70dd
  [1.6.2]=7e94dd43b95ca69e9710bed504adf159c60e844c8000fe6bd80470685049a136
  [1.7.3]=d28187545061eb41ef36041ef2045d8ea63fd55da9551b60a32bd9cb80f7ce52
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
