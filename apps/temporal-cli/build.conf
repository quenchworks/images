# temporal-cli: from-source via melange (Go build of temporalio/cli). Latest 3
# stable minor lines, newest patch each. Image-only. Each pins its tarball by sha256.
FROM_SOURCE=1
VERSIONS=(1.7.3 1.8.2 1.8.3)
declare -A SHA256=(
  [1.7.3]=d28187545061eb41ef36041ef2045d8ea63fd55da9551b60a32bd9cb80f7ce52
  [1.8.2]=b54917441b43fb17634b862a1966337fc129a927290eb45a86cca85e96bea086
  [1.8.3]=14280dbc5f157373a2b34d7d333dd0c8f1b8506fa9ff5b332edc9048527af6f8
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
