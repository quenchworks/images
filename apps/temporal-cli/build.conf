# temporal-cli: from-source via melange (Go build of temporalio/cli). Latest 3
# stable minor lines, newest patch each. Image-only. Each pins its tarball by sha256.
FROM_SOURCE=1
VERSIONS=(1.10.1)
declare -A SHA256=(
  [1.10.1]=80e81a40a2da38f6ec13bc61e9cd4dd9441ba865507cd253cf94850538dc9a9a
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
