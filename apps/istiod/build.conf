# istiod (istio/istio monorepo): from-source via melange. Builds the
# `pilot-discovery` binary (Pilot/xDS discovery + injecting webhook + CA), the
# Istio control plane's own image. image+chart (keep the charts-repo dispatch).
# Latest patch of the last 3 minor lines (1.28, 1.29, 1.30). Upstream tags carry
# NO "v" prefix on istio/istio (bare X.Y.Z), confirmed against the real releases
# API and tag list. Single static Go binary, no CGO (matches upstream's own
# gobuild.sh: CGO_ENABLED defaults to 0, STATIC=1). Version is stamped via -X on
# istio.io/istio/pkg/version.buildVersion, the same var upstream's own
# common/scripts/report_build_info.sh stamps for a release build.
#
# Main package + build flags verified by reading the real upstream build system
# (Makefile.core.mk + common/scripts/gobuild.sh + report_build_info.sh), not
# guessed:
#   STANDARD_BINARIES := ./istioctl/cmd/istioctl ./pilot/cmd/pilot-discovery ...
#   STANDARD_TAGS := vtprotobuf,disable_pgv
#   gobuild.sh:  CGO_ENABLED=${CGO_ENABLED:-0}; LDFLAGS default -extldflags -static
