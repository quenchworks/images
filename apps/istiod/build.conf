# NO "v" prefix on istio/istio (bare X.Y.Z), confirmed against the real releases
# API and tag list. Single static Go binary, no CGO (matches upstream's own
# gobuild.sh: CGO_ENABLED defaults to 0, STATIC=1). Version is stamped via -X on
# istio.io/istio/pkg/version.buildVersion, the same var upstream's own
# common/scripts/report_build_info.sh stamps for a release build.
