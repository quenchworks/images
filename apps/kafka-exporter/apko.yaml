# Assembles the kafka-exporter image: nonroot uid 1001, metrics on 9308.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-kafka-exporter@local

accounts:
  groups:
    - groupname: kafka-exporter
      gid: 1001
  users:
    - username: kafka-exporter
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/bin/kafka_exporter

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-kafka-exporter"
  org.opencontainers.image.licenses: "Apache-2.0"
