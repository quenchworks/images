# kafka-exporter (danielqsj/kafka_exporter): Prometheus exporter for Kafka brokers,
# topics, partitions and consumer-group lag. From source via melange, static Go
# (netgo, CGO off), version stamped through prometheus/common/version as upstream's
# .promu.yml does. Latest patch of the last 3 minor lines.
FROM_SOURCE=1
VERSIONS=(1.8.0 1.9.0 1.10.0)
declare -A SHA256=(
  [1.8.0]=7bac8b4159d47bd44899144f58c99da6a841a427e7a2cc663444466127421ea9
  [1.9.0]=8297e68a601374d7815b9474a210e39dc1e7f1735ecfc3b5647b814c0bb0b92f
  [1.10.0]=b76e9882a07d5ae23d32b3e801c3b7bc88fec4444d122bb052c009c8583cb237
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
