# Builds kafka_exporter from the release tag tarball, as upstream's .promu.yml.
package:
  name: quench-kafka-exporter
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened kafka_exporter, built from source"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - go

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/danielqsj/kafka_exporter/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      set -eu
      export CGO_ENABLED=0 GOFLAGS=-mod=mod GOTOOLCHAIN=local
      # 0-CVE float (docs/go-module-float.md), a floor: raise a module only where the
      # line links an older one (1.8 and 1.9 carry x/crypto, x/net and x/text CVEs).
      for want in golang.org/x/crypto@v0.56.0 golang.org/x/net@v0.58.0 golang.org/x/text@v0.41.0; do
        m="${want%@*}"; w="${want#*@}"
        have="$(go list -m -f '{{.Version}}' "$m" 2>/dev/null || true)"
        [ -n "$have" ] || continue
        [ "$(printf '%s\n%s\n' "$have" "$w" | sort -V | head -1)" = "$w" ] || go get "$want"
      done
      go mod tidy
      V=github.com/prometheus/common/version
      go build -trimpath -tags netgo \
        -ldflags "-s -w -X $V.Version=${{package.version}} -X $V.Revision=v${{package.version}} -X $V.Branch=HEAD -X $V.BuildUser=quenchworks" \
        -o "${{targets.destdir}}/usr/bin/kafka_exporter" .
      "${{targets.destdir}}/usr/bin/kafka_exporter" --version 2>&1 | grep -q "version ${{package.version}}"
      bad="$(go version -m "${{targets.destdir}}/usr/bin/kafka_exporter" | awk '$1 == "dep" && ($2 == "golang.org/x/crypto" && $3 < "v0.56.0" || $2 == "golang.org/x/net" && $3 < "v0.58.0" || $2 == "golang.org/x/text" && $3 < "v0.41.0") { print $2, $3 }')"
      [ -z "$bad" ] || { echo "float did not reach the binary: $bad"; exit 1; }

test:
  pipeline:
    - runs: |
        test -x /usr/bin/kafka_exporter
