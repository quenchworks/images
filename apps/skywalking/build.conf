# STATUS: ZLIB-ONLY as of 2026-09-16. Measured, not assumed: run 35066913842
# on af0623d gated with exactly one finding, zlib CVE-2026-85091, on every
# version and both arches. Nothing else in this image is flagged.
#
# This recipe carried an explicit BLOCKED=0 and so kept building and failing
# on every sweep. The measurement above is what changes it to 1: the gate
# cannot pass until Wolfi ships zlib 1.3.3-r0, which upstream madler/zlib
# has never tagged. Downgrading to Wolfi's 1.3.1-r51 is not a way out: it
# predates the 1.3.2-r0 fix for CVE-2026-27171.
#
# Clear it with scripts/blocked.py --dispatch once 1.3.3-r0 lands.
# skywalking: from-source via melange (installs the Apache SkyWalking OAP binary
# distribution under /opt/skywalking). SkyWalking ships ONE active major (10.x).
# We ship ONLY 10.4.0 -- see the VERSIONS note below, this is not the usual
# "latest 3 minor lines". Each release pins its distribution tarball by sha256.
# The 10.2.0 tarball was named without the "-bin" suffix that 10.3+ adopted, so
# the filename stays per-version (FILE map).
FROM_SOURCE=1
# 10.2.0 and 10.3.0 are deliberately NOT built: SkyWalking's own server-core carries
# CVE-2026-30778 (HIGH, /debugging/config/dump leaks MySQL/PostgreSQL credentials),
# which "affects Apache SkyWalking from 9.7.0 through 10.3.0" and is fixed only by
# upgrading to 10.4.0. That is OAP's own bytecode, not a bundled dependency, so no
# jar swap can clear it and both older lines are unshippable under the 0-CVE gate by
# construction. Verified 2026-08-27: pristine 10.2.0 oap-libs = 75 fixable findings,
# 10.3.0 = 71, each including that server-core HIGH. Re-add a second line only when
# upstream cuts a 10.5 (then 10.4.0 becomes the older line and is still clean).
VERSIONS=(10.4.0)
declare -A SHA256=(
  [10.4.0]=10559de0cfe476d602da83535a1b7a6234023b384b4b999998f9fc02e24d6b24
)
declare -A FILE=(
  [10.4.0]=apache-skywalking-apm-10.4.0-bin.tar.gz
)
# STATUS 2026-08-27: UNBLOCKED. The 2026-07-15 note claimed the bundled oap-libs/
# jars were "untractable via jar-swaps" (~50 stale jars, a 39-jar netty set, and a
# CRITICAL zookeeper 3.5.7). Re-tested today: the real blocker was 68 fixable
# findings on 10.4.0 (1 CRITICAL, 30 HIGH, 36 MEDIUM, 1 LOW) over 23 coordinates in
# 26 bundled jars, and it WAS tractable. Nothing in the Wolfi base contributed --
# zero OS/apk findings, so this was never apk drift.
# What fixed it (all in melange.yaml, which carries the full per-jar reasoning):
#   * Audited all 23 coordinates against the pristine dist and confirmed each is
#     owned by exactly ONE standalone jar, with no jar shading or relocating a
#     FLAGGED coordinate's classes -- so no class overlay, no constant-pool
#     relocation and no Multi-Release patching was needed, and file-level jar work
#     is the whole fix. Cross-checked afterwards that no surviving jar references
#     any class the swaps dropped.
#   * REMOVED the ZooKeeper coordinator island (zookeeper 3.5.7 + zookeeper-jute +
#     curator 4.3.0 x4 + cluster-zookeeper-plugin + configuration-zookeeper). The
#     CRITICAL (CVE-2023-44981) needed a 2-minor zookeeper bump that curator 4.3.0
#     is not built for; a reference audit proved the island is closed (nothing else
#     on the classpath touches org/apache/zookeeper or org/apache/curator), so the
#     code came out instead of being patched.
#   * REMOVED the Consul coordinator island (okhttp 3.14.9 + okio + retrofit +
#     converter-jackson + consul-client + cluster-consul-plugin +
#     configuration-consul). okhttp's HIGH CVE-2021-0341 is fixed only in 4.9.2, the
#     binary-incompatible Kotlin rewrite -- there is no same-major swap, so removal
#     was the only honest fix.
#   * SWAPPED, same-major, from Maven Central: the whole 32-jar netty module set in
#     lockstep 4.2.10.Final -> 4.2.17.Final; jackson core/databind/annotations ->
#     2.18.9; log4j api/core/slf4j-impl 2.25.3 -> 2.25.5; kafka-clients 3.4.0 ->
#     3.9.2; snappy-java 1.1.8.4 -> 1.1.10.4; lz4-java 1.8.0 -> at.yawk.lz4 1.11.2
#     (org.lz4 is abandoned past 1.8.0); pgjdbc 42.4.4 -> 42.7.13; micrometer
#     core/commons/observation 1.14.4 -> 1.15.12.
#   * A build-time classpath audit backs the removals and swaps: it fails the build
#     if any surviving jar still references a removed package (only micrometer-core's
#     optional okhttp3 binders are sanctioned) or if a swap left two versions of one
#     artifact on the classpath.
# Known scanner blind spot, unchanged by this work and NOT hidden by it:
# nacos-client-2.3.2.jar bundles a complete grpc-netty-shaded tree with no maven
# metadata, so Trivy attributes nothing to it and reports the jar clean. It is
# self-contained (resolves inside its own shaded package), so the netty swap above
# neither reaches it nor breaks it. Clearing it would mean dropping the nacos
# coordinator island as well; not done, since nothing in the gate flags it.
# Functional cost, deliberate and documented: SW_CLUSTER / SW_CONFIGURATION =
# zookeeper and = consul are not available in this image. standalone (the default),
# kubernetes, etcd and nacos remain, as do all storage backends (banyandb,
# elasticsearch, mysql, postgresql).
# Gate 2026-08-27, both arches, PUSH=0, comprehensive-mode CHML --ignore-unfixed:
#   x86_64  -> "✅ 0 fixable CVEs (x86_64)"
#   aarch64 -> "✅ 0 fixable CVEs (aarch64)"
# Boot test: apps/skywalking/test.sh passed (nonroot uid 1001; OAP booted on the
# bundled JRE and bound its gRPC receiver on 11800).
BLOCKED=1
render() { echo "s/__VER__/$1/g; s/__SHA256__/${SHA256[$1]}/g; s|__FILE__|${FILE[$1]}|g"; }
