# skywalking: from-source via melange (installs the Apache SkyWalking OAP binary
# distribution under /opt/skywalking). SkyWalking ships ONE active major (10.x);
# we build the latest 3 minor lines, newest patch each. Each release pins its
# distribution tarball by sha256. The 10.2.0 tarball is named without the "-bin"
# suffix that 10.3+ adopted, so the filename is per-version (FILE map).
FROM_SOURCE=1
VERSIONS=(10.2.0 10.3.0 10.4.0)
declare -A SHA256=(
  [10.2.0]=1cfd51b1ee931796f9ccf6ee47a7320bd096f84704a0f0dfdc6fd4bef6be37f8
  [10.3.0]=e2afc513ae5a26b6755b67b6b544b31f416ba0346bd70bffdaded8d04da03f2e
  [10.4.0]=10559de0cfe476d602da83535a1b7a6234023b384b4b999998f9fc02e24d6b24
)
declare -A FILE=(
  [10.2.0]=apache-skywalking-apm-10.2.0.tar.gz
  [10.3.0]=apache-skywalking-apm-10.3.0-bin.tar.gz
  [10.4.0]=apache-skywalking-apm-10.4.0-bin.tar.gz
)
# BLOCKED 2026-07-15: all 3 versions gate at grade F on stale transitive JARs
# bundled inside the upstream OAP binary distribution's oap-libs/ (279 jars).
# Local gate (PUSH=0 ARCHES=x86_64) on the newest, 10.4.0: 52 fixable CVEs / 20
# coordinates (1 CRITICAL, 24 HIGH, 26 MEDIUM, 1 LOW). Residual by coordinate:
#   * netty 4.2.10.Final  -> 4.2.15.Final  (13 CVEs incl. HIGH CVE-2026-42577/
#     42578/45674, CVE-2026-47691; MED CVE-2026-45536/45673) spread across the
#     codec/resolver-dns/handler/transport modules. Netty ships as a matched
#     module set: 39 netty-*-4.2.10.Final jars sit on the classpath and MUST move
#     in lockstep (mixing 4.2.10 netty-common with a 4.2.15 module trips netty's
#     own version-consistency check / risks NoSuchMethodError across modules).
#   * org.apache.zookeeper:zookeeper 3.5.7 -> 3.9.1  (CRITICAL CVE-2023-44981,
#     auth bypass) — a 2-minor bump pulling its own transitive graph.
#   * com.squareup.okhttp3:okhttp 3.14.9 -> 4.9.2 — a MAJOR 3.x->4.x Kotlin
#     rewrite (binary-incompatible; OAP code compiled against okhttp 3 API would
#     NoSuchMethodError at runtime). NOT a drop-in.
#   * kafka-clients 3.4.0 -> 3.9.2 (CVE-2026-35554/33558, CVE-2025-27817,
#     CVE-2024-31141), jackson-databind 2.16.0 + jackson-core 2.18.5,
#     log4j-core 2.25.3 -> 2.25.4 (CVE-2026-34477/34478/34480), postgresql
#     42.4.4 -> 42.7.11 (CVE-2026-42198), lz4-java 1.8.0 -> 1.8.1
#     (CVE-2025-12183), snappy-java 1.1.8.4 -> 1.1.10.4, okio 1.17.2.
# WHY NOT jar-swaps: ~50 of the 279 bundled jars are implicated (39 netty alone),
# several are cross-module matched sets or major/multi-minor API bumps that only
# break at runtime under specific storage/fetcher plugins we cannot exercise in a
# boot-smoke. This is upstream's to fix by bumping OAP's transitive deps and
# re-releasing (a full Gradle rebuild), not tractable via in-place jar-swaps.
# Unblock when a SkyWalking release ships oap-libs on patched netty/zookeeper/
# kafka/okhttp/log4j. The weekly recheck re-runs this gate automatically.
BLOCKED=1  # upstream OAP dist bundles ~50 stale jars incl. 39-jar netty set + CRITICAL zookeeper 3.5.7; untractable via jar-swaps (as of 2026-07-15)
render() { echo "s/__VER__/$1/g; s/__SHA256__/${SHA256[$1]}/g; s|__FILE__|${FILE[$1]}|g"; }
