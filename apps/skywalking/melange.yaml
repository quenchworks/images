# Packages the Apache SkyWalking OAP (Observability Analysis Platform) backend
# onto Wolfi. SkyWalking is a JVM app: we ship the upstream binary distribution
# (prebuilt jars) on a hardened Wolfi JRE, which is the CVE surface Trivy scans.
# This image is the OAP SERVER only. 11.0 no longer ships a UI in the dist at all (the
# Horizon UI is a separate project and image). OAP
# exposes gRPC 11800 (agents) and HTTP 12800 (GraphQL/health). Storage (BanyanDB
# or Elasticsearch) is the chart's job; the image just launches the OAP server.
# Every cluster coordinator and storage backend in the dist is shipped. (10.4 had to
# drop ZooKeeper and Consul; 11.0.0's clients for both scan clean.)
package:
  name: quench-skywalking
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Apache SkyWalking OAP server, packaged on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - openjdk-21-jre     # the JRE OAP runs on (the scanned CVE surface); SkyWalking is JDK11+ bytecode
      - busybox            # provides /bin/sh for the entrypoint

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - curl        # build-only: fetch same-major patched jars from Maven Central
      - python-3    # build-only: the post-swap classpath audit below

pipeline:
  # Apache's CDN (dlcdn) serves only CURRENT releases and is fast; archive.apache.org
  # keeps every release forever but is slow (a 20+ minute fetch was measured locally).
  # Try the CDN, fall back to the archive, and verify the same sha256 either way.
  - runs: |
      f=__FILE__
      for base in https://dlcdn.apache.org/skywalking https://archive.apache.org/dist/skywalking; do
        curl -fsSL -o "$f" "$base/${{package.version}}/$f" && break
        rm -f "$f"
      done
      echo "__SHA256__  $f" | sha256sum -c -
      tar -xzf "$f" --strip-components=1
      rm -f "$f"
  - runs: |
      # install the OAP distribution under /opt/skywalking. Ship only what the OAP
      # server needs: the launch scripts, config, and the oap-libs classpath.
      # Drop the UI (webapp), the profiling/BanyanDB helper tools, the config
      # examples, and the Windows launchers -- none belong in the OAP server image.
      dest="${{targets.destdir}}/opt/skywalking"
      install -d "$dest"
      cp -r bin config oap-libs LICENSE NOTICE licenses "$dest/"
      rm -rf "$dest/bin/"*.bat

      # ================= 0-CVE remediation of the bundled oap-libs/ classpath =========
      # Derived 2026-09-24 from a PRISTINE scan of the 11.0.0 dist (283 jars): 23 fixable
      # findings (1 CRITICAL, 8 HIGH, 14 MEDIUM) over 15 jars, every one owned by a
      # standalone jar in oap-libs/, so file-level swaps are the whole fix. The 10.4
      # recipe also DROPPED the ZooKeeper and Consul islands (zookeeper 3.5.7 / okhttp
      # 3.14.9 had no same-major fix). 11.0.0 ships zookeeper 3.9.5, curator 5.9.0 and
      # okhttp 4.12.0, none flagged, so nothing is removed and SW_CLUSTER /
      # SW_CONFIGURATION zookeeper and consul work again. Every swap line names the
      # version the PRISTINE dist ships.
      #
      # The entrypoint builds the classpath with `for j in oap-libs/*.jar`, so jar
      # FILENAMES are not load-bearing: a swap may change the version in the name freely.
      MC="https://repo1.maven.org/maven2"

      swap() { # <maven-group-path> <artifact> <oldver> <newver>
        #   old present             -> real swap
        #   old absent, new SHIPPED -> upstream caught up; loud no-op so the dead line
        #                              gets deleted rather than silently duplicated
        #   neither present         -> the dist moved elsewhere. FATAL.
        oldf="$dest/oap-libs/$2-$3.jar"; newf="$dest/oap-libs/$2-$4.jar"
        if [ -f "$oldf" ]; then
          :
        elif [ -f "$newf" ]; then
          echo "note: dist already ships $2-$4; the swap line for $3 is dead, remove it"
          return 0
        else
          echo "FATAL: $2: neither $3 nor $4 is shipped -- dist moved, re-audit this line"
          ls "$dest/oap-libs/" | grep -F "$2" || true
          exit 1
        fi
        # download BEFORE removing the old jar: a 404 leaves the dist intact and fails
        # the build instead of silently deleting a classpath entry.
        curl -fsSL -o "$newf" "$MC/$1/$2/$4/$2-$4.jar"
        test -s "$newf"
        rm -f "$oldf"
      }

      # ---- (1) netty 4.2.15.Final -> 4.2.18.Final, all 31 module jars --------------
      # The CRITICAL (CVE-2026-75595, netty-handler) and the highest fix any finding
      # names are 4.2.17.Final; 4.2.18 is the newest on the 4.2 line. netty ships as a
      # matched set, so every module moves together, flagged or not. The loop
      # ENUMERATES what the dist ships (base and per-OS classifier jars) and the count
      # assertion makes a changed module set loud. netty-tcnative (2.0.77) is its own
      # line, not flagged, and stays.
      NETTY_OLD=4.2.15.Final
      NETTY_NEW=4.2.18.Final
      n=0
      for f in "$dest"/oap-libs/netty-*-"$NETTY_OLD"*.jar; do
        b="$(basename "$f")"
        art="${b%%-$NETTY_OLD*}"          # netty-codec-http
        cls="${b#"$art"-$NETTY_OLD}"      # ".jar", or "-linux-x86_64.jar"
        curl -fsSL -o "$dest/oap-libs/${art}-${NETTY_NEW}${cls}" \
          "$MC/io/netty/${art}/${NETTY_NEW}/${art}-${NETTY_NEW}${cls}"
        test -s "$dest/oap-libs/${art}-${NETTY_NEW}${cls}"
        rm -f "$f"
        n=$((n + 1))
      done
      [ "$n" -eq 31 ] || {
        echo "FATAL: expected 31 netty $NETTY_OLD jars in the dist, swapped $n --"
        echo "       upstream changed its netty module set; re-audit the lockstep list."
        exit 1
      }
      echo "netty: swapped $n jars $NETTY_OLD -> $NETTY_NEW"

      # ---- (2) the standalone jars ---------------------------------------------------
      # jackson core trio 2.18.8 -> 2.18.9 (databind CVE-2026-54515 / 59889 /
      # GHSA-mhm7-754m-9p8w each offer 2.18.9); the trio moves together.
      swap com/fasterxml/jackson/core jackson-databind    2.18.8 2.18.9
      swap com/fasterxml/jackson/core jackson-core        2.18.8 2.18.9
      swap com/fasterxml/jackson/core jackson-annotations 2.18.8 2.18.9
      # log4j2 2.25.4 -> 2.25.5 (api CVE-2026-49844); the binding moves as a set.
      swap org/apache/logging/log4j log4j-api        2.25.4 2.25.5
      swap org/apache/logging/log4j log4j-core       2.25.4 2.25.5
      swap org/apache/logging/log4j log4j-slf4j-impl 2.25.4 2.25.5
      # micrometer 1.14.4 -> 1.15.12 (core CVE-2026-40984 HIGH); core, commons and
      # observation are a matched set.
      swap io/micrometer micrometer-core        1.14.4 1.15.12
      swap io/micrometer micrometer-commons     1.14.4 1.15.12
      swap io/micrometer micrometer-observation 1.14.4 1.15.12
      # lz4-java 1.10.1 -> 1.11.2 (CVE-2026-59949, fix 1.11.1), the maintained
      # at.yawk.lz4 fork that 11.0.0 already uses; take the newest.
      swap at/yawk/lz4 lz4-java 1.10.1 1.11.2
      # pgjdbc 42.7.11 -> 42.7.13 (CVE-2026-54291, fix 42.7.12); newest of the 42.7 line.
      swap org/postgresql postgresql 42.7.11 42.7.13

      # ---- (3) POST-SWAP CLASSPATH AUDIT: one version per swapped artifact ----------
      # A swap that left two versions of one artifact on the classpath would still load
      # the old, vulnerable bytecode while the scanner sees the new jar.
      python3 - "$dest/oap-libs" "$NETTY_NEW" <<'PY'
      import os, re, sys

      libs, netty_new = sys.argv[1], sys.argv[2]
      jars = sorted(f for f in os.listdir(libs) if f.endswith(".jar"))
      swapped = """jackson-databind jackson-core jackson-annotations
                   log4j-api log4j-core log4j-slf4j-impl lz4-java postgresql
                   micrometer-core micrometer-commons micrometer-observation""".split()
      dup = {}
      for a in swapped:
          rx = re.compile(rf"^{re.escape(a)}-(\d[^/]*?)\.jar$")
          vs = {m.group(1) for m in (rx.match(j) for j in jars) if m}
          if not vs:
              sys.exit(f"FATAL: no jar left for swapped artifact {a} -- swap removed it")
          if len(vs) > 1:
              dup[a] = vs
      stale = [j for j in jars if j.startswith("netty-") and netty_new not in j
               and "netty-tcnative" not in j]
      if stale:
          dup["io.netty (mixed module set)"] = stale
      if dup:
          for k, v in sorted(dup.items()):
              print(f"  {k} -> {sorted(v)}")
          sys.exit(f"FATAL: {len(dup)} swapped artifact(s) are on the classpath at more "
                   "than one version.")
      print(f"classpath audit OK: {len(jars)} jars, one version per swapped artifact")
      PY
      # ================= end 0-CVE remediation ========================================
      # Make OAP log to the container stdout so `kubectl logs` / `docker logs` show the
      # real boot/crash reasons. The upstream config/log4j2.xml routes the Root logger to
      # BOTH a RollingFile AND a Console appender, but the Console appender carries a
      # MarkerFilter that ACCEPTs only events tagged with the "Console" marker and DENYs
      # everything else -- so ordinary startup/error logs NEVER reach stdout (they land
      # only in the RollingFile under $OAP_LOG_DIR on a read-only rootfs, invisible to the
      # kubelet). Strip that filter and give the Console a full pattern so the container
      # stdout carries the actual logs. Without this, an OAP crash (e.g. an unsupported
      # storage backend) exits 1 with an EMPTY stdout, making CI failures undiagnosable.
      log4j2="$dest/config/log4j2.xml"
      sed -i \
        -e '/<MarkerFilter marker="Console" onMatch="ACCEPT" onMismatch="DENY"\/>/d' \
        -e 's#<pattern>%m%n</pattern>#<pattern>%d - %c - %L [%t] %-5p %x - %m%n</pattern>#' \
        "$log4j2"
      # bake a shell-free-friendly OAP entrypoint. It builds the classpath, points
      # logs at a writable dir (read-only rootfs), and execs java directly so log4j2's
      # (now unfiltered) Console appender streams OAP logs to the container stdout (the
      # upstream oapService.sh redirects stderr to a file, hiding logs from `docker logs`).
      install -d "${{targets.destdir}}/usr/bin"
      cat > "${{targets.destdir}}/usr/bin/docker-entrypoint.sh" <<'EOS'
      #!/bin/sh
      set -eu

      OAP_HOME=/opt/skywalking
      OAP_LOG_DIR="${OAP_LOG_DIR:-/var/lib/skywalking/logs}"
      mkdir -p "$OAP_LOG_DIR"

      CP="$OAP_HOME/config"
      for j in "$OAP_HOME"/oap-libs/*.jar; do
        CP="$CP:$j"
      done

      # JAVA_OPTS is intentionally word-split so heap flags can be overridden.
      # shellcheck disable=SC2086
      exec "${JAVA_HOME}/bin/java" ${JAVA_OPTS:--Xms256M -Xmx2048M} \
        -Doap.logDir="$OAP_LOG_DIR" \
        -classpath "$CP" \
        org.apache.skywalking.oap.server.starter.OAPServerStartUp "$@"
      EOS
      chmod 0755 "${{targets.destdir}}/usr/bin/docker-entrypoint.sh"

test:
  environment:
    contents:
      packages:
        - openjdk-21-jre
        - busybox
  pipeline:
    - runs: |
        # the JRE runs, the OAP classpath + config are present, and the entrypoint parses
        /usr/lib/jvm/java-21-openjdk/bin/java -version
        sh -n /usr/bin/docker-entrypoint.sh
        ls /opt/skywalking/oap-libs/server-starter-*.jar
        test -f /opt/skywalking/config/application.yml
