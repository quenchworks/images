# ergo: Ergo (ergochat/ergo), a modern IRC server with integrated services (NickServ, ChanServ), bouncer
# features, history and IRCv3. MIT. Images issue #47.
#
# Pure Go (CGO off, upstream's Makefile default) with main.version / main.commit. The image config at
# /etc/ergo/ircd.yaml is upstream's default.yaml with container paths: one plain listener on :6667 (the
# chart adds TLS on 6697), the datastore at /ircd/ircd.db, and the well-known sample oper password
# replaced by an unusable one (upstream's run.sh does the same on first start; the chart sets a real one).
FROM_SOURCE=1
VERSIONS=(2.19.1)
declare -A SHA256=(
  [2.19.1]=7b1f6fac874a75c766ccd41d068f4408ac09aa30e594233afe87e7793d93c587
)
declare -A COMMIT=(
  [2.19.1]=63c743a7
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g; s|__COMMIT__|${COMMIT[$1]}|g"; }
