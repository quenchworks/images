# csi-livenessprobe (kubernetes-csi/livenessprobe): the CSI livenessprobe, which serves /healthz by probing a CSI driver socket. A Kubernetes CSI
# sidecar used by every CSI driver (Longhorn pins it in dep-versions). From source, static Go (CGO
# off), version stamped via -X main.version as release-tools/build.make does. Upstream's layout:
# the binary at /livenessprobe, root by default (upstream's image is distroless/static, uid 0; the
# CSI socket it dials is created by the driver, usually as root).
# Latest patch of the last 3 minor lines.
FROM_SOURCE=1
VERSIONS=(2.18.0 2.19.0 2.20.0)
declare -A SHA256=(
  [2.18.0]=d1f8a9dc3702304b8a1003da825cce0f3be99a170461ac4f59ef46f65dbf86a2
  [2.19.0]=4b9c242de124b57b026bdce38f34619afc93ea3afe5f7d4a02af5b727abcda44
  [2.20.0]=e9c86e96c0cbddef5ea82b619b46d9b1dfe57614487c493cc98a6aa796a65b19
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
