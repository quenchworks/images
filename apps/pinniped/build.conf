# go-jose v3 HOLD 2026-11-11: CVE-2026-116587/-116585/-116586 (no v3 fix). pinniped's own code is on v4; v3 comes from ory/fosite (the supervisor's OAuth2/OIDC server, which parses JWKs and JWTs, so reachable; no VEX). fosite main is still on v3. Unblock: a fosite release on go-jose v4 and a pinniped release using it.
# pinniped: from-source via melange (Go build of cmd/pinniped-server, the kube cert agent
# and the pinniped CLI from the git tag tarball). Static Go binaries, no CGO. Version
# stamped via -X on internal/pversion.gitVersion, the way hack/get-ldflags.sh does.
#
# LATEST ONLY. Upstream cuts one minor per release and never patches an older one, so
# "the last 3 lines" would ship two releases nobody fixes.
FROM_SOURCE=1
VERSIONS=(0.47.0)
declare -A SHA256=(
  [0.47.0]=a7cdbe3acdfdbcb19de26324b40a8db77029171575dcf4e42de4856332548cc9
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
