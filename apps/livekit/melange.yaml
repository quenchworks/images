# Builds LiveKit (the WebRTC SFU server) from source onto Wolfi. Single static
# Go binary, no CGO (matches upstream Dockerfile: CGO_ENABLED=0; the media stack
# is Pion, pure Go). Output is a signed APK in Quenchworks' own repo. No upstream
# distro binaries.
#
# The release version lives as a const (version.Version) in version/version.go
# and is wired into the CLI (cli.Command.Version), so `livekit-server --version`
# reports the real release straight from the tag tarball -- no -ldflags -X needed
# (and a const cannot be overridden by -X anyway).
package:
  name: quench-livekit
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened LiveKit (WebRTC SFU server), built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      # go.mod declares `go 1.26`; pin the matching go-1.26 toolchain (newest,
      # clears stdlib CVE advisories) and set GOTOOLCHAIN=local so the go.mod
      # directive never triggers an on-the-fly toolchain download.
      - go-1.26

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/livekit/livekit/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      export GOTOOLCHAIN=local
      # 0-CVE gate: 1.13.4's go.mod already requires x/net v0.57.0, x/text v0.40.0,
      # x/crypto v0.54.0, x/sys v0.47.0 and cel-go v0.29.2 (which is what clears
      # cel-go GHSA-gcjh-h69q-9w9g -- no cel-go float needed). Keep the float set at
      # or above those versions: pinning a LOWER version here would downgrade the
      # module graph. Only grpc actually moves (v1.82.0 -> v1.82.1).
      # otel CVE-2026-81870 / CVE-2026-81871: the published image drifted onto these
      # after release. Every module listed is one this app's own go.mod carries; a
      # floor naming a module absent from the graph is rejected by some recipes.
      # 0-CVE FLOORS, not pins (docs/go-module-float.md): raise a module only where go.mod has it
      # below the floor; a module absent from the graph is skipped. Bare `go get` pins downgraded
      # newer upstream releases (found 2026-10-05).
      FLOOR="golang.org/x/text@v0.41.0 golang.org/x/net@v0.58.0 golang.org/x/crypto@v0.56.0 golang.org/x/sys@v0.47.0 google.golang.org/grpc@v1.83.2 golang.org/x/mod@v0.40.0 go.opentelemetry.io/otel@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.45.0 go.opentelemetry.io/otel/metric@v1.45.0 go.opentelemetry.io/otel/sdk@v1.45.0 go.opentelemetry.io/otel/trace@v1.45.0"
      # Go semver order (a release outranks its prereleases); busybox sort -V does not.
      vlt() { awk -v a="${1#v}" -v b="${2#v}" 'function pp(s,  p){sub(/\+.*/,"",s);p=index(s,"-");if(p){C=substr(s,1,p-1);P=substr(s,p+1)}else{C=s;P=""}} function cmp(x,y,  i,n,m,X,Y){n=split(x,X,".");m=split(y,Y,".");for(i=1;i<=n&&i<=m;i++){if(X[i]==Y[i])continue;if(X[i]~/^[0-9]+$/&&Y[i]~/^[0-9]+$/)return (X[i]+0<Y[i]+0)?-1:1;if(X[i]~/^[0-9]+$/)return -1;if(Y[i]~/^[0-9]+$/)return 1;return (X[i]<Y[i])?-1:1}return (n<m)?-1:(n>m)?1:0} BEGIN{pp(a);ca=C;pa=P;pp(b);cb=C;pb=P;c=cmp(ca,cb);if(c==0){if(pa==pb)c=0;else if(pa=="")c=1;else if(pb=="")c=-1;else c=cmp(pa,pb)}exit !(c<0)}'; }
      need=""
      for mv in $FLOOR; do
        have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${mv%@*}" 2>/dev/null)"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        vlt "$have" "${mv#*@}" && need="$need $mv"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || go get $need
      go mod tidy
      go build -trimpath -ldflags "-s -w" \
        -o "${{targets.destdir}}/usr/bin/livekit-server" ./cmd/server

test:
  pipeline:
    - runs: |
        livekit-server --version
