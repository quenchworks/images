# livekit: from-source via melange (Go build of the WebRTC SFU server from the
# git tag tarball). Latest patch of the last 2 minor lines (1.12, 1.13). Each
# release pins its source tarball by sha256. Single static Go binary, no CGO
# (matches upstream Dockerfile CGO_ENABLED=0). The release version is a const in
# version/version.go, so building from the tag tarball reports the real release.
FROM_SOURCE=1
# 1.13.4 (2026-07-26): clears cel-go GHSA-gcjh-h69q-9w9g (MEDIUM) -- this release's
# go.mod already requires cel-go v0.29.2 (the fixed line), so no cel-go float is
# needed. It also lands x/net v0.57.0, x/text v0.40.0, x/crypto v0.54.0, x/sys
# v0.47.0 on its own; the melange float set was raised to match (a float BELOW an
# upstream requirement would be a downgrade, not a fix).
VERSIONS=(1.13.4)
declare -A SHA256=(
  [1.13.4]=cfef31caa302761ed84d9eee4d5f793a3f6cb321cd56a5cafec675f70475e794
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
