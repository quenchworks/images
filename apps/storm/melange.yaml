# Packages Apache Storm onto Wolfi: the upstream binary distribution on a hardened JRE.
# bin/storm is bash and execs bin/storm.py, so the runtime carries bash and python3.
package:
  name: quench-storm
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Apache Storm, packaged on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - openjdk-25-jre       # Storm 3.1 classes are Java 25 bytecode (class major 69)
      - bash
      - busybox
      - python-3.13-base
      - python3-as-3.13

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - maven-3.9               # rebuild hadoop-shaded-guava, re-shade guava (see below)
      - openjdk-21-default-jdk
      - unzip
      - zip

pipeline:
  - uses: fetch
    with:
      # dlcdn, not archive.apache.org: archive throttled the 304M tarball to ~150K/s on the arm runner
      # (run 37772952211 stalled 50+ min twice). dlcdn only keeps current releases; on a 404, go back to
      # archive.apache.org. The sha256 pin is unchanged either way.
      # archive.apache.org keeps every release; dlcdn drops a line as soon as the next ships
      uri: https://archive.apache.org/dist/storm/apache-storm-${{package.version}}/apache-storm-${{package.version}}.tar.gz
      expected-sha256: "__SHA256__"
      strip-components: 1
  - runs: |
      dest="${{targets.destdir}}/opt/storm"
      install -d "$dest"
      cp -r bin conf lib lib-common lib-webapp lib-worker lib-tools log4j2 public extlib extlib-daemon LICENSE NOTICE RELEASE "$dest/"
      # Optional extras carry the unfixable findings: external/ (connectors; storm-autocreds
      # bundles hbase-shaded-netty 4.1.131 and protobuf-java 2.5.0) and the Kafka offset
      # monitor tool (lz4-java 1.10.2). Topologies bundle their own connectors.
      rm -rf "$dest/lib-tools/storm-kafka-monitor"
      rm -f "$dest"/bin/storm-kafka-monitor* "$dest"/bin/storm-autocreds-fetch "$dest"/bin/*.ps1
      chmod -R a+rX "$dest"

      # jackson-core and -databind below 2.22.3 (CVE-2026-89407/-89425, CVE-2026-91776/
      # -91777). Replace every older 2.22.x copy, keep anything already newer, and fail if
      # the library vanished (upstream moved: re-audit).
      M=https://repo1.maven.org/maven2/com/fasterxml/jackson/core
      fixjar() { # artifact version sha256 [major prefix, default 2.]
        local a="$1" v="$2" sha="$3" maj="${4:-2.}" n=0 f have
        wget -q -O "/tmp/$a-$v.jar" "$M/$a/$v/$a-$v.jar"
        echo "$sha  /tmp/$a-$v.jar" | sha256sum -c - >/dev/null
        for f in $(find "$dest" -name "$a-$maj*.jar"); do
          n=$((n + 1))
          have="${f##*/$a-}"; have="${have%.jar}"
          [ "$have" = "$v" ] && continue
          [ "$(printf '%s\n%s\n' "$have" "$v" | sort -V | head -1)" = "$have" ] || continue
          rm -f "$f"; cp "/tmp/$a-$v.jar" "$(dirname "$f")/"
          echo "swapped $f -> $v"
        done
        [ "$n" -gt 0 ] || { echo "FATAL: no $a jar in the dist"; exit 1; }
      }
      fixjar jackson-core 2.22.3 8a501126a385b25841915d839508f8a66e2a0dbc8a6709d055ef3b3e852b094c
      fixjar jackson-databind 2.22.3 556db5439e206114346043f68d200497dc96a0bca62a360a81784092ebd0e0a9
      # amqp-client 5.35.0 (CVE-2026-106121/-106122, fixed 5.36.1); 5.37.0 has the same
      # packages (one added class) and the same Automatic-Module-Name.
      M=https://repo1.maven.org/maven2/com/rabbitmq
      fixjar amqp-client 5.37.0 b27134820890c5e56ed57d27cc50b70742fa2c31b36a6e9e28e14a43f34ff96f 5.
      # guava below 33.7.2-jre (CVE-2026-102554; 3.1.0 ships 33.4.8 and 33.7.1 copies).
      M=https://repo1.maven.org/maven2/com/google/guava
      fixjar guava 33.7.2-jre b530942257fb935f8b2cfaa5f8eb5bd59c555fd8e8d01b8ce98912e077ea606c 3
      # Kerby as one release: kerby-asn1 2.0.3 has CVE-2026-57914 (MEDIUM, fixed 2.1.2), and the other
      # six lib/ jars are the same 2.0.3 release.
      M=https://repo1.maven.org/maven2/org/apache/kerby
      fixjar kerb-core 2.1.2 7eca4bad352f15e9e0cb28636138ed41a917c640c25dfe178c5bbb3e9114ef9a
      fixjar kerb-crypto 2.1.2 1acbbf33346c644535e19db9b1f0fd8fa043aab6ee1b73eeb0ad25b5c95dc6c8
      fixjar kerb-util 2.1.2 b8c4ed7f1bac6aadadf0307b49f41e05dca5c61dbe2b1772df37e7225d9f08fe
      fixjar kerby-asn1 2.1.2 aece8c08d4decff1bcf7cd06c9d43f30ec3bfc01ad8d57428443e9f037e06896
      fixjar kerby-config 2.1.2 c46c030b082aa13d2e7ba3c837caf24d015e4fad675bb163c00d72672a5822da
      fixjar kerby-pkix 2.1.2 cd165285f84a1baef1dca4a21a27ffe88b5ff35d86f83c81e06d45d752ecb844
      fixjar kerby-util 2.1.2 05ff4b1c6864b2660e9451a22dd58010c2a29dd1b296c41d0c3a82078db9c4b9
      # lib/hadoop-shaded-guava-1.5.0.jar is guava 33.4.8 relocated to org.apache.hadoop.thirdparty
      # (hadoop-auth links it), which no plain swap reaches; 1.5.0 is the newest release. Rebuild
      # it from the hadoop-thirdparty 1.5.0 source (sha512 verified against Apache) on guava
      # 33.7.2-jre and keep the filename. Same rebuild as apps/spark.
      hsg="$(find "$dest" -name 'hadoop-shaded-guava-*.jar')"
      test "$(echo "$hsg" | grep -c .)" -eq 1 || { echo "expected one hadoop-shaded-guava jar: $hsg"; exit 1; }
      wget -q -O /tmp/htp.tgz https://archive.apache.org/dist/hadoop/thirdparty/thirdparty-1.5.0/hadoop-thirdparty-1.5.0-src.tar.gz
      echo "b9495bc00e17bcc4faabc77b040be81c7cd55a50c8d0eed333655e52710b19b9  /tmp/htp.tgz" | sha256sum -c -
      mkdir -p /tmp/htp && tar -xzf /tmp/htp.tgz -C /tmp/htp --strip-components=1
      (export JAVA_HOME=/usr/lib/jvm/java-21-openjdk PATH="/usr/lib/jvm/java-21-openjdk/bin:$PATH"
       cd /tmp/htp && mvn -B -ntp -q -C -DskipTests -Drat.skip=true -Denforcer.skip=true -Dlicense.skip=true \
         -Dmaven.javadoc.skip=true -Dmaven.repo.local=/tmp/m2 -pl hadoop-shaded-guava -am -Dguava.version=33.7.2-jre package)
      new=/tmp/htp/hadoop-shaded-guava/target/hadoop-shaded-guava-1.5.0.jar
      unzip -p "$new" META-INF/maven/com.google.guava/guava/pom.properties | grep -qx 'version=33.7.2-jre'
      cp "$new" "$hsg"; chmod 644 "$hsg"
      # storm-shaded-deps relocates guava twice: Storm's own copy under org.apache.storm.shade.com.google
      # (33.7.1, the one Trivy reads through its pom.properties) and Curator's under
      # org.apache.storm.shade.org.apache.curator.shaded.com.google (no metadata, same code).
      # Relocate guava 33.7.2-jre + failureaccess to both prefixes with maven-shade and overlay the
      # classes in place; the jar is unsigned. Removed-in-33.7.2 classes stay, unreferenced.
      ssd="$(find "$dest" -name 'storm-shaded-deps-*.jar')"
      test "$(echo "$ssd" | grep -c .)" -eq 1 || { echo "expected one storm-shaded-deps jar: $ssd"; exit 1; }
      mkdir -p /tmp/sg && cat > /tmp/sg/pom.xml <<'POM'
      <project xmlns="http://maven.apache.org/POM/4.0.0">
        <modelVersion>4.0.0</modelVersion>
        <groupId>quench</groupId><artifactId>sg</artifactId><version>1</version>
        <dependencies>
          <dependency><groupId>com.google.guava</groupId><artifactId>guava</artifactId><version>33.7.2-jre</version></dependency>
          <dependency><groupId>com.google.guava</groupId><artifactId>failureaccess</artifactId><version>1.0.3</version></dependency>
        </dependencies>
        <build><plugins><plugin>
          <groupId>org.apache.maven.plugins</groupId><artifactId>maven-shade-plugin</artifactId><version>3.6.2</version>
          <configuration>
            <createDependencyReducedPom>false</createDependencyReducedPom>
            <shadedArtifactAttached>true</shadedArtifactAttached>
            <artifactSet><includes><include>com.google.guava:guava</include><include>com.google.guava:failureaccess</include></includes></artifactSet>
            <filters><filter><artifact>*:*</artifact><excludes><exclude>META-INF/versions/9/module-info.class</exclude></excludes></filter></filters>
          </configuration>
          <executions>
            <execution><id>storm</id><phase>package</phase><goals><goal>shade</goal></goals><configuration>
              <shadedClassifierName>storm</shadedClassifierName>
              <relocations><relocation><pattern>com.google</pattern><shadedPattern>org.apache.storm.shade.com.google</shadedPattern></relocation></relocations>
            </configuration></execution>
            <execution><id>curator</id><phase>package</phase><goals><goal>shade</goal></goals><configuration>
              <shadedClassifierName>curator</shadedClassifierName>
              <relocations><relocation><pattern>com.google</pattern><shadedPattern>org.apache.storm.shade.org.apache.curator.shaded.com.google</shadedPattern></relocation></relocations>
            </configuration></execution>
          </executions>
        </plugin></plugins></build>
      </project>
      POM
      (export JAVA_HOME=/usr/lib/jvm/java-21-openjdk PATH="/usr/lib/jvm/java-21-openjdk/bin:$PATH"
       cd /tmp/sg && mvn -B -ntp -q -C -Dmaven.repo.local=/tmp/m2 package)
      echo "b530942257fb935f8b2cfaa5f8eb5bd59c555fd8e8d01b8ce98912e077ea606c  /tmp/m2/com/google/guava/guava/33.7.2-jre/guava-33.7.2-jre.jar" | sha256sum -c -
      for c in storm curator; do
        mkdir -p "/tmp/sg/$c" && (cd "/tmp/sg/$c" && unzip -qo "/tmp/sg/target/sg-1-$c.jar" 'org/*')
        (cd "/tmp/sg/$c" && zip -qr "$ssd" org)
      done
      (cd /tmp/sg/storm && unzip -qo "/tmp/sg/target/sg-1-storm.jar" META-INF/maven/com.google.guava/guava/pom.properties META-INF/maven/com.google.guava/guava/pom.xml && zip -q "$ssd" META-INF/maven/com.google.guava/guava/pom.properties META-INF/maven/com.google.guava/guava/pom.xml)
      unzip -p "$ssd" META-INF/maven/com.google.guava/guava/pom.properties | grep -qx 'version=33.7.2-jre'
      chmod 644 "$ssd"

      # lib-webapp pins some Jetty 12.1 modules older than the copies the dist ships in
      # lib/ (3.1.0: server, security, util at 12.1.9 vs 12.1.12; 12.1.9 is flagged).
      # Take lib/'s newer copy of each module, so the UI runs one Jetty version.
      for f in "$dest"/lib-webapp/jetty-*-12.*.jar; do
        b="${f##*/}"; mod="${b%-12.*}"
        new="$(ls "$dest"/lib/"$mod"-12.*.jar 2>/dev/null | sort -V | tail -1)"
        [ -n "$new" ] || continue
        [ "$(printf '%s\n%s\n' "${new##*/}" "$b" | sort -V | tail -1)" = "$b" ] && continue
        rm -f "$f"; cp "$new" "$dest/lib-webapp/"; echo "jetty $b -> ${new##*/}"
      done

      # Writable state under /tmp so the rootfs can be read-only; storm.yaml overrides win.
      cat >> "$dest/conf/storm.yaml" <<'EOS'

      storm.local.dir: "/tmp/storm/data"
      storm.log.dir: "/tmp/storm/logs"
      EOS

test:
  pipeline:
    - runs: |
        test -x /opt/storm/bin/storm
        ! ls /opt/storm/lib/jackson-databind-2.22.2.jar 2>/dev/null || exit 1
        ! ls /opt/storm/lib-webapp/jetty-server-12.1.9.jar 2>/dev/null
