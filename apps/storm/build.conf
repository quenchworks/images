# storm: Apache Storm, distributed real-time stream processing. We ship the official
# binary distribution on a hardened Wolfi JRE (the apps/zookeeper shape). One image runs
# every daemon: `storm nimbus`, `storm supervisor`, `storm ui`, `storm logviewer`.
# Newest line only (3.x; dlcdn carries 3.1.0 alone). Fetched from archive.apache.org.
# Sized 2026-10-07: trivy rootfs of the 3.1.0 dist reported 77 findings. Core: jackson
# 2.22.2 (lib/, lib-webapp/) and jetty-server/-security/-util 12.1.9 (lib-webapp/); the
# rest sit in the optional external/ connectors and lib-tools/storm-kafka-monitor, which
# the recipe drops. See melange.yaml.
BLOCKED=0
FROM_SOURCE=0
VERSIONS=(3.1.0 3.2.0)
declare -A SHA256=(
  [3.1.0]=4fd7853462cb591e94dc594f95effe8e107842d8d6041482cc0b3e01ece5198c
  [3.2.0]=7b5faff7d38dd85edf56c919af852e0c8f42244426f5d700c3bbb7c13a841231
)
render() { echo "s/__VER__/$1/g; s/__SHA256__/${SHA256[$1]}/g"; }
