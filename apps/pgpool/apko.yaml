# Assembles the Pgpool-II runtime image from our own package plus the Wolfi base.
# No Dockerfile. Minimal, nonroot, multi-arch, SBOM generated by apko.
#
# Pgpool-II listens on 9999 (client / PostgreSQL wire protocol) and 9898 (PCP admin
# protocol) -- both above 1024, so they work unchanged as nonroot uid 1001.
#
# CONFIG: pgpool refuses to start without pgpool.conf, and a shell-free image cannot
# run a `#!/bin/sh` wrapper, so the entrypoint execs the binary directly with -n
# (don't daemonize -- mandatory in a container) plus explicit -f/-F/-a paths. The
# package bakes bootable defaults at those paths; the Helm chart mounts its own
# pgpool.conf / pool_hba.conf / pool_passwd / pcp.conf over them.
#
# Read-only rootfs: sockets + pidfile go to /var/run/pgpool, pgpool_status and lock
# files to /tmp (pgpool's default; the `logdir`->`work_dir` rename in 4.7 means the
# config sets neither). /var/log/pgpool exists for deployments that turn on
# logging_collector. Mount all three writable.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-pgpool@local

accounts:
  groups:
    - groupname: pgpool
      gid: 1001
  users:
    - username: pgpool
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/bin/pgpool -n -f /etc/pgpool/pgpool.conf -F /etc/pgpool/pcp.conf -a /etc/pgpool/pool_hba.conf

paths:
  # Writable runtime dir for the client + PCP unix sockets and the pidfile.
  - path: /var/run/pgpool
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o755
  # Only used when logging_collector = on; harmless otherwise.
  - path: /var/log/pgpool
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o755

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-pgpool"
  org.opencontainers.image.licenses: "HPND"
