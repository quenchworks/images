# pgpool: Pgpool-II from source via melange (autoconf ./configure && make).
# Latest 3 stable minor lines, newest patch each, fetched from the canonical
# pgpool.net release host (https://www.pgpool.net/source/pgpool-II-<ver>.tar.gz).
# Those tarballs ship a pre-generated `configure`, so no autogen/autoreconf is
# needed. The GitHub mirror only carries git tags (V4_7_2) with no configure.
# Each release pins its source tarball by sha256.
FROM_SOURCE=1
VERSIONS=(4.5.12 4.6.7 4.7.2)
declare -A SHA256=(
  [4.5.12]=048f5a0e6bc22be4755d6f067ff380c33b31581a9fdcb8aa82a53fee8bb6674a
  [4.6.7]=56c3736fff62b7e8213ee5f952c8d7ccf869729cc8ba451ae01d1a2f2ad9b979
  [4.7.2]=e72b9d0ff3620f7da7e33a58dda44b77919d056752dc9bd86b2985c4988d1938
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
