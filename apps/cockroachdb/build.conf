# cockroachdb: from-source via melange (fetch the per-arch self-contained binary
# tarball, sha256-verified). Latest 3 stable minor lines, each at its newest
# patch (full X.Y.Z, used as-is).
#   __VER__     = version (rendered quoted into melange version:)
#   __SHA_AMD__ = linux-amd64 tarball sha256   __SHA_ARM__ = linux-arm64 tarball sha256
# Re-triaged 2026-07-15: newest release is STILL v26.2.3 (tagged 2026-06-24,
# already pinned); confirmed `go version` on its prebuilt binary => go1.25.5, so
# Trivy now flags 26 fixable stdlib CVEs (1 CRITICAL CVE-2025-68121 crypto/tls,
# 13 HIGH, 12 MEDIUM/LOW) — the count grew only because the CVE DB gained 2026
# stdlib entries, the binary is unchanged. Full residual set (all stdlib, fixed
# in go1.25.12+/1.26.5+): CVE-2025-61726, CVE-2025-61728, CVE-2025-61730,
# CVE-2025-68121, CVE-2026-25679, CVE-2026-27139, CVE-2026-27142, CVE-2026-27145,
# CVE-2026-32280, CVE-2026-32281, CVE-2026-32282, CVE-2026-32283, CVE-2026-32288,
# CVE-2026-32289, CVE-2026-33811, CVE-2026-33814, CVE-2026-39820, CVE-2026-39822,
# CVE-2026-39823, CVE-2026-39825, CVE-2026-39826, CVE-2026-39836, CVE-2026-42499,
# CVE-2026-42504, CVE-2026-42505, CVE-2026-42507. 2026-07-23: bumped to the newest
# release v26.2.4 (per-arch prebuilt tarball re-pinned); its baked Go stdlib version
# must be re-verified on rebuild — stays BLOCKED until a release on go1.25.12+/1.26.5+.
# Rebuilding from source to pick up go1.25.12+ requires Bazel (heavy Go+TS-UI+
# CGO/geos tree), infeasible in this sandbox. Unblock when upstream ships a
# release built on go1.25.12+/1.26.5+ or a from-source Bazel build becomes feasible.
BLOCKED=1  # prebuilt binary (Bazel-only from-source, infeasible in-sandbox); baked Go stdlib 1.25.5 CVEs (26 fixable as of 2026-07-15)
FROM_SOURCE=1
VERSIONS=(26.2.4)
declare -A SHA_AMD=(
  [26.2.4]=3c7de055c07f9101eb0f71b3f5e6b489b0fcf449d3d5a55bfe61eff4f935ce8f
)
declare -A SHA_ARM=(
  [26.2.4]=54bb73271bea0ead732bf0e4969cb2a64f189d53151d7833121df9ecdb2132bc
)
render() { echo "s/__VER__/\"$1\"/g; s|__SHA_AMD__|${SHA_AMD[$1]}|g; s|__SHA_ARM__|${SHA_ARM[$1]}|g"; }
