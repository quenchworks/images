# cockroachdb: ships upstream's OWN official per-arch self-contained binary tarball
# (sha256-verified against binaries.cockroachdb.com's published .sha256sum), hardened
# on a minimal apko base. Single version: the newest stable patch, full X.Y.Z, used
# as-is.
#   __VER__     = version (rendered quoted into melange version:)
#   __SHA_AMD__ = linux-amd64 tarball sha256   __SHA_ARM__ = linux-arm64 tarball sha256
#
# STATUS 2026-08-27 — UNBLOCKED. What blocked it: the prebuilt binary through v26.2.5
# was compiled with go1.25.5, so Trivy flagged 26 fixable baked-in Go stdlib CVEs
# (CVE-2025-68121 crypto/tls CRITICAL + 13 HIGH + 12 MEDIUM/LOW), all fixed only in
# go1.25.12+/1.26.5+. Nothing in this recipe could reach them: the toolchain is baked
# into upstream's artifact and from-source rebuild is Bazel-only (at v26.2.6 the
# GNUmakefile is a 78-line shim delegating every target to `./dev build`, i.e. bazel;
# no non-Bazel build path exists any more), and a VEX suppression is not permissible
# for a real stdlib CVE in code we ship (docs/vex-policy.md).
# What fixed it: upstream v26.2.6 (tag pushed after the 2026-08-10 triage) is built on
# go1.25.13, past the 1.25.12 floor. Verified by reading the artifact, not the release
# notes: `go version` on the downloaded binary reports go1.25.13 for BOTH
# linux-amd64 and linux-arm64, and `cockroach version` in the built image reports
# "Go Version: go1.25.13".
# Gate result: x86_64 and aarch64 both scan `wolfi 0 / usr/bin/cockroach gobinary 0`
# => "0 fixable CVEs" (comprehensive, CHML, --ignore-unfixed, no VEX file). Boot test
# green: uid 1001, read-only rootfs, /health?ready=1 200 in 2s, SQL roundtrip OK.
# Why only one version is pinned: the other live lines are still on the old toolchain
# (v26.1.8 => go1.25.5, v25.4.15 => go1.23.12), so they would fail the gate. Add them
# back only once their own binaries report go1.25.12+/1.26.5+.
# Re-check in one command:
#   curl -sSL https://binaries.cockroachdb.com/cockroach-vX.Y.Z.linux-amd64.tgz \
#     | tar -xzO --wildcards '*/cockroach' > /tmp/cr && go version /tmp/cr
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(26.2.6)
declare -A SHA_AMD=(
  [26.2.6]=cd89dd377527de35ba9204b014d180ac973246854c7ad6f7db7fc59607da30ff
)
declare -A SHA_ARM=(
  [26.2.6]=2df0fc5ef57d2d3637e8ab485c963cfeeb87939be8e93945b33619207f5dc6ce
)
render() { echo "s/__VER__/\"$1\"/g; s|__SHA_AMD__|${SHA_AMD[$1]}|g; s|__SHA_ARM__|${SHA_ARM[$1]}|g"; }
