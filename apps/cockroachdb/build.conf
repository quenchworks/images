# cockroachdb: from-source via melange (fetch the per-arch self-contained binary
# tarball, sha256-verified). Latest 3 stable minor lines, each at its newest
# patch (full X.Y.Z, used as-is).
#   __VER__     = version (rendered quoted into melange version:)
#   __SHA_AMD__ = linux-amd64 tarball sha256   __SHA_ARM__ = linux-arm64 tarball sha256
# Re-triaged 2026-07-09: newest release is v26.2.3 (already pinned); its prebuilt
# binary is built on go1.25.5 -> Trivy flags 13 fixable stdlib CVEs (12 HIGH, 1
# CRITICAL incl. CVE-2025-68121 crypto/tls). No v26.2.4+ exists; the most recent
# patches on other supported lines are also stale Go (v26.1.6 -> go1.25.5,
# v25.4.7 -> go1.23.12), so there is NO newer prebuilt to bump to. Rebuilding
# from source to pick up go1.26.5 requires Bazel (heavy Go+TS-UI+CGO/geos tree),
# infeasible in this sandbox. Unblock when upstream ships a release built on
# go1.26.5+ (stdlib CVEs gone) or a from-source Bazel build becomes feasible.
BLOCKED=1  # prebuilt binary (Bazel-only from-source, infeasible in-sandbox); baked Go stdlib 1.25.5 CVEs
FROM_SOURCE=1
VERSIONS=(26.2.3)
declare -A SHA_AMD=(
  [26.2.3]=3eca6d7bc6fefa3ba0847e89733fc69f61226c80b8fab0af6578e1be672f27d3
)
declare -A SHA_ARM=(
  [26.2.3]=50ccfb6e5723e5601d0e9732e7b1cce715949e7b040a3ea6d4ae693379701435
)
render() { echo "s/__VER__/\"$1\"/g; s|__SHA_AMD__|${SHA_AMD[$1]}|g; s|__SHA_ARM__|${SHA_ARM[$1]}|g"; }
