# cockroachdb: from-source via melange (fetch the per-arch self-contained binary
# tarball, sha256-verified). Latest 3 stable minor lines, each at its newest
# patch (full X.Y.Z, used as-is).
#   __VER__     = version (rendered quoted into melange version:)
#   __SHA_AMD__ = linux-amd64 tarball sha256   __SHA_ARM__ = linux-arm64 tarball sha256
FROM_SOURCE=1
VERSIONS=(25.4.11 26.1.5 26.2.2)
declare -A SHA_AMD=(
  [25.4.11]=8e82c43700dbf4e0c6f26ecea7381cc0accddad6c472cf1a39c215409b4f0d5f
  [26.1.5]=781ea277495de76807cbcd675741317fcb91032173bdc96d8cbf47b2f9672619
  [26.2.2]=f712fa7db100a7da301000e7991f90ebf48890ea6064a842c8c4e9ca01d510f2
)
declare -A SHA_ARM=(
  [25.4.11]=1ab5423893cdf9ed6dfad49b5af3d56fb9028632380704178ada88144b88cba0
  [26.1.5]=11a69b2fcf60c82fffe013654236a9304a94f71a8a4afdfaff023b577f020fe8
  [26.2.2]=dfd3559d21ea3d318a5047740f9dfa87b7a6397a6f2876a185747aab55b64a6a
)
render() { echo "s/__VER__/\"$1\"/g; s|__SHA_AMD__|${SHA_AMD[$1]}|g; s|__SHA_ARM__|${SHA_ARM[$1]}|g"; }
