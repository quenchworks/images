package:
  name: quench-ezbookkeeping
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened ezBookkeeping, built from source on Wolfi"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-1.27
      - nodejs-26
      - npm

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/mayswind/ezbookkeeping/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - name: Build the frontend
    runs: |
      set -eu
      export npm_config_cache="$(mktemp -d)" HOME="$(mktemp -d)"
      # the release tarball has no .git: give vite.config.ts the tag's commit instead of git-rev-sync
      sed -i -e "s/git\.short()/'__COMMIT__'/" -e "/^import git from 'git-rev-sync';$/d" vite.config.ts
      grep -q "'__COMMIT__'" vite.config.ts
      npm ci --no-audit --no-fund
      npm run build
      test -f dist/index.html

  - name: Build ezbookkeeping (static cgo sqlite)
    runs: |
      set -eu
      export CGO_ENABLED=1 GOFLAGS=-mod=mod GOTOOLCHAIN=local
      FLOOR="golang.org/x/crypto@v0.58.1-0.20261009181718-2f1f834330b2 golang.org/x/net@v0.62.0 github.com/go-jose/go-jose/v4@v4.1.6 github.com/xuri/excelize/v2@v2.11.1"
      MODS="$(echo "$FLOOR" | tr ' ' '\n' | cut -d@ -f1)"
      below_floor() {
        awk -v floor="$FLOOR" -v tag="$1" '
          BEGIN { n = split(floor, f, " ")
                  for (i = 1; i <= n; i++) { split(f[i], kv, "@"); want[kv[1]] = kv[2] } }
          ($1 in want) {
            split(substr($2, 2), g, "."); split(substr(want[$1], 2), w, ".")
            for (i = 1; i <= 3; i++) {
              if ((g[i] + 0) > (w[i] + 0)) next
              if ((g[i] + 0) < (w[i] + 0)) { print $1 "@" want[$1] " (" tag " has " $2 ")"; next }
            }
          }'
      }
      need="$(go list -m -e $MODS | awk 'NF >= 2 && $NF ~ /^v[0-9]/ { print $1, $NF }' | below_floor go.mod | awk '{ print $1 }')"
      if [ -n "$need" ]; then go get $need; fi
      d="${{targets.destdir}}/ezbookkeeping"
      mkdir -p "$d"
      # upstream build.sh: main.Version / CommitHash / BuildUnixTime, static link
      go build -trimpath -ldflags "-w -s -linkmode external -extldflags '-static' -X main.Version=${{package.version}} -X main.CommitHash=__COMMIT__ -X main.BuildUnixTime=$(date +%s)" \
        -o "$d/ezbookkeeping" ezbookkeeping.go
      bad="$(go version -m "$d/ezbookkeeping" | awk '$1 == "dep" || $1 == "=>" { print $2, $3 }' | below_floor ezbookkeeping)"
      [ -z "$bad" ] || { echo "float did not reach the binary:"; echo "$bad"; exit 1; }
      cp -R dist "$d/public"
      cp -R conf templates "$d/"
      "$d/ezbookkeeping" --version 2>&1 | grep -F "${{package.version}}"

test:
  pipeline:
    - runs: /ezbookkeeping/ezbookkeeping --version
