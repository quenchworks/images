# ezbookkeeping: ezBookkeeping (mayswind/ezbookkeeping), self-hosted personal finance and bookkeeping with
# a web UI and PWA, multi-currency, reports and import/export. MIT. Go with a Vue frontend built here.
# Images issue #43.
#
# SQLite goes through mattn/go-sqlite3 (cgo), linked static as upstream's build.sh does. Layout follows
# upstream's image: /ezbookkeeping/{ezbookkeeping,public,conf,templates}; the writable trees (database,
# storage, log) are pointed at the /ezbookkeeping/data volume by EBK_* variables in apko.yaml.
FROM_SOURCE=1
VERSIONS=(2.1.1 2.2.0)
declare -A SHA256=(
  [2.1.1]=f636449bb9a7156df757726bfa7878fcdc662135f9658a2f86741c95f61e086e
  [2.2.0]=58855bdade27cb31c2e1085e8a449fbce691e4c117e358369a4bc18b6043b865
)
# The tag's commit: vite.config.ts reads it with git-rev-sync, which needs a git repository the tarball lacks.
declare -A COMMIT=(
  [2.1.1]=3dcc316e1fb6a190d6a0dd13fbe4052d17b9315c
  [2.2.0]=056a1ea2e72a1586bfa11b4cb0e196c7296587de
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g; s|__COMMIT__|${COMMIT[$1]}|g"; }
