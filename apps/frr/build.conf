# frr: FRRouting (GPL-2.0-only), the routing suite (BGP, OSPF, IS-IS, BFD, PIM, ...), from
# Wolfi's pinned frr-10.6 apk (FROM_SOURCE=0). Newest line only. Runs as root like
# upstream's image: watchfrr and zebra need raw sockets and NET_ADMIN, and the daemons drop
# to the frr user (1001) themselves. The entrypoint is upstream's docker-start, which runs
# watchfrr in the foreground over the daemons enabled in /etc/frr/daemons; mount
# /etc/frr (daemons, frr.conf, vtysh.conf) to configure it. MetalLB's FRR mode expects
# this layout.
BLOCKED=0
FROM_SOURCE=0
VERSIONS=(10.6.1)
declare -A PIN=( [10.6.1]=10.6.1-r0 )
render() { local v=$1; echo "s/__VER__/$v/g; s/__REL__/${PIN[$v]}/g"; }
