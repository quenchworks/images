# quickwit: from-source via melange (Rust/cargo build of quickwit-cli from the git
# tag source tarball). The React admin UI is built in-sandbox with nodejs-20 + yarn
# (same as upstream's Dockerfile) and embedded into the binary via rust-embed.
# NEWEST-ONLY: a single stable release, source tarball pinned by sha256, matching the
# no-render CI path.
#
# 0.9.0 (2026-08-31): four recipe changes the bump forced, none optional --
#   * toolchain rust-1.82 -> rust-1.96. The workspace moved to edition 2024 and
#     rust-toolchain.toml now pins channel 1.96; 1.82 cannot compile edition 2024.
#   * the `cargo update -p time --precise 0.3.36` line was DELETED. It existed for
#     0.8.2's locked time 0.3.34 (E0282 under rustc >= 1.80); 0.9.0's lock carries
#     time 0.3.53, so the --precise pin would have DOWNGRADED the crate -- the
#     cargo-side twin of a stale `go get mod@vX` floor (docs/go-module-float.md).
#   * the pulsar repoint step was DELETED. 0.8.2 pinned `pulsar` to the deleted
#     quickwit-oss/pulsar-rs git repo; 0.9.0 uses crates.io `pulsar = "6.8"`, and the
#     step self-guarded with `exit 1` when the git dep was absent, so it would have
#     hard-failed the build.
#   * `quickwit-doc-mapper/multilang` dropped from --features: 0.9.0 removed that
#     feature, so passing it fails the build. pprof / lambda / sqs / pulsar are new in
#     upstream release-feature-set and deliberately not adopted.
# __VER__ = version   __SHA256__ = source-tarball sha256
FROM_SOURCE=1
VERSIONS=(0.9.0)
declare -A SHA256=(
  [0.9.0]=eb7deff5b0ce407806160ae8422998b3312868fad9109408f4786835c989da80
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
