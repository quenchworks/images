# 0.9.0 (2026-08-31): four recipe changes the bump forced, none optional --
#   * toolchain rust-1.82 -> rust-1.96. The workspace moved to edition 2024 and
#     rust-toolchain.toml now pins channel 1.96; 1.82 cannot compile edition 2024.
#   * the `cargo update -p time --precise 0.3.36` line was DELETED. It existed for
#     0.8.2's locked time 0.3.34 (E0282 under rustc >= 1.80); 0.9.0's lock carries
#     time 0.3.53, so the --precise pin would have DOWNGRADED the crate -- the
#     cargo-side twin of a stale `go get mod@vX` floor (docs/go-module-float.md).
#   * the pulsar repoint step was DELETED. 0.8.2 pinned `pulsar` to the deleted
#     quickwit-oss/pulsar-rs git repo; 0.9.0 uses crates.io `pulsar = "6.8"`, and the
#     step self-guarded with `exit 1` when the git dep was absent, so it would have
#     hard-failed the build.
#   * `quickwit-doc-mapper/multilang` dropped from --features: 0.9.0 removed that
#     feature, so passing it fails the build. pprof / lambda / sqs / pulsar are new in
#     upstream release-feature-set and deliberately not adopted.
#
# STATUS (measured 2026-09-16, CI run 35096893614 on commit 1b46ffc):
# The build itself is FIXED and green. It had been failing on BOTH arches inside
# rdkafka-sys 4.10.0, which compiles a vendored librdkafka 2.12.1 from C:
#   librdkafka/src/rdkafka_conf.c:60:10: fatal error: curl/curl.h:
#   No such file or directory
# That is an upstream librdkafka bug, not a toolchain-strictness failure.
# rdkafka_conf.c guards the include with `#ifdef WITH_OAUTHBEARER_OIDC`, but
# packaging/cmake/config.h.in declares the option `#cmakedefine01`, which ALWAYS
# emits a definition -- here `#define WITH_OAUTHBEARER_OIDC 0`. So the #ifdef is
# always true and curl.h is pulled in even though rdkafka-sys passes
# -DWITH_CURL=0. Still present in librdkafka 2.13.0, so bumping rdkafka-sys does
# not fix it. Fix: curl-dev in melange environment.contents.packages (headers
# only -- WITH_CURL stays 0, no curl symbol is referenced, nothing links
# libcurl).
#
# With that in, both arches compiled the full cargo workspace and reached the
# 0-CVE gate, which reports on x86_64 AND aarch64, identically:
#   Total: 1 (LOW: 0, MEDIUM: 1, HIGH: 0, CRITICAL: 0)
#   zlib CVE-2026-85091 (MEDIUM), installed 1.3.2.1_rc20260601-r0, wants
#   1.3.3-r0 -- a package Wolfi does not have, because upstream zlib has never
#   tagged 1.3.3. This is the catalog-wide wall (same as adc/gitness/
#   coolify-helper), nothing to do with quickwit.
# Every other finding is clear. The boot test never ran: the gate fails ahead of
# it, so the image is unproven at runtime for 0.9.0.
