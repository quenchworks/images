# quickwit: from-source via melange (Rust/cargo build of quickwit-cli from the git
# tag source tarball; rust-1.82 provides the rustfmt tonic's codegen needs -- the
# oldest rust Wolfi still publishes, after retiring 1.78 in 2026-08; the locked
# `time` 0.3.34 is bumped to 0.3.36 in-pipeline for rustc>=1.80 compat). The React
# admin UI is built in-sandbox with nodejs-20 + yarn (same as upstream's Dockerfile)
# and embedded into the binary via rust-embed. NEWEST-ONLY: a single stable release,
# source tarball pinned by sha256, matching the no-render CI path.
# __VER__ = version   __SHA256__ = source-tarball sha256
FROM_SOURCE=1
VERSIONS=(0.8.2)
declare -A SHA256=(
  [0.8.2]=aa9e932662e48447d814e36db657acd4c9a69beb97c16006e9cb5539585fd947
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
