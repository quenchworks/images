# convertx: ConvertX (C4illin/ConvertX, AGPL-3.0), a self-hosted file converter with a web UI. Images issue #98.
#
# From the release tag: bun install, the Tailwind CSS build and `bun build --compile` into one binary (Wolfi bun 1.4.4,
# upstream's own). The converters are Wolfi packages: ffmpeg, imagemagick-7, graphicsmagick, libreoffice-26.8, libheif,
# libjxl-tools, poppler-utils, potrace (+ ghostscript for ImageMagick's PDF input). Converters whose tools Wolfi does not
# package (pandoc, Inkscape, Calibre, vips, resvg, TeX, dasel, assimp, djvulibre, dvisvgm, markitdown, msgconvert,
# vtracer) are removed from the registry so the UI never offers them. LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(0.20.0)
declare -A SHA256=(
  [0.20.0]=4726a6da47362ea5506db563fb38b852d859ec535ca64e11f81e5b52e7ef0299
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
