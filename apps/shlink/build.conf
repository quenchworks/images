# Shlink: the self-hosted URL shortener (PHP), served by RoadRunner as upstream's image is.
# Built from the release tag with composer --no-dev; the Symfony components the tag locks at
# 8.1.9 (http-client CVE-2026-121971 HIGH, plus http-foundation and yaml advisories) move to
# their newest 8.1 patch in the build. RoadRunner is built from source at the version
# spiral/roadrunner pins in the tag's composer.lock (Wolfi has no roadrunner apk); upstream's
# image downloads that binary with `rr get` instead.
FROM_SOURCE=1
VERSIONS=(5.1.8)
declare -A SHA256=(
  [5.1.8]=a9852624b786888dd08af084477f814b84f8f45b449f0126d243906ca7ecbdb7
)
# RoadRunner paired with the newest version above (spiral/roadrunner in composer.lock)
RR_VER=2025.1.15
RR_SHA=32e0196ae551b6ad2abf50cbfc961f91e9dd4134bd177b0f7aa03dada9e41979
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g; s|__RR_VER__|${RR_VER}|g; s|__RR_SHA__|${RR_SHA}|g"; }
