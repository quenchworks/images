pipeline:
  - uses: fetch
    with:
      uri: https://github.com/shlinkio/shlink/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - runs: mkdir -p rr-src

  - uses: fetch
    with:
      uri: https://github.com/roadrunner-server/roadrunner/archive/refs/tags/v__RR_VER__.tar.gz
      expected-sha256: __RR_SHA__
      directory: rr-src

  - name: Shlink with composer, Symfony floor raised
    runs: |
      set -eu
      export COMPOSER_HOME="$(mktemp -d)" COMPOSER_ALLOW_SUPERUSER=1
      composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader
      # 8.1.9 carries CVE-2026-121971 (http-client) and the http-foundation / yaml advisories;
      # the newest 8.1 patch inside the tag's own constraints fixes them
      composer update --no-dev --no-interaction --no-progress --optimize-autoloader \
        symfony/http-client symfony/http-foundation symfony/yaml
      for p in symfony/http-client symfony/http-foundation symfony/yaml; do
        v="$(composer show --locked "$p" | sed -n 's/^versions : \* v//p')"
        echo "$p $v"
        [ "$(printf '%s\n%s\n' 8.1.11 "$v" | sort -V | head -1)" = 8.1.11 ] || { echo "$p $v is below 8.1.11"; exit 1; }
      done
      # the RoadRunner binary must match what the PHP worker library speaks
      grep -q '"name": "spiral/roadrunner",' vendor/composer/installed.json
      sed -i "s/%SHLINK_VERSION%/${{package.version}}/g" module/Core/src/Config/Options/AppOptions.php
      if grep -q '%SHLINK_VERSION%' module/Core/src/Config/Options/AppOptions.php; then echo "version not stamped"; exit 1; fi
      app="${{targets.destdir}}/etc/shlink"
      install -d -m 0755 "$app"
      for f in *; do case "$f" in melange-out|rr-src|docker|composer.*|phpunit*|phpstan*|phpcs*|infection*|docs|*.md|Dockerfile|data) ;; *) cp -a "$f" "$app/" ;; esac; done
      # data/ is the writable volume (cache, locks, logs, sqlite db): ship it empty
      install -d -m 0755 "$app/data"
      test -f "$app/vendor/autoload.php" && php -l "$app/public/index.php" >/dev/null

  - name: RoadRunner from source
    working-directory: rr-src
    runs: |
      set -eu
      # the repo carries a go.work for its plugins; build the module on its own
      export CGO_ENABLED=0 GOTOOLCHAIN=local GOFLAGS=-mod=mod GOWORK=off
      FLOOR="golang.org/x/crypto@v0.58.1-0.20261009181718-2f1f834330b2 golang.org/x/net@v0.62.0 golang.org/x/text@v0.43.0 golang.org/x/sys@v0.49.0"
      # rr compiles in every plugin; their dependencies' fixes (measured on v2025.1.15):
      # amqp091-go 1.12.0 (11 CVEs incl. CRITICAL CVE-2026-77405), grpc 1.81.1 (CVE-2026-84304,
      # -84445, -84303, GHSA-hrxh-6v49-42gf), klauspost/compress CVE-2026-63209, fiber
      # CVE-2026-45045, otel exporters CVE-2026-81870
      FLOOR="$FLOOR github.com/rabbitmq/amqp091-go@v1.14.0 google.golang.org/grpc@v1.83.2"
      FLOOR="$FLOOR github.com/klauspost/compress@v1.19.1 github.com/gofiber/fiber/v2@v2.52.14"
      # the otel modules move as one family: a partial bump breaks the build (otel-is-many-modules)
      for m in $(go list -m -f '{{.Path}} {{.Version}}' all | awk '($1 ~ /^go\.opentelemetry\.io\/otel(\/|$)/ || $1 ~ /^go\.opentelemetry\.io\/contrib\/bridges\/otel(zap|logrus|slog)$/) && $1 !~ /\/exporters\/jaeger$/ { if ($1 ~ /\/contrib\/bridges\//) print $1"@v0.21.0"; else if ($1 ~ /\/exporters\/(otlp\/otlplog\/|stdout\/stdoutlog$)/) print $1"@v0.23.0"; else if ($1 ~ /\/exporters\/prometheus$/) print $1"@v0.69.0"; else if ($2 ~ /^v1\./ || $1 ~ /\/(sdk\/)?log$/) print $1"@v1.47.0" }'); do
        FLOOR="$FLOOR $m"
      done
      need=""
      for f in $FLOOR; do
        have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${f%@*}")"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        [ "$(printf '%s\n%s\n' "$have" "${f#*@}" | sort -V | head -1)" = "${f#*@}" ] || need="$need $f"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || go get $need
      go mod tidy
      go build -trimpath -ldflags "-s -w -X github.com/roadrunner-server/roadrunner/v2025/internal/meta.version=__RR_VER__" \
        -o "${{targets.destdir}}/etc/shlink/bin/rr" ./cmd/rr
      "${{targets.destdir}}/etc/shlink/bin/rr" -v | grep -F "__RR_VER__"

  - name: Start script (upstream's docker-entrypoint.sh, data dir on the volume)
    runs: |
      set -eu
      d="${{targets.destdir}}"
      install -d "$d/usr/bin"
      printf '%s\n' \
        '#!/bin/sh' \
        'set -e' \
        'cd /etc/shlink' \
        'mkdir -p data/cache data/locks data/log data/proxies data/temp-geolite' \
        'flags="--no-interaction --clear-db-cache"' \
        'geo="$(bin/cli env-var:read GEOLITE_LICENSE_KEY)"' \
        'skip="$(bin/cli env-var:read SKIP_INITIAL_GEOLITE_DOWNLOAD)"' \
        'key="$(bin/cli env-var:read INITIAL_API_KEY)"' \
        'if [ -z "$geo" ] || [ "$skip" = true ]; then flags="$flags --skip-download-geolite"; fi' \
        'if [ -n "$key" ]; then flags="$flags --initial-api-key=$key"; fi' \
        'php vendor/bin/shlink-installer init $flags' \
        'exec ./bin/rr serve -c config/roadrunner/.rr.yml' \
        > "$d/usr/bin/shlink-start"
      chmod 0755 "$d/usr/bin/shlink-start"
      ln -s /etc/shlink/bin/cli "$d/usr/bin/shlink"
