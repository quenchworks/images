# Shlink from the release tag (composer --no-dev, Symfony patch floor) and RoadRunner built from
# source; the PHP runtime and extensions come from Wolfi.
package:
  name: quench-shlink
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Shlink (release tag + composer) on RoadRunner, Wolfi PHP 8.4"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - php-8.4
      - php-8.4-config
      - php-8.4-curl
      - php-8.4-curl-config
      - php-8.4-mbstring
      - php-8.4-mbstring-config
      - php-8.4-pdo
      - php-8.4-pdo-config
      - php-8.4-pdo_mysql
      - php-8.4-pdo_mysql-config
      - php-8.4-mysqlnd
      - php-8.4-mysqlnd-config
      - php-8.4-pdo_pgsql
      - php-8.4-pdo_pgsql-config
      - php-8.4-pdo_sqlite
      - php-8.4-pdo_sqlite-config
      - php-8.4-intl
      - php-8.4-intl-config
      - php-8.4-calendar
      - php-8.4-calendar-config
      - php-8.4-sockets
      - php-8.4-sockets-config
      - php-8.4-bcmath
      - php-8.4-bcmath-config
      - php-8.4-zip
      - php-8.4-zip-config
      - php-8.4-xml
      - php-8.4-xml-config
      - php-8.4-dom
      - php-8.4-dom-config
      - php-8.4-simplexml
      - php-8.4-simplexml-config
      - php-8.4-xmlwriter
      - php-8.4-xmlwriter-config
      - php-8.4-openssl
      - php-8.4-openssl-config
      - php-8.4-ctype
      - php-8.4-ctype-config
      - php-8.4-iconv
      - php-8.4-iconv-config
      - php-8.4-fileinfo
      - php-8.4-fileinfo-config
      - php-8.4-opcache
      - php-8.4-opcache-config
      - php-8.4-posix
      - php-8.4-posix-config
      - php-8.4-pcntl
      - php-8.4-pcntl-config
      - php-8.4-sodium
      - php-8.4-sodium-config
      - busybox

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - composer
      - go-1.26
      - php-8.4
      - php-8.4-config
      - php-8.4-curl
      - php-8.4-curl-config
      - php-8.4-mbstring
      - php-8.4-mbstring-config
      - php-8.4-pdo
      - php-8.4-pdo-config
      - php-8.4-pdo_mysql
      - php-8.4-pdo_mysql-config
      - php-8.4-mysqlnd
      - php-8.4-mysqlnd-config
      - php-8.4-pdo_pgsql
      - php-8.4-pdo_pgsql-config
      - php-8.4-pdo_sqlite
      - php-8.4-pdo_sqlite-config
      - php-8.4-intl
      - php-8.4-intl-config
      - php-8.4-calendar
      - php-8.4-calendar-config
      - php-8.4-sockets
      - php-8.4-sockets-config
      - php-8.4-bcmath
      - php-8.4-bcmath-config
      - php-8.4-zip
      - php-8.4-zip-config
      - php-8.4-xml
      - php-8.4-xml-config
      - php-8.4-dom
      - php-8.4-dom-config
      - php-8.4-simplexml
      - php-8.4-simplexml-config
      - php-8.4-xmlwriter
      - php-8.4-xmlwriter-config
      - php-8.4-openssl
      - php-8.4-openssl-config
      - php-8.4-ctype
      - php-8.4-ctype-config
      - php-8.4-iconv
      - php-8.4-iconv-config
      - php-8.4-fileinfo
      - php-8.4-fileinfo-config
      - php-8.4-opcache
      - php-8.4-opcache-config
      - php-8.4-posix
      - php-8.4-posix-config
