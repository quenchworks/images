# STATUS: BLOCKED 2026-09-29 on an upstream pin. The only gate finding, on both lines, is
#   web-auth/webauthn-lib CVE-2024-39912 (MEDIUM, username enumeration)
#   installed 4.5.2, fixed in 4.9.0
# and Joomla pins that exact version on every branch (6.1-dev, 6.2-dev, 5.4-dev all say
# "web-auth/webauthn-lib": "4.5.2") while its composer audit config ignores the advisory
# "until Webauthn plugin has been updated". 4.9.x also adds a lcobucci/clock dependency and
# is not a drop-in for the plugin, so floating it would trade a scanner finding for broken
# passkey login. The archive has no composer.json to float with either. 6.1.3 measured on
# x86_64: everything else gates clean and the image builds; the smoke test has not run.
# Unblock when a Joomla release ships webauthn-lib >= 4.9.0: set BLOCKED=0, run the local
# gate on both lines, dispatch.
BLOCKED=1
# joomla: the official Full_Package release archive from the joomla-cms GitHub release,
# served by a Wolfi PHP-FPM + nginx runtime. The archive is finished PHP with its
# composer vendor tree already resolved (libraries/vendor), so there is nothing to
# compile and FROM_SOURCE stays unset (like mediawiki).
# Lines: 5.4 (long-term support) and 6.1 (current). PHP 8.3 meets both floors:
# JOOMLA_MINIMUM_PHP is 8.3.0 on 6.x and 8.1.0 on 5.4.
# Each sha256 is from a download of the archive on 2026-09-29.
VERSIONS=(5.4.8 6.1.3)
declare -A SHA256=(
  [5.4.8]=2c9dc7e6f451c83c43bbb7eb5c9348cb889ba802b72915c5bbd899f9d2de3f3d
  [6.1.3]=184f8c582cde5981693de7c28547c6e834c48c50cb377c7b8421bbfd33bbdf6f
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
