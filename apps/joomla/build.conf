# STATUS: UNBLOCKED 2026-09-30. The one gate finding was web-auth/webauthn-lib 4.5.2
# CVE-2024-39912, whose vulnerable class (ProfileBasedRequestOptionsBuilder) is not in Joomla's
# vendored library at all; it is VEXed with the evidence in vex.openvex.json. Joomla still pins
# 4.5.2 (5.4.9 and 6.1.4). Re-check the VEX when Joomla moves webauthn-lib. The vendored
# phpseclib 3.0.55 (CVE-2026-84308) is swapped for 3.0.57 in melange.yaml; the swap skips
# once Joomla ships 3.0.57 or newer.
BLOCKED=0
# joomla: the official Full_Package release archive from the joomla-cms GitHub release,
# served by a Wolfi PHP-FPM + nginx runtime. The archive is finished PHP with its
# composer vendor tree already resolved (libraries/vendor), so there is nothing to
# compile and FROM_SOURCE stays unset (like mediawiki).
# Lines: 5.4 (long-term support) and 6.1 (current). PHP 8.3 meets both floors:
# JOOMLA_MINIMUM_PHP is 8.3.0 on 6.x and 8.1.0 on 5.4.
# Each sha256 is from a download of the archive on 2026-09-30.
VERSIONS=(5.4.9 6.1.4)
declare -A SHA256=(
  [5.4.9]=8c658d16b6e908f8cfce3556ac7280fe210c4ebd916202f406fe6bf1b5b05149
  [6.1.4]=9558a3a3754cbe798c8a8b3d46afa4e4a0a9284de876e4ce82c0ccaeb9f4af41
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
