      # trivy against the 3.6.1 exec jar): netty 4.2.17.Final, jackson 2.21.5, spring
      # 6.2.19, spring-boot 3.5.15, micrometer 1.16.6, opentelemetry 1.62.0, log4j 2.25.5,
      # bouncycastle 1.85, amqp-client 5.34.0, mariadb-java-client 3.5.9, lz4-java 1.11.1,
