# Packages Zipkin onto Wolfi from the official zipkin-server exec jar on Maven Central,
# exploded so the vulnerable libraries in BOOT-INF/lib can be replaced one jar at a time.
package:
  name: quench-zipkin
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Zipkin distributed tracing server, on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - openjdk-21-jre
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - curl

pipeline:
  - uses: fetch
    with:
      uri: https://repo1.maven.org/maven2/io/zipkin/zipkin-server/${{package.version}}/zipkin-server-${{package.version}}-exec.jar
      expected-sha256: __SHA256__
      extract: false
  - runs: |
      set -eu
      dest="${{targets.destdir}}/usr/lib/zipkin"
      install -d "$dest"
      unzip -q zipkin-server-${{package.version}}-exec.jar -d "$dest"
      lib="$dest/BOOT-INF/lib"
      M=https://repo1.maven.org/maven2
      # swap <shipped jar> <maven path of the fixed jar> <its sha256, from a download>
      # Each swap asserts the old jar is shipped, so a release that moves a library fails
      # loudly instead of gaining a second copy. classpath.idx and layers.idx are
      # rewritten to the new names: the launcher builds the classpath from them.
      swap() {
        test -f "$lib/$1" || { echo "FATAL: $1 not shipped; re-audit the swaps"; exit 1; }
        new="$(basename "$2")"
        curl -fsSL -o "$lib/$new" "$M/$2"
        echo "$3  $lib/$new" | sha256sum -c -
        rm -f "$lib/$1"
        sed -i "s|BOOT-INF/lib/$1\"|BOOT-INF/lib/$new\"|" "$dest/BOOT-INF/classpath.idx" "$dest/BOOT-INF/layers.idx"
      }
      # drop <shipped jar>: removed with its index lines
      drop() {
        test -f "$lib/$1" || { echo "FATAL: $1 not shipped; re-audit the drops"; exit 1; }
        rm -f "$lib/$1"
        sed -i "\|BOOT-INF/lib/$1\"|d" "$dest/BOOT-INF/classpath.idx" "$dest/BOOT-INF/layers.idx"
      }
