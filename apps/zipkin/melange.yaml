      # Two legacy collectors are removed. Pulsar's client nests Bouncy Castle 1.78.1/1.81
      # inside bouncy-castle-bc-4.1.3-pkg.jar, and Pulsar's newest bundle (4.2.4) still
      # nests 1.84, below the 1.85 fix. Scribe needs libthrift 0.18.1 (fixed in 0.24.0)
      # through armeria-thrift0.18, which is compiled against 0.18. HTTP, gRPC, Kafka,
      # RabbitMQ and ActiveMQ collection and every storage backend stay.
      for j in zipkin-collector-pulsar-3.6.1.jar pulsar-client-4.1.3.jar pulsar-client-admin-api-4.1.3.jar \
               pulsar-client-api-4.1.3.jar bouncy-castle-bc-4.1.3-pkg.jar \
               zipkin-collector-scribe-3.6.1.jar armeria-thrift0.18-1.38.0.jar libthrift-0.18.1.jar; do
        drop "$j"
      done
      # every classpath entry is a shipped jar, and every shipped jar is on the classpath
      idx="$(sed -n 's|.*BOOT-INF/lib/\([^"]*\)".*|\1|p' "$dest/BOOT-INF/classpath.idx" | sort)"
      have="$(ls "$lib" | sort)"
      [ "$idx" = "$have" ] || { echo "FATAL: classpath.idx and BOOT-INF/lib disagree"; echo "index: $idx"; echo "lib: $have"; exit 1; }
      chmod -R a+rX "$dest"

test:
  pipeline:
    - runs: |
        test -f /usr/lib/zipkin/BOOT-INF/classpath.idx
        test -f /usr/lib/zipkin/org/springframework/boot/loader/launch/JarLauncher.class
