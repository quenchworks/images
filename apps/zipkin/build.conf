# zipkin: Zipkin, the distributed tracing server (collector, storage, query API and the
# Lens UI on 9411), from the official zipkin-server exec jar on Maven Central, exploded
# on a Wolfi openjdk-21-jre so its libraries can be replaced.
#
# 0-CVE: the stock 3.6.1 exec jar carries 56 findings. melange.yaml swaps 66 jars to one
# fixed version per family and removes the Pulsar and Scribe collectors (their fixes are
# not reachable by a swap; the reasons are in melange.yaml). A local trivy rootfs of the
# result measured 0, and the swapped server booted, stored a posted span and served it
# back by trace ID.
#
# Why not Wolfi's zipkin apk: 3.6.1-r9 carries 52 findings and ships no kafka-clients
# jar, so its Kafka collector cannot start.
#
# NEWEST-ONLY: Zipkin ships one supported line.
BLOCKED=0
FROM_SOURCE=0
VERSIONS=(3.6.1)
# sha256 of the exec jar, from a download (its sha1 matches Maven Central's published .sha1)
declare -A SHA256=(
  [3.6.1]=d8326e0ed4f43855dba81228f688554706e52578a7c782d9a90b73f8680654a1
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
