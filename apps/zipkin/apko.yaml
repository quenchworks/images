contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-zipkin@local

accounts:
  groups:
    - groupname: nonroot
      gid: 1001
  users:
    - username: nonroot
      uid: 1001
      gid: 1001
      homedir: /home/nonroot
  run-as: 1001

environment:
  JAVA_HOME: /usr/lib/jvm/java-21-openjdk
  HOME: /home/nonroot
  LANG: C.UTF-8

paths:
  - path: /home/nonroot
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o755

work-dir: /usr/lib/zipkin

# Spring Boot's launcher over the exploded jar: it builds the classpath from
# BOOT-INF/classpath.idx, which the build rewrote to the swapped jar names.
# openjdk-21-jre has no /usr/bin/java symlink, so the path is the JDK's own.
entrypoint:
  command: /usr/lib/jvm/java-21-openjdk/bin/java -cp /usr/lib/zipkin org.springframework.boot.loader.launch.JarLauncher

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-zipkin"
  org.opencontainers.image.licenses: "Apache-2.0"
