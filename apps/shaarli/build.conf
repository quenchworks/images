# shaarli: Shaarli (shaarli/Shaarli, Zlib), a personal, minimalist bookmark manager and link sharing service
# with tags, a daily digest, RSS/Atom feeds and a REST API, stored in flat files. Images issue #79.
#
# From the -full release zip (vendor/ and built assets included). php-8.5-fpm and QuenchWorks' nginx under
# supervisor; data/, cache/, pagecache/ and tmp/ link to /var/lib/shaarli (the volume). nginx serves only
# index.php and the static assets: application/, data/, vendor/ and the other code paths answer 403. The
# install form is replaced by /usr/libexec/shaarli-config.php, which writes data/config.json.php through
# Shaarli's ConfigManager from SHAARLI_USER/SHAARLI_PASSWORD (the installer's salted hash), with the API on
# and SHAARLI_API_SECRET (or a random one).
# LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(0.16.11)
declare -A SHA256=(
  [0.16.11]=f60affb376e69ddb33679a1b75604e2c0965cc795f89295a9a8aaa3ba5d9c5e8
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
