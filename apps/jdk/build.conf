# jdk: apko-runtime from Wolfi's openjdk-<major> packages. Published tag is the
# FULL version Wolfi resolves; render maps __VER__ -> the major (the Wolfi package
# + JAVA_HOME path), while the workflow tags the full version.
#
# WINDOW: 3 lines -- build-jdk.yml's prep job builds only the LAST 3 VERSIONS
# entries, so a 4th would be silently ignored. 2026-07-27: added openjdk-26
# (26.0.2-r0, both arches) and DROPPED 17.0.19 to stay inside that cap, leaving
# the 2 newest LTS (21, 25) + the current feature release (26).
#   * 26 is a 6-MONTH feature release, NOT an LTS: its public updates stop when
#     JDK 27 (LTS) ships, after which it will rot and fail the 0-CVE gate. Swap
#     it for 27 as soon as Wolfi packages it.
#   * To carry 17 as well, raise the `n > 3` cap in .github/workflows/build-jdk.yml
#     (prep step) to 4 -- VERSIONS alone is not enough.
FROM_SOURCE=0
# 2026-07-27: openjdk-26 was deliberately NOT added. The build workflow's prep job
# slices VERSIONS to the last 3, so a 4th band is silently never built — meaning
# adding 26 would have COST us LTS 17. OpenJDK 26 is a feature release that EOLs
# when 27 (LTS) ships (~Sept 2026), after which it rots and fails the gate. Three
# LTS lines (17/21/25) is strictly more useful for a production catalog than
# trading an LTS out for a two-month feature release.
# To carry 26 as well, first raise the cap to 4 in .github/workflows/build-<app>.yml.
VERSIONS=(17.0.20 21.0.12 25.0.4)
render() { local v="$1"; echo "s/__VER__/${v%%.*}/g"; }
