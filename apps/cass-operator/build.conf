# cass-operator (Apache Cassandra datacenters from a CassandraDatacenter resource; K8ssandra
# Operator drives it), from k8ssandra/cass-operator (Apache-2.0). From the release tag via melange:
# one static Go binary (cmd/main.go) at /manager like upstream, with the house golang.org/x floor.
# Upstream stamps no version into the binary. LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(1.33.1)
declare -A SHA256=(
  [1.33.1]=58afedc2b7d8363a80db8758b47df2d565ad918980090573ae34fb27fbef2b63
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
