# jetty: Eclipse Jetty ships an official binary distribution (jetty-home) on Maven
# Central. FROM_SOURCE=0: fetch + unpack onto a Wolfi JRE, the same JVM pattern as
# apps/tomcat. The supported lines are 12.1 and 12.0 (11 is past community support).
# Each release pins its tarball by sha256, computed from a download whose sha1 matched
# the one Maven Central publishes. EE is the default Jakarta EE level the pre-built
# JETTY_BASE deploys web apps with: ee11 on 12.1 (its default), ee10 on 12.0 (newest).
FROM_SOURCE=0
VERSIONS=(12.0.41 12.1.15)
declare -A SHA256=(
  [12.0.41]=af3c5bf96510738271a676152ddd7c749eb9a4db1511c833f128d8bbd2b3c6aa
  [12.1.15]=dc2054089aab9495cca548ee67be491cd710023dacf9365870c93a88933c2a62
)
declare -A EE=(
  [12.0.41]=ee10
  [12.1.15]=ee11
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g; s|__EE__|${EE[$1]}|g"; }
