# Assembles the Emissary-ingress apiext runtime image. Minimal, nonroot, multi-arch, SBOM by
# apko. Upstream's layout: /usr/local/bin/apiext, uid 8888, ENTRYPOINT apiext with the
# service name as first argument (upstream's chart passes emissary-apiext).
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-emissary-apiext@local

accounts:
  groups:
    - groupname: ambassador
      gid: 8888
  users:
    - username: ambassador
      uid: 8888
      gid: 8888
  run-as: 8888

entrypoint:
  command: /usr/local/bin/apiext emissary-apiext

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-emissary-apiext"
  org.opencontainers.image.licenses: "Apache-2.0"
