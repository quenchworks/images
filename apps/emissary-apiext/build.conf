# emissary-apiext (Emissary-ingress CRD conversion webhook): from-source via melange, Go
# build of ./cmd/apiext from the emissary-ingress/emissary tag tarball. Newest line only
# for now: 4.x runs stock Envoy; 3.x needs Emissary's own Envoy fork.
FROM_SOURCE=1
VERSIONS=(4.2.0)
declare -A SHA256=(
  [4.2.0]=da4b1aab49820ee237c02a12d6411cab2e856b9cb7117e97444eeece153275d8
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
