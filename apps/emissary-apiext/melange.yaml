# Builds Emissary-ingress's apiext (the CRD conversion webhook) from source onto Wolfi.
# Single static Go binary, no CGO. The version is read at runtime from
# /buildroot/ambassador/python/ambassador.version (line 1 version, line 2 commit), as in
# upstream's image, so the package installs that file.
package:
  name: quench-emissary-apiext
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Emissary-ingress apiext, built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/emissary-ingress/emissary/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      set -eu
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      export GOTOOLCHAIN=local
      # 0-CVE FLOORS, not pins (docs/go-module-float.md): raise a module only where go.mod
      # has it below the floor; a module absent from the graph is skipped. The 9 replaces
      # pin the k8s.io staging repos and none of these modules.
      FLOOR="golang.org/x/crypto@v0.56.0 golang.org/x/mod@v0.40.0 golang.org/x/net@v0.58.0 golang.org/x/text@v0.41.0 golang.org/x/sys@v0.47.0 google.golang.org/grpc@v1.83.2 github.com/go-git/go-git/v5@v5.19.2 github.com/go-git/go-billy/v5@v5.9.0 github.com/gorilla/websocket@v1.5.3 github.com/moby/spdystream@v0.5.1"
      need=""
      for mv in $FLOOR; do
        have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${mv%@*}" 2>/dev/null)"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        [ "$(printf '%s\n%s\n' "$have" "${mv#*@}" | sort -V | head -1)" = "${mv#*@}" ] || need="$need $mv"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || go get $need
      go mod tidy
      # vex.openvex.json holds only while no kubelet, volume, controller or admission
      # package of k8s.io/kubernetes is linked (apiext links pkg/util/node only).
      if go list -deps ./cmd/apiext | grep -E '^k8s.io/kubernetes/(pkg/kubelet|pkg/volume|pkg/controller|plugin/pkg/admission)'; then
        echo "apiext now links vulnerable k8s.io/kubernetes code: re-check vex.openvex.json"; exit 1
      fi
      go build -trimpath -ldflags "-s -w" -o "${{targets.destdir}}/usr/local/bin/apiext" ./cmd/apiext
      mkdir -p "${{targets.destdir}}/buildroot/ambassador/python"
      printf '%s\n%s\n' "${{package.version}}" "v${{package.version}}" \
        > "${{targets.destdir}}/buildroot/ambassador/python/ambassador.version"
