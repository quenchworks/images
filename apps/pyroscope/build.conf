# Grafana Pyroscope (grafana/pyroscope): from-source via melange. Image-only (a
# continuous-profiling database/server, no chart). NEWEST-ONLY: we track just the
# latest stable release. Go backend (single static binary, CGO disabled) that
# go:embeds a Vite/React web UI, so the frontend is (re)built with yarn+Node in
# the build sandbox first (see melange.yaml). Version is stamped via -X on
# github.com/grafana/pyroscope/v2/pkg/util/build.Version (upstream tags carry a
# "v" prefix; the stamped version is the bare X.Y.Z).
FROM_SOURCE=1
VERSIONS=(2.3.4 2.4.2)
declare -A SHA256=(
  [2.3.4]=f0f9cd92b66a6d2f6faadaa577e919ab27dad55595d58f45114ef9ce3d5b005a
  [2.4.2]=ef9326fd4f861dee64612ac9bac13d75451cd84ad997883e1da60d3885517f3c
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
