# mattermost: image-only recipe input (the chart is authored in the charts repo).
#
# Unblocked 2026-07-09 via a SERVER-ONLY from-source build (see melange.yaml header):
# upstream's OWN prebuilt server binary baked stale x/net/x/crypto/x/image + an older Go
# stdlib that Trivy flagged (14 HIGH: x/crypto 0.51.0, x/net 0.54.0; + MEDIUM x/image
# 0.40.0; + stdlib 1.26.3). We now build ONLY the Go server from source on go-1.26 with
# those modules bumped to their fix versions (x/net 0.56.0, x/crypto 0.53.0, x/image
# 0.43.0), and REUSE upstream's own prebuilt webapp client bundle (+ config/templates/
# i18n/fonts/prepackaged_plugins) from the released mattermost-team tarball — the heavy
# React webapp is NOT rebuilt. Gate: PUSH=0 ARCHES=x86_64 build-image.sh mattermost ->
# 0 fixable CVEs + test.sh green. FROM_SOURCE=1 (melange builds the server package).
#
# We ship Team Edition (mattermost-team-...): the free, open-source edition (the
# enterprise tarball requires a license). WINDOW (2026-10-20): the chart's 11.11 line plus the
# newest (12.0). Originally newest-only: from-source was validated on the
# newest release (11.8.3). The prior line + ESR (10.x/11.7.x) are on go 1.25.x and were
# not from-source-validated here; re-add them once each is confirmed to build 0-CVE.
# Release tags are vX.Y.Z; the prebuilt tarball URL uses the bare version (no `v`):
#   https://releases.mattermost.com/<VER>/mattermost-team-<VER>-linux-<arch>.tar.gz
# and the source archive is the GitHub tag tarball:
#   https://github.com/mattermost/mattermost/archive/refs/tags/v<VER>.tar.gz
#   __VER__     = version (bare X.Y.Z, used as-is)
#   __SRC_SHA__ = github source tag tarball sha256 (arch-independent, for the server build)
#   __SHA_AMD__ = mattermost-team-<VER>-linux-amd64.tar.gz sha256 (prebuilt webapp assets)
#   __SHA_ARM__ = mattermost-team-<VER>-linux-arm64.tar.gz sha256 (prebuilt webapp assets)
FROM_SOURCE=1
VERSIONS=(11.11.2 12.0.0)
declare -A SRC_SHA=(
  [11.11.2]=db6f6802e76967e1ad6eca2b10fc9530e5698902c194cd8be5abf1853b8ecde6
  [12.0.0]=d6ed61dff7370baaf41d8b4baf8483472919ca5d3b03c6b638c4c9732bcf0617
)
declare -A SHA_AMD=(
  [11.11.2]=2b5018aceb46763982d34d4c44fe5215f8d463a26255efbd3c59b61b7dda86c9
  [12.0.0]=fcaa0a6c93772983079b5c6185287106a6c5e147b64386283ab7f8a14237a906
)
declare -A SHA_ARM=(
  [11.11.2]=7bf88344cad68f53ee01c60942ad7772f69731beeea97387e43a1384d6d36a02
  [12.0.0]=a7bdf574571213afc5d6455945f3c9d32d9caf145b321ce727a22e3258a7181e
)
render() {
  echo "s/__VER__/$1/g; s|__SRC_SHA__|${SRC_SHA[$1]}|g; s|__SHA_AMD__|${SHA_AMD[$1]}|g; s|__SHA_ARM__|${SHA_ARM[$1]}|g"
}
