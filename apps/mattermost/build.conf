# mattermost: image-only recipe input (the chart is authored in the charts repo).
# Mattermost is a huge Go-server + webpacked-React monorepo; a from-source build in
# CI is infeasible. Instead we ship Mattermost's OWN official prebuilt server tarball
# from releases.mattermost.com (the same upstream-artifact pattern clickhouse/postgrest
# use), then harden it on a minimal apko base and gate it 0-CVE with Trivy. This is
# clean-room-consistent: it is upstream's published artifact, not a Bitnami chart.
#
# We ship Team Edition (mattermost-team-...): the free, open-source edition (the
# enterprise tarball requires a license). Versions = newest patch of the latest line,
# the prior line, and the current ESR (extended-support) line — all dual-arch.
# Release tags are vX.Y.Z but the tarball URL uses the bare version (no `v`):
#   https://releases.mattermost.com/<VER>/mattermost-team-<VER>-linux-<arch>.tar.gz
# Each version ships an amd64 and an arm64 tarball, each with its own sha256:
#   __VER__     = version (bare X.Y.Z, used as-is)
#   __SHA_AMD__ = mattermost-team-<VER>-linux-amd64.tar.gz sha256
#   __SHA_ARM__ = mattermost-team-<VER>-linux-arm64.tar.gz sha256
BLOCKED=1  # prebuilt Go binary bakes stale x/net/x/crypto/stdlib; no from-source path
FROM_SOURCE=0
VERSIONS=(10.11.20 11.7.5 11.8.2)
declare -A SHA_AMD=(
  [10.11.20]=e7ba5c4fafa874a3f6d612a25946fa05dc8c90ca519d727ef3245236984bf4a5
  [11.7.5]=dae515358366a2ac610ae1c424bd40752a0898b971d1517a499898965aaf527d
  [11.8.2]=de6d1ba83207ce6948588f851aa8ebdc15c3dfb21633867b67e9c822f960fd6d
)
declare -A SHA_ARM=(
  [10.11.20]=887d1218b497265fe7a8fc45127021ea000cc30e20b655f31d2e8be1f9cfe426
  [11.7.5]=6ea1b2bebde9644125b5da148f75ee016b605b4731ca9adf1fb644ae0c17eab1
  [11.8.2]=6880744cf45095fd88d45b6a995bb47b5301c72a8b1e815abcb6c0a4ede8bd66
)
render() {
  echo "s/__VER__/$1/g; s|__SHA_AMD__|${SHA_AMD[$1]}|g; s|__SHA_ARM__|${SHA_ARM[$1]}|g"
}
