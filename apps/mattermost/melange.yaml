# Packages Mattermost (Team Edition) onto Wolfi. Mattermost is a Go server + a
# webpacked React frontend in a large monorepo; a from-source build in CI is
# infeasible, so we ship Mattermost's OWN official prebuilt server tarball from
# releases.mattermost.com (the same upstream-artifact pattern clickhouse/postgrest
# use), then harden it on a minimal apko base and gate it 0-CVE with Trivy. This is
# clean-room-consistent: it is upstream's published artifact, not a Bitnami chart,
# and the scan still fully applies.
#
# The tarball unpacks to a single `mattermost/` dir containing bin/mattermost plus the
# client/ webapp, config/, templates/, i18n/, fonts/ and prepackaged_plugins/. We
# install the whole tree under /opt/mattermost and symlink /usr/bin/mattermost. The
# server binary is a dynamically-linked Go binary that links only glibc, so the runtime
# surface is glibc + ca-certificates-bundle (TLS to the external Postgres/SMTP).
package:
  name: quench-mattermost
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Mattermost (Team Edition), packaged on Wolfi"
  copyright:
    - license: AGPL-3.0-only
  dependencies:
    runtime:
      - glibc                  # the Go server binary links glibc (libc/libpthread/libresolv)
      - ca-certificates-bundle # TLS to the external database / SMTP

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - curl
      - ca-certificates-bundle

pipeline:
  # Mattermost publishes separate amd64/arm64 Team-Edition server tarballs, so fetch
  # the one matching the build arch by uname -m (x86_64->amd64, aarch64->arm64) with the
  # arch-matching sha256 — using the wrong arch yields a wrong-arch binary. The bare
  # version (no leading `v`) is used directly in both the path and the filename.
  - runs: |
      VER="${{package.version}}"
      case "$(uname -m)" in
        x86_64)  mmarch=amd64; sha=__SHA_AMD__ ;;
        aarch64) mmarch=arm64; sha=__SHA_ARM__ ;;
        *) echo "unsupported arch $(uname -m)" >&2; exit 1 ;;
      esac

      url="https://releases.mattermost.com/${VER}/mattermost-team-${VER}-linux-${mmarch}.tar.gz"
      curl -fsSL -o mattermost.tar.gz "$url"
      echo "${sha}  mattermost.tar.gz" | sha256sum -c -
      tar -xzf mattermost.tar.gz   # unpacks to ./mattermost/

      # Install the whole install tree read-only under /opt/mattermost. The server must
      # run from its install dir to resolve client/, templates/, i18n/ and fonts/.
      dest="${{targets.destdir}}/opt/mattermost"
      install -d "$dest"
      cp -a mattermost/. "$dest/"
      chmod 0755 "$dest/bin/mattermost"
      chmod -R a+rX "$dest"

      # Convenience symlink on PATH (the image still sets work-dir=/opt/mattermost).
      install -d "${{targets.destdir}}/usr/bin"
      ln -sf /opt/mattermost/bin/mattermost "${{targets.destdir}}/usr/bin/mattermost"

      # Writable areas the server owns at runtime. apko stamps the final ownership/perms
      # (uid 1001) via its `paths:` block; we just make sure the dirs exist in the tree.
      install -d -m 0755 "$dest/data" "$dest/logs" "$dest/config" "$dest/plugins" "$dest/client/plugins"

test:
  pipeline:
    - runs: |
        test -x /opt/mattermost/bin/mattermost
        test -d /opt/mattermost/client
        mattermost version
