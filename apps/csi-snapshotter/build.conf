# csi-snapshotter (kubernetes-csi/external-snapshotter): the CSI external-snapshotter sidecar, which creates and deletes CSI snapshots for VolumeSnapshotContents. A Kubernetes CSI
# sidecar used by every CSI driver (Longhorn pins it in dep-versions). From source, static Go (CGO
# off), version stamped via -X main.version as release-tools/build.make does. Upstream's layout:
# the binary at /csi-snapshotter, root by default (upstream's image is distroless/static, uid 0; the
# CSI socket it dials is created by the driver, usually as root).
# Latest patch of the last 3 minor lines.
FROM_SOURCE=1
VERSIONS=(8.4.0 8.5.0 8.6.0)
declare -A SHA256=(
  [8.4.0]=12d2596d2c9202116ce5486a741c4d1a7b0fb2bba615c4c5ffcfce89084f2989
  [8.5.0]=d4d680d946e69db63c6bc0d44d639a457771f72bb8702d53d92274c635752866
  [8.6.0]=44bc3f2bb78cbd7fb6ebff5f5bb488e2171e2cef42849f85d28b85446f8956c4
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
