# Builds csi-snapshotter from the kubernetes-csi/external-snapshotter release tag tarball.
package:
  name: quench-csi-snapshotter
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened CSI external-snapshotter sidecar, built from source"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - go

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/kubernetes-csi/external-snapshotter/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      set -eu
      export CGO_ENABLED=0 GOTOOLCHAIN=local
      # 0-CVE floors (docs/go-module-float.md), raised only where go.mod is below them; a
      # module absent from the graph is skipped. otel moves as one family (memory: otel is many
      # modules); cel-go 0.29.0 for GHSA-gcjh-h69q-9w9g (client-go/apiserver pull it in).
      FLOOR="golang.org/x/crypto@v0.56.0 golang.org/x/mod@v0.40.0 golang.org/x/net@v0.58.0 golang.org/x/text@v0.41.0 google.golang.org/grpc@v1.83.2 github.com/google/cel-go@v0.29.0 go.opentelemetry.io/otel@v1.45.0 go.opentelemetry.io/otel/metric@v1.45.0 go.opentelemetry.io/otel/trace@v1.45.0 go.opentelemetry.io/otel/sdk@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.45.0"
      need=""
      for mv in $FLOOR; do
        have="$(GOFLAGS=-mod=mod go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${mv%@*}" 2>/dev/null)"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        [ "$(printf '%s\n%s\n' "$have" "${mv#*@}" | sort -V | head -1)" = "${mv#*@}" ] || need="$need $mv"
      done
      echo "raising:${need:- nothing}"
      if [ -n "$need" ]; then
        GOFLAGS=-mod=mod go get $need
        GOFLAGS=-mod=mod go mod tidy
        [ ! -d vendor ] || GOFLAGS=-mod=mod go mod vendor
      fi
      go build -trimpath -ldflags "-s -w -X main.version=v${{package.version}}" \
        -o "${{targets.destdir}}/csi-snapshotter" ./cmd/csi-snapshotter
      grep -aq "v${{package.version}}" "${{targets.destdir}}/csi-snapshotter"

test:
  pipeline:
    - runs: |
        test -x /csi-snapshotter
