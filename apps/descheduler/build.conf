# descheduler (kubernetes-sigs/descheduler): from-source via melange (Go build
# of ./cmd/descheduler from the git tag tarball). Single static Go binary, no CGO.
# NEWEST-ONLY: track just the latest stable tag (kubernetes-sigs/descheduler
# tags are vX.Y.Z). The source tarball is pinned by sha256. Image-only (no chart).
FROM_SOURCE=1
VERSIONS=(0.36.0)
declare -A SHA256=(
  [0.36.0]=9b7fc9a457642f80c8683b96fafecc58e2229097399b300826bbb07d5de8effe
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
