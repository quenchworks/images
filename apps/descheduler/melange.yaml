# Builds the Kubernetes descheduler (kubernetes-sigs/descheduler) from source
# onto Wolfi. Image-only (no chart). Single static Go binary, CGO disabled
# (matches upstream Makefile: CGO_ENABLED=0 go build ... ./cmd/descheduler):
#   * descheduler  (./cmd/descheduler) -- the descheduler control loop / CLI
# Output is a signed APK in Quenchworks' own repo. No upstream distro binaries.
#
# go.mod declares `go 1.26.0` (with `godebug default=go1.26`); we build with the
# matching go-1.26 toolchain and GOTOOLCHAIN=local so go.mod's directive does not
# trigger a toolchain download. GOFLAGS=-mod=mod lets the module graph resolve
# patched deps for the 0-CVE gate.
#
# Version is stamped exactly like upstream (Makefile LDFLAGS), via -X on the
# k8s component-base-style version package sigs.k8s.io/descheduler/pkg/version,
# so `descheduler version` reports the real release instead of an empty build.
package:
  name: quench-descheduler
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Kubernetes descheduler, built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-1.26

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/kubernetes-sigs/descheduler/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - name: Bump vulnerable transitive deps to their fixed releases (0-CVE gate)
    runs: |
      set -eu
      export GOFLAGS=-mod=mod
      export GOTOOLCHAIN=local
      export GO111MODULE=on
      # Upstream v0.36.0 pins golang.org/x/crypto v0.49.0 and golang.org/x/net
      # v0.52.0 (both indirect), which carry fixable CVEs (x/crypto/ssh advisories
      # + x/net/html + x/net/idna XSS/DoS). Bump to the fixed releases; a patch of
      # indirect utility libs, no descheduler API change. `go mod tidy` reconciles
      # the module graph so the build stays reproducible.
      # otel CVE-2026-81870 / CVE-2026-81871: the published image drifted onto these
      # after release. Every module listed is one this app's own go.mod carries; a
      # floor naming a module absent from the graph is rejected by some recipes.
      go get golang.org/x/crypto@v0.56.0 go.opentelemetry.io/otel@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.45.0 go.opentelemetry.io/otel/metric@v1.45.0 go.opentelemetry.io/otel/sdk@v1.45.0 go.opentelemetry.io/otel/trace@v1.45.0
      go get golang.org/x/net@v0.58.0 golang.org/x/text@v0.41.0
      # grpc GHSA-hrxh-6v49-42gf (xDS RBAC + HTTP/2, HIGH): bump to v1.82.1. grpc@1.82.1
      # requires the otel@1.44.0 family + x/oauth2@0.36.0, so float that cascade too.
      # cel-go GHSA-gcjh-h69q-9w9g (MEDIUM: ext.NativeTypes(ParseStructTag("json"))
      # exposes json:"-" fields to user CEL expressions): v0.26.0 -> v0.29.2, the first
      # fixed line. Indirect only -- reached through k8s.io/apiserver's CEL libs, which
      # are source-compatible with 0.29; descheduler has no cel-go call sites.
      go get google.golang.org/grpc@v1.83.2 \
             go.opentelemetry.io/otel@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.45.0 go.opentelemetry.io/otel/sdk@v1.45.0 \
             go.opentelemetry.io/otel/trace@v1.45.0 go.opentelemetry.io/otel/metric@v1.45.0 \
             golang.org/x/oauth2@v0.36.0 github.com/google/cel-go@v0.29.2
      go mod tidy

  - name: Build the descheduler binary (static, CGO off)
    runs: |
      set -eu
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      export GOTOOLCHAIN=local      # use the installed go-1.26, do not fetch go.mod's directive
      export GO111MODULE=on
      # Match upstream Makefile LDFLAGS (LDFLAG_LOCATION=sigs.k8s.io/descheduler/pkg/version)
      # so `descheduler version` reports the real release. No git metadata in the
      # tarball; stamp version + build date + clean-tree markers.
      VERPKG="sigs.k8s.io/descheduler/pkg/version"
      BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
      LDFLAGS="-s -w \
        -X ${VERPKG}.version=v${{package.version}} \
        -X ${VERPKG}.buildDate=${BUILD_DATE} \
        -X ${VERPKG}.gitbranch=HEAD \
        -X ${VERPKG}.gitsha1=v${{package.version}}"
      go build -trimpath -ldflags "${LDFLAGS}" \
        -o "${{targets.destdir}}/usr/bin/descheduler" ./cmd/descheduler
