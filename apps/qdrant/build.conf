# qdrant: from-source (melange). VERSIONS = published version from melange.yaml.
# NOTE: __SERVICE__/__STORAGE__ in apko.yaml are NOT placeholders -- they are
# literal fragments of Qdrant's double-underscore env-var names
# (QDRANT__STORAGE__STORAGE_PATH, QDRANT__SERVICE__STATIC_CONTENT_DIR). The CI
# workflow builds apko.yaml directly (no render step). render() maps them to
# themselves so the local pipeline's substitution is byte-identical.
FROM_SOURCE=1
VERSIONS=(1.18.2)
render() { echo "s/__SERVICE__/__SERVICE__/g; s/__STORAGE__/__STORAGE__/g"; }
