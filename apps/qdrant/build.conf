# qdrant: from-source via melange (Rust/cargo build, git-checkout pinned per
# release; rust-1.97). Newest release only. COMMIT maps each git tag's commit. The bundled web-ui (vars.web-ui-tag in melange.yaml) is a
# generic static API dashboard kept constant across these releases.
# __SERVICE__/__STORAGE__ are NOT placeholders -- they are literal fragments of
# Qdrant's QDRANT__SERVICE__/QDRANT__STORAGE__ env-var names in apko.yaml, so the
# render maps them to themselves (byte-identical, matching the no-render CI path).
FROM_SOURCE=1
VERSIONS=(1.19.1)
declare -A COMMIT=(
  [1.19.1]=de333e3c04660fe475d6275e9efc9fb9f54138fe
)
render() { echo "s/__VER__/$1/g; s/__SERVICE__/__SERVICE__/g; s/__STORAGE__/__STORAGE__/g; s/__COMMIT__/${COMMIT[$1]}/g"; }
