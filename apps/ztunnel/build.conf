# ztunnel: Istio's ambient-mode node proxy (istio/ztunnel, Rust), built from source (2026-10-08) on
# the same three minor lines as istiod and istio-cni. Default features (tls-aws-lc + jemalloc) and
# the release profile, as upstream's Makefile builds it. Upstream's image puts the binary at
# /usr/local/bin/ztunnel over its iptables base; this image keeps both so the istio ztunnel chart
# (which passes only args: proxy ztunnel) runs it unchanged. Root, like upstream: it enters pod
# netns with privileges the chart grants.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(1.29.10 1.30.7 1.31.3)
declare -A SHA256=(
  [1.29.10]=fcfa02f0d9eeaf0e745d9e79363cfd810f6cf385f23376e4ea6d9cec6dafbe0f
  [1.30.7]=8476ee4bd91fd3c46c1d2e46d233c3b8c5cf87fba94207599488d0e2b2080280
  [1.31.3]=6cd1131e81e9740de037ecd720d0c8fac9f7a249e5bb724c6fba699853fbf86f
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
