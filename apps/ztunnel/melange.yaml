# Istio ztunnel from the istio/ztunnel tag: cargo release build with the crate floors below.
package:
  name: quench-ztunnel
  version: __VER__
  epoch: 0
  description: "Quenchworks Istio ztunnel (ambient-mode node proxy), built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - libgcc

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - bash
      - ca-certificates-bundle
      - cmake
      - clang
      - perl
      - nasm
      - pkgconf
      - protoc
      - protobuf-dev
      - rust-1.90
      - cargo-auditable

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/istio/ztunnel/archive/refs/tags/${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      set -eu
      # textnonce (the only user of rand 0.7.3, which has no fix for GHSA-cq8v-f236-94qc on its
      # line) is used only inside src/xds/client.rs's #[cfg(test)] module, yet upstream lists it
      # under [dependencies]. Move it to [dev-dependencies] so the release binary does not link
      # it; the release build itself fails if any non-test code still uses it.
      grep -q '^textnonce = ' Cargo.toml
      sed -i '/^textnonce = /d' Cargo.toml
      sed -i 's/^\[dev-dependencies\]$/[dev-dependencies]\ntextnonce = { version = "1.0" }/' Cargo.toml
      grep -A1 '^\[dev-dependencies\]' Cargo.toml | grep -q '^textnonce = '
      # Raise a crate on its own minor line only where Cargo.lock has it below the floor.
      cfloor() {
        line="${2%.*}"
        locked() { awk -v n="$1" '$0=="name = \""n"\"" {getline; gsub(/version = |"/,""); print}' Cargo.lock; }
        for v in $(locked "$1"); do
          case "$v" in "$line".*) ;; *) continue ;; esac
          [ "$v" = "$2" ] && continue
          [ "$(printf '%s\n%s\n' "$v" "$2" | sort -V | head -1)" = "$v" ] || continue
          cargo update -p "$1@$v" --precise "$2"
        done
        for v in $(locked "$1"); do
          case "$v" in "$line".*) ;; *) continue ;; esac
          [ "$(printf '%s\n%s\n' "$v" "$2" | sort -V | head -1)" = "$2" ] \
            || { echo "$1 $v is still below the $2 floor"; exit 1; }
        done
      }
      cfloor rustls 0.23.45   # GHSA-2mjx-qc3c-rqvc
      cfloor rand 0.9.3       # GHSA-cq8v-f236-94qc
      cfloor rand 0.8.6       # GHSA-cq8v-f236-94qc (backoff)
      # The scan of the binary's cargo-auditable data is the real check; this one fails early.
      t="$(cargo tree -e normal,build --target all -i rand@0.7.3 2>/dev/null || true)"
      [ -z "$t" ] || { echo "rand 0.7.3 is still linked:"; echo "$t"; exit 1; }
      # build.rs runs common/scripts/report_build_info.sh (bash); with no git checkout it stamps
      # the version from VERSION, as upstream's release build does.
      export VERSION="${{package.version}}" IGNORE_DIRTY_TREE=1
      cargo auditable build --release --locked
      install -Dm755 target/release/ztunnel "${{targets.destdir}}/usr/local/bin/ztunnel"

  - uses: strip

test:
  pipeline:
    - runs: |
        /usr/local/bin/ztunnel version | grep -q 'Version:"${{package.version}}"'
