# harbor-core: from-source; latest 3 Harbor stable releases. Harbor couples all
# component images under the release version, so we tag at the Harbor release
# version and fetch the matching harbor source tarball (verified by sha) per release.
FROM_SOURCE=1
VERSIONS=(2.13.5 2.14.4 2.15.1)
declare -A SRC_SHA=(
  [2.13.5]=1a80d2b08ccf7cf64ab755a662d38f773ecd88858e52933e430ca471140409ab
  [2.14.4]=513078479f38d6b605938980d4e6eae7c6f1576afcc522bcde5107f986bf5f46
  [2.15.1]=e25837027915ed12f17afe7ad983f78251af5e3c2e2a87037dcaa2728e5aa910
)
# go-swagger version that generates the REST server (gen_apis) -- pinned per
# Harbor release (Makefile SWAGGER_VERSION). 2.13 used v0.31.0 (principal
# interface{}); 2.14/2.15 use v0.33.1. Using the wrong one breaks the generated
# handler signatures (cannot convert *any -> HandlerFunc).
declare -A SWAGGER=( [2.13.5]=v0.31.0 [2.14.4]=v0.33.1 [2.15.1]=v0.33.1 )
render() { echo "s/__VER__/$1/g; s/__SRC_SHA__/${SRC_SHA[$1]}/g; s/__SWAGGER__/${SWAGGER[$1]}/g"; }
