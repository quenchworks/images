# Builds the Harbor core API server from source onto Wolfi. Harbor is a
# CNCF cloud-native container/OCI artifact registry; harbor-core is its central
# API + business-logic service (the brain: auth, projects, RBAC, replication
# orchestration, the REST API under /api/v2.0). ONE static Go binary
# (harbor_core), CGO-free, multi-arch. Output is a signed APK in QuenchWorks'
# own repo -- no upstream distro binaries.
#
# Source: github.com/goharbor/harbor @ tag v2.14.4 (Apache-2.0). The whole
# Harbor backend (core / jobservice / registryctl / exporter) lives in ONE Go
# module under src/ (module github.com/goharbor/harbor/src, go 1.25.x); each
# image builds the relevant main package from that module.
#
# CODEGEN: unlike the other three binaries, harbor_core depends on the swagger
# REST server scaffolding (src/server/v2.0/{models,restapi/...}) which upstream
# does NOT commit -- the Makefile's `gen_apis` target generates it from
# api/v2.0/swagger.yaml with go-swagger v0.33.1 using the repo's custom
# templates (tools/swagger/templates), app name "harbor", before compiling
# core. We reproduce that exactly: install go-swagger v0.33.1, generate the
# server into src/server/v2.0, then build. (jobservice/registryctl/exporter do
# not import the generated restapi packages, so they need no codegen.)
#
# go.mod has no vendor/ dir, so the build fetches modules from the proxy
# (GOFLAGS=-mod=mod). go.mod requires go 1.25.x; we use the go-1.25 Wolfi
# toolchain. Version is stamped via -ldflags into
# src/pkg/version.{ReleaseVersion,GitCommit} exactly as the root Makefile's
# CORE_LDFLAGS does (RELEASEVERSION = contents of the VERSION file = "v2.14.4").
package:
  name: harbor-core
  version: __VER__
  epoch: 0
  description: "QuenchWorks hardened Harbor core API server, built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - busybox            # minimal shell for the thin entrypoint + debugging

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      # go.mod requires go >= 1.25.x; use the go-1.25 toolchain to pick up the
      # latest stdlib CVE fixes (helps clear the Trivy gate without manual bumps).
      - go-1.25

pipeline:
  # Build from the git tag source tarball. Pinned to the tag; verified by sha256.
  - uses: fetch
    with:
      uri: https://github.com/goharbor/harbor/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SRC_SHA__
  - runs: |
      export CGO_ENABLED=0
      export GOTOOLCHAIN=local
      export GOFLAGS=-mod=mod
      export GOBUILDVCS=false

      # Confirm the pinned version string (RELEASEVERSION = contents of VERSION).
      REL="$(cat VERSION)"        # -> v2.14.4
      test "${REL}" = "v${{package.version}}" || { echo "VERSION mismatch: ${REL}"; exit 1; }

      # 1) Generate the swagger REST server (gen_apis) into src/server/v2.0.
      #    Matches the root Makefile: go-swagger v0.33.1, repo custom templates,
      #    --exclude-main, the three extra initialisms, app name "harbor".
      export GOBIN=/tmp/gobin
      install -d "${GOBIN}"
      # Build go-swagger from source (not `go install @ver`) so we can bump its
      # pinned golang.org/x/tools: go-swagger v0.31.0 (Harbor 2.13's SWAGGER_VERSION)
      # ships x/tools v0.21.0, which fails to compile under our go-1.25
      # ("invalid array length -delta * delta" in tokeninternal). Harbor never hits
      # this because it runs go-swagger from a prebuilt container image; we compile
      # it here. The tools bump is a build-time dep of the generator only -- it does
      # NOT change the generated code (principal type etc. come from go-swagger's
      # own templates + the repo's tools/swagger/templates), so each release still
      # gets the handler signatures it expects. Harmless for v0.33.1 (already newer).
      ( sw="$(mktemp -d)"
        git clone --quiet --depth 1 --branch __SWAGGER__ https://github.com/go-swagger/go-swagger "$sw"
        cd "$sw"
        export GOFLAGS=-mod=mod GOTOOLCHAIN=local
        go get golang.org/x/tools@v0.30.0
        go mod tidy
        go build -o "${GOBIN}/swagger" ./cmd/swagger )
      rm -rf src/server/v2.0/models src/server/v2.0/restapi
      "${GOBIN}/swagger" generate server \
        --template-dir=tools/swagger/templates \
        --exclude-main \
        --additional-initialism=CVE --additional-initialism=GC --additional-initialism=OIDC \
        -f api/v2.0/swagger.yaml -A harbor --target src/server/v2.0

      # 1b) QuenchWorks CSRF fix (Harbor UI login HTTP 403 "origin invalid").
      #     We hardened harbor-core by bumping github.com/gorilla/csrf v1.7.2 ->
      #     v1.7.3 (CVE-2025-24358). gorilla/csrf 1.7.3 added a STRICT
      #     Origin/Referer check to ServeHTTP: for a server-side request
      #     r.URL.Scheme is empty so gorilla treats it as HTTPS, builds the
      #     expected origin as https://<r.Host>, and rejects the browser's
      #     http:// Origin -> ErrBadOrigin ("origin invalid"). The check passes
      #     only if the request Origin/Referer HOST is in csrf.TrustedOrigins.
      #     Upstream Harbor's csrf.Protect(...) (src/server/middleware/csrf/csrf.go)
      #     does NOT set TrustedOrigins, so every UI POST /c/login 403s on 1.7.3.
      #     (Upstream dodges this only by staying on 1.7.2.)
      #
      #     Fix WITHOUT reverting the CVE bump, generalized to work on ANY
      #     host:port (e.g. an IDE/dashboard auto-port-forward on a random port)
      #     rather than only an explicit allowlist:
      #       (a) PRIMARY: gorilla 1.7.3 builds the expected origin as
      #           "<scheme>://<r.Host>" and rejects mismatches. It derives the
      #           scheme NOT from r.URL.Scheme or r.TLS but solely from the
      #           PlaintextHTTPContextKey context value (false=>https, true=>http);
      #           the exported csrf.PlaintextHTTPRequest(r) sets it true. For a
      #           server request it defaults to https, so a browser http:// Origin
      #           mismatches. In Middleware() below we read X-Forwarded-Proto
      #           (forwarded by the proxy; defaults to its own http scheme) and,
      #           unless it is "https", wrap the request with
      #           csrf.PlaintextHTTPRequest(req) so gorilla computes
      #           http://<r.Host>. Because the proxy forwards the real Host,
      #           sameOrigin(browserOrigin, http://<r.Host>) MATCHES for ANY
      #           host:port while a cross-site Origin still fails (CSRF intact).
      #       (b) BELT-AND-SUSPENDERS: rewrite csrf.go to also compute a host-only
      #           trusted-origins list (from config.ExtEndpoint()'s URL host plus
      #           the comma-separated CSRF_TRUSTED_ORIGINS env hosts) via
      #           csrf.TrustedOrigins(...), covering cross-origin/ingress cases.
      #     gorilla/csrf stays v1.7.3 (0-CVE preserved). Both APIs exist in 1.7.3.
      cat > src/server/middleware/csrf/csrf.go <<'EOF'
      // Copyright Project Harbor Authors
      //
      // Licensed under the Apache License, Version 2.0 (the "License");
      // you may not use this file except in compliance with the License.
      // You may obtain a copy of the License at
      //
      //    http://www.apache.org/licenses/LICENSE-2.0
      //
      // Unless required by applicable law or agreed to in writing, software
      // distributed under the License is distributed on an "AS IS" BASIS,
      // WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
      // See the License for the specific language governing permissions and
      // limitations under the License.

      package csrf

      import (
      	"net/http"
      	"net/url"
      	"os"
      	"strings"
      	"sync"

      	"github.com/gorilla/csrf"

      	"github.com/goharbor/harbor/src/common/utils"
      	"github.com/goharbor/harbor/src/lib"
      	"github.com/goharbor/harbor/src/lib/config"
      	"github.com/goharbor/harbor/src/lib/errors"
      	lib_http "github.com/goharbor/harbor/src/lib/http"
      	"github.com/goharbor/harbor/src/lib/log"
      	"github.com/goharbor/harbor/src/server/middleware"
      )

      const (
      	csrfKeyEnv = "CSRF_KEY"
      	// csrfTrustedOriginsEnv is a QuenchWorks addition: a comma-separated
      	// list of HOSTS (e.g. "127.0.0.1:8080,localhost:8080,harbor.example.com")
      	// that are added to gorilla/csrf's trusted-origins allowlist so the UI
      	// login works over http with gorilla/csrf >= 1.7.3 strict origin checks.
      	csrfTrustedOriginsEnv = "CSRF_TRUSTED_ORIGINS"
      	tokenHeader           = "X-Harbor-CSRF-Token"
      )

      var (
      	once       sync.Once
      	secureFlag = true
      	protect    func(handler http.Handler) http.Handler
      )

      // attachToken makes sure if csrf generate a new token it will be included in the response header
      func attachToken(w http.ResponseWriter, r *http.Request) {
      	if t := csrf.Token(r); len(t) > 0 {
      		w.Header().Set(tokenHeader, t)
      	} else {
      		log.Warningf("token not found in context, skip attaching")
      	}
      }

      func handleError(w http.ResponseWriter, r *http.Request) {
      	attachToken(w, r)
      	lib_http.SendError(w, errors.New(csrf.FailureReason(r)).WithCode(errors.ForbiddenCode))
      }

      func attach(handler http.Handler) http.Handler {
      	return http.HandlerFunc(func(rw http.ResponseWriter, req *http.Request) {
      		attachToken(rw, req)
      		handler.ServeHTTP(rw, req)
      	})
      }

      // trustedOrigins builds the host-only allowlist for gorilla/csrf's strict
      // Origin/Referer check (added in gorilla/csrf v1.7.3). gorilla compares the
      // request Origin/Referer HOST against this list (scheme-agnostic), so listing
      // the external-endpoint host (and any extra access hosts from
      // CSRF_TRUSTED_ORIGINS) makes the UI login work over http as well as https.
      func trustedOrigins() []string {
      	seen := make(map[string]struct{})
      	out := make([]string, 0, 4)
      	add := func(host string) {
      		host = strings.TrimSpace(host)
      		if host == "" {
      			return
      		}
      		if _, ok := seen[host]; ok {
      			return
      		}
      		seen[host] = struct{}{}
      		out = append(out, host)
      	}

      	// External endpoint host (e.g. http://127.0.0.1:8080 -> 127.0.0.1:8080).
      	if ep, err := config.ExtEndpoint(); err != nil {
      		log.Warningf("CSRF: failed to get external endpoint for trusted origins: %v", err)
      	} else if u, perr := url.Parse(strings.TrimSpace(ep)); perr != nil {
      		log.Warningf("CSRF: failed to parse external endpoint %q for trusted origins: %v", ep, perr)
      	} else if u.Host != "" {
      		add(u.Host)
      	}

      	// Extra access hosts supplied by the deployment (chart) via env.
      	for _, h := range strings.Split(os.Getenv(csrfTrustedOriginsEnv), ",") {
      		add(h)
      	}

      	return out
      }

      // Middleware initialize the middleware to apply csrf selectively
      func Middleware() func(handler http.Handler) http.Handler {
      	once.Do(func() {
      		key := os.Getenv(csrfKeyEnv)
      		if len(key) == 0 {
      			key = utils.GenerateRandomString()
      		} else if len(key) != 32 {
      			log.Errorf("Invalid CSRF key length from the environment: %s. Please ensure the key length is 32 characters.", key)
      			protect = func(_ http.Handler) http.Handler {
      				return http.HandlerFunc(func(w http.ResponseWriter, _ *http.Request) {
      					lib_http.SendError(w, errors.New("invalid CSRF key length from the environment. Please ensure the key length is 32 characters"))
      				})
      			}
      			return
      		}
      		secureFlag = secureCookie()
      		trusted := trustedOrigins()
      		log.Infof("CSRF: trusted origins (hosts): %v", trusted)
      		protect = csrf.Protect([]byte(key), csrf.RequestHeader(tokenHeader),
      			csrf.Secure(secureFlag),
      			csrf.ErrorHandler(http.HandlerFunc(handleError)),
      			csrf.SameSite(csrf.SameSiteStrictMode),
      			csrf.TrustedOrigins(trusted),
      			csrf.Path("/"))
      	})
      	return middleware.New(func(rw http.ResponseWriter, req *http.Request, next http.Handler) {
      		// Make gorilla/csrf v1.7.3's same-origin check scheme-accurate behind a
      		// TLS-terminating OR plain-HTTP reverse proxy. gorilla compares the
      		// browser Origin/Referer against "<scheme>://<r.Host>" where scheme is
      		// "https" UNLESS the request is flagged plaintext via the
      		// PlaintextHTTPContextKey context value (gorilla does NOT read
      		// r.URL.Scheme / r.TLS -- only that context key). For a server request
      		// behind our proxy the scheme would otherwise default to https, so a
      		// browser's http:// Origin mismatches and 403s on ANY host:port.
      		//
      		// We trust X-Forwarded-Proto (set by the front-door proxy) and default
      		// to http when it is absent or "http": flag the request plaintext via
      		// csrf.PlaintextHTTPRequest(req) so gorilla builds http://<r.Host>.
      		// Since r.Host already equals the real access host:port (the proxy
      		// forwards the original Host), sameOrigin(browserOrigin, http://r.Host)
      		// then MATCHES for ANY host:port -- no allowlist needed -- while a
      		// genuinely cross-site Origin still mismatches the Host (CSRF intact).
      		// Only an explicit X-Forwarded-Proto: https keeps the strict https path.
      		if xfp := strings.ToLower(strings.TrimSpace(req.Header.Get("X-Forwarded-Proto"))); xfp != "https" {
      			req = csrf.PlaintextHTTPRequest(req)
      		}
      		protect(attach(next)).ServeHTTP(rw, req)
      	}, csrfSkipper)
      }

      // csrfSkipper makes sure only some of the uris accessed by non-UI client can skip the csrf check
      func csrfSkipper(req *http.Request) bool {
      	path := req.URL.Path
      	if (strings.HasPrefix(path, "/v2/") ||
      		strings.HasPrefix(path, "/api/") ||
      		strings.HasPrefix(path, "/service/")) && !lib.GetCarrySession(req.Context()) {
      		return true
      	}
      	return false
      }

      func secureCookie() bool {
      	ep, err := config.ExtEndpoint()
      	if err != nil {
      		log.Warningf("Failed to get external endpoint: %v, set cookie secure flag to true", err)
      		return true
      	}
      	return !strings.HasPrefix(strings.ToLower(ep), "http://")
      }
      EOF
      # Sanity: the rewritten file must reference the new env + API.
      grep -q 'CSRF_TRUSTED_ORIGINS' src/server/middleware/csrf/csrf.go
      grep -q 'csrf.TrustedOrigins' src/server/middleware/csrf/csrf.go
      grep -q 'csrf.PlaintextHTTPRequest' src/server/middleware/csrf/csrf.go
      grep -q 'X-Forwarded-Proto' src/server/middleware/csrf/csrf.go

      # 2) Build harbor_core with the upstream CORE_LDFLAGS (version stamp).
      cd src
      # CVE-2026-39882 (MEDIUM): the otel otlptrace + otlptracehttp exporters are
      # pinned at v1.34.0 in go.mod while the rest of the otel set is v1.43.0;
      # bump the two laggards to v1.43.0 (the fixed version) to clear the gate.
      go get go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.43.0
      go get go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.43.0
      # Three FIXABLE gobinary CVEs in harbor_core's Go module graph; clear them
      # with dep bumps (all leaf/patch/minor bumps -- plain `go get`, NO
      # `go mod tidy`, to avoid a full-module tidy walking generated dirs):
      #   helm.sh/helm/v3            v3.18.5  -> v3.20.2 (CVE-2026-35206)
      #   github.com/Azure/go-ntlmssp v0.0.0-20221128193559 -> v0.1.1
      #   github.com/gorilla/csrf    v1.7.2   -> v1.7.3
      go get helm.sh/helm/v3@v3.20.2
      go get github.com/Azure/go-ntlmssp@v0.1.1
      go get github.com/gorilla/csrf@v1.7.3
      GITCOMMIT="v${{package.version}}"
      LDFLAGS="-w -s \
        -X github.com/goharbor/harbor/src/pkg/version.GitCommit=${GITCOMMIT} \
        -X github.com/goharbor/harbor/src/pkg/version.ReleaseVersion=${REL}"
      install -d "${{targets.destdir}}/usr/bin"
      go build -trimpath -ldflags "${LDFLAGS}" \
        -o "${{targets.destdir}}/usr/bin/harbor_core" ./core
      cd ..

      # Runtime static assets the core binary reads via RELATIVE paths resolved
      # against its working directory (which we pin to /harbor below). Mirror
      # upstream make/photon/core/Dockerfile's /harbor layout:
      #   - migrations/postgresql/*.up.sql : golang-migrate opens the source
      #     "file://migrations/postgresql/" (src/common/dao/pgsql.go
      #     defaultMigrationPath = "migrations/postgresql/") at startup. WITHOUT
      #     this tree at the workdir-relative path, core FATALs on boot with
      #     `failed to open source, "file://migrations/postgresql/"`.
      #     Upstream source path: make/migrations/postgresql -> /harbor/migrations.
      #   - views/ : beego templates (404.tpl, reset-password-mail.tpl) rendered
      #     at runtime (src/core/controllers/error.go TplName="404.tpl"); beego
      #     resolves the views dir relative to the workdir.
      #   - icons/ : artifact-type icons served at runtime.
      # All three are static, read-only data -- fine on a read-only rootfs.
      install -d "${{targets.destdir}}/harbor/migrations"
      cp -r make/migrations/* "${{targets.destdir}}/harbor/migrations/"
      install -d "${{targets.destdir}}/harbor/views"
      cp -r src/core/views/* "${{targets.destdir}}/harbor/views/"
      install -d "${{targets.destdir}}/harbor/icons"
      cp -r icons/* "${{targets.destdir}}/harbor/icons/"
      # Normalize perms on the baked static tree (dirs 0755, files 0644).
      find "${{targets.destdir}}/harbor" -type d -exec chmod 0755 {} +
      find "${{targets.destdir}}/harbor" -type f -exec chmod 0644 {} +

      # license for provenance
      install -d "${{targets.destdir}}/usr/share/doc/harbor-core"
      cp LICENSE "${{targets.destdir}}/usr/share/doc/harbor-core/" 2>/dev/null || true

      # Thin entrypoint: cd to /harbor (the upstream core image WORKDIR) so the
      # binary's relative source path "file://migrations/postgresql/" and beego's
      # relative "views"/"icons" dirs resolve, then exec harbor_core. Config comes
      # entirely from the chart (env + mounted ConfigMap/Secret); ships NO config.
      cat > "${{targets.destdir}}/usr/bin/docker-entrypoint.sh" <<'EOS'
      #!/bin/sh
      set -eu
      cd /harbor
      exec /usr/bin/harbor_core "$@"
      EOS
      chmod 0755 "${{targets.destdir}}/usr/bin/docker-entrypoint.sh"

test:
  pipeline:
    - runs: |
        test -x /usr/bin/harbor_core
        test -x /usr/bin/docker-entrypoint.sh
        # No --version flag upstream: the release string is stamped into
        # version.ReleaseVersion and logged at startup. Assert it's embedded.
        strings /usr/bin/harbor_core | grep -q 'v2.14.4'
        # The migration source tree MUST be baked at the workdir-relative path
        # or core FATALs on boot opening "file://migrations/postgresql/".
        test -d /harbor/migrations/postgresql
        ls /harbor/migrations/postgresql/*.up.sql >/dev/null
        # Runtime templates/icons present too (avoid a second missing-file FATAL).
        test -f /harbor/views/404.tpl
        test -d /harbor/icons
