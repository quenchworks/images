# scylladb: installs the official per-arch relocatable binary (self-contained,
# bundles its own libreloc). Newest-only: the current release (2026.2.1).
# The release has a unique BUILD id (0.<date>.<githash>) and per-arch sha512;
# it lives under REL=2026.2 (relocatable dir = major.minor, derived from VER).
FROM_SOURCE=1
VERSIONS=(2026.2.1)
declare -A BUILD=(
  [2026.2.1]=0.20260706.41da0874c850
)
declare -A SHA_AMD=(
  [2026.2.1]=880adc81065523451d3b6e37deb65e3cc8881cdee5eddc48ed11aa01e8e023da0105a91ef1bc0894023fead36d6d492cf11bd8f8d3c08eb679d9e56136ece5f8
)
declare -A SHA_ARM=(
  [2026.2.1]=20cec97310f0a3003d64ad36c04822d7ab47dfde3e6d51b164a149f351e2b71d779a9659ffb79904c3d7e6c6eb06bec8ad49fa58a71942c45f623ab04c65f808
)
render() { echo "s/__VER__/\"$1\"/g; s|__BUILD__|${BUILD[$1]}|g; s|__SHA_AMD__|${SHA_AMD[$1]}|g; s|__SHA_ARM__|${SHA_ARM[$1]}|g"; }
