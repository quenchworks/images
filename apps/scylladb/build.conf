# scylladb: installs the official per-arch relocatable binary (self-contained,
# bundles its own libreloc). Newest-only: the current release (2026.3.2).
# The release has a unique BUILD id (0.<date>.<githash>) and per-arch sha512;
# it lives under REL=2026.3 (relocatable dir = major.minor, derived from VER).
FROM_SOURCE=1
VERSIONS=(2026.3.2)
declare -A BUILD=(
  [2026.3.2]=0.20260923.4ee3835abea7
)
declare -A SHA_AMD=(
  [2026.3.2]=f0d28f78820b7c2c59715cc478f837f0e749656da20e7082026801e271e366eeb2df6e7e1cec125b4c6ef4d70d4d0244e0ab1cf740c4fc1e7be09809caae2b7f
)
declare -A SHA_ARM=(
  [2026.3.2]=5df553310a5f0a8002bcfddbb816d74cbf14a612b14102ac307c4f1026aaaa4378fee14a768f7a139c7ff50f9fb23720c9030f3737d6ed8c20a6c0bec477af5e
)
render() { echo "s/__VER__/\"$1\"/g; s|__BUILD__|${BUILD[$1]}|g; s|__SHA_AMD__|${SHA_AMD[$1]}|g; s|__SHA_ARM__|${SHA_ARM[$1]}|g"; }
