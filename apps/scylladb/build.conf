# scylladb: installs the official per-arch relocatable binary (self-contained,
# bundles its own libreloc). Newest-only: the current release (2026.2.2).
# The release has a unique BUILD id (0.<date>.<githash>) and per-arch sha512;
# it lives under REL=2026.2 (relocatable dir = major.minor, derived from VER).
FROM_SOURCE=1
VERSIONS=(2026.2.2)
declare -A BUILD=(
  [2026.2.2]=0.20260719.0d1dd27d50b2
)
declare -A SHA_AMD=(
  [2026.2.2]=6e898a96958b6113e4b79453acdf419b07e7ebc04c4eb2f3d82ace90745a2b9620899fa47cd74c2cc71509bc1e7e0d3c149055a90979e2e11bcb0f6d59aac182
)
declare -A SHA_ARM=(
  [2026.2.2]=7c62983efe2330511831983a9bcff4762f1749e70032db2f32b378060f919991c39e42f0d0b0c572f02ab53ab352f94e667f5106fdac6f23c62cfbf34a81d9e4
)
render() { echo "s/__VER__/\"$1\"/g; s|__BUILD__|${BUILD[$1]}|g; s|__SHA_AMD__|${SHA_AMD[$1]}|g; s|__SHA_ARM__|${SHA_ARM[$1]}|g"; }
