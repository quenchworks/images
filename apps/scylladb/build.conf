# scylladb: installs the official per-arch relocatable binary (self-contained,
# bundles its own libreloc). Newest-only: the current release (2026.2.0).
# The release has a unique BUILD id (0.<date>.<githash>) and per-arch sha512;
# it lives under REL=2026.2 (relocatable dir = major.minor, derived from VER).
FROM_SOURCE=1
VERSIONS=(2026.2.0)
declare -A BUILD=(
  [2026.2.0]=0.20260618.ccb141ab3d0c
)
declare -A SHA_AMD=(
  [2026.2.0]=312492c1107e2caa02192bbc4ef367ef3dea52635e95fa54f5344cf1976fb3f1370b0838a819dea7a2f873ad48547a26cb36b0fa79e83c63b27269c2a217e8b4
)
declare -A SHA_ARM=(
  [2026.2.0]=6c91f2c1cdbb21c4f8027d855c891c8fc077d974ed1e047c49df26075822e03b97675d4e78133ef8f622773d48b9ea4ce00a04b08c083e45e52153a4b992297e
)
render() { echo "s/__VER__/\"$1\"/g; s|__BUILD__|${BUILD[$1]}|g; s|__SHA_AMD__|${SHA_AMD[$1]}|g; s|__SHA_ARM__|${SHA_ARM[$1]}|g"; }
