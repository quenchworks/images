# scylladb: installs the official per-arch relocatable binary (self-contained,
# bundles its own libreloc). Newest-only: the current release (2026.3.1).
# The release has a unique BUILD id (0.<date>.<githash>) and per-arch sha512;
# it lives under REL=2026.3 (relocatable dir = major.minor, derived from VER).
FROM_SOURCE=1
VERSIONS=(2026.3.1)
declare -A BUILD=(
  [2026.3.1]=0.20260904.97cbf7898aae
)
declare -A SHA_AMD=(
  [2026.3.1]=b2aea6d3fe41a1b8f31991d96b68fa5ab4e7b7572a672ffa19f395198b30db3dc642f6c90f882d95f9b4830b883cb0ea0f496fd69ef6e0597f9eca3058f7ec47
)
declare -A SHA_ARM=(
  [2026.3.1]=3ab5f63c2fd83ccbc5edabd56e4d5a15f17839a3e2dae34d8b8d321a6828fd6516fc302f1ed5958589359d8469a8909a4089ff7cb5ad28950ab26144cf8442b2
)
render() { echo "s/__VER__/\"$1\"/g; s|__BUILD__|${BUILD[$1]}|g; s|__SHA_AMD__|${SHA_AMD[$1]}|g; s|__SHA_ARM__|${SHA_ARM[$1]}|g"; }
