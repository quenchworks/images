# scylladb: installs the official per-arch relocatable binary (self-contained,
# bundles its own libreloc). Newest-only: the current release (2026.3.4).
# The release has a unique BUILD id (0.<date>.<githash>) and per-arch sha512;
# it lives under REL=2026.3 (relocatable dir = major.minor, derived from VER).
FROM_SOURCE=1
VERSIONS=(2026.3.4)
declare -A BUILD=(
  [2026.3.4]=0.20261018.daef9dad4a01
)
declare -A SHA_AMD=(
  [2026.3.4]=7209c16cee545c712c9522ac94c6e39a19bbdd89315732f78977ce1de3a9559b1c54c50d3401beee500338c5a15ce8f33716320b8c5eadc1c2758b11b619204a
)
declare -A SHA_ARM=(
  [2026.3.4]=3653e478fa2bd7e92d7908d5b140e61b08d8f5c38fa4f3731e7521ce1d1fe227eb064db0d3d62b1a8ea12a9963f941f32a5f85ba0545f0b94e8cfee61989dcd8
)
render() { echo "s/__VER__/\"$1\"/g; s|__BUILD__|${BUILD[$1]}|g; s|__SHA_AMD__|${SHA_AMD[$1]}|g; s|__SHA_ARM__|${SHA_ARM[$1]}|g"; }
