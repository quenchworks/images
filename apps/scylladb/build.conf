# scylladb: installs the official per-arch relocatable binary (self-contained,
# bundles its own libreloc). Newest-only: the current release (2026.3.2).
# The release has a unique BUILD id (0.<date>.<githash>) and per-arch sha512;
# it lives under REL=2026.3 (relocatable dir = major.minor, derived from VER).
FROM_SOURCE=1
VERSIONS=(2026.3.3)
declare -A BUILD=(
  [2026.3.3]=0.20261004.d80b3d6ca26b
)
declare -A SHA_AMD=(
  [2026.3.3]=63903d2f91b904a58e2de374c84a5edb8a4d3ac9cd19154a9ee137e814595e4adaeafe0a177e0b4d3f9619c4760b6fadda7bf5c7531a4c1b4624f87d667caf2d
)
declare -A SHA_ARM=(
  [2026.3.3]=ff18dacea886c49273e7f10263fce6512863db3510a51258bb1ec16aa59099b831304840d0d70b65899c7fc71838717fcdacf9f4572ea11276c1cbdbf8bdabc0
)
render() { echo "s/__VER__/\"$1\"/g; s|__BUILD__|${BUILD[$1]}|g; s|__SHA_AMD__|${SHA_AMD[$1]}|g; s|__SHA_ARM__|${SHA_ARM[$1]}|g"; }
