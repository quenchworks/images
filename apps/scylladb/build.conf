# Re-measured 2026-11-10: master and the 2026.3.5 / 2026.4.0-rc2 candidates still pin wasmtime 24.0.9. Hold.
# STATUS 2026-11-02: two NEW wasmtime findings in the statically linked libexec/scylla, wasmtime
# 24.0.9: CVE-2026-115889 (Cranelift SSA index overflow, fixed 36.0.19/43.0.0) and CVE-2026-115893
# (aarch64 br_table, fixed 36.0.19/48.0.7/49.0.4). Both need a crafted Wasm module compiled by
# Cranelift, which in Scylla means WASM UDFs (experimental, off by default). That is a config
# condition an operator can change, not a code fact, so no VEX: the published image keeps the two
# findings. Scylla master and 2026.3.4 both pin wasmtime 24.0.9 in rust/Cargo.lock. Unblock: a
# Scylla release whose rust/Cargo.lock has wasmtime >= 36.0.19; until then a rebuild fails the gate.
#
# scylladb: installs the official per-arch relocatable binary (self-contained,
# bundles its own libreloc). Newest-only: the current release (2026.3.4).
# The release has a unique BUILD id (0.<date>.<githash>) and per-arch sha512;
# it lives under REL=2026.3 (relocatable dir = major.minor, derived from VER).
FROM_SOURCE=1
VERSIONS=(2026.3.4)
declare -A BUILD=(
  [2026.3.4]=0.20261018.daef9dad4a01
)
declare -A SHA_AMD=(
  [2026.3.4]=7209c16cee545c712c9522ac94c6e39a19bbdd89315732f78977ce1de3a9559b1c54c50d3401beee500338c5a15ce8f33716320b8c5eadc1c2758b11b619204a
)
declare -A SHA_ARM=(
  [2026.3.4]=3653e478fa2bd7e92d7908d5b140e61b08d8f5c38fa4f3731e7521ce1d1fe227eb064db0d3d62b1a8ea12a9963f941f32a5f85ba0545f0b94e8cfee61989dcd8
)
render() { echo "s/__VER__/\"$1\"/g; s|__BUILD__|${BUILD[$1]}|g; s|__SHA_AMD__|${SHA_AMD[$1]}|g; s|__SHA_ARM__|${SHA_ARM[$1]}|g"; }
