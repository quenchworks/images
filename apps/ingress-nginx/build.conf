# ingress-nginx: Wolfi apk (FROM_SOURCE=0, apko-only, 0-CVE). The Kubernetes
# NGINX Ingress Controller. Wolfi names the package by minor
# (ingress-nginx-controller-1.15); VERSIONS holds full X.Y.Z used as the image tag,
# mapped to the exact apk via PIN. The controller binary is the entrypoint; the chart
# wires its flags, RBAC, and the admission webhook.
# Only the 1.15 line ships: the 1.13.4-r0 / 1.14.4-r0 apks Wolfi currently publishes
# carry fixable CRITICAL/HIGH CVEs (crypto/tls, nginx RCE, Go cgo) whose patched
# rebuilds aren't in Wolfi yet. Re-add 1.13/1.14 once Wolfi ships the fixes.
FROM_SOURCE=0
VERSIONS=(1.15.8)
declare -A PIN=( [1.15.8]=1.15.8-r8 )
render() { local v=$1; echo "s|__PKG__|ingress-nginx-controller-${v%.*}=${PIN[$v]}|g"; }
