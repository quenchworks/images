# STATUS: ZLIB-ONLY as of 2026-09-16. Measured, not assumed: run 35066647893
# on af0623d gated with exactly one finding, zlib CVE-2026-85091, on every
# version and both arches. Nothing else in this image is flagged.
#
# This recipe carried an explicit BLOCKED=0 and so kept building and failing
# on every sweep. The measurement above is what changes it to 1: the gate
# cannot pass until Wolfi ships zlib 1.3.3-r0, which upstream madler/zlib
# has never tagged. Downgrading to Wolfi's 1.3.1-r51 is not a way out: it
# predates the 1.3.2-r0 fix for CVE-2026-27171.
#
# Clear it with scripts/blocked.py --dispatch once 1.3.3-r0 lands.
# STATUS 2026-08-27: UNBLOCKED. Re-tested from scratch today; the 2026-08-20 note was
# correct about the cause and wrong about it being unfixable.
#
# What the nightly scan on the PUBLISHED image (1.15.8, built weeks ago, never rebuilt)
# reported: 46 fixable. A plain local rebuild on the current pin (1.15.10-r3, still
# Wolfi's newest -- no r4 exists) clears 42 of them as ordinary apk drift and leaves 4
# rows, which are two distinct CVEs counted twice each (once in the binary, once in the
# apk's own bundled SBOM, which Trivy scans as a separate gobinary target):
#   golang.org/x/net  v0.55.0 -> 0.56.0  CVE-2026-46600  HIGH   (dns/dnsmessage DoS)
#   golang.org/x/text v0.37.0 -> 0.39.0  CVE-2026-56852  HIGH
# Both are now HIGH; when the 2026-07-27 note was written they were UNKNOWN severity and
# did not reach the CHML gate at all. That re-rating is what turned this into a blocker.
#
# The Wolfi gate is real: 1.15.10-r3 is the newest published revision and its bundled
# SBOM still records x/net v0.55.0 / x/text v0.37.0, so no pin bump can clear it. What
# the old note missed is that the apk's SBOM also records the SOURCE it was built from --
#   pkg:github/chainguard-forks/ingress-nginx@controller-v1.15.10 @ 5a85da17
# (a fork; kubernetes/ingress-nginx's newest 1.15 tag is only controller-v1.15.1) -- so
# the controller binary CAN be rebuilt from the same version with the modules floated.
# melange.yaml now does exactly that for /usr/bin/nginx-ingress-controller alone, using
# `replaces:` to take over the file (apps/python precedent) and correcting the apk's
# bundled SBOM from the rebuilt binary's own buildinfo (never hand-written). nginx, the
# lua/modsecurity module set, the templates, nginx-dbg and waitshutdown are untouched --
# neither of those two Go binaries links x/net or x/text.
#
# Local verdict after the fix, PUSH=0 scripts/build-image.sh, BOTH arches gated
# separately (aarch64 under qemu):
#   image.tar (wolfi) 0 | nginx-ingress-controller 0 | nginx-dbg 0 | waitshutdown 0
#   | bundled SBOM 0
#   --> "0 fixable CVEs (x86_64)" and "0 fixable CVEs (aarch64)"
# test.sh passes on BOTH arches (arm64 via docker emulation): banner controller-v1.15.10,
# nonroot 1001, and the controller reads nginx's OWN version rather than erroring -- so
# the rebuilt binary and the apk's nginx do agree at runtime.
#
# The app went FROM_SOURCE=0 -> 1, so CI needed converting too:
# .github/workflows/build-ingress-nginx.yml was apko-only and would have failed on the
# missing `@local ./packages` repo and melange.rsa.pub. It now installs melange, renders
# melange.yaml, and runs `melange keygen` + `melange build` into ./packages BEFORE the
# apko assemble step -- same native per-arch shape as build-python.yml, no qemu in CI.
#
# Self-expiring: melange.yaml FAILS the build the day Wolfi rebuilds the controller
# against the fixed modules (the SBOM step asserts the apk is still below the floor).
# On that day delete melange.yaml, the `@local` lines in apko.yaml, the melange steps in
# .github/workflows/build-ingress-nginx.yml, and set FROM_SOURCE=0 again. Re-check with:
#   apk policy ingress-nginx-controller-1.15  &&  read the apk's SBOM
BLOCKED=1  # unblocked 2026-08-27: controller rebuilt from source, both arches 0-CVE
# ingress-nginx: Wolfi apk + one melange shim (see apko.yaml / melange.yaml). The
# Kubernetes NGINX Ingress Controller. Wolfi names the package by minor
# (ingress-nginx-controller-1.15); VERSIONS holds full X.Y.Z used as the image tag,
# mapped to the exact apk via PIN. The controller binary is the entrypoint; the chart
# wires its flags, RBAC, and the admission webhook.
# Only the 1.15 line ships: the other apks Wolfi currently publishes for this package
# are 1.12.4-r0 and 1.14.4-r0 (the 1.13 line is gone from the Wolfi index entirely as of
# 2026-08-27), and both carry fixable CRITICAL/HIGH CVEs (crypto/tls, nginx RCE, Go cgo)
# whose patched rebuilds aren't in Wolfi yet. Re-add 1.14 once Wolfi ships the fixes.
FROM_SOURCE=1
VERSIONS=(1.15.10)
# test.sh takes its extra args from build-ingress-nginx.yml, which passes "3.13" rather
# than the version. Mirrored here so the local gate matches CI; passing the
# version instead fails an image that runs fine.
boot_args() { echo "3.13"; }
declare -A PIN=(
  [1.15.10]=1.15.10-r3
)
# Commit that controller-v<version> resolves to in chainguard-forks/ingress-nginx -- the
# source the Wolfi apk records in its SBOM. melange.yaml verifies the clone against it.
declare -A COMMIT=(
  [1.15.10]=5a85da174c066f62bbce8315fb1c4f2e71446683
)
# sha256 of the pinned .apk on packages.wolfi.dev, per arch. melange.yaml downloads that
# apk to read its bundled SBOM (it cannot be installed into the melange guest -- see the
# note there) and verifies it against these. Bump alongside PIN; get them with
#   curl -fsSL https://packages.wolfi.dev/os/<arch>/ingress-nginx-controller-1.15-<pin>.apk | sha256sum
declare -A APKSHA_X86_64=(
  [1.15.10]=89d9d36c6149eb04877777cc3f76903ea4199fb1c56ecac711b4bcba968a2756
)
declare -A APKSHA_AARCH64=(
  [1.15.10]=24189f08340d489e8f7633500cc44fb41e1807afcf41e316f5a18d2c02df7518
)
render() {
  local v=$1 m=${1%.*}
  echo "s|__PKG__|ingress-nginx-controller-${m}=${PIN[$v]}|g;\
s|__APKSHA_X86_64__|${APKSHA_X86_64[$v]}|g;\
s|__APKSHA_AARCH64__|${APKSHA_AARCH64[$v]}|g;\
s|__APKVER__|${PIN[$v]}|g;\
s|__COMMIT__|${COMMIT[$v]}|g;\
s|__MINOR__|${m}|g;\
s|__VER__|${v}|g"
}
