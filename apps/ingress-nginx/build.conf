# STATUS 2026-08-20: BLOCKED, genuinely Wolfi-gated (verified, not assumed).
# Bumped the pin r1 -> r3 (Wolfi's newest) and installed that apk to read its SBOM:
#   ingress-nginx-controller-1.15-1.15.10-r3  ->  golang.org/x/net@v0.55.0
#                                                 golang.org/x/text@v0.37.0
# Those are exactly the two rows the gate fails on (x/net needs 0.56.0, x/text 0.39.0), so
# the newest published apk does NOT clear them. FROM_SOURCE=0, so there is no float to
# apply -- the module versions are baked into Wolfi's build of the controller binary.
# Unblocks when Wolfi rebuilds ingress-nginx-controller-1.15. Re-check with:
#   apk policy ingress-nginx-controller-1.15  &&  read the apk's SBOM
# Do NOT record a Wolfi gate without reading the SBOM: kubectl looked identically gated
# today and was simply pinned two patches behind.
BLOCKED=1
# ingress-nginx: Wolfi apk (FROM_SOURCE=0, apko-only, 0-CVE). The Kubernetes
# NGINX Ingress Controller. Wolfi names the package by minor
# (ingress-nginx-controller-1.15); VERSIONS holds full X.Y.Z used as the image tag,
# mapped to the exact apk via PIN. The controller binary is the entrypoint; the chart
# wires its flags, RBAC, and the admission webhook.
# Only the 1.15 line ships: the 1.13.4-r0 / 1.14.4-r0 apks Wolfi currently publishes
# carry fixable CRITICAL/HIGH CVEs (crypto/tls, nginx RCE, Go cgo) whose patched
# rebuilds aren't in Wolfi yet. Re-add 1.13/1.14 once Wolfi ships the fixes.
#
# CVE 2026-07-27: the two nightly rows (golang.org/x/net v0.55.0 -> 0.56.0
# CVE-2026-46600, golang.org/x/text v0.37.0 -> 0.39.0 CVE-2026-56852, both UNKNOWN
# severity so neither blocks the CHML gate) are Wolfi-gated -- NOT a stale pin.
# Wolfi has published r9 and r10 since we pinned r8, but I unpacked
# ingress-nginx-controller-1.15-1.15.8-r10.apk and its SBOM still reports
# golang.org/x/net@v0.55.0 and golang.org/x/text@v0.37.0, i.e. the newer revisions
# were NOT rebuilt against the fixed modules. Bumping the pin would clear 0 findings,
# so the pin stays at r8; re-check when Wolfi floats the module set.
FROM_SOURCE=0
VERSIONS=(1.15.10)
declare -A PIN=(
  [1.15.10]=1.15.10-r3
)
render() { local v=$1; echo "s|__PKG__|ingress-nginx-controller-${v%.*}=${PIN[$v]}|g"; }
