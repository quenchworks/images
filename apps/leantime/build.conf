# leantime: Leantime (Leantime/leantime, AGPL-3.0), project management for non-project-managers: tasks, kanban,
# timesheets, goals and ideas. Images issue #118.
#
# From the release tag as upstream's makefile builds it: composer install --no-dev, then laravel/framework,
# phpseclib and the symfony http stack raised to their fixed releases inside the root ranges (the build asserts each
# floor), npm ci + npx mix --production for the front end, then the package target's file set. php-8.5-fpm and
# QuenchWorks' nginx under supervisor (as Snipe-IT). storage/, bootstrap/cache, userfiles/ and public/userfiles link
# to /var/lib/leantime (the volume). /usr/libexec/leantime-init needs LEAN_SESSION_PASSWORD and LEAN_DB_* (PostgreSQL
# with LEAN_DB_DEFAULT_CONNECTION=pgsql, or MySQL), waits for the database, runs bin/leantime db:migrate (first run:
# installs and creates the admin from LEAN_ADMIN_EMAIL / LEAN_ADMIN_PASSWORD), then starts supervisord. Web on 8080.
# LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(3.15.3)
declare -A SHA256=(
  [3.15.3]=5ce09ae91f386c1742ec04e1966b10bef1ba8ff93dad650ed368edb2150e3b2a
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
