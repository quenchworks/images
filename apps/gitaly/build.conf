# gitaly: Gitaly (gitlab-org/gitaly), the Git RPC service GitLab keeps repositories in. MIT. Part of the
# GitLab CE build (images issue #20); its version is the GitLab version.
#
# Gitaly 19 runs only its bundled Git: there is no git.bin_path any more, and a system git is reached only
# through a testing variable. So the build is upstream's own `make build`: it clones gitlab-org/git at the
# three commits pinned in Gitaly's Makefile (GIT_VERSION_PREV, _MASTER, _MVCC), builds each with meson
# against Wolfi's curl, OpenSSL, PCRE2 and zlib, and embeds them in the gitaly binary.
# Scan note: the embedded gitaly-git-* binaries are C without package metadata, so Trivy does not see
# their Git version; their libraries come from Wolfi and are scanned there.
#
# Measured 2026-11-15 on 19.5.5: go.mod has go-jose, x/crypto, x/net and otel findings; with the floors in
# melange.yaml the Go binaries scan at 0.
FROM_SOURCE=1
VERSIONS=(19.5.5)
declare -A SHA256=(
  [19.5.5]=c9c0b44e4c4e9998ddff246d1e747240cd6844d9c51ea5cb847347deb68daf69
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
