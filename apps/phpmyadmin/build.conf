# STATUS: ZLIB-ONLY as of 2026-09-16. Measured, not assumed: run 35066836878
# on af0623d gated with exactly one finding, zlib CVE-2026-85091, on every
# version and both arches. Nothing else in this image is flagged.
#
# Wolfi is at 1.3.2.1_rc20260601-r0 and the advisory wants 1.3.3-r0, which
# upstream madler/zlib has never tagged. Downgrading to Wolfi's 1.3.1-r51
# is not a way out either: it predates the 1.3.2-r0 fix for CVE-2026-27171.
#
# BLOCKED=1 skips build+merge so sweeps stop burning a red run here. Clear
# it with scripts/blocked.py --dispatch once Wolfi ships zlib 1.3.3-r0.
# phpmyadmin (phpmyadmin/phpmyadmin): the web-based MySQL/MariaDB administration UI,
# GPL-2.0-only. Upstream ships the FINISHED application as an official release tarball
# (phpMyAdmin-<VER>-all-languages.tar.xz on files.phpmyadmin.net) that already carries
# the composed vendor/ tree, the built front-end assets and every translation, so there
# is nothing to compile: melange fetches it (sha256-pinned; upstream publishes a
# .sha256 sidecar next to the tarball and our pin matches it byte-for-byte) and lays it
# down under /var/www/html. The runtime is php-8.3 + FPM behind QuenchWorks' hardened
# nginx (quench-nginx, built FROM SOURCE in the same build -> FROM_SOURCE=1), both
# supervised by supervisord -- the same house pattern as drupal/wordpress/matomo.
#
# WHY quench-nginx AND NOT the Wolfi `nginx-stable` apk: Wolfi is still on 1.30.2-r0
# while Trivy requires 1.30.4-r2 for CVE-2026-42055 (HIGH) + CVE-2026-48142 (MEDIUM).
# That is exactly what has apps/matomo BLOCKED today. Building nginx 1.30.4 from source
# (apps/nginx) keeps this image gateable.
#
# WHY ONE VERSION (5.2.3, released 2025-10-08): phpMyAdmin maintains a SINGLE active
# line. https://www.phpmyadmin.net/home_page/version.json advertises exactly two
# releases -- 5.2.3 (current) and the frozen legacy 4.9.11 (2023, php ">=5.5,<8.0").
# 5.1.x / 5.0.x are end-of-life and receive no PMASA security fixes, and 4.9.11 cannot
# even run on the php-8.3 runtime this image ships, so a 3-line window would mean
# publishing unsupported, unpatched code. Same call as apps/drupal (single 11.4 line).
# 5.2.3 declares php ">=7.2,<8.4" -> php-8.3 is the newest PHP major upstream supports.
BLOCKED=1
FROM_SOURCE=1
VERSIONS=(5.2.3)
declare -A SHA256=(
  [5.2.3]=57881348297c4412f86c410547cf76b4d8a236574dd2c6b7d6a2beebe7fc44e3
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
