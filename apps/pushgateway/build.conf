# Prometheus Pushgateway (prometheus/pushgateway, Apache-2.0): accepts metrics pushed by
# short-lived batch and cron jobs and exposes them for Prometheus to scrape. From source via
# melange: one static Go binary stamped with promu's prometheus/common/version flags (the web
# UI assets are pre-generated in the tag). LATEST-ONLY: one maintained line (1.11).
FROM_SOURCE=1
VERSIONS=(1.11.4)
declare -A SHA256=(
  [1.11.4]=7ae6541d891c9f700f81f2ef10f2d465fd61cc73b14a6f92ba0ce6b6250b5649
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
