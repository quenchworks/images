# ExternalDNS (kubernetes-sigs): from-source via melange (Go build from the git
# tag tarball). Image-only (a controller, no chart). Latest patch of the last 3
# minor lines (0.19, 0.20, 0.21 -- each line has only a .0 patch upstream).
# Single static Go binary, CGO disabled. Version is stamped via -X on
# sigs.k8s.io/external-dns/pkg/apis/externaldns.Version.
FROM_SOURCE=1
VERSIONS=(0.19.0 0.20.0 0.21.0)
declare -A SHA256=(
  [0.19.0]=70c0c70b13670125e1295039f0a22e449619d72e1065f73cfd70c29843b68d3a
  [0.20.0]=f108f1c8a055bc65ee02c248c7152934aab598ae9ae647ff26972ce3a47fdf67
  [0.21.0]=78fd72654681bb6ebf13f1360551f8aafb08f2d0eeecdd6523a89c8631b5cf64
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
