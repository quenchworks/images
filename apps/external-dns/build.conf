# ExternalDNS (kubernetes-sigs): from-source via melange (Go build from the git
# tag tarball). Image-only (a controller, no chart). Newest release line only
# (0.21). Single static Go binary, CGO disabled. Version is stamped via -X on
# sigs.k8s.io/external-dns/pkg/apis/externaldns.Version.
FROM_SOURCE=1
VERSIONS=(0.22.0)
declare -A SHA256=(
  [0.22.0]=e60abf206d8e150dbc9a4e86ce2d2cf8b1899c6c1b53cdae382078c57ece47b7
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
