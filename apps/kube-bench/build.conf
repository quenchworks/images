# kube-bench: runs the CIS Kubernetes Benchmark checks (and the EKS, GKE, AKS, OpenShift and k3s variants) against a
# node's control plane and kubelet. Static Go binary built from the source tag (version stamped on
# cmd.KubeBenchVersion as upstream's makefile does), the cfg/ benchmark definitions and the helper script the
# checks call, on Wolfi with the tools the audits shell out to (bash, findutils, jq, kubectl, openssl, procps).
#
# ROOT BY DESIGN: the audits read the host's config files and process list (hostPID, host paths mounted
# read-only), which upstream's Job runs as root. The image is still read-only-rootfs friendly. Upstream's
# entrypoint "install" mode (copy the binary onto the host) is not shipped; the entrypoint is kube-bench itself.
#
# NEWEST-ONLY to start.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(0.16.0)
# sha256 of the GitHub source tarball, from a download
declare -A SHA256=(
  [0.16.0]=41fb9a5db1030439270a6a969da49cccb5149bd760fa478c0ca8757d0ef7bcce
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
