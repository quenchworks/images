# dufs (sigoden/dufs, Apache-2.0 or MIT): a file server with a web UI for browsing, uploading,
# searching and zipping folders, WebDAV, resumable uploads and per-path access control. From
# the release tag via melange: built with cargo auditable (the release binary carries no crate
# list, so a scan of it sees nothing) after raising the zip crate to 9.0.5 (CVE-2026-115905).
# TLS is rustls with ring, no OpenSSL. LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(0.47.0)
declare -A SHA256=(
  [0.47.0]=bab9d4fa1654adc6c88523b61bb8697f575334248cf554282e1f87e2329c0569
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
