# dufs from the release tag: one binary at /usr/bin/dufs, its crate list embedded by cargo auditable.
package:
  name: quench-dufs
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened dufs file server, built from source on Wolfi"
  copyright:
    - license: Apache-2.0 OR MIT
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base         # ring compiles C and assembly
      - busybox
      - ca-certificates-bundle
      - rust
      # cargo auditable embeds the crate list in a .dep-v0 section; without it the scan sees
      # no Rust packages in the binary at all
      - cargo-auditable

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/sigoden/dufs/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - name: Build
    runs: |
      set -eu
      export CARGO_HOME="$(mktemp -d)"
      # CVE-2026-115905: zip 9.0.4 in the release lock, fixed in 9.0.5
      cargo update -p zip --precise 9.0.5
      grep -A1 '^name = "zip"$' Cargo.lock | grep -q 'version = "9.0.5"'
      cargo auditable build --release
      install -Dm755 target/release/dufs "${{targets.destdir}}/usr/bin/dufs"
      "${{targets.destdir}}/usr/bin/dufs" --version | grep -F "${{package.version}}"

test:
  pipeline:
    - runs: |
        dufs --version
