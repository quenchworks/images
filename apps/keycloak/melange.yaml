# Packages Keycloak onto Wolfi. Keycloak (Quarkus) is a pure-JVM identity & access
# management server (SSO, OIDC, SAML): we ship the upstream Quarkus distribution's
# jars but run on the hardened openjdk-21-jre base the JVM tier (kafka/opensearch/
# solr) established, so the JRE stays the CVE surface the Trivy gate scans (a bundled
# JDK would escape attribution). The dist ships no JDK and no per-arch native bundles,
# so a single tarball serves both amd64 and arm64 -- no per-arch fetch needed.
#
# We bake an OPTIMIZED image: `kc.sh build` is run at build time (with health/metrics
# enabled and the postgres+dev-file DB drivers baked in) so the runtime entrypoint
# uses `kc.sh start --optimized` -- no augmentation at runtime, which keeps the rootfs
# read-only and makes boot fast.
package:
  name: quench-keycloak
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Keycloak (identity & access management), packaged on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - openjdk-21-jre     # the JRE Keycloak runs on (the scanned CVE surface)
      - bash               # the docker-entrypoint is bash (kc.sh itself is /bin/sh)
      - busybox

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - curl
      - ca-certificates-bundle
      - openjdk-21-default-jdk  # build-time only: needed to run `kc.sh build` (augmentation)

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/keycloak/keycloak/releases/download/${{package.version}}/keycloak-${{package.version}}.tar.gz
      expected-sha512: "__SHA512__"
      strip-components: 1
  - runs: |
      # --- CVE remediation: swap vulnerable bundled jars BEFORE `kc.sh build` so the
      # Quarkus augmentation re-indexes the patched versions ---------------------------
      # (1) OpenTelemetry stack 1.57.0 -> 1.62.0 IN LOCKSTEP (CVE-2026-45292, DoS via
      #     unbounded memory in opentelemetry-api). OTel's versioning contract requires
      #     api+sdk+exporters move together, so all 14 io.opentelemetry.opentelemetry-*
      #     core jars are bumped as a set (sha256-pinned Maven Central). The separate
      #     instrumentation-2.23.0 and semconv-1.37.0 lines use only stable OTel APIs and
      #     are not flagged, so they stay. Quarkus 3.33's quarkus-opentelemetry extension
      #     re-augments against the bumped set below.
      # (2) jackson-databind 2.21.2 -> 2.21.5 (CVE-2026-54512..54518; 2.21.5 required for
      #     -54515). Same-minor drop-in.
      #
      # IMPORTANT: Keycloak's baked Quarkus app-model (lib/quarkus/quarkus-application.dat)
      # pins each dependency by its EXACT jar FILENAME (no checksum) and `kc.sh build`
      # pre-flights their existence. So we must NOT rename: we overwrite the 1.57.0-named
      # files with the 1.62.0 CONTENT. Augmentation then regenerates its bytecode against
      # the 1.62.0 classes actually present, and Trivy reads the jar's internal
      # pom.properties (= the fixed version), so the gate sees the patched version.
      cd lib/lib/main
      swap() { # url outfile-kept-name sha256(of downloaded content)
        curl -fsSL -o "$2" "$1"
        echo "$3  $2" | sha256sum -c -
      }
      OT="https://repo1.maven.org/maven2/io/opentelemetry"
      swap "$OT/opentelemetry-api/1.62.0/opentelemetry-api-1.62.0.jar" io.opentelemetry.opentelemetry-api-1.57.0.jar d58143928c049233653e6bf1282ff8a767ebdd5e6a82b3f336158c30e40b431d
      swap "$OT/opentelemetry-api-incubator/1.62.0-alpha/opentelemetry-api-incubator-1.62.0-alpha.jar" io.opentelemetry.opentelemetry-api-incubator-1.57.0-alpha.jar 6b8dbe21aea973896555c65e94de694ff73f788bdf47c712f8b2267a57b5d0d8
      swap "$OT/opentelemetry-common/1.62.0/opentelemetry-common-1.62.0.jar" io.opentelemetry.opentelemetry-common-1.57.0.jar d6310bebde67d65c1519696728d8604005315ed08ab14071956fc0826fd71815
      swap "$OT/opentelemetry-context/1.62.0/opentelemetry-context-1.62.0.jar" io.opentelemetry.opentelemetry-context-1.57.0.jar 8ec86c3609222b9b6307bf40154c1f1c288d1f18ada0155409e7797adbdbe517
      swap "$OT/opentelemetry-exporter-common/1.62.0/opentelemetry-exporter-common-1.62.0.jar" io.opentelemetry.opentelemetry-exporter-common-1.57.0.jar 50f84b5b58048f69bd684ec874413944209995e01c177200555c151dabfe1ec9
      swap "$OT/opentelemetry-exporter-otlp/1.62.0/opentelemetry-exporter-otlp-1.62.0.jar" io.opentelemetry.opentelemetry-exporter-otlp-1.57.0.jar 59df47fdc4bef6866ed39eb6a04892c68e28d7938eaeaa21801ac5dd2dcb0d65
      swap "$OT/opentelemetry-exporter-otlp-common/1.62.0/opentelemetry-exporter-otlp-common-1.62.0.jar" io.opentelemetry.opentelemetry-exporter-otlp-common-1.57.0.jar 79eaaaf044df15209ee1461b668f7c93547734a793d6cf6ad5e57290d3f8c0ea
      swap "$OT/opentelemetry-sdk/1.62.0/opentelemetry-sdk-1.62.0.jar" io.opentelemetry.opentelemetry-sdk-1.57.0.jar 99d421ea0e5a1ca8e45cb67f1d5db7f0e8a718dd55eeb86c1323597e1f10aed3
      swap "$OT/opentelemetry-sdk-common/1.62.0/opentelemetry-sdk-common-1.62.0.jar" io.opentelemetry.opentelemetry-sdk-common-1.57.0.jar bf9d13df9a50e49a5db664ba8ebfad79f73f03219d2ac6f6709d432f6896eba0
      swap "$OT/opentelemetry-sdk-extension-autoconfigure/1.62.0/opentelemetry-sdk-extension-autoconfigure-1.62.0.jar" io.opentelemetry.opentelemetry-sdk-extension-autoconfigure-1.57.0.jar 4165984bdc3261486918a55815ae57d5e75ba08730d1e1ccf97908720659b619
      swap "$OT/opentelemetry-sdk-extension-autoconfigure-spi/1.62.0/opentelemetry-sdk-extension-autoconfigure-spi-1.62.0.jar" io.opentelemetry.opentelemetry-sdk-extension-autoconfigure-spi-1.57.0.jar 220c22bcf420faae59b7225c789f572eaa22e7af2304d55508aaf2a3efcfecf8
      swap "$OT/opentelemetry-sdk-logs/1.62.0/opentelemetry-sdk-logs-1.62.0.jar" io.opentelemetry.opentelemetry-sdk-logs-1.57.0.jar 51c94329bc8e335ed79027d29d49c075c11b91b39e48679edf590e784a392406
      swap "$OT/opentelemetry-sdk-metrics/1.62.0/opentelemetry-sdk-metrics-1.62.0.jar" io.opentelemetry.opentelemetry-sdk-metrics-1.57.0.jar 50b057fbf063f6801f623212f4b51b6a3fefc77837314a1316b2f54894c8b5d4
      swap "$OT/opentelemetry-sdk-trace/1.62.0/opentelemetry-sdk-trace-1.62.0.jar" io.opentelemetry.opentelemetry-sdk-trace-1.57.0.jar fb6c0953b229a6da1db813135ae11a621bf9da56b7356c1e93049ed4b088c232
      # micrometer-core 1.16.3 -> 1.16.6: CVE-2026-40983. Same keep-the-filename trick as
      # the otel swaps above -- the classes are the patched ones and Trivy reads the jar's
      # internal pom.properties, so the gate sees 1.16.6.
      MM="https://repo1.maven.org/maven2/io/micrometer"
      swap "$MM/micrometer-core/1.16.6/micrometer-core-1.16.6.jar" io.micrometer.micrometer-core-1.16.3.jar 1957ef2deaffbc1fb98cebfd0f5b3109ecf19c994d7e5378598c20747ba8d68b
      swap "https://repo1.maven.org/maven2/com/fasterxml/jackson/core/jackson-databind/2.21.5/jackson-databind-2.21.5.jar" com.fasterxml.jackson.core.jackson-databind-2.21.2.jar 507418c0fafd38b2b2cfb704521630da613a8e4cc8381195a6f418017883e2c0
      # (3) jackson-core 2.21.2 -> 2.21.5 (same Jul-2026 cluster; databind 2.21.5 above needs a
      #     matching-or-newer jackson-core). Content-swap keeping the 2.21.2 filename.
      swap "https://repo1.maven.org/maven2/com/fasterxml/jackson/core/jackson-core/2.21.5/jackson-core-2.21.5.jar" com.fasterxml.jackson.core.jackson-core-2.21.2.jar b64b5874162b503a0e58a8f7758266e8dd9f91bf49e3a59ae0b5f47589a231b7
      # (4) netty 4.1.135 -> 4.1.136.Final for the Jul-2026-flagged codec jars (codec/haproxy/
      #     http/http2/dns). Netty is ABI-stable within 4.1.x, so bumping the flagged jars
      #     against the 4.1.135 remainder is safe. Content-swap keeping the 4.1.135 filenames.
      #     netty-codec-dns carries GHSA-mfg7-5gfp-c4w3 (MEDIUM, DNS record-decoder memory
      #     leak on malformed domain names); netty-resolver-dns (its only consumer here) is
      #     not flagged and stays at 4.1.135 -- same 4.1.x line, ABI-compatible.
      NET="https://repo1.maven.org/maven2/io/netty"
      swap "$NET/netty-codec/4.1.136.Final/netty-codec-4.1.136.Final.jar" io.netty.netty-codec-4.1.135.Final.jar 2de4fc13005c7740b46427a47ee04265a19779c147d53e583f441889b1148159
      swap "$NET/netty-codec-haproxy/4.1.136.Final/netty-codec-haproxy-4.1.136.Final.jar" io.netty.netty-codec-haproxy-4.1.135.Final.jar 841be7fc6f1c929ecc63c70a909e0df085b4e80e44680acf46708f0e93e68037
      swap "$NET/netty-codec-http/4.1.136.Final/netty-codec-http-4.1.136.Final.jar" io.netty.netty-codec-http-4.1.135.Final.jar ffd1e1b19a533bc6e47ef2cbc1290374ff4a7cb53a280defa3df392538214948
      swap "$NET/netty-codec-http2/4.1.136.Final/netty-codec-http2-4.1.136.Final.jar" io.netty.netty-codec-http2-4.1.135.Final.jar 14f67ae095c056b062aa0ee2c7b01f6b78004cf3620a6e9061bcb637f079387a
      swap "$NET/netty-codec-dns/4.1.136.Final/netty-codec-dns-4.1.136.Final.jar" io.netty.netty-codec-dns-4.1.135.Final.jar 89bddc4ec42756c41a0195a50a1323a324836162b6712a843c3de5c29096c93b
      # (5) org.postgresql:postgresql 42.7.11 -> 42.7.12 (Jul-2026). Content-swap keeping name.
      swap "https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.12/postgresql-42.7.12.jar" org.postgresql.postgresql-42.7.11.jar 31fbf6f06b2217fb51d5100cee51b22625cc81640da0679b47914e54c1e6377c
      cd ../../..
  - runs: |
      # Run the augmentation (`kc.sh build`) at IMAGE BUILD time so runtime is optimized
      # and the rootfs can stay read-only. Bake in: health + metrics endpoints (exposed
      # on the management port 9000), and the DB vendors the chart will wire (postgres)
      # plus dev-file (embedded H2) for the self-contained smoke test. cache=ispn is the
      # Keycloak default.
      export JAVA_HOME=/usr/lib/jvm/java-21-openjdk
      export PATH="$JAVA_HOME/bin:$PATH"
      # the dist's bin/kc.sh resolves kc.home.dir from its own location; run it in place
      # --cache is a BUILD option in Keycloak 26.5+ but RUNTIME-only in 26.4.x
      # (kc.sh build rejects it). ispn is the default in every version, so build.conf
      # passes "--cache=ispn" for 26.5/26.6 and an empty __CACHE_ARG__ for 26.4.
      ./bin/kc.sh build \
        --health-enabled=true \
        --metrics-enabled=true \
        --db=postgres __CACHE_ARG__

      dest="${{targets.destdir}}/opt/keycloak"
      install -d "$dest"
      # ship the augmented distribution: bin (kc.sh launchers), the augmented lib/
      # (quarkus app + the baked build), conf, providers, themes, license.
      cp -r bin conf lib providers themes LICENSE.txt README.md version.txt "$dest/"
      # drop the Windows launchers (we run on bash/sh only)
      find "$dest/bin" -name '*.bat' -delete
      # drop the admin CLI client tools (bin/client: kcadm/kcreg + the
      # keycloak-admin-cli fat jar that SHADES jackson-databind). They are a separate
      # client, unused by the server runtime, and the shaded jackson trips the gate.
      rm -rf "$dest/bin/client"
      # mssql-jdbc 13.2.1.jre11 (CVE-2025-59250): unused in a --db=postgres build and a
      # Trivy classifier-parse false-positive (shipped jar IS the fixed .jre11 build).
      # MUST be removed AFTER `kc.sh build` -- augmentation enumerates every bundled DB
      # vendor and fails if the jar is missing at build time. The optimized postgres app
      # never loads it at runtime, so deleting it from the shipped tree is safe.
      rm -f "$dest"/lib/lib/main/com.microsoft.sqlserver.mssql-jdbc-*.jar \
            "$dest"/lib/lib/main/io.quarkus.quarkus-jdbc-mssql-*.jar \
            "$dest"/lib/lib/deployment/io.quarkus.quarkus-jdbc-mssql-deployment-*.jar

      # Read-only rootfs: Keycloak writes its data dir (H2 files, transaction logs,
      # infinispan, the optimized-marker) under ${kc.home.dir}/data, and conf may be
      # written to. kc.home.dir is fixed to /opt/keycloak, so relocate those two dirs
      # to writable mount points by symlinking them out of the read-only tree:
      #   /opt/keycloak/data -> /data   (writable mount, H2/transaction state)
      #   /opt/keycloak/conf -> /conf   (writable mount, seeded from the dist conf)
      # We keep the shipped conf as conf.dist and seed /conf from it at first boot.
      mv "$dest/conf" "$dest/conf.dist"
      ln -s /conf "$dest/conf"
      ln -s /data "$dest/data"

      # the dist ships launchers/jars with restrictive perms; the nonroot runtime user
      # must read them and exec the launchers.
      chmod -R a+rX "$dest"

      # bake a config-from-env entrypoint. Read-only rootfs: /data + /conf + /tmp live on
      # writable mounts. Default to production `start --optimized` with container-friendly
      # flags (http on, no forced hostname); KC_DEV=true flips to `start-dev` (embedded H2,
      # http, relaxed) for a self-contained run. KC_* and KEYCLOAK_ADMIN* pass through.
      install -d "${{targets.destdir}}/usr/bin"
      cat > "${{targets.destdir}}/usr/bin/docker-entrypoint.sh" <<'EOS'
      #!/bin/bash
      set -euo pipefail

      KC_HOME=/opt/keycloak
      CONF="${KC_CONF_DIR:-/conf}"
      DATA="${KC_DATA_DIR:-/data}"
      mkdir -p "$CONF" "$DATA"

      # Seed the writable conf dir from the shipped distribution once (keycloak.conf,
      # cache-ispn.xml, truststores/). /opt/keycloak/conf is a symlink to /conf.
      if [ ! -f "$CONF/keycloak.conf" ]; then
        cp -r "$KC_HOME"/conf.dist/. "$CONF"/
      fi

      # The rootfs is read-only; point java.io.tmpdir at a writable dir so the JVM and
      # Quarkus do not try to write under /tmp.
      export TMPDIR="${KC_TMP_DIR:-/tmp}"
      mkdir -p "$TMPDIR"
      export JAVA_OPTS_APPEND="${JAVA_OPTS_APPEND:-} -Djava.io.tmpdir=${TMPDIR}"

      export JAVA_HOME="${JAVA_HOME:-/usr/lib/jvm/java-21-openjdk}"
      # let Keycloak size the heap from the container cgroup limits
      export KC_RUN_IN_CONTAINER=true

      # Admin bootstrap. Keycloak 26 prefers KC_BOOTSTRAP_ADMIN_USERNAME/PASSWORD; the
      # legacy KEYCLOAK_ADMIN/KEYCLOAK_ADMIN_PASSWORD still work. Accept either: if the
      # legacy vars are set and the new ones are not, map them across.
      if [ -n "${KEYCLOAK_ADMIN:-}" ] && [ -z "${KC_BOOTSTRAP_ADMIN_USERNAME:-}" ]; then
        export KC_BOOTSTRAP_ADMIN_USERNAME="$KEYCLOAK_ADMIN"
      fi
      if [ -n "${KEYCLOAK_ADMIN_PASSWORD:-}" ] && [ -z "${KC_BOOTSTRAP_ADMIN_PASSWORD:-}" ]; then
        export KC_BOOTSTRAP_ADMIN_PASSWORD="$KEYCLOAK_ADMIN_PASSWORD"
      fi

      # Production `start --optimized` is the default: http enabled and hostname-strict
      # off for container friendliness (the chart sets KC_HOSTNAME + TLS/proxy for real
      # deployments). KC_DB* (db/db-url/db-username/db-password) pass through the env
      # natively; the optimized build is baked for --db=postgres (the chart wires the
      # QuenchWorks PostgreSQL chart).
      #
      # KC_DEV=true flips to `start-dev` (embedded H2, http, relaxed). NOTE: start-dev
      # re-augments on boot (writes under /opt/keycloak/lib/quarkus), so it requires a
      # WRITABLE rootfs -- it is a convenience for local/non-hardened use, NOT for the
      # read-only hardened runtime, which uses the optimized path above.
      if [ "${KC_DEV:-false}" = "true" ]; then
        exec "$KC_HOME/bin/kc.sh" start-dev "$@"
      fi

      exec "$KC_HOME/bin/kc.sh" start --optimized \
        --http-enabled="${KC_HTTP_ENABLED:-true}" \
        --hostname-strict="${KC_HOSTNAME_STRICT:-false}" \
        "$@"
      EOS
      chmod 0755 "${{targets.destdir}}/usr/bin/docker-entrypoint.sh"

test:
  pipeline:
    - runs: |
        test -x /opt/keycloak/bin/kc.sh
        test -x /usr/bin/docker-entrypoint.sh
        test -f /opt/keycloak/version.txt
        # the optimized build must have run: the quarkus app is augmented in place
        test -f /opt/keycloak/lib/quarkus/quarkus-application.dat
