# STATUS: SHIPPED (0-CVE) -- UNBLOCKED 2026-07-09 by bumping the bundled OpenTelemetry
#   stack 1.57.0 -> 1.62.0 IN LOCKSTEP (CVE-2026-45292). The prior "OTel ABI-lock"
#   verdict was WRONG: the swap + `kc.sh build` re-augmentation + full boot smoke
#   (Postgres, /health/ready UP, admin console 200, admin token) all PASS. The quarkus-
#   opentelemetry-3.33 extension tolerates OTel 1.62.0's stable API/SDK/autoconfigure-SPI.
#
#   Technique (see melange.yaml): Keycloak's baked Quarkus app-model
#   (lib/quarkus/quarkus-application.dat) pins each dependency by its EXACT jar FILENAME
#   (no checksum) and `kc.sh build` pre-flights existence -- so RENAMING breaks it. We
#   instead OVERWRITE each 1.57.0-named core OTel jar (all 14: api/api-incubator/common/
#   context/sdk*/exporter*) with the 1.62.0 CONTENT (sha256-pinned Maven Central), keeping
#   the filename. Augmentation regenerates its bytecode against the 1.62.0 classes present;
#   Trivy reads the jar's internal pom.properties (= 1.62.0) -> clean. Same trick for
#   jackson-databind 2.21.2 -> 2.21.5 (CVE-2026-54512..54518; 2.21.5 needed for -54515).
#   The separate instrumentation-2.23.0 / semconv-1.37.0 lines use only stable OTel APIs
#   and were never flagged, so they stay.
#
#   Also cleared:
#     * jackson-databind shaded in bin/client/keycloak-admin-cli fat jar -> DROPPED the
#       bin/client tools entirely (a separate admin CLI client, unused by the server).
#     * mssql-jdbc 13.2.1.jre11 (CVE-2025-59250, a Trivy classifier-parse false-positive:
#       the shipped jar IS the fixed .jre11 build) -> removed the unused driver + its
#       Quarkus extension jars AFTER `kc.sh build` (build-time augmentation enumerates
#       every bundled DB vendor and fails if absent; the optimized --db=postgres runtime
#       never loads it, boot verified).
#
#   TRADE-OFFS: OTel/semconv self-observability now runs on 1.62.0 core (not the exact
#   1.57.0 Keycloak shipped -- functionally equivalent, extension-compatible). No SQL
#   Server JDBC driver bundled (postgres-only optimized build; the chart wires postgres).
#   No admin-cli/kcadm/kcreg client bundled in the image (server-only; use a client
#   container if needed). Re-verify the OTel swap on each Keycloak minor bump.
#
# keycloak: from-source via melange (installs the official Keycloak server
# distribution tarball, then runs the Quarkus optimized build). Newest stable
# release only; the tarball is pinned by sha512.
