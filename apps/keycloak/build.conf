# keycloak: from-source via melange (installs the official Keycloak server
# distribution tarball, then runs the Quarkus optimized build). Latest 3 stable
# minor lines, newest patch each; each release pins its tarball by sha512.
FROM_SOURCE=1
VERSIONS=(26.4.7 26.5.7 26.6.3)
declare -A SHA512=(
  [26.4.7]=a2bfa9147164ced3451272e24afdc651e9fc204660fc08aea3d6c2e43bf1e2abe07d79b2a18b09e31a102d741be93c966657cdaadf8aa5f9e7be595c366559e4
  [26.5.7]=6ea40faa9267007c93dd7ee9659b2ac80b96905a7a5ece1d1ecca013342b6e941d5f3b9468725b0bff8b57cbcb3b447ad544661a8b46a277d4d32a7a729bfd99
  [26.6.3]=b6b10efccbffeea9d7e976d9c0c9ba35b7fe2a6d3eaa0e14075897bac7b533c36ec1fb6c21c670cb11c3334e43f9b4de5f2d98c5d321582255da0adadc9aca93
)
# --cache moved from runtime-only (26.4.x) to a build option (26.5+); ispn is the
# default everywhere, so 26.4.7 omits it (set at runtime) and 26.5/26.6 bake it in.
declare -A CACHE_ARG=( [26.4.7]="" [26.5.7]="--cache=ispn" [26.6.3]="--cache=ispn" )
render() { echo "s/__VER__/$1/g; s|__SHA512__|${SHA512[$1]}|g; s|__CACHE_ARG__|${CACHE_ARG[$1]}|g"; }
