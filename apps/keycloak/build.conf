declare -A CACHE_ARG=( [26.7.2]="--cache=ispn" )
render() { echo "s/__VER__/$1/g; s|__SHA512__|${SHA512[$1]}|g; s|__CACHE_ARG__|${CACHE_ARG[$1]}|g"; }
