# Builds the Coolify realtime component FROM SOURCE on Wolfi with melange.
#
# coolify-realtime is a TWO-process container (run together by a thin entrypoint):
#   1. soketi   -- a self-hosted Pusher-compatible WebSocket server (the "realtime"
#                  pub/sub the Coolify UI subscribes to). Listens on :6001.
#   2. terminal -- a small Node WebSocket server (ws + node-pty) that bridges the
#                  Coolify UI's xterm.js terminal to an `ssh` PTY on the target host.
#                  Listens on :6002.
# Upstream ships this as ghcr.io/coollabsio/coolify-realtime, built FROM the prebuilt
# quay.io/soketi/soketi:1.6-16-alpine image with the terminal server layered on top
# (docker/coolify-realtime/Dockerfile in the coolify repo). We DON'T inherit their
# image -- we build BOTH halves from source on Wolfi so the Trivy scan attributes the
# real dependency tree and nothing comes from an untracked upstream layer.
#
# Coolify pins realtime_version 1.0.16 (versions.json) at coolify tag v4.1.2, and that
# Dockerfile pins soketi 1.6-16-alpine (== soketi release 1.6.1) and cloudflared
# 2025.7.0. We map those to from-source / Wolfi-tracked equivalents:
#   * soketi      -> built from the soketi 1.6.1 git tag (TypeScript -> `tsc`), pruned
#                    to production deps, installed under /app (same layout: /app/bin/
#                    server.js is the entrypoint soketi expects).
#   * terminal    -> the three upstream files (terminal-server.js, terminal-utils.js,
#                    package.json) from coolify v4.1.2, with `npm ci` against the
#                    committed package-lock.json. node-pty 1.1.0 is a NATIVE addon, so
#                    build-base + python3 are present and we `npm rebuild node-pty`
#                    exactly as upstream does to compile it for the build arch.
#   * cloudflared -> BUILT FROM SOURCE here (Go), at its newest upstream release tag.
#                    The terminal server only shells out to `cloudflared access ssh` as an
#                    ssh ProxyCommand when a target host sits behind a Cloudflare tunnel.
#                    We used to take Wolfi's cloudflared apk, but Wolfi's newest published
#                    apk (2026.5.2-r2) lags upstream and still bundles OTel-Go
#                    CVE-2026-41178 + go-chi CVE-2025-69725 (both fixed upstream); building
#                    the current release (2026.7.1: otel 1.43.0, go-chi 5.3.1) from source
#                    on go-1.26 scans 0-CVE with NO module bumps. Installed at
#                    /usr/bin/cloudflared (the exact path the Wolfi apk used).
#
# Node toolchain -- pinned to nodejs-18 for BOTH build and runtime, and here's why it
# is NOT a free choice: soketi 1.6.1 depends on uWebSockets.js 20.10.0, which ships
# PREBUILT native binaries (uws_<platform>_<arch>_<nodeABI>.node) and refuses to run on
# anything newer than Node 18 ("supports only Node.js 14, 16 and 18"). Its loader picks
# the file by process.versions.modules (the Node ABI: 93=node16, 108=node18, 127=node22),
# and the package only bundles up to ABI 108 -- so Node 20/22/24 fail with "Cannot find
# module ./uws_linux_x64_<abi>.node". Upstream's own image tag (1.6-16-alpine) runs soketi
# on Node 16. node-pty 1.1.0 (compiled from source here) runs fine on Node 18, so Node 18
# is the single CVE-tracked runtime that satisfies BOTH halves. (When we bump soketi to a
# release whose uWebSockets.js supports a newer Node, bump this in lockstep.)
#
# uWebSockets.js also bundles prebuilt .node files for EVERY platform/arch (linux/darwin/
# win, x64/arm64). melange's dependency scanner reads those foreign binaries and would
# emit an impossible cross-arch SO dependency (e.g. so:ld-linux-aarch64.so.1 on an amd64
# package), which breaks apko's solve. The soketi step below therefore strips every
# prebuilt that does not match the BUILD platform+arch, keeping only the linux/<arch>
# binaries this image can actually load.
package:
  name: quench-coolify-realtime
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Coolify realtime (soketi WebSocket server + node-pty terminal bridge), built from source on Wolfi"
  copyright:
    - license: Apache-2.0   # coolify itself is Apache-2.0; soketi is AGPL-3.0 (see annotations)
  dependencies:
    runtime:
      - bash                    # the entrypoint + soketi-entrypoint are shell scripts
      - busybox                 # mkfifo/date/sleep/kill used by the entrypoint
      - ca-certificates-bundle  # TLS to external endpoints
      - nodejs-18               # runs both soketi (/app/bin/server.js) and the terminal server
      - openssh-client          # the terminal server spawns `ssh` to reach target hosts
      # (cloudflared is BUILT INTO this package from source -- see the pipeline below --
      #  so it is intentionally NOT a runtime dep on the lagging Wolfi apk.)

vars:
  # soketi release that the upstream realtime Dockerfile's 1.6-16-alpine tag tracks.
  soketi-version: 1.6.1
  # newest cloudflared release tag (Wolfi's apk lags at 2026.5.2 with 2 fixable CVEs;
  # this tag's module graph -- otel 1.43.0, go-chi 5.3.1 -- is already advisory-clean).
  cloudflared-version: 2026.7.1

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base              # node-pty native addon (make + g++)
      - busybox
      - bash
      - ca-certificates-bundle
      - git
      - nodejs-18
      # Pin npm to the 10.x line: Wolfi's unversioned `npm` has advanced to 12.x,
      # whose engines require Node >=22 (it aborts under our pinned Node 18 with
      # "npm v12 does not support Node.js v18"). npm 10 is the newest line that
      # still supports Node 18, so both build passes (soketi + terminal) run.
      - npm=~10
      - python3                 # node-gyp (node-pty) build dependency
      - go-1.26                 # cloudflared from-source build (go.mod requires go 1.26)

pipeline:
  # Coolify repo at tag v4.1.2 carries the realtime sources under
  # docker/coolify-realtime/ (terminal-server.js, terminal-utils.js, package.json,
  # package-lock.json, soketi-entrypoint.sh) -- realtime_version 1.0.16.
  - uses: git-checkout
    with:
      repository: https://github.com/coollabsio/coolify
      tag: v4.1.2
      expected-commit: e7dff30b7c998c301fd91bd169727b90c59ec291
      destination: coolify

  # soketi from its own source tree at the 1.6.1 release tag, built and pruned the
  # same way soketi's own Dockerfile does (tsc build -> prod-only deps), then placed
  # under /app so /app/bin/server.js works exactly as the entrypoint expects.
  - uses: git-checkout
    with:
      repository: https://github.com/soketi/soketi
      tag: ${{vars.soketi-version}}
      expected-commit: 5d188786beaf683aca2115a6247dcdc15c29ac77
      destination: soketi

  # cloudflared at its newest release tag, built from source so we are not blocked on
  # Wolfi's apk lag (2026.5.2-r2 still bundles OTel-Go CVE-2026-41178 + go-chi
  # CVE-2025-69725; both are fixed in this release's module graph -- verified 0-CVE,
  # no `go get` bumps needed).
  - uses: git-checkout
    with:
      repository: https://github.com/cloudflare/cloudflared
      tag: ${{vars.cloudflared-version}}
      expected-commit: ecb88678f1368581964ca2bb55615502a2ed2dbe
      destination: cloudflared-src

  - name: Build cloudflared from source (Go, static)
    runs: |
      set -eu
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      export GOTOOLCHAIN=local   # use the installed go-1.26, never fetch a toolchain
      export GOPATH="$(mktemp -d)"
      export GOCACHE="$(mktemp -d)"
      cd cloudflared-src
      # 0-CVE gate: this release's module graph now trails the fixed x/net/x/text
      # (x/net CVE-2026-46600, x/text CVE-2026-56852). Float them, then tidy.
      go get golang.org/x/net@v0.56.0 golang.org/x/sys@v0.46.0 google.golang.org/grpc@v1.82.1 golang.org/x/crypto@v0.53.0 golang.org/x/text@v0.39.0 && go mod tidy
      # Mirror the upstream Makefile's VERSION_FLAGS (-X main.Version=...); also stamp
      # BuiltForPackageManager so cloudflared's self-updater refuses to overwrite the
      # managed binary inside the immutable image. -buildvcs=false keeps the main module
      # unmatchable ((devel)) so Trivy never mis-sorts a git pseudo-version below the
      # release (provenance stays via expected-commit + the Version ldflag).
      go build -trimpath -buildvcs=false \
        -ldflags "-s -w -X 'main.Version=${{vars.cloudflared-version}}' -X 'github.com/cloudflare/cloudflared/cmd/cloudflared/updater.BuiltForPackageManager=quenchworks'" \
        -o "${{targets.destdir}}/usr/bin/cloudflared" ./cmd/cloudflared
      "${{targets.destdir}}/usr/bin/cloudflared" --version | grep -F "${{vars.cloudflared-version}}"

  - name: Build soketi from source and install it under /app
    runs: |
      set -eu
      export npm_config_cache="$(mktemp -d)"
      export HOME="$(mktemp -d)"
      export NPM_CONFIG_REGISTRY="https://registry.npmjs.org"
      export PYTHONUNBUFFERED=1

      cd soketi
      # soketi 1.6.1's production dependency tree (its optional cloud/DB/queue drivers:
      # aws-sdk -> axios/uuid/ip/follow-redirects/form-data, the SQL app managers ->
      # mysql2, pm2 -> systeminformation, etc.) ships a large set of known-vulnerable
      # transitives. Coolify only ever uses soketi as an in-memory Pusher broker (local
      # adapter, memory app manager, sync queue), so none of those drivers run -- but
      # soketi statically imports the adapter modules at load time, so the packages must
      # stay resolvable. We therefore do NOT prune them; instead we pin every flagged
      # dependency to its fixed release via npm `overrides` (same-major where one exists;
      # uuid/pm2 need a major bump but are off the default runtime path, and only their
      # module *load* -- not their API -- matters, while uuid's named `v4` export that
      # soketi itself uses is unchanged).
      #
      # Build FIRST against soketi's original dependency versions, THEN inject the pins:
      # soketi's own tsc build (TypeScript 4.5.4) type-checks the .d.ts of its imported
      # deps, and e.g. uuid 11's modern declaration syntax makes that tsc pass fail
      # (TS1383). The pins only need to reach the SHIPPED prod tree -- dist/ is already
      # compiled to plain JS that resolves the bumped packages fine at runtime.
      npm ci
      npm run build

      # Now stamp the real 1.6.1 version (the git tree self-reports "0.0.0-dev", which
      # Trivy reads as < 0.26.1 / < 1.6.0 and flags advisories this code already fixes)
      # and inject the fixed-version overrides, then re-solve a production-only tree.
      node -e '
        const fs = require("fs"), p = "package.json", j = JSON.parse(fs.readFileSync(p));
        j.version = "1.6.1";
        const pins = {
          "axios": "0.33.0",
          "uuid": "11.1.1",
          "pm2": "7.0.3",
          "systeminformation": "5.31.12",
          "form-data": "4.0.6",
          "basic-ftp": "5.3.1",
          "follow-redirects": "1.16.0",
          "msgpackr": "1.10.1",
          "picomatch": "2.3.2",
          "semver": "7.8.5",
          "ws": "7.5.11",
          "mysql2": "3.9.8",
          "ip": "1.1.9",
          "brace-expansion": "1.1.16",
          "minimatch": "3.1.5",
          "braces": "3.0.3",
          "lodash": "4.18.1"
        };
        j.overrides = Object.assign({}, j.overrides, pins);
        // glob (pulled by pm2 7) needs minimatch ^5, which the global 3.1.5 pin does not
        // satisfy, so npm keeps a vulnerable 5.1.0 nested under glob. A scoped override
        // forces it to the fixed 5.1.8 (both 3.1.5 and 5.1.8 patch the same CVEs).
        j.overrides.glob = Object.assign({}, j.overrides.glob, { "minimatch": "5.1.8" });
        // npm refuses a global override that conflicts with a direct dependency range
        // (EOVERRIDE); realign each direct dep (axios/uuid/pm2/mysql2/...) to its pin.
        for (const k of Object.keys(pins)) {
          if (j.dependencies && j.dependencies[k]) j.dependencies[k] = pins[k];
          if (j.devDependencies && j.devDependencies[k]) j.devDependencies[k] = pins[k];
        }
        fs.writeFileSync(p, JSON.stringify(j, null, 2));
      '
      # `npm install` (not `npm ci`): the injected overrides diverge from the committed
      # package-lock.json, which npm ci rejects; npm install re-solves with the pins.
      # (ignore-scripts on the prod pass: soketi's prod deps need no native build.)
      npm install --omit=dev --ignore-scripts --no-audit --no-fund
      npm prune --omit=dev

      # Strip uWebSockets.js prebuilts that don't match this build's linux/<arch>, so
      # (a) melange's dep scanner doesn't emit a cross-arch SO dependency that breaks
      # apko's solve, and (b) the image only carries the binary it can actually load.
      # Map the Wolfi/melange arch to the uWS arch token (x86_64->x64, aarch64->arm64).
      case "$(uname -m)" in
        x86_64)  uws_arch=x64 ;;
        aarch64) uws_arch=arm64 ;;
        *) echo "unexpected build arch $(uname -m)"; exit 1 ;;
      esac
      uwsdir=node_modules/uWebSockets.js
      if [ -d "$uwsdir" ]; then
        # delete every prebuilt that is NOT linux_<uws_arch>_*
        find "$uwsdir" -maxdepth 1 -name 'uws_*.node' \
          ! -name "uws_linux_${uws_arch}_*.node" -delete
        # the Node-18 ABI prebuilt (108) we depend on must remain.
        ls "$uwsdir"/uws_linux_${uws_arch}_108.node >/dev/null \
          || { echo "uWS Node-18 (ABI 108) prebuilt missing for linux/${uws_arch}"; ls "$uwsdir"/uws_*.node || true; exit 1; }
      fi
      # @msgpackr-extract similarly ships an arch-keyed optional dep dir; keep only ours.
      find node_modules/@msgpackr-extract -maxdepth 1 -type d \
        -name "msgpackr-extract-linux-*" ! -name "msgpackr-extract-linux-${uws_arch}" \
        -exec rm -rf {} + 2>/dev/null || true

      # Lay out /app exactly like the soketi image (bin/, dist/, node_modules/).
      appdir="${{targets.destdir}}/app"
      install -d "$appdir"
      cp -a bin dist node_modules package.json package-lock.json "$appdir"/
      cp -a LICENSE README.md "$appdir"/ 2>/dev/null || true
      # Sanity: the entrypoint soketi-entrypoint.sh runs `node /app/bin/server.js start`,
      # and bin/server.js does require('./../dist/cli') -> dist/cli/index.js -> dist/cli/cli.js.
      test -f "$appdir/bin/server.js"
      test -f "$appdir/dist/cli/cli.js"

  - name: Build the terminal server (ws + native node-pty) and install it under /terminal
    runs: |
      set -eu
      export npm_config_cache="$(mktemp -d)"
      export HOME="$(mktemp -d)"
      export NPM_CONFIG_REGISTRY="https://registry.npmjs.org"
      export PYTHONUNBUFFERED=1

      export PYTHON="$(command -v python3.13 || command -v python3)"
      export npm_config_python="$PYTHON"

      cd coolify/docker/coolify-realtime
      # Bump ws to its fixed release (upstream pins 8.20.1; 8.21.0 fixes CVE-2026-48779)
      # via an override, so the terminal server ships no fixable CVE. This diverges from
      # the committed package-lock.json, so we use `npm install` (not `npm ci`) below.
      node -e '
        const fs = require("fs"), p = "package.json", j = JSON.parse(fs.readFileSync(p));
        const pins = { "ws": "8.21.0" };
        j.overrides = Object.assign({}, j.overrides, pins);
        for (const k of Object.keys(pins)) {
          if (j.dependencies && j.dependencies[k]) j.dependencies[k] = pins[k];
          if (j.devDependencies && j.devDependencies[k]) j.devDependencies[k] = pins[k];
        }
        fs.writeFileSync(p, JSON.stringify(j, null, 2));
      '
      # Reproduce the realtime Dockerfile: install deps, then rebuild the node-pty native
      # addon for THIS build arch (amd64/arm64 native runners, no emulation). build-base +
      # python3 supply the toolchain.
      # Wolfi's system node-gyp (13.x, /usr/bin/node-gyp) bundles undici 6/7, which
      # references the `File` global (added in Node 20) at *module load* time -- so it
      # throws "ReferenceError: File is not defined" the moment it is required under our
      # pinned Node 18. node-pty's `install` lifecycle script (`node scripts/prebuild.js
      # || node-gyp rebuild`) calls that node-gyp straight from PATH and runs during a
      # plain install, so it aborts before we can intervene. Install deps with scripts
      # OFF, then compile node-pty by invoking a Node-18-compatible node-gyp (10.x,
      # minipass-fetch stack, no undici) directly -- bypassing npm's script-driven
      # node-gyp lookup entirely.
      npm install --ignore-scripts --no-audit --no-fund
      npm install --no-save --no-audit --no-fund --ignore-scripts node-gyp@10
      nodegyp="$PWD/node_modules/node-gyp/bin/node-gyp.js"
      test -f "$nodegyp"
      ( cd node_modules/node-pty && node "$nodegyp" rebuild )
      # Drop the build-only node-gyp tree (and its deps) so it never reaches the runtime
      # image / SBOM; node-pty's compiled build/Release/*.node stays.
      npm prune --no-audit --no-fund

      termdir="${{targets.destdir}}/terminal"
      install -d "$termdir"
      cp -a terminal-server.js terminal-utils.js package.json package-lock.json node_modules "$termdir"/
      # Sanity: the native node-pty addon (.node) must have compiled.
      find "$termdir/node_modules/node-pty" -name '*.node' | grep -q . \
        || { echo "node-pty native addon (.node) was not built"; exit 1; }

  - name: Install the soketi-entrypoint and a thin wrapper entrypoint
    runs: |
      set -eu
      destdir="${{targets.destdir}}"
      # Ship upstream's soketi-entrypoint.sh verbatim at /soketi-entrypoint.sh (it
      # supervises both `node /terminal/terminal-server.js` and
      # `node /app/bin/server.js start`, wires up log FIFOs, and forwards signals).
      install -Dm0755 coolify/docker/coolify-realtime/soketi-entrypoint.sh \
        "$destdir/soketi-entrypoint.sh"
      # Verify the supervised paths the entrypoint hardcodes line up with our layout.
      grep -q '/terminal/terminal-server.js' "$destdir/soketi-entrypoint.sh"
      grep -q '/app/bin/server.js' "$destdir/soketi-entrypoint.sh"

test:
  pipeline:
    - runs: |
        set -eu
        test -f /app/bin/server.js
        test -f /app/dist/cli/cli.js
        test -f /terminal/terminal-server.js
        test -f /terminal/terminal-utils.js
        find /terminal/node_modules/node-pty -name '*.node' | grep -q .
        test -x /soketi-entrypoint.sh
        test -x /usr/bin/cloudflared
        cloudflared --version
        node --version
