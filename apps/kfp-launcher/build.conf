# kfp-launcher: Kubeflow Pipelines launcher-v2, built from the kubeflow/pipelines release tag (2026-10-20).
# One app per KFP component; all of them build from the same tarball, so a version bump moves
# every kfp-* app together (the chart pins one release).
FROM_SOURCE=1
VERSIONS=(2.17.3 2.18.0)
declare -A SHA256=(
  [2.17.3]=2c4140fe5bd65c72ee123dc577a7b9f99ca958b1c5b47541a9cf2ffa8414225f
  [2.18.0]=f2f3e5a5d38f9b3fa2a90115f03f797d3df993f76beec758858b1de72f703d01
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
