# Packages Apache Pulsar onto Wolfi. Pulsar is a distributed messaging/streaming
# platform (broker + BookKeeper + metadata store). We ship the upstream BINARY
# distribution (prebuilt jars) on a hardened Wolfi JRE -- that JRE plus the many
# bundled jars are the CVE surface the Trivy gate scans (a bundled JDK would escape
# attribution). Pulsar 4.0 LTS supports Java 17/21, so this runs on openjdk-21-jre,
# the shared base the JVM tier (kafka/opensearch/solr/zookeeper) uses.
#
# We ship the lean `-bin` dist, NOT the `-all` bundle: connectors (Pulsar IO) and
# tiered-storage offloaders are EXCLUDED to keep the image small and the CVE surface
# minimal. The single-node deployment is `bin/pulsar standalone`, which runs the
# broker + an in-process BookKeeper bookie + an embedded metadata store (RocksDB)
# in ONE JVM -- no external ZooKeeper/bookie needed.
#
# The dist is arch-independent: Pulsar is pure JVM. The only native bits are netty
# tcnative/epoll jars, which ship per-arch jars for linux amd64 AND arm64 inside
# lib/ -- so a single tarball serves both arches. No per-arch fetch needed.
package:
  name: quench-pulsar
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Apache Pulsar (standalone), packaged on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - openjdk-21-jre     # the JRE Pulsar runs on (the scanned CVE surface)
      - bash               # bin/pulsar + the client/admin launchers are bash
      - busybox
      - procps             # bin scripts (pulsar-daemon) use a full `ps`; busybox ps lacks the flags
      - libstdc++          # RocksDB JNI (embedded metadata store + bookie ledger storage) links libstdc++.so.6

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - curl                # build-only: fetch same-major patched jars for the 0-CVE gate
      - zip                 # build-only: replace the BC jars nested in the bouncy-castle-bc bundle

pipeline:
  # Apache's CDN (dlcdn) serves only CURRENT releases and is fast; archive.apache.org keeps
  # every release but crawled at ~100 KB/s here. Try the CDN, fall back to the archive,
  # and verify the same checksum either way.
  - runs: |
      f=apache-pulsar-${{package.version}}-bin.tar.gz
      for base in https://dlcdn.apache.org/pulsar https://archive.apache.org/dist/pulsar; do
        curl -fsSL -o "$f" "$base/pulsar-${{package.version}}/$f" && break
        rm -f "$f"
      done
      echo "__SHA512__  $f" | sha512sum -c -
      tar -xzf "$f" --strip-components=1
      rm -f "$f"
  - runs: |
      # Install the distribution under /opt/pulsar. Ship the runtime pieces: bin (the
      # bash launchers: pulsar, pulsar-admin, pulsar-client, etc.), conf (the seed
      # configs), lib (all the jars -- the broker, bookie, metadata store, client),
      # instances + examples (functions runtime support), licenses. We DROP the
      # Windows .cmd launchers (we run on bash only) and any bundled JDK (none ships,
      # but be defensive).
      dest="${{targets.destdir}}/opt/pulsar"
      install -d "$dest"
      cp -r bin conf lib instances examples LICENSE NOTICE README "$dest/"

      # Drop the Windows launchers (we run on bash only).
      find "$dest/bin" -name '*.cmd' -delete

      # Be defensive: if any future dist bundles a JDK, strip it -- we run on the
      # scanned openjdk-21-jre, not a vendored JDK.
      rm -rf "$dest"/jdk "$dest"/*/jdk 2>/dev/null || true

      # The dist ships restrictive perms; the nonroot runtime user must read the conf
      # (to seed the writable mount) and exec the launchers.
      chmod -R a+rX "$dest"

      # ---- 0-CVE jar remediation (same-major standalone swaps + drop unused shaded jar) ----
      # Swap vulnerable STANDALONE lib/ jars for their same-major Trivy-fixed versions
      # from Maven Central (ABI-safe), and DROP the Java Functions runtime uber-jar
      # (java-instance.jar) which SHADES a vulnerable jackson-databind and is never
      # loaded by `bin/pulsar standalone --no-functions-worker` (the mode this image runs).
      MC="https://repo1.maven.org/maven2"
      swap() { # <maven-group-path> <artifact> <oldver> <newver> [sha256] [classifier]
        grp="$1"; art="$2"; old="$3"; new="$4"; sha="${5:-}"; cls="${6:-}"
        # classifier (e.g. linux-x86_64 on the native transport jars) suffixes BOTH the
        # shipped filename and the Maven URL; absent for the plain artifacts.
        suf=""; [ -z "$cls" ] || suf="-${cls}"
        dg="$(printf '%s' "$grp" | tr '/' '.')"
        # Three cases, decided by what the dist actually ships:
        #   old present            -> real swap (rm + download new)
        #   old absent, new SHIPPED -> the dist caught up; the line is a no-op. Warn so the
        #                              dead line gets cleaned up, but do not duplicate or die.
        #   neither present        -> the dist moved somewhere ELSE entirely; downloading
        #                              blind would add a jar beside an unknown version. FATAL.
        # This exists because blind rm+download silently ADDED netty 4.1.137 beside the
        # natively-shipped 4.1.136 when the old= said 4.1.135.
        if [ -f "$dest/lib/${dg}-${art}-${old}${suf}.jar" ]; then
          rm -f "$dest/lib/${dg}-${art}-${old}${suf}.jar"
        elif [ -f "$dest/lib/${dg}-${art}-${new}${suf}.jar" ]; then
          echo "note: dist already ships ${art}-${new}${suf}; swap line for ${old} is dead, remove it"
          return 0
        else
          echo "FATAL: ${art}${suf}: neither ${old} nor ${new} shipped -- dist moved, re-audit this line"
          ls "$dest/lib/" | grep -F "${art}" || true
          exit 1
        fi
        curl -fsSL "$MC/${grp}/${art}/${new}/${art}-${new}${suf}.jar" -o "$dest/lib/${dg}-${art}-${new}${suf}.jar"
        test -s "$dest/lib/${dg}-${art}-${new}${suf}.jar"
        [ -z "$sha" ] || echo "$sha  $dest/lib/${dg}-${art}-${new}${suf}.jar" | sha256sum -c - >/dev/null
      }
      # log4j-api 2.25.4 -> 2.25.5 (same 2.25 line, no behaviour change). Standalone jar,
      # so a straight swap; the 2.26 line is a bigger jump than this fix needs.
      swap org/apache/logging/log4j log4j-api 2.25.4 2.25.5
      # jline bundle 4.2.1 -> 4.3.1 (CVE-2026-77420/77421/77422 in its reader and builtins,
      # fixed on the same 4.x line). It is the one jline jar the dist ships.
      swap org/jline jline 4.2.1 4.3.1 c75761d4625467083c208563718fc37551af2a3468271a0758726b1f7f728d75
      # async-http-client 2.15.0 -> 2.16.1. The first hop (to 2.16.0) cleared a MEDIUM
      # that entered the DB 2026-08-26; 2.16.0 itself is now flagged for CVE-2026-85721
      # (HIGH, plus CVE-2026-85717/85720), fixed in 2.16.1 on the same 2.x line. The
      # advisory also names 3.0.12, a major hop this fix does not need.
      # netty-utils moves WITH it: it was left at 2.15.0 when ahc went to 2.16.0, which
      # put two builds of one library on the classpath. It carries no findings of its
      # own -- this is coherence, not remediation.
      swap org/asynchttpclient async-http-client 2.15.0 2.16.1 9e76dd36d4ef6e13e81e2478f4e18723cabda0fe2e3b7ad6a4f41990969a7c90
      swap org/asynchttpclient async-http-client-netty-utils 2.15.0 2.16.1 5dc30eb034ec1daea2578e3ecf861ee3212f8693170f7da53cc3503a9ff44971
      # jackson core trio: 2.18.8 -> 2.18.9 (clears CVE-2026-54515 on the standalone databind)
      swap com/fasterxml/jackson/core jackson-databind  2.18.8 2.18.9
      swap com/fasterxml/jackson/core jackson-core       2.18.8 2.18.9
      swap com/fasterxml/jackson/core jackson-annotations 2.18.8 2.18.9
      # OpenTelemetry core set: 1.56.0 -> 1.62.0 (clears CVE-2026-45292 on opentelemetry-api);
      # bumped as a consistent set so the OTel API/SDK/exporters stay in lockstep (ABI-safe within 1.x).
      for a in opentelemetry-api opentelemetry-common opentelemetry-context \
               opentelemetry-exporter-common opentelemetry-exporter-otlp \
               opentelemetry-exporter-otlp-common opentelemetry-exporter-sender-okhttp \
               opentelemetry-sdk opentelemetry-sdk-common \
               opentelemetry-sdk-extension-autoconfigure opentelemetry-sdk-extension-autoconfigure-spi \
               opentelemetry-sdk-logs opentelemetry-sdk-metrics opentelemetry-sdk-trace; do
        swap io/opentelemetry "$a" 1.56.0 1.62.0
      done
      swap io/opentelemetry opentelemetry-api-incubator      1.56.0-alpha 1.62.0-alpha
      swap io/opentelemetry opentelemetry-exporter-prometheus 1.56.0-alpha 1.62.0-alpha
      # netty codec family: 4.1.135.Final -> 4.1.136.Final (July-2026 wave on the standalone
      # netty-codec/-haproxy/-http/-http2/-dns jars; same 4.1.x line, ABI-safe patch).
      # netty-codec-dns carries GHSA-mfg7-5gfp-c4w3 (MEDIUM, DNS record-decoder memory leak
      # on malformed domain names); its consumers (netty-resolver-dns + the macos variants)
      # are not flagged and stay on 4.1.135 -- same 4.1.x line, ABI-compatible.
      # codec-http goes to 4.1.137 (CVE-2026-59903 fixed there; the rest of the family
      # is clean at 4.1.136). An earlier duplicate swap for this jar was removed: THIS
      # line runs later and re-downloaded 4.1.136 after it, leaving both jars on the
      # classpath -- the last-swap-wins twin of the last-float-wins module lesson.
      # --- 2026-09-14: netty family 4.1.136.Final -> 4.1.137.Final (lockstep) ---------
      # The nightly scan flags netty-handler at 4.1.136.Final (fix: 4.1.137.Final).
      # Verified in the published 4.2.4 image: the whole io.netty family sits at
      # io.netty-netty-*-4.1.136.Final in /opt/pulsar/lib (buffer, codec, codec-dns,
      # codec-haproxy, codec-http2, codec-socks, common, handler, handler-proxy,
      # resolver, resolver-dns, resolver-dns-classes-macos, resolver-dns-native-macos
      # -osx-{aarch_64,x86_64}, transport, transport-classes-epoll, transport-native-epoll
      # -linux-{x86_64,aarch_64}, transport-native-unix-common -- 19 jars); netty-codec-http
      # already runs 4.1.137.Final via the swap below; tcnative 2.0.78 and the io_uring
      # incubator line (0.0.26.Final) are separate and not flagged. 4.2.4 is the newest
      # upstream pulsar -- NO version bump; jar surgery. sha256 pinned from Maven Central
      # downloads. The family moves as ONE lockstep set; within the 4.1 patch line the hop
      # is ABI-compatible (the shipped codec-http 4.1.137 precedent proves it), and
      # swap()'s three-case logic fails loudly if the dist moves.
      swap io/netty netty-codec-http    4.1.136.Final 4.1.137.Final 0535bb5a736472bef5c948d15eb273c4ab9f796656fc7c5d6b982ad92bddbd49
      swap io/netty netty-buffer                                         4.1.136.Final 4.1.137.Final f474b14c7734f15e0540394cb6f39d67777b7581a42919e4ac89d253d4efd929
      swap io/netty netty-codec                                          4.1.136.Final 4.1.137.Final 9987b6a660b0a6b1f0d791485dae33180b3d1c63687c006fe6d3fd025e9e3798
      swap io/netty netty-codec-dns                                      4.1.136.Final 4.1.137.Final 2d9a33ce41bd9f6f607df95039e42518a1fca16f83c9bbfe72beb57df6e2489f
      swap io/netty netty-codec-haproxy                                  4.1.136.Final 4.1.137.Final 5ffa58b94c5ac48fb7e41843c18acf7a268e90b5b85423987829c9291ce3a5df
      swap io/netty netty-codec-http2                                    4.1.136.Final 4.1.137.Final 576ddcfb51b78e86f145c9a52b60e500b1a1d5a257cafec8aa5416ffba044b49
      swap io/netty netty-codec-socks                                    4.1.136.Final 4.1.137.Final 4a6190e08988c058bfeef2b5965e71946439c771abf721c68f4039b4e7b023e8
      swap io/netty netty-common                                         4.1.136.Final 4.1.137.Final d31926b01adcc07af86f5e27b81b6d6c115df17d366e835d1fc3f5a1924e7e52
      swap io/netty netty-handler                                        4.1.136.Final 4.1.137.Final d0e4c6ee4779f59f6ab2fb5d388e4f57147c82270164b37945764bb9bda96a44
      swap io/netty netty-handler-proxy                                  4.1.136.Final 4.1.137.Final 843de10c4cef34cbc1a5344090f1b57db532fbebf141559862da675f6b656df4
      swap io/netty netty-resolver                                       4.1.136.Final 4.1.137.Final b4cf2aeedd9fc7c8c439bbfe574f63cfe5b83392e88bbc07ca0e8424b7cff955
      swap io/netty netty-resolver-dns                                   4.1.136.Final 4.1.137.Final 898d63ca62ed68ff46543c5344f969424b417f1e8d082fe2bb0181ba10144194
      swap io/netty netty-resolver-dns-classes-macos                     4.1.136.Final 4.1.137.Final 92d0a542954475f563ea58221d864884ba6753c50c1f17985b1045e990bf094c
      swap io/netty netty-resolver-dns-native-macos                      4.1.136.Final 4.1.137.Final 777e1e9f0337e04388e9f9bd9ff5270e607423be72306b381fd380418b06b9ac osx-aarch_64
      swap io/netty netty-resolver-dns-native-macos                      4.1.136.Final 4.1.137.Final bc8a5616ab33f0e640bc6174eea770ccfca8ed0e9891ff3bb3ae638255bc006e osx-x86_64
      swap io/netty netty-transport                                      4.1.136.Final 4.1.137.Final 6251adc2a2921572382732a2db188d4f4f2251fd6ebb49c5d44bbf33d6bfb1a7
      swap io/netty netty-transport-classes-epoll                        4.1.136.Final 4.1.137.Final 55049554b799dc8e53bf234fffa36e001f7b5b65c32994b9bd59fc6356f1c52f
      swap io/netty netty-transport-native-epoll                         4.1.136.Final 4.1.137.Final 185db6053e0e9573d36fa4eb6567b26139afaa4daa7bf5a068e661568304542b linux-x86_64
      swap io/netty netty-transport-native-epoll                         4.1.136.Final 4.1.137.Final 82fb63a2dc90c0bddb81e04065a1c06fb4c5be722ad5d64b46491daf8b6f9a01 linux-aarch_64
      swap io/netty netty-transport-native-unix-common                   4.1.136.Final 4.1.137.Final 8056e7637f9948f953314894cf995ab664711b66c73c4cd5b593ae84f0b1048c
      # at.yawk.lz4:lz4-java 1.10.3 -> 1.11.1 (CVE-2026-59949: the native XXHash
      # implementations can crash the JVM on invalid byte-array ranges). Backs the lz4
      # compression type for producers/consumers. at.yawk.lz4 publishes a SINGLE artifact
      # (verified: the Maven Central group dir holds only lz4-java/), so no sibling module
      # needs to stay aligned; 1.11.1's entry set is a superset of 1.10.3's and ships
      # liblz4-java.so for linux/amd64 + linux/aarch64, so both arches keep their natives.
      swap at/yawk/lz4 lz4-java 1.10.3 1.11.1 e5e31b195fcc7e9c5da4b191af3b0082ee616c13f61cbd79409ffa65e4dd5c47
      # org.apache.thrift:libthrift 0.23.0 -> 0.24.0 (CVE-2026-43871 HIGH: a malformed
      # frame can spin the protocol reader in an infinite loop -> DoS). 0.24.0 is the
      # upstream fix version and is already what this catalog pins for the same CVE on
      # the Go side (apps/cadence). libthrift is a SINGLE artifact -- no sibling module
      # has to move with it -- so this is a standalone swap, not a lockstep set.
      # swap()'s three-case guard covers the drift: if a later dist ships 0.24.0 itself
      # the line reports as dead, and if it ships neither version the build fails instead
      # of dropping a jar beside an unknown one.
      swap org/apache/thrift libthrift 0.23.0 0.24.0 b72e321ff144e3e5211964764bd45794b96fdf250085f153c44416b35df89a07
      # Bouncy Castle 1.84 -> 1.85 (CVE-2026-8763 CRITICAL, Name Constraints bypass via a
      # trailing dot; CVE-2026-13506 HIGH, DoS via lazy ASN.1 sequence parsing). BC ships
      # prov/pkix/util as one build, so all three move together even though only bcprov is
      # flagged. Two SEPARATE copies of BC ship in this dist and BOTH are scanned:
      #   (a) the loose lib/org.bouncycastle-*-1.84.jar trio  -> ordinary swap().
      #   (b) org.apache.pulsar-bouncy-castle-bc-<ver>-pkg.jar, which is NOT shaded: it is
      #       a launcher bundle carrying the three BC jars VERBATIM under lib/. Its
      #       MANIFEST pins them by filename (Dependency-Jars: bcpkix-jdk18on-1.84.jar/...),
      #       so the nested entries are replaced IN PLACE keeping the 1.84 names.
      # BC jars carry no META-INF/maven pom.properties, so Trivy resolves them by the
      # jar's sha1 against Maven Central rather than by filename -- verified locally: the
      # rebuilt bundle reports bcprov/bcpkix/bcutil at 1.85 with zero findings.
      swap org/bouncycastle bcprov-jdk18on 1.84 1.85 20af26bf6060bb8005cc2389916812c1e0e998dc48d2ced7131b89461b54cff7
      swap org/bouncycastle bcpkix-jdk18on 1.84 1.85 c9f82b2d4e99c4bbdfccf684e52cc06ea06a0b567bfd0d08f9c5a3f417055996
      swap org/bouncycastle bcutil-jdk18on 1.84 1.85 590f55ed5d68529239898a4a5c4f730b6e37f45d1cfa3fbe51f8485abe32c42d
      bcpkg="$dest/lib/org.apache.pulsar-bouncy-castle-bc-${{package.version}}-pkg.jar"
      [ -f "$bcpkg" ] || { echo "FATAL: BC bundle missing: $bcpkg -- dist moved, re-audit"; exit 1; }
      bcstage="$(mktemp -d)"
      mkdir -p "$bcstage/lib"
      for m in bcprov bcpkix bcutil; do
        curl -fsSL "$MC/org/bouncycastle/${m}-jdk18on/1.85/${m}-jdk18on-1.85.jar" \
          -o "$bcstage/lib/${m}-jdk18on-1.84.jar"
      done
      ( cd "$bcstage" && printf '%s\n' \
          "20af26bf6060bb8005cc2389916812c1e0e998dc48d2ced7131b89461b54cff7  lib/bcprov-jdk18on-1.84.jar" \
          "c9f82b2d4e99c4bbdfccf684e52cc06ea06a0b567bfd0d08f9c5a3f417055996  lib/bcpkix-jdk18on-1.84.jar" \
          "590f55ed5d68529239898a4a5c4f730b6e37f45d1cfa3fbe51f8485abe32c42d  lib/bcutil-jdk18on-1.84.jar" \
        | sha256sum -c - )
      # `zip <archive> <path>` REPLACES an existing entry at that path and leaves every
      # other entry byte-identical, so the launcher classes and manifest are untouched.
      ( cd "$bcstage" && zip -q "$bcpkg" lib/bcprov-jdk18on-1.84.jar lib/bcpkix-jdk18on-1.84.jar lib/bcutil-jdk18on-1.84.jar )
      rm -rf "$bcstage"
      # Assert the bundle really carries the new content (a zip that silently appended a
      # second entry, or did nothing, would leave the vulnerable classes first on the path).
      for m in bcprov bcpkix bcutil; do
        n="$(unzip -l "$bcpkg" | grep -c "lib/${m}-jdk18on-1.84.jar$")"
        [ "$n" = "1" ] || { echo "FATAL: $m appears $n times in the BC bundle"; exit 1; }
      done
      unzip -p "$bcpkg" lib/bcprov-jdk18on-1.84.jar | sha256sum \
        | grep -q '^20af26bf6060bb8005cc2389916812c1e0e998dc48d2ced7131b89461b54cff7' \
        || { echo "FATAL: nested bcprov is not the 1.85 content"; exit 1; }
      # Drop the shaded functions-runtime uber-jar (unused in --no-functions-worker standalone).
      rm -f "$dest/instances/java-instance.jar"
      chmod -R a+rX "$dest"

      # Bake a config-from-env entrypoint. A read-only rootfs means ALL of standalone's
      # writable state -- the BookKeeper journal+ledgers, the embedded metadata store
      # (RocksDB), logs, the JVM tmpdir, and the (rewritable) conf dir -- must live under
      # writable mounts. The entrypoint relocates every one of them under /pulsar.
      install -d "${{targets.destdir}}/usr/bin"
      cat > "${{targets.destdir}}/usr/bin/docker-entrypoint.sh" <<'EOS'
      #!/bin/bash
      set -euo pipefail

      PULSAR_INSTALL=/opt/pulsar

      # Writable mounts (read-only rootfs). Standalone writes a LOT and all of it
      # otherwise lands under the install tree. Relocate:
      #   - data: BookKeeper journal+ledgers + embedded metadata store (RocksDB)
      #   - logs: pulsar-standalone.log etc.
      #   - conf: seeded from the dist; Pulsar may rewrite config at runtime
      #   - tmp:  java.io.tmpdir
      PULSAR_DATA_DIR="${PULSAR_DATA_DIR:-/pulsar/data}"
      export PULSAR_LOG_DIR="${PULSAR_LOG_DIR:-/pulsar/logs}"
      PULSAR_CONF_DIR="${PULSAR_CONF_DIR:-/pulsar/conf}"
      export TMPDIR="${PULSAR_TMP_DIR:-/pulsar/tmp}"
      mkdir -p "$PULSAR_DATA_DIR" "$PULSAR_LOG_DIR" "$PULSAR_CONF_DIR" "$TMPDIR"

      # Point the JVM's java.io.tmpdir AND RocksDB's native-lib extraction dir at the
      # writable tmp. The embedded metadata store (RocksDB) and the bookie unpack their
      # JNI .so via java.io.tmpdir at startup; without this they hit the read-only /tmp
      # ("Failed to load RocksDB JNI library: Read-only file system").
      export ROCKSDB_SHAREDLIB_DIR="$TMPDIR"
      export PULSAR_EXTRA_OPTS="${PULSAR_EXTRA_OPTS:-} -Djava.io.tmpdir=$TMPDIR"

      # Seed the writable conf dir from the dist's defaults once. bin/pulsar resolves
      # conf relative to PULSAR_HOME; we point it at the writable copy via env so the
      # broker/bookie can rewrite config under a read-only rootfs.
      if [ ! -f "$PULSAR_CONF_DIR/standalone.conf" ]; then
        cp -r "$PULSAR_INSTALL"/conf/. "$PULSAR_CONF_DIR"/
      fi
      # bin/pulsar reads these env vars to locate the conf files (they default under
      # $PULSAR_HOME/conf on the read-only rootfs otherwise).
      export PULSAR_STANDALONE_CONF="${PULSAR_STANDALONE_CONF:-$PULSAR_CONF_DIR/standalone.conf}"
      export PULSAR_LOG_CONF="${PULSAR_LOG_CONF:-$PULSAR_CONF_DIR/log4j2.yaml}"

      export JAVA_HOME="${JAVA_HOME:-/usr/lib/jvm/java-21-openjdk}"

      # Modest heap by default (single-node smoke/dev footprint); override via PULSAR_MEM
      # in the chart. PULSAR_MEM is consumed by conf/pulsar_env.sh.
      export PULSAR_MEM="${PULSAR_MEM:--Xms512m -Xmx512m -XX:MaxDirectMemorySize=512m}"

      # Run standalone from a writable CWD so any stray relative path lands on the
      # writable mount, and pass the data dirs explicitly as absolute paths:
      #   --zookeeper-dir / --bookkeeper-dir / --metadata-dir all default to
      #   data/standalone/* (relative to CWD) -- pin them under the writable mount.
      cd "$PULSAR_DATA_DIR"

      STANDALONE_ARGS=(
        --zookeeper-dir "$PULSAR_DATA_DIR/zookeeper"
        --bookkeeper-dir "$PULSAR_DATA_DIR/bookkeeper"
        --metadata-dir "$PULSAR_DATA_DIR/metadata"
      )

      # Keep single-node lean: the functions worker and BookKeeper stream storage are
      # not needed for basic produce/consume. Disable unless explicitly re-enabled.
      if [ "${PULSAR_FUNCTIONS_WORKER:-0}" != "1" ]; then
        STANDALONE_ARGS+=(--no-functions-worker)
      fi
      if [ "${PULSAR_STREAM_STORAGE:-0}" != "1" ]; then
        STANDALONE_ARGS+=(--no-stream-storage)
      fi
      if [ -n "${PULSAR_ADVERTISED_ADDRESS:-}" ]; then
        STANDALONE_ARGS+=(--advertised-address "$PULSAR_ADVERTISED_ADDRESS")
      fi

      # PULSAR_HOME stays the read-only install; conf is overridden via the env above.
      exec "$PULSAR_INSTALL/bin/pulsar" standalone "${STANDALONE_ARGS[@]}" "$@"
      EOS
      chmod 0755 "${{targets.destdir}}/usr/bin/docker-entrypoint.sh"

test:
  pipeline:
    - runs: |
        test -x /opt/pulsar/bin/pulsar
        test -x /opt/pulsar/bin/pulsar-admin
        test -x /opt/pulsar/bin/pulsar-client
        test -x /usr/bin/docker-entrypoint.sh
        test -f /opt/pulsar/conf/standalone.conf
