# Radicale from the release tag into /opt/radicale/.venv, bcrypt from Wolfi.
package:
  name: quench-radicale
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Radicale CalDAV and CardDAV server, built from source on Wolfi"
  copyright:
    - license: GPL-3.0-or-later
  dependencies:
    runtime:
      - ca-certificates-bundle
      - python-3.13
      - py3.13-bcrypt

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - python-3.13
      - py3.13-bcrypt

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/Kozea/Radicale/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - runs: |
      set -eu
      export PIP_NO_CACHE_DIR=1 PIP_DISABLE_PIP_VERSION_CHECK=1 HOME="$(mktemp -d)"
      V="${{targets.destdir}}/opt/radicale/.venv"
      python3.13 -m venv --system-site-packages "$V"
      "$V/bin/pip" install .
      "$V/bin/pip" check
      SITE="$V/lib/python3.13/site-packages"
      test ! -e "$SITE/bcrypt" || { echo "bcrypt installed into the venv instead of from Wolfi"; exit 1; }
      "$V/bin/python" -c "import bcrypt, radicale; print('radicale', radicale.VERSION)" | grep -F "${{package.version}}"
      # pip vendors its own urllib3 and is not needed at run time
      "$V/bin/python" -m pip uninstall -y -q pip
      # the venv was built at the destdir path: point its scripts and config at the installed path
      sed -i "s|${{targets.destdir}}||g" "$V/pyvenv.cfg" "$V"/bin/*
      ! grep -rq "${{targets.destdir}}" "$V/bin" "$V/pyvenv.cfg"
      find "$V" -name __pycache__ -prune -exec rm -rf {} +
      mkdir -p "${{targets.destdir}}/etc/radicale"
      cat > "${{targets.destdir}}/etc/radicale/config" <<'CONF'
      [server]
      hosts = 0.0.0.0:5232

      [auth]
      type = htpasswd
      htpasswd_filename = /etc/radicale/users
      htpasswd_encryption = bcrypt

      [storage]
      filesystem_folder = /var/lib/radicale/collections
      CONF

test:
  pipeline:
    - runs: /opt/radicale/.venv/bin/python -c "import radicale, bcrypt"
