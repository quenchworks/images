# radicale: Radicale (Kozea/Radicale, GPL-3.0), a small CalDAV and CardDAV server storing calendars,
# task lists and contacts as plain files, with htpasswd users. Images issue #52.
#
# From the release tag into a venv on Wolfi python-3.13 with --system-site-packages, so bcrypt comes
# from Wolfi's py3.13-bcrypt build (not the Rust wheel the scanner cannot see into). Config at
# /etc/radicale/config: port 5232, htpasswd users from /etc/radicale/users (bcrypt), collections under
# /var/lib/radicale (the volume). LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(3.9.2)
declare -A SHA256=(
  [3.9.2]=eb38c5b3805db2736b3b0d20ffb29b33125cde83b572bd537380f4f478f6c375
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
