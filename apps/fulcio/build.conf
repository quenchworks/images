# fulcio: Fulcio, the Sigstore certificate authority (Apache-2.0), which issues
# short-lived code-signing certificates bound to OIDC identities. Built from
# source on Wolfi, static Go. Image and chart.
# Lines 1.8 and 1.7; 1.7.1 also needs mapstructure v2.4.0 and sigstore/sigstore
# v1.10.4 from the float. The 1.6 line is HELD: 1.6.6's generated gRPC server
# no longer satisfies the interface grpc v1.83.2 generates (missing List).
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(1.7.1 1.8.8)
declare -A SHA=(
  [1.7.1]=228c621e83f05595749e1c640aefaa2f07ff919a3064aa98928db497fb3973d8
  [1.8.8]=635e1e0e66f6677da8eb8d81f76facf449fefcc2301d530b68b78604abca74ff
)
render() { echo "s/__VER__/$1/g; s/__SHA256__/${SHA[$1]}/g"; }
