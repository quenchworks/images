# Assembles the Sigstore Fulcio image: static binary, nonroot uid 1001,
# multi-arch, SBOM by apko. Serves HTTP on 8080 and gRPC on 8081; pass --ca
# (fileca, kmsca, tinkca, googleca, or ephemeralca for testing) and mount the
# issuer config at /etc/fulcio-config/config.yaml.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-fulcio@local

accounts:
  groups:
    - groupname: nonroot
      gid: 1001
  users:
    - username: nonroot
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/bin/fulcio serve --host 0.0.0.0 --port 8080 --grpc-port 8081

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-fulcio"
  org.opencontainers.image.licenses: "Apache-2.0"
