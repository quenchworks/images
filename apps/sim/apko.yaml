# Sim runtime: HTTP on 3000 under bun (apps/sim/bootstrap.js loads the Next standalone server). Needs DATABASE_URL
# (PostgreSQL with pgvector, schema from the sim-migrations image), BETTER_AUTH_URL, BETTER_AUTH_SECRET, ENCRYPTION_KEY,
# INTERNAL_API_SECRET (each 32+ chars) and NEXT_PUBLIC_APP_URL; REDIS_URL and SOCKET_SERVER_URL (sim-realtime) are
# optional. Writable: /tmp and the two .next cache dirs (emptyDirs on a read-only root). No TLS listener. Nonroot 1001.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - tzdata
    - quench-sim@local

accounts:
  groups:
    - groupname: sim
      gid: 1001
  users:
    - username: sim
      uid: 1001
      gid: 1001
      homedir: /tmp
  run-as: 1001

environment:
  NODE_ENV: production
  PORT: "3000"
  HOSTNAME: 0.0.0.0
  HOME: /tmp
  TMPDIR: /tmp
  NEXT_TELEMETRY_DISABLED: "1"

paths:
  - path: /app/apps/sim/.next/cache
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o750
  - path: /app/apps/sim/.next/server/route-cache
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o750

work-dir: /app

entrypoint:
  command: /usr/bin/bun apps/sim/bootstrap.js

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-sim"
  org.opencontainers.image.licenses: "Apache-2.0"
  org.opencontainers.image.version: "__VER__"
