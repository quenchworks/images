# sim: Sim (simstudioai/sim, Apache-2.0), a visual builder for AI agent workflows (Flowise replacement). Images issue #115.
#
# The Next.js app from the release tag, built like upstream's docker/app.Dockerfile on Wolfi: turbo prune @sim/app,
# bun install, isolated-vm rebuilt against Wolfi nodejs-24 (shared node, so node-gyp links the -dev libraries), next
# build to standalone, bootstrap bundled with bun. The app runs on bun; node runs the isolated-vm and Oracle workers.
# Upstream's image also ships npm, which carried 19 of its 20 scanner findings; this one has no npm. LATEST-ONLY.
# Siblings from the same tag: sim-realtime (socket server, 3002) and sim-migrations (drizzle, packages/db).
FROM_SOURCE=1
# STATUS 2026-11-25: 0.9.66 HELD (sim only; sim-migrations and sim-realtime 0.9.66 are published). Its x86 next build
#   took the GitHub-hosted runner down with no log four times (runs 45524241857 x2, 45537532539, 45542110106,
#   45550900761) at 6 GB and 5 GB heaps, and with ~30 GB of disk freed before the swapfile; 0.9.63 x86 and 0.9.66
#   arm64 built fine in the same runs. Re-check on the next sim release, or build x86 on a larger runner. The chart
#   stays on 0.9.63 either way: 0.9.66 will not boot without REDIS_URL, and the chart has no Redis yet.
VERSIONS=(0.9.63)
declare -A SHA256=(
  [0.9.63]=253e21ba86597eb1e99d510dd2531149dfdf5ba3b671d626e3f6cbd4daf2baa5
  [0.9.66]=935a81a0fc6b927d9bfaa0e431296cac1bb4a9eccb84c33c8973d25377c69c9c
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
