# mastodon: web (puma) and sidekiq from the release tag, gems built from source on Wolfi
# ruby-4.0 against Wolfi's libvips, libpq, ICU and libidn, and the JS/CSS assets compiled
# at build time. Like upstream's own image there is no Node at runtime: the streaming
# server is a separate image. Latest line only; each sha256 is from a download of the tag
# archive on 2026-09-29.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(4.7.5)
declare -A SHA256=(
  [4.7.5]=77f3eaeb3c7fbe40d24b3053ba6586ffa9c948a2ca205d4bd1b3a3092922f9a5
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
