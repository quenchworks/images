FROM_SOURCE=1
VERSIONS=(4.34 4.35 4.36)
declare -A COMMIT=(
  [4.34]=c6cf5a5bd7c87694c8d71ab41571f1412170ab2a
  [4.35]=eb939761665ca0ecead5026b02663531ea9fbf9e
  [4.36]=d0b90d29eb6c3cfad1f9c0f80d671c72c4ec1d27
)
render() { echo "s/__VER__/$1/g; s/__COMMIT__/${COMMIT[$1]}/g"; }
