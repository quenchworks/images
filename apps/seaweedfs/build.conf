# seaweedfs: from-source via melange (Go build, git-checkout pinned per release;
# tag is the bare version, no 'v'). Newest release only, pinned by git commit.
FROM_SOURCE=1
VERSIONS=(4.37)
declare -A COMMIT=(
  [4.37]=c06a2dca879cdbe742246d812431fbe2de01357b
)
render() { echo "s/__VER__/$1/g; s/__COMMIT__/${COMMIT[$1]}/g"; }
