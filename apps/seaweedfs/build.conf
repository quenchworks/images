# seaweedfs: from-source via melange (Go build, git-checkout pinned per release;
# tag is the bare version, no 'v'). Latest 3 releases, each pinned by git commit.
FROM_SOURCE=1
VERSIONS=(4.35 4.36 4.37)
declare -A COMMIT=(
  [4.35]=eb939761665ca0ecead5026b02663531ea9fbf9e
  [4.36]=d0b90d29eb6c3cfad1f9c0f80d671c72c4ec1d27
  [4.37]=c06a2dca879cdbe742246d812431fbe2de01357b
)
render() { echo "s/__VER__/$1/g; s/__COMMIT__/${COMMIT[$1]}/g"; }
