# Builds SeaweedFS (the single `weed` binary) from source onto Wolfi. Single
# static Go binary, no CGO. Output is a signed APK in Quenchworks' own repo.
# No upstream distro binaries.
#
# SeaweedFS is a distributed file/object store with an S3-compatible API. This
# is QuenchWorks' default object-storage pick (MinIO gutted its community
# edition in 2025). We ship the single-process `weed server -s3` model: one
# binary runs master + volume + filer + the S3 gateway together.
package:
  name: quench-seaweedfs
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened SeaweedFS (S3-compatible object store), built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      # go.mod requires go >= 1.25; pin a concrete recent toolchain (newest gets
      # the latest std-lib security fixes, which matters for the 0-CVE gate).
      - go-1.26

pipeline:
  # git-checkout, not fetch: building from the pinned git tag avoids the
  # codeload.github.com CDN entirely (some upstream CDNs 403 GitHub Actions IPs),
  # and is the robust source for a repo this size.
  - uses: git-checkout
    with:
      repository: https://github.com/seaweedfs/seaweedfs
      tag: ${{package.version}}
      expected-commit: __COMMIT__
  - runs: |
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      export GOTOOLCHAIN=local
      # Comprehensive 0-CVE gate. FLOORS, not exact pins (same idiom as
      # buildkite-agent): an exact `go get mod@vX` below what upstream requires is
      # a DOWNGRADE, and go then downgrades the whole dependent graph. 4.46 needs
      # otel v1.45.0 / grpc v1.85.0-dev, so pinning otel v1.44.0 / grpc v1.83.2
      # dragged github.com/apache/iceberg-go off its required post-v0.6.0
      # pseudo-version back to release v0.6.0, which does not compile
      # (internal/avro_schemas.go: avro.SchemaNode API drift). With the floor
      # idiom, upstream already satisfies every floor, nothing is downgraded, and
      # the floors still catch a future bump that reintroduces a CVE. Re-check
      # floors on every version bump; the 0-CVE gate enforces them.
      #   golang.org/x/image        >= v0.45.0 (CVE-2026-33813 WEBP DoS,
      #                             CVE-2026-46601 VP8-chunk WebP DoS)
      #   google.golang.org/grpc    >= v1.83.2 (GHSA-hrxh-6v49-42gf)
      #   otel + trace/metric/sdk   >= v1.44.0 (coherent grpc-security cascade)
      #   golang.org/x/oauth2       >= v0.36.0
      # thrift: older upstream go.mods Pinned v0.23+ back to v0.22.0 with a
      # `replace` (math.MaxUint32 overflows int on 32-bit GOARCHes). We build
      # ONLY 64-bit (x86_64/aarch64, see apko.yaml) where int is 64-bit; retarget
      # such a replace to the CVE-fixed line. 4.46 already requires v0.24.0
      # natively (no replace), so this is a no-op there -- kept as a guard.
      # NB: no `go mod tidy` -- tidy walks the full module graph (incl. heavy
      # test-only deps like iceberg-go's docker/testcontainers imports) and fails
      # on network resets; with GOFLAGS=-mod=mod the `go build ./weed` below
      # auto-resolves go.sum for only the packages it actually compiles.
      go mod edit -replace github.com/apache/thrift=github.com/apache/thrift@v0.24.0
      FLOOR="golang.org/x/image@v0.45.0 google.golang.org/grpc@v1.85.0-dev.0.20260825072537-93e31b48545e golang.org/x/oauth2@v0.36.0 go.opentelemetry.io/otel@v1.45.0 go.opentelemetry.io/otel/trace@v1.45.0 go.opentelemetry.io/otel/metric@v1.45.0 go.opentelemetry.io/otel/sdk@v1.45.0 golang.org/x/crypto@v0.56.0"
      MODS="$(echo "$FLOOR" | tr ' ' '\n' | cut -d@ -f1)"
      # The numeric triple alone cannot order two pseudo-versions that share it.
      # seaweedfs requires grpc v1.85.0-dev while the floor is
      # v1.85.0-dev.0.20260825072537-93e31b48545e: both split to (1,85,0), so the
      # comparison tied, nothing floated, the binary assertion saw nothing wrong,
      # and the image shipped CVE-2026-84445 (HIGH). So compare the prerelease
      # suffix once the triple ties, the way Go does: a release outranks any
      # prerelease, and otherwise dot-separated identifiers compare left to right
      # with a prefix ranking lower.
      below_floor() {
        awk -v floor="$FLOOR" -v tag="$1" '
          function pre(v,  p) { p = index(v, "-"); return p ? substr(v, p + 1) : "" }
          function precmp(a, b,  na, nb, x, y, i) {
            if (a == b) return 0
            if (a == "") return 1
            if (b == "") return -1
            na = split(a, x, "."); nb = split(b, y, ".")
            for (i = 1; i <= na && i <= nb; i++) {
              if (x[i] == y[i]) continue
              if (x[i] + 0 != 0 && y[i] + 0 != 0) return (x[i] + 0 < y[i] + 0) ? -1 : 1
              return (x[i] < y[i]) ? -1 : 1
            }
            return (na < nb) ? -1 : 1
          }
          BEGIN { n = split(floor, f, " ")
                  for (i = 1; i <= n; i++) { split(f[i], kv, "@"); want[kv[1]] = kv[2] } }
          ($1 in want) {
            split(substr($2, 2), g, "."); split(substr(want[$1], 2), w, ".")
            for (i = 1; i <= 3; i++) {
              if ((g[i] + 0) > (w[i] + 0)) next
              if ((g[i] + 0) < (w[i] + 0)) { print $1 "@" want[$1] " (" tag " has " $2 ")"; next }
            }
            if (precmp(pre($2), pre(want[$1])) < 0) print $1 "@" want[$1] " (" tag " has " $2 ")"
          }'
      }
      # -e is required: plain `go list -m M` FAILS on a module this app does not
      # require and kills the step. -e then prints it with no version, and feeding that
      # to below_floor would read it as below the floor and `go get` it, ADDING a
      # dependency that was never here. Hence the awk guard on a real v-prefixed version.
      go list -m -e $MODS 2>/dev/null || true
      need="$(go list -m -e $MODS 2>/dev/null | awk 'NF >= 2 && $NF ~ /^v[0-9]/ { print $1, $NF }' | below_floor go.mod | awk '{ print $1 }')"
      if [ -n "$need" ]; then go get $need; fi
      # The floor cannot see the difference between upstream's branch requirement
      # `v1.85.0-dev` and the advisory's fix commit: below_floor compares three numeric
      # segments, under which v1.85.0-dev and v1.85.0-dev.0.2026... coerce equal. Pin
      # the fix commit explicitly. Not the bare-pin downgrade trap: upstream tracks the
      # same branch, so MVS keeps whichever is higher.
      go get google.golang.org/grpc@v1.85.0-dev.0.20260825072537-93e31b48545e
      # COMMIT is consumed by `weed version` / Prometheus metrics. The
      # VERSION_NUMBER is compiled in from weed/util/version/constants.go, so we
      # only need to stamp the commit. Build the single `weed` main package.
      LDFLAGS="-s -w -X github.com/seaweedfs/seaweedfs/weed/util/version.COMMIT=${{package.version}}"
      go build -trimpath -ldflags "${LDFLAGS}" \
        -o "${{targets.destdir}}/usr/bin/weed" ./weed
  - runs: |
      # Thin entrypoint. SeaweedFS writes all state under -dir, which fails on a
      # read-only rootfs unless pinned to a writable mount (SEAWEED_DATA_DIR,
      # default /data). The single-process `weed server -s3` starts master,
      # volume, filer, and the S3 gateway together; the S3 API is on :8333.
      #
      # S3 credentials: if SEAWEED_S3_ACCESS_KEY + SEAWEED_S3_SECRET_KEY are set,
      # we write a minimal s3 identities config granting that key Admin and pass
      # -s3.config. If unset, S3 runs open (anonymous) -- the NetworkPolicy is the
      # security boundary, consistent with the catalog posture. Extra flags pass
      # through via "$@".
      install -d "${{targets.destdir}}/usr/local/bin"
      cat > "${{targets.destdir}}/usr/local/bin/docker-entrypoint.sh" <<'SCRIPT'
      #!/bin/sh
      set -eu
      SEAWEED_DATA_DIR="${SEAWEED_DATA_DIR:-/data}"
      SEAWEED_S3_PORT="${SEAWEED_S3_PORT:-8333}"
      mkdir -p "${SEAWEED_DATA_DIR}"

      set -- server \
        -dir="${SEAWEED_DATA_DIR}" \
        -s3 \
        -s3.port="${SEAWEED_S3_PORT}" \
        -ip.bind=0.0.0.0 \
        "$@"

      # Optional hardened S3 auth from env: build an identities config granting
      # the admin key full access. Without it, S3 is open (anonymous).
      if [ -n "${SEAWEED_S3_ACCESS_KEY:-}" ] && [ -n "${SEAWEED_S3_SECRET_KEY:-}" ]; then
        S3_CONFIG="${SEAWEED_DATA_DIR}/.s3-config.json"
        cat > "${S3_CONFIG}" <<JSON
      {
        "identities": [
          {
            "name": "admin",
            "credentials": [
              {
                "accessKey": "${SEAWEED_S3_ACCESS_KEY}",
                "secretKey": "${SEAWEED_S3_SECRET_KEY}"
              }
            ],
            "actions": ["Admin", "Read", "List", "Tagging", "Write"]
          }
        ]
      }
      JSON
        set -- "$@" -s3.config="${S3_CONFIG}"
      fi

      exec /usr/bin/weed "$@"
      SCRIPT
      chmod 0755 "${{targets.destdir}}/usr/local/bin/docker-entrypoint.sh"

test:
  pipeline:
    - runs: |
        weed version
