# rabbitmq: from-source via melange (Erlang/OTP build of the generic-unix release).
# Latest 3 stable minor lines, newest patch each. Each pins its tarball by sha256.
FROM_SOURCE=1
VERSIONS=(4.1.8 4.2.8 4.3.2)
declare -A SHA256=(
  [4.1.8]=006c94d681a8594407bacd580058f9975cab612ef5cb394035f4ee4217f985bf
  [4.2.8]=f1be144173382112b0ec815bf40425b3c651262cf01c797d95c9ee2cedafe067
  [4.3.2]=fb34422ca742f4b83da0d9f61268dfd187afa3f7acccd80fb6edd9b0d501771c
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
