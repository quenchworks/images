# Assembles the rabbitmq runtime image. Minimal, nonroot, multi-arch, SBOM by apko.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - erlang-27
    - bash
    - busybox
    - quench-rabbitmq@local

accounts:
  groups:
    - groupname: rabbitmq
      gid: 1001
  users:
    - username: rabbitmq
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/bin/rabbitmq-server

environment:
  # the BEAM/Elixir CLI warns and may mishandle unicode (vhost, queue names) under
  # the default latin1 locale; pin a UTF-8 locale (C.utf8 ships in Wolfi's glibc).
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  HOME: /var/lib/rabbitmq
  RABBITMQ_MNESIA_BASE: /var/lib/rabbitmq/mnesia
  RABBITMQ_LOG_BASE: /var/log/rabbitmq
  RABBITMQ_LOGS: "-"        # log to stdout, container-friendly

work-dir: /var/lib/rabbitmq

paths:
  - path: /var/lib/rabbitmq
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o700
  - path: /var/log/rabbitmq
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o755

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-rabbitmq"
  org.opencontainers.image.licenses: "MPL-2.0"
