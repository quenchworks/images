# gonic: gonic (sentriz/gonic), a lightweight music streaming server with a Subsonic API, podcasts,
# playlists and transcoding. GPL-3.0. Images issue #44.
#
# Pure Go (CGO off: WASM SQLite and taglib), as upstream's Dockerfile builds it; the version comes from
# the embedded version.txt. The image adds Wolfi's ffmpeg for transcoding; mpv (jukebox mode) is left out.
FROM_SOURCE=1
VERSIONS=(0.23.0)
declare -A SHA256=(
  [0.23.0]=816fd7bc7b0a64ebb4ad76a47fd4715d3103e8f870b81cdb82b6fd4a8692ca51
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
