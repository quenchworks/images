# Hyperledger Fabric orderer: from source via melange (Go, cmd/orderer).
# Image only, no chart. Lines: the 2.5 LTS and 3.1. Both go.mod files read `go 1.26.4`
# (no toolchain line), so both build on Wolfi go-1.26. CGO off: cgo is only needed for the
# pkcs11 build tag, which upstream's release images do not set either. Version and commit are
# stamped like upstream's Makefile (-X github.com/hyperledger/fabric/common/metadata.*).
# The peer is apps/fabric-peer (same tarball, same floors).
FROM_SOURCE=1
VERSIONS=(2.5.16 3.1.5)
declare -A SHA256=(
  [2.5.16]=675012d5519823dbf9c95c1e56c8e9834560824f81ade95ee3ac093f85d130c0
  [3.1.5]=318c1fde6aa6726b225e0a154732f8915bafe673e723e91e20e70d2cf690a630
)
# short commit of each tag, what upstream's Makefile stamps as CommitSHA
declare -A COMMIT=(
  [2.5.16]=f871cf9
  [3.1.5]=86c1172
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g; s|__COMMIT__|${COMMIT[$1]}|g"; }
