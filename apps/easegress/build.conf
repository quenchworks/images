# easegress: from-source via melange (Go build of cmd/server and cmd/client from the
# git tag tarball). Latest patch of the last 3 minor lines (2.9, 2.10, 2.11). Each
# release pins its source tarball by sha256. Static Go binaries, no CGO (the wasmhost
# tag, the only cgo path, is not built). Version stamped via -X on pkg/version.RELEASE.
FROM_SOURCE=1
VERSIONS=(2.9.4 2.10.1 2.11.0)
declare -A SHA256=(
  [2.9.4]=a36a099e8646c9f719af2b2805d41f499055deea2f72280537e77d76d7dc4f83
  [2.10.1]=e33adf1d92368b25945831af81d7a8841cd799282c873f0d2579f498f741eda2
  [2.11.0]=0d7de45ba3a4cf2b4ea09160a0b900abc1662183f4370bb49dc7c1c751fb6030
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
