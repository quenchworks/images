# Assembles the Easegress runtime image. Minimal, nonroot, multi-arch, SBOM by apko.
# The default command runs easegress-server with its admin API on :2381 on all
# interfaces and its home (embedded etcd data, WAL, pid file) under /data/easegress.
# Traffic ports come from the HTTPServer objects you create; egctl ships alongside.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - tzdata
    - quench-easegress@local

accounts:
  groups:
    - groupname: easegress
      gid: 1001
  users:
    - username: easegress
      uid: 1001
      gid: 1001
      homedir: /data/easegress
  run-as: 1001

paths:
  - path: /data/easegress
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o755

work-dir: /data/easegress

entrypoint:
  command: /usr/bin/easegress-server
cmd: --api-addr=0.0.0.0:2381 --home-dir=/data/easegress

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-easegress"
  org.opencontainers.image.licenses: "Apache-2.0"
