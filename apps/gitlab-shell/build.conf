# gitlab-shell: GitLab Shell (gitlab-org/gitlab-shell), the SSH side of GitLab: gitlab-sshd (an SSH
# server in Go, no OpenSSH) plus the gitlab-shell command and its authorized-keys checks. MIT.
# Part of the GitLab CE build (images issue #20). The version follows GITLAB_SHELL_VERSION in the
# GitLab release it serves (19.5.x pins 14.58.0; master, the 19.6 target, pins 14.61.0).
#
# Measured 2026-11-15: the 14.58.0 go.mod has 22 fixable findings; with the floors in melange.yaml
# all five binaries scan at 0 (prometheus/prometheus v0.54 is in go.mod but not linked). 14.61.0 gated
# 2026-11-15: rc=0, 0 fixable, boot test green.
FROM_SOURCE=1
VERSIONS=(14.61.0)
declare -A SHA256=(
  [14.61.0]=361146e05e51c0102dd778ee1a9aa4833e75a8e6468c1d684c327b2260715a76
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
