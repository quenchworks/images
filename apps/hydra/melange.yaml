# Builds Ory Hydra from source onto Wolfi. Single static Go binary, no CGO
# (matches upstream goreleaser's "static-nosqlite" build: CGO_ENABLED=0 with
# -tags=json1, no sqlite/hsm -- production Hydra talks to postgres/mysql/
# cockroach over a DSN, so the cgo-only sqlite driver is not needed). The
# version is stamped via -X github.com/ory/hydra/v2/driver/config.Version
# (goreleaser stamps the full "v"-prefixed tag, so we do too) instead of the
# default "master". go.mod requires go 1.26, so we pin go-1.26 with
# GOTOOLCHAIN=local to forbid a network toolchain fetch. main.go lives at the
# repo root, so a plain `go build .` yields the full server (serve/migrate/...).
# Output is a signed APK in Quenchworks' own repo. No upstream distro binaries.
# Image-only (no chart). Upstream tags carry a "v" prefix; package.version is bare.
package:
  name: quench-hydra
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Ory Hydra (OAuth2 / OpenID Connect server), built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-1.26

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/ory/hydra/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      set -eu
      export CGO_ENABLED=0
      export GOTOOLCHAIN=local
      export GOFLAGS=-mod=mod

      # ---- drop the ory/x docker test helper from the SERVER binary ---------
      # github.com/docker/docker is stuck at v28.x (proxy.golang.org returns
      # v28.5.2+incompatible as @latest for both docker/docker and moby/moby; the
      # v29 line ships only as the split moby/moby/{api,client} modules), so
      # CVE-2026-33997 has no obtainable fix on that module path. It reached the
      # hydra binary through exactly ONE file:
      #
      #   github.com/ory/hydra/v2  ->  github.com/ory/x/dbal  ->
      #   github.com/ory/x/sqlcon/dockertest  ->  github.com/docker/docker/...
      #
      # oryx/dbal/testhelpers.go is a non-_test.go file (so it compiles into the
      # regular `dbal` package and links into the server) whose only content is
      # RestoreFromSchemaDump(t testing.TB, ...) -- a helper for Ory's own
      # integration tests, called from _test.go files only. `dbal` itself is
      # production code, which is why the whole docker client tree was dragged in.
      # ory/x is vendored IN THIS TARBALL via `replace github.com/ory/x => ./oryx`,
      # so deleting the file is a local edit, not a fork of an external module, and
      # it removes every docker/*, moby/* and ory/dockertest package from the
      # binary's dependency set. We do not build or run Ory's test suite here.
      # -f, because the file does not exist yet in the 25.4.0 line: the assertion at
      # the end of this block, not the rm, is what guarantees the shipped binary
      # links no docker.
      rm -f oryx/dbal/testhelpers.go

      # ---- 0-CVE module float (docs/go-module-float.md) --------------------
      # Hydra 26.2.0 ships below the current floors on all of these:
      #   golang.org/x/net      CVE-2026-25681
      #   golang.org/x/text     CVE-2026-56852
      #   golang.org/x/mod      CVE-2026-56864 (floor v0.40.0, NOT the v0.37.0
      #                         Trivy names -- see docs/go-module-float.md)
      #   golang.org/x/crypto   CVE-2026-39828
      #   google.golang.org/grpc GHSA-hrxh-6v49-42gf
      #   go.opentelemetry.io/otel{,/sdk} CVE-2026-29181 / CVE-2026-39883, and
      #     the otlptrace exporters CVE-2026-39882 (separate modules, separate
      #     versions -- the umbrella float does not move them)
      #   github.com/go-jose/go-jose/v3 CVE-2026-34986
      #   github.com/jackc/pgx/v5 CVE-2026-33815/33816 (CRITICAL) + 41889
      # 2026-08-30: the 25.4.0 line (this file is shared by both VERSIONS entries
      # via build.conf's render()) additionally ships below floor on:
      #   filippo.io/edwards25519 CVE-2026-26958 (v1.1.0, floor v1.1.1)
      #   github.com/cloudflare/circl CVE-2026-1229 (v1.6.1, floor v1.6.3)
      # 26.2.0 already resolves both above these floors natively (v1.2.0 / v1.6.3),
      # so adding them here is a no-op for that line and a real fix for 25.4.0.
      # FLOOR is a FLOOR, not a pin. A bare `go get mod@vX` fails silently in two
      # directions: it is a NO-OP when an upstream `replace` overrides it, and it
      # becomes a DOWNGRADE once upstream requires more than vX -- re-introducing
      # the CVE it was added to clear. Float only what is below the floor, then
      # assert the SHIPPED BINARY carries nothing below it.
      FLOOR="golang.org/x/net@v0.58.0 golang.org/x/text@v0.41.0 golang.org/x/mod@v0.40.0 golang.org/x/crypto@v0.56.0 golang.org/x/sys@v0.47.0 google.golang.org/grpc@v1.83.2 go.opentelemetry.io/otel@v1.45.0 go.opentelemetry.io/otel/sdk@v1.45.0 go.opentelemetry.io/otel/trace@v1.45.0 go.opentelemetry.io/otel/metric@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.45.0 github.com/go-jose/go-jose/v3@v3.0.5 github.com/go-jose/go-jose/v4@v4.1.4 github.com/jackc/pgx/v5@v5.9.2 filippo.io/edwards25519@v1.1.1 github.com/cloudflare/circl@v1.6.3 go.opentelemetry.io/otel/exporters/zipkin@v1.45.0"
      MODS="$(echo "$FLOOR" | tr ' ' '\n' | cut -d@ -f1)"
      # prints "<mod>@<floor> (<tag> has <ver>)" for every module below its floor
      below_floor() {
        awk -v floor="$FLOOR" -v tag="$1" '
          BEGIN { n = split(floor, f, " ")
                  for (i = 1; i <= n; i++) { split(f[i], kv, "@"); want[kv[1]] = kv[2] } }
          ($1 in want) {
            split(substr($2, 2), g, "."); split(substr(want[$1], 2), w, ".")
            for (i = 1; i <= 3; i++) {
              if ((g[i] + 0) > (w[i] + 0)) next
              if ((g[i] + 0) < (w[i] + 0)) { print $1 "@" want[$1] " (" tag " has " $2 ")"; next }
            }
          }'
      }
      # `go list -m` prints "<mod> <ver>" or "<mod> <ver> => <mod> <ver>", so $NF is
      # the EFFECTIVE version and a replace cannot hide behind the require line.
      go list -m -e $MODS
      need="$(go list -m -e $MODS | awk 'NF >= 2 && $NF ~ /^v[0-9]/ { print $1, $NF }' | below_floor go.mod | awk '{ print $1 }')"
      if [ -n "$need" ]; then go get $need; fi
      go mod tidy

      go build -trimpath -tags json1 \
        -ldflags "-s -w -X github.com/ory/hydra/v2/driver/config.Version=v${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/hydra" .

      # The float is only real if it reached the BINARY. Every `dep`/`=>` line of
      # `go version -m` must be at or above its floor -- the `=>` line is what
      # catches a replace-shadowed float. Fail the build rather than ship it.
      bad="$(go version -m "${{targets.destdir}}/usr/bin/hydra" \
        | awk '$1 == "dep" || $1 == "=>" { print $2, $3 }' | below_floor hydra)"
      [ -z "$bad" ] || { echo "0-CVE float did not reach the binary:"; echo "$bad"; exit 1; }

      # And the docker excision is only real if the binary links none of it. If a
      # future ory/x pulls the docker client back into production code, fail here
      # rather than ship a v28 module that has no fixed version to float to.
      dockerdeps="$(go version -m "${{targets.destdir}}/usr/bin/hydra" \
        | awk '$1 == "dep" || $1 == "=>" { print $2 }' \
        | grep -E '^github.com/(docker/|moby/|ory/dockertest)' || true)"
      [ -z "$dockerdeps" ] || { echo "docker client tree is linked into the binary:"; echo "$dockerdeps"; exit 1; }
