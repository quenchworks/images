# hydra (Ory): from-source via melange (Go build from the git tag tarball).
# Image-only (OAuth2 / OpenID Connect server, no chart here). Ory unified their
# versioning across products, so the last two release lines are v25.4.0 and
# v26.2.0 (there are no v25.x<4 or v26.x<2 patch tags). Each release pins its
# source tarball by sha256. Single static Go binary, CGO off (upstream
# goreleaser "static-nosqlite" build: -tags=json1, CGO_ENABLED=0). Version is
# stamped via -X on driver/config.Version (with the upstream "v" prefix). The
# datastore is a runtime DSN (postgres/mysql/cockroach) -- no DB is baked in.
FROM_SOURCE=1
VERSIONS=(25.4.0 26.2.0)
declare -A SHA256=(
  [25.4.0]=4a64847968d61ef785e7e6842d216ce3f68a1fc5ba69707c914c63990cd0da54
  [26.2.0]=85aa8265eb6149d8bb70dd70867e27886e0d6d4d49fa9587b2bb53b3bb4a5607
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }

# STATUS 2026-08-27 -- NOT BLOCKED. The roadmap flag was stale.
# The recorded reason claimed hydra was held by a transitive
# github.com/docker/docker v28.x (CVE-2026-34040 HIGH) "via ory/x's vendored
# dockertest helper ... can't be bumped without forking". Re-tested at 26.2.0
# today, both arches. What the gate actually reported was 33 findings, and the
# docker one was CVE-2026-33997 (MEDIUM, fixed 29.3.1) -- not 34040 -- next to a
# CRITICAL pgx pair and eight ordinary Go module floors this recipe had never
# floated (the app was never rebuilt, so it never got the coherent float set).
# Fixed, no fork:
#   * docker/docker: `go mod why -m` gave the chain
#       hydra -> github.com/ory/x/dbal -> github.com/ory/x/sqlcon/dockertest
#         -> github.com/docker/docker/api/types/container
#     ory/x is vendored IN the tarball (`replace github.com/ory/x => ./oryx`), and
#     the only thing dragging docker in was oryx/dbal/testhelpers.go -- a
#     non-_test.go file holding one test helper, RestoreFromSchemaDump(t testing.TB).
#     Deleting that one file removes every docker/*, moby/* and ory/dockertest
#     package from the binary. No module bump, no fork, no v29 needed. The recipe
#     asserts on the built binary that none of them came back.
#   * everything else: the canonical coherent float set (x/net, x/text, x/mod
#     v0.40.0, x/crypto, x/sys, grpc 1.82.1, the four otel modules + the two
#     otlptrace exporter modules at 1.43.0) plus go-jose v3 3.0.5 / v4 4.1.4 and
#     pgx v5 5.9.2, asserted against `go version -m` on the binary.
# Gate: "✅ 0 fixable CVEs (x86_64)" and "✅ 0 fixable CVEs (aarch64)".
# Boot test: test.sh passed on the x86_64 image (Version: v26.2.0, nonroot 1001).
BLOCKED=0

