# selenium-server: Selenium Grid 4 (hub, router, distributor, session queue, event bus,
# sessions map, node, standalone) from the upstream release jar on a Wolfi openjdk-21-jre.
# The role comes from the first argument (default `hub`). Browser nodes are separate
# images: selenium-node-firefox (this jar + firefox + geckodriver).
#
# 0-CVE: the shaded jar holds 39 Java packages; `trivy rootfs --detection-priority
# comprehensive` measured 0 fixable on 4.51.0 and 4.50.0 (2026-10-19). The jar also
# embeds selenium-manager (Rust) for four platforms; trivy does not look inside the jar
# for it, so its own selenium-manager.cdx.json was extracted and scanned: 0 fixable.
# Main classes are major 55 (Java 11); JRE 21 is the LTS line Selenium tests on.
#
# Chromium node: NOT built. Wolfi chromium tops out at 149.0.7827.53 (CVE-2026-13032
# CRITICAL, the same wall that holds gotenberg); add selenium-node-chromium once
# chromium >= 149.0.7827.200 is in the Wolfi index.
BLOCKED=0
FROM_SOURCE=0
VERSIONS=(4.50.0 4.51.0)
# sha256 of selenium-server-<v>.jar, from a download (2026-10-19)
declare -A SHA256=(
  [4.50.0]=4664ef41d4bf5ee78cd6264ff8dca480ef80628ca91df95ca554c4d66f7831c1
  [4.51.0]=f4ddbb992fd99c4152934b832c5fe5502a5ca207a1d1cb96af8e5068955c5037
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
