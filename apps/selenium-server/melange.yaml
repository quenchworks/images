# Packages the Selenium Grid server jar (the upstream release asset) for a Wolfi JRE.
package:
  name: quench-selenium-server
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Selenium Grid server on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - openjdk-21-jre       # main classes are major 55 (Java 11); 21 is the tested LTS
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/SeleniumHQ/selenium/releases/download/selenium-${{package.version}}/selenium-server-${{package.version}}.jar
      expected-sha256: __SHA256__
      extract: false
  # The jar carries a short sh launcher before the zip data; `java -jar` reads it as is.
  - runs: |
      set -eu
      install -Dm644 selenium-server-${{package.version}}.jar "${{targets.destdir}}/usr/share/selenium/selenium-server.jar"

test:
  pipeline:
    - runs: test -s /usr/share/selenium/selenium-server.jar
