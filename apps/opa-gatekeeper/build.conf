# opa-gatekeeper: OPA Gatekeeper, the Kubernetes admission controller for policies written
# in Rego (ConstraintTemplates and Constraints: validating and mutating webhooks, audit of
# existing resources, external data), built from source (the manager at the repo root).
# Static Go binary, no CGO.
#
# 0-CVE: melange.yaml floats the modules below their floor (measured 2026-09-25: the otel
# train, grpc and the golang.org/x set on all three lines; cel-go 0.26 on 3.21 and 3.22).
# A local build of each line with the float scanned 0.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(3.21.1 3.22.2 3.23.1)
declare -A SHA256=(
  [3.21.1]=055af5c3130f5bc4602a0ef62587ed9eed85c4bfb7236bdb2c3333bdf30696c4
  [3.22.2]=119931023a77c49328fcbe87f32e429ee37152fdeefe7bbd2c11b87c472004b4
  [3.23.1]=8d49585365c26e809754850b4119b0f97eaba608071b1c99bc3e68b41038272e
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
