# OPA Gatekeeper runtime image. Minimal, nonroot, multi-arch, SBOM by apko.
# One binary for the webhook and audit pods (--operation); the webhook serves TLS on 8443
# from /certs, health on :9090, metrics on :8888.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-opa-gatekeeper@local

accounts:
  groups:
    - groupname: nonroot
      gid: 1001
  users:
    - username: nonroot
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/bin/gatekeeper-manager

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-opa-gatekeeper"
  org.opencontainers.image.licenses: "Apache-2.0"
