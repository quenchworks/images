# Builds the OPA Gatekeeper manager from the release tag tarball onto Wolfi. The version
# is stamped with -X like upstream's Makefile. go.mod decides the modules: the vendor/
# directory some tags carry is out of sync with it, so the build uses -mod=mod.
package:
  name: quench-opa-gatekeeper
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened OPA Gatekeeper, built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - go

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/open-policy-agent/gatekeeper/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      set -eu
      export CGO_ENABLED=0 GOFLAGS=-mod=mod GO111MODULE=on GOTOOLCHAIN=local
      # ---- 0-CVE module float (docs/go-module-float.md) ----------------------
      # FLOOR is a FLOOR, not a pin: only modules below it are floated, and the shipped
      # binary is asserted to carry nothing below it. One coherent set for the three
      # lines: the otel family moves as one train (contrib at 0.70.0), the golang.org/x
      # set together; cel-go 0.29 builds against the Kubernetes CEL code on all three.
      FLOOR="go.opentelemetry.io/otel@v1.45.0 go.opentelemetry.io/otel/trace@v1.45.0 go.opentelemetry.io/otel/metric@v1.45.0 go.opentelemetry.io/otel/sdk@v1.45.0 go.opentelemetry.io/otel/sdk/metric@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlpmetric/otlpmetrichttp@v1.45.0 go.opentelemetry.io/contrib/instrumentation/google.golang.org/grpc/otelgrpc@v0.70.0 go.opentelemetry.io/contrib/instrumentation/net/http/otelhttp@v0.70.0 google.golang.org/grpc@v1.83.2 golang.org/x/crypto@v0.56.0 golang.org/x/net@v0.58.0 golang.org/x/text@v0.41.0 golang.org/x/sys@v0.47.0 github.com/google/cel-go@v0.29.0"
      MODS="$(echo "$FLOOR" | tr ' ' '\n' | cut -d@ -f1)"
      below_floor() {
        awk -v floor="$FLOOR" -v tag="$1" '
          BEGIN { n = split(floor, f, " ")
                  for (i = 1; i <= n; i++) { split(f[i], kv, "@"); want[kv[1]] = kv[2] } }
          ($1 in want) {
            split(substr($2, 2), g, "."); split(substr(want[$1], 2), w, ".")
            for (i = 1; i <= 3; i++) {
              if ((g[i] + 0) > (w[i] + 0)) next
              if ((g[i] + 0) < (w[i] + 0)) { print $1 "@" want[$1] " (" tag " has " $2 ")"; next }
            }
          }'
      }
      go list -m -e $MODS
      need="$(go list -m -e $MODS | awk 'NF >= 2 && $NF ~ /^v[0-9]/ { print $1, $NF }' | below_floor go.mod | awk '{ print $1 }')"
      if [ -n "$need" ]; then go get $need; fi
      go mod tidy
      go build -trimpath -ldflags "-s -w -X github.com/open-policy-agent/gatekeeper/v3/pkg/version.Version=v${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/gatekeeper-manager" .
      bad="$(go version -m "${{targets.destdir}}/usr/bin/gatekeeper-manager" \
        | awk '$1 == "dep" || $1 == "=>" { print $2, $3 }' | below_floor gatekeeper-manager)"
      [ -z "$bad" ] || { echo "❌ 0-CVE float did not reach gatekeeper-manager:"; echo "$bad"; exit 1; }

test:
  pipeline:
    - runs: |
        test -x /usr/bin/gatekeeper-manager
