# spilo: Spilo (zalando/spilo, Apache-2.0), the PostgreSQL + Patroni + WAL-G image the Zalando Postgres Operator runs.
# Images issue #114. Spilo publishes no releases (images come from master), so the scripts are pinned to one commit
# and the image version is the PostgreSQL release it carries.
#
# Built on Wolfi: postgresql-18 + contrib, patroni, wal-g, pgbouncer, pgqd, runit, dumb-init and cronie from Wolfi;
# bg_mon and pgextwlist (preloaded by configure_spilo.py, not in Wolfi) compiled from source with PGXS; Spilo's
# scripts, runit services and launch.sh from the pinned commit. Upstream's PGOLDVERSIONS (14 to 17, kept for in-place
# major upgrades) are left out of this first cut, as are timescaledb (no Wolfi package for 18; dropped from Spilo's
# preload table) and the ubuntu 18.04 locale archive. LATEST-ONLY.
FROM_SOURCE=1
VERSIONS=(18.7)
SPILO_COMMIT=550c5d8c183340ccd98b19098f53f1261b71539a
SPILO_SHA256=abb50272feaea0a08d30d72d5a122034e73e7bf9eaa16bb7bb570cd8a0c1daeb
BG_MON_COMMIT=a73c6bcd10dfdf9feaf5eabab7eb6b12d167680d
BG_MON_SHA256=cd54e1ddccf8e82c267b7f9fa642383c30c7106849b164603e14bf5cfc5d7a7f
EXTWLIST=1.20
EXTWLIST_SHA256=dcd41af849283874d5415645a8076c3d841980e84f7568d0e88c6f3ff8e68cd7
# Wolfi pgbouncer is stuck at 1.24.1 (CVE-2026-6665 and four more, fixed in 1.25.2): built from source, as apps/pgbouncer
# plpython3u (Spilo's zmon schema creates it; Wolfi ships no PostgreSQL 18 plpython): built from the same PostgreSQL release
PG_SRC_SHA256=441dfae4280cae3e0425e5f876f80559fb0731c140f1aae22b3e5a54d0411bfd
PGBOUNCER=1.26.1
PGBOUNCER_SHA256=00886a2994b4844cd37110970df777772cfc42a74c400522c82fba509a3f42d9
render() {
  echo "s/__VER__/$1/g; s/__SPILO_COMMIT__/$SPILO_COMMIT/g; s/__SPILO_SHA256__/$SPILO_SHA256/g; s/__BG_MON_COMMIT__/$BG_MON_COMMIT/g; s/__BG_MON_SHA256__/$BG_MON_SHA256/g; s/__EXTWLIST__/$EXTWLIST/g; s/__EXTWLIST_SHA256__/$EXTWLIST_SHA256/g; s/__PGBOUNCER__/$PGBOUNCER/g; s/__PGBOUNCER_SHA256__/$PGBOUNCER_SHA256/g; s/__PG_SRC_SHA256__/$PG_SRC_SHA256/g"
}
