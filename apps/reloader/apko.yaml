# Assembles the Reloader image: one static binary, nonroot, metrics and probes on :9090.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-reloader@local

accounts:
  groups:
    - groupname: reloader
      gid: 1001
  users:
    - username: reloader
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/bin/reloader

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-reloader"
  org.opencontainers.image.licenses: "Apache-2.0"
