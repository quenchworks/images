# reloader (stakater/Reloader): rolls Deployments, StatefulSets and DaemonSets when a
# ConfigMap or Secret they use changes. From source via melange, CGO off, version stamped
# on pkg/common.Version as upstream's Dockerfile does. Upstream maintains the 1.4 line only
# (1.3.0 and 1.2.1 are single old releases), so the latest line ships alone. The sha256 is
# from a download of the tag archive on 2026-09-30.
FROM_SOURCE=1
VERSIONS=(1.4.22)
declare -A SHA256=(
  [1.4.22]=9d989d0812bc95b6bb71015d629313d0511cbf3f25876142c73eb9ce3cbc245a
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
