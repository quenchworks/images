# squid: Squid caching forward proxy, assembled from Wolfi's pinned `squid` apk
# (FROM_SOURCE=0, the varnish pattern). melange builds only quench-squid-config,
# which carries a bootable /etc/squid/quench.conf.
#
# WINDOW: latest only. Squid supports one release line at a time (7.x); Wolfi
# still lists 7.5 and 7.4, but those are superseded patches of the same line.
BLOCKED=0
FROM_SOURCE=0
VERSIONS=(7.6)
declare -A PIN=( [7.6]=7.6-r0 )
render() { local v=$1; echo "s/__VER__/$v/g; s|__PKG__|squid=${PIN[$v]}|g"; }
