# Dozzle (amir20/dozzle, MIT): real-time log viewer for containers, reading the Docker socket or,
# in Kubernetes mode, pod logs through the API. From source via melange: bun builds the Vue UI
# into dist/ (embedded), go builds the server CGO-free. Bun never reaches the runtime image.
# LATEST-ONLY: per-release frontend toolchains.
FROM_SOURCE=1
VERSIONS=(11.4.3 11.5.0)
declare -A SHA256=(
  [11.4.3]=b581af07672b2f00ea671fd890b3c421b6f6e6af86c67895319c8d0676612f3d
  [11.5.0]=ac1a0d9a47ae642c159e8da1b269694d878d105c6a5db2de51ad65c3191726f1
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
