# Cube server: node runs @cubejs-backend/server's bin from /cube/conf, the directory upstream's
# image uses for cube.js and the model/ files (mount them there). API on 4000; /livez and /readyz.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-cube@local

accounts:
  groups:
    - groupname: nonroot
      gid: 1001
  users:
    - username: nonroot
      uid: 1001
      gid: 1001
      homedir: /cube/conf
  run-as: 1001

paths:
  - path: /cube/conf
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o755

environment:
  NODE_ENV: production
  NODE_PATH: /cube/conf/node_modules:/usr/lib/cube/node_modules
  HOME: /cube/conf
  LANG: C.UTF-8

work-dir: /cube/conf
entrypoint:
  command: /usr/bin/node
cmd: /usr/lib/cube/node_modules/@cubejs-backend/server/bin/server

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-cube"
  org.opencontainers.image.licenses: "Apache-2.0"
  org.opencontainers.image.version: "__VER__"
