# cube: Cube (cube-js/cube, Apache-2.0 core), the semantic layer and REST/GraphQL/SQL API,
# from the @cubejs-backend/server npm packages on Wolfi nodejs. No recipe yet: held below.
#
# STATUS: BLOCKED 2026-10-20 on the crates inside @cubejs-backend/native, which the server
# cannot run without (server, server-core and api-gateway all depend on it; the post-installer
# "fallback" variant only drops the python feature, the Rust addon is still required).
# The prebuilt index.node has no cargo-auditable .dep-v0 section, so the gate is blind to it
# (memory scan-blind-spots). Built from source with cargo auditable, the gate would see
# (v1.8.8 tag, packages/cubejs-backend-native/Cargo.lock, cargo tree -e normal --locked -i,
# default features, no python):
#   flatbuffers 2.1.2   GHSA-3jch-9qgp-4844 CRITICAL, fixed 22.9.29
#                       <- arrow 13.0.0 (git cube-js/arrow-rs d484adc1, pins "=2.1.2", ipc on by default)
#   thrift 0.13.0       CVE-2026-43868, fixed only in 0.23.0 (same wall as apps/quickwit)
#                       <- parquet 13.0.0 (same fork) <- datafusion 7.0.0 (git cube-js/arrow-datafusion 76a4c916)
#   lexical-core 0.8.5  GHSA-2326-pfpj-vx3h LOW, fixed 1.0.0
#                       <- arrow 13.0.0; reachable: compute/kernels/cast.rs parses with it (SQL CAST)
#   rustls 0.23.35 -> 0.23.45 and tokio 1.35.0 -> 1.38.2+ are plain cargo update floors.
# The first three sit in Cube's 2022 arrow/datafusion forks at pinned git revs: closing them
# means regenerating arrow 13's IPC code for flatbuffers 22+, porting it to lexical-core 1.0,
# and moving or cfg-removing parquet's thrift 0.13 (datafusion core takes parquet
# non-optionally even though cubesql never plans a ParquetExec). Not a recipe-level fix, so
# no VEX: lexical-core is in the execute path and the other two need fork surgery to prove.
# cubestore (prebuilt Rust binary, same blindness) would be dropped, not shipped: Cube runs
# with no local cubestore (external CUBEJS_CUBESTORE_HOST or no pre-aggregations).
# npm side, measured on cubejs/cube:v1.8.8 2026-10-19: node-pkg 60, jar 21 (JDBC driver set,
# to be dropped: ship only the postgres/mysql/clickhouse drivers), python-pkg 3.
# Master (2026-10-20) still has the same forks and Cargo.lock versions.
# UNBLOCK when a Cube release moves cubesql off the arrow 13 / datafusion 7 forks (or bumps
# flatbuffers, lexical-core and thrift in them): check
#   grep -A1 -E 'name = "(flatbuffers|thrift|lexical-core)"$' packages/cubejs-backend-native/Cargo.lock
# at the new tag, then write the recipe (native addon from source with cargo auditable,
# readelf -S index.node | grep dep-v0), npm overrides per major line, and the chart.
BLOCKED=1
BLOCKED_BY=native-crates
FROM_SOURCE=1
VERSIONS=(1.8.8)
