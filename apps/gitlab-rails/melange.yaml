# GitLab CE Rails from the gitlab-foss release tag: production gems with every native extension compiled from source
# against Wolfi's libraries, frontend assets compiled without a database, installed under /srv/gitlab.
package:
  name: quench-gitlab-rails
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened GitLab CE Rails (Puma, Sidekiq, toolbox), built from source on Wolfi"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata
      - busybox
      - bash
      - ruby-3.4                # satisfied by quench-ruby@local in the image (bundler included)
      - git
      - graphicsmagick
      - exiftool
      - libpq-18
      - postgresql-18-client
      - posix-libc-utils        # getconf: prometheus-client-mmap reads the page size at every Rails boot
  resources:
    cpu: "4"
    memory: 14Gi

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - bash
      - ca-certificates-bundle
      - build-base
      - git
      - curl
      - pkgconf
      - cmake
      - clang-19
      - llvm-19
      - rust-1.100
      - ruby-3.4
      - ruby3.4-bundler
      - ruby-3.4-dev
      - icu-dev
      - krb5-dev
      - re2-dev
      - abseil-cpp-dev
      - postgresql-18-dev
      - libxml2-dev
      - libxslt-dev
      - gpgme-dev
      - libffi-dev
      - openssl-dev
      - zlib-dev
      - yaml-dev
      - libgit2-dev
      - posix-libc-utils        # getconf for prometheus-client-mmap while Rails loads for the asset compile
      - patch                   # devise security backport
      - go-1.27                 # rebuilds the devfile gem's Go helper from its source
      - node-gyp                # tree-sitter has no arm64 prebuild; yarn falls back to node-gyp rebuild
      - python3
      - nodejs-22               # build-time only: the image ships compiled assets, not node
      - yarn

pipeline:
  - uses: fetch
    with:
      uri: https://gitlab.com/gitlab-org/gitlab-foss/-/archive/v${{package.version}}/gitlab-foss-v${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - name: gems (native extensions from source)
    runs: |
      set -eu
      grep -qx '${{package.version}}' VERSION
      export HOME="$(mktemp -d)" BUNDLE_FORCE_RUBY_PLATFORM=true
      # Wolfi links Ruby against OpenSSL 4, and the openssl gem 3.3.x GitLab pins cannot run on it
      # (OpenSSL::PKey::DH.new raises ArgumentError at boot). Wolfi ruby-3.4 itself ships the openssl 4.0.2
      # default gem, so move GitLab's pin there before deployment mode freezes the lockfile.
      sed -i "s/^gem 'openssl', '~> 3.3.2'/gem 'openssl', '~> 4.0.2'/" Gemfile
      grep -q "^gem 'openssl', '~> 4.0.2'" Gemfile
      bundle lock --update openssl
      grep -qx '    openssl (4.0.2)' Gemfile.lock
      # CVE floats inside each gem's line (sized on 19.6.0, images#20). Three Gemfile pins block them; bundler 4.1's
      # release cooldown still holds puma 8.0.3 (UNKNOWN severity) until about 2026-11-20.
      sed -i -e "s/^gem 'mail', '= 2.9.0'/gem 'mail', '= 2.9.1'/" \
             -e "s/^gem 'view_component', '~> 4.12.0'/gem 'view_component', '~> 4.14.0'/" \
             -e "s/^gem 'omniauth', '~> 2.1.0'/gem 'omniauth', '~> 2.2.0'/" Gemfile
      bundle lock --conservative --patch --update addressable graphql mail msgpack net-ssh puma rack resolv rubyntlm sanitize
      bundle lock --conservative --minor --update faraday-http-cache view_component omniauth
      for want in 'addressable 2.9.[1-9]' 'faraday-http-cache 2.[89]' 'graphql 2.6.1[4-9]' 'mail 2.9.[1-9]' \
                  'msgpack 1.8.[7-9]' 'net-ssh 7.3.([5-9]|[1-9][0-9])' 'rack 2.2.(2[5-9]|[3-9][0-9])' 'resolv 0.7.[2-9]' \
                  'rubyntlm 0.6.[6-9]' 'sanitize 7.0.[2-9]' 'view_component 4.1[4-9]' 'omniauth 2.2'; do
        set -- $want
        grep -qE "^    $1 \\($2" Gemfile.lock || { echo "float did not land: $1 $2"; exit 1; }
      done
      bundle config set --local deployment true
      bundle config set --local without 'development test'
      bundle config set --local build.nokogiri --use-system-libraries
      # re2 links Wolfi's re2 and abseil instead of downloading and building its own
      bundle config set --local build.re2 --enable-system-libraries
      # grpc builds its bundled abseil, which GCC 16 rejects (absl hash_policy_traits.h); clang-19 builds it.
      # grpc's extconf takes the compiler only from CC/CXX (extconf.rb:78), so install it first with clang
      # into the bundle path; bundle install then reuses it and builds the rest with gcc.
      gv="$(sed -n 's/^    grpc (\([0-9.]*\))$/\1/p' Gemfile.lock)"
      CC=clang CXX=clang++ gem install grpc -v "$gv" --platform ruby --ignore-dependencies --no-document \
        --install-dir "vendor/bundle/ruby/$(ruby -e 'print RbConfig::CONFIG["ruby_version"]')"
      CC=gcc CXX=g++ bundle install -j4 || { echo "bundle install failed"; exit 1; }
      # devise 4.9.4 (GitLab's lock; the fixes are only in the 5.0 line): backport the upstream library fixes for
      # CVE-2026-32700 (confirmable race) and CVE-2026-40295 (timeout open redirect), see vex.openvex.json
      grep -qx '    devise (4.9.4)' Gemfile.lock
      dg="vendor/bundle/ruby/$(ruby -e 'print RbConfig::CONFIG["ruby_version"]')/gems/devise-4.9.4"
      pf="$PWD/devise-4.9.4-security.patch"; (cd "$dg" && patch -p1 -i "$pf")
      grep -q 'extract_path_from_location(request.referrer)' "$dg/lib/devise/failure_app.rb"
      grep -q 'devise_unconfirmed_email_will_change!' "$dg/lib/devise/models/confirmable.rb"
      # graphql moved past 2.6.10; GitLab's serializer backport (a55c33b5, 369383a1) is in graphql 2.6.15 (both commits are ancestors of v2.6.15) and its guard
      # says to delete it then. Check the installed gem carries the escaping before removing the initializer.
      gq="$(dirname "$dg")/graphql-$(sed -n 's/^    graphql (\([0-9.]*\))$/\1/p' Gemfile.lock)"
      grep -q 'RESERVED_KEYS = \[GLOBALID_KEY' "$gq/lib/graphql/subscriptions/serialize.rb"
      rm config/initializers/graphql_subscriptions_serialize_patch.rb
      # GitLab pins its puma thread-pool patch to 8.0.2. The 8.0.x security releases do not carry the upstream fix
      # (puma #3968 is on main only) and ship thread_pool.rb unchanged, so once the cooldown lets puma float the
      # patch still applies: check the file is 8.0.2's byte for byte, then move the guard to the installed version.
      pv="$(sed -n 's/^    puma (\([0-9.]*\))$/\1/p' Gemfile.lock)"
      if [ "$pv" != 8.0.2 ]; then
        echo "4332be74d7046785d41a814fb568467160fe937d1590693051c3162e826b9c23  $(dirname "$dg")/puma-$pv/lib/puma/thread_pool.rb" | sha256sum -c -
        sed -i "s/Gem::Version.new('8.0.2')/Gem::Version.new('$pv')/" config/initializers/puma_io_thread_exit_patch.rb
        grep -q "Gem::Version.new('$pv')" config/initializers/puma_io_thread_exit_patch.rb
      fi
      # devfile ships prebuilt Go helpers for four platforms (Go 1.27.0, old modules). Rebuild this arch's Linux one from
      # the gem's own source with the fixed modules, and drop the rest. docker/cli and docker/docker stay (v29 breaks
      # oras-go v1 / has no module path; VEX).
      dfd="$(dirname "$dg")/devfile-$(sed -n 's/^    devfile (\([0-9.]*\))$/\1/p' Gemfile.lock)"
      case "$(uname -m)" in x86_64) ga=amd64 ;; aarch64) ga=arm64 ;; esac
      rm -f "$dfd"/out/devfile-*
      (cd "$dfd/ext" && export GOFLAGS=-mod=mod GOTOOLCHAIN=local GOPATH="$HOME/go" && \
        go get github.com/containerd/containerd@v1.7.36 github.com/klauspost/compress@v1.18.7 golang.org/x/net@v0.62.0 \
          golang.org/x/crypto@v0.58.1-0.20261009181718-2f1f834330b2 golang.org/x/text@v0.43.0 google.golang.org/grpc@v1.83.2 \
          go.opentelemetry.io/otel/trace@v1.47.0 && \
        go mod tidy && CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o "../out/devfile-$ga-linux" .)
      go version -m "$dfd/out/devfile-$ga-linux" > /tmp/devfile.mods
      grep -q 'golang.org/x/net	v0.62.0' /tmp/devfile.mods
      rm -rf "$dfd/ext"
      # Rust extensions. gitlab-glfm-markdown builds from its ext Cargo.lock (time 0.3.41, CVE-2026-25727): rebuild the
      # gem with time 0.3.47 and reinstall it over the bundled copy. gitlab_query_language has no lock beside its
      # manifest, so its build resolves fresh (bytes >= 1.11.1); its gem-root Cargo.lock drives nothing. A Cargo.lock
      # with no Cargo.toml beside it is removed, and the locks that remain must carry the fixed versions.
      bp="$PWD/$(dirname "$(dirname "$dg")")"
      gfv="$(sed -n 's/^    gitlab-glfm-markdown (\([0-9.]*\))$/\1/p' Gemfile.lock)"
      t="$(mktemp -d)"
      (cd "$t" && gem fetch gitlab-glfm-markdown -v "$gfv" --platform ruby && gem unpack "gitlab-glfm-markdown-$gfv.gem" && \
        gem spec "gitlab-glfm-markdown-$gfv.gem" --ruby > "gitlab-glfm-markdown-$gfv/glfm.gemspec" && \
        cd "gitlab-glfm-markdown-$gfv/ext/gitlab_glfm_markdown" && cargo update -p time --precise 0.3.47 && \
        awk '/^name = "time"/{getline; print}' Cargo.lock > /tmp/time.v && grep -q 'version = "0.3.47"' /tmp/time.v && \
        cd "$t/gitlab-glfm-markdown-$gfv" && gem build glfm.gemspec && \
        GEM_HOME="$bp" GEM_PATH="$bp" gem install "./gitlab-glfm-markdown-$gfv.gem" --install-dir "$bp" --ignore-dependencies --no-document)
      rm -rf "$t"
      for g in "$bp"/gems/gitlab-glfm-markdown-* "$bp"/gems/gitlab_query_language-*; do
        find "$g" -name Cargo.lock > /tmp/locks
        while read -r l; do [ -e "$(dirname "$l")/Cargo.toml" ] || rm -f "$l"; done < /tmp/locks
      done
      find "$bp"/gems/gitlab_query_language-* -name Cargo.lock -exec awk '/^name = "bytes"/{getline; print}' {} + > /tmp/bytes.v
      if grep -q '"1.10.1"' /tmp/bytes.v; then echo "gitlab_query_language still locks bytes 1.10.1"; exit 1; fi

  - name: frontend assets (no database)
    runs: |
      set -eu
      export HOME="$(mktemp -d)" BUNDLE_FORCE_RUBY_PLATFORM=true
      cp config/gitlab.yml.example config/gitlab.yml
      # the example lists EE databases (geo, embedding) that CE refuses at boot; the compile needs only main
      printf 'production:\n  main:\n    adapter: postgresql\n    encoding: unicode\n    database: gitlabhq_production\n    host: localhost\n' > config/database.yml
      cp config/resque.yml.example config/resque.yml
      yarn install --frozen-lockfile --non-interactive
      export RAILS_ENV=production NODE_ENV=production USE_DB=false SKIP_STORAGE_VALIDATION=true CI=true
      bundle exec rake gitlab:assets:compile
      test -d public/assets
      rm -f config/gitlab.yml config/database.yml config/resque.yml

  - name: install under /srv/gitlab
    runs: |
      set -eu
      d="${{targets.destdir}}/srv/gitlab"
      install -d "$d"
      # not part of what runs: build and dev trees, and lockfiles the scanner would read as installed (the frontend is
      # compiled into public/assets; the path gems' own dev lockfiles; workhorse ships as its own image; doc/ stays:
      # the help pages read it)
      rm -rf node_modules tmp/cache spec qa ee workhorse storybook rubocop danger
      rm -f yarn.lock package.json Pipfile Pipfile.lock Gemfile.next Gemfile.next.lock
      # the recipe's own files share the workspace with the source tree
      rm -f build.conf apko.yaml melange.yaml test.sh vex.openvex.json devise-4.9.4-security.patch ./*.rendered.yaml
      find gems vendor/gems -name Gemfile.lock -delete
      # native gem build leftovers (libtool archives, objects, static archives) and the downloaded .gem cache: only
      # the compiled .so files load; melange's lint refuses .la files
      find vendor/bundle \( -name '*.la' -o -name '*.o' -o -name '*.a' \) \( -type f -o -type l \) -delete
      rm -rf vendor/bundle/ruby/*/cache
      # the package destdir (melange-out) sits inside the workspace: copy everything but it
      for f in * .[!.]*; do
        if [ -e "$f" ] && [ "$f" != melange-out ]; then cp -a "$f" "$d/"; fi
      done
      test -f "$d/VERSION" && test -d "$d/public/assets" && test ! -e "$d/melange-out"
      install -d "$d/tmp" "$d/log" "$d/shared"

test:
  pipeline:
    - runs: |
        test -f /srv/gitlab/VERSION
        cd /srv/gitlab && ruby -e 'puts RUBY_VERSION'
        test -d /srv/gitlab/public/assets
