# gitlab-rails: the GitLab CE Rails application (gitlab-org/gitlab-foss, MIT) from the release tag, the image CNG ships as
# gitlab-webservice-ce / gitlab-sidekiq-ce / gitlab-toolbox-ce. One image, run as Puma, Sidekiq or the migrations toolbox by
# command. Images issue #20.
#
# 19.6.0 is the first line on a supported Rails (8.0.5.2; 19.5 was on Rails 7.2, end of life). Built on Wolfi ruby-3.4 with
# every native gem compiled from source (BUNDLE_FORCE_RUBY_PLATFORM) against Wolfi's libraries, so no vendored libxml2,
# BoringSSL or re2 hides from the scanner; frontend assets compiled at build time without a database. The heaviest build in
# the catalog: gate on the CI runners. LATEST-ONLY.
FROM_SOURCE=1
VERSIONS=(19.6.0)
declare -A SHA256=(
  [19.6.0]=ed5202de0b60bdbe375d7b9b48064a3080fcae39fd767e72fede59669a4285d5
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
