# Apache Flink Kubernetes Operator (FlinkDeployment, FlinkSessionJob, FlinkStateSnapshot and
# FlinkBlueGreenDeployment resources), from the Apache source release (Apache-2.0). The release ships
# source only and the operator's shaded jar is not on Maven Central, so the recipe builds the five
# upstream modules with Maven and lays them out as upstream's Dockerfile does: the jars under
# /flink-kubernetes-operator, plugins and the logging libraries under /opt/flink, and upstream's
# bash /docker-entrypoint.sh (operator | webhook). The Flink clusters it creates run Apache Flink's
# own images. LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(1.16.1)
declare -A SHA256=(
  [1.16.1]=99a13e171d26dc9cc30396e7e118fc0cb9d264fea816c51e3ca2e203f9e4092b
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
