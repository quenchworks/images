# paperless-ngx: Paperless-ngx (paperless-ngx/paperless-ngx, GPL-3.0), document management that scans, OCRs and
# indexes paper documents. Images issue #106.
#
# From the release tag: the AI stack (llama-index-*, openai, sentence-transformers, sqlite-vec, torch) is dropped
# from pyproject and the lock re-resolved (AI is off by default and loads lazily; see #106). A Python 3.13 venv over
# Wolfi's natives; pikepdf from source on Wolfi qpdf; every Rust extension rebuilt with cargo auditable; no uvloop
# (vendors libuv). The Angular UI is built with pnpm. OCR tools from Wolfi; no unpaper, so PAPERLESS_OCR_CLEAN=none.
# LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(3.5.0)
declare -A SHA256=(
  [3.5.0]=c949861d049ff84dc720431c98d44d8a3c3cf22c904667a8d0d1a127574e398f
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
