# Builds Fluentd, the unified logging layer, onto Wolfi: `gem install fluentd` against
# ruby-4.0 into a private GEM_HOME (/usr/lib/fluentd/gems), native extensions compiled
# here. Plugins are installed the same way (`gem install fluent-plugin-...` with that
# GEM_HOME) in a derived image. Ships a minimal default config: forward input on 24224,
# HTTP input on 9880, everything to stdout. Output is a signed APK in Quenchworks' own repo.
package:
  name: quench-fluentd
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Fluentd, built on Wolfi ruby-4.0"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ruby-4.0
      - ca-certificates-bundle
      - tzdata

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - ruby-4.0
      - ruby-4.0-dev

pipeline:
  - runs: |
      set -eu
      GEMS="${{targets.destdir}}/usr/lib/fluentd/gems"
      export GEM_HOME="$GEMS" GEM_PATH="$GEMS"
      gem install --no-document --env-shebang fluentd -v ${{package.version}}
      "$GEMS/bin/fluentd" --version | grep -q "fluentd ${{package.version}}"
      # build leftovers: the compiled objects stay in the extension dirs, the rest goes
      rm -rf "$GEMS/cache"
      find "$GEMS" \( -name '*.o' -o -name 'mkmf.log' -o -name 'gem_make.out' \) -delete
      install -d "${{targets.destdir}}/fluentd/etc"
      cat > "${{targets.destdir}}/fluentd/etc/fluent.conf" <<'CONF'
      # default config: accept forward (24224) and HTTP (9880), print everything
      <source>
        @type forward
        bind 0.0.0.0
        port 24224
      </source>
      <source>
        @type http
        bind 0.0.0.0
        port 9880
      </source>
      <match **>
        @type stdout
      </match>
      CONF
