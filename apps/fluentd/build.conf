# fluentd: the fluentd gem installed from rubygems.org onto Wolfi's ruby-4.0, with its
# native extensions (cool.io, msgpack, yajl-ruby, ...) compiled in the build. FROM_SOURCE=1
# in the sense that nothing prebuilt from a distro is shipped. Wolfi's own fluentd apk
# sits on ruby 3.2, which is EOL.
#
# 1.19 ONLY. The 1.16 LTS line (1.16.11) is itself flagged: CVE-2026-44025 (monitor agent
# information exposure), -44160 (gzip bomb), -44161 (SSRF via placeholders), fixed on the
# 1.19 line. Measured 2026-09-26.
# Ruby 4.0, not 3.4: Wolfi's ruby-3.4 bakes a vulnerable default json gem (2.9.1,
# CVE-2026-54696); ruby-4.0 depends on the fixed ruby4.0-json instead (see apps/ruby).
FROM_SOURCE=1
VERSIONS=(1.19.3)
render() { echo "s/__VER__/$1/g"; }
