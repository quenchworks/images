# STATUS: ZLIB-ONLY as of 2026-09-16. Measured, not assumed: run 35066630896
# on af0623d gated with exactly one finding, zlib CVE-2026-85091, on every
# version and both arches. Nothing else in this image is flagged.
#
# Wolfi is at 1.3.2.1_rc20260601-r0 and the advisory wants 1.3.3-r0, which
# upstream madler/zlib has never tagged. Downgrading to Wolfi's 1.3.1-r51
# is not a way out either: it predates the 1.3.2-r0 fix for CVE-2026-27171.
#
# BLOCKED=1 skips build+merge so sweeps stop burning a red run here. Clear
# it with scripts/blocked.py --dispatch once Wolfi ships zlib 1.3.3-r0.
# haproxy: from-source via melange (fetch haproxy.org tarball, sha256).
# Latest 3 stable minor lines at their newest patch (full X.Y.Z, used as-is).
# The download URL path is keyed by minor, so MINOR is mapped explicitly.
# __VER__ = version  __SHA256__ = tarball sha256  __MINOR__ = download path minor
BLOCKED=1
FROM_SOURCE=1
VERSIONS=(3.2.19 3.3.10 3.4.0)
declare -A SHA256=(
  [3.2.19]=b08ebbd57f575012e4a5eb5b772721531fbacf6913ffd334f0281736a1ad78b6
  [3.3.10]=6aa919a13f3a575416ef0ae45da0ecb35f1a8d004641dd684fe9b53e646891f2
  [3.4.0]=9298f565c2a9ba8a4e7f89c54be2c5d3fd960b5b304eb5515e15d29d2c15d4f7
)
declare -A MINOR=(
  [3.2.19]=3.2
  [3.3.10]=3.3
  [3.4.0]=3.4
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g; s|__MINOR__|${MINOR[$1]}|g"; }
