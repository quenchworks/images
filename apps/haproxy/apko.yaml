# Assembles the HAProxy runtime image from our own package plus the Wolfi base.
# No Dockerfile. Minimal, nonroot (uid 1001), multi-arch, SBOM generated by apko.
# Frontends listen on unprivileged ports (8080 http, 8443 https reserved for
# chart-mounted certs, 8404 stats/health); the pidfile + admin socket live under
# /var/lib/haproxy. Logs go to stdout/stderr. Runs on a read-only rootfs when
# /var/lib/haproxy (and /tmp) are writable tmpfs mounts.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-haproxy@local

accounts:
  groups:
    - groupname: haproxy
      gid: 1001
  users:
    - username: haproxy
      uid: 1001
      gid: 1001
  run-as: 1001

# Run HAProxy in the foreground as PID 1 against the shipped sample config. The chart
# mounts the real config over /etc/haproxy/haproxy.cfg and can append flags.
entrypoint:
  command: /usr/bin/haproxy -f /etc/haproxy/haproxy.cfg

# The pidfile + admin socket are written here; mount it writable (tmpfs) at runtime.
work-dir: /var/lib/haproxy

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quenchworks.mkabumattar.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-haproxy"
  org.opencontainers.image.licenses: "GPL-2.0-or-later"
