# The Cilium agent built from the cilium/cilium source tarball with upstream's own make targets
# (build-container + install-container-binary: the agent binaries plus /var/lib/cilium/bpf), the
# same module float as cilium-operator, and upstream's runtime layout: the init scripts at /,
# the CNI loopback at /cni/loopback. clang/llc compile the BPF programs on the node at runtime.
package:
  name: quench-cilium
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Cilium agent, built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - bash
      - busybox      # cp, mkdir, rm and friends for the init scripts (install-plugin.sh, init-container.sh)
      - bpftool
      - iproute2
      - ipset
      - iptables-nft
      - kmod
      - llvm-19-bpf
      - nsenter      # upstream's mount-cgroup and sysctl init containers use --cgroup= / --mount=, which busybox lacks
      - mount        # Wolfi's busybox has no mount applet; the mount-bpf-fs init container runs `mount -t bpf`
      - umount

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - bash
      - ca-certificates-bundle
      - coreutils   # upstream's install targets use `ln -r`, which busybox lacks
      - curl
      - go
      - make

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/cilium/cilium/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      set -eu
      export CGO_ENABLED=0
      export GO111MODULE=on
      export GOTOOLCHAIN=local
      # 0-CVE module float, the same FLOOR as cilium-operator (docs/go-module-float.md).
      FLOOR="golang.org/x/net@v0.62.0 google.golang.org/grpc@v1.83.2 go.mongodb.org/mongo-driver@v1.17.7 github.com/cilium/ebpf@v0.22.0 github.com/google/cel-go@v0.29.0 github.com/gopacket/gopacket@v1.7.2 github.com/osrg/gobgp/v4@v4.7.0 golang.org/x/crypto@v0.58.1-0.20261009181718-2f1f834330b2"
      # CVE-2026-128085 (otel 1.47.0): floor every otel v1 module the build uses, as one family
      for m in $(go list -mod=mod -m -e -f '{{.Path}} {{.Version}}' all | awk '($1 ~ /^go\.opentelemetry\.io\/otel(\/|$)/ || $1 ~ /^go\.opentelemetry\.io\/contrib\/bridges\/otel(zap|logrus|slog)$/) && $1 !~ /\/exporters\/jaeger$/ { if ($1 ~ /\/contrib\/bridges\//) print $1"@v0.21.0"; else if ($1 ~ /\/exporters\/(otlp\/otlplog\/|stdout\/stdoutlog$)/) print $1"@v0.23.0"; else if ($1 ~ /\/exporters\/prometheus$/) print $1"@v0.69.0"; else if ($2 ~ /^v1\./ || $1 ~ /\/(sdk\/)?log$/) print $1"@v1.47.0" }'); do
        FLOOR="$FLOOR $m"
      done
      MODS="$(echo "$FLOOR" | tr ' ' '\n' | cut -d@ -f1)"
      below_floor() {
        awk -v floor="$FLOOR" -v tag="$1" '
          BEGIN { n = split(floor, f, " ")
                  for (i = 1; i <= n; i++) { split(f[i], kv, "@"); want[kv[1]] = kv[2] } }
          ($1 in want) {
            split(substr($2, 2), g, "."); split(substr(want[$1], 2), w, ".")
            for (i = 1; i <= 3; i++) {
              if ((g[i] + 0) > (w[i] + 0)) next
              if ((g[i] + 0) < (w[i] + 0)) { print $1 "@" want[$1] " (" tag " has " $2 ")"; next }
            }
          }'
      }
      need="$(GOFLAGS=-mod=mod go list -m -e $MODS | awk 'NF >= 2 && $NF ~ /^v[0-9]/ { print $1, $NF }' | below_floor go.mod | awk '{ print $1 }')"
      if [ -n "$need" ]; then
        GOFLAGS=-mod=mod go get $need
        go mod vendor
      fi
      d="${{targets.destdir}}"
      make PKG_BUILD=1 DESTDIR="$d" build-container install-container-binary
      install -m755 images/cilium/init-container.sh plugins/cilium-cni/install-plugin.sh plugins/cilium-cni/cni-uninstall.sh "$d/"
      for b in "$d"/usr/bin/*; do
        file="$(basename "$b")"
        go version -m "$b" >/dev/null 2>&1 || continue
        bad="$(go version -m "$b" | awk '$1 == "dep" || $1 == "=>" { print $2, $3 }' | below_floor "$file")"
        [ -z "$bad" ] || { echo "0-CVE float did not reach $file:"; echo "$bad"; exit 1; }
      done
      test -d "$d/var/lib/cilium/bpf"
  - name: CNI loopback (upstream's runtime image builds it from containernetworking/plugins)
    runs: |
      set -eu
      export CGO_ENABLED=0 GOFLAGS=-mod=mod GO111MODULE=on GOTOOLCHAIN=local
      mkdir -p /tmp/cni && cd /tmp/cni
      curl -fsSL -o cni.tgz https://github.com/containernetworking/plugins/archive/refs/tags/v1.9.1.tar.gz
      echo "34bd82d47e981940751619c9cc44c095bb90bfcaf8d71865cbb822c37690a764  cni.tgz" | sha256sum -c -
      tar -xzf cni.tgz --strip-components=1
      # Wolfi cni-plugins 1.9.1 links golang.org/x/sys v0.35.0 (CVE-2026-39824); same float as concourse.
      go get golang.org/x/sys@v0.49.0 && go mod tidy
      install -d "${{targets.destdir}}/cni"
      go build -trimpath -ldflags "-s -w -X github.com/containernetworking/plugins/pkg/utils/buildversion.BuildVersion=v1.9.1" \
        -o "${{targets.destdir}}/cni/loopback" ./plugins/main/loopback
      v="$(go version -m "${{targets.destdir}}/cni/loopback" | awk '$2 == "golang.org/x/sys" { print $3 }')"
      [ "$v" = v0.49.0 ] || { echo "loopback links golang.org/x/sys $v, not v0.49.0"; exit 1; }

test:
  pipeline:
    - runs: |
        cilium-agent --version | grep -F "${{package.version}}"
        hubble version | grep -F "${{package.version}}"
        test -x /install-plugin.sh && test -x /cni/loopback
