# chhoto-url: Chhoto URL (SinTan1729/chhoto-url, MIT), a small URL shortener with a web UI, API keys, expiring
# links, hit counts and OIDC login. Images issue #88.
#
# From the release tag with cargo auditable (actix-web, rustls with ring for OIDC, rusqlite with bundled SQLite),
# glibc on Wolfi; the static frontend sits beside the binary in /app. No TLS listener (put it behind an ingress).
# LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(7.11.7)
declare -A SHA256=(
  [7.11.7]=fc7e70890e83ad47ac77ccb2e2598b82303339c0434fee3b21f99f2931cbb509
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
