# mongo-express: Mongo Express, the web admin UI for MongoDB (and MongoDB-compatible
# servers such as FerretDB), from the tagged source on Node 24 (Wolfi). The UI bundle is
# built with the repo's own yarn 4 (webpack), then the tree is cut to production deps.
#
# 0-CVE: a stock 1.1.0-rc-4 production tree carries 9 vulnerable packages (busboy, two
# body-parser lines, cookie, lodash, morgan, path-to-regexp, two qs lines). melange.yaml
# pins them through package.json and yarn resolutions; a local build plus a comprehensive
# trivy fs measured 0 (2026-10-05).
#
# NEWEST-ONLY: upstream's only release since 1.0.2 (2023) is the 1.1.0 rc train, which
# npm tags latest and GitHub does not mark prerelease. apk versions cannot carry
# "-rc-4", so render() gives the package 1.1.0_rc4 and the fetch the upstream tag.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(1.1.0-rc-4)
# sha256 of the GitHub tag tarball, from a download
declare -A SHA256=(
  [1.1.0-rc-4]=8e987b3d51b659bacd247a43a7f8f79c12adc03e991f96feadc5cb52d843955e
)
render() {
  local pkg; pkg="$(printf '%s' "$1" | sed -E 's/-rc-?([0-9]+)$/_rc\1/')"
  echo "s/__VER__/$pkg/g; s/__TAG__/$1/g; s|__SHA256__|${SHA256[$1]}|g"
}
