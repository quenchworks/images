# Packages the OWASP Dependency-Track API server (official dist: the application jar and
# its lib/ directory of plain jars) onto Wolfi. Upstream starts it with
# `-cp 'dependency-track-apiserver.jar:lib/*'`, so a lib/ jar can be replaced under its
# own name: the manifest's Class-Path entry for the old file no longer resolves and the
# JVM skips it, while the lib/* wildcard loads the new one. Output is a signed APK in
# Quenchworks' own repo. No upstream distro binaries.
package:
  name: quench-dependency-track
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened OWASP Dependency-Track API server, packaged on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - openjdk-25-jre     # upstream runs on Java 25 (it passes -XX:+UseCompactObjectHeaders)
      - tzdata

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - wget

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/DependencyTrack/dependency-track/releases/download/${{package.version}}/dependency-track-apiserver-dist.tar.gz
      expected-sha256: "__SHA256__"
      strip-components: 0
  - runs: |
      set -eu
      app="${{targets.destdir}}/opt/dependency-track"
      install -d "$app"
      cp -r dependency-track-apiserver.jar lib "$app/"
      # Bundled jars below their CVE fix get the fixed release (sha256 from a download whose
      # sha1 matched Maven Central's). Version-aware: a release that already ships the fix
      # or newer keeps its copy; exactly one copy of each must be in lib/.
      #   freemarker 2.3.35: CVE-2026-84939 (path traversal via a malformed locale)
      #   jackson-databind 2.22.3: CVE-2026-91776/-91777
      #   jackson-core 2.22.3: CVE-2026-89407/-89425 (2026-10-04)
      swap() {  # <artifact> <fix version> <maven group path> <sha256>
        old="$(ls "$app"/lib/"$1"-[0-9]*.jar 2>/dev/null || true)"
        [ "$(printf '%s\n' "$old" | grep -c .)" = 1 ] || { echo "expected one $1 jar in lib/, got: $old"; exit 1; }
        v="$(basename "$old" .jar)"; v="${v#"$1"-}"
        [ "$(printf '%s\n%s\n' "$v" "$2" | sort -V | head -1)" = "$2" ] && { echo "$1 $v: at or past $2"; return 0; }
        rm "$old"
        wget -q -O "$app/lib/$1-$2.jar" "https://repo1.maven.org/maven2/$3/$1/$2/$1-$2.jar"
        echo "$4  $app/lib/$1-$2.jar" | sha256sum -c -
      }
      swap freemarker 2.3.35 org/freemarker 0fac87dddd78f1223139e8ef88e819c7f483c0a3835cdf5982ad5e4576d1d896
      swap jackson-databind 2.22.3 com/fasterxml/jackson/core 556db5439e206114346043f68d200497dc96a0bca62a360a81784092ebd0e0a9
      swap jackson-core 2.22.3 com/fasterxml/jackson/core 8a501126a385b25841915d839508f8a66e2a0dbc8a6709d055ef3b3e852b094c
      chmod -R a+rX "$app"

test:
  pipeline:
    - runs: |
        test -f /opt/dependency-track/dependency-track-apiserver.jar
        test -f /opt/dependency-track/lib/freemarker-2.3.35.jar
