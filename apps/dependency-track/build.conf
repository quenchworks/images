# dependency-track: the OWASP Dependency-Track API server from its official dist
# tarball (dependency-track-apiserver.jar + lib/), on a Wolfi JRE. FROM_SOURCE=0: fetch
# + unpack. The sha256 is from a download that matched the release's checksums.txt.
# The API server only; the web frontend is a separate app.
#
# 5.1 ONLY for now. 5.0.5 needs three jar swaps (freemarker, lz4-java and
# jackson-databind 3.1.5, which should move with its family) and 4.14 is a different
# architecture (one bundled executable jar, embedded H2). Measured 2026-09-26.
FROM_SOURCE=0
VERSIONS=(5.1.1)
declare -A SHA256=(
  [5.1.1]=f1bdebf45d1a0931db08ab68ad8801a03c3d0e605e74b78c1e25dcdcbffabd54
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
