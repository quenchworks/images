# zookeeper: from-source via melange (installs the Apache ZooKeeper bin dist on a
# JRE). Latest 3 patches of the 3.9 line. Each pins its tarball by sha256.
FROM_SOURCE=1
VERSIONS=(3.9.3 3.9.4 3.9.5)
declare -A SHA256=(
  [3.9.3]=19aa2811d5a80c7ae36208ccd61091b5c77812e784c29ffac68b3792ab648f1c
  [3.9.4]=c5b7cbda0b1b59d724e552d33775983f8a366bf651ba484937d0559d97bf0ae9
  [3.9.5]=e752fe205abd9323eef8011ec3cb68adbb83678cfb5ab337159d0a40e12f93d7
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
