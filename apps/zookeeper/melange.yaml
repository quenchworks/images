# Packages Apache ZooKeeper onto Wolfi. ZooKeeper is a JVM app: we ship the upstream
# binary distribution (prebuilt jars) on the same hardened openjdk-21-jre base the
# Kafka build established. The JRE is the CVE surface the Trivy gate scans.
package:
  name: quench-zookeeper
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Apache ZooKeeper, packaged on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - openjdk-21-jre     # the JRE ZooKeeper runs on (the scanned CVE surface)
      - bash               # the zkServer.sh launchers are bash
      - busybox

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle

pipeline:
  - uses: fetch
    with:
      uri: https://dlcdn.apache.org/zookeeper/zookeeper-${{package.version}}/apache-zookeeper-${{package.version}}-bin.tar.gz
      expected-sha256: "__SHA256__"
      strip-components: 1
  - runs: |
      # install the distribution under /opt/zookeeper, dropping the Windows launchers
      dest="${{targets.destdir}}/opt/zookeeper"
      install -d "$dest"
      cp -r bin conf lib LICENSE.txt NOTICE.txt "$dest/"
      find "$dest/bin" -name '*.cmd' -delete

      # --- QuenchWorks CVE pin (3.9.5) --------------------------------------------
      # Two findings are fixable ONLY across a prohibited MAJOR bump; both live in
      # OPTIONAL components, so we DROP them rather than fork upstream:
      #   (a) Jetty 9.4 AdminServer  -> lib/jetty-*.jar (fix only in Jetty 12).
      #       The embedded AdminServer is disabled by default here
      #       (admin.enableServer=false in the entrypoint); core ZooKeeper serves
      #       clients over its binary protocol + the four-letter-word (4lw) commands
      #       and needs no HTTP admin. javax.servlet-api is a jetty-only dep, dropped
      #       with it. AdminServerFactory returns the no-op DummyAdminServer.
      #   (b) JLine 3 telnet CLI     -> lib/jline-*.jar (fix only in JLine 4).
      #       JLine only adds line-editing/history to the interactive zkCli shell;
      #       ZooKeeperMain loads it reflectively and falls back to a plain reader
      #       when absent, so zkCli (create/get/ls/delete) still works.
      #   TRADE-OFF: no built-in HTTP AdminServer endpoint and no Jetty-backed
      #   Prometheus metrics exporter (use 4lw commands / an external exporter);
      #   zkCli loses arrow-key history/editing but stays fully functional.
      # The remaining findings are STANDALONE same-major jars -> direct swap to the
      # patched version (SHA256-pinned from Maven Central; ZK globs lib/*.jar):
      #   jackson 2.15.2 -> 2.21.5 (CVE-2026-54512..54515; annotations ships "2.21")
      #   logback 1.3.15 -> 1.5.35 (CVE-2025-11226, CVE-2026-1225/9828/10532; slf4j2)
      #   netty   4.1.130 -> 4.1.137.Final (CVE-2026-42583/44249/45416/50010/45536
      #                              + the July-2026 wave, netty-codec CVE-2026-59901;
      #                              the nightly scan also flags netty-handler, fixed
      #                              in 4.1.137.Final)
      # netty-tcnative (2.0.74) is a separate line, not flagged -- left as-is.
      if [ "${{package.version}}" = "3.9.5" ]; then
      rm -f "$dest"/lib/jetty-*.jar "$dest"/lib/javax.servlet-api-*.jar "$dest"/lib/jline-*.jar
      M=https://repo1.maven.org/maven2
      swap() { # newfile sha256 url oldfile
        local nf="$1" sha="$2" url="$3" old="$4"
        rm -f "$dest/lib/$old"
        wget -q -O "$dest/lib/$nf" "$url"
        echo "$sha  $dest/lib/$nf" | sha256sum -c - >/dev/null
      }
      swap jackson-annotations-2.21.jar 53ca085f4a150f703f49e1aabd935bd03b43e1ea3d55d135438292af22cef56b "$M/com/fasterxml/jackson/core/jackson-annotations/2.21/jackson-annotations-2.21.jar" jackson-annotations-2.15.2.jar
      swap jackson-core-2.21.5.jar b64b5874162b503a0e58a8f7758266e8dd9f91bf49e3a59ae0b5f47589a231b7 "$M/com/fasterxml/jackson/core/jackson-core/2.21.5/jackson-core-2.21.5.jar" jackson-core-2.15.2.jar
      swap jackson-databind-2.21.5.jar 507418c0fafd38b2b2cfb704521630da613a8e4cc8381195a6f418017883e2c0 "$M/com/fasterxml/jackson/core/jackson-databind/2.21.5/jackson-databind-2.21.5.jar" jackson-databind-2.15.2.jar
      swap logback-classic-1.5.35.jar 1a0ba277c4d177862731c820099913013255892c79e05b5371307f174f089878 "$M/ch/qos/logback/logback-classic/1.5.35/logback-classic-1.5.35.jar" logback-classic-1.3.15.jar
      swap logback-core-1.5.35.jar d8c38ea6871eefccf769f83e1afd07280e29fa0d1dd281092a77eb77c880ace6 "$M/ch/qos/logback/logback-core/1.5.35/logback-core-1.5.35.jar" logback-core-1.3.15.jar
      # netty 4.1.136 -> 4.1.137.Final: the nightly scan flags io.netty:netty-handler
      # (fix 4.1.137.Final) and netty modules must move in LOCKSTEP -- a lone handler
      # beside 4.1.136 siblings would mix two builds of one library, so swap() moves
      # the whole 9-jar set to one version. netty-tcnative 2.0.74 is a separate line,
      # not flagged -- left as-is. 3.9.5 is the newest PUBLISHED zookeeper (dlcdn);
      # when 3.9.6 publishes (branch-3.9 already pins netty.version=4.1.137.Final) a
      # VERSION BUMP supersedes this -- drop these swaps with it.
      NV=4.1.137.Final
      swap netty-buffer-$NV.jar f474b14c7734f15e0540394cb6f39d67777b7581a42919e4ac89d253d4efd929 "$M/io/netty/netty-buffer/$NV/netty-buffer-$NV.jar" netty-buffer-4.1.130.Final.jar
      swap netty-codec-$NV.jar 9987b6a660b0a6b1f0d791485dae33180b3d1c63687c006fe6d3fd025e9e3798 "$M/io/netty/netty-codec/$NV/netty-codec-$NV.jar" netty-codec-4.1.130.Final.jar
      swap netty-common-$NV.jar d31926b01adcc07af86f5e27b81b6d6c115df17d366e835d1fc3f5a1924e7e52 "$M/io/netty/netty-common/$NV/netty-common-$NV.jar" netty-common-4.1.130.Final.jar
      swap netty-handler-$NV.jar d0e4c6ee4779f59f6ab2fb5d388e4f57147c82270164b37945764bb9bda96a44 "$M/io/netty/netty-handler/$NV/netty-handler-$NV.jar" netty-handler-4.1.130.Final.jar
      swap netty-resolver-$NV.jar b4cf2aeedd9fc7c8c439bbfe574f63cfe5b83392e88bbc07ca0e8424b7cff955 "$M/io/netty/netty-resolver/$NV/netty-resolver-$NV.jar" netty-resolver-4.1.130.Final.jar
      swap netty-transport-$NV.jar 6251adc2a2921572382732a2db188d4f4f2251fd6ebb49c5d44bbf33d6bfb1a7 "$M/io/netty/netty-transport/$NV/netty-transport-$NV.jar" netty-transport-4.1.130.Final.jar
      swap netty-transport-classes-epoll-$NV.jar 55049554b799dc8e53bf234fffa36e001f7b5b65c32994b9bd59fc6356f1c52f "$M/io/netty/netty-transport-classes-epoll/$NV/netty-transport-classes-epoll-$NV.jar" netty-transport-classes-epoll-4.1.130.Final.jar
      swap netty-transport-native-unix-common-$NV.jar 8056e7637f9948f953314894cf995ab664711b66c73c4cd5b593ae84f0b1048c "$M/io/netty/netty-transport-native-unix-common/$NV/netty-transport-native-unix-common-$NV.jar" netty-transport-native-unix-common-4.1.130.Final.jar
      swap netty-transport-native-epoll-$NV-linux-x86_64.jar 185db6053e0e9573d36fa4eb6567b26139afaa4daa7bf5a068e661568304542b "$M/io/netty/netty-transport-native-epoll/$NV/netty-transport-native-epoll-$NV-linux-x86_64.jar" netty-transport-native-epoll-4.1.130.Final-linux-x86_64.jar
      fi  # end 3.9.5-only CVE pin

      # bake a config-from-env entrypoint. A read-only rootfs means zoo.cfg and the
      # data/log dirs live under writable mounts; ZOO_* env vars override every default.
      install -d "${{targets.destdir}}/usr/bin"
      cat > "${{targets.destdir}}/usr/bin/docker-entrypoint.sh" <<'EOS'
      #!/bin/bash
      set -euo pipefail

      ZK_HOME=/opt/zookeeper
      DATA_DIR="${ZOO_DATA_DIR:-/data}"
      CONF_DIR="${ZOOCFGDIR:-/conf}"
      mkdir -p "$DATA_DIR" "$CONF_DIR" "${ZOO_LOG_DIR:-/var/lib/zookeeper/log}"

      CFG="$CONF_DIR/zoo.cfg"
      {
        echo "dataDir=$DATA_DIR"
        echo "clientPort=${ZOO_CLIENT_PORT:-2181}"
        echo "tickTime=${ZOO_TICK_TIME:-2000}"
        echo "initLimit=${ZOO_INIT_LIMIT:-10}"
        echo "syncLimit=${ZOO_SYNC_LIMIT:-5}"
        echo "maxClientCnxns=${ZOO_MAX_CLIENT_CNXNS:-60}"
        echo "autopurge.snapRetainCount=${ZOO_AUTOPURGE_SNAPRETAINCOUNT:-3}"
        echo "autopurge.purgeInterval=${ZOO_AUTOPURGE_PURGEINTERVAL:-0}"
        echo "admin.serverPort=${ZOO_ADMIN_SERVER_PORT:-8080}"
        # HTTP AdminServer is Jetty-backed; the Jetty 9.4 jars are dropped from this
        # image (only fixable via a prohibited Jetty 12 MAJOR bump). Force it off so
        # ZooKeeper uses the no-op DummyAdminServer. Use 4lw commands for admin.
        echo "admin.enableServer=false"
        echo "4lw.commands.whitelist=${ZOO_4LW_COMMANDS_WHITELIST:-srvr,mntr,ruok,conf,stat,isro}"
        echo "standaloneEnabled=${ZOO_STANDALONE_ENABLED:-true}"
        # ensemble members, e.g. ZOO_SERVERS="server.1=zk1:2888:3888 server.2=zk2:2888:3888"
        if [ -n "${ZOO_SERVERS:-}" ]; then for s in ${ZOO_SERVERS}; do echo "$s"; done; fi
        # any extra raw lines
        if [ -n "${ZOO_CFG_EXTRA:-}" ]; then printf '%s\n' "${ZOO_CFG_EXTRA}"; fi
      } > "$CFG"

      # node identity for an ensemble (ignored in standalone)
      echo "${ZOO_MY_ID:-1}" > "$DATA_DIR/myid"

      exec "$ZK_HOME/bin/zkServer.sh" --config "$CONF_DIR" start-foreground
      EOS
      chmod 0755 "${{targets.destdir}}/usr/bin/docker-entrypoint.sh"

test:
  pipeline:
    - runs: |
        test -f /opt/zookeeper/bin/zkServer.sh
