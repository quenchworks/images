# Packages Apache ZooKeeper onto Wolfi. ZooKeeper is a JVM app: we ship the upstream
# binary distribution (prebuilt jars) on the same hardened openjdk-21-jre base the
# Kafka build established. The JRE is the CVE surface the Trivy gate scans.
package:
  name: quench-zookeeper
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Apache ZooKeeper, packaged on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - openjdk-21-jre     # the JRE ZooKeeper runs on (the scanned CVE surface)
      - bash               # the zkServer.sh launchers are bash
      - busybox

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle

pipeline:
  - uses: fetch
    with:
      uri: https://dlcdn.apache.org/zookeeper/zookeeper-${{package.version}}/apache-zookeeper-${{package.version}}-bin.tar.gz
      expected-sha256: "__SHA256__"
      strip-components: 1
  - runs: |
      # install the distribution under /opt/zookeeper, dropping the Windows launchers
      dest="${{targets.destdir}}/opt/zookeeper"
      install -d "$dest"
      cp -r bin conf lib LICENSE.txt NOTICE.txt "$dest/"
      find "$dest/bin" -name '*.cmd' -delete

      # --- QuenchWorks CVE pin (3.9.6) --------------------------------------------
      # Re-verified 2026-09-16 against the jar list the pinned 3.9.6 tarball actually
      # ships. It was version-gated to 3.9.5 and so went DEAD on the 3.9.6 bump, which
      # is why the gate regressed. Gate is now unconditional -- VERSIONS=(3.9.6).
      # DROPPED (fixable only across a prohibited MAJOR bump, and OPTIONAL here):
      #   lib/jetty-*.jar  -- Jetty 9.4.58.v20250814 AdminServer stack (http, io,
      #     security, server, servlet, util, util-ajax). CVE-2026-2332, CVE-2026-10050,
      #     CVE-2026-6790, CVE-2024-6763. 9.4.58 is the NEWEST 9.4.x on Maven Central
      #     (verified: no 9.4.60/9.4.63 exists, the 9.4 line is EOL) -- every fix is
      #     Jetty 12 only, so there is nothing to swap TO. The embedded AdminServer is
      #     disabled by default here (admin.enableServer=false in the entrypoint);
      #     core ZooKeeper serves clients over its binary protocol + the four-letter-word
      #     (4lw) commands and needs no HTTP admin. AdminServerFactory falls back to the
      #     no-op DummyAdminServer. javax.servlet-api is a jetty-only dep, dropped with it.
      #   TRADE-OFF: no built-in HTTP AdminServer endpoint and no Jetty-backed Prometheus
      #   metrics exporter (use 4lw commands / an external exporter).
      # KEPT that earlier versions dropped or swapped -- upstream caught up, do NOT
      # re-add these lines, they would DOWNGRADE:
      #   jline   3.30.14-jdk8 (was 3.25.1, dropped for GHSA-2r2c-cx56-8933) -- clean,
      #           so zkCli keeps its line-editing/history.
      #   jackson 2.22/2.22.2  (was 2.15.2, swapped to 2.21.5) -- already newer.
      #   netty   4.1.137.Final (was 4.1.130, swapped) -- already at the swap target.
      # SWAPPED (standalone same-line jar, SHA256-pinned from Maven Central; ZK globs lib/*.jar):
      #   logback 1.3.15 -> 1.5.38 (CVE-2025-11226, CVE-2026-1225/9828/10532; newest
      #     1.5.x, all four need >= 1.5.34). 1.3.x is the Java 8 line and 1.5.x targets
      #     Java 11 bytecode (verified major 55) -- fine on this image's Java 21 JRE.
      #     Both logback jars move in lockstep, and the dist already ships slf4j-api 2.0.13
      #     which the 1.5.x line requires.
      rm -f "$dest"/lib/jetty-*.jar "$dest"/lib/javax.servlet-api-*.jar
      M=https://repo1.maven.org/maven2
      swap() { # newfile sha256 url oldfile
        local nf="$1" sha="$2" url="$3" old="$4"
        # the old jar MUST be there: a silently-absent target means upstream moved and
        # the download would ADD a jar beside an unknown version instead of replacing it.
        test -f "$dest/lib/$old" || { echo "FATAL: $old not shipped -- re-audit this swap"; ls "$dest/lib/"; exit 1; }
        rm -f "$dest/lib/$old"
        wget -q -O "$dest/lib/$nf" "$url"
        echo "$sha  $dest/lib/$nf" | sha256sum -c - >/dev/null
      }
      swap logback-classic-1.5.38.jar afb439c61fa287c9e1925523b13baab03617e724406a389d48b61c2c3e46b700 "$M/ch/qos/logback/logback-classic/1.5.38/logback-classic-1.5.38.jar" logback-classic-1.3.15.jar
      swap logback-core-1.5.38.jar a855a0fc97b1d06f4efb1c3bba5ebd0eb508d8b58e68e89e4bbc23a85135c883 "$M/ch/qos/logback/logback-core/1.5.38/logback-core-1.5.38.jar" logback-core-1.3.15.jar

      # bake a config-from-env entrypoint. A read-only rootfs means zoo.cfg and the
      # data/log dirs live under writable mounts; ZOO_* env vars override every default.
      install -d "${{targets.destdir}}/usr/bin"
      cat > "${{targets.destdir}}/usr/bin/docker-entrypoint.sh" <<'EOS'
      #!/bin/bash
      set -euo pipefail

      ZK_HOME=/opt/zookeeper
      DATA_DIR="${ZOO_DATA_DIR:-/data}"
      CONF_DIR="${ZOOCFGDIR:-/conf}"
      mkdir -p "$DATA_DIR" "$CONF_DIR" "${ZOO_LOG_DIR:-/var/lib/zookeeper/log}"

      CFG="$CONF_DIR/zoo.cfg"
      {
        echo "dataDir=$DATA_DIR"
        echo "clientPort=${ZOO_CLIENT_PORT:-2181}"
        echo "tickTime=${ZOO_TICK_TIME:-2000}"
        echo "initLimit=${ZOO_INIT_LIMIT:-10}"
        echo "syncLimit=${ZOO_SYNC_LIMIT:-5}"
        echo "maxClientCnxns=${ZOO_MAX_CLIENT_CNXNS:-60}"
        echo "autopurge.snapRetainCount=${ZOO_AUTOPURGE_SNAPRETAINCOUNT:-3}"
        echo "autopurge.purgeInterval=${ZOO_AUTOPURGE_PURGEINTERVAL:-0}"
        echo "admin.serverPort=${ZOO_ADMIN_SERVER_PORT:-8080}"
        # HTTP AdminServer is Jetty-backed; the Jetty 9.4 jars are dropped from this
        # image (only fixable via a prohibited Jetty 12 MAJOR bump). Force it off so
        # ZooKeeper uses the no-op DummyAdminServer. Use 4lw commands for admin.
        echo "admin.enableServer=false"
        echo "4lw.commands.whitelist=${ZOO_4LW_COMMANDS_WHITELIST:-srvr,mntr,ruok,conf,stat,isro}"
        echo "standaloneEnabled=${ZOO_STANDALONE_ENABLED:-true}"
        # ensemble members, e.g. ZOO_SERVERS="server.1=zk1:2888:3888 server.2=zk2:2888:3888"
        if [ -n "${ZOO_SERVERS:-}" ]; then for s in ${ZOO_SERVERS}; do echo "$s"; done; fi
        # any extra raw lines
        if [ -n "${ZOO_CFG_EXTRA:-}" ]; then printf '%s\n' "${ZOO_CFG_EXTRA}"; fi
      } > "$CFG"

      # node identity for an ensemble (ignored in standalone)
      echo "${ZOO_MY_ID:-1}" > "$DATA_DIR/myid"

      exec "$ZK_HOME/bin/zkServer.sh" --config "$CONF_DIR" start-foreground
      EOS
      chmod 0755 "${{targets.destdir}}/usr/bin/docker-entrypoint.sh"

test:
  pipeline:
    - runs: |
        test -f /opt/zookeeper/bin/zkServer.sh
