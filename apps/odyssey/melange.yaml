# Odyssey from the release tag with upstream's build_release (CMake Release). The version comes
# from the tag's VERSION file, so the binary reports the release without git.
package:
  name: quench-odyssey
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Odyssey PostgreSQL connection pooler, built from source on Wolfi"
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - ca-certificates-bundle    # libssl/libcrypto: added by melange from the ELF needs

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - openssl-dev

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/yandex/odyssey/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - runs: |
      set -eu
      test "$(cat VERSION)" = "${{package.version}}"
      mkdir -p build && cd build
      # Wolfi openssl-dev is OpenSSL 4.0: it deprecates X509_NAME_get_text_by_NID and makes
      # X509_get_subject_name return const, two warnings Odyssey's -Werror turns into errors in
      # machinarium/tls.c. Both calls still work on 4.0; keep them as warnings, nothing else.
      cmake .. -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_C_FLAGS="-Wno-error=deprecated-declarations -Wno-error=discarded-qualifiers"
      make -j"$(nproc)"
      install -Dm0755 sources/odyssey "${{targets.destdir}}/usr/bin/odyssey"
      "${{targets.destdir}}/usr/bin/odyssey" --version | grep -F "${{package.version}}"

test:
  pipeline:
    - runs: |
        odyssey --version
