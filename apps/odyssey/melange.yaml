# Odyssey from the release tag with upstream's build_release (CMake Release). The version comes
# from the tag's VERSION file, so the binary reports the release without git.
package:
  name: quench-odyssey
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Odyssey PostgreSQL connection pooler, built from source on Wolfi"
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - ca-certificates-bundle    # libssl/libcrypto: added by melange from the ELF needs

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - openssl-3.6-dev      # openssl-dev resolves to OpenSSL 4.0: Odyssey's TLS code segfaults on it

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/yandex/odyssey/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - runs: |
      set -eu
      test "$(cat VERSION)" = "${{package.version}}"
      mkdir -p build && cd build
      # Against OpenSSL 3.6, not Wolfi's default 4.0: on 4.0 machinarium/tls.c only compiles with
      # two -Werror warnings silenced (deprecated X509_NAME_get_text_by_NID, const subject name),
      # and the result segfaults (exit 139) on the first TLS client. Found 2026-11-11 by the chart gate.
      cmake .. -DCMAKE_BUILD_TYPE=Release
      make -j"$(nproc)"
      install -Dm0755 sources/odyssey "${{targets.destdir}}/usr/bin/odyssey"
      "${{targets.destdir}}/usr/bin/odyssey" --version | grep -F "${{package.version}}"

test:
  pipeline:
    - runs: |
        odyssey --version
