# Odyssey (yandex/odyssey, BSD-3-Clause): a multi-threaded PostgreSQL connection pooler, an
# alternative to PgBouncer for high connection counts. From source via melange (C, CMake), against
# Wolfi OpenSSL; PAM and LDAP auth are left out (both optional at build time), so the runtime is
# libssl only. Releases are rare (1.5.x through 2026). LATEST-ONLY.
FROM_SOURCE=1
VERSIONS=(1.5.2)
declare -A SHA256=(
  [1.5.2]=88b063274fdd9a7f5d191f462cea04b976397f7000f87373dddb9583ab5b2263
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
