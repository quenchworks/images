# komga: Komga (gotson/komga, MIT), a media server for comics, manga, BDs and ebooks (CBZ, CBR, PDF, EPUB) with a
# web reader, OPDS, Kobo and KOReader sync. Images issue #86.
#
# The official release jar (Spring Boot 3.5, Kotlin, Java 17 bytecode) on Wolfi openjdk-21-jre, exploded so the
# vulnerable libraries in BOOT-INF/lib are replaced one jar at a time (zipkin pattern). spring-webmvc/webflux 6.2.19
# keep three CVEs with no 6.2 open-source fix; none is reachable in Komga (see vex.openvex.json). LATEST-ONLY: the
# swaps are measured against one release's lib set.
FROM_SOURCE=0
VERSIONS=(1.30.2)
declare -A SHA256=(
  [1.30.2]=a5736468b0847eb319bf8628760f7853cecb8e52dd23e23855fabebf3e04a43b
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
