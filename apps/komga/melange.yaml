      swap jackson-databind-2.21.4.jar com/fasterxml/jackson/core/jackson-databind/2.21.7/jackson-databind-2.21.7.jar 1290c2795e93e8a6861a6c4d9ff0d844d32f5ea178362cb2721edf5561e828b1
      swap jackson-dataformat-toml-2.21.4.jar com/fasterxml/jackson/dataformat/jackson-dataformat-toml/2.21.7/jackson-dataformat-toml-2.21.7.jar 0485ebff27d1145b228de378259f3060a7ba794e6d75f66ae2cd2db8ab9a395f
