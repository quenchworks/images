# Packages Komga onto Wolfi from the official release jar, exploded so the vulnerable libraries in BOOT-INF/lib can
# be replaced one jar at a time.
package:
  name: quench-komga
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Komga comics, manga and ebook server, on Wolfi"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - openjdk-21-jre
      - ca-certificates-bundle
      # sqlite-jdbc and the imageio natives (webp, jxl, heif) unpack C/C++ libraries at run time
      - libstdc++
      - fontconfig

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      - openjdk-21   # javac for the claim helper only

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/gotson/komga/releases/download/${{package.version}}/komga-${{package.version}}.jar
      expected-sha256: __SHA256__
      extract: false
  - runs: |
      set -eu
      dest="${{targets.destdir}}/usr/lib/komga"
      install -d "$dest"
      unzip -q komga-${{package.version}}.jar -d "$dest"
      lib="$dest/BOOT-INF/lib"
      M=https://repo1.maven.org/maven2
      # swap <shipped jar> <maven path of the fixed jar> <its sha256, from a download checked against Maven's sha1>
      # Each swap asserts the old jar is shipped, so a release that moves a library fails loudly instead of gaining
      # a second copy. classpath.idx and layers.idx are rewritten to the new names: the launcher reads them.
      swap() {
        test -f "$lib/$1" || { echo "FATAL: $1 not shipped; re-audit the swaps"; exit 1; }
        new="$(basename "$2")"
        curl -fsSL -o "$lib/$new" "$M/$2"
        echo "$3  $lib/$new" | sha256sum -c -
        rm -f "${lib:?}/${1:?}"
        sed -i "s|BOOT-INF/lib/$1\"|BOOT-INF/lib/$new\"|" "$dest/BOOT-INF/classpath.idx" "$dest/BOOT-INF/layers.idx"
      }
      # One version per family, the patch release each finding needs (trivy against the 1.30.1 jar, 2026-11-16):
      # jackson 2.21.7, netty 4.1.137 (the 4.1 line: no tcnative in this jar), tomcat-embed 10.1.59, log4j 2.25.5.
