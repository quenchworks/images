# go-httpbin (mccutchen/go-httpbin, MIT): httpbin in one Go binary, an HTTP request and response test
# service (echo, status codes, delays, redirects, auth, streaming) for testing proxies, gateways and
# clients. Images issue #51.
#
# Pure Go, no module dependencies, CGO off, with upstream's goreleaser flags (-s -w -X main.version).
# Listens on 8080; -version prints the stamped version (/version shows it with -use-full-version). LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(2.26.0)
declare -A SHA256=(
  [2.26.0]=3153d733e080fa5c54dbb7daaa07925e203cb19a94666dbd37d3bfd2282f2314
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
