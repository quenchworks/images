# gravitee-management-api: the Gravitee API Management (APIM) management API, the REST
# API behind the console and the portal, from the graviteeio-full-<v>.zip distribution on
# download.gravitee.io (the only public artifact for 4.10+: Maven Central stops at 4.7.8
# and the per-component zips answer 404), pinned by the sha256 of that zip. Two lines,
# newest patch of each.
#
# LICENSE GATE (measured 2026-10-19 on 4.12.23): the full zip ships 168 management API
# plugins; 67 are Gravitee Enterprise plugins (com.graviteesource code and/or a `feature=`
# license key in plugin.properties) and are removed at build time, with
# alert-engine-connectors-ws (no public source). lib/ is checked for Enterprise classes
# (none here). Every kept plugin maps to an Apache-2.0 gravitee-io repository. The recipe
# applies the rule, not a list, so a new EE plugin in a later release is dropped too.
FROM_SOURCE=1
VERSIONS=(4.11.33 4.12.27)
declare -A SHA256=(
  [4.11.33]=4ef52f631301dc0551d22c6a0e3d4d74f515696e4781aecfde309dd13409b890
  [4.12.27]=0fc08fd8df78dda8b39337f97c4da0c2df6bd560e139a6d4943016427478c675
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
