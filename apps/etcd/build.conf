# etcd: from-source via melange (fetch github archive tarball, sha256).
# etcd upstream supports exactly 2 minor lines (3.5 + 3.6); 3.4 is EOL and
# predates the multi-module split (cd server), so the stable buildable set is
# the 2 supported lines at their newest patch (full X.Y.Z, used as-is).
# __VER__ = version  __SHA256__ = that tarball's sha256
FROM_SOURCE=1
VERSIONS=(3.5.31 3.6.12)
declare -A SHA256=(
  [3.5.31]=a3338952ddfdac7bf44c717d52ad5b6a05da1e7405529b684c9d430163035612
  [3.6.12]=43b78c492dd5dd5f012d14af85adf1ea15b25384cd2f8de04d7d68e418e4907a
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
