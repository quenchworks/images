# etcd: from-source via melange (fetch github archive tarball, sha256).
# etcd ships from the newest supported stable line at its newest patch (full
# X.Y.Z, used as-is); 3.4 is EOL and predates the multi-module split (cd server).
# __VER__ = version  __SHA256__ = that tarball's sha256
FROM_SOURCE=1
VERSIONS=(3.7.0)
declare -A SHA256=(
  [3.7.0]=5e54f009d3c80e0fe5a07686a0d1b396016fa095c86fe78cce206322e97c93de
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
