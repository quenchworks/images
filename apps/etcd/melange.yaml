# Builds etcd (server + etcdctl + etcdutl) from source onto Wolfi.
# Output is a signed APK in Quenchworks' own repo. No upstream distro binaries.
package:
  name: quench-etcd
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened etcd, built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/etcd-io/etcd/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      export CGO_ENABLED=0
      export GOWORK=off          # build each module via its own go.mod
      # repo is multi-module: server -> etcd, plus etcdctl and etcdutl.
      # 0-CVE: bump golang.org/x/net v0.54.0 -> v0.55.0 (MINOR, same major)
      # in every module to clear the x/net/html + x/net/idna CVE cluster
      # (CVE-2026-25680/25681/27136/39821/42502/42506). Also bump grpc to v1.82.1
      # for GHSA-hrxh-6v49-42gf (xDS RBAC + HTTP/2, HIGH); grpc@1.82.1 requires the
      # otel@1.43.0 family + x/oauth2@0.36.0, so float that cascade (go mod tidy
      # prunes it from modules that don't import grpc).
      for pair in server:etcd etcdctl:etcdctl etcdutl:etcdutl; do
        dir="${pair%%:*}"; bin="${pair##*:}"
        ( cd "$dir" \
            && go get golang.org/x/net@v0.58.0 golang.org/x/text@v0.41.0 \
            && go get google.golang.org/grpc@v1.82.1 \
                 go.opentelemetry.io/otel@v1.43.0 go.opentelemetry.io/otel/sdk@v1.43.0 \
                 go.opentelemetry.io/otel/trace@v1.43.0 go.opentelemetry.io/otel/metric@v1.43.0 \
                 golang.org/x/oauth2@v0.36.0 \
            && go mod tidy \
            && go build -trimpath -ldflags "-s -w" \
                -o "${{targets.destdir}}/usr/bin/${bin}" . )
      done

test:
  pipeline:
    - runs: |
        etcd --version
        etcdctl version
