# Builds etcd (server + etcdctl + etcdutl) from source onto Wolfi.
# Output is a signed APK in Quenchworks' own repo. No upstream distro binaries.
package:
  name: quench-etcd
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened etcd, built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/etcd-io/etcd/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      export CGO_ENABLED=0
      export GOWORK=off          # build each module via its own go.mod
      # repo is multi-module: server -> etcd, plus etcdctl and etcdutl.
      # 0-CVE: bump golang.org/x/net v0.54.0 -> v0.55.0 (MINOR, same major)
      # in every module to clear the x/net/html + x/net/idna CVE cluster
      # (CVE-2026-25680/25681/27136/39821/42502/42506).
      for pair in server:etcd etcdctl:etcdctl etcdutl:etcdutl; do
        dir="${pair%%:*}"; bin="${pair##*:}"
        ( cd "$dir" \
            && go get golang.org/x/net@v0.55.0 \
            && go mod tidy \
            && go build -trimpath -ldflags "-s -w" \
                -o "${{targets.destdir}}/usr/bin/${bin}" . )
      done

test:
  pipeline:
    - runs: |
        etcd --version
        etcdctl version
