# flatnotes from the release tag: the Vue client (npm + vite) and the FastAPI server in a venv over Wolfi packages.
package:
  name: quench-flatnotes
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened flatnotes Markdown note app, built from source on Wolfi"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - python-3.13
      - py3.13-cryptography
      - py3.13-cffi
      - ca-certificates-bundle
      - tzdata

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - nodejs-24
      - npm
      - python-3.13
      - py3.13-pip
      - py3.13-cryptography
      - py3.13-cffi
      - uv

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/dullage/flatnotes/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - name: Client (npm + vite) with the security overrides
    runs: |
      set -eu
      export HOME="$(mktemp -d)" npm_config_cache="$(mktemp -d)" npm_config_fetch_retries=5
      # axios 1.19.0 (HIGH, fixed 1.20.0; a direct dependency, so pinned, not overridden) and DOMPurify 2.5.8 (fixes
      # only on 3.x) end up in the bundle
      node -e 'const f="package.json",p=JSON.parse(require("fs").readFileSync(f));p.dependencies.axios="1.20.0";p.overrides={...(p.overrides||{}),dompurify:"^3.4.17"};require("fs").writeFileSync(f,JSON.stringify(p,null,2))'
      npm install --include=dev --no-audit --no-fund
      node -e 'for (const m of ["axios","dompurify"]) console.log(m, require("./node_modules/"+m+"/package.json").version)'
      npm run build
      test -f client/dist/index.html

  - name: Server venv (native packages from Wolfi) and layout
    runs: |
      set -eu
      export HOME="$(mktemp -d)" PIP_NO_CACHE_DIR=1
      # the startup base-href rewrite writes index.html every start; write only when it changes (read-only rootfs)
      sed -i 's|^    with open(html_file, "w", encoding="utf-8") as f:|    if updated_html == html:\n        return\n    with open(html_file, "w", encoding="utf-8") as f:|' server/helpers.py
      grep -q 'if updated_html == html:' server/helpers.py || { echo "FATAL: base-href patch did not apply"; exit 1; }
      uv export --frozen --no-dev --no-hashes --no-emit-project --no-emit-package cryptography --no-emit-package cffi --no-emit-package pycparser > req.txt
      a="${{targets.destdir}}/app"
      install -d "$a"
      python3.13 -m venv --system-site-packages "$a/venv"
      "$a/venv/bin/pip" install -q -r req.txt
      # floors over uv.lock: starlette 0.48.0 (CVE-2025-62727 ... CVE-2026-54283, last fix in 1.3.1; FastAPI 0.141.1
      # accepts starlette>=0.46) and pyasn1 0.6.4 (CVE-2026-119194..119197, fixed 0.6.5)
      "$a/venv/bin/pip" install -q 'starlette>=1.3.1' 'pyasn1>=0.6.5'
      "$a/venv/bin/pip" check
      test ! -e "$a/venv/lib/python3.13/site-packages/cryptography" || { echo "FATAL: cryptography installed into the venv instead of from Wolfi"; exit 1; }
      "$a/venv/bin/python" -m pip uninstall -y -q pip
      sed -i "s|${{targets.destdir}}||g" "$a/venv/pyvenv.cfg" "$a"/venv/bin/*
      ! grep -rq "${{targets.destdir}}" "$a/venv/bin" "$a/venv/pyvenv.cfg"
      cp -r server "$a/server"
      install -d "$a/client"
      cp -r client/dist "$a/client/dist"

test:
  pipeline:
    - runs: |
        cd /app && /app/venv/bin/python -c "import fastapi, uvicorn, whoosh, jose, cryptography"
        test -f /app/client/dist/index.html
