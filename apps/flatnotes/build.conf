# flatnotes: flatnotes (dullage/flatnotes, MIT), a database-less Markdown note app on a plain folder of files with
# full-text search, tags, wikilinks and optional auth (password, TOTP). Images issue #93.
#
# From the release tag: the Vue client built with npm (axios 1.20.0 and DOMPurify 3 overridden: the 2.5.8 fixes are
# on 3.x), the FastAPI server in a venv over Wolfi's py3.13-cryptography/cffi (system OpenSSL) with the rest of
# uv.lock pip'ed in. The startup base-href rewrite skips its write when nothing changes, so the default (no path
# prefix) runs on a read-only rootfs. Notes and the search index live in /data. LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(5.5.5)
declare -A SHA256=(
  [5.5.5]=f8973e42576d29b82d0b580d31af154670b3069debca658d9a73f2ff528ab160
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
