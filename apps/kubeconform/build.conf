# kubeconform (yannh/kubeconform, Apache-2.0): a fast Kubernetes manifest validator against JSON schemas, CRDs included. Image only, no chart.
#
# From the release tag with the house Go floors and the otel 1.47 family loop (the cosign recipe), version
# stamped like upstream's goreleaser. LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(0.8.0)
declare -A SHA256=(
  [0.8.0]=c345de9c3207f2d24628c64fe3cb9bed55c4248b12c181efe81ee907d6c994f2
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
