# php: Wolfi-packaged PHP. Tag is the FULL X.Y.Z (matches what Wolfi's php-<minor>
# currently resolves, like node); the apk pulled is the minor line php-<X.Y>, so
# render maps __VER__ -> the minor. If Wolfi bumps a line's patch, bump the
# matching full version here (scripts/check/php.py reports drift).
FROM_SOURCE=0
VERSIONS=(8.3.31 8.4.22 8.5.7)
render() { echo "s/__VER__/${1%.*}/g"; }