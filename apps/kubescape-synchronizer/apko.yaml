# Kubescape synchronizer image (a Kubescape Operator component). Nonroot.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-kubescape-synchronizer@local

accounts:
  groups:
    - groupname: synchronizer
      gid: 1001
  users:
    - username: synchronizer
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/bin/client

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-kubescape-synchronizer"
  org.opencontainers.image.licenses: "Apache-2.0"
