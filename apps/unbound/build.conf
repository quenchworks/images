# unbound: NLnet Labs Unbound, the validating, recursive, caching DNS resolver, built
# from source on Wolfi (openssl, libevent, expat; dnscrypt via libsodium, like Wolfi's
# own build). Wolfi packages 1.25.1; upstream's newest is 1.26.1.
#
# The image ships a nonroot config: port 5053 (no NET_BIND_SERVICE needed; a Service
# maps 53 to it), no chroot or privilege drop, foreground, log to stderr, answers only
# private ranges, DNSSEC validation on. The root trust anchors are the DS records
# compiled into unbound-anchor at this version, extracted at build time, so a rebuild
# picks up a new KSK once Unbound ships it.
#
# NEWEST-ONLY: NLnet Labs supports one release line.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(1.26.1)
# sha256 from a download, matches nlnetlabs.nl's published .sha256
declare -A SHA256=(
  [1.26.1]=35a6dc0e425a9282c3426d9a3043144011bf0534aed4b73ab62c52aee0af1503
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
