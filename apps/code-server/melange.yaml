# Packages code-server (VS Code in the browser) onto Wolfi. code-server is NOT built
# from source here: an upstream build needs a full Node/yarn toolchain and a VS Code
# compile — infeasible on a 2-core GitHub runner. Instead we ship coder's OWN official
# per-arch prebuilt release tarball, which bundles a self-contained Node 24 + the
# compiled VS Code, then harden it on a minimal apko base and gate it 0-CVE with Trivy.
# Clean-room-consistent: it is upstream's published artifact, not a Bitnami chart.
# The bundled `lib/node` links glibc + libstdc++ + libgcc_s (verified via ldd), so those
# are the runtime deps; bash/busybox back the integrated terminal.
package:
  name: quench-code-server
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened code-server (VS Code in the browser), packaged on Wolfi"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - glibc                  # bundled node links libc/libm/libdl/libpthread
      - libstdc++              # bundled node links libstdc++.so.6
      - libgcc                 # bundled node links libgcc_s.so.1
      - ca-certificates-bundle
      - bash                   # integrated terminal / extension shell tasks
      - busybox                # basic coreutils for the integrated terminal

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - curl
      - ca-certificates-bundle
      - binutils               # readelf for the Rust .dep-v0 check

pipeline:
  # coder publishes separate amd64/arm64 prebuilt tarballs, so fetch the one matching
  # the build arch by uname -m (x86_64->amd64, aarch64->arm64) with the arch-matching
  # sha256 — the wrong arch yields a non-executable bundled node. The tarball extracts
  # to code-server-<ver>-linux-<charch>/ containing bin/, lib/node (bundled Node), lib/
  # vscode, out/ (server assets + entry.js) and node_modules; we install the whole tree
  # read-only under /usr/lib/code-server and exec the bundled node directly (no wrapper).
  - runs: |
      VER="${{package.version}}"
      case "$(uname -m)" in
        x86_64)  charch=amd64; sha=__SHA_AMD__ ;;
        aarch64) charch=arm64; sha=__SHA_ARM__ ;;
        *) echo "unsupported arch $(uname -m)" >&2; exit 1 ;;
      esac

      url="https://github.com/coder/code-server/releases/download/v${VER}/code-server-${VER}-linux-${charch}.tar.gz"
      curl -fsSL -o code-server.tgz "$url"
      echo "${sha}  code-server.tgz" | sha256sum -c -
      tar -xzf code-server.tgz

      src="code-server-${VER}-linux-${charch}"
      dest="${{targets.destdir}}/usr/lib/code-server"
      install -d "$dest"
      cp -a "$src/." "$dest/"
      # the bundled launcher is `node <root> "$@"`; make sure node stays executable
      chmod 0755 "$dest/lib/node"

      # Drop the built-in microsoft-authentication extension: its native MSAL runtime
      # (libmsalruntime.so / msal-node-runtime.node) links the whole desktop GNOME/GTK
      # stack — libsoup-3.0, libwebkit2gtk, libgtk-3, libsecret, libX11, libdbus — none
      # of which exist on Wolfi, so melange's SCA would emit unsatisfiable so: depends
      # and apko can't assemble the image. The extension needs the desktop MSAL broker
      # and does nothing on code-server (no MS-account settings-sync here); GitHub auth
      # is a separate extension and is unaffected. Removing it is the hardening win:
      # it strips the only binaries pulling a GTK/webkit attack surface.
      rm -rf "$dest/lib/vscode/extensions/microsoft-authentication"

      # Remove the built-in "npm" extension (npm-scripts explorer view). Its package.json
      # is named "npm" at version "1.0.1", so Trivy's node-pkg analyzer collides it with
      # the npm CLI and reports a swarm of historical npm-CLI CVEs — pure false positives
      # (this is the VS Code extension, not the npm CLI, which isn't even shipped). npm
      # still runs fine from the integrated terminal; only the scripts side-panel is gone.
      rm -rf "$dest/lib/vscode/extensions/npm"

      # Rust blind spot (2026-10-13): Trivy reads crates only from a .dep-v0 section or a
      # shipped Cargo.lock, and none of the bundled Rust binaries has either. The GitHub
      # Copilot agent natives (extensions/copilot with @github/copilot, the core
      # @github/copilot-sdk-linux-* runtime, tgrep) and the @microsoft/mxc-sdk agent
      # sandbox binaries are closed prebuilts: no source, no lock, and the copilot
      # runtime.node links rustls 0.23.42 (GHSA-2mjx) and ammonia 4.1.3 (CVE-2026-102342),
      # which no recipe can fix. They are removed, as VSCodium does; VS Code loads both
      # lazily (dynamic import / runtime lookup), so the editor runs without them and the
      # chat panel offers the extension instead. Core search keeps @vscode/ripgrep-universal
      # rg, built from ripgrep tag 15.0.0: its tag Cargo.lock ships beside it.
      rm -rf "$dest/lib/vscode/extensions/copilot" "$dest/lib/vscode/node_modules/@microsoft/mxc-sdk/bin"
      rm -rf "$dest"/lib/vscode/node_modules/@github/copilot-sdk-linux-*
      rg="$(ls "$dest"/lib/vscode/node_modules/@vscode/ripgrep-universal/bin/*/rg)"
      case "$("$rg" --version | head -1)" in
        "ripgrep 15.0.0 (rev 3a612f88b8)") ;;
        *) echo "bundled rg is not ripgrep 15.0.0 rev 3a612f88b8; ship its tag Cargo.lock"; "$rg" --version; exit 1 ;;
      esac
      curl -fsSL -o rg.Cargo.lock https://raw.githubusercontent.com/BurntSushi/ripgrep/3a612f88b805e14aef45bfa43e25a54abc6297fc/Cargo.lock
      echo "257bfa1eeacfa4d8222e2c50f9d2f8d15ef07e96adee46eaa87839f3b6cfa3b4  rg.Cargo.lock" | sha256sum -c -
      install -Dm0644 rg.Cargo.lock "$dest/lib/vscode/node_modules/@vscode/ripgrep-universal/Cargo.lock"
      # Every Rust artifact must carry .dep-v0 or ship beside a Cargo.lock (same dir or a parent).
      find "$dest" -type f -size +100k | while read -r f; do
        LC_ALL=C grep -qa -e 'cargo/registry/src' -e 'rustc version' "$f" || continue
        readelf -S "$f" 2>/dev/null | grep -q dep-v0 && continue
        d="$(dirname "$f")"; while [ "$d" != "$dest" ] && [ ! -e "$d/Cargo.lock" ]; do d="$(dirname "$d")"; done
        [ -e "$d/Cargo.lock" ] && continue
        echo "Rust artifact with neither .dep-v0 nor a Cargo.lock: ${f#$dest}"; exit 1
      done

      # Bump the vendored pure-JS deps that carry FIXABLE CVEs to their upstream fixed
      # versions. This is a security update, not a gate weaken — same major line, same
      # (already-hoisted) transitive deps, so each is a drop-in: tar 7.5.21 (CVE-2026-59873
      # gzip-bomb DoS + CVE-2026-59874/59871 + GHSA-r292-9mhp-454m mapHas/filesFilter
      # uncontrolled-recursion DoS), js-yaml 4.3.0 (CVE-2026-59869), shell-quote
      # 1.9.0 (CVE-2026-13311), body-parser 2.3.0 (CVE-2026-12590). npm tarballs extract
      # 2026-08-17: js-yaml moved 4.3.0 -> 4.3.1 -- the 4.3.0 pin placed for
      # CVE-2026-59869 had itself become the finding. These pins age; re-check each round.
      # under package/. sha256 pinned (version-independent of the code-server release).
      patch_pkg() {  # <target-node_modules-dir> <name> <url> <sha256>
        curl -fsSL -o pkg.tgz "$3"
        echo "$4  pkg.tgz" | sha256sum -c -
        rm -rf npmpkg && mkdir npmpkg && tar -xzf pkg.tgz -C npmpkg
        rm -rf "$1/$2" && mkdir -p "$1/$2"
        cp -a npmpkg/package/. "$1/$2/"
      }
      patch_pkg "$dest/lib/vscode/node_modules" tar         https://registry.npmjs.org/tar/-/tar-7.5.21.tgz                bcedf25a21daecd1a18fb5e19ab855b7d79ec8ef1da175e8ba85cfc0ed0069d1
      # shell-quote 1.11.0: CVE-2026-102422 (CRITICAL, 2026-10-07) on the 1.9.0 pin; no deps, CJS as before
      patch_pkg "$dest/lib/vscode/node_modules" shell-quote https://registry.npmjs.org/shell-quote/-/shell-quote-1.11.0.tgz 028be526afacb2bf5c6c008a95d5435b5d205135f68bb48afd0bb947610393f1
      patch_pkg "$dest/node_modules"            js-yaml     https://registry.npmjs.org/js-yaml/-/js-yaml-4.3.2.tgz c7b241d2224cf9253ff53854aa4cee87da91bd889c4d0fa3a3ffd1041ecee5b1
      patch_pkg "$dest/node_modules"            qs          https://registry.npmjs.org/qs/-/qs-6.16.0.tgz                f7a1bfc96c3a0c1172f1f3ef3c280f5ce8054841922e715f0d686da62d7beba4
      # ip-address -> 10.7.1 and undici -> 7.29.1 (CVE-2026-101910/-101911/-101912/-101913, CVE-2026-85024), both vendored under
      # lib/vscode/node_modules (Trivy PkgPath named the exact tree).
      patch_pkg "$dest/lib/vscode/node_modules" ip-address  https://registry.npmjs.org/ip-address/-/ip-address-10.7.1.tgz   7f99ac7abda701afe1fd1e36de462236fb4d1eb8c595d7ae0267bba7d8ee55f8
      patch_pkg "$dest/node_modules"            ip-address  https://registry.npmjs.org/ip-address/-/ip-address-10.7.1.tgz   7f99ac7abda701afe1fd1e36de462236fb4d1eb8c595d7ae0267bba7d8ee55f8
      patch_pkg "$dest/lib/vscode/node_modules" undici      https://registry.npmjs.org/undici/-/undici-7.29.1.tgz           93b3abe22a9d2858938b5f3829a9fd8952392348ffed9057662ae846e2e46d54
      patch_pkg "$dest/node_modules"            body-parser https://registry.npmjs.org/body-parser/-/body-parser-2.3.0.tgz 031d7f6c5142e31be91d36a43f541f02a505943e3b871aa44ef5fb6939be258e
      # compression 1.8.2 (CVE-2026-87776, HIGH) and katex 0.18.2 (CVE-2026-103923, LOW; same
      # dual CJS/ESM entry points as the vendored 0.16.22), 2026-10-06 scan.
      patch_pkg "$dest/node_modules"            compression https://registry.npmjs.org/compression/-/compression-1.8.2.tgz 15e46c301ad6468d3838cfc0dbfca3024220ef12f8a43b8156846691011537a6
      # compression 1.8.2 newly depends on destroy 1.2.0 (no deps of its own), absent from the tree
      patch_pkg "$dest/node_modules"            destroy     https://registry.npmjs.org/destroy/-/destroy-1.2.0.tgz         8dfd27e86cf54949a76ab5171df6c242d8b007d3ace136b67984fd64a171cfa8
      patch_pkg "$dest/lib/vscode/node_modules" katex       https://registry.npmjs.org/katex/-/katex-0.18.2.tgz            a71df261a7080b53a4be44ea1b40e8e73e84cdd5d3311239310568e76437c018
      # basic-ftp 5.3.1 -> 6.2.1 (GHSA-c475-qrg2-pj4r, 2026-10-04; fixed only on 6.x, whose one
      # break is no separate transfer hosts by default). Every copy, wherever the proxy agent sits.
      n=0
      for d in $(find "$dest" -type d -path '*/node_modules/basic-ftp'); do
        patch_pkg "$(dirname "$d")" basic-ftp https://registry.npmjs.org/basic-ftp/-/basic-ftp-6.2.1.tgz ce98b3508df1292431a7f591747385ceef971b55030aea32c976a3715dbe455e
        n=$((n+1))
      done
      [ "$n" -gt 0 ] || { echo "no basic-ftp in the tree; drop this patch"; exit 1; }

      # GHSA-wx77-rp39-c6vg (ReDoS in the `markdown` npm package, fixed: null) is
      # a name-collision false positive, same shape as the npm-extension FP above:
      # the only "markdown" package.json in the whole tree is VS Code's built-in
      # markdown-basics grammar extension (name:"markdown", version:"30.0.0", no
      # JS logic, just tmLanguage/snippets), not evilstreak/markdown-js. It is
      # NOT removed -- unlike the npm-scripts panel, this is core Markdown syntax
      # highlighting, and there is no real vulnerable code shipped to fix.

test:
  pipeline:
    - runs: |
        test -x /usr/lib/code-server/lib/node
        test -f /usr/lib/code-server/out/node/entry.js
        /usr/lib/code-server/lib/node /usr/lib/code-server --version
