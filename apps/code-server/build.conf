# Ship LATEST ONLY: code-server bundles a per-release Node + vendored extensions;
# older lines (4.127/4.128) carry a different lib/extension layout whose deps do
# not resolve in apko after the 4.129-tuned strip. Newest is validated 0-CVE.
# code-server (coder/code-server): VS Code in the browser. NOT built from source —
# an upstream source build needs a huge Node/yarn toolchain and a full VS Code
# compile. Instead we ship coder's OWN official per-arch prebuilt release tarball
# (code-server-<ver>-linux-{amd64,arm64}.tar.gz), which bundles a self-contained
# Node 24 runtime + the compiled VS Code. This is the same upstream-artifact pattern
# clickhouse/kafka use: it is upstream's published artifact, not a Bitnami chart, and
# the 0-CVE Trivy scan still fully applies (the bundled Node is the CVE surface).
# Latest 3 stable lines, newest last. Each per-arch tarball is sha256-pinned:
#   __VER__     = version
#   __SHA_AMD__ = linux-amd64 tarball sha256   __SHA_ARM__ = linux-arm64 tarball sha256
FROM_SOURCE=0
VERSIONS=(4.138.0)
declare -A SHA_AMD=(
  [4.138.0]=5d63f26c5dabc2acd29610b9b27f413b016aa67019e2cfcdf54031625e18f535
)
declare -A SHA_ARM=(
  [4.138.0]=fbebf4b18e97a5a48b7b105be0161d411e54ccfb53a1ffb1673c16518024fa30
)
render() {
  echo "s/__VER__/$1/g; s|__SHA_AMD__|${SHA_AMD[$1]}|g; s|__SHA_ARM__|${SHA_ARM[$1]}|g"
}
