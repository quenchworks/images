# Warpgate bastion: nonroot uid 1001, config and data under /data (WARPGATE_CONFIG). Create the config
# with `warpgate setup` (or `unattended-setup`) once, then `warpgate run`.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-warpgate@local

accounts:
  groups:
    - groupname: warpgate
      gid: 1001
  users:
    - username: warpgate
      uid: 1001
      gid: 1001
      homedir: /data
  run-as: 1001

paths:
  - path: /data
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o750

environment:
  WARPGATE_CONFIG: /data/warpgate.yaml
  DOCKER: "1"

entrypoint:
  command: /usr/bin/warpgate
cmd: run

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-warpgate"
  org.opencontainers.image.licenses: "Apache-2.0"
