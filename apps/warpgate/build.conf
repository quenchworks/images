# warpgate: Warpgate, the bastion (jump host) for SSH, HTTPS, MySQL, PostgreSQL, Kubernetes, RDP and VNC
# (github.com/warp-tech/warpgate, Apache-2.0), built from source (#109). Upstream pins a nightly toolchain
# for two library features (gethostname, once_cell_try); Wolfi's stable rust builds them with
# RUSTC_BOOTSTRAP=1.
FROM_SOURCE=1
VERSIONS=(0.30.4)
declare -A SHA256=(
  [0.30.4]=e9f2ee2097e4fce8837752347b51ddad55aa1bce9b938ac141a6dde81b7f2142
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
