# Warpgate, built from source on Wolfi as upstream's Dockerfile does: the web UI (npm ci, the OpenAPI
# clients through openapi-generator on a JRE, vite build) embedded into the Rust binary, with the mysql,
# postgres and rdp-openssl-tls features. cargo auditable keeps the crate list in the binary for the scanner.
package:
  name: quench-warpgate
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Warpgate bastion, built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - libssl3

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - cargo-auditable
      - git
      - nodejs-24
      - npm
      - openjdk-21-default-jdk   # openapi-generator-cli runs java from PATH
      - openssl-dev
      - perl
      - rust-1.98
  environment:
    npm_config_allow_remote: all
    npm_config_allow_git: all
    # two unstable library features (warpgate-core gethostname, warpgate-protocol-rdp once_cell_try)
    RUSTC_BOOTSTRAP: "1"
    SOURCE_DATE_EPOCH: "0"

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/warp-tech/warpgate/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      set -eu
      cd warpgate-web
      npm ci --no-audit --no-fund
      npm run openapi:client:admin
      npm run openapi:client:gateway
      npm run build
      cd ..
      # crate floors (cargo update rewrites Cargo.lock; --locked then holds the build to it)
      # russh 0.65.1: CVE-2026-128087 (two LOW on 0.65.0). Not 0.65.2: it moves to pkcs1 ^0.8, which the
      # vendored picky (ironrdp) pins to =0.8.0-rc.4; 0.65.1 keeps the same rc pins as 0.65.0
      cargo update -p russh --precise 0.65.1
      grep -A1 '^name = "russh"$' Cargo.lock | grep -q '^version = "0.65.1"$'
      # warpgate stamps its version from `git describe --tags` at compile time (git_version!, fallback
      # "unknown"); the release tarball has no .git, so tag a local commit of the tree as built
      git init -q
      git add -A
      git -c user.name=quenchworks -c user.email=build@quench-works.com commit -qm "warpgate v${{package.version}}"
      git tag "v${{package.version}}"
      test "$(git describe --tags --always --dirty=-modified --match 'v[0-9]*')" = "v${{package.version}}"
      cargo auditable build --release --locked --features mysql,postgres,rdp-openssl-tls
      install -Dm755 target/release/warpgate "${{targets.destdir}}/usr/bin/warpgate"
      "${{targets.destdir}}/usr/bin/warpgate" version | grep -F "${{package.version}}"
      readelf -S "${{targets.destdir}}/usr/bin/warpgate" | grep -q dep-v0
