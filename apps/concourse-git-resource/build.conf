# concourse-git-resource: Concourse's git resource type (concourse/git-resource), shell
# scripts on git, git-lfs, git-crypt, gnupg, jq and openssh, with proxytunnel built from its
# release tag for the https_tunnel option. Image only: pipelines load it with
# resource_types (type: registry-image). It is not bundled into the Concourse worker
# because a rootfs.tgz would hide its packages from the scanner. Latest line only; the
# sha256 is from a download of the tag archive on 2026-09-30.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(1.24.1)
declare -A SHA256=(
  [1.24.1]=ee8b7810afb55fbe17545f907c9afe675466cd9f66d97a0cd214df92ba46e099
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
