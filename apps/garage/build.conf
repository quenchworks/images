# garage: melange repackages the prebuilt per-arch musl binary (sha256-verified).
# Latest 3 stable minor lines (full X.Y.Z, used as-is). Per-arch sha256.
# __VER__ = version  __SHA_AMD__ = x86_64-musl sha256  __SHA_ARM__ = aarch64-musl sha256
FROM_SOURCE=1
VERSIONS=(2.1.0 2.2.0 2.3.0)
declare -A SHA_AMD=(
  [2.1.0]=543b0414d1464ab855ebe9b843938a5e5361fd24436891ce3dff9e03d02839d8
  [2.2.0]=ec761bb996e8453e86fe68ccc1cf222c73bb1ef05ae0b540bd4827e7d1931aab
  [2.3.0]=f98d317942bb341151a2775162016bb50cf86b865d0108de03eb5db16e2120cd
)
declare -A SHA_ARM=(
  [2.1.0]=65a1bedc9b6d5a2df788b55e81cb0013129326478fd94cf83a844ab278e8055f
  [2.2.0]=3922bd3524e5267587a27fec91e4d8447353113ea3a55e2d1786a53d7529d1da
  [2.3.0]=8ced2ad3040262571de08aa600959aa51f97576d55da7946fcde6f66140705e2
)
render() { echo "s/__VER__/$1/g; s|__SHA_AMD__|${SHA_AMD[$1]}|g; s|__SHA_ARM__|${SHA_ARM[$1]}|g"; }
