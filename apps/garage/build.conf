# garage: built FROM SOURCE at the release tag with cargo auditable (see melange.yaml).
# Latest stable minor lines (full X.Y.Z, used as-is). __COMMIT__ = the tag commit.
#
# 2026-10-13: 2.2.0 DROPPED from VERSIONS. Built from source with the release features it
# still compiles rustls-webpki 0.101.7 (GHSA-82j2-j2ch-gfr8 HIGH, GHSA-965h-392x-2mh5,
# GHSA-xgp8-3hg3-c2mh) through kube 0.88 -> hyper-rustls 0.24 -> rustls 0.21, and 0.101
# has no fixed release; 2.3.0 moved to kube 3 (a dependency-tree rewrite, not a floor).
# The chart pins 2.3.0. The published 2.2.0 tag (prebuilt binary) stays in GHCR but is no
# longer in the lock, so it is no longer scanned.
FROM_SOURCE=1
VERSIONS=(2.3.0 2.4.1)
declare -A COMMIT=(
  [2.3.0]=7b119c0b4fa58ab3cb6d5db435fe52d990f6a7aa
  [2.4.1]=268334bd2530fa99f8b06c7383b2e9f776691edd
)
render() { echo "s/__VER__/$1/g; s|__COMMIT__|${COMMIT[$1]}|g"; }
