# gotosocial: GoToSocial (codeberg.org/superseriousbusiness/gotosocial, AGPL-3.0), a lightweight ActivityPub
# server for the fediverse with a Mastodon-compatible client API, on SQLite or PostgreSQL. Images issue #59.
#
# Built as upstream's goreleaser does (CGO off, its tags, -X main.Version) plus nootel: the OpenTelemetry
# exporters pin otel 1.44 and grpc 1.81, and the otel 1.47 train that fixes them breaks code on the old log
# API. Floors on the vendored tree: house golang.org/x set, x/image 0.45.0, go-jose 4.1.6, klauspost/compress
# 1.18.7, quic-go 0.59.1. The web bundle is built with yarn (web/source). Layout as upstream's image:
# /gotosocial/gotosocial and /gotosocial/web, storage and SQLite under /gotosocial/storage (the volume).
# busybox lets the chart's init container create the admin idempotently. LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(0.22.3)
declare -A SHA256=(
  [0.22.3]=c7096b06f6a70136414926a659da57b4b3c75edcbd79d052d2880898e473e6bb
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
