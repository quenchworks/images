# GoToSocial from the release tag (vendored), CGO off with upstream's tags plus nootel, and its web bundle.
package:
  name: quench-gotosocial
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened GoToSocial, built from source on Wolfi"
  copyright:
    - license: AGPL-3.0-or-later
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.26          # go.mod: go 1.26.10
      - nodejs-24
      - yarn

pipeline:
  - uses: fetch
    with:
      uri: https://codeberg.org/superseriousbusiness/gotosocial/archive/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - name: Build gotosocial
    runs: |
      set -eu
      export CGO_ENABLED=0 GOFLAGS=-mod=mod GOTOOLCHAIN=local
      FLOOR="golang.org/x/crypto@v0.58.1-0.20261009181718-2f1f834330b2 golang.org/x/net@v0.62.0 golang.org/x/sys@v0.49.0 golang.org/x/text@v0.43.0 golang.org/x/image@v0.45.0 github.com/go-jose/go-jose/v4@v4.1.6 github.com/klauspost/compress@v1.18.7 github.com/quic-go/quic-go@v0.59.1"
      MODS="$(echo "$FLOOR" | tr ' ' '\n' | cut -d@ -f1)"
      below_floor() {
        awk -v floor="$FLOOR" -v tag="$1" '
          BEGIN { n = split(floor, f, " ")
                  for (i = 1; i <= n; i++) { split(f[i], kv, "@"); want[kv[1]] = kv[2] } }
          ($1 in want) {
            split(substr($2, 2), g, "."); split(substr(want[$1], 2), w, ".")
            for (i = 1; i <= 3; i++) {
              if ((g[i] + 0) > (w[i] + 0)) next
              if ((g[i] + 0) < (w[i] + 0)) { print $1 "@" want[$1] " (" tag " has " $2 ")"; next }
            }
          }'
      }
      need="$(go list -m -e $MODS | awk 'NF >= 2 && $NF ~ /^v[0-9]/ { print $1, $NF }' | below_floor go.mod | awk '{ print $1 }')"
      if [ -n "$need" ]; then go get $need; fi
      # the tree is vendored: the floats must reach vendor/
      go mod tidy
      go mod vendor
      go build -mod=vendor -trimpath \
        -tags "netgo osusergo static_build timetzdata nomsgpack stdlibjson nootel" \
        -ldflags "-s -w -X main.Version=${{package.version}}" \
        -o "${{targets.destdir}}/gotosocial/gotosocial" ./cmd/gotosocial
      bad="$(go version -m "${{targets.destdir}}/gotosocial/gotosocial" | awk '$1 == "dep" || $1 == "=>" { print $2, $3 }' | below_floor gotosocial)"
      [ -z "$bad" ] || { echo "float did not reach the binary:"; echo "$bad"; exit 1; }
      ! go version -m "${{targets.destdir}}/gotosocial/gotosocial" | grep -q 'go.opentelemetry.io/otel/sdk'
      "${{targets.destdir}}/gotosocial/gotosocial" --version | grep -F "${{package.version}}"

  - name: Web bundle
    runs: |
      set -eu
      export HOME="$(mktemp -d)" YARN_CACHE_FOLDER="$(mktemp -d)"
      yarn --cwd ./web/source install --frozen-lockfile --non-interactive
      yarn --cwd ./web/source ts-patch install
      yarn --cwd ./web/source build
      install -d "${{targets.destdir}}/gotosocial/web"
      cp -a web/assets web/template "${{targets.destdir}}/gotosocial/web/"
      test -d "${{targets.destdir}}/gotosocial/web/assets/dist"

test:
  pipeline:
    - runs: /gotosocial/gotosocial --version
