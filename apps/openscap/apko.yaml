contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - openscap=__REL__
    - scap-security-guide=__SSG__

accounts:
  groups:
    - groupname: oscap
      gid: 1001
  users:
    - username: oscap
      uid: 1001
      gid: 1001
      homedir: /home/oscap
  run-as: 1001

work-dir: /home/oscap

entrypoint:
  command: /usr/bin/oscap

cmd: --version

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-openscap"
  org.opencontainers.image.licenses: "LGPL-2.1-or-later"
