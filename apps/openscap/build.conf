# openscap: OpenSCAP (LGPL-2.1-or-later), the SCAP scanner (`oscap`: XCCDF/OVAL evaluation,
# datastream validation, reports), from Wolfi's pinned openscap apk plus its
# scap-security-guide content under /usr/share/xml/scap/ssg/content (FROM_SOURCE=0).
# Newest only. Image only, no chart. Runs as uid 1001; to scan a mounted host or
# container root (oscap-chroot), run it as root with the root bind-mounted read-only.
BLOCKED=0
FROM_SOURCE=0
VERSIONS=(1.4.4)
declare -A PIN=( [1.4.4]=1.4.4-r10 )
declare -A SSG=( [1.4.4]=0.1.82-r1 )
render() { local v=$1; echo "s/__VER__/$v/g; s/__REL__/${PIN[$v]}/g; s/__SSG__/${SSG[$v]}/g"; }
