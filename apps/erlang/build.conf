# erlang: Wolfi-packaged Erlang/OTP, latest 3 major bands (27/28/29).
# VERSIONS holds full versions (as-is tags; note OTP uses up to 4 parts); PKG
# maps each to erlang-N (apko.yaml's __PKG__). Keep in sync with Wolfi.
FROM_SOURCE=0
VERSIONS=(27.3.4.16 28.5.0.5 29.0.5)
declare -A PKG=(
  [27.3.4.16]=erlang-27
  [28.5.0.5]=erlang-28
  [29.0.5]=erlang-29
)
render() { echo "s|__PKG__|${PKG[$1]}|g"; }
