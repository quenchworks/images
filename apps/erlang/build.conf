FROM_SOURCE=0
VERSIONS=(27.3.4.16 28.5.0.5 29.0.5)
declare -A PKG=(
  [27.3.4.16]=erlang-27
  [28.5.0.5]=erlang-28
  [29.0.5]=erlang-29
)
render() { echo "s|__PKG__|${PKG[$1]}|g"; }
