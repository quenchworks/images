# metrics-server: from-source via melange (Go build from the git tag tarball).
# Image-only (a cluster metrics API server, no chart). NEWEST-ONLY: just the latest
# stable release (kubernetes-sigs/metrics-server tags are `vX.Y.Z`). Single static
# Go binary, CGO disabled (matches the upstream Makefile: CGO_ENABLED=0 -trimpath).
# Version is stamped via -X k8s.io/client-go/pkg/version.gitVersion (that is what
# `metrics-server --version` prints via version.Get().GitVersion); gitCommit and
# buildDate get static, reproducible values since the tarball has no git context.
FROM_SOURCE=1
VERSIONS=(0.9.1)
declare -A SHA256=(
  [0.9.1]=c4794210ff5903e5335b07315ae6e662b7568a33397b776f9c9f753b5a641569
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
