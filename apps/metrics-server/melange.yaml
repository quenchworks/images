# Builds Kubernetes metrics-server from source onto Wolfi. Single static Go binary,
# no CGO (matches the upstream Makefile: CGO_ENABLED=0 -trimpath). The main package is
# sigs.k8s.io/metrics-server/cmd/metrics-server. Version metadata is stamped via -X onto
# k8s.io/client-go/pkg/version.* so `metrics-server --version` reports the real release
# (the flag prints version.Get().GitVersion). gitCommit/buildDate get static, reproducible
# values (the tarball build has no git context). go-1.26 is pinned (newest, clears stdlib
# CVE advisories) with GOTOOLCHAIN=local so go.mod's `go 1.24.12` directive does not trigger
# a toolchain download. Output is a signed APK in Quenchworks' own repo. No upstream distro
# binaries. Image-only (metrics API server, no chart).
package:
  name: quench-metrics-server
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Kubernetes metrics-server, built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-1.26

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/kubernetes-sigs/metrics-server/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      export GOTOOLCHAIN=local      # use the installed go-1.26, do not fetch go.mod's toolchain
      # 0-CVE dep bumps: safe upgrades over the versions the v0.8.1 go.mod pins, to
      # clear fixable advisories the Trivy gate flags.
      go get golang.org/x/crypto@v0.55.0
      go get golang.org/x/net@v0.58.0 golang.org/x/text@v0.41.0
      go get google.golang.org/grpc@v1.79.3
      go get go.opentelemetry.io/otel/sdk@v1.43.0
      # prometheus/prometheus v0.304.2 carries fixable CVEs (CVE-2026-42151/42154 HIGH,
      # CVE-2026-40179/44903 MEDIUM); the only version fixing all four is v0.311.3. That
      # bump pulls the k8s.io/* stack from v0.33.7 to v0.35.3, so the whole set is bumped
      # in lockstep to keep k8s.io/apiserver consistent. v0.311.3 also changes the
      # textparse.New signature (now (b, contentType, *SymbolTable, ParserOptions)), so
      # the sole caller pkg/scraper/client/resource/decode.go is patched to match.
      go get github.com/prometheus/prometheus@v0.311.3
      go get k8s.io/apiserver@v0.35.3 k8s.io/component-base@v0.35.3 \
        k8s.io/apimachinery@v0.35.3 k8s.io/api@v0.35.3 k8s.io/client-go@v0.35.3
      sed -i 's#textparse.New(b, "text/plain", "", false, false, nil)#textparse.New(b, "text/plain", nil, textparse.ParserOptions{})#' \
        pkg/scraper/client/resource/decode.go
      PKG=k8s.io/client-go/pkg
      go build -trimpath \
        -ldflags "-s -w \
          -X ${PKG}/version.gitVersion=v${{package.version}} \
          -X ${PKG}/version.gitCommit=unknown \
          -X ${PKG}/version.buildDate=1970-01-01T00:00:00Z" \
        -o "${{targets.destdir}}/usr/bin/metrics-server" sigs.k8s.io/metrics-server/cmd/metrics-server
