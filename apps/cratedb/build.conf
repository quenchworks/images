# cratedb: the official CrateDB tarball from cdn.crate.io, on a Wolfi JRE instead of the
# JDK it bundles. FROM_SOURCE=0. The tarball is per arch even without its JDK: the
# OpenDAL jar in lib/ embeds its native library for one architecture only (the x64
# tarball on aarch64 dies loading the S3 repository plugin). crate.io publishes no
# checksum file; each sha256 is from our own download.
#
# 6.4 ONLY for now. 6.3.7 additionally needs the netty family (4.2.16 to 4.2.17) and a
# different log4j line (2.25.3 to 2.25.5) swapped. Measured 2026-09-26.
FROM_SOURCE=0
VERSIONS=(6.4.7 6.5.1)
declare -A SHA256=(
  [6.4.7]=7316c2f36966fe62837e79ae47454e33cc037c3cf36a5cff1127b8976dc65e69
  [6.5.1]=34447463c7342a71d433fbf87437a10f7200dd926fa855dc8fcc70fbbdb9eb5f
)
declare -A SHA256_ARM=(
  [6.4.7]=7b843a20575d724f4db6a6c8da6a00611a4f751652fadfd4f8224693d44d6fed
  [6.5.1]=e6986f5490f37656639ec81f72fca9c105a65ede0c1f06df2083fbb0de07034f
)
# JDK per line: the bundled JDK is 25 on 6.4; 6.5 is compiled for Java 26 (class file 70)
jdk() { case "$1" in 6.4.*) echo 25 ;; *) echo 26 ;; esac; }
render() { echo "s/__VER__/$1/g; s|__SHA_AMD__|${SHA256[$1]}|g; s|__SHA_ARM__|${SHA256_ARM[$1]}|g; s/__JDK__/$(jdk "$1")/g"; }
