# cratedb: the official CrateDB tarball from cdn.crate.io, on a Wolfi JRE instead of the
# JDK it bundles. FROM_SOURCE=0. The tarball is per arch even without its JDK: the
# OpenDAL jar in lib/ embeds its native library for one architecture only (the x64
# tarball on aarch64 dies loading the S3 repository plugin). crate.io publishes no
# checksum file; each sha256 is from our own download.
#
# 6.4 ONLY for now. 6.3.7 additionally needs the netty family (4.2.16 to 4.2.17) and a
# different log4j line (2.25.3 to 2.25.5) swapped. Measured 2026-09-26.
FROM_SOURCE=0
VERSIONS=(6.4.5)
declare -A SHA256=(
  [6.4.5]=71b0e1acbb85c278a779a3176f773e4122a0a71869b990aa05f645885865507d
)
declare -A SHA256_ARM=(
  [6.4.5]=b783229f8e28153cdf89363d320b5ffad55108e18d6beab38808e8e7ce066d63
)
render() { echo "s/__VER__/$1/g; s|__SHA_AMD__|${SHA256[$1]}|g; s|__SHA_ARM__|${SHA256_ARM[$1]}|g"; }
