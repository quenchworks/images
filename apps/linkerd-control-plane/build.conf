# linkerd-control-plane (linkerd/linkerd2 monorepo): from-source via melange.
# Builds the `controller` binary from ./controller/cmd -- a SINGLE Go binary
# that dispatches to destination / heartbeat / identity / proxy-injector /
# sp-validator / service-mirror by subcommand (controller/cmd/main.go is a
# plain os.Args[1] switch over those six Main() funcs). Same shape as istiod's
# pilot-discovery: one binary, many roles; the chart (not built here) picks
# the role per Deployment via container args/command override.
#
# UPSTREAM RELEASE CADENCE -- VERIFIED, NOT ASSUMED:
# `gh api repos/linkerd/linkerd2/releases` (460+ tags) shows every release
# since 2024 is edge-YY.M.P. The last stable-* release was stable-2.14.10,
# published 2024-02-20 -- over 2.5 years ago (`gh api .../tags | grep stable`
# confirms stable-2.14.10 is newest of 57 stable-* tags, and no stable-*
# release postdates it). Buoyant (Linkerd's commercial steward) now gates true
# "stable" builds behind its own paid channel; linkerd/linkerd2 itself only
# cuts edge-YY.M.P. This matches the note already recorded on the roadmap
# entry ("this tracks Linkerd EDGE"). So "last 3 stable minor lines" is read
# as "last 3 edge year.month lines", the same per-line-newest-patch resolution
# istiod uses for its X.Y minor lines:
#   edge-26.6.3 (newest of .1/.2/.3), edge-26.7.2 (newest of .1/.2),
#   edge-26.8.4 (newest of .1/.2/.3/.4) -- confirmed against the real tag list.
#
# Version is NOT an ldflag: pkg/version/version.go's init() reads
# $LINKERD_CONTAINER_VERSION_OVERRIDE and only uses it because the linked-in
# Version var is left at "dev-undefined" (verified by reading the source, not
# guessed) -- Dockerfile.controller sets this as a plain container ENV, not a
# -ldflags -X. apko.yaml sets the same env var; nothing is stamped at
# `go build` time.
#
# Go toolchain: go.mod pins go 1.26.7 at edge-26.8.4 (1.26.4 at edge-26.7.2,
# 1.25.11 at edge-26.6.3) -- Wolfi's unpinned `go` package tracks current
# stable and satisfies all three, same as istiod's own unpinned `go`.
#
# Source is the same linkerd2 monorepo tarball the linkerd-policy-controller
# app fetches (same tag, same sha256) -- they just build different subtrees
# of it.
FROM_SOURCE=1
VERSIONS=(26.7.2 26.8.4 26.9.3)
declare -A SHA256=(
  [26.7.2]=26d57d8ef51365ed48f4e57f6f0096911ca8d4955f3ad47002fb8667d8f3da39
  [26.8.4]=35b7537c190508944f8d738c22855e8214cbce7b39a19b9a38850bb1758b17d7
  [26.9.3]=b78c1f45ecc946bb96e3214a2131756a3ff4114e75d78f268652c60de5620894
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
