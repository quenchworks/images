# Builds linkerd-control-plane (Linkerd's `controller` binary) from source on
# Wolfi. linkerd/linkerd2 is a single Go module (github.com/linkerd/linkerd2)
# covering the whole monorepo; `controller` is built from ./controller/cmd,
# which os.Args[1]-dispatches to destination/heartbeat/identity/proxy-injector/
# sp-validator/service-mirror -- confirmed by reading controller/cmd/main.go,
# not assumed. Dockerfile.controller builds it CGO_ENABLED=0 with `-tags prod
# -ldflags "-s -w"` and NO version ldflag: the version is bound at container
# build/run time via $LINKERD_CONTAINER_VERSION_OVERRIDE, read once at process
# init by pkg/version/version.go. apko.yaml sets that env var; nothing here
# needs a -X flag.
package:
  name: quench-linkerd-control-plane
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Linkerd control plane (controller: destination, identity, proxy-injector, sp-validator, service-mirror, heartbeat), built from source on Wolfi. Tracks Linkerd's edge-__VER__ release -- Buoyant gates true 'stable' builds commercially; linkerd/linkerd2 itself only cuts edge (see build.conf)."
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/linkerd/linkerd2/archive/refs/tags/edge-${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      export CGO_ENABLED=0
      export GOTOOLCHAIN=auto
      export GOFLAGS=-mod=mod
      # 0-CVE float. Run 35219866920, the first build this recipe ever reached the
      # gate with, flagged 6 modules. FLOOR is a FLOOR, not a pin: only modules
      # BELOW their floor are floated, so a module the graph already carries higher
      # is left alone and a bare `go get mod@ver` cannot walk one backwards.
      FLOOR="golang.org/x/crypto@v0.56.0 golang.org/x/text@v0.39.0 google.golang.org/grpc@v1.83.2 github.com/containerd/containerd@v1.7.35 oras.land/oras-go/v2@v2.6.2"
      # An entry that falls outside the quotes is run as a command and silently
      # drops out of the list, which is how a float becomes inert. Assert the count.
      n=0
      for e in $FLOOR; do
        case "$e" in *@v*) n=$((n + 1)) ;; *) echo "FLOOR entry carries no @version: $e"; exit 1 ;; esac
      done
      [ "$n" = 5 ] || { echo "FLOOR parsed as $n entries, expected 5 -- check the quoting"; exit 1; }
      below_floor() {
        awk -v floor="$1" -v tag="$2" '
          BEGIN { n = split(floor, f, " ")
                  for (i = 1; i <= n; i++) { split(f[i], kv, "@"); want[kv[1]] = kv[2] } }
          ($1 in want) {
            split(substr($2, 2), g, "."); split(substr(want[$1], 2), w, ".")
            for (i = 1; i <= 3; i++) {
              if ((g[i] + 0) > (w[i] + 0)) next
              if ((g[i] + 0) < (w[i] + 0)) { print $1 "@" want[$1] " (" tag " has " $2 ")"; next }
            }
          }'
      }
      # `go list -m` prints "<mod> <ver>" or "<mod> <ver> => <mod> <ver>", so $NF is
      # the EFFECTIVE version and a replace cannot hide behind the require line.
      # -e tolerates a module this version does not require.
      mods="$(echo "$FLOOR" | tr ' ' '\n' | cut -d@ -f1)"
      need="$(go list -m -e $mods | awk 'NF >= 2 && $NF ~ /^v[0-9]/ { print $1, $NF }' \
              | below_floor "$FLOOR" go.mod | awk '{ print $1 }')"
      if [ -n "$need" ]; then go get $need; fi
      go build -trimpath \
        -tags prod \
        -ldflags "-s -w" \
        -o "${{targets.destdir}}/usr/bin/controller" ./controller/cmd
      # A float that does not reach the BINARY is an inert pin. Materialise the
      # linked module list into a file and assert it is non-empty first: a check
      # that answers "clean" because it could not see is worse than no check.
      go version -m "${{targets.destdir}}/usr/bin/controller" \
        | awk '$1 == "dep" || $1 == "=>" { print $2, $3 }' > linked-modules.txt
      [ -s linked-modules.txt ] || { echo "go version -m listed no modules -- cannot verify"; exit 1; }
      bad="$(below_floor "$FLOOR" controller < linked-modules.txt)"
      [ -z "$bad" ] || { echo "0-CVE float did not reach the binary:"; echo "$bad"; exit 1; }
      # Same trick istiod uses, for the same reason: read controller/cmd/destination
      # main.go before assuming this, don't guess. The paragraph below held when it
      # was written and NO LONGER DOES at edge-26.8.4: pkgK8s.EndpointSliceAccess
      # now runs before the informers and log.Fatalf's when it cannot reach the API
      # server, so an unreachable kubeconfig kills the process rather than being
      # retried. test.sh passes -enable-endpoint-slices=false -enable-ipv6=false to
      # get past it. Re-read main.go on every version bump; this comment has already
      # been wrong once. Its k8s client construction
      # (pkgK8s.NewAPI / k8s.InitializeAPI) only PARSES the kubeconfig -- no dial
      # happens until the informers' List/Watch calls, which run after the admin
      # HTTP server is already started in its own goroutine. What DOES block main()
      # is the later `k8sAPI.Sync(nil)` call, which waits forever for cache sync
      # against a server that can't be reached. Net effect: with NO kubeconfig at
      # all the process dies (rest.InClusterConfig() with no in-cluster env fails
      # immediately); with a syntactically-valid but UNREACHABLE one, it behaves
      # like a real destination pod before RBAC/networking is wired up -- the admin
      # server (metrics, /ping, /ready) comes up and stays up, informers retry and
      # log connection errors, and the gRPC destination server never proceeds past
      # Sync(). Ship the fake kubeconfig so the image can prove it boots for real. A
      # real deployment overrides --kubeconfig with in-cluster config; the chart
      # (not built in this task) owns that override.
      install -d "${{targets.destdir}}/etc/linkerd"
      cat > "${{targets.destdir}}/etc/linkerd/kubeconfig" <<'EOF'
      apiVersion: v1
      kind: Config
      clusters:
      - cluster:
          server: https://127.0.0.1:6443
          insecure-skip-tls-verify: true
        name: standalone
      contexts:
      - context:
          cluster: standalone
          user: standalone
        name: standalone
      current-context: standalone
      users:
      - name: standalone
        user:
          token: standalone-test-token
      EOF
  - uses: strip
