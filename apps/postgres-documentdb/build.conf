# STATUS: UNBLOCKED 2026-09-20. The zlib block is gone: Wolfi shipped the fix
# for CVE-2026-85091 as zlib 1.3.2.1_rc20260601-r0 and the advisory was amended
# to name that version, so the 1.3.3-r0 this file used to wait for is a number
# that will never arrive. A stock wolfi-base scan reports the advisory as
# `zlib 1.3.2-r7 -> 1.3.2.1_rc20260601-r0`, which is what Wolfi publishes on
# both arches today. scripts/blocked.py now watches the shipped version.
#
# Evidence, stated exactly as measured:
#   x86_64  gated locally 2026-09-20, PUSH=0: 0 fixable CVEs AND the boot test
#           passed, so this is "runs", not just "scans clean".
#   aarch64 not measured locally; this host kills background melange builds and
#           a qemu-emulated arm build does not fit the foreground timeout. CI's
#           native arm64 runner is the first arm measurement, and its gate
#           refuses to publish on any finding.
# postgres-documentdb: from-source via melange (PostgreSQL extension; built from
# the FerretDB/documentdb fork on postgresql-17). The image version is the
# documentdb extension version (e.g. 0.107.0); the source git tag carries a
# FerretDB suffix (v<ver>-ferretdb-<x.y.z>), so SRCTAG maps it and COMMIT pins it.
# The other git-checkouts (intelrdfpmath, mongo-c-driver, rum) are fixed build
# deps, independent of the documentdb version. Latest 3 FerretDB releases.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(0.105.0 0.106.0 0.107.0)
declare -A SRCTAG=(
  [0.105.0]=v0.105.0-ferretdb-2.4.0
  [0.106.0]=v0.106.0-ferretdb-2.5.0
  [0.107.0]=v0.107.0-ferretdb-2.7.0
)
declare -A COMMIT=(
  [0.105.0]=8453d93b4be7ef4ccd7dbdc218ce89ef27f1f331
  [0.106.0]=beb9d25d9845477c85559d3293cd1f929cdf2b9c
  [0.107.0]=e63835403de6ee285cea32410a765f26f1572727
)
render() { echo "s/__VER__/$1/g; s|__SRCTAG__|${SRCTAG[$1]}|g; s/__COMMIT__/${COMMIT[$1]}/g"; }
