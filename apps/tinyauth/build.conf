# Tinyauth (tinyauthapp/tinyauth, AGPL-3.0): a small login server for ingress forward auth
# (Traefik, Nginx, Caddy) with local users, TOTP, OAuth, LDAP and an OIDC provider. From source via
# melange: pnpm builds the React frontend into internal/assets/dist (embedded), go builds
# ./cmd/tinyauth CGO-free. Node never reaches the runtime image.
# LATEST-ONLY: per-release frontend toolchains.
FROM_SOURCE=1
VERSIONS=(5.2.0)
declare -A SHA256=(
  [5.2.0]=5fec14cb1a7cf43ef5c9dafc9fa9fba6fcbc2d8fd328cd5a78dd42aae4c0efde
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
