# tomee: Apache TomEE (Tomcat plus the Jakarta EE stack: OpenEJB, OpenWebBeans,
# MyFaces, CXF). We ship the official webprofile binary distribution on a hardened
# Wolfi JRE, the same shape as apps/tomcat. FROM_SOURCE=0: fetch + unpack only.
# Newest stable line only (10.x; 11.0 is still a milestone). The dist is fetched
# from archive.apache.org, which keeps every release (dlcdn drops old ones).
# Sized 2026-10-07: trivy rootfs over the unpacked 10.2.0 webprofile (161 jars,
# Tomcat 10.1.57 inside) reported 0 fixable.
BLOCKED=0
FROM_SOURCE=0
VERSIONS=(10.2.0)
declare -A SHA256=(
  [10.2.0]=b1143cbf3647160e88ba925bf0de5668d089d96e4f563bf3eeba2a33daf005ec
)
render() { echo "s/__VER__/$1/g; s/__SHA256__/${SHA256[$1]}/g"; }
