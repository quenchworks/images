# Packages Apache TomEE (webprofile) onto Wolfi: the upstream binary distribution
# on a hardened Wolfi JRE, same shape as apps/tomcat. The demo webapps are
# stripped; bin/ lib/ conf/ are kept.
package:
  name: quench-tomee
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Apache TomEE, packaged on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - openjdk-21-jre
      - busybox            # the entrypoint is a small /bin/sh script

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle

pipeline:
  - uses: fetch
    with:
      uri: https://archive.apache.org/dist/tomee/tomee-${{package.version}}/apache-tomee-${{package.version}}-webprofile.tar.gz
      expected-sha256: "__SHA256__"
      strip-components: 1
  - runs: |
      dest="${{targets.destdir}}/opt/tomee"
      install -d "$dest"
      cp -r bin lib conf LICENSE NOTICE RELEASE-NOTES "$dest/"
      chmod -R a+rX "$dest"
      # Windows launchers, the .original script copies and the native tarballs
      # (commons-daemon, tomcat-native sources) are not used by the entrypoint.
      find "$dest/bin" \( -name '*.bat' -o -name '*.exe' -o -name '*.original' -o -name '*.tar.gz' \) -delete
      # empty webapps/: no ROOT, docs, manager or host-manager (GET / -> 404)
      install -d "$dest/webapps"
      # logs, temp and work live on /tmp so the rootfs can be read-only
      ln -s /tmp/tomee/logs "$dest/logs"
      ln -s /tmp/tomee/temp "$dest/temp"
      ln -s /tmp/tomee/work "$dest/work"

      # Execs java directly with what `catalina.sh run` adds for TomEE: the
      # Tomcat module opens and the OpenEJB javaagent.
      install -d "${{targets.destdir}}/usr/bin"
      cat > "${{targets.destdir}}/usr/bin/docker-entrypoint.sh" <<'EOS'
      #!/bin/sh
      set -eu

      CATALINA_HOME=/opt/tomee
      CATALINA_BASE="${CATALINA_BASE:-/opt/tomee}"

      mkdir -p /tmp/tomee/logs /tmp/tomee/temp /tmp/tomee/work

      exec "$JAVA_HOME/bin/java" \
        "-javaagent:$CATALINA_HOME/lib/openejb-javaagent.jar" \
        ${JAVA_OPTS:-} \
        ${CATALINA_OPTS:-} \
        -Djava.util.logging.config.file="$CATALINA_BASE/conf/logging.properties" \
        -Djava.util.logging.manager=org.apache.juli.ClassLoaderLogManager \
        -Djdk.tls.ephemeralDHKeySize=2048 \
        -Djava.protocol.handler.pkgs=org.apache.catalina.webresources \
        -Dorg.apache.catalina.security.SecurityListener.UMASK=0027 \
        --add-opens=java.base/java.lang=ALL-UNNAMED \
        --add-opens=java.base/java.lang.reflect=ALL-UNNAMED \
        --add-opens=java.base/java.io=ALL-UNNAMED \
        --add-opens=java.base/java.util=ALL-UNNAMED \
        --add-opens=java.base/java.util.concurrent=ALL-UNNAMED \
        --add-opens=java.rmi/sun.rmi.transport=ALL-UNNAMED \
        -Dcatalina.base="$CATALINA_BASE" \
        -Dcatalina.home="$CATALINA_HOME" \
        -Djava.io.tmpdir=/tmp/tomee/temp \
        -classpath "$CATALINA_HOME/bin/bootstrap.jar:$CATALINA_HOME/bin/tomcat-juli.jar" \
        org.apache.catalina.startup.Bootstrap "$@" start
      EOS
      chmod 0755 "${{targets.destdir}}/usr/bin/docker-entrypoint.sh"

test:
  pipeline:
    - runs: |
        test -f /opt/tomee/bin/bootstrap.jar
        test -f /opt/tomee/lib/openejb-javaagent.jar
        ls /opt/tomee/lib/openejb-core-*.jar
