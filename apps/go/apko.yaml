# Assembles a hardened Go toolchain (SDK) image directly from Wolfi's own
# versioned `go-1.X` packages. No Dockerfile, NO melange build -- apko pulls the
# pinned `go-__VER__` package straight from the Wolfi `os` repository, so each
# minor version is a pure package-assembly.
#
# IMAGE-ONLY -- no Helm chart. This is a LANGUAGE/SDK image: the 0-CVE, signed,
# nonroot, multi-arch answer to `golang:1.x`. Developers `FROM` it to build their
# Go programs (like Chainguard's go image) or `docker run <img> build ...`.
#
# TEMPLATE NOTE: `__VER__` is a build-time placeholder. CI substitutes the
# minor version (1.24 / 1.25 / 1.26) per matrix entry with `sed` before apko
# runs, so this single file covers every shipped version.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - __PKG__                   # the pinned Go toolchain minor from Wolfi (go-1.N)
                                  # (pulls bash + build-base for cgo as deps)

accounts:
  groups:
    - groupname: nonroot
      gid: 1001
  users:
    - username: nonroot
      uid: 1001
      gid: 1001
  run-as: 1001

# The `go` driver as the entrypoint: `docker run <img> version`,
# `docker run <img> build ...`, etc.
entrypoint:
  command: /usr/bin/go

# The Go toolchain needs WRITABLE caches. On a read-only rootfs these MUST live
# under a writable mount (a tmpfs / volume on /tmp), so we point them there.
# GOTOOLCHAIN=local pins the image's own toolchain -- no network download of a
# different toolchain version at build time.
environment:
  HOME: /tmp
  GOCACHE: /tmp/gocache
  GOPATH: /tmp/go
  GOTOOLCHAIN: local
  GOFLAGS: -buildvcs=false

work-dir: /home/nonroot

paths:
  - path: /home/nonroot
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o755

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-go"
  org.opencontainers.image.licenses: "BSD-3-Clause"
