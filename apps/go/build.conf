# go: Wolfi-packaged Go toolchain, latest 3 minor lines.
# VERSIONS holds the full X.Y.Z versions, used AS-IS as the image tag.
# Wolfi names the package by minor (go-1.N), so PKG maps each full version to
# its exact Wolfi package. apko.yaml's `__PKG__` is replaced with PKG[version].
FROM_SOURCE=0
VERSIONS=(1.26.7)
declare -A PKG=(
  [1.26.7]=go-1.26
)
render() { echo "s|__PKG__|${PKG[$1]}|g"; }
