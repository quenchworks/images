# go: Wolfi-packaged Go toolchain.
# VERSIONS holds the full X.Y.Z versions, used AS-IS as the image tag.
# Wolfi names the package by minor (go-1.N), so PKG maps each full version to
# its exact Wolfi package. apko.yaml's `__PKG__` is replaced with PKG[version].
#
# Upstream Go supports the two most recent minor lines, so that is what we ship:
# once 1.N+1 is GA, 1.N-1 stops getting security fixes and comes out of VERSIONS.
# Wolfi has go-1.26 at 1.26.8-r0 and go-1.27 at 1.27.1-r0 as of 2026-09-17.
FROM_SOURCE=0
VERSIONS=(1.26.8 1.27.1)
declare -A PKG=(
  [1.26.8]=go-1.26
  [1.27.1]=go-1.27
)
render() { echo "s|__PKG__|${PKG[$1]}|g"; }
