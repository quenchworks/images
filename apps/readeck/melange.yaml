# Readeck from the release tag with upstream's Makefile, linked to Wolfi's libsqlite3.
package:
  name: quench-readeck
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Readeck, built from source on Wolfi"
  copyright:
    - license: AGPL-3.0-only
  dependencies:
    runtime:
      - ca-certificates-bundle
      - sqlite-libs
      - tzdata

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-1.27          # go.mod: go 1.27.4 at 0.23.6
      - make
      - nodejs-24
      - npm
      - py3.13-babel     # locales and docs: upstream runs messages.py with babel
      - python-3.13
      - sqlite-dev

pipeline:
  - uses: fetch
    with:
      uri: https://codeberg.org/readeck/readeck/archive/${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - runs: |
      set -eu
      export HOME="$(mktemp -d)" npm_config_cache="$(mktemp -d)" GOFLAGS=-mod=mod GOTOOLCHAIN=local
      FLOOR="golang.org/x/crypto@v0.58.1-0.20261009181718-2f1f834330b2 golang.org/x/net@v0.62.0 golang.org/x/sys@v0.49.0 golang.org/x/text@v0.43.0 github.com/go-chi/chi/v5@v5.4.0 github.com/go-jose/go-jose/v4@v4.1.6"
      MODS="$(echo "$FLOOR" | tr ' ' '\n' | cut -d@ -f1)"
      below_floor() {
        awk -v floor="$FLOOR" -v tag="$1" '
          BEGIN { n = split(floor, f, " ")
                  for (i = 1; i <= n; i++) { split(f[i], kv, "@"); want[kv[1]] = kv[2] } }
          ($1 in want) {
            split(substr($2, 2), g, "."); split(substr(want[$1], 2), w, ".")
            for (i = 1; i <= 3; i++) {
              if ((g[i] + 0) > (w[i] + 0)) next
              if ((g[i] + 0) < (w[i] + 0)) { print $1 "@" want[$1] " (" tag " has " $2 ")"; next }
            }
          }'
      }
      need="$(go list -m -e $MODS | awk 'NF >= 2 && $NF ~ /^v[0-9]/ { print $1, $NF }' | below_floor go.mod | awk '{ print $1 }')"
      if [ -n "$need" ]; then go get $need; fi
      go mod tidy
      ( cd web && npm ci --no-audit --no-fund )
      make generate build PYTHON=python3 UV=none VERSION=${{package.version}} \
        BUILD_TAGS="netgo osusergo libsqlite3 sqlite_omit_load_extension sqlite_foreign_keys sqlite_json1 sqlite_fts5 sqlite_secure_delete"
      install -Dm755 dist/readeck "${{targets.destdir}}/usr/bin/readeck"
      bad="$(go version -m dist/readeck | awk '$1 == "dep" || $1 == "=>" { print $2, $3 }' | below_floor readeck)"
      [ -z "$bad" ] || { echo "float did not reach the binary:"; echo "$bad"; exit 1; }
      # linked to the system SQLite, not mattn's bundled copy
      readelf -d dist/readeck | grep -q 'libsqlite3.so'
      "${{targets.destdir}}/usr/bin/readeck" version | grep -F "${{package.version}}"

test:
  pipeline:
    - runs: readeck version
