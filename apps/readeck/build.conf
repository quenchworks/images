# readeck: Readeck (codeberg.org/readeck/readeck, AGPL-3.0), a read-it-later and bookmark manager that
# saves full article text and images, with highlights, labels, collections and e-book export. Images
# issue #54.
#
# Upstream's Makefile: templ generate, the web bundle (npm + gulp), docs and locales (Python babel), then
# go build with cgo SQLite and upstream's tags, plus libsqlite3 so SQLite is Wolfi's sqlite-libs (a
# scanned apk) instead of mattn's bundled amalgamation. Floors: the house golang.org/x set, go-chi 5.4.0,
# go-jose 4.1.6. Serves on 8000; config.toml and data under /readeck (the volume).
# LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(0.23.5)
declare -A SHA256=(
  [0.23.5]=698ae6925efda031de36b34572c6b59474df52d2cac5e1d5947e862adebb833c
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
