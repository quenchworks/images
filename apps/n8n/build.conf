# UNBLOCKED 2026-07-09: n8n 2.29.9 now builds + passes the 0-CVE gate + boots (smoke test:
# GET / -> 200, /healthz -> ok). The whole flagged transitive CVE class (ai-sdk/*, ws, uuid,
# fast-xml-parser, axios, form-data, protobufjs, qs, semver, tar, nodemailer, ajv, langsmith,
# @opentelemetry/*, @azure/identity, ...) is cleared IMAGE-SIDE via npm `overrides` in the
# melange recipe (each flagged dep pinned to its Trivy "Fixed version"; scoped keys for the
# ones with a direct-dep copy). Two build regressions were also fixed there: npm >=12 refuses
# the xlsx CDN "remote" dep (EALLOWREMOTE) -> aliased to the @e965/xlsx registry mirror; and
# npm >=12 blocks dependency install scripts by default -> re-enabled with
# --dangerously-allow-all-scripts so the sqlite3 native binding installs. See melange.yaml.
#
# n8n: from the official npm distribution. n8n ships as the npm package `n8n` (exactly
# what `npm install -g n8n` installs) — an immutable registry tarball with a published
# sha256. The recipe fetches that tarball, installs PRODUCTION deps in a melange `runs`
# step (network is available at build time; the native sqlite3 driver compiles via
# node-gyp / node-pre-gyp), then runs `node bin/n8n start` on Wolfi nodejs-22.
#
# LATEST-3 stable lines. n8n's dist-tags gate stability: `stable`/`latest` point at the
# current release; the 2.29.x line is still `next`/`beta` and is NOT shipped. All three
# shipped lines require Node >=22.22 (package.json engines), which Wolfi nodejs-22
# (22.23.x) satisfies, so one Node major builds every line.
#
# LICENSE — CAUTION: n8n is fair-code, NOT OSI open source. Code is under the n8n
# Sustainable Use License v1.0 (internal-business / non-commercial / personal use, no
# resale, keep notices); files with ".ee." in the name/dir need a commercial n8n
# Enterprise License. See LICENSE.md / LICENSE_EE.md in the package.
FROM_SOURCE=1
VERSIONS=(2.29.9)
declare -A SHA256=(
  [2.29.9]=e3dd0308dc6c6f3fb85448084a0c1bd7013b44441c390856218ec0d17d9da9e4
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
