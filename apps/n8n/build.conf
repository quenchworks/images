# 2026-09-14 CVE sweep: bumped 2.32.7 -> 2.38.7 (current `stable`/`latest` npm dist-tag) to
# clear 17 n8n-AUTHORED CVEs (CVE-2026-86073/74/75/76/77/78/79/80/81/82/83/84/85 +
# CVE-2026-86993/94/95/96): unauthenticated OAuth DCR storage exhaustion, two expression-
# sandbox escapes, OAuth/OIDC/webhook/project-scope bypasses, ReDoS, path injection. Every
# fix version Trivy lists (2.37.7 / 2.38.1 / 2.38.2) requires Node >=24 in package.json
# engines — n8n 2.33.0-2.35.x still wants >=22.22, but 2.36.0 onward hard-requires Node 24,
# so there is no way to clear these while staying on nodejs-22. Verified nodejs-24 exists in
# Wolfi (both arches) and that the recipe's one native module, sqlite3, ships N-API
# (napi-v3/v6) prebuilds — ABI-stable across Node majors, so no native-recompile risk from
# the Node bump. Also re-verified image-side, against a REAL `npm install` of the 2.38.7
# tree (not just registry metadata):
#   * toml 3.0.0 -> 4.2.0 (CVE-2026-63376/77465, transitive via snowflake-sdk's config
#     parser). 3->4 is a major but `toml.parse()` is unchanged; smoke-tested.
#   * multer ^2.2.0 -> 2.3.0 direct-dep bump (CVE-2026-77037/77078/82333 HIGH + 77063 LOW).
#   * js-yaml -> 4.3.2 (CVE-2026-84375, transitive, was completely UNPINNED before — added).
#   * mysql2 -> 3.23.1 (GHSA-3f6p HIGH + GHSA-rgwj MEDIUM zlib-inflate DoS; transitive via
#     @langchain/community/@n8n/typeorm/n8n-nodes-base, all dedupe onto one copy).
#   * sanitize-html override raised 2.17.5 -> 2.17.7 (CVE-2026-63670 + 84371, two advisories
#     landed ON the prior fix version).
#   * qs override raised 6.15.2 -> 6.16.0 (CVE-2026-82417/82562).
#   * adm-zip override raised 0.6.0 -> 0.6.1 for CVE-2026-76845 (symlink arbitrary-file-
#     overwrite). OSV's affected/fixed data for this CVE is self-contradictory (lists 0.6.0
#     as both "last_affected" and "fixed"); diffing the v0.6.0 vs v0.6.1 tags on GitHub
#     shows 0.6.1 is what actually ADDS the lstat-based `assertPathSafe` symlink guard, so
#     0.6.0 is still vulnerable and 0.6.1 is the real fix.
#   * nodemailer direct-dep bump 9.0.1 -> 9.1.1 (three more advisories landed on 9.0.1/9.1.0
#     since the last pin: GHSA-2x7j/8m3c/cc9r/wmmp).
#   * csv-parse: n8n 2.38.7 already bumped its OWN direct dep to 7.0.2 upstream (was 6.2.1 in
#     2.32.7) -- no override needed; 6->7 has no breaking changes per upstream CHANGELOG
#     ("7.0.0 ... there is no breaking changes").
#   * @opentelemetry/core: n8n 2.38.7 already ships 2.10.0 direct (was 2.7.1) -- past the
#     2.8.0 fix floor on its own, so the dependencies-bump + override pair for it is DROPPED
#     (no longer needed; keeping a redundant pin just to pin is noise).
# BLOCKED (not touched, see melange.yaml for the full evidence): stream-json CVE-2026-71429
# (GHSA-528h) fixes only at 3.5.0, but 3.x is a from-scratch rewrite (pure ESM, renamed
# Assembler.js -> assembler.js, changed the base parser's return shape) that breaks
# @n8n/backend-common's `require("stream-json/Assembler")` + `.on()` usage at runtime even
# after fixing the module path/case -- verified by actually requiring the patched tree and
# calling parseFlattedAsync(), which throws deep inside Assembler.connectTo. The CVE's own
# advisory says the vulnerable code (pick/ignore/filter/replace path filters) is not what
# n8n calls (it only uses the base parser + Assembler, which the advisory explicitly
# excludes), so the real-world exposure is nil, but Trivy still flags the package version.
# Fixing this for real means patching n8n's own compiled TypeScript to the 3.x API, which is
# out of scope for an image-side override -- reported BLOCKED rather than risking the build.
#
# 2026-07-30: `undici@5` -> 6.28.0 added to the overrides. 2.32.1 shipped GREEN this morning, so
# nothing in the recipe regressed — the feed moved (CVE-2026-12151 HIGH + 8 more). One edge wants
# undici 5: @ai-sdk/provider-utils 4.0.41 newly added `undici: ^5.29.0` (4.0.40 had none) and
# hoists it to the root; every other consumer already wants ^6.27.0/^7.24.0 and scans clean. The
# 5 -> 6 major is safe for that one consumer (Agent + fetch + init.dispatcher only) — see the
# undici note in melange.yaml for the compatibility proof and why parent-bumping doesn't work.
#
# 2026-07-27 nightly sweep: brace-expansion -> 5.0.8 and tar -> 7.5.22 added to the overrides
# below. brace-expansion is the interesting one — the tree carries five 1.1.16 copies (glob 7 ->
# minimatch 3.1.5 -> ^1.1.7, under cacache/node-gyp/rimraf/shelljs/temp) plus a 2.1.2 (glob 10.5
# -> minimatch 9.0.9 -> ^2.0.2), and CVE-2026-14257's affected range is a single `<= 5.0.7` that
# spans EVERY line, so neither maintenance head is a fix and no parent bump reaches a clean
# minimatch (9.0.9, the newest 9.x, reverted to brace-expansion ^2.0.2; glob 7's consumers can't
# take minimatch 9/10). 5.0.8 is the only escape and it changed the CJS export shape, so the
# recipe pins it AND re-exports the callable — see the interop step in melange.yaml.
# The remaining `showdown` 2.1.0 ReDoS (CVE-2024-1899, MEDIUM) has NO fixed version published,
# so --ignore-unfixed keeps it out of the gate; nothing to do image-side.
#
# UNBLOCKED 2026-07-09: n8n 2.29.9 now builds + passes the 0-CVE gate + boots (smoke test:
# GET / -> 200, /healthz -> ok). The whole flagged transitive CVE class (ai-sdk/*, ws, uuid,
# fast-xml-parser, axios, form-data, protobufjs, qs, semver, tar, nodemailer, ajv, langsmith,
# @opentelemetry/*, @azure/identity, ...) is cleared IMAGE-SIDE via npm `overrides` in the
# melange recipe (each flagged dep pinned to its Trivy "Fixed version"; scoped keys for the
# ones with a direct-dep copy). Two build regressions were also fixed there: npm >=12 refuses
# the xlsx CDN "remote" dep (EALLOWREMOTE) -> aliased to the @e965/xlsx registry mirror; and
# npm >=12 blocks dependency install scripts by default -> re-enabled with
# --dangerously-allow-all-scripts so the sqlite3 native binding installs. See melange.yaml.
#
# n8n: from the official npm distribution. n8n ships as the npm package `n8n` (exactly
# what `npm install -g n8n` installs) — an immutable registry tarball with a published
# sha256. The recipe fetches that tarball, installs PRODUCTION deps in a melange `runs`
# step (network is available at build time; the native sqlite3 driver compiles via
# node-gyp / node-pre-gyp), then runs `node bin/n8n start` on Wolfi nodejs-24.
#
# LATEST-ONLY as of 2.36.0: n8n's dist-tags gate stability: `stable`/`latest` point at the
# current release. 2.36.0 raised the package.json engines floor from Node >=22.22 to
# Node >=24.0.0, so a line built on nodejs-22 (2.32.x/2.33.x/2.34.x/2.35.x) and the current
# nodejs-24 line (2.36.0+) can no longer share one Node major — the catalog ships the
# current stable release only, same policy as Ghost/Excalidraw.
#
