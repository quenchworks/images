# Packages n8n from its OFFICIAL npm distribution onto Wolfi. n8n ships as the npm package
# `n8n` (exactly what `npm install -g n8n` installs): an immutable registry tarball with a
# published sha256. We fetch that tarball (uses: fetch, sha-pinned), strip its leading
# `package/` component into the workspace, then install PRODUCTION dependencies in a melange
# `runs` step. melange `runs` steps have network access at build time (same as the
# ghost/postgres-documentdb recipes), so `npm install --omit=dev` resolves the 144 direct
# deps + their transitive tree from the registry. n8n's published package.json pins exact
# versions (no workspace: protocol), so plain npm produces a bootable tree.
#
# n8n has ONE native module in the prod tree: sqlite3 (the default standalone DB driver,
# via @n8n/typeorm), compiled/fetched via node-gyp + node-pre-gyp. So the build env needs
# python3 + build-base (make/g++) + npm (so node-pre-gyp finds the PREBUILT binary first
# instead of a GCC-16 source compile) on top of nodejs-24. We prune caches after install.
#
# NODE 24, not 22: n8n 2.36.0+ hard-requires Node >=24 (package.json engines) to ship fixes
# for a run of n8n-authored CVEs (see build.conf, 2026-09-14). sqlite3 ships N-API
# (napi-v3/v6) prebuilds, which are ABI-stable across Node majors, so the bump carries no
# native-recompile risk for the one compiled module in this tree.
#
# LICENSE — CAUTION: fair-code, NOT OSI. Sustainable Use License v1.0 for the bulk of the
# code; ".ee." files need a commercial n8n Enterprise License (LICENSE_EE.md).
package:
  name: quench-n8n
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened n8n (fair-code workflow automation), from the official npm distribution on Wolfi"
  copyright:
    - license: LicenseRef-n8n-Sustainable-Use-License-1.0
  dependencies:
    runtime:
      - nodejs-24              # n8n requires Node >=24.0.0 as of 2.36.0 (package.json engines)
      - ca-certificates-bundle # TLS to external DBs, SMTP, webhooks, integrations, update checks
      - tzdata                 # n8n schedules workflows against the configured timezone

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base             # make + g++ for node-gyp (native module: sqlite3)
      - busybox
      - ca-certificates-bundle
      - nodejs-24
      - npm                    # node-pre-gyp probes a PREBUILT sqlite3 binary via npm FIRST;
                               # without npm that path fails and it falls back to a GCC-16
                               # source compile. With npm present the prebuilt is used.
      - node-gyp               # native module install scripts shell out to node-gyp
      - python-3.13            # node-gyp requires python3 at build time (Wolfi names it python-3.13)

pipeline:
  - uses: fetch
    with:
      # Immutable npm registry tarball (the same artifact `npm install -g n8n` installs).
      uri: https://registry.npmjs.org/n8n/-/n8n-${{package.version}}.tgz
      expected-sha256: __SHA256__
      # npm tarballs extract under package/; drop that leading component.
      strip-components: 1

  - runs: |
      set -eu
      # Install ONLY production deps into ./node_modules. The published package.json pins
      # exact versions with no lockfile shipped, so we let npm resolve; --no-audit/--no-fund
      # keep it quiet. This fetches the prebuilt sqlite3 native binding (node-pre-gyp).
      export CI=true
      export npm_config_loglevel=warn
      # Wolfi ships the interpreter as python3.13; point node-gyp at it explicitly so a
      # native build (if node-pre-gyp has no prebuilt) doesn't fail probing for `python3`.
      export PYTHON="$(command -v python3.13 || command -v python3)"
      export npm_config_python="$PYTHON"
      # Strip devDependencies before install. n8n's published package.json lists INTERNAL,
      # UNPUBLISHED workspace packages (e.g. @n8n/playwright-janitor@0.1.0) under
      # devDependencies. With no lockfile in the tarball, npm's arborist resolves the full
      # dependency graph (dev edges included) to build the ideal tree even under --omit=dev,
      # and 404s fetching those private packages. Deleting devDependencies removes them from
      # resolution; they are never needed to RUN n8n. (Mirrors upstream's own runners
      # Dockerfile, which deletes devDependencies before installing.)
      npm pkg delete devDependencies
      # --- npm dependency overrides (0-CVE gate + build fixes) ----------------------------
      # Injected into the top-level package.json before install so npm's arborist pins every
      # copy of each flagged transitive dep to a PATCHED version. Merged via node (not
      # `npm pkg set`) so scoped names (@scope/x) and version-scoped keys (name@<range>) are
      # written verbatim without npm's dot-path/quoting mangling.
      #
      #  * xlsx -> @e965/xlsx registry mirror: n8n-nodes-base pins xlsx to a SheetJS CDN tarball
      #    (cdn.sheetjs.com/...); npm >=12 hard-refuses "remote" URL deps (EALLOWREMOTE) and the
      #    registry `xlsx` maxes at the CVE-laden 0.18.5. @e965/xlsx is the registry mirror of the
      #    current SheetJS (aliased back to the xlsx folder so require('xlsx') works) — unblocks
      #    the install AND ships patched 0.20.3.
      #  * every other entry pins a Trivy-flagged transitive npm dep to its "Fixed version".
      #    Scoped keys keep the blast radius minimal: `semver@<5.7.2` bumps only the vulnerable
      #    5.x copy (leaving the tree's 6.x/7.x copies untouched, so nothing is downgraded);
      #    `ajv@7` bumps only the 7.x copy. tar is NOT used by sqlite3's binding extraction
      #    (sqlite3 uses prebuild-install -> tar-fs, not `tar`), so bumping tar to 7.x is safe
      #    for the native driver.
      # npm forbids an `overrides` entry that conflicts with a package's OWN direct dependency
      # spec (EOVERRIDE), so flagged deps that n8n declares directly are bumped in `dependencies`
      # instead, and only the TRANSITIVE copies are pinned via `overrides` (scoped with name@range
      # so a direct/newer copy in the tree is never downgraded).
      node -e '
        const fs=require("fs");
        const p=JSON.parse(fs.readFileSync("package.json","utf8"));
        // vulnerable DIRECT deps -> bump the declaration to the Trivy fixed version
        Object.assign(p.dependencies,{
          "nodemailer":"9.1.1",           // direct 8.0.10; GHSA-2x7j/8m3c/cc9r/wmmp all need >= 9.1.0/9.1.1
          "tar":"7.5.22",                 // direct ^7.5.16 (CVE-2026-59873 CRIT +3, GHSA-r292 MED -> 7.5.21;
                                          // 7.5.22 is the newest 7.5.x, so the weekly node-tar
                                          // advisories have some headroom before the next bump)
          "nanoid":"3.3.18",              // direct 3.3.8 flagged; MUST be bumped here, not
                                          // only in overrides -- npm EOVERRIDEs when an
                                          // override hits a direct-dependency edge with a
                                          // different spec ("Override for nanoid@3.3.8
                                          // conflicts with direct dependency"), which is
                                          // exactly how the first nanoid@3 override broke
                                          // the install. The @3-scoped override below now
                                          // agrees with this spec (same value), so it only
                                          // moves the TRANSITIVE 3.x copies.
          "ws":"8.21.0",                  // direct 8.20.1 < 8.21.0 (fix)
          "multer":"2.4.0"                // direct ^2.2.0; CVE-2026-77037/77078/82333 HIGH +
                                          // 77063 LOW need >= 2.3.0; 2.4.0 (newest 2.x, npm
                                          // latest) also carries the CVE-2026-88932 fix.
                                          // Satisfies the ^2.2.0 range n8n itself declares.
          // csv-parse: n8n 2.38.7 already bumped its OWN direct dep to 7.0.2 (was 6.2.1 in
          // 2.32.7) -- past the CVE-2026-85063 fix floor on its own; no bump needed here.
          // @opentelemetry/core: n8n 2.38.7 already ships 2.10.0 direct (was 2.7.1) -- past
          // the 2.8.0 fix floor on its own; the prior dependencies+overrides pin is dropped.
        });
        // transitive copies (+ direct deps already AT the fix: langsmith/uuid/@azure/identity/tar)
        p.overrides=Object.assign(p.overrides||{},{
          "xlsx":"npm:@e965/xlsx@0.20.3",
          "adm-zip":"0.6.1",              // transitive; CVE-2026-76845 (symlink arbitrary file
                                          // overwrite). OSVs affected/fixed data for this CVE
                                          // is self-contradictory about 0.6.0; diffing the
                                          // v0.6.0 vs v0.6.1 GitHub tags shows 0.6.1 is what
                                          // actually adds the lstat-based assertPathSafe guard,
                                          // so 0.6.1 is the real fix, not 0.6.0.
          "@anthropic-ai/sdk":"0.91.1",
          "brace-expansion":"5.0.9",      // CVE-2026-14257 + follow-ons; 5.0.9 is the same
                                          // major as the 5.0.8 this was pinned to, so the CJS
                                          // interop step below still applies unchanged
          "nanoid@3":"3.3.18",            // transitive 3.3.8 flagged; scoped @3 so any 5.x
                                          // copy is not dragged DOWN across majors. Value
                                          // matches the direct-dep bump above (npm rule)
          "vm2":"3.11.6",                 // 3.11.5 flagged, 3.11.6 is the fix
          "@azure/identity@3":"4.2.1",    // only the transitive 3.4.2 (direct is 4.13.0, safe)
          "@opentelemetry/exporter-prometheus":"0.217.0",
          "@opentelemetry/sdk-node@<0.217.0":"0.217.0",  // only the transitive 0.204.0 (direct is ^0.217.0)
          "@tootallnate/once":"2.0.1",
          "ajv@7":"8.18.0",               // only the 7.x copy
          "axios":"1.18.0",               // transitive 1.16.0 < 1.18.0 (GHSA-gcfj-64vw-6mp9 HIGH +9)
          "fast-xml-parser":"5.7.0",
          "form-data":"4.0.6",
          "@hono/node-server":"2.0.10",   // transitive (GHSA-9mqv-5hh9-4cgg MEDIUM; 2.0.5 still vuln)
          "js-yaml":"4.3.2",              // transitive; CVE-2026-84375 (was completely unpinned)
          "langsmith":"0.6.0",
          "linkify-it":"5.0.2",           // transitive (CVE-2026-59887 HIGH; was 5.0.1)
          "mysql2":"3.23.1",              // transitive via @langchain/community/@n8n/typeorm/
                                          // n8n-nodes-base (all dedupe onto one copy);
                                          // GHSA-3f6p HIGH (auth-plugin downgrade) needs
                                          // >= 3.22.0, GHSA-rgwj MEDIUM (zlib-inflate DoS)
                                          // needs >= 3.23.1
          "nodemailer":"9.1.1",
          "@opentelemetry/propagator-jaeger":"2.9.0",  // transitive (CVE-2026-59892 HIGH)
          "protobufjs":"8.6.6",           // transitive 8.6.0 < 8.6.6 (CVE-2026-59876/59877)
          "qs":"6.16.0",                  // CVE-2026-82417/82562 landed on the prior 6.15.2 pin
          "sanitize-html":"2.17.7",       // transitive. CVE-2026-63670/84371 landed on the
                                          // prior 2.17.5 pin (two more advisories after it).
                                          // Not a direct dep of n8n, so it belongs in
                                          // overrides, not dependencies.
                                          // NOTE: this whole script is passed to node inside a
                                          // SINGLE-QUOTED shell argument, so it must contain no
                                          // apostrophe anywhere -- one closes the quote and
                                          // melange fails to parse the pipeline.
          "semver@<5.7.2":"5.7.2",        // only the vulnerable 5.x (tree keeps its 6.x/7.x)
          "tar@6":"7.5.22",               // only the transitive 6.2.1 (direct bumped in dependencies)
          "tar@7":"7.5.22",               // n8n-nodes-base pins tar 7.5.17 EXACTLY, so this copy
                                          // cannot float (CVE-2026-59873 CRIT/59874 HIGH/59871 MED,
                                          // GHSA-r292-9mhp-454m MED needs >= 7.5.21)
          "toml":"4.2.0",                 // transitive via the snowflake-sdk config-file parser
                                          // (CVE-2026-63376/77465). 3->4 is a major bump but
                                          // toml.parse() is unchanged; smoke-tested against
                                          // the real installed copy.
          // undici: no override. 2.38.7 resolves every copy above its CVE fix floor on its
          // own (root 7.29.1, 7.29.0, 4x 6.28.1) and the 5.x edge the old `undici@5` pin
          // existed for is GONE -- see the undici floor assert below for the evidence.
          "uuid":"11.1.1",
          "ws":"8.21.0"
        });
        fs.writeFileSync("package.json",JSON.stringify(p,null,2));
      '
      # --legacy-peer-deps: n8n publishes with exact-pinned deps but ships NO lockfile in the
      # tarball; its real install resolves against the monorepo pnpm-lock (where e.g. zod is
      # pinned at 3.25.67). Some newly-floated transitive peers (e.g. @ai-sdk/* wanting a newer
      # zod) then fail npm's strict peer check even though n8n runs fine on the pinned set.
      # Legacy peer resolution reproduces the intended (lockfile) tree instead of erroring.
      # --dangerously-allow-all-scripts: npm >=12 blocks dependency install/postinstall scripts
      # by default (allowScripts gating) and only WARNS, so the sqlite3 native binding
      # (prebuild-install/node-gyp postinstall) is silently skipped and the app has no DB driver.
      # This build is hermetic (sha-pinned tarball, no network mutation of the pinned tree), so
      # running the pinned deps' install scripts is exactly the pre-npm-12 behavior we need.
      npm install --omit=dev --no-audit --no-fund --legacy-peer-deps --dangerously-allow-all-scripts

      # --- brace-expansion CVE-2026-14257: 5.0.8 + the CJS interop it broke ---------------
      # Why the blunt `"brace-expansion":"5.0.8"` override above is the ONLY option: the
      # advisory (GHSA-mh99-v99m-4gvg) declares a SINGLE affected range, `<= 5.0.7`, which
      # spans every line — so the maintenance heads (1.1.16 = maintenance-v1, 2.1.2 =
      # maintenance-v2) are themselves affected, and no future 1.x/2.x release can ever sort
      # above 5.0.7 either. 5.0.8 is the only escape. Parent-bumping instead of overriding the
      # leaf does NOT work here: this tree's brace-expansion comes only from minimatch, and the
      # newest minimatch 3.x/9.x both want a vulnerable line (3.1.5 -> ^1.1.7; 9.0.9, the newest
      # 9.x, REVERTED from ^5.0.2 back to ^2.0.2), while their own parents are glob 7 (callback
      # API, used by cacache/node-gyp/rimraf/shelljs/temp) which cannot take minimatch 9/10.
      #
      # 5.0.8 rewrote the CJS entry to a NAMED-only export (`exports.expand`, `__esModule: true`,
      # no callable default), but minimatch 3.1.5 does `require("brace-expansion")(pattern)` and
      # 9.0.9 does `__importDefault(...).default(pattern)` — both throw "expand is not a
      # function" at load. So re-export the function AS module.exports with the named props kept:
      # the patched implementation (the EXPANSION_MAX_LENGTH accumulator bound that fixes the CVE)
      # is what runs, and all three consumer shapes work. Verified against the published tarballs:
      # minimatch 3.1.5 / 9.0.9 / 10.2.5 all braceExpand() correctly afterwards and stay bounded.
      # NOT a gate bypass — no .trivyignore, no --skip, no VEX; the installed version genuinely
      # IS the fixed one. The assert fails the build if any copy escaped the override, so a stale
      # brace-expansion can never ship silently.
      python3.13 - <<'PYEOF'
      import json, os
      SHIM = ('\n// QuenchWorks: brace-expansion 5.x exports a NAMED-only CJS binding; re-export the\n'
              '// function itself (named props kept) so minimatch 3.x/9.0.9 consumers keep working.\n'
              'module.exports = Object.assign(expand, exports, { default: expand });\n')
      # os.walk, not glob: pnpm's real copies live under the HIDDEN node_modules/.pnpm/ store,
      # which glob's ** never enters. Symlinks are not followed, so nothing is visited twice.
      copies = sorted(os.path.join(r, 'brace-expansion', 'package.json')
                      for r, dirs, _ in os.walk('node_modules') if 'brace-expansion' in dirs)
      assert copies, "brace-expansion not found under node_modules"
      stale = [p for p in copies if json.load(open(p))['version'].split('.')[0] != '5']
      assert not stale, "override missed brace-expansion copies: %s" % stale
      n = 0
      for pj in copies:
          cjs = os.path.join(os.path.dirname(pj), 'dist/commonjs/index.js')
          if 'Object.assign(expand' not in open(cjs).read():
              open(cjs, 'a').write(SHIM); n += 1
      print("brace-expansion: %d copy(ies) at 5.x, %d shimmed" % (len(copies), n))
      PYEOF
      # Prove the shim on the REAL installed copies: require() must yield a callable that
      # expands, and minimatch (whose 3.x/9.0.9 copies are the ones that would break) must
      # still braceExpand. A future 5.x that moves the CJS entry fails the build here.
      for d in $(find node_modules -type d -name brace-expansion); do
        node -e "const b=require(require('path').resolve('$d'));
                 if (typeof b!=='function'||b('a{b,c}').join()!=='ab,ac')
                   throw new Error('brace-expansion CJS interop broken at $d');"
      done
      node -e "if (require('minimatch').braceExpand('a{b,c}').join()!=='ab,ac')
                 throw new Error('minimatch braceExpand broken');"

      # --- undici: per-major CVE fix FLOOR, asserted on every copy in the tree -------------
      # What this used to be, and why it went stale on 2.38.7: the recipe pinned `undici@5` ->
      # 6.28.0 and asserted the ROOT copy started with "6.". Both halves are now wrong.
      # @ai-sdk/provider-utils -- the single edge that ever wanted the 5.x line -- moved
      # 4.0.41 -> 5.0.41 and now declares `undici ^7.29.0`, so NO 5.x edge remains and that
      # override matched nothing (verified: resolving the 2.38.7 tree with and without it
      # yields byte-identical undici placements). With the 5.x edge gone the root hoists to
      # 7.29.1 -- NEWER than the old pin and clean -- which is exactly what startsWith("6.")
      # rejected. An equality/prefix check on ONE copy is the wrong invariant: it goes stale
      # every time the tree floats forward, and it says nothing about the five NESTED copies.
      #
      # So the assert becomes the real invariant -- every copy is at or above the fix floor for
      # its own major -- which passes a newer line on its own and only fails a genuinely
      # vulnerable copy. Floors are the highest fixed version per major across undici's whole
      # advisory set (OSV, queried 2026-09-16):
      #   6.x -> 6.28.0  (GHSA-8xcm-r25x-g524 / m8rv-5g2x-5cg5 / v3r7-h72x-cjcm, all `< 6.28.0`)
      #   7.x -> 7.29.0  (those same three, plus GHSA-4cwx-7wf7-3272 HIGH and GHSA-jr45-8vmc-qm54)
      #   8.x -> 8.9.0   (GHSA-38rv-x7px-6hhq HIGH + the same three; no 8.x copy in this tree yet)
      # There is NO clean 5.x and no clean anything below 6: those three advisories declare a
      # bare `< 6.28.0` range that spans the entire 5 line, so an unlisted major fails outright
      # rather than passing unchecked. A new advisory landing above a floor is the one thing
      # that should force an edit here -- that is the assert doing its job, not going stale.
      #
      # Resolved tree for 2.38.7 (11 declarers, 6 copies): root 7.29.1; 7.29.0 under
      # @qdrant/js-client-rest; 6.28.1 under n8n-nodes-base / @n8n/ai-workflow-builder /
      # discord.js / @discordjs/rest. All clean. The API-surface check stays too, on the root
      # copy: provider-utils uses only `Agent` + `fetch` + `init.dispatcher`, so if a future
      # float moves those exports the build must fail rather than ship a broken createSafeNodeFetch.
      node - <<'JSEOF'
      const fs = require("fs"), path = require("path");
      const FLOOR = { 6: [6, 28, 0], 7: [7, 29, 0], 8: [8, 9, 0] };
      const cmp = (a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2];
      // Recurse manually rather than glob: nested copies live many levels down, and
      // readdirSync/isDirectory does not follow symlinks, so nothing is visited twice.
      const walk = (dir, out = []) => {
        for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
          if (!e.isDirectory()) continue;
          const p = path.join(dir, e.name);
          if (e.name === "undici") out.push(p);
          else walk(p, out);
        }
        return out;
      };
      const copies = walk("node_modules");
      if (!copies.length) throw new Error("undici not found under node_modules");
      const bad = [];
      for (const dir of copies) {
        const v = JSON.parse(fs.readFileSync(path.join(dir, "package.json"), "utf8")).version;
        const n = v.split("-")[0].split(".").map(Number);
        const floor = FLOOR[n[0]];
        if (!floor || cmp(n, floor) < 0) bad.push(dir + " @ " + v);
      }
      if (bad.length) throw new Error("undici below the per-major CVE fix floor: " + bad.join(", "));
      const u = require(path.resolve("node_modules/undici"));
      if (typeof u.Agent !== "function" || typeof u.fetch !== "function")
        throw new Error("undici API surface changed: Agent/fetch missing from the root copy");
      console.log("undici: " + copies.length + " copy(ies), all at or above the per-major fix floor");
      JSEOF

      # --- strip foreign-arch + musl prebuilt native binaries ---------------------------
      # n8n's tree VENDORS prebuilt .node/.so binaries for every platform/arch/libc inside
      # single packages (@sentry/node-cpu-profiler, @sentry/node-native-stacktrace,
      # isolated-vm, oracledb, ...). npm keeps them all regardless of host. Any non-host-arch
      # ELF makes melange's SCA emit a bogus `so:ld-linux-<foreign>.so.1` dependency, and any
      # musl-linked ELF a `so:libc.musl-*` dependency — neither of which Wolfi (one glibc
      # arch per image) provides, so apko can't solve the package. We build ONE arch per image
      # on glibc, so keep only host-arch glibc objects and delete the rest. This also trims
      # image size and the scanned CVE surface.
      case "$(uname -m)" in
        x86_64)  keep=3e00 ;;   # ELF e_machine EM_X86_64  (offset 18, little-endian)
        aarch64) keep=b700 ;;   # ELF e_machine EM_AARCH64
        *)       keep="" ;;
      esac
      # Candidate binaries: shared objects (.node/.so) AND bare prebuilt executables that
      # ship with NO extension — these live in bin/ dirs or have arch-suffixed names
      # (e.g. agent-browser/bin/agent-browser-linux-arm64). We check each candidate's real
      # ELF e_machine and drop any that isn't the host arch, plus any musl-linked one
      # (Wolfi is glibc). Restricting to this candidate set keeps the scan fast.
      if [ -n "$keep" ]; then
        find node_modules -type f \( -name '*.node' -o -name '*.so' -o -name '*.so.*' \
             -o -path '*/bin/*' -o ! -name '*.*' \) | \
        while IFS= read -r f; do
          case "$f" in *musl*) rm -f "$f"; continue ;; esac   # Wolfi is glibc
          [ "$(od -An -tx1 -N4 "$f" 2>/dev/null | tr -d ' \n')" = "7f454c46" ] || continue
          m="$(od -An -tx1 -j18 -N2 "$f" 2>/dev/null | tr -d ' \n')"
          [ "$m" = "$keep" ] || rm -f "$f"
        done
      fi
      # Prune prebuild dirs left empty by the above.
      find node_modules -type d -empty -delete 2>/dev/null || true

      # Trim build-time cruft that bloats the image and the CVE surface but is never run.
      rm -rf node_modules/.cache 2>/dev/null || true
      find . -type d -name '.cache' -prune -exec rm -rf {} + 2>/dev/null || true

  - runs: |
      set -eu
      dest="${{targets.destdir}}"
      app="$dest/opt/n8n"
      install -d "$app"
      # Install the whole app tree (bin/, dist/, package.json, templates/, node_modules/, ...)
      # read-only under /opt/n8n. The server boots via `node bin/n8n start` from this dir.
      # Copy top-level entries individually and SKIP melange's build-output/CI files: CI runs
      # melange with working-directory apps/n8n, so the workspace also holds the recipe +
      # generated files. A blanket `cp -a *` would leak them into the image.
      for item in * .[!.]* ..?*; do
        [ -e "$item" ] || continue
        case "$item" in
          melange-out|melange.rsa|melange.rsa.pub|packages|build.conf|melange.yaml|apko.yaml|test.sh|melange.rendered.yaml|apko.rendered.yaml|image.tar|sbom-*|*.log|.git) continue ;;
        esac
        cp -a "$item" "$app/"
      done
      # World-readable so a read-only deployment can serve; runtime ownership (uid 1001) is
      # set recursively in apko (the melange sandbox cannot chown to a uid it doesn't map).
      chmod -R a+rX "$app"
      # n8n's home (~/.n8n: sqlite db, config, encryption key) must be writable at runtime.
      # Bake a HOME dir; apko chowns it to 1001. The chart mounts a PVC/emptyDir over it.
      install -d "$dest/home/node"

test:
  pipeline:
    - runs: |
        test -f /opt/n8n/bin/n8n
        test -f /opt/n8n/package.json
        test -d /opt/n8n/node_modules
        test -d /opt/n8n/dist
        # the CLI entry must be present and the sqlite3 native binding must have installed
        find /opt/n8n/node_modules -path '*sqlite3*/*.node' | grep -q .
