# Packages n8n from its OFFICIAL npm distribution onto Wolfi. n8n ships as the npm package
# `n8n` (exactly what `npm install -g n8n` installs): an immutable registry tarball with a
# published sha256. We fetch that tarball (uses: fetch, sha-pinned), strip its leading
# `package/` component into the workspace, then install PRODUCTION dependencies in a melange
# `runs` step. melange `runs` steps have network access at build time (same as the
# ghost/postgres-documentdb recipes), so `npm install --omit=dev` resolves the 144 direct
# deps + their transitive tree from the registry. n8n's published package.json pins exact
# versions (no workspace: protocol), so plain npm produces a bootable tree.
#
# n8n has ONE native module in the prod tree: sqlite3 (the default standalone DB driver,
# via @n8n/typeorm), compiled/fetched via node-gyp + node-pre-gyp. So the build env needs
# python3 + build-base (make/g++) + npm (so node-pre-gyp finds the PREBUILT binary first
# instead of a GCC-16 source compile) on top of nodejs-22. We prune caches after install.
#
# LICENSE — CAUTION: fair-code, NOT OSI. Sustainable Use License v1.0 for the bulk of the
# code; ".ee." files need a commercial n8n Enterprise License (LICENSE_EE.md).
package:
  name: quench-n8n
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened n8n (fair-code workflow automation), from the official npm distribution on Wolfi"
  copyright:
    - license: LicenseRef-n8n-Sustainable-Use-License-1.0
  dependencies:
    runtime:
      - nodejs-22              # n8n requires Node >=22.22 (package.json engines)
      - ca-certificates-bundle # TLS to external DBs, SMTP, webhooks, integrations, update checks
      - tzdata                 # n8n schedules workflows against the configured timezone

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base             # make + g++ for node-gyp (native module: sqlite3)
      - busybox
      - ca-certificates-bundle
      - nodejs-22
      - npm                    # node-pre-gyp probes a PREBUILT sqlite3 binary via npm FIRST;
                               # without npm that path fails and it falls back to a GCC-16
                               # source compile. With npm present the prebuilt is used.
      - node-gyp               # native module install scripts shell out to node-gyp
      - python-3.13            # node-gyp requires python3 at build time (Wolfi names it python-3.13)

pipeline:
  - uses: fetch
    with:
      # Immutable npm registry tarball (the same artifact `npm install -g n8n` installs).
      uri: https://registry.npmjs.org/n8n/-/n8n-${{package.version}}.tgz
      expected-sha256: __SHA256__
      # npm tarballs extract under package/; drop that leading component.
      strip-components: 1

  - runs: |
      set -eu
      # Install ONLY production deps into ./node_modules. The published package.json pins
      # exact versions with no lockfile shipped, so we let npm resolve; --no-audit/--no-fund
      # keep it quiet. This fetches the prebuilt sqlite3 native binding (node-pre-gyp).
      export CI=true
      export npm_config_loglevel=warn
      # Wolfi ships the interpreter as python3.13; point node-gyp at it explicitly so a
      # native build (if node-pre-gyp has no prebuilt) doesn't fail probing for `python3`.
      export PYTHON="$(command -v python3.13 || command -v python3)"
      export npm_config_python="$PYTHON"
      # Strip devDependencies before install. n8n's published package.json lists INTERNAL,
      # UNPUBLISHED workspace packages (e.g. @n8n/playwright-janitor@0.1.0) under
      # devDependencies. With no lockfile in the tarball, npm's arborist resolves the full
      # dependency graph (dev edges included) to build the ideal tree even under --omit=dev,
      # and 404s fetching those private packages. Deleting devDependencies removes them from
      # resolution; they are never needed to RUN n8n. (Mirrors upstream's own runners
      # Dockerfile, which deletes devDependencies before installing.)
      npm pkg delete devDependencies
      # --- npm dependency overrides (0-CVE gate + build fixes) ----------------------------
      # Injected into the top-level package.json before install so npm's arborist pins every
      # copy of each flagged transitive dep to a PATCHED version. Merged via node (not
      # `npm pkg set`) so scoped names (@scope/x) and version-scoped keys (name@<range>) are
      # written verbatim without npm's dot-path/quoting mangling.
      #
      #  * xlsx -> @e965/xlsx registry mirror: n8n-nodes-base pins xlsx to a SheetJS CDN tarball
      #    (cdn.sheetjs.com/...); npm >=12 hard-refuses "remote" URL deps (EALLOWREMOTE) and the
      #    registry `xlsx` maxes at the CVE-laden 0.18.5. @e965/xlsx is the registry mirror of the
      #    current SheetJS (aliased back to the xlsx folder so require('xlsx') works) — unblocks
      #    the install AND ships patched 0.20.3.
      #  * every other entry pins a Trivy-flagged transitive npm dep to its "Fixed version".
      #    Scoped keys keep the blast radius minimal: `semver@<5.7.2` bumps only the vulnerable
      #    5.x copy (leaving the tree's 6.x/7.x copies untouched, so nothing is downgraded);
      #    `ajv@7` bumps only the 7.x copy. tar is NOT used by sqlite3's binding extraction
      #    (sqlite3 uses prebuild-install -> tar-fs, not `tar`), so bumping tar to 7.x is safe
      #    for the native driver.
      # npm forbids an `overrides` entry that conflicts with a package's OWN direct dependency
      # spec (EOVERRIDE), so flagged deps that n8n declares directly are bumped in `dependencies`
      # instead, and only the TRANSITIVE copies are pinned via `overrides` (scoped with name@range
      # so a direct/newer copy in the tree is never downgraded).
      node -e '
        const fs=require("fs");
        const p=JSON.parse(fs.readFileSync("package.json","utf8"));
        // vulnerable DIRECT deps -> bump the declaration to the Trivy fixed version
        Object.assign(p.dependencies,{
          "@opentelemetry/core":"2.8.0",  // direct 2.7.1 < 2.8.0 (fix)
          "nodemailer":"9.0.1",           // direct 8.0.10 (fix = 9.0.1, major)
          "tar":"7.5.19",                 // direct ^7.5.16 resolved 7.5.16 < 7.5.19 (CVE-2026-59873 CRIT +3)
          "ws":"8.21.0"                   // direct 8.20.1 < 8.21.0 (fix)
        });
        // transitive copies (+ direct deps already AT the fix: langsmith/uuid/@azure/identity/tar)
        p.overrides=Object.assign(p.overrides||{},{
          "xlsx":"npm:@e965/xlsx@0.20.3",
          "adm-zip":"0.6.0",              // transitive 0.5.18 < 0.6.0 (CVE-2026-39244 HIGH)
          "@anthropic-ai/sdk":"0.91.1",
          "@azure/identity@3":"4.2.1",    // only the transitive 3.4.2 (direct is 4.13.0, safe)
          "@opentelemetry/core":"2.8.0",
          "@opentelemetry/exporter-prometheus":"0.217.0",
          "@opentelemetry/sdk-node@<0.217.0":"0.217.0",  // only the transitive 0.204.0 (direct is ^0.217.0)
          "@tootallnate/once":"2.0.1",
          "ajv@7":"8.18.0",               // only the 7.x copy
          "axios":"1.18.0",               // transitive 1.16.0 < 1.18.0 (GHSA-gcfj-64vw-6mp9 HIGH +9)
          "fast-xml-parser":"5.7.0",
          "form-data":"4.0.6",
          "@hono/node-server":"2.0.10",   // transitive (GHSA-9mqv-5hh9-4cgg MEDIUM; 2.0.5 still vuln)
          "langsmith":"0.6.0",
          "linkify-it":"5.0.2",           // transitive (CVE-2026-59887 HIGH; was 5.0.1)
          "nodemailer":"9.0.1",
          "@opentelemetry/propagator-jaeger":"2.9.0",  // transitive (CVE-2026-59892 HIGH)
          "protobufjs":"8.6.6",           // transitive 8.6.0 < 8.6.6 (CVE-2026-59876/59877)
          "qs":"6.15.2",
          "semver@<5.7.2":"5.7.2",        // only the vulnerable 5.x (tree keeps its 6.x/7.x)
          "tar@6":"7.5.19",               // only the transitive 6.2.1 (direct bumped in dependencies)
          "tar@7":"7.5.19",               // direct 7.5.17 (CVE-2026-59873 CRIT/59874 HIGH/59871 MED)
          "uuid":"11.1.1",
          "ws":"8.21.0"
        });
        fs.writeFileSync("package.json",JSON.stringify(p,null,2));
      '
      # --legacy-peer-deps: n8n publishes with exact-pinned deps but ships NO lockfile in the
      # tarball; its real install resolves against the monorepo pnpm-lock (where e.g. zod is
      # pinned at 3.25.67). Some newly-floated transitive peers (e.g. @ai-sdk/* wanting a newer
      # zod) then fail npm's strict peer check even though n8n runs fine on the pinned set.
      # Legacy peer resolution reproduces the intended (lockfile) tree instead of erroring.
      # --dangerously-allow-all-scripts: npm >=12 blocks dependency install/postinstall scripts
      # by default (allowScripts gating) and only WARNS, so the sqlite3 native binding
      # (prebuild-install/node-gyp postinstall) is silently skipped and the app has no DB driver.
      # This build is hermetic (sha-pinned tarball, no network mutation of the pinned tree), so
      # running the pinned deps' install scripts is exactly the pre-npm-12 behavior we need.
      npm install --omit=dev --no-audit --no-fund --legacy-peer-deps --dangerously-allow-all-scripts

      # --- strip foreign-arch + musl prebuilt native binaries ---------------------------
      # n8n's tree VENDORS prebuilt .node/.so binaries for every platform/arch/libc inside
      # single packages (@sentry/node-cpu-profiler, @sentry/node-native-stacktrace,
      # isolated-vm, oracledb, ...). npm keeps them all regardless of host. Any non-host-arch
      # ELF makes melange's SCA emit a bogus `so:ld-linux-<foreign>.so.1` dependency, and any
      # musl-linked ELF a `so:libc.musl-*` dependency — neither of which Wolfi (one glibc
      # arch per image) provides, so apko can't solve the package. We build ONE arch per image
      # on glibc, so keep only host-arch glibc objects and delete the rest. This also trims
      # image size and the scanned CVE surface.
      case "$(uname -m)" in
        x86_64)  keep=3e00 ;;   # ELF e_machine EM_X86_64  (offset 18, little-endian)
        aarch64) keep=b700 ;;   # ELF e_machine EM_AARCH64
        *)       keep="" ;;
      esac
      # Candidate binaries: shared objects (.node/.so) AND bare prebuilt executables that
      # ship with NO extension — these live in bin/ dirs or have arch-suffixed names
      # (e.g. agent-browser/bin/agent-browser-linux-arm64). We check each candidate's real
      # ELF e_machine and drop any that isn't the host arch, plus any musl-linked one
      # (Wolfi is glibc). Restricting to this candidate set keeps the scan fast.
      if [ -n "$keep" ]; then
        find node_modules -type f \( -name '*.node' -o -name '*.so' -o -name '*.so.*' \
             -o -path '*/bin/*' -o ! -name '*.*' \) | \
        while IFS= read -r f; do
          case "$f" in *musl*) rm -f "$f"; continue ;; esac   # Wolfi is glibc
          [ "$(od -An -tx1 -N4 "$f" 2>/dev/null | tr -d ' \n')" = "7f454c46" ] || continue
          m="$(od -An -tx1 -j18 -N2 "$f" 2>/dev/null | tr -d ' \n')"
          [ "$m" = "$keep" ] || rm -f "$f"
        done
      fi
      # Prune prebuild dirs left empty by the above.
      find node_modules -type d -empty -delete 2>/dev/null || true

      # Trim build-time cruft that bloats the image and the CVE surface but is never run.
      rm -rf node_modules/.cache 2>/dev/null || true
      find . -type d -name '.cache' -prune -exec rm -rf {} + 2>/dev/null || true

  - runs: |
      set -eu
      dest="${{targets.destdir}}"
      app="$dest/opt/n8n"
      install -d "$app"
      # Install the whole app tree (bin/, dist/, package.json, templates/, node_modules/, ...)
      # read-only under /opt/n8n. The server boots via `node bin/n8n start` from this dir.
      # Copy top-level entries individually and SKIP melange's build-output/CI files: CI runs
      # melange with working-directory apps/n8n, so the workspace also holds the recipe +
      # generated files. A blanket `cp -a *` would leak them into the image.
      for item in * .[!.]* ..?*; do
        [ -e "$item" ] || continue
        case "$item" in
          melange-out|melange.rsa|melange.rsa.pub|packages|build.conf|melange.yaml|apko.yaml|test.sh|melange.rendered.yaml|apko.rendered.yaml|image.tar|sbom-*|*.log|.git) continue ;;
        esac
        cp -a "$item" "$app/"
      done
      # World-readable so a read-only deployment can serve; runtime ownership (uid 1001) is
      # set recursively in apko (the melange sandbox cannot chown to a uid it doesn't map).
      chmod -R a+rX "$app"
      # n8n's home (~/.n8n: sqlite db, config, encryption key) must be writable at runtime.
      # Bake a HOME dir; apko chowns it to 1001. The chart mounts a PVC/emptyDir over it.
      install -d "$dest/home/node"

test:
  pipeline:
    - runs: |
        test -f /opt/n8n/bin/n8n
        test -f /opt/n8n/package.json
        test -d /opt/n8n/node_modules
        test -d /opt/n8n/dist
        # the CLI entry must be present and the sqlite3 native binding must have installed
        find /opt/n8n/node_modules -path '*sqlite3*/*.node' | grep -q .
