# flux-image-automation-controller: Flux's image-automation-controller, from source via melange (Go build of main.go from the git tag
# tarball). Static Go binary, no CGO. Flux ships one version of each controller per
# Flux release, so this tracks the latest only. The binary carries no version stamp.
FROM_SOURCE=1
VERSIONS=(1.2.5 1.3.0)
declare -A SHA256=(
  [1.2.5]=70b37013d452e9029a143af318471bda461c546786072e7be63b16bc7f60709c
  [1.3.0]=db737fe5b36ea51f12a2a7cc387d6fc754223532f46e0dc0078e3348332af337
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
