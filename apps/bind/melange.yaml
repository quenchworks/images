# quench-bind: the default configuration for the bind image. No code: named itself is
# Wolfi's bind apk, pinned in apko.yaml.
package:
  name: quench-bind
  version: __VER__
  epoch: 0
  description: "Quenchworks default configuration for ISC BIND 9 (named) as a nonroot resolver"
  copyright:
    - license: MPL-2.0
  dependencies:
    runtime:
      - bind
      - bind-libs

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - bind=__REL__
      - bind-libs=__REL__

pipeline:
  - runs: |
      set -eu
      d="${{targets.destdir}}/etc/quench-bind"
      install -d "$d"
      cat > "$d/named.conf" <<'CONF'
      // QuenchWorks default: a caching recursive resolver for local networks, nonroot,
      // on port 5353. State goes to /tmp (writable even with a read-only root).
      options {
          directory "/tmp";
          pid-file none;
          listen-on port 5353 { any; };
          listen-on-v6 port 5353 { any; };
          recursion yes;
          allow-recursion { localhost; localnets; };
          allow-query { localhost; localnets; };
          dnssec-validation auto;
      };
      logging {
          channel stdout { stderr; severity info; print-time yes; };
          category default { stdout; };
      };
      CONF
      chmod 0644 "$d/named.conf"
      named -V | grep -q "^BIND ${{package.version}} "
      named-checkconf "$d/named.conf"

test:
  pipeline:
    - runs: |
        named-checkconf /etc/quench-bind/named.conf
