# bind (ISC BIND 9): the authoritative and recursive DNS server, from Wolfi's pinned bind
# apk (9.20, the stable line Wolfi builds). melange only adds quench-bind, a default
# named.conf under /etc/quench-bind: Wolfi's /etc/bind is mode 0750 root, unreadable by
# the nonroot uid 1001 the image runs as. The default config is a recursive resolver on
# port 5353 (no privileged port) for local networks; the chart mounts its own.
FROM_SOURCE=1
VERSIONS=(9.20.29)
declare -A PIN=( [9.20.29]=9.20.29-r1 )
render() { local v=$1; echo "s/__VER__/$v/g; s/__REL__/${PIN[$v]}/g"; }
