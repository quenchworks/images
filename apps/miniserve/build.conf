# miniserve (svenstaro/miniserve, MIT): a small file server with directory listing, uploads, mkdir,
# archive downloads (tar, tar.gz, zip), basic auth, QR codes and native TLS. Images issue #69.
#
# Rust from the release tag with cargo auditable; TLS through rustls (ring), the default feature. The
# lockfile is refreshed with `cargo update` (actix-http, rand, rustls, rustls-webpki, tar). zip 8.5.1 has
# no fix on the 8 line (9.0.5): the recipe raises the requirement to 9, as upstream master did with the
# same src/archive.rs (miniserve only writes archives through ZipWriter).
# LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(0.35.0)
declare -A SHA256=(
  [0.35.0]=8ae108c161f2ed740f8c4b4dfd0a80805adcbaf7a05a6128f2b4d8f5093f5490
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
