# miniserve runtime: miniserve on 8080 serving /srv (the volume). Nonroot uid 1001, multi-arch.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-miniserve@local

accounts:
  groups:
    - groupname: miniserve
      gid: 1001
  users:
    - username: miniserve
      uid: 1001
      gid: 1001
      homedir: /srv
  run-as: 1001

work-dir: /srv

environment:
  MINISERVE_PATH: /srv
  MINISERVE_PORT: "8080"

paths:
  - path: /srv
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o750

entrypoint:
  command: /usr/bin/miniserve

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-miniserve"
  org.opencontainers.image.licenses: "MIT"
