# PrivateBin (PrivateBin/PrivateBin, Zlib with bundled GPLv2/BSD/MIT/Apache libraries): a
# minimalist pastebin where the server has zero knowledge of the data; pastes are encrypted and
# decrypted in the browser. The release tag already carries composer's vendor/ and the built JS,
# so nothing is compiled: melange lays it out as upstream's container does (code and config in
# /srv, a thin docroot in /var/www) behind php-fpm and QuenchWorks' nginx under supervisor, like
# the phpMyAdmin image. Pastes live in /srv/data (a volume). LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(2.1.1)
declare -A SHA256=(
  [2.1.1]=4612defcabdc669513f91983e18d5cf5f929d326b8b7fe5bdfb206afb8b0f63e
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
