# tetragon-operator: Tetragon's operator (installs and maintains the TracingPolicy
# and PodInfo CRDs), from Wolfi's pinned tetragon-operator apk (FROM_SOURCE=0).
# In lockstep with apps/tetragon.
BLOCKED=0
FROM_SOURCE=0
# STATUS 2026-11-01: 1.7.1-r7 is the newest 1.7.1 apk and still carries cilium/ebpf
# CVE-2026-10722 and golang.org/x/net v0.60.0; Wolfi fixed both only in 1.8.0-r0 (x/net
# v0.62.0, checked with go version -m on the extracted apk). 1.8.0 added beside 1.7.1;
# unblock = move the tetragon chart to 1.8, then drop 1.7.1.
# 2026-11-01: 1.7.1 dropped so 1.8.0 publishes (its legs passed in CI 41297417896, the 1.7.1 legs
# blocked the merge). The tetragon chart still pins the published 1.7.1 digest: move it to 1.8.0
# BEFORE the next catalog lock, or check-pins loses the 1.7.1 line.
VERSIONS=(1.8.0)
# 2026-10-22: r7 is the first revision built on go 1.27.3 (r6 linked 1.27.2, CVE-2026-111943).
declare -A PIN=(
  [1.8.0]=1.8.0-r1
)
render() { local v=$1; echo "s/__VER__/$v/g; s/__REL__/${PIN[$v]}/g"; }
