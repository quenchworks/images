# lego (go-acme/lego, MIT): the ACME client and library (Let's Encrypt and other CAs) with 180+ DNS
# providers for DNS-01. Image only, no chart (a CLI for issuing and renewing certificates in jobs and
# pipelines). Images issue #70.
#
# Pure Go (CGO off) from the release tag with upstream's -X main.version. Floats: the house golang.org/x
# floor and the otel 1.47 train.
FROM_SOURCE=1
VERSIONS=(5.7.0)
declare -A SHA256=(
  [5.7.0]=0d8c5583717559bd33631b366c73bd0b46b332a3e50362a84db2ad299e284c75
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
