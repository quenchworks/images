# helm (helm/helm, Apache-2.0): the Kubernetes package manager. Two lines: Helm 4 (current) and Helm 3 (still widely used). Image only, no chart.
#
# From the release tags with the house Go floors and the otel 1.47 family loop (the cosign recipe). The version path differs per major (helm.sh/helm/v3 or v4), so the build reads the major from the version.
FROM_SOURCE=1
VERSIONS=(3.22.1 4.3.2)
declare -A SHA256=(
  [3.22.1]=f0e596af707e2e5c0411d1dd314264450fd68fa484c87fb9fdf1c3beed4323b9
  [4.3.2]=7d848fa8880cca40f9548e46255d38e3e25259847fe81775c5a09af0c3dda2e1
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
