# Inbucket (inbucket/inbucket, MIT): a disposable-email testing server. It accepts mail for any
# address over SMTP and shows it in a web UI, a REST API and POP3, without sending anything on.
# From the release tag via melange: the Go server built from source (CGO-free, the house
# golang.org/x floor raised only where below it). The web UI is Elm, which has no arm64 compiler,
# so its built static files (ui/dist, architecture-neutral) come from upstream's sha-pinned
# linux_amd64 release tarball for both arches. LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(3.2.0)
declare -A SHA256=(
  [3.2.0]=40035d9430da76d614bc6f09dc9c501bb857ed7b6d991c7374b9aea24d2e66ff
)
declare -A UI_SHA256=(
  [3.2.0]=0d7d76ed7e66b0700c38aeef7ad1f086e4a159ce554abd92c95052d0838e0e24
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g; s|__UI_SHA256__|${UI_SHA256[$1]}|g"; }
