# Inbucket: the server from the source tag, the prebuilt web UI from upstream's release tarball.
package:
  name: quench-inbucket
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Inbucket email testing server, built from source on Wolfi"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - coreutils          # sort -V for the floor check
      - go-1.26

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/inbucket/inbucket/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: mkdir -p release
  - uses: fetch
    with:
      # only ui/dist is taken from it: static files, the same on every arch
      uri: https://github.com/inbucket/inbucket/releases/download/v${{package.version}}/inbucket_${{package.version}}_linux_amd64.tar.gz
      expected-sha256: __UI_SHA256__
      strip-components: 1
      directory: release

  - name: Build
    runs: |
      set -eu
      export CGO_ENABLED=0 GOTOOLCHAIN=local GOFLAGS=-mod=mod
      # house floor (go get is exact, so raise a module only when it is below its floor)
      for m in golang.org/x/crypto@v0.58.1-0.20261009181718-2f1f834330b2 golang.org/x/net@v0.62.0 \
               golang.org/x/text@v0.43.0 golang.org/x/sys@v0.49.0; do
        have="$(go list -m -f '{{.Version}}' "${m%@*}" 2>/dev/null || true)"
        [ -n "$have" ] || continue
        [ "$(printf '%s\n%s\n' "${m#*@}" "$have" | sort -V | head -1)" = "${m#*@}" ] || go get "$m"
      done
      go mod tidy
      go build -trimpath -ldflags "-s -w -X main.version=v${{package.version}} -X main.date=v${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/inbucket" ./cmd/inbucket
      go build -trimpath -ldflags "-s -w" -o "${{targets.destdir}}/usr/bin/inbucket-client" ./cmd/client

  - name: Web UI and defaults
    runs: |
      set -eu
      d="${{targets.destdir}}/opt/inbucket"
      install -d "$d"
      cp -a release/ui/dist "$d/ui"
      test -f "$d/ui/index.html"
      install -m 0644 etc/docker/defaults/greeting.html "$d/greeting.html"

test:
  pipeline:
    - runs: |
        test -x /usr/bin/inbucket
        test -f /opt/inbucket/ui/index.html
