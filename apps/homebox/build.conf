# Homebox (sysadminsmedia/homebox, AGPL-3.0): home inventory and asset tracker (items, labels,
# locations, attachments, warranties) on SQLite or PostgreSQL. From the release tag via melange:
# the Nuxt frontend (pnpm, upstream's pinned version) generated and embedded in the CGO-free Go
# backend, stamped with -X main.version. LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(0.27.1)
declare -A SHA256=(
  [0.27.1]=db2e13136dd046d644ee173924a4bfd596f6954598eb064acc4b3153b3993c17
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
