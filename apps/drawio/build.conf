# drawio: draw.io (jgraph/drawio, Apache-2.0), the diagramming web app (flowcharts, architecture, UML,
# network diagrams), self-hosted. Images issue #73.
#
# Upstream's official draw.war release artifact, unpacked and served as static files by Wolfi nginx on 8080,
# nonroot. WEB-INF (the Java servlets the hosted service uses for its proxy and server-side export, with
# their jars) and META-INF are not shipped: the editor, local save and export in the browser work without
# them. Built from source would mean upstream's Ant + Closure Compiler pipeline for the same bundle.
# LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(32.6.10)
declare -A SHA256=(
  [32.6.10]=a57b06b3b6a876a351dacfe65d027d9509319cd030e9bacf6ae04a034d66a38f
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
