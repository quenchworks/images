# Builds Karapace from the tagged source into a self-contained venv at
# /opt/karapace/venv, with the Go extension's x/ modules floated to their fixes.
package:
  name: quench-karapace
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Karapace Kafka schema registry and REST proxy, on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - python-3.13            # the venv references the system interpreter
      - ca-certificates-bundle
      - glibc
      - libstdc++
      - tzdata
      # Native code from Wolfi, on its scanned OpenSSL: the confluent-kafka wheel carried
      # librdkafka with OpenSSL 3.5.7 in confluent_kafka.libs, grpcio a static BoringSSL
      # and cryptography a static OpenSSL.
      - librdkafka             # confluent-kafka is rebuilt from source against it
      - py3.13-grpcio-1.84
      - py3.13-cryptography

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go                     # setuptools-golang builds protopacelib with the system go
      - python-3.13
      - python-3.13-dev        # Python.h for the confluent-kafka source build
      - py3.13-pip
      - librdkafka-dev
      - py3.13-grpcio-1.84
      - py3.13-cryptography
      - rust                   # Rust extensions rebuilt from sdist (see the pipeline)
      - cargo-auditable

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/Aiven-Open/karapace/archive/refs/tags/${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      set -eu
      VER="${{package.version}}"
      dest="${{targets.destdir}}"
      export GOTOOLCHAIN=local GOFLAGS=-mod=mod
      # 0-CVE float for the Go extension (measured 2026-09-25 against 6.2.3): x/crypto,
      # x/text, x/sys and x/mod are below their fixes; x/net and x/sync float with them
      # so the family stays coherent.
      FLOOR="golang.org/x/crypto@v0.57.0 golang.org/x/text@v0.42.0 golang.org/x/sys@v0.48.0 golang.org/x/mod@v0.41.0 golang.org/x/net@v0.60.0 golang.org/x/sync@v0.23.0"
      ( cd go/protopace && go get $FLOOR && go mod tidy )
      VENV=/opt/karapace/venv
      python3.13 -m venv --system-site-packages "$VENV"
      "$VENV/bin/pip" install --no-cache-dir --upgrade pip
      SETUPTOOLS_SCM_PRETEND_VERSION="$VER" "$VENV/bin/pip" install --no-cache-dir .
      "$VENV/bin/python" -c "import importlib.metadata as m, sys; v = m.version('karapace'); assert v == sys.argv[1], v; print('karapace', v)" "$VER"
      # the floats reached the shipped library (Trivy cannot see into a *.so)
      so="$(ls "$VENV"/lib/python3.13/site-packages/protopacelib*.so)"
      for f in $FLOOR; do
        mod="${f%@*}"; want="${f#*@}"
        got="$(go version -m "$so" | awk -v m="$mod" '$1 == "dep" && $2 == m { print $3 }')"
        [ -z "$got" ] && continue
        low="$(printf '%s\n%s\n' "$got" "$want" | sort -V | head -1)"
        [ "$low" = "$want" ] || { echo "FATAL: protopacelib links $mod $got, below $want"; exit 1; }
      done
      # confluent-kafka stays that distribution at the same version, compiled from its
      # sdist against Wolfi librdkafka (same release line); grpcio and cryptography leave the
      # venv for Wolfi's copies in the system site-packages. pip check confirms the ranges.
      CK=$("$VENV/bin/python" -c "import importlib.metadata as m; print(m.version('confluent-kafka'))")
      "$VENV/bin/pip" uninstall -y grpcio cryptography
      "$VENV/bin/pip" install --no-cache-dir --no-deps --force-reinstall --no-binary confluent-kafka "confluent-kafka==${CK}"
      "$VENV/bin/pip" check
      SITE="$VENV/lib/python3.13/site-packages"
      if ls -d "$SITE"/*.libs 2>/dev/null | grep -q .; then echo "bundled native libs:"; ls -d "$SITE"/*.libs; exit 1; fi
      for p in grpc cryptography; do test ! -e "$SITE/$p" || { echo "$p still in the venv"; exit 1; }; done
      "$VENV/bin/python" -c "
      import sys, grpc, cryptography, confluent_kafka
      for m in (grpc, cryptography):
          assert m.__file__.startswith('/usr/lib/python3.13/site-packages/'), m.__file__
      lib = confluent_kafka.libversion()[0]
      assert lib.split('.')[:2] == sys.argv[1].split('.')[:2], (lib, sys.argv[1])
      print('confluent-kafka', confluent_kafka.version()[0], 'on librdkafka', lib, '; grpc', grpc.__version__, 'cryptography', cryptography.__version__, 'from Wolfi')
      " "$CK"
      # --- Rust extensions: rebuilt from sdist with cargo auditable (2026-10-13) -----
      # A PyPI Rust wheel embeds no crate list, so Trivy scanned none of its crates
      # (fastar 0.12.0 links tar 0.4.45, GHSA-3pv8 MEDIUM, passed blind). Every Rust
      # extension in the venv is rebuilt from its sdist through `cargo auditable` (the
      # wrapper reroutes only build and rustc); the .dep-v0 section lists the crates and
      # the gate scans them. Wolfi py3.13-cryptography stays blind (Wolfi apk class).
      sdist() {
        v=$("$VENV/bin/python" -c "import importlib.metadata as m, sys; print(m.version(sys.argv[1]))" "$1")
        d=$(mktemp -d)
        "$VENV/bin/pip" download -q --no-cache-dir --no-deps --no-binary "$1" "$1==$v" -d "$d"
        tar -xzf "$d"/*.tar.gz -C "$d"
        ls -d "$d"/*/
      }
      RUSTSO="
      import importlib.metadata as m, os, sys
      for d in m.distributions(path=[sys.argv[1]]):
          for f in d.files or ():
              p = str(f.locate())
              if '.so' not in f.name or os.path.islink(p):
                  continue
              b = open(p, 'rb').read()
              if b'rustc version' not in b and b'.dep-v0' not in b and b'/cargo/registry/src/' not in b:
                  continue
              if sys.argv[2] == 'all' or b'.dep-v0' not in b or not os.stat(p).st_mode & 0o111:
                  print(d.metadata['Name'] + '==' + d.version)
                  break
      "
      CW=$(mktemp -d)
      printf '#!/bin/sh\ncase "$1" in build|rustc) exec /usr/bin/cargo auditable "$@";; esac\nexec /usr/bin/cargo "$@"\n' > "$CW/cargo"
      chmod +x "$CW/cargo"
      # fastar pins tar "0.4.45" (a caret range); its lock floors to the 0.4.46 fix.
      F=$(sdist fastar)
      (cd "$F" && cargo update -p tar --precise 0.4.46)
      PATH="$CW:$PATH" "$VENV/bin/pip" install --no-cache-dir --no-deps --force-reinstall "$F"
      for spec in $("$VENV/bin/python" -c "$RUSTSO" "$SITE" blind); do
        PATH="$CW:$PATH" "$VENV/bin/pip" install --no-cache-dir --no-deps --force-reinstall --no-binary "${spec%%==*}" "$spec"
      done
      BLIND=$("$VENV/bin/python" -c "$RUSTSO" "$SITE" blind)
      test -z "$BLIND" || { echo "Rust extensions without .dep-v0: $BLIND"; exit 1; }
      echo "Rust extensions, all auditable:" $("$VENV/bin/python" -c "$RUSTSO" "$SITE" all)
      "$VENV/bin/pip" check
      "$VENV/bin/pip" uninstall -y pip
      install -d "$dest/opt/karapace"
      cp -a "$VENV" "$dest/opt/karapace/venv"
      chmod -R a+rX "$dest/opt/karapace"

test:
  pipeline:
    - runs: |
        /opt/karapace/venv/bin/python -c "from karapace.core.protobuf.protopace.protopace import Proto, format_proto; print(format_proto(Proto('a.proto', 'syntax = \"proto3\"; message A { string x = 1; }')))"
