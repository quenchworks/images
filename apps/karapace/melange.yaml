# Builds Karapace from the tagged source into a self-contained venv at
# /opt/karapace/venv, with the Go extension's x/ modules floated to their fixes.
package:
  name: quench-karapace
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Karapace Kafka schema registry and REST proxy, on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - python-3.13            # the venv references the system interpreter
      - ca-certificates-bundle
      - glibc
      - libstdc++
      - tzdata

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go                     # setuptools-golang builds protopacelib with the system go
      - python-3.13
      - py3.13-pip

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/Aiven-Open/karapace/archive/refs/tags/${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      set -eu
      VER="${{package.version}}"
      dest="${{targets.destdir}}"
      export GOTOOLCHAIN=local GOFLAGS=-mod=mod
      # 0-CVE float for the Go extension (measured 2026-09-25 against 6.2.3): x/crypto,
      # x/text, x/sys and x/mod are below their fixes; x/net and x/sync float with them
      # so the family stays coherent.
      FLOOR="golang.org/x/crypto@v0.56.0 golang.org/x/text@v0.41.0 golang.org/x/sys@v0.47.0 golang.org/x/mod@v0.40.0 golang.org/x/net@v0.58.0 golang.org/x/sync@v0.22.0"
      ( cd go/protopace && go get $FLOOR && go mod tidy )
      VENV=/opt/karapace/venv
      python3.13 -m venv "$VENV"
      "$VENV/bin/pip" install --no-cache-dir --upgrade pip
      SETUPTOOLS_SCM_PRETEND_VERSION="$VER" "$VENV/bin/pip" install --no-cache-dir .
      "$VENV/bin/python" -c "import importlib.metadata as m, sys; v = m.version('karapace'); assert v == sys.argv[1], v; print('karapace', v)" "$VER"
      # the floats reached the shipped library (Trivy cannot see into a *.so)
      so="$(ls "$VENV"/lib/python3.13/site-packages/protopacelib*.so)"
      for f in $FLOOR; do
        mod="${f%@*}"; want="${f#*@}"
        got="$(go version -m "$so" | awk -v m="$mod" '$1 == "dep" && $2 == m { print $3 }')"
        [ -z "$got" ] && continue
        low="$(printf '%s\n%s\n' "$got" "$want" | sort -V | head -1)"
        [ "$low" = "$want" ] || { echo "FATAL: protopacelib links $mod $got, below $want"; exit 1; }
      done
      "$VENV/bin/pip" uninstall -y pip
      install -d "$dest/opt/karapace"
      cp -a "$VENV" "$dest/opt/karapace/venv"
      chmod -R a+rX "$dest/opt/karapace"

test:
  pipeline:
    - runs: |
        /opt/karapace/venv/bin/python -c "from karapace.core.protobuf.protopace.protopace import Proto, format_proto; print(format_proto(Proto('a.proto', 'syntax = \"proto3\"; message A { string x = 1; }')))"
