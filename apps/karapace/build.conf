# karapace: Karapace, Aiven's Kafka schema registry (Avro, JSON Schema, Protobuf) and
# REST proxy, both Confluent-API compatible, from the tagged source into a Python 3.13
# venv on Wolfi. One image runs both roles: `karapace` (registry, 8081, the default)
# and `karapace_rest_proxy` (8082).
#
# Karapace is not on PyPI; pip builds it from the tag, including its Go extension
# (protopacelib, the Protobuf formatter and compatibility checker) via setuptools-golang.
#
# 0-CVE: the Python deps scan clean, but protopacelib.so links x/crypto v0.35.0, x/text
# v0.22.0, x/sys v0.30.0 and x/mod v0.20.0 (8 findings). Trivy does not scan a file
# named *.so as a Go binary, so the image gate cannot see them: melange.yaml floats the
# x/ set in go/protopace and asserts the built library with `go version -m`.
#
# NEWEST-ONLY: Karapace ships one supported line.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(6.2.3)
# sha256 of the GitHub tag tarball, computed from a download
declare -A SHA256=(
  [6.2.3]=f0adb04d3adae32bfe5ee8f3c14087d53d92c5af64c48681621c3cea2b6e69a0
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
