# Assembles the Netdata agent runtime image from our own package plus the Wolfi base.
# No Dockerfile. Nonroot (uid 1001), multi-arch, SBOM generated by apko.
# Headless agent: REST API (/api/v1, /api/v2, /api/v3) and the Prometheus export
# (/api/v1/allmetrics?format=prometheus) on :19999. Runs on a read-only rootfs when
# /var/lib/netdata, /var/cache/netdata, /var/log/netdata and /tmp are writable mounts.
# Host metrics need the host's /proc and /sys mounted read-only under /host and
# `-s /host` (the chart does this); without them it reports the container's own view.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-netdata@local

accounts:
  groups:
    - groupname: netdata
      gid: 1001
  users:
    - username: netdata
      uid: 1001
      gid: 1001
  run-as: 1001

paths:
  - path: /var/lib/netdata
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o755
    recursive: true
  - path: /var/cache/netdata
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o755
    recursive: true
  - path: /var/log/netdata
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o755
  - path: /run/netdata
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o755

environment:
  DISABLE_TELEMETRY: "1"
  DO_NOT_TRACK: "1"

# -D: stay in the foreground. The chart appends `-s /host`.
entrypoint:
  command: /usr/bin/netdata -D

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-netdata"
  org.opencontainers.image.licenses: "GPL-3.0-or-later"
