# STATUS: NEW 2026-10-19. Netdata agent built from the release source tarball (Wolfi has
# no netdata apk). Headless: the local dashboard is the Netdata Cloud UI (NCUL1, not OSI)
# and is not shipped; see melange.yaml for the license scope and the plugin list.
# Newest patch of the newest 2 minor lines (full X.Y.Z, used as-is).
# __VER__ = version  __SHA256__ = that release asset's sha256 (netdata-vX.Y.Z.tar.gz)
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(2.11.1 2.12.1)
declare -A SHA256=(
  [2.11.1]=388cd947786b4115a2190fd17955d544623d44ac570d6f17e0240c8fb1602c60
  [2.12.1]=39b4aea46a7227391ec592cab41e385af696f286707dd9b40ddfa967d0f24570
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
