# it-tools: IT-Tools, a collection of developer utilities in one web app (encoders, converters, generators, network
# and crypto helpers). A static Vue SPA built from the source tag with pnpm (vite) and served by nginx as nonroot
# on 8080, like homer.
#
# 0-CVE (2026-11-25): the release lockfile carries 145 findings; melange.yaml floors every library that ends up in
# the bundle with pnpm overrides (dompurify 3.5, node-forge 1.4.4, ip-address 10, vue-i18n 11, tiptap 3 ...) and
# vue-tsc type-checks the result. What stays is build tooling (babel, rollup, postcss, minimatch ...) or code a
# static SPA never loads (@vue/server-renderer; unhead's useHeadSafe, which IT-Tools does not call).
#
# NEWEST-ONLY: IT-Tools ships one line. The tag carries a commit suffix, so VERSIONS holds the date and TAG the tag.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(2024.10.22)
declare -A TAG=( [2024.10.22]=v2024.10.22-7ca5933 )
# sha256 of the GitHub source tarball, from a download
declare -A SHA256=(
  [2024.10.22]=462f31140ef535ade19aa8c808084a5e13e58e4f0391850acb326cdb9244b759
)
render() { echo "s/__VER__/$1/g; s|__TAG__|${TAG[$1]}|g; s|__SHA256__|${SHA256[$1]}|g"; }
