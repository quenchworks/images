# it-tools: vite build with pnpm (the version package.json pins) and floors on the bundled libraries, served by nginx.
package:
  name: quench-it-tools
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened IT-Tools dashboard, built from source on Wolfi"
  copyright:
    - license: GPL-3.0-only
  dependencies:
    runtime:
      - nginx

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - nodejs-24
      - npm

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/CorentinTh/it-tools/archive/refs/tags/__TAG__.tar.gz
      expected-sha256: __SHA256__

  - runs: |
      set -eu
      export HOME="$(mktemp -d)" npm_config_cache="$(mktemp -d)"
      # package.json pins pnpm@8.15.3 (packageManager)
      grep -q '"packageManager": "pnpm@8.15.3' package.json
      npm install -g --prefix "$HOME/.g" pnpm@8.15.3
      export PATH="$HOME/.g/bin:$PATH"
      # floors for every library that ends up in the bundle (images#161); the release lockfile pins older ones, so
      # pnpm re-resolves (@unhead/vue keeps the @vueuse/shared it was locked with: 15.x dropped resolveUnref)
      node -e '
        const fs = require("fs"); const p = JSON.parse(fs.readFileSync("package.json"));
        p.pnpm = Object.assign(p.pnpm || {}, { overrides: {"dompurify": "^3.5.0", "node-forge": "^1.4.4", "crypto-js": "^4.2.0", "linkify-it": "^5.0.2", "lodash": "^4.18.0", "lodash-es": "^4.18.0", "vue-i18n": "^11.4.14", "@intlify/core-base": "^11.4.14", "@intlify/shared": "^11.4.14", "figlet": "^1.11.3", "yaml": "^2.8.3", "colord": "^2.9.4", "prosemirror-view": "^1.42.3", "ip-address": "^10.7.4", "deepmerge-ts": "^8.0.0", "uuid": "^11.1.1", "markdown-it@14": "^14.3.2", "@unhead/vue>@vueuse/shared": "11.0.3", "@tiptap/core": "^3.30.4", "@tiptap/pm": "^3.30.4", "@tiptap/starter-kit": "^3.30.4"} });
        Object.assign(p.dependencies, { "@tiptap/pm": "^3.30.4", "@tiptap/starter-kit": "^3.30.4", "@tiptap/vue-3": "^3.30.4" });
        fs.writeFileSync("package.json", JSON.stringify(p, null, 2));'
      pnpm install --no-frozen-lockfile
      grep -q "/dompurify@3\.[5-9]" pnpm-lock.yaml
      ! grep -q "/ip-address@7\." pnpm-lock.yaml
      pnpm run build
      test -f dist/index.html

      D="${{targets.destdir}}"
      install -d "$D/usr/share/nginx/html" "$D/etc/it-tools"
      cp -a dist/. "$D/usr/share/nginx/html/"
      cat > "$D/etc/it-tools/nginx.conf" <<'EOF'
      daemon off;
      worker_processes auto;
      pid /tmp/nginx.pid;
      error_log /dev/stderr notice;

      events {
          worker_connections 1024;
      }

      http {
          include       /etc/nginx/mime.types;
          default_type  application/octet-stream;

          client_body_temp_path /tmp/client_body_temp;
          proxy_temp_path       /tmp/proxy_temp;
          fastcgi_temp_path     /tmp/fastcgi_temp;
          uwsgi_temp_path       /tmp/uwsgi_temp;
          scgi_temp_path        /tmp/scgi_temp;

          access_log /dev/stdout;
          sendfile      on;
          gzip          on;
          server_tokens off;

          server {
              listen      8080;
              server_name _;
              root        /usr/share/nginx/html;
              index       index.html;

              location / {
                  try_files $uri $uri/ /index.html;
              }
          }
      }
      EOF

test:
  pipeline:
    - runs: |
        test -f /usr/share/nginx/html/index.html
