# dependency-track-frontend: the OWASP Dependency-Track web UI (a Vue single-page app)
# from its official release bundle (frontend-dist.zip), served by Wolfi's nginx.
# FROM_SOURCE=0: fetch + unpack; the sha256 is from a download that matched the
# release's checksums.txt. Versioned with the API server (apps/dependency-track).
FROM_SOURCE=0
VERSIONS=(5.1.2)
declare -A SHA256=(
  [5.1.2]=7c7f67ebf57d8c0bf4bf7d3513872af0d2f7660d19226483c85be25cdcdc33ae
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
