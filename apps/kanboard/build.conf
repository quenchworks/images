# Kanboard (kanboard/kanboard, MIT): Kanban project management with swimlanes, automatic actions,
# plugins and a JSON-RPC API, on SQLite, PostgreSQL or MySQL. The release tag is the finished app
# (vendor/ and the built assets are committed), laid down under /var/www/app and served by php-fpm
# 8.4 behind QuenchWorks' nginx (quench-nginx, built from source in the same build) under
# supervisord, the house PHP pattern (phpmyadmin, drupal). Configuration is environment variables
# (DB_DRIVER, DB_*, DATA_DIR): Kanboard reads them itself. LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(1.2.57)
declare -A SHA256=(
  [1.2.57]=4f0e6d07ddf17361d2ccfa0d3910a18c3e8334816744cf1b220bff4a181fa5f4
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
