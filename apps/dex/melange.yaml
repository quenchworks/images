# Builds Dex (dexidp/dex) from source onto Wolfi. CGO is ON: Dex's SQLite storage
# backend (mattn/go-sqlite3) defines sql.SQLite3 only under cgo, and cmd/dex/config.go
# references it on the 2.43/2.44 lines, so a CGO_ENABLED=0 build fails with
# "undefined: sql.SQLite3". gcc comes from build-base; the binary is glibc-linked.
# Dex's main package is at ./cmd/dex, producing the full `dex` binary (serve, version,
# and the OIDC server). The version is stamped via -X main.version so `dex version`
# reports the real release. Output is a signed APK in Quenchworks' own repo. No upstream
# distro binaries.
package:
  name: quench-dex
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Dex OIDC identity provider, built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - glibc
      - libgcc

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/dexidp/dex/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      export CGO_ENABLED=1
      export GOFLAGS=-mod=mod
      export GOTOOLCHAIN=local
      # Comprehensive 0-CVE gate: six FIXABLE transitive deps flagged (all
      # minor/patch, API-compatible, same major -- not a fork/force). Bump to the
      # fixed versions from the gate, then tidy so the graph is consistent:
      #   golang.org/x/crypto              v0.48.0 -> v0.52.0 (CVE-2026-39827..35,
      #                                    -39831..34, -42508, -46595/97/98 x/crypto/ssh*)
      #   golang.org/x/net                 v0.50.0 -> v0.55.0 (CVE-2026-25680/81,
      #                                    -27136/41, -33814, -39821, -42502/06 html+http2+idna)
      #   google.golang.org/grpc           v1.79.1 -> v1.79.3 (CVE-2026-33186 authz path)
      #   github.com/go-jose/go-jose/v4    v4.1.3  -> v4.1.4  (CVE-2026-34986 JOSE DoS)
      #   github.com/Azure/go-ntlmssp      v0.0.0- -> v0.1.1  (CVE-2026-32952 NTLM DoS)
      #   github.com/russellhaering/goxmldsig v1.5.0 -> v1.6.0 (CVE-2026-33487 integrity)
      #   go.opentelemetry.io/otel         v1.39.0 -> v1.41.0 (CVE-2026-29181 baggage DoS;
      #                                    surfaced by `go mod tidy` re-resolving otel)
      #   golang.org/x/net                 v0.55.0 -> v0.56.0 (CVE-2026-46600)
      #   golang.org/x/text                v0.37.0 -> v0.39.0 (CVE-2026-56852)
      go get \
        golang.org/x/crypto@v0.53.0 \
        golang.org/x/mod@v0.40.0 \
        golang.org/x/net@v0.56.0 \
        golang.org/x/text@v0.39.0 \
        google.golang.org/grpc@v1.82.1 \
        github.com/go-jose/go-jose/v4@v4.1.4 \
        github.com/Azure/go-ntlmssp@v0.1.1 \
        github.com/russellhaering/goxmldsig@v1.6.0 \
        go.opentelemetry.io/otel@v1.43.0
      go mod tidy
      go build -trimpath \
        -ldflags "-s -w -X main.version=${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/dex" ./cmd/dex
