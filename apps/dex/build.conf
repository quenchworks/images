# dex (dexidp/dex): from-source via melange (Go build from the git tag tarball).
# OIDC identity provider. Latest patch of the last 3 minor lines (2.43, 2.44, 2.45).
# Each release pins its source tarball by sha256. Single static Go binary, no CGO.
# Version is stamped into the binary via -X on main.version (dex's cmd/dex `var version`).
FROM_SOURCE=1
VERSIONS=(2.45.1)
declare -A SHA256=(
  [2.45.1]=6dc9bf768d67723d8117268d5177c7450519608f5403cd10e857c89465fa2b9e
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
