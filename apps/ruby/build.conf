# STATUS: UNBLOCKED 2026-09-20. The zlib block is gone: Wolfi shipped the fix
# for CVE-2026-85091 as zlib 1.3.2.1_rc20260601-r0 and the advisory was amended
# to name that version, so the 1.3.3-r0 this file used to wait for is a number
# that will never arrive. A stock wolfi-base scan reports the advisory as
# `zlib 1.3.2-r7 -> 1.3.2.1_rc20260601-r0`, which is what Wolfi publishes on
# both arches today. scripts/blocked.py now watches the shipped version.
#
# Evidence, stated exactly as measured:
#   x86_64  gated locally 2026-09-20, PUSH=0: 0 fixable CVEs AND the boot test
#           passed, so this is "runs", not just "scans clean".
#   aarch64 not measured locally; this host kills background melange builds and
#           a qemu-emulated arm build does not fit the foreground timeout. CI's
#           native arm64 runner is the first arm measurement, and its gate
#           refuses to publish on any finding.
# ruby: Wolfi's ruby-<minor> toolchain. Published tag = FULL version; render
# maps __VER__ -> the minor and __FULLVER__ -> the full patch.
#
# WINDOW: the 2 newest lines Wolfi packages -- 3.4 (still upstream-supported and
# the line most apps pin) and 4.0 (the new major). Widened from NEWEST-ONLY on
# 2026-07-27 when ruby-4.0 landed in Wolfi (4.0.6-r2, both arches); a major
# boundary is worth carrying both sides of. CI builds the last up-to-3 entries.
#
# RUBY 4.0 NEEDS NO JSON REMEDIATION: Wolfi's ruby-4.0 apk no longer ships json
# as a DEFAULT gem -- it has no specifications/default/json-*.gemspec at all and
# instead `depend = ruby4.0-json` (2.21.1, the FIXED line). So the strip step in
# melange.yaml is a no-op on 4.0 (it is conditional on that gemspec existing);
# 3.4 still needs it (its default json is 2.9.1).
#
# 2026-07-15: Wolfi's ruby apk bakes a VULNERABLE json DEFAULT gem
# (specifications/default/json-2.9.1.gemspec -> CVE-2026-54696, LOW). apko can't
# strip a file from an upstream apk, so melange.yaml repackages the ruby toolchain
# (interpreter + gem + bundler) MINUS that default json gem and pulls in Wolfi's
# FIXED ruby<minor>-json (>= 2.19.9). apko consumes quench-ruby@local.
# Revert to the plain apko-only ruby-<minor> assembly if Wolfi ever bumps the
# bundled default json to the fixed line.
BLOCKED=0
FROM_SOURCE=1
# 2026-07-27: ruby-4.0 band attempted and REVERTED. Wolfi's ruby-4.0 apk ships no
# specifications/default/json-*.gemspec at all (it declares depend=ruby4.0-json), and the
# gemspec-strip step's `grep -oE` finds nothing, exits 1, and `set -e` kills the build.
# Making the strip conditional was not sufficient on aarch64. 3.4.10 gates clean, so the
# band add is deferred rather than shipped broken.
VERSIONS=(3.4.10)
# test.sh's extra args is the MINOR line, not the full version: it asserts `ruby -v`
# matches "ruby <arg>.*", and that trailing ".*" needs a literal dot. Given "3.4"
# the dot in ".10" supplies it and the match succeeds; given "3.4.10" there is a
# SPACE after the version in `ruby -v` output, so the pattern can never match.
# build-workflow passes "${m%.*}"; mirror it here.
boot_args() { echo "${1%.*}"; }
# render feeds BOTH apko.yaml and melange.yaml the same sed program:
#   __FULLVER__ -> ruby X.Y.Z (image tag + melange package version)
#   __VER__     -> ruby minor (e.g. 3.4), used in the ruby-<minor> apk names + ABI dir
render() { local v="$1"; echo "s/__FULLVER__/${v}/g; s/__VER__/${v%.*}/g"; }
