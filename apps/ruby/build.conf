# ruby: Wolfi's ruby-<minor> toolchain. Published tag = FULL version; render
# maps __VER__ -> the minor and __FULLVER__ -> the full patch.
#
# WINDOW: the 2 newest lines Wolfi packages -- 3.4 (still upstream-supported and
# the line most apps pin) and 4.0 (the new major). Widened from NEWEST-ONLY on
# 2026-07-27 when ruby-4.0 landed in Wolfi (4.0.6-r2, both arches); a major
# boundary is worth carrying both sides of. CI builds the last up-to-3 entries.
#
# RUBY 4.0 NEEDS NO JSON REMEDIATION: Wolfi's ruby-4.0 apk no longer ships json
# as a DEFAULT gem -- it has no specifications/default/json-*.gemspec at all and
# instead `depend = ruby4.0-json` (2.21.1, the FIXED line). So the strip step in
# melange.yaml is a no-op on 4.0 (it is conditional on that gemspec existing);
# 3.4 still needs it (its default json is 2.9.1).
#
# 2026-07-15: Wolfi's ruby apk bakes a VULNERABLE json DEFAULT gem
# (specifications/default/json-2.9.1.gemspec -> CVE-2026-54696, LOW). apko can't
# strip a file from an upstream apk, so melange.yaml repackages the ruby toolchain
# (interpreter + gem + bundler) MINUS that default json gem and pulls in Wolfi's
# FIXED ruby<minor>-json (>= 2.19.9). apko consumes quench-ruby@local.
# Revert to the plain apko-only ruby-<minor> assembly if Wolfi ever bumps the
# bundled default json to the fixed line.
FROM_SOURCE=1
VERSIONS=(3.4.10 4.0.6)
# render feeds BOTH apko.yaml and melange.yaml the same sed program:
#   __FULLVER__ -> ruby X.Y.Z (image tag + melange package version)
#   __VER__     -> ruby minor (e.g. 3.4), used in the ruby-<minor> apk names + ABI dir
render() { local v="$1"; echo "s/__FULLVER__/${v}/g; s/__VER__/${v%.*}/g"; }
