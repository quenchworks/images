# Assembles a hardened Ruby runtime/base image. Normally this would be a pure
# apko package-assembly of Wolfi's `ruby-__VER__` (+ `ruby__VER__-bundler`), but
# Wolfi's ruby apk bakes a VULNERABLE json DEFAULT gem (json < 2.19.9 ->
# CVE-2026-54696, LOW) as `specifications/default/json-*.gemspec`. apko cannot
# strip a file from an upstream apk, so melange.yaml repackages the ruby toolchain
# MINUS that default json gem and pulls in Wolfi's fixed `ruby__VER__-json`
# (>= 2.19.9) as the json provider. apko consumes `quench-ruby@local`.
# Revert to the plain apko-only assembly if Wolfi ever bumps the bundled default
# json to the fixed line.
#
# IMAGE-ONLY -- no Helm chart. This is a LANGUAGE/BASE image: the 0-CVE, signed,
# nonroot, multi-arch answer to `ruby:3.x-slim`. Developers `FROM` it (like
# Chainguard's language images) or run scripts directly.
#
# TEMPLATE NOTE: `__VER__` is the Ruby minor (e.g. 3.4); melange also uses
# `__FULLVER__` (the full patch, e.g. 3.4.10). CI/build.conf substitutes both.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-ruby@local         # Wolfi ruby-__VER__ + bundler + FIXED json,
                                # repackaged w/o the vulnerable default json gem
                                # (see melange.yaml); provides ruby + gem + bundle

accounts:
  groups:
    - groupname: nonroot
      gid: 1001
  users:
    - username: nonroot
      uid: 1001
      gid: 1001
  run-as: 1001

# Interpreter as the entrypoint: `docker run <img> script.rb` or `-e '...'`.
entrypoint:
  command: /usr/bin/ruby

# HOME + a writable GEM_HOME so `gem install` / bundler work on a read-only
# rootfs. GEM_HOME points at /tmp so a single `--tmpfs /tmp` (the same knob
# Python's pip needs) is enough, with no extra volume required.
environment:
  HOME: /home/nonroot
  GEM_HOME: /tmp/.gem
  BUNDLE_PATH: /tmp/.gem
  BUNDLE_USER_HOME: /tmp/.bundle

work-dir: /home/nonroot

paths:
  - path: /home/nonroot
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o755

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-ruby"
  org.opencontainers.image.licenses: "Ruby"
