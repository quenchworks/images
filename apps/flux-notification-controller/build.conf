# flux-notification-controller: Flux's notification-controller, from source via melange (Go build of main.go from the git tag
# tarball). Static Go binary, no CGO. Flux ships one version of each controller per
# Flux release, so this tracks the latest only. The binary carries no version stamp.
FROM_SOURCE=1
VERSIONS=(1.9.4)
declare -A SHA256=(
  [1.9.4]=7b2713ad59527df739c4c4ceef99925db05a58ef4c19cb263e4b7193face2fb7
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
