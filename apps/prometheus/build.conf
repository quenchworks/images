# prometheus: from-source via melange (Go build, git-checkout pinned per release).
# Latest 3 stable minor lines, newest patch each. Each release pins its git commit.
FROM_SOURCE=1
VERSIONS=(3.11.3 3.12.0 3.13.0)
declare -A COMMIT=(
  [3.11.3]=eb173f5256d4022afba1e9bc3d19740a76859fae
  [3.12.0]=9f27dffc1f93ca23287972f632025879f2d1c658
  [3.13.0]=40af9c2cdc0eda00f3622e867a27f6359f7295f3
)
render() { echo "s/__VER__/$1/g; s/__COMMIT__/${COMMIT[$1]}/g"; }
