# bifrost: Go AI gateway. Unified OpenAI-compatible access, load balancing and
# failover across providers. From-source via melange.
#
# TAGS ARE PER COMPONENT. bifrost is a monorepo and tags every module
# separately (transports/vX.Y.Z, framework/vX.Y.Z, plugins/<name>/vX.Y.Z). The
# shipped artifact is the HTTP gateway in transports/, so the version window and
# scripts/check/bifrost.py both track the transports/v line and ignore the rest.
# The fetch URI keeps the prefix: .../archive/refs/tags/transports/v<version>.tar.gz
#
# Newest patch of the last three minor lines of that component.
#
# TWO toolchains, both the same for every shipped line (measured 2026-09-20, not
# assumed from one tag): transports/go.mod asks for go 1.27.0 and .nvmrc pins
# Node 22.12.0 on 2.2.1, 2.1.1 and 2.0.0 alike, so no per-version map is needed.
#
# The build has two stages, mirroring upstream's own Dockerfile:
#   1. the React UI in ui/ is built with Node and copied to
#      transports/bifrost-http/ui, where the Go binary embeds it;
#   2. the gateway is built with CGO ON, because gorm's sqlite driver pulls in
#      github.com/mattn/go-sqlite3. That driver compiles the bundled sqlite
#      amalgamation into the binary, so nothing links sqlite at runtime.
#
# Upstream's Dockerfile adds -extldflags '-static' on an alpine/musl base. That
# is dropped here on purpose: Wolfi is glibc, where a fully static cgo binary is
# a trap (NSS warns and resolver behaviour changes). The image carries glibc
# instead, which is what every other cgo recipe in this catalog does.
#
# The UI is built with `npm run build-enterprise`. Despite the name that script
# is only `vite build && npm run typecheck`; it differs from `build` solely by
# skipping a copy step the recipe does itself. The repo is Apache-2.0 with no
# separate licence under ui/, checked at the tag.
FROM_SOURCE=1
VERSIONS=(2.0.0 2.1.1 2.2.1)
declare -A SHA256=(
  [2.0.0]=e7c2e5385a95ebed0f0865e2abbcdbc58ed4a203490b10caaa98747f2dee2aff
  [2.1.1]=7799401c333a73437c5d3394677162322dd35ba8c46fe0073a1638ba525916e1
  [2.2.1]=e51ce89031d199482de2b593c7c05faf9b71da7c85bded469e72d525e536e939
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
