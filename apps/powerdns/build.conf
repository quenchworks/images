# powerdns: PowerDNS Authoritative Server, built FROM SOURCE from the release
# tarballs on downloads.powerdns.com.
#
# Why not Wolfi's pdns-<line> apks: those are the RECURSOR's origin, built from
# the rec-X.Y.Z tag. The pdns_server in them is authoritative code from that
# tree, not an authoritative release, and reports 0.0.0.HEAD.<sha>.dirty
# (checked 2026-09-27 on pdns-5.4 5.4.2-r0, source rec-5.4.2). Authoritative
# releases are auth-X.Y.Z, on their own line (5.1.4 while the recursor is 5.4).
#
# WINDOW: the two maintained authoritative lines, 5.0 and 5.1.
#
# Why LMDB by default: the SQL backends need a schema loaded before first start,
# and a shell-free image has no sqlite3 or psql to load one. LMDB creates its
# file on first start and supports the HTTP API's zone creation and DNSSEC.
# gsqlite3, gpgsql, gmysql and bind are compiled in too.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(5.0.7 5.1.4)
declare -A SHA256=(
  [5.0.7]=89dd2ae6f3ac155caa7f9c73172297505d41d248bf1afe4675d879b631f36bdf
  [5.1.4]=f8a10edbf60e49d8c160e93121989d5ebcdad838d0e0b747f26ef7e89fd220c0
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
