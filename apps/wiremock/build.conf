# wiremock: WireMock, the HTTP API mock server (stubs, response templating, proxying and
# recording, fault injection, a request journal and the admin API), assembled from its
# unshaded Maven artifacts on a Wolfi openjdk-21-jre, on Jetty 12 (wiremock-jetty12).
#
# Why not the standalone jar: it shades every dependency and strips their pom.properties,
# so trivy sees one package and 0 findings while it carries Jetty 12.0.30, Jackson 2.20.1,
# handlebars 4.3.1, commons-lang3 3.12.0 and httpcore5 5.3.6 (19 findings, measured
# 2026-09-25 against the resolved tree). melange.yaml resolves wiremock-jetty12 with a
# pom that pins each family to its fixed release; the resulting lib/ scanned 0.
#
# NEWEST-ONLY: the pin set (notably handlebars core 4.5.5 with handlebars-helpers kept at
# 4.3.1, the last with the NumberHelper WireMock 3 loads) was run-tested on 3.13.2.
BLOCKED=0
FROM_SOURCE=0
VERSIONS=(3.13.2)
render() { echo "s/__VER__/$1/g"; }
