# hoppscotch-admin: pnpm workspace build of the self-hosted admin dashboard, on Wolfi Node 24.
package:
  name: quench-hoppscotch-admin
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Hoppscotch admin dashboard, built from source on Wolfi"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - caddy
      - ca-certificates-bundle
      - nodejs-24

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - nodejs-24
      - npm
      - python-3

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/hoppscotch/hoppscotch/archive/refs/tags/${{package.version}}.tar.gz
      expected-sha256: __SHA256__
      strip-components: 1

  - name: Build the admin dashboard
    runs: |
      set -eu
      export HOME="$(mktemp -d)" npm_config_cache="$(mktemp -d)"
      npm install -g --prefix "$HOME/.g" pnpm@10.34.9
      export PATH="$HOME/.g/bin:$PATH"
      cp .env.example .env
      pnpm install --frozen-lockfile
      cd packages/hoppscotch-sh-admin
      HOPP_ALLOW_RUNTIME_ENV=true pnpm run build --outDir dist
      test -f dist/index.html
      install -d /opt/hoppscotch
      cp -a dist /opt/hoppscotch/sh-admin

  - name: Install
    runs: |
      set -eu
      D="${{targets.destdir}}"
      install -d "$D/opt"
      cp -a /opt/hoppscotch "$D/opt/hoppscotch"
      install -m644 quench-run.mjs "$D/opt/hoppscotch/quench-run.mjs"
      # not /etc/caddy/Caddyfile: Wolfi's caddy package owns that path
      install -m644 Caddyfile "$D/opt/hoppscotch/Caddyfile"
      # /site is where Caddy looks; quench-run.mjs fills its /tmp target at startup
      ln -s /tmp/hoppscotch-site "$D/site"
      # self-check: quench-run.mjs replaces every VITE_* placeholder the build left
      node --input-type=module -e '
        const fs = await import("node:fs"), path = await import("node:path")
        const { inject } = await import(process.argv[2])
        let n = 0
        for (const f of fs.readdirSync(process.argv[1], { recursive: true }).map((f) => path.join(process.argv[1], f))) {
          if (f.endsWith(".map") || !fs.statSync(f).isFile()) continue
          const c = fs.readFileSync(f, "utf8")
          if (!c.includes("import_meta_env_placeholder")) continue
          const o = inject(c, { VITE_BACKEND_GQL_URL: "http://quench.check/graphql" })
          if (o.includes("import_meta_env_placeholder") || !o.includes("quench.check")) { console.error("not injected: " + f); process.exit(1) }
          n++
        }
        if (!n) { console.error("no VITE_* placeholder in the build"); process.exit(1) }
        console.log(n + " file(s) carry the VITE_* placeholder")' /opt/hoppscotch/sh-admin "$PWD/quench-run.mjs"

test:
  pipeline:
    - runs: |
        test -f /opt/hoppscotch/sh-admin/index.html
