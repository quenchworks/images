# hoppscotch-admin: the Hoppscotch self-hosted admin dashboard (Vue, Vite) on 3100: users, teams, SMTP and auth
# settings for a Hoppscotch instance. Built from the source tag with pnpm on Wolfi Node 24; Caddy from Wolfi serves
# the static build. Pairs with hoppscotch-backend and hoppscotch-web.
#
# Runtime env (VITE_BASE_URL, VITE_BACKEND_GQL_URL and the rest) is written into the build at startup by
# import-meta-env, on a copy under /tmp, so the rootfs stays read-only.
#
# NEWEST-ONLY: Hoppscotch ships monthly.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(2026.11.0)
# sha256 of the GitHub source tarball, from a download
declare -A SHA256=(
  [2026.11.0]=8f0c86010924cc86b74a14af229a6818fe73128e1abe4fece0bb9332f2851569
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
