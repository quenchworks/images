# caldera: MITRE Caldera, an adversary emulation platform (ATT&CK-mapped abilities run by agents) for red and
# purple teaming. Built from the source tag plus the plugin commits the tag pins as git submodules (each fetched
# by sha256 in melange.yaml), a Python 3.13 venv, the magma Vue UI built with npm, and the sandcat and manx
# agents compiled from source. For authorized testing only.
#
# Plugins shipped: the default set (access, atomic, compass, debrief, fieldmanual, manx, response, sandcat,
# stockpile, training) plus magma. Not shipped: builder (needs Docker), emu (pyminizip, no fix), gameboard,
# human, ssl (the chart terminates TLS). atomic is shipped but not enabled: it git-clones atomic-red-team at
# startup. Every committed prebuilt binary is removed; stockpile's Windows payloads (Akagi64.exe, debugger.dll,
# debugger.exe, minidump.exe, totallylegit.exe, HostingCLRx64.dll, sshpass) have no source in the repo, so abilities that drop them fail.
#
# 0-CVE (2026-11-24): requirements floored (aiohttp 3.14.4, asyncssh 2.24.0, dnspython 2.9.2, svglib 2.3.1,
# marshmallow 3.26.2, Markdown 3.8.1, setuptools 84.1.0); cryptography and lxml come from Wolfi; magma's runtime
# libs floored by npm overrides; gocat on the house golang.org/x floor.
#
# NEWEST-ONLY: Caldera ships one line. The plugin pins in melange.yaml change with every release.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(5.3.0)
# sha256 of the GitHub source tarball, from a download
declare -A SHA256=(
  [5.3.0]=23f79e83ccf6215bac627f96bed303f09b1759f524a151608279b08574c5eff1
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
