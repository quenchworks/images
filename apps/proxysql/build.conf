# proxysql: ProxySQL, the MySQL-protocol proxy, assembled from Wolfi's pinned
# `proxysql` apk (FROM_SOURCE=0, the varnish pattern). melange builds only
# quench-proxysql-config, which carries a bootable /etc/proxysql/quench.cnf.
#
# WINDOW: the 3.0 line only. Upstream marks 3.1.x and 4.0.x as prereleases on
# GitHub, and Wolfi packages only 3.0.x. Wolfi lags upstream by a patch or two
# (3.0.9 here while upstream is at 3.0.11); scripts/check/proxysql.py prints both.
BLOCKED=0
FROM_SOURCE=0
VERSIONS=(3.0.9)
declare -A PIN=( [3.0.9]=3.0.9-r0 )
render() { local v=$1; echo "s/__VER__/$v/g; s|__PKG__|proxysql=${PIN[$v]}|g"; }
