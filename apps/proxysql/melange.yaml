# Packages the DEFAULT ProxySQL config only; proxysql itself comes from Wolfi's
# `proxysql` apk (see build.conf), which owns /etc/proxysql.cnf. Ours lives at
# /etc/proxysql/quench.cnf and the image passes -c.
package:
  name: quench-proxysql-config
  version: __VER__
  epoch: 0
  description: "Bootable default config for the Quenchworks hardened ProxySQL image"
  copyright:
    - license: GPL-3.0-or-later

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox

pipeline:
  - runs: |
      d="${{targets.destdir}}"
      install -d "$d/etc/proxysql"
      # No errorlog line: in the foreground (-f) proxysql logs to stdout.
      # The admin user `admin` can only log in from localhost; ProxySQL enforces
      # that itself. Remote admin needs a second account, which the chart adds
      # from a Secret. No backends and no users: the chart supplies those.
      cat > "$d/etc/proxysql/quench.cnf" <<'CONF'
      datadir="/var/lib/proxysql"

      admin_variables=
      {
        admin_credentials="admin:admin"
        mysql_ifaces="0.0.0.0:6032"
      }

      mysql_variables=
      {
        threads=4
        max_connections=2048
        interfaces="0.0.0.0:6033"
        default_schema="information_schema"
        monitor_username="monitor"
        monitor_password="monitor"
      }
      CONF
      chmod 0644 "$d/etc/proxysql/quench.cnf"
