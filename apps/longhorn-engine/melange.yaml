# Builds the Longhorn engine image contents from pinned source tarballs: libqcow, liblonghorn,
# tgt and sg3_utils in C, then longhorn (static, cgo) and longhorn-instance-manager in Go.
package:
  name: quench-longhorn-engine
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Longhorn engine (v1 data engine, tgt, instance-manager), built from source"
  copyright:
    - license: Apache-2.0
    - license: LGPL-3.0-or-later   # libqcow
    - license: GPL-2.0-only        # tgt
    - license: BSD-2-Clause        # sg3_utils (sg_raw)
  dependencies:
    runtime:
      - bash
      - busybox
      - ca-certificates-bundle
      - cifs-utils
      - e2fsprogs
      - grpc-health-probe
      - iproute2
      - iputils
      - jq
      - libaio
      - nfs-utils
      - qemu-utils
      - tini

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - gettext-dev
      - glibc-dev
      - go
      - libaio-dev
      - libtool
      - zlib-dev
      - zlib-static

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/longhorn/longhorn-instance-manager/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __IM_SHA256__
      extract: false
  # Same basename as the engine tarball below: move it aside before that fetch.
  - runs: mv "v${{package.version}}.tar.gz" _im-src.tar.gz
  - uses: fetch
    with:
      uri: https://github.com/longhorn/longhorn-engine/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - uses: fetch
    with:
      uri: https://github.com/longhorn/libqcow/archive/__LIBQCOW__.tar.gz
      expected-sha256: __LIBQCOW_SHA256__
      extract: false
  - uses: fetch
    with:
      uri: https://github.com/rancher/liblonghorn/archive/__LIBLONGHORN__.tar.gz
      expected-sha256: __LIBLONGHORN_SHA256__
      extract: false
  - uses: fetch
    with:
      uri: https://github.com/rancher/tgt/archive/__TGT__.tar.gz
      expected-sha256: __TGT_SHA256__
      extract: false
  - uses: fetch
    with:
      uri: https://github.com/doug-gilbert/sg3_utils/archive/refs/tags/release-__SG3__.tar.gz
      expected-sha256: __SG3_SHA256__
      extract: false
  - name: native dependencies (libqcow static, liblonghorn, tgt, sg_raw)
    runs: |
      set -eu
      d="${{targets.destdir}}/usr/local/bin"
      install -d "$d"
      for s in __LIBQCOW__:libqcow __LIBLONGHORN__:liblonghorn __TGT__:tgt release-__SG3__:sg3; do
        mkdir "_${s#*:}"; tar xzf "${s%%:*}.tar.gz" -C "_${s#*:}" --strip-components=1
      done
      (cd _libqcow && ./configure --prefix=/usr --enable-static --disable-shared --without-libfuse >/dev/null && make -j"$(nproc)" >/dev/null && make install >/dev/null)
      test -f /usr/lib/libqcow.a
      (cd _liblonghorn && make && make install)
      # tgt: programs only (the docs need docbook). Its -Werror trips GCC 16's
      # maybe-uninitialized in bs_sheepdog.c (a backend Longhorn does not use); warnings stay on.
      sed -i 's/ -Werror / /' _tgt/usr/Makefile
      (cd _tgt && make -j"$(nproc)" programs && install -m755 usr/tgtd usr/tgtadm usr/tgtimg "$d/" && install -m755 scripts/tgt-setup-lun "$d/")
      (cd _sg3 && ./autogen.sh >/dev/null && ./configure --prefix=/usr --disable-shared >/dev/null && make -j"$(nproc)" -C lib >/dev/null && make -C src sg_raw >/dev/null && install -m755 src/sg_raw "$d/")
      install -m755 package/launch-simple-longhorn package/engine-manager package/launch-simple-file "$d/"
  - name: longhorn and longhorn-instance-manager
    runs: |
      set -eu
      export GOTOOLCHAIN=local CGO_ENABLED=1
      d="${{targets.destdir}}/usr/local/bin"
      # 0-CVE floors (docs/go-module-float.md), raised only where go.mod is below them; a
      # module absent from the graph is skipped. Same set as longhorn-manager.
      FLOOR="golang.org/x/crypto@v0.56.0 golang.org/x/mod@v0.40.0 golang.org/x/net@v0.58.0 golang.org/x/text@v0.41.0 google.golang.org/grpc@v1.83.2"
      floor() {
        need=""
        for mv in $FLOOR; do
          have="$(GOFLAGS=-mod=mod go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${mv%@*}" 2>/dev/null)"
          case "$have" in v[0-9]*) ;; *) continue ;; esac
          [ "$(printf '%s\n%s\n' "$have" "${mv#*@}" | sort -V | head -1)" = "${mv#*@}" ] || need="$need $mv"
        done
        echo "raising ($1):${need:- nothing}"
        if [ -n "$need" ]; then
          GOFLAGS=-mod=mod go get $need
          GOFLAGS=-mod=mod go mod tidy
          GOFLAGS=-mod=mod go mod vendor
        fi
      }
      # Static like upstream: the engine-image DaemonSet copies this binary to the host.
      ld="-s -w -X main.Version=v${{package.version}} -linkmode external -extldflags -static"
      floor engine
      go build -trimpath -tags netgo -ldflags "$ld" -o "$d/longhorn" .
      mkdir _im && tar xzf _im-src.tar.gz -C _im --strip-components=1
      (cd _im && floor instance-manager && go build -trimpath -tags netgo -ldflags "$ld" -o "$d/longhorn-instance-manager" .)
      for b in longhorn longhorn-instance-manager; do
        ! readelf -d "$d/$b" | grep -q NEEDED || { echo "$b is not static"; exit 1; }
        grep -aq "v${{package.version}}" "$d/$b"
      done

test:
  pipeline:
    - runs: |
        set -eu
        /usr/local/bin/longhorn version --client-only | grep -q "v${{package.version}}"
        /usr/local/bin/tgtd --version
        test -x /usr/local/bin/sg_raw
        test -x /usr/local/bin/longhorn-instance-manager
