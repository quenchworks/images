# skopeo: Skopeo, the daemonless CLI to inspect, copy, sync and delete container images
# between registries and storage transports, built from source on Wolfi (static Go, the
# cgo-free tag set from upstream's DISABLE_CGO build). Image only, no chart.
#
# Why not Wolfi's skopeo apk: measured 2026-09-25, 1.23.0-r0 is one minor behind
# upstream's 1.24.1 and links Go 1.26.3, x/crypto, x/net, x/text, grpc and fulcio below
# their fixes.
#
# NEWEST-ONLY: Skopeo ships one supported line.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(1.24.1)
# sha256 of the GitHub tag tarball, computed from a download
declare -A SHA256=(
  [1.24.1]=6a3f342a327ec7684198eb0e15114940b6101506db48d9a96590f5942cb3b335
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
