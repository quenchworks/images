# Builds Skopeo from source onto Wolfi: static Go with upstream's cgo-free tag set
# (DISABLE_CGO=1 in its Makefile). The version is a constant in version/version.go.
package:
  name: quench-skopeo
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Skopeo container image tool, built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - containers-common      # /etc/containers/policy.json and registries.conf

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/containers/skopeo/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      set -eu
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      export GO111MODULE=on
      export GOTOOLCHAIN=local
      # ---- 0-CVE module float (docs/go-module-float.md) ----------------------
      # Measured at 1.24.1: its go.mod is below the fixes for x/crypto (0.54.0), x/net
      # (0.56.0), x/text (0.40.0) and grpc (1.82.0). fulcio 1.8.7 already clears Wolfi's
      # finding. The module is vendored; -mod=mod builds from the module cache instead,
      # so the floats apply. skopeo's go.mod declares no `replace`.
      FLOOR="golang.org/x/crypto@v0.56.0 golang.org/x/text@v0.41.0 golang.org/x/sys@v0.47.0 golang.org/x/net@v0.58.0 golang.org/x/sync@v0.22.0 google.golang.org/grpc@v1.83.2"
      MODS="$(echo "$FLOOR" | tr ' ' '\n' | cut -d@ -f1)"
      # prints "<mod>@<floor> (<tag> has <ver>)" for every module below its floor
      below_floor() {
        awk -v floor="$FLOOR" -v tag="$1" '
          BEGIN { n = split(floor, f, " ")
                  for (i = 1; i <= n; i++) { split(f[i], kv, "@"); want[kv[1]] = kv[2] } }
          ($1 in want) {
            split(substr($2, 2), g, "."); split(substr(want[$1], 2), w, ".")
            for (i = 1; i <= 3; i++) {
              if ((g[i] + 0) > (w[i] + 0)) next
              if ((g[i] + 0) < (w[i] + 0)) { print $1 "@" want[$1] " (" tag " has " $2 ")"; next }
            }
          }'
      }
      # `go list -m` prints "<mod> <ver>" or "<mod> <ver> => <mod> <ver>", so $NF is
      # the EFFECTIVE version and a replace cannot hide behind the require line.
      go list -m -e $MODS
      need="$(go list -m -e $MODS | awk 'NF >= 2 && $NF ~ /^v[0-9]/ { print $1, $NF }' | below_floor go.mod | awk '{ print $1 }')"
      if [ -n "$need" ]; then go get $need; fi
      go mod tidy
      go build -trimpath \
        -tags "netgo osusergo exclude_graphdriver_btrfs containers_image_openpgp" \
        -ldflags "-s -w" \
        -o "${{targets.destdir}}/usr/bin/skopeo" ./cmd/skopeo
      # The float is only real if it reached the BINARY. Every `dep`/`=>` line of
      # `go version -m` must be at or above its floor -- the `=>` line is what
      # catches a replace-shadowed float. Fail the build rather than ship it.
      bad="$(go version -m "${{targets.destdir}}/usr/bin/skopeo" \
        | awk '$1 == "dep" || $1 == "=>" { print $2, $3 }' | below_floor skopeo)"
      [ -z "$bad" ] || { echo "❌ 0-CVE float did not reach skopeo:"; echo "$bad"; exit 1; }
