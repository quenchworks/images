# Telegraf (InfluxData): from-source via melange (Go build from the git tag
# tarball). Image-only (a metrics agent, no chart). Latest patch of the last 3
# minor lines (1.37, 1.38, 1.39). Single large static Go binary with many
# plugins, CGO disabled (matches upstream `CGO_ENABLED=0 go build ./cmd/telegraf`).
# Version is stamped via -X on github.com/influxdata/telegraf/internal.Version;
# upstream tags carry a "v" prefix, the stamped version is the bare X.Y.Z.
FROM_SOURCE=1
VERSIONS=(1.37.3 1.38.4 1.39.1)
declare -A SHA256=(
  [1.37.3]=a01e7607ebdf7df5fe04bb9960b58a7c1d0501f24b55c3e01005de7c930247dd
  [1.38.4]=97453df83892bcc987064cc093277881ffeb13bb7c9c9e351c8605b769f84d4f
  [1.39.1]=687fdef018d85a275015d621653061251d6566f53b9b41dd5c93c21019cd92f2
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
