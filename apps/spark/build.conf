# STATUS 2026-10-12: FROM SOURCE, 4.2.0 only, gated in CI (the Maven build is far past
# the 600 s local gate). Wolfi moved spark-4.0/4.1 to enterprise-packages in 2026-06
# (wolfi-dev/os bfd2fb34 is the last tree with spark-4.1.yaml), so its apks stay at
# 4.0.2-r13 / 4.1.2-r3 for good. Those lines measured 78+221 and 92+233 findings and
# never shipped (no catalog entry, no chart), so they left VERSIONS with the apk recipe.
#
# Measured on the official spark-4.2.0-bin-hadoop3 dist (trivy comprehensive, DB
# 2026-10-12): 174 findings. What melange.yaml does about each:
#   dropped profiles   -Phive -Phive-thriftserver (hive-exec 2.3.10, derby, libthrift)
#                      and -Pyarn (spark-4.2.0-yarn-shuffle.jar, shaded netty/jackson/log4j)
#   floored at build   jackson 2.21.2, Jetty 12.1.8 (shaded in spark-core), netty 4.2.13
#                      (also shaded in spark-connect-client-jvm), log4j 2.25.4, lz4-java
#                      1.11.0, vertx-core 4.5.26, jline 3.29.0-jdk8 (from scala-compiler)
#   re-shaded          parquet-jackson 1.17.0 (jackson 2.19.2; even 1.18.1 ships 2.22.2,
#                      below 2.22.3) and hadoop-client-runtime 3.5.0 (newest Hadoop:
#                      jackson 2.18.6, commons-configuration2 2.10.1, Jetty 9.4.58 client
#                      stack, jline 3.9.0). Jetty 9.4 has no fixed release and jline is
#                      unfixed on 3.9: both are left out of the shade (only YARN client
#                      code and HttpServer2 reference them; this image has no YARN).
# Both re-shades were run locally (JDK 17, tmpfs): class lists match the official jars
# except the excluded Jetty client/http/io/websocket and jline, and trivy comprehensive
# finds 0 in them. Main classes stay Java 17 bytecode; the runtime is openjdk-21-jre.
#
# spark: Apache Spark, the unified batch and stream analytics engine, Scala 2.13.
# The image contract matches upstream's apache/spark image: entrypoint
# /opt/entrypoint.sh (driver | executor | pass-through), SPARK_HOME=/opt/spark,
# work-dir /opt/spark/work-dir (the entrypoint writes java_opts.txt there).
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(4.2.0)
declare -A SHA256=(
  [4.2.0]=c106f9a90830cc998a8514e6f7eaa32c3890a930ee84006b7117e0defb121bef   # github.com/apache/spark tag v4.2.0
)
PARQUET=1.17.0
PARQUET_SHA256=c3d6395425bbd269e5abde3b7805d9ec5086db2adfa73c2635e826dd5693d91d  # apache-parquet-1.17.0.tar.gz (Apache sha512 verified)
HADOOP=3.5.0
HADOOP_SHA256=45328a7e5a8fb29ca8503f33e5f0269f8fbbce8824ec9127426aad6d1d9af023   # hadoop-3.5.0-src.tar.gz (Apache sha512 verified)
# Floors (the fixed version Trivy names, per line; raised only where below).
declare -A FLOOR=(
  [JACKSON]=2.21.7 [JACKSON_ANN]=2.21 [JACKSON_HADOOP]=2.18.11 [CONFIG2]=2.15.0
  [JETTY]=12.1.10 [NETTY]=4.2.17.Final [LOG4J]=2.25.5 [LZ4]=1.11.4 [VERTX]=4.5.27 [JLINE]=3.30.15
)
render() {
  local k p="s/__VER__/$1/g; s/__SHA256__/${SHA256[$1]}/g; s/__PARQUET__/$PARQUET/g; s/__PARQUET_SHA256__/$PARQUET_SHA256/g; s/__HADOOP__/$HADOOP/g; s/__HADOOP_SHA256__/$HADOOP_SHA256/g"
  for k in "${!FLOOR[@]}"; do p="$p; s/__${k}__/${FLOOR[$k]}/g"; done
  echo "$p"
}
