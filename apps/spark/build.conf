# STATUS: BLOCKED 2026-09-24. Measured locally (PUSH=0, x86_64, comprehensive Trivy):
#   4.1.2-r3: 92 OS-section + 233 jar findings; 4.0.2-r13: 78 + 221.
# The Wolfi apks are built from source but still ship, per 4.1.2:
#   * Hive 2.3.10 jars: hive-exec (fixed only in 4.0.1), derby 10.16.1.1 (CRITICAL,
#     CVE-2022-46337), libthrift 0.16.0. Spark's built-in Hive has no fixed 2.3 line;
#     the fix is building WITHOUT -Phive -Phive-thriftserver.
#   * spark-4.1.2-yarn-shuffle.jar (43 findings, shaded): YARN NodeManager only; build
#     WITHOUT -Pyarn.
#   * Jetty 11.0.26 shaded into spark-core (CVE-2026-2332, fixed 11.0.29) and
#     hadoop-client-runtime 3.4.2 (shaded): need -Djetty.version / a Hadoop bump at
#     build time.
#   * spark-connect-client-jvm (20, shaded), netty 4.2.13 (fix 4.2.16), jackson 2.21.1
#     (fix 2.21.5), log4j-api 2.25.4, lz4-java 1.10.1, jline 3.29.0, nimbus-jose-jwt.
# Next step: a melange from-source Maven build (make-distribution.sh) with those
# profiles dropped and the versions floated, gated per line. This apko recipe stays
# as the image contract (entrypoint, SPARK_HOME, work-dir) the source build reuses.
#
# spark: Apache Spark, the unified batch and stream analytics engine. APKO-ONLY:
# Wolfi builds Spark from source per line (spark-4.0, spark-4.1; Scala 2.13) and
# bumps vulnerable Maven deps with pombump before the build, so apko assembles the
# image from those apks on a Wolfi openjdk-21-jre.
#
# Why not the Apache binary distribution: measured 2026-09-24, the 4.2.0 dist carries
# 99 findings, including Jetty 12.1.8 shaded into spark-core (fixed in 12.1.10). A
# shaded jar cannot be swapped, so the dist needs a from-source build, which is what
# the Wolfi packages are. 4.2 is not packaged by Wolfi yet; add it when it is.
#
# The image contract matches upstream's apache/spark image: entrypoint
# /opt/entrypoint.sh (driver | executor | pass-through), SPARK_HOME=/opt/spark,
# work-dir /opt/spark/work-dir (the entrypoint writes java_opts.txt there).
BLOCKED=1
FROM_SOURCE=0
VERSIONS=(4.0.2 4.1.2)
declare -A PIN=(
  [4.0.2]=4.0.2-r13
  [4.1.2]=4.1.2-r3
)
render() {
  local l=${1%.*} p=${PIN[$1]}
  echo "s|__PKG__|spark-${l}-scala-2.13=${p}|g; s|__PKG_COMPAT__|spark-${l}-scala-2.13-compat=${p}|g"
}
