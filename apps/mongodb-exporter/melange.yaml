# Builds the mongodb_exporter Prometheus exporter from source onto Wolfi.
# Used as the hardened metrics sidecar for the mongodb chart.
package:
  name: quench-mongodb-exporter
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened mongodb_exporter, built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/percona/mongodb_exporter/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: "__SHA256__"
  - runs: |
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      # Upstream's gssapi build tag needs cgo; the default (no tag) build is pure
      # Go and is what the container image ships.
      #
      # 0-CVE gate: minor/patch dep bumps (same major) to clear the four fixable
      # Trivy findings in the exporter binary at 0.53.0 -- GHSA-xmrv-pmrh-hhx2
      # (aws eventstream panic DoS, reached via percona-backup-mongodb's S3
      # client) and CVE-2026-56864/56865 (golang.org/x/mod sumdb/tlog, reached
      # via mongo-tools). Transitive bumps only -- no forks, no major bumps,
      # no `replace`.
      go get github.com/aws/aws-sdk-go-v2/aws/protocol/eventstream@v1.7.8 \
             github.com/aws/aws-sdk-go-v2/service/s3@v1.97.3 \
             golang.org/x/mod@v0.40.0
      go mod tidy
      # 2026-09-06: the nightly scan and this app's own 0-CVE gate flagged the shared
      # Go modules below in the published image; this recipe had no float at all.
      # FLOOR, not a bare `go get mod@vX`: an exact pin is a silent no-op under a
      # `replace` and becomes a silent DOWNGRADE once upstream requires more,
      # re-introducing the CVE while the gate still reports green (docs/go-module-float.md).
      FLOOR="golang.org/x/crypto@v0.56.0 google.golang.org/grpc@v1.83.2 golang.org/x/net@v0.58.0 golang.org/x/text@v0.41.0 golang.org/x/sys@v0.47.0"
      MODS="$(echo "$FLOOR" | tr ' ' '\n' | cut -d@ -f1)"
      # prints "<mod>@<floor> (<tag> has <ver>)" for every module below its floor
      below_floor() {
        awk -v floor="$FLOOR" -v tag="$1" '
          BEGIN { n = split(floor, f, " ")
                  for (i = 1; i <= n; i++) { split(f[i], kv, "@"); want[kv[1]] = kv[2] } }
          ($1 in want) {
            split(substr($2, 2), g, "."); split(substr(want[$1], 2), w, ".")
            for (i = 1; i <= 3; i++) {
              if ((g[i] + 0) > (w[i] + 0)) next
              if ((g[i] + 0) < (w[i] + 0)) { print $1 "@" want[$1] " (" tag " has " $2 ")"; next }
            }
          }'
      }
      # `go list -m` prints "<mod> <ver>" or "<mod> <ver> => <mod> <ver>", so $NF is
      # the EFFECTIVE version and a replace cannot hide behind the require line.
      # A module this app does not require is NOT simply absent: plain `go list -m`
      # FAILS on it ("not a known dependency") and kills the step, so -e is required.
      # -e then prints the module with no version, and feeding that to below_floor
      # would read it as below the floor and `go get` it -- ADDING a dependency the app
      # never had. Hence the awk guard that only passes real v-prefixed versions.
      GOFLAGS=-mod=mod go list -m -e $MODS 2>/dev/null || true
      need="$(GOFLAGS=-mod=mod go list -m -e $MODS 2>/dev/null | awk 'NF >= 2 && $NF ~ /^v[0-9]/ { print $1, $NF }' | below_floor go.mod | awk '{ print $1 }')"
      if [ -n "$need" ]; then GOFLAGS=-mod=mod go get $need; fi
      GOFLAGS=-mod=mod go mod tidy

      go build -trimpath -ldflags "-s -w -X main.version=${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/mongodb_exporter" .
  # The exporter user is provided by apko (accounts), not the package, to avoid
  # conflicting with wolfi-baselayout's /etc files.

test:
  pipeline:
    - runs: mongodb_exporter --version
