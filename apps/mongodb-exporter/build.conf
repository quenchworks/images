# mongodb-exporter: from-source via melange (Go build of percona/mongodb_exporter
# tag tarball). Newest stable line only. Each release pins its source tarball by sha256.
FROM_SOURCE=1
VERSIONS=(0.54.0)
declare -A SHA256=(
  [0.54.0]=6d117ebdc7b0e4d7ae2db4d16735bd0a7afdddf48a6f9201997c4dbaa05f231c
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
