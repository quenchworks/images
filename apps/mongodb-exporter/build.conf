# mongodb-exporter: from-source via melange (Go build of percona/mongodb_exporter
# tag tarball). Newest stable line only. Each release pins its source tarball by sha256.
FROM_SOURCE=1
VERSIONS=(0.53.0)
declare -A SHA256=(
  [0.53.0]=d481f6ff43165740f353e07f7e3dcf235a41ff47273ed6ac3a7732641db461ba
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
