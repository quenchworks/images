# istio-cni: Istio's CNI node agent image (upstream install-cni): the istio-cni plugin and the
# install-cni agent (sidecar CNI install + the ambient-mode node agent), built from source from
# the istio/istio tag, the same tarballs and lines as istiod (2026-10-08). Upstream builds it on
# its iptables base, so the image carries Wolfi iptables (legacy + nft): the ambient agent runs
# iptables-restore in each pod's netns. Root, like upstream: a privileged node agent.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(1.29.10 1.30.7 1.31.3)
declare -A SHA256=(
  [1.29.10]=adfc327a9c6625e209eeed270e5e1305e90ff9b90f513162c63be5618c80d327
  [1.30.7]=d23cd0c34d852a1ff6ecb44e110277b98de7695f0fbe74c05d96adb09b7469db
  [1.31.3]=aa1380bf3d59061c85c7704f1fb6c11cb922ea41131b6def42f9b6a9a7670eea
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
