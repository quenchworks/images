# influxdb: from-source via melange. Latest 3 stable InfluxDB 2.x OSS releases.
# Each release pins its own source tarball (SRC_SHA), prebuilt UI release
# (UI_REL/UI_SHA, embedded via go-bindata), and flux version (FLUX) which drives
# the Rust toolchain pin (RUST) for building libflux from source.
#   2.7.12 -> flux v0.196.1 (rust 1.72), UI OSS-v2.7.12
#   2.9.0  -> flux v0.200.0,             UI OSS-v2.9.0
#   2.9.1  -> flux v0.200.0,             UI OSS-v2.9.0 (no OSS-v2.9.1 UI release
#             upstream; the 2.9.0 UI build is forward-compatible within the minor)
# (InfluxDB 2.8.0 is skipped: upstream shipped no OSS-v2.8.0 UI release, and it
#  is superseded by the 2.9.x line.)
FROM_SOURCE=1
VERSIONS=(2.9.1)
declare -A SRC_SHA=(
  [2.7.12]=1c0d21ccc42baf61501a0e43d0853322176e200140e20f12c11297d2619e1275
  [2.9.0]=39a15cedfd78854fb23c137c1a37275e5cbdf6f2434b79f4a6c7c6ac78757bc2
  [2.9.1]=109e845a24408946c7f6cf66f30f2bd00844cfd6bf9f072e2ed048b5b4c88bcf
)
declare -A UI_REL=( [2.7.12]=OSS-v2.7.12 [2.9.0]=OSS-v2.9.0 [2.9.1]=OSS-v2.9.0 )
declare -A UI_SHA=(
  [2.7.12]=682f8660c6b160a918f4631a791c76da1437c62de47d6a5a4cb0bd6a3a8e6800
  [2.9.0]=9cb2df818f1f5badc23e051f51eef7e8b143540233947606eadad309f395bb0e
  [2.9.1]=9cb2df818f1f5badc23e051f51eef7e8b143540233947606eadad309f395bb0e
)
# flux v0.196.1 (2.7.12) needs the OLD rust-1.72 (newer rustc promotes its lints
# to errors); flux v0.199.x (the 2.9.x libflux crate) requires rustc >= 1.83.
declare -A RUST=( [2.7.12]=1.72 [2.9.0]=1.83 [2.9.1]=1.83 )
render() {
  echo "s/__VER__/$1/g; s|__SRC_SHA__|${SRC_SHA[$1]}|g; s|__UI_REL__|${UI_REL[$1]}|g; s|__UI_SHA__|${UI_SHA[$1]}|g; s|__RUST__|${RUST[$1]}|g"
}
