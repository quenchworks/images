package:
  name: quench-ejbca
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened EJBCA Community Edition on WildFly, packaged on Wolfi"
  copyright:
    - license: LGPL-2.1-or-later
  dependencies:
    runtime:
      - openjdk-21-jre
      - busybox          # standalone.sh and the entrypoint are /bin/sh

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - bash
      - ca-certificates-bundle
      - curl
      - openjdk-21
      - openjdk-21-default-jvm
      - unzip
      - zip
  environment:
    JAVA_HOME: /usr/lib/jvm/java-21-openjdk
    GRADLE_USER_HOME: /tmp/gradle-home

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/Keyfactor/ejbca-ce/archive/refs/tags/r${{package.version}}.tar.gz
      expected-sha256: "__SHA256__"
      strip-components: 1

  - name: Fetch WildFly 42.0.0 and the PostgreSQL JDBC driver
    runs: |
      set -eu
      # Same tarball and sha256 as apps/wildfly (42.0.0); bump both together.
      curl -fsSL -o /tmp/wildfly.tgz https://github.com/wildfly/wildfly/releases/download/42.0.0.Final/wildfly-42.0.0.Final.tar.gz
      echo "6c2e50b8f3e2c0c3ad8f5241e18276f12bfd3e6e37b750e3fe1d6ce1dd2800ce  /tmp/wildfly.tgz" | sha256sum -c -
      mkdir wildfly && tar -xzf /tmp/wildfly.tgz -C wildfly --strip-components=1
      # sha256 from a download whose sha1 matched Maven Central's .sha1 (2026-11-23).
      curl -fsSL -o /tmp/postgresql.jar https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.14/postgresql-42.7.14.jar
      echo "73914527305a40cce504b0d3d90b23caf565136912d607ae8ae7c5895512332c  /tmp/postgresql.jar" | sha256sum -c -

  - name: Swap OpenTelemetry core, guava and snappy-java below their fixes
    runs: |
      set -eu
      cd wildfly
      # JBoss Modules loads jars by the filename in each module.xml, so every swap renames
      # the jar AND rewrites its resource-root. modswap replaces each copy of a library that
      # is below the fix, whatever version upstream ships; a library missing entirely is an
      # error only where the caller says it must exist.
      modswap() { # <old jar path> <new jar name> <url> <sha256>
        dir="$(dirname "$1")"; old="$(basename "$1")"
        grep -q "path=\"$old\"" "$dir/module.xml" || { echo "module.xml in $dir does not name $old" >&2; exit 1; }
        curl -fsSL -o "$dir/$2" "$3"
        echo "$4  $dir/$2" | sha256sum -c -
        rm -f "$1"
        sed -i "s|path=\"$old\"|path=\"$2\"|" "$dir/module.xml"
        echo "  $1 -> $2"
      }
      below() { [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | head -1)" != "$2" ]; }  # <have> <fix>
      # OpenTelemetry: the api fix is 1.67.0 and the SDK reaches into api internals that move
      # between releases (1.67 moved api.internal.ConfigUtil into opentelemetry-common), so every
      # core jar moves to 1.67.0 together. instrumentation and semconv are other trains.
      otel167() { case "$1" in
          api) echo "1.67.0 538d1dff2f9a37aecbc0ef98fd17273a3affb058e734e6763a3a07a38a5fdc59" ;;
          api-incubator) echo "1.67.0-alpha fea3d78726e49620168c3f6194ff491edfd1ec89b2df06fd5d5b73e55d74a342" ;;
          common) echo "1.67.0 da97bdb395418e16ecdcbe7ad3497f45b9e767ceda4ae7e86133e7a757ac377f" ;;
          context) echo "1.67.0 40fb813fb5e27ec2691daa29c81b572b5b1541ef9b41e62490c3ee3e6407c55e" ;;
          exporter-common) echo "1.67.0 eb61aab6d20bf105102dfa061b478b659cec17e82a50969898046456768ba09b" ;;
          exporter-otlp) echo "1.67.0 6724a9c8f9f42de757682c6194c48d9fee4670cd19a85c37954eba526c58b836" ;;
          exporter-otlp-common) echo "1.67.0 75530ab4d93e6fdef478d3e112713337625e70a63df357e6e7b9060c13788015" ;;
          sdk) echo "1.67.0 52a8f599a368a3d62185e37053f6a53175d6fbe3ecc1d565baba13b1a854267f" ;;
          sdk-common) echo "1.67.0 628a4c00db9561ff4c608a650d5e7fd66a1e153ccdf1ba3cdc5ac0b7c6518fea" ;;
          sdk-extension-autoconfigure) echo "1.67.0 09021cf4e41f081e11e1c00577fe03b98db0ae7fd5f73eaf4020e760fa0edb7e" ;;
          sdk-extension-autoconfigure-spi) echo "1.67.0 41eb19f6caf2c655ac3139d331f5c34283f2efdb0f0b0e58765a6cc9e27f66bc" ;;
          sdk-logs) echo "1.67.0 dd0f0b625e08787af49d7e270abc6def4c2eabc2f18f5f145b7924024a3311e3" ;;
          sdk-metrics) echo "1.67.0 c157ff10da59a87a57e5236d9f3290792d9b749433be5e5b449a7d1604c320a9" ;;
          sdk-trace) echo "1.67.0 14d9615c8a5dcf471dcbb74902b771dcfa8656b755ac38dce904042289ccd198" ;;
          exporter-sender-okhttp) echo "1.67.0 0ccb54e5e1db24680b0b7b818299552477dcc7114de7ca0f7b054e6e20958b83" ;;
          sdk-testing) echo "1.67.0 c3d74c825e423e7bf28f0e3f22f10bbf7fe3b00984d0d9ea6ef1327b05c274e2" ;;
          exporter-logging) echo "1.67.0 cc5edf7dde86b301908d40a7de5b121119c110a6ee453bc41179af84b19b794a" ;;
          *) return 1 ;;
        esac; }
      M=https://repo1.maven.org/maven2
      find modules -name 'opentelemetry-*.jar' > /tmp/otel.list
      grep -q 'opentelemetry-api-[0-9]' /tmp/otel.list || { echo "no opentelemetry-api jar; dist moved" >&2; exit 1; }
      while IFS= read -r j; do
        b="$(basename "$j" .jar)"
        a="$(echo "$b" | sed -E 's/^opentelemetry-(.+)-[0-9]+\.[0-9]+\.[0-9]+(-alpha)?$/\1/')"
        v="$(echo "$b" | sed -E 's/^.*-([0-9]+\.[0-9]+\.[0-9]+)(-alpha)?$/\1/')"
        r="$(otel167 "$a")" || continue; set -- $r
        below "$v" 1.67.0 || continue
        modswap "$j" "opentelemetry-$a-$1.jar" "$M/io/opentelemetry/opentelemetry-$a/$1/opentelemetry-$a-$1.jar" "$2"
      done < /tmp/otel.list
      true

  - name: Swap EJBCA's vulnerable vendored jars
    runs: |
      set -eu
      # EJBCA vendors its dependencies in lib/ and resolves them from settings.gradle.kts
      # by file name, so each swap replaces the jar AND its version string there. Each
      # family moves together. The sha256s are from downloads whose sha1 matched Maven
      # Central's .sha1 (2026-11-23). An old jar that is missing fails the build: the
      # next release moved it, so look again.
      M=https://repo1.maven.org/maven2
      sw() { # <old jar name> <maven dir> <new jar name> <sha256>
        old="$(find lib -name "$1")"
        [ "$(printf '%s\n' "$old" | grep -c .)" = 1 ] || { echo "expected one $1, found: $old" >&2; exit 1; }
        curl -fsSL -o "$(dirname "$old")/$3" "$M/$2/$3"
        echo "$4  $(dirname "$old")/$3" | sha256sum -c -
        rm "$old"
      }
      # BouncyCastle 1.84 -> 1.85
      sw bcprov-jdk18on-1.84.jar org/bouncycastle/bcprov-jdk18on/1.85 bcprov-jdk18on-1.85.jar 20af26bf6060bb8005cc2389916812c1e0e998dc48d2ced7131b89461b54cff7
      sw bcpkix-jdk18on-1.84.jar org/bouncycastle/bcpkix-jdk18on/1.85 bcpkix-jdk18on-1.85.jar c9f82b2d4e99c4bbdfccf684e52cc06ea06a0b567bfd0d08f9c5a3f417055996
      sw bctls-jdk18on-1.84.jar org/bouncycastle/bctls-jdk18on/1.85 bctls-jdk18on-1.85.jar ab9f1d3e517ea4b37e16c5ab7b3054f87b8930ae48dbc65c66ac4c7db26996ab
      sw bcutil-jdk18on-1.84.jar org/bouncycastle/bcutil-jdk18on/1.85 bcutil-jdk18on-1.85.jar 590f55ed5d68529239898a4a5c4f730b6e37f45d1cfa3fbe51f8485abe32c42d
      # commons-configuration2 2.13.0 -> 2.15.0, guava 33.0.0 -> 33.7.2, kerby-asn1 2.1.1 -> 2.1.2
      sw commons-configuration2-2.13.0.jar org/apache/commons/commons-configuration2/2.15.0 commons-configuration2-2.15.0.jar a359968dda319134c4f187e6f82b66f5808bf7db48e0d6e40922e98084c87ba8
      sw guava-33.0.0-jre.jar com/google/guava/guava/33.7.2-jre guava-33.7.2-jre.jar b530942257fb935f8b2cfaa5f8eb5bd59c555fd8e8d01b8ce98912e077ea606c
      sw kerby-asn1-2.1.1.jar org/apache/kerby/kerby-asn1/2.1.2 kerby-asn1-2.1.2.jar aece8c08d4decff1bcf7cd06c9d43f30ec3bfc01ad8d57428443e9f037e06896
      # jackson 2.21.3 -> 2.21.7 (jackson-annotations is versioned "2.21" and stays)
      J=com/fasterxml/jackson
      sw jackson-core-2.21.3.jar $J/core/jackson-core/2.21.7 jackson-core-2.21.7.jar 8c5623b98f32d5f7e1287ff61ed50e08ab7b11381e991fff89327faabba42261
      sw jackson-databind-2.21.3.jar $J/core/jackson-databind/2.21.7 jackson-databind-2.21.7.jar 1290c2795e93e8a6861a6c4d9ff0d844d32f5ea178362cb2721edf5561e828b1
      sw jackson-dataformat-yaml-2.21.3.jar $J/dataformat/jackson-dataformat-yaml/2.21.7 jackson-dataformat-yaml-2.21.7.jar df2b3e6a194181dc067b7211d750926b4ae9e4f3c892a0005b8219a9b59be681
      sw jackson-jakarta-rs-base-2.21.3.jar $J/jakarta/rs/jackson-jakarta-rs-base/2.21.7 jackson-jakarta-rs-base-2.21.7.jar 202b61a95e735d01ae03e411b8f6ae1245bbf19c87d4746c0204579f5c2e456b
      sw jackson-jakarta-rs-json-provider-2.21.3.jar $J/jakarta/rs/jackson-jakarta-rs-json-provider/2.21.7 jackson-jakarta-rs-json-provider-2.21.7.jar 32473ee172e0c181ba63688ee4a94349de77de05bd4279d0846a9515a56bb0fe
      sw jackson-module-jaxb-annotations-2.21.3.jar $J/module/jackson-module-jaxb-annotations/2.21.7 jackson-module-jaxb-annotations-2.21.7.jar a74597f82779d79e89ad9b3fdce3558607301537e624e4db13f64925186ac0c5
      # log4j 2.25.4 -> 2.25.5
      L=org/apache/logging/log4j
      sw log4j-api-2.25.4.jar $L/log4j-api/2.25.5 log4j-api-2.25.5.jar 64777f73ea0b3104c04eb82befbdccc30a425a19e83ad06cb2f93aa303511863
      sw log4j-core-2.25.4.jar $L/log4j-core/2.25.5 log4j-core-2.25.5.jar 050c4f85deb48b055e9c041ac39043fbb79ce477841a11a1eb2969c86c6a0072
      sw log4j-1.2-api-2.25.4.jar $L/log4j-1.2-api/2.25.5 log4j-1.2-api-2.25.5.jar 4dd812dc5a6343f542a9e0046b1ec78ecf10bdd5a8c15745101cdd8b9aa24974

      cp settings.gradle.kts /tmp/settings.orig
      sed -i -e 's/jdk18on-1\.84"/jdk18on-1.85"/' \
        -e 's/:commons-configuration2:2\.13\.0"/:commons-configuration2:2.15.0"/' \
        -e 's/:guava:33\.0\.0-jre"/:guava:33.7.2-jre"/' \
        -e 's/:kerby-asn1:2\.1\.1"/:kerby-asn1:2.1.2"/' \
        -e '/jackson/s/:2\.21\.3"/:2.21.7"/' \
        -e '/log4j/s/:2\.25\.4"/:2.25.5"/' settings.gradle.kts
      n="$(diff -U0 /tmp/settings.orig settings.gradle.kts | grep -c '^+.*library(' || true)"
      [ "$n" = 16 ] || { echo "settings.gradle.kts: expected 16 version lines changed, got $n" >&2; exit 1; }
      # The EAR names the BouncyCastle jar by version for use-physical-code-source.
      sed -i 's|lib/bcprov-jdk18on-1\.84\.jar|lib/bcprov-jdk18on-1.85.jar|' src/deploy/ear/META-INF/jboss-deployment-structure.xml
      grep -q 'lib/bcprov-jdk18on-1.85.jar' src/deploy/ear/META-INF/jboss-deployment-structure.xml

      # PrimeFaces 15.0.x (newest 15.0.20 too) shades org.json 20250107 (CVE-2026-59171)
      # as org.primefaces.shaded.json. PrimeFaces 16.0.2 shades 20260814 under the same
      # package, so its relocated classes and org.json pom metadata replace the old ones.
      PF=lib/primefaces/primefaces-15.0.3-jakarta.jar
      test -f "$PF"
      curl -fsSL -o /tmp/pf16.jar $M/org/primefaces/primefaces/16.0.2/primefaces-16.0.2.jar
      echo "81af664247c02b4b725a5d0936ca013c79454817d30d4c60ad23818349702449  /tmp/pf16.jar" | sha256sum -c -
      mkdir /tmp/pfj && (cd /tmp/pfj && unzip -q /tmp/pf16.jar 'org/primefaces/shaded/json/*' 'META-INF/maven/org.json/*')
      grep -q 'version=20260814' /tmp/pfj/META-INF/maven/org.json/json/pom.properties
      zip -qd "$PF" 'org/primefaces/shaded/json/*' 'META-INF/maven/org.json/*'
      (cd /tmp/pfj && zip -qr "$OLDPWD/$PF" org META-INF)

      # WildFly 42's RESTEasy CDI extension and swagger's OpenApiServlet (swagger-jaxrs2
      # is an "all" bean archive) both offer a ServletConfig bean, and Weld refuses the
      # ambiguity. Keep the servlet out of CDI; the REST API does not use it.
      SW="$(find lib -name 'swagger-jaxrs2-jakarta-*.jar')"
      test -n "$SW"
      mkdir -p /tmp/sb/META-INF
      printf '%s\n' '<beans version="3.0" bean-discovery-mode="all"><scan><exclude name="io.swagger.v3.jaxrs2.integration.OpenApiServlet"/></scan></beans>' > /tmp/sb/META-INF/beans.xml
      (cd /tmp/sb && zip -q "$OLDPWD/$SW" META-INF/beans.xml)

  - name: Build ejbca.ear and the EJB CLI
    runs: |
      set -eu
      # Gradle 8.7 from the wrapper, pinned to services.gradle.org's published sha256.
      echo "distributionSha256Sum=544c35d6bd849ae8a5ed0bcea39ba677dc40f49df7d1835561582da2009b961d" >> gradle/wrapper/gradle-wrapper.properties
      # The health check answers only 127.0.0.1 by default; kubelet probes come from the node.
      # It reports status only (ALLOK or the failing component).
      printf 'healthcheck.authorizedips=ANY\n' > conf/ejbca.properties
      # APPSRV_HOME puts WildFly's jboss-client.jar on the CLI classpath. The entity
      # mappings are chosen at build time: PostgreSQL.
      APPSRV_HOME="$PWD/wildfly" ./gradlew --no-daemon -q -Pdatabase.name=postgres \
        ear :modules:ejbca-ejb-cli:packageCliDistributionFiles
      unzip -l build/libs/ejbca.ear > /tmp/ear.list && grep -q 'lib/bcprov-jdk18on-1.85.jar' /tmp/ear.list
      unzip -p build/libs/ejbca.ear lib/ejbca-entity.jar > /tmp/entity.jar
      unzip -l /tmp/entity.jar > /tmp/entity.list && grep -q 'META-INF/orm-ejbca-postgres.xml' /tmp/entity.list
      test -f dist/ejbca-ejb-cli/lib/jboss-client.jar

  - name: Configure WildFly for EJBCA
    runs: |
      set -eu
      cat > /tmp/configure.cli <<'EOC'
      embed-server --server-config=standalone.xml --std-out=echo
      module add --name=org.postgresql --resources=/tmp/postgresql.jar --dependencies=jakarta.transaction.api,java.sql
      /subsystem=datasources/jdbc-driver=postgresql:add(driver-name=postgresql,driver-module-name=org.postgresql,driver-xa-datasource-class-name=org.postgresql.xa.PGXADataSource)
      data-source add --name=ejbcads --driver-name=postgresql --jndi-name=java:/EjbcaDS --connection-url=${env.DATABASE_JDBC_URL} --user-name=${env.DATABASE_USER} --password=${env.DATABASE_PASSWORD} --use-ccm=true --validate-on-match=true --background-validation=false --check-valid-connection-sql="select 1" --min-pool-size=2 --max-pool-size=50 --transaction-isolation=TRANSACTION_READ_COMMITTED
      /socket-binding-group=standard-sockets/socket-binding=remoting:add(port=4447,interface=management)
      /subsystem=undertow/server=default-server/http-listener=remoting:add(socket-binding=remoting)
      /subsystem=remoting/http-connector=http-remoting-connector:write-attribute(name=connector-ref,value=remoting)
      /subsystem=remoting/http-connector=http-remoting-connector:undefine-attribute(name=sasl-authentication-factory)
      /system-property=org.apache.commons.configuration2.io.FileLocationStrategy.schemes:add(value="file,jar,vfs")
      stop-embedded-server
      EOC
      # The remoting listener is anonymous (the EJB CLI authenticates as the local CLI
      # user), so it binds the management interface: loopback unless overridden.
      # commons-configuration2 2.15 allows only file and jar URLs by default; WildFly
      # serves deployment resources as vfs:, and http stays off.
      cd wildfly && bin/jboss-cli.sh --file=/tmp/configure.cli
      grep -q 'java:/EjbcaDS' standalone/configuration/standalone.xml
      rm -rf standalone/configuration/standalone_xml_history standalone/data standalone/log standalone/tmp

  - name: Install
    runs: |
      set -eu
      dest="${{targets.destdir}}"
      install -d "$dest/opt/wildfly" "$dest/opt/ejbca"
      (cd wildfly && cp -a bin modules jboss-modules.jar standalone welcome-content copyright.txt LICENSE.txt README.txt version.txt "$dest/opt/wildfly/")
      install -d "$dest/opt/wildfly/docs" && cp -a wildfly/docs/licenses "$dest/opt/wildfly/docs/"
      find "$dest/opt/wildfly/bin" \( -name '*.bat' -o -name '*.ps1' \) -delete
      rm -rf "$dest/opt/wildfly/bin/client" "$dest/opt/wildfly/bin/service"
      cp build/libs/ejbca.ear "$dest/opt/wildfly/standalone/deployments/"
      cp -a dist "$dest/opt/ejbca/"
      cp LICENSE "$dest/opt/ejbca/"
      chmod -R a+rX "$dest/opt"

      install -d "$dest/usr/bin"
      cat > "$dest/usr/bin/ejbca" <<'EOS'
      #!/bin/sh
      # The EJBCA EJB CLI, talking to the server in this container over 127.0.0.1:4447.
      exec java -Dlog4j1.compatibility=true -jar /opt/ejbca/dist/ejbca-ejb-cli/ejbca-ejb-cli.jar "$@"
      EOS
      cat > "$dest/usr/bin/ejbca-entrypoint.sh" <<'EOS'
      #!/bin/sh
      set -eu
      # Runtime writes go to /tmp/wildfly; /opt/wildfly/standalone stays the read-only
      # source, copied on every start (the apps/wildfly layout).
      W=/tmp/wildfly
      mkdir -p "$W/configuration" "$W/deployments"
      cp -r /opt/wildfly/standalone/configuration/. "$W/configuration/"
      cp -r /opt/wildfly/standalone/deployments/. "$W/deployments/"
      export JBOSS_BASE_DIR="$W"
      exec /opt/wildfly/bin/standalone.sh \
        -b "${WILDFLY_BIND:-0.0.0.0}" \
        -bmanagement "${WILDFLY_BIND_MANAGEMENT:-127.0.0.1}" \
        "$@"
      EOS
      chmod 0755 "$dest/usr/bin/ejbca" "$dest/usr/bin/ejbca-entrypoint.sh"
