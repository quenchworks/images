# ejbca: EJBCA Community Edition (Keyfactor's open-source PKI: CAs, RA, CRL and OCSP)
# built from the source tag with Gradle on a Wolfi openjdk-21 JDK, deployed onto the
# official WildFly distribution with a PostgreSQL datasource. The EJB CLI ships beside
# it as /usr/bin/ejbca.
#
# 0-CVE: the stock r9.6.3 EAR carries 21 fixable findings in its vendored lib/ jars.
# melange.yaml swaps each family to one fixed version (BouncyCastle 1.85, jackson
# 2.21.7, log4j 2.25.5, guava, commons-configuration2, kerby-asn1) and overlays
# PrimeFaces 16.0.2's relocated org.json 20260814 into the PrimeFaces 15 jar. A local
# trivy rootfs of the EAR measured 0; WildFly 42 needs its OpenTelemetry swap, as in
# apps/wildfly. Booted against PostgreSQL 18: a CA created and a certificate issued
# through the CLI, ejbcahealth ALLOK, CRL served.
#
# NEWEST-ONLY: Keyfactor patches the newest CE release.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(9.6.3)
# sha256 of the GitHub source tarball, from a download
declare -A SHA256=(
  [9.6.3]=2720c7ef8466b2d2181d27daf3bfac1ba15e1a0ed2494856a0b3720b35932d4c
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
