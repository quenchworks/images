# Builds Authelia FROM SOURCE onto Wolfi. Authelia is a Go authentication/authorization
# server with an embedded React web portal baked into the binary via go:embed
# (internal/server/public_html). We control the toolchain + module graph here: the React
# portal is built with pnpm/Node in the melange build env (vite emits straight into the
# go:embed dir), then the Go server is built with go-1.26 so the stdlib is current and
# every module resolves to its up-to-date, advisory-clean version. This replaces the old
# prebuilt-tarball recipe, whose binary baked a stale Go stdlib + deps and could not pass
# the 0-CVE gate. Output is a signed APK in Quenchworks' own repo — no upstream binaries.
#
# CGO is ENABLED: Authelia's sqlite storage backend uses github.com/mattn/go-sqlite3
# (cgo). This is exactly why upstream ships separate glibc/musl binaries; we build the
# glibc variant, so the runtime surface is glibc + ca-certificates-bundle (TLS to the
# external storage backend / SMTP / OIDC providers). The version is stamped via the
# internal/utils.BuildTag + BuildState ldflags so `authelia --version` reports the real
# tag (BuildState "tagged clean" makes Version() emit the bare vX.Y.Z).
package:
  name: quench-authelia
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Authelia authentication & authorization server, built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - glibc                  # cgo (sqlite) binary links glibc (libc/libpthread/libresolv/libdl)
      - ca-certificates-bundle # TLS to the external storage backend / SMTP / OIDC providers

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base       # gcc/binutils for the cgo (sqlite) link
      - busybox
      - ca-certificates-bundle
      - glibc-dev        # cgo headers
      # go-1.27, not go-1.26, and go.mod's `go` line does not say why. 4.39.22's
      # go.mod reads `go 1.26.0` with `toolchain go1.27.1`, and GOTOOLCHAIN is
      # local here so the toolchain line is ignored. go-webauthn v0.18.0 guards
      # its ML-DSA files with `//go:build go1.27`, so on 1.26 those constants
      # silently vanish and authelia's own handler_register_webauthn.go fails to
      # compile on webauthncose.AlgMLDSA44/65/87. Read the `toolchain` line, not
      # just the `go` line, when a dependency uses build tags.
      - go-1.27
      - nodejs-24        # web portal build (package.json engines: node >=22.22.0 at 4.39.22)
      - curl             # fetches the pnpm 12 standalone binary below (Wolfi has no pnpm-12)

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/authelia/authelia/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SRC_SHA__
      strip-components: 1

  - name: Build the React web portal (populates the go:embed internal/server/public_html)
    runs: |
      set -eu
      # A source tarball is not a git repo, so the `prepare` npm script (`lefthook install`,
      # which installs git hooks) would fail `pnpm install`; drop it — it is dev-only.
      sed -i '/"prepare": "lefthook install",/d' web/package.json
      # Give pnpm a writable HOME (store + config) inside the build workspace.
      export HOME="$(pwd)"
      # web/package.json requires engines.pnpm 12 (from 4.39.28); Wolfi packages only
      # pnpm-11. Use pnpm's own standalone binary, sha256-pinned per arch, as apps/pnpm does.
      case "$(uname -m)" in
        x86_64)  exe=linux-x64;   sha=2b29fe2fd91687bd6995c356c73d7e84ead5fce630a38ca3d2319c2ce7a9fc45 ;;
        aarch64) exe=linux-arm64; sha=9ba3723129f8d1a508972f8b4e46bb2e98973833861b9febcce28475193972bf ;;
        *) echo "unsupported arch $(uname -m)" >&2; exit 1 ;;
      esac
      curl -fsSL -o pnpm-exe.tgz "https://registry.npmjs.org/@pnpm/exe.${exe}/-/exe.${exe}-12.7.0.tgz"
      echo "${sha}  pnpm-exe.tgz" | sha256sum -c -
      mkdir -p .pnpm-bin && tar -xzf pnpm-exe.tgz -C .pnpm-bin --strip-components=1 package/pnpm
      export PATH="$(pwd)/.pnpm-bin:$PATH"
      pnpm --version
      export CI=true
      cd web
      pnpm install --frozen-lockfile
      # vite build writes to ../internal/server/public_html (see web/vite.config.ts outDir),
      # which is the directory embedded by internal/server/asset.go via //go:embed.
      # It EMPTIES the outDir first, destroying the tarball's public_html/api/ placeholder
      # files (index.html, openapi.yml) that the server requires at startup ("error occurred
      # loading template 'assets/public_html/api/index.html'") — save and restore them.
      cp -a ../internal/server/public_html/api /tmp/authelia-api-assets
      pnpm build
      [ -e ../internal/server/public_html/api/index.html ] || cp -a /tmp/authelia-api-assets ../internal/server/public_html/api
      test -f ../internal/server/public_html/api/index.html
      test -f ../internal/server/public_html/api/openapi.yml

  - name: Build the Authelia server from source (cgo for the sqlite storage backend)
    runs: |
      set -eu
      export CGO_ENABLED=1
      export CC=gcc
      export GOFLAGS=-mod=mod
      export GO111MODULE=on
      export GOTOOLCHAIN=local   # use the installed go-1.26, don't fetch go.mod's toolchain
      # Upstream go.mod pins x/net DOWN with `replace golang.org/x/net =>
      # golang.org/x/net v0.55.0`. A replace outranks `go get`, so the float below
      # was silently discarded and the shipped binary recorded
      # "dep golang.org/x/net v0.56.0 => golang.org/x/net v0.55.0" -- i.e. it kept
      # shipping CVE-2026-46600. Drop the replace so MVS can honour the float.
      # (The other replace, filippo.io/edwards25519 v1.1.0 => v1.2.0, is an
      # UPGRADE and clears CVE-2026-26958 -- keep it.)
      go mod edit -dropreplace=golang.org/x/net
      # ---- 0-CVE module float (docs/go-module-float.md) ----------------------
      # FLOOR is a FLOOR, not a pin. A bare `go get mod@vX` fails silently in two
      # directions: it is a NO-OP when a `replace` overrides it, and it becomes a
      # DOWNGRADE once upstream requires more than vX -- re-introducing the CVE it
      # was added to clear. So float only what is below the floor, then assert the
      # SHIPPED BINARY carries nothing below it.
      FLOOR="golang.org/x/net@v0.58.0 golang.org/x/sys@v0.47.0 google.golang.org/grpc@v1.83.2 golang.org/x/crypto@v0.56.0 golang.org/x/text@v0.41.0 github.com/google/cel-go@v0.29.2"
      MODS="$(echo "$FLOOR" | tr ' ' '\n' | cut -d@ -f1)"
      # prints "<mod>@<floor> (<tag> has <ver>)" for every module below its floor
      below_floor() {
        awk -v floor="$FLOOR" -v tag="$1" '
          BEGIN { n = split(floor, f, " ")
                  for (i = 1; i <= n; i++) { split(f[i], kv, "@"); want[kv[1]] = kv[2] } }
          ($1 in want) {
            split(substr($2, 2), g, "."); split(substr(want[$1], 2), w, ".")
            for (i = 1; i <= 3; i++) {
              if ((g[i] + 0) > (w[i] + 0)) next
              if ((g[i] + 0) < (w[i] + 0)) { print $1 "@" want[$1] " (" tag " has " $2 ")"; next }
            }
          }'
      }
      # `go list -m` prints "<mod> <ver>" or "<mod> <ver> => <mod> <ver>", so $NF is
      # the EFFECTIVE version and a replace cannot hide behind the require line.
      go list -m -e $MODS
      need="$(go list -m -e $MODS | awk 'NF >= 2 && $NF ~ /^v[0-9]/ { print $1, $NF }' | below_floor go.mod | awk '{ print $1 }')"
      if [ -n "$need" ]; then go get $need; fi
      go mod tidy
      VER="${{package.version}}"
      # BuildTag = the release tag; BuildState "tagged clean" makes utils.Version() emit the
      # bare vX.Y.Z (what `authelia --version` prints and the chart/test assert).
      go build -trimpath \
        -ldflags "-s -w -X 'github.com/authelia/authelia/v4/internal/utils.BuildTag=v${VER}' -X 'github.com/authelia/authelia/v4/internal/utils.BuildState=tagged clean'" \
        -o "${{targets.destdir}}/usr/bin/authelia" ./cmd/authelia
      # The float is only real if it reached the BINARY. Every `dep`/`=>` line of
      # `go version -m` must be at or above its floor -- the `=>` line is what
      # catches a replace-shadowed float. Fail the build rather than ship it.
      bad="$(go version -m "${{targets.destdir}}/usr/bin/authelia" \
        | awk '$1 == "dep" || $1 == "=>" { print $2, $3 }' | below_floor authelia)"
      [ -z "$bad" ] || { echo "❌ 0-CVE float did not reach the binary:"; echo "$bad"; exit 1; }

test:
  pipeline:
    - runs: |
        test -x /usr/bin/authelia
        authelia --version
