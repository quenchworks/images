# HELD at 4.39.22, WOLFI-GATED on pnpm 12 as of 2026-09-20.
#
# 4.39.28 fails the web-portal step before any Go code compiles:
#   [ERR_PNPM_UNSUPPORTED_ENGINE] Your pnpm version is incompatible with
#   "/home/build/web". Expected version: 12  Got: 11.8.0
#
# web/package.json declares engines.pnpm "12" exactly. Checked every release
# between the shipped version and the newest: 4.39.23, .24, .25, .26, .27 and
# .28 all require pnpm 12, so there is no intermediate patch to take. Wolfi
# publishes pnpm-11 (newest 11.8.0-r0), pnpm-11.8 (11.8.0-r4) and an
# unversioned pnpm at 10.33.1-r0 on both arches. No pnpm-12 package exists.
#
# Not worked around on purpose. Installing pnpm 12 from npm inside the build
# would pull an unpinned toolchain into a recipe whose whole point is pinned
# sources, and passing --engine-strict=false would ignore a requirement
# upstream states rather than satisfy it.
#
# RE-ADD when Wolfi ships a pnpm-12 package: bump VERSIONS and SRC_SHA to the
# newest 4.39.x, change the pnpm-11 entry in melange.yaml's build packages to
# pnpm-12, and re-gate. Check the APKINDEX for the package, not the advisory.
# HELD at 4.39.22, 2026-09-20. 4.39.28 does not build here and the reason is
# upstream tooling, not this recipe.
#
# Measured in CI run on b4e8a9c, both arches, identical failure:
#   "Your pnpm version is incompatible with /home/build/web.
#    Expected version: 12   Got: 11.8.0"
# authelia's web/package.json gained an engines.pnpm of 12 somewhere between
# 4.39.22 and 4.39.28. Wolfi packages pnpm 10.33.1-r0, pnpm-11 and pnpm-11.8,
# and no pnpm-12 at all, so there is nothing to pin that satisfies it.
#
# Not bypassed on purpose. pnpm accepts --engine-strict=false, which would make
# the build proceed on 11.8.0, but upstream set that floor deliberately and a
# lockfile resolved by the wrong major is exactly the kind of difference that
# scans clean and misbehaves later. Revisit when Wolfi ships pnpm 12.
# authelia: image-only recipe input (the chart is authored in the charts repo).
# Authelia is a Go backend with an embedded React frontend baked into the binary via
# go:embed (internal/server/public_html). Built FROM SOURCE: the melange build compiles
# the React portal with pnpm/Node (vite -> the go:embed dir) and then the Go server with
# go-1.26 + cgo (sqlite). Building from source with a current toolchain clears the stale
# Go stdlib/module CVEs that the old prebuilt-binary recipe baked in and could not fix.
#
# Authelia maintains a single 4.39.x line. Release tags are vX.Y.Z and the version is part
# of the source-tarball URL, so the fetch URI adds the leading `v`:
#   https://github.com/authelia/authelia/archive/refs/tags/v<VER>.tar.gz
#   __VER__     = version (bare X.Y.Z; the leading `v` is added in the fetch URI + ldflag)
#   __SRC_SHA__ = sha256 of the vX.Y.Z source tarball (arch-independent, one per version)
#
# NEWEST-ONLY (trimmed 2026-07-09, ceiling re-measured 2026-09-17): the from-source
# web build pins the pnpm major via web/package.json engines.pnpm, and one melange env
# ships exactly one pnpm major, so the window can never span two.
#
# The ceiling today is 4.39.22, not the newest tag. engines.pnpm reads "11" through
# 4.39.22 and "12" from 4.39.23 on, and Wolfi packages no pnpm-12 (the index carries
# pnpm, pnpm-11, pnpm-11.8, pnpm-stage0). Building 4.39.23+ would abort in
# `pnpm install --frozen-lockfile` with ERR_PNPM_UNSUPPORTED_ENGINE on both arches,
# the same way 4.39.18/19 did from the other side when they pinned pnpm 10.
#
# 4.39.22 also raises engines.node to >=22.22.0, which the recipe's nodejs-24 satisfies.
# Move past 4.39.22 the week Wolfi publishes a pnpm-12 package, not before.
FROM_SOURCE=1
VERSIONS=(4.39.22)
declare -A SRC_SHA=(
  [4.39.22]=26e7342b774f9246a91ae67f41147d14e1ddf0f7902bc5313d7eadf774e1b3eb
)
render() {
  echo "s/__VER__/$1/g; s|__SRC_SHA__|${SRC_SHA[$1]}|g"
}
