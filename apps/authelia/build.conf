# authelia: image-only recipe input (the chart is authored in the charts repo).
# Authelia is a Go backend with an embedded React frontend baked into the binary via
# go:embed (internal/server/public_html). Built FROM SOURCE: the melange build compiles
# the React portal with pnpm/Node (vite -> the go:embed dir) and then the Go server with
# go-1.26 + cgo (sqlite). Building from source with a current toolchain clears the stale
# Go stdlib/module CVEs that the old prebuilt-binary recipe baked in and could not fix.
#
# Authelia maintains a single 4.39.x line. Release tags are vX.Y.Z and the version is part
# of the source-tarball URL, so the fetch URI adds the leading `v`:
#   https://github.com/authelia/authelia/archive/refs/tags/v<VER>.tar.gz
#   __VER__     = version (bare X.Y.Z; the leading `v` is added in the fetch URI + ldflag)
#   __SRC_SHA__ = sha256 of the vX.Y.Z source tarball (arch-independent, one per version)
#
# NEWEST-ONLY (trimmed 2026-07-09): the from-source web build pins the pnpm major via
# web/package.json engines.pnpm. 4.39.18/19 pin pnpm 10, but the melange env ships pnpm-11
# (needed by 4.39.20, which pins pnpm 11), so `pnpm install --frozen-lockfile` aborts on
# 18/19 with ERR_PNPM_UNSUPPORTED_ENGINE (Expected 10, Got 11) -> pipeline exit status 1
# on BOTH arches. 4.39.20 builds cleanly; we ship only it. Widen again when the older,
# pnpm-10-pinned patches age out of the window (they cannot share one pnpm major with 20).
FROM_SOURCE=1
VERSIONS=(4.39.26)
declare -A SRC_SHA=(
  [4.39.26]=4eb01230d843c9990ae201582e82e600b91170a902155991d2a876cef403c967
)
render() {
  echo "s/__VER__/$1/g; s|__SRC_SHA__|${SRC_SHA[$1]}|g"
}
