# authelia: image-only recipe input (the chart is authored in the charts repo).
# Authelia is a Go backend with an embedded React frontend baked into the binary
# (go:embed); a from-source build needs a pnpm/Node toolchain and is infeasible in
# CI. Instead we ship Authelia's OWN official prebuilt binary tarball from the GitHub
# release (the same upstream-artifact pattern clickhouse/mattermost use), then harden
# it on a minimal apko base and gate it 0-CVE with Trivy. This is clean-room-consistent:
# it is upstream's published artifact, not a Bitnami chart.
#
# We ship the glibc variant (authelia-<vTAG>-linux-<arch>.tar.gz, NOT the -musl one).
# Authelia maintains a single 4.39.x line; versions = newest 3 patches, all dual-arch.
# Release tags are vX.Y.Z and the VERSION IS PART OF THE ASSET FILENAME, so the URL
# uses the leading `v`:
#   https://github.com/authelia/authelia/releases/download/v<VER>/authelia-v<VER>-linux-<arch>.tar.gz
# Each version ships an amd64 and an arm64 tarball, each with its own sha256. The
# tarball is flat (no top dir): it contains the binary `authelia` plus systemd/tmpfiles
# unit files and a config.template.yml; we install only the binary as /usr/bin/authelia.
#   __VER__     = version (bare X.Y.Z; the leading `v` is added in the fetch URI)
#   __SHA_AMD__ = authelia-v<VER>-linux-amd64.tar.gz sha256
#   __SHA_ARM__ = authelia-v<VER>-linux-arm64.tar.gz sha256
FROM_SOURCE=0
VERSIONS=(4.39.18 4.39.19 4.39.20)
declare -A SHA_AMD=(
  [4.39.18]=99f094315a9aff096b1bde93c93d516d1a9684d47b70700389967cfda0506f8d
  [4.39.19]=f6f8d2450533071076f1f2bbf4abfc5b4885be0cc3565e5362bc2ac2470677a3
  [4.39.20]=1f122add61752d6ef54e64ae7116bec4e026f5c0a6493498288c5a9770d92088
)
declare -A SHA_ARM=(
  [4.39.18]=3beaa118dc67eb1742156d5e7c863999f4fc43bd01b4398501e95e516faabeb3
  [4.39.19]=9a53542ae9d1dce6d7a1cd9977fb1953fdf819eedf14422c1da736e95ecb4714
  [4.39.20]=39088706d58609cfcd43db6d72b88cc106c535390759accbce51adf4ece639d8
)
render() {
  echo "s/__VER__/$1/g; s|__SHA_AMD__|${SHA_AMD[$1]}|g; s|__SHA_ARM__|${SHA_ARM[$1]}|g"
}
