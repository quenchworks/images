package:
  name: quench-semaphore
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Semaphore UI (community build), built from source on Wolfi"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.26
      - nodejs-24
      - npm

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/semaphoreui/semaphore/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - name: Build the web UI
    working-directory: web
    runs: |
      set -eu
      export npm_config_cache="$(mktemp -d)" HOME="$(mktemp -d)"
      npm ci --no-audit --no-fund
      npm run build
      test -f ../api/public/index.html

  - name: Build semaphore
    runs: |
      set -eu
      export CGO_ENABLED=0 GOFLAGS=-mod=mod GOTOOLCHAIN=local
      FLOOR="golang.org/x/crypto@v0.58.1-0.20261009181718-2f1f834330b2 golang.org/x/net@v0.62.0 github.com/go-jose/go-jose/v4@v4.1.6"
      for m in $(go list -mod=mod -m -e -f '{{.Path}} {{.Version}}' all | awk '($1 ~ /^go\.opentelemetry\.io\/otel(\/|$)/) && $1 !~ /\/exporters\/jaeger$/ && $2 ~ /^v1\./ { print $1"@v1.47.0" }'); do
        FLOOR="$FLOOR $m"
      done
      MODS="$(echo "$FLOOR" | tr ' ' '\n' | cut -d@ -f1)"
      below_floor() {
        awk -v floor="$FLOOR" -v tag="$1" '
          BEGIN { n = split(floor, f, " ")
                  for (i = 1; i <= n; i++) { split(f[i], kv, "@"); want[kv[1]] = kv[2] } }
          ($1 in want) {
            split(substr($2, 2), g, "."); split(substr(want[$1], 2), w, ".")
            for (i = 1; i <= 3; i++) {
              if ((g[i] + 0) > (w[i] + 0)) next
              if ((g[i] + 0) < (w[i] + 0)) { print $1 "@" want[$1] " (" tag " has " $2 ")"; next }
            }
          }'
      }
      need="$(go list -m -e $MODS | awk 'NF >= 2 && $NF ~ /^v[0-9]/ { print $1, $NF }' | below_floor go.mod | awk '{ print $1 }')"
      if [ -n "$need" ]; then go get $need; fi
      go build -trimpath -ldflags "-s -w -X github.com/semaphoreui/semaphore/util.Ver=${{package.version}} -X github.com/semaphoreui/semaphore/util.Commit=1d78fefe -X github.com/semaphoreui/semaphore/util.Date=$(date -u +%FT%TZ)" \
        -o "${{targets.destdir}}/usr/bin/semaphore" ./cli
      bad="$(go version -m "${{targets.destdir}}/usr/bin/semaphore" | awk '$1 == "dep" || $1 == "=>" { print $2, $3 }' | below_floor semaphore)"
      [ -z "$bad" ] || { echo "float did not reach the binary:"; echo "$bad"; exit 1; }
      "${{targets.destdir}}/usr/bin/semaphore" version | grep -F "${{package.version}}"

test:
  pipeline:
    - runs: semaphore version
