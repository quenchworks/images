# semaphore: Semaphore UI (semaphoreui/semaphore), a web UI and API for running Ansible, Terraform/OpenTofu
# and shell tasks with schedules, inventories and secrets. MIT (the community build). Go with a Vue UI
# that is built here (vue-cli, Node 24 as upstream's release workflow) and embedded in the binary.
#
# The image carries Ansible from the catalog's own ansible package (quench-ansible, a venv at
# /opt/ansible/venv on PATH), plus git and an SSH client for playbook repositories.
FROM_SOURCE=1
VERSIONS=(2.20.23)
declare -A SHA256=(
  [2.20.23]=3712dcece48bf9a7708850d062299849357a9deb1f7e057020aa7610d2fa3e13
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
