# ceph: Ceph (LGPL-2.1), the distributed object, block and file store, from Wolfi's pinned
# ceph-20 (Tentacle) subpackages (FROM_SOURCE=0): mon, mgr (+ rook, dashboard, k8sevents
# modules), osd, mds, radosgw, rbd-mirror, ceph-exporter, immutable-object-cache, fuse.
# NOT the ceph-20 meta package: it pulls ceph-20-cephadm, which drags in podman (22
# findings, 2026-10-07) and which Rook does not use. Newest line only.
# Layout as upstream's ceph image, the one Rook's operator expects: root by default, a
# `ceph` user (uid/gid 167) the daemons switch to with --setuser/--setgroup, and the
# /etc/ceph, /var/lib/ceph, /var/log/ceph, /run/ceph trees owned by it.
BLOCKED=0
FROM_SOURCE=0
VERSIONS=(20.2.4)
declare -A PIN=( [20.2.4]=20.2.4-r6 )
render() { local v=$1; echo "s/__VER__/$v/g; s/__REL__/${PIN[$v]}/g"; }
