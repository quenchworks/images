# hoppscotch-backend: the Hoppscotch self-hosted backend (NestJS, Prisma 7, PostgreSQL): the GraphQL and REST API, auth
# and team collections behind the web app and the admin dashboard. Built from the source tag with pnpm, deployed with
# `pnpm deploy --prod`, on Wolfi Node 24, nonroot, port 3170.
#
# 0-CVE (2026-11-25): the production deploy carries 10 findings in 7 packages; melange.yaml adds floors to the root
# pnpm.overrides in upstream's own style. Native code: argon2 and bcrypt are rebuilt with node-gyp, @css-inline/css-inline (the
# mailer's Handlebars adapter loads it) is built from its source commit with cargo auditable, and Prisma's Rust schema
# engine is not shipped (its crates carry 21 findings inside Prisma's own forks): quench-migrate.mjs applies
# prisma/migrations on the pg driver and keeps _prisma_migrations the way `prisma migrate deploy` does; an init step.
#
# NEWEST-ONLY: Hoppscotch ships monthly; the css-inline pin follows @nestjs-modules/mailer.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(2026.11.0)
# sha256 of the GitHub source tarball, from a download
declare -A SHA256=(
  [2026.11.0]=8f0c86010924cc86b74a14af229a6818fe73128e1abe4fece0bb9332f2851569
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
