# hoppscotch-backend: pnpm workspace build of the NestJS backend, native addons from source, on Wolfi Node 24.
package:
  name: quench-hoppscotch-backend
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Hoppscotch backend, built from source on Wolfi"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
      - libgcc
      - libstdc++
      - nodejs-24

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - cargo-auditable
      - git
      - node-gyp
      - nodejs-24
      - npm
      - python-3
      - rust

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/hoppscotch/hoppscotch/archive/refs/tags/${{package.version}}.tar.gz
      expected-sha256: __SHA256__
      strip-components: 1

  - runs: mkdir -p css-inline-src
  # css-inline at the commit @css-inline/css-inline 0.22.0 was published from (npm gitHead)
  - uses: fetch
    with:
      uri: https://github.com/Stranger6667/css-inline/archive/b31689a0f9ec1dcb984bcab37a79eb55218d398d.tar.gz
      expected-sha256: 39c8ba3d6fa1eefa5f25c93979d998f15e8f32a98bcda4a6ec71f81e2cbc1616
      directory: css-inline-src
      strip-components: 1

  - name: Build
    runs: |
      set -eu
      export HOME="$(mktemp -d)" npm_config_cache="$(mktemp -d)"
      export DATABASE_URL=postgresql://placeholder:placeholder@localhost:5432/placeholder
      npm install -g --prefix "$HOME/.g" pnpm@10.34.9
      export PATH="$HOME/.g/bin:$PATH"
      # floors on the production deploy (images#165), in upstream's own "pkg@<fixed": "fixed" override style
      node -e '
        const fs = require("fs"); const p = JSON.parse(fs.readFileSync("package.json"));
        Object.assign(p.pnpm.overrides, {
          "effect@<3.22.1": "3.22.1", "fast-uri@>=3 <3.1.9": "3.1.9", "qs@<6.16.1": "6.16.1",
          "postcss-selector-parser@>=7 <7.1.6": "7.1.6", "postcss-selector-parser@<6.1.5": "6.1.5",
          "glob@>=13 <14.0.2": "14.0.2", "minimatch@>=10 <11.0.1": "11.0.1" });
        fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");'
      pnpm install --no-frozen-lockfile
      cd packages/hoppscotch-backend
      pnpm exec prisma generate
      pnpm run build
      cd ../..
      pnpm --filter=hoppscotch-backend deploy /opt/hoppscotch-backend --prod --legacy
      test -f /opt/hoppscotch-backend/dist/src/main.js

  - name: Native addons from source
    runs: |
      set -eu
      export HOME="$(mktemp -d)" npm_config_cache="$(mktemp -d)"
      B=/opt/hoppscotch-backend
      # argon2 and bcrypt: node-gyp instead of their prebuilds; keep only build/Release/<name>.node
      for m in argon2 bcrypt; do
        A=$(find $B/node_modules/.pnpm -maxdepth 3 -type d -path "*/node_modules/$m" | head -1)
        test -n "$A"
        ( cd "$A" && node-gyp rebuild --release --nodedir=/usr )
        rm -rf "$A/prebuilds" "$A/build/Release/obj.target" "$A/build/Release/.deps"
      done
      # css-inline: napi build of the pinned source, every Rust crate recorded by cargo auditable
      CW=$(mktemp -d)
      printf '#!/bin/sh\ncase "$1" in build|rustc) exec /usr/bin/cargo auditable "$@";; esac\nexec /usr/bin/cargo "$@"\n' > "$CW/cargo"
      chmod +x "$CW/cargo"
      ( cd css-inline-src/bindings/javascript && npm install --no-audit --no-fund @napi-rs/cli@3 \
        && PATH="$CW:$PATH" npx napi build --platform --release --js js-binding.js --dts js-binding.d.ts )
      case "$(uname -m)" in x86_64) T=linux-x64-gnu ;; aarch64) T=linux-arm64-gnu ;; esac
      N="css-inline-src/bindings/javascript/css-inline.$T.node"
      readelf -S "$N" | grep -q dep-v0
      for d in $(find $B/node_modules/.pnpm -maxdepth 1 -type d -name '@css-inline+css-inline-linux-*'); do
        case "$d" in *"$T"*) cp "$N" "$d"/node_modules/@css-inline/css-inline-$T/css-inline.$T.node ;; *) rm -rf "$d" ;; esac
      done
      # Prisma's prebuilt Rust schema engine is not shipped: quench-migrate.mjs applies the migrations on pg
      find $B/node_modules -type f -name 'schema-engine-*' -delete
      install -m644 quench-migrate.mjs $B/quench-migrate.mjs
      # every other native binary must be one of ours
      left=$(find $B/node_modules -type f -name '*.node' | grep -vE "/argon2/build/Release/argon2.node$|/bcrypt/build/Release/bcrypt_lib.node$|/css-inline\.$T\.node$" || true)
      [ -z "$left" ] || { echo "prebuilt native addons left:"; echo "$left"; exit 1; }
      # css-inline is the mailer's dependency (pnpm's isolated layout keeps it out of the top level): load it from there
      C=$(find $B/node_modules/.pnpm -maxdepth 4 -type d -path '*/node_modules/@css-inline/css-inline' | head -1)
      test -n "$C"
      ( cd $B && node -e 'require("argon2"); require("bcrypt"); const c = require(process.argv[1]); if (!c.inline("<style>p{color:red}</style><p>x</p>").includes("color: red")) process.exit(1)' "$C" )

  - name: Install
    runs: |
      set -eu
      install -d "${{targets.destdir}}/opt"
      cp -a /opt/hoppscotch-backend "${{targets.destdir}}/opt/hoppscotch-backend"

test:
  pipeline:
    - runs: |
        test -f /opt/hoppscotch-backend/dist/src/main.js
