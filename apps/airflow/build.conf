# STATUS: UNBLOCKED 2026-09-20. The zlib block is gone: Wolfi shipped the fix
# for CVE-2026-85091 as zlib 1.3.2.1_rc20260601-r0 and the advisory was amended
# to name that version, so the 1.3.3-r0 this file used to wait for is a number
# that will never arrive. A stock wolfi-base scan reports the advisory as
# `zlib 1.3.2-r7 -> 1.3.2.1_rc20260601-r0`, which is what Wolfi publishes on
# both arches today. scripts/blocked.py now watches the shipped version.
#
# Evidence, stated exactly as measured:
#   x86_64  gated locally 2026-09-20, PUSH=0: 0 fixable CVEs AND the boot test
#           passed, so this is "runs", not just "scans clean".
#   aarch64 not measured locally; this host kills background melange builds and
#           a qemu-emulated arm build does not fit the foreground timeout. CI's
#           native arm64 runner is the first arm measurement, and its gate
#           refuses to publish on any finding.
# 2026-08-16: the 3.2 LINE IS DROPPED. apache-airflow 3.2.2 carries CVE-2026-49296
# (MEDIUM) and upstream has no 3.2.3 -- the line is stale with no fixed release, so it
# cannot pass the gate. Shipping 3.3.1 alone is strictly better than shipping nothing;
# re-add 3.2 only if upstream cuts a fixed patch.
#
# Found by CI, NOT locally: the local Trivy DB did not yet contain CVE-2026-49296, so a
# local gate on this image returned 0 findings while CI's fresher DB failed it. Refresh
# with `trivy image --download-db-only` before trusting a local 0-CVE result, and treat
# CI as authoritative when the two disagree.
# airflow: image-only recipe input (the chart is authored in the charts repo).
# Apache Airflow is a pure-Python workflow orchestration platform distributed as
# the PyPI package `apache-airflow`, not a binary — so the melange pipeline installs
# it from PyPI into a virtualenv on a Wolfi python-3.12 base, then hardens it on a
# minimal apko base and gates it 0-CVE with Trivy (which scans the venv too).
#
# CRITICAL — Airflow REQUIRES its official constraints file or the dependency
# resolve explodes. The pipeline installs with:
#   --constraint https://raw.githubusercontent.com/apache/airflow/constraints-<VER>/constraints-3.12.txt
# The constraints file is version-AND-python-specific; the URL is derived from
# ${{package.version}} + the fixed python minor (3.12) in melange.yaml.
#
# PYTHON: python-3.12 — the highest Wolfi python the 3.2 line AND its published
# constraints file support (3.2.x classifiers cover 3.10-3.14; constraints-3.2.2/
# constraints-3.12.txt exists). We do NOT chase newest Wolfi python (3.14) per the
# Day-13 Authentik lesson.
#
# ============================================================================
# 2026-07-27: ADDED the 3.3 line (3.3.0) as the promised second band. Verified
# without building: apache-airflow 3.3.0 is on PyPI (requires_python
# ">=3.10,!=3.15", so python-3.12 still applies) and
# constraints-3.3.0/constraints-3.12.txt exists (713 pins). Its constraints
# ALREADY satisfy every security floor melange.yaml applies, so the post-install
# bump step is a NO-OP on 3.3.0: cryptography==48.0.1, pydantic-settings==2.14.2,
# python-multipart==0.0.32, starlette==1.3.1, tornado==6.5.7, aiosmtplib==5.1.2.
# STILL GATE 3.3.0 FIRST: a new minor pulls a fresh transitive tree, which is
# where the CVEs live. If it fails, remove 3.3.0 and keep 3.2.2.
#
# WHY 3.2.2 WAS THE ONLY LINE UNTIL NOW:
# ----------------------------------------------------------------------------
# The three newest stable MINOR lines are 3.2.2, 3.1.8, 3.0.6. But BOTH 3.1.8 and
# 3.0.6 carry a CRITICAL + multiple HIGH CVEs in the `apache-airflow` /
# `apache-airflow-core` packages THEMSELVES, all fixed only in 3.2.0+ (verified
# locally with `TRIVY_DETECTION_PRIORITY=comprehensive trivy image`):
#   CVE-2025-57735  CRITICAL  JWT token still valid after logout          (fix 3.2.0)
#   CVE-2025-54550  HIGH      RCE by race condition in example_xcom dag    (fix 3.2.0)
#   CVE-2026-33858  HIGH      Unsafe deserialization via legacy keys       (fix 3.2.0)
#   CVE-2026-25917  HIGH      Code execution via crafted XCom payloads     (fix 3.2.0, core)
#   CVE-2026-32228  HIGH      Asset-materialize DAG trigger bypass         (fix 3.2.0, core)
#   + several MEDIUM/LOW, all fixed 3.2.0/3.2.1
# The vulnerability is in Airflow itself, so it CANNOT be patched within a line
# without leaving it (we pin ==<VER>). The 0-CVE gate is sacred, so 3.1.8 and 3.0.6
# are DROPPED. Only the 3.2 line (>= 3.2.0) is clean of the airflow-core CVEs; we
# ship its newest patch, 3.2.2. Re-add 3.1.x / 3.0.x ONLY if upstream backports
# these fixes to a new 3.1/3.0 patch (unlikely — 3.0/3.1 are effectively EOL for
# these advisories). The 3.3 line is that promised second band (see the note above).
#
# The 2.x LTS line is intentionally NOT shipped: Airflow 2 is a different major with
# a different component/command surface (webserver vs api-server, no dag-processor
# split), which the clean-room chart is not designed for; the 3.x image is the target.
# ============================================================================
#
# Extras: [celery,postgres,redis] — the providers the standard multi-component chart
# uses (CeleryExecutor worker + Redis broker + PostgreSQL metadata DB). The image just
# provides the bare `airflow` entrypoint; the chart passes the per-component subcommand
# (api-server/scheduler/dag-processor/triggerer/worker) + the Fernet key +
# AIRFLOW__DATABASE__SQL_ALCHEMY_CONN. Full DB-backed boot (airflow db migrate) is the
# CHART's kind-gate job, not this image smoke.
#
# SECURITY BUMPS (see melange.yaml): after the constrained install, a handful of
# transitive Python deps the 3.2.2 constraints pin to CVE-affected versions are bumped
# to their patched releases (cryptography, pydantic-settings, python-multipart,
# starlette, tornado). pip re-resolves and `pip check` stays clean; airflow still
# imports + `airflow version`/`airflow info` run. These are the ONLY deltas from the
# official constraints and are required to pass the 0-CVE gate.
#
# Versions = newest patch of each CLEAN stable MINOR line >= 3.2 (PyPI, bare X.Y.Z,
# no `v` prefix). pip pins the install to __VER__ so there is no per-arch source SHA
# to track (PyPI is the source); render() just substitutes the version.
BLOCKED=0
FROM_SOURCE=0
VERSIONS=(3.3.1)
render() { echo "s/__VER__/$1/g"; }
