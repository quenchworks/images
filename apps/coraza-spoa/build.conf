# Coraza SPOA (corazawaf/coraza-spoa, Apache-2.0): the OWASP Coraza web application firewall as an HAProxy SPOE agent.
# HAProxy sends each request to it and denies what the rules flag. The OWASP Core Rule Set is compiled in through the
# coraza-coreruleset Go module (@owasp_crs/*.conf in the directives), so the image ships no rule files. Static Go.
# LATEST-ONLY: upstream patches only the newest release.
FROM_SOURCE=1
VERSIONS=(0.9.1)
declare -A SHA256=(
  [0.9.1]=0640365cd9d8718d8d6499947b8c2d47877a8d723092aee8ab3203477e45cd1d
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
