# superset: image-only recipe input (the chart is authored in the charts repo).
#
# Apache Superset is a pure-Python (Flask/FastAPI-ish + Celery) data-exploration
# web app distributed as a pip package (`apache-superset`), not a binary — there is
# no Wolfi `superset` package — so, exactly like MLflow, we install it from PyPI into
# a virtualenv on a Wolfi python-3.11 base, then harden it on a minimal apko base and
# gate it 0-CVE with Trivy (which scans the venv's Python packages too). See
# melange.yaml for the full package set. NO Node build is needed: the PyPI artifact
# already ships Superset's prebuilt frontend under superset/static/assets — the 6.1.0
# and 5.0.0 wheels bundle them, and the 6.0.0 sdist (no wheel published) ALSO bundles
# 235 prebuilt js/css assets, so `pip install` never touches npm/webpack.
#
# PYTHON MAJOR: Superset caps its supported Python via classifiers — 6.1/6.0 declare
# 3.10/3.11/3.12, but 5.0.0 declares only 3.10/3.11. The single interpreter that ALL
# three shipped lines support is python-3.11, so we build every line on Wolfi
# python-3.11 (Day-13 lesson: do NOT reach for the newest Wolfi python; Superset 5.0.0
# has no 3.12 classifier). No line is dropped.
#
# Versions = newest patch of each of the last 3 stable MINOR lines on PyPI (bare
# X.Y.Z, no `v` prefix, used as-is; rc/dev/bN prereleases excluded):
#   6.1.0  (6.1 line, wheel, prebuilt assets)
#   6.0.0  (6.0 line, sdist-only but bundles prebuilt assets)
#   5.0.0  (5.0 line, wheel, prebuilt assets)
# pip pins the install to __VER__, so there is no per-arch source SHA to track (PyPI
# is the source); render() just substitutes the version into both recipes.
#   __VER__ = version (bare X.Y.Z), used directly as `apache-superset==<VER>`
FROM_SOURCE=0
VERSIONS=(5.0.0 6.0.0 6.1.0)
render() { echo "s/__VER__/$1/g"; }
