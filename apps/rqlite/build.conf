# rqlite: lightweight distributed relational database (SQLite + Raft). From-source
# via melange (Go build from the git tag tarball). Image-only (a server + CLI, no
# chart). Latest patch of the last 2 minor lines (10.1, 10.2). Tag format is vX.Y.Z.
# rqlite's SQLite driver is the mattn/go-sqlite3 fork (rqlite/go-sqlite3), which is
# CGO: the build sets CGO_ENABLED=1 and links a fully static binary against musl
# (build-base), so the runtime image needs no libc. Both versions require Go 1.26,
# so the build-time toolchain is pinned to go-1.26 with GOTOOLCHAIN=local (no auto
# toolchain download). Version is stamped via -X on the /v10/cmd.Version linker var.
FROM_SOURCE=1
VERSIONS=(10.3.2)
declare -A SHA256=(
  [10.3.2]=c726d9d0457afc039adb0749e6a3412a2daefb247d53449f35e790722230a55b
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
