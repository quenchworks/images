# Packages the Mastodon streaming server into /opt/mastodon: the root workspace manifest
# plus streaming/, with only the streaming workspace's production dependencies installed.
package:
  name: quench-mastodon-streaming
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Mastodon streaming server, packaged on Wolfi"
  copyright:
    - license: AGPL-3.0-only
  dependencies:
    runtime:
      - nodejs-24
      - tzdata
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - nodejs-24
      - corepack

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/mastodon/mastodon/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
      strip-components: 1
  - runs: |
      set -eu
      APP="${{targets.destdir}}/opt/mastodon"
      install -d "$APP"
      cp -a package.json yarn.lock .yarnrc.yml streaming "$APP/"
      cd "$APP"
      export COREPACK_HOME=/tmp/corepack COREPACK_ENABLE_DOWNLOAD_PROMPT=0 HOME=/tmp/home
      mkdir -p /tmp/corepack-bin "$HOME" && corepack enable --install-directory /tmp/corepack-bin
      export PATH="/tmp/corepack-bin:$PATH"
      # qs 6.15.3 (CVE-2026-82417 and -82562), undici 8.10.0 (CVE-2026-85024), proxy-addr 2.0.7
      # (CVE-2026-90711) and source-map-js 1.2.1 (CVE-2026-93749) sit in the production tree;
      # resolutions move them within their line (yarn, so npm 12's cooldown does not apply). The lockfile changes, so
      # immutable installs are off (GitHub Actions sets CI, which turns them on by default).
      node -e '
        const fs = require("fs"), p = JSON.parse(fs.readFileSync("package.json"));
        p.resolutions = Object.assign(p.resolutions || {}, { qs: "6.16.0", undici: "8.10.2", "proxy-addr": "2.0.8", "source-map-js": "1.2.2" });
        fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");
      '
      YARN_ENABLE_IMMUTABLE_INSTALLS=false yarn workspaces focus --production @mastodon/streaming
      node -e '
        const fs = require("fs"), path = require("path"), bad = [];
        const floor = { qs: [6, 16, 0], undici: [8, 10, 2], "proxy-addr": [2, 0, 8], "source-map-js": [1, 2, 2] };
        (function walk(d) {
          for (const e of fs.readdirSync(d, { withFileTypes: true })) {
            if (!e.isDirectory()) continue;
            const f = path.join(d, e.name);
            if (floor[e.name] && path.basename(d) === "node_modules") {
              const v = JSON.parse(fs.readFileSync(path.join(f, "package.json"))).version.split(".").map(Number);
              const w = floor[e.name];
              if (v[0] === w[0] && (v[1] < w[1] || (v[1] === w[1] && v[2] < w[2]))) bad.push(f + " " + v.join("."));
            }
            walk(f);
          }
        })("node_modules");
        if (bad.length) { console.error("below floor: " + bad.join(", ")); process.exit(1); }
        console.log("qs, undici, proxy-addr and source-map-js at or above their floors");
      '
      rm -rf .yarn/cache .yarn/install-state.gz
      node -e 'require("express"); require("ioredis"); require("pg"); console.log("deps load")'
      chmod -R a+rX,go-w "$APP"

test:
  pipeline:
    - runs: |
        test -f /opt/mastodon/streaming/index.js
        cd /opt/mastodon && node -e 'require("express"); require("ws"); console.log("ok")'
