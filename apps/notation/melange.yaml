# Builds Notation from source onto Wolfi: static Go, no cgo, commit and build metadata
# stamped via -X like upstream's Makefile (the version itself is in internal/version).
package:
  name: quench-notation
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Notation signing and verification CLI, built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/notaryproject/notation/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      set -eu
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      export GO111MODULE=on
      export GOTOOLCHAIN=local
      # ---- 0-CVE module float (docs/go-module-float.md) ----------------------
      # Measured at 1.3.2: go.mod pins x/crypto 0.37.0, x/mod 0.24.0, x/sys 0.32.0 and
      # x/sync 0.10.0. The x/ set floats together so the family stays coherent (x/sync
      # 0.22.0 is what the floated x/crypto, x/net and x/text require). notation's
      # go.mod declares no `replace`. oras-go/v2 2.5.0 (fixes up to 2.6.2) and go-ntlmssp
      # (fix 0.1.1) are below their fixes too.
      FLOOR="golang.org/x/crypto@v0.56.0 golang.org/x/text@v0.41.0 golang.org/x/sys@v0.47.0 golang.org/x/net@v0.58.0 golang.org/x/sync@v0.22.0 golang.org/x/mod@v0.40.0 oras.land/oras-go/v2@v2.6.2 github.com/Azure/go-ntlmssp@v0.1.1"
      MODS="$(echo "$FLOOR" | tr ' ' '\n' | cut -d@ -f1)"
      # prints "<mod>@<floor> (<tag> has <ver>)" for every module below its floor
      below_floor() {
        awk -v floor="$FLOOR" -v tag="$1" '
          BEGIN { n = split(floor, f, " ")
                  for (i = 1; i <= n; i++) { split(f[i], kv, "@"); want[kv[1]] = kv[2] } }
          ($1 in want) {
            split(substr($2, 2), g, "."); split(substr(want[$1], 2), w, ".")
            for (i = 1; i <= 3; i++) {
              if ((g[i] + 0) > (w[i] + 0)) next
              if ((g[i] + 0) < (w[i] + 0)) { print $1 "@" want[$1] " (" tag " has " $2 ")"; next }
            }
          }'
      }
      # `go list -m` prints "<mod> <ver>" or "<mod> <ver> => <mod> <ver>", so $NF is
      # the EFFECTIVE version and a replace cannot hide behind the require line.
      go list -m -e $MODS
      need="$(go list -m -e $MODS | awk 'NF >= 2 && $NF ~ /^v[0-9]/ { print $1, $NF }' | below_floor go.mod | awk '{ print $1 }')"
      if [ -n "$need" ]; then go get $need; fi
      go mod tidy
      go build -trimpath \
        -ldflags "-s -w -X github.com/notaryproject/notation/internal/version.BuildMetadata= -X github.com/notaryproject/notation/internal/version.GitCommit=__COMMIT__" \
        -o "${{targets.destdir}}/usr/bin/notation" ./cmd/notation
      # The float is only real if it reached the BINARY. Every `dep`/`=>` line of
      # `go version -m` must be at or above its floor -- the `=>` line is what
      # catches a replace-shadowed float. Fail the build rather than ship it.
      bad="$(go version -m "${{targets.destdir}}/usr/bin/notation" \
        | awk '$1 == "dep" || $1 == "=>" { print $2, $3 }' | below_floor notation)"
      [ -z "$bad" ] || { echo "❌ 0-CVE float did not reach notation:"; echo "$bad"; exit 1; }
