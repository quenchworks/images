# notation: Notation, the Notary Project CLI to sign and verify OCI artifacts and
# container images, built from source on Wolfi (static Go, no cgo). Image only, no
# chart. Wolfi does not package notation.
#
# NEWEST-ONLY: Notation ships one supported line.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(1.3.2)
# sha256 of the GitHub tag tarball, computed from a download
declare -A SHA256=(
  [1.3.2]=f7239ca8155329b57f80e5fb01bf189441b3ade572ad9d6fc4582c1475b8e840
)
# the tag's commit, stamped into `notation version`
declare -A COMMIT=(
  [1.3.2]=001cc919603c1dc16c6aad387c94b4209cb9c901
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g; s|__COMMIT__|${COMMIT[$1]}|g"; }
