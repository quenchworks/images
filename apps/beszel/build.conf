# Beszel (henrygd/beszel, MIT): lightweight server monitoring. One image with both binaries:
# /usr/bin/beszel (the hub: PocketBase plus the web UI) and /usr/bin/beszel-agent (the metrics
# agent). From source via melange: npm builds the React UI (internal/site, embedded), go builds
# both commands CGO-free. Node never reaches the runtime image.
# imaging 1.6.2 (via PocketBase, CVE-2023-36308, no upstream fix) is mitigated; see melange.yaml.
# LATEST-ONLY: per-release frontend toolchains.
FROM_SOURCE=1
VERSIONS=(0.21.2)
declare -A SHA256=(
  [0.21.2]=8613c593fd447b4602644a73f1ec26d5d8233fa91109192c05a2406e22316c34
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
