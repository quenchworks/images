# csi-provisioner (kubernetes-csi/external-provisioner): the CSI external-provisioner, which creates and deletes CSI volumes for PersistentVolumeClaims. A Kubernetes CSI
# sidecar used by every CSI driver (Longhorn pins it in dep-versions). From source, static Go (CGO
# off), version stamped via -X main.version as release-tools/build.make does. Upstream's layout:
# the binary at /csi-provisioner, root by default (upstream's image is distroless/static, uid 0; the
# CSI socket it dials is created by the driver, usually as root).
# Latest patch of the last 3 minor lines.
FROM_SOURCE=1
VERSIONS=(6.1.2 6.2.1 6.3.0)
declare -A SHA256=(
  [6.1.2]=a100e50461c25e5c43a4a086bb0e4e0d02c5281e79fd67313d5a68051c3633a5
  [6.2.1]=a34eab262bfd99691dfa47155110266b6f1d29a14c7167accec7c25a5b4f98c5
  [6.3.0]=34c750aa8b435f46a87924f535ac673ff29f202fa94b990ce78568bcc80cd7be
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
