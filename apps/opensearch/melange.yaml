# Packages OpenSearch onto Wolfi. OpenSearch is a JVM app: we ship the upstream
# distribution's jars but drop its bundled JDK and run on the hardened openjdk-21-jre
# base the Kafka build established, so the JRE stays the CVE surface the Trivy gate
# scans (a bundled JDK would escape attribution).
package:
  name: quench-opensearch
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened OpenSearch, packaged on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - openjdk-21-jre     # the JRE OpenSearch runs on (the scanned CVE surface)
      - bash               # the opensearch bin/*.sh launchers are bash
      - busybox

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - curl
      - ca-certificates-bundle
      - go         # build-time only: the httpcomponents relocation and the calcite ACC_FINAL patch

pipeline:
  # OpenSearch ships arch-specific distributions (they bundle native x86_64/arm64
  # libs), so fetch the tarball matching the build arch, not a fixed one, or the
  # arm64 package ends up with x86_64 binaries (unsatisfiable so:ld-linux deps).
  - runs: |
      case "$(uname -m)" in
        x86_64)  osarch=x64;   sha=__SHA_AMD__ ;;
        aarch64) osarch=arm64; sha=__SHA_ARM__ ;;
        *) echo "unsupported arch $(uname -m)" >&2; exit 1 ;;
      esac
      url="https://artifacts.opensearch.org/releases/bundle/opensearch/${{package.version}}/opensearch-${{package.version}}-linux-${osarch}.tar.gz"
      curl -fsSL -o os.tar.gz "$url"
      echo "${sha}  os.tar.gz" | sha512sum -c -
      mkdir -p src && tar -xzf os.tar.gz -C src --strip-components 1
      cd src
      dest="${{targets.destdir}}/opt/opensearch"
      install -d "$dest"
      # ship bin, lib, modules, plugins, jdk-independent config; drop the bundled JDK
      # (we run on openjdk-21-jre) and the Windows launchers.
      cp -r bin config lib modules plugins agent LICENSE.txt NOTICE.txt "$dest/"
      rm -rf "$dest/jdk"
      find "$dest/bin" -name '*.bat' -delete

      # --- 0-CVE remediation (all findings are the Jul-2026 jackson-databind cluster
      # CVE-2026-54512..54518, plus netty CVEs) --------------------------------------
      # (1) DROP two OPTIONAL plugins whose vulnerable jackson/netty is SHADED inside a
      #     vendor uber-jar we cannot patch:
      #       * opensearch-security       -> opensaml-3.7.0.0-all.jar shades jackson-databind
      #       * opensearch-security-analytics -> security-analytics-commons shades netty
      #     Core OpenSearch (index/search/cluster) runs without either; security is off by
      #     construction (see the entrypoint note). Trade-off documented in build.conf.
      #       * opensearch-skills          -> spark-core_2.13-3.5.8.jar shades
      #                                      jetty-security 9.4.58 (CVE-2026-10050, HIGH).
      #         3.8.0 still bundles the SAME spark 3.5.8 / jetty 9.4.58 as 3.7.0 (verified
      #         from the dist, not assumed), so the recorded ">= 9.4.63" unblock condition
      #         is still unmet. Skills is an OPTIONAL agent/SQL-tooling plugin, not core
      #         index/search, and it drags in all of Apache Spark. Dropping it is the same
      #         trade-off already accepted for the two plugins above, and the honest
      #         alternative was shipping NO opensearch image at all (3.8.0 unpublished;
      #         3.7.0's published image now carries this same HIGH). RE-ADD the plugin the
      #         moment opensearch-skills ships a spark whose shaded jetty >= 9.4.63.
      rm -rf "$dest/plugins/opensearch-security" \
             "$dest/plugins/opensearch-security-analytics" \
             "$dest/plugins/opensearch-skills"
      # (2) The remaining vulnerable jackson-databind copies are STANDALONE plugin/module
      #     jars -> same-minor drop-in swap (2.21.3 -> 2.21.5 for the com.fasterxml line;
      #     3.1.3 -> 3.1.4 for the tools.jackson 3.x line; 2.21.5 needed for CVE-2026-54515).
      #     Sha256-pinned Maven Central. Replace content in place (keep filename); the
      #     OpenSearch plugin classloader scans the dir and Trivy reads the jar's internal
      #     pom.properties (= the fixed version).
      #     Jul-2026 update: the com.fasterxml line also needs jackson-core -> 2.21.5, and
      #     the tools.jackson 3.x line moves databind+core -> 3.1.5 (3.1.4 no longer clears
      #     the wave). All are same-line drop-ins, content replaced in place (filename kept).
      # Sep-2026 update: 3.8.0's dist now ships databind 2.22.1 and tools.jackson 3.2.1, which
      # carry CVE-2026-68497/-19032/-83557 and -91776/-91777. Databind alone moves, to 2.22.3 and 3.2.3.
      # Oct-2026 update: jackson-core 2.22.1/2.22.2 and tools core 3.2.1/3.2.2 carry
      # CVE-2026-89407/-89425; core moves with databind, same versions.
      MC="https://repo1.maven.org/maven2"
      # Swap every vulnerable copy in place (3.8.0 ships 2.22.1/3.2.1, 3.9.0 ships 2.22.2/3.2.2);
      # with none present, require the fixed one, so a dist that moved elsewhere still fails here.
      for line in "jackson-databind 2.22.3 com/fasterxml/jackson/core 556db5439e206114346043f68d200497dc96a0bca62a360a81784092ebd0e0a9 2.22.1 2.22.2" \
                  "jackson-databind 3.2.3 tools/jackson/core 235b72436af983857e44efa42449f4f0a2c571e69d6c5d9dd1253ae7d192dcf2 3.2.1 3.2.2" \
                  "jackson-core 2.22.3 com/fasterxml/jackson/core 8a501126a385b25841915d839508f8a66e2a0dbc8a6709d055ef3b3e852b094c 2.22.1 2.22.2" \
                  "jackson-core 3.2.3 tools/jackson/core a0c17e7e665a5e95c82f5fb45c0fec2ae3dc556c80f0016452c9c84cd23f3817 3.2.1 3.2.2"; do
        set -- $line; art=$1 fixed=$2 grp=$3 sha=$4; shift 4; n=0
        jar=$(mktemp)
        curl -fsSL -o "$jar" "$MC/$grp/$art/$fixed/$art-$fixed.jar"
        echo "$sha  $jar" | sha256sum -c -
        for old in "$@"; do
          for f in $(find "$dest" -name "$art-$old.jar"); do cp "$jar" "$f"; n=$((n+1)); done
        done
        rm -f "$jar"
        [ "$n" -gt 0 ] || [ -n "$(find "$dest" -name "$art-$fixed.jar")" ] || { echo "no $art $* or $fixed in the dist; it moved"; exit 1; }
      done
      # (2b) jsoup 1.15.3 -> 1.23.2 in opensearch-reports-scheduler (CVE-2026-71497).
      #      Standalone plugin jar, so a content swap keeping the filename (same
      #      convention as the jackson swaps above: the plugin classloader scans the dir
      #      and Trivy reads the jar's internal pom.properties). NOTE this is an 8-minor
      #      jump, unlike the 1.21.2 -> 1.23.1 hop the elasticsearch recipe needed --
      #      jsoup keeps 1.x source-compatible, and the boot + reports path is exercised
      #      by the smoke test, but re-check here first if reports ever misbehave.
      #      2026-10-06: 1.23.2 (CVE-2026-75140, HIGH) also replaces the 1.23.1 that 3.9.0
      #      ships. Version-aware: every jsoup 1.x jar older than the fix gets its content.
      js=$(mktemp -d)
      curl -fsSL -o "$js/jsoup.jar" "$MC/org/jsoup/jsoup/1.23.2/jsoup-1.23.2.jar"
      echo "e9d8c856856680427f096d156f02a414289985c930998fcb519ce5be39b42003  $js/jsoup.jar" | sha256sum -c -
      jsn=0
      for j in $(find "$dest" -name 'jsoup-1.*.jar'); do
        v=$(basename "$j" .jar); v=${v#jsoup-}
        [ "$v" = 1.23.2 ] && continue
        [ "$(printf '%s\n1.23.2\n' "$v" | sort -V | head -1)" = "$v" ] || continue
        cp "$js/jsoup.jar" "$j"; jsn=$((jsn+1))
      done
      [ -n "$(find "$dest" -name 'jsoup-1.*.jar')" ] || { echo "no jsoup in the dist; it moved"; exit 1; }
      rm -rf "$js"
      echo "jsoup: replaced $jsn copy/copies with 1.23.2 content"

      # --- (2c) httpcomponents5 + netty-codec-http + log4j-api -------------------------
      # HIGH findings on the published 3.7.0 image:
      #   httpclient5      5.6.1        -> 5.6.3
      #   httpcore5        5.4          -> 5.4.3
      #   httpcore5-h2     5.4          -> 5.4.3
      #   netty-codec-http 4.2.x        -> 4.2.17.Final
      #   log4j-api        2.25.4       -> 2.25.5
      #
      # READ THIS BEFORE TOUCHING THE httpcomponents PART. The 5.6.x httpclient5 line is
      # exactly what broke graylog this cycle: overlaid into graylog's OpenSearch storage
      # plugin it cleared the CVE gate AND the image smoke test, then CrashLoopBackOff'd in
      # the chart gate with `java.util.zip.ZipException: Not in GZIP format` from the
      # OpenSearch client's JSON parser.
      #
      # Here the jars sit in modules/reindex (the REST client used for REMOTE reindex),
      # modules/opensearch-dashboards, and the alerting / anomaly-detection plugins. So the
      # same client code path exists in this image, and neither the smoke test nor the
      # chart's kind gate exercised it -- index/get, cluster health and _plugins/_sql all
      # go through the transport layer, not httpclient5.
      #
      # So test.sh now performs a REMOTE reindex against the node's own HTTP endpoint. That
      # is a real remote reindex as far as OpenSearch is concerned: it goes through the REST
      # client and httpclient5, including the gzip handling that failed in graylog. If this
      # bump is going to break, that assertion is what catches it.
      #
      # httpcore5-reactive is bumped too even though it was not flagged: it is versioned in
      # lockstep with httpcore5 upstream, and leaving 5.4 beside 5.4.3 mixes two builds of
      # one library for no benefit.
      hc=$(mktemp); hcore=$(mktemp); hch2=$(mktemp); hcre=$(mktemp); nch=$(mktemp); l4j=$(mktemp)
      curl -fsSL -o "$hc"    "$MC/org/apache/httpcomponents/client5/httpclient5/5.6.3/httpclient5-5.6.3.jar"
      echo "80712ff129210d7c73d9fcc1195cbee5c3c34744965c7a05ea107b3648922f18  $hc"    | sha256sum -c -
      curl -fsSL -o "$hcore" "$MC/org/apache/httpcomponents/core5/httpcore5/5.4.3/httpcore5-5.4.3.jar"
      echo "18bfbbabb478dfb67f31aeaf428c387f3c3df654582e1309f708ee1f3086830a  $hcore" | sha256sum -c -
      curl -fsSL -o "$hch2"  "$MC/org/apache/httpcomponents/core5/httpcore5-h2/5.4.3/httpcore5-h2-5.4.3.jar"
      echo "c7db7026b8e2dea39132b04a6069f6671e2858309b20a146ec5c7dd6ed73a0b6  $hch2"  | sha256sum -c -
      curl -fsSL -o "$hcre"  "$MC/org/apache/httpcomponents/core5/httpcore5-reactive/5.4.3/httpcore5-reactive-5.4.3.jar"
      echo "f3b7c80d6021fee8ad42628d41eb826905fb3b595c211f001fdffa7fa1ecec3d  $hcre"  | sha256sum -c -
      curl -fsSL -o "$nch"   "$MC/io/netty/netty-codec-http/4.2.17.Final/netty-codec-http-4.2.17.Final.jar"
      echo "a5bde91ac82ab90579df6559c0bd7ea6ae37460e3f18116ab4122194283b3669  $nch"   | sha256sum -c -
      curl -fsSL -o "$l4j"   "$MC/org/apache/logging/log4j/log4j-api/2.25.5/log4j-api-2.25.5.jar"
      echo "64777f73ea0b3104c04eb82befbdccc30a425a19e83ad06cb2f93aa303511863  $l4j"   | sha256sum -c -

      # Rename rather than content-swap: unlike the jackson jars these carry the version in
      # paths the classloader logs, and an honest filename makes `find` verifiable below.
      # The glob matches every version of the library; only copies OLDER than the fixed
      # version are replaced, so a dist that already ships the fix (or newer: 3.9.0 has
      # httpclient5 5.6.4 and netty 4.2.18) is left alone rather than downgraded. A glob
      # with no match at all still stops the build: the library moved.
      swapjar() {  # <glob> <new-basename> <src>
        local n=0 kept=0 want v
        want="$(echo "$2" | grep -oE '[0-9]+(\.[0-9]+)+')"
        while IFS= read -r j; do
          v="$(basename "$j" | grep -oE '[0-9]+(\.[0-9]+)+' | head -1)"
          if [ "$(printf '%s\n%s\n' "$v" "$want" | sort -V | head -1)" = "$want" ]; then
            kept=$((kept+1)); continue
          fi
          cp "$3" "$(dirname "$j")/$2"; rm -f "$j"; n=$((n+1))
        done < <(find "$dest" -name "$1")
        test "$((n + kept))" -gt 0 || { echo "FATAL: no jar matched $1 -- the dist moved"; exit 1; }
        echo "  $1 -> $2 ($n replaced, $kept already at or above it)"
      }
      swapjar 'httpclient5-[0-9]*.jar'        httpclient5-5.6.3.jar      "$hc"
      swapjar 'httpcore5-[0-9]*.jar'          httpcore5-5.4.3.jar        "$hcore"
      swapjar 'httpcore5-h2-[0-9]*.jar'       httpcore5-h2-5.4.3.jar     "$hch2"
      swapjar 'httpcore5-reactive-[0-9]*.jar' httpcore5-reactive-5.4.3.jar "$hcre"
      swapjar 'netty-codec-http-4.2.*.Final.jar' netty-codec-http-4.2.17.Final.jar "$nch"
      swapjar 'log4j-api-2.[0-9]*.jar'        log4j-api-2.25.5.jar       "$l4j"
      rm -f "$hch2" "$hcre" "$nch" "$l4j"   # $hc/$hcore are reused by block (2d)

      # opensearch-ml bundles jline 3.21.0 (CVE-2026-77420/77421/77422, fix 3.30.15 on the 3.x
      # line). The five jline jars move together, and jansi 2.4.0 -> 2.4.3 because
      # jline-terminal-jansi 3.30.15 declares it. All Java 8 bytecode.
      for pair in \
        "org/jline jline-builtins 3.30.15 e67700beba6fbe9b2babb365aa3d32d8ee8ab79326aae01aee7288fddc66ae3e" \
        "org/jline jline-reader 3.30.15 f72f2ce167765b18a7604370963c1413b5bec923a97576b745fbce40a7034fbf" \
        "org/jline jline-style 3.30.15 302a8779c9f175ea618e573bb38e8d240c3c5ccdfe639aeccec69e0b5ef0690c" \
        "org/jline jline-terminal 3.30.15 eed027d1f63a870c8d0522c067959382ad7d3ccddfd8c7041488432189e0e284" \
        "org/jline jline-terminal-jansi 3.30.15 de0a419b6b5aaa6029c0546c7bf79e4ab326f0b9d749283687294b8506dcf545" \
        "org/fusesource/jansi jansi 2.4.3 ec168cf31c4c3849348dfff7a04e90170615f7784f1255ee6747b98a854c04c5"; do
        set -- $pair; g=$1; a=$2; v=$3; sha=$4
        t=$(mktemp); curl -fsSL -o "$t" "$MC/$g/$a/$v/$a-$v.jar"; echo "$sha  $t" | sha256sum -c -
        case "$a" in jansi) old='jansi-[0-9]*.jar' ;; *) old="$a-[0-9]*.jar" ;; esac
        swapjar "$old" "$a-$v.jar" "$t"; rm -f "$t"
      done
      # guava: core and plugins bundle 32.1.3 to 33.7.1-jre, all carrying CVE-2026-102554
      # (fix 33.7.2-jre, 2026-11-01). One drop-in for every copy below it.
      t=$(mktemp); curl -fsSL -o "$t" "$MC/com/google/guava/guava/33.7.2-jre/guava-33.7.2-jre.jar"
      echo "b530942257fb935f8b2cfaa5f8eb5bd59c555fd8e8d01b8ce98912e077ea606c  $t" | sha256sum -c -
      swapjar 'guava-[0-9]*-jre.jar' guava-33.7.2-jre.jar "$t"; rm -f "$t"
      test "$(find "$dest" -name 'guava-*.jar' ! -name guava-33.7.2-jre.jar | wc -l)" -eq 0 \
        || { echo "FATAL: a guava jar other than 33.7.2-jre survived"; find "$dest" -name 'guava-*.jar'; exit 1; }
      # org.json: seven plugins bundle json-20231013 to json-20251224 (CVE-2026-59171, MEDIUM,
      # JSONTokener numeric DoS, fixed 20260719). Date versions, so not through swapjar's dotted
      # version compare; 20260814 drops no class any of them has.
      t=$(mktemp); curl -fsSL -o "$t" "$MC/org/json/json/20260814/json-20260814.jar"
      echo "7dd2de1533e766e2b6c07d8194da85145ad313a167a4760050f5c9b6839604fe  $t" | sha256sum -c -
      find "$dest" -name 'json-2[0-9][0-9][0-9][0-9][0-9][0-9][0-9].jar' ! -name json-20260814.jar | while IFS= read -r j; do
        v="${j##*/json-}"; v="${v%.jar}"
        [ "$v" -lt 20260814 ] || continue
        cp "$t" "$(dirname "$j")/json-20260814.jar"; rm -f "$j"; echo "  ${j#"$dest"/} -> json-20260814.jar"
      done
      rm -f "$t"
      test "$(find "$dest" -name 'json-2[0-9][0-9][0-9][0-9][0-9][0-9][0-9].jar' ! -name json-20260814.jar | wc -l)" -eq 0 \
        || { echo "FATAL: an org.json jar older than 20260814 survived"; exit 1; }
      # Nothing may be left behind at an old version, or the classloader sees both.
      for stale in 'httpclient5-5.6.1.jar' 'httpcore5-5.4.jar' 'httpcore5-h2-5.4.jar' \
                   'httpcore5-reactive-5.4.jar' 'log4j-api-2.25.4.jar'; do
        n=$(find "$dest" -name "$stale" | wc -l)
        test "$n" -eq 0 || { echo "FATAL: $n stale $stale survived the swap"; exit 1; }
      done

      # --- (2d) the SAME httpcomponents fix, inside the RELOCATED copy -----------------
      # The swaps above only reach STANDALONE jars. opensearch-notifications-core-spi
      # additionally carries httpcore5 5.4 + httpclient5 5.6.1 as SHADED classes that
      # upstream's Gradle shadow step RELOCATED to
      #   org/opensearch/notifications/core/repackage/org/apache/hc/...
      # with the bytecode rewritten to the repackaged names. There is no jar to swap and
      # no upstream release to wait for: 3.8.0 is the newest OpenSearch (2026-08-05), so
      # the only honest fix is to do upstream's relocation ourselves against the FIXED
      # releases -- httpcore5 5.4.3 (CVE-2026-54399) / httpclient5 5.6.3 (CVE-2026-64607).
      #
      # An earlier attempt at this was REJECTED and must not come back: copying the
      # vanilla 5.x classes to the relocated PATH leaves each class declaring its original
      # package (path and name disagree -> the plugin dies at load), and editing only the
      # bundled pom.properties makes Trivy go quiet while the running code stays 5.6.1 --
      # the exact trap docs/go-module-float.md warns about. So this does the real thing.
      #
      # Relocating a jar is a pure constant-pool UTF8 rewrite: a class file holds no
      # absolute byte offsets and the entry count/order is untouched, so every index stays
      # valid and everything after the pool copies verbatim. That is what shadow's
      # ClassRemapper does. The transform was VERIFIED against upstream's own output: run
      # over 5.4 + 5.6.1 it produces, for all 1272 shaded entries, exactly the UTF8
      # constant set shadow produced -- zero names present in shadow's output and absent
      # from ours (it differs only by ~231 dead pool entries ASM prunes, which reference
      # nothing). 5.4 -> 5.4.3 and 5.6.1 -> 5.6.3 are also purely ADDITIVE at the entry
      # level (3 new classes, none removed), so nothing the shaded copy or the plugin's
      # own code links against disappears -- asserted below rather than assumed.
      cat > /tmp/os-hc-relocate.go <<'GO'
      // os-hc-relocate relocates the fixed httpcore5/httpclient5 releases into the
      // notifications-core SPI jar's shaded package: a constant-pool UTF8 rewrite of every
      // class (no byte offsets move, as shadow's ClassRemapper), the fixed artifacts' maven
      // metadata, and the rest of the jar left as it was. Usage: <dest> <httpcore5.jar> <httpclient5.jar>
      package main

      import (
      	"archive/zip"
      	"bytes"
      	"encoding/binary"
      	"fmt"
      	"io"
      	"os"
      	"path/filepath"
      	"sort"
      	"strconv"
      	"strings"
      	"time"
      )

      const (
      	spiGlob = "plugins/opensearch-notifications-core/opensearch-notifications-core-spi-*.jar"
      	prefix  = "org/opensearch/notifications/core/repackage/"
      	hc      = prefix + "org/apache/hc/"
      	coreA   = "org.apache.httpcomponents.core5/httpcore5"
      	clientA = "org.apache.httpcomponents.client5/httpclient5"
      )

      var (
      	subs     = [][2][]byte{{[]byte("org/apache/hc/"), []byte(hc)}, {[]byte("org.apache.hc."), []byte(strings.ReplaceAll(hc, "/", "."))}}
      	fixed    = map[byte]int{3: 4, 4: 4, 5: 8, 6: 8, 7: 2, 8: 2, 9: 4, 10: 4, 11: 4, 12: 4, 15: 3, 16: 2, 17: 4, 18: 4, 19: 2, 20: 2}
      	pristine = map[string]string{coreA: "5.4", clientA: "5.6.1"}
      	fix      = map[string]string{coreA: "5.4.3", clientA: "5.6.3"}
      	proof    = [][2]string{
      		{hc + "core5/io/SocketSupport.class", "httpcore5 5.4.3"},
      		{hc + "client5/http/entity/compress/DecompressingEntity$LazyDecompressingInputStream.class", "httpclient5 5.6.3"},
      	}
      )

      func fail(f string, a ...any) {
      	fmt.Fprintf(os.Stderr, f+"\n", a...)
      	os.Exit(1)
      }

      func sub(b []byte) []byte {
      	for _, s := range subs {
      		b = bytes.ReplaceAll(b, s[0], s[1])
      	}
      	return b
      }

      func relocateClass(b []byte) []byte {
      	count := int(binary.BigEndian.Uint16(b[8:]))
      	out := append([]byte{}, b[:10]...)
      	off := 10
      	for i := 1; i < count; {
      		tag := b[off]
      		out = append(out, tag)
      		off++
      		if tag == 1 {
      			ln := int(binary.BigEndian.Uint16(b[off:]))
      			off += 2
      			s := sub(append([]byte{}, b[off:off+ln]...))
      			off += ln
      			if len(s) > 0xFFFF {
      				fail("utf8 entry overflows u2 after relocation")
      			}
      			out = binary.BigEndian.AppendUint16(out, uint16(len(s)))
      			out = append(out, s...)
      		} else {
      			n, ok := fixed[tag]
      			if !ok {
      				fail("unknown constant-pool tag %d", tag)
      			}
      			out = append(out, b[off:off+n]...)
      			off += n
      		}
      		if tag == 5 || tag == 6 {
      			i += 2
      		} else {
      			i++
      		}
      	}
      	return append(out, b[off:]...)
      }

      func readAll(f *zip.File) []byte {
      	r, err := f.Open()
      	if err != nil {
      		fail("%v", err)
      	}
      	defer r.Close()
      	b, err := io.ReadAll(r)
      	if err != nil {
      		fail("%v", err)
      	}
      	return b
      }

      func relocate(path string, out map[string][]byte) {
      	z, err := zip.OpenReader(path)
      	if err != nil {
      		fail("%v", err)
      	}
      	defer z.Close()
      	for _, f := range z.File {
      		n := f.Name
      		switch {
      		case strings.HasSuffix(n, "/"):
      		case strings.HasPrefix(n, "org/apache/hc/"):
      			d := readAll(f)
      			if strings.HasSuffix(n, ".class") {
      				out[prefix+n] = relocateClass(d)
      			} else {
      				out[prefix+n] = sub(d)
      			}
      		case strings.HasPrefix(n, "META-INF/maven/"):
      			out[n] = readAll(f)
      		}
      	}
      }

      func props(b []byte, key string) string {
      	for _, l := range strings.Fields(string(b)) {
      		if k, v, ok := strings.Cut(l, "="); ok && k == key {
      			return v
      		}
      	}
      	return ""
      }

      func vt(v string) []int {
      	var r []int
      	for _, x := range strings.Split(v, ".") {
      		n, _ := strconv.Atoi(x)
      		r = append(r, n)
      	}
      	return r
      }

      func atLeast(a, b string) bool {
      	x, y := vt(a), vt(b)
      	for i := 0; i < len(x) || i < len(y); i++ {
      		var p, q int
      		if i < len(x) {
      			p = x[i]
      		}
      		if i < len(y) {
      			q = y[i]
      		}
      		if p != q {
      			return p > q
      		}
      	}
      	return true
      }

      func main() {
      	dest, coreJar, clientJar := os.Args[1], os.Args[2], os.Args[3]
      	nw := map[string][]byte{}
      	relocate(coreJar, nw)
      	relocate(clientJar, nw)
      	for _, p := range proof {
      		if _, ok := nw[p[0]]; !ok {
      			fail("%s absent: %s is not what was downloaded", p[0], p[1])
      		}
      	}
      	jars, _ := filepath.Glob(filepath.Join(dest, spiGlob))
      	sort.Strings(jars)
      	if len(jars) == 0 {
      		fail("no %s: the notifications-core plugin layout changed", spiGlob)
      	}
      	for _, spi := range jars {
      		z, err := zip.OpenReader(spi)
      		if err != nil {
      			fail("%v", err)
      		}
      		files := z.File
      		data := map[string][]byte{}
      		for _, f := range files {
      			data[f.Name] = readAll(f)
      		}
      		have := map[string]string{}
      		for a := range fix {
      			p := "META-INF/maven/" + a + "/pom.properties"
      			d, ok := data[p]
      			if !ok {
      				fail("%s: %s missing: shading layout changed", spi, p)
      			}
      			have[a] = props(d, "version")
      		}
      		already := true
      		for a, v := range fix {
      			if !atLeast(have[a], v) {
      				already = false
      			}
      		}
      		if already {
      			fmt.Printf("  %s: already at the fixed versions\n", filepath.Base(spi))
      			z.Close()
      			continue
      		}
      		for a, v := range pristine {
      			if have[a] != v {
      				fail("%s: shaded httpcomponents is %v, expected pristine %v or fixed %v; re-check by hand", spi, have, pristine, fix)
      			}
      		}
      		var gone []string
      		shaded := 0
      		for n := range data {
      			if strings.HasPrefix(n, hc) && !strings.HasSuffix(n, "/") {
      				shaded++
      				if _, ok := nw[n]; !ok {
      					gone = append(gone, n)
      				}
      			}
      		}
      		if len(gone) > 0 {
      			sort.Strings(gone)
      			fail("the fixed releases dropped %d class(es) the shaded copy links against: %v", len(gone), gone[:min(5, len(gone))])
      		}
      		tmp := spi + ".new"
      		of, err := os.Create(tmp)
      		if err != nil {
      			fail("%v", err)
      		}
      		w := zip.NewWriter(of)
      		seen := map[string]bool{}
      		for _, f := range files {
      			if strings.HasPrefix(f.Name, hc) {
      				continue
      			}
      			seen[f.Name] = true
      			d, ok := nw[f.Name]
      			if !ok {
      				d = data[f.Name]
      			}
      			h := f.FileHeader
      			h.Method = zip.Deflate
      			dst, err := w.CreateHeader(&h)
      			if err != nil {
      				fail("%v", err)
      			}
      			dst.Write(d)
      		}
      		var added []string
      		for n := range nw {
      			if !seen[n] {
      				added = append(added, n)
      			}
      		}
      		sort.Strings(added)
      		for _, n := range added {
      			dst, err := w.CreateHeader(&zip.FileHeader{Name: n, Method: zip.Deflate, Modified: time.Date(1980, 2, 1, 0, 0, 0, 0, time.UTC)})
      			if err != nil {
      				fail("%v", err)
      			}
      			dst.Write(nw[n])
      		}
      		if err := w.Close(); err != nil {
      			fail("%v", err)
      		}
      		of.Close()
      		z.Close()
      		if err := os.Rename(tmp, spi); err != nil {
      			fail("%v", err)
      		}
      		// verify the artifact on disk: scanner metadata, runtime version.properties, proof classes
      		v, err := zip.OpenReader(spi)
      		if err != nil {
      			fail("%v", err)
      		}
      		names := map[string]*zip.File{}
      		for _, f := range v.File {
      			names[f.Name] = f
      		}
      		for a, want := range fix {
      			if got := props(readAll(names["META-INF/maven/"+a+"/pom.properties"]), "version"); got != want {
      				fail("%s: pom.properties says %s, expected %s", a, got, want)
      			}
      		}
      		for mod, want := range map[string]string{"core5": fix[coreA], "client5": fix[clientA]} {
      			f := names[hc+mod+"/version.properties"]
      			if f == nil {
      				fail("%s version.properties missing", mod)
      			}
      			var rel []string
      			for _, l := range strings.Split(string(readAll(f)), "\n") {
      				if strings.HasPrefix(l, "info.release") {
      					_, r, _ := strings.Cut(l, "=")
      					rel = append(rel, strings.TrimSpace(r))
      				}
      			}
      			if len(rel) != 1 || rel[0] != want {
      				fail("%s version.properties reports %v, expected %s", mod, rel, want)
      			}
      		}
      		for _, p := range proof {
      			if names[p[0]] == nil {
      				fail("%s missing from the rewritten jar (%s)", p[0], p[1])
      			}
      		}
      		for n := range names {
      			if strings.HasPrefix(n, "org/apache/hc/") {
      				fail("entries left unrelocated, e.g. %s", n)
      			}
      		}
      		v.Close()
      		fmt.Printf("  %s: shaded httpcomponents relocated at httpcore5 %s / httpclient5 %s (%d entries replaced, %d added)\n",
      			filepath.Base(spi), fix[coreA], fix[clientA], shaded, len(added))
      	}
      }
      GO
      go run /tmp/os-hc-relocate.go "$dest" "$hcore" "$hc"
      rm -f "$hc" "$hcore"

      # (3) opensearch-sql/opensearch-skills bundle Apache Calcite 1.41.0, whose
      #     calcite-core carries CVE-2026-46718 (unsafe reflection, MEDIUM). The fix is
      #     calcite-core 1.42.0 -- BUT 1.42's CALCITE-7351 made RelDataTypeSystemImpl's
      #     getMaxNumericScale()/getMaxNumericPrecision() FINAL, and OpenSearch's
      #     OpenSearchTypeSystem (core-3.7.0.0.jar) OVERRIDES both -> boot dies with
      #     java.lang.IncompatibleClassChangeError. Removing `final` is binary-compatible
      #     (JLS 13.4.17) and is unrelated to the unsafe-reflection fix, so we swap in
      #     calcite-core 1.42.0 and clear the ACC_FINAL bit on just those two methods.
      #     calcite-babel/linq4j must move to 1.42.0 as a set too: core 1.42 references
      #     linq4j 1.42 classes (e.g. NullablePredicate2) absent in 1.41 -> node dies at
      #     boot with ClassNotFoundException otherwise. Only calcite-core is CVE-flagged;
      #     babel/linq4j 1.42 are clean drop-ins. Boot + SQL verified.
      cal=$(mktemp -d)
      for a in calcite-core calcite-babel calcite-linq4j; do
        curl -fsSL -o "$cal/$a-1.42.0.jar" "$MC/org/apache/calcite/$a/1.42.0/$a-1.42.0.jar"
      done
      ( cd "$cal" && sha256sum -c - <<'SUMS'
      2ed5489201baab842001c95f939a0829849cf3cdaed9cdbf4b9078633c35792b  calcite-core-1.42.0.jar
      8811dff2ddc33d2692f0e55d4ddbdc2cf3067312f0a5f3194573f15e9d463939  calcite-babel-1.42.0.jar
      6f54fa9f24a07ad961e0e1af499a58cfc2374a93ee280283beafe9035de3fa45  calcite-linq4j-1.42.0.jar
      SUMS
      )
      cc="$cal/calcite-core-1.42.0.jar"
      cat > /tmp/calcite-unfinal.go <<'GO'
      // calcite-unfinal clears ACC_FINAL on RelDataTypeSystemImpl.getMaxNumericScale and
      // getMaxNumericPrecision in a calcite-core jar, rewriting the jar in place.
      package main

      import (
      	"archive/zip"
      	"encoding/binary"
      	"fmt"
      	"io"
      	"os"
      )

      const class = "org/apache/calcite/rel/type/RelDataTypeSystemImpl.class"

      var (
      	methods = map[string]bool{"getMaxNumericScale": true, "getMaxNumericPrecision": true}
      	fixed   = map[byte]int{7: 2, 9: 4, 10: 4, 11: 4, 8: 2, 3: 4, 4: 4, 5: 8, 6: 8, 12: 4, 15: 3, 16: 2, 17: 4, 18: 4, 19: 2, 20: 2}
      )

      func fail(f string, a ...any) {
      	fmt.Fprintf(os.Stderr, f+"\n", a...)
      	os.Exit(1)
      }

      func u16(b []byte, o int) int { return int(binary.BigEndian.Uint16(b[o:])) }

      func main() {
      	jar := os.Args[1]
      	z, err := zip.OpenReader(jar)
      	if err != nil {
      		fail("%v", err)
      	}
      	files := z.File
      	data := map[string][]byte{}
      	for _, f := range files {
      		r, _ := f.Open()
      		data[f.Name], _ = io.ReadAll(r)
      		r.Close()
      	}
      	b := data[class]
      	if b == nil {
      		fail("%s not in %s", class, jar)
      	}
      	// constant pool: keep the UTF8 strings by index
      	utf8 := map[int]string{}
      	off := 8
      	count := u16(b, off)
      	off += 2
      	for i := 1; i < count; {
      		tag := b[off]
      		off++
      		if tag == 1 {
      			ln := u16(b, off)
      			off += 2
      			utf8[i] = string(b[off : off+ln])
      			off += ln
      		} else {
      			off += fixed[tag]
      		}
      		if tag == 5 || tag == 6 {
      			i += 2
      		} else {
      			i++
      		}
      	}
      	off += 6                  // access, this, super
      	off += 2 + u16(b, off)*2  // interfaces
      	members := func() []int { // fields, then methods: start offsets of each
      		n := u16(b, off)
      		off += 2
      		var starts []int
      		for j := 0; j < n; j++ {
      			starts = append(starts, off)
      			off += 6
      			ac := u16(b, off)
      			off += 2
      			for k := 0; k < ac; k++ {
      				off += 2
      				al := int(binary.BigEndian.Uint32(b[off:]))
      				off += 4 + al
      			}
      		}
      		return starts
      	}
      	members()
      	changed := 0
      	for _, s := range members() {
      		fl, ni := u16(b, s), u16(b, s+2)
      		if methods[utf8[ni]] && fl&0x0010 != 0 {
      			binary.BigEndian.PutUint16(b[s:], uint16(fl&^0x0010))
      			changed++
      		}
      	}
      	if changed != 2 {
      		fail("expected 2 final methods, cleared %d", changed)
      	}
      	z.Close()
      	of, err := os.Create(jar + ".new")
      	if err != nil {
      		fail("%v", err)
      	}
      	w := zip.NewWriter(of)
      	for _, f := range files {
      		h := f.FileHeader
      		h.Method = zip.Deflate
      		dst, err := w.CreateHeader(&h)
      		if err != nil {
      			fail("%v", err)
      		}
      		dst.Write(data[f.Name])
      	}
      	if err := w.Close(); err != nil {
      		fail("%v", err)
      	}
      	of.Close()
      	if err := os.Rename(jar+".new", jar); err != nil {
      		fail("%v", err)
      	}
      	fmt.Printf("calcite-core: cleared ACC_FINAL on %d methods\n", changed)
      }
      GO
      go run /tmp/calcite-unfinal.go "$cc"
      # opensearch-skills is dropped above, so only patch plugin dirs that survive --
      # an unconditional cp into a removed dir fails the whole build. Assert we patched
      # at least one, so a future rename cannot silently skip the calcite fix entirely.
      patched=0
      for pdir in opensearch-sql opensearch-skills; do
        [ -d "$dest/plugins/$pdir" ] || continue
        rm -f "$dest/plugins/$pdir"/calcite-*-1.41.0.jar
        cp "$cal"/calcite-*-1.42.0.jar "$dest/plugins/$pdir/"
        patched=$((patched+1))
      done
      [ "$patched" -gt 0 ] || { echo "❌ no plugin dir received the patched calcite -- layout changed"; exit 1; }
      echo "calcite 1.42.0 installed into $patched plugin dir(s)"
      rm -rf "$cal"
      # (4) netty 4.2.16.Final -> 4.2.17.Final content swap (2026-09-14; second hop of
      #     the Jul-2026 netty wave -- the nightly scan flagged netty-handler at 4.2.16
      #     content, fix 4.2.17.Final). Standalone io.netty jars in
      #     modules/transport-netty4 + plugins/opensearch-{ml,notifications,
      #     performance-analyzer} (the opensearch-security / -security-analytics plugins
      #     that also carried netty are already dropped above). netty-codec-http is NOT
      #     in the nettyswap list: block (2c) already renamed it to 4.2.17.Final, and a
      #     line here would silently match nothing. 3.8.0 is the newest upstream
      #     OpenSearch, so there is NO version bump -- jar surgery. netty is ABI-stable
      #     within 4.2.x -> content-swap in place keeping the bundled 4.2.16 filename;
      #     Trivy reads the jar's internal pom.properties (= 4.2.17) -> clean. The set
      #     MUST move as ONE lockstep set within 4.2.x; test.sh's remote-reindex
      #     assertion guards the httpclient5/netty client path that neither boot nor the
      #     chart gate exercises. NOTE: opensearch-ml/-notifications also ship
      #     netty-transport-classes-epoll-4.1.124 (a separate 4.1.x line, not part of
      #     this 4.2.16 set); left as-is.
      nd=$(mktemp -d)
      nettyswap() { # <artifact> <sha256-of-4.2.17>
        curl -fsSL -o "$nd/$1-4.2.17.Final.jar" "$MC/io/netty/$1/4.2.17.Final/$1-4.2.17.Final.jar"
        echo "$2  $nd/$1-4.2.17.Final.jar" | sha256sum -c -
        local n=0
        while IFS= read -r j; do cp "$nd/$1-4.2.17.Final.jar" "$j"; n=$((n+1)); done \
          < <(find "$dest" -name "$1-4.2.16.Final.jar")
        # a find that matches nothing must fail the build: a silent no-op would ship the
        # unswapped jar (the codec-http line in the previous hop hid exactly this way).
        # 3.9.0 bundles 4.2.18 itself: with no 4.2.16 copy, every copy of the artifact must
        # already be at 4.2.17 or newer, or the netty line moved and needs re-triage.
        if [ "$n" -eq 0 ]; then
          local have
          have="$(find "$dest" -name "$1-4.2.*.Final.jar" | sed -E "s|.*/$1-(4\.2\.[0-9]+)\.Final\.jar|\1|" | sort -V | head -1)"
          [ -n "$have" ] && [ "$(printf '%s\n4.2.17\n' "$have" | sort -V | head -1)" = 4.2.17 ] \
            || { echo "FATAL: no $1 at 4.2.16 or at 4.2.17+ in the dist (lowest: ${have:-none}); re-triage block (4)"; exit 1; }
          echo "  $1: dist already at $have or newer"
        fi
      }
      nettyswap netty-buffer                        0d249178ec0204b35a6ad3e5ac8a6c2ecb3eb496c6cdae40b8eca4fa3cb6a0c7
      nettyswap netty-codec                         ac76f972446a2f72818441f746d0e73c58519a4687bf680d2b687d7dc5e28e2e
      nettyswap netty-codec-base                    3b92bc3b7d231fa6f4889b2b9281cae6b634428b8121fb1b9b5fccba1543d352
      nettyswap netty-codec-classes-quic            542e718fdd8fa4f6d57bef9f91a5fa01200940cb8b381fd4c21fb5c170276c71
      nettyswap netty-codec-compression             425b287a1f36986a5c8edd76379a49decdf99d284f3454f3fa607a073bfb2c18
      nettyswap netty-codec-http2                   450af97424cf58d2d72ad4d476d9e290f2fdf69fa181c289a6e6dd176bb86a7b
      nettyswap netty-codec-http3                   9fcf9873e31b2899c407b42d320aaf6afeb69807e63d9a865c391b4339fa24c7
      nettyswap netty-codec-marshalling             ee5ffed638da6b7e2b4567559bd5f78b18f635cdaa4f3b6d23aa27ccf6cb57c2
      nettyswap netty-codec-protobuf                44b2fcc4bc1d6c01edafe6ae6c8a7de7c3c5bad59697a93b6b879a45a78a5387
      nettyswap netty-codec-socks                   6b5760cc512cee1f7515e25010892471f3995045f84cd6c1d1b6e6cee534733c
      nettyswap netty-common                        502aae2a6680e9bca3558a3fa098f06dc4d87340b8b714e925a6d690871c092a
      nettyswap netty-handler                       4df11c7520b556c5e2c84b939182699d48fcbb09e97a6bb5e1c0b6835227d126
      nettyswap netty-handler-proxy                 94089bea6ba6f3248725f2bf233aa2bc70ac1547c21b9bdfc7548f710a845aa0
      nettyswap netty-resolver                      7a4b599b9c0c29a505d3b7311f142df883fb27d0f67495a7cbaf533b0e456623
      nettyswap netty-transport                     d2409ce3a735cbab4188d0ea5d82abed823a6a07a8389f49af4a9e1243a562bc
      nettyswap netty-transport-native-unix-common  e01aa467b9104de54a57c08c290f70b22e53ec97cf5583c87c112170ef5832cc
      # netty-codec-native-quic ships a base jar + per-OS classifier jars (transport-netty4).
      nettyquic() { # <classifier-suffix, "" for the base jar> <sha256-of-4.2.17>
        f="netty-codec-native-quic-4.2.17.Final$1.jar"; o="netty-codec-native-quic-4.2.16.Final$1.jar"
        curl -fsSL -o "$nd/$f" "$MC/io/netty/netty-codec-native-quic/4.2.17.Final/$f"
        echo "$2  $nd/$f" | sha256sum -c -
        local n=0
        while IFS= read -r j; do cp "$nd/$f" "$j"; n=$((n+1)); done < <(find "$dest" -name "$o")
        if [ "$n" -eq 0 ]; then   # 3.9.0 bundles 4.2.18: accept 4.2.17 or newer, as nettyswap does
          local have
          have="$(find "$dest" -name "netty-codec-native-quic-4.2.*.Final$1.jar" | sed -E "s|.*/netty-codec-native-quic-(4\.2\.[0-9]+)\.Final.*|\1|" | sort -V | head -1)"
          [ -n "$have" ] && [ "$(printf '%s\n4.2.17\n' "$have" | sort -V | head -1)" = 4.2.17 ] \
            || { echo "FATAL: no $o and no 4.2.17+ copy in the dist (lowest: ${have:-none}); re-triage block (4)"; exit 1; }
          echo "  netty-codec-native-quic$1: dist already at $have or newer"
        fi
      }
      nettyquic ""               cf81b35ddcd712b3e6470962459e3b0be5bef45628c9aeac029ba26de574ce8a
      nettyquic -linux-aarch_64  350ba4c87cb8d2066d895f511605e1479da2c25e2bf5c2cf5dcb4cd34fcaae75
      nettyquic -linux-x86_64    9225b069850e2238126359b6d3ad00df1c8c528ce5123682b8090c09ec37bdbf
      nettyquic -osx-aarch_64    a6b5bee555259e6b955ecc45f0425a000332d35d545a9a97e5730f0e939c0065
      nettyquic -osx-x86_64      d8c48589adfafd798d1c4b3996d9b19dc7bd9f1785524b821388e2db73a52dd2
      nettyquic -windows-x86_64  1540888c76d55eff98899d7f1cd109fddda137992e170ee4096871886e15f4b8
      rm -rf "$nd"
      # OpenSearch ships config/ with restrictive perms; the nonroot runtime user must
      # be able to read them to seed the writable conf dir (and execute the launchers).
      chmod -R a+rX "$dest"
      # bake a config-from-env entrypoint. The read-only rootfs means the config,
      # data, and logs live under writable mounts; OPENSEARCH_* env override defaults.
      install -d "${{targets.destdir}}/usr/bin"
      cat > "${{targets.destdir}}/usr/bin/docker-entrypoint.sh" <<'EOS'
      #!/bin/bash
      set -euo pipefail

      OS_HOME=/opt/opensearch
      CONF="${OPENSEARCH_PATH_CONF:-/conf}"
      DATA="${OPENSEARCH_PATH_DATA:-/data}"
      LOGS="${OPENSEARCH_PATH_LOGS:-/var/log/opensearch}"
      mkdir -p "$CONF" "$DATA" "$LOGS"

      # The rootfs is read-only, so /tmp is not writable. OpenSearch's bin/opensearch
      # launcher otherwise calls TempDirectory to mkdir under java.io.tmpdir (=/tmp)
      # and dies. Pre-set OPENSEARCH_TMPDIR to a writable path so it skips that step
      # (the launcher then passes it through as -Djava.io.tmpdir).
      export OPENSEARCH_TMPDIR="${OPENSEARCH_TMPDIR:-$DATA/tmp}"
      mkdir -p "$OPENSEARCH_TMPDIR"

      # seed the config dir from the distribution once (jvm.options, log4j2.properties,
      # security/jvm config files OpenSearch needs alongside opensearch.yml)
      if [ ! -f "$CONF/jvm.options" ]; then
        cp -r "$OS_HOME"/config/. "$CONF"/
      fi
      # jvm.options ships relative log/heap paths resolved from the (read-only) CWD;
      # repoint them at the writable dirs so the JVM can create them.
      sed -i \
        -e "s#file=logs/gc.log#file=${LOGS}/gc.log#" \
        -e "s#-XX:ErrorFile=logs/#-XX:ErrorFile=${LOGS}/#" \
        -e "s#-XX:HeapDumpPath=data#-XX:HeapDumpPath=${DATA}#" \
        -e "s#-javaagent:agent/#-javaagent:${OS_HOME}/agent/#" \
        "$CONF/jvm.options"

      # generate opensearch.yml from env (single-node, security off by default for an
      # internal deployment; the NetworkPolicy is the boundary)
      {
        echo "cluster.name: ${OPENSEARCH_CLUSTER_NAME:-quench-opensearch}"
        echo "node.name: ${OPENSEARCH_NODE_NAME:-${HOSTNAME:-node-1}}"
        echo "network.host: 0.0.0.0"
        echo "http.port: ${OPENSEARCH_HTTP_PORT:-9200}"
        echo "transport.port: ${OPENSEARCH_TRANSPORT_PORT:-9300}"
        echo "discovery.type: ${OPENSEARCH_DISCOVERY_TYPE:-single-node}"
        echo "path.data: $DATA"
        echo "path.logs: $LOGS"
        # NOTE: the opensearch-security plugin is NOT bundled in this hardened image
        # (its opensaml uber-jar shades a vulnerable jackson we cannot patch), so we must
        # NOT emit plugins.security.* settings -- OpenSearch rejects unknown settings at
        # boot when the owning plugin is absent. Security is therefore off by construction.
        if [ -n "${OPENSEARCH_CONFIG_EXTRA:-}" ]; then printf '%s\n' "${OPENSEARCH_CONFIG_EXTRA}"; fi
      } > "$CONF/opensearch.yml"

      export OPENSEARCH_JAVA_HOME=/usr/lib/jvm/java-21-openjdk
      export OPENSEARCH_PATH_CONF="$CONF"
      exec "$OS_HOME/bin/opensearch"
      EOS
      chmod 0755 "${{targets.destdir}}/usr/bin/docker-entrypoint.sh"

test:
  pipeline:
    - runs: |
        test -x /opt/opensearch/bin/opensearch
