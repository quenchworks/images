# Packages OpenSearch onto Wolfi. OpenSearch is a JVM app: we ship the upstream
# distribution's jars but drop its bundled JDK and run on the hardened openjdk-21-jre
# base the Kafka build established, so the JRE stays the CVE surface the Trivy gate
# scans (a bundled JDK would escape attribution).
package:
  name: quench-opensearch
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened OpenSearch, packaged on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - openjdk-21-jre     # the JRE OpenSearch runs on (the scanned CVE surface)
      - bash               # the opensearch bin/*.sh launchers are bash
      - busybox

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - curl
      - ca-certificates-bundle
      - python-3   # build-time only: patch one calcite class (see calcite step below)

pipeline:
  # OpenSearch ships arch-specific distributions (they bundle native x86_64/arm64
  # libs), so fetch the tarball matching the build arch — not a fixed one, or the
  # arm64 package ends up with x86_64 binaries (unsatisfiable so:ld-linux deps).
  - runs: |
      case "$(uname -m)" in
        x86_64)  osarch=x64;   sha=__SHA_AMD__ ;;
        aarch64) osarch=arm64; sha=__SHA_ARM__ ;;
        *) echo "unsupported arch $(uname -m)" >&2; exit 1 ;;
      esac
      url="https://artifacts.opensearch.org/releases/bundle/opensearch/${{package.version}}/opensearch-${{package.version}}-linux-${osarch}.tar.gz"
      curl -fsSL -o os.tar.gz "$url"
      echo "${sha}  os.tar.gz" | sha512sum -c -
      mkdir -p src && tar -xzf os.tar.gz -C src --strip-components 1
      cd src
      dest="${{targets.destdir}}/opt/opensearch"
      install -d "$dest"
      # ship bin, lib, modules, plugins, jdk-independent config; drop the bundled JDK
      # (we run on openjdk-21-jre) and the Windows launchers.
      cp -r bin config lib modules plugins agent LICENSE.txt NOTICE.txt "$dest/"
      rm -rf "$dest/jdk"
      find "$dest/bin" -name '*.bat' -delete

      # --- 0-CVE remediation (all findings are the Jul-2026 jackson-databind cluster
      # CVE-2026-54512..54518, plus netty CVEs) --------------------------------------
      # (1) DROP two OPTIONAL plugins whose vulnerable jackson/netty is SHADED inside a
      #     vendor uber-jar we cannot patch:
      #       * opensearch-security       -> opensaml-3.7.0.0-all.jar shades jackson-databind
      #       * opensearch-security-analytics -> security-analytics-commons shades netty
      #     Core OpenSearch (index/search/cluster) runs without either; security is off by
      #     construction (see the entrypoint note). Trade-off documented in build.conf.
      rm -rf "$dest/plugins/opensearch-security" \
             "$dest/plugins/opensearch-security-analytics"
      # (2) The remaining vulnerable jackson-databind copies are STANDALONE plugin/module
      #     jars -> same-minor drop-in swap (2.21.3 -> 2.21.5 for the com.fasterxml line;
      #     3.1.3 -> 3.1.4 for the tools.jackson 3.x line; 2.21.5 needed for CVE-2026-54515).
      #     Sha256-pinned Maven Central. Replace content in place (keep filename); the
      #     OpenSearch plugin classloader scans the dir and Trivy reads the jar's internal
      #     pom.properties (= the fixed version).
      MC="https://repo1.maven.org/maven2"
      jd2=$(mktemp); jd3=$(mktemp)
      curl -fsSL -o "$jd2" "$MC/com/fasterxml/jackson/core/jackson-databind/2.21.5/jackson-databind-2.21.5.jar"
      echo "507418c0fafd38b2b2cfb704521630da613a8e4cc8381195a6f418017883e2c0  $jd2" | sha256sum -c -
      curl -fsSL -o "$jd3" "$MC/tools/jackson/core/jackson-databind/3.1.4/jackson-databind-3.1.4.jar"
      echo "14034bfdf392b6ebec1b4bb6c1de29d604f0aa97251259a19d5f19af8719bb20  $jd3" | sha256sum -c -
      find "$dest" -name 'jackson-databind-2.21.3.jar' -exec cp "$jd2" {} \;
      find "$dest" -name 'jackson-databind-3.1.3.jar'  -exec cp "$jd3" {} \;
      rm -f "$jd2" "$jd3"
      # (3) opensearch-sql/opensearch-skills bundle Apache Calcite 1.41.0, whose
      #     calcite-core carries CVE-2026-46718 (unsafe reflection, MEDIUM). The fix is
      #     calcite-core 1.42.0 -- BUT 1.42's CALCITE-7351 made RelDataTypeSystemImpl's
      #     getMaxNumericScale()/getMaxNumericPrecision() FINAL, and OpenSearch's
      #     OpenSearchTypeSystem (core-3.7.0.0.jar) OVERRIDES both -> boot dies with
      #     java.lang.IncompatibleClassChangeError. Removing `final` is binary-compatible
      #     (JLS 13.4.17) and is unrelated to the unsafe-reflection fix, so we swap in
      #     calcite-core 1.42.0 and clear the ACC_FINAL bit on just those two methods.
      #     calcite-babel/linq4j must move to 1.42.0 as a set too: core 1.42 references
      #     linq4j 1.42 classes (e.g. NullablePredicate2) absent in 1.41 -> node dies at
      #     boot with ClassNotFoundException otherwise. Only calcite-core is CVE-flagged;
      #     babel/linq4j 1.42 are clean drop-ins. Boot + SQL verified.
      cal=$(mktemp -d)
      for a in calcite-core calcite-babel calcite-linq4j; do
        curl -fsSL -o "$cal/$a-1.42.0.jar" "$MC/org/apache/calcite/$a/1.42.0/$a-1.42.0.jar"
      done
      ( cd "$cal" && sha256sum -c - <<'SUMS'
      2ed5489201baab842001c95f939a0829849cf3cdaed9cdbf4b9078633c35792b  calcite-core-1.42.0.jar
      8811dff2ddc33d2692f0e55d4ddbdc2cf3067312f0a5f3194573f15e9d463939  calcite-babel-1.42.0.jar
      6f54fa9f24a07ad961e0e1af499a58cfc2374a93ee280283beafe9035de3fa45  calcite-linq4j-1.42.0.jar
      SUMS
      )
      cc="$cal/calcite-core-1.42.0.jar"
      python3 - "$cc" <<'PY'
      import sys, zipfile, struct
      CLASS="org/apache/calcite/rel/type/RelDataTypeSystemImpl.class"
      METHODS={b"getMaxNumericScale", b"getMaxNumericPrecision"}; ACC_FINAL=0x0010
      FIXED={7:2,9:4,10:4,11:4,8:2,3:4,4:4,5:8,6:8,12:4,15:3,16:2,17:4,18:4,19:2,20:2}
      def pool(b,off):
          count=struct.unpack_from(">H",b,off)[0]; off+=2; utf8={}; i=1
          while i<count:
              tag=b[off]; off+=1
              if tag==1:
                  ln=struct.unpack_from(">H",b,off)[0]; off+=2; utf8[i]=bytes(b[off:off+ln]); off+=ln
              else: off+=FIXED[tag]
              i+=2 if tag in (5,6) else 1
          return utf8,off
      jar=sys.argv[1]; zin=zipfile.ZipFile(jar,"r")
      data={n:zin.read(n) for n in zin.namelist()}; infos=zin.infolist(); zin.close()
      b=bytearray(data[CLASS]); utf8,off=pool(b,8); off+=6
      off+=2+struct.unpack_from(">H",b,off)[0]*2   # skip interfaces
      def members():
          global off
          n=struct.unpack_from(">H",b,off)[0]; off+=2; starts=[]
          for _ in range(n):
              starts.append(off); off+=6
              ac=struct.unpack_from(">H",b,off)[0]; off+=2
              for _ in range(ac):
                  off+=2; al=struct.unpack_from(">I",b,off)[0]; off+=4+al
          return starts
      members(); ms=members(); ch=0
      for s in ms:
          fl,ni=struct.unpack_from(">HH",b,s)
          if utf8.get(ni) in METHODS and (fl & ACC_FINAL):
              struct.pack_into(">H",b,s,fl & ~ACC_FINAL); ch+=1
      assert ch==2, f"expected 2 final methods, cleared {ch}"
      data[CLASS]=bytes(b); zo=zipfile.ZipFile(jar,"w",zipfile.ZIP_DEFLATED)
      for zi in infos: zo.writestr(zi,data[zi.filename])
      zo.close(); print(f"calcite-core: cleared ACC_FINAL on {ch} methods")
      PY
      for pdir in opensearch-sql opensearch-skills; do
        rm -f "$dest/plugins/$pdir"/calcite-*-1.41.0.jar
        cp "$cal"/calcite-*-1.42.0.jar "$dest/plugins/$pdir/"
      done
      rm -rf "$cal"
      # OpenSearch ships config/ with restrictive perms; the nonroot runtime user must
      # be able to read them to seed the writable conf dir (and execute the launchers).
      chmod -R a+rX "$dest"
      # bake a config-from-env entrypoint. The read-only rootfs means the config,
      # data, and logs live under writable mounts; OPENSEARCH_* env override defaults.
      install -d "${{targets.destdir}}/usr/bin"
      cat > "${{targets.destdir}}/usr/bin/docker-entrypoint.sh" <<'EOS'
      #!/bin/bash
      set -euo pipefail

      OS_HOME=/opt/opensearch
      CONF="${OPENSEARCH_PATH_CONF:-/conf}"
      DATA="${OPENSEARCH_PATH_DATA:-/data}"
      LOGS="${OPENSEARCH_PATH_LOGS:-/var/log/opensearch}"
      mkdir -p "$CONF" "$DATA" "$LOGS"

      # The rootfs is read-only, so /tmp is not writable. OpenSearch's bin/opensearch
      # launcher otherwise calls TempDirectory to mkdir under java.io.tmpdir (=/tmp)
      # and dies. Pre-set OPENSEARCH_TMPDIR to a writable path so it skips that step
      # (the launcher then passes it through as -Djava.io.tmpdir).
      export OPENSEARCH_TMPDIR="${OPENSEARCH_TMPDIR:-$DATA/tmp}"
      mkdir -p "$OPENSEARCH_TMPDIR"

      # seed the config dir from the distribution once (jvm.options, log4j2.properties,
      # security/jvm config files OpenSearch needs alongside opensearch.yml)
      if [ ! -f "$CONF/jvm.options" ]; then
        cp -r "$OS_HOME"/config/. "$CONF"/
      fi
      # jvm.options ships relative log/heap paths resolved from the (read-only) CWD;
      # repoint them at the writable dirs so the JVM can create them.
      sed -i \
        -e "s#file=logs/gc.log#file=${LOGS}/gc.log#" \
        -e "s#-XX:ErrorFile=logs/#-XX:ErrorFile=${LOGS}/#" \
        -e "s#-XX:HeapDumpPath=data#-XX:HeapDumpPath=${DATA}#" \
        -e "s#-javaagent:agent/#-javaagent:${OS_HOME}/agent/#" \
        "$CONF/jvm.options"

      # generate opensearch.yml from env (single-node, security off by default for an
      # internal deployment; the NetworkPolicy is the boundary)
      {
        echo "cluster.name: ${OPENSEARCH_CLUSTER_NAME:-quench-opensearch}"
        echo "node.name: ${OPENSEARCH_NODE_NAME:-${HOSTNAME:-node-1}}"
        echo "network.host: 0.0.0.0"
        echo "http.port: ${OPENSEARCH_HTTP_PORT:-9200}"
        echo "transport.port: ${OPENSEARCH_TRANSPORT_PORT:-9300}"
        echo "discovery.type: ${OPENSEARCH_DISCOVERY_TYPE:-single-node}"
        echo "path.data: $DATA"
        echo "path.logs: $LOGS"
        # NOTE: the opensearch-security plugin is NOT bundled in this hardened image
        # (its opensaml uber-jar shades a vulnerable jackson we cannot patch), so we must
        # NOT emit plugins.security.* settings -- OpenSearch rejects unknown settings at
        # boot when the owning plugin is absent. Security is therefore off by construction.
        if [ -n "${OPENSEARCH_CONFIG_EXTRA:-}" ]; then printf '%s\n' "${OPENSEARCH_CONFIG_EXTRA}"; fi
      } > "$CONF/opensearch.yml"

      export OPENSEARCH_JAVA_HOME=/usr/lib/jvm/java-21-openjdk
      export OPENSEARCH_PATH_CONF="$CONF"
      exec "$OS_HOME/bin/opensearch"
      EOS
      chmod 0755 "${{targets.destdir}}/usr/bin/docker-entrypoint.sh"

test:
  pipeline:
    - runs: |
        test -x /opt/opensearch/bin/opensearch
