# STATUS 2026-08-27: UNBLOCKED (0-CVE). The relocated pair IS fixed -- by doing upstream's
# relocation ourselves, not by waiting for upstream and not by editing metadata.
#
# What was actually blocking: nothing flag-level. This app was never BLOCKED=1; the note
# below simply went stale and the PUBLISHED image was never rebuilt after block (2c)
# landed, so tonight's scan of the published 3.8.0 showed 45 findings -- the 2 relocated
# jar findings plus ordinary apk drift (libcrypto3 3.6.3-r3, busybox 1.37.0-r61). A plain
# rebuild picks up libcrypto3 3.6.4-r0 / busybox 1.38.0-r1 and the OS layer scans 0, so
# 43 of the 45 were pure staleness. A rebuild of the recipe AS IT STOOD reported exactly
# 2 -- confirming the 101 -> 2 claim below, and no more than that.
#
# The remaining 2 (httpclient5 5.6.1 / httpcore5 5.4 inside
# plugins/opensearch-notifications-core/opensearch-notifications-core-spi-*.jar) were
# RELOCATED by upstream's Gradle shadow step to
#   org/opensearch/notifications/core/repackage/org/apache/hc/...
# so there is no jar to swap, and 3.8.0 is still the newest OpenSearch release
# (2026-08-05) -- upstream has shipped no fix to wait for. Fixed in melange block (2d) by
# relocating httpcore5 5.4.3 / httpclient5 5.6.3 into the shaded prefix ourselves, which
# is the same transform shadow performs: a constant-pool UTF8 rewrite (a class file has no
# absolute offsets, so the pool can grow and everything after it copies verbatim).
#
# Why this is NOT the overlay that was rejected on 2026-08-26. That attempt copied VANILLA
# 5.6.3 classes to the relocated path, where each one still declared its original package
# (name and path disagree -> the plugin dies at load), and then edited only the bundled
# pom.properties, which silenced Trivy while the running code stayed 5.6.1. This one:
#   * rewrites the bytecode, so all 3107 class files in the rewritten jar declare exactly
#     the name their path implies (asserted; 0 mismatches -- the overlay's failure mode);
#   * was VALIDATED against upstream's own output: run over 5.4 + 5.6.1 the transform
#     reproduces, for all 1272 shaded entries, exactly the UTF8 constant set shadow
#     produced -- 0 names present in shadow's output and missing from ours. jdeps over the
#     rewritten jar reports an unresolved-reference profile IDENTICAL to the shipped jar's;
#   * carries the fixed releases' own version.properties, so the RUNTIME-visible version
#     (VersionInfo reads it through the relocated package name) says 5.4.3 / 5.6.3, not
#     just the scanner-visible pom.properties -- both asserted on the written artifact;
#   * moves real code: every class upstream changed in 5.4 -> 5.4.3 (33, incl. Http1Config
#     and the conn-pool classes) and 5.6.1 -> 5.6.3 (16, incl. ContentCompressionExec /
#     DecompressingEntity / InternalHttpClient) differs from the shipped copy. 5.4 -> 5.4.3
#     and 5.6.1 -> 5.6.3 are additive at the entry level (3 classes added, none removed),
#     asserted rather than assumed, so nothing links against a class that vanished.
# Guarded pulsar-style: already-fixed -> skip, pristine -> patch, anything else -> fail.
#
# Gate (local, ARCHES=x86_64, comprehensive, CHML, --ignore-unfixed): "✅ 0 fixable CVEs",
# no findings table at all; the spi jar row reads 0. Boot test passes: health, index/get,
# _plugins/_sql SELECT, remote reindex, nonroot 1001, plus a new webhook assertion.
#
# test.sh had TWO latent bugs found while gating this, both of which made the
# httpclient5 assertion fail 400 before any HTTP client was reached: OpenSearch 3.x
# renamed the setting to reindex.remote.ALLOWlist, and node settings are not read from -D
# JVM properties at all (the old form also clobbered the image's -Xms/-Xmx). Now passed
# via OPENSEARCH_CONFIG_EXTRA. A webhook-notification assertion was added on top: it is
# the only path that drives the SHADED client, and it requires the sink's own HTTP reason
# phrase to travel back -- a broken relocation yields NoClassDefFoundError instead, so
# the check cannot pass on a quiet scanner alone.
#
# NOT verified: aarch64 (the local gate ran x86_64 only, per the re-test brief).
# STATUS 2026-07-15: UNBLOCKED (0-CVE) -- calcite CVE-2026-46718 cleared via a
# targeted, binary-compatible jar patch. Gate passes AND the image boots clean:
# cluster health GREEN, index+get roundtrip, and a `_plugins/_sql` query
# (SELECT ... FROM ...) returns 200 -- i.e. the calcite planner path that would
# crash is exercised and works.
#
# The problem (was BLOCKED): opensearch-sql/opensearch-skills bundle Apache Calcite
# 1.41.0, whose calcite-core carries CVE-2026-46718 (unsafe reflection, MEDIUM).
# The fix is calcite-core 1.42.0, but 1.42's CALCITE-7351 makes
# RelDataTypeSystemImpl.getMaxNumericScale()/getMaxNumericPrecision() FINAL, and
# OpenSearch's OpenSearchTypeSystem (core-3.7.0.0.jar) OVERRIDES both ->
# java.lang.IncompatibleClassChangeError, fatal at boot.
#
# The fix (see melange.yaml step 3):
#   * Swap the whole calcite trio (core/babel/linq4j) to 1.42.0. core 1.42
#     references linq4j 1.42 classes (e.g. NullablePredicate2) absent in 1.41, so
#     a core-only swap dies at boot with ClassNotFoundException -- the set must
#     move together. Only calcite-core is CVE-flagged; babel/linq4j 1.42 are clean.
#   * Clear the ACC_FINAL bit on RelDataTypeSystemImpl.getMaxNumericScale/
#     getMaxNumericPrecision in calcite-core-1.42.0.jar (one stdlib-python class-file
#     edit; flips two access-flag bits, touches no code). Removing `final` is
#     binary-compatible per JLS 13.4.17 and is unrelated to the unsafe-reflection CVE
#     fix, so the CVE stays fixed (Trivy reads the jar as 1.42.0 = not affected) while
#     OpenSearchTypeSystem's override links again.
# NOT a VEX/false-positive suppression and NOT a gate weakening: the vulnerable
# calcite-core 1.41.0 is physically replaced by fixed 1.42.0 bytecode.
# UNBLOCKED 2026-08-10 (was RE-BLOCKED 2026-07-23 on a single HIGH). The blocker was
# CVE-2026-10050 (jetty-security 9.4.58, Digest-auth ISO-8859-1) SHADED inside
# opensearch-skills' spark-core_2.13-3.5.8.jar -- no standalone jar to swap. The recorded
# unblock condition was "opensearch-skills ships a spark whose shaded jetty >= 9.4.63".
# Verified against the 3.8.0 dist (not assumed): it bundles the SAME spark 3.5.8 with
# jetty-security 9.4.58.v20250814, so that condition is STILL unmet.
#
# Resolved instead by DROPPING opensearch-skills, which is the same trade-off this recipe
# already makes for opensearch-security and -security-analytics: an optional plugin whose
# vulnerability is unreachable inside a vendor uber-jar. Skills is agent/SQL tooling, not
# core index/search, and it drags in all of Apache Spark. The honest comparison was not
# "with skills vs without" but "no opensearch image at all vs one without an optional
# plugin" -- 3.8.0 was unpublished and 3.7.0's published image now carries this same HIGH.
# RE-ADD the plugin as soon as opensearch-skills ships a spark with shaded jetty >= 9.4.63.
#
# Also fixed on the way through:
