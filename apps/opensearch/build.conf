# STATUS 2026-07-15: UNBLOCKED (0-CVE) -- calcite CVE-2026-46718 cleared via a
# targeted, binary-compatible jar patch. Gate passes AND the image boots clean:
# cluster health GREEN, index+get roundtrip, and a `_plugins/_sql` query
# (SELECT ... FROM ...) returns 200 -- i.e. the calcite planner path that would
# crash is exercised and works.
#
# The problem (was BLOCKED): opensearch-sql/opensearch-skills bundle Apache Calcite
# 1.41.0, whose calcite-core carries CVE-2026-46718 (unsafe reflection, MEDIUM).
# The fix is calcite-core 1.42.0, but 1.42's CALCITE-7351 makes
# RelDataTypeSystemImpl.getMaxNumericScale()/getMaxNumericPrecision() FINAL, and
# OpenSearch's OpenSearchTypeSystem (core-3.7.0.0.jar) OVERRIDES both ->
# java.lang.IncompatibleClassChangeError, fatal at boot.
#
# The fix (see melange.yaml step 3):
#   * Swap the whole calcite trio (core/babel/linq4j) to 1.42.0. core 1.42
#     references linq4j 1.42 classes (e.g. NullablePredicate2) absent in 1.41, so
#     a core-only swap dies at boot with ClassNotFoundException -- the set must
#     move together. Only calcite-core is CVE-flagged; babel/linq4j 1.42 are clean.
#   * Clear the ACC_FINAL bit on RelDataTypeSystemImpl.getMaxNumericScale/
#     getMaxNumericPrecision in calcite-core-1.42.0.jar (one stdlib-python class-file
#     edit; flips two access-flag bits, touches no code). Removing `final` is
#     binary-compatible per JLS 13.4.17 and is unrelated to the unsafe-reflection CVE
#     fix, so the CVE stays fixed (Trivy reads the jar as 1.42.0 = not affected) while
#     OpenSearchTypeSystem's override links again.
# NOT a VEX/false-positive suppression and NOT a gate weakening: the vulnerable
# calcite-core 1.41.0 is physically replaced by fixed 1.42.0 bytecode.
BLOCKED=0
# STATUS: SHIPPED (0-CVE) -- UNBLOCKED 2026-07-09. Gate passes and the image boots
# clean (cluster health green, index+get roundtrip, nonroot 1001). Every finding was
# the Jul-2026 jackson-databind cluster (CVE-2026-54512..54518) plus netty CVEs in one
# plugin. Two complementary techniques cleared them (see melange.yaml):
#
#  (a) DROP two OPTIONAL plugins carrying vulns SHADED inside vendor uber-jars we cannot
#      patch:
#        * opensearch-security          -> opensaml-3.7.0.0-all.jar shades jackson-databind
#        * opensearch-security-analytics -> security-analytics-commons shades netty-codec*
#      Core OpenSearch (index/search/cluster/ingest) runs fine without either.
#
#  (b) STANDALONE jackson-databind copies in the REMAINING plugins/modules (ingest-geoip,
#      alerting, anomaly-detection, ml, neural-search, flow-framework, notifications*,
#      observability, performance-analyzer, reports-scheduler, search-relevance, sql, ubi)
#      are same-minor drop-ins: 2.21.3 -> 2.21.5 (com.fasterxml line; 2.21.5 needed for
#      CVE-2026-54515) and 3.1.3 -> 3.1.4 (tools.jackson 3.x line). Sha256-pinned Maven
#      Central, content replaced in place; Trivy reads each jar's internal pom.properties.
#
# TRADE-OFFS (documented for the catalog/chart):
#   * NO opensearch-security plugin -> no in-cluster authn/authz/TLS-on-transport, no
#     RBAC/audit. Security is OFF by construction; the entrypoint no longer emits any
#     plugins.security.* setting (OpenSearch rejects unknown settings when the owning
#     plugin is absent). Deploy behind a NetworkPolicy / mesh boundary (matches the
#     existing "security disabled by default for internal deployment" posture).
#   * NO opensearch-security-analytics plugin (SIEM detectors/correlation). Optional.
#   All other bundled plugins (alerting, ml, anomaly-detection, sql, k-NN/neural-search,
#   observability, notifications, geospatial, etc.) remain, on patched jackson.
#   Re-verify the jackson swap + revisit dropping security once OpenSearch ships a release
#   whose opensaml-all bundles jackson-databind >= 2.21.5 / 3.1.4.
#
# opensearch: from official per-arch distribution tarballs (x64/arm64; they
# bundle native libs) on the hardened openjdk-21-jre. Newest stable release only.
# Per-version, per-arch sha512 (SHA_AMD/SHA_ARM, from the artifacts.opensearch.org
# .tar.gz.sha512 sidecars).
