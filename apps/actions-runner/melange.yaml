# Packages GitHub's self-hosted Actions runner from its official per-arch release
# tarball onto Wolfi, under /home/runner like GitHub's own image. Output is a signed
# APK in QuenchWorks' own repo.
#
# JavaScript actions run on Wolfi's nodejs-24, not the bundled Node:
#   * externals/node24/bin/node is a symlink to Wolfi's /usr/bin/node, so the
#     scanner sees the Node that actually runs and it floats with Wolfi fixes.
#   * The bundled npm copies (the scanner's findings: tar, undici, sigstore,
#     ip-address...) are removed: the runner executes actions with `node`, never npm.
#   * Node 20 is end of life (2026-04-30). This runner already runs node20 actions
#     on Node 24 by default; externals/node20 points at node24, so even the
#     ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION opt-out runs a patched Node.
#   * The *_alpine externals (musl builds for Alpine job containers) are removed.
package:
  name: quench-actions-runner
  version: __VER__
  epoch: 0
  description: "Quenchworks GitHub Actions runner, on Wolfi's nodejs-24"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - nodejs-24
      - bash            # run.sh, config.sh and the runner's own scripts are bash
      - busybox
      - ca-certificates-bundle
      - git
      - curl
      - gnutar          # actions (checkout, cache, upload-artifact) shell out to GNU tar
      - gzip
      - icu-libs        # .NET globalization
      - krb5-libs       # .NET System.Net.Security (libgssapi)
      - openssl
      - zlib

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - curl

pipeline:
  - runs: |
      set -eu
      VER="${{package.version}}"
      case "$(uname -m)" in
        x86_64)  rarch=x64;   sha=__SHA_AMD__ ;;
        aarch64) rarch=arm64; sha=__SHA_ARM__ ;;
        *) echo "unsupported arch $(uname -m)" >&2; exit 1 ;;
      esac
      curl -fsSL -o runner.tar.gz "https://github.com/actions/runner/releases/download/v${VER}/actions-runner-linux-${rarch}-${VER}.tar.gz"
      echo "$sha  runner.tar.gz" | sha256sum -c -
      R="${{targets.destdir}}/home/runner"
      install -d "$R"
      tar xzf runner.tar.gz -C "$R"

      # .NET 8.0.34 swap (2026-11-12). 2.338.2 is self-contained on runtime 8.0.33
      # (CVE-2026-109475) and ships Microsoft.AspNetCore.WebUtilities and
      # Microsoft.Net.Http.Headers 8.0.25 (CVE-2026-114149); upstream main still pins SDK
      # 8.0.427. Every bundled file identical to the 8.0.33 runtime pack is replaced by its 8.0.34 copy, the two
      # assemblies come from their 8.0.34 packages, and deps.json/runtimeconfig.json are
      # rewritten so the version they declare is the one on disk. Package sha256s are of
      # downloads that matched NuGet's catalog SHA512. Remove this block when a runner
      # release bundles 8.0.34 or later: the guard below fails the build that day.
      B="$R/bin"
      grep -q '"version": "8.0.33"' "$B/Runner.Listener.runtimeconfig.json" \
        || { echo "runner no longer bundles .NET 8.0.33: drop the 8.0.34 swap" >&2; exit 1; }
      case "$rarch" in
        x64)   oldsha=db16bf4ff6a1d90dd1394b39dbf97238de8b1016301f6cb574911324f3851740
               rtsha=81824147c1108dadc4f848a297c495119c5142ab7143f436ae8ed8e0092227d5 ;;
        arm64) oldsha=e6038805070785516c6509ec43a2e24294f9750d0f5f5db1022da1645992c867
               rtsha=d8de897d83f340375fd28c8ad2420562e3d0a0086727f48fdafc06ce7a44756d ;;
      esac
      rid="linux-$rarch"
      N="$(mktemp -d)"
      nuget() { curl -fsSL -o "$N/$1.nupkg" "https://api.nuget.org/v3-flatcontainer/$2/$4/$2.$4.nupkg"; echo "$3  $N/$1.nupkg" | sha256sum -c -; mkdir "$N/$1"; unzip -q "$N/$1.nupkg" -d "$N/$1"; }
      nuget old "microsoft.netcore.app.runtime.$rid" "$oldsha" 8.0.33
      nuget rt "microsoft.netcore.app.runtime.$rid" "$rtsha" 8.0.34
      nuget wu microsoft.aspnetcore.webutilities 22c33cd4bef2815c086323eaa499068494fe5323859c64f43196fa22df0e1453 8.0.34
      nuget hh microsoft.net.http.headers 8640306430990c01b6647c09cd117f60e3d0a50c54eae08a334eb1682a20def1 8.0.34
      # Only files byte-identical to the 8.0.33 pack are runtime files: the runner also ships
      # newer package copies of a few runtime assemblies (System.Text.Json and
      # System.Diagnostics.DiagnosticSource 10.x), and replacing those with 8.0 breaks startup.
      n=0
      for f in "$N/old/runtimes/$rid/lib/net8.0/"* "$N/old/runtimes/$rid/native/"*; do
        b="${f##*/}"; d="${f#"$N/old/"}"
        [ -e "$B/$b" ] && cmp -s "$f" "$B/$b" || continue
        [ -e "$N/rt/$d" ] || { echo "8.0.34 pack lacks $d" >&2; exit 1; }
        cp -f "$N/rt/$d" "$B/$b"; n=$((n+1))
      done
      echo "runtime files replaced: $n"
      [ "$n" -ge 150 ] || { echo "too few runtime files replaced ($n)" >&2; exit 1; }
      cp -f "$N/wu/lib/net8.0/Microsoft.AspNetCore.WebUtilities.dll" "$N/hh/lib/net8.0/Microsoft.Net.Http.Headers.dll" "$B/"
      sed -i -e "s|Microsoft.NETCore.App.Runtime.$rid/8.0.33|Microsoft.NETCore.App.Runtime.$rid/8.0.34|g" \
        -e "s|\"runtimepack.Microsoft.NETCore.App.Runtime.$rid\": \"8.0.33\"|\"runtimepack.Microsoft.NETCore.App.Runtime.$rid\": \"8.0.34\"|g" \
        -e 's#\(AspNetCore\.WebUtilities\|Net\.Http\.Headers\)\(/\|": "\)8\.0\.25#\1\28.0.34#gI' \
        "$B"/*.deps.json
      sed -i 's|"version": "8.0.33"|"version": "8.0.34"|' "$B"/*.runtimeconfig.json
      if grep -lE '/8\.0\.33"|"8\.0\.33"|/8\.0\.25"|"8\.0\.25"' "$B"/*.deps.json "$B"/*.runtimeconfig.json; then
        echo "old .NET versions still declared" >&2; exit 1
      fi
      rm -rf "$N"

      # .NET's LTTng tracing provider links liblttng-ust.so.0, which Wolfi does not
      # ship. The runtime loads it only when LTTng tracing is switched on, and
      # removing it is the documented way to run without LTTng.
      rm -f "$R/bin/libcoreclrtraceptprovider.so"

      # Node: Wolfi's node24 for everything (see the header).
      E="$R/externals"
      test -x "$E/node24/bin/node"
      rm -rf "$E/node20" "$E/node20_alpine" "$E/node24_alpine" "$E/node24"
      install -d "$E/node24/bin"
      ln -s /usr/bin/node "$E/node24/bin/node"
      ln -s node24 "$E/node20"
      # anything else under externals would be an unreviewed bundled runtime
      test "$(ls "$E" | tr '\n' ' ')" = "node20 node24 " || { echo "unexpected externals: $(ls "$E")" >&2; exit 1; }

      # Registration helper for use outside ARC (ARC runs /home/runner/run.sh itself).
      install -d "${{targets.destdir}}/usr/bin"
      cat > "${{targets.destdir}}/usr/bin/runner-entrypoint.sh" <<'EOS'
      #!/bin/bash
      set -euo pipefail
      cd /home/runner
      # Under ARC the scale set passes a just-in-time config; run.sh reads it.
      if [ -n "${ACTIONS_RUNNER_INPUT_JITCONFIG:-}" ] || [ -f .runner ]; then
        exec ./run.sh "$@"
      fi
      : "${RUNNER_URL:?set RUNNER_URL (repo or org URL) and RUNNER_TOKEN, or run under ARC}"
      : "${RUNNER_TOKEN:?set RUNNER_TOKEN, a registration token for RUNNER_URL}"
      args=(--unattended --replace --url "$RUNNER_URL" --token "$RUNNER_TOKEN"
            --name "${RUNNER_NAME:-$(hostname)}" --work "${RUNNER_WORKDIR:-_work}")
      [ -z "${RUNNER_LABELS:-}" ] || args+=(--labels "$RUNNER_LABELS")
      [ -z "${RUNNER_GROUP:-}" ] || args+=(--runnergroup "$RUNNER_GROUP")
      [ "${RUNNER_EPHEMERAL:-true}" != true ] || args+=(--ephemeral)
      ./config.sh "${args[@]}"
      exec ./run.sh "$@"
      EOS
      chmod 0755 "${{targets.destdir}}/usr/bin/runner-entrypoint.sh"
