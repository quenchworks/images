# actions-runner: GitHub's self-hosted Actions runner, from the official release
# tarball (a self-contained .NET app), per arch. FROM_SOURCE=0. Latest only: GitHub
# stops accepting old runner versions after about 30 days. Each sha256 is from a
# download that matched the digest in the release notes.
#
# Laid out like GitHub's own image (/home/runner, uid 1001), so it is a drop-in
# runner image for ARC scale sets, which run /home/runner/run.sh directly.
# STATUS: HELD 2026-10-19. 2.338.0 bundles .NET runtime 8.0.31 (Microsoft.NETCore.App.Runtime
# CVE-2026-58280/66822/69651/70162/96225/96231/96233, fixed 8.0.32) and
# System.Security.Cryptography.Pkcs 10.0.12 (CVE-2026-84008, fixed 10.0.13); CI 39109825789.
# 2.338.0 is still the newest release and runner main still pins SDK 8.0.425 (runtime
# 8.0.31; 8.0.426 is the fix). A swap of the bundled runtime + Pkcs is not provably safe
# untested, so the app waits. Unblock: actions/runner tags a release past 2.338.0 built
# on .NET 8.0.32+ (or 10.0.13+, PR #4757) with Pkcs >= 10.0.13; bump, BLOCKED=0.
# 2026-10-20 re-measured: v2.338.0 is still the newest runner release; hold unchanged.
# 2026-11-01 UNBLOCKED: v2.338.2 bundles .NET runtime 8.0.33 (Runner.Listener.runtimeconfig.json);
# local gate x86_64 cve0=1 boot=1; BLOCKED=0. Tarball shas match the release notes.
BLOCKED=0
FROM_SOURCE=0
VERSIONS=(2.338.2)
declare -A SHA_AMD=(
  [2.338.2]=baebf204307bac6193480852732f0aba2ae97b6c5597c244f4d5558390147c40
)
declare -A SHA_ARM=(
  [2.338.2]=670adb2f268fe21dcbb58b3db0e0aa9d5b3bddfe2c651481336e561ff86de945
)
render() { echo "s/__VER__/$1/g; s|__SHA_AMD__|${SHA_AMD[$1]}|g; s|__SHA_ARM__|${SHA_ARM[$1]}|g"; }
