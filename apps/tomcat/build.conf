# tomcat: Apache Tomcat ships an official prebuilt binary distribution tarball
# (apache-tomcat-X.Y.Z.tar.gz). We run it on a hardened Wolfi JRE, the same JVM
# pattern as apps/kafka -- the JRE + bundled Tomcat jars are the CVE surface the
# Trivy gate scans. FROM_SOURCE=0: no compilation, just fetch + unpack the dist.
# Newest STABLE line only: Tomcat 11.0.x is the current GA line, so VERSIONS
# holds the newest 11.0 patch. Each release pins its dist tarball by sha256.
FROM_SOURCE=0
VERSIONS=(11.0.25)
declare -A SHA256=(
  [11.0.25]=071ae2c6213e3c02c58b8581113b7887a96ef2756439b3c5be36fa6aec350090
)
render() { echo "s/__VER__/$1/g; s/__SHA256__/${SHA256[$1]}/g"; }
