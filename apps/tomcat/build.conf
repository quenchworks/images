# STATUS: UNBLOCKED 2026-09-20. The 2026-09-16 measurement above stands and is
# worth keeping: run 35095254117 gated the real 11.0.26 build on BOTH arches at
# Total 1, the single finding being zlib CVE-2026-85091.
#
# What changed is the advisory, not this recipe. Wolfi shipped the fix as
# zlib 1.3.2.1_rc20260601-r0 and the advisory was amended to name it, so the
# "advisory wants 1.3.3-r0" line this block carried was a snapshot that went
# stale with no signal. A stock wolfi-base scan now reports
# `zlib 1.3.2-r7 -> 1.3.2.1_rc20260601-r0`.
#
# Re-gated locally 2026-09-20 at PUSH=0 on x86_64: 0 fixable CVEs AND the boot
# test passed. aarch64 is left to CI's native runner, which refuses to publish
# on any finding.
#
# The 11.0.25 -> 11.0.26 bump is what got it here: Apache had moved 11.0.25 off
# dlcdn.apache.org to archive.apache.org, so the fetch 404'd and the build never
# reached the gate at all. Nothing in the Tomcat dist itself is flagged.
#
# BLOCKED=1 skips build+merge. Clear it the week Wolfi ships zlib 1.3.3-r0; one
# rebuild should publish with no recipe change.
# tomcat: Apache Tomcat ships an official prebuilt binary distribution tarball
# (apache-tomcat-X.Y.Z.tar.gz). We run it on a hardened Wolfi JRE, the same JVM
# pattern as apps/kafka -- the JRE + bundled Tomcat jars are the CVE surface the
# Trivy gate scans. FROM_SOURCE=0: no compilation, just fetch + unpack the dist.
# Newest STABLE line only: Tomcat 11.0.x is the current GA line, so VERSIONS
# holds the newest 11.0 patch. Each release pins its dist tarball by sha256.
BLOCKED=0
FROM_SOURCE=0
VERSIONS=(11.0.26)
declare -A SHA256=(
  [11.0.26]=6b6ac79c15707d1d2bf54c698b1a19c046c21a56fc8ddf82a0845cc54df68324
)
render() { echo "s/__VER__/$1/g; s/__SHA256__/${SHA256[$1]}/g"; }
