# copyparty from the release sdist in a venv on Wolfi Python, jinja2 and markupsafe from Wolfi.
package:
  name: quench-copyparty
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened copyparty file server, built from source on Wolfi"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - python-3.13
      - py3.13-jinja2
      - py3.13-markupsafe

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - python-3.13
      - py3.13-pip
      - py3.13-jinja2
      - py3.13-markupsafe
      - py3.13-setuptools
      - py3.13-wheel

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/9001/copyparty/releases/download/v${{package.version}}/copyparty-${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - runs: |
      set -eu
      export PIP_NO_CACHE_DIR=1 PIP_DISABLE_PIP_VERSION_CHECK=1 HOME="$(mktemp -d)"
      V="${{targets.destdir}}/opt/copyparty/.venv"
      python3.13 -m venv --system-site-packages "$V"
      "$V/bin/pip" install --no-build-isolation --no-deps .
      "$V/bin/pip" check
      SITE="$V/lib/python3.13/site-packages"
      for m in jinja2 markupsafe; do
        test ! -e "$SITE/$m" || { echo "$m installed into the venv instead of from Wolfi"; exit 1; }
      done
      "$V/bin/python" -c "import jinja2, copyparty.__version__ as v; print('copyparty', v.S_VERSION)" | grep -F "${{package.version}}"
      # pip vendors its own urllib3 and is not needed at run time
      "$V/bin/python" -m pip uninstall -y -q pip
      # the venv was built at the destdir path: point its scripts and config at the installed path
      sed -i "s|${{targets.destdir}}||g" "$V/pyvenv.cfg" "$V"/bin/*
      ! grep -rq "${{targets.destdir}}" "$V/bin" "$V/pyvenv.cfg"
      find "$V" -name __pycache__ -prune -exec rm -rf {} +

test:
  pipeline:
    - runs: /opt/copyparty/.venv/bin/python -c "import copyparty, jinja2"
