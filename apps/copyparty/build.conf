# copyparty (9001/copyparty, MIT): a portable file server with resumable uploads, deduplication, WebDAV,
# media indexing, a markdown editor, per-volume permissions and accounts. Images issue #72.
#
# Python: the release sdist pip-installed into a venv with --system-site-packages, so jinja2 and
# markupsafe (its one runtime dependency) come from Wolfi; built without build isolation on Wolfi's
# setuptools. The bundled web libraries were checked by hand (Trivy cannot read them gzipped):
# marked 4.3.0, Prism 1.30.0, easymde 2.18.0, codemirror 5.65.18, all on fixed versions (2026-11-16).
# Optional extras (Pillow thumbnails, argon2, FTP/SFTP) are not installed. Files under /srv, state
# (salts, sessions, certificates) under XDG_CONFIG_HOME=/var/lib/copyparty. The default command serves
# /srv read-only to everyone; the chart supplies accounts and volumes.
# LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(1.20.26)
declare -A SHA256=(
  [1.20.26]=ac7ea05bde8d431b32cc2ff618f2754e46bd967bf10deaa6654dac9a449a6ff9
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
