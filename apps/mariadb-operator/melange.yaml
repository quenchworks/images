# Builds the mariadb-operator binary from source onto Wolfi, as upstream's
# Dockerfile does: CGO off, ./cmd/controller.
package:
  name: quench-mariadb-operator
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened MariaDB Operator, built from source on Wolfi"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27        # 26.10 needs go 1.27

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/mariadb-operator/mariadb-operator/archive/refs/tags/${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      set -eu
      export CGO_ENABLED=0
      export GOTOOLCHAIN=local
      export GOFLAGS=-mod=mod
      # ---- 0-CVE module float (docs/go-module-float.md) ----------------------
      # FLOOR is a floor, not a pin: only modules below it are raised, and the
      # shipped binary is asserted at or above it after the build. 26.3.0 also
      # carries edwards25519 v1.1.0 (CVE-2026-26958) and cert-manager v1.19.2.
      FLOOR="golang.org/x/net@v0.58.0 golang.org/x/text@v0.41.0 golang.org/x/crypto@v0.56.0 golang.org/x/sys@v0.47.0 golang.org/x/mod@v0.40.0 golang.org/x/oauth2@v0.36.0 google.golang.org/grpc@v1.83.2 filippo.io/edwards25519@v1.1.1 github.com/cert-manager/cert-manager@v1.19.3 go.opentelemetry.io/otel@v1.45.0 go.opentelemetry.io/otel/sdk@v1.45.0 go.opentelemetry.io/otel/trace@v1.45.0 go.opentelemetry.io/otel/metric@v1.45.0"
      MODS="$(echo "$FLOOR" | tr ' ' '\n' | cut -d@ -f1)"
      below_floor() {
        awk -v floor="$FLOOR" -v tag="$1" '
          BEGIN { n = split(floor, f, " ")
                  for (i = 1; i <= n; i++) { split(f[i], kv, "@"); want[kv[1]] = kv[2] } }
          ($1 in want) {
            split(substr($2, 2), g, "."); split(substr(want[$1], 2), w, ".")
            for (i = 1; i <= 3; i++) {
              if ((g[i] + 0) > (w[i] + 0)) next
              if ((g[i] + 0) < (w[i] + 0)) { print $1 "@" want[$1] " (" tag " has " $2 ")"; next }
            }
          }'
      }
      need="$(go list -m -e $MODS | awk 'NF >= 2 && $NF ~ /^v[0-9]/ { print $1, $NF }' | below_floor go.mod | awk '{ print $1 }')"
      if [ -n "$need" ]; then go get $need; fi
      go mod tidy
      rm -rf vendor
      go build -trimpath -ldflags "-s -w" -o "${{targets.destdir}}/usr/bin/mariadb-operator" ./cmd/controller
      bad="$(go version -m "${{targets.destdir}}/usr/bin/mariadb-operator" \
        | awk '$1 == "dep" || $1 == "=>" { print $2, $3 }' | below_floor mariadb-operator)"
      [ -z "$bad" ] || { echo "0-CVE float did not reach the binary:"; echo "$bad"; exit 1; }
      go version -m "${{targets.destdir}}/usr/bin/mariadb-operator" | grep -F "mariadb-operator/v"
      "${{targets.destdir}}/usr/bin/mariadb-operator" --help | grep -q "cert-controller"

test:
  pipeline:
    - runs: |
        mariadb-operator --help
