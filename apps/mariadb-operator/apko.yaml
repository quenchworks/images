# Assembles the MariaDB Operator image: static binary, nonroot uid 1001,
# multi-arch, SBOM by apko. The entrypoint is the binary: the chart runs it
# with no subcommand for the controller, and with webhook, cert-controller,
# init, agent or backup for the other roles.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-mariadb-operator@local

accounts:
  groups:
    - groupname: nonroot
      gid: 1001
  users:
    - username: nonroot
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/bin/mariadb-operator

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-mariadb-operator"
  org.opencontainers.image.licenses: "MIT"
