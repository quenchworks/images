# mariadb-operator: the MariaDB Operator (MIT), which runs MariaDB and Galera
# clusters on Kubernetes from CRDs. Built from source on Wolfi, static Go.
# Image and chart. The same binary is the controller, the webhook, the cert
# controller, and the init/agent/backup containers the operator puts in MariaDB
# pods, so the chart points the operator at this image for those too.
# Upstream tags are CalVer (YY.MM.patch, no "v"). Newest patch of the last 3
# lines.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(26.3.0 26.6.0 26.10.1)
declare -A SHA=(
  [26.3.0]=c1be4383bc854eda8f97bd2720a82c373a45b371c89e9566d87c2c2b074e07de
  [26.6.0]=b38e91e812b11fbf1b5dd487c072d385c021351318f3b9f527fe0d04b397c126
  [26.10.1]=dcb81c802211c3b4c7493ab74b87fc13f1a7315eb6fb8a85785636cd98d485b4
)
render() { echo "s/__VER__/$1/g; s/__SHA256__/${SHA[$1]}/g"; }
