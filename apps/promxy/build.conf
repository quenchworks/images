# Promxy (jacksontj/promxy, MIT): a Prometheus aggregating proxy. One query endpoint over several
# Prometheus servers or HA pairs, merging and de-duplicating results. Built against upstream's
# Prometheus fork (go.mod replace), from source via melange with upstream's tags (netgo,
# builtinassets) and promu-style version flags. LATEST-ONLY: upstream ships one line.
FROM_SOURCE=1
VERSIONS=(0.0.97)
declare -A SHA256=(
  [0.0.97]=e9ea6e07c2e800c3c8781deb4c313e45ad6cbe28013c3d42b0b53358f0b60025
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
