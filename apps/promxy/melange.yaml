# Promxy from the release tag, CGO-free with upstream's build tags and version flags.
package:
  name: quench-promxy
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Promxy Prometheus aggregating proxy, built from source on Wolfi"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27          # go.mod: go 1.25.0; Wolfi go-1.27 for the stdlib fixes

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/jacksontj/promxy/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - runs: |
      set -eu
      export CGO_ENABLED=0 GOTOOLCHAIN=local GOFLAGS=-mod=mod
      # floors, raised only when below (a bare go get downgrades once upstream passes it); the
      # golang.org/x set moves together, as in the other recipes
      FLOOR="golang.org/x/crypto@v0.58.1-0.20261009181718-2f1f834330b2 golang.org/x/net@v0.62.0 golang.org/x/text@v0.43.0 golang.org/x/sys@v0.49.0 github.com/klauspost/compress@v1.18.7 google.golang.org/grpc@v1.83.2 go.opentelemetry.io/otel/sdk@v1.45.0"
      need=""
      for f in $FLOOR; do
        have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${f%@*}")"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        [ "$(printf '%s\n%s\n' "$have" "${f#*@}" | sort -V | head -1)" = "${f#*@}" ] || need="$need $f"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || go get $need
      go mod tidy
      rm -rf vendor
      V=github.com/prometheus/common/version
      go build -trimpath -tags netgo,builtinassets \
        -ldflags "-s -w -X $V.Version=${{package.version}} -X $V.Branch=HEAD -X $V.BuildUser=quenchworks" \
        -o "${{targets.destdir}}/usr/bin/promxy" ./cmd/promxy
      "${{targets.destdir}}/usr/bin/promxy" --version 2>&1 | grep -F "version ${{package.version}}"
      # the docker VEX holds only while no Moby daemon, plugin manager or API server is linked
      if go list -tags netgo,builtinassets -deps ./cmd/promxy | grep -E '^github.com/(docker/docker|moby/moby)/(daemon|plugin|api/server)'; then
        echo "promxy now links Docker daemon code: re-check vex.openvex.json"; exit 1
      fi

  - name: Guard the docker daemon VEX (the daemon package must not link)
    runs: |
      if grep -rlE '(docker/docker|moby/moby)/daemon[./]' "${{targets.destdir}}"; then
        echo "the Moby daemon package is linked: CVE-2026-41567, -42306, -41568 apply, drop the VEX"; exit 1
      fi

test:
  pipeline:
    - runs: |
        promxy --version
