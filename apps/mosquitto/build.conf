# mosquitto (eclipse-mosquitto/mosquitto): from-source via melange (CMake build of
# the official mosquitto.org source tarball). MQTT broker. Ships the last patch of
# the 2.0 line plus the two newest 2.1 patches. Each release pins its tarball by
# sha256. Glibc-linked C; TLS via OpenSSL, websockets via the bundled builtin lib
# (no external libwebsockets), cJSON bundled (WITH_BUNDLED_DEPS). License is the
# Eclipse dual EPL-2.0 / EDL-1.0.
FROM_SOURCE=1
VERSIONS=(2.0.22 2.1.1 2.1.2)
declare -A SHA256=(
  [2.0.22]=2f752589ef7db40260b633fbdb536e9a04b446a315138d64a7ff3c14e2de6b68
  [2.1.1]=d93026a8f8255a32fe146ca77df5e26259b7947745370a3944a68ddb4ec663ff
  [2.1.2]=fd905380691ac65ea5a93779e8214941829e3d6e038d5edff9eac5fd74cbed02
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
