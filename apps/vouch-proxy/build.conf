# Vouch Proxy (vouch/vouch-proxy, MIT): an SSO backend for nginx auth_request. It logs users in
# through OIDC/OAuth (Google, GitHub, Okta, Keycloak, any OIDC issuer), sets a JWT cookie, and
# answers /validate for every request nginx forwards. One static Go binary from source, templates
# and static files embedded. Tags only, no GitHub releases. LATEST-ONLY.
FROM_SOURCE=1
VERSIONS=(0.50.0)
declare -A SHA256=(
  [0.50.0]=87f6bd07b258e19d4982eb417df701659bbbb05fbf4f29d63cf70ba3912210ee
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
