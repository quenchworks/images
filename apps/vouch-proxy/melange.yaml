# Vouch Proxy from the tag, CGO-free, stamped like upstream's do.sh (main.version, main.semver).
package:
  name: quench-vouch-proxy
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Vouch Proxy (SSO for nginx auth_request), built from source on Wolfi"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27          # go.mod: go 1.27.1

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/vouch/vouch-proxy/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - runs: |
      set -eu
      export CGO_ENABLED=0 GOTOOLCHAIN=local GOFLAGS=-mod=mod
      # floors, raised only when below (a bare go get downgrades once upstream passes it); the
      # golang.org/x set moves together (x/crypto at the GO-2026-5932 fix commit)
      FLOOR="golang.org/x/crypto@v0.58.1-0.20261009181718-2f1f834330b2 golang.org/x/net@v0.62.0 golang.org/x/text@v0.43.0 golang.org/x/sys@v0.49.0"
      need=""
      for f in $FLOOR; do
        have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${f%@*}")"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        [ "$(printf '%s\n%s\n' "$have" "${f#*@}" | sort -V | head -1)" = "${f#*@}" ] || need="$need $f"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || go get $need
      go mod tidy
      go build -trimpath -ldflags "-s -w -X main.version=v${{package.version}} -X main.semver=v${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/vouch-proxy" .
      test "$("${{targets.destdir}}/usr/bin/vouch-proxy" -version)" = "v${{package.version}}"

test:
  pipeline:
    - runs: |
        vouch-proxy -version
