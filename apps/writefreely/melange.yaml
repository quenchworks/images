# WriteFreely from the release tag: Go with Wolfi's libsqlite3, the less CSS and the prose editor bundle.
package:
  name: quench-writefreely
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened WriteFreely, built from source on Wolfi"
  copyright:
    - license: AGPL-3.0-only
  dependencies:
    runtime:
      - busybox
      - ca-certificates-bundle
      - sqlite-libs
      - tzdata

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - go-1.26          # go.mod: go 1.26.0
      - make
      - nodejs-24
      - npm
      - sqlite-dev

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/writefreely/writefreely/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - name: Build writefreely
    runs: |
      set -eu
      export CGO_ENABLED=1 GOFLAGS=-mod=mod GOTOOLCHAIN=local
      FLOOR="golang.org/x/crypto@v0.58.1-0.20261009181718-2f1f834330b2 golang.org/x/net@v0.62.0 golang.org/x/sys@v0.49.0 golang.org/x/text@v0.43.0 filippo.io/edwards25519@v1.1.1"
      MODS="$(echo "$FLOOR" | tr ' ' '\n' | cut -d@ -f1)"
      below_floor() {
        awk -v floor="$FLOOR" -v tag="$1" '
          BEGIN { n = split(floor, f, " ")
                  for (i = 1; i <= n; i++) { split(f[i], kv, "@"); want[kv[1]] = kv[2] } }
          ($1 in want) {
            split(substr($2, 2), g, "."); split(substr(want[$1], 2), w, ".")
            for (i = 1; i <= 3; i++) {
              if ((g[i] + 0) > (w[i] + 0)) next
              if ((g[i] + 0) < (w[i] + 0)) { print $1 "@" want[$1] " (" tag " has " $2 ")"; next }
            }
          }'
      }
      need="$(go list -m -e $MODS | awk 'NF >= 2 && $NF ~ /^v[0-9]/ { print $1, $NF }' | below_floor go.mod | awk '{ print $1 }')"
      if [ -n "$need" ]; then go get $need; fi
      go mod tidy
      ( cd cmd/writefreely && go build -trimpath -tags "netgo sqlite libsqlite3" \
          -ldflags "-s -w -X 'github.com/writefreely/writefreely.softwareVer=${{package.version}}'" \
          -o "${{targets.destdir}}/usr/bin/writefreely" . )
      bad="$(go version -m "${{targets.destdir}}/usr/bin/writefreely" | awk '$1 == "dep" || $1 == "=>" { print $2, $3 }' | below_floor writefreely)"
      [ -z "$bad" ] || { echo "float did not reach the binary:"; echo "$bad"; exit 1; }
      readelf -d "${{targets.destdir}}/usr/bin/writefreely" | grep -q 'libsqlite3.so'
      "${{targets.destdir}}/usr/bin/writefreely" --version | grep -F "${{package.version}}"

  - name: CSS and the prose editor bundle
    runs: |
      set -eu
      export HOME="$(mktemp -d)" npm_config_cache="$(mktemp -d)"
      tools="$(mktemp -d)"
      ( cd "$tools" && npm init -y >/dev/null && npm install --no-fund --no-audit less@4 less-plugin-clean-css )
      ( cd less && PATH="$tools/node_modules/.bin:$PATH" make all )
      test -s static/css/write.css
      # prosemirror-markdown is a git+ssh dependency: fetch it over https
      git config --global url."https://github.com/".insteadOf ssh://git@github.com/
      ( cd prose && npm ci --no-fund --no-audit --allow-git=all && NODE_OPTIONS=--openssl-legacy-provider ./node_modules/.bin/webpack --mode production )
      test -s static/js/prose.bundle.js
      d="${{targets.destdir}}/usr/share/writefreely"
      install -d "$d"
      cp -a pages static templates "$d/"

  - name: Default config and start script
    runs: |
      set -eu
      install -d "${{targets.destdir}}/etc/writefreely" "${{targets.destdir}}/usr/libexec"
      cat > "${{targets.destdir}}/etc/writefreely/config.ini" <<'INI'
      [server]
      port                 = 8080
      bind                 = 0.0.0.0
      templates_parent_dir = /usr/share/writefreely
      static_parent_dir    = /usr/share/writefreely
      pages_parent_dir     = /usr/share/writefreely
      keys_parent_dir      = /data

      [database]
      type     = sqlite3
      filename = /data/writefreely.db

      [app]
      site_name         = WriteFreely
      host              = http://localhost:8080
      single_user       = false
      open_registration = false
      min_username_len  = 3
      max_blogs         = 1
      federation        = true
      public_stats      = true
      update_checks     = false
      INI
      cat > "${{targets.destdir}}/usr/libexec/writefreely-start" <<'SH'
      #!/bin/sh
      # with arguments: run writefreely with them (writefreely --version, user create ...); without: initialise
      # the database and keys on first start (under /data), apply migrations, then serve
      set -eu
      [ $# -eq 0 ] || exec /usr/bin/writefreely "$@"
      c="${WF_CONFIG:-/etc/writefreely/config.ini}"
      wf() { /usr/bin/writefreely -c "$c" "$@"; }
      [ -s /data/writefreely.db ] || wf db init
      [ -s /data/keys/email.aes256 ] || wf keys generate
      wf db migrate
      exec /usr/bin/writefreely -c "$c" serve
      SH
      chmod 0755 "${{targets.destdir}}/usr/libexec/writefreely-start"

test:
  pipeline:
    - runs: writefreely --version
