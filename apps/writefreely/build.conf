# writefreely: WriteFreely (writefreely/writefreely, AGPL-3.0), a minimalist publishing platform: blogs with
# ActivityPub federation, Markdown and collections, on SQLite or MySQL. Images issue #61.
#
# Upstream's build (netgo + sqlite tags, -X softwareVer) plus libsqlite3, so SQLite is Wolfi's sqlite-libs (a
# scanned apk) instead of mattn's bundled copy. Floors: house golang.org/x set, edwards25519 1.1.1. The CSS is
# compiled with lessc and the prose editor bundled with webpack (its git+ssh dependency fetched over https).
# Layout as upstream's image: /usr/bin/writefreely, /usr/share/writefreely/{pages,static,templates}. The
# start script initialises the SQLite database and keys under /data (the volume) and serves on 8080 with
# WF_CONFIG (default /etc/writefreely/config.ini). LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(0.17.3)
declare -A SHA256=(
  [0.17.3]=27f05cc534531099b2f4c313dbdd016cdcbf1b48d05e0a5c53ffdf0f94d69f84
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
