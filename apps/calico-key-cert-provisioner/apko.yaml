# calico-key-cert-provisioner image: the init container that requests a certificate via a CSR. Nonroot.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-calico-key-cert-provisioner@local

accounts:
  groups:
    - groupname: calico
      gid: 1001
  users:
    - username: calico
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/bin/key-cert-provisioner

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-calico-key-cert-provisioner"
  org.opencontainers.image.licenses: "Apache-2.0"
