# calico-key-cert-provisioner: built from source from the projectcalico/calico tag (2026-10-08). Wolfi's
# calico-*-3.32 apk for it is Go only and links stdlib 1.25.11 and old golang.org/x modules.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(3.32.0)
declare -A SHA256=(
  [3.32.0]=55defb4135a7f04942ff596848b4decc5eeed67d0d97f81b57df5395f41354c9
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
