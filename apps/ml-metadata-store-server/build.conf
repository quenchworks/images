# STATUS: BLOCKED 2026-10-20 on C/C++ libraries statically linked into the server, which the
# scanner cannot see. The Kubeflow Pipelines v2 driver records every execution in ML Metadata
# (backend/src/v2/cmd/driver/main.go newMlmdClient), so no KFP v2 run works without this
# server, and the kubeflow-pipelines chart is held on it too.
# Measured on Wolfi's ml-metadata-store-server 1.17.1-r0 (the only build, both arches; its
# embedded .melange.yaml is a stock `bazel build` of google/ml-metadata v1.17.1) with
# `strings` and the v1.17.1 WORKSPACE:
#   sqlite 3.39.2 (2022-07-21 source id), zlib 1.2.12, gRPC 1.46.3, protobuf 3.21.9,
#   mariadb-connector-c v3.0.8-release (ml_metadata/mysql_configure.bzl) and libpq from
#   PostgreSQL 12.1, all compiled in by bazel http_archive / new_git_repository.
# Those carry published fixes the gate would never report (among them zlib CVE-2022-37434,
# sqlite CVE-2025-6965, connector/C CVE-2020-13249, gRPC CVE-2023-32731), the same class as
# jellyfin's SkiaSharp blob. Upstream v1.21.0 (2026-06-09, newest) still pins
# connector-c v3.0.8 and PostgreSQL 12.1 (EOL), with sqlite 3.47.2, zlib 1.3.1, gRPC 1.70.1.
# Unblock by EITHER an ml-metadata release that moves those dependencies to fixed versions,
# OR our own bazel build that links Wolfi's system zlib, sqlite-libs, mariadb-connector-c
# and libpq (new_local_repository in place of the http_archive / git repos) so they become
# scanned apks; the PostgreSQL 12.1 BUILD (1413 hand-listed sources) and the connector-c
# 3.0.8 source list cannot simply be re-pointed at newer tarballs.
# The CVE gate itself passes (the scanner sees one Wolfi apk), so recheck-blocked skips it.
BLOCKED=1
BLOCKED_BY=scanner-invisible-static-c-deps
# ml-metadata-store-server: the ML Metadata gRPC server (google/ml-metadata, Apache-2.0)
# from Wolfi's apk (FROM_SOURCE=0), the metadata store Kubeflow Pipelines records into.
FROM_SOURCE=0
VERSIONS=(1.17.1)
declare -A PIN=( [1.17.1]=1.17.1-r0 )
render() { local v=$1; echo "s/__VER__/$v/g; s/__REL__/${PIN[$v]}/g"; }
