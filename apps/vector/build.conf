# LATEST-ONLY: 0.57.0 raised MSRV to rust-1.95, which trips a -D warnings future-compat
# lint in the vector-config crate of 0.55/0.56 (older lines fail to compile on 1.95).
# Like vllm, vector is a churny agent -> ship the current stable line only.
# vector: from-source via melange (Rust/cargo build, git-checkout pinned per
# release; built with Wolfi rust-1.95 -- >= 0.57.0's MSRV 1.95, also builds 0.55/0.56).
# Latest 3 stable minor lines, newest patch each. COMMIT map.
FROM_SOURCE=1
VERSIONS=(0.58.0)
declare -A COMMIT=(
  [0.58.0]=64ac8ff2978867091dfb0d094a84dbfebe2eabe1
)
render() { echo "s/__VER__/$1/g; s/__COMMIT__/${COMMIT[$1]}/g"; }
