# Builds Teleport (gravitational/teleport) from source onto Wolfi with upstream's `make full`.
# See build.conf for the measurement and the AGPL build choice.
package:
  name: quench-teleport
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Teleport (AGPL build: teleport with embedded web UI and RDP client, tctl, tsh, tbot, teleport-update), built from source on Wolfi"
  copyright:
    - license: AGPL-3.0-only
  dependencies:
    runtime:
      - ca-certificates-bundle
      - libfido2
      - pcsc-lite
      - linux-pam
      - tzdata

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - bash
      - make
      - curl
      - git
      - ca-certificates-bundle
      - go-1.27
      - nodejs-24           # web UI (package.json engines node ^24)
      - corepack            # pnpm at the packageManager pin (11.3.0)
      - rustup              # Rust 1.94.0 + wasm32 target (no Wolfi rust ships a wasm32 std)
      - binaryen            # wasm-opt for the IronRDP module
      - clang
      - libbpf-dev          # BPF bytecode (enhanced session recording)
      - linux-pam-dev
      - libfido2-dev
      - pcsc-lite-dev
      - pkgconf
      - zlib-dev
      - elfutils-dev

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/gravitational/teleport/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
      strip-components: 1

  - name: Toolchains
    runs: |
      set -eu
      export RUSTUP_HOME=/tmp/rustup CARGO_HOME=/tmp/cargo PATH="/tmp/cargo/bin:$PATH"
      rustup-init -y --no-modify-path --profile minimal --default-toolchain none
      ch=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
      rustup toolchain install "$ch" --profile minimal --target wasm32-unknown-unknown
      cargo --version

  - name: CVE floors
    runs: |
      set -eu
      export RUSTUP_HOME=/tmp/rustup CARGO_HOME=/tmp/cargo PATH="/tmp/cargo/bin:$PATH"
      # rustls 0.23.40 -> 0.23.46 (GHSA-2mjx-qc3c-rqvc, -c8m5-c952-6cm4 and two LOW); same minor.
      cargo update -p rustls --precise 0.23.46
      grep -A1 '^name = "rustls"$' Cargo.lock | grep -q 'version = "0.23.46"'
      # Go module floors: raise only, never lower (go get is exact). Measured on the 18.10.0 dist.
      export GOTOOLCHAIN=local GOFLAGS=-mod=mod
      floor() {
        have=$(go list -m -f '{{.Version}}' "$1" 2>/dev/null || true)
        [ -n "$have" ] || return 0
        [ "$(printf '%s\n%s\n' "${have#v}" "${2#v}" | sort -V | head -1)" = "${2#v}" ] && return 0
        go get "$1@$2"
      }
      floor golang.org/x/net v0.62.0
      floor golang.org/x/crypto v0.58.1-0.20261009181718-2f1f834330b2
      floor golang.org/x/mod v0.40.0
            floor github.com/go-jose/go-jose/v4 v4.1.6
      floor oras.land/oras-go/v2 v2.6.2
      # strcase v0.0.5 panics at init on go 1.27 (asserts unicode.Version 15.0.0, Go 1.27 has 17.0.0);
      # v0.0.6 adds tables_go127.go.
      floor github.com/charlievieth/strcase v0.0.6
      # Measured on the first from-source build (2026-11-02 gate): what the go-1.27 build still carried.
      floor google.golang.org/grpc v1.83.2
      floor github.com/klauspost/compress v1.18.7
      # CVE-2026-128085 (otel 1.47.0): move every otel v1 module the build uses, as one family
      otel=$(go list -m -f '{{.Path}} {{.Version}}' all | awk '$1 ~ /^go\.opentelemetry\.io\/otel(\/|$)/ && $2 ~ /^v1\./ && $2 != "v1.47.0" {print $1"@v1.47.0"}')
      [ -z "$otel" ] || go get $otel
      floor github.com/sigstore/sigstore-go v1.2.1
      floor github.com/sigstore/timestamp-authority/v2 v2.1.0
      floor github.com/sigstore/rekor v1.5.2
      floor github.com/google/go-attestation v0.6.1
      # go-attestation 0.6 is TPM 2.0 only and dropped the version fields (PlatformParameters.TPMVersion,
      # Quote.Version, OpenConfig.TPMVersion, ActivationParameters.TPMVersion); Teleport only ever set 2.0.
      # ParseAKPublic also lost its version argument (0.6 takes only the public blob).
      # (busybox grep: no --include, so find picks the files)
      find lib tool -name '*.go' -exec grep -l 'attest.TPMVersion20' {} + | xargs -r sed -i -E '/^\s+((TPMVersion|Version):\s+)?attest\.TPMVersion20,$/d'
      ! find lib tool -name '*.go' ! -name '*_test.go' -exec grep -n 'attest.TPMVersion20' {} + || { echo "FATAL: TPMVersion20 references left"; exit 1; }
      floor github.com/containerd/containerd v1.7.36
      floor github.com/go-git/go-git/v5 v5.19.2
      # OTel moves as one family (memory otel-is-many-modules): every module of the set to 1.45.0.
      for m in otel otel/sdk otel/trace otel/metric otel/sdk/metric otel/exporters/otlp/otlptrace \
               otel/exporters/otlp/otlptrace/otlptracegrpc otel/exporters/otlp/otlptrace/otlptracehttp; do
        floor "go.opentelemetry.io/$m" v1.45.0
      done
      go mod tidy
      go list -m golang.org/x/net google.golang.org/grpc

  - name: Build
    runs: |
      set -eu
      export RUSTUP_HOME=/tmp/rustup CARGO_HOME=/tmp/cargo PATH="/tmp/cargo/bin:$PATH"
      export GOTOOLCHAIN=local GOFLAGS=-mod=mod COREPACK_ENABLE_DOWNLOAD_PROMPT=0
      # Go 1.27.4 refuses the RDP client's `#cgo LDFLAGS: -l:librdp_client.a` (an unlisted flag
      # form); allow exactly that library so the static Rust archive still links.
      export CGO_LDFLAGS_ALLOW='-l:librdp_client\.a'
      corepack enable --install-directory /tmp/cargo/bin
      unset GITHUB_REPOSITORY_OWNER
      # ensure-wasm-opt always cargo-installs the wasm-opt crate (binaryen 116 vendored); its C++ link
      # fails here with rust-lld. Wolfi binaryen's wasm-opt (133) does the same -O pass.
      # (make -o does not reach the sub-make that runs it, so the rule's recipe is replaced.)
      command -v wasm-opt
      sed -i 's|^\tcargo install --locked wasm-opt@\$(WASM_OPT_VERSION)$|\tcommand -v wasm-opt|' Makefile
      ! grep -q 'cargo install --locked wasm-opt' Makefile || { echo "FATAL: wasm-opt rule not replaced"; exit 1; }
      # Go 1.26.11/1.27.4 cgo refuses LLVM bitcode sections (.llvmbc, .llvmcmd) in the archives a
      # package links; librdp_client.a carries them from Rust's prebuilt std. Strip them right after
      # cargo builds the RDP client (the release and deps copies are hard links, so both are done).
      sed -i '/cargo build -p rdp-client /a\\tfind target -name "librdp_client*.a" -exec objcopy --remove-section=.llvmbc --remove-section=.llvmcmd {} \\;' Makefile
      grep -q 'objcopy --remove-section=.llvmbc' Makefile || { echo "FATAL: rdpclient strip not added"; exit 1; }
      make full
      for b in teleport tctl tsh tbot teleport-update; do test -x "build/$b"; done
      ./build/teleport version | grep -q "v${{package.version}}"
      go version -m build/teleport | grep -E '^\s+dep\s+golang.org/x/net\s' | grep -q 'v0.62'
      install -d "${{targets.destdir}}/usr/bin"
      for b in teleport tctl tsh tbot teleport-update; do install -m 0755 "build/$b" "${{targets.destdir}}/usr/bin/$b"; done

test:
  pipeline:
    - runs: |
        teleport version
        tctl version
        tsh version
