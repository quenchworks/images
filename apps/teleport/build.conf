# teleport: Teleport (gravitational/teleport, AGPL-3.0 community source), the identity-based access
# plane for SSH, Kubernetes, databases, apps and desktops. Built from source on Wolfi with
# upstream's own Makefile (`make full`): the Rust RDP client, the IronRDP wasm module and the web UI
# (pnpm, Node 24) embedded into `teleport`, plus tctl, tsh, tbot and teleport-update.
#
# AGPL build: GITHUB_REPOSITORY_OWNER is unset, so the Makefile stages the AGPL logo assets and
# leaves the community build type (a Teleport trademark build) out.
#
# Measured 2026-11-02 on the v18.10.0 official dist (trivy rootfs, comprehensive): 276 findings, all
# Go modules in the five binaries (stdlib 1.25.11, x/net, x/crypto, grpc, go-jose, oras); the recipe
# builds on go-1.27 with module floors. The RDP client's Cargo.lock carries rustls 0.23.40 (fixed
# 0.23.46), moved with cargo update; the binary has no cargo-auditable section, so the floor is
# asserted on Cargo.lock.
BLOCKED=0
FROM_SOURCE=1
# 2026-11-11 HOLD (go-jose v3, CVE-2026-116587/-116585/-116586, no v3 fix): Teleport's own code parses
# with v3 (lib/jwt/jwt.go, lib/jwt/jwk.go, lib/join/*/token_validator.go), reachable; master still requires
# v3.0.5. Unblock on a Teleport release that moves lib/jwt to v4.
VERSIONS=(18.10.0)
# sha256 of the GitHub source tarball, from two identical downloads.
declare -A SHA256=(
  [18.10.0]=75a6018ebb6e7e5ffc9f74ee6a5352dc1d5a3390f5617945cbef4f1a45f614e5
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
