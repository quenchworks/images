# FreshRSS from the release tag (the finished app), with its nginx server block, php-fpm pool,
# php.ini overrides and supervisord wiring. The PHP runtime and quench-nginx come from apko.
package:
  name: quench-freshrss
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened FreshRSS (release tag) on Wolfi php-fpm + nginx"
  copyright:
    - license: AGPL-3.0-only
  dependencies:
    runtime:
      - php-8.4
      - php-8.4-config
      - php-8.4-fpm
      - php-8.4-fpm-config
      - php-8.4-opcache
      - php-8.4-opcache-config
      - php-8.4-pdo
      - php-8.4-pdo-config
      - php-8.4-pdo_sqlite
      - php-8.4-pdo_sqlite-config
      - php-8.4-pdo_pgsql
      - php-8.4-pdo_pgsql-config
      - php-8.4-mysqlnd
      - php-8.4-mysqlnd-config
      - php-8.4-pdo_mysql
      - php-8.4-pdo_mysql-config
      - php-8.4-mbstring
      - php-8.4-mbstring-config
      - php-8.4-gd
      - php-8.4-gd-config
      - php-8.4-xml
      - php-8.4-xml-config
      - php-8.4-dom
      - php-8.4-dom-config
      - php-8.4-simplexml
      - php-8.4-simplexml-config
      - php-8.4-xmlreader
      - php-8.4-xmlreader-config
      - php-8.4-ctype
      - php-8.4-ctype-config
      - php-8.4-openssl
      - php-8.4-openssl-config
      - php-8.4-zip
      - php-8.4-zip-config
      - php-8.4-curl
      - php-8.4-curl-config
      - php-8.4-gmp
      - php-8.4-gmp-config
      - php-8.4-intl
      - php-8.4-intl-config
      - php-8.4-fileinfo
      - php-8.4-fileinfo-config
      - php-8.4-iconv
      - php-8.4-iconv-config
      - supervisor
      - busybox

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - php-8.4

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/FreshRSS/FreshRSS/archive/refs/tags/${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - name: Install the FreshRSS tree at /var/www/FreshRSS
    runs: |
      set -eu
      app="${{targets.destdir}}/var/www/FreshRSS"
      install -d -m 0755 "$app"
      # the workspace also holds melange-out/; docs/ and tests/ carry their own (dev) dependency trees
      for f in *; do case "$f" in melange-out|docs|tests|Docker|node_modules) ;; *) cp -a "$f" "$app/" ;; esac; done
      rm -f "$app"/package*.json "$app"/eslint.config.js "$app"/svgo.config.mjs "$app"/phpcs.xml "$app"/phpstan*.neon "$app"/phpunit.xml "$app"/Makefile
      # data/ is DATA_PATH, a volume: ship it empty (cli/prepare.php writes its skeleton as the app user)
      rm -rf "$app/data" && install -d -m 0755 "$app/data"
      grep -q "FRESHRSS_VERSION = '${{package.version}}'" "$app/constants.php"
      for f in "$app"/p/i/index.php "$app"/cli/do-install.php "$app"/constants.php; do php -l "$f" >/dev/null; done

  - name: Install nginx, php-fpm and supervisord wiring
    runs: |
      set -eu
      d="${{targets.destdir}}"
      install -d "$d/etc/nginx/conf.d" "$d/etc/php/php-fpm.d" "$d/etc/php/conf.d" "$d/etc/freshrss" "$d/etc/supervisor.d"
      cat > "$d/etc/nginx/conf.d/freshrss.conf" <<'EOF'
      server {
          listen 8080 default_server;
          listen [::]:8080 default_server;
          server_name _;
          # only p/ is public; the app, data and CLI stay outside the docroot
          root /var/www/FreshRSS/p;
          index index.php index.html;
          client_max_body_size 32M;
          access_log off;

          location ~ /\.                     { return 403; }
          location / { try_files $uri $uri/ /index.php$is_args$args; }

          location ~ ^.+?\.php(/.*)?$ {
              fastcgi_split_path_info ^(.+\.php)(/.*)$;
              # try_files clears $fastcgi_path_info: keep it first
              set $path_info $fastcgi_path_info;
              try_files $fastcgi_script_name =404;
              include        /etc/nginx/fastcgi_params;
              fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
              # the Google Reader and Fever APIs route by PATH_INFO
              fastcgi_param  PATH_INFO $path_info;
              fastcgi_pass   127.0.0.1:9000;
              fastcgi_read_timeout 300;
          }

          location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ { expires 7d; access_log off; }
      }
      EOF
      cat > "$d/etc/php/php-fpm.d/zzz-freshrss.conf" <<'EOF'
      [global]
      daemonize = no
      error_log = /proc/self/fd/2

      [www]
      listen = 127.0.0.1:9000
      catch_workers_output = yes
      decorate_workers_output = no
      ; FreshRSS reads DATA_PATH from the environment
      clear_env = no
      pm = dynamic
      pm.max_children = 16
      pm.start_servers = 2
      pm.min_spare_servers = 1
      pm.max_spare_servers = 4
      EOF
      cat > "$d/etc/php/conf.d/zzz-freshrss.ini" <<'EOF'
      expose_php = Off
      memory_limit = 256M
      upload_max_filesize = 32M
      post_max_size = 32M
      sys_temp_dir = /tmp
      upload_tmp_dir = /tmp
      session.save_path = /tmp
      session.cookie_httponly = 1
      session.use_strict_mode = 1
      display_errors = Off
      log_errors = On
      error_log = /proc/self/fd/2
      date.timezone = UTC
      opcache.enable = 1
      opcache.memory_consumption = 64
      opcache.revalidate_freq = 2
      EOF
      cat > "$d/etc/freshrss/supervisord.conf" <<'EOF'
      [supervisord]
      nodaemon=true
      logfile=/dev/stdout
      logfile_maxbytes=0
      pidfile=/tmp/supervisord.pid

      [unix_http_server]
      file=/tmp/supervisor.sock

      [supervisorctl]
      serverurl=unix:///tmp/supervisor.sock

      [rpcinterface:supervisor]
      supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

      [include]
      files = /etc/supervisor.d/*.conf
      EOF
      cat > "$d/etc/supervisor.d/php-fpm.conf" <<'EOF'
      [program:php-fpm]
      command=/usr/bin/php-fpm --nodaemonize --fpm-config /etc/php/php-fpm.conf
      autorestart=true
      priority=10
      stdout_logfile=/dev/stdout
      stdout_logfile_maxbytes=0
      stderr_logfile=/dev/stderr
      stderr_logfile_maxbytes=0
      EOF
      cat > "$d/etc/supervisor.d/nginx.conf" <<'EOF'
      [program:nginx]
      command=/usr/bin/nginx -g "daemon off;"
      autorestart=true
      priority=20
      stdout_logfile=/dev/stdout
      stdout_logfile_maxbytes=0
      stderr_logfile=/dev/stderr
      stderr_logfile_maxbytes=0
      EOF

test:
  pipeline:
    - runs: |
        set -eu
        test -f /var/www/FreshRSS/p/i/index.php
        for ext in pdo_sqlite pdo_pgsql pdo_mysql mbstring gd xml dom simplexml xmlreader ctype openssl zip curl gmp intl fileinfo session; do
          php -m | grep -qi "^${ext}$" || { echo "missing PHP extension: $ext"; exit 1; }
        done
        command -v php-fpm
