# FreshRSS runtime: supervisord runs php-fpm 8.4 and quench-nginx (port 8080). Users, config and
# SQLite live in DATA_PATH (/var/www/FreshRSS/data): mount a volume there and set it up once with
# cli/do-install.php and cli/create-user.php. Busybox stays for the feed-refresh loop.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - busybox
    - tzdata
    - supervisor
    - quench-nginx@local
    - quench-freshrss@local
    - php-8.4
    - php-8.4-config
    - php-8.4-fpm
    - php-8.4-fpm-config
    - php-8.4-opcache
    - php-8.4-opcache-config
    - php-8.4-pdo
    - php-8.4-pdo-config
    - php-8.4-pdo_sqlite
    - php-8.4-pdo_sqlite-config
    - php-8.4-pdo_pgsql
    - php-8.4-pdo_pgsql-config
    - php-8.4-mysqlnd
    - php-8.4-mysqlnd-config
    - php-8.4-pdo_mysql
    - php-8.4-pdo_mysql-config
    - php-8.4-mbstring
    - php-8.4-mbstring-config
    - php-8.4-gd
    - php-8.4-gd-config
    - php-8.4-xml
    - php-8.4-xml-config
    - php-8.4-dom
    - php-8.4-dom-config
    - php-8.4-simplexml
    - php-8.4-simplexml-config
    - php-8.4-xmlreader
    - php-8.4-xmlreader-config
    - php-8.4-ctype
    - php-8.4-ctype-config
    - php-8.4-openssl
    - php-8.4-openssl-config
    - php-8.4-zip
    - php-8.4-zip-config
    - php-8.4-curl
    - php-8.4-curl-config
    - php-8.4-gmp
    - php-8.4-gmp-config
    - php-8.4-intl
    - php-8.4-intl-config
    - php-8.4-fileinfo
    - php-8.4-fileinfo-config
    - php-8.4-iconv
    - php-8.4-iconv-config

accounts:
  groups:
    - groupname: freshrss
      gid: 1001
  users:
    - username: freshrss
      uid: 1001
      gid: 1001
  run-as: 1001

# supervisord (PID 1) starts php-fpm then nginx. No shell wrapper: supervisord parses the
# program commands itself, and quench-nginx's own nginx.conf already puts the pid and all
# temp paths under /tmp, so nothing has to be mkdir'd at boot.
entrypoint:
  command: /usr/bin/supervisord -c /etc/freshrss/supervisord.conf

work-dir: /var/www/FreshRSS

environment:
  DATA_PATH: /var/www/FreshRSS/data

paths:
  # /tmp holds supervisord pid/sock, nginx pid + temp dirs and PHP sessions/uploads.
  - path: /tmp
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o1777
  # FreshRSS data (users, config, SQLite, caches): writable for the app user
  - path: /var/www/FreshRSS/data
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o755

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-freshrss"
  org.opencontainers.image.licenses: "AGPL-3.0-only"
