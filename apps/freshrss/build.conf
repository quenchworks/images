# FreshRSS (FreshRSS/FreshRSS, AGPL-3.0): self-hosted RSS and Atom aggregator with multi-user
# accounts and the Google Reader and Fever APIs. The release tag is the finished app (its PHP
# libraries live in lib/), laid down under /var/www/FreshRSS without docs/ and tests/, served by
# php-fpm 8.4 behind QuenchWorks' nginx (quench-nginx, built from source in the same build) under
# supervisord: the house PHP pattern (kanboard, phpmyadmin). DATA_PATH points at a volume; the CLI
# (cli/do-install.php, cli/create-user.php) sets it up. LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(1.30.4)
declare -A SHA256=(
  [1.30.4]=4c750c794479e6158bfb4f970050a7083f4e3afdbaea3bc6063aba3a5df8d01d
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
