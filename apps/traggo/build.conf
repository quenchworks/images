# traggo: traggo (traggo/server, GPL-3.0), tag-based time tracking with dashboards and a web UI. Images issue #96.
#
# From the release tag: the React UI (react-scripts 3, yarn 1) built in the sandbox with d3-color and @babel/runtime
# resolutions, embedded into the Go server (CGO on for go-sqlite3). Floors: the house golang.org/x set, gorilla/websocket,
# and go-sqlite3 1.14.x (v1.10.0 bundles a 2018 SQLite whose CVEs scanners cannot see). SQLite in /var/lib/traggo by
# default (TRAGGO_DATABASE_CONNECTION), PostgreSQL via TRAGGO_DATABASE_DIALECT. LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(0.8.3)
declare -A SHA256=(
  [0.8.3]=b3a0074f1137ede1f257609397b3fb25cfda24e4840c2999fbfc5694cf4e8235
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
