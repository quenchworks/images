# kratos (Ory): from-source via melange (Go build from the git tag tarball).
# Ory's Identity Server. Ory moved to a CalVer-style scheme; the two most recent
# release lines are v25.4 and v26.2 (each ships a single patch so far). Each
# release pins its source tarball by sha256. Static Go binary, CGO disabled
# (-tags=json1, the pure-Go path, no cgo sqlite) — this matches upstream's
# distroless "static-nosqlite" build. The version is stamped via
# -X github.com/ory/kratos/driver/config.Version (goreleaser buildinfo_tag);
# upstream stamps the full git tag, so it carries the "v" prefix.
FROM_SOURCE=1
VERSIONS=(25.4.0 26.2.0)
declare -A SHA256=(
  [25.4.0]=859f1ca84fcbd76cdd5d20320e9654bdd948df185cbf7a80db13e41ee7c3a789
  [26.2.0]=68fb4098bc974cd97473b66a5f2bbf5b7e3269d365fd0500c7f54fe14b7ee095
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
