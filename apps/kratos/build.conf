# kratos (Ory): from-source via melange (Go build from the git tag tarball).
# Ory's Identity Server. Ory moved to a CalVer-style scheme; the two most recent
# release lines are v25.4 and v26.2 (each ships a single patch so far). Each
# release pins its source tarball by sha256. Static Go binary, CGO disabled
# (-tags=json1, the pure-Go path, no cgo sqlite) — this matches upstream's
# distroless "static-nosqlite" build. The version is stamped via
# -X github.com/ory/kratos/driver/config.Version (goreleaser buildinfo_tag);
# upstream stamps the full git tag, so it carries the "v" prefix.
FROM_SOURCE=1
VERSIONS=(25.4.0 26.2.0)
declare -A SHA256=(
  [25.4.0]=859f1ca84fcbd76cdd5d20320e9654bdd948df185cbf7a80db13e41ee7c3a789
  [26.2.0]=68fb4098bc974cd97473b66a5f2bbf5b7e3269d365fd0500c7f54fe14b7ee095
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }

# STATUS 2026-08-27 -- NOT BLOCKED. The roadmap flag was stale.
# The recorded reason claimed kratos was held by a transitive
# github.com/docker/docker v28.x (CVE-2026-34040 HIGH) "via ory/x's vendored
# dockertest helper ... can't be bumped without forking". Re-tested at 26.2.0
# today, both arches. The docker finding is real but is NOT a module problem:
#   `go mod why -m github.com/docker/docker` gives
#       kratos -> github.com/ory/x/dbal -> github.com/ory/x/sqlcon/dockertest
#         -> github.com/docker/docker/api/types/container
#   ory/x is vendored IN the tarball (`replace github.com/ory/x => ./oryx`), and
#   the single thing dragging the docker client tree into the SERVER binary was
#   oryx/dbal/testhelpers.go -- a non-_test.go file (so it compiles into the
#   production `dbal` package) holding one helper for Ory's own integration
#   tests, RestoreFromSchemaDump(t testing.TB). Deleting that one file removes
#   every docker/*, moby/* and ory/dockertest package from the binary. No module
#   bump, no fork, no moby v29 needed. The recipe asserts on the built binary
#   that none of them came back.
# The rest of the gate had nothing to do with docker: this recipe had never
# carried a module float (a blocked app is never rebuilt, so it never got the
# coherent float set). Added: the canonical x/* + grpc + otel floors, the two
# otlptrace exporter modules, go-jose v3/v4, pgx v5 (CRITICAL CVE-2026-33815/
# 33816), plus github.com/slack-go/slack 0.23.1 (GHSA-gxhx-2686-5h9g) and
# go.mongodb.org/mongo-driver 1.17.7 (CVE-2026-2303), which the second pass
# named once docker was gone.
# Gate: "✅ 0 fixable CVEs (x86_64)" and "✅ 0 fixable CVEs (aarch64)".
# Boot test: test.sh passed on the x86_64 image (Version: v26.2.0, nonroot 1001).
BLOCKED=0

