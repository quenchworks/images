# Builds Ory Kratos from source onto Wolfi. Single static Go binary, no CGO
# (matches upstream's distroless "static-nosqlite" goreleaser build: CGO_ENABLED=0,
# -tags=json1 — the pure-Go path, dropping the cgo mattn/go-sqlite3 driver). The
# version is stamped via -X github.com/ory/kratos/driver/config.Version so
# `kratos version` reports the real release (upstream stamps the full tag, hence
# the "v" prefix). Kratos needs Go 1.26 (go.mod `go 1.26`); go-1.26 is pinned and
# GOTOOLCHAIN=local forbids an on-the-fly toolchain download. Output is a signed
# APK in Quenchworks' own repo. No upstream distro binaries. Image-only (no chart).
package:
  name: quench-kratos
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Ory Kratos (identity server), built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-1.26

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/ory/kratos/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      export CGO_ENABLED=0
      export GOTOOLCHAIN=local
      export GOFLAGS=-mod=mod
      go build -trimpath -tags json1 \
        -ldflags "-s -w -X github.com/ory/kratos/driver/config.Version=v${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/kratos" .
