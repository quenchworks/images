# Builds the Harbor registryctl from source onto Wolfi. Harbor is a CNCF
# cloud-native container/OCI artifact registry; harbor-registryctl is the small
# control sidecar that sits next to the Docker distribution registry and lets
# Harbor drive registry maintenance (it triggers/controls blob garbage
# collection and exposes registry health to core). ONE static Go binary
# (harbor_registryctl), CGO-free, multi-arch.
#
# Source: github.com/goharbor/harbor @ tag v2.14.4 (Apache-2.0). One Go module
# under src/; builds the src/registryctl main package. No swagger codegen
# needed (does not import the generated restapi packages).
#
# go.mod has no vendor/ -> module proxy (GOFLAGS=-mod=mod); go 1.25.x ->
# go-1.25 toolchain. Version stamped via -ldflags into
# src/pkg/version.{ReleaseVersion,GitCommit} (RELEASEVERSION = VERSION file).
#
# Runtime note: registryctl shares the registry's /storage filesystem volume at
# runtime (the chart mounts it) so it can act on the registry's blob store.
package:
  name: harbor-registryctl
  version: 2.14.4
  epoch: 0
  description: "QuenchWorks hardened Harbor registryctl (registry control sidecar), built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - busybox

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - go-1.25

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/goharbor/harbor/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: 513078479f38d6b605938980d4e6eae7c6f1576afcc522bcde5107f986bf5f46
  - runs: |
      export CGO_ENABLED=0
      export GOTOOLCHAIN=local
      export GOFLAGS=-mod=mod
      export GOBUILDVCS=false

      REL="$(cat VERSION)"        # -> v2.14.4
      test "${REL}" = "v${{package.version}}" || { echo "VERSION mismatch: ${REL}"; exit 1; }

      cd src
      # CVE-2026-39882 (MEDIUM): the otel otlptrace + otlptracehttp exporters are
      # pinned at v1.34.0 in go.mod while the rest of the otel set is v1.43.0;
      # bump the two laggards to v1.43.0 (the fixed version) to clear the gate.
      go get go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.43.0
      go get go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.43.0
      GITCOMMIT="v${{package.version}}"
      LDFLAGS="-w -s \
        -X github.com/goharbor/harbor/src/pkg/version.GitCommit=${GITCOMMIT} \
        -X github.com/goharbor/harbor/src/pkg/version.ReleaseVersion=${REL}"
      install -d "${{targets.destdir}}/usr/bin"
      go build -trimpath -ldflags "${LDFLAGS}" \
        -o "${{targets.destdir}}/usr/bin/harbor_registryctl" ./registryctl
      cd ..

      install -d "${{targets.destdir}}/usr/share/doc/harbor-registryctl"
      cp LICENSE "${{targets.destdir}}/usr/share/doc/harbor-registryctl/" 2>/dev/null || true

      # Thin entrypoint: exec harbor_registryctl. Config comes from the chart via
      # mounted ConfigMap; ships NO live config.
      cat > "${{targets.destdir}}/usr/bin/docker-entrypoint.sh" <<'EOS'
      #!/bin/sh
      set -eu
      exec /usr/bin/harbor_registryctl "$@"
      EOS
      chmod 0755 "${{targets.destdir}}/usr/bin/docker-entrypoint.sh"

test:
  pipeline:
    - runs: |
        test -x /usr/bin/harbor_registryctl
        test -x /usr/bin/docker-entrypoint.sh
        strings /usr/bin/harbor_registryctl | grep -q 'v2.14.4'
