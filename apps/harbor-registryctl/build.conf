# harbor-registryctl: from-source; latest 3 Harbor stable releases. Harbor couples all
# component images under the release version, so we tag at the Harbor release
# version and fetch the matching harbor source tarball (verified by sha) per release.
FROM_SOURCE=1
VERSIONS=(2.15.5 2.16.0)
declare -A SRC_SHA=(
  [2.15.5]=31e9833c022ce4cd1943e1b11ab3a23ebdf9ab8ef2b179e61ce44cb66bcf4eb5
  # 2.16.0 re-pinned 2026-11-11: upstream moved the v2.16.0 tag on 2026-11-10 (release day) from a
  # 2026-11-06 commit to e69b1bfab9 (+3 commits: a 2.16.0 migration script and installer packaging,
  # no Go changes); the tag tarball now hashes as below (downloaded twice).
  [2.16.0]=0142713eb73eeddb5997473853e03135d47cc2b36ee140f439a4ca0e17e67a22
)
render() { echo "s/__VER__/$1/g; s/__SRC_SHA__/${SRC_SHA[$1]}/g"; }
