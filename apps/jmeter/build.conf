# jmeter (Apache JMeter): ships the upstream binary distribution (arch-independent
# jars) on a hardened Wolfi JRE, the CVE surface the Trivy gate scans. JMeter
# maintains one active line (5.6.x); we ship the newest patches plus the prior
# minor (5.5). Each release pins its distribution tarball by sha256. Image-only
# (a load-testing CLI/tool, no chart).
FROM_SOURCE=1
VERSIONS=(5.5 5.6.2 5.6.3)
declare -A SHA256=(
  [5.5]=60e89c7c4523731467fdb717f33d614086c10f0316369cbaa45650ae1c402e1f
  [5.6.2]=08696d3b6278d272342d18609e2167ef28d2d1d5f71b592809c00bbd57cc8ef0
  [5.6.3]=f68efc17fe060f698c48a6abe2599a933927486bda2924dbe14c74895318ddde
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
