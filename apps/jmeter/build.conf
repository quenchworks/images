# STATUS: SHIPPABLE (0-CVE gate PASSES as of 2026-07-09).
# UNBLOCKED 2026-07-09: the melange recipe now remediates the flagged lib/ jars
# so the 0-CVE Trivy gate passes on 5.6.3 (still the newest upstream release).
# The recipe does two things (see apps/jmeter/melange.yaml for the pinned shas):
#   (a) DROPS three optional major-bump-only jars that back only optional
#       samplers/managers, unused by core HTTP load testing:
#         - tika-core / tika-parsers 1.28.5 (CVE-2025-66516 CRITICAL,
#           CVE-2025-54988; fixed only in tika 2.x/3.x)  -> Tika response parsing
#         - dnsjava 2.1.9 (CVE-2024-25638 HIGH; fixed only in dnsjava 3.6.0)
#           -> DNS Cache Manager
#         - neo4j-java-driver 4.4.13 (SHADES vulnerable netty 4.1.104 -> 8 CVEs
#           incl. CVE-2025-24970 HIGH; no standalone fix) + its only consumer,
#           lib/ext/ApacheJMeter_bolt.jar  -> Bolt/Neo4j sampler
#   (b) SWAPS the rest for same-major (binary-compatible) patched jars:
#         jackson core/databind/annotations 2.16.1->2.18.9, log4j
#         api/core/1.2-api/slf4j-impl 2.22.1->2.25.5, commons-lang3 3.14.0->3.18.0,
#         xstream 1.4.20->1.4.21, json-path 2.8.0->2.9.0, json-smart +
#         accessors-smart 2.5.0->2.5.2, rhino 1.7.14->1.7.14.1, batik(18) 1.16->1.17.
# TRADE-OFFS (accepted): dropping the three optional jars removes the Tika parser,
# DNS Cache Manager, and Bolt/Neo4j sampler features; core HTTP/HTTPS load testing,
# JSON extraction, and report generation are unaffected. The log4j 2.25 bump emits
# two benign startup WARNs (package-scanning deprecated; JMeter's GUI-only
# GuiLogEventAppender "not properly registered") -- cosmetic and irrelevant to
# headless (-n) container runs. Verified: `jmeter --version` + a headless `-n -t`
# run (thread group + JSR223 + JSON extractor, results saved to JTL) both succeed.
#
# jmeter (Apache JMeter): ships the upstream binary distribution (arch-independent
# jars) on a hardened Wolfi JRE, the CVE surface the Trivy gate scans. JMeter
# maintains one active line (5.6.x); we ship the newest release only. Each release
# pins its distribution tarball by sha256. Image-only (a load-testing CLI/tool, no
# chart).
FROM_SOURCE=1
VERSIONS=(5.6.3)
declare -A SHA256=(
  [5.6.3]=f68efc17fe060f698c48a6abe2599a933927486bda2924dbe14c74895318ddde
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
