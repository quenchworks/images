      4eeeae8d20c078abb64b015ec158add383ac581571cddc45c68f0c9ae0230720  org/apache/commons/commons-lang3/3.18.0/commons-lang3-3.18.0.jar
      f56586f3de59ae2a49430acbc9f27942b8c5cebec9245c869fae7136733333ec  com/thoughtworks/xstream/xstream/1.4.21/xstream-1.4.21.jar
      11a9ee6f88bb31f1450108d1cf6441377dec84aca075eb6bb2343be157575bea  com/jayway/jsonpath/json-path/2.9.0/json-path-2.9.0.jar
      4fbdedb0105cedc7f766b95c297d2e88fb6a560da48f3bbaa0cc538ea8b7bf71  net/minidev/json-smart/2.5.2/json-smart-2.5.2.jar
      9b8a7bc43861d6156c021166d941fb7dddbe4463e2fa5ee88077e4b01452a836  net/minidev/accessors-smart/2.5.2/accessors-smart-2.5.2.jar
      407d4af6521494061d86b208e99804e0bf5c2fa38449c48f24b2f5a7154b4d8d  org/mozilla/rhino/1.7.14.1/rhino-1.7.14.1.jar
      67d9d691ecec857ac3628fbd2167c201940d3c4b65ab7386484ac730cb8cf9ea  org/apache/xmlgraphics/batik-anim/1.17/batik-anim-1.17.jar
      7fe38f9451eb94575214323261c8192b63f1dfd2610659255fbbbbfde94a2a66  org/apache/xmlgraphics/batik-awt-util/1.17/batik-awt-util-1.17.jar
