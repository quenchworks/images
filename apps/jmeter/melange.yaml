# Packages Apache JMeter onto Wolfi. JMeter is a JVM app: we ship the upstream
# binary distribution (prebuilt, arch-independent jars) on a hardened Wolfi JRE,
# which is the CVE surface the Trivy gate scans. Mirrors the kafka JVM pattern:
# openjdk-21-jre at runtime + the distribution under /opt/apache-jmeter.
#
# CVE remediation (2026-07-09): the stock 5.6.3 lib/ ships jars that trip the
# 0-CVE gate. We (a) DROP three optional major-bump-only jars that back only
# optional samplers, and (b) SWAP the rest for same-major (binary-compatible)
# patched jars pinned by sha256 from Maven Central. Verified: `jmeter --version`
# plus a headless `-n -t` run (thread group + JSR223 + JSON extractor, save to
# JTL) both succeed with the swapped set. See the pipeline comments for details.
package:
  name: quench-jmeter
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Apache JMeter, packaged on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - openjdk-21-jre     # the JRE JMeter runs on (the scanned CVE surface)
      - bash               # the jmeter launcher is a bash script
      - busybox

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - curl               # build-time only: pull sha256-pinned CVE-fix jars

pipeline:
  - uses: fetch
    with:
      uri: https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-${{package.version}}.tgz
      expected-sha256: "__SHA256__"
      strip-components: 1
  - runs: |
      set -eu
      # install the distribution under /opt/apache-jmeter, dropping the Windows
      # launchers. The jars are arch-independent; the JRE is per-arch from Wolfi.
      dest="${{targets.destdir}}/opt/apache-jmeter"
      install -d "$dest"
      cp -r bin lib licenses LICENSE NOTICE README.md "$dest/"
      find "$dest/bin" -name '*.bat' -delete
      find "$dest/bin" -name '*.cmd' -delete
      lib="$dest/lib"

      # --- (a) DROP optional jars whose only fix is a prohibited MAJOR bump -----
      # tika-core/tika-parsers 1.28.5 (CVE-2025-66516 CRITICAL, CVE-2025-54988;
      #   fixed only in tika 2.x/3.x), dnsjava 2.1.9 (CVE-2024-25638 HIGH; fixed
      #   only in dnsjava 3.6.0), and neo4j-java-driver 4.4.13 (bundles/shades a
      #   vulnerable netty 4.1.104 -> 8 CVEs incl. CVE-2025-24970 HIGH; no
      #   standalone fix without rebuilding the driver). These back ONLY optional
      #   samplers/managers -- Tika response parsing, the DNS Cache Manager, and
      #   the Bolt/Neo4j sampler (ApacheJMeter_bolt.jar, the driver's only
      #   consumer) -- none of which core HTTP load testing uses. Dropped.
      rm -f "$lib"/tika-core-1.28.5.jar "$lib"/tika-parsers-1.28.5.jar \
            "$lib"/dnsjava-2.1.9.jar "$lib"/neo4j-java-driver-4.4.13.jar \
            "$dest"/lib/ext/ApacheJMeter_bolt.jar

      # --- (b) SWAP the remaining flagged jars for same-major patched builds ----
      # All swaps stay within the bundled major version (binary-compatible):
      #   jackson core/databind/annotations 2.16.1 -> 2.18.9
      #   log4j api/core/1.2-api/slf4j-impl     2.22.1 -> 2.25.5
      #   commons-lang3 3.14.0 -> 3.18.0   xstream 1.4.20 -> 1.4.21
      #   json-path 2.8.0 -> 2.9.0   json-smart+accessors-smart 2.5.0 -> 2.5.2
      #   rhino 1.7.14 -> 1.7.14.1   batik (18 jars) 1.16 -> 1.17
      # Remove the vulnerable originals, then fetch the replacements pinned by
      # sha256 from Maven Central (xmlgraphics-commons 2.9 / xml-apis stay put --
      # batik 1.17 is compatible with them).
      rm -f "$lib"/jackson-core-2.16.1.jar "$lib"/jackson-databind-2.16.1.jar \
            "$lib"/jackson-annotations-2.16.1.jar \
            "$lib"/log4j-api-2.22.1.jar "$lib"/log4j-core-2.22.1.jar \
            "$lib"/log4j-1.2-api-2.22.1.jar "$lib"/log4j-slf4j-impl-2.22.1.jar \
            "$lib"/commons-lang3-3.14.0.jar "$lib"/xstream-1.4.20.jar \
            "$lib"/json-path-2.8.0.jar "$lib"/json-smart-2.5.0.jar \
            "$lib"/accessors-smart-2.5.0.jar "$lib"/rhino-1.7.14.jar \
            "$lib"/batik-anim-1.16.jar "$lib"/batik-awt-util-1.16.jar \
            "$lib"/batik-bridge-1.16.jar "$lib"/batik-codec-1.16.jar \
            "$lib"/batik-constants-1.16.jar "$lib"/batik-css-1.16.jar \
            "$lib"/batik-dom-1.16.jar "$lib"/batik-ext-1.16.jar \
            "$lib"/batik-gvt-1.16.jar "$lib"/batik-i18n-1.16.jar \
            "$lib"/batik-parser-1.16.jar "$lib"/batik-script-1.16.jar \
            "$lib"/batik-shared-resources-1.16.jar "$lib"/batik-svg-dom-1.16.jar \
            "$lib"/batik-svggen-1.16.jar "$lib"/batik-transcoder-1.16.jar \
            "$lib"/batik-util-1.16.jar "$lib"/batik-xml-1.16.jar

      base="https://repo1.maven.org/maven2"
      MANIFEST="e03144f48c8d5307da2894570b4972aab8c72f22440f8dcdb745be2485ce2024  com/fasterxml/jackson/core/jackson-core/2.18.9/jackson-core-2.18.9.jar
      71595a3f7ff58344ec0496a9f9ec9f623ef7b85b45402d88f1ca261f1bc4b42c  com/fasterxml/jackson/core/jackson-databind/2.18.9/jackson-databind-2.18.9.jar
      798c85b86e7420d0b4eb91e7b3e37d4bee673c61de37a616ba51a7539631e6b7  com/fasterxml/jackson/core/jackson-annotations/2.18.9/jackson-annotations-2.18.9.jar
      64777f73ea0b3104c04eb82befbdccc30a425a19e83ad06cb2f93aa303511863  org/apache/logging/log4j/log4j-api/2.25.5/log4j-api-2.25.5.jar
      050c4f85deb48b055e9c041ac39043fbb79ce477841a11a1eb2969c86c6a0072  org/apache/logging/log4j/log4j-core/2.25.5/log4j-core-2.25.5.jar
      4dd812dc5a6343f542a9e0046b1ec78ecf10bdd5a8c15745101cdd8b9aa24974  org/apache/logging/log4j/log4j-1.2-api/2.25.5/log4j-1.2-api-2.25.5.jar
