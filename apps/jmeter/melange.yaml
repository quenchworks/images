      echo "$MANIFEST" | while read -r sum path; do
        [ -z "$sum" ] && continue
        f="${path##*/}"
        curl -fsSL -o "$lib/$f" "$base/$path"
        echo "$sum  $lib/$f" | sha256sum -c -
      done

test:
  pipeline:
    - runs: |
        /opt/apache-jmeter/bin/jmeter --version
