      6434a48717b69f05986866653e75d52840f812cd2bc27a5bf5d88aee95e4121f  org/apache/xmlgraphics/batik-codec/1.17/batik-codec-1.17.jar
      75db00180bde4ef5caee3916d6f65e5045051d59cf51d57e673c03969d7bbbcd  org/apache/xmlgraphics/batik-constants/1.17/batik-constants-1.17.jar
      dcf9a902bd0c4b1a84ac0561d7b66052bc93381c4923a5bc5602290c1c82b779  org/apache/xmlgraphics/batik-css/1.17/batik-css-1.17.jar
      f242ddb05b268b15ff055d1d1aaf2dc9c3418e842ba806731408a984d4e3240c  org/apache/xmlgraphics/batik-dom/1.17/batik-dom-1.17.jar
      8267fc60b4a5b0f2afa7dcfdad40beb0e723d6a19b66b8e24bc37c2ec6dc5450  org/apache/xmlgraphics/batik-ext/1.17/batik-ext-1.17.jar
