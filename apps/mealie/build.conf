# Mealie (mealie-recipes/mealie, AGPL-3.0): recipe manager and meal planner with URL import,
# shopping lists and a REST API, on SQLite or PostgreSQL. From the release tag via melange: the
# Nuxt frontend generated with upstream's pnpm, embedded in the Python package, installed with uv
# into a venv at /opt/mealie on Wolfi python-3.14, plus the NLTK tagger data the ingredient parser
# needs. LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(3.30.0)
declare -A SHA256=(
  [3.30.0]=d610dff42f8856bd61200c9e833b25efc2b27633222ba8dc815e846aa6f0b378
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
