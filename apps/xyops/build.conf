# xyops (pixlcore/xyops): a complete workflow automation + server monitoring
# system -- a Node.js SERVER app (job scheduler, monitors, alerting, ticketing)
# by Joseph Huckaby (creator of Cronicle). NOT published to npm (package is
# `private: true`), so we build FROM the GitHub source tag: fetch the tarball,
# `npm install --omit=dev` (compiles the native better-sqlite3 module via
# node-gyp), then `node bin/build.js dist` to bundle the web UI assets, and ship
# `node lib/main.js --foreground` on Wolfi nodejs-22.
#
# LATEST 3 (the usual window, not latest-only): xyops maintains a single 1.0.x
# line with frequent patch releases and a stable toolchain (Node 22 across all
# recent tags), so unlike churny per-release-toolchain frontends (Excalidraw,
# Ghost) all three newest patches build the same way. Tags carry a `v` prefix
# (v1.0.76); the fetch uri prepends it. BSD-3-Clause.
FROM_SOURCE=1
VERSIONS=(1.0.84)
declare -A SHA256=(
  [1.0.84]=61cd2ca4517b2d8d199c53f8fe2263d249e75bc343fcd61a1d19e70490ed63fb
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
