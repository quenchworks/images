# for CVE-2026-85091 as zlib 1.3.2.1_rc20260601-r0 and the advisory was amended
# to name that version, so the 1.3.3-r0 this file used to wait for is a number
# that will never arrive. A stock wolfi-base scan reports the advisory as
# `zlib 1.3.2-r7 -> 1.3.2.1_rc20260601-r0`, which is what Wolfi publishes on
# both arches today. scripts/blocked.py now watches the shipped version.
#
# Evidence, stated exactly as measured:
#   x86_64  gated locally 2026-09-20, PUSH=0: 0 fixable CVEs AND the boot test
#           passed, so this is "runs", not just "scans clean".
#   aarch64 not measured locally; this host kills background melange builds and
#           a qemu-emulated arm build does not fit the foreground timeout. CI's
#           native arm64 runner is the first arm measurement, and its gate
#           refuses to publish on any finding.
# 2026-09-14 CVE sweep: the nightly scan's 1 HIGH + 9 MEDIUM were against a stale published
# 1.0.90 digest, all npm-side and all already fixed in the current 1.0.97 recipe with NO
# override needed -- xyops ships no lockfile, so a plain `npm install` always resolves the
# newest version satisfying each declared range. Verified with a real `npm install
# --omit=dev` of the 1.0.97 source: nodemailer resolves to 9.1.1 (pixl-mail's own
# package.json now pins nodemailer exactly at 9.1.1, clearing GHSA-2x7j/8m3c/cc9r/wmmp) and
# sanitize-html resolves to 2.17.7 (xyops's own package.json direct dep is already exactly
# "2.17.7", clearing CVE-2026-63670/84371). Only one copy of each exists in the tree --
# nothing to pin. Remaining MEDIUM findings are the two Wolfi-side ones every app in this
# sweep carries: glibc-2.44 (CVE-2026-18374, fixed in 2.44-r6, present in the Wolfi index on
# both arches -- clears on a plain rebuild) and zlib (CVE-2026-85091, needs 1.3.3-r0, which
# does NOT exist in Wolfi on either arch as of today -- the known wall, see other apps).
#
# xyops (pixlcore/xyops): a complete workflow automation + server monitoring
# system -- a Node.js SERVER app (job scheduler, monitors, alerting, ticketing)
# by Joseph Huckaby (creator of Cronicle). NOT published to npm (package is
# `private: true`), so we build FROM the GitHub source tag: fetch the tarball,
# `npm install --omit=dev` (compiles the native better-sqlite3 module via
# node-gyp), then `node bin/build.js dist` to bundle the web UI assets, and ship
# `node lib/main.js --foreground` on Wolfi nodejs-22.
#
# WINDOW: newest-only (1.0.86). xyops maintains a single 1.0.x line with frequent
# patch releases and a stable toolchain (Node 22 across all recent tags), so unlike
# churny per-release-toolchain frontends (Excalidraw, Ghost) consecutive patches all
# build the same way -- the window could be widened to the usual 3 if wanted (the
# build workflow's prep job caps it at 3). Tags carry a `v` prefix (v1.0.86); the
# fetch uri prepends it. BSD-3-Clause.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(1.1.1)
declare -A SHA256=(
  [1.1.1]=07f1251a775beabbfa51a29adb8d9f9debba5078d3522cfb28ea5edfd006aeb9
)
