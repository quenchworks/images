# dnscrypt-proxy (DNSCrypt/dnscrypt-proxy, ISC): a DNS proxy speaking DNSCrypt v2, DNS-over-HTTPS
# and Oblivious DoH to upstream resolvers, with filtering, cloaking, caching and load balancing.
# From source via melange: one static Go binary (the version is compiled in).
# LATEST-ONLY: upstream ships one release line.
FROM_SOURCE=1
VERSIONS=(2.1.20)
declare -A SHA256=(
  [2.1.20]=2e6adb32e0f91cb755f1d2c060cddcc80ffca6a181bf03c90df22bbade121607
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
