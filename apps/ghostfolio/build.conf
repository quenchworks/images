# ghostfolio: Ghostfolio (ghostfolio/ghostfolio, AGPL-3.0), a wealth management and portfolio tracker for stocks,
# ETFs and crypto. Images issue #105.
#
# From the release tag as upstream's Dockerfile builds it (npm ci, nx build:production of the API and the Angular
# client, prisma generate), on Wolfi nodejs-24 (engines >=22.23.5). Unlike upstream, the API folder gets a
# production install (upstream ships the dev tree) plus the exact prisma CLI and @prisma/config for migrate deploy.
# A node launcher migrates, seeds (node prisma/seed.mts) and starts main.js. node-forge CVE-2026-85393 has no fix:
# VEXed (vex.openvex.json). LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(3.100.0)
declare -A SHA256=(
  [3.100.0]=e1c2419350033a47fac335dd28291e3135a8dface7b1eb3c1e44697a8e4abeb0
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
