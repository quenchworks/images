# Builds the Harbor exporter from source onto Wolfi. Harbor is a CNCF
# cloud-native container/OCI artifact registry; harbor-exporter is its optional
# Prometheus metrics exporter -- it queries Harbor's database + core API and
# exposes registry/project/quota/health metrics on /metrics. ONE static Go
# binary (harbor_exporter), CGO-free, multi-arch.
#
# Source: github.com/goharbor/harbor @ tag v2.14.4 (Apache-2.0). One Go module
# under src/; builds the src/cmd/exporter main package. No swagger codegen
# needed.
#
# go.mod has no vendor/ -> module proxy (GOFLAGS=-mod=mod); go 1.25.x ->
# go-1.26 toolchain. Version stamped via -ldflags into
# src/pkg/version.{ReleaseVersion,GitCommit} (RELEASEVERSION = VERSION file).
#
# Config is via env vars with the HARBOR_ prefix (viper.AutomaticEnv): DB DSN,
# core service host, redis url, exporter.port (default surfaced by the chart),
# exporter.metrics_path. The chart supplies all of it; ships NO live config.
package:
  name: harbor-exporter
  version: __VER__
  epoch: 0
  description: "QuenchWorks hardened Harbor exporter (Prometheus metrics), built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - busybox

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - go-1.26

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/goharbor/harbor/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SRC_SHA__
  - runs: |
      export CGO_ENABLED=0
      export GOTOOLCHAIN=local
      export GOFLAGS=-mod=mod
      export GOBUILDVCS=false

      REL="$(cat VERSION)"        # -> v2.14.4
      test "${REL}" = "v${{package.version}}" || { echo "VERSION mismatch: ${REL}"; exit 1; }

      cd src
      # CVE-2026-39882 (MEDIUM): the otel otlptrace + otlptracehttp exporters are
      # pinned at v1.34.0 in go.mod while the rest of the otel set is v1.43.0;
      # bump the two laggards to v1.43.0 (the fixed version) to clear the gate.
      go get go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.43.0
      go get go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.43.0
      # CVE-2026-35206 (helm): helm.sh/helm/v3 v3.18.5 -> v3.20.2 (fixed).
      # (No `go mod tidy`: exporter does not generate the swagger restapi
      # packages that the core handler imports, so a full-module tidy fails on
      # those missing generated dirs; `go get` + `go build ./cmd/exporter` only
      # resolves what the exporter actually imports.)
      go get helm.sh/helm/v3@v3.20.2
      # Comprehensive 0-CVE gate: three FIXABLE transitive deps flagged for the
      # exporter binary (all minor/patch, API-compatible, same major -- not a
      # fork/force). Plain `go get` (NO `go mod tidy`) to avoid walking the
      # ungenerated swagger restapi dirs the exporter main does not import:
      #   golang.org/x/crypto        v0.49.0 -> v0.52.0 (x/crypto/ssh* CVEs)
      #   golang.org/x/net           v0.52.0 -> v0.55.0 (x/net html/http2/idna CVEs)
      #   go.mongodb.org/mongo-driver v1.17.6 -> v1.17.7 (CVE-2026-2303)
      go get golang.org/x/crypto@v0.52.0 golang.org/x/net@v0.55.0 go.mongodb.org/mongo-driver@v1.17.7
      GITCOMMIT="v${{package.version}}"
      LDFLAGS="-w -s \
        -X github.com/goharbor/harbor/src/pkg/version.GitCommit=${GITCOMMIT} \
        -X github.com/goharbor/harbor/src/pkg/version.ReleaseVersion=${REL}"
      install -d "${{targets.destdir}}/usr/bin"
      go build -trimpath -ldflags "${LDFLAGS}" \
        -o "${{targets.destdir}}/usr/bin/harbor_exporter" ./cmd/exporter
      cd ..

      install -d "${{targets.destdir}}/usr/share/doc/harbor-exporter"
      cp LICENSE "${{targets.destdir}}/usr/share/doc/harbor-exporter/" 2>/dev/null || true

      # Thin entrypoint: exec harbor_exporter. All config via HARBOR_ env vars
      # supplied by the chart; ships NO live config.
      cat > "${{targets.destdir}}/usr/bin/docker-entrypoint.sh" <<'EOS'
      #!/bin/sh
      set -eu
      exec /usr/bin/harbor_exporter "$@"
      EOS
      chmod 0755 "${{targets.destdir}}/usr/bin/docker-entrypoint.sh"

test:
  pipeline:
    - runs: |
        test -x /usr/bin/harbor_exporter
        test -x /usr/bin/docker-entrypoint.sh
        strings /usr/bin/harbor_exporter | grep -q 'v2.14.4'
