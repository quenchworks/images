# openziti: the `ziti` binary (controller, router, CLI and PKI tooling in one) built from the
# openziti/ziti tag, CGO-free, with the house golang.org/x floor plus chi and go-jose floors.
# Two lines: 2.0 (current) and 1.6 (still patched). The module path differs between them
# (github.com/openziti/ziti/v2 vs github.com/openziti/ziti), so the recipe reads it from go.mod.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(1.6.22 2.0.8)
declare -A SHA256=(
  [1.6.22]=548a6d1bab486782d44215c9b6c9abd16cb73f958df58faaf6f0e321d683bf01
  [2.0.8]=e290b841db94ea34fb791fca4c53b1bd9dfd9ba94d790c7509158334133ea9c0
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
