# OpenZiti: the single `ziti` binary (controller, router, edge CLI, PKI) from the tag, CGO-free.
# Upstream's release builds with cgo for its darwin/windows targets; on linux the controller and
# router run CGO-free (built and run that way here).
package:
  name: quench-openziti
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened OpenZiti (ziti controller, router and CLI), built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27          # go.mod: go 1.27.1

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/openziti/ziti/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - runs: |
      set -eu
      export CGO_ENABLED=0 GOTOOLCHAIN=local GOFLAGS=-mod=mod
      # floors, raised only when below (a bare go get downgrades once upstream passes it). chi
      # 5.4.0 (CVE-2026-114437) and go-jose v4 4.1.6 (CVE-2026-116587), measured 2026-11-11 on
      # 2.0.8; the golang.org/x set moves together, as in the other recipes.
      FLOOR="golang.org/x/crypto@v0.58.1-0.20261009181718-2f1f834330b2 golang.org/x/net@v0.62.0 golang.org/x/text@v0.43.0 golang.org/x/sys@v0.49.0 github.com/go-chi/chi/v5@v5.4.0 github.com/go-jose/go-jose/v4@v4.1.6"
      # CVE-2026-128085 (otel 1.47.0): floor every otel v1 module the build uses, as one family
      for m in $(go list -m -f '{{.Path}} {{.Version}}' all | awk '($1 ~ /^go\.opentelemetry\.io\/otel(\/|$)/ || $1 ~ /^go\.opentelemetry\.io\/contrib\/bridges\/otel(zap|logrus|slog)$/) && $1 !~ /\/exporters\/jaeger$/ { if ($1 ~ /\/contrib\/bridges\//) print $1"@v0.21.0"; else if ($1 ~ /\/exporters\/(otlp\/otlplog\/|stdout\/stdoutlog$)/) print $1"@v0.23.0"; else if ($1 ~ /\/exporters\/prometheus$/) print $1"@v0.69.0"; else if ($2 ~ /^v1\./ || $1 ~ /\/(sdk\/)?log$/) print $1"@v1.47.0" }'); do
        FLOOR="$FLOOR $m"
      done
      need=""
      for f in $FLOOR; do
        have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${f%@*}")"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        [ "$(printf '%s\n%s\n' "$have" "${f#*@}" | sort -V | head -1)" = "${f#*@}" ] || need="$need $f"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || go get $need
      go mod tidy
      mod="$(awk '/^module /{print $2; exit}' go.mod)"
      go build -trimpath -ldflags "-s -w -X $mod/common/version.Version=v${{package.version}} -X $mod/common/version.Revision=quenchworks" \
        -o "${{targets.destdir}}/usr/bin/ziti" ./ziti
      test "$("${{targets.destdir}}/usr/bin/ziti" version)" = "v${{package.version}}"

test:
  pipeline:
    - runs: |
        ziti version
