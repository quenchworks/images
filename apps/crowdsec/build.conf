# crowdsec: collaborative IP blocking. The agent parses logs and detects attacks with scenarios, the local API (LAPI)
# stores decisions and serves them to bouncers. crowdsec and cscli built from the source tag with BUILD_RE2_WASM=1
# (pure-Go re2 on wazero, no C++ re2) and cgo for mattn/go-sqlite3, upstream's production SQLite driver: the
# pure-Go modernc build tag is marked untested upstream, and without either tag pkg/database does not compile.
#
# The image keeps upstream's layout and entrypoint (build/docker/docker_start.sh on bash + yq + rsync): config and the
# crowdsecurity/linux + whitelists hub content are staged under /staging at build time and copied into /etc/crowdsec
# and /var/lib/crowdsec (volumes) at start, so upstream's env interface (DISABLE_AGENT, AGENT_USERNAME, COLLECTIONS, ...)
# works unchanged. The slim variant: no notification plugins. uid 1001, LAPI on 8080, metrics on 6060.
#
# NEWEST-ONLY to start.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(1.8.2)
# sha256 of the GitHub source tarball, from a download
declare -A SHA256=(
  [1.8.2]=50da980bb6659f667e9b1d6d4948fded2b6c29402e7a88fa89c770e92b7e755c
)
# the tag's commit, stamped as BUILD_TAG (the tarball has no .git)
declare -A COMMIT=(
  [1.8.2]=3d369d64eb3e9ba770ed39aedc83ffd3170aef4c
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g; s/__COMMIT__/${COMMIT[$1]}/g"; }
