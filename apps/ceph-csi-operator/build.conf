# ceph-csi-operator (Apache-2.0): the operator that deploys and configures the Ceph CSI
# driver (cephcsi plus the CSI sidecars) from Driver/OperatorConfig resources; Rook 1.21
# installs CSI through it. Built from source (cmd/main.go, CGO off, module floors) to
# /manager like upstream's image, nonroot 1001. Newest only.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(1.1.0)
declare -A SHA256=(
  [1.1.0]=76b41d42fb53202460ac4eee941689dfc5bba638cbb5dba3843404ee31d43018
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
