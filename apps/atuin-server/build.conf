# atuin-server: the Atuin sync server (atuinsh/atuin, MIT): end-to-end encrypted shell history synced
# across machines, on SQLite or PostgreSQL. Images issue #55.
#
# From the release tag with cargo auditable, so the binary carries its crate list (upstream's release
# binary embeds none and scans blank). sqlx's native-tls links Wolfi OpenSSL. Listens on 8888 with
# ATUIN_CONFIG_DIR=/config (server.toml and the SQLite database, the volume). No TLS listener: put an
# ingress in front. busybox lets the chart pipe a password into `atuin-server admin user create`.
# LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(18.24.8)
declare -A SHA256=(
  [18.24.8]=af0741ac5b7cc7207e794036b0a19db0ad5b9838f80768436664ee3c1c5a1bb2
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
