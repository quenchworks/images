# atuin-server from the release tag, built with cargo auditable against Wolfi OpenSSL.
package:
  name: quench-atuin-server
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Atuin sync server, built from source on Wolfi"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      # cargo auditable embeds the crate list in a .dep-v0 section; without it Trivy sees no crates
      - cargo-auditable
      - openssl-dev
      - pkgconf
      - rust-1.96      # workspace rust-version 1.95

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/atuinsh/atuin/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - runs: |
      set -eu
      export CARGO_HOME="$(mktemp -d)"
      cargo auditable build --release --locked -p atuin-server --bin atuin-server
      install -Dm755 target/release/atuin-server "${{targets.destdir}}/usr/bin/atuin-server"
      # the crate list is embedded and SQLite's TLS goes through the system OpenSSL
      readelf -S "${{targets.destdir}}/usr/bin/atuin-server" | grep -q '\.dep-v0'
      readelf -d "${{targets.destdir}}/usr/bin/atuin-server" | grep -q 'libssl'
      "${{targets.destdir}}/usr/bin/atuin-server" --version | grep -F "${{package.version}}"

test:
  pipeline:
    - runs: atuin-server --version
