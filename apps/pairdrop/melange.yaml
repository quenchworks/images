# pairdrop: the release tag's server and public assets, production dependencies with overrides.
package:
  name: quench-pairdrop
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened PairDrop, packaged on Wolfi Node 24"
  copyright:
    - license: GPL-3.0-only
  dependencies:
    runtime:
      - ca-certificates-bundle
      - nodejs-24

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - nodejs-24
      - npm

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/schlagmichdoch/PairDrop/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - runs: |
      set -eu
      grep -q '"version": "${{package.version}}"' package.json
      # fixed releases on the same lines Express 4 uses (the lock's versions are vulnerable)
      node -e '
        const fs = require("fs"); const p = JSON.parse(fs.readFileSync("package.json"));
        p.dependencies.ws = "8.21.0";   // a direct dependency: npm refuses an override for it
        p.overrides = { "body-parser": "1.20.9", "path-to-regexp": "0.1.13", "qs": "6.16.1", "proxy-addr": "2.0.8" };
        fs.writeFileSync("package.json", JSON.stringify(p, null, 2));'
      rm -f package-lock.json
      export HOME="$(mktemp -d)" npm_config_cache="$(mktemp -d)"
      NODE_ENV=production npm install --omit=dev --no-audit --no-fund
      for d in body-parser:1.20.9 path-to-regexp:0.1.13 qs:6.16.1 ws:8.21.0 proxy-addr:2.0.8; do
        n="${d%%:*}"; v="$(node -p "require('./node_modules/$n/package.json').version")"
        [ "$v" = "${d#*:}" ] || { echo "$n is $v, want ${d#*:}"; exit 1; }
      done
      D="${{targets.destdir}}/usr/lib/pairdrop"
      install -d "$D"
      cp -a server public package.json node_modules LICENSE "$D/"
      chmod -R a+rX "$D"

test:
  pipeline:
    - runs: |
        test -f /usr/lib/pairdrop/server/index.js
