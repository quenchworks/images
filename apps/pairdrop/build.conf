# pairdrop: PairDrop, local file sharing in the browser (an AirDrop alternative) over WebRTC with a
# Node signaling server, from the release tag on Wolfi's Node 24 (npm install --omit=dev).
#
# 0-CVE: package-lock.json carries body-parser 1.20.3, path-to-regexp 0.1.12, qs 6.13.0, ws 8.18.1
# and proxy-addr 2.0.7; melange.yaml overrides them to their fixed releases on the same lines
# (body-parser 1.20.9, path-to-regexp 0.1.13, qs 6.16.1, ws 8.21.0, proxy-addr 2.0.8), Express 4.
#
# NEWEST-ONLY: PairDrop ships one line.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(1.11.2)
# sha256 of the GitHub source tarball, from a download
declare -A SHA256=(
  [1.11.2]=8773944d01cbb8f2ab2ab1c47f1ac3b58f16a5ddf29d702f2fb4a535f4663b06
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
