# Builds Yopass (jhaals/yopass) from the release tag onto Wolfi: yopass-server and the yopass CLI (static Go,
# CGO off), and the React web UI (website/, Vite) built with yarn in the sandbox. Node and yarn stay in the build
# sandbox; the package holds the two binaries and the static assets.
package:
  name: quench-yopass
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Yopass (one-time secret sharing server, CLI and web UI), built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-1.27          # go.mod: go 1.27.3 (15.1: 1.27.0)
      - nodejs-24
      - yarn

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/jhaals/yopass/archive/refs/tags/${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - name: Build the web UI (yarn + vite)
    runs: |
      set -eu
      export HOME="$(mktemp -d)" YARN_CACHE_FOLDER="$(mktemp -d)"
      cd website
      yarn install --frozen-lockfile --network-timeout 600000
      yarn build
      test -f dist/index.html
      install -d "${{targets.destdir}}/usr/share/yopass"
      cp -r dist "${{targets.destdir}}/usr/share/yopass/public"

  - name: Build yopass-server and the yopass CLI
    runs: |
      set -eu
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      export GOTOOLCHAIN=local
      # Only the root module ships; go.work also pulls in deploy/cdk (the AWS CDK app).
      export GOWORK=off
      # 0-CVE FLOORS, not pins (docs/go-module-float.md): raise a module only where go.mod has it below the
      # floor; a module absent from the graph is skipped. otel moves as one train (otel, metric, trace).
      FLOOR="go.opentelemetry.io/otel@v1.47.0 go.opentelemetry.io/otel/metric@v1.47.0 go.opentelemetry.io/otel/trace@v1.47.0 golang.org/x/crypto@v0.58.1-0.20261009181718-2f1f834330b2 golang.org/x/net@v0.62.0 golang.org/x/text@v0.43.0 golang.org/x/sys@v0.49.0 golang.org/x/oauth2@v0.36.0"
      # Go semver order (a release outranks its prereleases); busybox sort -V does not.
      vlt() { awk -v a="${1#v}" -v b="${2#v}" 'function pp(s,  p){sub(/\+.*/,"",s);p=index(s,"-");if(p){C=substr(s,1,p-1);P=substr(s,p+1)}else{C=s;P=""}} function cmp(x,y,  i,n,m,X,Y){n=split(x,X,".");m=split(y,Y,".");for(i=1;i<=n&&i<=m;i++){if(X[i]==Y[i])continue;if(X[i]~/^[0-9]+$/&&Y[i]~/^[0-9]+$/)return (X[i]+0<Y[i]+0)?-1:1;if(X[i]~/^[0-9]+$/)return -1;if(Y[i]~/^[0-9]+$/)return 1;return (X[i]<Y[i])?-1:1}return (n<m)?-1:(n>m)?1:0} BEGIN{pp(a);ca=C;pa=P;pp(b);cb=C;pb=P;c=cmp(ca,cb);if(c==0){if(pa==pb)c=0;else if(pa=="")c=1;else if(pb=="")c=-1;else c=cmp(pa,pb)}exit !(c<0)}'; }
      need=""
      for mv in $FLOOR; do
        have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${mv%@*}" 2>/dev/null)"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        vlt "$have" "${mv#*@}" && need="$need $mv"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || go get $need
      install -d "${{targets.destdir}}/usr/bin"
      go build -trimpath -ldflags "-s -w -X main.version=${{package.version}}" -o "${{targets.destdir}}/usr/bin/yopass-server" ./cmd/yopass-server
      go build -trimpath -ldflags "-s -w" -o "${{targets.destdir}}/usr/bin/yopass" ./cmd/yopass
      # Every floored module that reached a binary must be at or above its floor.
      for b in yopass-server yopass; do
        go version -m "${{targets.destdir}}/usr/bin/$b" | awk '$1 == "dep" || $1 == "=>" { print $2, $3 }' > deps.txt
        for mv in $FLOOR; do
          have="$(awk -v m="${mv%@*}" '$1 == m { print $2 }' deps.txt | tail -n1)"
          [ -z "$have" ] || ! vlt "$have" "${mv#*@}" || { echo "float did not reach $b: ${mv%@*} $have < ${mv#*@}"; exit 1; }
        done
      done
      rm -f deps.txt

test:
  pipeline:
    - runs: yopass --help 2>&1 | grep -q -- --api
