# Yopass (jhaals/yopass, Apache-2.0): share secrets through one-time links. The browser encrypts with OpenPGP
# before upload; the server stores only ciphertext in Memcached or Redis with an expiry. Images issue #83.
#
# From the release tag: the Go server and the yopass CLI (CGO off, -X main.version), plus the Vite web UI built
# with yarn in the build sandbox and installed as static assets in /usr/share/yopass/public. Open-core: the
# features behind a signed license key (OIDC, theming, audit log, read receipts, webhooks) stay off without one.
# Three release lines, one toolchain (go 1.27, Node 24, yarn 1).
FROM_SOURCE=1
VERSIONS=(16.0.1 16.1.0 16.2.0)
declare -A SHA256=(
  [16.1.0]=91172991ab68bc9324f51bec06dbc1a6092c226d4fcc81370a922affbd1161ca
  [16.2.0]=843c06ae7493e9ae91741a7c2a239239a1feae7f1e631efc7436874e3121dd8a
  [16.0.1]=6ac9ee0c4f6c1a9d865ef8f3ed63a66fa833dceaf625a59207dfa600045d187b
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
