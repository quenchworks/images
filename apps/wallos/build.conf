# wallos: Wallos (ellite/Wallos, GPL-3.0), a self-hosted subscription and recurring-cost tracker with currencies,
# notifications, statistics and TOTP 2FA, on SQLite. Images issue #85.
#
# From the release tarball (PHP with vendored libs, no composer). The vendored OTPHP copy predates 11.4.3: Wallos
# only calls TOTP::createFromSecret with default digits (totp.php), never a provisioning URI, and the recipe still
# backports 11.4.3's digits bound (1..10). php-8.5-fpm and QuenchWorks' nginx (upstream's deny rules) plus
# supercronic for upstream's schedule, all under supervisor, as uid 1001. The database, uploaded logos and the
# restore staging dir live on /var/lib/wallos. LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(5.11.2)
declare -A SHA256=(
  [5.11.2]=ca618007c3f38235f8a60883d2c4873ec2cc315d4e2fa99e741b055b76844008
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
