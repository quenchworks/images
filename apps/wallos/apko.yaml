# Wallos runtime: supervisord runs php-fpm (127.0.0.1:9000), QuenchWorks' nginx (:8080, upstream's deny rules)
# and supercronic (upstream's schedule) after /usr/libexec/wallos-init creates or migrates the SQLite database on
# /var/lib/wallos (the volume: db, uploaded logos, restore staging). The first account registered at
# /registration.php is the admin. Nonroot uid 1001.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - busybox
    - supervisor
    - supercronic
    - quench-nginx@local          # QuenchWorks' hardened nginx (from source), 8080/nonroot
    - quench-wallos@local
    - php-8.5
    - php-8.5-fpm
    - php-8.5-fpm-config
    - php-8.5-config
    - php-8.5-ctype
    - php-8.5-ctype-config
    - php-8.5-curl
    - php-8.5-curl-config
    - php-8.5-dom
    - php-8.5-dom-config
    - php-8.5-fileinfo
    - php-8.5-fileinfo-config
    - php-8.5-gd
    - php-8.5-gd-config
    - php-8.5-iconv
    - php-8.5-iconv-config
    - php-8.5-intl
    - php-8.5-intl-config
    - php-8.5-mbstring
    - php-8.5-mbstring-config
    - php-8.5-openssl
    - php-8.5-openssl-config
    - php-8.5-zip
    - php-8.5-zip-config

accounts:
  groups:
    - groupname: wallos
      gid: 1001
  users:
    - username: wallos
      uid: 1001
      gid: 1001
  run-as: 1001

environment:
  TZ: UTC

entrypoint:
  command: /usr/libexec/wallos-init

work-dir: /var/www/wallos

paths:
  - path: /tmp
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o1777
  - path: /var/lib
    type: directory
    uid: 0
    gid: 0
    permissions: 0o755
  - path: /var/lib/wallos
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o750

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-wallos"
  org.opencontainers.image.licenses: "GPL-3.0-or-later"
  org.opencontainers.image.version: "__VER__"
