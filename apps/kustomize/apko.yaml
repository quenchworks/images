# kustomize runtime: the kustomize CLI as the entrypoint, HOME at /home/kustomize.
# Nonroot uid 1001, multi-arch. Image only.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-kustomize@local

accounts:
  groups:
    - groupname: kustomize
      gid: 1001
  users:
    - username: kustomize
      uid: 1001
      gid: 1001
      homedir: /home/kustomize
  run-as: 1001

work-dir: /home/kustomize

environment:
  HOME: /home/kustomize

paths:
  - path: /home/kustomize
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o750

entrypoint:
  command: /usr/bin/kustomize

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-kustomize"
  org.opencontainers.image.licenses: "Apache-2.0"
