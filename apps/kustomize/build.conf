# kustomize (kubernetes-sigs/kustomize, Apache-2.0): template-free customization of Kubernetes
# manifests with bases, overlays and patches. Image only, no chart. Images issue #67.
#
# Pure Go (CGO off), built from the kustomize/ module of the release tag with GOWORK=off and
# upstream's provenance.version ldflag. Floats: the house golang.org/x floor where present.
FROM_SOURCE=1
VERSIONS=(5.8.3)
declare -A SHA256=(
  [5.8.3]=c823ae7b7e1461d82dfe7e592823796c6a98d9633cdbe33c64508b65c9911a57
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
