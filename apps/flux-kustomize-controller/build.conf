# flux-kustomize-controller: Flux's kustomize-controller, from source via melange (Go build of main.go from the git tag
# tarball). Static Go binary, no CGO. Flux ships one version of each controller per
# Flux release, so this tracks the latest only. The binary carries no version stamp.
FROM_SOURCE=1
VERSIONS=(1.9.6 1.10.1)
declare -A SHA256=(
  [1.9.6]=3deb159a89da249d70a4dee5de1d78e2ce739b00b8332b93df648c2fa77f67c2
  [1.10.1]=a275b9e247736fac23854a26f57075eb2b168245f922467227c4569e915fcf36
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
