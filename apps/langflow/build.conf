# langflow: Langflow, a visual builder for LLM applications and agent workflows (Python backend + React UI).
# From the source tag: the 19 uv workspace members installed from source, the React UI built with npm, a Python
# 3.13 venv on Wolfi's builds of every compiled dependency Wolfi carries (35, system site-packages), the rest from
# requirements.lock (--no-deps). patch-pyprojects.py: psycopg2 (Wolfi) instead of psycopg2-binary, pyarrow floor
# 25.0.1 (Wolfi's build), lfx-ibm dropped (ibm_db ships a DB2 client with its own crypto). apsw and ijson are rebuilt
# against Wolfi sqlite/yajl, Rust extensions without cargo-auditable data from sdist; the build fails on any other
# bundled native library (onnxruntime's own libonnxruntime is the one exception).
#
# 0-CVE (2026-11-24): requirements.lock (395) scans 0 findings; upstream's own set scanned 66 (pillow, filelock,
# soupsieve, dnspython).
#
# NEWEST-ONLY. Regenerating requirements.lock: see its header and images#159.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(1.13.4)
# sha256 of the GitHub source tarball, from a download
declare -A SHA256=(
  [1.13.4]=c963d472ee8c59d859d89c1145a5206c284ed5271f902175cc6ded5d76592d05
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
