# kube-state-metrics: from-source via melange (Go build from the git tag tarball).
# Image-only (a metrics exporter, no chart). Latest patch of the last 3 minor lines
# (2.17, 2.18, 2.19). Single static Go binary, CGO disabled. Version is stamped via
# -X on github.com/prometheus/common/version.Version (the prometheus/common version
# package); Branch/Revision/BuildUser/BuildDate get static, reproducible values since
# the tarball build has no git context. Tags use the upstream `v2.x.y` format.
FROM_SOURCE=1
VERSIONS=(2.18.0 2.19.1 2.20.0)
declare -A SHA256=(
  [2.18.0]=f4618cd7f234465c2ba84cf7a2dc1a20d3a082506d63894109121fb37184be11
  [2.19.1]=d62da96bd2c0497aa866f396762f1c11f3f6a066bb4e86c8168d96ddcddb9025
  [2.20.0]=d629314a4b8eaa64ef7e72ff87e0e1d2f62825b33e0cdfa37f642bc174d670f7
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
