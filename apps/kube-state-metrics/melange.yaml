# Builds kube-state-metrics from source onto Wolfi. Single static Go binary, no CGO
# (the upstream release build). The main package is the repo root. Version metadata
# is stamped via -X onto github.com/prometheus/common/version.* so
# `kube-state-metrics version` reports the real release. Branch/Revision/BuildUser/
# BuildDate get static, reproducible values (the tarball build has no git context).
# Output is a signed APK in Quenchworks' own repo. Image-only (exporter, no chart).
package:
  name: quench-kube-state-metrics
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened kube-state-metrics, built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/kubernetes/kube-state-metrics/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      # 0-CVE bump: the older tags built by the matrix (e.g. 2.17.0) pin several
      # modules Trivy flags as FIXED advisories. Force them up to their patched
      # releases before building -- x/net/x/crypto (incl. the x/crypto/ssh
      # CVE-2026-39828..35 batch), grpc, otel/sdk and go-viper/mapstructure.
      # The newest tag already ships >= these, so the bumps are no-ops there;
      # behavior-preserving minor/patch lifts on the older tags. x/net >= 0.55.0,
      # x/crypto >= 0.52.0.
      # cel-go 0.26.0 -> 0.29.2 (GHSA-gcjh-h69q-9w9g, MEDIUM: json:"-" fields
      # readable from user CEL expressions; first fixed release is 0.29.0). Only
      # reached transitively via k8s.io/apiserver's CEL libs, which do not touch
      # the API that changed in 0.29 (interpreter.NewCall is called pass-through).
      # 0-CVE FLOORS, not pins (docs/go-module-float.md): raise a module only where go.mod has it
      # below the floor; a module absent from the graph is skipped. Bare `go get` pins downgraded
      # newer upstream releases (found 2026-10-05).
      FLOOR="golang.org/x/net@v0.58.0 golang.org/x/text@v0.41.0 golang.org/x/crypto@v0.56.0 google.golang.org/grpc@v1.83.2 go.opentelemetry.io/otel/sdk@v1.45.0 go.opentelemetry.io/otel@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.45.0 github.com/go-viper/mapstructure/v2@v2.4.0 github.com/google/cel-go@v0.29.2"
      # Go semver order (a release outranks its prereleases); busybox sort -V does not.
      vlt() { awk -v a="${1#v}" -v b="${2#v}" 'function pp(s,  p){sub(/\+.*/,"",s);p=index(s,"-");if(p){C=substr(s,1,p-1);P=substr(s,p+1)}else{C=s;P=""}} function cmp(x,y,  i,n,m,X,Y){n=split(x,X,".");m=split(y,Y,".");for(i=1;i<=n&&i<=m;i++){if(X[i]==Y[i])continue;if(X[i]~/^[0-9]+$/&&Y[i]~/^[0-9]+$/)return (X[i]+0<Y[i]+0)?-1:1;if(X[i]~/^[0-9]+$/)return -1;if(Y[i]~/^[0-9]+$/)return 1;return (X[i]<Y[i])?-1:1}return (n<m)?-1:(n>m)?1:0} BEGIN{pp(a);ca=C;pa=P;pp(b);cb=C;pb=P;c=cmp(ca,cb);if(c==0){if(pa==pb)c=0;else if(pa=="")c=1;else if(pb=="")c=-1;else c=cmp(pa,pb)}exit !(c<0)}'; }
      need=""
      for mv in $FLOOR; do
        have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${mv%@*}" 2>/dev/null)"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        vlt "$have" "${mv#*@}" && need="$need $mv"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || go get $need
      go mod tidy || true
      PKG=github.com/prometheus/common
      go build -trimpath \
        -ldflags "-s -w \
          -X ${PKG}/version.Version=${{package.version}} \
          -X ${PKG}/version.Revision=unknown \
          -X ${PKG}/version.Branch=release \
          -X ${PKG}/version.BuildUser=quenchworks \
          -X ${PKG}/version.BuildDate=1970-01-01T00:00:00Z" \
        -o "${{targets.destdir}}/usr/bin/kube-state-metrics" .
