# Builds kube-state-metrics from source onto Wolfi. Single static Go binary, no CGO
# (the upstream release build). The main package is the repo root. Version metadata
# is stamped via -X onto github.com/prometheus/common/version.* so
# `kube-state-metrics version` reports the real release. Branch/Revision/BuildUser/
# BuildDate get static, reproducible values (the tarball build has no git context).
# Output is a signed APK in Quenchworks' own repo. Image-only (exporter, no chart).
package:
  name: quench-kube-state-metrics
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened kube-state-metrics, built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/kubernetes/kube-state-metrics/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      # 0-CVE bump: the older tags built by the matrix (e.g. 2.17.0) pin several
      # modules Trivy flags as FIXED advisories. Force them up to their patched
      # releases before building -- x/net/x/crypto (incl. the x/crypto/ssh
      # CVE-2026-39828..35 batch), grpc, otel/sdk and go-viper/mapstructure.
      # The newest tag already ships >= these, so the bumps are no-ops there;
      # behavior-preserving minor/patch lifts on the older tags. x/net >= 0.55.0,
      # x/crypto >= 0.52.0.
      go get \
        golang.org/x/net@v0.56.0 \
        golang.org/x/text@v0.39.0 \
        golang.org/x/crypto@v0.53.0 \
        google.golang.org/grpc@v1.79.3 \
        go.opentelemetry.io/otel/sdk@v1.43.0 \
        go.opentelemetry.io/otel@v1.43.0 \
        github.com/go-viper/mapstructure/v2@v2.4.0
      go mod tidy || true
      PKG=github.com/prometheus/common
      go build -trimpath \
        -ldflags "-s -w \
          -X ${PKG}/version.Version=${{package.version}} \
          -X ${PKG}/version.Revision=unknown \
          -X ${PKG}/version.Branch=release \
          -X ${PKG}/version.BuildUser=quenchworks \
          -X ${PKG}/version.BuildDate=1970-01-01T00:00:00Z" \
        -o "${{targets.destdir}}/usr/bin/kube-state-metrics" .
