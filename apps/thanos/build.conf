# thanos: from-source via melange (Go build, git-checkout pinned per release).
# Latest 3 stable minor lines, newest patch each. Each release pins its git commit
# (the dereferenced commit the annotated vX.Y.Z tag points at).
FROM_SOURCE=1
VERSIONS=(0.39.2 0.40.1 0.41.0)
declare -A COMMIT=(
  [0.39.2]=36681afb5eb001b1658fd85bd2cc900b55cce1bc
  [0.40.1]=8b0e81bde4fe5fdc8f56db5e4888976054045900
  [0.41.0]=cb1396b916241f63fff75e4f5362ea65f18f2303
)
render() { echo "s/__VER__/$1/g; s/__COMMIT__/${COMMIT[$1]}/g"; }
