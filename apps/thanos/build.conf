# PORTED 2026-07-13: v0.42.0 now builds 0-CVE. The blocker was the pinned
# github.com/prometheus/prometheus v0.309.1 (< fix line), which carried:
#   CVE-2026-42151 (HIGH, Azure OAuth secret disclosure via config API)
#   CVE-2026-42154 (HIGH, remote-read DoS via uncontrolled memory allocation)
#   CVE-2026-44903 (HIGH)
#   CVE-2026-40179 (MEDIUM, stored XSS via metric names/label values)
# all fixed only in prometheus >= 0.311.3. We force prometheus v0.312.0 and port
# the API breaks in-tree (see melange.yaml's source-port block for the full list).
# The 2026-07-09 note called this a "pervasive" break; with -tags slicelabels (an
# upstream-supported build mode that keeps the slice-based labels.Labels layout)
# the feared labels rewrite disappears and the remaining breaks are all mechanical:
#   * promql parser refactor -> parser.NewParser(parser.Options{}).Parse* methods;
#     x-functions registered into the global parser.Functions table; experimental
#     gating threaded via a process-wide flag in promql-engine's parse package.
#   * tsdb/errors pkg REMOVED -> in-tree verbatim shim (pkg/promtsdberrors).
#   * chunkenc.Iterator gained AtST() (added, returns 0 = unset); chunkenc.Appender
#     Append/AppendHistogram/AppendFloatHistogram gained a leading start-ts (pass 0).
#   * relabel.Process REMOVED -> relabel.ProcessBuilder; rulefmt.Rule.Validate gained
#     a parser.Parser arg; promql.BucketQuantile now returns 6 values + annotation
#     sig grew; promql-engine api.RemoteEndpoints.Engines gained (mint,maxt).
# Third-party deps that still used the old prometheus API:
#   * prom-label-proxy v0.11.1 -> v0.14.0 (targets prometheus v0.312.0): clean bump.
#   * promql-engine: its newest commit still targets prometheus v0.308.0, so its 3
#     call sites are patched in a local vendored copy wired in via a go.mod replace.
# GATE: `PUSH=0 ARCHES=x86_64 scripts/build-image.sh thanos` => "✅ 0 fixable CVEs"
#   (gobinary 0, wolfi 0; comprehensive Trivy, isolated cache). Version stamps
#   0.42.0; `thanos --version` + `thanos query --help` pass. x86_64 gated locally;
#   pure-Go static netgo binary => aarch64 shares the same CVE surface.
# STATUS 2026-08-27: PUBLISH APPROVED by the owner and listed in the catalog. Recipe
#   user approves (and the standing aarch64 local-gate + public-toggle policy is met).
#
# thanos: from-source via melange (Go build, git-checkout pinned per release).
# Each release pins its git commit (the dereferenced commit the annotated tag points at).
FROM_SOURCE=1
VERSIONS=(0.42.4)
declare -A COMMIT=(
  [0.42.3]=b2b2b53574b0e418be888e09f18ecb8076fe78ad
  [0.42.4]=97388d74247a49e35ca2ebc28f31bf635753f91b
)
render() { echo "s/__VER__/$1/g; s/__COMMIT__/${COMMIT[$1]}/g"; }
