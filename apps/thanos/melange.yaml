# Builds Thanos from source onto Wolfi. Single static Go binary (CGO disabled,
# netgo), multi-arch. Output is a signed APK in Quenchworks' own repo. No upstream
# distro binaries.
#
# Thanos is a set of components that turn Prometheus into a highly-available,
# long-term-storage metrics system backed by object storage (a CNCF project). It
# ships as ONE binary, `thanos`, with subcommands (query, store, compact, sidecar,
# receive, rule, ...). It has NO bundled JS web UI build step -- the small status
# UIs are committed Go-embedded assets in the tree -- so there is no Node toolchain.
#
# Thanos does NOT vendor its dependencies (no vendor/), so we build with -mod=mod
# and let the Go module cache fetch deps in the build sandbox. We build from the
# pinned git tag (git-checkout, verified by the dereferenced commit) rather than the
# codeload tarball.
#
# SOURCE PORT (2026-07-13): thanos v0.42.0 pins prometheus v0.309.1, which is below
# the CVE fix line. We force prometheus v0.312.0 (clears CVE-2026-42151/42154 HIGH,
# 44903/40179 MED) and port the resulting API breaks in-tree. The port is mechanical
# and does NOT weaken the gate (no ignore-list); each edit maps 1:1 to an upstream
# prometheus API change, applied as a base64-embedded patch (base64 keeps the
# whitespace-sensitive patch context intact through YAML). The break classes:
#   * promql parser refactor: parser.NewParser now takes parser.Options (was
#     (string, ...WithFunctions)); ParseExpr/ParseMetricSelector are methods on the
#     returned Parser; the package-level parser.EnableExperimentalFunctions and
#     parser.WithFunctions were removed. Extended (x*) functions are registered into
#     the global parser.Functions table (thanos already does this for the frontend /
#     rule commands); experimental-function gating is threaded via a process-wide
#     flag in promql-engine's parse package. (pkg/extpromql, cmd/thanos/*)
#   * tsdb/errors package REMOVED: replaced with an in-tree verbatim shim
#     (pkg/promtsdberrors), repointing the 4 importers.
#   * chunkenc.Iterator gained AtST() int64 (created/start timestamp) -- added to
#     thanos' iterator impls, returning 0 (== unset, matching prometheus'
#     xorIterator/nopIterator).
#   * chunkenc.Appender.Append/AppendHistogram/AppendFloatHistogram gained a leading
#     start-timestamp arg -- pass 0 (unset), preserving prior behaviour.
#   * model/relabel.Process REMOVED: rewritten to relabel.ProcessBuilder (mutates a
#     labels.Builder in place, returns the keep flag).
#   * rulefmt.Rule.Validate gained a parser.Parser arg; promql.BucketQuantile now
#     returns 6 values and annotations.NewHistogramQuantileForcedMonotonicityInfo
#     grew ts/min/max/maxDiff args; promql-engine api.RemoteEndpoints.Engines gained
#     (mint,maxt int64).
# Two third-party deps also had to move off the old prometheus API:
#   * prom-label-proxy v0.11.1 -> v0.14.0 (which targets prometheus v0.312.0) -- a
#     clean version bump, no source patch.
#   * promql-engine: its newest commit still targets prometheus v0.308.0, so its 3
#     call sites (BucketQuantile / forced-monotonicity annotation, and the two
#     WithFunctions parser calls) are patched in a local vendored copy wired in with
#     a go.mod replace. Not a fork of thanos; a minimal compat patch of a dep.
#
# Version is stamped exactly like upstream's promu build (.promu.yml): the ldflags
# set the github.com/prometheus/common/version package vars, so `thanos --version`
# reports the pinned release. Build tags netgo,slicelabels match .promu.yml;
# slicelabels also keeps prometheus' slice-based labels.Labels layout (an
# upstream-supported build mode), avoiding the struct-labels rewrite.
package:
  name: quench-thanos
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Thanos (highly-available Prometheus with long-term object-storage), built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      # git: for the git-checkout below and for `git apply` of the source-port patch.
      - git
      # go.mod declares go 1.25; .promu.yml pins the toolchain to 1.25. Use go-1.26
      # (newest, clears stdlib CVE advisories) with GOTOOLCHAIN=local so go.mod's
      # 1.25 directive does not trigger a toolchain download.
      - go-1.26

pipeline:
  # git-checkout, not fetch: building from the pinned git tag avoids the slow
  # codeload.github.com CDN (the source tree is ~30 MB) and is the robust source.
  # git-checkout verifies the dereferenced commit, not the annotated tag object.
  - uses: git-checkout
    with:
      repository: https://github.com/thanos-io/thanos
      tag: v${{package.version}}
      expected-commit: __COMMIT__

  - name: Build the thanos binary (static, CGO off, netgo+slicelabels)
    runs: |
      set -eu
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      export GOTOOLCHAIN=local      # use the installed go-1.26, do not fetch go.mod's 1.25
      export GO111MODULE=on

