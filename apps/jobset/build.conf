# JobSet (a group of Kubernetes Jobs run as one unit, the substrate Kubeflow Trainer runs every
# TrainJob on), from kubernetes-sigs/jobset (Apache-2.0). From the release tag via melange: the
# controller, one static Go binary at /manager like upstream's image, version stamped with
# -X sigs.k8s.io/jobset/pkg/version.GitVersion as in the Makefile, with the house golang.org/x floor.
# LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(0.13.0)
declare -A SHA256=(
  [0.13.0]=97a6e5a231e9c647a96a0672ecf0d1124f5ec20a36b82097b12236897da4622f
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
