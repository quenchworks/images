# homer: Homer, a static application dashboard (start page) configured from one YAML file, built
# from the source tag with pnpm (vite) and served by nginx as nonroot on 8080.
#
# 0-CVE: pnpm-lock.yaml scanned 0 findings at v26.11.4 (2026-11-23). Built from source rather than
# the release's prebuilt homer.zip, so the shipped bundle comes from the scanned lockfile.
#
# NEWEST-ONLY: Homer ships one line.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(26.11.4)
# sha256 of the GitHub source tarball, from a download
declare -A SHA256=(
  [26.11.4]=573ab947b1ea10fb4d1ada0d581206ac4aa353c6687213d48d038531ad2d7487
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
