# linkerd-policy-controller (linkerd/linkerd2 monorepo, policy-controller/):
# from-source Rust build via melange. Confirmed by reading the source, not
# assumed: policy-controller/Cargo.toml -> package name
# `linkerd-policy-controller`, [[bin]] default binary path
# policy-controller/src/main.rs, no explicit [[bin]] override -- cargo's
# default bin name is the package name, matching what
# Dockerfile.controller's own build actually moves out:
#   `mv target/$target/$BUILD_TYPE/linkerd-policy-controller /out/`
#
# WHY THIS IS NOT AN "istio-proxyv2 SHAPE" RISK (checked explicitly, per the
# task's warning about Linkerd Proxy applying just as much scrutiny here):
# meshtls in this crate is `rustls` with the `aws-lc-rs` crypto provider
# (linkerd/meshtls/Cargo.toml: `tokio-rustls = { features = ["aws-lc-rs"] }`,
# main.rs installs `rustls::crypto::aws_lc_rs::default_provider()`). aws-lc-rs
# compiles its OWN vendored copy of AWS-LC's C/assembly source as part of the
# normal `cargo build` -- but unlike Cosmian KMS's build.rs (which downloads a
# SPECIFIC, PINNED, already-superseded OpenSSL 3.6.2 tarball from
# package.cosmian.com, bypassing Cargo.lock entirely), aws-lc-rs's vendored
# source ships INSIDE the aws-lc-sys crate itself and is version-pinned by
# Cargo.lock like any other dependency: a security fix means bumping the
# aws-lc-rs/aws-lc-sys crate version in Cargo.lock, the same way any other Rust
# dependency gets patched, not chasing a hardcoded external download URL. This
# is an ordinary Rust supply-chain surface, not the "vendored-forever-stale-
# tarball" trap. (Whether Trivy's Rust scanning actually reaches into this
# binary depends on whether it's built with `cargo auditable` -- see
# melange.yaml for that decision and the residual risk if it's ever dropped.)
#
# There is also a small `openssl = { version = "0.10.80", optional = true }`
# dependency in policy-controller/runtime/Cargo.toml -- NOT enabled by any
# feature this binary's [dependencies.kubert]/[dependencies.kube] sections
# turn on (kube uses `rustls-tls`, kubert uses `aws-lc-rs`), so it should not
# be compiled in. Flagged here so a future bump that changes that wiring gets
# noticed rather than silently pulling in a second TLS stack.
#
# Same monorepo tag/tarball/sha256 as linkerd-control-plane (see that app's
# build.conf for the edge-vs-stable release-cadence verification -- not
# repeated here). Rust toolchain: rust-toolchain.toml at ALL THREE tags reads
# channel = "1.90.0" (checked per-tag, not just on main) -- Wolfi ships
# rust-1.90 (confirmed: `python3 scripts/wolfi-latest.py --match rust`).
FROM_SOURCE=1
VERSIONS=(26.6.3 26.7.2 26.8.4)
declare -A SHA256=(
  [26.6.3]=b0cf9482bdc652db95cbfea326ddc8791ae58b87eeaec6a1a918002c0a015937
  [26.7.2]=26d57d8ef51365ed48f4e57f6f0096911ca8d4955f3ad47002fb8667d8f3da39
  [26.8.4]=35b7537c190508944f8d738c22855e8214cbce7b39a19b9a38850bb1758b17d7
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
