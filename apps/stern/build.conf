# stern (stern/stern, Apache-2.0): tails logs from many Kubernetes pods and containers at once, color-coded, with regex and label selectors. Image only, no chart.
#
# From the release tag with the house Go floors and the otel 1.47 family loop (the cosign recipe), version
# stamped like upstream's goreleaser. LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(1.35.0)
declare -A SHA256=(
  [1.35.0]=c75ba288b84379a39cffd2e4d27d5cb1d46643f9f7810a391670844727051006
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
