# MediaMTX (bluenviron): from-source via melange (Go build from the git tag
# tarball). Image-only (a media server, no chart). Latest patch of the last 3
# minor lines (1.17, 1.18, 1.19). Single static Go binary, CGO disabled.
# The version is embedded via internal/core/VERSION (upstream uses //go:embed on
# a file that its `versiongetter` generator derives from git). A source tarball
# has no .git, so we write that VERSION file ourselves as v<version>. Upstream
# tags carry a "v" prefix.
FROM_SOURCE=1
VERSIONS=(1.17.1 1.18.2 1.19.2)
declare -A SHA256=(
  [1.17.1]=0021f1c418856fb338fcd40f5fb514a18c104557b9ff6e8702f750a263366cf7
  [1.18.2]=d10314279d88e62d2a048b740a1417ca57fcc3fde30032e2a5b56d2f48742fe0
  [1.19.2]=cd1350ec0b815e304a316a6e65accf12fcf55dabe2f956f725c0a8b4fe424cc7
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
