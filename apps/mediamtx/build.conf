# MediaMTX (bluenviron): from-source via melange (Go build from the git tag
# tarball). Image-only (a media server, no chart). NEWEST-ONLY: the single newest
# stable tag. Single static Go binary, CGO disabled.
# The version is embedded via internal/core/VERSION (upstream uses //go:embed on
# a file that its `versiongetter` generator derives from git). A source tarball
# has no .git, so we write that VERSION file ourselves as v<version>. Upstream
# tags carry a "v" prefix.
FROM_SOURCE=1
# 1.19.3 (2026-07-26): clears CVE-2026-57497 -- this release's go.mod requires
# quic-go/webtransport-go v0.11.1 (the fixed release; 1.19.2 was on v0.11.0). It also
# already carries x/text v0.40.0 (so the melange float was raised to match).
# 1.20.1 (2026-08-31): go.mod already requires x/text v0.41.0 and go-git v5.19.2,
# i.e. exactly the two float floors, so no floor inverted. The bare `go get` was
# converted to the house FLOOR/below_floor pattern with a shipped-binary assertion.
VERSIONS=(1.21.0)
declare -A SHA256=(
  [1.21.0]=3472b7a3fd907b4652655a443c9dce333ca49472112e6176c19bd524542442ae
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
