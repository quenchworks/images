# STATUS 2026-09-17: the published 1.4.1 image is 0-CVE and DOES NOT RUN.
# Not blocked, because the CVE gate passes. The chart install gate is what
# catches it, and it has been red since 2026-09-14.
#
# The pod reaches CrashLoopBackOff. Diagnosed from the release-cadence install
# gate (charts run 35191784983), 0.4s after every service starts cleanly:
#
#   PollForDecisionTask failed.
#   error: header has more than one value: grpc-accept-encoding:[gzip gzip]
#     frontend/api/handler.go:514
#
# YARPC rejects duplicate headers. The internal worker treats that as
# non-retriable and shuts down, the Cassandra session closes, and
# ensureDomainExists then fatals on "session has been closed". That fatal is
# the symptom everyone sees first; the duplicate header is the cause.
#
# Cause is our own 0-CVE float. b69c98e (2026-09-06) raised
# google.golang.org/grpc to 1.83.2 for GHSA-hrxh-6v49-42gf, and newer grpc-go
# sets grpc-accept-encoding itself while cadence's YARPC transport also sets it.
# Timeline fits: gate green 2026-08-31, float 09-06, first failure on the first
# rebuild after it, 09-14.
#
# So this is 0-CVE versus working, and the gate does not bend. Do NOT drop the
# grpc floor to make the chart go green; that reintroduces a real HTTP/2 xDS
# RBAC advisory. The fix is to stop the duplicate header, either by a patch in
# this recipe or by an upstream cadence release that handles current grpc-go.
# Until then the chart correctly refuses to release, and the live image should
# be treated as not working.
# cadence (Uber): from-source via melange (Go build from the git tag tarball).
# Workflow-orchestration engine server. Image-only (server + CLI, no chart).
# NEWEST-ONLY: the single latest stable release from github.com/uber/cadence
# release tags (vX.Y.Z; prereleases excluded). One source tarball, one sha256.
# Two static Go binaries, CGO disabled:
#   cadence-server  <- cmd/server        (separate go module, tied via go.work)
#   cadence         <- cmd/tools/cli      (root module CLI)
# Version is stamped via -X common/metrics.ReleaseVersion (per upstream
# scripts/get-ldflags.sh), so `cadence-server --version` reports the real tag.
# Built on go-1.25 (>= 1.25.11): the upstream `go 1.24` line no longer gets
# stdlib security patches and fails the 0-CVE gate. See melange.yaml for details.
FROM_SOURCE=1
VERSIONS=(1.4.1)
declare -A SHA256=(
  [1.4.1]=de30dce48f247a9435f700604f8cd099914b33c3a400c51c8d769731860c3320
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
