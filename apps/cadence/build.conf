# STATUS 2026-09-17, RESOLVED: builds 0-CVE and runs. The chart install gate is
# green again (charts run 35199859981) for the first time since 2026-09-14.
# Published digest sha256:8ad05bc1f3924b3880fc4ae46817b1fea5743a1d23d2cd8fcca039750fb60df0.
#
# What was wrong, kept because the symptom is misleading. Our own grpc float to
# 1.83.2 (GHSA-hrxh-6v49-42gf) made newer grpc-go set grpc-accept-encoding while
# yarpc's transport set it too. yarpc rejects any header with more than one
# value, so every Poll failed with
#
#   header has more than one value: grpc-accept-encoding:[gzip gzip]
#
# the internal worker called that non-retriable and shut down, the Cassandra
# session closed, and ensureDomainExists then fatalled on "session has been
# closed". People find that fatal first and chase Cassandra. It is a symptom.
#
# Fix: the melange pipeline carries yarpc-go PR 2549 against the resolved yarpc
# version, taking the first value for grpc-accept-encoding only and leaving every
# other duplicated header erroring. The replace is applied to all three workspace
# modules, as the thrift one is. Drop the local patch and floor yarpc instead the
# moment 2549 merges and ships; the recipe asserts both patch sites rewrote, so a
# silently-missed patch fails the build rather than shipping the crash.
#
# Neither gate was weakened to get here: grpc stays at 1.83.2.
FROM_SOURCE=1
VERSIONS=(1.4.1)
declare -A SHA256=(
  [1.4.1]=de30dce48f247a9435f700604f8cd099914b33c3a400c51c8d769731860c3320
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
