# zitadel: image-only recipe input (the chart is authored in the charts repo).
# ZITADEL is a Go IAM/OIDC server with an embedded Angular console baked into the
# binary via go:embed; a from-source build needs a Node/Angular toolchain and is
# infeasible in CI. Instead we ship ZITADEL's OWN official prebuilt server binary
# from the GitHub release (the same upstream-artifact pattern clickhouse/mattermost
# use), then harden it on a minimal apko base and gate it 0-CVE with Trivy. This is
# clean-room-consistent: it is upstream's published artifact, not a Bitnami chart.
#
# Versions = newest patch of the last 3 v4 minor lines, dual-arch. Release tags are
# vX.Y.Z; the asset filename carries NO version, only the arch:
#   https://github.com/zitadel/zitadel/releases/download/v<VER>/zitadel-linux-<arch>.tar.gz
# where <arch> is amd64 or arm64. Each version ships an amd64 and an arm64 tarball,
# each with its own sha256:
#   __VER__     = version (bare X.Y.Z; the leading `v` is added in the fetch URL)
#   __SHA_AMD__ = zitadel-linux-amd64.tar.gz sha256
#   __SHA_ARM__ = zitadel-linux-arm64.tar.gz sha256
FROM_SOURCE=0
VERSIONS=(4.13.1 4.14.0 4.15.3)
declare -A SHA_AMD=(
  [4.13.1]=fe1f5231e5dcbdca63ae77adab0d2241daafeb9712e7d6cded3713e9ef50f1cb
  [4.14.0]=bddfb01ebb706854e959cb4fd3e8ff747208e2bf1011e835ffd514485b1ab7b1
  [4.15.3]=5efc4eea7e4bf11d193cedfe976a1aa32e0d15b9076897460ac6a4a01290a6d0
)
declare -A SHA_ARM=(
  [4.13.1]=81c3feeae3fadb01f4836fb279a895ac871019cfae61c1f668d369749a094458
  [4.14.0]=a9f8b8d6cb37f266e75cce7f641716ba3d792246715b51b10f453499ed5f91d3
  [4.15.3]=558f799175bcba00e33617ec9211cdc4826eda8de3343ea54440eb2a2eb0df2f
)
render() {
  echo "s/__VER__/$1/g; s|__SHA_AMD__|${SHA_AMD[$1]}|g; s|__SHA_ARM__|${SHA_ARM[$1]}|g"
}
