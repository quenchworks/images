# STATUS: BLOCKED (do not publish)
# The 0-CVE Trivy gate FAILS on the newest release (v4.15.3) with 37 fixable CVEs,
# ALL in the upstream prebuilt gobinary (usr/bin/zitadel). This recipe is FROM_SOURCE=0:
# it ships ZITADEL's OWN official prebuilt static Go binary from the GitHub release.
# There is NO local Go module tree here, so `go get <mod>@<fixed> && go mod tidy` CANNOT
# be applied -- the flagged modules AND the Go toolchain are baked into upstream's binary.
# Fixing requires recompiling ZITADEL from source with bumped modules + a newer Go, which
# needs the Node/Angular console toolchain (go:embed) that this recipe documents as
# infeasible in CI (that is WHY it ships the prebuilt binary). v4.15.3 is already the
# newest v4 release (v5.0.0-base is a pre-release base tag), so there is no newer patch to
# adopt. This is a fork / from-source rebuild, not a minimal same-major bump -> BLOCKED
# until upstream publishes a release compiled with the patched deps + Go toolchain.
#
# Flagged (module  installed -> fixed  : representative CVEs):
#   github.com/gorilla/csrf  v1.7.2  -> 1.7.3           : CVE-2025-24358
#   golang.org/x/crypto      v0.50.0 -> 0.52.0          : CVE-2026-39827/39828/39829/39830/
#                                                          39831/39832/39833/39834/39835/
#                                                          42508/46595/46597/46598 (ssh)
#   golang.org/x/net         v0.53.0 -> 0.55.0          : CVE-2026-25680/25681/27136/39821/
#                                                          42502/42506 (html,idna)
#   stdlib (Go toolchain)    v1.25.8 -> 1.25.11/1.26.4  : CVE-2026-27145/32280/32281/32282/
#                                                          32283/32288/32289/33811/33814/
#                                                          39820/39823/39825/39826/39836/
#                                                          42499/42504/42507 (crypto/x509,
#                                                          crypto/tls,net,net/mail,net/http,
#                                                          html/template,archive/tar,textproto)
#
# zitadel: image-only recipe input (the chart is authored in the charts repo).
# ZITADEL is a Go IAM/OIDC server with an embedded Angular console baked into the
# binary via go:embed; a from-source build needs a Node/Angular toolchain and is
# infeasible in CI. Instead we ship ZITADEL's OWN official prebuilt server binary
# from the GitHub release (the same upstream-artifact pattern clickhouse/mattermost
# use), then harden it on a minimal apko base and gate it 0-CVE with Trivy. This is
# clean-room-consistent: it is upstream's published artifact, not a Bitnami chart.
#
# Versions = newest v4 patch only (trimmed from the last-3-minors set to newest-only).
# Release tags are vX.Y.Z; the asset filename carries NO version, only the arch:
#   https://github.com/zitadel/zitadel/releases/download/v<VER>/zitadel-linux-<arch>.tar.gz
# where <arch> is amd64 or arm64. Each version ships an amd64 and an arm64 tarball,
# each with its own sha256:
#   __VER__     = version (bare X.Y.Z; the leading `v` is added in the fetch URL)
#   __SHA_AMD__ = zitadel-linux-amd64.tar.gz sha256
#   __SHA_ARM__ = zitadel-linux-arm64.tar.gz sha256
FROM_SOURCE=0
VERSIONS=(4.15.3)
declare -A SHA_AMD=(
  [4.15.3]=5efc4eea7e4bf11d193cedfe976a1aa32e0d15b9076897460ac6a4a01290a6d0
)
declare -A SHA_ARM=(
  [4.15.3]=558f799175bcba00e33617ec9211cdc4826eda8de3343ea54440eb2a2eb0df2f
)
render() {
  echo "s/__VER__/$1/g; s|__SHA_AMD__|${SHA_AMD[$1]}|g; s|__SHA_ARM__|${SHA_ARM[$1]}|g"
}
