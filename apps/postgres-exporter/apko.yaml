# Assembles the postgres_exporter runtime image. Minimal, nonroot, multi-arch.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-postgres-exporter@local

accounts:
  groups:
    - groupname: exporter
      gid: 1001
  users:
    - username: exporter
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/bin/postgres_exporter

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quenchworks.mkabumattar.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-postgres-exporter"
  org.opencontainers.image.licenses: "Apache-2.0"
