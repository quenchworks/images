# Builds the postgres_exporter Prometheus exporter from source onto Wolfi.
# Used as the hardened metrics sidecar for the postgresql chart.
package:
  name: quench-postgres-exporter
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened postgres_exporter, built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/prometheus-community/postgres_exporter/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      # 0-CVE gate: minor/patch dep bumps (same major) to clear Trivy findings
      # in the exporter binary, then tidy. Transitive bumps only -- no forks,
      # no major bumps, no `replace`.
      go get golang.org/x/crypto@v0.56.0
      go get golang.org/x/net@v0.58.0 golang.org/x/text@v0.41.0
      go mod tidy
      go build -trimpath \
        -ldflags "-s -w -X github.com/prometheus/common/version.Version=${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/postgres_exporter" ./cmd/postgres_exporter
  # The exporter user is provided by apko (accounts), not the package, to avoid
  # conflicting with wolfi-baselayout's /etc files.

test:
  pipeline:
    - runs: postgres_exporter --version
