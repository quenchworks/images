# postgres-exporter: from-source via melange (Go build of prometheus-community/
# postgres_exporter). Latest 3 stable minor lines, newest patch each. Each release
# pins its source tarball by sha256.
FROM_SOURCE=1
VERSIONS=(0.20.1 0.21.1)
declare -A SHA256=(
  [0.20.1]=be5d9b71cdedcc5bd484869a2a1c66e51f76d5620ebf681781f22acc0cba283b
  [0.21.1]=e7327b6a500a6b08c78bf1f94b66132b6b0d19717738d42b8bb53f7586227ba5
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
