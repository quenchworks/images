# postgres-exporter: from-source via melange (Go build of prometheus-community/
# postgres_exporter). Latest 3 stable minor lines, newest patch each. Each release
# pins its source tarball by sha256.
FROM_SOURCE=1
VERSIONS=(0.19.0 0.19.1 0.20.0)
declare -A SHA256=(
  [0.19.0]=bacaeefd4426b67a5f1c86cd5ad58995eb9c54471ab9941e37e754af16801c6f
  [0.19.1]=4b71d7d7950aac017df6ec41e815cbb3f50c20e23b19d82fe367eda9e8447a5c
  [0.20.0]=d164e03a00e7e9ef1b6c39dd0283549c11649afcb1829d968d0fd979cec958e8
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
