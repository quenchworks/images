# Shiori (go-shiori/shiori, MIT): bookmark manager with readable offline archives, a web UI, a REST
# API and a CLI. From source via melange: one CGO-free Go binary (modernc sqlite; MySQL and
# PostgreSQL drivers built in) with the committed web assets embedded.
# imaging 1.6.2 (CVE-2023-36308, no upstream fix) is patched at build time; see melange.yaml.
# LATEST-ONLY: one release line.
FROM_SOURCE=1
VERSIONS=(1.8.0)
declare -A SHA256=(
  [1.8.0]=e172010728b5d8142100a402b5b2d065471920b6bcc1b742ba9755f3be26ff2e
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
