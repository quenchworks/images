# Shiori from the release tag with upstream's goreleaser flags (CGO off, netgo/osusergo tags).
package:
  name: quench-shiori
  version: __VER__
  epoch: 1
  description: "Quenchworks hardened Shiori bookmark manager, built from source on Wolfi"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.26

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/go-shiori/shiori/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - runs: |
      set -eu
      export CGO_ENABLED=0 GOTOOLCHAIN=local GOFLAGS=-mod=mod
      # floors, raised only when below (a bare go get downgrades once upstream passes it)
      FLOOR="golang.org/x/crypto@v0.58.1-0.20261009181718-2f1f834330b2 golang.org/x/net@v0.62.0 golang.org/x/text@v0.43.0 golang.org/x/sys@v0.49.0 golang.org/x/image@v0.47.0 github.com/golang-jwt/jwt/v5@v5.3.1 filippo.io/edwards25519@v1.1.1"
      need=""
      for f in $FLOOR; do
        have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${f%@*}")"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        [ "$(printf '%s\n%s\n' "$have" "${f#*@}" | sort -V | head -1)" = "${f#*@}" ] || need="$need $f"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || go get $need
      go mod tidy
      # Upstream creates the first owner as shiori/gopher with no way to change it before the
      # server is reachable. Take it from SHIORI_INITIAL_USERNAME / SHIORI_INITIAL_PASSWORD
      # (first start only, defaults unchanged) so the chart can set a generated password.
      sed -i 's|Username: "shiori",|Username: quenchEnvOr("SHIORI_INITIAL_USERNAME", "shiori"),|; s|Password: "gopher",|Password: quenchEnvOr("SHIORI_INITIAL_PASSWORD", "gopher"),|' internal/cmd/root.go
      printf '\nfunc quenchEnvOr(k, d string) string {\n\tif v := os.Getenv(k); v != "" {\n\t\treturn v\n\t}\n\treturn d\n}\n' >> internal/cmd/root.go
      grep -c 'quenchEnvOr("SHIORI_INITIAL_' internal/cmd/root.go | grep -qx 2
      # CVE-2023-36308: imaging 1.6.2 (no fixed release, upstream inactive since 2020) indexes its
      # palette table with raw pixel values. Before x/image v0.41.0, x/image/bmp (registered by
      # imaging) returned Paletted images with indexes past the palette, and a crafted thumbnail
      # panicked a goroutine and killed the server. The x/image floor above rejects those at decode;
      # this also sizes imaging's table for every uint8 index in case another decoder ever does.
      go mod vendor
      sc=vendor/github.com/disintegration/imaging/scanner.go
      sed -i 's/s\.palette = make(\[\]color\.NRGBA, len(img\.Palette))/s.palette = make([]color.NRGBA, 256+len(img.Palette))/' "$sc"
      grep -q '256+len(img.Palette)' "$sc"
      go build -mod=vendor -trimpath -tags netgo,osusergo \
        -ldflags "-s -w -X main.version=${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/shiori" .
      "${{targets.destdir}}/usr/bin/shiori" version 2>&1 | grep -F "${{package.version}}"

test:
  pipeline:
    - runs: |
        shiori version
