# falcosidekick: forwards Falco alerts to chat, logs, SIEM, cloud and webhook outputs (60+), with Prometheus metrics.
# Single static Go binary built from the source tag (main package at the repo root; version stamped on
# main.GitVersion as upstream's Makefile does). Nonroot (1001), port 2801. Pairs with Falco.
#
# NEWEST-ONLY to start; widen when a chart pins an older line.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(2.35.1)
# sha256 of the GitHub source tarball, from a download
declare -A SHA256=(
  [2.35.1]=9efb27f329e128cfa89fc176e65963ad183ecf05b19c1ee0333e4af1fd25fd8c
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
