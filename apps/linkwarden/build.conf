# linkwarden: Linkwarden (linkwarden/linkwarden, AGPL-3.0), collaborative bookmarks that archive each page as a
# screenshot, PDF and single HTML file. Images issue #101.
#
# From the release tag: yarn 4 (corepack) workspaces focus on web + worker, prisma generate, the Next.js build, then a
# production focus. The worker drives Wolfi chromium through Playwright (PLAYWRIGHT_LAUNCH_OPTIONS_EXECUTABLE_PATH, no
# browser download) and runs monolith, built here from its crates.io release with cargo auditable. Node 24.
# LATEST-ONLY: one release line.
# HELD 2026-11-17: every archive format goes through Chromium (the worker opens each page in a browser context), and
#   public Wolfi chromium has been frozen at 149.0.7827.53-r0 (built 2026-06-05) since the 2026-06-08 move-batch, with
#   1608 fixable findings (fixes in 149.0.7827.102+ / 150.x are not public). Same wall as gotenberg. Playwright's own
#   chromium-headless-shell would pass the gate only because Trivy cannot see inside it: rejected. Also open, both
#   solvable: tsx's bundled esbuild (Go stdlib CVEs: compile the worker at build and drop tsx) and 9 npm packages
#   (file-type 21 ESM-only, glob 14, minimatch 11, phin 3, xml2js 0.5, postcss, qs, yaml, @ai-sdk/provider-utils).
#   Re-check when a scannable Chromium source exists.
FROM_SOURCE=1
BLOCKED=1
BLOCKED_BY=chromium-frozen-in-public-wolfi
VERSIONS=(2.17.0)
declare -A SHA256=(
  [2.17.0]=93d3dbcd102786ee77adfb27c4b5f7a7d4b5bf7f68f600377d7306700e13c472
)
MONOLITH=2.11.7
MONOLITH_SHA256=68759ef72e44588c2610d677dd2048a0a8bea5bc059cdbbec5ff606f375381d7
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g; s/__MONOLITH__/$MONOLITH/g; s|__MONOLITH_SHA256__|$MONOLITH_SHA256|g"; }
