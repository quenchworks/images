# nessie: Project Nessie, the transactional catalog for data lakehouse tables (Git-like
# branches and commits over Iceberg metadata, plus the Iceberg REST catalog API), from the
# official Quarkus uber-jar release on a Wolfi openjdk-21-jre.
#
# 0-CVE: trivy against the 0.108.8 runner jar found 455 libraries and 0 fixable findings
# (measured 2026-09-25).
#
# NEWEST-ONLY: the runner is a single uber-jar, so a library cannot be swapped, and the
# older lines carry findings (0.107.9: 26, 0.106.2: 43, mostly netty 4.1 and jackson).
BLOCKED=0
FROM_SOURCE=0
VERSIONS=(0.108.8)
# sha256 of nessie-quarkus-<v>-runner.jar, from a download
declare -A SHA256=(
  [0.108.8]=a58ebde6dc6df68266433d1d087c6cc497103df7a71a0275575f6fca71b167f7
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
