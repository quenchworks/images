# kanidm: Kanidm (kanidm/kanidm), an identity management server: users, groups, OAuth2/OIDC, LDAPS read
# access, passkeys and RADIUS, with a server-rendered web UI. MPL-2.0, Rust. Images issue #38.
#
# NEWEST-ONLY: upstream supports the latest release line. kanidmd always serves TLS; the chart supplies
# the certificate (existing Secret, cert-manager or a Helm-made CA).
FROM_SOURCE=1
VERSIONS=(1.12.1)
declare -A SHA256=(
  [1.12.1]=d31453a6d78b774eb4109622ac13eada112ba144f2772358920c7c28e9be1fc1
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
