# odoo: Odoo Community Edition (LGPL-3.0), the Python ERP and business apps suite, from
# Odoo's nightly source tarball on Wolfi python-3.13. Odoo publishes no patch tags; each
# line ships a dated build (19.0.YYYYMMDD) and the nightly directory keeps a few days.
#
# Dependencies float to their newest releases: Odoo's requirements.txt pins the Debian
# and Ubuntu package versions (Werkzeug 3.0.1, cryptography 42.0.8, Pillow 10.2.0, ...)
# and those carry dozens of findings, while setup.py leaves every dependency unpinned.
# PyPDF2 (no fixed release) is replaced by pypdf, which Odoo 19 imports first. The
# native packages come from Wolfi through a --system-site-packages venv (see
# melange.yaml), so no manylinux wheel brings its own libraries.
#
# NEWEST LINE ONLY (19.0) for now; 18.0 and 17.0 predate some of the floated releases.
# PDF reports need wkhtmltopdf, which is not in the image.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(19.0.20261013)
declare -A SHA256=(
  [19.0.20261013]=23aad61d2bec27f5f7450088a2d965999625f12d3fd3ad408c44172161de3da9
)
render() { echo "s/__VER__/$1/g; s|__LINE__|${1%.*}|g; s|__DATE__|${1##*.}|g; s|__SHA256__|${SHA256[$1]}|g"; }
