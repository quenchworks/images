# tigera-operator image: the operator that installs and manages Calico. Nonroot like upstream's.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-tigera-operator@local

accounts:
  groups:
    - groupname: tigera
      gid: 1001
  users:
    - username: tigera
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/bin/operator

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-tigera-operator"
  org.opencontainers.image.licenses: "Apache-2.0"
