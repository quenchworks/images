# tigera-operator: installs and manages Calico (sized 2026-10-08). Built from source. The
# operator line must match the Calico images: v1.42.2 is the newest release whose
# config/calico_versions.yml says v3.32.0 (v1.42.3+ deploy v3.32.1/2), which is what the
# calico-* images are built from. Move them together.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(1.42.2)
declare -A SHA256=(
  [1.42.2]=8503dfc8d31d366e397b226fdce52726ebe070ece8cae9dbe449e950beb05934
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
