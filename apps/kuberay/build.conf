# kuberay (ray-project/kuberay): the KubeRay operator (RayCluster, RayJob, RayService
# controllers), from source via melange. Upstream builds the manager with
# CGO_ENABLED=1 -tags strictfipsruntime, which only means something on Red Hat's FIPS
# Go toolchain; on standard Go it is a no-op, so this builds static with CGO off.
# The operator has no version ldflag. Latest patch of the last 3 minor lines.
FROM_SOURCE=1
VERSIONS=(1.5.2 1.6.2 1.7.2)
declare -A SHA256=(
  [1.5.2]=2814d0c93ae076fb6f9b1a896a544080dd66da9ea60888ff8d3892ebc7d09449
  [1.6.2]=dbcb82668e5b58eb623d3c136c3d0621ed4d27fe93d165a583028c92ce5f74ba
  [1.7.2]=bf11845155f01b7c9fd08f5c7a2678fb145ad7e03b9e9b5b92409eee171d3e9d
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
