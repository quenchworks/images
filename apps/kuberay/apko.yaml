# Assembles the KubeRay operator image. Nonroot uid 1001, multi-arch, SBOM by apko.
# The operator talks only to the Kubernetes API; the chart supplies RBAC, the CRDs
# and the flags.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-kuberay@local

accounts:
  groups:
    - groupname: kuberay
      gid: 1001
  users:
    - username: kuberay
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /manager

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-kuberay"
  org.opencontainers.image.licenses: "Apache-2.0"
