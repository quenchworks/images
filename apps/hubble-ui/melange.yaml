# Builds the Hubble UI frontend from the cilium/hubble-ui tag tarball: npm ci against the
# lockfile (the repo's .npmrc sets ignore-scripts), patch-package for upstream's patches,
# the type check and the production webpack bundle. Only the bundle and an nginx config
# reach the package; nginx itself comes from Wolfi.
package:
  name: quench-hubble-ui
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Hubble UI frontend (Cilium), built from source and served by nginx on Wolfi"
  copyright:
    - license: Apache-2.0

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - bash
      - busybox
      - ca-certificates-bundle
      - nodejs-24          # upstream builds on node 24
      - npm

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/cilium/hubble-ui/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      set -eu
      export HOME="$(mktemp -d)"
      npm ci --no-audit --no-fund
      # the steps of upstream's postinstall and build scripts, run directly: newer npm
      # rejects the package.json "config" key when it passes it as a CLI flag
      ./node_modules/.bin/patch-package
      ./node_modules/.bin/tsc --noEmit
      NODE_ENV=production ./node_modules/.bin/webpack
      test -f server/public/index.html
      dest="${{targets.destdir}}"
      install -d "$dest/usr/share/hubble-ui"
      cp -a server/public/. "$dest/usr/share/hubble-ui/"
      find "$dest/usr/share/hubble-ui" -name '*.map' -delete
      install -d "$dest/etc/hubble-ui"
      cat > "$dest/etc/hubble-ui/nginx.conf" <<'CONF'
      # nonroot, read-only root: foreground, pid and temp paths under /tmp
      daemon off;
      worker_processes auto;
      pid /tmp/nginx.pid;
      error_log /dev/stderr notice;

      events {
          worker_connections 1024;
      }

      http {
          include       /etc/nginx/mime.types;
          default_type  application/octet-stream;

          client_body_temp_path /tmp/client_body_temp;
          proxy_temp_path       /tmp/proxy_temp;
          fastcgi_temp_path     /tmp/fastcgi_temp;
          uwsgi_temp_path       /tmp/uwsgi_temp;
          scgi_temp_path        /tmp/scgi_temp;

          access_log /dev/stdout;
          sendfile      on;
          gzip          on;
          server_tokens off;

          server {
              listen      8081;
              server_name _;
              root        /usr/share/hubble-ui;
              index       index.html;

              location = /healthz {
                  access_log off;
                  return 200 "ok\n";
              }

              # the backend container in the same pod; flows stream over grpc-web, so
              # responses are not buffered and connections stay open
              location /api/ {
                  proxy_http_version 1.1;
                  proxy_pass http://127.0.0.1:8090;
                  proxy_buffering off;
                  proxy_request_buffering off;
                  proxy_read_timeout 1h;
                  proxy_hide_header Access-Control-Allow-Origin;
              }

              location / {
                  try_files $uri $uri/ /index.html;
              }
          }
      }
      CONF

test:
  pipeline:
    - runs: |
        test -f /usr/share/hubble-ui/index.html
        test -f /etc/hubble-ui/nginx.conf
