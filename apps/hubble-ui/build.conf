# hubble-ui: the Hubble UI frontend (React, built with webpack) on a Wolfi nginx that
# serves it and proxies /api to the hubble-ui-backend container in the same pod. Built
# from the cilium/hubble-ui tag tarball; Node and npm stay in the build sandbox.
#
# 0-CVE: the image is Wolfi nginx plus static files (measured 0 on 2026-09-25).
#
# NEWEST-ONLY: upstream ships one line (0.13.x); the backend image (hubble-ui-backend) is
# built from the same tag and the chart pins both.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(0.13.6)
declare -A SHA256=(
  [0.13.6]=cc3848718a06e90140720a83236f86480a6b35e0e99711e731ff29ff002c5238
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
