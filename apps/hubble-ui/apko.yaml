# Hubble UI frontend runtime image. Minimal, nonroot, multi-arch, SBOM by apko.
# nginx serves the bundle on :8081 (/healthz) and proxies /api/ to the hubble-ui-backend
# container on 127.0.0.1:8090 in the same pod.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - nginx
    - quench-hubble-ui@local

accounts:
  groups:
    - groupname: nonroot
      gid: 1001
  users:
    - username: nonroot
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/bin/nginx -c /etc/hubble-ui/nginx.conf

work-dir: /usr/share/hubble-ui

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-hubble-ui"
  org.opencontainers.image.licenses: "Apache-2.0"
