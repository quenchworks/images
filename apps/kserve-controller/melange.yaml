# Builds the KServe controller manager from source onto Wolfi: CGO off,
# ./cmd/manager, as upstream's Dockerfile does.
package:
  name: quench-kserve-controller
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened KServe controller, built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/kserve/kserve/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      set -eu
      export CGO_ENABLED=0
      export GOTOOLCHAIN=local
      export GOFLAGS=-mod=mod
      # ---- 0-CVE module float (docs/go-module-float.md) ----------------------
      # FLOOR is a floor, not a pin: only modules below it are raised, and the
      # shipped binary is asserted at or above it after the build.
      FLOOR="golang.org/x/net@v0.58.0 golang.org/x/text@v0.41.0 golang.org/x/crypto@v0.56.0 golang.org/x/sys@v0.47.0 golang.org/x/mod@v0.40.0 golang.org/x/oauth2@v0.36.0 google.golang.org/grpc@v1.83.2 go.opentelemetry.io/otel@v1.45.0 go.opentelemetry.io/otel/sdk@v1.45.0 go.opentelemetry.io/otel/trace@v1.45.0 go.opentelemetry.io/otel/metric@v1.45.0"
      MODS="$(echo "$FLOOR" | tr ' ' '\n' | cut -d@ -f1)"
      below_floor() {
        awk -v floor="$FLOOR" -v tag="$1" '
          BEGIN { n = split(floor, f, " ")
                  for (i = 1; i <= n; i++) { split(f[i], kv, "@"); want[kv[1]] = kv[2] } }
          ($1 in want) {
            split(substr($2, 2), g, "."); split(substr(want[$1], 2), w, ".")
            for (i = 1; i <= 3; i++) {
              if ((g[i] + 0) > (w[i] + 0)) next
              if ((g[i] + 0) < (w[i] + 0)) { print $1 "@" want[$1] " (" tag " has " $2 ")"; next }
            }
          }'
      }
      # Upstream pins grpc with a replace (a CVE fix when it was written), which
      # go get cannot move; raise the replace to the floor instead, and the
      # require with it (the float check reads both lines of go version -m).
      # Raise it only when upstream's replace is below the floor (0.21.0 replaces to v1.79.3);
      # an unconditional replace would pull a later release's higher grpc back down.
      g="$(go list -m -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' google.golang.org/grpc)"
      if [ "$(printf '%s\n%s\n' "$g" v1.83.2 | sort -V | head -1)" != v1.83.2 ]; then
        go mod edit -replace google.golang.org/grpc=google.golang.org/grpc@v1.83.2 \
          -require google.golang.org/grpc@v1.83.2
      fi
      need="$(go list -m -e $MODS | awk 'NF >= 2 && $NF ~ /^v[0-9]/ { print $1, $NF }' | below_floor go.mod | awk '{ print $1 }')"
      if [ -n "$need" ]; then go get $need; fi
      go mod tidy
      rm -rf vendor
      go build -trimpath -ldflags "-s -w" -o "${{targets.destdir}}/usr/bin/manager" ./cmd/manager
      bad="$(go version -m "${{targets.destdir}}/usr/bin/manager" \
        | awk '$1 == "dep" || $1 == "=>" { print $2, $3 }' | below_floor manager)"
      [ -z "$bad" ] || { echo "0-CVE float did not reach the binary:"; echo "$bad"; exit 1; }
      go version -m "${{targets.destdir}}/usr/bin/manager" | grep -F "github.com/kserve/kserve"
      help="$("${{targets.destdir}}/usr/bin/manager" --help 2>&1 || true)"
      grep -q "health-probe-addr" <<EOF
      $help
      EOF

test:
  pipeline:
    - runs: |
        manager --help || true
