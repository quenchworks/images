# Builds Grafana Loki from source onto Wolfi. Single static Go binary
# (CGO disabled, netgo), multi-arch. Output is a signed APK in Quenchworks'
# own repo. No upstream distro binaries.
#
# Loki is a horizontally-scalable, highly-available log aggregation system.
# It has NO bundled web UI -- Grafana is its frontend -- so there is no Node
# toolchain or asset-embedding step. We build from the git tag source tarball,
# which vendors all Go dependencies (vendor/), so the build is fully offline
# with -mod=vendor.
#
# We build the server `loki` binary (cmd/loki, the deliverable) and the
# `logcli` CLI (cmd/logcli, trivial extra target) using the exact version
# ldflags from upstream's Makefile so `loki -version` reports the pinned
# release. AGPL-3.0 (same license tier as the shipped grafana image).
package:
  name: quench-loki
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Grafana Loki (horizontally-scalable log aggregation system), built from source on Wolfi"
  copyright:
    - license: AGPL-3.0-only
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      # go.mod requires go >= 1.26.x; use the current go-1.26 toolchain to pick
      # up the latest stdlib CVE fixes (clears the Trivy gate without bumps).
      - go-1.26

pipeline:
  # Build from the git tag source tarball. Loki vendors all deps under vendor/,
  # so the build needs no network. Pinned to the tag; verified by sha256.
  - uses: fetch
    with:
      uri: https://github.com/grafana/loki/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      set -eu
      export CGO_ENABLED=0
      # Drop -mod=vendor: we need to bump a transitive dep past the vendored
      # tree, so build in module mode and let go resolve the module graph.
      export GOFLAGS=-mod=mod
      export GO111MODULE=on
      export GOTOOLCHAIN=local
      # ---- 0-CVE module float (docs/go-module-float.md) ----------------------
      # FLOOR is a FLOOR, not a pin. A bare `go get mod@vX` fails silently in two
      # directions: it is a NO-OP when an upstream `replace` overrides it, and it
      # becomes a DOWNGRADE once upstream requires more than vX -- re-introducing
      # the CVE it was added to clear. So float only what is below the floor, then
      # assert the SHIPPED BINARY carries nothing below it.
      FLOOR="github.com/apache/thrift@v0.24.0 golang.org/x/net@v0.58.0 golang.org/x/text@v0.41.0 golang.org/x/crypto@v0.56.0 golang.org/x/sys@v0.47.0 google.golang.org/grpc@v1.83.2 golang.org/x/oauth2@v0.36.0 go.opentelemetry.io/otel@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.45.0 go.opentelemetry.io/otel/sdk@v1.45.0 go.opentelemetry.io/otel/trace@v1.45.0 go.opentelemetry.io/otel/metric@v1.45.0 golang.org/x/mod@v0.40.0"
      MODS="$(echo "$FLOOR" | tr ' ' '\n' | cut -d@ -f1)"
      # prints "<mod>@<floor> (<tag> has <ver>)" for every module below its floor
      below_floor() {
        awk -v floor="$FLOOR" -v tag="$1" '
          BEGIN { n = split(floor, f, " ")
                  for (i = 1; i <= n; i++) { split(f[i], kv, "@"); want[kv[1]] = kv[2] } }
          ($1 in want) {
            split(substr($2, 2), g, "."); split(substr(want[$1], 2), w, ".")
            for (i = 1; i <= 3; i++) {
              if ((g[i] + 0) > (w[i] + 0)) next
              if ((g[i] + 0) < (w[i] + 0)) { print $1 "@" want[$1] " (" tag " has " $2 ")"; next }
            }
          }'
      }
      # `go list -m` prints "<mod> <ver>" or "<mod> <ver> => <mod> <ver>", so $NF is
      # the EFFECTIVE version and a replace cannot hide behind the require line.
      go list -m -e $MODS
      need="$(go list -m -e $MODS | awk 'NF >= 2 && $NF ~ /^v[0-9]/ { print $1, $NF }' | below_floor go.mod | awk '{ print $1 }')"
      if [ -n "$need" ]; then go get $need; fi
      go mod tidy
      # Stamp version exactly like upstream's Makefile (VPREFIX = the stable
      # Loki build package, which forwards into prometheus/common/version) so
      # `loki -version` reports the pinned release.
      VPREFIX=github.com/grafana/loki/v3/pkg/util/build
      DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      LDFLAGS="-s -w -extldflags \"-static\" \
        -X ${VPREFIX}.Version=${{package.version}} \
        -X ${VPREFIX}.Branch=HEAD \
        -X ${VPREFIX}.Revision=v${{package.version}} \
        -X ${VPREFIX}.BuildUser=quenchworks \
        -X ${VPREFIX}.BuildDate=${DATE}"
      go build -trimpath -tags netgo -ldflags "${LDFLAGS}" \
        -o "${{targets.destdir}}/usr/bin/loki" ./cmd/loki
      go build -trimpath -tags netgo -ldflags "${LDFLAGS}" \
        -o "${{targets.destdir}}/usr/bin/logcli" ./cmd/logcli
      # The float is only real if it reached the BINARY. Every `dep`/`=>` line of
      # `go version -m` must be at or above its floor -- the `=>` line is what
      # catches a replace-shadowed float. Fail the build rather than ship it.
      bad="$(go version -m "${{targets.destdir}}/usr/bin/loki" \
        | awk '$1 == "dep" || $1 == "=>" { print $2, $3 }' | below_floor loki)"
      [ -z "$bad" ] || { echo "❌ 0-CVE float did not reach loki:"; echo "$bad"; exit 1; }
      bad="$(go version -m "${{targets.destdir}}/usr/bin/logcli" \
        | awk '$1 == "dep" || $1 == "=>" { print $2, $3 }' | below_floor logcli)"
      [ -z "$bad" ] || { echo "❌ 0-CVE float did not reach logcli:"; echo "$bad"; exit 1; }

test:
  pipeline:
    - runs: |
        loki -version
        logcli --version
