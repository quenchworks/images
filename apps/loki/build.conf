# loki: from-source via melange (Go build from the grafana/loki git tag tarball).
# Latest 3 stable minor lines, newest patch each; each release pins its source
# tarball by sha256.
FROM_SOURCE=1
VERSIONS=(3.7.9)
declare -A SHA256=(
  [3.7.9]=374cc8b5f9aab740b44b1b0d9689e69b0e6f2c0feb41942cb52d3e1c4bb7bdeb
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
