# loki: from-source via melange (Go build from the grafana/loki git tag tarball).
# Latest 3 stable minor lines, newest patch each; each release pins its source
# tarball by sha256.
FROM_SOURCE=1
VERSIONS=(3.5.12 3.6.11 3.7.3)
declare -A SHA256=(
  [3.5.12]=fed725d6e15579f20a24b36be73c9bb53c34cad2d978f32b032c94624f885d99
  [3.6.11]=5ad4c7e20324c8477cef922400bcf63f124c63c3cd59e8da2792d78dbbf79b78
  [3.7.3]=1f74768fc476978796b49455fd962587a6b0e3b75212215ed8449f792aa5c776
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
