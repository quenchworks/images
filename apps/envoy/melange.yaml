# envoy: built from source with Bazel (FROM_SOURCE=1). Public Wolfi stopped publishing envoy at
# 1.38.1-r0 (the CVE fixes are enterprise-only, #71), so the image no longer takes Wolfi's apk.
# Envoy 1.40 brings a hermetic LLVM 22 toolchain (toolchains_llvm) and its own Python and Rust
# toolchains; Bazel 8 comes from Wolfi. The build needs more than a laptop: it runs on the CI
# runners (4 CPU / 16 GiB, Bazel's output on /mnt).
#
# A static Envoy hides brotli, BoringSSL, nghttp2, zlib-ng, c-ares and its Rust crates from
# Trivy. The image therefore ships the inventory under /usr/share/envoy/: the tag's Cargo.lock
# (Trivy reads it in an image layer), deps.yaml (Envoy's dependency metadata with CPEs) and the
# resolved Bazel module graph, which the build workflow turns into a CPE scan.
package:
  name: quench-envoy
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Envoy proxy, built from source with Bazel on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "4"
    memory: 14Gi

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - bash
      - bazel-8
      - binutils
      - build-base
      - busybox
      - ca-certificates-bundle
      - coreutils
      - git
      - openjdk-21-default-jdk   # Bazel's server JVM
      # host libraries Envoy's hermetic LLVM 22 binaries (ld.lld, clang) link against
      - clang-18                 # local LLVM for the 1.39 line (see the build step)
      - libxml2-2.13-2
      - lld-18
      - llvm-18
      - libzstd1
      - ncurses
      - zlib
      - patch
      - python3
      - py3.13-pyyaml            # inventory.py reads deps.yaml
      - rust-1.98                # cargo update for the crate floors below
      - wolfi-baselayout
  environment:
    # Bazel's server JVM plus 4 compile jobs fit in a 16 GiB runner; the link of envoy-static
    # is the peak.
    BAZEL_JOBS: "4"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/envoyproxy/envoy
      tag: v${{package.version}}
      expected-commit: __COMMIT__
      destination: envoy

  - working-directory: envoy
    runs: |
      set -eu
      # the version Bazel was tested with is in .bazelversion; Wolfi's bazel-8 is the same major
      echo "Bazel $(bazel --version) for .bazelversion $(cat .bazelversion)"
      case "$(cat .bazelversion)" in 8.*) ;; *) echo "this recipe expects Bazel 8"; exit 1 ;; esac
      # CVE floors on Bazel modules (minimal version selection keeps the highest any module asks for):
      # c-ares 1.34.7+ fixes CVE-2026-33630 (HIGH), CVE-2026-69184 (HIGH) and CVE-2026-69186
      # 1.40+ takes c-ares as a Bazel module; 1.39 pins it in repository_locations.bzl (sha256 of the
      # upstream c-ares-1.34.9.tar.gz release asset; Envoy's c-ares.patch applies to it)
      if grep -q '^bazel_dep(name = "c-ares"' MODULE.bazel; then
        sed -i 's|^bazel_dep(name = "c-ares", version = "[^"]*")|bazel_dep(name = "c-ares", version = "1.34.9.bcr.1")|' MODULE.bazel
        grep -q '^bazel_dep(name = "c-ares", version = "1.34.9.bcr.1")' MODULE.bazel
      else
        sed -i '/^    c_ares = dict(/,/^    ),/{s|version = "[^"]*"|version = "1.34.9"|;s|sha256 = "[^"]*"|sha256 = "9364b70a12eb59a06830fb488d9357f90100dff0d98b23ea3593a183d43e6f2f"|}' bazel/repository_locations.bzl
        sed -n '/^    c_ares = dict(/,/^    ),/p' bazel/repository_locations.bzl | grep -q 'version = "1.34.9"'
      fi
      # Rust crates linked into envoy-static (Cargo.lock, scanned by Trivy in the image): rustls 0.23.46
      # fixes GHSA-c8m5-c952-6cm4, GHSA-h2v8-394m-p7vv, GHSA-vp88-798v-h67f and GHSA-w44r-93j7-qv28.
      # CARGO_BAZEL_REPIN makes crate_universe regenerate Cargo.Bazel.envoy.lock from the new Cargo.lock.
      cargo update -p rustls --precise 0.23.46
      grep -A1 '^name = "rustls"$' Cargo.lock | grep -q '^version = "0.23.46"$'
      export CARGO_BAZEL_REPIN=true
      # 1.39's hermetic LLVM is a prebuilt release linked against libtinfo.so.5; Wolfi ships .so.6
      # (same ABI for what clang uses). 1.40's toolchain does not ask for it.
      [ -e /usr/lib/libtinfo.so.5 ] || ln -s libtinfo.so.6 /usr/lib/libtinfo.so.5
      # 1.39 pins hermetic LLVM 18.1.8, whose libc++ has no std::atomic_ref; V8 14.6 uses it
      # unguarded (src/base/atomicops.h). --config=libstdc++ alone is not enough: with the hermetic
      # LLVM, toolchains.bzl also hands toolchains_llvm prebuilt libc++ (cxx_cross_lib), which forces
      # libc++ on linux targets. Upstream drops it only for a local LLVM, so use Wolfi's llvm-18 (the
      # same 18.1.8) as BAZEL_LLVM_PATH; the hermetic sysroot's libstdc++ is then used (bazel aquery:
      # -stdlib=libstdc++ --sysroot=external/sysroot_linux_amd64). 1.40 (LLVM 22) keeps libc++.
      STDLIB=""
      if grep -q '^_LLVM_VERSION_HERMETIC = "18\.' bazel/toolchains.bzl 2>/dev/null; then
        # Bazel's sandbox rebuilds the sysroot's lib -> usr/lib symlink as a real directory, so
        # clang's relative path from the GCC 13 install to its C++ headers dangles ('memory' file
        # not found); name the headers explicitly. Linking finds libstdc++.a unaided (checked by
        # building @v8//:noicu/torque locally with these flags).
        case "$(uname -m)" in x86_64) sr=amd64 tr=x86_64-linux-gnu ;; aarch64) sr=arm64 tr=aarch64-linux-gnu ;; esac
        inc="external/sysroot_linux_$sr/usr/include"
        STDLIB="--config=libstdc++ --repo_env=BAZEL_LLVM_PATH=/usr/lib/llvm-18"
        for d in "$inc/c++/13" "$inc/$tr/c++/13"; do STDLIB="$STDLIB --cxxopt=-isystem$d --host_cxxopt=-isystem$d"; done
      fi
      bazel --output_user_root="$HOME/.bazel-root" build $STDLIB \
        -c opt --jobs="$BAZEL_JOBS" \
        --local_resources=memory=HOST_RAM*.7 \
        --verbose_failures --noshow_progress --show_result=1 \
        //source/exe:envoy-static.stripped
      install -Dm755 bazel-bin/source/exe/envoy-static.stripped "${{targets.destdir}}/usr/bin/envoy"

      # the inventory the scanner cannot read from the binary
      inv="${{targets.destdir}}/usr/share/envoy"
      install -Dm644 Cargo.lock "$inv/Cargo.lock"
      install -Dm644 bazel/deps.yaml "$inv/deps.yaml"
      if [ -f bazel/repository_locations.bzl ]; then install -Dm644 bazel/repository_locations.bzl "$inv/repository_locations.bzl"; fi
      bazel --output_user_root="$HOME/.bazel-root" mod graph --output=json > "$inv/bazel-mod-graph.json"
      # cquery, not query: query walks every select() branch and failed (exit 7) after the build;
      # cquery follows the real configuration, and --notool_deps drops build-host tools
      bazel --output_user_root="$HOME/.bazel-root" cquery $STDLIB --noshow_progress --notool_deps \
        'deps(//source/exe:envoy-static)' --output=label > /tmp/cquery.txt
      # root-visible repos print as @name//, the rest as @@name+//
      sed -n 's|^@\{1,2\}\([^/]*\)//.*|\1|p' /tmp/cquery.txt | sort -u > "$inv/linked-repos.txt"
      test -s "$inv/linked-repos.txt"
      python3 ../inventory.py "$inv"
      bazel --output_user_root="$HOME/.bazel-root" shutdown
      chmod -R u+w "$HOME/.bazel-root" && rm -rf "$HOME/.bazel-root"

  - uses: strip

test:
  pipeline:
    - runs: |
        envoy --version | grep -F "/${{package.version}}/"
