# envoy: from source with Bazel (melange.yaml), since 2026-11-17 (#107). Before that the image took
# Wolfi's envoy-1.3x apk, which public Wolfi stopped publishing at 1.38.1-r0 with the brotli
# CRITICAL (CVE-2026-111497) and Go stdlib HIGH (CVE-2026-111943) fixes only in enterprise
# revisions (#71). Upstream 1.40.2 pins brotli 1.2.0 (42a2ed4, 2026-09-30).
# The build is CI-sized (Wolfi used 36 CPU / 64 GiB): run it on the runners, not qw-gate.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(1.40.2)
# test.sh takes its extra args from build-envoy.yml, which passes "3.13" rather
# than the version. Mirrored here so the local gate matches CI.
boot_args() { echo "3.13"; }
declare -A COMMIT=(
  [1.40.2]=b2d89e0ae53916f28770771fbdd49c5c99c5c5a2
)
render() { echo "s/__VER__/$1/g; s/__COMMIT__/${COMMIT[$1]}/g"; }
