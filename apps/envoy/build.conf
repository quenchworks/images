# envoy: Wolfi apk (FROM_SOURCE=0, apko-only, 0-CVE). The Envoy L7 proxy/edge. Wolfi
# names the package by minor (envoy-1.38); VERSIONS holds full X.Y.Z used as the image
# tag, mapped to the exact apk via PIN. Latest 3 minor lines. The chart supplies the
# bootstrap config; the image entrypoint is the bare envoy binary.
FROM_SOURCE=0
VERSIONS=(1.36.4 1.37.1 1.38.1)
declare -A PIN=( [1.36.4]=1.36.4-r0 [1.37.1]=1.37.1-r3 [1.38.1]=1.38.1-r0 )
render() { local v=$1; echo "s|__PKG__|envoy-${v%.*}=${PIN[$v]}|g"; }
