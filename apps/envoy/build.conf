# envoy: Wolfi apk (FROM_SOURCE=0, apko-only, 0-CVE). The Envoy L7 proxy/edge. Wolfi
# names the package by minor (envoy-1.38); VERSIONS holds full X.Y.Z used as the image
# tag, mapped to the exact apk via PIN. Latest 3 minor lines. The chart supplies the
# bootstrap config; the image entrypoint is the bare envoy binary.
# STATUS: BLOCKED 2026-11-01 (BLOCKED=1), upstream-gated on Wolfi. A plain rebuild (CI 41285014185)
#   gates CVE-2026-111497 (brotli, CRITICAL) in every envoy-1.3x apk, fixed per the Wolfi advisory
#   in envoy-1.36 1.36.12-r0, envoy-1.37 1.37.8-r0, envoy-1.38 1.38.6-r0, plus CVE-2026-111943
#   (Go stdlib, HIGH) on 1.38, fixed in 1.38.9-r1. None of those revisions is in the public Wolfi
#   index on either arch: it tops out at envoy-1.36 1.36.4-r0, envoy-1.37 1.37.1-r3 and
#   envoy-1.38 1.38.1-r0, and has no envoy-1.39/1.40 package at all (upstream is at 1.40.2), so
#   Wolfi has stopped publishing envoy. Upstream static binaries would hide brotli, zlib and
#   BoringSSL from the scanner (the jellyfin SkiaSharp class), so they are not a substitute.
#   Unblock: the fixed envoy-1.3x revisions appear in the public index (bump PIN per line, set
#   BLOCKED=0, gate), or a from-source Bazel build with an auditable dependency inventory.
#   Published tags keep serving; kgateway and contour pair with envoy 1.38.x.
BLOCKED=1
FROM_SOURCE=0
VERSIONS=(1.36.4 1.37.1 1.38.1)
# test.sh takes its extra args from build-envoy.yml, which passes "3.13" rather
# than the version. Mirrored here so the local gate matches CI.
boot_args() { echo "3.13"; }
declare -A PIN=( [1.36.4]=1.36.4-r0 [1.37.1]=1.37.1-r3 [1.38.1]=1.38.1-r0 )
render() { local v=$1; echo "s|__PKG__|envoy-${v%.*}=${PIN[$v]}|g"; }
