# Builds Jaeger v2 (jaegertracing/jaeger) from source onto Wolfi. Jaeger v2 is a
# single OpenTelemetry-Collector-based `jaeger` binary that embeds the React query
# UI; it is a static Go binary (CGO disabled, matching upstream's GOBUILD_EXEC),
# multi-arch. Output is a signed APK in Quenchworks' own repo. No upstream distro
# binaries.
#
# The UI: cmd/jaeger/internal/extension/jaegerquery/internal/ui/actual/ is embedded
# via `//go:embed actual/*`, but ships empty in the tag (gitignored; the jaeger-ui
# submodule is not vendored in the tarball). We reproduce upstream's own release
# path (scripts/build/rebuild-ui.sh): download the prebuilt jaeger-ui assets.tar.gz
# for the matching UI tag (the UI version tracks the jaeger version 1:1), then gzip
# each asset into actual/ exactly as `make build-ui` does. GetStaticFiles() looks
# for actual/index.html.gz to decide the real UI is present. Node/vite never touch
# the sandbox, so the runtime image is a pure static Go binary and the JS toolchain
# stays out of the Trivy surface.
#
# go.mod declares go 1.26.0; we build with go-1.26 and GOTOOLCHAIN=local so the
# 1.26 directive does not trigger a toolchain download. GOFLAGS=-mod=mod lets the
# module graph resolve patched deps if a CVE bump is needed. Version is stamped via
# -X on internal/version.latestVersion (upstream stamps the full "v"-prefixed tag).
package:
  name: quench-jaeger
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Jaeger v2 (distributed tracing), built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - bash
      - curl
      - ca-certificates-bundle
      # go.mod requires go >= 1.27.0 as of 2.21.0. GOTOOLCHAIN is local, so a
      # pin below go.mod's floor fails the build outright; re-read that line
      # on every version bump.
      - go-1.27

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/jaegertracing/jaeger/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - name: Embed the prebuilt Jaeger UI assets (upstream rebuild-ui release path)
    runs: |
      set -eu
      UI_URL="https://github.com/jaegertracing/jaeger-ui/releases/download/v${{package.version}}/assets.tar.gz"
      UI_SHA="__UISHA256__"
      TMP="$(mktemp -d)"
      curl -fsSL -o "$TMP/assets.tar.gz" "$UI_URL"
      echo "${UI_SHA}  $TMP/assets.tar.gz" | sha256sum -c -
      # The bundle contains packages/jaeger-ui/build/**; extract just that tree.
      tar -C "$TMP" -xzf "$TMP/assets.tar.gz" packages/jaeger-ui/build/
      DEST="cmd/jaeger/internal/extension/jaegerquery/internal/ui/actual"
      # Mirror `make build-ui`: copy the built UI into actual/ and gzip every file
      # (the embed reads .gz assets), leaving the .gitignore in place.
      cp -r "$TMP/packages/jaeger-ui/build/"* "$DEST/"
      find "$DEST" -type f ! -name '.gitignore' -print0 | xargs -0 gzip --no-name
      test -f "$DEST/index.html.gz"

  - name: Build the jaeger binary (static, CGO off)
    runs: |
      set -eu
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      export GOTOOLCHAIN=local      # use the installed go-1.26, do not fetch go.mod's toolchain
      export GO111MODULE=on
      VERPKG="github.com/jaegertracing/jaeger/internal/version"
      DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      # 0-CVE gate: float transitive deps Trivy flags on the jaeger binary.
      #   golang.org/x/net  v0.55.0 -> v0.56.0 (CVE-2026-46600: panic on invalid SVCB/HTTPS RR)
      #   golang.org/x/text v0.37.0 -> v0.39.0 (CVE-2026-56852: infinite loop on invalid input)
      # 0-CVE FLOORS, not pins (docs/go-module-float.md): raise a module only where go.mod has it
      # below the floor; a module absent from the graph is skipped. Bare `go get` pins downgraded
      # newer upstream releases (found 2026-10-05).
      FLOOR="golang.org/x/net@v0.58.0 golang.org/x/sys@v0.47.0 google.golang.org/grpc@v1.83.2 golang.org/x/crypto@v0.56.0 golang.org/x/text@v0.41.0 github.com/apache/thrift@v0.24.0"
      # Go semver order (a release outranks its prereleases); busybox sort -V does not.
      vlt() { awk -v a="${1#v}" -v b="${2#v}" 'function pp(s,  p){sub(/\+.*/,"",s);p=index(s,"-");if(p){C=substr(s,1,p-1);P=substr(s,p+1)}else{C=s;P=""}} function cmp(x,y,  i,n,m,X,Y){n=split(x,X,".");m=split(y,Y,".");for(i=1;i<=n&&i<=m;i++){if(X[i]==Y[i])continue;if(X[i]~/^[0-9]+$/&&Y[i]~/^[0-9]+$/)return (X[i]+0<Y[i]+0)?-1:1;if(X[i]~/^[0-9]+$/)return -1;if(Y[i]~/^[0-9]+$/)return 1;return (X[i]<Y[i])?-1:1}return (n<m)?-1:(n>m)?1:0} BEGIN{pp(a);ca=C;pa=P;pp(b);cb=C;pb=P;c=cmp(ca,cb);if(c==0){if(pa==pb)c=0;else if(pa=="")c=1;else if(pb=="")c=-1;else c=cmp(pa,pb)}exit !(c<0)}'; }
      need=""
      for mv in $FLOOR; do
        have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${mv%@*}" 2>/dev/null)"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        vlt "$have" "${mv#*@}" && need="$need $mv"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || go get $need
      go mod tidy
      # Mirror upstream ldflags so `jaeger version` reports the real release
      # (latestVersion carries the "v" prefix, per scripts/utils/compute-version.sh).
      go build -trimpath \
        -ldflags "-s -w -X ${VERPKG}.latestVersion=v${{package.version}} -X ${VERPKG}.date=${DATE}" \
        -o "${{targets.destdir}}/usr/bin/jaeger" ./cmd/jaeger
