# Jaeger v2 (jaegertracing/jaeger): from-source via melange. Image-only (a
# distributed-tracing backend, no chart). Jaeger v2 ships a SINGLE OTel-Collector-
# based `jaeger` binary that embeds the React query UI. Latest patch of the last
# two v2 minor lines (2.18, 2.19 -- upstream cuts one patch per minor). Each
# release pins its source tarball by sha256.
#
# The React UI is NOT in the source tarball (the jaeger-ui submodule is empty and
# cmd/.../ui/actual/ is gitignored). Rather than pull the whole Node/vite
# toolchain into the sandbox, we reproduce upstream's own release path
# (scripts/build/rebuild-ui.sh): for a release tag it downloads the prebuilt
# jaeger-ui `assets.tar.gz` from the matching jaeger-ui release (the UI version
# tracks the jaeger version 1:1) and gzips it into the embed dir. So UISHA256
# pins that per-version UI asset bundle. Backend is a single static Go binary
# (CGO off); no JS runtime ever enters the image, so Node stays out of the scan.
FROM_SOURCE=1
VERSIONS=(2.21.0)
declare -A SHA256=(
  [2.21.0]=e42952d2d2824a95a4eff27889ff324569136acb900e9e3d2544e53b1152f088
)
# sha256 of the matching jaeger-ui release asset bundle (assets.tar.gz).
declare -A UISHA256=(
  [2.21.0]=f861d555bdd47327adcc23e36ee6f48496788b25ce7f0e0b2ab32a08f370bbbf
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g; s|__UISHA256__|${UISHA256[$1]}|g"; }
