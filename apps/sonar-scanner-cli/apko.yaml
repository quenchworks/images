# Assembles a hardened SonarScanner CLI image on a Wolfi openjdk-21-jre base.
# The scanner itself comes from our own melange package (quench-sonar-scanner-cli),
# built from the OFFICIAL SonarSource distribution zip with the logback bundled in
# its fat jar swapped for a patched release -- see melange.yaml for why we no
# longer install Wolfi's `sonar-scanner-cli` apk (its 0-CVE fix revision, -r3, was
# never published).
#
# IMAGE-ONLY -- no Helm chart. The 0-CVE, signed, nonroot, multi-arch answer to
# sonarsource/sonar-scanner-cli: `FROM` it in CI to analyse a project against a
# SonarQube server. SONAR_USER_HOME points at /tmp so the cache works on a
# read-only rootfs.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - busybox            # a POSIX shell so the scanner is usable in CI pipelines
    - openjdk-21-jre     # the JRE the scanner runs on (also the scanned CVE surface)
    - quench-sonar-scanner-cli@local   # /usr/bin/sonar-scanner-cli -> /usr/share/sonar-scanner

accounts:
  groups:
    - groupname: nonroot
      gid: 1001
  users:
    - username: nonroot
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/bin/sonar-scanner-cli

environment:
  HOME: /home/nonroot
  SONAR_USER_HOME: /tmp/.sonar
  JAVA_HOME: /usr/lib/jvm/java-21-openjdk

work-dir: /home/nonroot

paths:
  - path: /home/nonroot
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o755

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-sonar-scanner-cli"
  org.opencontainers.image.licenses: "LGPL-3.0-only"
