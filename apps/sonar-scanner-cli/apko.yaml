# Assembles a hardened SonarScanner CLI image directly from Wolfi's own
# `sonar-scanner-cli` apk. No Dockerfile, NO melange build -- apko pulls the scanner
# plus its OpenJDK (a runtime dep of the apk, with JAVA_HOME preset) straight from
# the Wolfi `os` repository.
#
# IMAGE-ONLY -- no Helm chart. The 0-CVE, signed, nonroot, multi-arch answer to
# sonarsource/sonar-scanner-cli: `FROM` it in CI to analyse a project against a
# SonarQube server. `__PKG__` is the pinned sonar-scanner-cli apk, substituted per
# matrix entry. SONAR_USER_HOME points at /tmp so the cache works on a read-only rootfs.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - __PKG__            # sonar-scanner-cli (/usr/bin/sonar-scanner-cli) + its OpenJDK + bash

accounts:
  groups:
    - groupname: nonroot
      gid: 1001
  users:
    - username: nonroot
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/bin/sonar-scanner-cli

environment:
  HOME: /home/nonroot
  SONAR_USER_HOME: /tmp/.sonar

work-dir: /home/nonroot

paths:
  - path: /home/nonroot
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o755

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-sonar-scanner-cli"
  org.opencontainers.image.licenses: "LGPL-3.0-only"
