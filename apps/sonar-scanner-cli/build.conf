# sonar-scanner-cli (SonarSource): the standalone scanner that pushes analysis to
# a SonarQube server. IMAGE-ONLY -- no Helm chart; you run it in CI. melange
# repackages the official distribution zip (pure Java, arch-independent -- one
# sha256 per version, NOT per-arch) and apko layers it on openjdk-21-jre, so the
# arch comes from the JRE. Tag = full version.
# The 7.3 line stays dropped: it carries its own fixable logback CVE.
FROM_SOURCE=1
VERSIONS=(8.1.0.6389)
declare -A SHA256=( [8.1.0.6389]=ab76ab3c360025e9108be5b55be066f304a164f8b2850d2f2f333915db51bc1b )
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
