# sonar-scanner-cli (SonarSource): Wolfi apk (FROM_SOURCE=0, apko-only, 0-CVE). The
# standalone scanner that pushes analysis to a SonarQube server. IMAGE-ONLY -- no
# Helm chart; you run it in CI. apko pulls the `sonar-scanner-cli` apk straight from
# Wolfi (which brings its own OpenJDK + JAVA_HOME). Tag = full version.
# The 7.3 line is dropped: it carries a fixable logback CVE (fixed only in 8.0.1.6346-r2+).
FROM_SOURCE=0
VERSIONS=(8.1.0.6389)
declare -A PIN=( [8.1.0.6389]=8.1.0.6389-r1 )
render() { echo "s|__PKG__|sonar-scanner-cli=${PIN[$1]}|g"; }
