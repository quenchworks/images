# STATUS 2026-08-27: UNBLOCKED (gate clean). Rebuilt, re-triaged, fixed.
#   what the old note got wrong: it said "two LOW findings, Wolfi lag, no in-repo
#        fix". The Wolfi-lag half was true and still is (see below); the "no
#        in-repo fix" half was not -- it assumed the recipe had to keep installing
#        Wolfi's apk. Tonight's scan of the PUBLISHED image reported 12 fixable;
#        a plain local rebuild dropped that to 2 (3 rows, one CVE), so 10 of the
#        12 were ordinary apk drift on an image that had not been rebuilt since
#        July (openjdk-21-jre and the X11/font libs it pulls).
#   the real blocker: CVE-2026-10532 (LOW, deserialization in QOS.CH logback),
#        reported twice against the same root cause -- the `sonar-scanner-cli`
#        Wolfi apk row (installed 8.1.0.6389-r1, "fixed in 8.1.0.6389-r3") and
#        the ch.qos.logback:logback-core 1.5.33 -> 1.5.34 row from inside
#        usr/bin/sonarqube/sonarscanner-cli.jar. Wolfi has still not published
#        -r3: verified against the live x86_64 AND aarch64 APKINDEX on
#        2026-08-27, where sonar-scanner-cli tops out at 8.1.0.6389-r1. So the
#        apk row is unfixable for as long as we install Wolfi's package.
#   fix: stop installing it. This app is now FROM_SOURCE=1 -- melange builds
#        quench-sonar-scanner-cli from the OFFICIAL SonarSource distribution zip
#        (sha256-pinned) and swaps the logback bundled in its fat jar for 1.5.35,
#        the same pin apps/cassandra and apps/zookeeper carry. That clears both
#        rows at once: no third-party apk row to match an advisory, and the
#        logback code is actually replaced (the dist bundles it UNRELOCATED, so
#        the class tree + META-INF/maven pom.properties Trivy reads are swapped
#        for real, asserted against the pristine 1.5.27 the dist ships).
#   result: comprehensive-mode gate reports `0 fixable CVEs` on BOTH arches
#        (x86_64 via build-image.sh; the aarch64 image assembled and scanned with
#        the same flags). test.sh passes on the x86_64 image, and
#        `sonar-scanner-cli -v` inside the image prints logback-formatted output
#        (so the swapped logging stack initialises) on x86_64 and on the aarch64
#        image under qemu. Unblocked.
#   as a bonus the image no longer reports 8.1-SNAPSHOT: Wolfi built the apk from
#        git, the official dist reports the real 8.1.0.6389 and carries a newer
#        commons-lang3 (3.20.0 vs Wolfi's 3.18.0).
BLOCKED=0
# sonar-scanner-cli (SonarSource): the standalone scanner that pushes analysis to
# a SonarQube server. IMAGE-ONLY -- no Helm chart; you run it in CI. melange
# repackages the official distribution zip (pure Java, arch-independent -- one
# sha256 per version, NOT per-arch) and apko layers it on openjdk-21-jre, so the
# arch comes from the JRE. Tag = full version.
# The 7.3 line stays dropped: it carries its own fixable logback CVE.
FROM_SOURCE=1
VERSIONS=(8.1.0.6389)
declare -A SHA256=( [8.1.0.6389]=ab76ab3c360025e9108be5b55be066f304a164f8b2850d2f2f333915db51bc1b )
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
