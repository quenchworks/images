# STATUS: UNBLOCKED 2026-09-20. The zlib block is gone: Wolfi shipped the fix
# for CVE-2026-85091 as zlib 1.3.2.1_rc20260601-r0 and the advisory was amended
# to name that version, so the 1.3.3-r0 this file used to wait for is a number
# that will never arrive. A stock wolfi-base scan reports the advisory as
# `zlib 1.3.2-r7 -> 1.3.2.1_rc20260601-r0`, which is what Wolfi publishes on
# both arches today. scripts/blocked.py now watches the shipped version.
#
# Evidence, stated exactly as measured:
#   x86_64  gated locally 2026-09-20, PUSH=0: 0 fixable CVEs AND the boot test
#           passed, so this is "runs", not just "scans clean".
#   aarch64 not measured locally; this host kills background melange builds and
#           a qemu-emulated arm build does not fit the foreground timeout. CI's
#           native arm64 runner is the first arm measurement, and its gate
#           refuses to publish on any finding.
# mariadb: from-source via melange (CMake/make compile of the MariaDB server).
# Latest 3 stable LTS series, newest patch each (11.4, 11.8, 12.3 are all
# "Stable / Long Term Support"; 13.x is still RC/preview). Each release pins its
# source tarball by sha256.
#
# 13.1 DELIBERATELY NOT SHIPPED (re-checked 2026-07-27 against
# https://downloads.mariadb.org/rest-api/mariadb/): release_status 13.1 = "Preview",
# 13.0 = "RC" (Rolling). Nothing above 12.3 is Stable/GA yet, and a Preview line
# would be pulled out from under us. Add 13.x only when its release_status flips to
# "Stable"; at that point drop 11.4 (the window is 3 -- build-mariadb.yml's prep job
# builds only the last 3 VERSIONS entries).
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(11.4.13 11.8.9 12.3.3)
declare -A SHA256=(
  [11.4.13]=1bb254b106d0a7ca871cfa18fa6e18d4b80a7430f9ec9d1571ec4271a13def96
  [11.8.9]=2e015b7e91004142eda8b3a20d3ceb875cf2ae55e72603e7222cd497d4e56fc6
  [12.3.3]=e99d739fd4a55f9a11dea7bd2287a262673e287550af3071c8469dd2bec0c163
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
