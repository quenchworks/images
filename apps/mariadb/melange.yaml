# Builds the mariadb server + client from source onto Wolfi.
# Output is a signed APK in Quenchworks' own repo. No upstream distro binaries.
package:
  name: quench-mariadb
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened MariaDB, built from source on Wolfi"
  copyright:
    - license: GPL-2.0-only
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - bison
      - ncurses-dev
      - openssl-dev
      - zlib-dev
      - libaio-dev
      - linux-headers
      - pkgconf
      - boost-dev          # galera provider (libgalera_smm.so) build
      - check-dev          # galera cmake probes for the check test framework
      - git                # git-checkout of the galera source + wsrep-API submodule

pipeline:
  - uses: fetch
    with:
      uri: https://archive.mariadb.org/mariadb-${{package.version}}/source/mariadb-${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      # Lean server: InnoDB stays (default); the heavy/optional engines and tooling
      # are disabled to cut build time and image size.
      # -DPLUGIN_DUCKDB=NO: DuckDB is new in the 11.4.13 / 12.3.3 line and its vendored
      # C++ tree fails to build here (storage/duckdb/CMakeFiles/duckdb_build.dir). It is
      # an optional analytics engine, not part of what this image serves. The flag sits
      # in the list below with no comment beside it on purpose: a `#` inside a
      # backslash-continued command ends the command, which is how the first attempt
      # turned the next flag into `/bin/sh: -DPLUGIN_DUCKDB=NO: not found`.
      cmake -B build -G "Unix Makefiles" \
        -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_INSTALL_PREFIX=/usr \
        -DMYSQL_DATADIR=/var/lib/mysql \
        -DMYSQL_UNIX_ADDR=/run/mysqld/mysqld.sock \
        -DWITH_SSL=system \
        -DWITH_ZLIB=system \
        -DWITH_PCRE=bundled \
        -DWITH_UNIT_TESTS=OFF \
        -DWITH_MARIABACKUP=ON \
        -DWITH_WSREP=ON \
        -DSKIP_TESTS=ON \
        -DPLUGIN_DUCKDB=NO \
        -DPLUGIN_MROONGA=NO \
        -DPLUGIN_ROCKSDB=NO \
        -DPLUGIN_TOKUDB=NO \
        -DPLUGIN_SPIDER=NO \
        -DPLUGIN_OQGRAPH=NO \
        -DPLUGIN_SPHINX=NO \
        -DPLUGIN_COLUMNSTORE=NO \
        -DPLUGIN_CONNECT=NO \
        -DCONC_WITH_UNIT_TESTS=OFF
      make -C build -j"$(nproc)"
      make -C build DESTDIR="${{targets.destdir}}" install
      # trim test/sql-bench/data baggage that the install drops in
      rm -rf "${{targets.destdir}}/usr/mysql-test" "${{targets.destdir}}/usr/mariadb-test" \
             "${{targets.destdir}}/usr/sql-bench" || true
      # Galera HA needs the wsrep SST donor tools; fail loudly if a MariaDB build
      # ever drops them. (galera_new_cluster is only a convenience wrapper and isn't
      # shipped on every line — e.g. 11.4 — and the chart bootstraps via
      # `mariadbd --wsrep-new-cluster` directly, so it is not required.)
      test -x "${{targets.destdir}}/usr/bin/wsrep_sst_mariabackup" || { echo "wsrep_sst_mariabackup missing"; exit 1; }
      test -x "${{targets.destdir}}/usr/bin/mariadb-backup"        || { echo "mariadb-backup (mariabackup) missing"; exit 1; }
  # Galera 4 wsrep provider (libgalera_smm.so). Wolfi ships no galera apk, so it's
  # built from source here; the wsrep-API submodule must be checked out too.
  - uses: git-checkout
    with:
      repository: https://github.com/codership/galera.git
      tag: release_26.4.27
      expected-commit: 2633b84e9aedec3678b9e06d6bc5c9230f466b40
      recurse-submodules: "true"
      destination: galera-src
  - runs: |
      # galera's CMakeLists declares cmake_minimum_required(2.8); modern CMake
      # (>=3.31) refuses <3.5, so pin the policy floor to keep it configuring.
      cmake -S galera-src -B galera-src/build -G "Unix Makefiles" \
        -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
        -DCMAKE_BUILD_TYPE=Release \
        -DGALERA_WITH_SSL=ON
      # build only the provider DSO — skips the garbd binary + check-based tests
      cmake --build galera-src/build --target galera_smm -j"$(nproc)"
      SO="$(find galera-src/build -name 'libgalera_smm.so' -print -quit)"
      test -n "$SO" || { echo "libgalera_smm.so not produced"; exit 1; }
      install -Dm0755 "$SO" "${{targets.destdir}}/usr/lib/galera/libgalera_smm.so"
  - runs: |
      install -d "${{targets.destdir}}/usr/local/bin"
      cat > "${{targets.destdir}}/usr/local/bin/docker-entrypoint.sh" <<'SCRIPT'
      #!/bin/sh
      set -eu
      # mariadb-install-db lives in /usr/scripts, not /usr/bin
      export PATH="/usr/scripts:/usr/bin:/usr/sbin:$PATH"
      DATADIR=/var/lib/mysql
      SOCK=/run/mysqld/mysqld.sock

      if [ ! -d "$DATADIR/mysql" ]; then
        if [ -z "${MARIADB_ROOT_PASSWORD:-}" ]; then
          echo "MARIADB_ROOT_PASSWORD is required for first initialization" >&2
          exit 1
        fi
        mariadb-install-db --datadir="$DATADIR" \
          --auth-root-authentication-method=normal --skip-test-db >/dev/null

        # temporary local-only server to apply setup SQL
        # (mariadbd --bootstrap cannot run GRANT/CREATE USER)
        mariadbd --datadir="$DATADIR" --socket="$SOCK" --skip-networking >/tmp/mdb-init.log 2>&1 &
        pid=$!
        for i in $(seq 1 30); do
          mariadb-admin --socket="$SOCK" -uroot ping >/dev/null 2>&1 && break
          [ "$i" = 30 ] && { echo "init server did not start" >&2; cat /tmp/mdb-init.log >&2; exit 1; }
          sleep 1
        done

        SQL="$(mktemp)"
        {
          printf "ALTER USER 'root'@'localhost' IDENTIFIED BY '%s';\n" "$MARIADB_ROOT_PASSWORD"
          printf "CREATE USER IF NOT EXISTS 'root'@'%%' IDENTIFIED BY '%s';\n" "$MARIADB_ROOT_PASSWORD"
          printf "GRANT ALL PRIVILEGES ON *.* TO 'root'@'%%' WITH GRANT OPTION;\n"
          [ -n "${MARIADB_DATABASE:-}" ] && printf "CREATE DATABASE IF NOT EXISTS \`%s\`;\n" "$MARIADB_DATABASE"
          if [ -n "${MARIADB_USER:-}" ]; then
            printf "CREATE USER IF NOT EXISTS '%s'@'%%' IDENTIFIED BY '%s';\n" "$MARIADB_USER" "${MARIADB_PASSWORD:-}"
            printf "GRANT ALL PRIVILEGES ON \`%s\`.* TO '%s'@'%%';\n" "${MARIADB_DATABASE:-*}" "$MARIADB_USER"
          fi
          printf "FLUSH PRIVILEGES;\n"
        } > "$SQL"
        mariadb --socket="$SOCK" -uroot < "$SQL"
        rm -f "$SQL"

        mariadb-admin --socket="$SOCK" -uroot -p"$MARIADB_ROOT_PASSWORD" shutdown
        wait "$pid" 2>/dev/null || true
      fi

      exec mariadbd --datadir="$DATADIR" --socket="$SOCK"
      SCRIPT
      chmod 0755 "${{targets.destdir}}/usr/local/bin/docker-entrypoint.sh"

test:
  pipeline:
    - runs: |
        mariadbd --version
        mariadb --version
