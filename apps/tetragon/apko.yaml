# Tetragon agent image: quench-tetragon, built from source (agent, tetra CLI,
# BPF objects in /var/lib/tetragon). The agent runs on compile-time defaults and
# the chart passes flags. Multi-arch. Default user 1001; the agent itself must
# run as root with privileges (see build.conf).
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-tetragon@local

accounts:
  groups:
    - groupname: tetragon
      gid: 1001
  users:
    - username: tetragon
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/bin/tetragon

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-tetragon"
  org.opencontainers.image.licenses: "Apache-2.0 AND GPL-2.0-only"
