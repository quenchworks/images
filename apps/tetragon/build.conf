# tetragon: Tetragon eBPF runtime-security agent plus the tetra CLI, built FROM
# SOURCE from the release tag: BPF objects with clang-15, the Go binaries with
# the version stamped.
#
# Why not Wolfi's tetragon apk: v1.7.1 vendors github.com/cilium/ebpf at a pre-
# 0.22.0 pseudo-version carrying CVE-2026-10722 (LOW, fixed in 0.22.0), and the
# gate fails on any fixable finding. Upstream main moved to v0.22.0 in 4ea98a4;
# the only source change that bump needed is dropping calls to the removed
# btf.FlushKernelSpec (4 files). melange.yaml makes the same edit to v1.7.1 and
# re-vendors. grpc is floated to the catalog floor v1.83.2 for CVE-2026-84303,
# 84304 and 84445. Drop both when a tagged release ships ebpf >= 0.22.0 and
# grpc >= 1.83.2.
#
# The agent loads eBPF programs, so it runs PRIVILEGED as root with hostPID. The
# image default user is 1001 like every other image; the chart overrides it for
# the agent container only, as metallb's speaker and spire's agent do.
#
# WINDOW: latest only.
BLOCKED=0
FROM_SOURCE=1
VERSIONS=(1.7.1)
declare -A COMMIT=( [1.7.1]=99ca93d98710b98a42551bf3c12613e32888885d )
render() { echo "s/__VER__/$1/g; s/__COMMIT__/${COMMIT[$1]}/g"; }
