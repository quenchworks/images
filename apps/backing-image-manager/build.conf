# backing-image-manager (longhorn/backing-image-manager): Longhorn's backing image server.
# longhorn-manager starts it as a pod with its own command, so the image only needs the
# binary in /usr/local/bin plus the tools it and go-common-libs exec (qemu-img, losetup,
# dd, sync). From source, static Go (CGO off), version stamped via -X main.Version.
# Latest patch of the last 3 minor lines (the Longhorn release lines).
FROM_SOURCE=1
VERSIONS=(1.11.3 1.12.1 1.13.0)
declare -A SHA256=(
  [1.11.3]=6b85d7bf0142a075285c44c8f08a8feaa73b49fe9b724afe085b7081a475e45c
  [1.12.1]=6b142d1e2c9ac2c05c8ce48b7a52176638e393aefcdc7247427a11922a48b96d
  [1.13.0]=3eee89953ae0ac7139b0a38871ac2000b0acce54263f5074ae3769223784d5c6
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
