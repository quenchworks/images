# Assembles the yarr image: the static binary, nonroot uid 1001. It listens on 0.0.0.0:7070 and
# keeps its SQLite database in /data, which should be a volume. YARR_AUTH (user:password) or
# YARR_AUTHFILE turns on the login; YARR_CERTFILE/YARR_KEYFILE serve HTTPS.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-yarr@local

accounts:
  groups:
    - groupname: yarr
      gid: 1001
  users:
    - username: yarr
      uid: 1001
      gid: 1001
      homedir: /data
  run-as: 1001

paths:
  - path: /data
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o755

environment:
  YARR_ADDR: 0.0.0.0:7070
  YARR_DB: /data/yarr.db

work-dir: /data

entrypoint:
  command: /usr/bin/yarr

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-yarr"
  org.opencontainers.image.licenses: "MIT"
  org.opencontainers.image.version: "__VER__"
