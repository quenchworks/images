# yarr (nkanaev/yarr, MIT): a self-hosted RSS and Atom reader with a web UI, a Fever API for mobile
# clients and optional basic auth, on SQLite. From the release tag via melange: the Vue frontend
# bundled with esbuild (npm ci, as upstream's dockerfile does), then the Go server built with cgo
# (mattn/go-sqlite3) and upstream's sqlite build tags, linked statically. LATEST-ONLY: one line.
FROM_SOURCE=1
VERSIONS=(2.9)
declare -A SHA256=(
  [2.9]=f6e667ec25e836add55b468fa478b089c14b71fea76131e07b429a171c1984e8
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
