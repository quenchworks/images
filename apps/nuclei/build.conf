# nuclei (ProjectDiscovery): template-based vulnerability scanner, from source via melange (Go build from the tag
# tarball). Image-only (a CLI, no chart). Newest patch of the last 3 minor lines. Single static Go binary, CGO off
# as upstream's goreleaser builds it. The version is a constant in pkg/catalog/config, so no -X stamp is needed.
# Templates are not baked in: they move daily and are not code the gate can scan. `nuclei -ut` fetches them into
# $HOME (mount a volume there), or point -t at your own.
FROM_SOURCE=1
VERSIONS=(3.9.0 3.10.0 3.11.1)
declare -A SHA256=(
  [3.9.0]=40b4b736071377dd11e9637c02ae956797faa6f497e8401012aaa8870d283303
  [3.10.0]=d798661f7f8a3356228d6313d0471270e243854644b5dda16999d7ca23ca17ea
  [3.11.1]=64c6e21eb8cd141d39cbb0241228fb40fd4370dbe39dc9f13e1069c718b711f9
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
