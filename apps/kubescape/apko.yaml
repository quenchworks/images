# Kubescape CLI image. The entrypoint is the binary, so `docker run ... scan` works;
# ca-certificates-bundle lets it fetch frameworks and reach the cluster API over TLS.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - quench-kubescape@local

accounts:
  groups:
    - groupname: kubescape
      gid: 1001
  users:
    - username: kubescape
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/bin/kubescape

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: "https://github.com/quenchworks/images"
  org.opencontainers.image.url: "https://quench-works.com"
  org.opencontainers.image.vendor: "Quenchworks"
  org.opencontainers.image.title: "quench-kubescape"
  org.opencontainers.image.licenses: "Apache-2.0"
