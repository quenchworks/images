# caddy: from-source via melange (fetch the release buildable-artifact tarball + sha256).
# Latest 3 stable minor lines, each at its newest patch (full X.Y.Z, used as-is).
# __VER__ = version (caddy_<VER>_buildable-artifact.tar.gz); __SHA256__ = its sha256.
FROM_SOURCE=1
VERSIONS=(2.9.1 2.10.2 2.11.4)
declare -A SHA256=(
  [2.9.1]=7a0f6cc7097718096fc70f814026a78c3a394cbd01497014a5f44da61413014c
  [2.10.2]=f25ba47638690436a15b9f60b22c95deb560ab16105eb7382fb2dacd77fb819d
  [2.11.4]=33777097f666d60d78bfb74df06978c933f32aa5a0d4ce0b0c5d028489984187
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
