# caddy: from-source via melange (fetch the release buildable-artifact tarball + sha256).
# Newest stable patch only (full X.Y.Z, used as-is). The older minor lines
# (2.9.x, 2.10.x) are dropped: their frozen vendored buildable-artifact trees
# carry fixable CVEs in caddy's OWN code (CVE-2026-27586/52844/52845 et al.,
# fixed only in 2.11.x) plus stale deps (quic-go, smallstep/certificates,
# x/crypto, go-jose, pgx, nebula, ...), and those caddy-code CVEs cannot be
# patched without upgrading caddy itself to 2.11.x -- which just makes the old
# lines redundant. 2.11.4 ships all those deps at their fixed versions and gates
# 0-CVE, so newest-only is the clean 0-CVE surface.
# __VER__ = version (caddy_<VER>_buildable-artifact.tar.gz); __SHA256__ = its sha256.
FROM_SOURCE=1
VERSIONS=(2.11.4)
declare -A SHA256=(
  [2.11.4]=33777097f666d60d78bfb74df06978c933f32aa5a0d4ce0b0c5d028489984187
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
