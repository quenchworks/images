# Builds Caddy from source onto Wolfi. Single static Go binary (CGO disabled),
# multi-arch. Output is a signed APK in Quenchworks' own repo. No upstream distro
# binaries.
#
# Caddy is a fast, extensible web server with automatic HTTPS.
#
# We build from the official "buildable-artifact" release tarball, which is a
# self-contained, fully-vendored source tree (main.go at the repo root +
# vendor/). Building it offline with -mod=vendor reproduces the exact module
# graph upstream ships, so no Go proxy access is needed at build time. The
# artifact's go.mod has `require github.com/caddyserver/caddy/v2 v2.11.4`, so
# `debug.ReadBuildInfo()` already reports the version; we ALSO stamp
# caddy/v2.CustomVersion via ldflags as a belt-and-suspenders so `caddy version`
# always prints the pinned tag regardless of build-info quirks.
package:
  name: quench-caddy
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Caddy (fast, extensible web server with automatic HTTPS), built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      # The buildable-artifact go.mod requires go >= 1.26; use the current
      # go-1.26 toolchain to pick up the latest stdlib CVE fixes (clears the
      # Trivy gate without manual bumps).
      - go-1.26

pipeline:
  # Build from the official buildable-artifact, a vendored source tree. Pinned to
  # the published asset; verified by sha256.
  - uses: fetch
    with:
      uri: https://github.com/caddyserver/caddy/releases/download/v${{package.version}}/caddy_${{package.version}}_buildable-artifact.tar.gz
      expected-sha256: __SHA256__
      # The buildable-artifact tarball has files at the root (no top-level
      # directory), so do NOT strip a leading path component (default is 1).
      strip-components: 0
  - runs: |
      export CGO_ENABLED=0
      export GOTOOLCHAIN=local
      # Only the x/net floor below: 2.11.7's go.mod already requires more than every floor the 2.11.4
      # recipe raised (otel 1.46 family, x/net 0.59, x/crypto 0.57, grpc 1.83.2, cel.dev/cel-go
      # 0.32). Floating below a requirement makes `go get` DOWNGRADE caddy itself to a release
      # that accepts it (2026-10-04: the build vendored 2.11.4's cmd/main.go and failed on
      # memlimit.SetGoMemLimitWithOpts). Re-add a float only for a module the scan flags, and
      # only above what go.mod already requires.
      # 0-CVE floor (raise only below it): x/net v0.60.0 closes CVE-2026-78659 and its siblings.
      FLOOR="golang.org/x/net@v0.60.0"
      # Go semver order (a release outranks its prereleases); busybox sort -V does not.
      vlt() { awk -v a="${1#v}" -v b="${2#v}" 'function pp(s,  p){sub(/\+.*/,"",s);p=index(s,"-");if(p){C=substr(s,1,p-1);P=substr(s,p+1)}else{C=s;P=""}} function cmp(x,y,  i,n,m,X,Y){n=split(x,X,".");m=split(y,Y,".");for(i=1;i<=n&&i<=m;i++){if(X[i]==Y[i])continue;if(X[i]~/^[0-9]+$/&&Y[i]~/^[0-9]+$/)return (X[i]+0<Y[i]+0)?-1:1;if(X[i]~/^[0-9]+$/)return -1;if(Y[i]~/^[0-9]+$/)return 1;return (X[i]<Y[i])?-1:1}return (n<m)?-1:(n>m)?1:0} BEGIN{pp(a);ca=C;pa=P;pp(b);cb=C;pb=P;c=cmp(ca,cb);if(c==0){if(pa==pb)c=0;else if(pa=="")c=1;else if(pb=="")c=-1;else c=cmp(pa,pb)}exit !(c<0)}'; }
      need=""
      for mv in $FLOOR; do
        have="$(GOFLAGS=-mod=mod go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${mv%@*}" 2>/dev/null)"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        vlt "$have" "${mv#*@}" && need="$need $mv"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || { GOFLAGS=-mod=mod go get $need; GOFLAGS=-mod=mod go mod tidy; }
      GOFLAGS=-mod=mod go mod tidy
      GOFLAGS=-mod=mod go mod vendor
      export GOFLAGS=-mod=vendor
      # Stamp the version so `caddy version` reports the pinned release even if
      # build-info extraction ever changes. CustomVersion is Caddy's documented
      # override hook (caddy.go).
      LDFLAGS="-s -w \
        -X github.com/caddyserver/caddy/v2.CustomVersion=v${{package.version}}"
      go build -trimpath -ldflags "${LDFLAGS}" \
        -installsuffix nocgo \
        -o "${{targets.destdir}}/usr/bin/caddy" .

test:
  pipeline:
    - runs: |
        caddy version
