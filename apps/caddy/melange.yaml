# Builds Caddy from source onto Wolfi. Single static Go binary (CGO disabled),
# multi-arch. Output is a signed APK in Quenchworks' own repo. No upstream distro
# binaries.
#
# Caddy is a fast, extensible web server with automatic HTTPS.
#
# We build from the official "buildable-artifact" release tarball, which is a
# self-contained, fully-vendored source tree (main.go at the repo root +
# vendor/). Building it offline with -mod=vendor reproduces the exact module
# graph upstream ships, so no Go proxy access is needed at build time. The
# artifact's go.mod has `require github.com/caddyserver/caddy/v2 v2.11.4`, so
# `debug.ReadBuildInfo()` already reports the version; we ALSO stamp
# caddy/v2.CustomVersion via ldflags as a belt-and-suspenders so `caddy version`
# always prints the pinned tag regardless of build-info quirks.
package:
  name: quench-caddy
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Caddy (fast, extensible web server with automatic HTTPS), built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      # The buildable-artifact go.mod requires go >= 1.26; use the current
      # go-1.26 toolchain to pick up the latest stdlib CVE fixes (clears the
      # Trivy gate without manual bumps).
      - go-1.26

pipeline:
  # Build from the official buildable-artifact, a vendored source tree. Pinned to
  # the published asset; verified by sha256.
  - uses: fetch
    with:
      uri: https://github.com/caddyserver/caddy/releases/download/v${{package.version}}/caddy_${{package.version}}_buildable-artifact.tar.gz
      expected-sha256: __SHA256__
      # The buildable-artifact tarball has files at the root (no top-level
      # directory), so do NOT strip a leading path component (default is 1).
      strip-components: 0
  - runs: |
      export CGO_ENABLED=0
      export GOTOOLCHAIN=local
      # 0-CVE gate: the buildable-artifact's vendored tree ships x/net/x/text at
      # flagged versions (x/net CVE-2026-46600, x/text CVE-2026-56852). Float them
      # to the fixed releases in module mode, then re-vendor so the -mod=vendor
      # build tree is consistent with the updated go.mod.
      # cel-go v0.28.1 -> v0.29.2 clears GHSA-gcjh-h69q-9w9g (MEDIUM:
      # ext.NativeTypes(ParseStructTag("json")) exposes json:"-" fields to user CEL
      # expressions); 0.29.0 is the first fixed release, there is no 0.28.x backport.
      # otel CVE-2026-81870 (exporter config logging leaks the endpoint) and
      # CVE-2026-81871. The published image drifted onto these after release; the
      # whole FAMILY is floated together because a partial float leaves the rest
      # behind and can mismatch the sdk against its exporters. otel/log is in the
      # ALL 18 otel modules in caddy's go.mod move together, read from that file
      # rather than guessed. Floating them one at a time just moves the compile
      # error to the next module: sdk/log alone gives "undefined: log.KindFloat64",
      # then stdoutlog gives "undefined: api.KindBytes". The three series step in
      # lockstep, 1.43 with log 0.19 and prometheus 0.65, so 1.45 takes 0.21 and 0.67.
      GOFLAGS=-mod=mod go get golang.org/x/net@v0.58.0 golang.org/x/sys@v0.47.0 google.golang.org/grpc@v1.83.2 golang.org/x/crypto@v0.56.0 golang.org/x/text@v0.41.0 github.com/google/cel-go@v0.29.2 go.opentelemetry.io/otel@v1.45.0 go.opentelemetry.io/otel/trace@v1.45.0 go.opentelemetry.io/otel/metric@v1.45.0 go.opentelemetry.io/otel/sdk@v1.45.0 go.opentelemetry.io/otel/sdk/metric@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlpmetric/otlpmetricgrpc@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlpmetric/otlpmetrichttp@v1.45.0 go.opentelemetry.io/otel/exporters/stdout/stdoutmetric@v1.45.0 go.opentelemetry.io/otel/exporters/stdout/stdouttrace@v1.45.0 go.opentelemetry.io/otel/log@v0.21.0 go.opentelemetry.io/otel/sdk/log@v0.21.0 go.opentelemetry.io/otel/exporters/otlp/otlplog/otlploggrpc@v0.21.0 go.opentelemetry.io/otel/exporters/otlp/otlplog/otlploghttp@v0.21.0 go.opentelemetry.io/otel/exporters/stdout/stdoutlog@v0.21.0 go.opentelemetry.io/otel/exporters/prometheus@v0.67.0
      GOFLAGS=-mod=mod go mod tidy
      GOFLAGS=-mod=mod go mod vendor
      # cel-go 0.29 made interpreter.Interpretable{Call,Const,Attribute,Constructor}
      # embed the new InterpretableV2 interface, so interpreter.NewCall now takes
      # []InterpretableV2 instead of []Interpretable. Caddy's CEL matcher decorator
      # builds that slice with an explicit []interpreter.Interpretable literal, which
      # no longer type-checks. reqAttr is an InterpretableAttribute, and that embeds
      # InterpretableV2 in 0.29, so switching the literal's element type is the whole
      # fix (2 call sites, no behavior change). Upstream caddy has not bumped cel-go
      # yet; drop this once it ships a release built against cel-go >= 0.29.
      sed -i 's#\[\]interpreter\.Interpretable{reqAttr}#[]interpreter.InterpretableV2{reqAttr}#g' \
        vendor/github.com/caddyserver/caddy/v2/modules/caddyhttp/celmatcher.go
      export GOFLAGS=-mod=vendor
      # Stamp the version so `caddy version` reports the pinned release even if
      # build-info extraction ever changes. CustomVersion is Caddy's documented
      # override hook (caddy.go).
      LDFLAGS="-s -w \
        -X github.com/caddyserver/caddy/v2.CustomVersion=v${{package.version}}"
      go build -trimpath -ldflags "${LDFLAGS}" \
        -installsuffix nocgo \
        -o "${{targets.destdir}}/usr/bin/caddy" .

test:
  pipeline:
    - runs: |
        caddy version
