# coredns: from-source via melange (Go build of coredns from the git tag tarball).
# Latest patch of the last 3 minor lines (1.12, 1.13, 1.14). Each release pins its
# source tarball by sha256. Single static Go binary, no CGO.
FROM_SOURCE=1
VERSIONS=(1.14.7)
declare -A SHA256=(
  [1.12.4]=39713a5bfd6fd1a2df1caa7a8296c4327e48c51e964c83d5fea4ed3a5ba4df9f
  [1.13.2]=8a9f8729476bdf265d5990dea86c314db778aec2f79d3d47e43607903f7d0b37
  [1.14.6]=44af24bd9ab0b9f85a9feaa3132de72e9e4a0629452d41b3e2f49aa2028233af
  [1.14.7]=c3ecdf3ebaba0c453e3dc62643548dbece09999d589513f25ca00ca4eca89423
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
