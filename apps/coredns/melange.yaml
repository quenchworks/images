# Builds CoreDNS from source onto Wolfi. Single static Go binary, no CGO. The
# generated plugin registries (zplugin.go, zdirectives.go) ship in the release
# tarball, so a plain `go build` at the repo root produces the full server.
# Output is a signed APK in Quenchworks' own repo. No upstream distro binaries.
# A minimal default Corefile ships at /etc/coredns/Corefile: it binds DNS on the
# unprivileged port 1053 (so the image runs as nonroot with no capabilities) and
# turns on the health (8080) and ready (8181) endpoints for probes. The chart
# mounts its own Corefile over this default.
package:
  name: quench-coredns
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened CoreDNS, built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/coredns/coredns/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      set -eu
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      export GO111MODULE=on
      export GOTOOLCHAIN=local   # use the installed go, don't fetch go.mod's toolchain
      # ---- 0-CVE module float (docs/go-module-float.md) ----------------------
      # FLOOR is a FLOOR, not a pin. A bare `go get mod@vX` fails silently in two
      # directions: it is a NO-OP when an upstream `replace` overrides it, and it
      # becomes a DOWNGRADE once upstream requires more than vX -- re-introducing
      # the CVE it was added to clear. So float only what is below the floor, then
      # assert the SHIPPED BINARY carries nothing below it.
      #
      # FLOOR CHECK at 1.14.7: the tag requires grpc v1.83.0, i.e. ABOVE the
      # v1.82.1 floor this recipe used to force with a bare `go get`. That pin had
      # inverted and would have DOWNGRADED grpc on this bump, re-introducing
      # GHSA-hrxh-6v49-42gf. Two `go mod edit -replace` lines (x/net, x/crypto)
      # were dropped for the same reason: a replace is an even harder exact pin.
      # coredns declares no `replace` directives of its own.
      FLOOR="golang.org/x/net@v0.58.0 golang.org/x/text@v0.41.0 golang.org/x/crypto@v0.56.0 golang.org/x/sys@v0.47.0 golang.org/x/mod@v0.40.0 google.golang.org/grpc@v1.83.2"
      MODS="$(echo "$FLOOR" | tr ' ' '\n' | cut -d@ -f1)"
      # prints "<mod>@<floor> (<tag> has <ver>)" for every module below its floor
      below_floor() {
        awk -v floor="$FLOOR" -v tag="$1" '
          BEGIN { n = split(floor, f, " ")
                  for (i = 1; i <= n; i++) { split(f[i], kv, "@"); want[kv[1]] = kv[2] } }
          ($1 in want) {
            split(substr($2, 2), g, "."); split(substr(want[$1], 2), w, ".")
            for (i = 1; i <= 3; i++) {
              if ((g[i] + 0) > (w[i] + 0)) next
              if ((g[i] + 0) < (w[i] + 0)) { print $1 "@" want[$1] " (" tag " has " $2 ")"; next }
            }
          }'
      }
      # `go list -m` prints "<mod> <ver>" or "<mod> <ver> => <mod> <ver>", so $NF is
      # the EFFECTIVE version and a replace cannot hide behind the require line.
      go list -m $MODS
      need="$(go list -m $MODS | awk '{ print $1, $NF }' | below_floor go.mod | awk '{ print $1 }')"
      if [ -n "$need" ]; then go get $need; fi
      go mod tidy
      go build -trimpath -ldflags "-s -w" -o "${{targets.destdir}}/usr/bin/coredns" .
      # The float is only real if it reached the BINARY. Every `dep`/`=>` line of
      # `go version -m` must be at or above its floor -- the `=>` line is what
      # catches a replace-shadowed float. Fail the build rather than ship it.
      bad="$(go version -m "${{targets.destdir}}/usr/bin/coredns" \
        | awk '$1 == "dep" || $1 == "=>" { print $2, $3 }' | below_floor coredns)"
      [ -z "$bad" ] || { echo "❌ 0-CVE float did not reach coredns:"; echo "$bad"; exit 1; }
      mkdir -p "${{targets.destdir}}/etc/coredns"
      printf '%s\n' \
        '.:1053 {' \
        '    health :8080' \
        '    ready :8181' \
        '    whoami' \
        '    log' \
        '    errors' \
        '}' > "${{targets.destdir}}/etc/coredns/Corefile"
