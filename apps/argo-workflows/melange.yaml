# Builds Argo Workflows (argoproj/argo-workflows) from source onto Wolfi.
# Three static Go binaries, CGO disabled (matches upstream
# Makefile: CGO_ENABLED=0 ... -extldflags -static):
#   * workflow-controller  (./cmd/workflow-controller) -- the controller
#   * argo                 (./cmd/argo) -- the multi-call CLI *and* API server
#                          (`argo server` binds the UI/API on 2746)
#   * argoexec             (./cmd/argoexec) -- the executor. NOT optional: the
#                          controller injects it into EVERY workflow pod as the
#                          `init` and `wait` containers and as the wrapper around
#                          the step's own command (it copies itself from $PATH to
#                          /var/run/argo/argoexec). Without it in this image every
#                          workflow pod dies with
#                          `exec: "argoexec": executable file not found in $PATH`,
#                          and the only alternative is pulling upstream's
#                          quay.io/argoproj/argoexec, which we do not build or sign.
# Output is a signed APK in Quenchworks' own repo. No upstream distro binaries.
#
# The `argo` binary embeds the React UI via `//go:embed dist/app` (ui/embed.go),
# and the source tag does NOT ship ui/dist -- so a plain `go build ./cmd/argo`
# fails on the missing embed target. We reproduce upstream's own asset pipeline
# (Makefile ui/dist/app/index.html target: STATIC_FILES=true -> yarn install +
# yarn build) in the sandbox with yarn/webpack, producing a real, functional UI.
# Node/yarn live ONLY in the build sandbox; the runtime image is just the two
# static Go binaries with no JS toolchain, so Node never enters the Trivy scan
# surface.
#
# go.mod declares go 1.24 (3.6.x) / 1.25 (3.7.x); we build with go-1.26 (newest,
# clears stdlib CVE advisories) and GOTOOLCHAIN=local so go.mod's directive does
# not trigger a toolchain download. GOFLAGS=-mod=mod lets the module graph
# resolve patched deps for the 0-CVE gate.
package:
  name: quench-argo-workflows
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Argo Workflows (workflow-controller + argo CLI/server), built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - patch              # the go-jose v4 port below
      - bash
      - git                # yarn resolves a few deps from git refs
      - ca-certificates-bundle
      - go-1.26
      # UI toolchain: the React UI is built with yarn (classic) + webpack.
      # package.json requires node >=20; nodejs-24 satisfies it. Build-only.
      - nodejs-24
      - yarn

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/argoproj/argo-workflows/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - name: Build the React UI from source (yarn + webpack)
    runs: |
      set -eu
      # Writable caches/HOME for yarn inside the sandbox.
      export HOME="$(mktemp -d)"
      export YARN_CACHE_FOLDER="$(mktemp -d)"
      # Mirror upstream's STATIC_FILES=true path (Makefile ui/dist/app/index.html):
      #   yarn --cwd ui install  (frozen lockfile per ui/.yarnrc)
      #   yarn --cwd ui build    (NODE_ENV=production webpack --mode production)
      yarn --cwd ui install --frozen-lockfile --non-interactive
      yarn --cwd ui build
      # ui/embed.go embeds dist/app; assert webpack produced the UI entrypoint.
      test -f ui/dist/app/index.html

  - name: Build the argo-workflows binaries (static, CGO off)
    runs: |
      set -eu
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      export GOTOOLCHAIN=local      # use the installed go-1.26, do not fetch go.mod's directive
      export GO111MODULE=on
      # 0-CVE gate: float the flagged Go modules to their fixed releases before
      # building (x/net CVE-2026-46600, x/text CVE-2026-56852), then tidy.
      # otel 1.45.0 clears CVE-2026-81870 (LOW, exporter config logging can leak
      # endpoint URLs), which lands on otel/sdk 1.44.0. Only sdk carries it, but
      # the otel modules release as a set, so all four move together.
      # ponytail: this is a bare `go get` list, not the house FLOOR pattern, so
      # each entry becomes a DOWNGRADE once upstream requires more than it names
      # (docs/go-module-float.md section 2). Convert to FLOOR when one of these
      # inverts; the whole list shares that ceiling, not just the otel entries.
      # 0-CVE FLOORS, not pins (docs/go-module-float.md): raise a module only where go.mod has it
      # below the floor; a module absent from the graph is skipped. Bare `go get` pins downgraded
      # newer upstream releases (found 2026-10-05).
      # go-jose v3 has no fixed release for CVE-2026-116587, -116585 and -116586 (fixed in v4 4.1.6
      # only). Lines before 4.1 import v3 in server/auth; port upstream c786f25b9c + 326c5d77b7 (the v4
      # API: SSO session tokens are signed, then encrypted, so existing SSO sessions log in once more).
      # 4.1.x ships this already and skips the block.
      if grep -q 'github.com/go-jose/go-jose/v3 ' go.mod; then
        f=server/auth/sso/sso.go
        find . -name '*.go' -exec grep -l 'github.com/go-jose/go-jose/v3' {} + | xargs sed -i 's|github.com/go-jose/go-jose/v3|github.com/go-jose/go-jose/v4|'
        sed -i 's|jwt.Encrypted(s.encrypter).Claims(argoClaims).CompactSerialize()|jwt.Encrypted(s.encrypter).Claims(argoClaims).Serialize()|' "$f"
        patch -p1 <<'PATCH'
      diff --git a/server/auth/sso/sso.go b/server/auth/sso/sso.go
      --- a/server/auth/sso/sso.go
      +++ b/server/auth/sso/sso.go
      @@ -59,6 +59,7 @@ type sso struct {
       	baseHRef          string
       	secure            bool
       	privateKey        crypto.PrivateKey
      +	signer            jose.Signer
       	encrypter         jose.Encrypter
       	rbacConfig        *config.RBACConfig
       	expiry            time.Duration
      @@ -190,7 +191,12 @@ func newSso(
       		Scopes:       append(c.Scopes, oidc.ScopeOpenID),
       	}
       	idTokenVerifier := provider.Verifier(&oidc.Config{ClientID: config.ClientID})
      -	encrypter, err := jose.NewEncrypter(jose.A256GCM, jose.Recipient{Algorithm: jose.RSA_OAEP_256, Key: privateKey.Public()}, &jose.EncrypterOptions{Compression: jose.DEFLATE})
      +	signer, err := jose.NewSigner(jose.SigningKey{Algorithm: jose.RS256, Key: privateKey}, nil)
      +	if err != nil {
      +		return nil, fmt.Errorf("failed to create JWT signer: %w", err)
      +	}
      +	encrypterOptions := (&jose.EncrypterOptions{Compression: jose.DEFLATE}).WithContentType("JWT")
      +	encrypter, err := jose.NewEncrypter(jose.A256GCM, jose.Recipient{Algorithm: jose.RSA_OAEP_256, Key: privateKey.Public()}, encrypterOptions)
       	if err != nil {
       		return nil, fmt.Errorf("failed to create JWT encrpytor: %w", err)
       	}
      @@ -220,6 +226,7 @@ func newSso(
       		httpClient:        httpClient,
       		secure:            secure,
       		privateKey:        privateKey,
      +		signer:            signer,
       		encrypter:         encrypter,
       		rbacConfig:        c.RBAC,
       		expiry:            c.GetSessionExpiry(),
      @@ -340,7 +347,7 @@ func (s *sso) HandleCallback(w http.ResponseWriter, r *http.Request) {
       		PreferredUsername:       c.PreferredUsername,
       		ServiceAccountNamespace: c.ServiceAccountNamespace,
       	}
      -	raw, err := jwt.Encrypted(s.encrypter).Claims(argoClaims).Serialize()
      +	raw, err := jwt.SignedAndEncrypted(s.signer, s.encrypter).Claims(argoClaims).Serialize()
       	if err != nil {
       		s.logger.WithError(err).Error(r.Context(), "failed to encrypt and serialize the jwt token")
       		w.WriteHeader(http.StatusUnauthorized)
      PATCH
        cat > /tmp/authorize.go <<'GO'
      func (s *sso) Authorize(authorization string) (*types.Claims, error) {
      	enc, err := jose.ParseEncrypted(strings.TrimPrefix(authorization, Prefix), []jose.KeyAlgorithm{jose.RSA_OAEP_256}, []jose.ContentEncryption{jose.A256GCM})
      	if err != nil {
      		return nil, fmt.Errorf("failed to parse encrypted token: %w", err)
      	}
      	payload, err := enc.Decrypt(s.privateKey)
      	if err != nil {
      		return nil, fmt.Errorf("failed to decrypt token: %w", err)
      	}
      	tok, err := jwt.ParseSigned(string(payload), []jose.SignatureAlgorithm{jose.RS256})
      	if err != nil {
      		return nil, fmt.Errorf("failed to parse signed token: %w", err)
      	}
      	c := &types.Claims{}
      	if err := tok.Claims(s.privateKey.(*rsa.PrivateKey).Public(), c); err != nil {
      		return nil, fmt.Errorf("failed to verify signed token: %w", err)
      	}
      	if err := c.Validate(jwt.Expected{Issuer: issuer}); err != nil {
      		return nil, fmt.Errorf("failed to validate claims: %w", err)
      	}
      	return c, nil
      }
      GO
        awk 'BEGIN{skip=0}
        /^func \(s \*sso\) Authorize\(authorization string\)/ {skip=1; while ((getline l < "/tmp/authorize.go") > 0) print l; next}
        skip && /^}/ {skip=0; next}
        !skip {print}' "$f" > "$f.new" && mv "$f.new" "$f"
        if ! grep -q '"crypto/rsa"' "$f"; then
          awk '!d && /^import \(/ {print; print "\t\"crypto/rsa\""; d=1; next} {print}' "$f" > "$f.new"
          mv "$f.new" "$f"
        fi
        go mod tidy
        ! grep -q 'go-jose/go-jose/v3' go.mod
      fi
      FLOOR="golang.org/x/net@v0.62.0 golang.org/x/sys@v0.49.0 google.golang.org/grpc@v1.83.2 golang.org/x/crypto@v0.58.1-0.20261009181718-2f1f834330b2 golang.org/x/text@v0.43.0 github.com/go-git/go-git/v5@v5.19.2 go.opentelemetry.io/otel@v1.47.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.47.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.47.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.47.0 go.opentelemetry.io/otel/sdk@v1.47.0 go.opentelemetry.io/otel/trace@v1.47.0 go.opentelemetry.io/otel/metric@v1.47.0 github.com/go-jose/go-jose/v4@v4.1.6"
      # Go semver order (a release outranks its prereleases); busybox sort -V does not.
      vlt() { awk -v a="${1#v}" -v b="${2#v}" 'function pp(s,  p){sub(/\+.*/,"",s);p=index(s,"-");if(p){C=substr(s,1,p-1);P=substr(s,p+1)}else{C=s;P=""}} function cmp(x,y,  i,n,m,X,Y){n=split(x,X,".");m=split(y,Y,".");for(i=1;i<=n&&i<=m;i++){if(X[i]==Y[i])continue;if(X[i]~/^[0-9]+$/&&Y[i]~/^[0-9]+$/)return (X[i]+0<Y[i]+0)?-1:1;if(X[i]~/^[0-9]+$/)return -1;if(Y[i]~/^[0-9]+$/)return 1;return (X[i]<Y[i])?-1:1}return (n<m)?-1:(n>m)?1:0} BEGIN{pp(a);ca=C;pa=P;pp(b);cb=C;pb=P;c=cmp(ca,cb);if(c==0){if(pa==pb)c=0;else if(pa=="")c=1;else if(pb=="")c=-1;else c=cmp(pa,pb)}exit !(c<0)}'; }
      need=""
      for mv in $FLOOR; do
        have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${mv%@*}" 2>/dev/null)"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        vlt "$have" "${mv#*@}" && need="$need $mv"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || go get $need
      go mod tidy
      # Match upstream Makefile LDFLAGS so `argo version` reports the real release.
      # No git metadata in the tarball; stamp version + clean tree + tag.
      # The module path carries the major: v3 is .../v3, v4 is .../v4. Derive it
      # from the version, or the 4.x lines stamp ldflags onto a package that is
      # not in the build and `argo version` reports "untagged".
      VER="${{package.version}}"
      VERPKG="github.com/argoproj/argo-workflows/v${VER%%.*}"
      BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
      LDFLAGS="-s -w \
        -X ${VERPKG}.version=v${{package.version}} \
        -X ${VERPKG}.buildDate=${BUILD_DATE} \
        -X ${VERPKG}.gitTag=v${{package.version}} \
        -X ${VERPKG}.gitTreeState=clean"
      go build -trimpath -ldflags "${LDFLAGS}" \
        -o "${{targets.destdir}}/usr/bin/workflow-controller" ./cmd/workflow-controller
      go build -trimpath -ldflags "${LDFLAGS}" \
        -o "${{targets.destdir}}/usr/bin/argo" ./cmd/argo
      go build -trimpath -ldflags "${LDFLAGS}" \
        -o "${{targets.destdir}}/usr/bin/argoexec" ./cmd/argoexec
  - name: Guard the docker/distribution VEX (registry/client and registry/proxy must not link)
    runs: |
      if grep -rlE 'docker/distribution/registry/(client|proxy)\.' "${{targets.destdir}}"; then
        echo "docker/distribution registry/client or registry/proxy is linked: CVE-2026-85747 applies, drop the VEX"; exit 1
      fi
