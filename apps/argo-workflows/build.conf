# argo-workflows (argoproj): from-source via melange (Go build from the git tag
# tarball). Latest patch of the last 3 minor lines (3.7.x, 4.0.x, 4.1.x).
# Each release pins its source tarball by sha256. Three static Go
# binaries (workflow-controller, the multi-call `argo` CLI/server, and the
# argoexec executor the controller injects into every workflow pod), CGO off.
# The `argo` binary embeds the React UI via `//go:embed dist/app` (ui/embed.go),
# so the UI is built with yarn/webpack in the melange sandbox first (see
# melange.yaml). Version is stamped via -X on github.com/argoproj/argo-workflows/v3
# vars (matches upstream Makefile LDFLAGS), so `argo version` reports vX.Y.Z.
FROM_SOURCE=1
# 2026-09-18: the 4.x lines join. Upstream's Go module path carries the major,
# so v4 is github.com/argoproj/argo-workflows/v4 while v3 is .../v3; melange.yaml
# derives VERPKG from the version rather than hardcoding one major.
VERSIONS=(3.7.18 4.0.12 4.1.4)
declare -A SHA256=(
  [3.7.18]=3d9ba1bb2cf4b6d306a8895b2f5ca7eae9850c55008fd0e525295c773b06e3d4
  [4.0.12]=b78464d9ed508cb31ca73013e24e186ba4c90163a63b2c37ae96300eb1c59fe7
  [4.1.4]=71a991f7d090154b9e09d4e4dc09a47405ac1386235876ced4b67837f62b96f0
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
