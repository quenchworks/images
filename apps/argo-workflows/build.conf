# argo-workflows (argoproj): from-source via melange (Go build from the git tag
# tarball). Image-only (no chart). Latest patch of the last 2 minor lines
# (3.6.x, 3.7.x). Each release pins its source tarball by sha256. Two static Go
# binaries (workflow-controller + the multi-call `argo` CLI/server), CGO off.
# The `argo` binary embeds the React UI via `//go:embed dist/app` (ui/embed.go),
# so the UI is built with yarn/webpack in the melange sandbox first (see
# melange.yaml). Version is stamped via -X on github.com/argoproj/argo-workflows/v3
# vars (matches upstream Makefile LDFLAGS), so `argo version` reports vX.Y.Z.
FROM_SOURCE=1
VERSIONS=(3.7.15)
declare -A SHA256=(
  [3.7.15]=85e8839706ba6418029bf512f06072c1ec090a7b77d713127e68b4b19e14737e
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
