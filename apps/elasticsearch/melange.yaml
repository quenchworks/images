# Packages Elasticsearch onto Wolfi. Elasticsearch is a JVM app: we ship the upstream
# binary distribution's jars/modules but DROP its bundled JDK and run on the hardened
# Wolfi-packaged OpenJDK 21, so the Wolfi-attributed JDK stays the CVE surface the Trivy
# gate scans (the bundled ES JDK would escape attribution).
#
# JRE-vs-JDK NOTE: unlike OpenSearch (which runs on openjdk-21-jre), Elasticsearch 9.x's
# entitlements framework (org.elasticsearch.entitlement) REQUIRES the `jdk.attach`
# module, which is NOT present in openjdk-21-jre (verified: ES 9.4 boot dies with
# "Module jdk.attach not found"). So we depend on the full `openjdk-21` package -- still
# a hardened, Trivy-scannable, Wolfi-maintained OpenJDK 21 at the same
# /usr/lib/jvm/java-21-openjdk path (bumped on fixable CVEs like the JRE would be), NOT
# the stripped bundled ES JDK.
#
# !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
# !!! LICENSE WARNING -- NOT OPEN SOURCE !!!
# Elasticsearch's default distribution is dual-licensed under the Server Side Public
# License v1 (SSPL-1.0) AND the Elastic License 2.0 (ELv2). NEITHER is OSI-approved
# open source. Do NOT represent Elasticsearch as open source. CAUTION TIER.
#   >>> CLEAN ALTERNATIVE: OpenSearch (Apache-2.0, already shipped at catalog #11) is the
#   >>> truly-open drop-in fork of Elasticsearch -- PREFER IT for new deployments. <<<
# SPDX below is SSPL-1.0; ELv2 ALSO applies to this distribution.
# !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
package:
  name: quench-elasticsearch
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Elasticsearch, packaged on Wolfi (SSPL-1.0/ELv2 -- NOT OSI open source; OpenSearch is the clean alt)"
  copyright:
    - license: SSPL-1.0  # dual SSPL-1.0 / Elastic License 2.0 -- NEITHER is OSI-approved
  dependencies:
    runtime:
      - openjdk-21         # full Wolfi OpenJDK 21 (the scanned CVE surface). ES 9.x needs
                           # the jdk.attach module, absent from openjdk-21-jre.
      - bash               # the elasticsearch bin/* launchers are bash
      - busybox
      - libstdc++          # ES nativeaccess libvec.so (SIMD vector distance) + libzstd.so
                           # (stored-fields compression) NEED libstdc++.so.6; without it
                           # the whole NativeAccess provider fails to load and Zstd is null,
                           # which fails shard recovery (cluster goes red). Verified locally.

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - curl
      - ca-certificates-bundle
      - unzip   # build-time only: explode elasticsearch-x-content for IMPL-JARS surgery
      - zip     # build-time only: repackage the patched x-content jar

pipeline:
  # Elasticsearch ships ARCH-SPECIFIC distributions (they bundle a native JDK + native
  # libs), so fetch the tarball matching the build arch -- not a fixed one, or the arm64
  # package ends up with x86_64 binaries (this was a real bug in the OpenSearch build).
  - runs: |
      case "$(uname -m)" in
        x86_64)  esarch=x86_64;  sha=__SHA_AMD__ ;;
        aarch64) esarch=aarch64; sha=__SHA_ARM__ ;;
        *) echo "unsupported arch $(uname -m)" >&2; exit 1 ;;
      esac
      url="https://artifacts.elastic.co/downloads/elasticsearch/elasticsearch-${{package.version}}-linux-${esarch}.tar.gz"
      curl -fsSL -o es.tar.gz "$url"
      echo "${sha}  es.tar.gz" | sha512sum -c -
      mkdir -p src && tar -xzf es.tar.gz -C src --strip-components 1
      cd src
      dest="${{targets.destdir}}/opt/elasticsearch"
      install -d "$dest"
      # ship bin, lib, modules, config, plugins; drop the bundled JDK (we run on
      # openjdk-21-jre so the JRE stays the attributed CVE surface).
      cp -r bin config lib modules plugins LICENSE.txt NOTICE.txt "$dest/"
      rm -rf "$dest/jdk"
      # the linux tarball ships POSIX launchers only (no Windows .bat), but be defensive.
      find "$dest/bin" -name '*.bat' -delete

      # ========================================================================
      # 0-CVE remediation. Findings = Jul-2026 jackson cluster (CVE-2026-54512..
      # 54518 / GHSA-72hv-8253-57qq) plus reactor-netty CVE-2025-22227,
      # opentelemetry CVE-2026-45292, commons-lang3 CVE-2025-48924. Mix of DROP
      # (optional modules whose vuln is shaded/entangled) + standalone jar SWAP +
      # nested SURGERY on Elastic's own core x-content jar. Sha256-pinned Maven
      # Central. Scratch under the on-disk workspace (not the tmpfs /tmp).
      MC="https://repo1.maven.org/maven2"
      PW="$(pwd)/.pw"; DL="$PW/dl"; mkdir -p "$DL"
      getj() { curl -fsSL -o "$DL/$2" "$1"; echo "$3  $DL/$2" | sha256sum -c -; }

      # --- (a) DROP optional pieces carrying un-fixable shaded / transitively-locked deps
      #   * bin sql-cli client: shaded jackson-core (a CLI, not used by the server)
      rm -f "$dest"/bin/elasticsearch-sql-cli "$dest"/bin/elasticsearch-sql-cli-*.jar
      #   * esql-datasource-{iceberg,parquet,azure,gcs}: optional ESQL external datasources.
      #     iceberg/parquet embed parquet-hadoop-bundle (SHADES jackson 2.19.2); azure/gcs
      #     pull reactor-netty / opentelemetry. Nothing core depends on them (their
      #     extended.plugins point AT x-pack-esql, not the reverse).
      rm -rf "$dest"/modules/esql-datasource-iceberg "$dest"/modules/esql-datasource-parquet \
             "$dest"/modules/esql-datasource-azure   "$dest"/modules/esql-datasource-gcs
      #   * repository-azure: optional Azure snapshot repo; ships reactor-netty 1.0.45 on the
      #     OLD reactor-core 3.4.38, incompatible with the fixed reactor-netty 1.2.8 (which
      #     needs reactor-core >= 3.6), so it cannot be cleanly swapped. Drop it.
      rm -rf "$dest"/modules/repository-azure
      # --- (a2) modules/apm: OVERLAY the fixed log4j-api into the bundled APM agent -----
      # The agent (elastic-apm-agent-java8-1.55.6.jar) shades log4j-api 2.25.4 =
      # CVE-2026-49844 (MEDIUM -- malformed JSON output from MapMessage /
      # StructuredDataMessage). Neither easy way out works:
      #
      # 1. DELETING modules/apm. Elasticsearch validates its module set at startup:
      #      ERROR: Expected to find [apm] module in [/opt/elasticsearch/modules/apm]!
      #      Installation is corrupt, with exit code 70
      #    That removal shipped once by accident (it cleared the scan and published; only
      #    the chart's kind gate caught it, Ready 0/1). The module is not optional.
      # 2. SWAPPING the agent jar for a newer release. 1.56.0 is the newest that exists and
      #    it bundles log4j-api 2.26.0, which is ALSO vulnerable (fixes are 2.25.5/2.26.1).
      #
      # So overlay the fixed classes instead. The agent keeps its shaded dependencies as an
      # EXPLODED tree under agent/ with every class renamed *.esclazz (loaded by the agent's
      # own classloader), and its log4j-api copies are BYTE-IDENTICAL to the upstream jar's
      # -- verified per class, 209/209 base + 4/4 versioned, with only module-info.class
      # omitted -- so upstream 2.25.5 drops straight in.
      #
      # The agent jar is `Multi-Release: true` AND it really does ship versioned copies of
      # log4j classes under META-INF/versions/9/agent/... . On Java 21 a versioned entry
      # WINS over the base one, so patching only the base tree would leave the vulnerable
      # bytecode running while the scanner read a patched pom.properties (exactly the false
      # clean graylog shipped). Overlay the base tree AND every META-INF/versions/<n>/ tree,
      # never module-info.class, and prune anything the patched release deleted.
      getj "$MC/org/apache/logging/log4j/log4j-api/2.25.5/log4j-api-2.25.5.jar" log4j-api-2.25.5.jar 64777f73ea0b3104c04eb82befbdccc30a425a19e83ad06cb2f93aa303511863
      apmjar="$(find "$dest/modules/apm" -maxdepth 1 -name 'elastic-apm-agent-*.jar')"
      test "$(printf '%s\n' "$apmjar" | grep -c .)" -eq 1 || { echo "FATAL: expected exactly 1 APM agent jar:"; printf '%s\n' "$apmjar"; exit 1; }
      l4pom='agent/META-INF/maven/org.apache.logging.log4j/log4j-api/pom.properties'
      l4ver="$(unzip -p "$apmjar" "$l4pom" | sed -n 's/^version=//p')"
      case "$l4ver" in
        2.25.4)
          echo "overlaying log4j-api 2.25.5 over the agent's shaded $l4ver"
          w="$PW/apm"; rm -rf "$w"; mkdir -p "$w/x" "$w/o/agent/META-INF"
          ( cd "$w/x" && unzip -qo "$DL/log4j-api-2.25.5.jar" )
          cp -r "$w/x/org" "$w/o/agent/"
          cp -r "$w/x/META-INF/maven" "$w/o/agent/META-INF/"   # pom.properties/pom.xml = the version the scanner reads
          for vd in "$w/x"/META-INF/versions/*; do
            n="$(basename "$vd")"
            mkdir -p "$w/o/META-INF/versions/$n/agent"
            cp -r "$vd"/. "$w/o/META-INF/versions/$n/agent/"
          done
          find "$w/o" -name 'module-info.class' -delete
          find "$w/o" -name '*.class' -exec sh -c 'mv "$1" "${1%.class}.esclazz"' _ {} \;
          ( cd "$w/o" && find . -type f | sed 's|^\./||' | sort ) > "$w/new.txt"
          unzip -Z1 "$apmjar" | sort > "$w/have.txt"
          # the overlay must only REPLACE: a path the agent jar does not already have means
          # the shaded layout changed and this surgery needs re-deriving, not guessing.
          if grep -Fxv -f "$w/have.txt" "$w/new.txt" > "$w/add.txt"; then
            echo "FATAL: overlay would ADD entries absent from the agent jar:"; cat "$w/add.txt"; exit 1
          fi
          ( cd "$w/o" && zip -qX "$apmjar" -@ < "$w/new.txt" )
          # prune classes the patched release deleted (scoped to the package dirs the
          # overlay writes -- verified that only log4j-api owns those dirs in this jar).
          sed 's|/[^/]*$||' "$w/new.txt" | sort -u > "$w/dirs.txt"
          while read -r d; do grep "^$d/[^/]*\.esclazz$" "$w/have.txt" || true; done < "$w/dirs.txt" | sort -u > "$w/dirents.txt"
          if grep -Fxv -f "$w/new.txt" "$w/dirents.txt" > "$w/del.txt"; then
            echo "pruning classes dropped by 2.25.5:"; cat "$w/del.txt"
            ( cd "$w" && zip -qd "$apmjar" -@ < "$w/del.txt" )
          fi
          # VERIFY THE RUNNING CODE, not the scanner: every overlaid entry in the jar must
          # now be byte-identical to the pristine upstream 2.25.5 jar's copy.
          while read -r p; do
            unzip -p "$apmjar" "$p" | cmp -s - "$w/o/$p" || { echo "FATAL: overlay did not take for $p"; exit 1; }
          done < "$w/new.txt"
          l4new="$(unzip -p "$apmjar" "$l4pom" | sed -n 's/^version=//p')"
          test "$l4new" = 2.25.5 || { echo "FATAL: agent log4j-api still reports $l4new"; exit 1; }
          echo "APM agent log4j-api: $l4ver -> $l4new ($(wc -l < "$w/new.txt") entries, base + versioned)"
          ;;
        2.25.5|2.26.1)
          echo "APM agent already ships a fixed log4j-api ($l4ver); no overlay needed" ;;
        *)
          echo "FATAL: APM agent ships log4j-api $l4ver -- unexpected. Re-derive the overlay"
          echo "       (the class set and the per-class byte-identity were verified against"
          echo "       2.25.4 only) instead of assuming the 2.25.5 tree still fits."; exit 1 ;;
      esac

      # --- (b) standalone jackson 2.18.8 -> 2.18.9 (core+databind+annotations, consistent
      #     set; databind fix = 2.18.9 (for -54515 and CVE-2026-59889), core fix >= 2.18.6).
      #     Backward-compatible within 2.x. (ES <= 9.4.3 bundled 2.15.0 here; 9.4.4 ships
      #     2.18.8, which still carries the databind advisory -> same swap, newer source.)
      getj "$MC/com/fasterxml/jackson/core/jackson-core/2.18.9/jackson-core-2.18.9.jar" jackson-core-2.18.9.jar e03144f48c8d5307da2894570b4972aab8c72f22440f8dcdb745be2485ce2024
      getj "$MC/com/fasterxml/jackson/core/jackson-databind/2.18.9/jackson-databind-2.18.9.jar" jackson-databind-2.18.9.jar 71595a3f7ff58344ec0496a9f9ec9f623ef7b85b45402d88f1ca261f1bc4b42c
      getj "$MC/com/fasterxml/jackson/core/jackson-annotations/2.18.9/jackson-annotations-2.18.9.jar" jackson-annotations-2.18.9.jar 798c85b86e7420d0b4eb91e7b3e37d4bee673c61de37a616ba51a7539631e6b7
      find "$dest/modules" -name 'jackson-core-2.18.8.jar'        -exec sh -c 'cp "$1" "$(dirname "$2")/jackson-core-2.18.9.jar";        rm -f "$2"' _ "$DL/jackson-core-2.18.9.jar" {} \;
      find "$dest/modules" -name 'jackson-databind-2.18.8.jar'    -exec sh -c 'cp "$1" "$(dirname "$2")/jackson-databind-2.18.9.jar";    rm -f "$2"' _ "$DL/jackson-databind-2.18.9.jar" {} \;
      find "$dest/modules" -name 'jackson-annotations-2.18.8.jar' -exec sh -c 'cp "$1" "$(dirname "$2")/jackson-annotations-2.18.9.jar"; rm -f "$2"' _ "$DL/jackson-annotations-2.18.9.jar" {} \;

      # --- (b2) NEW in 9.5.0: a SECOND jackson line. 9.5.0 adds modules built against
      #     jackson 2.21.4 (x-pack-esql, esql-datasource-*), and databind 2.21.4 carries
      #     CVE-2026-54515 + CVE-2026-59889 + GHSA-mhm7-754m-9p8w. Fix on that line is
      #     2.21.5 (patch, same minor -- NOT the 2.18.9 used above, which would be a
      #     downgrade here). Only databind is flagged; core/annotations/dataformat at
      #     2.21.4 are clean, and 2.21.5 databind is compatible with 2.21.4 core.
      getj "$MC/com/fasterxml/jackson/core/jackson-databind/2.21.5/jackson-databind-2.21.5.jar" jackson-databind-2.21.5.jar 507418c0fafd38b2b2cfb704521630da613a8e4cc8381195a6f418017883e2c0
      find "$dest/modules" -name 'jackson-databind-2.21.4.jar' -exec sh -c 'cp "$1" "$(dirname "$2")/jackson-databind-2.21.5.jar"; rm -f "$2"' _ "$DL/jackson-databind-2.21.5.jar" {} \;

      # --- (b3) NEW in 9.5.0: jsoup 1.21.2 -> 1.23.1 (ingest-attachment).
      #     CVE-2026-71497. Built for JDK 17, and ES bundles a newer JDK, so it loads.
      getj "$MC/org/jsoup/jsoup/1.23.1/jsoup-1.23.1.jar" jsoup-1.23.1.jar 8b15e2b28eeb1e0a88a9b7dab4dc0c23524491c56959785dea22f7846897b668
      find "$dest/modules" -name 'jsoup-1.21.2.jar' -exec sh -c 'cp "$1" "$(dirname "$2")/jsoup-1.23.1.jar"; rm -f "$2"' _ "$DL/jsoup-1.23.1.jar" {} \;

      # --- (b4) httpclient5 5.6.1 -> 5.6.3 and log4j-api 2.25.4 -> 2.25.5. Both are
      #     same-line patches, so they carry no API change. Note the httpclient5 bump is
      #     SAFE here, unlike graylog: this is Elastic's own client, not the OpenSearch
      #     storage plugin whose gzip handling the 5.6.x line broke.
      getj "$MC/org/apache/httpcomponents/client5/httpclient5/5.6.3/httpclient5-5.6.3.jar" httpclient5-5.6.3.jar 80712ff129210d7c73d9fcc1195cbee5c3c34744965c7a05ea107b3648922f18
      find "$dest" -name 'httpclient5-5.6.1.jar' -exec sh -c 'cp "$1" "$(dirname "$2")/httpclient5-5.6.3.jar"; rm -f "$2"' _ "$DL/httpclient5-5.6.3.jar" {} \;
      # (the 2.25.5 jar is fetched + sha-pinned in (a2) above, which needs it first)
      find "$dest" -name 'log4j-api-2.25.4.jar' -exec sh -c 'cp "$1" "$(dirname "$2")/log4j-api-2.25.5.jar"; rm -f "$2"' _ "$DL/log4j-api-2.25.5.jar" {} \;

      # --- (c) commons-lang3 3.9 -> 3.18.0 (x-pack-ent-search; other modules already 3.18+)
      getj "$MC/org/apache/commons/commons-lang3/3.18.0/commons-lang3-3.18.0.jar" commons-lang3-3.18.0.jar 4eeeae8d20c078abb64b015ec158add383ac581571cddc45c68f0c9ae0230720
      find "$dest/modules" -name 'commons-lang3-3.9.jar' -exec sh -c 'cp "$1" "$(dirname "$2")/commons-lang3-3.18.0.jar"; rm -f "$2"' _ "$DL/commons-lang3-3.18.0.jar" {} \;

      # --- (d) opentelemetry-api 1.47.0 -> 1.62.0 (repository-gcs; modules/apm already ships
      #     1.62.0, so 1.62.0 is proven compatible with ES's OTel usage)
      getj "$MC/io/opentelemetry/opentelemetry-api/1.62.0/opentelemetry-api-1.62.0.jar" opentelemetry-api-1.62.0.jar d58143928c049233653e6bf1282ff8a767ebdd5e6a82b3f336158c30e40b431d
      find "$dest/modules" -name 'opentelemetry-api-1.47.0.jar' -exec sh -c 'cp "$1" "$(dirname "$2")/opentelemetry-api-1.62.0.jar"; rm -f "$2"' _ "$DL/opentelemetry-api-1.62.0.jar" {} \;

      # --- (e) reactor-netty CVE-2025-22227 (fixed in 1.2.5). Up to ES 9.5.2 this block
      #     swapped the bundled 1.0.45 for 1.2.8. ES 9.5.4 bundles 1.2.18 itself, which is
      #     already past the fix, so the swap is DROPPED: the `rm -f` for 1.0.45 matched
      #     nothing while the 1.2.8 copy still landed, leaving two jars of the same JPMS
      #     module in x-pack-inference and killing boot with
      #     "Two versions of module reactor.netty.http found".
      #
      #     Assert instead of trusting it. If a later ES bundles a reactor-netty older than
      #     the 1.2.5 fix, this must fail loudly rather than ship the CVE back.
      infd="$dest/modules/x-pack-inference"
      for comp in core http; do
        f=$(ls "$infd"/reactor-netty-$comp-*.jar 2>/dev/null | head -1)
        test -n "$f" || { echo "reactor-netty-$comp missing from x-pack-inference"; exit 1; }
        n=$(basename "$f"); v=${n#reactor-netty-$comp-}; v=${v%.jar}
        test "$(printf '%s\n1.2.5\n' "$v" | sort -V | head -1)" = "1.2.5" || {
          echo "reactor-netty-$comp is $v, older than the 1.2.5 fix for CVE-2025-22227"; exit 1; }
        echo "reactor-netty-$comp $v ok (>= 1.2.5)"
      done
      test "$(ls "$infd"/reactor-netty-http-*.jar | wc -l)" = 1 || {
        echo "more than one reactor-netty-http jar in x-pack-inference"; exit 1; }

      # --- (f) SURGERY on Elastic's OWN core x-content uber-jar (un-droppable). It embeds
      #     jackson-core 2.18.8 as an EXPLODED, UN-RELOCATED impl dir under IMPL-JARS/, read
      #     by Elastic's EmbeddedImplClassLoader via a plain-text LISTING.TXT (no checksum /
      #     per-class manifest). Rebuild that impl dir from jackson-core 2.18.9 and update
      #     LISTING.TXT so the embedded loader finds the renamed dir. Two copies (server lib
      #     + plugin-cli tool).
      xc_surgery() {
        jarp="$1"; w="$PW/xc"; rm -rf "$w"; mkdir -p "$w"
        ( cd "$w" && unzip -qo "$jarp" )
        imp="$w/IMPL-JARS/x-content"
        rm -rf "$imp/jackson-core-2.18.8.jar"
        mkdir -p "$imp/jackson-core-2.18.9.jar"
        ( cd "$imp/jackson-core-2.18.9.jar" && unzip -qo "$DL/jackson-core-2.18.9.jar" )
        sed -i 's/jackson-core-2\.18\.8\.jar/jackson-core-2.18.9.jar/' "$imp/LISTING.TXT"
        rm -f "$jarp"; ( cd "$w" && zip -qrX "$jarp" . )
      }
      xc_surgery "$dest/lib/elasticsearch-x-content-${{package.version}}.jar"
      xc_surgery "$dest/lib/tools/plugin-cli/elasticsearch-x-content-${{package.version}}.jar"

      # --- (g) netty 4.1.135.Final -> 4.1.137.Final (Aug-2026: 4.1.136 itself picked up
      #     CVE-2026-59903 in netty-codec-http, fixed in 4.1.137.Final; the whole set moves
      #     together so the modules never mix netty patch levels). The
      #     RETAINED modules (transport-netty4, x-pack-security, x-pack-inference,
      #     esql-datasource-grpc) bundle standalone io.netty jars; the azure/iceberg/gcs
      #     datasources + repository-azure that also carried netty were dropped in (a) above.
      #     netty is ABI-stable within 4.1.x -> content-swap in place keeping the 4.1.135
      #     filename (Trivy reads the jar's pom.properties = 4.1.137 -> clean).
      nettyswap() { # <artifact> <sha256-of-4.1.137>
        getj "$MC/io/netty/$1/4.1.137.Final/$1-4.1.137.Final.jar" "$1-4.1.137.Final.jar" "$2"
        find "$dest/modules" -name "$1-4.1.135.Final.jar" -exec cp "$DL/$1-4.1.137.Final.jar" {} \;
      }
      nettyswap netty-buffer                        f474b14c7734f15e0540394cb6f39d67777b7581a42919e4ac89d253d4efd929
      nettyswap netty-codec                         9987b6a660b0a6b1f0d791485dae33180b3d1c63687c006fe6d3fd025e9e3798
      nettyswap netty-codec-dns                     2d9a33ce41bd9f6f607df95039e42518a1fca16f83c9bbfe72beb57df6e2489f
      nettyswap netty-codec-http                    0535bb5a736472bef5c948d15eb273c4ab9f796656fc7c5d6b982ad92bddbd49
      nettyswap netty-codec-http2                   576ddcfb51b78e86f145c9a52b60e500b1a1d5a257cafec8aa5416ffba044b49
      nettyswap netty-codec-socks                   4a6190e08988c058bfeef2b5965e71946439c771abf721c68f4039b4e7b023e8
      nettyswap netty-common                        d31926b01adcc07af86f5e27b81b6d6c115df17d366e835d1fc3f5a1924e7e52
      nettyswap netty-handler                       d0e4c6ee4779f59f6ab2fb5d388e4f57147c82270164b37945764bb9bda96a44
      nettyswap netty-handler-proxy                 843de10c4cef34cbc1a5344090f1b57db532fbebf141559862da675f6b656df4
      nettyswap netty-resolver                      b4cf2aeedd9fc7c8c439bbfe574f63cfe5b83392e88bbc07ca0e8424b7cff955
      nettyswap netty-resolver-dns                  898d63ca62ed68ff46543c5344f969424b417f1e8d082fe2bb0181ba10144194
      nettyswap netty-transport                     6251adc2a2921572382732a2db188d4f4f2251fd6ebb49c5d44bbf33d6bfb1a7
      nettyswap netty-transport-classes-epoll       55049554b799dc8e53bf234fffa36e001f7b5b65c32994b9bd59fc6356f1c52f
      nettyswap netty-transport-native-unix-common  8056e7637f9948f953314894cf995ab664711b66c73c4cd5b593ae84f0b1048c
      # --- (h) lz4-java 1.10.1 -> 1.11.1 in core lib/ (CVE-2026-59949 MEDIUM: the native
      #     XXHash impl can crash the JVM on invalid input; new in the 9.4.4 bundle). Same
      #     at.yawk.lz4 coordinates, same net/jpountz layout, and the 1.11.1 jar still ships
      #     the linux amd64 + aarch64 natives -> content-swap in place keeping the 1.10.1
      #     filename (Trivy reads the jar's pom.properties = 1.11.1; the derived automatic-
      #     module name comes from the filename, so the module graph is untouched).
      #
      # This swap MUST target whatever lz4 jar upstream actually ships, not a hardcoded
      # 1.10.1 filename. Elasticsearch 9.5.1 bundles lz4-java-1.11.1.jar itself, so the
      # old `cp ... "$dest/lib/lz4-java-1.10.1.jar"` stopped overwriting and started
      # CREATING a second jar. The JVM then refused to boot:
      #   java.lang.module.FindException: Two versions of module org.lz4.java found in
      #   /opt/elasticsearch/lib (lz4-java-1.10.1.jar and lz4-java-1.11.1.jar)
      # Resolve the real filename, and skip the swap entirely once upstream ships >= 1.11.1.
      lz4="$(find "$dest/lib" -maxdepth 1 -name 'lz4-java-*.jar' -print)"
      n_lz4="$(printf '%s\n' "$lz4" | grep -c . || true)"
      test "$n_lz4" -eq 1 || { echo "FATAL: expected exactly 1 lz4 jar, found $n_lz4:"; \
                              printf '%s\n' "$lz4"; exit 1; }
      lz4ver="$(basename "$lz4" .jar)"; lz4ver="${lz4ver#lz4-java-}"
      case "$lz4ver" in
        1.10.*)
          echo "lz4-java $lz4ver is vulnerable; content-swapping 1.11.1 into $(basename "$lz4")"
          getj "$MC/at/yawk/lz4/lz4-java/1.11.1/lz4-java-1.11.1.jar" lz4-java-1.11.1.jar e5e31b195fcc7e9c5da4b191af3b0082ee616c13f61cbd79409ffa65e4dd5c47
          cp "$DL/lz4-java-1.11.1.jar" "$lz4"
          ;;
        *)
          echo "lz4-java $lz4ver already >= 1.11.1 upstream; no swap needed"
          ;;
      esac
      # Whatever happened above, exactly one lz4 jar must remain or the JVM will not boot.
      n_lz4="$(find "$dest/lib" -maxdepth 1 -name 'lz4-java-*.jar' | wc -l)"
      test "$n_lz4" -eq 1 || { echo "FATAL: $n_lz4 lz4 jars after the swap"; \
                              find "$dest/lib" -maxdepth 1 -name 'lz4-java-*.jar'; exit 1; }

      rm -rf "$PW"
      # ========================================================================

      # Elasticsearch ships config/ with restrictive perms; the nonroot runtime user must
      # be able to read them to seed the writable conf dir (and execute the launchers).
      chmod -R a+rX "$dest"
      # bake a config-from-env entrypoint. The read-only rootfs means config, data, and
      # logs live under writable mounts; ES_* env override defaults.
      install -d "${{targets.destdir}}/usr/bin"
      cat > "${{targets.destdir}}/usr/bin/docker-entrypoint.sh" <<'EOS'
      #!/bin/bash
      set -euo pipefail

      ES_HOME=/opt/elasticsearch
      CONF="${ES_PATH_CONF:-/conf}"
      DATA="${ES_PATH_DATA:-/data}"
      LOGS="${ES_PATH_LOGS:-/var/log/elasticsearch}"
      mkdir -p "$CONF" "$DATA" "$LOGS"

      # The rootfs is read-only, so /tmp is not writable. jvm.options sets
      # -Djava.io.tmpdir=${ES_TMPDIR}; the SERVER JVM unpacks native libs / creates temp
      # under it, so point ES_TMPDIR at a writable path or it dies on the read-only /tmp.
      export ES_TMPDIR="${ES_TMPDIR:-$DATA/tmp}"
      mkdir -p "$ES_TMPDIR"

      # The bin/elasticsearch LAUNCHER runs a small bootstrap JVM (ServerLauncher) that
      # parses jvm.options and calls Files.createTempDirectory under ITS java.io.tmpdir
      # (defaults to /tmp) BEFORE ES_TMPDIR is applied to the server -- on a read-only
      # rootfs that throws (JvmOption.setWorkingDir). The launcher unsets
      # JAVA_TOOL_OPTIONS/_JAVA_OPTIONS but honors+appends CLI_JAVA_OPTS, so steer the
      # bootstrap JVM's tmpdir at the writable dir too.
      export CLI_JAVA_OPTS="-Djava.io.tmpdir=${ES_TMPDIR} ${CLI_JAVA_OPTS:-}"

      # seed the config dir from the distribution once (jvm.options, log4j2.properties,
      # role/user files Elasticsearch needs alongside elasticsearch.yml)
      if [ ! -f "$CONF/jvm.options" ]; then
        cp -r "$ES_HOME"/config/. "$CONF"/
      fi
      # jvm.options ships relative log/error paths resolved from the (read-only) CWD;
      # repoint them at the writable LOGS dir so the JVM can create them. (java.io.tmpdir
      # already uses ${ES_TMPDIR}; HeapDumpPath ships commented out.)
      sed -i \
        -e "s#:file=gc.log#:file=${LOGS}/gc.log#" \
        -e "s#-XX:ErrorFile=hs_err#-XX:ErrorFile=${LOGS}/hs_err#" \
        "$CONF/jvm.options"

      # generate elasticsearch.yml from env (single-node). xpack.security is DISABLED by
      # default: ES 8.x+ defaults security ON and auto-generates certs/passwords on first
      # boot, which is painful for a single-node hardened image -- disabling it matches the
      # established QuenchWorks posture (security off for an internal deployment, the
      # NetworkPolicy is the boundary). Re-enable + configure TLS for production.
      {
        echo "cluster.name: ${ES_CLUSTER_NAME:-quench-elasticsearch}"
        echo "node.name: ${ES_NODE_NAME:-${HOSTNAME:-node-1}}"
        echo "network.host: 0.0.0.0"
        echo "http.port: ${ES_HTTP_PORT:-9200}"
        echo "transport.port: ${ES_TRANSPORT_PORT:-9300}"
        echo "discovery.type: ${ES_DISCOVERY_TYPE:-single-node}"
        echo "path.data: $DATA"
        echo "path.logs: $LOGS"
        echo "xpack.security.enabled: ${ES_SECURITY_ENABLED:-false}"
        if [ -n "${ES_CONFIG_EXTRA:-}" ]; then printf '%s\n' "${ES_CONFIG_EXTRA}"; fi
      } > "$CONF/elasticsearch.yml"

      export ES_JAVA_HOME="${ES_JAVA_HOME:-/usr/lib/jvm/java-21-openjdk}"
      export ES_PATH_CONF="$CONF"
      exec "$ES_HOME/bin/elasticsearch"
      EOS
      chmod 0755 "${{targets.destdir}}/usr/bin/docker-entrypoint.sh"

test:
  pipeline:
    - runs: |
        test -x /opt/elasticsearch/bin/elasticsearch
