declare -A SHA_AMD=(
  [9.4.3]=d53f8d3efeb830b73704873d082b940158deb9387937ed817eea89d2bf542ece24dae877548e4b48b0e134d5123704f04c86be23dcd9cb732a2489868a8dd0c5
)
declare -A SHA_ARM=(
