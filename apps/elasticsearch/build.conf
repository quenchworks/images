# HISTORY 2026-08-10 (was: 9.4.4 chart hold). The 9.4.4 symptom -- helm --wait
# succeeds, then /_cluster/health stops answering ~5s later -- does NOT reproduce on
# 9.5.0. Diagnosed against a real kind cluster: the pod held ready=true with 0
# restarts for 150s straight, and an independent helper pod got 6 consecutive 200s
# from /_cluster/health plus a successful index+get roundtrip. Chart advanced
# 9.4.3 -> 9.5.0 (chart 0.0.13).
#   The old suspicion that "the readiness probe is TCP-only and masking the failure"
#   was WRONG: readiness is a real httpGet on /_cluster/health (failureThreshold 40).
#   It is LIVENESS that is tcpSocket-only -- and that is deliberate, not a bug: an
#   HTTP liveness probe would restart ES during long GC pauses and cause restart
#   storms, so TCP liveness + HTTP readiness is the correct pairing. Left as is.
# HISTORY 2026-07-09 -- the jar surgery techniques below are still what the recipe does.
# (0-CVE, unblocked that day.) The prior "needs an upstream fork"
# verdict was too pessimistic: the shaded jackson inside Elastic's OWN x-content core jar
# is stored UN-RELOCATED and exploded, so it is swappable via nested surgery. Gate passes;
# ES 9.4.4 boots clean under the strict module/entitlements system (cluster health OK,
# index+get roundtrip, nonroot 1001). Techniques (see melange.yaml):
#
#  * NESTED SURGERY on Elastic's core lib/elasticsearch-x-content-<VER>.jar (+ its
#    plugin-cli copy): it embeds jackson-core 2.18.8 as an EXPLODED impl dir under
#    IMPL-JARS/x-content/jackson-core-2.18.8.jar/ (plain com/fasterxml packages, NOT
#    relocated), loaded by Elastic's EmbeddedImplClassLoader via a plain-text LISTING.TXT
#    (no checksum, no per-class manifest). We rebuild that dir from jackson-core 2.18.9 and
#    rewrite LISTING.TXT. The module system accepts the modified jar and boots.
#  * DROP (optional, vuln shaded/entangled): bin sql-cli client (shaded jackson-core);
#    the esql-datasource-{iceberg,parquet,azure,gcs} modules (iceberg/parquet embed the
#    parquet-hadoop-bundle uber-jar shading jackson 2.19.2; azure/gcs pull reactor-netty /
#    opentelemetry) -- nothing core depends on them; and repository-azure (Azure snapshot
#    repo whose reactor-netty 1.0.45 sits on the OLD reactor-core 3.4.38, incompatible with
#    the fixed reactor-netty 1.2.8).
#  * STANDALONE SWAPS (sha256-pinned Maven Central, backward-compat within their lines):
#    jackson core+databind+annotations 2.18.8 -> 2.18.9 across ingest-geoip/legacy-geo/
#    repository-gcs/x-pack-{ent-search,esql,inference,monitoring,sql}; commons-lang3
#    3.9 -> 3.18.0 (x-pack-ent-search); lz4-java 1.10.1 -> 1.11.1 (core lib/,
#    CVE-2026-59949, new in the 9.4.4 bundle); opentelemetry-api 1.47.0 -> 1.62.0 (repository-gcs;
#    modules/apm already ships 1.62.0); reactor-netty core+http 1.0.45 -> 1.2.8 in
#    x-pack-inference (it bundles the newer reactor-core 3.7.5 that 1.2.8 needs).
#
# TRADE-OFFS (documented for the catalog/chart): NO ESQL external datasources
# (iceberg/parquet/azure/gcs), NO Azure snapshot repository, NO SQL-CLI client tool.
# Core search/index/ingest, x-pack ESQL/SQL/inference/monitoring, and the GCS snapshot
# repo are retained on patched deps. Image smoke boot-tests the core HTTP/cluster/index
# path; optional-module code paths are exercised by the chart's kind gate. Re-verify /
# drop this surgery once Elastic ships a release bundling jackson >= 2.18.9 natively.
#
# NOTE: still SSPL-1.0 / Elastic License 2.0 -- NOT OSI open source (caution tier);
# OpenSearch (Apache-2.0, catalog #11) is the clean drop-in alternative.
#
# elasticsearch: from-source via melange (fetch the per-arch binary dist, sha512).
# Newest stable release only (full X.Y.Z, used as-is). Per-arch sha512. ES 9.x
# runs on the full openjdk-21 (needs jdk.attach), pinned in melange.yaml.
#   __VER__ = version  __SHA_AMD__ = x86_64 sha512  __SHA_ARM__ = aarch64 sha512
