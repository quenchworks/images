# grafana-alloy: from-source via melange (Go build from the git tag tarball).
# Image-only (an OpenTelemetry Collector distribution / telemetry agent, no chart
# here). Latest patch of the last 3 minor lines (1.17, 1.18, 1.19). Alloy embeds a
# React web UI (go:embed via the `embedalloyui` build tag), so the melange build
# compiles that UI with npm first, then the single Go binary. All three releases
# use the SAME build recipe (GO_TAGS "netgo embedalloyui", version stamped into
# github.com/grafana/alloy/internal/build.Version), so a single __VER__ +
# per-version source-tarball __SHA256__ render suffices. Upstream tags carry a
# "v" prefix; the release tarball is v${VER}.tar.gz.
FROM_SOURCE=1
VERSIONS=(1.17.1 1.18.1 1.19.2)
declare -A SHA256=(
  [1.17.1]=a3072c30a70901764bb31f26c7fa126cf1f625ac5c34e7cd407fcefad8c8f461
  [1.18.1]=88bf81cf58479a035479cbf312376009bcec68f38ed5b3b687358f2ac7f8c6bb
  [1.19.2]=3906c641ccfa03ad2ff777618c13ca3a0ee8417f995d192b5912d310aa5a34a4
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }


# STATUS 2026-09-16 -- UNBLOCKED (BLOCKED=0). First MEASURED verdict this app has
# ever had: run 35097728557 built all 6 legs from source and ran the real gate.
#
# WHAT THE 2026-08-27 BLOCK CLAIMED, AND WHETHER IT HELD. It claimed
# github.com/docker/docker v28.5.2+incompatible / CVE-2026-33997 was unfixable
# because the fix lives only on the renamed moby v29 module path. That was RIGHT
# on both counts, and the gate confirmed it: on 1.19.2 the scan found exactly ONE
# finding, that CVE, "Fixed Version 29.3.1", and it is NOT dropped by
# --ignore-unfixed (Trivy does carry a fixed version for it, whatever OSV's bare
# {"introduced":"0"} range suggests -- do not re-derive this from OSV). The
# module wall itself is unchanged today: proxy.golang.org still answers
# v28.5.2+incompatible for @latest on both github.com/docker/docker and
# github.com/moby/moby, and v29 ships only as moby/moby/{api,client} plus
# moby/moby/v2 betas. There is still nothing to float to.
#
# WHAT THE BLOCK GOT WRONG: that it could only be cleared by Grafana. It listed
# four importers of docker/docker. Three are already gone by 1.19.2 --
# prometheus v0.313.2 discovery/moby and opentelemetry-collector-contrib
# internal/metadataproviders v0.158.0 both moved to github.com/moby/moby/client,
# and alloy 1.19.2 dropped the grafana/prometheus fork replace. That leaves
# cadvisor, and Grafana DID rebase the fork -- branch grafana-v0.60.5-noglobals
# (commit 6f984a063abc, 2026-09-14) tracks google/cadvisor v0.60.5 and is on
# github.com/moby/moby/client. Alloy just still pins the old Feb-2026 commit. So
# melange.yaml repoints the replace at the rebased fork, which removes the last
# importer. A binary assertion fails the build if docker/docker ever comes back,
# so the pin cannot rot into a silent regression.
#
# THE OTHER FINDINGS (all ordinary float targets, now in FLOOR): apache/thrift
# CVE-2026-43871 -> v0.24.0, go-git/go-git/v5 CVE-2026-71556/71557 -> v5.19.2,
# cilium/ebpf CVE-2026-10722 -> v0.22.0. 1.17.1 showed 5 findings, 1.18.1 four,
# 1.19.2 one -- the older lines carry more, which is why the version set moved.
#
# THE FLOAT. This recipe carried NO module float at all before today, which alone
# would have kept it red. melange.yaml now runs the house floor
# (docs/go-module-float.md) inside ./collector -- the module actually built, and
# the only go.mod whose replaces MVS honours -- applied as SELF-REPLACES rather
# than `go get`, because every floored module is `// indirect` there and a bare
# `go get` on an indirect require is reverted to the MVS minimum. The set is
# computed per version so no floor can invert into a downgrade, and the shipped
# binary is asserted against the floor with `go version -m` dep/=> pairs
# collapsed to the version that was actually linked.
#
# VERSIONS bumped 1.15.1/1.16.3/1.17.1 -> 1.17.1/1.18.1/1.19.2, per this file's
# own "last 3 minor lines" policy. Build shape is identical across the three
# (./collector module, .nvmrc 24.16.0, go 1.26.x, //go:embed dist behind
# embedalloyui), so no other recipe change was needed. sha256s are from the real
# release tarballs; 1.17.1 reproduced the value already recorded here.
#
# Not measurable locally: the Go compile of the collector module OOMs under the
# 3500M cap this work runs under, so CI is the measurement for this app.
BLOCKED=0
