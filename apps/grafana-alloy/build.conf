# docker/docker/client, and alloy 1.19.2 still requires docker/docker
# v28.5.2+incompatible. Nothing on our side can move it.
#
# But it was never the GATE blocker, and the 2026-08-27 note never measured one
# (its local build was OOM-killed, so it recorded zero Trivy output). Every
# advisory OSV/GHSA carries for github.com/docker/docker is UNFIXED -- checked
# today, all five have a bare {"introduced":"0"} range with no fixed event:
#   CVE-2026-33997 (GHSA-pxq6-2prw-chj9 / GO-2026-4883)
#   CVE-2026-34040 (GHSA-x744-4wpc-v9h2 / GO-2026-4887)
#   CVE-2026-42306 (GHSA-rg2x-37c3-w2rh), CVE-2026-41568 (GHSA-vp62-88p7-qqf5),
#   CVE-2026-41567 (GHSA-x86f-5xw2-fm2r)
# The gate runs `--ignore-unfixed`, so it drops all of them. The "fixed in
# 29.3.1" the original 2026-07-03 note quoted is not in the advisory data any
# more; the advisories were revised once the module path split. Same conclusion
# apps/coolify-helper reached on 2026-09-15 by live re-check.
#
# WHAT ACTUALLY NEEDED FIXING: this recipe carried NO module float at all, which
# is the real reason it could never have gone green. melange.yaml now runs the
# house floor (docs/go-module-float.md) inside ./collector -- the module that is
# actually built, and the only go.mod whose replaces MVS honours. Applied as
# SELF-REPLACES rather than `go get`, because every floored module is `// indirect`
# in collector/go.mod and a bare `go get` on an indirect require is reverted to
# the MVS minimum; a replace is not. The selection is computed per version, so no
# floor can turn into a downgrade:
#   1.19.2 is already at/above every x/* floor -- only x/crypto v0.55.0 -> v0.56.0
#          and grpc v1.83.0 -> v1.83.2 float.
#   1.18.1 floats x/net, x/crypto, x/text, x/sys, x/mod, grpc; otel already v1.44.0.
#   1.17.1 floats those plus otel v1.43.0 -> v1.44.0 (GO-2026-5158).
#
# VERSIONS bumped 1.15.1/1.16.3/1.17.1 -> 1.17.1/1.18.1/1.19.2: the file's own
# "last 3 minor lines" policy, and it is also what makes the float small. The
# build shape is unchanged across all three (./collector module, .nvmrc 24.16.0,
# go 1.26.x, //go:embed dist behind embedalloyui), so the recipe needed no other
# edit. sha256s computed from the real release tarballs; 1.17.1 reproduced the
# value already recorded here, which validates the method.
#
# Still not measured locally: the build does not fit the 3500M memory cap this
# work runs under (the Go compile of the collector module OOMs), so CI is the
# measurement. If the gate fails, its table names the real blockers and this
# header gets them.
BLOCKED=0
