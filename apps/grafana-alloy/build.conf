# github.com/moby/moby, v29 ships only as github.com/moby/moby/{api,client} plus
# moby/moby/v2 betas, and a self-replace cannot express a +incompatible major
# ("should be v0 or v1, not v29"). Trivy does carry "Fixed Version 29.3.1", so
