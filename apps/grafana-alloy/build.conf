# opposite from OSV's bare {"introduced":"0"} range and was wrong; do not redo it.
#
# WHAT THE BLOCK GOT WRONG: that the version route was the only route. It is not
# imported by alloy's own tree at all, and of the four importers the note listed,
# three are gone by 1.18.1 -- prometheus v0.312.0+ discovery/moby and
# opentelemetry-collector-contrib metadataproviders v0.153.0+ both moved to
# github.com/moby/moby/client. The one left is cadvisor, and what it uses is
# entirely client-side (client, api/types/{system,image,container}, api/types),
# so neither vulnerable daemon path is in the binary -- only the module label.
# melange.yaml now SEVERS it: the client-side closure is copied into a local
# module, every github.com/docker/docker/ import is rewritten to it in that copy
# AND in a local copy of the cadvisor fork, and the shipped binary is asserted to
# carry no github.com/docker/docker at all. Same play as apps/gitness and
# apps/coolify-helper.
#
# DEAD END, DO NOT RETRY (cost a run, 35099396906): repointing the cadvisor
# replace at Grafana's rebased fork (grafana-v0.60.5-noglobals, commit
# 6f984a063abc, which IS on github.com/moby/moby/client) does not compile.
# cadvisor v0.60 moved cache/memory, container, manager, metrics, storage and
# utils/sysfs into the separate github.com/google/cadvisor/cmd module, and alloy
# internal/static/integrations/cadvisor imports them at their old root-module
# paths. That is why Grafana itself still pins the Feb-2026 v0.54.1 commit.
#
# WHY 1.17.1 IS NOT BUILT (dropped from VERSIONS, a deliberate deviation from the
# three-minor-line habit):
#   * it needs THREE modules severed, not one -- its grafana/prometheus fork
#     replace and contrib metadataproviders v0.147.0 both still import
#     github.com/docker/docker; and
#   * it cannot take the cilium/ebpf@v0.22.0 floor (CVE-2026-10722): v0.22.0
#     removes btf.FlushKernelSpec, which the grafana/opentelemetry-ebpf-
#     instrumentation v1.18.4 it pins calls, so the floor breaks its build
#     outright (measured, run 35099937413).
# Two lines of work for the oldest line of three, which alloy's next minor
# retires anyway. Re-add it only if upstream keeps 1.17 alive unusually long.
#
# THE FLOAT. This recipe carried NO module float before today, which alone kept
# it red. melange.yaml now runs the house floor (docs/go-module-float.md) inside
# ./collector -- the module actually built, and the only go.mod whose replaces
# MVS honours -- applied as SELF-REPLACES rather than `go get`, because every
# floored module is `// indirect` there and a bare `go get` on an indirect
# require is reverted to the MVS minimum. The set is computed per version so no
# floor can invert into a downgrade, and the shipped binary is asserted against
# the floor with `go version -m` dep/=> pairs collapsed to the linked version.
# It cleared apache/thrift CVE-2026-43871, go-git/go-git/v5 CVE-2026-71556/71557
# and cilium/ebpf CVE-2026-10722.
#
# VERSIONS bumped 1.15.1/1.16.3/1.17.1 -> 1.18.1/1.19.2. Build shape is identical
# across them (./collector module, .nvmrc 24.16.0, go 1.26.x, //go:embed dist
# behind embedalloyui). sha256s are from the real release tarballs.
