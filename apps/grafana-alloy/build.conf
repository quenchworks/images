# Re-check by clearing BLOCKED=0 and dispatching; the gate arbitrates in ~10 min.
#
# EVERYTHING ELSE IS FIXED, and that is new. This recipe carried NO module float
# at all before today, which alone kept it red. melange.yaml now runs the house
# floor (docs/go-module-float.md) inside ./collector -- the module actually
# built, and the only go.mod whose replaces MVS honours -- applied as
# SELF-REPLACES rather than `go get`, because every floored module is
# `// indirect` there and a bare `go get` on an indirect require is reverted to
# the MVS minimum. The set is computed per version so no floor can invert into a
# downgrade, and the shipped binary is asserted against the floor with
# `go version -m` dep/=> pairs collapsed to the version actually linked. It
# cleared apache/thrift CVE-2026-43871 and go-git/go-git/v5
# CVE-2026-71556/71557 outright. cilium/ebpf@v0.22.0 is deliberately NOT in the
