#   * alloy ports internal/static/integrations/cadvisor to the cadvisor v0.60
#     layout and repoints the replace at grafana-v0.60.5-noglobals or later; then
#     delete the dead-end note in melange.yaml and rebuild. Watch alloy's go.mod
