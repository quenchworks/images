# Builds Grafana Alloy from source onto Wolfi. Alloy is Grafana's OpenTelemetry
# Collector distribution / all-in-one telemetry agent (receives, processes and
# ships metrics/logs/traces/profiles). One large Go binary. Output is a signed APK
# in Quenchworks' own repo. No upstream distro binaries. Image-only (no chart here).
#
# BUILD METHOD -- Alloy's production binary is `make alloy`, which (a) builds the
# React web UI under internal/web/ui with npm, then (b) `cd collector && go build`
# with GO_TAGS "netgo embedalloyui promtail_journal_enabled" and the version stamped
# via -X ldflags. We reproduce that pipeline directly (instead of driving `make`) so
# we can skip upstream's optional codegen/journald pieces and keep the runtime clean:
#   1. internal/web/ui: `npm ci && npm run build` -> internal/web/ui/dist. The
#      `embedalloyui` tag makes internal/web/ui/assets_builtin.go `//go:embed dist`,
#      baking the built browser UI into the binary (no runtime UI files needed).
#   2. `cd collector && CGO_ENABLED=0 go build -tags "netgo embedalloyui"`. `collector`
#      is a separate Go module (github.com/grafana/alloy/otel_engine) whose main.go is
#      Alloy's entrypoint; it `replace`s github.com/grafana/alloy => ../, so the parent
#      packages (incl. the embedded UI + the build.Version stamp) compile in.
#
# We drop upstream's `promtail_journal_enabled` tag: it enables the loki.source.journal
# component via CGO against libsystemd, which would pull a systemd runtime dependency
# (and its CVE surface) into an otherwise static, glibc-free image. Everything else in
# the default distribution is retained. CGO is disabled (netgo, pure-Go static binary)
# -- matches our sibling Go agents (prometheus, alertmanager, otel-collector).
#
# VERSION STAMP -- upstream stamps github.com/grafana/alloy/internal/build.Version
# (normalized to a leading "v"); `alloy --version` / the build_info metric then report
# the real release. We pass v${package.version} and match upstream's release ldflags
# (-s -w). go.mod pins go 1.26.x; go-1.26 + GOTOOLCHAIN=local uses it without a
# toolchain download and picks up the latest stdlib CVE fixes.
package:
  name: quench-grafana-alloy
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Grafana Alloy (OpenTelemetry Collector distribution / telemetry agent), built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - bash
      - ca-certificates-bundle
      - findutils
      # go.mod pins go 1.26.x; use go-1.26 (newest stdlib CVE fixes) with
      # GOTOOLCHAIN=local so no toolchain is fetched.
      - go-1.26
      # UI toolchain: internal/web/ui is a Vite/React app. .nvmrc pins Node 24;
      # `npm ci && npm run build` -> internal/web/ui/dist, embedded via embedalloyui.
      - nodejs-24
      - npm

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/grafana/alloy/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - name: Build the embedded web UI from source (npm -> internal/web/ui/dist)
    runs: |
      set -eu
      # npm needs a writable cache + HOME (both writable in the sandbox).
      export npm_config_cache="$(mktemp -d)"
      export HOME="$(mktemp -d)"
      cd internal/web/ui
      npm ci --no-audit --no-fund --ignore-scripts
      npm run build
      # assets_builtin.go does `//go:embed dist`; assert the build produced it.
      test -f dist/index.html

  - name: Build the alloy binary (static, CGO off, UI embedded)
    runs: |
      set -eu
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      export GOTOOLCHAIN=local
      export GO111MODULE=on
      # Upstream normalizes Version to a leading "v" (internal/build.normalizeVersion).
      VERPKG="github.com/grafana/alloy/internal/build"
      LDFLAGS="-s -w -X ${VERPKG}.Version=v${{package.version}} -X ${VERPKG}.Branch=HEAD -X ${VERPKG}.BuildUser=quenchworks"
      # main.go lives in the ./collector module; it replaces github.com/grafana/alloy
      # => ../, so the parent packages (embedded UI, build.Version) compile in.
      # ./collector is the MAIN module of this build, so it is the only go.mod
      # whose replace directives MVS honours -- the float has to happen here.
      cd collector

      # ---- drop the last github.com/docker/docker importer -------------------
      # CVE-2026-33997 (docker/docker v28.5.2+incompatible, "fixed in 29.3.1") is
      # unreachable by floating: proxy.golang.org still answers
      # v28.5.2+incompatible for @latest on both github.com/docker/docker and
      # github.com/moby/moby, and the v29 code ships only as the split modules
      # github.com/moby/moby/{api,client} plus moby/moby/v2 betas. The fix is to
      # stop importing it. By 1.19.2 alloy's other three importers are already
      # gone -- prometheus v0.313.2 discovery/moby and
      # opentelemetry-collector-contrib internal/metadataproviders v0.158.0 both
      # moved to github.com/moby/moby/client -- leaving only cadvisor, which
      # upstream alloy still holds on an old fork commit:
      #   replace github.com/google/cadvisor => github.com/grafana/cadvisor v0.0.0-20260204200106-...
      # Grafana rebased that fork on 2026-09-14 (branch grafana-v0.60.5-noglobals,
      # tracking google/cadvisor v0.60.5, which is on github.com/moby/moby/client)
      # but has not repointed alloy at it yet. Do that here. This is a PIN, so the
      # assertion below is the thing that keeps it honest: if a future alloy
      # version reintroduces docker/docker by any path, the build fails rather
      # than shipping the CVE behind a green gate.
      go mod edit -replace \
        github.com/google/cadvisor=github.com/grafana/cadvisor@v0.0.0-20260914142459-6f984a063abc

      # ---- 0-CVE module float (docs/go-module-float.md) ----------------------
      # FLOOR is a FLOOR, not a pin: a hardcoded bump becomes a DOWNGRADE the
      # moment upstream moves past it, re-introducing the CVE it was added to
      # clear. Alloy spans three minor lines here and each one sits at a
      # different point (1.19.2 is already above every x/* floor and only needs
      # crypto+grpc; 1.17.1 needs the lot), so the selection has to be computed,
      # never written out per version.
      #
      # Floors are applied as SELF-REPLACES, not `go get`: every module below is
      # `// indirect` in collector/go.mod, and a bare `go get` on an indirect
      # require is reverted to the graph's MVS minimum by the next resolution.
      # A replace is not. GOFLAGS=-mod=mod lets `go build` write the go.sum
      # entries for whatever the replaces pull in, so no `go mod tidy` is needed.
      FLOOR="golang.org/x/net@v0.58.0 golang.org/x/crypto@v0.56.0 golang.org/x/text@v0.41.0 golang.org/x/sys@v0.47.0 golang.org/x/mod@v0.40.0 golang.org/x/oauth2@v0.36.0 google.golang.org/grpc@v1.83.2 go.opentelemetry.io/otel@v1.44.0 go.opentelemetry.io/otel/sdk@v1.44.0 go.opentelemetry.io/otel/trace@v1.44.0 go.opentelemetry.io/otel/metric@v1.44.0 github.com/apache/thrift@v0.24.0 github.com/cilium/ebpf@v0.22.0 github.com/go-git/go-git/v5@v5.19.2"
      MODS="$(echo "$FLOOR" | tr ' ' '\n' | cut -d@ -f1)"
      # prints "<mod>@<floor> (<tag> has <ver>)" for every module below its floor
      below_floor() {
        awk -v floor="$FLOOR" -v tag="$1" '
          BEGIN { n = split(floor, f, " ")
                  for (i = 1; i <= n; i++) { split(f[i], kv, "@"); want[kv[1]] = kv[2] } }
          ($1 in want) {
            split(substr($2, 2), g, "."); split(substr(want[$1], 2), w, ".")
            for (i = 1; i <= 3; i++) {
              if ((g[i] + 0) > (w[i] + 0)) next
              if ((g[i] + 0) < (w[i] + 0)) { print $1 "@" want[$1] " (" tag " has " $2 ")"; next }
            }
          }'
      }
      # `go list -m` prints "<mod> <ver>" or "<mod> <ver> => <mod> <ver>", so $NF
      # is the EFFECTIVE version and a replace cannot hide behind the require line.
      go list -m -e $MODS
      need="$(go list -m -e $MODS | awk 'NF >= 2 && $NF ~ /^v[0-9]/ { print $1, $NF }' \
        | below_floor go.mod | awk '{ print $1 }')"
      for f in $need; do go mod edit -replace "${f%%@*}=${f}"; done

      go build -trimpath -tags "netgo embedalloyui" -ldflags "${LDFLAGS}" \
        -o "${{targets.destdir}}/usr/bin/alloy" .

      # The float is only real if it reached the BINARY. `go version -m` prints a
      # `dep` line and, when the module was replaced, an immediately following
      # `=>` line holding the version that was actually LINKED. Collapse each
      # pair to that effective version (a replace-shadowed float shows up here as
      # a `=>` below the floor) and fail the build rather than ship it.
      bad="$(go version -m "${{targets.destdir}}/usr/bin/alloy" | awk '
          $1 == "dep" { if (h) print h; h = $2 " " $3; next }
          $1 == "=>"  { h = $2 " " $3; next }
          { if (h) { print h; h = "" } }
          END { if (h) print h }' | below_floor alloy)"
      [ -z "$bad" ] || { echo "❌ 0-CVE float did not reach alloy:"; echo "$bad"; exit 1; }

      # github.com/docker/docker cannot be floated past CVE-2026-33997 (see above),
      # so the only acceptable state is its absence from the linked binary. Assert
      # it, or a reintroduced importer ships the CVE behind a green-looking gate.
      ! go version -m "${{targets.destdir}}/usr/bin/alloy" \
        | awk '$1 == "dep" || $1 == "=>" { print $2 }' \
        | grep -qx 'github.com/docker/docker' \
        || { echo "❌ github.com/docker/docker is back in the alloy binary:"; \
             go version -m "${{targets.destdir}}/usr/bin/alloy" | grep -n 'docker/docker'; exit 1; }

test:
  pipeline:
    - runs: |
        alloy --version
