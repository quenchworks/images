# Builds Grafana Alloy from source onto Wolfi. Alloy is Grafana's OpenTelemetry
# Collector distribution / all-in-one telemetry agent (receives, processes and
# ships metrics/logs/traces/profiles). One large Go binary. Output is a signed APK
# in Quenchworks' own repo. No upstream distro binaries. Image-only (no chart here).
#
# BUILD METHOD -- Alloy's production binary is `make alloy`, which (a) builds the
# React web UI under internal/web/ui with npm, then (b) `cd collector && go build`
# with GO_TAGS "netgo embedalloyui promtail_journal_enabled" and the version stamped
# via -X ldflags. We reproduce that pipeline directly (instead of driving `make`) so
# we can skip upstream's optional codegen/journald pieces and keep the runtime clean:
#   1. internal/web/ui: `npm ci && npm run build` -> internal/web/ui/dist. The
#      `embedalloyui` tag makes internal/web/ui/assets_builtin.go `//go:embed dist`,
#      baking the built browser UI into the binary (no runtime UI files needed).
#   2. `cd collector && CGO_ENABLED=0 go build -tags "netgo embedalloyui"`. `collector`
#      is a separate Go module (github.com/grafana/alloy/otel_engine) whose main.go is
#      Alloy's entrypoint; it `replace`s github.com/grafana/alloy => ../, so the parent
#      packages (incl. the embedded UI + the build.Version stamp) compile in.
#
# We drop upstream's `promtail_journal_enabled` tag: it enables the loki.source.journal
# component via CGO against libsystemd, which would pull a systemd runtime dependency
# (and its CVE surface) into an otherwise static, glibc-free image. Everything else in
# the default distribution is retained. CGO is disabled (netgo, pure-Go static binary)
# -- matches our sibling Go agents (prometheus, alertmanager, otel-collector).
#
# VERSION STAMP -- upstream stamps github.com/grafana/alloy/internal/build.Version
# (normalized to a leading "v"); `alloy --version` / the build_info metric then report
# the real release. We pass v${package.version} and match upstream's release ldflags
# (-s -w). go.mod pins go 1.26.x; go-1.26 + GOTOOLCHAIN=local uses it without a
# toolchain download and picks up the latest stdlib CVE fixes.
package:
  name: quench-grafana-alloy
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Grafana Alloy (OpenTelemetry Collector distribution / telemetry agent), built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - bash
      - ca-certificates-bundle
      - findutils
      # go.mod pins go 1.26.x; use go-1.26 (newest stdlib CVE fixes) with
      # GOTOOLCHAIN=local so no toolchain is fetched.
      - go-1.26
      # UI toolchain: internal/web/ui is a Vite/React app. .nvmrc pins Node 24;
      # `npm ci && npm run build` -> internal/web/ui/dist, embedded via embedalloyui.
      - nodejs-24
      - npm

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/grafana/alloy/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__

  - name: Build the embedded web UI from source (npm -> internal/web/ui/dist)
    runs: |
      set -eu
      # npm needs a writable cache + HOME (both writable in the sandbox).
      export npm_config_cache="$(mktemp -d)"
      export HOME="$(mktemp -d)"
      cd internal/web/ui
      npm ci --no-audit --no-fund --ignore-scripts
      npm run build
      # assets_builtin.go does `//go:embed dist`; assert the build produced it.
      test -f dist/index.html

  - name: Build the alloy binary (static, CGO off, UI embedded)
    runs: |
      set -eu
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      export GOTOOLCHAIN=local
      export GO111MODULE=on
      # Upstream normalizes Version to a leading "v" (internal/build.normalizeVersion).
      VERPKG="github.com/grafana/alloy/internal/build"
      LDFLAGS="-s -w -X ${VERPKG}.Version=v${{package.version}} -X ${VERPKG}.Branch=HEAD -X ${VERPKG}.BuildUser=quenchworks"
      # main.go lives in the ./collector module; it replaces github.com/grafana/alloy
      # => ../, so the parent packages (embedded UI, build.Version) compile in.
      # ./collector is the MAIN module of this build, so it is the only go.mod
      # whose replace directives MVS honours -- the float has to happen here.
      # Alloy's own tracer declares its resource at semconv v1.41.0
      # (internal/runtime/tracing/tracing.go), while otel/sdk v1.45.0 detects its
      # default resource at v1.43.0, and resource.New REFUSES to merge two schema
      # URLs. The image then scans 0-CVE and dies at boot with
      #   building tracer: error detecting resource: conflicting Schema URL
      # so the sed is what makes the otel 1.45.0 floor below shippable at all.
      # SchemaURL/ServiceNameKey/ServiceVersionKey all exist in v1.43.0, so the
      # import path is the only thing that changes. The grep fails the build if a
      # future tag renames or moves the import instead of silently no-opping.
      # 1.20.0 already imports v1.43.0 upstream (with otel 1.46), so the rewrite
      # applies only where v1.41.0 is still imported; any other version fails.
      tr=internal/runtime/tracing/tracing.go
      if grep -q 'semconv "go.opentelemetry.io/otel/semconv/v1.41.0"' "$tr"; then
        sed -i 's|otel/semconv/v1\.41\.0|otel/semconv/v1.43.0|' "$tr"
      else
        grep -q 'semconv "go.opentelemetry.io/otel/semconv/v1.43.0"' "$tr" \
          || { echo "tracing.go imports a semconv version this recipe has not checked:" >&2; grep semconv "$tr" >&2; exit 1; }
      fi
      cd collector

      # ---- 0-CVE module float (docs/go-module-float.md) ----------------------
      # FLOOR is a FLOOR, not a pin: a hardcoded bump becomes a DOWNGRADE the
      # moment upstream moves past it, re-introducing the CVE it was added to
      # clear. Alloy spans three minor lines here and each one sits at a
      # different point (1.19.2 is already above every x/* floor and only needs
      # crypto+grpc; 1.17.1 needs the lot), so the selection has to be computed,
      # never written out per version.
      #
      # Floors are applied as SELF-REPLACES, not `go get`: every module below is
      # `// indirect` in collector/go.mod, and a bare `go get` on an indirect
      # require is reverted to the graph's MVS minimum by the next resolution.
      # A replace is not. GOFLAGS=-mod=mod lets `go build` write the go.sum
      # entries for whatever the replaces pull in, so no `go mod tidy` is needed.
      FLOOR="golang.org/x/net@v0.58.0 golang.org/x/crypto@v0.56.0 golang.org/x/text@v0.41.0 golang.org/x/sys@v0.47.0 golang.org/x/mod@v0.40.0 golang.org/x/oauth2@v0.36.0 google.golang.org/grpc@v1.83.2 go.opentelemetry.io/otel@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.45.0 go.opentelemetry.io/otel/sdk@v1.45.0 go.opentelemetry.io/otel/trace@v1.45.0 go.opentelemetry.io/otel/metric@v1.45.0 github.com/apache/thrift@v0.24.0 github.com/cilium/ebpf@v0.22.0 github.com/go-git/go-git/v5@v5.19.2 go.opentelemetry.io/otel/log@v0.21.0 go.opentelemetry.io/otel/sdk/log@v0.21.0 go.opentelemetry.io/otel/exporters/otlp/otlplog/otlploggrpc@v0.21.0 go.opentelemetry.io/otel/exporters/otlp/otlplog/otlploghttp@v0.21.0 go.opentelemetry.io/otel/exporters/stdout/stdoutlog@v0.21.0 go.opentelemetry.io/contrib/bridges/otelzap@v0.20.0"
      MODS="$(echo "$FLOOR" | tr ' ' '\n' | cut -d@ -f1)"
      # prints "<mod>@<floor> (<tag> has <ver>)" for every module below its floor
      below_floor() {
        awk -v floor="$FLOOR" -v tag="$1" '
          BEGIN { n = split(floor, f, " ")
                  for (i = 1; i <= n; i++) { split(f[i], kv, "@"); want[kv[1]] = kv[2] } }
          ($1 in want) {
            split(substr($2, 2), g, "."); split(substr(want[$1], 2), w, ".")
            for (i = 1; i <= 3; i++) {
              if ((g[i] + 0) > (w[i] + 0)) next
              if ((g[i] + 0) < (w[i] + 0)) { print $1 "@" want[$1] " (" tag " has " $2 ")"; next }
            }
          }'
      }
      # `go list -m` prints "<mod> <ver>" or "<mod> <ver> => <mod> <ver>", so $NF
      # is the EFFECTIVE version and a replace cannot hide behind the require line.
      go list -m -e $MODS
      need="$(go list -m -e $MODS | awk 'NF >= 2 && $NF ~ /^v[0-9]/ { print $1, $NF }' \
        | below_floor go.mod | awk '{ print $1 }')"
      for f in $need; do go mod edit -replace "${f%%@*}=${f}"; done

      # ---- sever github.com/docker/docker (CVE-2026-33997) --------------------
      # The CVE cannot be floated away: proxy.golang.org answers
      # v28.5.2+incompatible for @latest on BOTH github.com/docker/docker and
      # github.com/moby/moby, and the v29 code ships only as
      # github.com/moby/moby/{api,client} plus moby/moby/v2 betas -- different
      # import paths, so there is no v29.3.1 on the path Trivy names. A
      # self-replace cannot express it either (a +incompatible major is rejected:
      # "should be v0 or v1, not v29").
      #
      # So sever it, the play that cleared this same CVE on apps/gitness and
      # apps/coolify-helper. Alloy's own tree imports docker/docker nowhere; at
      # 1.18.1 and 1.19.2 the single importer left in the graph is cadvisor, held
      # by upstream's `replace github.com/google/cadvisor => github.com/grafana/cadvisor`
      # (prometheus v0.312.0+ discovery/moby and opentelemetry-collector-contrib
      # metadataproviders v0.153.0+ both moved to github.com/moby/moby/client).
      # And what cadvisor uses is entirely client-side -- client, api/types/system,
      # api/types/image, api/types/container, api/types -- so neither vulnerable
      # daemon path is in the binary; only the module label is.
      #
      # DEAD END, do not retry: repointing the cadvisor replace at Grafana's
      # rebased fork (grafana-v0.60.5-noglobals, which IS on moby/moby/client)
      # does not compile -- cadvisor v0.60 moved cache/memory, container, manager,
      # metrics, storage and utils/sysfs into the separate
      # github.com/google/cadvisor/cmd module and alloy still imports them at
      # their old root-module paths (measured, run 35099396906).
      #
      # busybox-safe: `find -exec ... +`, never `xargs` -- busybox xargs exits 123
      # when nothing matches and `set -e` then kills the step with no message.
      # 1.20.0 moved to Grafana's cadvisor v0.60.5 fork (upstream took the step
      # the DEAD END note above could not), which is on github.com/moby/moby/client,
      # so docker/docker is no longer in the graph and there is nothing to sever.
      # Run the sever only where the build still needs the module (1.19.2).
      # `go mod why -vendor -m`, not `go list -m`: the module stays in the GRAPH
      # through other modules' go.mod files, and plain `go mod why` also counts
      # dependencies' tests (1.20.0's only path is percona-backup-mongodb's gcs
      # test). -vendor drops those, matching what the binary links.
      if ! go mod why -vendor -m github.com/docker/docker | grep -q 'does not need'; then
      DD="github.com/grafana/alloy/otel_engine/ddcompat"
      go mod download github.com/docker/docker github.com/google/cadvisor
      DOCKER_DIR="$(go list -m -f '{{.Dir}}' github.com/docker/docker)"
      CAD_DIR="$(go list -m -f '{{.Dir}}' github.com/google/cadvisor)"

      rm -rf ddcompat && mkdir -p ddcompat/api
      cp -r "$DOCKER_DIR/api/types" ddcompat/api/types
      cp    "$DOCKER_DIR/api/"*.go  ddcompat/api/
      cp -r "$DOCKER_DIR/client"    ddcompat/client
      cp    "$DOCKER_DIR/LICENSE" "$DOCKER_DIR/NOTICE" ddcompat/
      chmod -R u+w ddcompat
      find ddcompat -name '*_test.go' -type f -delete
      # Keep exactly the api/types subpackages the client closure reaches. The
      # daemon-side ones (backend, plugins, auxprogress) pull in pkg/streamformatter
      # and moby/buildkit, which are not copied, so `go mod tidy` would fail on them.
      KEEP="blkiodev build checkpoint common container events filters image mount network registry storage strslice swarm system time versions volume"
      for d in ddcompat/api/types/*/; do
        n="$(basename "$d")"
        case " $KEEP " in *" $n "*) ;; *) rm -rf "$d" ;; esac
      done
      # docker/docker ships NO go.mod (hence +incompatible); vendor.mod is its real
      # require list. Seed ddcompat from it -- a bare module/go stub makes `go mod
      # tidy` resolve the missing deps at @latest, which picks go-connections
      # v0.8.1, and that release dropped sockets.DialPipe so client.go stops
      # compiling.
      sed -e "s|^module .*|module ${DD}|" "$DOCKER_DIR/vendor.mod" > ddcompat/go.mod

      rewrite() { find "$1" -name '*.go' -type f -exec sed -i -e "s|github.com/docker/docker/|${DD}/|g" {} +; }
      rewrite ddcompat

      rm -rf third_party && mkdir -p third_party
      cp -r "$CAD_DIR" third_party/cadvisor
      chmod -R u+w third_party/cadvisor
      rewrite third_party/cadvisor
      ( cd third_party/cadvisor
        go mod edit -droprequire github.com/docker/docker
        go mod edit -require "${DD}@v0.0.0" -replace "${DD}=../../ddcompat" )

      # Only the MAIN module's replaces apply, so cadvisor's own DD replace above
      # is for its local tidy -- this pair is what the build actually uses.
      go mod edit -require "${DD}@v0.0.0" -replace "${DD}=./ddcompat"
      go mod edit -replace "github.com/google/cadvisor=./third_party/cadvisor"
      ( cd ddcompat && go mod tidy )
      ( cd third_party/cadvisor && go mod tidy )
      fi

      go build -trimpath -tags "netgo embedalloyui" -ldflags "${LDFLAGS}" \
        -o "${{targets.destdir}}/usr/bin/alloy" .

      # The float is only real if it reached the BINARY. `go version -m` prints a
      # `dep` line and, when the module was replaced, an immediately following
      # `=>` line holding the version that was actually LINKED. Collapse each
      # pair to that effective version (a replace-shadowed float shows up here as
      # a `=>` below the floor) and fail the build rather than ship it.
      bad="$(go version -m "${{targets.destdir}}/usr/bin/alloy" | awk '
          $1 == "dep" { if (h) print h; h = $2 " " $3; next }
          $1 == "=>"  { h = $2 " " $3; next }
          { if (h) { print h; h = "" } }
          END { if (h) print h }' | below_floor alloy)"
      [ -z "$bad" ] || { echo "❌ 0-CVE float did not reach alloy:"; echo "$bad"; exit 1; }

      # The sever is only real if docker/docker left the BINARY. Assert it, so a
      # future version that reintroduces an importer fails loudly instead of
      # shipping the CVE behind a green-looking gate.
      if go version -m "${{targets.destdir}}/usr/bin/alloy" \
           | awk '$1 == "dep" || $1 == "=>" { print $2 }' \
           | grep -qx 'github.com/docker/docker'; then
        echo "sever failed: github.com/docker/docker is still linked into alloy"; exit 1
      fi

test:
  pipeline:
    - runs: |
        alloy --version
