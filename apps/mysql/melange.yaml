# Builds the mysql server + client from source onto Wolfi.
# Output is a signed APK in Quenchworks' own repo. No upstream distro binaries.
package:
  name: quench-mysql
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened MySQL, built from source on Wolfi"
  copyright:
    - license: GPL-2.0-only
  dependencies:
    runtime:
      - ca-certificates-bundle
      - libcurl-openssl4   # MySQL 9.x links libcurl (telemetry/components)

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - bison
      - ncurses-dev
      - openssl-dev
      - zlib-dev
      - libaio-dev
      - libtirpc-dev
      - rpcsvc-proto
      - linux-headers
      - pkgconf
      - curl-dev           # MySQL 9.x requires system libcurl (WITH_CURL=system)
      - curl               # the curl CLI: used to pre-fetch Boost into ./boost/
      # MySQL 9.x bundles abseil 20250814, which does not compile under GCC 16; use
      # Wolfi's system protobuf + abseil (WITH_PROTOBUF=system) instead.
      - protobuf-dev
      - abseil-cpp-dev
      - re2-dev

pipeline:
  - uses: fetch
    with:
      uri: https://dev.mysql.com/get/Downloads/MySQL-__MINOR__/mysql-${{package.version}}.tar.gz
      expected-sha256: "__SHA256__"
  - runs: |
      # Pre-fetch Boost into ./boost/ so cmake's DOWNLOAD_BOOST step finds the
      # tarball there and skips its own download. archives.boost.io is slow for
      # old releases and cmake's downloader has a hard 600s no-retry timeout that
      # flakes on boost_1_77_0; a retrying curl is far more reliable.
      mkdir -p boost
      bn="boost_$(echo __BOOST_VER__ | tr . _)"
      curl -fsSL --retry 8 --retry-delay 15 --retry-all-errors --connect-timeout 30 -m 2400 \
        -o "boost/${bn}.tar.bz2" "https://archives.boost.io/release/__BOOST_VER__/source/${bn}.tar.bz2"
      echo "__BOOST_SHA__  boost/${bn}.tar.bz2" | sha256sum -c -

      # Lean server: InnoDB stays; the X protocol, router, and tests are off to cut
      # build time and image size. CMake uses the pre-fetched Boost in ./boost.
      cmake -B build -G "Unix Makefiles" \
        -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_INSTALL_PREFIX=/usr \
        -DCMAKE_CXX_FLAGS="-include cstdint" \
        -DCMAKE_C_FLAGS="-include stdint.h" \
        -DMYSQL_DATADIR=/var/lib/mysql \
        -DMYSQL_UNIX_ADDR=/run/mysqld/mysqld.sock \
        -DSYSCONFDIR=/etc \
        -DDOWNLOAD_BOOST=1 \
        -DWITH_BOOST=boost \
        -DWITH_SSL=system \
        -DWITH_ZLIB=system \
        -DWITH_PROTOBUF=system \
        -DWITH_UNIT_TESTS=OFF \
        -DWITH_ROUTER=OFF \
        -DWITH_MYSQLX=OFF \
        -DWITH_NDBCLUSTER=OFF \
        -DINSTALL_MYSQLTESTDIR=
      make -C build -j"$(nproc)"
      make -C build DESTDIR="${{targets.destdir}}" install
      # trim test/debug baggage the install drops in
      rm -rf "${{targets.destdir}}/usr/mysql-test" "${{targets.destdir}}/usr/share/mysql-test" || true
      # Group Replication HA needs the group_replication plugin. The community
      # server builds group_replication.so by default (no extra cmake flag), but
      # guard it so a future build that drops it fails loudly instead of shipping
      # an image that cannot form a GR cluster. (Mirrors mariadb's wsrep guards.)
      GR="$(find "${{targets.destdir}}" -name 'group_replication.so' -print -quit)"
      test -n "$GR" || { echo "group_replication.so missing — Group Replication HA would be impossible"; exit 1; }
  - runs: |
      install -d "${{targets.destdir}}/usr/local/bin"
      cat > "${{targets.destdir}}/usr/local/bin/docker-entrypoint.sh" <<'SCRIPT'
      #!/bin/sh
      set -eu
      export PATH="/usr/sbin:/usr/bin:/usr/local/bin:$PATH"
      DATADIR=/var/lib/mysql
      SOCK=/run/mysqld/mysqld.sock

      if [ ! -d "$DATADIR/mysql" ]; then
        if [ -z "${MYSQL_ROOT_PASSWORD:-}" ]; then
          echo "MYSQL_ROOT_PASSWORD is required for first initialization" >&2
          exit 1
        fi
        # create the data dir; root@localhost starts with an empty password
        mysqld --initialize-insecure --datadir="$DATADIR"

        # temporary local server to apply setup SQL
        mysqld --datadir="$DATADIR" --socket="$SOCK" >/tmp/mysql-init.log 2>&1 &
        pid=$!
        for i in $(seq 1 60); do
          mysqladmin --socket="$SOCK" -uroot ping >/dev/null 2>&1 && break
          [ "$i" = 60 ] && { echo "init server did not start" >&2; cat /tmp/mysql-init.log >&2; exit 1; }
          sleep 1
        done

        SQL="$(mktemp)"
        {
          printf "ALTER USER 'root'@'localhost' IDENTIFIED BY '%s';\n" "$MYSQL_ROOT_PASSWORD"
          printf "CREATE USER IF NOT EXISTS 'root'@'%%' IDENTIFIED BY '%s';\n" "$MYSQL_ROOT_PASSWORD"
          printf "GRANT ALL PRIVILEGES ON *.* TO 'root'@'%%' WITH GRANT OPTION;\n"
          [ -n "${MYSQL_DATABASE:-}" ] && printf "CREATE DATABASE IF NOT EXISTS \`%s\`;\n" "$MYSQL_DATABASE"
          if [ -n "${MYSQL_USER:-}" ]; then
            printf "CREATE USER IF NOT EXISTS '%s'@'%%' IDENTIFIED BY '%s';\n" "$MYSQL_USER" "${MYSQL_PASSWORD:-}"
            printf "GRANT ALL PRIVILEGES ON \`%s\`.* TO '%s'@'%%';\n" "${MYSQL_DATABASE:-*}" "$MYSQL_USER"
          fi
          printf "FLUSH PRIVILEGES;\n"
        } > "$SQL"
        mysql --socket="$SOCK" -uroot < "$SQL"
        rm -f "$SQL"

        mysqladmin --socket="$SOCK" -uroot -p"$MYSQL_ROOT_PASSWORD" shutdown
        wait "$pid" 2>/dev/null || true
      fi

      exec mysqld --datadir="$DATADIR" --socket="$SOCK"
      SCRIPT
      chmod 0755 "${{targets.destdir}}/usr/local/bin/docker-entrypoint.sh"

test:
  pipeline:
    - runs: |
        mysqld --version
        mysql --version
