# mysql: from-source via melange (CMake/make compile; cmake auto-downloads the
# version-matching Boost). Latest 3 maintained series, newest patch each:
# 8.0.x + 8.4.x (LTS) + 9.7.x (Innovation, current). The dev.mysql.com download
# path is keyed by major.minor (MySQL-<MINOR>/), so MINOR maps the path; each
# release also pins its source tarball by sha256.
FROM_SOURCE=1
# 2026-07-30: dropped the 8.0.x line — MySQL 8.0 reached END OF LIFE 2026-04-30, so it
# receives no further upstream security fixes. Shipping an EOL database line in a
# 0-CVE catalog is self-contradictory: the gate can only prove "no FIXABLE CVEs", and
# for an EOL line nothing is fixable by definition. The freed window slot goes to a
# supported line (8.4 LTS / 9.x innovation).
VERSIONS=(8.4.11 9.7.2)
declare -A SHA256=(
  [8.0.46]=e0d1a98ae5188c6a4efed74c74ff28115d4b791bc9d591a78e14d20aded67344
  [8.4.11]=eb3051164d625dd346a8203f76e0d5d5d9aec51dbe9d51788e39ec6b3f1394c2
  [9.7.2]=e5a676c7cb73738dc6ea33db2093806ebd512b629a139b897fcab68fcd81aaa4
)
declare -A MINOR=( [8.0.46]=8.0 [8.4.11]=8.4 [9.7.2]=9.7 )
# Boost version each MySQL series bundles (cmake/boost.cmake BOOST_PACKAGE_NAME).
# We pre-fetch the .tar.bz2 into ./boost/ so cmake's DOWNLOAD_BOOST step finds it
# and skips its own download (archives.boost.io is slow for old releases and
# cmake's downloader has a hard 600s no-retry timeout that flakes on 1.77.0).
# Verified per tag: 8.4.11 still boost_1_84_0, 9.7.2 still boost_1_87_0.
declare -A BOOST_VER=( [8.0.46]=1.77.0 [8.4.11]=1.84.0 [9.7.2]=1.87.0 )
declare -A BOOST_SHA=(
  [1.77.0]=fc9f85fc030e233142908241af7a846e60630aa7388de9a5fafb1f3a26840854
  [1.84.0]=cc4b893acf645c9d4b698e9a0f08ca8846aa5d6c68275c14c3e7949c24109454
  [1.87.0]=af57be25cb4c4f4b413ed692fe378affb4352ea50fbe294a11ef548f4d527d89
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g; s|__MINOR__|${MINOR[$1]}|g; s|__BOOST_VER__|${BOOST_VER[$1]}|g; s|__BOOST_SHA__|${BOOST_SHA[${BOOST_VER[$1]}]}|g"; }
