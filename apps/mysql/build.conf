# STATUS: UNBLOCKED 2026-09-20. The recorded reason is wrong and the scan says so.
#
# The header below waits for zlib 1.3.3-r0, "which upstream madler/zlib has
# never tagged". True, and irrelevant: Wolfi shipped the CVE-2026-85091 fix as
# 1.3.2.1_rc20260601-r0 and the advisory was amended to name that version.
#
# Measured on the PUBLISHED image, 2026-09-20, same flags as the gate
# (trivy --ignore-unfixed --severity CRITICAL,HIGH,MEDIUM,LOW --scanners vuln
# --detection-priority comprehensive), ghcr.io/quenchworks/images/mysql:9.7.2:
#   zlib  CVE-2026-85091  1.3.2-r4   -> 1.3.2.1_rc20260601-r0
#   curl  several rows               -> 8.22.0-r2
# Every row is stale-apk drift in an image built before those apks shipped, and
# every one names a fix version that Wolfi publishes today. Nothing in mysql's
# own code is flagged. A plain rebuild resolves the current apks and clears them.
#
# Not gated locally: the C++ compile does not fit this host's foreground window
# (74% at 560s, and background builds get killed here). CI is the measurement.
# It gates BOTH arches and refuses to publish on any finding, so unblocking
# cannot ship a vulnerable image -- it can only let the gate run. If the CI run
# fails, that is a real finding and this gets re-blocked citing the run id.
# STATUS: ZLIB-ONLY as of 2026-09-16. Measured, not assumed: run 35066757556
# on af0623d gated with exactly one finding, zlib CVE-2026-85091, on every
# version and both arches. Nothing else in this image is flagged.
#
# Wolfi is at 1.3.2.1_rc20260601-r0 and the advisory wants 1.3.3-r0, which
# upstream madler/zlib has never tagged. Downgrading to Wolfi's 1.3.1-r51
# is not a way out either: it predates the 1.3.2-r0 fix for CVE-2026-27171.
#
# BLOCKED=1 skips build+merge so sweeps stop burning a red run here. Clear
# it with scripts/blocked.py --dispatch once Wolfi ships zlib 1.3.3-r0.
# mysql: from-source via melange (CMake/make compile; cmake auto-downloads the
# version-matching Boost). Latest 3 maintained series, newest patch each:
# 8.0.x + 8.4.x (LTS) + 9.7.x (Innovation, current). The dev.mysql.com download
# path is keyed by major.minor (MySQL-<MINOR>/), so MINOR maps the path; each
# release also pins its source tarball by sha256.
BLOCKED=0
FROM_SOURCE=1
# 2026-07-30: dropped the 8.0.x line — MySQL 8.0 reached END OF LIFE 2026-04-30, so it
# receives no further upstream security fixes. Shipping an EOL database line in a
# 0-CVE catalog is self-contradictory: the gate can only prove "no FIXABLE CVEs", and
# for an EOL line nothing is fixable by definition. The freed window slot goes to a
# supported line (8.4 LTS / 9.x innovation).
VERSIONS=(8.4.11 9.7.2)
declare -A SHA256=(
  [8.0.46]=e0d1a98ae5188c6a4efed74c74ff28115d4b791bc9d591a78e14d20aded67344
  [8.4.11]=eb3051164d625dd346a8203f76e0d5d5d9aec51dbe9d51788e39ec6b3f1394c2
  [9.7.2]=e5a676c7cb73738dc6ea33db2093806ebd512b629a139b897fcab68fcd81aaa4
)
declare -A MINOR=( [8.0.46]=8.0 [8.4.11]=8.4 [9.7.2]=9.7 )
# Boost version each MySQL series bundles (cmake/boost.cmake BOOST_PACKAGE_NAME).
# We pre-fetch the .tar.bz2 into ./boost/ so cmake's DOWNLOAD_BOOST step finds it
# and skips its own download (archives.boost.io is slow for old releases and
# cmake's downloader has a hard 600s no-retry timeout that flakes on 1.77.0).
# Verified per tag: 8.4.11 still boost_1_84_0, 9.7.2 still boost_1_87_0.
declare -A BOOST_VER=( [8.0.46]=1.77.0 [8.4.11]=1.84.0 [9.7.2]=1.87.0 )
declare -A BOOST_SHA=(
  [1.77.0]=fc9f85fc030e233142908241af7a846e60630aa7388de9a5fafb1f3a26840854
  [1.84.0]=cc4b893acf645c9d4b698e9a0f08ca8846aa5d6c68275c14c3e7949c24109454
  [1.87.0]=af57be25cb4c4f4b413ed692fe378affb4352ea50fbe294a11ef548f4d527d89
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g; s|__MINOR__|${MINOR[$1]}|g; s|__BOOST_VER__|${BOOST_VER[$1]}|g; s|__BOOST_SHA__|${BOOST_SHA[${BOOST_VER[$1]}]}|g"; }
