# trivy (Aqua Security): from-source via melange (Go build from the git tag
# tarball). Image-only (a CLI scanner, no chart). Newest-only (0.73.0). Single
# static Go binary, CGO disabled (trivy uses the pure-Go modernc.org/sqlite
# driver, so no CGO needed). Version is stamped via -X on
# github.com/aquasecurity/trivy/pkg/version/app.ver (no leading "v").
FROM_SOURCE=1
VERSIONS=(0.76.0)
declare -A SHA256=(
  [0.76.0]=38899439182f18f03f1a70b133d3541b809f77647a0b95fcf194674aa34952f0
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
