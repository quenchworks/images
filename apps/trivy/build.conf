# trivy (Aqua Security): from-source via melange (Go build from the git tag
# tarball). Image-only (a CLI scanner, no chart). Newest-only (0.73.0). Single
# static Go binary, CGO disabled (trivy uses the pure-Go modernc.org/sqlite
# driver, so no CGO needed). Version is stamped via -X on
# github.com/aquasecurity/trivy/pkg/version/app.ver (no leading "v").
FROM_SOURCE=1
VERSIONS=(0.76.1)
# 0.75.0 is not built here: apps/trivy-scanner still builds it (the line Trivy Operator
# 0.35.0 pairs with) and renders this recipe at its own version, so keep its sha.
declare -A SHA256=(
  [0.75.0]=4ee2010384f90bf23d4059ae49c11129e5041816a3754d890a90ae80f678d765
  [0.76.1]=641d78078e6201afce9f18e5daf0ecabaa9dbee7a257b48828e1e3fc43670aca
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
