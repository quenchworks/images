# trivy (Aqua Security): from-source via melange (Go build from the git tag
# tarball). Image-only (a CLI scanner, no chart). Latest patch of the last 3 minor
# lines (0.71, 0.72). Single static Go binary, CGO disabled (trivy uses the
# pure-Go modernc.org/sqlite driver, so no CGO needed). Version is stamped via -X
# on github.com/aquasecurity/trivy/pkg/version/app.ver (no leading "v").
FROM_SOURCE=1
VERSIONS=(0.71.1 0.71.2 0.72.0)
declare -A SHA256=(
  [0.71.1]=fb79664621120e700b89f6a4642204787d43cf24d7cec8f37d8a39d26e8bfa9d
  [0.71.2]=a4f4187644f6bdfba393c3c194b9ef8acc3891933c6faeeac8715a057db33785
  [0.72.0]=2c6e0e5a4b1b08241aab8e379155dfb31855a50cb1d04fa790039cf3010477cf
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g"; }
