# Builds Trivy (Aqua Security) from source onto Wolfi. Single static Go binary, no
# CGO (trivy ships the pure-Go modernc.org/sqlite driver, so the SQLite-backed
# RPM/Java DBs need no cgo). The version is stamped via -X so `trivy --version`
# reports the real release. Output is a signed APK in Quenchworks' own repo. No
# upstream distro binaries. Image-only (CLI, no chart).
package:
  name: quench-trivy
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Trivy (Aqua Security) scanner, built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      # Pinned to a go line because trivy uses the experimental encoding/json/v2, whose API
      # churns per Go release (go 1.27 dropped json.SkipFunc that 0.74 used). 0.75.0's
      # go.mod requires go >= 1.27.0, so the pin moved from go-1.26 on 2026-10-04.
      - go-1.27

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/aquasecurity/trivy/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - runs: |
      export CGO_ENABLED=0
      export GOFLAGS=-mod=mod
      export GOTOOLCHAIN=local   # build with the pinned go-1.27, never auto-fetch
      # Trivy 0.7x uses Go's experimental encoding/json/v2, which is gated behind
      # this GOEXPERIMENT (matches trivy's own goreleaser build).
      export GOEXPERIMENT=jsonv2
      # Controlled CVE bumps -- v0.72.0's pinned deps carry FIXABLE gobinary CVEs
      # (the workflow's gobinary scan is the hard gate). Bump only the affected
      # modules to a fixed release (MINOR/PATCH, same major):
      #   sigstore/sigstore-go            CVE-2026-49834 (multi-log bypass) -> 1.2.0
      #   sigstore/timestamp-authority/v2 CVE-2026-49835 (metric OOM)   -> 2.1.2
      #                         (2.1.2 is also the min required by sigstore-go 1.2.0)
      #   oras.land/oras-go/v2  CVE-2026-50151/50162/48978 +            -> 2.6.2
      #                         GHSA-vh4v-2xq2-g5cg (credential forwarding), then
      #                         CVE-2026-50163 (arbitrary file access via crafted
      #                         tarball hardlinks) which 2.6.1 does NOT fix
      #   go-git/go-git/v5      CVE-2026-71556 (HIGH) + CVE-2026-71557     -> 5.19.2
      # otel CVE-2026-81870 / CVE-2026-81871: the published image drifted onto these
      # after release. Every module listed is one this app's own go.mod carries; a
      # floor naming a module absent from the graph is rejected by some recipes.
      # FLOORS, not pins (2026-10-04): a bare `go get mod@vX` pins exactly vX, so once trivy
      # requires more (0.75.0: containerd 2.4.1, otel 1.46, x/net 0.59) it DOWNGRADES and the
      # build breaks or the CVE returns. Raise a module only where go.mod has it below the floor;
      # a module absent from the graph is skipped, never added.
      FLOOR="github.com/sigstore/sigstore-go@v1.2.0 go.opentelemetry.io/otel@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlpmetric/otlpmetricgrpc@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.45.0 go.opentelemetry.io/otel/metric@v1.45.0 go.opentelemetry.io/otel/sdk@v1.45.0 go.opentelemetry.io/otel/sdk/metric@v1.45.0 go.opentelemetry.io/otel/trace@v1.45.0 github.com/sigstore/timestamp-authority/v2@v2.1.2 oras.land/oras-go/v2@v2.6.2 github.com/go-git/go-git/v5@v5.19.2 golang.org/x/net@v0.58.0 golang.org/x/sys@v0.47.0 golang.org/x/text@v0.41.0 google.golang.org/grpc@v1.83.2 golang.org/x/crypto@v0.56.0 github.com/containerd/containerd/v2@v2.3.6 github.com/moby/buildkit@v0.31.1"
      # Go semver order (a release outranks its prereleases); busybox sort -V does not.
      vlt() { awk -v a="${1#v}" -v b="${2#v}" 'function pp(s,  p){sub(/\+.*/,"",s);p=index(s,"-");if(p){C=substr(s,1,p-1);P=substr(s,p+1)}else{C=s;P=""}} function cmp(x,y,  i,n,m,X,Y){n=split(x,X,".");m=split(y,Y,".");for(i=1;i<=n&&i<=m;i++){if(X[i]==Y[i])continue;if(X[i]~/^[0-9]+$/&&Y[i]~/^[0-9]+$/)return (X[i]+0<Y[i]+0)?-1:1;if(X[i]~/^[0-9]+$/)return -1;if(Y[i]~/^[0-9]+$/)return 1;return (X[i]<Y[i])?-1:1}return (n<m)?-1:(n>m)?1:0} BEGIN{pp(a);ca=C;pa=P;pp(b);cb=C;pb=P;c=cmp(ca,cb);if(c==0){if(pa==pb)c=0;else if(pa=="")c=1;else if(pb=="")c=-1;else c=cmp(pa,pb)}exit !(c<0)}'; }
      need=""
      for mv in $FLOOR; do
        have="$(go list -m -e -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "${mv%@*}" 2>/dev/null)"
        case "$have" in v[0-9]*) ;; *) continue ;; esac
        vlt "$have" "${mv#*@}" && need="$need $mv"
      done
      echo "raising:${need:- nothing}"
      [ -z "$need" ] || go get $need
      #   golang.org/x/net  v0.55.0 -> v0.56.0 (CVE-2026-46600: panic parsing an
      #                     invalid SVCB/HTTPS DNS resource record)
      #   golang.org/x/text v0.38.0 -> v0.39.0 (CVE-2026-56852: infinite loop on
      #                     invalid input)
      #   github.com/containerd/containerd/v2 CVE-2026-53495 (CRI ExecSync
      #                     goroutine leak, MEDIUM): 0.74.0 requires v2.3.3
      #                     direct, no `replace`; fixed in 2.0.12/2.2.8/2.3.5.
      #                     2.3.6 for CVE-2026-53493 (MEDIUM, 2026-09-24).
      #   github.com/moby/buildkit v0.31.0-rc1 -> v0.31.1 (CVE-2026-61711,
      #                     CVE-2026-61712)
      # tidy over trivy's very large module graph occasionally trips a transient
      # DNS timeout on the sandbox resolver mid-download; the module cache
      # persists across retries, so a bounded retry loop converges.
      for i in 1 2 3 4 5 6 7 8; do
        go mod tidy && break
        echo "go mod tidy attempt $i failed (transient net); retrying" >&2
        sleep 5
      done
      go build -trimpath \
        -ldflags "-s -w -X github.com/aquasecurity/trivy/pkg/version/app.ver=${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/trivy" ./cmd/trivy
