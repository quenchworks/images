# Builds Project Contour from source onto Wolfi. Single static Go binary, no CGO.
#
# Upstream truth (Makefile at the tag, verified, not guessed):
#   main package : $(MODULE)/cmd/contour            -> `go build ... $(MODULE)/cmd/contour`
#   ldflags      : -s -w -X internal/build.Version=$(BUILD_VERSION)
#                          -X internal/build.Sha=$(BUILD_SHA)
#                          -X internal/build.Branch=$(BUILD_BRANCH)
#   build tags   : oidc gcp osusergo netgo          -> GO_TAGS in the Makefile
#   CGO          : BUILD_CGO_ENABLED ?= 0, and the Dockerfile asserts the result is
#                  "not a dynamic executable"
# BUILD_VERSION is $(git describe --tags --exact-match), i.e. the v-prefixed tag, so the
# stamp is `v${package.version}` -- `contour version` then prints `version: v1.33.6`.
# Branch is left unset on purpose: upstream's release build runs on a detached HEAD, where
# its own BUILD_BRANCH expands to empty, and internal/build marshals it with omitempty.
#
# The oidc/gcp tags pull in the client-go auth plugins upstream ships; dropping them would
# silently change the binary's kubeconfig auth surface, so they are kept verbatim.
#
# NO go-module float here, and that is deliberate: at 1.33.6 go.mod already requires
# x/net v0.57.0, x/text v0.41.0, x/crypto v0.55.0, grpc v1.83.0 -- ALL newer than the
# catalog's current float floors, so a `go get` line would be a DOWNGRADE, not a fix
# (docs/go-module-float.md). go.mod carries no `replace` directives, so -mod=readonly is
# safe and keeps the build byte-for-byte tied to the checked-in go.sum.
package:
  name: quench-contour
  version: __VER__
  epoch: 0
  description: "Quenchworks hardened Project Contour ingress controller, built from source on Wolfi"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-1.26

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/projectcontour/contour/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: __SHA256__
  - name: Build the contour binary (static, CGO off)
    runs: |
      set -eu
      export CGO_ENABLED=0
      export GOTOOLCHAIN=local   # use the installed go-1.26; do not fetch go.mod's toolchain
      go build -mod=readonly -trimpath -buildvcs=false \
        -tags "oidc gcp osusergo netgo" \
        -ldflags "-s -w \
          -X github.com/projectcontour/contour/internal/build.Version=v${{package.version}} \
          -X github.com/projectcontour/contour/internal/build.Sha=__COMMIT__" \
        -o "${{targets.destdir}}/usr/bin/contour" ./cmd/contour
