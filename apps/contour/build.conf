# contour (Project Contour): from-source via melange. Kubernetes ingress controller that
# programs Envoy over xDS; also a Gateway API implementation. ONE binary serves every
# role the chart needs (serve / bootstrap / certgen / envoy shutdown-manager /
# gateway-provisioner / cli), so this is a single image, not a component set.
#
# WINDOW IS DELIBERATELY 1, NOT 3. Contour hard-pairs each release with an exact Envoy
# version (upstream's own examples/contour/03-envoy.yaml at the tag is the authority;
# site/content/resources/compatibility-matrix.md is stale on release branches):
#   1.33.6 -> envoy distroless-v1.38.3   <- our envoy image ships the 1.38 line (1.38.1)
#   1.32.5 -> envoy v1.34.14             <- we do not ship an envoy 1.34 line
#   1.31.6 -> envoy v1.34.14             <- ditto
# We only ship envoy 1.36/1.37/1.38 (apps/envoy/build.conf), so 1.31.x/1.32.x controllers
# would have no data plane in this catalog. Their tarball sha256s are recorded below so
# adding a line back is a one-word VERSIONS edit once/if envoy 1.34 is shipped.
FROM_SOURCE=1
VERSIONS=(1.33.7)
# sha256 of the GitHub tag tarball, computed from the fetched artifact (sha256sum).
declare -A SHA256=(
  [1.33.7]=37035fe102c562dce315cf8356fd94a612b915f5efe3f60a0cf71f6f746089ee
)
# Peeled commit for each ANNOTATED tag (git ls-remote 'refs/tags/vX.Y.Z^{}'). Stamped
# into internal/build.Sha, exactly like upstream's Makefile does from BUILD_SHA, so
# `contour version` reports a real revision and not an empty field.
declare -A COMMIT=(
  [1.33.7]=81c4e28c38177ed1f3a3265389a86f8926c332cb
)
render() { echo "s/__VER__/$1/g; s|__SHA256__|${SHA256[$1]}|g; s|__COMMIT__|${COMMIT[$1]}|g"; }
