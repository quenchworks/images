    status: done # image + chart both shipped (AH quench-grafana cb635e07). Chart: charts/quench/grafana, StatefulSet + PVC /var/lib/grafana, admin Secret, /api/health gate, optional Prometheus/VM datasource provisioning, released. dashboards; completes the observability stack; OSS edition (AGPL), official tarball. Published multi-arch 0-CVE (CI green both arches): ghcr.io/quenchworks/images/grafana:13.0.2@sha256:76c74455d14f954d9e5d54616453bd323f0884b91427235f686f1c0e7e6fd856. 0-CVE multi-arch (amd64+arm64), nonroot uid 1001. BUILD-METHOD: ships Grafana's OFFICIAL OSS release tarball per-arch (https://dl.grafana.com/oss/release/grafana-13.0.2.linux-<amd64|arm64>.tar.gz, sha256-verified from the .tar.gz.sha256 companion: amd64 6720d8b0b48d92e2b33b7bf30b38480c12964ccd87285e5e754aa554165edf2d, arm64 beabeddf14dd5f435ac0c6d7fac71a585381515e879cc44eeea79a4ff7f7e52c), NOT from-source -- the frontend (webpack/yarn) build is infeasible on a 2-core/7GB runner. Same upstream-artifact pattern as kafka/clickhouse. Grafana ships as a SINGLE self-contained static Go binary bin/grafana (multi-call: `grafana server` / `grafana cli`; no separate grafana-server in v13), statically linked (no glibc) -- runtime deps are only bash+busybox+ca-certificates for the entrypoint. The full runtime tree (bin/public/conf/plugins-bundled/tools/LICENSE) installs under the standard homepath /usr/share/grafana; the dist defaults.ini is shipped read-only as /etc/grafana/grafana.ini. TRIVY: scannable surface is the tiny Wolfi base (kept 0-CVE) plus the Grafana Go buildinfo; local + CI scan 0 (--ignore-unfixed), v13.0.2 is recent (GA 2026-06-09). Read-only rootfs: all mutable state on writable mounts via GF_PATHS_* -- GF_PATHS_DATA=/var/lib/grafana (SQLite grafana.db + sessions), GF_PATHS_PLUGINS=/var/lib/grafana/plugins, GF_PATHS_LOGS=/var/log/grafana, GF_PATHS_PROVISIONING=/etc/grafana/provisioning; entrypoint mkdir's them (incl provisioning datasources/dashboards/plugins/alerting/access-control subdirs) then `exec grafana server --homepath=/usr/share/grafana --config=$GF_PATHS_CONFIG --packaging=docker`. Config via grafana.ini or any GF_<SECTION>_<KEY> env. Admin creds from GF_SECURITY_ADMIN_USER (default admin) + GF_SECURITY_ADMIN_PASSWORD (chart Secret); no anonymous access by default. Pairs with the QuenchWorks Prometheus/VictoriaMetrics datasources. Port 3000 (UI + API). Probe httpGet /api/health on 3000 (returns database ok). Verified locally x86_64: read-only rootfs + tmpfs /var/lib/grafana+/var/log/grafana+/etc/grafana/provisioning+/tmp, nonroot uid 1001, /api/health database ok + version 13.0.2, /login serves frontend HTML, admin basic-auth reaches the default org, Trivy 0. arm64 tarball sha256-verified as a genuine aarch64 binary; built native on the ubuntu-24.04-arm runner.

