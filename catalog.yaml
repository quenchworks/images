akefile, so `gitea --version` prints "gitea version 1.26.2 built with go1.26.4 : bindata". ENTRYPOINT: /usr/bin/docker-entrypoint.sh -> `gitea web --config $GITEA_APP_INI` (defaults GITEA_WORK_DIR=/data, GITEA_APP_INI=/etc/gitea/app.ini); the chart mounts both. RUNTIME DEPS: git (gitea shells out to git for repo ops) + openssh-keygen (host SSH key on first boot) + ca-certificates-bundle + busybox. PORTS: 3000 HTTP, 2222 SSH (uid 1001 cannot bind privileged 22). READ-ONLY ROOTFS: gitea writes to /data (repos, lfs, attachments, host ssh key), /etc/gitea (app.ini rendered/written) + /tmp -- all mounted writable by the chart (base image presumes none). TRIVY 0-CVE (--ignore-unfixed): TWO-STAGE gate -- (1) image OS layer (Wolfi base wolfi-baselayout/busybox/ca-certificates-bundle/git/openssh-keygen, 0 findings) and (2) the gitea Go binary extracted from the apk and scanned as a gobinary (REQUIRED: the binary is ~115MB, larger than Trivy's per-file cap when read back from the image tar, so the plain image scan only covers the OS surface). CVE BUMPS: the gobinary scan caught two fixable dep CVEs the OS scan missed; bumped via `go get` in the melange build -- github.com/Azure/go-ntlmssp v0.1.0->v0.1.1 (CVE-2026-32952 DoS) + github.com/go-git/go-git/v5 v5.19.0->v5.19.1 (CVE-2026-45571/GHSA-w5pp-99ch-qj29/CVE-2026-45570 panic/DoS); both clean after bump. The CI workflow runs BOTH scans as hard 0-CVE gates. Verified locally x86_64: `gitea --version` 1.26.2, web server boots under read-only rootfs (tmpfs /data + /etc/gitea + /tmp) with a minimal app.ini, GET :3000/ -> 200 (install page served without a DB), nonroot uid 1001; image OS scan 0, gobinary scan 0. KEEP repository_dispatch-to-charts. To be marked done with multi-arch digest + CI run after chart ships.

