FIC NPM FIX: the Angular production build uses esbuild/vite whose native binaries are proper os/cpu-keyed npm optionalDependencies (@esbuild/linux-x64, @esbuild/linux-arm64, ...) installed correctly per arch. The arm64 build initially FAILED: with lifecycle scripts enabled, npm ran @parcel/watcher's postinstall, which on amd64 fetched a prebuilt x64 binary but on arm64 fell back to compiling from source via node-gyp -- and node-gyp 9.4.1 dies on the sandbox's Python 3.13 ("No module named 'distutils'", removed in Py3.12 and no longer shimmed by modern setuptools). @parcel/watcher is a watch-mode-only optional dep (used by `ng serve`), never by the production `ng build`, so the fix is `npm install --ignore-scripts` (skips that node-gyp build on both arches) plus running the one genuinely-needed postinstall (ng-swagger-gen) by hand -- same family as the alertmanager elm postinstall fix. Node/npm/Angular/webpack live ONLY in the build sandbox; the runtime image ships NO JS toolchain, so Node never enters the Trivy scan surface. (2) RUNTIME (apko): QuenchWorks' OWN hardened nginx (quench-nginx, built from source in the same CI job into ./packages -- NOT docker.io/nginx) serving the prebuilt static assets. WEB ROOT: the assets live at /opt/harbor/portal (a portal-OWNED root, chosen so the package does not collide with the sample index.html/50x.html the shared quench-nginx package ships in /usr/share/nginx/html). NGINX CONFIG: vendored from Harbor v2.14.4 make/photon/prepare/templates/portal/nginx.conf.jinja (the non-TLS branch -- internal_tls disabled; TLS would listen 8443 with chart-mounted certs), rendered (no jinja) and shipped at /etc/nginx/harbor-portal.conf (a portal-specific path so it does not collide with quench-nginx's /etc/nginx/nginx.conf); adapted for nonroot/read-only rootfs: foreground (daemon off), listens on :8080 (uid 1001 can't bind <1024; the chart's Service maps it), root /opt/harbor/portal, SPA fallback try_files -> /index.html, the Swagger UI at /