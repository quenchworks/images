o this makes it build http://<r.Host> and do a TRUE same-origin check against the real access host:port the proxy forwards -- so the browser's http:// Origin MATCHES on any port, while a genuinely cross-site Origin still mismatches Host and 403s (CSRF intact). The csrf.TrustedOrigins host-list patch above remains as belt-and-suspenders. Verified locally x86_64: swagger codegen + build OK (compiles with the patch), harbor_core has v2.14.4 stamped (strings), embeds CSRF_TRUSTED_ORIGINS, static CGO-free ELF (no dynamic linker), nonroot uid 1001, trivy gobinary scan 0. arm64 built+scanned native on ubuntu-24.04-arm in CI. Published multi-arch 0-CVE (CI green both arches, merge signed cosign keyless): ghcr.io/quenchworks/images/harbor-core:2.14.4@sha256:c1cbf8ca5853b00ff33f6ebaa184238b1d2e0e7539b5ba09558e3e20ebc8c990 (index; amd64 sha256:7f725084542cac06401e3204bace1c03bf84af38771d407904c651dd62343e02, arm64 sha256:a7ed267cfc25612fc2e6fdf8cba6104337cf65f4d26247267f8bb0df4c07b5d3). CI run https://github.com/quenchworks/images/actions/runs/27476812972. PRIOR digests superseded: sha256:3a6acebd13f31384f86148f86580c06dd0ad521dbcd4edcb22b1ef92ba62fcbd (TrustedOrigins-only, UI login worked on 8080 but not arbitrary ports); sha256:09a8c2f9b3d46b38c339fbea8696d6a6e766c9a8bf6383588b3df88476fb57e6 (pre-CSRF-fix, UI login 403); sha256:b2f0ad167de5dc28505cb413e1e2bf362642ad7bdf801945b1250bf6bdc75354 (pre-migrations-fix, boot-FATAL).

