ql/v12/visibility (update-schema -d .../visibility). Layout per dir: schema.sql + database.sql + versioned/v1.0..vN. DB-REQUIRED + CONFIG-FROM-CHART: Temporal needs a DB (PostgreSQL for QuenchWorks) and a config dir. The CHART supplies the real server config + dynamicconfig (a ConfigMap) and the Postgres DSN, and runs schema setup as a Job. The image ships the upstream config/ samples at /etc/temporal/config (incl. dynamicconfig/) so a SELF-CONTAINED standalone boot works: by default the thin entrypoint runs `temporal-server --root $TEMPORAL_ROOT(/etc/temporal) --config $TEMPORAL_CONFIG_DIR(config) --env $TEMPORAL_ENV(development-sqlite-file) start [--service $SERVICES,...]`. NOTE: --root/--config/--env are GLOBAL flags (BEFORE the `start` subcommand); --service flags come AFTER start; SERVICES env (comma-list) selects roles per pod (empty=all-in-one). The bundled development-sqlite-file config uses the pure-Go embedded sqlite store (modernc.org/sqlite, CGO-free) with setup:true (creates schema in-process), so the all-in-one server boots with NO external DB; its dynamicConfigClient.filepath was rewritten at build time from the upstream relative path to the absolute /etc/temporal/config/dynamicconfig/development-sql.yaml so the standalone boot is cwd-independent. The chart overrides all of this for a real Postgres deployment. ENTRYPOINT: /usr/bin/docker-entrypoint.sh (thin sh wrapper) -> exec /usr/bin/temporal-server. PORTS (advisory; the chart's config sets the actual binds): 7233 frontend gRPC, 7234 history, 7235 matching, 7239 worker, 7243 frontend HTTP API, 6933-6939 membership/ringpop, 8000 metrics (tally prometheus), 7936 pprof. READ-ONLY ROOTFS: in the Postgres deployment the server writes nothing to the rootfs (state lives in Postgres); needs writable /tmp. The standalone sqlite boot additionally needs a writable workdir for the sqlite file+WAL -- the chart mounts those as writable volumes/tmpfs. TRIVY 0-CVE (--ignore-unfixed): local image scan 0 findings (Wo