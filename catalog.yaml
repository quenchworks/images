catalog:
  - name: redis
    category: Cache
    summary: In-memory key-value store used as a cache, message broker, and ephemeral datastore. Shipped under AGPL (not permissive); Valkey is the BSD-licensed open alternative.
    source: https://download.redis.io/releases/redis-8.8.0.tar.gz
    upstream: https://github.com/redis/redis
    license: AGPL-3.0-only
    tier: critical
    status: built

  - name: redis-exporter
    category: Metrics/Exporter
    summary: Prometheus exporter that scrapes Redis and Valkey runtime stats and exposes them as metrics for dashboards and alerts.
    source: https://github.com/oliver006/redis_exporter
    upstream: https://github.com/oliver006/redis_exporter
    license: MIT
    tier: critical
    status: built

  - name: kvrocks
    category: Cache
    summary: Apache Kvrocks, a distributed key-value database on RocksDB that speaks the Redis protocol, keeping data on disk instead of in RAM. Built from source (clang, OpenSSL) with its bundled C/C++ dependencies checked by version.
    source: https://github.com/apache/kvrocks
    upstream: https://kvrocks.apache.org
    license: Apache-2.0
    tier: standard
    status: built

  - name: valkey
    category: Cache
    summary: BSD-licensed in-memory key-value store, the truly-open community fork of Redis 7.2. QuenchWorks' default cache and the recommended Redis drop-in replacement.
    source: https://github.com/valkey-io/valkey
    upstream: https://github.com/valkey-io/valkey
    license: BSD-3-Clause
    tier: critical
    status: built

  - name: flyway
    category: Databases & engines
    summary: Flyway Community, versioned SQL database migrations for PostgreSQL, MySQL, MariaDB, SQL Server, Oracle, SQLite and more. The release's Java tree on a Wolfi JRE 21 with two bundled JDBC drivers swapped to fixed releases. Image only, no chart.
    source: https://github.com/flyway/flyway
    upstream: https://flywaydb.org
    license: Apache-2.0
    tier: standard
    status: built

  - name: postgresql
    category: Relational
    summary: Advanced open-source relational database (v18.x) with strong SQL, ACID transactions, JSON, and a rich extension ecosystem. Ships pgvector for vector similarity search. The catalog's default SQL engine.
    source: https://ftp.postgresql.org/pub/source/v18.4/postgresql-18.4.tar.bz2
    upstream: https://github.com/postgres/postgres
    license: PostgreSQL
    tier: critical
    status: built

  - name: timescaledb
    category: Time series
    summary: PostgreSQL 17 plus the open TimescaleDB extension (Apache-only edition), adding hypertables, continuous aggregates, and time-series functions for high-ingest metrics and event data. Built clean-licensed from source on Wolfi (no TSL community code).
    source: https://github.com/timescale/timescaledb
    upstream: https://www.timescale.com
    license: Apache-2.0
    tier: standard
    status: built

  - name: postgresql-15
    category: Relational
    summary: PostgreSQL 15.x build for the Coolify wave, which pins PG 15 (the default postgresql image tracks 18.x). Same hardened build with bundled contrib extensions.
    source: https://ftp.postgresql.org/pub/source/v15.18/postgresql-15.18.tar.bz2
    upstream: https://ftp.postgresql.org/pub/source/v15.18/postgresql-15.18.tar.bz2
    license: PostgreSQL
    tier: critical
    status: built

  - name: postgres-exporter
    category: Metrics/Exporter
    summary: Prometheus exporter that collects PostgreSQL activity, replication, and performance stats and exposes them as metrics for monitoring.
    source: https://github.com/prometheus-community/postgres_exporter
    upstream: https://github.com/prometheus-community/postgres_exporter
    license: Apache-2.0
    tier: critical
    status: built

  - name: pgpool
    category: Relational
    summary: PostgreSQL connection pooler, load balancer and query router. Pools client connections, spreads read-only queries across streaming-replication standbys, and detaches a backend that fails its health check.
    source: https://www.pgpool.net/source/
    upstream: https://git.postgresql.org/gitweb/?p=pgpool2.git
    license: HPND
    tier: standard
    status: built

  - name: pgbouncer
    category: Relational
    summary: Lightweight connection pooler for PostgreSQL that fronts thousands of client connections with a small backend pool, cutting per-connection overhead.
    source: https://github.com/pgbouncer/pgbouncer
    upstream: https://github.com/pgbouncer/pgbouncer
    license: ISC
    tier: standard
    status: done

  - name: etcd
    category: Coordination
    summary: Distributed, strongly consistent key-value store using Raft consensus. The backing store for Kubernetes and a building block for service coordination and config.
    source: https://github.com/etcd-io/etcd
    upstream: https://github.com/etcd-io/etcd
    license: Apache-2.0
    tier: critical
    status: built

  - name: mariadb
    category: Relational
    summary: Community-developed relational database and drop-in MySQL successor, GPL-licensed and fully open. Default MySQL-compatible engine for the catalog.
    source: https://archive.mariadb.org/mariadb-11.8.8/source/mariadb-11.8.8.tar.gz
    upstream: https://github.com/MariaDB/server
    license: GPL-2.0-only
    tier: critical
    status: built

  - name: mysql
    category: Relational
    summary: Widely used open-source relational database for general-purpose OLTP workloads, with broad framework and tooling support.
    source: https://dev.mysql.com/get/Downloads/MySQL-9.7/mysql-9.7.0.tar.gz
    upstream: https://github.com/mysql/mysql-server
    license: GPL-2.0-only
    tier: critical
    status: built

  - name: rabbitmq
    category: Messaging
    summary: Reliable message broker speaking AMQP plus MQTT and STOMP, with flexible routing, queues, and acknowledgements for decoupling services.
    source: https://github.com/rabbitmq/rabbitmq-server
    upstream: https://github.com/rabbitmq/rabbitmq-server
    license: MPL-2.0
    tier: critical
    status: built

  - name: karapace
    category: Messaging
    summary: Karapace, Aiven's Kafka schema registry (Avro, JSON Schema, Protobuf) and REST proxy, both Confluent-API compatible. From the tagged source into a Python 3.13 venv, with the Go extension's modules floated; one image runs either role.
    source: https://github.com/Aiven-Open/karapace
    upstream: https://karapace.io
    license: Apache-2.0
    tier: standard
    status: built

  - name: cilium-operator
    category: Coordination & mesh
    summary: The Cilium Operator, generic variant (cluster-pool IPAM, CRD registration, identity and endpoint garbage collection) for a Cilium install run with its own operator off. Built from the cilium/cilium source with the vulnerable modules floated.
    source: https://github.com/cilium/cilium
    upstream: https://cilium.io
    license: Apache-2.0
    tier: standard
    status: built

  - name: hubble-ui
    category: Coordination & mesh
    summary: Hubble UI, Cilium's web UI for the service map and live network flows. The React frontend built from source and served by a Wolfi nginx that proxies the API to hubble-ui-backend in the same pod.
    source: https://github.com/cilium/hubble-ui
    upstream: https://cilium.io
    license: Apache-2.0
    tier: standard
    status: built

  - name: hubble-ui-backend
    category: Coordination & mesh
    summary: The Hubble UI backend, the Go service that reads flows and the service map from Hubble Relay and streams them to the Hubble UI. Built from source. Image only, the hubble-ui chart runs it.
    source: https://github.com/cilium/hubble-ui
    upstream: https://cilium.io
    license: Apache-2.0
    tier: standard
    status: built

  - name: hubble-relay
    category: Coordination & mesh
    summary: Hubble Relay, Cilium's cluster-wide aggregator of Hubble network-flow observability (one Observer API across every node). Built from the cilium/cilium source with the vulnerable modules floated.
    source: https://github.com/cilium/cilium
    upstream: https://cilium.io
    license: Apache-2.0
    tier: standard
    status: built

  - name: gogs
    category: Git
    summary: Gogs, the painless self-hosted Git service (repositories, issues, pull requests, wikis, webhooks, built-in SSH). Built from source with the vulnerable modules floated; SQLite, PostgreSQL or MySQL.
    source: https://github.com/gogs/gogs
    upstream: https://gogs.io
    license: MIT
    tier: standard
    status: built

  - name: terralist
    category: Registry
    summary: Terralist, a private Terraform and OpenTofu registry for modules and providers (registry protocol, web UI, OAuth login, API keys). Built from source, UI included, with the vulnerable modules floated.
    source: https://github.com/terralist/terralist
    upstream: https://www.terralist.io
    license: MPL-2.0
    tier: standard
    status: built

  - name: unleash
    category: Apps & productivity
    summary: Unleash, the feature-flag and gradual-rollout server (flags, strategies, segments, environments, admin UI, client and frontend APIs) on PostgreSQL. The official npm distribution on Wolfi Node 24, two dependencies raised to fixed releases. AGPL-3.0 since 8.0.
    source: https://github.com/Unleash/unleash
    upstream: https://www.getunleash.io
    license: AGPL-3.0-or-later
    tier: standard
    status: built

  - name: wiremock
    category: CI
    summary: WireMock, the HTTP API mock server (stubs, response templating, proxying and recording, fault injection, request journal, admin API) on Jetty 12. Assembled from its unshaded Maven artifacts with vulnerable families pinned, on a Wolfi JRE 21.
    source: https://github.com/wiremock/wiremock
    upstream: https://wiremock.org
    license: Apache-2.0
    tier: standard
    status: built

  - name: pgadmin
    category: Relational
    summary: pgAdmin 4, the web administration and development UI for PostgreSQL (query tool, ERD, schema diff, backup and restore). The official wheel under gunicorn on Wolfi Python 3.13, with its native dependencies taken from Wolfi instead of self-bundling wheels.
    source: https://github.com/pgadmin-org/pgadmin4
    upstream: https://www.pgadmin.org
    license: PostgreSQL
    tier: standard
    status: built

  - name: argo-rollouts
    category: CI
    summary: The Argo Rollouts controller, progressive delivery for Kubernetes (canary and blue-green Rollouts, analysis runs, traffic shaping through ingresses and meshes). Built from source with the vulnerable modules floated.
    source: https://github.com/argoproj/argo-rollouts
    upstream: https://argoproj.github.io/rollouts
    license: Apache-2.0
    tier: standard
    status: built

  - name: argo-events
    category: Workflow
    summary: Argo Events, event-driven automation for Kubernetes (EventSources for webhooks, queues, schedules and cloud events; Sensors that trigger workflows, resources and HTTP calls). Built from source with the argo CLI for the argoWorkflow trigger.
    source: https://github.com/argoproj/argo-events
    upstream: https://argoproj.github.io/events
    license: Apache-2.0
    tier: standard
    status: built

  - name: nats-server-config-reloader
    category: Messaging
    summary: The NATS config reloader sidecar (nats-io/nack), which signals nats-server to reload when its config changes. Built from source. Image only, no chart; the argo-events chart runs it in JetStream EventBus pods.
    source: https://github.com/nats-io/nack
    upstream: https://nats.io
    license: Apache-2.0
    tier: standard
    status: built

  - name: prometheus-nats-exporter
    category: Messaging
    summary: The Prometheus exporter for NATS server and JetStream metrics. Built from source. Image only, no chart; the argo-events chart runs it in JetStream EventBus pods.
    source: https://github.com/nats-io/prometheus-nats-exporter
    upstream: https://nats.io
    license: Apache-2.0
    tier: standard
    status: built

  - name: opa-gatekeeper
    category: Security & supply chain
    summary: OPA Gatekeeper, the Kubernetes admission controller for Rego policies (ConstraintTemplates and Constraints, validating and mutating webhooks, audit of existing resources). Built from source with the vulnerable modules floated.
    source: https://github.com/open-policy-agent/gatekeeper
    upstream: https://open-policy-agent.github.io/gatekeeper
    license: Apache-2.0
    tier: standard
    status: built

  - name: opentelemetry-operator
    category: Observability
    summary: The OpenTelemetry Operator, which manages OpenTelemetry Collectors (deployment, daemonset, statefulset or sidecar), the target allocator and auto-instrumentation injection. Built from source with its default component versions stamped in.
    source: https://github.com/open-telemetry/opentelemetry-operator
    upstream: https://opentelemetry.io/docs/platforms/kubernetes/operator/
    license: Apache-2.0
    tier: standard
    status: built

  - name: nessie
    category: Databases & engines
    summary: Project Nessie, the transactional catalog for data lakehouse tables (Git-like branches and commits over Iceberg, plus the Iceberg REST catalog). The official Quarkus uber-jar on a Wolfi JRE 21.
    source: https://github.com/projectnessie/nessie
    upstream: https://projectnessie.org
    license: Apache-2.0
    tier: standard
    status: built

  - name: akhq
    category: Messaging
    summary: AKHQ, the web UI for Apache Kafka (topics, messages, consumer groups, schema registry, Kafka Connect, ACLs). The release distribution with 74 library jars swapped to fixed releases, on a Wolfi JRE 25.
    source: https://github.com/tchiotludo/akhq
    upstream: https://akhq.io
    license: Apache-2.0
    tier: standard
    status: built

  - name: kafka
    category: Messaging
    summary: Distributed event-streaming platform for high-throughput, durable, replayable publish-subscribe pipelines and stream processing.
    source: https://archive.apache.org/dist/kafka/4.3.0/kafka_2.13-4.3.0.tgz
    upstream: https://github.com/apache/kafka
    license: Apache-2.0
    tier: critical
    status: built

  - name: nats
    category: Messaging
    summary: Lightweight, high-performance messaging system for cloud-native pub/sub and request-reply, with optional JetStream persistence and streaming.
    source: https://github.com/nats-io/nats-server
    upstream: https://github.com/nats-io/nats-server
    license: Apache-2.0
    tier: standard
    status: built

  - name: mosquitto
    category: Messaging
    summary: Lightweight Eclipse MQTT broker for IoT and pub/sub messaging. Speaks MQTT 3.1/3.1.1/5.0 over TCP, TLS, and websockets; built from source with OpenSSL and a hardened nonroot, read-only-rootfs runtime.
    source: https://github.com/eclipse-mosquitto/mosquitto
    upstream: https://mosquitto.org
    license: EPL-2.0 OR BSD-3-Clause
    tier: standard
    status: built

  - name: emqx
    category: Messaging
    summary: Massively scalable, distributed MQTT broker for IoT, IIoT, and connected vehicles. Speaks MQTT 5.0 over TCP/TLS/websockets with a clustering engine and a web dashboard. Packaged from EMQX's official Erlang/OTP release. Licensed BSL 1.1 (single node free; clustering requires a commercial license).
    source: https://github.com/emqx/emqx
    upstream: https://www.emqx.io
    license: BUSL-1.1
    tier: standard
    status: built

  - name: mattermost
    category: Messaging
    summary: Open-source, self-hosted team messaging and collaboration platform (a Slack alternative) with channels, direct messages, file sharing, and integrations. Packaged from Mattermost's official Team Edition server release; requires an external PostgreSQL.
    source: https://github.com/mattermost/mattermost
    upstream: https://mattermost.com
    license: AGPL-3.0-only
    tier: standard
    status: built

  - name: varnish
    category: Cache
    summary: HTTP reverse-proxy cache (web accelerator) that fronts an origin and serves its responses from memory, cutting backend load and tail latency. Caching policy is VCL, which varnishd compiles to native code at startup. The chart supplies the VCL and the backend.
    source: https://github.com/varnish/varnish
    upstream: https://www.varnish.org
    license: BSD-2-Clause
    tier: standard
    status: built

  - name: memcached
    category: Cache
    summary: Simple, high-performance distributed in-memory cache for storing small objects and database query results to reduce backend load.
    source: https://www.memcached.org/files/memcached-1.6.42.tar.gz
    upstream: https://github.com/memcached/memcached
    license: BSD-3-Clause
    tier: standard
    status: built

  - name: ferretdb
    category: Document
    summary: MongoDB-compatible document database that translates the MongoDB wire protocol onto PostgreSQL via the DocumentDB extension. The clean-license substitute for MongoDB.
    source: https://github.com/FerretDB/FerretDB
    upstream: https://github.com/FerretDB/FerretDB
    license: Apache-2.0
    tier: standard
    status: built

  - name: postgres-documentdb
    category: Document
    summary: PostgreSQL 17 plus the open DocumentDB extension, providing BSON document storage and queries. The storage backend that powers FerretDB v2.
    source: https://github.com/FerretDB/documentdb
    upstream: https://github.com/FerretDB/documentdb
    license: MIT
    tier: standard
    status: built

  - name: documentdb
    category: Document
    summary: Self-contained MongoDB-compatible server bundling PostgreSQL, the DocumentDB extension, and a wire gateway. Linux Foundation project, truly open under MIT.
    source: https://github.com/documentdb/documentdb
    upstream: https://github.com/documentdb/documentdb
    license: MIT
    tier: standard
    status: done

  - name: mongodb
    category: Document
    summary: Document (NoSQL) database for JSON-like data. SSPL is not OSI-approved / source-available, not open source; prefer the clean alternative FerretDB or DocumentDB.
    source: https://github.com/mongodb/mongo
    upstream: https://github.com/mongodb/mongo
    license: SSPL-1.0
    tier: standard
    status: done
    cleanAlternative: FerretDB + DocumentDB — MongoDB-wire-compatible and truly open (Apache-2.0 / PostgreSQL).

  - name: zookeeper
    category: Coordination
    summary: Centralized coordination service for distributed systems, providing configuration, naming, leader election, and synchronization primitives.
    source: https://archive.apache.org/dist/zookeeper/zookeeper-3.9.5/apache-zookeeper-3.9.5-bin.tar.gz
    upstream: https://github.com/apache/zookeeper
    license: Apache-2.0
    tier: standard
    status: built

  - name: opensearch
    category: Search
    summary: Search and analytics suite with a Kibana-style dashboards UI. The Apache-2.0 community fork of Elasticsearch and the recommended open alternative.
    source: https://github.com/opensearch-project/OpenSearch
    upstream: https://github.com/opensearch-project/OpenSearch
    license: Apache-2.0
    tier: standard
    status: built

  - name: cassandra
    category: Wide-column
    summary: Distributed wide-column NoSQL store built for linear horizontal scale and high availability with no single point of failure, tuned for heavy writes.
    source: https://downloads.apache.org/cassandra/5.0.8/apache-cassandra-5.0.8-bin.tar.gz
    upstream: https://github.com/apache/cassandra
    license: Apache-2.0
    tier: standard
    status: built

  - name: influxdb
    category: Time series
    summary: Time-series database purpose-built for ingesting and querying metrics, events, and IoT/sensor data at high write rates.
    source: https://github.com/influxdata/influxdb
    upstream: https://github.com/influxdata/influxdb
    license: MIT
    tier: standard
    status: done

  - name: questdb
    category: Time series
    summary: High-performance time-series SQL database for fast ingestion and queries over metrics, financial ticks, and IoT data, with PostgreSQL-wire and InfluxDB line-protocol ingestion.
    source: https://github.com/questdb/questdb
    upstream: https://github.com/questdb/questdb
    license: Apache-2.0
    tier: standard
    status: done

  - name: couchdb
    category: Document
    summary: Document database with an HTTP/JSON API and multi-master replication, designed for offline-first sync across nodes and devices.
    source: https://github.com/apache/couchdb
    upstream: https://github.com/apache/couchdb
    license: Apache-2.0
    tier: standard
    status: done

  - name: clickhouse
    category: Analytical
    summary: Column-oriented OLAP database for real-time analytical queries over very large datasets, with high ingest rates and fast aggregations.
    source: https://github.com/ClickHouse/ClickHouse
    upstream: https://github.com/ClickHouse/ClickHouse
    license: Apache-2.0
    tier: standard
    status: done

  - name: tigerbeetle
    category: Database
    summary: Distributed financial-grade accounting database for high-throughput double-entry bookkeeping. Ships a single self-contained static Zig binary; speaks its own binary protocol (not HTTP) on port 3000.
    source: https://github.com/tigerbeetle/tigerbeetle
    upstream: https://github.com/tigerbeetle/tigerbeetle
    license: Apache-2.0
    tier: standard
    status: done

  - name: victoriametrics
    category: Time series
    summary: Fast, cost-efficient time-series database that speaks PromQL and Prometheus remote_write. Drop-in long-term storage or full replacement for Prometheus.
    source: https://github.com/VictoriaMetrics/VictoriaMetrics
    upstream: https://github.com/VictoriaMetrics/VictoriaMetrics
    license: Apache-2.0
    tier: low
    status: done

  - name: prometheus
    category: Observability
    summary: Metrics collection, storage, and alerting system that scrapes targets and runs PromQL queries. The de-facto cloud-native monitoring TSDB.
    source: https://github.com/prometheus/prometheus
    upstream: https://github.com/prometheus/prometheus
    license: Apache-2.0
    tier: standard
    status: done

  - name: uptime-kuma
    category: Observability
    summary: Uptime Kuma, the self-hosted uptime monitor and status-page server (HTTP, TCP, ping, DNS, database and more). The tagged server with pinned npm production deps and the release's prebuilt UI on Node 24; SQLite in DATA_DIR by default.
    source: https://github.com/louislam/uptime-kuma
    upstream: https://uptime.kuma.pet
    license: MIT
    tier: standard
    status: built

  - name: grafana
    category: Observability
    summary: Dashboards and visualization for metrics, logs, and traces across many data sources. OSS edition, licensed AGPL.
    source: https://github.com/grafana/grafana
    upstream: https://github.com/grafana/grafana
    license: AGPL-3.0-only
    tier: standard
    status: built

  - name: loki
    category: Observability
    summary: Horizontally scalable log aggregation system from Grafana that indexes only labels, not full log text. Like Prometheus, but for logs. Licensed AGPL.
    source: https://github.com/grafana/loki
    upstream: https://github.com/grafana/loki
    license: AGPL-3.0-only
    tier: standard
    status: done

  - name: thanos
    category: Observability
    summary: Highly-available Prometheus setup with unlimited metric retention via object storage, adding a global query view, downsampling, and compaction across Prometheus servers. A CNCF project.
    source: https://github.com/thanos-io/thanos
    upstream: https://github.com/thanos-io/thanos
    license: Apache-2.0
    tier: standard
    status: built

  - name: jetty
    category: Gateway
    summary: Eclipse Jetty, the lightweight Java web server and servlet container (Jakarta EE 10 on 12.0, EE 11 on 12.1), from the official jetty-home distribution on a hardened JRE, with a ready JETTY_BASE that deploys web apps from webapps/.
    source: https://repo1.maven.org/maven2/org/eclipse/jetty/jetty-home/
    upstream: https://jetty.org
    license: EPL-2.0 OR Apache-2.0
    tier: standard
    status: built

  - name: wildfly
    category: Gateway
    summary: WildFly, the Jakarta EE application server, on a Wolfi openjdk-21 JRE. Nonroot, read-only rootfs (all runtime writes under /tmp), HTTP on 8080 and management on loopback. Its bundled OpenTelemetry family is moved to 1.62.0 for a CVE, with each module descriptor rewritten to match.
    source: https://github.com/wildfly/wildfly/releases
    upstream: https://www.wildfly.org
    license: Apache-2.0
    tier: standard
    status: built

  - name: tomcat
    category: Gateway
    summary: Apache Tomcat, the widely used open-source Java servlet container and web/application server for running Jakarta Servlet, JSP, and WebSocket web applications.
    source: https://downloads.apache.org/tomcat/tomcat-11/
    upstream: https://github.com/apache/tomcat
    license: Apache-2.0
    tier: critical
    status: done
  - name: httpd
    category: Gateway
    summary: Apache HTTP Server, the long-standing open-source web server and reverse proxy for serving static content and fronting application backends (mod_proxy).
    source: https://downloads.apache.org/httpd/
    upstream: https://github.com/apache/httpd
    license: Apache-2.0
    tier: critical
    status: done
  - name: openresty
    category: Gateway
    summary: OpenResty, nginx with LuaJIT and the lua-nginx-module set for scriptable proxies and web apps. Built from source on Wolfi against the system OpenSSL, PCRE2 and zlib, shell-free, nonroot, read-only rootfs. Server blocks go in /etc/nginx/conf.d.
    source: https://openresty.org/download/
    upstream: https://openresty.org
    license: BSD-2-Clause
    tier: standard
    status: built

  - name: nginx
    category: Gateway
    summary: High-performance web server, reverse proxy, and load balancer for serving static content and fronting application backends.
    source: https://github.com/nginx/nginx
    upstream: https://github.com/nginx/nginx
    license: BSD-2-Clause
    tier: critical
    status: done

  - name: solr
    category: Search
    summary: Enterprise search platform built on Apache Lucene, offering full-text search, faceting, and indexing over large document collections.
    source: https://github.com/apache/solr
    upstream: https://github.com/apache/solr
    license: Apache-2.0
    tier: low
    status: built

  - name: ory-hydra
    category: Identity
    summary: Ory Hydra, the OAuth 2.0 and OpenID Connect provider. Built from source like upstream's Linux release (cgo, sqlite, hsm, json1); one binary serves the public (4444) and admin (4445) APIs and runs migrations and the admin CLI.
    source: https://github.com/ory/hydra
    upstream: https://www.ory.sh/hydra
    license: Apache-2.0
    tier: standard
    status: built

  - name: keycloak
    category: Identity
