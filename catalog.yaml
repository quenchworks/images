    status: built # image published; chart integration pending (umbrella chart AH 2f885f06). Harbor REGISTRY -- the container registry (Docker distribution) Harbor v2.14.4 ships. This is the PATCHED FORK goharbor/distribution, NOT upstream distribution/distribution: it carries Harbor's "-patch-redis" layer (redis layer-blob-descriptor cache + storage patches in registry/storage/cache/redis and the storage drivers). PIN (read verbatim from the Harbor v2.14.4 root Makefile): DISTRIBUTION_SRC=https://github.com/goharbor/distribution.git, REGISTRY_SRC_TAG=release/2.8 (a BRANCH whose HEAD is commit 11540eae06cb772e8b65793c066fa8d5810fbe53 == tag v2.8.3-harbor.1-rc.4 -- we pin that exact commit for reproducibility), REGISTRYVERSION=v2.8.3-patch-redis (Harbor's canonical version string; its REGISTRYURL release dir is release-v2.8.3-patch-redis). BUILD-METHOD: BUILT FROM SOURCE via melange, mirroring Harbor's make/photon/registry/Dockerfile.binary (`CGO_ENABLED=0 make binaries BUILDTAGS="include_oss include_gcs"` => Alibaba OSS + GCS storage drivers compiled in; module path is the legacy GOPATH path github.com/docker/distribution, repo vendors its deps). git-checkout pins the fork at the exact commit; go-1.25 Wolfi toolchain (go.mod requires go 1.25.x) for current stdlib CVE fixes; -mod=mod + re-vendor after the CVE bumps. VERSION STAMP: the fork's Makefile stamps -ldflags -X github.com/docker/distribution/version.Version=$(VERSION); we override VERSION=v2.8.3-patch-redis (REVISION kept as the real fork commit), so `registry --version` prints "github.com/docker/distribution v2.8.3-patch-redis". Only the `registry` binary is shipped (digest/registry-api-descriptor-template are built by `make binaries` but not installed). ENTRYPOINT: /usr/bin/registry serve /etc/registry/config.yml (apko entrypoint; --version is a root-command flag so the smoke test overrides the entrypoint to read it). CONFIG/AUTH-FROM-CHART: the image ships ONLY a MINIMAL sample /etc/registry/config.yml (fi