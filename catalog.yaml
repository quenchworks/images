dirs) then `exec grafana server --homepath=/usr/share/grafana --config=$GF_PATHS_CONFIG --packaging=docker`. Config via grafana.ini or any GF_<SECTION>_<KEY> env. Admin creds from GF_SECURITY_ADMIN_USER (default admin) + GF_SECURITY_ADMIN_PASSWORD (chart Secret); no anonymous access by default. Pairs with the QuenchWorks Prometheus/VictoriaMetrics datasources. Port 3000 (UI + API). Probe httpGet /api/health on 3000 (returns database ok). Verified locally x86_64: read-only rootfs + tmpfs /var/lib/grafana+/var/log/grafana+/etc/grafana/provisioning+/tmp, nonroot uid 1001, /api/health database ok + version 13.0.2, /login serves frontend HTML, admin basic-auth reaches the default org, Trivy 0. arm64 tarball sha256-verified as a genuine aarch64 binary; built native on the ubuntu-24.04-arm runner.

