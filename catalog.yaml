  - name: postgresql
    version: "18.4"
    source: https://ftp.postgresql.org/pub/source/v18.4/postgresql-18.4.tar.bz2
    license: PostgreSQL
    tier: critical
    status: built # 0-CVE multi-arch, nonroot; built from the official source tarball, initdb bootstrap entrypoint. Bundles a curated set of dependency-free contrib extensions built from the same source tree (no extra external packages): btree_gin (required by Temporal's visibility schema), btree_gist, pg_trgm, pgcrypto, hstore, citext, pg_stat_statements, intarray, ltree, unaccent, fuzzystrmatch, tablefunc.

  - name: postgresql-15
    version: "15.18"
    source: https://ftp.postgresql.org/pub/source/v15.18/postgresql-15.18.tar.bz2
    license: PostgreSQL
    tier: critical
    status: built # PostgreSQL 15.x variant for the Coolify wave (Coolify pins PG 15; the default postgresql image tracks 18.x). 0-CVE multi-arch, nonroot uid 1001, read-only rootfs; built from the official source tarball, initdb bootstrap entrypoint. Same recipe/hardening as postgresql. Bundles the same curated set of dependency-free contrib extensions built from the same source tree (no extra external packages): btree_gin, btree_gist, pg_trgm, pgcrypto, hstore, citext, pg_stat_statements, intarray, ltree, unaccent, fuzzystrmatch, tablefunc.

