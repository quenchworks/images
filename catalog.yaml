    status: done # image + chart both shipped (chart AH c8319a5d, single-binary StatefulSet, push->query validated). 0-CVE multi-arch (amd64+arm64), nonroot uid 1001, read-only rootfs friendly. AGPL-3.0 (Grafana Loki, horizontally-scalable log aggregation). BUILD-METHOD: built FROM SOURCE on Wolfi via melange from the git tag tarball (https://github.com/grafana/loki/archive/refs/tags/v3.7.2.tar.gz, sha256 f91b7737cc0ca352dfb99e9307bc2f6a67135d6827922374ab4a31676d280790) which VENDORS all Go deps (vendor/) so the build is fully offline with GOFLAGS=-mod=vendor; CGO_ENABLED=0 + -tags netgo => single static binary, no glibc dep on the binary itself. Go toolchain go-1.26 from Wolfi (go.mod requires go>=1.26.x; picks up latest stdlib CVE fixes). VERSION STAMP: ldflags -X github.com/grafana/loki/v3/pkg/util/build.{Version,Branch,Revision,BuildUser,BuildDate} exactly per upstream Makefile VPREFIX (build package forwards into prometheus/common/version) so `loki -version` prints 3.7.2. Ships TWO binaries: /usr/bin/loki (the server, deliverable, entrypoint) + /usr/bin/logcli (trivial extra CLI). NO bundled web UI -- Grafana is Loki's frontend, so no Node/asset step. Ports 3100 (HTTP API, /ready, /metrics) + 9095 (gRPC). READ-ONLY ROOTFS: Loki writes nothing to rootfs; needs a writable storage path (single-binary config path_prefix /loki for chunks/rules/wal) + /tmp, which the chart mounts as writable volumes. Probe httpGet /ready on 3100. TRIVY: local + CI 0-CVE (--ignore-unfixed); Wolfi base kept clean. Verified locally x86_64: read-only rootfs + tmpfs /loki+/tmp, nonroot uid 1001, minimal single-binary filesystem config, /ready -> 200 "ready", /metrics -> 200, gRPC :9095 up. arm64 built native on the ubuntu-24.04-arm runner. Published multi-arch: ghcr.io/quenchworks/images/loki:3.7.2@sha256:b21920fa24168d0ab914ca944a745b97d4db4d1d07c834fb6de2f8357ba25877. Future chart AH id c8319a5d-340f-4475-a05f-886c884c8b7d.

  - name: nginx
    version: "1.30.2"
    source: https://github.com/nginx/nginx
