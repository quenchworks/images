ed from version/VERSION. Atlantis selects it with --default-tf-distribution=opentofu (env ATLANTIS_DEFAULT_TF_DISTRIBUTION=opentofu; with that flag Atlantis resolves the `tofu` binary on PATH, DistributionOpenTofu.BinName()=="tofu"). We DO NOT bundle Terraform (BUSL-1.1). RUNTIME DEPS: git (Atlantis shells out to the git CLI to clone/fetch PR branches, server/events/working_dir.go) + openssh-client (ssh:// clone URLs) + ca-certificates-bundle + busybox. PORT: 4141 (atlantis server: web UI + /events webhook endpoint + /healthz). ENTRYPOINT: /usr/bin/atlantis server (apko entrypoint command). DATA DIR: needs a writable --data-dir (default ~/.atlantis) for cloned repos + plan files; apko defaults ATLANTIS_DATA_DIR=/atlantis-data + HOME=/atlantis-data + TMPDIR=/tmp so git/ssh/tofu have a writable home under a read-only rootfs (the chart mounts a PVC there + emptyDir /tmp). CONFIG-FROM-CHART: ships NO live config -- the chart supplies the VCS token + webhook secret + repo-allowlist + atlantis-url via ATLANTIS_*-prefixed env/flags, optionally a repos.yaml ConfigMap. TRIVY 0-CVE (--ignore-unfixed): local image scan 0 (Wolfi base wolfi-baselayout/busybox/ca-certificates-bundle/git/openssh-client clean; Go stdlib current via go-1.26). No CVE bumps needed. Verified locally x86_64: `atlantis version` -> 0.44.0, `tofu version` -> OpenTofu v1.12.2, server boots with dummy GitHub creds under read-only rootfs (writable tmpfs data-dir + /tmp), GET :4141/healthz -> 200, nonroot uid 1001. KEEP repository_dispatch-to-charts. arm64 built+scanned native on ubuntu-24.04-arm in CI. Published multi-arch 0-CVE (CI green both arches, merge signed cosign keyless + dispatched charts repo): ghcr.io/quenchworks/images/atlantis:0.44.0@sha256:0276dd25e299631957f7bdc1fe9cd63f9fc908c148f18cbb22caaea154a09210 (index; amd64 sha256:0e68bfe52e43b7751ab9096816b480dc9f72739a6f338df97e30865a3d5055e8, arm64 sha256:a2ae75f43de21f586d8435b2f0eaab36524bb329ecf3030936e8e37edd52c712). Image CI run https://github