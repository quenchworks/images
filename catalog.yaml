    version: "8.8.0"
    source: https://download.redis.io/releases/redis-8.8.0.tar.gz
    license: AGPL-3.0-only # Redis 8.x ships under AGPLv3 (OSI). Use Valkey if you need BSD.
    tier: critical
    status: pilot

  - name: redis-exporter
    version: "1.86.0"
    source: https://github.com/oliver006/redis_exporter
    license: MIT
    tier: critical
    status: pilot # hardened metrics sidecar for the redis chart

  # next targets, not yet built
  - name: valkey
    version: "9.1.0"
    source: https://github.com/valkey-io/valkey
    license: BSD-3-Clause # BSD cache, QuenchWorks default over Redis
    tier: critical
    status: built # 0-CVE multi-arch, nonroot; built from the git tag pinned to its commit

  - name: postgresql
    version: "18.4"
    source: https://ftp.postgresql.org/pub/source/v18.4/postgresql-18.4.tar.bz2
    license: PostgreSQL
    tier: critical
    status: built # 0-CVE multi-arch, nonroot; built from the official source tarball, initdb bootstrap entrypoint. Bundles a curated set of dependency-free contrib extensions built from the same source tree (no extra external packages): btree_gin (required by Temporal's visibility schema), btree_gist, pg_trgm, pgcrypto, hstore, citext, pg_stat_statements, intarray, ltree, unaccent, fuzzystrmatch, tablefunc.

