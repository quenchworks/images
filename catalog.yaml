    version: "0.19.1"
    source: https://github.com/prometheus-community/postgres_exporter
    license: Apache-2.0
    tier: critical
    status: built # hardened metrics sidecar for the postgresql chart

  - name: pgbouncer
    version: "1.25.2"
    source: https://github.com/pgbouncer/pgbouncer
    license: ISC
    tier: standard
    status: done # image + chart both shipped (chart AH 464615b6, scram auth, bundled PG 0.0.5 + externalDatabase, SELECT-1-through-pool validated). 0-CVE multi-arch, nonroot uid 1001, read-only rootfs. C/autotools build from the official release tarball (pgbouncer-1.25.2.tar.gz, autotools-ready, bundles libusual); built only the pgbouncer binary (skip make install's python3 man-page regen). Deps: libevent (event loop, required), openssl (TLS), c-ares (--with-cares async DNS); pam/systemd disabled. Port 6432. Ships a minimal sample /etc/pgbouncer/pgbouncer.ini only; the CHART supplies the real pgbouncer.ini (ConfigMap) + auth (userlist.txt Secret or auth_query). Writable runtime dir /var/run/pgbouncer owns the unix socket + pidfile (mount emptyDir/tmpfs); logfile empty => logs to stderr. Confirmed locally: prints "PgBouncer 1.25.2 / libevent 2.1.12 / c-ares 1.34.6 / OpenSSL 3.6.3", boots on read-only rootfs as uid 1001 ("process up", "listening on 0.0.0.0:6432"). No CVE bumps needed (Wolfi openssl/libevent/c-ares current). Published digest: ghcr.io/quenchworks/images/pgbouncer:1.25.2@sha256:bc8e1092bdcc60008dabd1e63270f91bf77ec9430bb6f82967f0e068fbad8694 (amd64+arm64, cosign-signed).

