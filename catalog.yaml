    status: built # image published; chart integration pending (umbrella chart AH 2f885f06-90d5-4097-9614-6d668187e5a7). Harbor TRIVY SCANNER ADAPTER -- the OPTIONAL Harbor v2.14.4 image-vulnerability-scanning component (the registry works WITHOUT it). It is the bridge Harbor calls to start scans: an HTTP API (the Harbor pluggable-scanner spec) that shells out to the Trivy CLI, parses the report, and serves results back to Harbor. Ships TWO pure-Go binaries: /usr/bin/scanner-trivy (the adapter, the entrypoint) + /usr/bin/trivy (the scanner CLI it invokes; the adapter resolves it via PATH/exec.LookPath -- no config needed). PIN (read VERBATIM from the Harbor v2.14.4 root Makefile): TRIVYADAPTERVERSION=v0.36.0 (goharbor/harbor-scanner-trivy), TRIVYVERSION=v0.70.0 (aquasecurity/trivy). The image/APK version tracks the ADAPTER (0.36.0); the bundled trivy version (0.70.0) is stamped into the trivy binary and reported by `trivy --version`. BUILD-METHOD: BUILT FROM SOURCE via melange, BOTH binaries in one melange (two go builds) -> one apko image. CGO_ENABLED=0, GOOS=linux, GOTOOLCHAIN=local, go-1.25 Wolfi toolchain (both go.mod require go 1.25.x; neither vendors -> modules from the Go proxy, GOFLAGS=-mod=mod). Source tarballs fetched + sha256-verified: trivy v0.70.0 (sha256 ff9ac06468aab89802388f16d1d179f4680db714afbf6a8132a417d288aa008e), harbor-scanner-trivy v0.36.0 (sha256 774b79f4dd98d38cfc5125b9aa03223d3d57d10c77a01da74913846ccc35ceac). LARGE module graph (trivy) -> build sets TMPDIR=$RUNNER_TEMP/melange-tmp (locally /home/mkabumattar/.cache/melange-tmp). VERSION LDFLAGS: trivy -ldflags "-s -w -X=github.com/aquasecurity/trivy/pkg/version/app.ver=v0.70.0" (per trivy magefile buildLdflags), built ./cmd/trivy; scanner -ldflags "-s -w -X main.version=v0.36.0 -X main.commit=v0.36.0 -X main.date=unknown" (the GoReleaser main.version/commit/date vars), built ./cmd/scanner-trivy (per the repo Makefile). GOEXPERIMENT: trivy v0.70.0 imports the Go 1.25 experimental encoding/json/v2 + encoding/json/jsontext (pkg/x/json), gated behind GOEXPERIMENT=jsonv2 -- the trivy build sets it (scanner build does not need it). PORT: 8080 (HTTP API; SCANNER_API_SERVER_ADDR default ":8080"; 8443 if the chart enables TLS via SCANNER_API_SERVER_TLS_*). HEALTH: GET /probe/healthy -> 200 (liveness, independent of Redis); readiness GET /probe/ready. ENTRYPOINT: /usr/bin/scanner-trivy. CONFIG-FROM-CHART: ships NO live config -- the chart supplies SCANNER_* env: SCANNER_REDIS_URL / SCANNER_STORE_REDIS_URL / SCANNER_JOB_QUEUE_REDIS_URL -> Valkey (job queue + result data store), SCANNER_TRIVY_CACHE_DIR (default /home/scanner/.cache/trivy), SCANNER_TRIVY_REPORTS_DIR (default /home/scanner/.cache/reports), SCANNER_TRIVY_DB_REPOSITORY (vuln DB OCI repo), SCANNER_API_SERVER_ADDR. TRIVY VULN DB: NOT baked into the image -- trivy downloads it at RUNTIME into the cache dir; the chart mounts a writable PVC/emptyDir at SCANNER_TRIVY_CACHE_DIR. WRITABLE PATHS (read-only rootfs): the trivy cache dir /home/scanner/.cache/trivy (DB at runtime) + the reports dir /home/scanner/.cache/reports + /tmp; everything else read-only. The runtime user is named "scanner" (uid 1001) so $HOME=/home/scanner matches the upstream default cache paths; the cache/reports dirs are pre-created owned by uid 1001 so a writable mount/tmpfs over /home/scanner/.cache works under a read-only rootfs. Runtime dep `git` is included (trivy clones the vuln DB OCI repo at runtime). CVE BUMPS (Trivy 0-CVE --ignore-unfixed gate covers BOTH binaries via dedicated gobinary scans -- the large static binaries are not fully covered by the image-layer scan): scanner-trivy bumped golang.org/x/net->latest (CVE-2025-22870 proxy bypass + CVE-2025-22872 html tokenizer) and github.com/redis/go-redis/v9->v9.7.3 (CVE-2025-29923 out-of-bounds); trivy CLI bumped github.com/containerd/containerd->v1.7.32 AND github.com/containerd/containerd/v2->v2.2.4 (CVE-2026-46680 runAsNonRoot bypass; both major-version modules were present), github.com/go-git/go-billy/v5->v5.9.0 (CVE-2026-44973/44740), github.com/go-git/go-git/v5->v5.19.1 (CVE-2026-45022/41506/45571/45570 + GHSA-w5pp-99ch-qj29), github.com/in-toto/in-toto-golang->v0.11.0 (GHSA-pmwq-pjrm-6p5r); go mod tidy after each set. Result: 0 FIXABLE CVEs on BOTH gobinaries + the image OS layer. Verified locally x86_64: `trivy --version` -> v0.70.0; scanner-trivy boots under read-only rootfs (writable cache/reports + /tmp), binds :8080, GET /probe/healthy -> 200 with no Redis; trivy on PATH, both binaries executable, nonroot uid 1001; Trivy gobinary scans of scanner-trivy + trivy both 0 fixable, image scan 0. arm64 built+scanned native on ubuntu-24.04-arm in CI. Published multi-arch 0-CVE (CI green both arches, merge signed cosign keyless + dispatched charts repo): ghcr.io/quenchworks/images/harbor-trivy-adapter:0.36.0@sha256:4e86679ea3dc1ac97ca520c7e7a375c9a37726f564fef673f69aad110472e922 (index; amd64 sha256:1a8ad01ea9257c4cef2d968e717542ec53f6c5c7aa841fdc9da55181957e0503, arm64 sha256:3707d1546ace8c96646181e37df228e47901f6963ac5636e294edad2593f9bc2). CI run https://github.com/quenchworks/images/actions/runs/27473803480.
