    status: pilot # FIRST proof image of the Coolify multi-image wave (umbrella chart `coolify` to follow, Harbor-style). Image-only component; ghcr.io/quenchworks/images/coolify-realtime. Coolify's realtime container is a TWO-process service: (1) soketi -- a self-hosted Pusher-compatible WebSocket pub/sub server the Coolify UI subscribes to, listens :6001; (2) a small Node terminal server (ws + node-pty) bridging the UI's xterm.js terminal to an `ssh` PTY on target hosts, listens :6002. Both supervised by upstream's soketi-entrypoint.sh (log FIFOs under /tmp, signal forwarding). Coolify pins realtime_version 1.0.16 (versions.json) at coolify tag v4.1.2 (commit e7dff30b7c998c301fd91bd169727b90c59ec291); that Dockerfile builds FROM quay.io/soketi/soketi:1.6-16-alpine (== soketi release 1.6.1) and curls cloudflared 2025.7.0. BUILD-METHOD: built FROM SOURCE on Wolfi via melange, BOTH halves. (1) soketi from its own git tag 1.6.1 (commit 5d188786beaf683aca2115a6247dcdc15c29ac77): npm ci -> npm run build (tsc -> dist/) -> npm ci --omit=dev --ignore-scripts -> npm prune --production, then laid out under /app (bin/ dist/ node_modules/) so /app/bin/server.js is the entrypoint soketi expects. (2) terminal server from coolify v4.1.2 docker/coolify-realtime/ (terminal-server.js, terminal-utils.js, package.json + committed package-lock.json): npm ci then `npm rebuild node-pty --update-binary` to compile the NATIVE node-pty 1.1.0 addon for the build arch (native amd64+arm64 runners, no emulation; build-base + python3 supply the toolchain), installed under /terminal. cloudflared is NOT vendored as an upstream binary blob -- the terminal server only shells out to `cloudflared access ssh` as an ssh ProxyCommand for tunneled hosts, satisfied at RUNTIME by Wolfi's CVE-tracked cloudflared package. Node toolchain standardised on Wolfi nodejs-22 (LTS) for build + runtime. RUNTIME deps: bash+busybox (entrypoints), ca-certificates-bundle, nodejs-22, openssh-client (terminal spawns ssh), cloudflared. PORTS: 6001 soketi, 6002 terminal. READ-ONLY ROOTFS: entrypoint writes log FIFOs under /tmp; node-pty spawns the ssh PTY with cwd=$HOME, so /tmp + /home/coolify are the only writable surfaces (tmpfs/emptyDir); soketi is stateless (no PVC). nonroot uid 1001, drop ALL caps, multi-arch amd64+arm64. 0-CVE Trivy gate (--ignore-unfixed CRITICAL..LOW). Build workflow build-coolify-realtime.yml includes the cosign keyless sign + SPDX SBOM (anchore/sbom-action) + SLSA build-provenance (actions/attest-sbom@v2 + actions/attest-build-provenance@v2) attestation steps with attestations:write. test.sh proves soketi :6001 GET / + /ready -> 200, terminal :6002 GET /ready -> 200 (reaching listen(6002) proves node-pty loaded), node-pty require() loads in runtime, ssh + cloudflared present, nonroot uid 1001 on read-only rootfs.

  - name: coolify-helper
    version: "1.0.14"
    source: https://github.com/coollabsio/coolify
    license: Apache-2.0 AND AGPL-3.0-or-later # coolify-helper is Apache-2.0; bundles minio mc (AGPL-3.0). pack Apache-2.0, railpack/nixpacks/mise MIT, docker/compose/buildx Apache-2.0
    tier: standard
    status: pilot # SECOND image of the Coolify multi-image wave (after coolify-realtime; umbrella chart `coolify` to follow). Image-only component; ghcr.io/quenchworks/images/coolify-helper. coolify-helper is Coolify's ON-DEMAND BUILD ENGINE: the control plane spins up one helper container per deployment, mounts the HOST docker socket (/var/run/docker.sock), and the helper drives `docker build`/`docker compose`/buildpacks on the host daemon to build+run the user's app image. PRIVILEGED BY DESIGN: talks to the host root docker daemon, so it RUNS AS ROOT and apko deliberately does NOT drop to nonroot/cap-drop -- a nonroot helper cannot reach the socket nor invoke the build toolchain and would break Coolify's deploy path. This is a documented by-design privilege, NOT a hardening gap; the hardening is the 0-CVE SOFTWARE SURFACE only. Documented in melange/apko headers + test.sh. Coolify pins helper.version 1.0.14 (versions.json) at coolify tag v4.1.2 (commit e7dff30b7c998c301fd91bd169727b90c59ec291); the upstream helper Dockerfile is FROM alpine:3.21 and curls release blobs: docker 28.0.0, compose 2.38.2, buildx 0.25.0, pack 0.38.2, nixpacks 1.41.0, railpack 0.23.0, mise 2026.3.17, mc RELEASE.2025-08-13T08-35-41Z, + apk bash curl git git-lfs openssh-client tar tini. BUILD-METHOD: split by provenance, NO curled blobs. (A) FROM WOLFI (CVE-tracked apk, in apko.yaml): docker-cli, docker-compose (compose v2 plugin /usr/libexec/docker/cli-plugins), docker-cli-buildx (buildx plugin), mc (Wolfi 0.20250813.083541 == upstream RELEASE.2025-08-13T08-35-41Z), git, git-lfs, openssh-client, tini, bash, curl, busybox (tar/coreutils), ca-certificates-bundle -- Wolfi tracks CURRENT upstreams so versions are newer than the alpine Dockerfile's frozen pins (intentional: follow the CVE-patched line). (B) BUILT FROM SOURCE via melange (no Wolfi pkg exists for these): pack 0.38.2 Go (buildpacks/pack commit f1c347c6a645f1ff682dabc2b11fcdf3154f2aa9, `go build .` ldflag client.Version), railpack 0.23.0 Go (railwayapp/railpack commit ffdb0331677897577eafe61edc600aafdec387be, `go build ./cmd/cli` go-1.26), nixpacks 1.41.0 Rust (railwayapp/nixpacks commit bece51fbebac1d59709061a36e59dc9e0cf7ad3f, cargo build --release --locked), mise 2026.3.17 Rust (jdx/mise commit 073698a857f1237d0359e203ca52ce8b3957f5bd, cargo build --release; openssl-dev satisfies native-tls). NO VENDORED EXCEPTIONS -- all four compile cleanly from source. RAILPACK<->MISE: railpack expects a mise binary at /tmp/railpack/mise/mise-2026.3.17 (core/mise InstallDir, must match railpack's version.txt) else it downloads a glibc mise that fails on musl; we install from-source mise at /usr/local/bin/mise and ship an entrypoint wrapper (coolify-helper-entrypoint) that seeds /tmp/railpack/mise/mise-2026.3.17 from it on every start (since /tmp is wiped on container start), then execs CMD. ENTRYPOINT: /sbin/tini -- coolify-helper-entrypoint (tini PID 1 reaps build children); CMD `tail -f /dev/null` like upstream (long-lived container the control plane docker-execs into). multi-arch amd64+arm64 (native runners, no QEMU). 0-CVE Trivy gate (--ignore-unfixed CRITICAL..LOW) on the rootfs tar; trivy's gobinary analyzer reads the embedded Go module metadata of the from-source pack/railpack binaries so module CVEs are covered. Build workflow build-coolify-helper.yml includes cosign keyless sign + SPDX SBOM (anchore/sbom-action) + SLSA build-provenance (actions/attest-sbom@v2 + actions/attest-build-provenance@v2) with attestations:write. test.sh proves every bundled tool runs at its pinned version (docker/compose/buildx, pack/railpack/nixpacks/mise, mc, git/git-lfs/ssh), tini is PID 1, the entrypoint seeded /tmp/railpack/mise/mise-2026.3.17, and POSITIVELY asserts uid 0 (root is the required by-design posture for this tier).

  - name: coolify-app
    version: "4.1.2"
    source: https://github.com/coollabsio/coolify
    license: Apache-2.0
    tier: standard
    status: pilot # CORE/heaviest image of the Coolify multi-image wave (after coolify-realtime). Image-only component; ghcr.io/quenchworks/images/coolify-app. Coolify's core container is a PHP 8.4 / Laravel 12 + Livewire app with a Node 24 / Vite-built frontend, pinned at coolify tag v4.1.2 (commit e7dff30b7c998c301fd91bd169727b90c59ec291). Upstream builds FROM serversideup/php:8.4-fpm-nginx-alpine (php-fpm + nginx + s6-overlay wired together) + nginx.org/Alpine nginx + a vendored cloudflared/minio-client blob; we do NOT inherit that base (clean-room) -- the whole runtime is reconstructed from Wolfi packages. BUILD-METHOD: built FROM SOURCE on Wolfi via melange. (1) `composer install --no-dev --no-plugins --no-scripts --prefer-dist` against the committed composer.lock (Wolfi composer + php-8.4 + extensions). (2) Node 24 `npm ci && npm run build` (Vite) -> public/build (PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 keeps it hermetic; playwright is a dep whose postinstall fetches browsers). (3) assemble the upstream Dockerfile COPY tree (app/ bootstrap/ config/ database/ lang/ public/ routes/ storage/ templates/ resources/views/ artisan openapi.yaml changelogs/ composer.* + .env.production) + vendor/ + public/build/ under /var/www/html, then `composer dump-autoload --optimize --no-scripts`. SUPERVISOR CHOICE: supervisord (Wolfi-packaged, CVE-tracked), NOT s6-overlay -- s6-overlay (the s6-rc runtime: s6-svscan/s6-rc/with-contenv/execlineb -P + the /etc/s6-overlay/s6-rc.d layout) is NOT packaged in Wolfi (only the lower-level `s6`+`execline` libs are), and vendoring its release tarball would reintroduce an untracked binary blob the clean-room/0-CVE posture forbids. The 6 upstream s6 services are ported to supervisord programs: a single ordered bootstrap one-shot reproduces db-migration->init-seeder->init-script (artisan start:migration / start:seeder / app:init, gated on a PDO DB-reachability probe up to ~5min) + always-on php-fpm (:9000) and nginx (:8080), + long-running scheduler-worker (artisan schedule:work) and horizon (artisan horizon) that self-gate on SCHEDULER_ENABLED/HORIZON_ENABLED in .env exactly like the upstream run scripts (sleep infinity when disabled); nightwatch-agent is DISABLED by default (autostart=false, NIGHTWATCH_ENABLED=false). NGINX: QuenchWorks' own quench-nginx@local (built from source, NOT nginx.org/Alpine), built into ./packages first so apko resolves it alongside quench-coolify-app@local; site config ported from upstream http.conf (listen 8080, root /var/www/html/public, FastCGI .php + /healthcheck -> 127.0.0.1:9000). PHP-FPM: a zzz pool override drops the Wolfi pool's user/group=nobody (a nonroot master can't setuid workers), pins listen 127.0.0.1:9000, foreground + stderr logging. PHP EXTENSIONS (php-8.4-* + their -config companions): opcache, ctype, curl, dom, fileinfo, iconv, mbstring, openssl, pcntl, posix, simplexml, sodium, tokenizer, phar, xml, xmlreader, xmlwriter, pdo, pdo_pgsql, pgsql, redis, bcmath, gd, zip, intl, sockets (union of composer.lock ext-* + Coolify's runtime drivers: pdo_pgsql/pgsql for DB_CONNECTION=pgsql, phpredis for REDIS_CLIENT=phpredis queue/cache/horizon). RUNTIME tooling coolify shells out to: postgresql-18-client (backups), openssh-client (deploy to target hosts), git + git-lfs (git deploys); bash+busybox+ca-certificates-bundle. PORTS: 8080 nginx (http), 9000 php-fpm (loopback). nonroot uid/gid 9999 (www-data, matches upstream). READ-ONLY ROOTFS: writable carve-outs (tmpfs/emptyDir) are /var/www/html/storage (Laravel logs/sessions/framework cache/app+ssh keys), /var/www/html/bootstrap/cache (compiled config/route caches), /tmp (supervisord pid/sock + nginx pid/temp + php tmp), and .env -- shipped as a SYMLINK /var/www/html/.env -> /tmp/coolify.env so the entrypoint can seed it from .env.production while the rootfs stays read-only (a chart-mounted Secret .env overrides). 0-CVE Trivy gate (--ignore-unfixed CRITICAL..LOW) across the full PHP+Node+system surface. Build workflow build-coolify-app.yml builds quench-nginx + quench-coolify-app, runs the hard scan, then cosign keyless sign + SPDX SBOM (anchore/sbom-action) + SLSA build-provenance (actions/attest-sbom@v2 + actions/attest-build-provenance@v2) with attestations:write, dispatches charts. test.sh boots the image under a read-only rootfs (tmpfs /tmp + storage + bootstrap/cache, workers disabled), proves nginx :8080 + php-fpm :9000 wired (GET /healthcheck -> 200 "OK"), `php artisan --version` boots, extensions pdo_pgsql/pgsql/redis/bcmath/gd/intl/mbstring/pcntl loaded, Vite assets present (public/build/manifest.json), tooling ssh/git/git-lfs/psql/php-fpm/nginx/supervisord present, nonroot uid 9999.

  - name: meilisearch
    version: "1.46.1"
    source: https://github.com/meilisearch/meilisearch
    license: MIT
    tier: standard
