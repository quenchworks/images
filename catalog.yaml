    status: done # SERVER image + chart both shipped (chart AH 52dca231, all-in-one Deployment, bundled PG 0.0.5 w/ btree_gin + render-config initContainer for POD_IP, frontend gRPC SERVING, default namespace registered). Temporal: durable workflow execution engine / orchestration server. ONE Go binary (temporal-server) runs the frontend/history/matching/worker roles, selected at runtime by --service (or all-in-one). 0-CVE multi-arch (amd64+arm64), nonroot uid 1001, read-only rootfs friendly. BINARIES SHIPPED (built from source via melange, CGO_ENABLED=0, GOTOOLCHAIN=local, go-1.25 Wolfi toolchain [go.mod requires go 1.25.11], build tag disable_grpc_modules matching upstream Makefile, -trimpath -s -w): temporal-server (./cmd/server, the deliverable) + temporal-sql-tool (./cmd/tools/sql, Postgres/MySQL schema setup/upgrade tool -- REQUIRED so the chart's setup Job can create+migrate the DB schema) + temporal-cassandra-tool (./cmd/tools/cassandra, trivial extra). tdbg/admin tools skipped (not trivial). VERSION STAMP: NO ldflags needed -- the release version is hardcoded in source by upstream's create-tag workflow (common/headers/version_checker.go: ServerVersion = "1.29.7") and wired into the urfave/cli app.Version, so `temporal-server --version` and `temporal-sql-tool --version` both print 1.29.7. SOURCE: github tag tarball v1.29.7 (sha256 98fdd3fcfa1eec770df121af846a8d25af5fe1d77fa89b3f95bddf0246c3d7c3); no vendor/ dir so modules resolve from the Go proxy at build time (network, GOFLAGS=-mod=mod). NOT IN THIS IMAGE (separate upstream repos / future images): the Web UI -> temporalio/ui-server (SEPARATE image, future); the `temporal` CLI -> temporalio/cli (separate, skipped). SCHEMA FILES SHIPPED at /etc/temporal/schema/{postgresql,mysql,sqlite}; the chart's setup Job points temporal-sql-tool at the Postgres tree: /etc/temporal/schema/postgresql/v12/temporal (setup-schema -v 0.0 then update-schema -d .../temporal -> latest versioned/) and /etc/temporal/schema/postgresql/v12/visibility (update-schema -d .../visibility). Layout per dir: schema.sql + database.sql + versioned/v1.0..vN. DB-REQUIRED + CONFIG-FROM-CHART: Temporal needs a DB (PostgreSQL for QuenchWorks) and a config dir. The CHART supplies the real server config + dynamicconfig (a ConfigMap) and the Postgres DSN, and runs schema setup as a Job. The image ships the upstream config/ samples at /etc/temporal/config (incl. dynamicconfig/) so a SELF-CONTAINED standalone boot works: by default the thin entrypoint runs `temporal-server --root $TEMPORAL_ROOT(/etc/temporal) --config $TEMPORAL_CONFIG_DIR(config) --env $TEMPORAL_ENV(development-sqlite-file) start [--service $SERVICES,...]`. NOTE: --root/--config/--env are GLOBAL flags (BEFORE the `start` subcommand); --service flags come AFTER start; SERVICES env (comma-list) selects roles per pod (empty=all-in-one). The bundled development-sqlite-file config uses the pure-Go embedded sqlite store (modernc.org/sqlite, CGO-free) with setup:true (creates schema in-process), so the all-in-one server boots with NO external DB; its dynamicConfigClient.filepath was rewritten at build time from the upstream relative path to the absolute /etc/temporal/config/dynamicconfig/development-sql.yaml so the standalone boot is cwd-independent. The chart overrides all of this for a real Postgres deployment. ENTRYPOINT: /usr/bin/docker-entrypoint.sh (thin sh wrapper) -> exec /usr/bin/temporal-server. PORTS (advisory; the chart's config sets the actual binds): 7233 frontend gRPC, 7234 history, 7235 matching, 7239 worker, 7243 frontend HTTP API, 6933-6939 membership/ringpop, 8000 metrics (tally prometheus), 7936 pprof. READ-ONLY ROOTFS: in the Postgres deployment the server writes nothing to the rootfs (state lives in Postgres); needs writable /tmp. The standalone sqlite boot additionally needs a writable workdir for the sqlite file+WAL -- the chart mounts those as writable volumes/tmpfs. TRIVY 0-CVE (--ignore-unfixed): local image scan 0 findings (Wo