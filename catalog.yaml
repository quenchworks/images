    source: https://github.com/FerretDB/documentdb
    license: MIT
    tier: standard
    status: built # FerretDB v2 backend: PostgreSQL 17 + DocumentDB extension. From source: Intel decimal math, libbson, rum, PostGIS (no raster/gdal), documentdb core+main; PG17/pg_cron/pgvector from Wolfi. initdb entrypoint runs CREATE EXTENSION documentdb CASCADE.

  - name: documentdb
    version: "0.112.0"
    source: https://github.com/documentdb/documentdb
    license: MIT
    tier: standard
    status: done # image + chart both shipped. standalone MongoDB-compatible: PostgreSQL 17 + upstream documentdb extension + Rust pg_documentdb_gw gateway (MongoDB wire protocol, no FerretDB). From source: Intel decimal math, libbson, rum, PostGIS (no raster/gdal), documentdb core+main, gateway; PG17/pg_cron/pgvector from Wolfi. Entrypoint initdb's, CREATE EXTENSION documentdb CASCADE, documentdb_api.create_user, then runs the gateway on 10260. Published multi-arch 0-CVE: ghcr.io/quenchworks/images/documentdb:0.112.0@sha256:58fd6f04ceea4fab66a8e6b867a7a9bff5cefc41a634c7be1d06dc83f85c1652. Chart: charts/quench/documentdb (AH 8a88d701), gateway port 10260, SCRAM+TLS, released.

  # *** LICENSE WARNING: SSPL-1.0 is NOT OSI-approved (the OSI explicitly declined
  # it) — MongoDB Community Server is NOT open source. CAUTION. CLEAN ALTERNATIVES:
  # FerretDB + the standalone `documentdb` (both already shipped above) give a
  # MongoDB-WIRE-COMPATIBLE, TRULY-OPEN (Apache-2.0/PostgreSQL-licensed) answer —
  # PREFER THEM whenever license cleanliness matters. ***
  - name: mongodb
    version: "8.0.26"
    source: https://github.com/mongodb/mongo
    license: SSPL-1.0 # NOT OSI-approved; NOT open source. Clean alt: FerretDB + documentdb.
    tier: standard
    status: done # image + chart both shipped (AH 122e9823). *** SSPL-1.0 — NOT OSI-approved, NOT open source; OSI declined the SSPL. CAUTION. CLEAN ALTERNATIVE: FerretDB + standalone documentdb (MongoDB-wire compatible, Apache-2.0/PostgreSQL). *** 0-CVE multi-arch (amd64+arm64), nonroot 1001. Document database. BUILD-METHOD: ships MongoDB's OFFICIAL precompiled per-arch Community server tarball (mongodb-linux-<x86_64|aarch64>-ubuntu2204-8.0.26.tgz from fastdl.mongodb.org, sha256-verified against downloads.mongodb.org/full.json), NOT from-source -- the upstream build is an enormous C++/SCons job (clang, tens of GB RAM, hours), infeasible on a 2-core/7GB runner. The ubuntu2204 build targets a modern glibc that is binary-compatible with Wolfi. Same upstream-artifact pattern as clickhouse/scylladb/cockroachdb. The official ubuntu2204 mongod links ONLY libcurl.so.4 + libssl.so.3/libcrypto.so.3 (OpenSSL 3) + libresolv/libm/libgcc_s/libc + ld-linux (verified via readelf -d -- NO krb5/ldap/sasl/lzma/stdc++ direct NEEDED, simpler than feared); matched to Wolfi runtime pkgs glibc + libgcc + openssl + libcurl-openssl4 (apk solver satisfied). We ship mongod (server) ONLY (mongos dropped to stay lean) PLUS the SEPARATE mongosh shell tarball (mongosh-2.8.3-linux-<x64|arm64>.tgz, Apache-2.0 NOT SSPL) so the entrypoint can do the first-boot root-user auth bootstrap and so probes/tests have an in-image client; database tools (mongodump etc.) NOT shipped. TRIVY TRADEOFF: CVEs vendored inside the prebuilt mongod are not Trivy-fixable here (gate is --ignore-unfixed); the scannable surface is the Wolfi base (glibc/openssl/libcurl/libgcc/bash/busybox) which we keep 0-CVE (local scan: 0). Read-only rootfs: writable dbpath /data/db + log dir /data/log (MONGO_DATA_DIR/MONGO_LOG_DIR) on one /data tmpfs (exec); mongod's unix socket relocated off /tmp via --unixSocketPrefix=/data/log; HOME pointed at /data/log so the in-image mongosh's config dir is writable. AUTH BOOTSTRAP (mirrors official mongo image): MONGO_INITDB_ROOT_USERNAME + MONGO_INITDB_ROOT_PASSWORD -> on first boot (fresh dbpath) start mongod locally no-auth, create root user in admin db via mongosh, stop, restart with --auth; MONGO_INITDB_DATABASE optional initial db. If root env unset, runs WITHOUT auth (NetworkPolicy is the boundary; noted in logs). MongoDB wire protocol 27017. Probe: tcpSocket 27017 OR exec mongosh --eval 'db.runCommand({ping:1})' (mongosh IS in image). Verified: read-only rootfs, nonroot uid 1001, auth bootstrap, insertOne/findOne roundtrip ('quench'), ping ok, unauthenticated command rejected. Published multi-arch 0-CVE: ghcr.io/quenchworks/images/mongodb:8.0.26@sha256:a834166094c08e94dc52828cbf176ab432f2876e51ed838267df95ec5ab87169.

